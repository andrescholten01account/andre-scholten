hannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Neem waar dat het de maand Abib is, als u de HEERE, uw God, pascha viert; want in de maand Abib heeft de HEERE, uw God, u bij nacht uit Egypteland uitgevoerd.", "2": "Dan zult u de HEERE, uw God, het pascha slachten, schapen en runderen, in de plaats die de HEERE zal uitkiezen om Zijn Naam daar te doen wonen.", "3": "U zult daarbij niets eten van het gedesemd; zeven dagen zult u daarbij ongezuurde *broden* eten, brood van de ellende (want u bent in haast uit Egypteland getrokken), opdat u gedenkt aan de dag van uw uittrekken uit Egypteland, alle dagen van uw leven.", "4": "Er zal bij u in zeven dagen geen zuurdeeg gezien worden in heel uw gebied; ook zal van het vlees dat u aan de avond van de eerste dag geslacht hebt, niets tot de morgen overblijven.", "5": "U zult het pascha niet mogen slachten in een van uw poorten die de HEERE, uw God, u geeft.", "6": "Maar in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen, daar zult u het pascha slachten, aan de avond, als de zon ondergaat, op de vastgestelde tijd van uw uittrekken uit Egypte.", "7": "Dan zult u het koken en eten in de plaats die de HEERE, uw God, zal uitkiezen; daarna zult u zich 's morgens omkeren en teruggaan naar uw tenten.", "8": "Zes dagen zult u ongezuurde *broden* eten, en op de zevende dag is het een dag van het verbod voor de HEERE, uw God; dan zult u geen werk doen.", "9": "Zeven weken zult u tellen; vanaf het moment dat men met de sikkel begint in het staande koren, zult u de zeven weken beginnen te tellen.", "10": "Daarna zult u de HEERE, uw God, het feest van de weken houden; het zal een vrijwillige schatting van uw hand zijn, die u geven zult, naarmate de HEERE, uw God, u gezegend zal hebben.", "11": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is, en de vreemdeling, en de wees, en de weduwe die in uw midden zijn; in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen.", "12": "En u zult gedenken dat u een dienstknecht geweest bent in Egypte; en u zult deze inzettingen houden en doen.", "13": "Het feest van de loofhutten zult u zeven dagen houden, als u van uw dorsvloer en van uw wijnpers ingezameld hebt.", "14": "En u zult vrolijk zijn op uw feest, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet, en de vreemdeling, en de wees, en de weduwe, die in uw poorten zijn.", "15": "Zeven dagen zult u de HEERE, uw God, feest houden, in de plaats die de HEERE zal uitkiezen; want de HEERE, uw God, zal u zegenen in al uw inkomen, en in al het werk van uw handen; daarom zult u zeker vrolijk zijn.", "16": "Driemaal in het jaar zal alles wat mannelijk onder u is, verschijnen voor het aangezicht van de HEERE, uw God, in de plaats die Hij zal uitkiezen: op het feest van de ongezuurde *broden*, en op het feest van de weken, en op het feest van de loofhutten; maar men zal niet met lege handen verschijnen voor het aangezicht van de HEERE.", "17": "Ieder naar de gave van zijn hand, naar de zegen van de HEERE, uw God, die Hij u gegeven heeft.", "18": "Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen; opdat zij het volk richten met een rechtvaardig oordeel.", "19": "U zult het recht niet buigen; u zult niet partijdig zijn; ook zult u geen geschenk aannemen; want het geschenk verblindt de ogen van de wijzen, en verdraait de woorden van de rechtvaardigen.", "20": "Gerechtigheid, gerechtigheid zult u najagen; opdat u leeft, en het land erfelijk bezit dat de HEERE, uw God, u geven zal.", "21": "U zult voor uzelf geen bos planten van enig geboomte, bij het altaar van de HEERE, uw God, dat u voor uzelf maken zult.", "22": "Ook zult u voor uzelf geen opgericht beeld oprichten, dat de HEERE, uw God, haat."}, "SV": {"1": "Neemt waar de maand Abib, dat gij den HEERE, uw God, pascha houdt; want in de maand Abib heeft u de HEERE, uw God, uit Egypteland uitgevoerd, bij nacht.", "2": "Dan zult gij den HEERE, uw God, het pascha slachten, schapen en runderen, in de plaats, die de HEERE verkiezen zal, om Zijn Naam aldaar te doen wonen.", "3": "Gij zult niets gedesemds op hetzelve eten; zeven dagen zult gij ongezuurde *broden* op hetzelve eten, een brood der ellende, (want in der haast zijt gij uit Egypteland uitgetogen); opdat gij gedenkt aan den dag van uw uittrekken uit Egypteland, al de dagen uws levens.", "4": "Er zal bij u in zeven dagen geen zuurdeeg gezien worden in enige uwer landpalen; ook zal van het vlees, dat gij aan den avond van den eersten dag geslacht zult hebben, niets tot den morgen overnachten.", "5": "Gij zult het pascha niet mogen slachten in een uwer poorten, die de HEERE, uw God, u geeft.", "6": "Maar aan de plaats, die de HEERE, uw God, verkiezen zal om *daar* Zijn Naam te doen wonen, aldaar zult gij het pascha slachten aan den avond, als de zon ondergaat, ter bestemder tijd van uw uittrekken uit Egypte.", "7": "Dan zult gij het koken en eten in de plaats, die de HEERE, uw God, verkiezen zal; daarna zult gij u des morgens keren, en heengaan naar uw tenten.", "8": "Zes dagen zult gij ongezuurde *broden* eten, en aan den zevenden dag is een verbods *dag* den HEERE, uw God; *dan* zult gij geen werk doen.", "9": "Zeven weken zult gij u tellen; van dat men *met* de sikkel begint in het staande koren, zult gij de zeven weken beginnen te tellen.", "10": "Daarna zult gij den HEERE, uw God, het feest der weken houden; het zal een vrijwillige schatting uwer hand zijn, dat gij geven zult, naardat u de HEERE, uw God, zal gezegend hebben.", "11": "En gij zult vrolijk zijn voor het aangezicht des HEEREN, uws Gods, gij, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet, die in uw poorten is, en de vreemdeling, en de wees, en de weduwe, die in het midden van u zijn; in de plaats, die de HEERE, uw God, zal verkiezen, om Zijnen Naam aldaar te doen wonen.", "12": "En gij zult gedenken, dat gij een dienstknecht geweest zijt in Egypte; en gij zult deze inzettingen houden en doen.", "13": "Het feest der loofhutten zult gij u zeven dagen houden, als gij zult hebben ingezameld van uw dorsvloer en van uw wijnpers.", "14": "En gij zult vrolijk zijn op uw feest, gij, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet, en de vreemdeling, en de wees, en de weduwe, die in uw poorten zijn.", "15": "Zeven dagen zult gij den HEERE, uw God, feest houden, in de plaats, die de HEERE verkiezen zal; want de HEERE, uw God, zal u zegenen in al uw inkomen, en in al het werk uwer handen; daarom zult gij immers vrolijk zijn.", "16": "Driemaal in het jaar zal alles, wat mannelijk onder u is, voor het aangezicht des HEEREN, uws Gods, verschijnen, in de plaats, die Hij verkiezen zal: op het feest der ongezuurde *broden*, en op het feest der weken, en op het feest der loofhutten; maar het zal niet ledig voor het aangezicht des HEEREN verschijnen:", "17": "Een ieder, naar de gave zijner hand, naar den zegen des HEEREN, uws Gods, dien Hij u gegeven heeft.", "18": "Rechters en ambtlieden zult gij u stellen in al uw poorten, die de HEERE, uw God, u geven zal, onder uw stammen; dat zij het volk richten met een gericht der gerechtigheid.", "19": "Gij zult het gericht niet buigen; gij zult het aangezicht niet kennen; ook zult gij geen geschenk nemen; want het geschenk verblindt de ogen der wijzen, en verkeert de woorden der rechtvaardigen.", "20": "Gerechtigheid, gerechtigheid zult gij najagen; opdat gij leeft, en erfelijk bezit het land, dat u de HEERE, uw God, geven zal.", "21": "Gij zult u geen bos planten van enig geboomte, bij het altaar des HEEREN, uws Gods, dat gij u maken zult.", "22": "Ook zult gij u geen opgericht beeld stellen, hetwelk de HEERE, uw God, haat."}, "KJV": {"1": "Observe the month of Abib, and keep the passover unto the LORD thy God: for in the month of Abib the LORD thy God brought thee forth out of Egypt by night.", "2": "Thou shalt therefore sacrifice the passover unto the LORD thy God, of the flock and the herd, in the place which the LORD shall choose to place his name", "3": "Thou shalt eat no leavened bread with it; seven days shalt thou eat unleavened bread therewith, *even* the bread of affliction; for thou camest forth out of the land of Egypt in haste: that thou mayest remember the day when thou camest forth out of the land of Egypt all the days of thy life.", "4": "And there shall be no leavened bread seen with thee in all thy coast seven days; neither shall there *any thing* of the flesh, which thou sacrificedst the first day at even, remain all night until the morning.", "5": "Thou mayest not sacrifice the passover within any of thy gates, which the LORD thy God giveth", "6": "But at the place which the LORD thy God shall choose to place his name in, there thou shalt sacrifice the passover at even, at the going down of the sun, at the season that thou camest forth out of Egypt.", "7": "And thou shalt roast and eat *it* in the place which the LORD thy God shall choose: and thou shalt turn in the morning, and go unto thy tents.", "8": "Six days thou shalt eat unleavened bread: and on the seventh day *shall be* a solemn assembly to the LORD thy God: thou shalt do no work", "9": "Seven weeks shalt thou number unto thee: begin to number the seven weeks from *such time as* thou beginnest *to put* the sickle to the corn.", "10": "And thou shalt keep the feast of weeks unto the LORD thy God with a tribute of a freewill offering of thine hand, which thou shalt give *unto the LORD thy God*, according as the LORD thy God hath blessed", "11": "And thou shalt rejoice before the LORD thy God, thou, and thy son, and thy daughter, and thy manservant, and thy maidservant, and the Levite that *is* within thy gates, and the stranger, and the fatherless, and the widow, that *are* among you, in the place which the LORD thy God hath chosen to place his name", "12": "And thou shalt remember that thou wast a bondman in Egypt: and thou shalt observe and do these statutes.", "13": "Thou shalt observe the feast of tabernacles seven days, after that thou hast gathered in thy corn and thy wine:", "14": "And thou shalt rejoice in thy feast, thou, and thy son, and thy daughter, and thy manservant, and thy maidservant, and the Levite, the stranger, and the fatherless, and the widow, that *are* within thy gates.", "15": "Seven days shalt thou keep a solemn feast unto the LORD thy God in the place which the LORD shall choose: because the LORD thy God shall bless thee in all thine increase, and in all the works of thine hands, therefore thou shalt surely rejoice.", "16": "Three times in a year shall all thy males appear before the LORD thy God in the place which he shall choose; in the feast of unleavened bread, and in the feast of weeks, and in the feast of tabernacles: and they shall not appear before the LORD empty:", "17": "Every man *shall give* as he is able, according to the blessing of the LORD thy God which he hath given", "18": "Judges and officers shalt thou make thee in all thy gates, which the LORD thy God giveth thee, throughout thy tribes: and they shall judge the people with just judgment.", "19": "Thou shalt not wrest judgment; thou shalt not respect persons, neither take a gift: for a gift doth blind the eyes of the wise, and pervert the words of the righteous.", "20": "That which is altogether just shalt thou follow, that thou mayest live, and inherit the land which the LORD thy God giveth", "21": "Thou shalt not plant thee a grove of any trees near unto the altar of the LORD thy God, which thou shalt make", "22": "Neither shalt thou set thee up *any* image; which the LORD thy God hateth."}}, "tsk": {"1": [{"kopje": "de maand", "refs": ["Ex 12:2-20", "Ex 34:18", "Lev 23:5", "Num 9:2-5", ": "Openb 22:15", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Idolatry", "href": "../../torrey/i/#t-idolatry", "kinderen": [{"label": "Described As", "href": "../../torrey/i/?hl=Deut.16.22#i9663", "refs": [], "kinderen": [{"label": "Hateful to God", "href": "../../torrey/i/?hl=Deut.16.22#i9665", "refs": [{"disp": "Deut 16:22", "href": "../../deuteronomium/16/#v22", "ref": "Deut 16:22", "svLabel": null}, {"disp": "Jer 44:4", "href": "../../jeremia/44/#v4", "ref": "Jer 44:4", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Hebr 9:14": "hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "Rom 14:22": "Hebt u geloof? Houd dat bij uzelf voor God. Zalig is hij die zichzelf niet oordeelt in wat hij voor goed houdt.", "Num 9:3": "Op de veertiende dag in deze maand, tussen twee avonden, zult u dat houden, op zijn vastgestelde tijd; naar al zijn inzettingen, en naar al zijn rechten zult u dat houden.", "Ex 12:19": "Zeven dagen lang mag er geen zuurdeeg in uw huizen gevonden worden, want wie het gedesemde eet, die ziel zal uit de vergadering van Israël uitgeroeid worden, of hij nu een vreemdeling is of een ingeborene van het land.", "Ex 13:12": "dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn.", "Luk 6:38": "Geef, en u zal gegeven worden; een goede, ingedrukte, geschudde en overlopende maat zal men in uw schoot geven; want met dezelfde maat waarmee u meet, zal u weer gemeten worden.", "Deut 1:12-17": "Hoe zou ik alleen uw moeite, en uw last, en uw geschillen dragen? Neem voor u wijze, verstandige en ervaren mannen, uit uw stammen, zodat ik hen tot uw hoofden stel. Toen antwoordde u mij, en zei: Dit woord dat u gesproken hebt, is goed om te doen.", "Deut 4:15-23": "Let dan goed op uzelf; want u hebt geen gelijkenis gezien, op de dag dat de HEERE op Horeb uit het midden van het vuur tot u sprak; Opdat u zich niet te gronde richt, en u iets gesnedens maakt, de gelijkenis van enig beeld, de gedaante van een man of een vrouw, De gedaante van enig beest dat op de aarde is; de gedaante van een gevleugelde vogel, die door de hemel vliegt;", "Spr 4:25-27": "Laat uw ogen recht vooruit zien, en uw oogleden zich recht voor u heen richten. Weeg de gang van uw voet, en laat al uw wegen vast staan. Wijk niet naar rechts of naar links, wend uw voet af van het kwade.", "Ex 16:32": "Verder zei Mozes: Dit is het woord dat de HEERE geboden heeft: Vul een gomer daarvan tot bewaring voor uw geslachten, opdat zij het brood zien dat Ik u te eten gegeven heb in deze woestijn, toen Ik u uit Egypte leidde.", "Spr 20:8": "Een koning, die op de troon van het gericht zit, verstrooit alle kwaad met zijn ogen.", "Luk 3:10": "En de menigten vroegen hem: Wat zullen wij dan doen?", "Ex 34:25": "U zult het bloed van Mijn slachtoffer niet offeren met gedesemd brood; het slachtoffer van het paasfeest zal ook niet overnachten tot de morgen.", "1 Sam 8:1": "Het gebeurde nu, toen Samuël oud geworden was, dat hij zijn zonen tot richters over Israël aanstelde.", "Ps 26:1-3": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen. Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart. Want Uw goedertierenheid is voor mijn ogen, en ik wandel in Uw waarheid.", "Luk 16:9": "En Ik zeg u: Maak uzelf vrienden uit de onrechtvaardige Mammon, opdat, wanneer het u ontbreken zal, zij u mogen ontvangen in de eeuwige tenten.", "Zef 3:3-5": "Haar vorsten zijn brullende leeuwen in haar midden; haar rechters zijn avondwolven, die de beenderen niet breken tot aan de morgen. Haar profeten zijn lichtvaardig, geheel trouweloze mannen; haar priesters verontreinigen het heilige, zij doen de wet geweld aan. De rechtvaardige HEERE is in haar midden, Hij doet geen onrecht; elke morgen geeft Hij Zijn recht in het licht, het ontbreekt niet; maar de verkeerde weet van geen schaamte.", "Lev 23:6": "En op de vijftiende dag van diezelfde maand is het feest van de ongezuurde broden van de HEERE; zeven dagen zult u ongezuurde broden eten.", "Spr 21:14": "Een gift in het verborgene houdt de toorn onder, en een geschenk in de schoot de sterke woede.", "Deut 12:18": "Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt.", "2 Kron 35:1": "Daarna hield Josia het pascha voor de HEERE te Jeruzalem; en zij slachtten het pascha op de veertiende dag van de eerste maand.", "Ex 23:7": "Blijf ver van valse zaken; en de onschuldige en rechtvaardige zult u niet doden; want Ik zal de goddeloze niet rechtvaardigen.", "Spr 29:14": "Een koning die de armen in trouw recht doet, diens troon zal voor eeuwig bevestigd worden.", "Deut 1:17": "U zult in het gericht niemand voortrekken; u zult de kleine, evenals de grote, horen; u zult voor niemands aangezicht bang zijn; want het gericht is van God; maar de zaak die voor u te zwaar zal zijn, zult u naar mij laten komen, en ik zal die horen.", "Num 28:17": "En op de vijftiende dag van die maand is het feest; zeven dagen zullen ongezuurde broden gegeten worden.", "Ps 72:1-17": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning. Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht. De bergen zullen aan het volk vrede dragen, ook de heuvels, met gerechtigheid.", "Spr 22:27": "Als u niets hebt om te betalen, waarom zou men uw bed van onder u wegnemen?", "Ps 119:121": "Ain. Ik heb recht en gerechtigheid gedaan; geef mij niet over aan mijn onderdrukkers.", "Deut 22:15": "Dan zullen de vader van deze jonge dochter en haar moeder haar meenemen, en naar de oudsten van de stad brengen, bij de poort, met het bewijs van de maagdelijkheid van deze jonge vrouw.", "Rom 10:5": "Want Mozes beschrijft de rechtvaardigheid die uit de wet is, en zegt: De mens die deze dingen doet, zal daardoor leven.", "Matt 26:20": "En toen het avond geworden was, zat Hij aan met de twaalf.", "Matt 27:46": "En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Jes 60:9": "Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft.", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Job 29:12": "Want ik bevrijdde de ellendige die riep, en de wees die geen helper had.", "Ezech 36:38": "Zoals de geheiligde schapen, zoals de schapen van Jeruzalem op hun vastgestelde feesttijden, zo zullen de eenzame steden vol zijn van mensenkudden; en zij zullen weten dat Ik de HEERE ben.", "2 Kron 9:8": "Geloofd zij de HEERE, uw God, Die behagen in u gehad heeft, om u op Zijn troon te zetten, tot een koning voor de HEERE, uw God; omdat uw God Israël liefheeft, om het voor eeuwig op te richten, daarom heeft Hij u tot koning over hen gesteld, om recht en gerechtigheid te doen.", "Jes 45:16": "Zij zullen beschaamd worden en ook tot schande worden, zij allen; samen zullen zij met schande heengaan, zij die de afgoden maken.", "Ex 35:4-29": "Verder sprak Mozes tot de hele vergadering van de kinderen van Israël en zei: Dit is het woord, dat de HEERE geboden heeft: Neemt van hetgeen dat u hebt, een hefoffer voor de HEERE; ieder wiens hart vrijwillig is, zal het brengen als hefoffer voor de HEERE: goud, en zilver, en koper; Als ook hemelsblauw, en purper, en scharlaken, en fijn linnen, en geitenhaar;", "Ef 5:20": "en dank altijd voor alle dingen God en de Vader, in de Naam van onze Heere Jezus Christus,", "Deut 24:19-22": "Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen. Wanneer u uw olijfboom geschud hebt, zult u de takken daarna niet nauwkeurig doorzoeken; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn. Wanneer u uw wijngaard hebt afgeplukt, zult u de druiven daarna niet nalezen; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn.", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "Ex 13:6": "Zeven dagen moet u ongezuurde broden eten, en op de zevende dag zal er een feest zijn voor de HEERE.", "Ex 12:17": "Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.", "Luk 3:11": "En hij antwoordde en zei tegen hen: Wie twee stukken kleding heeft, moet delen met wie er geen heeft; en wie voedsel heeft, moet hetzelfde doen.", "Ps 50:14": "Offert God dank, en betaalt de Allerhoogste uw geloften.", "Ex 12:26": "En het zal gebeuren, wanneer uw kinderen tegen u zullen zeggen: Wat betekent deze dienst voor u?", "Ezech 44:24": "En bij een rechtszaak zullen zij staan om te oordelen; naar Mijn rechten zullen zij hen oordelen; en zij zullen Mijn wetten en Mijn inzettingen op al Mijn vastgestelde hoogtijden houden, en Mijn sabbatten heiligen.", "Jes 5:23": "Die de goddeloze rechtvaardigen om een geschenk, en de gerechtigheid van de rechtvaardigen van hen afwenden.", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Deut 24:16": "De vaders zullen niet gedood worden voor de kinderen, en de kinderen zullen niet gedood worden voor de vaders; ieder zal om zijn eigen zonde gedood worden.", "Spr 11:1": "Een bedrieglijke weegschaal is de HEERE een gruwel; maar een volkomen weegsteen is Zijn welgevallen.", "Ps 7:9": "De HEERE zal de volken recht doen; doe mij recht, HEERE, naar mijn gerechtigheid, en naar mijn oprechtheid, die bij mij is.", "Ex 12:8": "En zij zullen het vlees eten in dezelfde nacht, gebraden aan het vuur, met ongezuurde broden; met bittere kruiden zullen zij het eten.", "Kol 3:23": "En alles wat u doet, doe dat van harte, als voor de Heere en niet voor de mensen;", "Neh 8:19": "En men las uit het wetboek van God, dag na dag, van de eerste dag tot de laatste dag. En zij vierden het feest zeven dagen, en op de achtste dag hielden zij een verbodsdag, naar het voorschrift.", "1 Tim 4:3-5": "die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen. Want alles wat God geschapen heeft, is goed, en niets is verwerpelijk als het met dankzegging aangenomen wordt; want het wordt geheiligd door het Woord van God en door het gebed.", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "1 Joh 3:18": "Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid.", "Pred 8:4": "Waar het woord van de koning is, daar is macht; en wie zal tegen hem zeggen: Wat doet u?", "1 Kor 16:2": "Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.", "Ps 102:10": "Want ik eet as als brood, en vermeng mijn drank met tranen.", "Ex 23:8": "Ook zult u geen geschenk aannemen; want het geschenk verblindt de zienden, en het verdraait de zaak van de rechtvaardigen.", "Deut 12:31": "Zo zult u niet doen voor de HEERE, uw God; want alles wat de HEERE een gruwel is, dat Hij haat, hebben zij voor hun goden gedaan; want zij hebben zelfs hun zonen en hun dochters met vuur verbrand voor hun goden.", "Deut 26:13": "En u zult voor het aangezicht van de HEERE, uw God, zeggen: Ik heb het heilige uit het huis weggenomen, en heb het ook aan de Leviet en aan de vreemdeling, aan de wees en aan de weduwe gegeven, naar al Uw geboden die U mij geboden hebt; ik heb niets van Uw geboden overtreden, en niets vergeten.", "Ps 2:10": "Nu dan, koningen, handelt verstandig; laat u onderwijzen, rechters van de aarde!", "Spr 11:7": "Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Deut 21:2": "Dan zullen uw oudsten en uw rechters uitgaan, en zij zullen meten naar de steden die rondom de gedode liggen.", "2 Kon 17:36": "Maar de HEERE, Die u uit het land Egypte met grote kracht en met een uitgestrekte arm opgevoerd heeft, Hem zult u vrezen, en voor Hem zult u zich buigen, en Hem zult u offers brengen;", "Job 16:16": "Mijn gezicht is helemaal bemodderd van het wenen, en op mijn oogleden ligt de schaduw van de dood.", "Matt 5:42": "Geef aan hem die iets van u vraagt, en keer u niet af van hem die van u wil lenen.", "Deut 17:12": "De man nu die trots handelt door niet te luisteren naar de priester die daar staat om de HEERE, uw God, te dienen, of naar de rechter, die man zal sterven; en u moet het kwaad uit Israël wegdoen.", "2 Kron 15:18": "En hij bracht in het huis van God de geheiligde dingen van zijn vader, en zijn eigen geheiligde dingen, zilver en goud, en voorwerpen.", "Lev 19:5": "En wanneer u een dankoffer de HEERE offeren zult, naar uw welgevallen zult u dat offeren.", "Ps 82:2": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Lev 12:8": "Maar als haar hand niet genoeg vindt voor een lam, zal zij twee tortelduiven of twee jonge duiven nemen, één als brandoffer en één als zondoffer; en de priester zal voor haar verzoening doen; zo zal zij rein zijn.", "Hand 10:34": "En Petrus opende zijn mond en zei: Ik merk in waarheid dat God niet iemand aanneemt op grond van het persoon;", "Spr 28:8": "Wie zijn bezit vermeerdert met woeker en met overwinst, verzamelt dat voor hem die zich over de arme ontfermt.", "Deut 1:16": "En ik gebood in die tijd uw rechters, en zei: Hoor de geschillen tussen uw broeders, en oordeel rechtvaardig tussen de man en zijn broeder, en zijn vreemdeling.", "Ps 24:3-5": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Ex 21:6": "dan zal zijn heer hem bij de rechters brengen, daarna zal hij hem bij de deur of bij de deurpost brengen; en zijn heer zal met een priem zijn oor doorboren, en hij zal hem voor altijd dienen.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "2 Kor 9:7": "Ieder doe zoals hij in zijn hart voorneemt; niet uit droefheid of uit dwang; want God heeft een blijmoedige gever lief.", "Spr 19:17": "Die zich ontfermt over de arme, leent aan de HEERE, en Hij zal hem zijn weldaad vergelden.", "Ps 99:5": "Verhef de HEERE, onze God, en buig u neer voor de voetbank van Zijn voeten; Hij is heilig!", "1 Kron 26:29": "Van de Jizharieten waren Chenanja en zijn zonen belast met het buitenwerk in Israël, als opzichters en als rechters.", "Deut 29:11": "Uw kinderen, uw vrouwen, en uw vreemdeling, die in het midden van uw kamp is, van uw houthakker tot uw waterputter toe;", "Deut 16:5-7": "U zult het pascha niet mogen slachten in een van uw poorten die de HEERE, uw God, u geeft. Maar in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen, daar zult u het pascha slachten, aan de avond, als de zon ondergaat, op de vastgestelde tijd van uw uittrekken uit Egypte. Dan zult u het koken en eten in de plaats die de HEERE, uw God, zal uitkiezen; daarna zult u zich 's morgens omkeren en teruggaan naar uw tenten.", "Luk 2:44": "Maar zij dachten dat Hij bij het reisgezelschap was, en gingen een dagreis, en zochten Hem onder de familie en onder de bekenden.", "Ps 7:4": "HEERE, mijn God, als ik dat gedaan heb, als er onrecht in mijn handen is;", "Deut 17:9": "En u moet komen bij de Levitische priesters en bij de rechter die er in die dagen is; en u moet vragen, en zij zullen u de rechterlijke uitspraak bekendmaken.", "Jes 56:1": "Zo zegt de HEERE: Bewaar het recht en doe gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.", "Luk 3:13": "En hij zei tegen hen: Eis niet meer dan wat u opgelegd is.", "Zach 8:17": "En denk niet, de een over de ander, kwaad in uw hart; en heb een valse eed niet lief; want al deze dingen zijn wat Ik haat, spreekt de HEERE.", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Richt 5:11": "Van het gedruis van de schutters, tussen de plaatsen waar men water schept, spreekt men daar samen van de gerechtigheid van de HEERE, van de gerechtigheden, bewezen aan Zijn dorpen in Israël; toen ging het volk van de HEERE af naar de poorten.", "Luk 22:19": "En Hij nam brood, en toen Hij gedankt had, brak Hij het en gaf het hun, en zei: Dat is Mijn lichaam, dat voor u gegeven wordt; doe dat tot Mijn gedachtenis.", "Zach 14:16-18": "En het zal gebeuren, dat allen die overgebleven zijn van alle heidenen die tegen Jeruzalem gekomen zullen zijn, van jaar tot jaar zullen optrekken om de Koning, de HEERE van de heerscharen, te aanbidden, en om het feest van de loofhutten te vieren. En het zal gebeuren: wie van de geslachten van de aarde niet naar Jeruzalem zal optrekken om de Koning, de HEERE van de heerscharen, te aanbidden, over hen zal geen regen zijn. En als het geslacht van de Egyptenaren, over wie de regen niet is, niet zal optrekken en niet zal komen, dan zal die plaag over hen zijn, waarmee de HEERE de heidenen plagen zal die niet optrekken zullen om het feest van de loofhutten te vieren.", "Deut 25:1": "Wanneer er tussen mannen twist is, en zij naar het gerecht gaan zodat men hen recht spreekt, dan zal men de rechtvaardige rechtvaardig verklaren, en de onrechtvaardige veroordelen.", "Deut 4:25-28": "Wanneer u nu kinderen en kleinkinderen verwekt hebt, en oud geworden bent in het land, en u zich te gronde richt door gesneden beelden te maken, de gelijkenis van iets, en door te doen wat kwaad is in de ogen van de HEERE, uw God, om Hem tot toorn te verwekken; Dan roep ik vandaag de hemel en de aarde tot getuige tegen u, dat u zeker snel zult omkomen uit het land waar u de Jordaan voor oversteekt om het in bezit te nemen; u zult uw dagen daarin niet verlengen, maar helemaal uitgeroeid worden. En de HEERE zal u verstrooien onder de volken; en u zult met weinigen in getal overblijven onder de heidenvolken waarheen de HEERE u zal leiden.", "Openb 22:11": "Die onrecht doet, laat hij nog onrecht doen; en die vuil is, laat hij nog vuil worden; en die rechtvaardig is, laat hij nog gerechtvaardigd worden; en die heilig is, laat hij nog geheiligd worden.", "Ex 22:9": "Bij elke zaak van onrecht, of het nu gaat om een os, een ezel, klein vee, kleding, of om iets verlorens waarvan iemand zegt dat het van hem is, zal de zaak van beide partijen voor de rechters komen; wie de rechters schuldig verklaren, die moet het aan zijn naaste dubbel teruggeven.", "Ps 58:2": "Spreekt u werkelijk gerechtigheid, gij vergadering? Oordeelt u wat recht is, mensenkinderen?", "Num 31:28": "Daarna moet u een schatting voor de HEERE heffen, van de oorlogslieden die tot deze strijd uitgetrokken zijn: één ziel van elke vijfhonderd, uit de mensen en uit de runderen, en uit de ezels, en uit de schapen.", "Hagg 1:8": "Klim het gebergte op, breng hout aan, en bouw dit huis, en Ik zal er welgevallen aan hebben en verheerlijkt worden, zegt de HEERE.", "Ex 13:14-16": "Wanneer het zal gebeuren dat uw zoon u later zal vragen en zegt: Wat is dat, dan moet u tegen hem zeggen: De HEERE heeft ons door een sterke hand uit Egypte, uit het diensthuis, uitgevoerd. Want het gebeurde, toen de farao zich verhardde om ons te laten gaan, dat de HEERE alle eerstgeborenen in Egypteland doodde, van de eerstgeborene van de mens af tot de eerstgeborene van het vee; daarom offer ik aan de HEERE de mannetjes van alles wat de baarmoeder opent; maar alle eerstgeborenen van mijn zonen koop ik vrij. En het zal tot een teken zijn op uw hand, en tot voorhoofdsbanden tussen uw ogen; want de HEERE heeft ons door een sterke hand uit Egypte uitgevoerd.", "Lev 19:15": "U zult geen onrecht doen in het gericht; u zult het aangezicht van de geringe niet aannemen, noch het aangezicht van de grote voortrekken; in gerechtigheid zult u uw naaste rechtspreken.", "Lev 23:40": "En op de eerste dag zult u voor uzelf nemen takken van schoon geboomte, palmtakken, en takken van dichte bomen, met beekwilgen; en u zult voor het aangezicht van de HEERE, uw God, zeven dagen vrolijk zijn.", "Spr 24:23": "Ook deze spreuken zijn van de wijzen. Het aanzien van personen in het gericht kennen, is niet goed.", "Spr 17:15": "Wie de goddeloze rechtvaardigt, en de rechtvaardige veroordeelt, zijn de HEERE een gruwel, zij beiden.", "1 Tess 4:11": "En dat u zich beijvert om stil te zijn, en uw eigen zaken te doen, en te werken met uw eigen handen, zoals wij u bevolen hebben;", "Luk 22:8": "En Hij zond Petrus en Johannes uit, en zei: Ga heen, en bereid voor ons het pascha, zodat wij het kunnen eten.", "Kol 1:12": "terwijl u de Vader dankt, Die ons bekwaam gemaakt heeft om deel te hebben aan de erfenis van de heiligen in het licht;", "Deut 26:11": "en u zult vrolijk zijn over al het goede dat de HEERE, uw God, aan u en uw huis gegeven heeft; u, en de Leviet, en de vreemdeling die in uw midden is.", "1 Tess 4:7": "Want God heeft ons niet geroepen tot onreinheid, maar tot heiliging.", "Deut 1:13": "Neem voor u wijze, verstandige en ervaren mannen, uit uw stammen, zodat ik hen tot uw hoofden stel.", "Ex 12:5-7": "U moet een volkomen lam hebben, een mannetje, een jaar oud; van de schapen of van de geitenbokken moet u het nemen. En u moet het bewaren tot de veertiende dag van deze maand; en de hele gemeente van de vergadering van Israël zal het slachten tussen de twee avonden. En zij zullen van het bloed nemen, en het strijken aan de beide zijposten en aan de bovendorpel, aan de huizen waarin zij het zullen eten.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Hab 1:16": "Daarom offert hij aan zijn sleepnet, en brandt reukwerk aan zijn net; want daardoor is zijn deel vet geworden, en zijn voedsel smoutig.", "Spr 18:17": "Wie het eerst zijn zaak bepleit, lijkt rechtvaardig; maar zijn naaste komt, en die onderzoekt hem.", "Ps 76:12": "Doe geloften en betaal ze de HEERE, uw God, u allen, die rondom Hem zijn! Laat men Hem, Die te vrezen is, geschenken brengen;", "Spr 18:16": "Het geschenk van een mens maakt hem ruimte, en het brengt hem voor het aangezicht van de groten.", "Amos 5:11": "Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken.", "1 Petr 2:14": "Hetzij aan de stadhouders, als aan hen die door hem gezonden worden, tot straf van de kwaaddoeners, maar tot lof van hen die goeddoen.", "Deut 14:29": "Zo zal de Leviet komen – omdat hij geen deel noch erfdeel met u heeft – en de vreemdeling, en de wees en de weduwe die in uw poorten zijn, en zij zullen eten en verzadigd worden; opdat de HEERE, uw God, u zegent in al het werk van uw hand, dat u doen zult.", "Jes 60:6-9": "Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen. Al de schapen van Kedar zullen tot u verzameld worden; de rammen van Nebajoth zullen u dienen; zij zullen met welgevallen op Mijn altaar komen, en Ik zal het huis van Mijn heerlijkheid heerlijk maken. Wie zijn deze, die daar komen aangevlogen als een wolk, en als duiven naar hun vensters?", "Ex 23:13": "In alles wat Ik tegen u gezegd heb, zult u op uw hoede zijn; en de naam van andere goden zult u niet noemen; uit uw mond zal hij niet gehoord worden!", "2 Kron 19:5-7": "En hij stelde rechters aan in het land, in alle versterkte steden van Juda, van stad tot stad. En hij zei tegen de rechters: Kijk uit wat u doet, want u spreekt geen recht voor de mens, maar voor de HEERE; en Hij is bij u in de rechtszaak. Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "Rom 14:5": "De één acht de ene dag boven de andere dag; maar de ander acht alle dagen gelijk. Laat ieder in zijn eigen gemoed ten volle overtuigd zijn.", "Ezech 22:7": "Vader en moeder hebben zij in u licht geacht; met de vreemdeling hebben zij in uw midden door verdrukking gehandeld; zij hebben in u de wees en de weduwe verdrukt.", "Job 22:9": "De weduwen hebt u met lege handen weggezonden, en de armen van de wezen zijn verbrijzeld.", "Spr 20:23": "Tweeërlei weegsteen is de HEERE een gruwel, en de bedrieglijke weegschaal is niet goed.", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "Jer 44:4": "En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg opstaand en zendend, om te zeggen: Doe toch deze gruwelijke zaak niet, die Ik haat.", "Ex 12:42": "Deze nacht zal men de HEERE zeer nauwgezet houden, omdat Hij hen uit Egypteland geleid heeft; deze is de nacht van de HEERE, die zeer nauwgezet gehouden moet worden, door alle kinderen van Israël, onder hun geslachten.", "Zef 3:5": "De rechtvaardige HEERE is in haar midden, Hij doet geen onrecht; elke morgen geeft Hij Zijn recht in het licht, het ontbreekt niet; maar de verkeerde weet van geen schaamte.", "2 Kor 8:7-9": "Zo dan, zoals u in alles overvloedig bent, in geloof, en in woord, en in kennis, en in alle naarstigheid, en in uw liefde tot ons, zorg ervoor, dat u ook in deze gave overvloedig bent. Ik zeg dit niet als een gebod, maar om door de naarstigheid van anderen ook de oprechtheid van uw liefde te beproeven. Want u kent de genade van onze Heere Jezus Christus, dat Hij om uwentwil arm geworden is, terwijl Hij rijk was, opdat u door Zijn armoede rijk zou worden.", "Job 31:22": "Mijn schouder valt van het schouderbeen, en mijn arm breekt van zijn pijp af!", "Spr 31:20": "Caph. Zij breidt haar handpalm uit naar de ellendige; en zij steekt haar handen uit naar de arme.", "Ps 72:4": "Hij zal de ellendigen van het volk richten; hij zal de kinderen van de behoeftige verlossen, en de verdrukker verbrijzelen.", "Spr 15:21": "De dwaasheid is voor de verstandeloze een blijdschap; maar een man van verstand gaat recht zijn weg.", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "2 Kron 15:7": "Daarom, wees u sterk, en laat uw handen niet verslappen; want er is loon naar uw werk.", "Jes 1:23": "Uw vorsten zijn afvalligen, en metgezellen van dieven, ieder van hen heeft geschenken lief, en zij jagen de vergeldingen na; de wezen doen zij geen recht, en de rechtszaak van de weduwen komt voor hen niet.", "Ef 6:6": "niet uit ogendienst, als mensenbehagers, maar als dienstknechten van Christus, terwijl u de wil van God doet van harte;", "Spr 29:27": "Een onrechtvaardig man is voor de rechtvaardige een gruwel; maar wie recht van weg is, is voor de goddeloze een gruwel.", "Deut 11:16": "Wacht uzelf, dat uw hart niet verleid wordt, dat u afwijkt, en andere goden dient, en u voor die buigt;", "Ps 122:4": "waarheen de stammen opgaan, de stammen van de HEERE, tot de getuigenis van Israël, om de Naam van de HEERE te danken.", "Mal 3:5": "En Ik zal tot u naderen ten oordeel; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen hen die vals zweren, en tegen hen die het loon van de dagloner met geweld inhouden, die de weduwe, en de wees, en de vreemdeling het recht verdraaien, en Mij niet vrezen, zegt de HEERE van de heerscharen.", "1 Kor 7:9": "Maar als zij zich niet kunnen onthouden, laten zij trouwen; want het is beter te trouwen dan van begeerte te branden.", "2 Kron 5:3": "En alle mannen van Israël verzamelden zich bij de koning op het feest, dat in de zevende maand was.", "Jes 28:5": "Op die dag zal de HEERE van de heerscharen tot een heerlijke kroon en tot een sierlijke krans zijn voor het overblijfsel van Zijn volk;", "Deut 25:5-10": "Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen. En het zal gebeuren, dat de eerstgeborene die zij baart, de naam van zijn overleden broer zal dragen; opdat zijn naam niet uitgewist wordt uit Israël. Maar als die man geen zin heeft om de vrouw van zijn broer te nemen, dan zal de vrouw van zijn broer naar de poort gaan, naar de oudsten, en zeggen: Mijn zwager weigert voor zijn broer een naam te doen voortbestaan in Israël; hij wil de plicht van een zwager niet aan mij vervullen.", "Deut 32:15-26": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil. Zij hebben Hem tot ijver verwekt door vreemde goden; door gruwelen hebben zij Hem tot toorn verwekt. Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben.", "Jer 7:6": "de vreemdeling, de wees en de weduwe niet zult verdrukken, en geen onschuldig bloed in deze plaats zult vergieten, en andere goden niet zult nawandelen, u zelf tot kwaad;", "Micha 5:13": "Verder zal Ik uw bossen uit uw midden uitroeien, en Ik zal uw steden verdelgen.", "Joh 11:55": "En het pascha van de Joden was nabij, en velen uit dat land gingen op naar Jeruzalem, vóór het pascha, om zichzelf te reinigen.", "1 Tim 2:1": "Ik vermaan dan voor alle dingen, dat er smekingen, gebeden, voorbiddingen en dankzeggingen gedaan worden voor alle mensen;", "2 Sam 23:4": "En Hij zal zijn gelijk het licht van de morgen, wanneer de zon opgaat, een morgen zonder wolken, wanneer door de glans na de regen de grasscheutjes uit de aarde voortkomen.", "Spr 31:9": "Open uw mond; oordeel rechtvaardig, en doe de verdrukte en de arme recht.", "Ps 43:1": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht.", "Jer 5:28": "Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.", "2 Kor 9:6-13": "En dit zeg ik: wie spaarzaam zaait, zal ook spaarzaam maaien; en wie in zegeningen zaait, zal ook in zegeningen maaien. Ieder doe zoals hij in zijn hart voorneemt; niet uit droefheid of uit dwang; want God heeft een blijmoedige gever lief. En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk.", "Job 22:5": "Is uw boosheid niet groot, en is er geen einde aan uw ongerechtigheden?", "Ex 12:27": "Dan zult u zeggen: Dit is voor de HEERE een paasoffer, Die voor de huizen van de kinderen van Israël voorbijging in Egypte, toen Hij de Egyptenaren sloeg, en onze huizen bevrijdde! Toen boog het volk zich en aanbad.", "Ps 94:6": "De weduwe en de vreemdeling doden zij, en zij vermoorden de wezen.", "Jes 1:29": "Want zij zullen beschaamd worden om de eiken, die u begeerd hebt, en u zult schaamrood worden, om de hoven, die u verkozen hebt.", "Deut 1:15-17": "Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen. En ik gebood in die tijd uw rechters, en zei: Hoor de geschillen tussen uw broeders, en oordeel rechtvaardig tussen de man en zijn broeder, en zijn vreemdeling. U zult in het gericht niemand voortrekken; u zult de kleine, evenals de grote, horen; u zult voor niemands aangezicht bang zijn; want het gericht is van God; maar de zaak die voor u te zwaar zal zijn, zult u naar mij laten komen, en ik zal die horen.", "Job 5:4": "Ver waren zijn zonen van heil; en zij werden verbrijzeld in de poort, en er was geen verlosser.", "Ezech 18:7-9": "En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt; Niet uitleent op woeker, noch overwinst neemt, zijn hand van onrecht afkeert, waarachtig recht tussen de een en de ander toepast; In Mijn inzettingen wandelt, en Mijn rechten onderhoudt, om trouw te handelen; die rechtvaardige zal zeker leven, spreekt de Heere HEERE.", "Spr 28:2": "Om de overtreding van het land zijn zijn vorsten met velen; maar door een verstandig en wetend mens zal het insgelijks lang blijven bestaan.", "2 Kron 30:21-26": "Zo hielden de kinderen van Israël, die te Jeruzalem gevonden werden, het feest van de ongezuurde broden, zeven dagen, met grote blijdschap. De Levieten nu en de priesters prezen de HEERE, dag op dag, met luid klinkende instrumenten van de HEERE. En Hizkia sprak bemoedigend tot alle Levieten, die goed verstand hadden van de kennis van de HEERE; en zij aten de offermaaltijden van het vastgestelde hoogtijd zeven dagen, terwijl zij dankoffers offerden, en de HEERE loofden, de God van hun vaderen. Toen de hele gemeente overlegd had, om nog zeven andere dagen te houden, hielden zij nog zeven dagen met blijdschap.", "Deut 24:17": "U zult het recht van de vreemdeling en van de wees niet buigen, en u zult het kleed van de weduwe niet te pand nemen.", "Job 24:9": "Zij rukken het weesje van de borst, en wat de arme toebehoort, nemen zij te pand.", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "Lev 23:36": "Zeven dagen zult u de HEERE vuuroffers offeren; op de achtste dag zult u een heilige samenkomst hebben, en zult de HEERE vuuroffer offeren; het is een verbodsdag; u zult geen dienstwerk doen.", "2 Kor 9:5-11": "Ik heb dan nodig geacht deze broeders te vermanen, dat zij eerst tot u zouden komen en van tevoren uw eerder aangediende zegen klaarmaken; zodat die gereed is, als een zegen, en niet als een vrekkigheid. En dit zeg ik: wie spaarzaam zaait, zal ook spaarzaam maaien; en wie in zegeningen zaait, zal ook in zegeningen maaien. Ieder doe zoals hij in zijn hart voorneemt; niet uit droefheid of uit dwang; want God heeft een blijmoedige gever lief.", "Jak 1:9": "Maar de broeder die nederig is, moet roemen in zijn hoogheid.", "1 Sam 8:3": "Doch zijn zonen wandelden niet in zijn wegen, maar neigden zich naar de gierigheid, en namen geschenken aan, en bogen het recht.", "1 Kor 5:7": "Zuiver dan de oude zuurdesem weg, opdat u een nieuw deeg mag zijn, zoals u ongezuurd bent. Want ook ons Pascha is voor ons geslacht, namelijk Christus.", "Ex 23:18": "U zult het bloed van Mijn offer niet offeren met gedesemde broden; ook zal het vet van Mijn feest niet tot de morgen overblijven.", "Lev 26:30": "En Ik zal uw hoogten verderven, en uw zonnebeelden uitroeien, en Ik zal uw dode lichamen op de dode lichamen van uw drekgoden werpen; en Mijn ziel zal van u walgen.", "Ps 44:22": "Zou God dat niet onderzoeken? Want Hij kent de verborgenheden van het hart.", "Pred 7:7": "Voorwaar, de onderdrukking zou wel een wijze dol maken; en het geschenk verdoemt het hart.", "Ps 42:5": "Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.", "Luk 11:42": "Maar wee u, Farizeeën, want u geeft tienden van munt en wijnruit en van alle moeskruid, en u gaat voorbij aan het recht en de liefde van God. Dit moest men doen, en het andere niet nalaten.", "Openb 19:10": "En ik viel neer voor zijn voeten, om hem te aanbidden, en hij zei tegen mij: Zie toe dat u dat niet doet; ik ben uw mededienstknecht, en uw broeder, die de getuigenis van Jezus hebben; aanbid God. Want de getuigenis van Jezus is de geest van de profetie.", "Ezra 1:2-4": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij opgedragen Hem een huis te bouwen te Jeruzalem, dat in Juda is. Wie is er onder u van al Zijn volk? Zijn God zij met hem, en hij trekt op naar Jeruzalem, dat in Juda is, en hij bouwt het huis van de HEERE, de God van Israël; Hij is de God, Die te Jeruzalem woont. En ieder die achterblijft in een van de plaatsen waar hij als vreemdeling verblijft, die zullen de mensen van zijn plaats bijstaan met zilver, en met goud, en met bezit, en met vee; benevens een vrijwillige gave, voor het huis van God, Die te Jeruzalem woont.", "Ex 23:17": "Drie keer per jaar zullen al uw mannen voor het aangezicht van de Heere HEERE verschijnen.", "Jer 22:3-5": "Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats. Want als u deze zaak ernstig zult doen, dan zullen door de poorten van dit huis koningen binnengaan, zittend op de troon van David, rijdend op wagens en op paarden, hij, en zijn dienaren, en zijn volk. Als u daarentegen deze woorden niet zult horen, dan heb Ik bij Mijzelf gezworen, spreekt de HEERE, dat dit huis tot een woestenij worden zal.", "Spr 20:28": "Weldadigheid en waarheid bewaren de koning; en door weldadigheid ondersteunt hij zijn troon.", "Jes 28:6": "en tot een Geest van het oordeel voor hem die te oordelen zit, en tot een sterkte voor hen die de strijd terugdrijven tot aan de poort toe.", "Spr 24:23-26": "Ook deze spreuken zijn van de wijzen. Het aanzien van personen in het gericht kennen, is niet goed. Wie tegen de goddeloze zegt: U bent rechtvaardig; die zullen de volken vervloeken, de naties zullen hem verafschuwen. Maar voor hen die hem bestraffen, zal liefelijkheid zijn; en de zegen van het goede zal op hen komen.", "Ex 20:23": "U zult naast Mij geen zilveren goden maken, en gouden goden zult u zich niet maken.", "Ps 107:2": "Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft.", "Spr 3:4": "En vind gunst en goed verstand, in de ogen van God en van de mensen.", "Jes 23:18": "En haar koophandel en haar hoerenloon zullen de HEERE heilig zijn, het zal niet als schat verzameld worden, en ook niet weggesloten; maar haar koophandel zal er zijn voor hen die voor het aangezicht van de HEERE wonen, opdat zij tot verzadiging eten, en opdat zij duurzame kleding hebben.", "Job 10:7": "Het is Uw wetenschap, dat ik niet goddeloos ben; nochtans is er niemand, die uit Uw hand verlost.", "Ex 12:33": "En de Egyptenaren drongen sterk aan bij het volk, om ze snel uit het land te drijven; want zij zeiden: Wij zijn allen dood!", "Spr 28:6": "De arme, die in zijn oprechtheid wandelt, is beter dan wie verkeerd is van wegen, al is hij rijk.", "Ex 13:4": "Vandaag gaat u uit, in de maand Abib.", "Ex 18:25": "En Mozes koos bekwame mannen, uit heel Israël, en stelde hen aan tot hoofden over het volk; leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien;", "Ex 12:16": "En op de eerste dag zal er een heilige samenkomst zijn; ook zult u een heilige samenkomst hebben op de zevende dag; er mag geen werk op die dagen gedaan worden; maar wat door iedere ziel gegeten moet worden, dat alleen mag door u klaargemaakt worden.", "Joël 2:26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "Spr 20:7": "De rechtvaardige wandelt steeds in zijn oprechtheid; gelukkig zijn zijn kinderen na hem.", "Joh 7:51": "Oordeelt onze wet soms een mens, zonder dat zij hem eerst gehoord heeft en weet wat hij doet?", "Spr 24:28": "Wees niet zonder reden getuige tegen uw naaste; want zou u misleiden met uw lip?", "Num 9:11": "In de tweede maand, op de veertiende dag, tussen de twee avonden, zullen zij dat houden; met ongezuurde broden en bittere kruiden zullen zij dat eten.", "Ex 22:30": "Hetzelfde moet u doen met uw runderen en met uw schapen; zeven dagen moeten ze bij hun moeder blijven, op de achtste dag moet u ze aan Mij geven.", "Ex 13:3-7": "Verder zei Mozes tegen het volk: Denk aan deze dag, waarop u uit Egypte, uit het diensthuis, gegaan bent; want de HEERE heeft u door een sterke hand van hier uitgevoerd; daarom mag het gedesemde niet gegeten worden. Vandaag gaat u uit, in de maand Abib. En het zal gebeuren, als de HEERE u in het land van de Kanaänieten, de Hethieten, de Amorieten, de Hevieten en de Jebusieten gebracht zal hebben, dat Hij uw vaderen gezworen heeft u te geven, een land dat overvloeit van melk en honing; dan moet u deze dienst houden in deze maand.", "Lev 23:15-21": "Daarna zult u voor uzelf tellen vanaf de dag na de sabbat, vanaf de dag dat u de schoof van het beweegoffer zult gebracht hebben; het zullen zeven volle sabbatten zijn; tot de dag na de zevende sabbat zult u vijftig dagen tellen, dan zult u een nieuw spijsoffer aan de HEERE offeren. U zult uit uw woningen twee beweegbroden brengen, zij zullen van twee tienden meelbloem zijn, gedesemd zullen zij gebakken worden; het zijn de eerstelingen voor de HEERE.", "Lev 19:35": "U zult geen onrecht doen in het gericht, met de el, met het gewicht, of met de maat.", "Deut 18:1-8": "De Levitische priesters, de hele stam van Levi, zullen geen deel of erfdeel hebben met Israël; de vuuroffers van de HEERE en Zijn erfdeel zullen zij eten. Daarom zal hij geen erfdeel hebben tussen zijn broeders; de HEERE is zijn Erfdeel, zoals Hij tot hem gesproken heeft. Dit nu zal het recht van de priesters zijn van het volk, van hen die een offerande offeren, hetzij een os of klein vee: dat hij de priester de schouder zal geven, en beide kaken, en de pens.", "Rom 13:1-7": "Ieder mens moet onderworpen zijn aan de machten die over hem gesteld zijn; want er is geen macht dan van God, en de machten die er zijn, zijn door God aangesteld. Zodat hij die zich tegen de macht stelt, de instelling van God weerstaat; en zij die weerstaan, zullen over zichzelf een oordeel halen. Want de leiders zijn niet tot een schrik voor de goede werken, maar voor de kwade. Wilt u nu de macht niet vrezen? Doe het goede, en u zult lof van haar hebben;", "Gen 35:1": "Daarna zei God tegen Jakob: Maak u op, trek op naar Bethel, en woon daar; en maak daar een altaar voor de God Die u verscheen, toen u vluchtte voor het aangezicht van uw broer Ezau.", "Luk 5:14": "En Hij gebood hem het aan niemand te vertellen, maar: Ga heen, zei Hij, laat uzelf aan de priester zien, en offer voor uw reiniging, zoals Mozes geboden heeft, hun tot een getuigenis.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Deut 17:16-20": "Maar hij mag voor zichzelf de paarden niet vermeerderen, en het volk niet laten terugkeren naar Egypte om paarden te vermeerderen; want de HEERE heeft tegen u gezegd: U mag voortaan niet meer terugkeren langs deze weg. Ook mag hij voor zichzelf de vrouwen niet vermeerderen, opdat zijn hart niet afwijkt; hij mag voor zichzelf ook geen zilver en goud in overvloed vermeerderen. Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt;", "Ex 22:21": "U mag de vreemdeling geen onrecht aandoen, en hem ook niet onderdrukken; want u bent zelf vreemdeling geweest in het land Egypte.", "Hebr 9:26": "(anders had Hij dikwijls moeten lijden, vanaf de grondlegging van de wereld) maar nu is Hij eenmaal, bij de voleinding van de eeuwen, geopenbaard, om de zonde teniet te doen, door Zijn eigen offer.", "Deut 19:17": "dan zullen die twee mannen die de twist hebben, staan voor het aangezicht van de HEERE, voor het aangezicht van de priesters en de rechters, die er in die dagen zullen zijn.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Ps 27:10": "Want mijn vader en mijn moeder hebben mij verlaten, maar de HEERE zal mij aannemen.", "1 Kron 29:3-9": "En daarbij, uit mijn genegenheid voor het huis van mijn God, geef ik mijn eigen goud en zilver, dat ik heb, aan het huis van mijn God, boven op alles wat ik al voor het heilige huis klaargemaakt heb; Drieduizend talenten goud, van het goud van Ofir, en zevenduizend talenten gelouterd zilver, om de wanden van de huizen mee te bekleden; Goud voor de gouden voorwerpen, en zilver voor de zilveren voorwerpen, en voor al het werk dat door de hand van de werkmeesters gemaakt moet worden. En wie is er bereid om zich vandaag vrijwillig aan de HEERE te wijden?", "Joël 1:15": "Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Spr 17:8": "Het geschenk is in de ogen van wie het bezit een aangenaam gesteente; waarheen het zich ook wendt, het zal wel gedijen.", "Joz 20:4": "Als hij vlucht naar één van die steden, dan zal hij staan aan de deur van de stadspoort, en hij zal zijn woorden spreken voor de oren van de oudsten van die stad; dan zullen zij hem bij zich in de stad opnemen, en hem een plaats geven, zodat hij bij hen kan wonen.", "2 Kor 5:11": "Wij dan, die de schrik van de Heere kennen, bewegen de mensen tot het geloof, en wij zijn openbaar geworden voor God; en ik hoop dat wij ook in uw gewetens geopenbaard zijn geworden.", "2 Sam 15:2": "Ook stond Absalom 's morgens vroeg op, en ging staan aan de kant van de weg naar de poort. En het gebeurde dat Absalom iedere man die een geschil had en naar de koning wilde komen voor een rechtszaak, tot zich riep en zei: Uit welke stad bent u? Als hij dan zei: Uw knecht is uit een van de stammen van Israël,", "Ex 12:39": "En zij bakten van het deeg dat zij uit Egypte gebracht hadden, ongezuurde koeken; want het was niet gedesemd; omdat zij uit Egypte verdreven werden, zodat zij niet konden blijven, en ook geen voedsel voor zich hadden klaargemaakt.", "Rom 14:14": "Ik weet en ben verzekerd in de Heere Jezus, dat niets onrein is op zichzelf; behalve voor hem die iets acht onrein te zijn, voor hem is het onrein.", "Deut 27:15": "Vervloekt is de man die een gesneden of gegoten beeld, een gruwel voor de HEERE, een werk van vakmansen handen, maakt en in het verborgene neerzet! En heel het volk zal antwoorden en zeggen: Amen.", "Deut 12:6": "En daarheen zult u brengen uw brandoffers, en uw slachtoffers, en uw tienden, en het hefoffer van uw hand, en uw geloften, en uw vrijwillige offers, en de eerstgeboorte van uw runderen en van uw schapen.", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Openb 2:15": "Zo hebt u ook mensen die de leer van de Nikolaieten vasthouden; wat Ik haat.", "Deut 23:23": "Wat uit uw lippen komt, zult u houden en doen; zoals u de HEERE, uw God, een vrijwillig offer beloofd hebt, dat u met uw mond gesproken hebt.", "Ex 12:9": "U moet daarvan niet rauw eten, en ook zeker niet in water gekookt; maar aan het vuur gebraden, met zijn hoofd, zijn schenkels en zijn ingewanden.", "Lev 19:36": "U zult een eerlijke weegschaal hebben, eerlijke gewichten, een eerlijke efa, en een eerlijke hin; Ik ben de HEERE, uw God, Die u uit Egypteland uitgevoerd heb!", "Hand 17:16": "En terwijl Paulus hen te Athene verwachtte, werd zijn geest in hem geprikkeld, toen hij zag dat de stad zo vol afgoden was.", "Ex 12:32": "Neemt ook met u uw schapen en uw runderen, zoals u gesproken hebt, en gaat heen, en zegent mij ook.", "Ps 22:15": "Ik ben uitgestort als water, en al mijn beenderen hebben zich vaneen gescheiden; mijn hart is als was, het is gesmolten in het midden van mijn ingewand.", "1 Kor 16:1-3": "Wat de verzameling betreft, die voor de heiligen gebeurt: zoals ik aan de Gemeenten in Galatië verordend heb, doet u ook zo. Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn. En wanneer ik daar gekomen zal zijn, zal ik hen die u bekwaam zult achten door brieven zenden, om uw gave naar Jeruzalem over te dragen.", "Ps 148:11": "Koningen van de aarde, en alle volken, vorsten, en alle rechters van de aarde!", "2 Kor 7:2": "Geef ons plaats; wij hebben niemand onrecht aangedaan, wij hebben niemand verdorven, wij hebben bij niemand ons voordeel gezocht.", "2 Kor 8:24": "Bewijs dan aan hen het bewijs van uw liefde, en van onze roem over u, ook voor het aangezicht van de gemeenten.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Deut 28:8-12": "De HEERE zal de zegen gebieden, zodat Hij met u is in uw schuren, en in alles waar u uw hand aan slaat; en Hij zal u zegenen in het land dat de HEERE, uw God, u geven zal. De HEERE zal u voor Zichzelf tot een heilig volk bevestigen, zoals Hij u gezworen heeft, wanneer u de geboden van de HEERE, uw God, houdt, en in Zijn wegen wandelt. En alle volken van de aarde zullen zien dat de Naam van de HEERE over u uitgeroepen is, en zij zullen voor u vrezen.", "Kol 3:15-17": "En laat de vrede van God heersen in uw harten, waartoe u ook geroepen bent in één lichaam; en wees dankbaar. Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart. En alles wat u doet, met woorden of met werken, doe dat alles in de Naam van de Heere Jezus, terwijl u God en de Vader dankt door Hem.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Ex 23:3": "Ook zult u de arme niet voortrekken in zijn geschil.", "Jes 60:7": "Al de schapen van Kedar zullen tot u verzameld worden; de rammen van Nebajoth zullen u dienen; zij zullen met welgevallen op Mijn altaar komen, en Ik zal het huis van Mijn heerlijkheid heerlijk maken.", "Luk 22:7": "En de dag van de ongezuurde broden kwam, waarop het pascha geslacht moest worden.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "2 Kron 7:8-10": "Salomo hield ook op dezelfde tijd het feest zeven dagen, en heel Israël met hem, een zeer grote gemeente, vanaf de ingang van Hamath tot de rivier van Egypte. En op de achtste dag hielden zij een slotfeest; want zij hielden de inwijding van het altaar zeven dagen, en het feest zeven dagen. Maar op de drieëntwintigste dag van de zevende maand liet hij het volk gaan naar hun tenten, blij en welgemoed over het goede, dat de HEERE aan David en Salomo, en Zijn volk Israël gedaan had.", "Hagg 2:19": "Zet er toch uw hart op, vanaf deze dag en verder; vanaf de vierentwintigste dag van de negende maand, vanaf de dag waarop het fundament van de tempel van de HEERE gelegd is, zet er uw hart op.", "Matt 26:17": "En op de eerste dag van de ongezuurde broden kwamen de discipelen naar Jezus toe en zeiden tegen Hem: Waar wilt U dat wij voor U het Pascha klaarmaken om te eten?", "Ex 22:29": "Met het brengen van de opbrengst van uw oogst en van uw perskuip mag u niet talmen; de eerstgeborene van uw zonen moet u aan Mij geven.", "Rom 13:3": "Want de leiders zijn niet tot een schrik voor de goede werken, maar voor de kwade. Wilt u nu de macht niet vrezen? Doe het goede, en u zult lof van haar hebben;", "Mark 12:41-44": "En Jezus, gezeten tegenover de schatkist, zag hoe de menigte geld in de schatkist wierp; en veel rijken wierpen er veel daarin. En er kwam een arme weduwe, die twee kleine muntjes daarin wierp, dat is een oortje. En Jezus riep Zijn discipelen tot Zich, en zei tegen hen: Voorwaar, Ik zeg u, dat deze arme weduwe meer heeft ingeworpen dan allen die iets in de schatkist geworpen hebben.", "Ex 13:9": "En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft.", "Luk 6:31": "En zoals u wilt dat de mensen u doen, doe hun ook hetzelfde.", "Spr 23:10": "Verzet de oude grenspalen niet; en kom niet op de akkers van de wezen;", "Ps 73:2-22": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Ps 81:10": "Er zal onder u geen uitlandse god zijn, en u zult u voor geen vreemde god neerbuigen.", "Ezra 3:4": "En zij hielden het feest van de loofhutten, zoals geschreven is; en zij offerden brandoffers dag bij dag in getal, naar het voorschrift, zoals elke dag vereiste.", "Ps 68:6": "Hij is een Vader van de wezen, en een Rechter van de weduwen; God, in de woonplaats van Zijn heiligheid.", "Jes 10:1": "Wee hun die onrechtvaardige regels bepalen, en de schrijvers die moeite voorschrijven;", "Ex 12:20": "U moet niets eten dat gedesemd is; in al uw woningen moet u ongezuurde broden eten.", "Ps 48:12": "Laat de berg Sion blijde zijn; laat de dochters van Juda zich verheugen, om Uw oordelen wil.", "Matt 19:21": "Jezus zei tegen hem: Als u volmaakt wilt zijn, ga heen, verkoop wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom hier, volg Mij.", "1 Kon 9:25": "En Salomo offerde driemaal per jaar brandoffers en dankoffers, op het altaar, dat hij voor de HEERE gebouwd had, en hij brandde reukwerk op dat altaar, dat voor het aangezicht van de HEERE was, toen hij het huis voltooid had.", "Job 31:13-15": "Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij; (Want wat zou ik doen, als God opstond? En als Hij bezoeking deed, wat zou ik Hem antwoorden? Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Ps 96:8": "Geeft de HEERE de eer van Zijn Naam; brengt een offer, en komt in Zijn voorhoven.", "1 Kron 29:14-17": "Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand. Want wij zijn vreemdelingen en bijwoners voor Uw aangezicht, zoals al onze vaders; onze dagen op aarde zijn als een schaduw, en er is geen verwachting. HEERE, onze God, al deze overvloed die wij klaargemaakt hebben om U een huis te bouwen, voor de Naam van Uw heiligheid, dat komt van Uw hand, en het is alles van U.", "Jes 59:14": "Daarom is het recht achterwaarts geweken, en de gerechtigheid staat ver weg; want de waarheid struikelt op de straat, en wat recht is, kan er niet ingaan.", "Ps 105:1-45": "Looft de HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken. Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen. Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "1 Kor 10:20-22": "Nee, maar ik zeg dat wat de heidenen offeren, zij dat aan de duivelen offeren en niet aan God; en ik wil niet dat u gemeenschap hebt met de duivelen. U kunt niet de drinkbeker van de Heere drinken én de drinkbeker van de duivelen; u kunt niet deelhebben aan de tafel van de Heere én aan de tafel van de duivelen. Of willen wij de Heere tot jaloersheid tergen? Zijn wij soms sterker dan Hij?", "Spr 21:26": "De hele dag begeert hij begeerlijke dingen; maar de rechtvaardige zal geven, en niet inhouden.", "Job 31:16-18": "Als ik de armen hun begeerte onthouden heb, of de ogen van de weduwe laten versmachten; En mijn bete alleen gegeten heb, zodat de wees daarvan niet gegeten heeft; (Want van mijn jonkheid af is hij bij mij opgetogen, als bij een vader, en van mijner moeders buik af heb ik haar geleid;)", "Mal 3:10": "Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen schuren genoeg zullen zijn.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Num 27:17": "Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "Ex 12:15-20": "Zeven dagen moet u ongezuurde broden eten; maar op de eerste dag moet u het zuurdeeg wegdoen uit uw huizen; want wie het gedesemde eet, van de eerste dag af tot de zevende dag, die ziel zal uitgeroeid worden uit Israël. En op de eerste dag zal er een heilige samenkomst zijn; ook zult u een heilige samenkomst hebben op de zevende dag; er mag geen werk op die dagen gedaan worden; maar wat door iedere ziel gegeten moet worden, dat alleen mag door u klaargemaakt worden. Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.", "Jes 60:17": "Voor koper zal Ik goud brengen, en voor ijzer zal Ik zilver brengen, en voor hout koper, en voor stenen ijzer; en Ik zal uw opzieners vreedzaam maken, en uw drijvers rechtvaardig.", "1 Petr 2:13": "Wees dan onderdanig aan alle menselijke instelling, om de Heere; hetzij aan de koning, als hebbende het hoogste gezag;", "Deut 25:13-16": "U zult geen twee soorten gewichten in uw zak hebben, een groot en een klein. U zult in uw huis geen twee soorten efa hebben, een grote en een kleine. U zult een volkomen en eerlijk gewicht hebben; u zult een volkomen en eerlijke efa hebben; opdat uw dagen verlengd worden in het land, dat de HEERE, uw God, u geven zal.", "Lev 5:7": "Maar als zijn hand niet zoveel bereiken kan als genoeg is voor een stuk kleinvee, dan zal hij als zijn offer voor de schuld die hij gezondigd heeft, aan de HEERE brengen twee tortelduiven of twee jonge duiven, een als zondoffer en een als brandoffer.", "1 Kor 10:14": "Daarom, mijn geliefden, vlucht van de afgodendienst.", "Ps 107:43": "Wie is wijs? Laat hij op deze dingen letten; en laat men verstandig letten op de blijken van goedertierenheid van de HEERE.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Pred 11:1": "Werp uw brood uit op het water, want u zult het vinden na veel dagen.", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Mark 12:3": "Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Amos 5:7": "Zij die het recht in alsem veranderen, en de gerechtigheid ter aarde neerwerpen.", "Spr 10:9": "Wie in oprechtheid wandelt, wandelt zeker; maar wie zijn wegen verdraait, zal bekend worden.", "Deut 15:7-18": "Wanneer er onder u een arme zal zijn, iemand van uw broeders, in een van uw poorten, in uw land dat de HEERE, uw God, u geven zal, dan zult u uw hart niet verharden, en uw hand niet toesluiten voor uw broeder die arm is; Maar u zult uw hand mild voor hem opendoen, en u zult hem rijkelijk lenen, genoeg voor zijn gebrek, wat hem ontbreekt. Wacht ervoor dat er in uw hart geen verdorven gedachte is, om te zeggen: Het zevende jaar, het jaar van de vrijlating, komt dichtbij; zodat uw oog kwaadaardig is tegen uw broeder die arm is, en dat u hem niets geeft; en hij over u roept tot de HEERE, en er zonde in u is.", "Tit 1:7": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "Ex 23:14-17": "Drie keer per jaar zult u Mij feest houden. Het feest van de ongezuurde broden zult u houden; zeven dagen zult u ongezuurde broden eten (zoals Ik u geboden heb), op de vastgestelde tijd in de maand Abib, want in die maand bent u uit Egypte getrokken; en men zal niet met lege handen voor Mijn aangezicht verschijnen. En het feest van de oogst, van de eerste vruchten van uw arbeid, die u op het veld gezaaid zult hebben. En het feest van de inzameling, aan het einde van het jaar, wanneer u de opbrengst van uw arbeid van het veld ingezameld zult hebben.", "Hand 12:3": "En toen hij zag dat dit de Joden aangenaam was, ging hij verder om ook Petrus te vangen (het waren de dagen van het ongezuurde brood);", "Lev 23:6-8": "En op de vijftiende dag van diezelfde maand is het feest van de ongezuurde broden van de HEERE; zeven dagen zult u ongezuurde broden eten. Op de eerste dag zult u een heilige samenkomst hebben; geen dienstwerk zult u doen. Maar u zult zeven dagen vuuroffer aan de HEERE offeren; en op de zevende dag zal een heilige samenkomst zijn; geen dienstwerk zult u doen.", "Joh 2:23": "En toen Hij te Jeruzalem was, op het Pascha, tijdens het feest, geloofden velen in Zijn Naam, omdat zij Zijn tekenen zagen die Hij deed.", "1 Tim 5:9-12": "Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is; Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd. Maar wijs de jonge weduwen af; want als zij weelderig zijn geworden tegen Christus, willen zij trouwen;", "Deut 33:19": "Zij zullen de volken tot de berg roepen; daar zullen zij offeranden van gerechtigheid offeren; want zij zullen de overvloed van de zeeën zuigen, en de bedekte verborgen dingen van het zand.", "Spr 19:1": "De arme, die in zijn oprechtheid wandelt, is beter dan de verkeerde van lippen, en die een dwaas is.", "Hab 1:4": "Daarom wordt de wet losgelaten, en het recht komt nooit meer voort; want de goddeloze omringt de rechtvaardige; daarom komt het recht verdraaid voort.", "Kol 2:7": "Geworteld en opgebouwd in Hem, en bevestigd in het geloof, zoals u geleerd bent, overvloedig zijnde daarin, met dankzegging.", "2 Kron 19:7": "Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "Spr 25:5": "Doe de goddeloze weg van het aangezicht van de koning, en zijn troon zal door gerechtigheid bevestigd worden.", "2 Kor 7:11": "Want zie, ditzelfde, dat u naar God bedroefd bent geworden, hoe grote naarstigheid heeft dat in u gewerkt? Ja, verantwoording, ja, onlust, ja, vrees, ja, verlangen, ja, ijver, ja, wraak; in alles hebt u uzelf bewezen rein te zijn in deze zaak.", "Joh 2:13": "En het Pascha van de Joden was nabij, en Jezus ging op naar Jeruzalem.", "Ex 38:8": "Hij maakte ook het koperen wasvat, met zijn koperen voet, van de spiegels van de vrouwen die samenkwamen, die samenkwamen voor de deur van de tent van de samenkomst.", "Pred 7:14": "Geniet het goede op de dag van het voorspoed, maar op de dag van het tegenspoed, zie toe; want God maakt ook de een tegenover de ander, vanwege dat de mens niets zou vinden dat na hem zal zijn.", "Job 16:17": "Terwijl er toch geen onrecht in mijn handen is, en mijn gebed zuiver is.", "Lev 19:13-15": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen. U zult de dove niet vloeken, en voor het aangezicht van de blinde geen struikelblok zetten; maar u zult voor uw God vrezen; Ik ben de HEERE! U zult geen onrecht doen in het gericht; u zult het aangezicht van de geringe niet aannemen, noch het aangezicht van de grote voortrekken; in gerechtigheid zult u uw naaste rechtspreken.", "1 Tim 1:5": "Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.", "Matt 19:22": "Toen nu de jongeling dit woord hoorde, ging hij bedroefd weg; want hij had veel bezittingen.", "Lev 25:26": "En wanneer iemand geen losser zal hebben, maar zijn hand het bekomen heeft en hij gevonden zal hebben, zoveel als genoeg is tot zijn lossing;", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "Job 6:27": "Ook werpt u zich op een wees; en u graaft tegen uw vriend.", "Spr 28:27": "Wie de arme geeft, zal geen gebrek hebben; maar wie zijn ogen verbergt, zal veel vervloekt worden.", "Lev 23:38": "behalve de sabbatten van de HEERE, en behalve uw gaven, en behalve al uw geloften, en behalve al uw vrijwillige offeren, die u de HEERE geven zult.", "Joh 7:24": "Oordeel niet naar het aanzien, maar oordeel een rechtvaardig oordeel.", "1 Sam 2:25": "Wanneer een mens tegen een mens zondigt, zullen de goden hem oordelen; maar wanneer een mens tegen de HEERE zondigt, wie zal voor hem bidden? Maar zij luisterden niet naar de stem van hun vader, want de HEERE wilde hen doden.", "Joh 7:2": "En het feest van de Joden, namelijk het loofhuttenfeest, was nabij.", "Ex 23:6-8": "U zult het recht van uw arme niet buigen in zijn geschil. Blijf ver van valse zaken; en de onschuldige en rechtvaardige zult u niet doden; want Ik zal de goddeloze niet rechtvaardigen. Ook zult u geen geschenk aannemen; want het geschenk verblindt de zi
