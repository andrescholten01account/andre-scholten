n zal worden, zal de HEERE loven;", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Deut 11:32": "Neem dan waar te doen al de inzettingen en de rechten, die ik u heden voorstel.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Hebr 4:12": "Want het Woord van God is levend en krachtig, en scherper dan enig tweesnijdend zwaard, en gaat door tot de verdeling van ziel en geest, en van de gewrichten en het merg, en is een beoordelaar van de gedachten en overleggingen van het hart.", "2 Kor 11:15": "Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.", "Ps 34:8": "Cheth. De Engel van de HEERE legert Zich rondom hen die Hem vrezen, en redt hen.", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Matt 7:25": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangevallen, en het is niet gevallen, want het was op de steenrots gegrond.", "Ps 71:6": "Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U.", "Ps 104:30": "Zendt U Uw Geest uit, dan worden zij geschapen, en U vernieuwt het gelaat van het aardrijk.", "1 Sam 2:8": "Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Ps 10:2-6": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben. Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE. De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Luk 22:3": "En de satan voer in Judas, die bijgenaamd was Iskariot, die uit het getal van de twaalf was.", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Ezech 27:17": "Juda en het land Israël waren uw kooplieden; met tarwe van Minnit en Pannag, en honing, en olie, en balsem, dreven zij onderlinge handel met u.", "Deut 6:16": "U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.", "2 Petr 1:9": "Want bij wie deze dingen niet aanwezig zijn, die is blind, kan niet ver zien, en is vergeten dat hij gereinigd is van zijn vroegere zonden.", "Gal 4:9": "en nu u God kent, ja, veelmeer door God gekend bent, hoe keert u zich weer tot de zwakke en arme beginselen, die u weer van voren af aan wilt dienen?", "Lev 26:10": "En u zult het oude, dat verouderd is, eten; en het oude zult u wegdoen vanwege het nieuwe.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Spr 17:22": "Een blij hart zal goed doen als een medicijn; maar een verslagen geest zal het gebeente doen verdrogen.", "Ps 37:31": "De wet van zijn God is in zijn hart; zijn gangen zullen niet uitglijden.", "2 Kron 7:17": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Luk 4:19": "Om aan de gevangenen vrijlating te prediken, en aan de blinden het gezicht, om de verslagenen in vrijheid heen te zenden; om te prediken het aangename jaar van de Heere.", "Richt 8:35": "En zij bewezen geen goedheid aan het huis van Jerubbaäl, dat is Gideon, ondanks al het goede dat hij voor Israël gedaan had.", "Jes 51:2": "Kijk naar Abraham, uw vader, en naar Sara, die u gebaard heeft; want Ik riep hem, toen hij nog alleen was, en Ik zegende hem, en Ik vermenigvuldigde hem.", "Job 37:6": "Want Hij zegt tot de sneeuw: Val op de aarde; en tot de regenbui: Wees een sterke regenbui.", "Ps 78:7": "En dat zij hun hoop op God zouden stellen, en Gods daden niet vergeten, maar Zijn geboden bewaren;", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "Jes 31:5": "Zoals vliegende vogels, zo zal de HEERE van de heerscharen Jeruzalem beschutten, beschuttend zal Hij haar ook verlossen, voorbijgaand zal Hij haar ook uithelpen.", "Matt 13:14": "En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Spr 26:5": "Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Ps 6:7": "Ik ben moe van mijn zuchten; ik laat mijn bed de hele nacht zwemmen; ik doornat mijn bedstede met mijn tranen.", "Hand 14:17": "hoewel Hij Zichzelf toch niet zonder getuigenis gelaten heeft, doordat Hij goeddeed, ons vanuit de hemel regen en vruchtbare tijden gaf, en onze harten vervulde met voedsel en vreugde.", "Matt 5:21": "U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "Hos 2:8": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken.", "Jak 1:18": "Naar Zijn wil heeft Hij ons gebaard door het Woord van de waarheid, opdat wij zouden zijn als eerstelingen van Zijn schepselen.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Klaagl 3:20": "Zain. Mijn ziel denkt er wel terdege aan, en zij buigt zich neer in mij.", "Jona 4:6": "En God, de HEERE, liet een wonderboom groeien en die opschieten boven Jona, zodat er schaduw zou zijn over zijn hoofd, om hem te bevrijden van zijn ellende. En Jona verheugde zich over de wonderboom met grote blijdschap.", "Ps 147:20": "Zo heeft Hij met geen enkel volk gedaan; en Zijn rechten, die kennen zij niet. Hallelujah!", "Jer 22:14": "Die zegt: Ik zal mij een zeer hoog huis bouwen, en ruime bovenzalen; en hij houwt er zich vensters in uit, en het is bedekt met ceder, en aangestreken met menie.", "Ps 119:31": "Ik kleef vast aan Uw getuigenissen; o HEERE! beschaam mij niet.", "Deut 13:3": "dan zult u naar de woorden van die profeet, of naar die dromen-dromer, niet horen; want de HEERE, uw God, beproeft u, om te weten of u de HEERE, uw God, liefhebt met heel uw hart en met heel uw ziel.", "Hand 7:32": "die zei: Ik ben de God van uw vaders, de God van Abraham, en de God van Izak, en de God van Jakob. En Mozes begon hevig te beven, en durfde niet te kijken.", "Deut 30:11-14": "Want dit gebod, dat ik u heden gebied, dat is voor u niet verborgen, en dat is niet ver weg. Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen?", "Spr 11:2": "Als de hoogmoed komt, zal de schande ook komen; maar met de ootmoedigen is wijsheid.", "Ps 23:1": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken.", "Deut 7:17": "Als u in uw hart zei: Deze volken zijn groter dan ik; hoe zou ik hen uit hun bezit kunnen verdrijven? —", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "2 Sam 7:8": "Nu dan, zo zult u tegen Mijn knecht, tegen David, zeggen: Zo zegt de HEERE van de heerscharen: Ik heb u genomen van de schaapskooi, van achter de schapen, om een voorganger te zijn over Mijn volk, over Israël.", "Hand 7:26-28": "En de volgende dag liet hij zich aan hen zien, terwijl zij vochten; en hij drong hen tot vrede, en zei: Mannen, u bent broeders; waarom doet u elkaar onrecht aan? Maar die zijn naaste onrecht aandeed, stiet hem weg, en zei: Wie heeft u tot leider en rechter over ons gesteld? Wilt u mij ook ombrengen, zoals u gisteren de Egyptenaar hebt omgebracht?", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Hand 7:3": "en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal.", "Deut 8:17-20": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is. Maar als het gebeurt, dat u de HEERE, uw God, helemaal vergeet, en andere goden navolgt, en hen dient, en u voor hen buigt, dan verklaar ik vandaag tegen u, dat u zeker zult omkomen.", "Spr 14:11": "Het huis van de goddelozen zal weggevaagd worden; maar de tent van de oprechten zal bloeien.", "1 Tim 5:15": "Want sommigen hebben zich al afgewend, achter de satan aan.", "Ps 119:71": "Het is mij goed, dat ik verdrukt ben geweest, opdat ik Uw inzettingen leerde.", "Spr 13:8": "Het rantsoen van ieders ziel is zijn rijkdom; maar de arme hoort het schelden niet.", "Ps 45:7": "Uw troon, o God! is eeuwig en altijd; de scepter van Uw koninkrijk is een scepter van rechtmatigheid.", "Ps 136:1-26": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Loof de God der goden; want Zijn goedertierenheid is voor eeuwig. Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig.", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "Mal 4:4": "Denk aan de wet van Mozes, Mijn knecht, die Ik hem geboden heb op Horeb voor heel Israël, met de inzettingen en rechten.", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "Spr 3:9": "Vereer de HEERE met uw goed, en met de eerstelingen van al uw inkomsten;", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Ps 103:2-5": "Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden;", "Rom 3:14": "Hun mond is vol vervloeking en bitterheid;", "Luk 1:6": "En zij waren beiden rechtvaardig voor God, en wandelden onberispelijk in alle geboden en voorschriften van de Heere.", "2 Kron 20:3-30": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda. En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof.", "Ps 81:14-17": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld! In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders. Zij die de HEERE haten, zouden zich Hem geveinsd onderworpen hebben, maar hun tijd zou eeuwig geweest zijn.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Deut 4:1-40": "Israël! hoor naar de inzettingen en de rechten die ik u leer te doen, opdat u leeft, en het land binnentrekt en in bezit neemt dat de HEERE, de God van uw vaderen, u geeft. U mag aan dit woord, dat ik u gebied, niets toevoegen, en er ook niets van afdoen; opdat u de geboden bewaart van de HEERE, uw God, die ik u gebied. Uw ogen hebben gezien wat God bij Baäl-peor gedaan heeft; want ieder man die Baäl-peor navolgde, die heeft de HEERE, uw God, uit uw midden weggevaagd.", "Ps 105:40": "Zij baden, en Hij deed kwakkels komen, en Hij verzadigde hen met brood uit de hemel.", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Hand 17:25-28": "En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft; En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied; Opdat zij de Heere zouden zoeken, of zij Hem misschien konden tasten en vinden; hoewel Hij niet ver is van ieder van ons.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "Zef 1:18": "Ook hun zilver, ook hun goud zal hen niet kunnen redden op de dag van de verbolgenheid van de HEERE; maar door het vuur van het ijver van Hem zal dit hele land verteerd worden; want Hij zal een voleinding maken, zeker, een haastige, met alle inwoners van dit land.", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Hebr 10:13": "verder wachtend, totdat Zijn vijanden neergelegd worden als een voetbank voor Zijn voeten.", "Ps 119:161": "Schin. De vorsten hebben mij vervolgd zonder oorzaak; maar mijn hart heeft gevreesd voor Uw woord.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Hand 2:17-21": "En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren. En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.", "Ps 80:7": "U hebt ons onze buren tot een twist gesteld, en onze vijanden spotten onder elkaar.", "Job 34:27": "Daarom dat zij van achter Hem afgeweken zijn, en geen van Zijn wegen verstaan hebben;", "Neh 9:20": "En U hebt Uw goede Geest gegeven om hen te onderwijzen; en Uw Manna hebt U niet geweerd van hun mond, en water hebt U hun gegeven voor hun dorst.", "Zach 11:12": "Want ik had tegen hen gezegd: Als het goed is in uw ogen, breng mijn loon, en zo niet, laat het na. En zij hebben mijn loon gewogen, dertig zilverlingen.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Spr 12:26": "De rechtvaardige is voortreffelijker dan zijn naaste; maar de weg van de goddelozen doet hen dwalen.", "1 Kor 10:1-13": "Ik wil niet, broeders, dat u onwetend bent van het volgende: onze vaders waren allen onder de wolk, en gingen allen door de zee heen; en zij zijn allen in Mozes gedoopt in de wolk en in de zee; en zij hebben allen hetzelfde geestelijke voedsel gegeten;", "Num 13:27": "En zij vertelden hem en zeiden: Wij zijn gekomen tot dat land, waarheen u ons gezonden hebt; en werkelijk, het vloeit van melk en honing, en dit is zijn vrucht.", "Joh 2:25": "En omdat Hij niet nodig had dat iemand zou getuigen van de mens; want Hij Zelf wist wat er in de mens was.", "Jer 27:4-6": "En beveel hun om tegen hun heren te zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zo zult u tegen uw heren zeggen: Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Ps 73:8": "Zij mergelen de mensen uit, en spreken bos van verdrukking; zij spreken uit de hoogte.", "Ps 102:26-28": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn. Maar U bent Dezelfde, en Uw jaren zullen niet geëindigd worden.", "Luk 8:11-15": "Dit is nu de gelijkenis: het zaad is het Woord van God. Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden. En zij die op de rots bezaaid worden, zijn zij die, wanneer zij het gehoord hebben, het Woord met vreugde ontvangen; en dezen hebben geen wortel: zij geloven maar voor een tijd, en in de tijd van verzoeking wijken zij af.", "Rom 12:20": "Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen.", "Hebr 8:8-12": "Want omdat Hij hen berispt, zegt Hij tegen hen: Zie, de dagen komen, spreekt de Heere, dat Ik over het huis van Israël en over het huis van Juda een nieuw verbond zal oprichten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere. Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Job 21:31": "Wie zal hem in het aangezicht zijn weg voorhouden? Als hij iets doet, wie zal het hem vergelden?", "Deut 1:19": "Toen vertrokken wij van Horeb, en trokken door die hele grote en vreselijke woestijn, die u gezien hebt, op de weg van het gebergte van de Amorieten, zoals de HEERE, onze God, ons geboden had; en wij kwamen bij Kades-Barnea.", "Spr 3:2": "Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen.", "Matt 4:16": "het volk dat in duisternis zat, heeft een groot licht gezien; en over hen die zaten in het land en de schaduw van de dood, is een licht opgegaan.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Mark 1:3": "De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht.", "Ps 69:26": "Hun paleis worde verwoest; in hun tenten zij geen inwoner.", "Matt 3:3": "Want deze is het, van wie gesproken is door Jesaja, de profeet, toen hij zei: De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Hebr 13:16": "En vergeet de weldadigheid en de mededeelzaamheid niet; want aan zulke offers heeft God een welgevallen.", "Openb 18:7": "Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien.", "Gen 21:12": "Maar God zei tegen Abraham: Laat het niet kwaad zijn in uw ogen vanwege de jongen en vanwege uw slavin; alles wat Sara tegen u zegt, luister naar haar stem; want in Izak zal uw nageslacht genoemd worden.", "Jak 4:7": "Onderwerp u dan aan God; weerstaat de duivel, en hij zal van u wegvluchten.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Deut 8:16-20": "Die u in de woestijn voedde met manna, dat uw vaderen niet gekend hadden; om u te verootmoedigen, en om u te beproeven, opdat Hij u uiteindelijk goeddeed; En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is.", "Matt 13:23": "Maar die in de goede aarde bezaaid is, dit is degene die het woord hoort en begrijpt, die ook vrucht draagt en voortbrengt, de een honderdvoud, de ander zestigvoud, en de ander dertigvoud.", "Rom 11:25": "Want ik wil niet, broeders, dat u deze verborgenheid onbekend is (opdat u niet wijs bent, bij uzelf), dat de verharding voor een deel over Israël gekomen is, totdat de volheid van de heidenen zal ingegaan zijn.", "Deut 11:8": "Houd dan alle geboden, die ik u heden gebied; opdat u sterk wordt en het land binnengaat, en het erft, waarheen u overtrekt, om dat te erven;", "Matt 15:4": "Want God heeft geboden en gezegd: Eer uw vader en moeder, en: Wie vader of moeder vervloekt, die zal de dood sterven.", "Hebr 8:5": "Deze priesters dienen het voorbeeld en de schaduw van de hemelse dingen, zoals Mozes door een goddelijke aanwijzing gewaarschuwd werd toen hij de tabernakel zou voltooien: Want, zegt Hij, zie erop toe dat u alles maakt naar het patroon dat u op de berg getoond is.", "Ps 119:18-20": "Ontdek mijn ogen, dat ik aanschouw de wonderen van Uw wet. Ik ben een vreemdeling op de aarde, verberg Uw geboden voor mij niet. Mijn ziel is verbroken vanwege het verlangen naar Uw oordelen te aller tijd.", "Gen 2:2": "Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.", "Rom 4:8": "Gelukkig is de man, aan wie de Heere de zonden niet toerekent.", "Gen 22:16": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt;", "2 Sam 4:6": "En zij kwamen daar tot midden in het huis, alsof zij tarwe kwamen halen, en zij sloegen hem in de buik; en Rechab en zijn broer Baëna ontkwamen.", "1 Petr 3:15": "maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,", "Job 33:16-30": "Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding; Opdat Hij de mens afwendt van zijn werk, en van de man de hoogmoed verbergt; Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "Hebr 10:5-7": "Daarom zegt Hij, bij Zijn komst in de wereld: Slachtoffer en offergave hebt U niet gewild, maar U hebt Mij een lichaam toebereid; Brandoffers en offers voor de zonde hebben U niet behaagd. Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Pred 12:11": "De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Ezech 28:17": "Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken.", "Rom 4:17": "(Zoals geschreven staat: Ik heb u tot een vader van veel volken gesteld) voor Hem, aan Wie hij geloofd heeft, namelijk God, Die de doden levend maakt, en de dingen die niet zijn roept alsof zij waren;", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Ex 20:12": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.", "Deut 27:3": "en u zult daarop alle woorden van deze wet schrijven, wanneer u overgestoken bent; opdat u komt in het land dat de HEERE, uw God, u geven zal, een land dat overvloeit van melk en honing, zoals de HEERE, de God van uw vaderen, u beloofd heeft.", "Matt 20:27": "en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "Luk 9:62": "En Jezus zei tegen hem: Niemand die zijn hand aan de ploeg slaat en achterom kijkt, is geschikt voor het Koninkrijk van God.", "Spr 6:20-23": "Mijn zoon, bewaar het gebod van uw vader, en verlaat de wet van uw moeder niet. Bind ze voortdurend aan uw hart, hecht ze aan uw hals. Als u wandelt, zal dat u leiden; als u neerligt, zal het over u de wacht houden; als u wakker wordt, zal het met u spreken.", "Mark 4:7": "En het andere viel tussen de dorens, en de dorens groeiden op, en verstikten het, en het gaf geen vrucht.", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "Hebr 4:2": "Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was.", "Hand 7:50": "Heeft Mijn hand niet al deze dingen gemaakt?", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Matt 23:10-12": "Ook moet u geen meesters genoemd worden; want Eén is uw Meester, namelijk Christus. Maar de meeste onder u zal uw dienaar zijn. En wie zichzelf verhogen zal, die zal vernederd worden; en wie zichzelf zal vernederen, die zal verhoogd worden.", "Luk 20:37": "En dat de doden opgewekt zullen worden, heeft ook Mozes aangewezen bij de doornstruik, toen hij de Heere de God van Abraham noemt, en de God van Izak, en de God van Jakob.", "Spr 30:5": "Elk woord van God is doorlouterd; Hij is een Schild voor hen die op Hem vertrouwen.", "Ps 107:4": "Die in de woestijn dwaalden, op een weg door de wildernis, die geen stad vonden om in te wonen;", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "2 Kor 6:18": "en Ik zal u tot een Vader zijn, en u zult Mij tot zonen en dochters zijn, zegt de Heere, de Almachtige.", "Ps 69:24": "Laat hun ogen duister worden, dat zij niet zien; en doe hun heupen voortdurend waggelen.", "Amos 8:11-13": "Zie, de dagen komen, spreekt de Heere HEERE, dat Ik een honger in het land zal zenden; niet een honger naar brood, en geen dorst naar water, maar om de woorden van de HEERE te horen. En zij zullen zwerven van zee tot zee, en van het noorden tot het oosten; zij zullen rondlopen om het woord van de HEERE te zoeken, maar zullen het niet vinden. Op die dag zullen de mooie jonkvrouwen en de jongemannen van dorst versmachten;", "2 Kron 26:16": "Maar toen hij sterk geworden was, verhief zijn hart zich tot zijn eigen verderf, en hij overtrad tegen de HEERE, zijn God; want hij ging het tempel van de HEERE binnen, om te roken op het reukaltaar.", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Jes 10:23": "Want een verdelging, die vast besloten is, zal de Heere HEERE van de heerscharen doen in het midden van dit hele land.", "Jer 15:16": "Toen Uw woorden gevonden werden, heb ik ze opgegeten, en Uw woord is mij geweest tot vreugde en tot blijdschap van mijn hart; want ik ben naar Uw Naam genoemd, o HEERE, God van de heerscharen!", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Luk 12:30": "Want al deze dingen zoeken de volken van de wereld; maar uw Vader weet dat u deze dingen nodig hebt.", "Richt 9:15": "En de doornstruik zei tegen de bomen: Als u mij werkelijk tot koning over u zalft, kom dan en vertrouw u onder mijn schaduw; maar zo niet, laat er dan vuur uit de doornstruik komen en de ceders van de Libanon verteren.", "Job 37:17": "Hoe uw klederen warm worden, als Hij de aarde stil maakt vanuit het zuiden?", "Joh 10:34": "Jezus antwoordde hun: Staat er niet geschreven in uw wet: Ik heb gezegd, u bent goden?", "Luk 22:31": "En de Heere zei: Simon, Simon, zie, de satan heeft u dringend willen ziften als de tarwe;", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 107:35-38": "Hij maakt van de woestijn een waterpoel, en van het dorre land waterbronnen. En Hij doet de hongerigen daar wonen, en zij stichten een stad om in te wonen; En bezaaien akkers, en planten wijngaarden, die vrucht opbrengen.", "Luk 17:18": "En is er niemand gevonden die terugkeert om God eer te geven, dan deze vreemdeling?", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Ex 2:13": "De volgende dag ging hij er weer op uit, en zie, twee Hebreeuwse mannen waren aan het vechten; en hij zei tegen degene die ongelijk had: Waarom slaat u uw naaste?", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "Jer 48:29": "Wij hebben Moabs hoogmoed gehoord (hij is zeer hoogmoedig), zijn trots, en zijn hoogmoed, en zijn overmoed, en de hoogheid van zijn hart.", "1 Kon 9:6-9": "Maar als u zich helemaal afkeert, u en uw kinderen, van Mij, om Mij niet meer te volgen, en Mijn geboden en Mijn inzettingen, die Ik voor uw aangezicht gegeven heb, niet houdt, maar heengaat en andere goden dient, en u voor hen neerbuigt; Dan zal Ik Israël uitroeien van het land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen; en Israël zal tot een spreekwoord en spotrede zijn onder alle volken. En aangaande dit huis, dat verheven zal geweest zijn, ieder die eraan voorbijgaat zal zich ontzetten en fluiten; men zal zeggen: Waarom heeft de HEERE zo gedaan aan dit land en aan dit huis?", "Hebr 4:7": "bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.", "Rom 11:27": "En dit is hun een verbond van Mij, als Ik hun zonden zal wegnemen.", "Spr 15:10": "De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.", "Jes 11:10": "Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.", "1 Tim 6:17-19": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten; dat zij goed doen, rijk worden in goede werken, vrijgevig zijn en bereid om te delen; en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "Spr 14:13": "Het hart zal ook bij het lachen verdriet hebben; en het einde van die blijdschap is droefheid.", "Ps 95:11": "Daarom heb Ik in Mijn toorn gezworen: Zij zullen in Mijn rust niet ingaan!", "Ps 78:15": "Hij kliefde de rotsstenen in de woestijn, en drenkte hen overvloedig, als uit afgronden.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "Matt 2:15": "en hij was daar tot de dood van Herodes; opdat vervuld zou worden wat door de Heere gesproken is door de profeet: Uit Egypte heb Ik Mijn Zoon geroepen.", "Ps 94:12": "Gelukkig is de man, o HEERE! die Gij tuchtigt, en die Gij leert uit Uw wet,", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "Jer 2:7": "En Ik bracht u in een vruchtbaar land, om de vrucht ervan en het goede ervan te eten; maar toen u daarin kwam, verontreinigde u Mijn land, en maakte u Mijn erfenis tot een gruwel.", "Ezech 18:28": "Omdat hij toeziet, en zich bekeert van al zijn overtredingen, die hij gedaan heeft, zal hij zeker leven, hij zal niet sterven.", "Ezech 16:17-22": "Daarbij hebt u de voorwerpen van uw sieraad genomen, van Mijn goud en van Mijn zilver, dat Ik u gegeven had, en u hebt zich mannenbeelden gemaakt, en u hebt daarmee gehoereerd. En u hebt uw geborduurde kleren genomen, en hebt ze daarmee bedekt; en u hebt Mijn olie en Mijn reukwerk voor hun gezichten gezet. En Mijn brood, dat Ik u gaf, meelbloem en olie, en honing, waarmee Ik u voedde, dat hebt u ook voor hun gezichten gezet tot een liefelijke geur; zo is het gebeurd, spreekt de Heere HEERE.", "Ps 82:6": "Ik heb wel gezegd: U bent goden; en u bent allen kinderen van de Allerhoogste;", "Jak 2:6": "Maar u hebt de arme oneer aangedaan. Onderdrukken de rijken u niet, en trekken zij u niet voor de rechterstoelen?", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "Deut 8:12-14": "Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt; Uw hart zich dan verheft, zodat u de HEERE, uw God, vergeet, Die u uit Egypteland, uit het slavenhuis, uitgeleid heeft;", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "Num 15:38-40": "Spreek tot de kinderen van Israël en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken van hun kleren, bij hun geslachten; en op het snoertje van de hoek zullen zij een hemelsblauwe draad zetten. En het zal voor u aan de snoertjes zijn, opdat u het aanziet en aan al de geboden van de HEERE denkt en die doet; en dat u niet afdwaalt naar uw eigen hart en naar uw eigen ogen, waar u achteraan hoereert; Opdat u denkt aan en doet al Mijn geboden, en voor uw God heilig bent.", "Ps 32:3": "Toen ik zweeg, verouderden mijn beenderen, in mijn brullen de hele dag.", "Ps 78:17": "Nog gingen zij verder door tegen Hem te zondigen, waarmee zij de Allerhoogste verbitterden in de dorre wildernis.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Gen 28:20": "En Jakob deed een gelofte, en zei: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op deze weg die ik reis, en mij brood gegeven zal hebben om te eten, en kleren om aan te trekken;", "1 Kor 14:38": "Maar als iemand onwetend is, laat hij dan onwetend blijven.", "Spr 24:16": "Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad neerstruikelen.", "Jes 29:10": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.", "Rom 8:35-39": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Gen 3:17": "En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven.", "Job 27:3": "Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus;", "Spr 18:12": "Vóór de ondergang verheft zich het hart van de mens; en de nederigheid gaat vóór de eer.", "Ps 72:16": "Is er een handvol koren in het land op de hoogte van de bergen, de vrucht daarvan zal ruisen als de Libanon; en die van de stad zullen bloeien als het kruid van de aarde.", "Jes 55:3": "Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Spr 16:19": "Het is beter nederig van geest te zijn met de zachtmoedigen, dan buit te delen met de hoogmoedigen.", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "Ps 94:11": "De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "1 Joh 2:16": "Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld.", "Deut 15:6": "Want de HEERE, uw God, zal u zegenen, zoals Hij tot u heeft gesproken; zo zult u aan veel volken lenen, maar u zult niet lenen; en u zult over veel volken heersen, maar over u zullen zij niet heersen.", "Ps 2:1": "Waarom woeden de heidenen, en bedenken de volken iets zinloos?", "Joh 12:15": "Vrees niet, dochter van Sion, zie, uw Koning komt, zittend op het veulen van een ezelin.", "Ps 125:5": "Maar die zich neigen tot hun kromme wegen, die zal de HEERE weg doen gaan met de werkers van de ongerechtigheid. Vrede zal over Israël zijn!", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Ex 16:4-35": "Toen zei de HEERE tegen Mozes: Zie, Ik zal voor u brood uit de hemel laten regenen; en het volk zal uitgaan en verzamelen wat het op elke dag nodig heeft; opdat Ik het beproef, of het naar Mijn wet leeft of niet. En het zal gebeuren op de zesde dag, dat zij klaarmaken wat zij ingebracht zullen hebben; dat zal dubbel zijn boven wat zij dagelijks verzamelen. Toen zeiden Mozes en Aäron tegen alle Israëlieten: Vanavond zult u weten dat de HEERE u uit Egypte geleid heeft;", "Num 20:11": "Toen hief Mozes zijn hand op, en hij sloeg de steenrots tweemaal met zijn staf; en er kwam veel water uit, zodat de vergadering dronk, en haar beesten.", "Ezech 20:37": "En Ik zal u onder de roede laten doorgaan, en Ik zal u brengen onder de band van het verbond.", "Ps 118:22": "De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Ezech 44:5": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Pred 7:12": "Want de wijsheid is tot een schaduw, en het geld is tot een schaduw; maar de uitnemendheid van de wetenschap is, dat de wijsheid haar bezitters het leven geeft.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Num 11:6-10": "Maar nu is onze ziel dor, er is helemaal niets, behalve dit manna voor onze ogen! Het manna nu was als korianderzaad, en zijn kleur was als de kleur van de bedolach. Het volk liep hier en daar, en verzamelde het, en maalde het met molens, of stampte het in vijzels, en kookte het in potten, en maakte er koeken van; en zijn smaak was als de smaak van de beste vochtigheid van de olie.", "Ps 21:4-6": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud. Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos. Groot is zijn eer door Uw heil; majesteit en heerlijkheid hebt U hem toegevoegd.", "Ps 91:1-16": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige. Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw! Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie.", "Ps 119:70": "Hun hart is vet als smeer; maar ik heb vermaak in Uw wet.", "Ef 2:12": "dat u in die tijd was zonder Christus, vervreemd van het burgerschap van Israël, en vreemdelingen van de verbonden van de belofte, geen hoop hebbend, en zonder God in de wereld.", "Hebr 6:5": "en het goede woord van God geproefd hebben, en de krachten van de toekomende eeuw,", "Jes 40:3": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God!", "Matt 8:17": "opdat vervuld zou worden wat gesproken was door de profeet Jesaja, die zei: Hij heeft onze ziekten op Zich genomen, en onze kwalen gedragen.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Hand 2:25-28": "Want David zegt van Hem: Ik zag de Heere altijd voor mij; want Hij is aan mijn rechterhand, opdat ik niet bewogen zou worden. Daarom is mijn hart verblijd, en mijn tong verheugt zich; ja, ook mijn vlees zal rusten in hoop; Want U zult mijn ziel niet verlaten in het rijk van de dood, en Uw Heilige zult U niet overgeven om verderving te zien.", "Jer 2:17": "Doet u dit niet zelf, doordat u de HEERE, uw God, verlaat, ten tijde als Hij u op de weg leidt?", "1 Petr 3:10-12": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen. Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Hand 7:7": "En het volk dat zij zullen dienen, zal Ik oordelen, zei God; en daarna zullen zij uitgaan, en zij zullen Mij dienen op deze plaats.", "Jes 35:7": "En het dorre land zal tot staand water worden, en het dorstige land tot springaders van wateren; in de woningen van de draken, waar zij gelegen hebben, zal gras met riet en biezen zijn.", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "1 Kor 10:3": "en zij hebben allen hetzelfde geestelijke voedsel gegeten;", "Ps 106:44": "Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde.", "Deut 31:9-13": "En Mozes schreef deze wet, en gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël. En Mozes gebood hun: Aan het einde van elke zeven jaar, op de vastgestelde tijd van het jaar van de vrijlating, op het feest van de loofhutten, wanneer heel Israël zal komen om te verschijnen voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen, zult u deze wet voorlezen voor heel Israël, ten aanhoren van hen;", "2 Kron 25:19": "U zegt: Zie, ik heb de Edomieten geslagen; daarom heeft uw hart u verheven om te roemen; blijf nu in uw huis; waarom zou u zich in het kwaad mengen, zodat u zou vallen, u en Juda met u?", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Openb 2:5": "Bedenk dan waarvan u uitgevallen bent, en bekeer u, en doe de eerste werken; en zo niet, Ik zal u haastig bij komen, en zal uw kandelaar van zijn plaats wegnemen, als u zich niet bekeert.", "Jes 14:12-16": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! hoe bent u ter aarde neergehouwen, u die de heidenvolken verzwakte! En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden. Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "Joh 9:2": "En Zijn discipelen vroegen Hem: Rabbi, wie heeft er gezondigd, deze man of zijn ouders, dat hij blind geboren zou worden?", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "Matt 5:17": "Denk niet dat Ik gekomen ben om de wet of de profeten af te schaffen; Ik ben niet gekomen om die af te schaffen, maar om te vervullen.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Jer 5:24": "En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; Die voor ons de weken, de vastgestelde tijden van de oogst, bewaart.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Luk 7:27": "Deze is het, over wie geschreven is: Zie, Ik zend Mijn engel voor Uw aangezicht uit, die Uw weg voor U klaar zal maken.", "Hebr 2:18": "Want doordat Hij Zelf, beproefd zijnde, geleden heeft, kan Hij hun die beproefd worden, te hulp komen.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "Rom 9:26": "En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.", "Deut 32:46": "Zei hij tegen hen: Zet uw hart op al de woorden, die ik heden onder u betuig, dat u ze uw kinderen gebieden zult, dat zij nauwlettend zullen doen al de woorden van deze wet.", "Ex 16:2": "En de hele gemeenschap van de Israëlieten morde tegen Mozes en tegen Aäron, in de woestijn.", "Mark 12:26": "Maar wat de doden betreft, dat zij opgewekt zullen worden: hebt u niet gelezen in het boek van Mozes, hoe God in de doornstruik tot hem gesproken heeft: Ik ben de God van Abraham, en de God van Izak, en de God van Jakob?", "Luk 24:32": "En zij zeiden tegen elkaar: Was ons hart niet brandend in ons, toen Hij onderweg tot ons sprak, en toen Hij ons de Schriften opende?", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Luk 14:8": "Wanneer u door iemand op een bruiloft genodigd wordt, ga dan niet op de eerste plaats zitten; anders zou misschien iemand die voornamer is dan u door hem genodigd zijn,", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "Hebr 1:13": "En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?", "Ps 107:17-19": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden; Hun ziel gruwde van alle voedsel, en zij waren tot aan de poorten van de dood gekomen. Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "2 Kron 25:18": "Maar Joas, de koning van Israël, zond tot Amazia, de koning van Juda, om te zeggen: De distel die op de Libanon is, zond tot de ceder die op de Libanon is, om te zeggen: Geef uw dochter aan mijn zoon tot vrouw; maar het gedierte van het veld, dat op de Libanon is, kwam voorbij, en vertrapte de distel.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Joh 2:22": "Daarom, toen Hij opgestaan was uit de doden, herinnerden Zijn discipelen zich dat Hij dit tegen hen had gezegd, en zij geloofden de Schrift en het woord dat Jezus gesproken had.", "Matt 18:6-9": "Maar wie een van deze kleinen die in Mij geloven, doet struikelen, voor hem zou het beter zijn dat een molensteen aan zijn hals gehangen werd en dat hij in de diepte van de zee verzonken werd. Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden.", "Gen 8:22": "Voortaan, al de dagen van de aarde, zullen zaaiing en oogst, en koude en hitte, en zomer en winter, en dag en nacht niet ophouden.", "Jes 26:16": "HEERE, in benauwdheid hebben zij U bezocht; zij hebben hun stil gebed uitgestort, toen Uw tuchtiging over hen was.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Ps 22:19": "Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Jak 2:7": "Lasteren zij niet de goede naam die over u aangeroepen is?", "Job 37:24": "Daarom vrezen de mensen Hem; Hij ziet geen enkele wijze van hart aan.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.", "Luk 17:17": "En Jezus antwoordde en zei: Zijn niet de tien gereinigd? Maar waar zijn de negen?", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "1 Kor 10:31": "Of u dus eet, of drinkt, of iets anders doet, doe alles tot eer van God.", "Ps 119:45-52": "En ik zal wandelen in de ruimte, omdat ik Uw bevelen gezocht heb. Ook zal ik voor koningen spreken van Uw getuigenissen, en mij niet schamen. En ik zal mij vermaken in Uw geboden, die ik liefheb.", "Ps 44:21": "Als wij de Naam van onze God hadden vergeten, en onze handen tot een vreemde god uitgebreid,", "Ps 104:4": "Hij maakt Zijn engelen geesten, Zijn dienaars tot een vlammend vuur.", "Luk 1:52": "Hij heeft machtigen van de tronen afgezet, en nederigen heeft Hij verhoogd.", "Dan 6:23": "Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "2 Kron 7:13": "Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend;", "Ps 91:11": "Want Hij zal Zijn engelen aangaande u bevelen, dat zij u bewaren op al uw wegen.", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "1 Petr 4:12": "Geliefden, houd u niet vreemd over de hitte van de verdrukking onder u, die u overkomt tot beproeving, alsof u iets vreemds overkwam;", "Job 42:5": "Met het gehoor van het oor heb ik U gehoord; maar nu ziet mijn oog U.", "Rom 10:20": "En Jesaja durft het aan, en zegt: Ik ben gevonden door hen die Mij niet zochten; Ik ben openbaar geworden aan hen die naar Mij niet vroegen.", "Deut 4:8": "En welk groot volk is er, dat zulke rechtvaardige inzettingen en rechten heeft als deze hele wet, die ik vandaag voor u leg?", "1 Kor 13:4": "De liefde is geduldig, zij is vriendelijk; de liefde is niet afgunstig; de liefde handelt niet lichtvaardig, zij is niet opgeblazen;", "1 Sam 15:22": "Doch Samuël zei: Heeft de HEERE evenveel behagen in brandoffers en slachtoffers, als in het gehoorzamen aan de stem van de HEERE? Zie, gehoorzamen is beter dan slachtoffer, opmerken beter dan het vet van rammen.", "Rom 14:6": "Hij die de dag in acht neemt, neemt hem in acht voor de Heere; en hij die de dag niet in acht neemt, neemt hem niet in acht voor de Heere. Hij die eet, eet dat voor de Heere, want hij dankt God; en hij die niet eet, eet dat niet voor de Heere, en hij dankt God.", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Ex 15:25": "Hij dan riep tot de HEERE; en de HEERE wees hem een stuk hout, dat wierp hij in het water; toen werd het water zoet. Daar stelde Hij het volk een inzetting en recht, en daar beproefde Hij hen,", "Hebr 2:1-3": "Daarom moeten wij ons des te meer houden aan wat wij gehoord hebben, opdat wij het niet op enig moment laten wegglijden. Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft, hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Deut 10:18": "Die het recht van de wees en van de weduwe doet; en de vreemdeling liefheeft, door hem brood en kleding te geven.", "Jes 40:3-5": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God! Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden. En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Ef 4:8": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H4687\">Alle</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4687\">geboden</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3117\">die</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3117\">ik</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3117\">u</span> vandaag <span class=\"wl\" data-l=\"L3\" data-code=\"H6680\">gebied</span>, moet <span class=\"wl\" data-l=\"L4\" data-code=\"H8104\">u</span> nauwkeurig opvolgen, <span class=\"wl\" data-l=\"L5\" data-code=\"H2421\">opdat</span> u <span class=\"wl\" data-l=\"L5\" data-code=\"H2421\">leeft</ class=\"wl wl-kjv\" data-code=\"H430\">God:</span> for it is he that <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> thee <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">get</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">wealth,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H6965\">establish</span> his <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> which he <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> as it is this day.", "19": "And it shall be, if thou do at <span class=\"wl wl-kjv\" data-code=\"H7911\">all</span> <span class=\"wl wl-kjv\" data-code=\"H7911\">forget</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> them, and <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> them, I <span class=\"wl wl-kjv\" data-code=\"H5749\">testify</span> against you this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that ye shall <span class=\"wl wl-kjv\" data-code=\"H6\">surely</span> perish.", "20": "As the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6\">destroyeth</span> before your <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> so shall ye <span class=\"wl wl-kjv\" data-code=\"H6\">perish;</span> <span class=\"wl wl-kjv\" data-code=\"H6118\">because</span> ye would not be <span class=\"wl wl-kjv\" data-code=\"H8085\">obedient</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';

      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';

        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';

    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';

      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
