"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Dit zijn de woorden die Mozes tot heel Israël gesproken heeft, aan deze kant van de Jordaan, in de woestijn, op het vlakke veld tegenover Suf, tussen Paran en Tofel, en Laban, en Hazeroth, en Dizahab.","2":"Elf dagreizen is het van Horeb, via de weg van het gebergte Seïr, tot aan Kades-Barnea.","3":"En het gebeurde in het veertigste jaar, in de elfde maand, op de eerste dag van de maand, dat Mozes sprak tot de kinderen van Israël, naar alles wat de HEERE hem voor hen bevolen had;","4":"nadat hij Sihon, de koning van de Amorieten, die in Hesbon woonde, verslagen had, en Og, de koning van Bazan, die in Astharoth woonde, bij Edreï.","5":"Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:","6":"De HEERE, onze God, sprak tot ons bij Horeb, en zei: U bent lang genoeg bij deze berg gebleven.","7":"Keer u om, vertrek, en ga naar het gebergte van de Amorieten, en naar al hun buren, in het vlakke veld, op het gebergte, en in de laagte, en in het zuiden, en aan de kust van de zee; het land van de Kanaänieten, en de Libanon, tot aan die grote rivier, de rivier de Eufraat.","8":"Zie, Ik heb dat land aan u gegeven; ga erin, en bezit erfelijk het land, dat de HEERE aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft dat Hij het hun en hun nageslacht na hen geven zou.","9":"En ik sprak in die tijd tot u, en zei: Ik alleen kan u niet dragen.","10":"De HEERE, uw God, heeft u talrijk gemaakt, en zie, u bent vandaag zo talrijk als de sterren aan de hemel.","11":"De HEERE, de God van uw vaderen, maakt u, zoals u *nu* bent, duizend keer talrijker, en Hij zegent u, zoals Hij tot u gesproken heeft!","12":"Hoe zou ik alleen uw moeite, en uw last, en uw geschillen dragen?","13":"Neem voor u wijze, verstandige en ervaren mannen, uit uw stammen, zodat ik hen tot uw hoofden stel.","14":"Toen antwoordde u mij, en zei: Dit woord dat u gesproken hebt, is goed om te doen.","15":"Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen.","16":"En ik gebood in die tijd uw rechters, en zei: Hoor *de geschillen* tussen uw broeders, en oordeel rechtvaardig tussen de man en zijn broeder, en zijn vreemdeling.","17":"U zult in het gericht niemand voortrekken; u zult de kleine, evenals de grote, horen; u zult voor niemands aangezicht bang zijn; want het gericht is van God; maar de zaak die voor u te zwaar zal zijn, zult u naar mij laten komen, en ik zal die horen.","18":"Zo gebood ik u in die tijd alle zaken die u zou doen.","19":"Toen vertrokken wij van Horeb, en trokken door die hele grote en vreselijke woestijn, die u gezien hebt, op de weg van het gebergte van de Amorieten, zoals de HEERE, onze God, ons geboden had; en wij kwamen bij Kades-Barnea.","20":"Toen zei ik tot u: U bent gekomen bij het gebergte van de Amorieten, dat de HEERE, onze God, ons geven zal.","21":"Zie, de HEERE, uw God, heeft dat land aan u gegeven; trek op, bezit het erfelijk, zoals de HEERE, de God van uw vaderen, tot u gesproken heeft; wees niet bang, en wees niet ontmoedigd.","22":"Toen kwam u allen dichterbij mij, en zei: Laten wij mannen voor ons uit sturen, die het land voor ons verkennen, en ons bericht terugbrengen, welke weg wij daarin op moeten trekken, en tot welke steden wij zullen komen.","23":"Deze zaak nu was goed in mijn ogen; zo nam ik uit u twaalf mannen, van elke stam een man.","24":"Die keerden zich om, en trokken op naar het gebergte, en kwamen bij het dal Eskol, en verkenden dat.","25":"En zij namen van de vrucht van het land in hun hand, en brachten die naar ons toe, en brachten ons bericht terug, en zeiden: Het land, dat de HEERE, onze God, ons geven zal, is goed.","26":"Maar u wilde niet optrekken; maar u kwam tegen het bevel van de HEERE, uw God, in opstand.","27":"En u mopperde in uw tenten, en zei: Omdat de HEERE ons haat, heeft Hij ons uit het land Egypte weggevoerd, om ons in de hand van de Amorieten te leveren, om ons te verdelgen.","28":"Waarheen zouden wij optrekken? Onze broeders hebben ons hart doen smelten, en zeiden: Het is een volk, groter en langer dan wij; de steden zijn groot, en versterkt tot aan de hemel toe; ook hebben wij daar kinderen van de Enakieten gezien.","29":"Toen zei ik tot u: Wees niet verschrikt, en wees niet bang voor hen.","30":"De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.","31":"En in de woestijn, waar u gezien hebt dat de HEERE, uw God, u gedragen heeft, zoals een man zijn zoon draagt, op heel de weg die u gegaan bent, totdat u kwam bij deze plaats.","32":"Maar ondanks dit woord geloofde u niet in de HEERE, uw God.","33":"Die voor u uit op de weg ging, om voor u de plaats uit te zoeken waar u zou legeren; 's nachts in het vuur, om u de weg te wijzen waarin u zou gaan, en overdag in de wolk.","34":"Toen de HEERE de stem van uw woorden hoorde, werd Hij zeer toornig, en zwoer, en zei:","35":"Voorzeker zal niemand van deze mannen, van dit slechte geslacht, dat goede land zien, dat Ik gezworen heb aan uw vaderen te zullen geven!","36":"Behalve Kaleb, de zoon van Jefunne; die zal het zien, en aan hem zal Ik het land geven waarop hij getreden heeft, en aan zijn kinderen; omdat hij volhard heeft de HEERE te volgen.","37":"Ook werd de HEERE toornig op mij vanwege u, en zei: Ook u zult daar niet ingaan.","38":"Jozua, de zoon van Nun, die voor u staat, die zal daar ingaan; sterk hem, want hij zal het aan Israël doen erven.","39":"En uw kinderen, van wie u zei: Zij zullen tot een buit zijn; en uw kinderen, die vandaag nog geen goed noch kwaad kennen, die zullen daar ingaan, en aan hen zal Ik het geven, en zij zullen het erfelijk bezitten.","40":"U daarentegen, keer u om, en reis naar de woestijn, de weg van de Schelfzee.","41":"Toen antwoordde u, en zei tot mij: Wij hebben tegen de HEERE gezondigd; wij zullen optrekken en strijden, naar alles wat de HEERE, onze God, ons geboden heeft. Toen u nu ieder zijn oorlogswapens omgordde, en er klaar voor was om naar het gebergte op te trekken,","42":"zei de HEERE tot mij: Zeg hun: Trek niet op, en strijd niet, want Ik ben niet in uw midden; anders wordt u door uw vijanden verslagen.","43":"Toen ik nu tot u sprak, luisterde u niet, maar u kwam tegen het bevel van de HEERE in opstand, en handelde trots, en trok op naar het gebergte.","44":"Toen trokken de Amorieten, die op dat gebergte woonden, op u af, en achtervolgden u, zoals bijen doen; en zij verpletterden u in Seïr tot Horma toe.","45":"Toen u terugkwam en huilde voor het aangezicht van de HEERE, luisterde de HEERE niet naar uw stem, en neigde Zijn oren niet tot u.","46":"Zo bleef u in Kades vele dagen, zo lang als u daar bleef."},"SV":{"1":"Dit zijn de woorden, die Mozes tot gans Israël gesproken heeft, aan deze zijde van de Jordaan, in de woestijn, op het vlakke veld tegenover Suf, tussen Paran en tussen Tofel, en Laban, en Hazeroth, en Dizahab.","2":"Elf dag *reizen* zijn het van Horeb, *door* den weg van het gebergte Seir, tot aan Kades-barnea.","3":"En het is geschied in het veertigste jaar, in de elfde maand, op den eersten der maand, dat Mozes sprak tot de kinderen Israëls, naar alles wat hem de HEERE aan hen bevolen had;","4":"Nadat hij geslagen had Sihon, den koning der Amorieten, die te Hesbon woonde, en Og, den koning van Bazan, welke woonde in Astharoth, te Edrei.","5":"Aan deze zijde van de Jordaan, in het land van Moab, hief Mozes aan, deze wet uit te leggen, zeggende:","6":"De HEERE, onze God, sprak tot ons aan Horeb, zeggende: Gij zijt lang genoeg bij dezen berg gebleven.","7":"Keert u, en vertrekt, en gaat in het gebergte der Amorieten, en tot al hun geburen, in het vlakke veld, op het gebergte, en in de laagte, en in het zuiden, en aan de havens der zee; het land der Kanaänieten, en den Libanon, tot aan die grote rivier, de rivier Frath.","8":"Ziet, Ik heb dat land gegeven voor uw aangezicht; gaat daarin, en bezit erfelijk het land, dat de HEERE aan uw vaderen, Abraham, Izak en Jakob gezworen heeft, dat Hij het hun en hun zaad na hen geven zou.","9":"En ik sprak ter zelfder tijd tot u, zeggende: Ik alleen zal u niet kunnen dragen.","10":"De HEERE, uw God, heeft u vermenigvuldigd, en ziet, gij zijt heden als de sterren des hemels in menigte.","11":"De HEERE, uwer vaderen God, doe tot u, zo als gij *nu* zijt, duizendmaal meer, en Hij zegene u, gelijk als Hij tot u gesproken heeft!","12":"Hoe zoude ik alleen uw moeite, en uw last, en uw twistzaken dragen?","13":"Neemt u wijze, en verstandige, en ervarene mannen, van uw stammen, dat ik hen tot uw hoofden stelle.","14":"Toen antwoorddet gij mij, en zeidet: Dit woord is goed, dat gij gesproken hebt, om te doen.","15":"Zo nam ik de hoofden uwer stammen, wijze en ervarene mannen, en stelde hen tot hoofden over u, oversten van duizenden, en oversten van honderden, en oversten van vijftigen, en oversten van tienen, en ambtlieden voor uw stammen.","16":"En ik gebood uw rechters ter zelfder tijd, zeggende: Hoort *de* *verschillen* tussen uw broederen, en richt recht tussen den man en tussen zijn broeder, en tussen deszelfs vreemdeling.","17":"Gij zult het aangezicht in het gericht niet kennen; gij zult den kleine, zowel als den grote, horen; gij zult niet vrezen voor iemands aangezicht; want het gericht is Godes; doch de zaak, die voor u te zwaar zal zijn, zult gij tot mij doen komen, en ik zal ze horen.","18":"Alzo gebood ik u te dier tijd alle zaken, die gij zoudt doen.","19":"Toen vertogen wij van Horeb, en doorwandelden die gans grote en vreselijke woestijn, die gij gezien hebt, op den weg van het gebergte der Amorieten, gelijk de HEERE, onze God, ons geboden had; en wij kwamen tot Kades-barnea.","20":"Toen zeide ik tot ulieden: Gij zijt gekomen tot het gebergte der Amorieten, dat de HEERE, onze God, ons geven zal.","21":"Ziet, de HEERE, uw God, heeft dat land gegeven voor uw aangezicht; trekt op, bezit het erfelijk, gelijk als de HEERE, uwer vaderen God, tot u gesproken heeft; vreest niet, en ontzet u niet.","22":"Toen naderdet gij allen tot mij, en zeidet: Laat ons mannen voor ons aangezicht heenzenden, die ons het land uitspeuren, en ons bescheid wederbrengen, wat weg wij daarin optrekken zullen, en tot wat steden wij komen zullen.","23":"Deze zaak nu was goed in mijn ogen; zo nam ik uit u twaalf mannen, van elken stam een man.","24":"Die keerden zich, en togen op naar het gebergte, en kwamen tot het dal Eskol, en verspiedden datzelve.","25":"En zij namen van de vrucht des lands in hun hand, en brachten ze tot ons af, en zeiden ons bescheid weder, en zeiden: Het land, dat de HEERE, onze God, ons geven zal, is goed.","26":"Doch gij wildet niet optrekken; maar gij waart den mond des HEEREN uws Gods, wederspannig.","27":"En gij murmureerdet in uw tenten, en zeidet: Omdat de HEERE ons haat, heeft Hij ons uit Egypteland uitgevoerd, opdat Hij ons levere in de hand der Amorieten, om ons te verdelgen.","28":"Waarheen zouden wij optrekken? Onze broeders hebben ons hart doen smelten, zeggende: Het is een volk, groter en langer dan wij; de steden zijn groot, en gesterkt tot in den hemel toe; ook hebben wij daar kinderen der Enakieten gezien.","29":"Toen zeide ik tot u: Verschrikt niet, en vreest niet voor hen.","30":"De HEERE, uw God, Die voor uw aangezicht wandelt, Die zal voor u strijden, naar alles, wat Hij bij u voor uw ogen gedaan heeft in Egypte.","31":"En in de woestijn, waar gij gezien hebt, dat de HEERE uw God, u daarin gedragen heeft, als een man zijn zoon draagt, op al den weg, dien gij gewandeld hebt, totdat gij kwaamt aan deze plaats.","32":"Maar door dit woord geloofdet gij niet aan den HEERE, uw God.","33":"Die voor uw aangezicht op den weg wandelde, om u de plaats uit te zien, waar gij zoudt legeren; des nachts in het vuur, opdat Hij u den weg wees, waarin gij zoudt gaan, en des daags in de wolk.","34":"Als nu de HEERE de stem uwer woorden hoorde, zo werd Hij zeer toornig, en zwoer, zeggende:","35":"Zo iemand van deze mannen, *van* dit kwade geslacht, zal zien dat goede land, hetwelk Ik gezworen heb uw vaderen te zullen geven!","36":"Behalve Kaleb, de zoon van Jefunne; die zal het zien, en aan hem zal Ik het land geven, waarop hij getreden heeft, en aan zijn kinderen; omdat hij volhard heeft den HEERE te volgen.","37":"Ook vertoornde zich de HEERE op mij om uwentwil, zeggende: Gij zult daar ook niet inkomen.","38":"Jozua, de zoon van Nun, die voor uw aangezicht staat, die zal daarin komen; sterk denzelven, want hij zal het Israël doen erven.","39":"En uw kinderkens, waarvan gij zeidet: Zij zullen tot een roof zijn; en uw kinderen, die heden noch goed noch kwaad weten, die zullen daarin komen, en dien zal Ik het geven, en die zullen het erfelijk bezitten.","40":"Gij daarentegen, keert u, en reist naar de woestijn, den weg van de Schelfzee.","41":"Toen antwoorddet gij, en zeidet tot mij: Wij hebben tegen den HEERE gezondigd; wij zullen optrekken, en strijden, naar alles, wat de HEERE, onze God, ons geboden heeft. Als gij nu een iegelijk zijn krijgsgereedschap aangorddet, en willens waart, om naar het gebergte henen op te trekken,","42":"Zo zeide de HEERE tot mij: Zeg hun: Trekt niet op, en strijdt niet, want Ik ben niet in het midden van u; opdat gij niet voor het aangezicht uwer vijanden geslagen wordet.","43":"Doch als ik tot u sprak, zo hoordet gij niet, maar waart den mond des HEEREN wederspannig, en handeldet trotselijk, en toogt op naar het gebergte.","44":"Toen togen de Amorieten uit, die op dat gebergte woonden, u tegemoet, en vervolgden u, gelijk als de bijen doen; en zij verpletterden u in Seir tot Horma toe.","45":"Als gij nu wederkwaamt en weendet voor het aangezicht des HEEREN, zo verhoorde de HEERE uw stem niet, en neigde Zijn oren niet tot u.","46":"Alzo bleeft gij in Kades vele dagen, naar de dagen, dat gij er bleeft."},"KJV":{"1":"These *be* the words which Moses spake unto all Israel on this side Jordan in the wilderness, in the plain over against the Red *sea*, between Paran, and Tophel, and Laban, and Hazeroth, and Dizahab.","2":"(*There are* eleven days' *journey* from Horeb by the way of mount Seir unto Kadeshbarnea.)","3":"And it came to pass in the fortieth year, in the eleventh month, on the first *day* of the month, *that* Moses spake unto the children of Israel, according unto all that the LORD had given him in commandment","4":"After he had slain Sihon the king of the Amorites, which dwelt in Heshbon, and Og the king of Bashan, which dwelt at Astaroth in Edrei:","5":"On this side Jordan, in the land of Moab, began Moses to declare this law, saying,","6":"The LORD our God spake unto us in Horeb, saying, Ye have dwelt long enough in this mount:","7":"Turn you, and take your journey, and go to the mount of the Amorites, and unto all *the places* nigh thereunto, in the plain, in the hills, and in the vale, and in the south, and by the sea side, to the land of the Canaanites, and unto Lebanon, unto the great river, the river Euphrates.","8":"Behold, I have set the land before you: go in and possess the land which the LORD sware unto your fathers, Abraham, Isaac, and Jacob, to give unto them and to their seed after","9":"And I spake unto you at that time, saying, I am not able to bear you myself alone:","10":"The LORD your God hath multiplied you, and, behold, ye *are* this day as the stars of heaven for multitude.","11":"(The LORD God of your fathers make you a thousand times so many more as ye *are*, and bless you, as he hath promised","12":"How can I myself alone bear your cumbrance, and your burden, and your strife?","13":"Take you wise men, and understanding, and known among your tribes, and I will make them rulers","14":"And ye answered me, and said, The thing which thou hast spoken *is* good *for us* to do.","15":"So I took the chief of your tribes, wise men, and known, and made them heads over you, captains over thousands, and captains over hundreds, and captains over fifties, and captains over tens, and officers among your tribes.","16":"And I charged your judges at that time, saying, Hear *the causes* between your brethren, and judge righteously between *every* man and his brother, and the stranger","17":"Ye shall not respect persons in judgment; *but* ye shall hear the small as well as the great; ye shall not be afraid of the face of man; for the judgment *is* God's: and the cause that is too hard for you, bring *it* unto me, and I will hear","18":"And I commanded you at that time all the things which ye should do.","19":"And when we departed from Horeb, we went through all that great and terrible wilderness, which ye saw by the way of the mountain of the Amorites, as the LORD our God commanded us; and we came to Kadeshbarnea.","20":"And I said unto you, Ye are come unto the mountain of the Amorites, which the LORD our God doth give","21":"Behold, the LORD thy God hath set the land before thee: go up *and* possess *it*, as the LORD God of thy fathers hath said unto thee; fear not, neither be discouraged.","22":"And ye came near unto me every one of you, and said, We will send men before us, and they shall search us out the land, and bring us word again by what way we must go up, and into what cities we shall come.","23":"And the saying pleased me well: and I took twelve men of you, one of a tribe:","24":"And they turned and went up into the mountain, and came unto the valley of Eshcol, and searched it out.","25":"And they took of the fruit of the land in their hands, and brought *it* down unto us, and brought us word again, and said, *It is* a good land which the LORD our God doth give","26":"Notwithstanding ye would not go up, but rebelled against the commandment of the LORD your God:","27":"And ye murmured in your tents, and said, Because the LORD hated us, he hath brought us forth out of the land of Egypt, to deliver us into the hand of the Amorites, to destroy","28":"Whither shall we go up? our brethren have discouraged our heart, saying, The people *is* greater and taller than we; the cities *are* great and walled up to heaven; and moreover we have seen the sons of the Anakims","29":"Then I said unto you, Dread not, neither be afraid","30":"The LORD your God which goeth before you, he shall fight for you, according to all that he did for you in Egypt before your eyes;","31":"And in the wilderness, where thou hast seen how that the LORD thy God bare thee, as a man doth bear his son, in all the way that ye went, until ye came into this place.","32":"Yet in this thing ye did not believe the LORD your God,","33":"Who went in the way before you, to search you out a place to pitch your tents *in*, in fire by night, to shew you by what way ye should go, and in a cloud by day.","34":"And the LORD heard the voice of your words, and was wroth, and sware, saying,","35":"Surely there shall not one of these men of this evil generation see that good land, which I sware to give unto your fathers,","36":"Save Caleb the son of Jephunneh; he shall see it, and to him will I give the land that he hath trodden upon, and to his children, because he hath wholly followed the LORD.","37":"Also the LORD was angry with me for your sakes, saying, Thou also shalt not go in thither.","38":"*But* Joshua the son of Nun, which standeth before thee, he shall go in thither: encourage him: for he shall cause Israel to inherit","39":"Moreover your little ones, which ye said should be a prey, and your children, which in that day had no knowledge between good and evil, they shall go in thither, and unto them will I give it, and they shall possess","40":"But *as for* you, turn you, and take your journey into the wilderness by the way of the Red sea.","41":"Then ye answered and said unto me, We have sinned against the LORD, we will go up and fight, according to all that the LORD our God commanded us. And when ye had girded on every man his weapons of war, ye were ready to go up into the hill.","42":"And the LORD said unto me, Say unto them, Go not up, neither fight; for I *am* not among you; lest ye be smitten before your enemies.","43":"So I spake unto you; and ye would not hear, but rebelled against the commandment of the LORD, and went presumptuously up into the hill.","44":"And the Amorites, which dwelt in that mountain, came out against you, and chased you, as bees do, and destroyed you in Seir, *even* un lass=\"wl wl-kjv\" data-code=\"H8141\">year,</span> in the <span class=\"wl wl-kjv\" data-code=\"H6249\">eleventh</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> on the <span class=\"wl wl-kjv\" data-code=\"H259\">first</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> that <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> according unto all that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had given him in commandment","4":"<span class=\"wl wl-kjv\" data-code=\"H310\">After</span> he had <span class=\"wl wl-kjv\" data-code=\"H5221\">slain</span> <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon,</span> and <span class=\"wl wl-kjv\" data-code=\"H5747\">Og</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H1316\">Bashan,</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> at <span class=\"wl wl-kjv\" data-code=\"H6252\">Astaroth</span> in Edrei:","5":"On this <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> <span class=\"wl wl-kjv\" data-code=\"H2974\">began</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> to <span class=\"wl wl-kjv\" data-code=\"H874\">declare</span> this <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> saying,","6":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto us in <span class=\"wl wl-kjv\" data-code=\"H2722\">Horeb,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Ye have <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> long <span class=\"wl wl-kjv\" data-code=\"H7227\">enough</span> in this mount:","7":"<span class=\"wl wl-kjv\" data-code=\"H6437\">Turn</span> you, and take your <span class=\"wl wl-kjv\" data-code=\"H5265\">journey,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> and unto all the places <span class=\"wl wl-kjv\" data-code=\"H7934\">nigh</span> thereunto, in the <span class=\"wl wl-kjv\" data-code=\"H6160\">plain,</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">hills,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H8219\">vale,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5045\">south,</span> and by the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> <span class=\"wl wl-kjv\" data-code=\"H2348\">side,</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> Euphrates.","8":"<span class=\"wl wl-kjv\" data-code=\"H7200\">Behold,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you: <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> in and <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto them and to their <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> after","9":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto you at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I am not <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> you myself alone:","10":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied</span> you, and, behold, ye are this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> as the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> for multitude.","11":"(The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> make you a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times</span> so many more <span class=\"wl wl-kjv\" data-code=\"H3254\">as</span> ye are, and <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> you, as he hath promised","12":"<span class=\"wl wl-kjv\" data-code=\"H349\">How</span> can I myself alone <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> your <span class=\"wl wl-kjv\" data-code=\"H2960\">cumbrance,</span> and your <span class=\"wl wl-kjv\" data-code=\"H4853\">burden,</span> and your strife?","13":"<span class=\"wl wl-kjv\" data-code=\"H3051\">Take</span> you <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H995\">understanding,</span> and <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> among your <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> them rulers","14":"And ye <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> me, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> for us to do.","15":"So I <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of your <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes,</span> <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H3045\">known,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> them <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> over you, <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> over <span class=\"wl wl-kjv\" data-code=\"H505\">thousands,</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> over <span class=\"wl wl-kjv\" data-code=\"H3967\">hundreds,</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> over <span class=\"wl wl-kjv\" data-code=\"H2572\">fifties,</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> over <span class=\"wl wl-kjv\" data-code=\"H6235\">tens,</span> and <span class=\"wl wl-kjv\" data-code=\"H7860\">officers</span> among your tribes.","16":"And I <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> your <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> the causes between your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> <span class=\"wl wl-kjv\" data-code=\"H6664\">righteously</span> between every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and the stranger","17":"Ye shall not <span class=\"wl wl-kjv\" data-code=\"H5234\">respect</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">persons</span> in <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment;</span> but ye shall <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H6996\">small</span> as well as the <span class=\"wl wl-kjv\" data-code=\"H1419\">great;</span> ye shall not be <span class=\"wl wl-kjv\" data-code=\"H1481\">afraid</span> of the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span> for the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> is <span class=\"wl wl-kjv\" data-code=\"H430\">God's:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1697\">cause</span> that is too <span class=\"wl wl-kjv\" data-code=\"H7185\">hard</span> for you, <span class=\"wl wl-kjv\" data-code=\"H7126\">bring</span> it unto me, and I will hear","18":"And I <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> you at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> all the <span class=\"wl wl-kjv\" data-code=\"H1697\">things</span> which ye should do.","19":"And when we <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H2722\">Horeb,</span> we went <span class=\"wl wl-kjv\" data-code=\"H3212\">through</span> all that <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and <span class=\"wl wl-kjv\" data-code=\"H3372\">terrible</span> <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> which ye <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> us; and we <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to Kadeshbarnea.","20":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto you, Ye are <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> doth give","21":"<span class=\"wl wl-kjv\" data-code=\"H7200\">Behold,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee: go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it, as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto thee; <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> not, neither be discouraged.","22":"And ye came <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> unto me every one of you, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> us, and they shall search us <span class=\"wl wl-kjv\" data-code=\"H2658\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> us <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> by what <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> we must go <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and into what <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> we shall come.","23":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> pleased me <span class=\"wl wl-kjv\" data-code=\"H3190\">well:</span> and I <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of you, <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of a <span class=\"wl wl-kjv\" data-code=\"H376\">tribe:</span>","24":"And they <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5158\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H812\">Eshcol,</span> and searched it out.","25":"And they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> of the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> in their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and brought it <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto us, and <span class=\"wl wl-kjv\" data-code=\"H7725\">brought</span> us <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> doth give","26":"Notwithstanding ye <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not go <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> but <span class=\"wl wl-kjv\" data-code=\"H4784\">rebelled</span> against the <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God:","27":"And ye <span class=\"wl wl-kjv\" data-code=\"H7279\">murmured</span> in your <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8135\">hated</span> us, he hath brought us <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> us into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> to destroy","28":"Whither shall we go <span class=\"wl wl-kjv\" data-code=\"H5927\">up?</span> our <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> have <span class=\"wl wl-kjv\" data-code=\"H4549\">discouraged</span> our <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> is <span class=\"wl wl-kjv\" data-code=\"H1419\">greater</span> and <span class=\"wl wl-kjv\" data-code=\"H7311\">taller</span> than we; the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> are <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and walled <span class=\"wl wl-kjv\" data-code=\"H1219\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven;</span> and moreover we have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the Anakims","29":"Then I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto you, <span class=\"wl wl-kjv\" data-code=\"H6206\">Dread</span> not, neither be afraid","30":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> which <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you, he shall <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> for you, according to all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> for you in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> before your eyes;","31":"And in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> where thou hast <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> how that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> thee, as a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> doth <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> in all the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that ye <span class=\"wl wl-kjv\" data-code=\"H1980\">went,</span> until ye <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into this place.","32":"Yet in this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> ye did not <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God,","33":"Who <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you, to search you <span class=\"wl wl-kjv\" data-code=\"H8446\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> to pitch your <span class=\"wl wl-kjv\" data-code=\"H2583\">tents</span> in, in <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">shew</span> you by what <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> ye should <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> and in a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> by day.","34":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of your <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> and was <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7650\">sware,</span> saying,","35":"Surely there shall not <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of these <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1755\">generation</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> that <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which I <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto your fathers,","36":"<span class=\"wl wl-kjv\" data-code=\"H2108\">Save</span> <span class=\"wl wl-kjv\" data-code=\"H3612\">Caleb</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3312\">Jephunneh;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> it, and to him will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H834\">that</span> he hath trodden <span class=\"wl wl-kjv\" data-code=\"H1869\">upon,</span> and to his <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> because he hath <span class=\"wl wl-kjv\" data-code=\"H4390\">wholly</span> <span class=\"wl wl-kjv\" data-code=\"H310\">followed</span> the LORD.","37":"Also the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H599\">angry</span> with me for your <span class=\"wl wl-kjv\" data-code=\"H1558\">sakes,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thou also shalt not <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> in thither.","38":"But <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5126\">Nun,</span> which <span class=\"wl wl-kjv\" data-code=\"H5975\">standeth</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, he shall go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> thither: <span class=\"wl wl-kjv\" data-code=\"H2388\">encourage</span> him: for he shall cause <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to inherit","39":"Moreover your little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones,</span> which ye <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> should be a <span class=\"wl wl-kjv\" data-code=\"H957\">prey,</span> and your <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> which in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> had no <span class=\"wl wl-kjv\" data-code=\"H3045\">knowledge</span> between <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> and <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> they shall go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> thither, and unto them will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it, and they shall possess","40":"But as for you, <span class=\"wl wl-kjv\" data-code=\"H6437\">turn</span> you, and take your <span class=\"wl wl-kjv\" data-code=\"H5265\">journey</span> into the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H5488\">Red</span> sea.","41":"Then ye <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, We have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> we will go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fight,</span> according to all that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> us. And when ye had <span class=\"wl wl-kjv\" data-code=\"H2296\">girded</span> on every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H3627\">weapons</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> ye were <span class=\"wl wl-kjv\" data-code=\"H1951\">ready</span> to go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into the hill.","42":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> unto them, Go not <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> neither <span class=\"wl wl-kjv\" data-code=\"H3898\">fight;</span> for I am not <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> you; lest ye be <span class=\"wl wl-kjv\" data-code=\"H5062\">smitten</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> your enemies.","43":"So I <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto you; and ye would not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> but <span class=\"wl wl-kjv\" data-code=\"H4784\">rebelled</span> against the <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5927\">went</span> <span class=\"wl wl-kjv\" data-code=\"H2102\">presumptuously</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into the hill.","44":"And the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in that <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> you, and <span class=\"wl wl-kjv\" data-code=\"H7291\">chased</span> you, as <span class=\"wl wl-kjv\" data-code=\"H1682\">bees</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> and <span class=\"wl wl-kjv\" data-code=\"H3807\">destroyed</span> you in <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> even unto Hormah.","45":"And ye <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> but the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> would not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> to your <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> nor give ear","46":"So ye <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> in <span class=\"wl wl-kjv\" data-code=\"H6946\">Kadesh</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> according unto the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that ye abode"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zijn de woorden,","tekst":"Anders, dat zijn, of, waren de woorden, enz. Menende dat deze eerste twee verzen een besluit zijn van de woorden en geschiedenissen, die in het voorgaande verhaald zijn."},{"catchword":"aan deze zijde van de Jordaan,","tekst":"Mozes heeft dit gesproken en geschreven aan de oostzijde van de Jordaan, want hij is daarover niet gekomen, maar in het land der Moabieten gestorven; onder, Deu 34:5."},{"catchword":"vlakke veld","tekst":"Versta, de velden, of het effen, platte land der Moabieten. Zie onder, vs.5, en Deu 34:8; idem, Num 22:1."},{"catchword":"Suf,","tekst":"Sommigen verstaan hier door Suf de Rode zee, waarin Farao met zijn leger verdronken is, liggende aan Egypte, waarheen Israël weder terug had moeten keren; anderen, de Dode zee, liggende aan het zuidelijke einde van der Moabieten land westwaarts; of, de landstreek aan een van deze beide zeeën gelegen. Vergelijk Num 21:14. Suf betekent bies, of, schelf, wier, meergras"},{"catchword":"Paran en tussen Tofel,","tekst":"Van Paran, zie Gen 14:6; Num 10:12, Num 12:16; van Hazeroth, Num 12:16, Num 33:17-18. Sommigen menen dat hier de uiterste palen van der Moabieten land beschreven worden, naar het zuiden, noorden en oosten. Tofel, Laban en Dizahab, worden elders in de Schrift niet vermeld, zodat daarvan verscheiden gevoelen is."}],"2":[{"catchword":"Horeb,","tekst":"Van den berg Horeb, zie Exo 3:1, en Exo 33:6, enz. Sommigen houden Horeb en Sinaï voor twee bergen, dicht aan elkander gelegen, gelijk ook enige kaarten hebben. Zie dergelijke onder, Deu 34:1."},{"catchword":"door den weg van het gebergte","tekst":"Dat is, wanneer men van Horeb naar Kades-Barnea recht toereist, den weg van het gebergte Seïr, of Edom, anders ook [zo het schijnt] genoemd het gebergte der Amorieten, onder, vs.7. Met deze woorden geeft Mozes te verstaan, dat de Israëlieten over een korten weg lang hebben moet reizen. Van Egypte tot aan Kades-Barnea hebben zij omtrent twee jaren doorgebracht. Zie op vs.6. Vandaar tot de velden Moabs acht en dertig jaren; onder, Deu 2:14. Omdat God, vertoornd zijnde, hen weder terug deed keren, totdat de wederspannigen in de woestijn waren omgekomen. Zie Num 14:33-34, enz."},{"catchword":"Seïr,","tekst":"Dat is, die naar het gebergte Seïr of der Edomieten gaat; hoewel het gebergte van Horeb strekkende naar Edom, ook alzo mag zijn genoemd."},{"catchword":"Kades-barnéa","tekst":"Zie Gen 16:14."}],"3":[{"catchword":"veertigste jaar,","tekst":"Na den uittocht uit Egypte, niet lang voor Mozes' dood, Num 33:38."},{"catchword":"elfde maand,","tekst":"Namelijk, Sebat; Zec 1:7. Passende voor een deel op Januari, voor een deel op Februari, wanneer het begin des jaars genomen wordt van de eerste maand des kerkelijken jaars, genoemd Abib of Nisan; zie Exo 12:2, en Exo 13:4; Neh 2:1; Est 3:7."},{"catchword":"aan hen bevolen had;","tekst":"Dat is, om hun aan te zeggen."}],"4":[{"catchword":"Amorieten,","tekst":"Hebreeuws, des Amoriets; gelijk elders dikwijls. Zie van dit volk, Gen 10:16. Van deze twee geschiedenissen, alsook van Basan, en Astharoth en Edreï, zie Num 21:21-41 en Jos 13:31."},{"catchword":"in Astharôth,","tekst":"Astharoth en Edreï waren twee koninklijke steden in Basan, naderhand den Rubenieten afgestaan, gelegen aan de oostzijde der Jordaan, aan het gebergte: Astharoth, in het noorden bij Syrië; Edreï in het zuidelijke einde van Basan. Zie Gen 14:5 [waar Astharoth Karnaïm genoemd wordt], en Jos 13:31. De afgoden der Filistijnen en Sidoniërs waren ook Astharoth genoemd; zie Jdg 2:13."}],"5":[{"catchword":"Moab,","tekst":"Dat is, der Moabieten, gelijk dikwijls."},{"catchword":"hief Mozes aan,","tekst":"Of, heeft Mozes gewild, het heeft hem goed gedacht"},{"catchword":"deze wet uit te leggen,","tekst":"Dat is, de wetten, die hij in de drie vorafgaande boeken had voorgesteld, heeft hij wederhaald, breder verklaard en het volk ingescherpt. Deze uitlegging begint eigenlijk onder, Deu 4, nadat Mozes enige geschiedenissen verhaald had, om de Israëlieten tot aandacht en gehoorzaamheid te bewegen."}],"6":[{"catchword":"Gij zijt (lang genoeg)","tekst":"Hebreeuws, het is ulieden veel te blijven, of, wonen, enz."},{"catchword":"lang genoeg","tekst":"Te weten, omtrent een jaar, want zij zijn in het begin der derde maand na den uittocht uit Egypte bij Sinaï en Horeb gekomen; Exo 19:1-2. En zijn vandaar getogen in het volgende jaar, op den twintigsten dag der tweede maand; Num 10:11."}],"7":[{"catchword":"het gebergte","tekst":"Beginnende bij de bergen Horeb en Sinaï, en voorts strekkende noordwaarts tot aan Kades-Barnea, bij de grenzen van Seïr en Kanaän, naar uitwijzen der kaart."},{"catchword":"der Amorieten,","tekst":"Hebreeuws, van den Amorieter en tot al zijne geburen; dat is, naastgelegen plaatsen."},{"catchword":"in het zuiden,","tekst":"Dit ziet op de palen des beloofden lands, tegen het zuiden, westen, noorden en oosten. Vergelijk Num 34:2. Maar niettegenstaande dit bevel, zo zouden de wederspannigen evenwel in dit land niet komen; onder, vs.35. Het gebergte Libanon wordt dikwijls in de Schrift vermeld, gelegen aan de noordergrenzen van Kanaän."},{"catchword":"Frath","tekst":"Dat is, Eufraat. Zie daarvan Gen 2:14, en Gen 15:18."}],"8":[{"catchword":"voor uw aangezicht;","tekst":"Dat is, Ik heb het voor u opengesteld, dat gij het inneemt, enz. Alzo wordt van de inwoners van dit land gezegd, dat God hen voor Israëls aangezicht gegeven heeft; dat is [gelijk de Schrift ook spreekt] in hun hand, om die te slaan. Zie onder, Deu 2:31, Deu 2:33, en elders dikwijls."}],"9":[{"catchword":"sprak ter zelfder tijd tot u,","tekst":"Naar den raad van Jethro, Exo 18:19."},{"catchword":"u niet kunnen dragen","tekst":"Dat is, de last uwer zaken, die onder u voorvallen, zou mij alleen te zwaar zijn."}],"10":[{"catchword":"als de sterren des hemels in menigte","tekst":"Naar de belofte, Gen 15:5."}],"12":[{"catchword":"uw moeite,","tekst":"Dat is, de moeite, die gij mij aandoet; en zo in het volgende."},{"catchword":"twistzaken dragen?","tekst":"Hebreeuws, twist, of, twistzaak; dat is, uwe processen die gij tegen elkander opneemt en voor mij brengt, om mijn uitspraak er over te ontvangen."}],"13":[{"catchword":"Neemt u wijze,","tekst":"Hebreeuws, geeft"},{"catchword":"ervarene mannen,","tekst":"Anders, bekende"},{"catchword":"hoofden stelle","tekst":"Dat is, oversten, rechters."}],"14":[{"catchword":"woord is goed,","tekst":"Of, deze zaak die, enz."}],"16":[{"catchword":"Hoort de verschillen","tekst":"Of, horende [de verschillen] tussen uwe broeders, zo, enz."},{"catchword":"deszelfs vreemdeling","tekst":"Dat is, die bij, of onder hem is, of verkeert."}],"17":[{"catchword":"aangezicht in het gericht niet kennen;","tekst":"Dat is, gij zult het gericht niet buigen naar enig uiterlijk aanzien, conditie of kwaliteit dergenen, die voor het gericht verschijnen. Zie zulk een manier van spreken Lev 19:15, en onder, Deu 10:17; 2Ch 19:6-7; Job 13:8; Jam 2:1, Jam 2:9."},{"catchword":"kleine,","tekst":"Dat is, geringen, armen, verachten. Hebreeuws, gelijk de kleinen, gelijk de groten, of alzo de kleinen, alzo de groten; dat is, de minsten zowel als de meesten."},{"catchword":"grote,","tekst":"Dat is, rijken, vermogenden, aanzienlijken."},{"catchword":"Godes;","tekst":"Dat is, het is door God ingesteld, en wordt in zijnen naam en van zijnentwege, naar de wetten, die Hij ons voorgeschreven heeft, bediend."},{"catchword":"die voor u","tekst":"Dat is, zwaarder dan dat gij die zoudt kunnen afdoen."},{"catchword":"zwaar zal zijn,","tekst":"Of, hard."}],"21":[{"catchword":"voor uw aangezicht;","tekst":"Zie boven, vs.8."}],"22":[{"catchword":"bescheid wederbrengen,","tekst":"Hebreeuws, een woord wederbrengen, of antwoorden."}],"23":[{"catchword":"was goed in mijn ogen;","tekst":"Dat is, beviel mij wel; daarom heeft Mozes haar ook voor den HEERE gebracht, die hem bevel er van gaf; Num 13:3."}],"24":[{"catchword":"dal","tekst":"Naar het uitwijzen van enige kaarten, was de beek Sorek nevens dit dal Eskol, of druivendal, lopende uit het gebergte van Juda. Vergelijk Num 13:23, en Jdg 16:4. Het Hebreeuwse woord betekent somtijds dal, somtijds beek, omdat de beken veel in dalen zijn lopende; hierom hebben anderen beek"},{"catchword":"Eskol,","tekst":"Dit woord Eskol betekent een bos druiven, een druif. Deze plaats is door de Israëlieten genaamd Druivendal, omdat deze vruchten veel, zonderling schoon en groot aldaar wiessen, en een monster daarvan door de verspieders was afgesneden, gedragen en medegebracht. Zie Num 13:24."}],"25":[{"catchword":"vrucht des lands","tekst":"Te weten, wijndruiven, granaatappelen en vijgen. Zie Num 13:24."}],"26":[{"catchword":"den mond des HEEREN","tekst":"Dat is, tegen het bevel."}],"27":[{"catchword":"Omdat de HEERE ons haat,","tekst":"Anders, uit haat des HEEREN tegen ons, heeft Hij, enz. Dat is, omdat Hij ons haat."}],"28":[{"catchword":"doen smelten,","tekst":"Dat is, hebben ons kleinmoedig, bevreesd en versaagd gemaakt; een gelijkenis genomen van was, dat door het vuur of de hitte der zon smelt. Alzo wordt het hart week door vrees van gevaar en ongeluk. Alzo Jos 2:9, Jos 2:24, en Jos 5:1; Jer 49:23, enz."},{"catchword":"groter en langer dan wij;","tekst":"Meerder in getal en sterker in krachten."},{"catchword":"in den hemel toe;","tekst":"Dat is, uitnemend sterk en vast; anders, gesterkt [opgaande] tot in den hemel. Zie Gen 11:4."},{"catchword":"Enakieten gezien","tekst":"Dat is, reuzen, alzo genaamd naar een zekeren Enak. Zie Num 13:22; Jdg 1:10, Jdg 1:20."}],"31":[{"catchword":"En in de woestijn,","tekst":"Anders, en hetgeen gij gezien hebt in de woestijn"},{"catchword":"als een man zijn zoon draagt,","tekst":"Vergelijk Exo 19:4; Num 11:12, en onder, Deu 32:10-11; Psa 91:12; Isa 46:3,4."}],"32":[{"catchword":"door dit woord","tekst":"Anders, door deze zaak; dat is, hetgeen gij gezien en gehoord hadt, bewoog u niet."},{"catchword":"geloofdet gij niet aan den HEERE,","tekst":"Gij vertrouwdet niet op hem, dat Hij zijn beloften volbrengen zou."}],"33":[{"catchword":"opdat Hij u den weg wees,","tekst":"Anders, om u te doen zien op den weg."}],"35":[{"catchword":"gezworen heb uw vaderen te zullen geven","tekst":"Een onvolkomen rede, in het eedzweren gebruikelijk. Zie Gen 14:23, en Num 14:23. Sommigen verstaan daarop: zo zal Ik geen God zijn, of, Ik zal niet leven."}],"36":[{"catchword":"Kaleb,","tekst":"Mitsgaders Jozua, de zoon van Nun. Zie onder, vs.38, en Num 14:6, Num 14:30."},{"catchword":"het land geven,","tekst":"Versta een deel des lands. Kaleb en Jozua waren mede geweest onder de verspieders, Num 14:6."},{"catchword":"omdat hij volhard heeft","tekst":"Hebreeuws, omdat hij vervuld heeft [te gaan] achter den HEERE, dat is, bestendiglijk den HEERE in deze zaak gehoorzaamd en gevolgd heeft. Zie Num 14:24, en Num 32:11-12."}],"37":[{"catchword":"om uwentwil,","tekst":"Want Mozes werd door het ongeloof en murmureren des volks, zo ontsteld en verstoord, dat hij zich aan den HEERE vergreep. Zie de historie Num 20:10-12."}],"38":[{"catchword":"voor uw aangezicht staat,","tekst":"Dat is, die steeds bij en omtrent u is, om u te dienen, die op u past. Vergelijk 1Ki 1:2; Dan 1:5, Dan 1:19."},{"catchword":"Israël doen erven","tekst":"Dat is, hij zal niet alleen in het land Kanaän komen, maar ook in uw plaats na uw overlijden gesteld worden; daarom onderwijs, vermaan en sterk hem, om hem tot dat hoge ambt te bereiden."}],"39":[{"catchword":"noch goed noch kwaad weten,","tekst":"Een manier van spreken in de Schrift gebruikelijk, om de kindsheid of kindse jaren te beschrijven. Zie gelijke manier van spreken Isa 7:15; Jon 4:11."}],"40":[{"catchword":"Schelfzee","tekst":"Dat is, biezenzee [gemeenlijk genaamd het Rode meer ], die zij door Gods machtige hand tevoren gepasseerd waren, en vandaar zover naar het beloofde land gereisd hadden."}],"41":[{"catchword":"krijgsgereedschap","tekst":"Of, krijgswapenen"},{"catchword":"willens waart,","tekst":"Of, gereed waart, u daartoe bereiddet. Anders, u verstoutet, of, vermetelijk onderwondt"},{"catchword":"naar het gebergte henen op te trekken,","tekst":"Zie boven, vs.2."}],"42":[{"catchword":"midden van u;","tekst":"Met mijn genade en gewoonlijken bijstand. Vergelijk onder, Deu 23:14."}],"43":[{"catchword":"trotselijk,","tekst":"Alsof gij zonder Gods hand en hulp door uw eigen krachten uw vijanden kondt overwinnen."}],"44":[{"catchword":"togen de Amorieten uit,","tekst":"Hebreeuws, de Amoriet toog uit, enz."},{"catchword":"de bijen doen;","tekst":"Die, getergd en vertoornd zijnde, met menigte van alle kanten dengene navliegen, steken en verjagen, die haar komt storen. Zie Psa 118:12."}],"46":[{"catchword":"naar de dagen,","tekst":"Dat is, naar uitwijzen der dagen, die gij weet dat gij daar gebleven zijt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"These are the words which Moseh spake unto all Israel [others those are or were the words &c. meaning that these two first verses are a conclusion of the acts and words that are related in the foregoing books ] on this side Jordan for he went not over it but died in the land of Moabites see below chapter 34.5] in the wilderness on the plain [understand the fields or the even plain land of the Moabites see below verse 5 and chapter 34.8 item Num 22:1 ] over against Suph [ some understand here by Suph the red sea wherein Pharaoh and his host drowned lying against by Egypt whether Israel had mind to return back again others the dead sea lying at the south end of the Moabites land west wards or the country lying by one of these two seas compare Num 21:14 Suph signifieth rush or weed sea weed sea grass ] between Param and between Tophel and Laban and Hazeroth and Dizahab [of Paran see Genesis 14 on verse 6 Num 10:12 and 13.1 &c. of Hazeroth Num 13:1 and 33.17,18 some conceive that here are described the uttermost confines of the Moabites country south-wards North-wards and east-wards Tophel, Laban and Dizahab are nowhere else mentioned in the scripture so that there be divers opinion concerning them.]"}],"2":[{"catchword":null,"tekst":"They are eleven days journeyed from Horeb [of Mount Horeb see Exodus3.1 an d33.6 &c. some conceive Horeb and Sinai to be two mountains lying close together as also some maps do shew see the like below chapter 34 on verse 1] by the way of Mount Seir [that is which goeth to mount Seir or mount of the Edomites although the mount reaching from Horeb maybe likewise so called ] unto Kades-Barnea [that is going directly from Horeb to Kades-Barnea by the way of Mount Seir or Edom called also as it seemeth the mount of Amorites below verse 7 by the words of Moses intimateth that the Israelites were fain to spend a long time about the travelling a little way in your journeying from Egypt to kades &acirc;&euro;&ldquo;Barnea they spent about two years time see on verse 6from thence to the field of Moab eight and thirty years below chapter 2.14 because god being provoked to anger made them go back again until the rebellious one perished in the wilderness see Num 14:33 ,34 &c. of Kades-Barnea see Genesis 16 on verse 14.]"}],"3":[{"catchword":null,"tekst":"And it came to pass in the fourtieth year [after the departure of the Israelites out of Egypt not long before Moseh his death Num 33:38] in the eleventh month [namely Sebat Zachariah 1.7 answering to part of January and to part of February when the beginning of the year being taken from the first month of the Ecclesiastical year called Abib or Nisan see Exo 12:2 and 13.4 Nehemiah 2.1 Est 3:7 ] on the first day of the month that Moseh spake to the children of Israel according to all the Lord hath given him in charge unto them [ that is had commanded him to tell them .]"}],"4":[{"catchword":null,"tekst":"After he had smitten Sihom the King of the Amorites [Heb. Of the Amorites as elsewhere often see of the people Genesis 10 on verse 16 of these two passages as also of Basan and Astharoth and Edrei [Astharoth and Edrei dwelt at Astharoh at Edrei [Astharoth and Edrei were two cities in Basan afterwards given to the Reubenites for a possession lying on the East side of Jordan by the mountains Astharoth on the north of Syria Edrei on the south end of Basan see Gen 14:5 where it is called Astharoth Kanaim and Jos 13:31 the idols of the Philistines and the Zidonians were also called Astharoth see judges 2. On verse 13.]"}],"5":[{"catchword":null,"tekst":"On this side Jordan in the land of Moab [that is of the Moabites as often] Moseh began [or Moseh deisreth it seemeth good unto him] to expound this law [that is he repeated further declared and inculcated or wetted upon the people of the laws that he had propounded in the three former books this exposition beginneth properly below chapter 4after Moseh had related certain passages to move the Israelites to attention and obedience] saying."}],"6":[{"catchword":null,"tekst":"The Lord our God spake unto us at Horeb saying ye have tarried long enough by this mount [to wit about a year for they came to Sanai and Horeb in the beginning of the third month after their going forth out of Egypt Exo 19:1,2 and departed thence in second year at the twentieth day of the second month Num 10:11 Hebrews it is much for you to continue and dwell &c.]"}],"7":[{"catchword":null,"tekst":"Turn you and depart and go into the mount of the Amorites [Heb. Amorites which mount beginneth at the mountains Horeb and Sinai and reacheth thence north-wards unto Kades-Barnea by the borders of Syria and Canaan as maps do shew] and unto all their neighbors [Heb. & unto his neighbors that is near adjoining places] in the pain on the mountain and on the low ground and in the south and at the haven of the sea the land of Canaan and Lebanon unto the great river [this hath respect unto the borders of the land promise towards the south west north and east compare Numbers 34 and the annotate there on verse 2 but not withstanding this command the rebellious ones should by no means enter into the land below verse 35 mount Lebanon is often mentioned in the scriptures lying on the north borders of Canaan ] the river Phrath [that is Euphrates see thereof genesis 2 on verse 14 and 15 on verse 18.]"}],"9":[{"catchword":null,"tekst":"And I spake unto you at that time [to wit according to Jethro&acirc;&euro;&trade;s counsel exodus 18.19] saying I shall not be able to bear you myself alone [that is the burthen of your affairs which happen among you would be too heavy for me alone to bear.]"}],"10":[{"catchword":null,"tekst":"The Lord your God hath multiplied you and behold ye is this day as the stars of heaven in multitude [according to the promise Gen 15:5.]"}],"11":[{"catchword":null,"tekst":"The lord the God of your fathers add to you as ye are now a thousand times more and bless ye according as he hath spoken unto ye."}],"12":[{"catchword":null,"tekst":"How should I alone bear your toil or trouble which should put me to and so in the sequel ] and your burden and your controversies ?[Heb. Strife or contentions that is your causes or suits which ye may commence one against another which bring before me to receive my verdict and judgment upon them.]"}],"13":[{"catchword":null,"tekst":"Take [Heb. Give] ye wise man and understanding and expert [others known] to your tribes that I may make them your heads that is ruler&acirc;&euro;&trade;s judges.]"}],"14":[{"catchword":null,"tekst":"Then ye answered me and said this word [or this thing] which thou hast spoken is good for us to do."}],"15":[{"catchword":null,"tekst":"So I took the heads of your tribes wise and expert men and made them head over you rulers of thousand and rulers of hundreds and rulers of fifties rulers of tens and officers for your tribes."}],"16":[{"catchword":null,"tekst":"And I charged your judges at that time saying hear the differences between your brethren and judge rightly between the men and between his brother [or hearing the differences between your brethren judge rightly &c.] and the stranger of him [viz. that is or converseth with or among them .]"}],"17":[{"catchword":null,"tekst":"Ye shall not know the face in the judgment [that is ye shall not wrest the judgments according to any outwards respect or quality of those that should appear before the judgment seat see the like phrase Lev 19:15and below chapter 10.17 2 Chronicles 19.6,7 Job 13:8 James2.1, 9] ye shall hear the small [that is the mean poor despised one] as well as great [that is the rich mighty and honorable Heb. As the small as the great so that small so the great that is the least as well as the greatest ] ye shall not be afraid of any mans face for the judgment that is God [that is it is ordained of god and it is executed in his name and by command from him according to the laws prescribed by him ] but the matter which shall not be too heavy [ or hard for you] that is more difficult than ye shall be able to decide] ye shall cause to come to me and ye shall bear it."}],"18":[{"catchword":null,"tekst":"So I command ye at that time so the things which ye shall do."}],"19":[{"catchword":null,"tekst":"Then he departed from Horeb and walked through all that great and terrible wilderness which ye saw on the way of mountain of Amorites as the Lord out God had commanded us and we came to Kades-Barnea."}],"20":[{"catchword":null,"tekst":"Then I said unto ye then I come unto the mountain of the Amorites which the Lord our God will give unto us."}],"21":[{"catchword":null,"tekst":"Behold the Lord thy God hath given that land before thy face [see above verse 8] go up possess it hereditarily according to the lord the God of thy fathers hath spoken unto thee fear not neither be dismayed."}],"22":[{"catchword":null,"tekst":"Then ye all came near unto me and said let us send men before our face who may spy us out of the land and bring us word again [Heb. Bring us word again or answer] what way shall we go up to it and unto the cities we shall come."}],"23":[{"catchword":null,"tekst":"Now this thing was good in mine eyes [that is pleased me therefore Moses presented it also before the Lord who gave him a command concerning it Num 13:3] so I took twelve men of you and men of every tribe."}],"24":[{"catchword":null,"tekst":"Who turned themselves and went up to the mountain and came unto the valley of Eschol [the brook Socok as some maps do shew was next to the valley of Escol or valley of grapes issuing out of the mountain of Judah compare Num 13:25 and Judges 16 on verse 4 the Hebrew word signifieth sometimes a valley and sometimes a brook because brook do often run through the valley therefore others have the word brooks in the place instead of valley this word Escol signifieth a branch of grapes or a grape this place was called by the Israelites the valley of grapes because this kind of fruit that grew there in the great abundance was exceeding fair and big a sample whereof was cut down carried and brought by the spies when they returned back see N // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

    rij.className = 'vers'; rij.id = 'v' + n;

    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;

      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

  }
  if (tab === 'verwijzingen') {

    }

    if (engels && engels.length) {

        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
