van Mozes, voor het aangezicht van God.", "Ps 72:1": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning.", "Jes 45:19": "Ik heb niet in het verborgene gesproken, op een donkere plaats van de aarde; Ik heb tegen het zaad van Jakob niet gezegd: Zoekt Mij tevergeefs; Ik ben de HEERE, Die gerechtigheid spreekt, Die rechtmatige dingen verkondigt.", "Deut 31:7": "En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven.", "Num 10:29": "Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.", "Deut 32:10": "Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.", "Ex 14:9": "En de Egyptenaren joegen hen na en achterhaalden hen, terwijl zij zich gelegerd hadden aan de zee; met alle paarden, de wagens van Farao en zijn ruiters, en zijn leger; bij Pi-hachiroth, voor Baäl-zefon.", "1 Kon 8:35-50": "Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben; en zij op deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben; hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt. Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn;", "Spr 28:25": "Wie hoogmoedig van hart is, verwekt ruzie; maar wie op de HEERE vertrouwt, zal welvarend worden.", "Ex 14:2": "Spreek tot de kinderen van Israël, dat zij terugkeren en zich legeren voor Pi-hachiroth, tussen Migdol en de zee, voor Baäl-zefon; daar tegenover zult u zich legeren aan de zee.", "Deut 19:18": "En de rechters zullen zorgvuldig onderzoek doen; en zie, de getuige is een valse getuige, hij heeft een valse verklaring afgelegd tegen zijn broeder;", "Zef 3:3": "Haar vorsten zijn brullende leeuwen in haar midden; haar rechters zijn avondwolven, die de beenderen niet breken tot aan de morgen.", "Jer 29:30": "Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Spr 2:8": "Opdat zij de paden van het recht bewaren; en Hij zal de weg van Zijn gunstgenoten bewaren.", "Ex 16:1": "Toen zij van Elim vertrokken waren, kwam de hele gemeenschap van de Israëlieten in de woestijn Sin, die tussen Elim en Sinaï ligt, op de vijftiende dag van de tweede maand nadat zij uit Egypte weggegaan waren.", "1 Sam 19:20": "Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.", "1 Kor 3:3": "Want u bent nog vleselijk; want omdat er onder u nijd is, en twist, en tweedracht, bent u niet vleselijk, en wandelt u niet naar de mens?", "Amos 9:1": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden.", "Num 21:13": "Van daar reisden zij, en legerden zich aan deze zijde van de Arnon, die in de woestijn is, uitgaande uit het gebied van de Amorieten; want de Arnon is de grens van Moab, tussen Moab en de Amorieten.", "1 Kron 29:16": "HEERE, onze God, al deze overvloed die wij klaargemaakt hebben om U een huis te bouwen, voor de Naam van Uw heiligheid, dat komt van Uw hand, en het is alles van U.", "Amos 7:14": "Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.", "Deut 2:7": "Want de HEERE, uw God, heeft u gezegend in al het werk van uw hand; Hij kent uw wandelen door deze zo grote woestijn; deze veertig jaren is de HEERE, uw God, met u geweest; niets heeft u ontbroken.", "Deut 1:9-17": "En ik sprak in die tijd tot u, en zei: Ik alleen kan u niet dragen. De HEERE, uw God, heeft u talrijk gemaakt, en zie, u bent vandaag zo talrijk als de sterren aan de hemel. De HEERE, de God van uw vaderen, maakt u, zoals u nu bent, duizend keer talrijker, en Hij zegent u, zoals Hij tot u gesproken heeft!", "Ex 12:49": "Eén wet zal er zijn voor de ingeborene, en voor de vreemdeling die als vreemdeling in uw midden verblijft.", "1 Tim 1:5-7": "Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof. Van wie sommigen afgeweken zijn en zich gewend hebben tot ijdel gepraat; Zij willen leraars van de wet zijn, maar begrijpen niet wat zij zeggen, en ook niet waarover zij zo stellig spreken.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Lev 26:4-6": "Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen. Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Ex 16:6": "Toen zeiden Mozes en Aäron tegen alle Israëlieten: Vanavond zult u weten dat de HEERE u uit Egypte geleid heeft;", "Ezech 1:1": "In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.", "Ezech 11:4": "Daarom, profeteer tegen hen; profeteer, o mensenkind!", "1 Kron 21:3": "Toen zei Joab: De HEERE doet Zijn volk, hoeveel zij nu ook zijn, honderd keer zoveel worden; zijn zij niet allen, o mijn heer koning, mijn heer tot knechten? Waarom verzoekt mijn heer dit? Waarom zou het Israël tot schuld worden?", "Joz 9:11": "Daarom spraken tot ons onze oudsten, en al de inwoners van ons land, en zeiden: Neemt reiskost met u in uw handen op de reis, en gaat hun tegemoet, en zegt tegen hen: Wij zijn uw knechten, sluit dan nu een verbond met ons.", "Ezech 2:1": "En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.", "Ex 18:21-26": "Doch zoek u onder al het volk uit naar bekwame mannen, die God vrezen, betrouwbare mannen, die hebzucht haten; stel hen aan over hen als leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien. Laat hen dit volk te allen tijde oordelen; doch laat het zo zijn dat zij alle grote zaken bij u brengen, maar dat zij alle kleine zaken zelf oordelen; verlicht zo uzelf, en laat hen met u meedragen. Als u deze zaak doet, en God het u gebiedt, zult u het kunnen volhouden; zo zal ook al dit volk in vrede naar zijn plaats gaan.", "Ezech 20:6": "Op diezelfde dag hief Ik Mijn hand tot hen op, om hen uit Egypteland uit te leiden, naar een land dat Ik voor hen had uitgezocht, vloeiend van melk en honing, het sieraad van alle landen.", "Jes 55:10": "Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter;", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "Ezech 3:22": "En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.", "Ps 116:1-15": "Ik heb Hem lief, want de HEERE hoort mijn stem, mijn smekingen; want Hij neigt Zijn oor tot mij; daarom zal ik Hem in mijn dagen aanroepen. De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "Spr 19:12": "De gramschap van de koning is als het gebrul van een jonge leeuw; maar zijn welgevallen is als dauw op het gras.", "Richt 1:35": "Ook wilden de Amorieten wonen op het gebergte van Heres, te Ajalon, en te Saalbim; maar de hand van het huis van Jozef werd zwaar, zodat zij dienstbaar werden.", "Jes 43:1": "Maar nu, zo zegt de HEERE, uw Schepper, o Jakob! en uw Formeerder, o Israël! Vrees niet, want Ik heb u verlost; Ik heb u bij uw naam geroepen, u bent van Mij.", "1 Kron 22:9": "Zie, de zoon die u geboren zal worden, die zal een man van rust zijn, want Ik zal hem rust geven van al zijn vijanden rondom; want zijn naam zal Salomo zijn, en Ik zal vrede en rust over Israël geven in zijn dagen.", "Ps 130:7": "Israël, hoop op de HEERE; want bij de HEERE is goedertierenheid, en bij Hem is veel verlossing.", "Matt 6:30-33": "Als God nu het gras van het veld, dat er vandaag is en morgen in de oven geworpen wordt, zo kleedt, zal Hij u niet veel meer kleden, kleingelovigen? Wees daarom niet bezorgd en zeg niet: Wat zullen wij eten, of wat zullen wij drinken, of waarmee zullen wij ons kleden? Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet dat u al deze dingen nodig hebt.", "Gen 2:16": "En de HEERE God gebood de mens en zei: Van elke boom van deze hof mag u vrijelijk eten;", "Job 33:18": "Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Luk 9:34": "Terwijl hij dit zei, kwam er een wolk en overschaduwde hen; en zij werden bang toen zij de wolk in gingen.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Jer 23:9": "Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "Num 34:15": "Twee stammen en een halve stam hebben hun erfenis ontvangen aan deze zijde van de Jordaan, bij Jericho, oostwaarts, tegen de opgang.", "Luk 1:70": "zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Gen 28:3": "En God, de Almachtige, zegent u, en maakt u vruchtbaar, en vermenigvuldigt u, zodat u tot een groep volken wordt.", "Job 29:19": "Mijn wortel was uitgebreid tot aan het water, en dauw vernachtte op mijn tak.", "1 Kron 18:3": "David sloeg ook Hadar-ezer, de koning van Zoba, naar Hamath toe, toen hij optrok om zijn macht te vestigen aan de rivier de Eufraat.", "Joz 24:15": "Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen!", "Job 31:13-16": "Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij; (Want wat zou ik doen, als God opstond? En als Hij bezoeking deed, wat zou ik Hem antwoorden? Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "Joz 11:16": "Zo nam Jozua al dat land in, het gebergte, en heel het zuiden, en heel het land van Gosen, en de laagte, en het vlakke veld, en het gebergte van Israël, en zijn laagte.", "1 Sam 3:1": "En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.", "1 Kor 4:6": "En deze dingen, broeders, heb ik op mijzelf en Apollos bij wijze van voorbeeld toegepast, om uwentwil; opdat u van ons zou leren niet te denken boven wat geschreven is, opdat u niet, de een om de ander, opgeblazen wordt tegen elkaar.", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Deut 33:13-16": "En van Jozef zei hij: Zijn land zij gezegend van de HEERE, van het voortreffelijkste van de hemel, van de dauw, en van de diepte, die beneden ligt; En van de voortreffelijkste inkomsten van de zon, en van de voortreffelijkste voortzetting van de maan; En van het voornaamste van de oude bergen, en van het voortreffelijkste van de eeuwige heuvels;", "Deut 3:1-3": "Daarna keerden wij ons om en trokken op, de weg van Bazan; en Og, de koning van Bazan, trok uit ons tegemoet, hij en al zijn volk, ten strijde bij Edrei. Toen zei de HEERE tegen mij: Wees niet bang voor hem, want Ik heb hem, en al zijn volk, en zijn land, in uw hand gegeven; en u zult hem doen, zoals u met Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt. En de HEERE, onze God, gaf ook Og, de koning van Bazan, en al zijn volk, in onze hand, zodat wij hem sloegen, totdat wij hem niemand lieten overblijven.", "Jer 22:1-3": "Zo zegt de HEERE: Ga naar het huis van de koning van Juda, en spreek daar dit woord. En zeg: Hoor het woord van de HEERE, koning van Juda, u die zit op de troon van David, u, en uw dienaren, en uw volk, die door deze poorten binnengaan! Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.", "Ps 4:6": "Offer offeranden van gerechtigheid, en vertrouw op de HEERE.", "Deut 31:3": "De HEERE, uw God, Die zal voor u overtrekken; Die zal deze volken van voor u wegvagen, zodat u hen erfelijk bezit. Jozua zal voor u overtrekken, zoals de HEERE gesproken heeft.", "Zach 10:5": "En zij zullen zijn als de helden, die in het slijk van de straten treden in de strijd, en zij zullen strijden; want de HEERE zal met hen zijn, en zij zullen hen beschamen die op paarden rijden.", "Deut 1:13-16": "Neem voor u wijze, verstandige en ervaren mannen, uit uw stammen, zodat ik hen tot uw hoofden stel. Toen antwoordde u mij, en zei: Dit woord dat u gesproken hebt, is goed om te doen. Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen.", "Deut 3:1-7": "Daarna keerden wij ons om en trokken op, de weg van Bazan; en Og, de koning van Bazan, trok uit ons tegemoet, hij en al zijn volk, ten strijde bij Edrei. Toen zei de HEERE tegen mij: Wees niet bang voor hem, want Ik heb hem, en al zijn volk, en zijn land, in uw hand gegeven; en u zult hem doen, zoals u met Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt. En de HEERE, onze God, gaf ook Og, de koning van Bazan, en al zijn volk, in onze hand, zodat wij hem sloegen, totdat wij hem niemand lieten overblijven.", "Ex 4:5": "Opdat zij geloven, dat u verschenen is de HEERE, de God van hun vaderen, de God van Abraham, de God van Izak, en de God van Jakob.", "Job 8:6": "als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "Deut 5:29": "Och, dat zij zo'n hart hadden om Mij te vrezen, en al Mijn geboden alle dagen te onderhouden, opdat het hun en hun kinderen goed gaat in eeuwigheid!", "Joz 1:7": "Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Ps 23:5": "U richt de tafel voor mij aan, tegenover mijn tegenstanders; U maakt mijn hoofd vet met olie, mijn beker vloeit over.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Jes 43:10": "U bent Mijn getuigen, spreekt de HEERE, en Mijn knecht, die Ik uitverkoren heb; opdat u het weet, en Mij gelooft, en verstaat, dat Ik Dezelfde ben, dat er vóór Mij geen God geformeerd is, en na Mij geen zijn zal.", "2 Sam 15:3": "dan zei Absalom tegen hem: Zie, uw zaken zijn goed en juist; maar u hebt niemand die u namens de koning aanhoort.", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "Gen 41:39": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Deut 28:8": "De HEERE zal de zegen gebieden, zodat Hij met u is in uw schuren, en in alles waar u uw hand aan slaat; en Hij zal u zegenen in het land dat de HEERE, uw God, u geven zal.", "Jes 43:5": "Vrees niet, want Ik ben met u; Ik zal uw nageslacht van de opgang brengen, en Ik zal u verzamelen van de ondergang.", "1 Kron 29:12": "En rijkdom en eer komen van Uw aangezicht, en U heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand om alles groot te maken en sterk te maken.", "Ezech 34:11-16": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Jes 26:20": "Ga heen, mijn volk, ga in uw binnenkamers, en sluit uw deuren achter u toe; verberg u voor een klein ogenblik, totdat de gramschap voorbijgaat.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "1 Kron 28:19": "Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.", "Amos 2:10": "Ook heb Ik u uit Egypteland opgevoerd; en Ik heb u veertig jaren in de woestijn geleid, opdat u het land van de Amoriet erfelijk bezat.", "Jer 42:4": "En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.", "Spr 22:10": "Jaag de spotter weg, en het gekijf zal weggaan, en het geschil met de schande zal ophouden.", "Mal 3:10-12": "Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen schuren genoeg zullen zijn. En Ik zal om uwentwil de opeter bestraffen, zodat hij u de vrucht van het land niet verderft; en de wijnstok op het veld zal u geen misdracht voortbrengen, zegt de HEERE van de heerscharen. En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Deut 20:1": "Wanneer u zult uittrekken tot de strijd tegen uw vijanden, en zult zien paarden en wagens, een volk, groter dan u, dan zult u voor hen niet vrezen; want de HEERE, uw God, is met u, Die u uit Egypteland heeft opgevoerd.", "Deut 11:7": "Want het zijn uw ogen, die al dit grote werk van de HEERE gezien hebben, dat Hij gedaan heeft.", "Ps 19:15": "Laat de redenen van mijn mond, en de overdenking van mijn hart welgevallig zijn voor Uw aangezicht, o HEERE, mijn Rotssteen en mijn Verlosser!", "Jer 22:3": "Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.", "Jes 7:16": "Zeker, voordat dit Knechtje weet het kwade te verwerpen en het goede te verkiezen, zal dat land, waarvoor u zo bang bent, verlaten zijn door zijn twee koningen.", "Ps 104:24-30": "Hoe groot zijn Uw werken, o HEERE! U hebt ze allemaal met wijsheid gemaakt; het aardrijk is vol van Uw rijkdom. Deze zee, die groot en wijd van omvang is, daarin is het wemelende gedierte, ontelbaar, kleine dieren met grote. Daar varen de schepen, en de Leviathan, die U gevormd hebt om daarin te spelen.", "Deut 3:21": "Ook gebood ik Jozua in die tijd: Uw ogen hebben alles gezien wat de HEERE, uw God, aan deze twee koningen gedaan heeft; zo zal de HEERE doen aan alle koninkrijken waar u doorheen trekt.", "Ps 115:9": "Israël! vertrouw jij op de HEERE; Hij is hun Hulp en hun Schild.", "Deut 1:21-31": "Zie, de HEERE, uw God, heeft dat land aan u gegeven; trek op, bezit het erfelijk, zoals de HEERE, de God van uw vaderen, tot u gesproken heeft; wees niet bang, en wees niet ontmoedigd. Toen kwam u allen dichterbij mij, en zei: Laten wij mannen voor ons uit sturen, die het land voor ons verkennen, en ons bericht terugbrengen, welke weg wij daarin op moeten trekken, en tot welke steden wij zullen komen. Deze zaak nu was goed in mijn ogen; zo nam ik uit u twaalf mannen, van elke stam een man.", "Ps 61:7": "U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;", "Ex 14:25": "En Hij stootte de raderen van hun wagens weg, en deed ze zwaar voortgaan. Toen zeiden de Egyptenaren: Laten wij vluchten van voor Israël, want de HEERE strijdt voor hen tegen de Egyptenaren.", "Jer 13:1-3": "Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:", "Ps 147:14": "Die uw grondgebied in vrede stelt; Hij verzadigt u met het beste van de tarwe.", "Matt 26:54-71": "Hoe zouden dan de Schriften vervuld worden, die zeggen dat het zo moet gebeuren? Op datzelfde moment zei Jezus tegen de menigten: Bent u uitgegaan als tegen een rover, met zwaarden en stokken, om Mij te vangen? Dagelijks zat Ik bij u, terwijl Ik leerde in de tempel, en u hebt Mij niet gegrepen; maar dit alles is gebeurd, opdat de Schriften van de profeten vervuld zouden worden. Toen vluchtten alle discipelen en lieten Hem in de steek.", "Job 37:6-24": "Want Hij zegt tot de sneeuw: Val op de aarde; en tot de regenbui: Wees een sterke regenbui. Dan zegelt Hij de hand van ieder mens toe, opdat elk mens het werk van Hem kent. En het gedierte gaat in de holen, en blijft in zijn schuilplaatsen.", "Spr 15:29": "De HEERE is ver van de goddelozen; maar het gebed van de rechtvaardigen zal Hij verhoren.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ps 100:3": "Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Jes 51:22": "Zo zegt de Heere, de HEERE en uw God, Die de zaak van Zijn volk twisten zal: Zie, Ik neem de beker van de zwijmeling van uw hand, de droesem van de beker van Mijn grimmigheid; u zult die voortaan niet meer drinken.", "Ps 118:5": "Uit de benauwdheid heb ik de HEERE aangeroepen; de HEERE heeft mij verhoord en mij in de ruimte gezet.", "Deut 31:18": "Ik dan zal Mijn aangezicht op die dag geheel en al verbergen, om al het kwaad dat het gedaan heeft; want het heeft zich gewend tot andere goden.", "Hos 5:6": "Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "Jes 58:6": "Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt?", "Deut 27:1": "En Mozes gebood, samen met de oudsten van Israël, het volk: Houd al deze geboden die ik u vandaag gebied.", "Zach 2:8": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan.", "2 Kron 7:18": "Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik een verbond met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "Deut 1:26-43": "Maar u wilde niet optrekken; maar u kwam tegen het bevel van de HEERE, uw God, in opstand. En u mopperde in uw tenten, en zei: Omdat de HEERE ons haat, heeft Hij ons uit het land Egypte weggevoerd, om ons in de hand van de Amorieten te leveren, om ons te verdelgen. Waarheen zouden wij optrekken? Onze broeders hebben ons hart doen smelten, en zeiden: Het is een volk, groter en langer dan wij; de steden zijn groot, en versterkt tot aan de hemel toe; ook hebben wij daar kinderen van de Enakieten gezien.", "Deut 9:8": "Want bij Horeb vertoornde u de HEERE zeer, zodat Hij Zich tegen u vertoornde, om u te verdelgen.", "Deut 11:11": "Maar het land, waarheen u overtrekt, om dat te erven, is een land van bergen en van dalen; het drinkt water van de regen van de hemel;", "Deut 3:5": "Al die steden waren met hoge muren, poorten en grendels versterkt, behalve heel veel onbemuurde steden.", "Luk 19:21": "want ik was bang voor u, omdat u een streng mens bent; u neemt weg wat u niet gelegd hebt, en u oogst wat u niet gezaaid hebt.", "Ps 118:13": "U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.", "Ex 19:2": "Want zij vertrokken uit Rafidim, en kwamen in de woestijn Sinaï, en zij legerden zich in de woestijn; Israël nu legerde zich daar tegenover die berg.", "Gen 13:8": "En Abram zei tegen Lot: Laat er toch geen twist zijn tussen mij en u, en tussen mijn herders en uw herders; want wij zijn broeders.", "Gen 49:12": "Hij is roodachtig van ogen door de wijn, en wit van tanden door de melk.", "Deut 13:17": "Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;", "Ex 23:2": "U zult de menigte niet volgen tot boze zaken; en u zult niet spreken in een geschil om u naar de menigte te neigen, om het recht te buigen.", "Jer 13:18": "Zeg tegen de koning en tegen de koningin: Vernedert u, gaat zitten; want uw hele hoofdsieraad, de kroon van uw heerlijkheid, is neergedaald.", "Luk 2:8": "En er waren herders in diezelfde landstreek, die in het veld verbleven en 's nachts de wacht hielden over hun kudde.", "Ezech 20:3": "Mensenkind, spreek tot de oudsten van Israël, en zeg tegen hen: Zo zegt de Heere HEERE: Komt u om Mij te vragen? Zo waarachtig als Ik leef, zo Ik door u gevraagd word, spreekt de Heere HEERE!", "Rom 2:11": "Want er is geen aanneming van het persoon bij God.", "Fil 2:14": "Doe alle dingen zonder murmureren en tegenspreken;", "Ps 118:12": "Zij hadden mij omringd als bijen; zij zijn uitgeblust als een doornenvuur; het is in de Naam van de HEERE, dat ik hen verslagen heb.", "Ps 72:14": "Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "Deut 11:12-15": "Een land, dat de HEERE, uw God, verzorgt; de ogen van de HEERE, uw God, zijn er voortdurend op gericht, van het begin van het jaar tot het einde van het jaar. En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel; Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt.", "Ezech 11:5": "Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.", "Num 23:5": "Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.", "Jes 31:9": "En hij zal van angst voorbijgaan naar zijn rots, en zijn vorsten zullen voor de banier verschrikken, spreekt de HEERE, Die te Sion vuur, en te Jeruzalem een oven heeft.", "Deut 18:18": "Een Profeet zal Ik hun doen opstaan uit hun broeders, zoals u; en Ik zal Mijn woorden in Zijn mond leggen, en Hij zal tot hen spreken alles wat Ik Hem gebieden zal.", "Spr 29:25": "De angst voor mensen legt een strik; maar wie op de HEERE vertrouwt, zal veilig gesteld worden.", "Deut 31:4": "En de HEERE zal met hen doen, zoals Hij met Sihon en Og, koningen van de Amorieten, en met hun land gedaan heeft, die Hij weggevaagd heeft.", "Num 27:12-14": "Daarna zei de HEERE tegen Mozes: Klim op deze berg Abarim, en zie dat land, dat Ik de kinderen van Israël gegeven heb. Wanneer u dat gezien zult hebben, dan zult u met uw volk verenigd worden, u ook, zoals uw broer Aäron daarmee verenigd is; Omdat u tegen Mijn bevel opstandig bent geweest in de woestijn Zin, bij de twist van de vergadering, toen u Mij bij het water voor hun ogen had moeten heiligen. Dat is het water van Meriba, bij Kades, in de woestijn Zin.", "1 Tim 5:21": "Ik roep als getuige God aan, en de Heere Jezus Christus, en de uitverkoren engelen, dat u deze dingen bewaart, zonder vooroordeel, niets doend uit partijdigheid.", "1 Kon 9:5": "Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.", "1 Sam 16:7": "Doch de HEERE zei tegen Samuël: Kijk niet naar zijn gestalte, en ook niet naar zijn lange lengte, want Ik heb hem verworpen; want het is niet zoals de mens ziet; want de mens kijkt naar wat voor ogen is, maar de HEERE kijkt naar het hart.", "Klaagl 3:8": "Gimel. Ook wanneer ik roep en schreeuw, sluit Hij Zijn oren voor mijn gebed.", "Joz 14:6": "Toen naderden de kinderen van Juda tot Jozua, te Gilgal, en Kaleb, de zoon van Jefunne, de Keneziet, zei tegen hem: U weet het woord dat de HEERE tot Mozes, de man van God, gesproken heeft te Kades-Barnea, vanwege mij, en vanwege u.", "Job 39:9": "Die Ik de wildernis tot zijn huis besteld heb, en het ziltige tot zijn woningen.", "Num 34:19": "En dit zijn de namen van deze mannen: van de stam van Juda, Kaleb, zoon van Jefunne;", "Lev 1:1": "En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:", "Gen 15:5": "Toen leidde Hij hem naar buiten, en zei: Zie nu op naar de hemel, en tel de sterren, als u ze tellen kunt; en Hij zei tegen hem: Zo zal uw nageslacht zijn!", "1 Sam 10:7": "En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "Deut 5:33": "In heel de weg die de HEERE, uw God, u gebiedt, zult u gaan; opdat u leeft, en opdat het u goed gaat, en u de dagen verlengt in het land dat u erven zult.", "Deut 10:19": "Daarom zult u de vreemdeling liefhebben, want u bent vreemdelingen geweest in het land Egypte.", "Deut 24:16": "De vaders zullen niet gedood worden voor de kinderen, en de kinderen zullen niet gedood worden voor de vaders; ieder zal om zijn eigen zonde gedood worden.", "Spr 20:24": "De treden van de man zijn van de HEERE; hoe zou een mens dan zijn weg begrijpen?", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Num 12:6-8": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken. Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is. Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?", "Ps 34:18": "Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.", "Gen 15:16": "En het vierde geslacht zal hierheen terugkeren; want de ongerechtigheid van de Amorieten is tot nog toe niet volkomen.", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Ex 23:8": "Ook zult u geen geschenk aannemen; want het geschenk verblindt de zienden, en het verdraait de zaak van de rechtvaardigen.", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "2 Kon 6:32": "(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?", "Rom 16:18": "Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.", "1 Kon 20:28": "En de man van God trad toe, en sprak tegen de koning van Israël, en zei: Zo zegt de HEERE: Omdat de Syriërs gezegd hebben: De HEERE is een God van de bergen, en Hij is niet een God van de laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat u weet, dat Ik de HEERE ben.", "Jer 34:1": "Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:", "Ex 17:5": "Toen zei de HEERE tegen Mozes: Ga voor het volk uit, en neem enkele van de oudsten van Israël met u mee; en neem uw staf, waarmee u de rivier sloeg, in uw hand, en ga op weg.", "Jes 40:29": "Hij geeft de moede kracht, en Hij vermeerdert de sterkte van wie geen krachten heeft.", "Jak 2:9": "maar als u de persoon aanneemt, doet u zonde, en wordt u door de wet als overtreders bestraft.", "2 Kron 31:10": "En Azarja, de hoofdpriester, van het huis van Zadok, sprak tot hem en zei: Sinds men deze heffing is begonnen tot het huis van de HEERE te brengen, is er te eten geweest en genoeg om verzadigd te worden, ja, tot overvloed toe; want de HEERE heeft Zijn volk gezegend, zodat deze grote hoeveelheid overgebleven is.", "Num 13:8": "Van de stam van Efraïm, Hosea, de zoon van Nun.", "Luk 22:50-71": "En één van hen sloeg de dienstknecht van de hogepriester, en hakte hem zijn rechteroor af. En Jezus antwoordde en zei: Laat het hierbij; en Hij raakte zijn oor aan en genas hem. En Jezus zei tegen de overpriesters, en de hoofdmannen van de tempel, en de oudsten, die tegen Hem gekomen waren: Bent u uitgegaan met zwaarden en stokken alsof tegen een rover?", "Kol 4:10": "U groet Aristarchus, mijn medegevangene; en Markus, de neef van Barnabas, over wie u opdrachten hebt ontvangen: als hij bij u komt, ontvang hem;", "Ps 136:18-20": "En machtige koningen heeft gedood; want Zijn goedertierenheid is voor eeuwig. Sihon, de Amoritische koning; want Zijn goedertierenheid is voor eeuwig. En Og, de koning van Basan; want Zijn goedertierenheid is voor eeuwig.", "Ezech 11:22": "Toen tilden de cherubs hun vleugels op, en de raderen tegenover hen; en de heerlijkheid van de God van Israël was van boven over hen.", "Num 11:14": "Ik alleen kan al dit volk niet dragen; want het is mij te zwaar!", "Gen 14:20": "En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Job 29:20": "Mijn heerlijkheid was nieuw bij mij, en mijn boog vernieuwde zich in mijn hand.", "Deut 3:26": "Maar de HEERE was zeer toornig op mij vanwege u, en luisterde niet naar mij; maar de HEERE zei tegen mij: Laat het u genoeg zijn; spreek niet meer tot Mij over deze zaak.", "Deut 4:10": "Denk aan de dag dat u voor de HEERE, uw God, bij Horeb stond, toen de HEERE tegen mij zei: Verzamel dit volk voor Mij, en Ik zal hun Mijn woorden laten horen, die zij zullen leren, om Mij te vrezen al de dagen dat zij op de aardbodem leven, en zij zullen ze hun kinderen leren;", "Ps 48:4": "God is in haar paleizen; Hij is er bekend voor een Hoog Vertrek.", "1 Sam 17:45": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt.", "Micha 3:1-4": "Verder zei ik: Hoor nu, hoofden van Jakob, en leiders van het huis van Israël! Betaamt het u niet om het recht te weten? Zij haten het goede, en hebben het kwade lief; zij roven hun huid van hen af, en hun vlees van hun beenderen. Ja, zij zijn het, die het vlees van mijn volk eten, en hun huid afstropen, en hun beenderen verbreken; en uiteen leggen, zoals in een pot, en als vlees in het midden van een ketel.", "Ps 46:2": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden.", "Deut 2:15": "Zo was ook de hand van de HEERE tegen hen, om hen uit het midden van het leger te verslaan, totdat zij verteerd waren.", "Jak 4:3": "U bidt, en u ontvangt niet, omdat u verkeerd bidt, met de bedoeling het in uw lusten door te brengen.", "Ps 62:9": "Vertrouw op Hem te allen tijde, o volk! Stort uw hart uit voor Zijn aangezicht; God is ons een Toevlucht. Sela.", "Ezech 37:1": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen.", "Deut 34:9-11": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had. En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht, In al de tekenen en de wonderen, waartoe de HEERE hem gezonden had, om die te doen in het land Egypte aan farao, en aan al zijn knechten, en aan heel zijn land;", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "Num 14:24": "Maar Mijn dienaar Kaleb, omdat een andere geest met hem geweest is, en hij Mij trouw is blijven volgen, zal Ik hem brengen tot het land waarin hij gekomen was, en zijn nageslacht zal het erfelijk bezitten.", "2 Tim 2:23-25": "En verwerp de dwaze en onverstandige vragen, wetend dat zij twisten voortbrengen. En een dienstknecht van de Heere moet niet twisten, maar vriendelijk zijn tegen allen, bekwaam om te leren, en in staat om kwaad te verdragen; met zachtmoedigheid onderwijzend hen die tegenstand bieden; of God hun misschien op enig moment bekering zou geven tot erkenning van de waarheid;", "Ruth 1:6": "Toen maakte zij zich klaar met haar schoondochters, en keerde terug uit de velden van Moab; want zij had in het land van Moab gehoord dat de HEERE naar Zijn volk had omgezien en hun brood gaf.", "Ezech 3:10-12": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren. En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen. Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "Ps 66:18": "Had ik naar ongerechtigheid met mijn hart gezien, de Heere zou niet gehoord hebben.", "Jer 42:11": "Vrees niet voor het aangezicht van de koning van Babel, voor wie u vreest; vrees niet voor hem, spreekt de HEERE; want Ik zal met u zijn, om u te behouden en u van zijn hand te redden.", "Ps 146:7-9": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los. De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief. De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Hos 2:20": "En het zal op die dag gebeuren, dat Ik verhoren zal, spreekt de Heere; Ik zal de hemel verhoren, en die zal de aarde verhoren.", "Job 37:16": "Hebt u kennis van de opwegingen van de dikke wolken; de wonderen van Hem die volmaakt is in wetenschappen?", "Job 27:9": "Zal God zijn geroep horen, als benauwdheid over hem komt?", "2 Kon 19:6": "En Jesaja zei tegen hen: Zo zult u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bevreesd voor de woorden die u gehoord hebt, waarmee de dienaars van de koning van Assyrië Mij gelasterd hebben.", "Deut 5:2": "De HEERE, onze God, heeft een verbond met ons gemaakt bij Horeb.", "Deut 31:15": "Toen verscheen de HEERE in de tent, in de wolkkolom; en de wolkkolom stond boven de deur van de tent.", "Ex 19:3": "En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen:", "2 Kron 15:7": "Daarom, wees u sterk, en laat uw handen niet verslappen; want er is loon naar uw werk.", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "Jer 30:7": "O wee! Want die dag is zo groot, dat er zijn gelijke niet geweest is; en het is een tijd van benauwdheid voor Jakob; toch zal hij daaruit verlost worden.", "2 Kon 2:15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "1 Sam 25:1": "En Samuël stierf; en heel Israël verzamelde zich, en zij bedreven rouw over hem, en begroeven hem in zijn huis te Rama. En David maakte zich op, en trok af naar de woestijn Paran.", "Ps 115:11": "U die de HEERE vreest! vertrouw op de HEERE; Hij is hun Hulp en hun Schild.", "Ps 37:33": "Maar de HEERE laat hem niet in zijn hand; en Hij veroordeelt hem niet, als hij geoordeeld wordt.", "1 Tim 2:1": "Ik vermaan dan voor alle dingen, dat er smekingen, gebeden, voorbiddingen en dankzeggingen gedaan worden voor alle mensen;", "Ps 37:24": "Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand.", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Deut 26:18": "En de HEERE heeft u heden laten zeggen dat u Hem tot een volk van het eigendom zult zijn, zoals Hij u gesproken heeft, en dat u al Zijn geboden zult houden;", "1 Sam 19:24": "En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?", "Hebr 3:8-11": "Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn; Waar uw vaders Mij beproefden; zij hebben Mij op de proef gesteld, en hebben Mijn werken gezien, veertig jaar lang. Daarom was Ik vertoornd over dat geslacht, en zei: Altijd dwalen zij met hun hart, en zij hebben Mijn wegen niet gekend.", "Deut 1:15-17": "Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen. En ik gebood in die tijd uw rechters, en zei: Hoor de geschillen tussen uw broeders, en oordeel rechtvaardig tussen de man en zijn broeder, en zijn vreemdeling. U zult in het gericht niemand voortrekken; u zult de kleine, evenals de grote, horen; u zult voor niemands aangezicht bang zijn; want het gericht is van God; maar de zaak die voor u te zwaar zal zijn, zult u naar mij laten komen, en ik zal die horen.", "Deut 4:4": "U daarentegen, die de HEERE, uw God, aanhing, u bent vandaag allemaal nog in leven.", "Deut 3:8": "Zo namen wij in die tijd het land uit de hand van de twee koningen van de Amorieten, die aan deze kant van de Jordaan waren, van de beek Arnon tot de berg Hermon toe;", "Spr 28:2": "Om de overtreding van het land zijn zijn vorsten met velen; maar door een verstandig en wetend mens zal het insgelijks lang blijven bestaan.", "Jer 24:4": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Job 22:28": "Als u een zaak besluit, zal zij voor u bestendig zijn; en op uw wegen zal het licht schijnen.", "Joh 9:31": "En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij.", "1 Sam 3:21": "En de HEERE ging door met verschijnen te Silo; want de HEERE openbaarde Zich aan Samuël te Silo, door het woord van de HEERE.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "Job 1:10": "Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land.", "1 Sam 10:6": "En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.", "Num 20:10": "En Mozes en Aäron verzamelden de gemeente voor de steenrots, en hij zei tot hen: Hoor toch, u opstandigen, zullen wij water voor u uit deze steenrots laten voortkomen?", "Job 36:16": "Zo zou Hij ook u afgekeerd hebben van de mond van de benauwdheid naar de ruimte, waaronder geen benauwing zou zijn geweest; en het gerecht van uw tafel zou vol vettigheid zijn geweest.", "Neh 4:14": "En ik zag toe, stond op, en zei tegen de edelen, tegen de leiders en tegen de rest van het volk: Wees niet bang voor hen; denk aan die grote en ontzagwekkende Heere, en strijd voor uw broeders, uw zonen en uw dochters, uw vrouwen en uw huizen.", "Job 38:25-27": "Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen? Om te regenen op het land, waar niemand is, op de woestijn, waarin geen mens is; Om het woeste en het verwoeste te verzadigen, en om het uitspruitsel van de grasscheutjes te doen meer worden.", "1 Tim 3:3": "niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "2 Kron 20:15": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God.", "Amos 7:15": "Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.", "Spr 20:28": "Weldadigheid en waarheid bewaren de koning; en door weldadigheid ondersteunt hij zijn troon.", "Jes 28:6": "en tot een Geest van het oordeel voor hem die te oordelen zit, en tot een sterkte voor hen die de strijd terugdrijven tot aan de poort toe.", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Spr 24:23-26": "Ook deze spreuken zijn van de wijzen. Het aanzien van personen in het gericht kennen, is niet goed. Wie tegen de goddeloze zegt: U bent rechtvaardig; die zullen de volken vervloeken, de naties zullen hem verafschuwen. Maar voor hen die hem bestraffen, zal liefelijkheid zijn; en de zegen van het goede zal op hen komen.", "Jes 52:12": "Want u zult niet haastig weggaan, en ook niet vluchtend heengaan; want de HEERE zal voor uw aangezicht heentrekken, en de God van Israël zal uw achterhoede zijn.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Jer 30:19": "En van hen zal dankzegging uitgaan, en een stem van spelende mensen; en Ik zal hen vermeerderen, en zij zullen niet minder worden, en Ik zal hen verheerlijken, en zij zullen niet gering worden.", "Ex 18:25": "En Mozes koos bekwame mannen, uit heel Israël, en stelde hen aan tot hoofden over het volk; leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien;", "Deut 29:9": "Houdt dan de woorden van dit verbond, en doet ze; opdat u verstandig handelt in alles, wat u doen zult.", "Lev 19:33": "En wanneer een vreemdeling bij u in uw land als vreemdeling verblijft, zult u hem niet verdrukken.", "Joz 10:42": "En Jozua nam al deze koningen en hun land in één keer in; want de HEERE, de God van Israël, streed voor Israël.", "Deut 1:9-18": "En ik sprak in die tijd tot u, en zei: Ik alleen kan u niet dragen. De HEERE, uw God, heeft u talrijk gemaakt, en zie, u bent vandaag zo talrijk als de sterren aan de hemel. De HEERE, de God van uw vaderen, maakt u, zoals u nu bent, duizend keer talrijker, en Hij zegent u, zoals Hij tot u gesproken heeft!", "Deut 17:16-20": "Maar hij mag voor zichzelf de paarden niet vermeerderen, en het volk niet laten terugkeren naar Egypte om paarden te vermeerderen; want de HEERE heeft tegen u gezegd: U mag voortaan niet meer terugkeren langs deze weg. Ook mag hij voor zichzelf de vrouwen niet vermeerderen, opdat zijn hart niet afwijkt; hij mag voor zichzelf ook geen zilver en goud in overvloed vermeerderen. Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt;", "Ex 22:21": "U mag de vreemdeling geen onrecht aandoen, en hem ook niet onderdrukken; want u bent zelf vreemdeling geweest in het land Egypte.", "Spr 3:24-26": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn. Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt. Want de HEERE zal uw vertrouwen zijn, en Hij zal uw voet bewaren voor gevangenschap.", "Ps 107:1-43": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft. En hen die Hij uit de landen verzameld heeft, van het oosten en van het westen, van het noorden en van de zee.", "Gen 49:20": "Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.", "Num 10:36": "En als zij rustte, zei hij: Kom terug, HEERE, tot de tienduizenden van de duizenden van Israël!", "Ps 145:15": "Ain. Aller ogen wachten op U; en U geeft hun hun voedsel op de juiste tijd.", "Hos 2:7": "Zij erkent echter niet dat Ik haar het koren, de nieuwe wijn, en de olie gegeven heb, en haar het zilver en goud vermeerderd heb, dat zij voor de Baäl gebruikt hebben.", "1 Sam 4:10": "Toen streden de Filistijnen, en Israël werd verslagen, en zij vluchtten ieder naar zijn tent; en er kwam een zeer grote nederlaag, zodat er van Israël dertigduizend man van het voetvolk vielen.", "2 Kron 20:17": "U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "Ps 34:20-23": "Resch. Veel is de tegenspoed van de rechtvaardige; maar uit dat alles redt de HEERE hem. Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken. Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "2 Sam 22:42": "Zij zagen uit, maar er was geen verlosser; naar de HEERE, maar Hij antwoordde hun niet.", "1 Kon 17:24": "Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is.", "1 Kron 5:9": "en hij woonde in het oosten, tot aan de ingang van de woestijn, vanaf de rivier de Eufraat; want hun vee was veel geworden in het land Gilead.", "Lev 25:20-22": "En als u zou zeggen: Wat zullen wij eten in het zevende jaar! Zie, wij zullen niet zaaien, en onze opbrengst niet inzamelen; Dan zal Ik Mijn zegen gebieden over u in het zesde jaar, dat het de opbrengst voor drie jaar zal voortbrengen. Het achtste jaar nu zult u zaaien, en zult van de oude opbrengst eten, tot het negende jaar toe; totdat zijn opbrengst binnengekomen is, zult u het oude eten.", "Gen 28:21": "en ik in vrede naar het huis van mijn vader terugkeer, dan zal de HEERE mij tot een God zijn!", "2 Kon 3:11": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.", "Num 26:65": "Want de HEERE had van hen gezegd, dat zij in de woestijn zeker zouden sterven; en er was niemand van hen overgebleven, dan Kaleb, de zoon van Jefunne, en Jozua, de zoon van Nun.", "Richt 1:36": "En het gebied van de Amorieten liep van de pas van Akrabbim, van de rots, en verder omhoog.", "Lev 11:4-8": "Deze echter zult u niet eten, van de dieren die alleen herkauwen, of alleen de klauwen verdelen: de kameel, want die herkauwt wel, maar verdeelt de klauw niet; die zal voor u onrein zijn; En het klipdasje, want het herkauwt wel, maar verdeelt de klauw niet; dat zal voor u onrein zijn; En de haas, want hij herkauwt wel, maar verdeelt de klauw niet; die zal voor u onrein zijn.", "Mark 14:53": "En zij leidden Jezus weg naar de hogepriester; en bij hem kwamen alle overpriesters, en de oudsten, en de Schriftgeleerden bijeen.", "Amos 3:8": "De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?", "Luk 12:32": "Wees niet bang, klein kuddeke, want het is het welbehagen van uw Vader om u het Koninkrijk te geven.", "Spr 18:19": "Een broeder is moeilijker te winnen dan een sterke stad; en geschillen zijn als de grendel van een paleis.", "Zach 1:7": "Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Num 9:15-23": "En op de dag van het oprichten van de tabernakel bedekte de wolk de tabernakel, op de tent der getuigenis; en in de avond was er over de tabernakel als het ware een gedaante van het vuur, tot aan de morgen. Zo gebeurde het voortdurend; de wolk bedekte hem, en 's nachts was er een gedaante van het vuur. Maar nadat de wolk werd opgeheven van boven de tent, zo trokken daarna ook de kinderen van Israël verder; en op de plaats waar de wolk bleef, daar legerden de kinderen van Israël zich.", "Num 22:34": "Toen zei Bileam tegen de Engel van de HEERE: Ik heb gezondigd, want ik heb niet geweten dat U mij tegemoet op deze weg stond; en nu, als het kwaad is in Uw ogen, zal ik terugkeren.", "Deut 3:9": "(De Sidoniërs noemen Hermon Sirjon; maar de Amorieten noemen hem Senir.)", "1 Tim 3:2": "Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren;", "Tit 3:1-3": "Herinner hen eraan dat zij aan de overheden en machten onderdanig zijn, dat zij hun gehoorzaam zijn, dat zij tot alle goed werk bereid zijn; Dat zij niemand belasteren, geen ruziezoekers zijn, maar vriendelijk zijn, en alle zachtmoedigheid bewijzen tegenover alle mensen. Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Hand 5:38-41": "En nu zeg ik u: Houd u afzijdig van deze mensen, en laat hen gaan; want als deze raad of dit werk uit mensen is, zal het gebroken worden; maar als het uit God is, dan kunt u dat niet breken; anders zou u misschien bevonden worden ook tegen God te strijden. En zij gaven hem gehoor; en toen zij de apostelen bij zich geroepen hadden, geselden zij hen, en geboden hun dat zij niet zouden spreken in de Naam van Jezus; en lieten hen gaan.", "Ps 135:7": "Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort.", "Amos 7:7": "Nog liet Hij mij dit zien: zie, de Heere stond op een muur, die met een paslood gemaakt was, en een paslood was in Zijn hand.", "Ps 3:4": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "2 Petr 2:7-9": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft; (want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden); dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Ex 14:14": "De HEERE zal voor u strijden, en u zult stil zijn.", "Ps 37:19": "Zij zullen niet beschaamd worden in de kwade tijd, en in de dagen van het honger zullen zij verzadigd worden.", "Gal 5:10": "Ik vertrouw van u in de Heere, dat u niet anders zult denken; maar wie u in verwarring brengt, zal het oordeel dragen, wie hij ook is.", "Joh 1:6": "Er was een mens door God gezonden, wiens naam Johannes was.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Jer 31:35": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:", "Hos 11:3": "Ik echter leerde Efraïm lopen; Hij nam ze op Zijn armen, maar zij erkenden niet dat Ik ze genas.", "Ps 102:21": "Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Matt 25:24": "Maar hij die het ene talent ontvangen had, kwam ook en zei: Heer, ik kende u, dat u een hard mens bent, die maait waar u niet gezaaid hebt, en verzamelt vandaar waar u niet gestrooid hebt;", "Gen 28:15": "En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal u terugbrengen naar dit land; want Ik zal u niet verlaten, totdat Ik gedaan heb wat Ik tot u gesproken heb.", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "1 Petr 3:7": "U mannen, evenzo, woon bij haar met verstand, en bewijs eer aan het vrouwelijke lichaam, als het zwakste, als medeerfgenamen van de genade van het leven met haar; opdat uw gebeden niet verhinderd worden.", "Spr 25:5": "Doe de goddeloze weg van het aangezicht van de koning, en zijn troon zal door gerechtigheid bevestigd worden.", "Num 27:18-23": "Toen zei de HEERE tegen Mozes: Neem Jozua, de zoon van Nun, een man in wie de Geest is, bij u; en leg uw hand op hem; En stel hem voor Eleazar, de priester, en voor de hele vergadering; en geef hem opdracht voor hun ogen; En leg iets van uw waardigheid op hem, opdat zij luisteren, namelijk de hele vergadering van de kinderen van Israël.", "Spr 30:8": "Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is;", "1 Sam 30:8": "Toen vroeg David de HEERE: Zal ik deze bende achternajagen? Zal ik ze inhalen? En Hij zei tegen hem: Jaag na, want u zult zeker inhalen, en u zult zeker verlossen.", "Spr 25:24": "Het is beter te wonen op een hoek van het dak, dan met een twistzieke huisvrouw, en dat in een huis vol gezelschap.", "Richt 13:25": "En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Zach 12:8": "Op die dag zal de HEERE de inwoners van Jeruzalem beschutten; en wie onder hen struikelen zou, zal op die dag zijn als David; en het huis van David zal zijn als goden, als de Engel van de HEERE voor hun aangezicht.", "Ps 46:12": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Ex 23:6-8": "U zult het recht van uw arme niet buigen in zijn geschil. Blijf ver van valse zaken; en de onschuldige en rechtvaardige zult u niet doden; want Ik zal de goddeloze niet rechtvaardigen. Ook zult u geen geschenk aannemen; want het geschenk verblindt de zienden, en het verdraait de zaak van de rechtvaardigen.", "Mark 15:1": "En meteen, vroeg in de morgen, hielden de overpriesters samen overleg, met de oudsten en Schriftgeleerden, en de hele Raad, en nadat zij Jezus gebonden hadden, brachten zij Hem weg, en gaven Hem aan Pilatus over.", "1 Kon 21:8-14": "Zij schreef dan brieven in de naam van Achab, en verzegelde ze met zijn zegel; en zond de brieven aan de oudsten en aan de edelen, die in zijn stad waren, wonend bij Naboth. En zij schreef in die brieven: Roept een vasten uit, en zet Naboth vooraan onder het volk; En zet tegenover hem twee mannen, zonen van Belial, die tegen hem getuigen en zeggen: U hebt God en de koning gevloekt; en voer hem naar buiten, en stenig hem, dat hij sterft.", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "Spr 2:7": "Hij legt weg voor de oprechten een bestendig bezit; Hij is een schild voor hen die oprecht wandelen;", "Deut 2:10": "De Emieten woonden hiervoor daarin, een groot en talrijk volk, en lang van gestalte, zoals de Enakieten.", "Jak 3:14-16": "Maar als u bittere afgunst en eigenbelang in uw hart hebt, beroem u dan niet en lieg niet tegen de waarheid. Dat is de wijsheid niet die van boven komt, maar is aards, ongeestelijk, duivels. Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Job 5:10": "Die de regen geeft op de aarde, en water zendt op de straten;", "Num 14:1-10": "Toen kwam de hele vergadering in opstand, en zij verhieven hun stem, en het volk weende diezelfde nacht. En al de kinderen van Israël morden tegen Mozes en tegen Aäron; en de hele vergadering zei tegen hen: Och, waren wij toch in Egypteland gestorven! Of, och, waren wij toch in deze woestijn gestorven! En waarom brengt de HEERE ons naar dat land, om door het zwaard te vallen, en onze vrouwen en onze kinderen tot roof te worden? Zou het voor ons niet beter zijn om naar Egypte terug te keren?", "Ex 24:14": "En hij zei tegen de oudsten: Blijft u hier voor ons, totdat wij weer tot u komen; en zie, Aäron en Hur zijn bij u; wie een zaak heeft, moet naar hen toe gaan.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "Ps 31:24": "Heb de HEERE lief, u, al Zijn gunstgenoten! Want de HEERE behoedt de gelovigen, en vergeldt overvloedig hem die hoogmoed bedrijft.", "Deut 1:41-44": "Toen antwoordde u, en zei tot mij: Wij hebben tegen de HEERE gezondigd; wij zullen optrekken en strijden, naar alles wat de HEERE, onze God, ons geboden heeft. Toen u nu ieder zijn oorlogswapens omgordde, en er klaar voor was om naar het gebergte op te trekken, zei de HEERE tot mij: Zeg hun: Trek niet op, en strijd niet, want Ik ben niet in uw midden; anders wordt u door uw vijanden verslagen. Toen ik nu tot u sprak, luisterde u niet, maar u kwam tegen het bevel van de HEERE in opstand, en handelde trots, en trok op naar het gebergte.", "Gen 1:29": "En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.", "Spr 28:16": "Een vorst, die alle verstand mist, is ook zeer onderdrukkend; maar wie de hebzucht haat, zal de dagen verlengen.", "Ps 145:16": "Pe. U doet Uw hand open, en verzadigt alles wat leeft, naar Uw welbehagen.", "Job 22:25": "Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;", "Num 14:8": "Als de HEERE een welgevallen aan ons heeft, zal Hij ons in dat land brengen, en zal het ons geven; een land dat overvloeit van melk en honing.", "Ps 18:35": "Hij leert mijn handen ten strijde, zodat een stalen boog met mijn armen verbroken is.", "Joz 5:6": "Want de kinderen van Israël wandelden veertig jaar in de woestijn, totdat heel het volk van de krijgslieden die uit Egypte getrokken waren, verdwenen was; zij waren de stem van de HEERE niet gehoorzaam geweest, aan wie de HEERE gezworen had dat Hij hen het land niet zou laten zien, dat de HEERE hun vaderen gezworen had ons te zullen geven, een land dat overvloeit van melk en honing.", "Ezra 7:25": "En u, Ezra, stel naar de wijsheid van uw God, die in uw hand is, regeerders en rechters aan, die al het volk rechtspreken dat aan de overkant van de rivier is, allen die de wetten van God kennen; en wie ze niet kent, moet u het bekendmaken.", "Spr 16:12": "Het is voor koningen een gruwel goddeloosheid te doen; want door gerechtigheid wordt de troon bevestigd.", "Richt 7:9": "En het gebeurde in die nacht, dat de HEERE tegen hem zei: Sta op, ga naar beneden naar het leger, want Ik heb het in uw hand gegeven.", "Job 36:11": "Als zij horen, en Hem dienen, dan zullen zij hun dagen eindigen in het goede, en hun jaren in liefelijkheden.", "Spr 25:8": "Ga niet haastig een geschil aan om te twisten, opdat u misschien aan het einde daarvan niet weet wat u moet doen, wanneer uw naaste u beschaamd zou hebben.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "Joz 10:5": "Toen werden de vijf koningen van de Amorieten verzameld en trokken op, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en streden tegen haar.", "Hab 3:3": "God kwam van Theman, en de Heilige van de berg Paran. Sela. Zijn heerlijkheid bedekte de hemelen, en het aardrijk was vol van Zijn lof.", "Zach 9:17": "Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.", "Ex 19:1": "In de derde maand na het uittrekken van de kinderen van Israël uit Egypteland, op diezelfde dag kwamen zij in de woestijn Sinaï.", "1 Sam 9:6": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.", "Deut 7:22": "En de HEERE, uw God, zal deze volken voor uw aangezicht geleidelijk uitwerpen; u zult hen niet snel mogen vernietigen, omdat anders de wilde dieren van het veld tegen u te veel worden.", "Ps 115:16": "Wat de hemel betreft, de hemel is van de HEERE; maar de aarde heeft Hij aan de mensenkinderen gegeven.", "1 Sam 12:4": "Toen zeiden zij: U hebt ons geen onrecht aangedaan, en u hebt ons niet onderdrukt, en u hebt van niemands hand iets genomen.", "Jes 41:11": "Zie, zij zullen beschaamd worden en te schande gemaakt, allen die tegen u in woede ontstoken zijn; zij zullen worden als niets, en de mensen die met u twisten, zullen vergaan.", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Deut 3:23-29": "Ook smeekte ik de HEERE om genade in die tijd: Heere HEERE! U bent begonnen Uw dienaar Uw grootheid en Uw sterke hand te tonen; want welke God is er in de hemel of op de aarde, die kan doen naar Uw werken en naar Uw machtige daden! Laat mij toch oversteken, en dat goede land bezien, dat aan de overkant van de Jordaan is, dat goede gebergte, en de Libanon!", "1 Sam 16:22": "Daarna stuurde Saul iemand naar Isaï om te zeggen: Laat David toch bij mij blijven, want hij heeft genade gevonden in mijn ogen.", "Jes 6:4": "Zodat de posten van de dorpels bewogen door de stem van hem die riep; en het huis werd vervuld met rook.", "2 Kon 3:15": "Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.", "Ps 82:2-4": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela. Doe recht aan de arme en de wees; geef recht aan de verdrukte en de arme. Verlos de arme en de behoeftige, ruk hem uit de hand van de goddelozen.", "Spr 30:33": "Want het karnen van melk brengt boter voort, en het knijpen van de neus brengt bloed voort, en het opjagen van de toorn brengt twist voort.", "2 Sam 21:16-22": "En Isbi-Benob, die van de kinderen van Rafa was, met een speer die driehonderd sikkel koper woog, en hij was omgord met een nieuw zwaard; deze dacht David te doden. Maar Abisai, de zoon van Zeruja, hielp hem, en sloeg de Filistijn, en doodde hem. Toen zwoeren de mannen van David hem, en zeiden: U zult niet meer met ons uittrekken ten strijde, zodat u de lamp van Israël niet uitblust. En het gebeurde daarna, dat er opnieuw een oorlog was te Gob tegen de Filistijnen. Toen sloeg Sibbechai, de Husathiet, Saf, die van de kinderen van Rafa was.", "Rom 8:31": "Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn?", "Num 13:28-33": "Behalve dat het een sterk volk is, dat in dat land woont, en de steden zijn vast en zeer groot; en ook hebben wij daar kinderen van Enak gezien. De Amalekieten wonen in het land van het zuiden; maar de Hethieten, en de Jebusieten, en de Amorieten wonen op het gebergte; en de Kanaänieten wonen aan de zee, en aan de oever van de Jordaan. Toen bracht Kaleb het volk tot rust voor Mozes, en zei: Laat ons vrijmoedig optrekken, en het in bezit nemen; want wij zullen het zeker kunnen overweldigen!", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "Spr 26:17": "De voorbijganger die zich opwindt in een twist die hem niet aangaat, is als iemand die een hond bij de oren grijpt.", "Deut 2:8": "Toen wij nu doorgetrokken waren van onze broeders, de kinderen van Ezau, die in Seir woonden, van de weg van het vlakke veld, van Elath en van Ezeon-Geber, keerden wij ons om en trokken de weg van de woestijn van Moab door.", "Lev 9:23": "Toen ging Mozes met Aäron in de tent der samenkomst; daarna kwamen zij naar buiten, en zegenden het volk; en de heerlijkheid van de HEERE verscheen aan heel het volk.", "Num 10:33-36": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren. En de wolk van de HEERE was overdag over hen, als zij uit het leger vertrokken. Het gebeurde nu bij het optrekken van de ark, dat Mozes zei: Sta op, HEERE! En laat Uw vijanden verstrooid worden, en laat Uw haters van Uw aangezicht vluchten!", "Jes 5:22": "Wee hun die helden zijn om wijn te drinken, en die dappere mannen zijn om sterke drank te mengen!", "Hos 2:17": "En Ik zal op die dag een verbond voor hen sluiten met het wild gedierte van het veld, en met het gevogelte van de hemel, en het kruipend gedierte van de aardbodem; en Ik zal de boog, en het zwaard, en de oorlog van de aarde wegbreken, en Ik zal hen in veiligheid laten neerliggen.", "Num 32:19": "Want wij zullen met hen niet erven aan de andere zijde van de Jordaan en verder weg, omdat onze erfenis ons toegekomen is aan deze zijde van de Jordaan, naar het oosten.", "Jes 45:4": "Om Jakobs, Mijn knechts wil, en Israëls, Mijn uitverkorenen; ja, Ik riep u bij uw naam, Ik noemde u toe, hoewel u Mij niet kende.", "Deut 15:4": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten;", "Jes 46:3": "Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die van Mij gedragen zijn vanaf de buik af, en opgenomen vanaf de baarmoeder af.", "1 Kon 19:9": "En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?", "Ezech 34:31": "U nu, o Mijn schapen, schapen van Mijn weide! U bent mensen; maar Ik ben uw God, spreekt de Heere HEERE.", "Ps 33:15": "Hij vormt hun aller hart; Hij let op al hun werken.", "1 Kon 3:9": "Geef dan Uw knecht een verstandig hart om Uw volk te richten, en om onderscheid te kunnen maken tussen goed en kwaad; want wie zou dit zware volk van U kunnen richten?", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Num 33:20": "En zij vertrokken van Rimmon-perez, en legerden zich in Libna.", "Ex 12:37": "Zo reisden de kinderen van Israël uit van Rameses naar Sukkoth, ongeveer zeshonderdduizend te voet, alleen de mannen, behalve de kinderen.", "Deut 18:15": "Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren,", "Jer 27:6": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Gen 14:7": "Daarna keerden zij terug en kwamen bij En-mispat, dat is Kades, en versloegen heel het land van de Amalekieten, en ook de Amoriet, die te Hazezon-thamar woonde.", "2 Kor 12:20": "Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn;", "Joz 8:33": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen.", "Jes 16:5": "Want er zal een troon bevestigd worden in goedertierenheid, en daarop zal iemand betrouwbaar zitten in de tent van David, iemand die oordeelt en het recht zoekt, en vaardig is tot gerechtigheid.", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Ps 34:10": "Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek.", "Matt 6:26": "Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven?", "Num 14:2-4": "En al de kinderen van Israël morden tegen Mozes en tegen Aäron; en de hele vergadering zei tegen hen: Och, waren wij toch in Egypteland gestorven! Of, och, waren wij toch in deze woestijn gestorven! En waarom brengt de HEERE ons naar dat land, om door het zwaard te vallen, en onze vrouwen en onze kinderen tot roof te worden? Zou het voor ons niet beter zijn om naar Egypte terug te keren? En zij zeiden de een tegen de ander: Laat ons een leider aanstellen, en terugkeren naar Egypte!", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "1 Sam 17:46": "Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft.", "Deut 33:11": "Zegen, HEERE! zijn vermogen, en laat U het werk van zijn handen goed bevallen; versla de lenden van hen die tegen hem opstaan en hem haten, zodat zij niet weer opstaan!", "Luk 12:22-31": "En Hij zei tegen Zijn discipelen: Daarom zeg Ik u
