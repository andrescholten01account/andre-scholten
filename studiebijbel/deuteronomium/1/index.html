"1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Dit zijn de woorden die Mozes tot heel Israël gesproken heeft, aan deze kant van de Jordaan, in de woestijn, op het vlakke veld tegenover Suf, tussen Paran en Tofel, en Laban, en Hazeroth, en Dizahab.", "2": "Elf dagreizen is het van Horeb, via de weg van het gebergte Seïr, tot aan Kades-Barnea.", "3": "En het gebeurde in het veertigste jaar, in de elfde maand, op de eerste dag van de maand, dat Mozes sprak tot de kinderen van Israël, naar alles wat de HEERE hem voor hen bevolen had;", "4": "nadat hij Sihon, de koning van de Amorieten, die in Hesbon woonde, verslagen had, en Og, de koning van Bazan, die in Astharoth woonde, bij Edreï.", "5": "Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:", "6": "De HEERE, onze God, sprak tot ons bij Horeb, en zei: U bent lang genoeg bij deze berg gebleven.", "7": "Keer u om, vertrek, en ga naar het gebergte van de Amorieten, en naar al hun buren, in het vlakke veld, op het gebergte, en in de laagte, en in het zuiden, en aan de kust van de zee; het land van de Kanaänieten, en de Libanon, tot aan die grote rivier, de rivier de Eufraat.", "8": "Zie, Ik heb dat land aan u gegeven; ga erin, en bezit erfelijk het land, dat de HEERE aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft dat Hij het hun en hun nageslacht na hen geven zou.", "9": "En ik sprak in die tijd tot u, en zei: Ik alleen kan u niet dragen.", "10": "De HEERE, uw God, heeft u talrijk gemaakt, en zie, u bent vandaag zo talrijk als de sterren aan de hemel.", "11": "De HEERE, de God van uw vaderen, maakt u, zoals u *nu* bent, duizend keer talrijker, en Hij zegent u, zoals Hij tot u gesproken heeft!", "12": "Hoe zou ik alleen uw moeite, en uw last, en uw geschillen dragen?", "13": "Neem voor u wijze, verstandige en ervaren mannen, uit uw stammen, zodat ik hen tot uw hoofden stel.", "14": "Toen antwoordde u mij, en zei: Dit woord dat u gesproken hebt, is goed om te doen.", "15": "Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen.", "16": "En ik gebood in die tijd uw rechters, en zei: Hoor *de geschillen* tussen uw broeders, en oordeel rechtvaardig tussen de man en zijn broeder, en zijn vreemdeling.", "17": "U zult in het gericht niemand voortrekken; u zult de kleine, evenals de grote, horen; u zult voor niemands aangezicht bang zijn; want het gericht is van God; maar de zaak die voor u te zwaar zal zijn, zult u naar mij laten komen, en ik zal die horen.", "18": "Zo gebood ik u in die tijd alle zaken die u zou doen.", "19": "Toen vertrokken wij van Horeb, en trokken door die hele grote en vreselijke woestijn, die u gezien hebt, op de weg van het gebergte van de Amorieten, zoals de HEERE, onze God, ons geboden had; en wij kwamen bij Kades-Barnea.", "20": "Toen zei ik tot u: U bent gekomen bij het gebergte van de Amorieten, dat de HEERE, onze God, ons geven zal.", "21": "Zie, de HEERE, uw God, heeft dat land aan u gegeven; trek op, bezit het erfelijk, zoals de HEERE, de God van uw vaderen, tot u gesproken heeft; wees niet bang, en wees niet ontmoedigd.", "22": "Toen kwam u allen dichterbij mij, en zei: Laten wij mannen voor ons uit sturen, die het land voor ons verkennen, en ons bericht terugbrengen, welke weg wij daarin op moeten trekken, en tot welke steden wij zullen komen.", "23": "Deze zaak nu was goed in mijn ogen; zo nam ik uit u twaalf mannen, van elke stam een man.", "24": "Die keerden zich om, en trokken op naar het gebergte, en kwamen bij het dal Eskol, en verkenden dat.", "25": "En zij namen van de vrucht van het land in hun hand, en brachten die naar ons toe, en brachten ons bericht terug, en zeiden: Het land, dat de HEERE, onze God, ons geven zal, is goed.", "26": "Maar u wilde niet optrekken; maar u kwam tegen het bevel van de HEERE, uw God, in opstand.", "27": "En u mopperde in uw tenten, en zei: Omdat de HEERE ons haat, heeft Hij ons uit het land Egypte weggevoerd, om ons in de hand van de Amorieten te leveren, om ons te verdelgen.", "28": "Waarheen zouden wij optrekken? Onze broeders hebben ons hart doen smelten, en zeiden: Het is een volk, groter en langer dan wij; de steden zijn groot, en versterkt tot aan de hemel toe; ook hebben wij daar kinderen van de Enakieten gezien.", "29": "Toen zei ik tot u: Wees niet verschrikt, en wees niet bang voor hen.", "30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "31": "En in de woestijn, waar u gezien hebt dat de HEERE, uw God, u gedragen heeft, zoals een man zijn zoon draagt, op heel de weg die u gegaan bent, totdat u kwam bij deze plaats.", "32": "Maar ondanks dit woord geloofde u niet in de HEERE, uw God.", "33": "Die voor u uit op de weg ging, om voor u de plaats uit te zoeken waar u zou legeren; 's nachts in het vuur, om u de weg te wijzen waarin u zou gaan, en overdag in de wolk.", "34": "Toen de HEERE de stem van uw woorden hoorde, werd Hij zeer toornig, en zwoer, en zei:", "35": "Voorzeker zal niemand van deze mannen, van dit slechte geslacht, dat goede land zien, dat Ik gezworen heb aan uw vaderen te zullen geven!", "36": "Behalve Kaleb, de zoon van Jefunne; die zal het zien, en aan hem zal Ik het land geven waarop hij getreden heeft, en aan zijn kinderen; omdat hij volhard heeft de HEERE te volgen.", "37": "Ook werd de HEERE toornig op mij vanwege u, en zei: Ook u zult daar niet ingaan.", "38": "Jozua, de zoon van Nun, die voor u staat, die zal daar ingaan; sterk hem, want hij zal het aan Israël doen erven.", "39": "En uw kinderen, van wie u zei: Zij zullen tot een buit zijn; en uw kinderen, die vandaag nog geen goed noch kwaad kennen, die zullen daar ingaan, en aan hen zal Ik het geven, en zij zullen het erfelijk bezitten.", "40": "U daarentegen, keer u om, en reis naar de woestijn, de weg van de Schelfzee.", "41": "Toen antwoordde u, en zei tot mij: Wij hebben tegen de HEERE gezondigd; wij zullen optrekken en strijden, naar alles wat de HEERE, onze God, ons geboden heeft. Toen u nu ieder zijn oorlogswapens omgordde, en er klaar voor was om naar het gebergte op te trekken,", "42": "zei de HEERE tot mij: Zeg hun: Trek niet op, en strijd niet, want Ik ben niet in uw midden; anders wordt u door uw vijanden verslagen.", "43": "Toen ik nu tot u sprak, luisterde u niet, maar u kwam tegen het bevel van de HEERE in opstand, en handelde trots, en trok op naar het gebergte.", "44": "Toen trokken de Amorieten, die op dat gebergte woonden, op u af, en achtervolgden u, zoals bijen doen; en zij verpletterden u in Seïr tot Horma toe.", "45": "Toen u terugkwam en huilde voor het aangezicht van de HEERE, luisterde de HEERE niet naar uw stem, en neigde Zijn oren niet tot u.", "46": "Zo bleef u in Kades vele dagen, zo lang als u daar bleef."}, "SV": {"1": "Dit zijn de woorden, die Mozes tot gans Israël gesproken heeft, aan deze zijde van de Jordaan, in de woestijn, op het vlakke veld tegenover Suf, tussen Paran en tussen Tofel, en Laban, en Hazeroth, en Dizahab.", "2": "Elf dag *reizen* zijn het van Horeb, *door* den weg van het gebergte Seir, tot aan Kades-barnea.", "3": "En het is geschied in het veertigste jaar, in de elfde maand, op den eersten der maand, dat Mozes sprak tot de kinderen Israëls, naar alles wat hem de HEERE aan hen bevolen had;", "4": "Nadat hij geslagen had Sihon, den koning der Amorieten, die te Hesbon woonde, en Og, den koning van Bazan, welke woonde in Astharoth, te Edrei.", "5": "Aan deze zijde van de Jordaan, in het land van Moab, hief Mozes aan, deze wet uit te leggen, zeggende:", "6": "De HEERE, onze God, sprak tot ons aan Horeb, zeggende: Gij zijt lang genoeg bij dezen berg gebleven.", "7": "Keert u, en vertrekt, en gaat in het gebergte der Amorieten, en tot al hun geburen, in het vlakke veld, op het gebergte, en in de laagte, en in het zuiden, en aan de havens der zee; het land der Kanaänieten, en den Libanon, tot aan die grote rivier, de rivier Frath.", "8": "Ziet, Ik heb dat land gegeven voor uw aangezicht; gaat daarin, en bezit erfelijk het land, dat de HEERE aan uw vaderen, Abraham, Izak en Jakob gezworen heeft, dat Hij het hun en hun zaad na hen geven zou.", "9": "En ik sprak ter zelfder tijd tot u, zeggende: Ik alleen zal u niet kunnen dragen.", "10": "De HEERE, uw God, heeft u vermenigvuldigd, en ziet, gij zijt heden als de sterren des hemels in menigte.", "11": "De HEERE, uwer vaderen God, doe tot u, zo als gij *nu* zijt, duizendmaal meer, en Hij zegene u, gelijk als Hij tot u gesproken heeft!", "12": "Hoe zoude ik alleen uw moeite, en uw last, en uw twistzaken dragen?", "13": "Neemt u wijze, en verstandige, en ervarene mannen, van uw stammen, dat ik hen tot uw hoofden stelle.", "14": "Toen antwoorddet gij mij, en zeidet: Dit woord is goed, dat gij gesproken hebt, om te doen.", "15": "Zo nam ik de hoofden uwer stammen, wijze en ervarene mannen, en stelde hen tot hoofden over u, oversten van duizenden, en oversten van honderden, en oversten van vijftigen, en oversten van tienen, en ambtlieden voor uw stammen.", "16": "En ik gebood uw rechters ter zelfder tijd, zeggende: Hoort *de* *verschillen* tussen uw broederen, en richt recht tussen den man en tussen zijn broeder, en tussen deszelfs vreemdeling.", "17": "Gij zult het aangezicht in het gericht niet kennen; gij zult den kleine, zowel als den grote, horen; gij zult niet vrezen voor iemands aangezicht; want het gericht is Godes; doch de zaak, die voor u te zwaar zal zijn, zult gij tot mij doen komen, en ik zal ze horen.", "18": "Alzo gebood ik u te dier tijd alle zaken, die gij zoudt doen.", "19": "Toen vertogen wij van Horeb, en doorwandelden die gans grote en vreselijke woestijn, die gij gezien hebt, op den weg van het gebergte der Amorieten, gelijk de HEERE, onze God, ons geboden had; en wij kwamen tot Kades-barnea.", "20": "Toen zeide ik tot ulieden: Gij zijt gekomen tot het gebergte der Amorieten, dat de HEERE, onze God, ons geven zal.", "21": "Ziet, de HEERE, uw God, heeft dat land gegeven voor uw aangezicht; trekt op, bezit het erfelijk, gelijk als de HEERE, uwer vaderen God, tot u gesproken heeft; vreest niet, en ontzet u niet.", "22": "Toen naderdet gij allen tot mij, en zeidet: Laat ons mannen voor ons aangezicht heenzenden, die ons het land uitspeuren, en ons bescheid wederbrengen, wat weg wij daarin optrekken zullen, en tot wat steden wij komen zullen.", "23": "Deze zaak nu was goed in mijn ogen; zo nam ik uit u twaalf mannen, van elken stam een man.", "24": "Die keerden zich, en togen op naar het gebergte, en kwamen tot het dal Eskol, en verspiedden datzelve.", "25": "En zij namen van de vrucht des lands in hun hand, en brachten ze tot ons af, en zeiden ons bescheid weder, en zeiden: Het land, dat de HEERE, onze God, ons geven zal, is goed.", "26": "Doch gij wildet niet optrekken; maar gij waart den mond des HEEREN uws Gods, wederspannig.", "27": "En gij murmureerdet in uw tenten, en zeidet: Omdat de HEERE ons haat, heeft Hij ons uit Egypteland uitgevoerd, opdat Hij ons levere in de hand der Amorieten, om ons te verdelgen.", "28": "Waarheen zouden wij optrekken? Onze broeders hebben ons hart doen smelten, zeggende: Het is een volk, groter en langer dan wij; de steden zijn groot, en gesterkt tot in den hemel toe; ook hebben wij daar kinderen der Enakieten gezien.", "29": "Toen zeide ik tot u: Verschrikt niet, en vreest niet voor hen.", "30": "De HEERE, uw God, Die voor uw aangezicht wandelt, Die zal voor u strijden, naar alles, wat Hij bij u voor uw ogen gedaan heeft in Egypte.", "31": "En in de woestijn, waar gij gezien hebt, dat de HEERE uw God, u daarin gedragen heeft, als een man zijn zoon draagt, op al den weg, dien gij gewandeld hebt, totdat gij kwaamt aan deze plaats.", "32": "Maar door dit woord geloofdet gij niet aan den HEERE, uw God.", "33": "Die voor uw aangezicht op den weg wandelde, om u de plaats uit te zien, waar gij zoudt legeren; des nachts in het vuur, opdat Hij u den weg wees, waarin gij zoudt gaan, en des daags in de wolk.", "34": "Als nu de HEERE de stem uwer woorden hoorde, zo werd Hij zeer toornig, en zwoer, zeggende:", "35": "Zo iemand van deze mannen, *van* dit kwade geslacht, zal zien dat goede land, hetwelk Ik gezworen heb uw vaderen te zullen geven!", "36": "Behalve Kaleb, de zoon van Jefunne; die zal het zien, en aan hem zal Ik het land geven, waarop hij getreden heeft, en aan zijn kinderen; omdat hij volhard heeft den HEERE te volgen.", "37": "Ook vertoornde zich de HEERE op mij om uwentwil, zeggende: Gij zult daar ook niet inkomen.", "38": "Jozua, de zoon van Nun, die voor uw aangezicht staat, die zal daarin komen; sterk denzelven, want hij zal het Israël doen erven.", "39": "En uw kinderkens, waarvan gij zeidet: Zij zullen tot een roof zijn; en uw kinderen, die heden noch goed noch kwaad weten, die zullen daarin komen, en dien zal Ik het geven, en die zullen het erfelijk bezitten.", "40": "Gij daarentegen, keert u, en reist naar de woestijn, den weg van de Schelfzee.", "41": "Toen antwoorddet gij, en zeidet tot mij: Wij hebben tegen den HEERE gezondigd; wij zullen optrekken, en strijden, naar alles, wat de HEERE, onze God, ons geboden heeft. Als gij nu een iegelijk zijn krijgsgereedschap aangorddet, en willens waart, om naar het gebergte henen op te trekken,", "42": "Zo zeide de HEERE tot mij: Zeg hun: Trekt niet op, en strijdt niet, want Ik ben niet in het midden van u; opdat gij niet voor het aangezicht uwer vijanden geslagen wordet.", "43": "Doch als ik tot u sprak, zo hoordet gij niet, maar waart den mond des HEEREN wederspannig, en handeldet trotselijk, en toogt op naar het gebergte.", "44": "Toen togen de Amorieten uit, die op dat gebergte woonden, u tegemoet, en vervolgden u, gelijk als de bijen doen; en zij verpletterden u in Seir tot Horma toe.", "45": "Als gij nu wederkwaamt en weendet voor het aangezicht des HEEREN, zo verhoorde de HEERE uw stem niet, en neigde Zijn oren niet tot u.", "46": "Alzo bleeft gij in Kades vele dagen, naar de dagen, dat gij er bleeft."}, "KJV": {"1": "These *be* the words which Moses spake unto all Israel on this side Jordan in the wilderness, in the plain over against the Red *sea*, between Paran, and Tophel, and Laban, and Hazeroth, and Dizahab.", "2": "(*There are* eleven days' *journey* from Horeb by the way of mount Seir unto Kadeshbarnea.)", "3": "And it came to pass in the fortieth year, in the eleventh month, on the first *day* of the month, *that* Moses spake unto the children of Israel, according unto all that the LORD had given him in commandment", "4": "After he had slain Sihon the king of the Amorites, which dwelt in Heshbon, and Og the king of Bashan, which dwelt at Astaroth in Edrei:", "5": "On this side Jordan, in the land of Moab, began Moses to declare this law, saying,", "6": "The LORD our God spake unto us in Horeb, saying, Ye have dwelt long enough in this mount:", "7": "Turn you, and take your journey, and go to the mount of the Amorites, and unto all *the places* nigh thereunto, in the plain, in the hills, and in the vale, and in the south, and by the sea side, to the land of the Canaanites, and unto Lebanon, unto the great river, the river Euphrates.", "8": "Behold, I have set the land before you: go in and possess the land which the LORD sware unto your fathers, Abraham, Isaac, and Jacob, to give unto them and to their seed after", "9": "And I spake unto you at that time, saying, I am not able to bear you myself alone:", "10": "The LORD your God hath multiplied you, and, behold, ye *are* this day as the stars of heaven for multitude.", "11": "(The LORD God of your fathers make you a thousand times so many more as ye *are*, and bless you, as he hath promised", "12": "How can I myself alone bear your cumbrance, and your burden, and your strife?", "13": "Take you wise men, and understanding, and known among your tribes, and I will make them rulers", "14": "And ye answered me, and said, The thing which thou hast spoken *is* good *for us* to do.", "15": "So I took the chief of your tribes, wise men, and known, and made them heads over you, captains over thousands, and captains over hundreds, and captains over fifties, and captains over tens, and officers among your tribes.", "16": "And I charged your judges at that time, saying, Hear *the causes* between your brethren, and judge righteously between *every* man and his brother, and the stranger", "17": "Ye shall not respect persons in judgment; *but* ye shall hear the small as well as the great; ye shall not be afraid of the face of man; for the judgment *is* God's: and the cause that is too hard for you, bring *it* unto me, and I will hear", "18": "And I commanded you at that time all the things which ye should do.", "19": "And when we departed from Horeb, we went through all that great and terrible wilderness, which ye saw by the way of the mountain of the Amorites, as the LORD our God commanded us; and we came to Kadeshbarnea.", "20": "And I said unto you, Ye are come unto the mountain of the Amorites, which the LORD our God doth give", "21": "Behold, the LORD thy God hath set the land before thee: go up *and* possess *it*, as the LORD God of thy fathers hath said unto thee; fear not, neither be discouraged.", "22": "And ye came near unto me every one of you, and said, We will send men before us, and they shall search us out the land, and bring us word again by what way we must go up, and into what cities we shall come.", "23": "And the saying pleased me well: and I took twelve men of you, one of a tribe:", "24": "And they turned and went up into the mountain, and came unto the valley of Eshcol, and searched it out.", "25": "And they took of the fruit of the land in their hands, and brought *it* down unto us, and brought us word again, and said, *It is* a good land which the LORD our God doth give", "26": "Notwithstanding ye would not go up, but rebelled against the commandment of the LORD your God:", "27": "And ye murmured in your tents, and said, Because the LORD hated us, he hath brought us forth out of the land of Egypt, to deliver us into the hand of the Amorites, to destroy", "28": "Whither shall we go up? our brethren have discouraged our heart, saying, The people *is* greater and taller than we; the cities *are* great and walled up to heaven; and moreover we have seen the sons of the Anakims", "29": "Then I said unto you, Dread not, neither be afraid", "30": "The LORD your God which goeth before you, he shall fight for you, according to all that he did for you in Egypt before your eyes;", "31": "And in the wilderness, where thou hast seen how that the LORD thy God bare thee, as a man doth bear his son, in all the way that ye went, until ye came into this place.", "32": "Yet in this thing ye did not believe the LORD your God,", "33": "Who went in the way before you, to search you out a place to pitch your tents *in*, in fire by night, to shew you by what way ye should go, and in a cloud by day.", "34": "And the LORD heard the voice of your words, and was wroth, and sware, saying,", "35": "Surely there shall not one of these men of this evil generation see that good land, which I sware to give unto your fathers,", "36": "Save Caleb the son of Jephunneh; he shall see it, and to him will I give the land that he hath trodden upon, and to his children, because he hath wholly followed the LORD.", "37": "Also the LORD was angry with me for your sakes, saying, Thou also shalt not go in thither.", "38": "*But* Joshua the son of Nun, which standeth before thee, he shall go in thither: encourage him: for he shall cause Israel to inherit", "39": "Moreover your little ones, which ye said should be a prey, and your children, which in that day had no knowledge between good and evil, they shall go in thither, and unto them will I give it, and they shall possess", "40": "But *as for* you, turn you, and take your journey into the wilderness by the way of the Red sea.", "41": "Then ye answered and said unto me, We have sinned against the LORD, we will go up and fight, according to all that the LORD our God commanded us. And when ye had girded on every man his weapons of war, ye were ready to go up into the hill.", "42": "And the LORD said unto me, Say unto them, Go not up, neither fight; for I *am* not among you; lest ye be smitten before your enemies.", "43": "So I spake unto you; and ye would not hear, but rebelled against the commandment of the LORD, and went presumptuously up into the hill.", "44": "And the Amorites, which dwelt in that mountain, came out against you, and chased you, as bees do, and destroyed you in Seir, *even* unto Hormah.", "45": "And ye returned and wept before the LORD; but the LORD would not hearken to your voice, nor give ear", "46": "So ye abode in Kadesh many days, according unto the days that ye abode"}}, "tsk": {"1": [{"kopje": "aan deze kant", "refs": ["Num 32:5", "Num 32:19", "Num 32:32", "Num 34:15", "Num 35:14", "Joz 9:1", "Joz 9:10", "Joz 22:4", "Joz 22:7"]}, {"kopje": "Suf", "refs": ["Num 21:14"]}, {"kopje": "Paran", "refs": ["Deut 33:2", "Gen 21:21", "Num 10:12", "Num 12:16", "Num 13:3", "Num 13:26", "1 Sam 25:1", "Hab 3:3"]}, {"kopje": "Hazeroth", "refs": ["Num 11:35", "Num 33:17", "Num 33:18"]}], "2": [{"kopje": "via de weg", "refs": ["Deut 1:44", "Deut 2:4", "Deut 2:8", "Num 20:17-21"]}, {"kopje": "tot aan", "refs": ["Lev 2:14", "Lev 9:23", "Num 13:26", "Num 32:8", "Joz 14:6"]}], "5": [{"kopje": "uit te leggen", "refs": ["Deut 4:8", "Deut 17:18", "Deut 17:19", "Deut 31:9", "Deut 32:46"]}], "6": [{"kopje": "bij Horeb", "refs": ["Deut 5:2", "Ex 3:1", "Ex 17:6"]}, {"kopje": "U bent lang genoeg", "refs": ["Ex 19:1", "Ex 19:2", "Num 10:11-13"]}], "7": [{"kopje": "het gebergte", "refs": ["Gen 15:16-21", "Ex 23:31", "Num 34:3-12", "Joz 24:15 zoon van Jefunne, en Jozua, de zoon van Nun.", "Ps 37:40": "En de HEERE zal hen helpen, en zal hen bevrijden; Hij zal hen bevrijden van de goddelozen, en zal hen behouden; want zij vertrouwen op Hem.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Deut 31:9": "En Mozes schreef deze wet, en gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Deut 9:1": "Hoor, Israël! U zult vandaag over de Jordaan gaan, om binnen te komen bij volken om die te erven, die groter en sterker zijn dan u; steden die groot zijn en tot in de hemel versterkt;", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "Ps 36:12": "De voet van de hoogmoedigen komt niet over mij, en de hand van de goddelozen doet mij niet omzwerven.", "Ex 23:7": "Blijf ver van valse zaken; en de onschuldige en rechtvaardige zult u niet doden; want Ik zal de goddeloze niet rechtvaardigen.", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Lev 19:34": "De vreemdeling die als vreemdeling bij u verblijft, zal onder u zijn als een inboorling van u; u zult hem liefhebben als uzelf; want u bent vreemdeling geweest in Egypteland; Ik ben de HEERE, uw God!", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Ex 17:16": "En hij zei: Omdat de hand op de troon van de HEERE is, zal er oorlog van de HEERE tegen Amalek zijn, van geslacht tot geslacht!", "Ps 121:3-8": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren. Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand.", "2 Kron 1:12": "De wijsheid en de kennis is u gegeven; daartoe zal Ik u rijkdom, en goederen, en eer geven, zoals geen koningen die vóór u geweest zijn, gehad hebben, en na u zal niemand zoiets hebben.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Ef 6:9": "En u heren, doe hetzelfde bij hen, en laat het dreigen achterwege; als iemand die weet dat ook uw eigen Heere in de hemelen is, en dat er geen aanneming van het persoon bij Hem is.", "Deut 26:15": "Zie neer vanuit Uw heilige woning, vanuit de hemel, en zegen Uw volk Israël, en het land dat U ons gegeven hebt, zoals U onze vaderen gezworen hebt, een land van melk en honing vloeiend.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "Jes 5:23": "Die de goddeloze rechtvaardigen om een geschenk, en de gerechtigheid van de rechtvaardigen van hen afwenden.", "Num 21:6": "Toen zond de HEERE vurige slangen onder het volk, die het volk beten; en er stierf veel volk van Israël.", "Micha 3:4": "Dan zullen zij roepen tot de HEERE, doch Hij zal hen niet verhoren; maar zal Zijn aangezicht op die tijd voor hen verbergen, zoals zij hun handelingen slecht gemaakt hebben.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Spr 15:19": "De weg van de luiaard is als een doornheg; maar het pad van de oprechten is welgebaand.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Ex 14:12": "Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "Ps 55:10": "Verslind hen, Heere! verdeel hun tong; want ik zie geweld en twist in de stad.", "Ex 18:14-26": "Toen de schoonvader van Mozes alles zag wat hij het volk deed, zei hij: Wat is dit dat u het volk doet? Waarom zit u zelf alleen, en al het volk staat bij u, van de morgen tot de avond? Toen zei Mozes tegen zijn schoonvader: Omdat dit volk tot mij komt om God raad te vragen. Wanneer zij een zaak hebben, komt het tot mij, zodat ik oordeel tussen de man en zijn naaste; en dat ik hun de instellingen van God en Zijn wetten bekendmaak.", "Gen 26:5": "omdat Abraham Mijn stem gehoorzaam is geweest, en Mijn bevel heeft onderhouden, Mijn geboden, Mijn inzettingen en Mijn wetten.", "Hand 10:35": "maar in ieder volk is hij die Hem vreest en gerechtigheid doet, Hem aangenaam.", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "Ex 15:16": "Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Ef 2:3": "onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen;", "Deut 32:14": "Boter van koeien, en melk van klein vee, met het vet van de lammeren en van de rammen, die in Basan weiden, en van de bokken, met het vette van de nieren van tarwe; en het druivenbloed, reine wijn, hebt u gedronken.", "Spr 3:20": "Door Zijn kennis zijn de afgronden gekloofd, en de wolken druipen dauw.", "Rom 13:13": "Laten wij, als bij daglicht, eerbaar wandelen; niet in bras­partijen en dronkenschappen, niet in ontucht en losbandigheid, niet in twist en jaloezie;", "Hand 10:34": "En Petrus opende zijn mond en zei: Ik merk in waarheid dat God niet iemand aanneemt op grond van het persoon;", "Deut 1:1-3": "Dit zijn de woorden die Mozes tot heel Israël gesproken heeft, aan deze kant van de Jordaan, in de woestijn, op het vlakke veld tegenover Suf, tussen Paran en Tofel, en Laban, en Hazeroth, en Dizahab. Elf dagreizen is het van Horeb, via de weg van het gebergte Seïr, tot aan Kades-Barnea. En het gebeurde in het veertigste jaar, in de elfde maand, op de eerste dag van de maand, dat Mozes sprak tot de kinderen van Israël, naar alles wat de HEERE hem voor hen bevolen had;", "Deut 31:6-8": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten. En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven. De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Num 13:1-20": "En de HEERE sprak tot Mozes en zei: Zend mannen uit, die het land Kanaän verspieden, dat Ik de kinderen van Israël geven zal; van elke stam van hun vaderen zullen jullie een man zenden, ieder een leider onder hen. Mozes dan zond hen uit de woestijn van Paran, op bevel van de HEERE; al die mannen waren hoofden van de kinderen van Israël.", "Joz 23:2": "Zo riep Jozua heel Israël, hun oudsten, en hun hoofden, en hun rechters, en hun opzichters, en hij zei tegen hen: Ik ben oud geworden, en wel bedaagd;", "Joz 24:24": "En het volk zei tegen Jozua: Wij zullen de HEERE, onze God, dienen, en wij zullen Zijn stem gehoorzamen.", "Jes 35:3": "Versterkt de slappe handen, en maakt de struikelende knieën vast.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Spr 19:13": "Een dwaze zoon is voor zijn vader een grote ellende; en de kijvingen van een vrouw zijn als een aanhoudend druppelen.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Ex 22:9": "Bij elke zaak van onrecht, of het nu gaat om een os, een ezel, klein vee, kleding, of om iets verlorens waarvan iemand zegt dat het van hem is, zal de zaak van beide partijen voor de rechters komen; wie de rechters schuldig verklaren, die moet het aan zijn naaste dubbel teruggeven.", "Job 5:11": "Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.", "Ps 78:14": "En Hij leidde hen overdag met een wolk, en de hele nacht met een licht van het vuur.", "Deut 30:15-20": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade. Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven. Maar als uw hart zich zal afwenden, en u niet horen zult, en u gedreven wordt om u voor andere goden te buigen, en die te dienen;", "Joz 8:10": "En Jozua maakte zich 's morgens vroeg op, en hij monsterde het volk; en hij trok op, hij en de oudsten van Israël, voor het volk uit, naar Ai.", "1 Kon 8:10": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.", "Amos 5:11": "Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken.", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "1 Kon 8:11": "En de priesters konden niet blijven staan om te dienen, vanwege de wolk; want de heerlijkheid van de HEERE had het huis van de HEERE vervuld.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Spr 21:27": "Het offer van de goddelozen is een gruwel; hoeveel te meer, als zij het met een schandelijk voornemen brengen!", "Neh 9:25": "En zij hebben vaste steden en een vet land ingenomen, en erfelijk bezeten, huizen, vol van allerlei goed, uitgehouwen waterputten, wijngaarden, olijfgaarden en fruitbomen, in overvloed; en zij hebben gegeten, en zijn verzadigd en vet geworden, en hebben in weelde geleefd, door Uw grote goedheid.", "1 Kron 4:10": "Want Jabez riep de God van Israël aan, en zei: Als U mij rijkelijk zegent, en mijn gebied vermeerdert, en Uw hand met mij zal zijn, en U mij zo voor het kwade behoedt, dat het mij geen smart doet! En God liet komen wat hij begeerde.", "Spr 22:12": "De ogen van de HEERE bewaren de kennis; maar de zaken van de trouweloze zal Hij omkeren.", "Jes 51:10": "Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Num 13:30": "Toen bracht Kaleb het volk tot rust voor Mozes, en zei: Laat ons vrijmoedig optrekken, en het in bezit nemen; want wij zullen het zeker kunnen overweldigen!", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Ex 5:20": "En zij ontmoetten Mozes en Aäron, die tegenover hen stonden, toen zij van Farao uitgingen.", "Jes 61:9": "En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft.", "2 Sam 23:4": "En Hij zal zijn gelijk het licht van de morgen, wanneer de zon opgaat, een morgen zonder wolken, wanneer door de glans na de regen de grasscheutjes uit de aarde voortkomen.", "Deut 17:18": "Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt;", "1 Tim 2:8": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Jes 45:2": "Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan.", "Jer 5:28": "Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Ps 147:13": "Want Hij maakt de grendels van uw poorten sterk; Hij zegent uw kinderen binnen in u.", "Jak 2:2-4": "Want als er in uw samenkomst een man binnenkomt met een gouden ring aan de vinger, in sierlijke kleding, en er komt ook een arme man binnen met slechte kleding; en u zou opzien tegen hem die de sierlijke kleding draagt, en tegen hem zeggen: Ga hier op een goede plaats zitten; en zou tegen de arme zeggen: Ga daar staan, of: Ga hier onder mijn voetbank zitten; hebt u dan niet in uzelf een onderscheid gemaakt, en bent u rechters geworden die met kwade gedachten oordelen?", "Hand 5:34": "Maar een zeker Farizeeër stond op in de raad, met name Gamaliël, een leraar van de wet, in aanzien gehouden bij al het volk, en gebood dat men de apostelen een weinig naar buiten zou laten staan.", "Gen 48:22": "En ik heb u één stuk land gegeven, boven uw broers; dat ik met mijn zwaard en met mijn boog uit de hand van de Amorieten genomen heb.", "1 Tess 5:13": "En acht hen zeer veel in liefde, om hun werk. Wees vreedzaam onder elkaar.", "Ps 36:7": "Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten.", "Ezech 20:15": "Toch hief Ik ook Mijn hand op tot hen in de woestijn, dat Ik hen niet zou brengen in het land dat Ik hun had gegeven, vloeiend van melk en honing, het sieraad van alle landen;", "Deut 24:17": "U zult het recht van de vreemdeling en van de wees niet buigen, en u zult het kleed van de weduwe niet te pand nemen.", "2 Kon 19:7": "Zie, Ik zal een geest in hem geven, zodat hij een gerucht zal horen en weer naar zijn land zal terugkeren; en Ik zal hem door het zwaard vellen in zijn land.", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Deut 9:16-24": "En ik zag toe, en zie, u had tegen de HEERE, uw God, gezondigd; u had u een gegoten kalf gemaakt; u was snel afgeweken van de weg die de HEERE u geboden had. Toen greep ik de twee tafelen, en wierp ze uit mijn beide handen, en brak ze voor uw ogen. En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Num 14:3": "En waarom brengt de HEERE ons naar dat land, om door het zwaard te vallen, en onze vrouwen en onze kinderen tot roof te worden? Zou het voor ons niet beter zijn om naar Egypte terug te keren?", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "Deut 32:48-52": "Daarna sprak de HEERE tot Mozes, op diezelfde dag, en zei: Klim op de berg Abarim (dit is de berg Nebo, die in het land van Moab is, tegenover Jericho), en zie het land Kanaän, dat Ik de kinderen van Israël tot een bezitting geven zal; En sterf op die berg, waarheen u zult opklimmen, en word verzameld tot uw volken; zoals uw broeder Aäron stierf op de berg Hor, en werd verzameld tot zijn volken.", "Num 32:11-13": "Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd; Behalve Kaleb, de zoon van Jefunne, de Keniziet, en Jozua, de zoon van Nun; want zij hebben de HEERE volledig gevolgd. Zo ontstak de toorn van de HEERE tegen Israël, en Hij liet hen ronddwalen in de woestijn, veertig jaar lang, totdat heel het geslacht verteerd was dat gedaan had wat kwaad was in de ogen van de HEERE.", "2 Sam 22:18": "Hij verloste mij van mijn sterke vijand, van mijn haters, omdat zij machtiger waren dan ik.", "Ps 76:4": "Daar heeft Hij de vurige pijlen van de boog verbroken, het schild, en het zwaard, en de strijd. Sela.", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "Spr 15:18": "Een grimmige man verwekt gekijf; maar wie langzaam tot toorn is, doet de twist bedaren.", "Num 9:11": "In de tweede maand, op de veertiende dag, tussen de twee avonden, zullen zij dat houden; met ongezuurde broden en bittere kruiden zullen zij dat eten.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Gen 46:3": "En Hij zei: Ik ben die God, de God van uw vader; wees niet bang om af te trekken naar Egypte; want Ik zal u daar tot een groot volk maken.", "Zef 3:19": "Zie, Ik zal in die tijd al uw verdrukkers verdoen; en Ik zal de hinkende behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het gehele land, waar zij beschaamd zijn geweest.", "Spr 12:13": "In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.", "Ezech 36:9-11": "Want ziet, Ik ben bij u, en Ik zal u aanzien, en u zult gebouwd en bezaaid worden. En Ik zal mensen op u vermenigvuldigen, het hele huis van Israël, ja, dat geheel; en de steden zullen bewoond, en de eenzame plaatsen bebouwd worden. Ja, Ik zal mensen en beesten op u vermenigvuldigen, en zij zullen vermenigvuldigd worden en vruchtbaar zijn; en Ik zal u doen bewonen, als in uw vorige tijden, ja, Ik zal het beter maken dan in uw beginselen; en u zult weten dat Ik de HEERE ben.", "Spr 11:11": "Door de zegen van de oprechten wordt een stad verheven; maar door de mond van de goddelozen wordt zij verbroken.", "Num 14:40-45": "En zij stonden 's morgens vroeg op, en klommen op de top van de berg, en zeiden: Zie, hier zijn wij, en wij zullen optrekken naar de plaats die de HEERE gezegd heeft; want wij hebben gezondigd! Maar Mozes zei: Waarom overtreedt u zo het bevel van de HEERE? Want dat zal niet voorspoedig zijn. Trek niet op, want de HEERE zal niet in uw midden zijn; anders wordt u verslagen voor het aangezicht van uw vijanden.", "Deut 32:11-14": "Zoals een arend zijn nest opwekt, over zijn jongen zweeft, zijn vleugels uitbreidt, ze neemt en ze draagt op zijn vleugels; Zo leidde de HEERE hem alleen, en er was geen vreemde god met hem. Hij deed hem rijden op de hoogten van de aarde, zodat hij at van de opbrengsten van het veld; en Hij deed hem honing zuigen uit de steenrots, en olie uit de harde rots;", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "Jer 3:4": "Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!", "Ps 148:11": "Koningen van de aarde, en alle volken, vorsten, en alle rechters van de aarde!", "Ex 19:16": "En het gebeurde op de derde dag, toen het morgen was, dat er op de berg donder en bliksem waren, en een zware wolk, en het geluid van een zeer sterke bazuin, zodat al het volk dat in het leger was, beefde van schrik.", "Hos 11:4": "Ik trok ze met mensenzelen, met touwen van liefde, en was voor hen als degenen die het juk van op hun kaken oplichten, en Ik reikte hem voedsel toe.", "Ex 23:3": "Ook zult u de arme niet voortrekken in zijn geschil.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "Deut 4:15": "Let dan goed op uzelf; want u hebt geen gelijkenis gezien, op de dag dat de HEERE op Horeb uit het midden van het vuur tot u sprak;", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Ps 25:8": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg.", "Deut 20:8": "Daarna zullen de opzichters voortgaan met spreken tot het volk, en zeggen: Wie is de man die vreesachtig en week van hart is? Die ga heen en keert terug naar zijn huis, opdat het hart van zijn broeders niet smelt, zoals zijn hart.", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Richt 14:8": "En na enige dagen kwam hij terug om haar te nemen; toen week hij af om het kadaver van de leeuw te bekijken, en zie, er was een bijenzwerm in het lichaam van de leeuw, met honing.", "Job 22:18": "Hij had immers hun huizen met goed gevuld; daarom is de raad van de goddelozen ver van mij.", "Num 12:5": "Toen kwam de HEERE af in de wolkkolom, en stond bij de deur van de tent; daarna riep Hij Aäron en Mirjam; en zij beiden kwamen naar buiten.", "2 Sam 7:9": "En Ik ben met u geweest, overal waar u gegaan bent, en heb al uw vijanden voor uw aangezicht uitgeroeid; en Ik heb u een grote naam gemaakt, als de naam van de groten die op de aarde zijn.", "Num 16:25": "Toen stond Mozes op, en ging naar Dathan en Abiram; en achter hem gingen de oudsten van Israël.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Deut 4:40": "En u zult Zijn inzettingen en Zijn geboden houden, die ik u vandaag gebied, opdat het u en uw kinderen na u goed gaat, en opdat u de dagen verlengt in het land dat de HEERE, uw God, u geeft, voor altijd.", "Zach 8:12": "Want het zaad zal voorspoedig zijn, de wijnstok zal zijn vrucht geven, en de aarde zal haar opbrengst geven, en de hemel zal zijn dauw geven; en Ik zal het overblijfsel van dit volk dit alles doen erven.", "Jer 2:20": "Toen Ik van oude tijden af uw juk verbroken, en uw banden verscheurd had, zei u: Ik zal niet dienen; maar op alle hoge heuvels en onder elke groene boom loopt u om, hoererend.", "Ex 23:25": "En u zult de HEERE uw God dienen, dan zal Hij uw brood en uw water zegenen; en Ik zal de ziekten uit uw midden weren.", "Joz 14:6-14": "Toen naderden de kinderen van Juda tot Jozua, te Gilgal, en Kaleb, de zoon van Jefunne, de Keneziet, zei tegen hem: U weet het woord dat de HEERE tot Mozes, de man van God, gesproken heeft te Kades-Barnea, vanwege mij, en vanwege u. Ik was veertig jaar oud, toen Mozes, de dienaar van de HEERE, mij uitgezonden heeft van Kades-Barnea om het land te verkennen, en ik hem antwoord bracht, zoals het in mijn hart was. Maar mijn broeders, die met mij opgegaan waren, deden het hart van het volk smelten; maar ik volhardde erin de HEERE, mijn God, na te volgen.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Deut 10:22": "Uw vaderen trokken met zeventig zielen af naar Egypte; en nu heeft de HEERE, uw God, u gesteld als de sterren van de hemel in menigte.", "Ex 16:7": "En morgen zult u de heerlijkheid van de HEERE zien, omdat Hij uw gemor tegen de HEERE gehoord heeft; want wat zijn wij, dat u tegen ons mort?", "Num 27:17": "Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "Ezech 11:23": "En de heerlijkheid van de HEERE steeg op van het midden van de stad, en bleef staan op de berg die ten oosten van de stad is.", "Jes 60:17": "Voor koper zal Ik goud brengen, en voor ijzer zal Ik zilver brengen, en voor hout koper, en voor stenen ijzer; en Ik zal uw opzieners vreedzaam maken, en uw drijvers rechtvaardig.", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Micha 2:1-3": "Wee hun die onrecht bedenken en kwaad beramen op hun slaapplaatsen; in het licht van de morgen doen zij het, omdat het in de macht van hun hand is. En zij begeren akkers en roven ze, en huizen, en nemen ze weg; zo doen zij de man en zijn huis geweld aan, ja, ieder en zijn erfenis. Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.", "Num 32:32": "Wij zullen toegerust oversteken voor het aangezicht van de HEERE naar het land Kanaän; en de bezitting van onze erfenis zullen wij hebben aan deze zijde van de Jordaan.", "Num 14:9": "Wees alleen niet opstandig tegen de HEERE! En vrees het volk van dit land niet; want zij zijn ons brood! Hun bescherming is van hen geweken, en de HEERE is met ons; vrees hen niet!", "Jes 42:13": "De HEERE zal uittrekken als een held; Hij zal de ijver opwekken als een krijgsman; Hij zal juichen, ja, Hij zal een groot geschreeuw maken; Hij zal Zijn vijanden overweldigen.", "Gen 28:4": "En Hij geeft u de zegen van Abraham; aan u, en uw nageslacht met u, zodat u het land van uw vreemdelingschap erfelijk bezit, dat God aan Abraham gegeven heeft.", "Spr 19:3": "De dwaasheid van de mens verdraait zijn weg; en zijn hart is boos op de HEERE.", "Ex 14:24": "En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.", "1 Kor 11:16-19": "Maar als iemand meent twistgierig te moeten zijn: wij hebben zulke gewoonten niet, en de Gemeenten van God ook niet. Dit nu, wat ik u aanzeg, prijs ik niet, namelijk dat u niet tot beter, maar tot erger samenkomt. Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;", "Luk 11:17": "Maar Hij, die hun gedachten kende, zei tegen hen: Elk koninkrijk dat tegen zichzelf verdeeld is, wordt verwoest; en een huis dat tegen zichzelf verdeeld is, valt.", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Ex 3:18": "En zij zullen naar uw stem luisteren; en u zult gaan, u en de oudsten van Israël, naar de koning van Egypte, en u zult tegen hem zeggen: De HEERE, de God van de Hebreeën, is ons ontmoet; zo laat ons nu toch gaan, drie dagreizen ver de woestijn in, opdat wij de HEERE, onze God, offeren!", "Jes 62:9": "Maar wie het inzamelen, zullen het eten, en zij zullen de HEERE prijzen; en wie het bijeenbrengen, zullen het drinken in de voorhoven van Mijn heiligdom.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Matt 6:11": "Geef ons heden ons dagelijks brood.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Num 14:38": "Maar Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, bleven in leven, van de mannen die weggegaan waren om het land te verspieden.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "Mark 14:55-65": "En de overpriesters, en de hele Raad, zochten getuigenis tegen Jezus, om Hem te doden, en vonden het niet. Want velen getuigden vals tegen Hem, maar de getuigenissen kwamen niet overeen. En sommigen stonden op en getuigden vals tegen Hem, en zeiden:", "Ezra 8:23": "Zo vastten wij en verzochten dat van onze God; en Hij liet Zich door ons verbidden.", "Ex 24:16-18": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk. En het aanzien van de heerlijkheid van de HEERE was als een verterend vuur, op de top van die berg, in de ogen van de kinderen Israëls. En Mozes ging het midden van de wolk in, nadat hij de berg opgeklommen was; en Mozes was op die berg veertig dagen en veertig nachten.", "1 Sam 9:16": "Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is.", "Ex 11:7": "Maar bij alle kinderen van Israël zal geen hond zijn tong bewegen, van de mensen af tot de beesten toe; opdat u weet dat de HEERE tussen de Egyptenaren en tussen de Israëlieten een afzondering maakt.", "Joz 10:40": "Zo sloeg Jozua het hele land, het gebergte, en het zuiden, en de laagte, en de hellingen van de wateren, en al hun koningen; hij liet niemand overblijven; ja, hij verbande alles wat adem had, zoals de HEERE, de God van Israël, geboden had.", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "Ezech 36:28-38": "En u zult wonen in het land dat Ik uw vaderen gegeven heb, en u zult Mij tot een volk zijn, en Ik zal u tot een God zijn. En Ik zal u verlossen van al uw onreinheden; en Ik zal roepen tot het koren, en zal dat vermenigvuldigen, en Ik zal geen honger op u leggen. En Ik zal de vrucht van het geboomte en de opbrengst van het veld vermenigvuldigen, opdat u de smaad van het honger niet meer ontvangt onder de heidenen.", "Deut 31:17": "Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is?", "Job 11:17-19": "Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn. En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen; En u zult neerliggen, en niemand zal u verschrikken; en velen zullen uw gezicht smeken.", "Joh 7:24": "Oordeel niet naar het aanzien, maar oordeel een rechtvaardig oordeel.", "1 Sam 2:25": "Wanneer een mens tegen een mens zondigt, zullen de goden hem oordelen; maar wanneer een mens tegen de HEERE zondigt, wie zal voor hem bidden? Maar zij luisterden niet naar de stem van hun vader, want de HEERE wilde hen doden.", "Spr 17:19": "Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt zijn ondergang.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Deut 32:13": "Hij deed hem rijden op de hoogten van de aarde, zodat hij at van de opbrengsten van het veld; en Hij deed hem honing zuigen uit de steenrots, en olie uit de harde rots;", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Spr 3:23": "Dan zult u uw weg zeker gaan, en u zult uw voet niet stoten.", "Gen 45:24": "En hij zond zijn broers heen; en zij vertrokken; en hij zei tegen hen: Maak geen ruzie op de weg.", "Deut 34:10": "En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht,", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "Joz 10:25": "Toen zei Jozua tot hen: Vrees niet en wees niet ontsteld, wees sterk en heb goede moed; want zo zal de HEERE aan al uw vijanden doen, tegen wie u strijdt.", "Deut 17:8-10": "Wanneer een zaak voor het gericht u te zwaar zal zijn, tussen bloed en bloed, tussen rechtszaak en rechtszaak, tussen de ene plaag en de andere plaag, geschillen in uw poorten, dan moet u opstaan en gaan naar de plaats die de HEERE, uw God, zal uitkiezen; En u moet komen bij de Levitische priesters en bij de rechter die er in die dagen is; en u moet vragen, en zij zullen u de rechterlijke uitspraak bekendmaken. En u moet doen naar het bevel van het woord dat zij u bekend zullen maken, vanaf die plaats die de HEERE zal uitkiezen, en u moet erop letten te doen naar alles wat zij u zullen leren.", "Num 14:44": "Toch waagden zij het roekeloos, om de top van de berg te beklimmen; maar de ark van het verbond van de HEERE en Mozes weken niet uit het midden van het leger.", "Ex 23:9": "U zult ook de vreemdeling niet onderdrukken; want u kent het gemoed van de vreemdeling, omdat u vreemdelingen geweest bent in het land Egypte.", "Amos 9:13": "Zie, de dagen komen, spreekt de HEERE, dat de ploeger de maaier zal bereiken, en de druiventreder de zaadzaaier; en de bergen zullen van zoete wijn druipen, en alle heuvels zullen smelten.", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "1 Kon 2:4": "opdat de HEERE Zijn woord bevestigt, dat Hij over mij gesproken heeft, toen Hij zei: Als uw zonen hun weg bewaren, om voor Mijn aangezicht trouw, met hun hele hart en met hun hele ziel te wandelen, dan zal het u nooit ontbreken, zei Hij, aan een man op de troon van Israël.", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Ezech 10:19": "En de cherubs hieven hun vleugels op en verhieven zich van de aarde omhoog voor mijn ogen, toen zij naar buiten gingen; en de raderen waren tegenover hen; en elk bleef staan bij de deur van de Oostpoort van het huis van de HEERE; en de heerlijkheid van de God van Israël was van boven over hen.", "Num 12:10": "En de wolk week weg van boven de tent; en zie, Mirjam was melaats, wit als de sneeuw. En Aäron keek naar Mirjam, en zie, zij was melaats.", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Deut 12:28": "Neem het waar, en hoor al deze woorden die ik u gebied, opdat het u, en uw kinderen na u, goed gaat tot in eeuwigheid, als u zult gedaan hebben wat goed en recht is in de ogen van de HEERE, uw God.", "Job 5:24-26": "En u zult bevinden dat uw tent in vrede is; en u zult uw woning verzorgen, en zult niet feilen. Ook zult u bevinden dat uw nageslacht talrijk zal zijn, en uw spruiten als het kruid van de aarde. U zult in ouderdom naar het graf gaan, zoals de korenhoop op zijn tijd wordt opgevoerd.", "Ezech 34:22": "Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee.", "Spr 17:7": "Een voortreffelijke lip past een dwaas niet, veel minder een vorst een leugenachtige lip.", "Ps 78:14-28": "En Hij leidde hen overdag met een wolk, en de hele nacht met een licht van het vuur. Hij kliefde de rotsstenen in de woestijn, en drenkte hen overvloedig, als uit afgronden. Want Hij bracht stromen voort uit de steenrots, en liet de wateren afdalen als rivieren.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Joz 1:4": "Van de woestijn en deze Libanon af tot aan de grote rivier, de rivier Frath, het hele land van de Hethieten, en tot aan de grote zee tegen de ondergang van de zon, zal uw gebied zijn.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "Openb 7:3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "Joël 2:18-26": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen. En de HEERE zal antwoorden en tegen Zijn volk zeggen: Ziet, Ik zend u het koren, en de most, en de olie, zodat u daarvan verzadigd zult worden; en Ik zal u niet meer overgeven tot een smaad onder de heidenen. En Ik zal hem die uit het noorden komt ver van u doen vertrekken, en hem wegdrijven in een dor en woest land, zijn voorkant naar de Oostzee, en zijn achterkant naar de verste zee; en zijn stank zal opgaan, en zijn vuiligheid zal opgaan; want hij heeft grote dingen gedaan.", "Ps 72:2": "Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht.", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "Hos 12:14": "Maar de Heere voerde Israël op uit Egypte door een profeet, en door een profeet werd hij behoed.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Zef 3:16": "Op die dag zal tegen Jeruzalem gezegd worden: Vrees niet, o Sion! Laat uw handen niet slap worden.", "Num 32:9": "Toen zij opgekomen waren tot aan het dal Eskol, en dit land bezagen, ontmoedigden zij het hart van de kinderen van Israël, zodat zij niet gingen naar het land dat de HEERE hun gegeven had.", "Spr 29:4": "Een koning houdt het land staande door recht; maar wie tot geschenken geneigd is, verstoort het.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "Ex 33:6": "De Israëlieten dan beroofden zichzelf van hun versierselen, ver van de berg Horeb.", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "Jes 48:21": "En: Zij hadden geen dorst, toen Hij hen leidde door de woeste plaatsen; Hij deed hun water uit de rotssteen vloeien; toen Hij de rotssteen kliefde, vloeide het water daarheen.", "Ps 144:12-15": "opdat onze zonen zijn als planten, die groot geworden zijn in hun jeugd; onze dochters als hoekstenen, uitgehouwen naar het voorbeeld van een paleis. Dat onze schuren vol zijn, de ene voorraad na de andere opleverend; dat onze kudden bij duizenden jongen werpen, ja, bij tienduizenden op onze velden zich vermenigvuldigen. Dat onze ossen goed beladen zijn; dat er geen inbraak is, geen uitval, geen gejammer op onze straten.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "Num 32:8": "Zo deden uw vaders, toen ik hen van Kades-Barnea zond om dit land te bezien.", "Spr 11:8": "De rechtvaardige wordt uit benauwdheid bevrijd; en de goddeloze komt in zijn plaats.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Hand 6:2-6": "En de twaalf riepen de menigte van de discipelen bij zich en zeiden: Het is niet passend dat wij het Woord van God verwaarlozen om de tafels te bedienen. Zie daarom om, broeders, naar zeven mannen uit uw midden, die een goede naam hebben, vol van de Heilige Geest en van wijsheid, die wij mogen aanstellen over deze taak. Maar wíj zullen ons blijven wijden aan het gebed en aan de bediening van het Woord.", "Deut 3:28": "Draag het dan op aan Jozua, en bemoedig hem, en sterk hem; want hij zal voor dit volk uit overgaan, en hij zal hun dat land, dat u zien zult, doen erven.", "Deut 12:7": "En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "Gen 41:33": "Laat Farao dus nu uitzien naar een verstandig en wijs man, en hem aanstellen over het land van Egypte.", "Zach 4:7": "Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem!", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "Spr 31:5": "opdat hij niet drinkt en het vastgestelde vergeet, en de rechtszaak van alle verdrukten verandert.", "Num 23:23": "Want er is geen toverij tegen Jakob, en geen waarzeggerij tegen Israël. Op dit moment zal van Jakob gezegd worden, en van Israël, wat God tot stand gebracht heeft.", "Luk 12:59": "Ik zeg u: u zult daar geenszins uitgaan, totdat u ook de laatste penning betaald hebt.", "Num 1:46": "Al de getelden dan waren zeshonderddrieduizend vijfhonderdvijftig.", "Num 16:41": "Maar de volgende dag morde de hele vergadering van de kinderen van Israël tegen Mozes en tegen Aäron, en zei: U hebt het volk van de HEERE gedood!", "Gen 1:30": "Maar aan al de dieren van de aarde, en aan al het gevogelte van de hemel, en aan al het kruipende gedierte op de aarde, waarin een levende ziel is, heb Ik al het groene gewas tot voedsel gegeven. En het was zo.", "Ex 17:9-14": "Mozes zei toen tegen Jozua: Kies mannen voor ons uit, en trek eropuit, strijd tegen Amalek; morgen zal ik op de top van de heuvel staan, met de staf van God in mijn hand. Jozua deed zoals Mozes hem gezegd had, en streed tegen Amalek; maar Mozes, Aäron en Hur klommen op de top van de heuvel. En het gebeurde: terwijl Mozes zijn hand ophief, was Israël de sterkste; maar terwijl hij zijn hand neerliet, was Amalek de sterkste.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Spr 20:26": "Een wijs koning verstrooit de goddelozen, en hij brengt het rad over hen.", "Rom 12:8": "hetzij wie vermaant, in het vermanen; wie uitdeelt, in eenvoud; wie leiding geeft, met ijver; wie barmhartigheid bewijst, met blijmoedigheid.", "Num 34:3-12": "De zuiderkant nu zal voor u zijn vanaf de woestijn Zin, langs de zijden van Edom; en de zuidergrens zal voor u zijn vanaf het einde van de Zoutzee, in het oosten; En deze grens zal voor u omgaan van het zuiden naar de opgang van Akrabbim, en doorgaan naar Zin; en haar uiteinden zullen zijn, vanaf het zuiden naar Kades-Barnea; en zij zal uitgaan naar Hazar-Addar, en doorgaan naar Azmon. Verder zal deze grens omgaan van Azmon naar de rivier van Egypte, en haar uiteinden zullen bij de zee zijn.", "Ps 146:5-9": "Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is; Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid. Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Ex 7:1-25": "Toen zei de HEERE tegen Mozes: Zie, Ik heb u tot een God gezet over Farao; en Aäron, uw broer, zal uw profeet zijn. U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken. Doch Ik zal Farao's hart verharden; en Ik zal Mijn tekenen en Mijn wonderen in Egypteland vermenigvuldigen.", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "Jes 63:10": "Maar zij zijn opstandig geworden, en zij hebben Zijn Heilige Geest smarten aangedaan; daarom is Hij hun in een vijand veranderd, Hij Zelf heeft tegen hen gestreden.", "Spr 10:22": "De zegen van de HEERE, die maakt rijk; en Hij voegt er geen smart aan toe.", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "1 Petr 3:13": "En wie is het die u kwaad zal doen, als u navolgers bent van het goede?", "Fil 2:3": "Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.", "Num 13:28": "Behalve dat het een sterk volk is, dat in dat land woont, en de steden zijn vast en zeer groot; en ook hebben wij daar kinderen van Enak gezien.", "Num 14:42": "Trek niet op, want de HEERE zal niet in uw midden zijn; anders wordt u verslagen voor het aangezicht van uw vijanden.", "Jes 43:20": "Het gedierte van het veld zal Mij eren, de jakhalzen en de jonge struisvogels; want Ik zal in de woestijn water geven, en rivieren in de wildernis, om Mijn volk, Mijn uitverkorenen te drinken te geven.", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Hagg 2:20": "Is er nog zaad in de schuur? Zelfs de wijnstok, en de vijgenboom, en de granaatappelboom, en de olijfboom, die niet gedragen hebben, die zal Ik vanaf deze dag zegenen.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Num 26:63-65": "Dat zijn de getelden van Mozes en Eleazar, de priester, die de kinderen van Israël telden in de vlakke velden van Moab, aan de Jordaan bij Jericho. En onder dezen was niemand uit de getelden van Mozes en Aäron, de priester, toen zij de kinderen van Israël telden in de woestijn van Sinaï. Want de HEERE had van hen gezegd, dat zij in de woestijn zeker zouden sterven; en er was niemand van hen overgebleven, dan Kaleb, de zoon van Jefunne, en Jozua, de zoon van Nun.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Ps 105:14-45": "Liet Hij geen mens toe hen te onderdrukken; ook bestrafte Hij koningen om hunnentwil, en zei: Raak Mijn gezalfden niet aan, en doe Mijn profeten geen kwaad. Hij riep ook een honger over het land; Hij brak elke staf van het brood.", "Ex 12:21": "Mozes riep dan alle oudsten van Israël, en zei tegen hen: Kiest en neemt lammeren voor uw huisgezinnen, en slacht het pascha.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Mark 7:9": "En Hij zei tegen hen: U doet inderdaad het gebod van God volledig teniet, opdat u uw overleveringen zou onderhouden.", "Spr 16:3": "Wentel uw werken op de HEERE, en uw gedachten zullen bevestigd worden.", "Job 31:34": "Zeker, ik kon wel een grote menigte geweldig onderdrukt hebben; maar de verachtste van de huisgezinnen zou mij afgeschrikt hebben; zodat ik gewezen zou hebben, en bij de deur niet uitgegaan zijn.", "Ex 32:19-30": "En het gebeurde, toen hij bij het kamp kwam en het kalf en de reidansen zag, dat de toorn van Mozes ontstak, en dat hij de tafelen uit zijn handen wierp en ze onder aan de berg verbrak. En hij nam het kalf dat zij gemaakt hadden, en verbrandde het in het vuur, en vermaalde het tot het klein werd, en strooide het op het water, en liet de kinderen van Israël dat drinken. En Mozes zei tegen Aäron: Wat heeft dit volk u gedaan, dat u zo'n grote zonde over hen gebracht hebt?", "Fil 1:15": "Sommigen prediken Christus wel uit afgunst en twist, maar sommigen ook uit goedwilligheid.", "Deut 17:19": "En het moet bij hem blijven, en hij moet daarin lezen al de dagen van zijn leven; opdat hij de HEERE, zijn God, leert vrezen, om al de woorden van deze wet en deze inzettingen te bewaren en te doen;", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Matt 17:5": "Terwijl hij nog sprak, zie, een lichtende wolk overschaduwde hen; en zie, een stem uit de wolk zei: Dit is Mijn geliefde Zoon, in wie Ik Mijn welbehagen heb; luister naar Hem!", "Jes 30:23-26": "Dan zal Hij uw zaad, waarmee u het land bezaaid hebt, regen geven, en brood van de opbrengst van het land, en dat zal vet en overvloedig zijn; uw vee zal op die dag in een wijde landouwe weiden. En de ossen, en ezelveulens, die het land bewerken, zullen zuiver voeder eten, dat verschud is met de werpschoffel en met de wan. En er zullen op elke hoge berg, en op elke hoge heuvel, beekjes en watervlieten zijn, op de dag van de grote slachting, wanneer de torens vallen zullen.", "Ps 147:8": "Die de hemel met wolken bedekt, Die voor de aarde regen klaarmaakt; Die het gras op de bergen laat opkomen;", "Neh 9:23": "U hebt ook hun kinderen vermenigvuldigd, als de sterren van de hemel; en U hebt hen gebracht in het land, waarvan U tot hun vaderen had gezegd, dat zij zouden ingaan om het erfelijk te bezitten.", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Ex 23:6": "U zult het recht van uw arme niet buigen in zijn geschil.", "Rom 8:37": "Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Deut 33:12": "En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wone
