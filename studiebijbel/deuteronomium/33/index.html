ezet worden; ieder zal ontvangen van Uw woorden.","4":"Mozes heeft ons de wet geboden, een erfenis van Jakobs gemeente;","5":"En Hij was koning in Jeschurun, toen de hoofden van het volk zich verzamelden, samen met de stammen Israëls.","6":"Dat Ruben leeft, en niet sterft, en dat zijn mannen *van* getal zijn!","7":"En dit is van Juda, dat hij zei: Hoor, HEERE! de stem van Juda! en breng hem terug tot zijn volk; zijn handen moeten hem genoeg zijn, en wees Gij *hem* een Hulp tegen zijn vijanden!","8":"En van Levi zei hij: Uw Tummim en Uw Urim[1] zijn bij de man, Uw gunstgenoot, die Gij beproefd hebt in Massa, met wie Gij getwist hebt aan de wateren van Meriba.","9":"Die tegen zijn vader en tegen zijn moeder zei: Ik zie hem niet; en die zijn broeders niet kende, en zijn zonen niet achtte; want zij onderhielden Uw woord, en bewaarden Uw verbond.","10":"Zij zullen Jakob Uw rechten leren, en Israël Uw wet; zij zullen reukwerk voor Uw neus leggen, en dat helemaal verteerd zal worden, op Uw altaar.","11":"Zegen, HEERE! zijn vermogen, en laat U het werk van zijn handen goed bevallen; versla de lenden van hen die tegen hem opstaan en hem haten, zodat zij niet weer opstaan!","12":"En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wonen!","13":"En van Jozef zei hij: Zijn land zij gezegend van de HEERE, van het voortreffelijkste van de hemel, van de dauw, en van de diepte, die beneden ligt;","14":"En van de voortreffelijkste inkomsten van de zon, en van de voortreffelijkste voortzetting van de maan;","15":"En van het voornaamste van de oude bergen, en van het voortreffelijkste van de eeuwige heuvels;","16":"En van het voortreffelijkste van de aarde en haar volheid, en *van* de goedgunstigheid van Hem Die in het braambos woonde, laat *de zegening* komen op het hoofd van Jozef, en op de schedel van hem die afgezonderd is van zijn broeders!","17":"Hij heeft de heerlijkheid van de eerstgeborene van zijn os, en zijn horens zijn horens van de eenhoorn; daarmee zal hij de volken samen stoten tot aan de einden van het land. Dezen nu zijn de tienduizenden van Efraïm, en dezen zijn de duizenden van Manasse!","18":"En van Zebulon zei hij: Verheug u, Zebulon! over uw uittocht, en Issaschar! over uw tenten.","19":"Zij zullen de volken tot de berg roepen; daar zullen zij offeranden van gerechtigheid offeren; want zij zullen de overvloed van de zeeën zuigen, en de bedekte verborgen dingen van het zand.","20":"En van Gad zei hij: Gezegend zij hij die aan Gad ruimte maakt! hij woont als een oude leeuw, en verscheurt de arm, ja ook de schedel.","21":"En hij heeft zich van het eerste voorzien, omdat hij daar *in* het deel van de wetgever bedekt was; daarom kwam hij met de hoofden van het volk; hij verrichtte de gerechtigheid van de HEERE, en Zijn oordelen met Israël.","22":"En van Dan zei hij: Dan is een jonge leeuw; hij zal *als* uit Bazan voortspringen.","23":"En van Naftali zei hij: O Naftali! wees verzadigd van de goedgunstigheid, en vol van de zegen van de HEERE; bezit erfelijk het westen en het zuiden.","24":"En van Aser zei hij: Aser zij gezegend met zonen; hij zij zijn broeders aangenaam, en dope zijn voet in olie.","25":"IJzer en koper zal *onder* uw schoen zijn; en uw sterkte gelijk uw dagen!","26":"Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken.","27":"De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!","28":"Israël dan zal zeker alleen wonen, *en* Jakobs oog zal zijn op een land van koren en most; ja, zijn hemel zal van dauw druipen.","29":"Gelukkig[2] bent u, o Israël! wie is u gelijk? u bent een volk, verlost door de HEERE, het Schild van uw hulp, en Die een Zwaard is van uw hoogheid; daarom zullen uw vijanden zich geveinsd aan u onderwerpen, en u zult op hun hoogten treden!"},"SV":{"1":"Dit nu is de zegen, met welken Mozes, de man Gods, de kinderen Israëls gezegend heeft, voor zijn dood.","2":"Hij zeide dan: De HEERE is van Sinaï gekomen, en is hunlieden opgegaan van Seir; Hij is blinkende verschenen van het gebergte Paran, en is aangekomen met tien duizenden der heiligen; tot Zijn rechterhand was een vurige wet aan hen.","3":"Immers bemint Hij de volken! Al zijn heiligen zijn in Uw hand; zij zullen in het midden tussen Uw voeten gezet worden; een ieder zal ontvangen van Uw woorden.","4":"Mozes heeft ons de wet geboden, een erfenis van Jakobs gemeente;","5":"En Hij was koning in Jeschurun, als de hoofden des volks zich vergaderden, samen met de stammen Israëls.","6":"Dat Ruben leve, en niet sterve, en dat zijn lieden *van* getal zijn!","7":"En dit is van Juda, dat hij zeide: Hoor, HEERE! de stem van Juda! en breng hem weder tot zijn volk; zijn handen moeten hem genoegzaam zijn, en zijt Gij *hem* een Hulp tegen zijn vijanden!","8":"En van Levi zeide hij: Uw Thummim en Uw Urim zijn aan den man, Uw gunstgenoot; dien Gij verzocht hebt in Massa, met welken Gij getwist hebt aan de wateren van Meriba.","9":"Die tot zijn vader en tot zijn moeder zeide: Ik zie hem niet; en die zijn broederen niet kende, en zijn zonen niet achtte; want zij onderhielden Uw woord, en bewaarden Uw verbond.","10":"Zij zullen Jakob Uw rechten leren, en Israël Uw wet; zij zullen reukwerk voor Uw neus leggen, en dat gans verteerd zal worden, op Uw altaar.","11":"Zegen, HEERE! zijn vermogen, en laat U het werk zijner handen wel bevallen; versla de lenden dergenen, die tegen hem opstaan en hem haten, dat zij niet weder opstaan!","12":"En van Benjamin zeide hij: De beminde des HEEREN, hij zal zeker bij Hem wonen. Hij zal hem den gansen dag overdekken, en tussen Zijn schouders zal hij wonen!","13":"En van Jozef zeide hij: Zijn land zij gezegend van den HEERE, van het uitnemendste des hemels, van den dauw, en van de diepte, die beneden is liggende;","14":"En van de uitnemendste inkomsten der zon, en van de uitnemendste voortzetting der maan;","15":"En van het voornaamste der oude bergen, en van het uitnemendste der eeuwige heuvelen;","16":"En van het uitnemendste der aarde en haar volheid, en *van* de goedgunstigheid Desgenen, Die in het braambos woonde, kome *de* *zegening* op het hoofd van Jozef, en op den schedel des afgezonderden van zijn broederen!","17":"Hij heeft de heerlijkheid des eerstgeborenen zijns osses, en zijn hoornen zijn hoornen des eenhoorns; met dezelve zal hij de volken te zamen stoten tot aan de einden des lands. Dezen nu zijn de tien duizenden van Efraïm, en dezen zijn de duizenden van Manasse!","18":"En van Zebulon zeide hij: Verheug u, Zebulon! over uw uittocht, en Issaschar! over uw hutten.","19":"Zij zullen de volken tot den berg roepen; daar zullen zij offeranden der gerechtigheid offeren; want zij zullen den overvloed der zeeën zuigen, en de bedekte verborgen dingen des zands.","20":"En van Gad zeide hij: Gezegend zij, die aan Gad ruimte maakt! hij woont als een oude leeuw, en verscheurt den arm, ja ook den schedel.","21":"En hij heeft zich van het eerste voorzien, omdat hij aldaar *in* het deel des wetgevers bedekt was; daarom kwam hij met de hoofden des volks; hij verrichtte de gerechtigheid des HEEREN, en zijn gerichten met Israël.","22":"En van Dan zeide hij: Dan is een jonge leeuw; hij zal *als* uit Bazan voortspringen.","23":"En van Nafthali zeide hij: O Nafthali! wees verzadigd van de goedgunstigheid, en vol van den zegen des HEEREN; bezit erfelijk het westen en het zuiden.","24":"En van Aser zeide hij: Aser zij gezegend met zonen; hij zij zijn broederen aangenaam, en dope zijn voet in olie.","25":"Ijzer en koper zal *onder* uw schoen zijn; en uw sterkte gelijk uw dagen!","26":"Niemand is er gelijk God, o Jeschurun! Die op den hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken.","27":"De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijve den vijand voor uw aangezicht, en zegge: Verdelg!","28":"Israël dan zal zeker alleen wonen, *en* Jakobs oog zal zijn op een land van koren en most; ja, zijn hemel zal van dauw druipen.","29":"Welgelukzalig zijt gij, o Israël! wie is u gelijk? gij zijt een volk, verlost door den HEERE, het Schild uwer hulp, en Die een Zwaard is uwer hoogheid; daarom zullen zich uw vijanden geveinsdelijk aan u onderwerpen, en gij zult op hun hoogten treden!"},"KJV":{"1":"And this *is* the blessing, wherewith Moses the man of God blessed the children of Israel before his death.","2":"And he said, The LORD came from Sinai, and rose up from Seir unto them; he shined forth from mount Paran, and he came with ten thousands of saints: from his right hand *went* a fiery law","3":"Yea, he loved the people; all his saints *are* in thy hand: and they sat down at thy feet; *every one* shall receive of thy words.","4":"Moses commanded us a law, *even* the inheritance of the congregation of Jacob.","5":"And he was king in Jeshurun, when the heads of the people *and* the tribes of Israel were gathered together.","6":"Let Reuben live, and not die; and let *not* his men be few.","7":"And this *is the blessing* of Judah: and he said, Hear, LORD, the voice of Judah, and bring him unto his people: let his hands be sufficient for him; and be thou an help *to him* from his enemies.","8":"And of Levi he said, *Let* thy Thummim and thy Urim *be* with thy holy one, whom thou didst prove at Massah, *and with* whom thou didst strive at the waters of Meribah;","9":"Who said unto his father and to his mother, I have not seen him; neither did he acknowledge his brethren, nor knew his own children: for they have observed thy word, and kept thy covenant.","10":"They shall teach Jacob thy judgments, and Israel thy law: they shall put incense before thee, and whole burnt sacrifice upon thine altar.","11":"Bless, LORD, his substance, and accept the work of his hands: smite through the loins of them that rise against him, and of them that hate him, that they rise not again.","12":"*And* of Benjamin he said, The beloved of the LORD shall dwell in safety by him; *and the LORD* shall cover him all the day long, and he shall dwell between his shoulders.","13":"And of Joseph he said, Blessed of the LORD *be* his land, for the precious things of heaven, for the dew, and for the deep that coucheth beneath,","14":"And for the precious fruits *brought forth* by the sun, and for the precious things put forth by the moon,","15":"And for the chief things of the ancient mountains, and for the precious things of the lasting hills,","16":"And for the precious things of the earth and fulness thereof, and *for* the good will of him that dwelt in the bush: let *the blessing* come upon the head of Joseph, and upon the top of the head of him *that was* separated from his brethren.","17":"His glory *is like* the firstling of his bullock, and his horns *are like* the horns of unicorns: with them he shall push the people together to the ends of the earth: and they *are* the ten thousands of Ephraim, and they *are* the thousands of Manasseh.","18":"And of Zebulun he said, Rejoice, Zebulun, in thy going out; and, Issachar, in thy tents.","19":"They shall call the people unto the mountain; there they shall offer sacrifices of righteousness: for they shall suck *of* the abundance of the seas, and *of* treasures hid in the sand.","20":"And of Gad he said, Blessed *be* he that enlargeth Gad: he dwelleth as a lion, and teareth the arm with the crown of the head.","21":"And he provided the first part for himself, because there, *in* a portion of the lawgiver, *was he* seated; and he came with the heads of the people, he executed the justice of the LORD, and his judgments with Israel.","22":"And of Dan he said, Dan *is* a lion's whelp: he shall leap from Bashan.","23":"And of Naphtali he said, O Naphtali, satisfied with favour, and full with the blessing of the LORD: possess thou the west and the south.","24":"And of Asher he said, *Let* Asher *be* blessed with children; let him be acceptable to his brethren, and let him dip his foot in oil.","25":"Thy shoes *shall be* iron and brass; and as thy days, *so shall* thy strength","26":"*There is* none like unto the God of Jeshurun, *who* rideth upon the heaven in thy help, and in his excellency on the sky.","27":"The eternal God *is thy* refuge, and underneath *are* the everlasting arms: and he shall thrust out the enemy from before thee; and shall say, Destroy","28":"Israel then shall dwell in safety alone: the fountain of Jacob *shall be* upon a land of corn and wine; also his heavens shall drop down dew.","29":"Happy *art* thou, O Israel: who *is* like unto thee, O people saved by the LORD, the shield of thy help, and who *is* the sword of thy excellency! and thine enemies shall be found liars unto thee; and thou shalt tread upon their high places."}},"tsk":{"1":[{"kopje":"de zegen","refs":["Gen 27:4","Gen 27:27-29","Gen 49:1","Gen 49:28","Luk 24:50","Luk 24:51","Joh 14:27","Joh 16:33"]},{"kopje":"de man","refs":["Joz 14:6","Richt 13:6","1 Sam 2:27","1 Sam 9:6","1 Sam 9:7","1 Kon 13:1","1 Kon 13:6","Ps 90:1","1 Tim 6:11","2 Tim 3:17","2 Petr 1:21"]}],"2":[{"kopje":"van Sinaï gekomen","refs":["Ex 19:18-20","Richt 5:4","Richt 5:5","Hab 3:3"]},{"kopje":"tienduizenden","refs":["Ps 68:8","Ps 68:18","Dan 7:9","Hand 7:53","Gal 3:19","2 Tess 1:7","Hebr 2:2","Judas 1:14","Openb 5:11"]},{"kopje":"een vurige wet","refs":["Deut 5:22","2 Kor 3:7","2 Kor 3:9","Gal 3:10","Hebr 12:20"]}],"3":[{"kopje":"bemint Hij","refs":["Deut 7:7","Deut 7:8","Ex 19:5","Ex 19:6","Ps 47:5","Ps 147:19","Ps 147:20","Jer 31:3","Hos 11:1","Mal 1:2","Rom 9:11-13","Ef 2:4","Ef 2:5","1 Joh 4:19"]},{"kopje":"Al Zijn heiligen","refs":["Deut 7:6","1 Sam 2:9","Ps 31:16","Ps 50:5","Jer 32:40","Joh 10:28","Joh 10:29","Joh 17:11-15","Rom 8:35-39","Kol 3:3","Kol 3:4","1 Petr 1:5"]},{"kopje":"zij zullen gezet worden","refs":["Luk 2:46","Luk 8:35","Luk 10:39","Hand 22:3"]},{"kopje":"zal ontvangen","refs":["Spr 2:1","1 Tess 1 wl wl-kjv\" data-code=\"H4872\">Moses</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> his death.","2":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from <span class=\"wl wl-kjv\" data-code=\"H5514\">Sinai,</span> and rose <span class=\"wl wl-kjv\" data-code=\"H2224\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir</span> unto them; he shined <span class=\"wl wl-kjv\" data-code=\"H3313\">forth</span> from <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H6290\">Paran,</span> and he <span class=\"wl wl-kjv\" data-code=\"H857\">came</span> with ten <span class=\"wl wl-kjv\" data-code=\"H7233\">thousands</span> of <span class=\"wl wl-kjv\" data-code=\"H6944\">saints:</span> from his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> went a <span class=\"wl wl-kjv\" data-code=\"H799\">fiery</span> law","3":"<span class=\"wl wl-kjv\" data-code=\"H637\">Yea,</span> he <span class=\"wl wl-kjv\" data-code=\"H2245\">loved</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> all his <span class=\"wl wl-kjv\" data-code=\"H6918\">saints</span> are in thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and they sat <span class=\"wl wl-kjv\" data-code=\"H8497\">down</span> at thy <span class=\"wl wl-kjv\" data-code=\"H7272\">feet;</span> every one shall <span class=\"wl wl-kjv\" data-code=\"H5375\">receive</span> of thy words.","4":"<span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" d thy <span class=\"wl wl-kjv\" data-code=\"H224\">Urim</span> be with thy <span class=\"wl wl-kjv\" data-code=\"H2623\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one,</span> whom thou didst <span class=\"wl wl-kjv\" data-code=\"H5254\">prove</span> at <span class=\"wl wl-kjv\" data-code=\"H4532\">Massah,</span> and with whom thou didst <span class=\"wl wl-kjv\" data-code=\"H7378\">strive</span> at the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of Meribah;","9":"Who <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and to his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> I have not <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> him; neither did he <span class=\"wl wl-kjv\" data-code=\"H5234\">acknowledge</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> his own <span class=\"wl wl-kjv\" data-code=\"H1121\">children:</span> for they have <span class=\"wl wl-kjv\" data-code=\"H8104\">observed</span> thy <span class=\"wl wl-kjv\" data-code=\"H565\">word,</span> and <span class=\"wl wl-kjv\" data-code=\"H5341\">kept</span> thy covenant.","10":"They shall <span class=\"wl wl-kjv\" data-code=\"H3384\">teach</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> thy <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> thy <span class=\"wl wl-kjv\" data-code=\"H8451\">law:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> <span class=\"wl wl-kjv\" data-code=\"H6988\">incense</span> <span class=\"wl wl-kjv\" data-code=\"H639\">before</span> thee, and whole burnt <span class=\"wl wl-kjv\" data-code=\"H3632\">sacrifice</span> upon thine altar.","11":"<span class=\"wl wl-kjv\" data-code=\"H1288\">Bless,</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LO word":"Niemand is er gelijk God,","tekst":"Of, er is niemand gelijk de God van Jeschurun. Zie van Jeschurun boven, Deu 32:15."},{"catchword":"op den hemel vaart tot uw hulp,","tekst":"Dat is, op de lucht, vanwaar Hij zijn volk hulp toeschikt tegen hun vijanden, die Hij vandaar met schrikkelijk onweder van hagel, bliksem en donder slaat en verderft. Zie een heerlijke verklaring Psa 18:7-20."},{"catchword":"met Zijn hoogheid","tekst":"Dat is, met zijn ogen en heerlijke werkingen."},{"catchword":"bovenste wolken","tekst":"Of, dunste, die in het opperste deel der lucht voortgebracht worden."}],"27":[{"catchword":"De eeuwige God","tekst":"Het Hebreeuwse woord, van schepselen gebruikt, betekent dat Hij in voortijden, vanouds, of van het begin der wereld geweest is, gelijk boven, vs.15, maar van God gebruikt, betekent het ook eeuwigheid, of, die vóór alle tijden geweest is. Hebreeuws, God der eeuwigheid"},{"catchword":"een woning,","tekst":"Dat is, als een verheven plaats, waarin gij stil en zeker moogt leven."},{"catchword":"eeuwige armen;","tekst":"Hebreeuws, armen der eeuwigheid; dat is, de eeuwige almachtigheid Gods zal hen beneden op aarde helpen en beschutten."}],"28":[{"catchword":"Jakobs oog zal zijn","tekst":"Dat is, Jakobs nakomelingen zullen in vrede wonen, met hun ogen de vruchtbaarheid van hun land mogen aanschouwen en daarin hun lust scheppen. Anders, Jakobs fontein; dat is, een voortdurende oorsprong en vloed van allen zegen zij onder het volk Israëls, dat uit Jakob gesproten is, enz."}],"29":[{"catchword":"het Schild uwer hulp,","tekst":"Of, uw schild der hulp; dat is, uw helpend schild; gelijk Psa 2:6"},{"catchword":"Zwaard is uwer hoogheid;","tekst":"Die voor u vecht om u te verhogen."},{"catchword":"geveinsdelijk aan u onderwerpen,","tekst":"Zullen gedwongen worden zich u te onderwerpen, alhoewel zij het van harte niet zullen menen. Zie 2Sa 22:45; Psa 18:45, en vergelijk Psa 66:3, en Psa 81:16."},{"catchword":"hun hoogten treden","tekst":"Zie boven, Deu 32:13."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now this is the blessing [see Genesis 27 on verse 4] wherewith Moseh the man of God [that is the prophet speaking by the motion or instinct of the holy Ghost 2Pe 1:21 see further of this title Judges 13 on verse 6] blessed the children of Israel before his death."}],"2":[{"catchword":null,"tekst":"He said then the Lord came from Sinai then rose up from Seir unto them he appeared shining from mount Paran [or seir and Paran see Genesis 14 on verse 6 and above chapter 1.1 ] and came with ten thousand of saints [Heb. Of holiness of sanctity meaning millions of holy angels whose head the son of God is see Act 7:53 Galatians 3.19 and compare Psa 68:18 Dan 7:10 &c.] as his right-hand was a fiery law [Heb. A fire of the law meaning that great fire out of the midst whereof was uttered to the people see above chapter 4.11,12,33,36and 5.2,3,4,25,26 and Exo 19:16,18 they to wit the holy angels had a fire of the law ] for them [to wit the Israelites Moseh seemeth here to compare the apparitions and manifestations of God made to Israel in his time to the Suns race which he breaketh forth by little and little and riseth higher and higher by degree and giveth more and more light untilat last it bringeth forth a bright and clean non day light even so the Lord first gave his law on mount Sinai Exodus 19 and 20 then he gave water out of the rock and at mount Seir or the mount of the Edomites the brazen serpent which together with the manna were types of Christ to be set up Numbers 20 and 28 1corinthians 10.4 Joh 3:14 Lastly he published his law more gloriously by Moseh in the land of the Moabites and revealed that prophetical song and this blessing before his people as appeareth in the whole book compare chapter 3.3,4 &c.]"}],"3":[{"catchword":null,"tekst":"Yea he loveth the people [meaning the tribes of Israel as Jud 5:14 and below verse 19 &c.] all his saints are in thine hand [that is thou lookest upon them providest for them Moseh here speaketh unto God ]they shall be set in the midst between thy feet [others let them be set &c. to wit a disciple or scholars at the feet of their masters see 2kings 2 on verse 3 and 4 on verse 38 Act 22:3] everyone shall receive of thine words [that which may tend to his instructions and salvation.]"}],"4":[{"catchword":null,"tekst":"Moseh commanded us the law an inheritance [which must be as dear and precious unto the people of God as an inheritance to a man ] of Jacobs congregation [the congregation that descended from Jacob .]"}],"5":[{"catchword":null,"tekst":"And he was king [giving laws and governing the people as a king the word king is also taken for a prince or ruler Jer 19:3 and 46.25 see the annotate there] in Jeschurun [see above chapter 32 on verse 15] where the head of the people together with the tribes of Israel are gathered together."}],"6":[{"catchword":null,"tekst":"Let Reuben live and not die and let his men be in number [or let them not be few in number that is great in number others although his people few in number.]"}],"7":[{"catchword":null,"tekst":"And this is of Judah [that is this is the blessing of Judah under whom Simeon is likewise comprehended as having his land dispersed among Judah and going forth to war with him see Jos 19:1 Jud 1:3 1Ch 14:24] which he [namely Moseh and so in the sequel] said dear Lord the voice of Judah [when they pray unto thee for victory ]and bring them again into his people [cause him to have the victory and to return home safe unto those that be his ] let his hands be sufficient for him strength to stand against his enemies ] and be thou an help to him against [Heb. From ] his enemies [that is t assist him and deliver him from his enemies.]"}],"8":[{"catchword":null,"tekst":"And of Levi he said Thummim an d Urim be with the man [Moseh speaketh here as also in the following verse unto God of Urim and Thummim see Exo 28:30] thy favorite [to wit the high priest who was a man of God and in favor of God others thy well beloved thy bountiful courteous gracious one] whom thou didst tempt in Massa with whom thou didst strive at the waters of Meriba [seethe history Numbers 20.]"}],"9":[{"catchword":null,"tekst":"Who [namely Levi] said unto his father and to his mother I see him not [that is I pity or spare them not when God commanded me to do it this relateth to the history mentioned Exo 32:26&c.] and who knew not his brethren and regarded [Heb. Knew] not his sons for they observed thy word and kept thy covenant."}],"10":[{"catchword":null,"tekst":"they shall teach Jacob thy judgments and Israel thy law they shall lay incense before thy nose [spoken of God after the manner of man that is before thee who art in a special manner present with the ark of the covenant which was in the most holy places behind whose vail the altar of incense stood ] and that which shall be consumed [with fire as burning offerings and some other offerings] upon thine altar[of burnt offerings.]"}],"11":[{"catchword":null,"tekst":"Bless Lord his power [or his host that is hosts the Levites being distinguished in their ranks for several offices see numbers chapter 4] and let the works of his hands be well pleasing unto thee smite through the loins [or wound thrust through &c. that is break their power in pieces compare Psa 18:39] of those that rise up against him that they rise not up again [others as soon as they rise up.]"}],"12":[{"catchword":null,"tekst":"And of Benjamin he said the beloved of the Lord [this hath respect to the tender love of Jacob towards Benjamin where unto without doubt Jacob was moved by God see thereof Gen 42:36,38 and 43.6,14 and 44.20,22,29 &c.] he shall dwell in the safety by him [that is by the Lord as Benjamin dwelt formerly by his father Jacob ] he shall cover [or protect defend ] him all the day long and he shall dwell Benjamin&acirc;&euro;&trade;s shoulder that is Jerusalem the chief city of his possession thus Jerusalem is compared to the head standing between the shoulders and Benjamin&acirc;&euro;&trade;s land to the body.]"}],"13":[{"catchword":null,"tekst":"And of Joseph he said blessed of the Lord be his land from the most excellent things of heaven [meaning the most excellent fruits which by reason of the heaven that is of the air do spring forth and grow see Gen 49:25] from the dew and from the deep [that is the deep waters see Genesis 49 verse 25] that lieth beneath."}],"14":[{"catchword":null,"tekst":"And from the most excellent revenues of the sun [Heb. From the most excellent of the revenues of the sun and so in the sequel this is the fairest fruit which by the heat and warmth of the sun come forth and ripen ] and from the most excellent putting forth of the moon [which the moon in divers months putteth forth or thrusteth forth in that the moistened the earth.]"}],"15":[{"catchword":null,"tekst":"And from the most excellent things of ancient mountains [ Heb. Mountains of antiquate] and from the most excellent things of the everlasting hills [Heb. Of the eternity that is which hath been from the beginning of the world see Gen 49:26 Heb. From the head of the hills &c. that is the principalest chiefest as Exo 30:23 understand the fair wholesome Herbs of the fruits of trees vines the fair olives and fig trees that grow most pleasantly on the mountains and hills.]"}],"16":[{"catchword":null,"tekst":"And from the most excellent things of the earth and fullness thereof and from the good will of him [or and this by the good will of God being the fountain of this blessing] that dwelt in the bush [that appeared to Moseh in the bush Exo 3:2 ] let the blessing come upon from the head of Joseph [that is Joseph posterity ] and upon the top of the head of him that was separated from his brethren [see Gen 48:22 and 49 on verse 26.]"}],"17":[{"catchword":null,"tekst":"He hath the glory of the first born of the first born of his ox [that is he is fair strong and nimble as the first born of one of his oxen] and his horns ly hid in great abundance in the bottom of the sea and are sometimes cast out upon the shore or else fished and taken up.]"}],"20":[{"catchword":null,"tekst":"And of Gad he said blessed [that is thanked praise see Genesis 14 on verse 20.] be he that maketh room for Gad [namely God who gave the Gadites room by Jephy the Gileadite when they were also straightened by the Amorites see Judges 11 compare Gen 49:19 Psa 4:2 &c.] he dwelled as an old lion [bold and undaunted marching forth out of his troop like a lion to subdue his enemies see the accomplishment 1Ch 5:19,20,21,22] and teareth the arm yea also the crown of the head."}],"21":[{"catchword":null,"tekst":"and he provided the first for himself [ he looked out in the beginning for a fit dwelling place for himself or of the first that is of the first place that he met with to wit Gilead Num 32:1 &c. which also was granted them by Moseh the law giver Numbers 3,33 &c. and there the Gadites according to their offer and Moseh content or yielding left their wives children and cattle under Gods judgment against the Canaanites see Num 32:16,17&c. and above chapter 4.16,18,19,20] because he was there covered in the portions of law giver therefore he came with the heads of people he executed the justice of the Lord and his judgments with Israel."}],"22":[{"catchword":null,"tekst":"And of Dan he said Dan is a young lion [nimble and courageous against the enemy ] he shall leap forth as from Basan [hence is gathered that there were many and strong lions there compare Jud 14:5 of Basan see above chapter 32 on verse 14.]"}],"23":[{"catchword":null,"tekst":"And of Naphtali he said O Naphtali be satisfied with the good will and full with the blessing of the Lord [with gifts which come from the favor and blessing of God ] possess hereditarily the west [Heb. The sea because the midland sea lay on the west side of Canaan see Genesis 12 on verse 8] and the south."}],"24":[{"catchword":null,"tekst":"And the Aser he said let Aser be blessed with sons [others above the other sons that is his brethren or blessed that is thanked and praised of the other sons as those that shall partake for the fruitfulness of his land ] let him be acceptable to his brethren and let him dip his feet in oil [compare Gen 49:20and Job 29:6.]"}],"25":[{"catchword":null,"tekst":"Iron and copper shall be under thy shoe [others be thy shutting up meaning the mountain wherein these metals should be found Hebrews let iron and copper be thy shoe the meaning is iron and copper shall under thy feet compare above chapter 8.9 shall be shut in and kept as with iron and copper bars ] and thy strength [others fame] as thy days [the meaning is as long as thou shalt be a nation thou salt be strong mighty or famous by reason of strength or power thine old age shall be thine youth.]"}],"26":[{"catchword":null,"tekst":"There is none like unto God O Jeschurun [others there is none like unto the God of Jeschurun of Jeschurun see above chapter 32.15] who rideth upon the heaven of thy help [upon the heaven that is upon the air from whence he sendeth help unto his people against their enemies whom he from thence smiteth and destroyeth with terrible tempest of hail lightning and thunder see an excellent exposition hereof Psalms 18 on verse 7 to verse 20] and with his highness [that is with his high and glorious working ] upon the uppermost [or thinnest ] clouds which are angered in the uppermost part of the air.]"}],"27":[{"catchword":null,"tekst":"The everlasting God [ the Hebrew word rendered here everlasting being used of creatures signifieth what which was in the former times of old or from the beginning of the world as above verse 15 but being used of God its like signifieth eternity ]be an habitation unto thee [that is an high place wherein thou mayest live quietly and in safety ] and underneath everlasting almightiness of God shall help and protect them on the earth beneath ] and let him drive away the enemy before thy face and let him say destroy them."}],"28":[{"catchword":null,"tekst":"Israel then shall dwell in the safety alone and Jacobs eye shall be upon a land of corn and new wine [that is Jacobs posterity shall dwell in peace behold the fruitfulness of their land with their eyes and take delight in it others the fountain of Jacob that is a lasting spring that stood of all kinds of blessings be among the people of Israel that is sprung from Jacob &c.] yea his heaven shall drop with dew."}],"29":[{"catchword":null,"tekst":"Happy art thou O Israel who is like unto thee? Thou art a people redeemed by the Lord the shield of thy help [or thy shield of help that is thy helping shield as Psa 2:6 the mountain of my holiness that is my holy mountain] who is is a sword of thy highness who fighteth for thee to lift thee up on high] therefore thine enemies shall feignedly subject themselves unto thee [shall be forced to submit unto thee though they have no real intention in it or do it not from the heart see 2Samuel 25 on verse45 Psa 18:45 and compare Psa 66:3 and81.16] and thou salt tread upon their high places [see above chapter 32on verse 13.]"}]}}};

  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
