-17": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld! In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders. Zij die de HEERE haten, zouden zich Hem geveinsd onderworpen hebben, maar hun tijd zou eeuwig geweest zijn.", "Jer 31:23": "Zo zegt de HEERE van de heerscharen, de God van Israël: Dit woord zullen zij nog zeggen in het land van Juda, en in zijn steden, wanneer Ik hun gevangenschap ombuigen zal: De HEERE zegent u, woning van de gerechtigheid, berg van de heiligheid!", "Deut 4:1-40": "Israël! hoor naar de inzettingen en de rechten die ik u leer te doen, opdat u leeft, en het land binnentrekt en in bezit neemt dat de HEERE, de God van uw vaderen, u geeft. U mag aan dit woord, dat ik u gebied, niets toevoegen, en er ook niets van afdoen; opdat u de geboden bewaart van de HEERE, uw God, die ik u gebied. Uw ogen hebben gezien wat God bij Baäl-peor gedaan heeft; want ieder man die Baäl-peor navolgde, die heeft de HEERE, uw God, uit uw midden weggevaagd.", "Gal 2:17": "Maar als wij, die in Christus zoeken gerechtvaardigd te worden, ook zelf zondaars blijken te zijn, is Christus dan een dienaar van de zonde? Dat zij verre.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Spr 11:20": "De verkeerden van hart zijn de HEERE een gruwel; maar de oprechten van weg zijn Zijn welgevallen.", "Ef 5:8-11": "Want u was eertijds duisternis, maar nu bent u licht in de Heere; wandel als kinderen van het licht. (Want de vrucht van de Geest bestaat in alle goedheid, en rechtvaardigheid, en waarheid), terwijl u beproeft wat de Heere welgevallig is.", "1 Kor 13:3": "En al zou het zo zijn dat ik al mijn goederen uitdeelde tot onderhoud van de armen, en al zou het zo zijn dat ik mijn lichaam overgaf om verbrand te worden, en de liefde niet had, dan zou het mij niets baten.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Ps 41:2-4": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads. De HEERE zal hem bewaren, en zal hem bij het leven behouden; hij zal op aarde gelukkig gemaakt worden. Geef hem ook niet over in de begeerte van zijn vijanden. De HEERE zal hem ondersteunen op het ziekbed; in zijn ziekte verandert U zijn hele leger.", "Num 13:27": "En zij vertelden hem en zeiden: Wij zijn gekomen tot dat land, waarheen u ons gezonden hebt; en werkelijk, het vloeit van melk en honing, en dit is zijn vrucht.", "Joz 24:21-25": "Toen zei het volk tegen Jozua: Nee, want wij zullen de HEERE dienen. Jozua nu zei tegen het volk: U bent getuigen tegen uzelf, dat u de HEERE gekozen hebt om Hem te dienen. En zij zeiden: Wij zijn getuigen. En nu, doe de vreemde goden weg die in uw midden zijn, en neig uw hart tot de HEERE, de God van Israël.", "Jer 27:4-6": "En beveel hun om tegen hun heren te zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zo zult u tegen uw heren zeggen: Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "2 Kron 6:35": "Hoor dan uit de hemel hun gebed en hun smeking, en voer hun recht uit.", "Hagg 2:24": "Op die dag, spreekt de HEERE van de heerscharen, zal Ik u nemen, Zerubbabel, zoon van Sealthiël, Mijn dienstknecht! spreekt de HEERE, en Ik zal u stellen als een zegelring; want Ik heb u verkozen, spreekt de HEERE van de heerscharen.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Ps 89:14": "Gij hebt een arm met macht; Uw hand is sterk, Uw rechterhand is hoog.", "Ps 105:9": "Het verbond, dat Hij met Abraham heeft gemaakt, en Zijn eed aan Izak;", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Rom 12:20": "Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen.", "Deut 10:15": "Alleen heeft de HEERE behagen gehad in uw vaderen, om hen lief te hebben, en heeft hun nageslacht na hen, u, uit alle volken uitverkoren, zoals het op deze dag is.", "Spr 3:2": "Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Ps 63:4": "Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen.", "Lev 23:10": "Spreek tot de kinderen van Israël, en zeg tegen hen: Als u in het land zult gekomen zijn, dat Ik u geven zal, en u uw oogst zult inoogsten, dan zult u een schoof van de eerstelingen van uw oogst tot de priester brengen.", "Deut 15:2-14": "Dit nu is de regel van de vrijlating: iedere schuldeiser die zijn naaste iets geleend heeft, zal het vrijlaten; hij zal zijn naaste of zijn broeder niet manen, omdat men voor de HEERE een vrijlating heeft uitgeroepen. De vreemde zult u manen; maar wat u bij uw broeder hebt, zal uw hand vrijlaten; Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten;", "Hebr 13:16": "En vergeet de weldadigheid en de mededeelzaamheid niet; want aan zulke offers heeft God een welgevallen.", "Jes 52:1": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen.", "Job 28:28": "Maar tegen de mens heeft Hij gezegd: Zie, de vreze des Heeren, dat is de wijsheid, en van het kwade te wijken is het verstand.", "Ps 10:18": "Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven.", "Ps 10:14": "U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Jes 63:7-9": "Ik zal de blijken van goedertierenheid van de HEERE vermelden, de veelvoudige lof van de HEERE, naar alles wat de HEERE ons heeft bewezen, en de grote goedheid aan het huis van Israël, die Hij hun bewezen heeft, naar Zijn barmhartigheden, en naar de veelheid van Zijn blijken van goedertierenheid. Want Hij zei: Zij zijn zeker Mijn volk, kinderen die niet liegen zullen? Zo is Hij hun geworden tot een Heiland. In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Jes 58:10": "En als u uw ziel opent voor de hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag.", "Jes 48:20": "Ga uit van Babel, vlucht van de Chaldeeën, verkondig met de stem van het gejuich, doe zulks horen, breng het uit tot aan het einde van de aarde, zeg: De HEERE heeft Zijn knecht Jakob verlost!", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Deut 8:16-20": "Die u in de woestijn voedde met manna, dat uw vaderen niet gekend hadden; om u te verootmoedigen, en om u te beproeven, opdat Hij u uiteindelijk goeddeed; En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is.", "Ps 51:20": "Doe goed bij Sion naar Uw welbehagen; bouw de muren van Jeruzalem op.", "Ef 5:1": "Wees dan navolgers van God, als geliefde kinderen;", "Deut 11:8": "Houd dan alle geboden, die ik u heden gebied; opdat u sterk wordt en het land binnengaat, en het erft, waarheen u overtrekt, om dat te erven;", "Kol 1:22": "in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Lev 25:23": "Het land ook zal niet voor altijd verkocht worden; want het land is van Mij, omdat u vreemdelingen en bijwoners bij Mij bent.", "Jes 44:5": "Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Ps 148:14": "En Hij heeft de hoorn van Zijn volk verhoogd, de roem van al Zijn gunstgenoten, van de kinderen van Israël, het volk, dat dicht bij Hem is. Halleluja!", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "Ex 1:7": "werden de kinderen van Israël vruchtbaar en namen ze sterk in aantal toe, en zij vermeerderden, en werden buitengewoon machtig, zodat het land met hen vervuld werd.", "Jer 15:16": "Toen Uw woorden gevonden werden, heb ik ze opgegeten, en Uw woord is mij geweest tot vreugde en tot blijdschap van mijn hart; want ik ben naar Uw Naam genoemd, o HEERE, God van de heerscharen!", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Job 37:17": "Hoe uw klederen warm worden, als Hij de aarde stil maakt vanuit het zuiden?", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 107:35-38": "Hij maakt van de woestijn een waterpoel, en van het dorre land waterbronnen. En Hij doet de hongerigen daar wonen, en zij stichten een stad om in te wonen; En bezaaien akkers, en planten wijngaarden, die vrucht opbrengen.", "Gen 17:1": "Toen Abram negenennegentig jaar oud was, verscheen de HEERE aan Abram en zei tegen hem: Ik ben God, de Almachtige! Wandel voor Mijn aangezicht en wees oprecht!", "Deut 12:17-19": "U zult in uw poorten niet mogen eten de tienden van uw koren, en van uw most, en van uw olie, noch de eerstgeboorte van uw runderen en van uw schapen, noch enige van uw geloften die u zult hebben beloofd, noch uw vrijwillige offers, noch het hefoffer van uw hand. Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt. Wacht u ervoor dat u de Leviet niet verlaat, al uw dagen in uw land.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Lev 25:55": "Want de kinderen van Israël zijn voor Mij dienstknechten; Mijn dienstknechten zijn zij, die Ik uit het land Egypte geleid heb; Ik ben de HEERE, uw God!", "Hebr 6:16-18": "Want mensen zweren wel bij iemand die groter is dan zij, en de eed tot bevestiging is voor hen een einde van alle tegenspraak; waarbij God, omdat Hij aan de erfgenamen van de belofte overvloediger de onveranderlijkheid van Zijn raad wilde tonen, er een eed tussen heeft gebracht; opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Gal 3:29": "En als u van Christus bent, dan bent u Abrahams nageslacht, en naar de belofte erfgenamen.", "Gen 31:24": "Doch God kwam tot Laban, de Syriër, in een droom 's nachts, en Hij zei tegen hem: Pas op, dat u met Jakob niet spreekt, noch goed, noch kwaad.", "2 Tim 2:16": "Maar verzet u tegen het ongoddelijk ijdel geklets; want zij zullen in meerdere goddeloosheid toenemen.", "Rom 16:1": "En ik beveel u Febe aan, onze zuster, die een dienares is van de Gemeente die te Kenchreen is;", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "Jer 12:7": "Ik heb Mijn huis verlaten, Ik heb Mijn erfenis laten varen; Ik heb de beminde van Mijn ziel in de hand van haar vijanden gegeven.", "Luk 1:72": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken;", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "1 Joh 3:3": "En ieder die deze hoop op Hem heeft, reinigt zichzelf, zoals Hij rein is.", "Jer 10:16": "Jakobs deel is niet gelijk die, want Hij is de Formeerder van alles, en Israël is de roede van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "Rom 12:13": "Deel mee in de behoeften van de heiligen. Streef naar gastvrijheid.", "1 Petr 4:2": "om niet meer naar de begeerten van de mensen, maar naar de wil van God de tijd te leven die nog over is in het vlees.", "Gen 17:8": "En Ik zal u en uw nageslacht na u het land waar u als vreemdeling verblijft geven, het hele land Kanaän, tot eeuwig eigendom; en Ik zal hun tot een God zijn.", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Deut 28:17": "Vervloekt zal zijn uw korf, en uw baktrog.", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "Num 15:38-40": "Spreek tot de kinderen van Israël en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken van hun kleren, bij hun geslachten; en op het snoertje van de hoek zullen zij een hemelsblauwe draad zetten. En het zal voor u aan de snoertjes zijn, opdat u het aanziet en aan al de geboden van de HEERE denkt en die doet; en dat u niet afdwaalt naar uw eigen hart en naar uw eigen ogen, waar u achteraan hoereert; Opdat u denkt aan en doet al Mijn geboden, en voor uw God heilig bent.", "1 Kor 10:32": "Wees zonder aanstoot te geven, zowel voor de Joden als voor de Grieken als voor de gemeente van God.", "Openb 22:1-5": "En hij toonde mij een zuivere rivier van het water des levens, klaar als kristal, die uit de troon van God en van het Lam kwam. In het midden van haar straat en aan de ene en de andere zijde van de rivier was de boom des levens, die twaalf keer vrucht droeg, van maand tot maand zijn vrucht gevend; en de bladeren van de boom waren tot genezing van de heidenen. En geen vervloeking zal er meer tegen iemand zijn; en de troon van God en van het Lam zal daar zijn, en Zijn dienstknechten zullen Hem dienen;", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Gen 28:20": "En Jakob deed een gelofte, en zei: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op deze weg die ik reis, en mij brood gegeven zal hebben om te eten, en kleren om aan te trekken;", "1 Joh 3:2": "Geliefden, nu zijn wij kinderen van God, en het is nog niet openbaar geworden wat wij zijn zullen. Maar wij weten dat, als Hij geopenbaard zal zijn, wij Hem gelijk zullen zijn; want wij zullen Hem zien zoals Hij is.", "Ex 22:22-24": "U mag geen weduwe of wees kwaad doen. Als u hen op enige manier kwaad doet, en zij roepen dan tot Mij, zal Ik hun geroep zeker verhoren; en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.", "Jes 62:8": "De HEERE heeft gezworen bij Zijn rechterhand, en bij de arm van Zijn sterkte: Als Ik uw koren nog geef tot voedsel voor uw vijanden, en als de vreemden zullen drinken van uw most, waarvoor u hebt gewerkt!", "Ps 72:16": "Is er een handvol koren in het land op de hoogte van de bergen, de vrucht daarvan zal ruisen als de Libanon; en die van de stad zullen bloeien als het kruid van de aarde.", "Jer 3:19": "Ik zei wel: Hoe zal Ik u onder de kinderen plaatsen, en u het begeerlijke land geven, de sierlijke erfenis van de heerscharen van de heidenvolken? Maar Ik zei: U zult tot Mij roepen: Mijn Vader! en u zult van achter Mij niet afkeren.", "Deut 15:6": "Want de HEERE, uw God, zal u zegenen, zoals Hij tot u heeft gesproken; zo zult u aan veel volken lenen, maar u zult niet lenen; en u zult over veel volken heersen, maar over u zullen zij niet heersen.", "Ps 122:7": "Vrede zij binnen uw vesting, welvaart in uw paleizen.", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Ex 4:31": "En het volk geloofde, en zij hoorden, dat de HEERE de kinderen van Israël bezocht had, en dat Hij hun verdrukking gezien had, en zij bogen hun hoofden, en aanbaden.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "Ps 21:4-6": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud. Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos. Groot is zijn eer door Uw heil; majesteit en heerlijkheid hebt U hem toegevoegd.", "Ps 91:1-16": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige. Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw! Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie.", "Hand 2:46": "En zij bleven dagelijks eendrachtig in de tempel volharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "Mark 11:25": "En wanneer u staat om te bidden, vergeef als u iets tegen iemand hebt; opdat ook uw Vader, Die in de hemelen is, u uw overtredingen vergeeft.", "Jes 48:12": "Hoor naar Mij, o Jakob! En u, Israël, Mijn geroepene! Ik ben Dezelfde; Ik ben de Eerste, ook ben Ik de Laatste.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Luk 6:35": "Maar heb uw vijanden lief, en doe goed, en leen, zonder iets terug te hopen; en uw loon zal groot zijn, en u zult kinderen van de Allerhoogste zijn; want Hij is goedertieren over de ondankbaren en de bozen.", "1 Joh 2:5": "Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Jes 16:3": "Breng raad, houd gericht, maak uw schaduw als de nacht in het midden van de middag; verberg de verdrevenen, en verraad hem die rondzwerft niet.", "Jer 49:11": "Laat uw wezen achter, en Ik zal hen in het leven behouden, en laat uw weduwen op Mij vertrouwen.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "1 Joh 3:1": "Zie, hoe grote liefde de Vader ons gegeven heeft, namelijk dat wij kinderen van God genoemd zouden worden. Daarom kent de wereld ons niet, omdat zij Hem niet kent.", "Rom 6:13": "En stel uw leden niet tot wapens van de ongerechtigheid ter beschikking aan de zonde; maar stel uzelf ter beschikking aan God, als mensen die uit de doden levend geworden zijn, en stel uw leden tot wapens van de gerechtigheid ter beschikking aan God.", "Ps 100:2": "Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Hos 12:1": "Die van Efraïm hebben Mij omsingeld met leugen, en het huis van Israël met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.", "Rom 2:28": "Want die is niet een Jood, die het in het openbaar is; en dat is ook niet de besnijdenis, die het in het openbaar in het vlees is;", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Jes 63:15": "Zie neer van de hemel, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw krachten, het gerommel van Uw ingewand en van Uw barmhartigheden? Zij houden zich tegen mij in.", "2 Kor 8:5": "En zij deden niet alleen, zoals wij gehoopt hadden, maar gaven zichzelf eerst aan de Heere en daarna aan ons, door de wil van God.", "Lev 27:30": "Ook alle tienden van het land, van het zaad van het land, van de vrucht van de boom, zijn van de HEERE; zij zijn de HEERE heilig.", "Jes 52:4": "Want zo zegt de Heere HEERE: In vroeger tijden trok Mijn volk af naar Egypte, om daar als vreemdeling te wonen; en Assur heeft het zonder reden onderdrukt.", "Mal 3:16": "Toen spraken zij die de HEERE vrezen, ieder tot zijn naaste: De HEERE merkt er toch op en hoort, en er is een gedenkboek voor Zijn aangezicht geschreven, voor hen die de HEERE vrezen, en voor hen die aan Zijn Naam denken.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Jer 5:24": "En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; Die voor ons de weken, de vastgestelde tijden van de oogst, bewaart.", "Ps 74:2": "Denk aan Uw vergadering, die U vanouds verworven hebt; de roede van Uw erfenis, die U verlost hebt; de berg Sion, waar U gewoond hebt.", "Joz 22:34": "En de kinderen van Ruben en de kinderen van Gad noemden dat altaar: Getuige, want het zij een getuige tussen ons, dat de HEERE God is.", "Rom 9:26": "En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.", "Deut 32:5": "Hij heeft het tegen Hem verdorven; het zijn Zijn kinderen niet; de schandvlek is hun; het is een verkeerd en verdraaid geslacht.", "Deut 32:46": "Zei hij tegen hen: Zet uw hart op al de woorden, die ik heden onder u betuig, dat u ze uw kinderen gebieden zult, dat zij nauwlettend zullen doen al de woorden van deze wet.", "Gal 5:22-25": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing. Tegen zulke mensen is de wet niet. Maar wie van Christus zijn, hebben het vlees gekruisigd met zijn hartstochten en begeerten.", "Gen 8:22": "Voortaan, al de dagen van de aarde, zullen zaaiing en oogst, en koude en hitte, en zomer en winter, en dag en nacht niet ophouden.", "1 Petr 4:7": "En het einde van alle dingen is nabij; wees dan nuchter en waak in de gebeden.", "Jer 42:5": "Toen zeiden zij tegen Jeremia: De HEERE zij tussen ons tot een waarachtig en betrouwbaar Getuige: als wij niet handelen naar elk woord waarmee de HEERE, uw God, u naar ons toe zal zenden!", "Ex 3:1": "Mozes hoedde de kudde van Jethro, zijn schoonvader, de priester in Midian; en hij leidde de kudde tot voorbij de woestijn, en hij kwam aan de berg van God, aan Horeb.", "1 Kon 8:27": "Maar zou God werkelijk op de aarde wonen? Zie, de hemelen, ja, de hemel der hemelen kunnen U niet bevatten, hoeveel te minder dit huis, dat ik gebouwd heb!", "Deut 16:9-15": "Zeven weken zult u tellen; vanaf het moment dat men met de sikkel begint in het staande koren, zult u de zeven weken beginnen te tellen. Daarna zult u de HEERE, uw God, het feest van de weken houden; het zal een vrijwillige schatting van uw hand zijn, die u geven zult, naarmate de HEERE, uw God, u gezegend zal hebben. En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is, en de vreemdeling, en de wees, en de weduwe die in uw midden zijn; in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen.", "Ezech 18:17": "Zijn hand van de ellendige afhoudt, geen woeker noch overwinst neemt, Mijn rechten doet, en in Mijn inzettingen wandelt; die zal niet sterven om de ongerechtigheid van zijn vader; hij zal zeker leven.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ex 28:36": "Verder zult u een plaat maken van zuiver goud, en u zult daarin graveren, zoals men de zegels graveert: HEILIGHEID VOOR DE HEERE!", "Ps 135:4": "Want de HEERE heeft Zich Jakob verkoren, Israël tot Zijn eigendom.", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.", "Joh 14:21-24": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren. Judas, niet de Iskariot, zei tegen Hem: Heere, hoe komt het dat U Uzelf aan ons zult openbaren, en niet aan de wereld? Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Deut 18:4": "De eerstelingen van uw koren, van uw most en van uw olie, en de eerstelingen van de wol van uw schapen zult u hem geven;", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Spr 29:7": "De rechtvaardige neemt kennis van de rechtszaak van de armen; maar de goddeloze begrijpt die kennis niet.", "Ezech 37:27": "En Mijn tabernakel zal bij hen zijn, en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Hebr 13:10-12": "Wij hebben een altaar waarvan zij die de tabernakel dienen, geen macht hebben om te eten. Want de lichamen van de dieren waarvan het bloed voor de zonde door de hogepriester in het heiligdom gedragen werd, worden verbrand buiten de legerplaats. Daarom heeft ook Jezus, opdat Hij door Zijn eigen bloed het volk zou heiligen, buiten de poort geleden.", "1 Kor 10:31": "Of u dus eet, of drinkt, of iets anders doet, doe alles tot eer van God.", "Hand 7:35": "Deze Mozes, die zij verloochend hadden door te zeggen: Wie heeft u tot leider en rechter gesteld? — deze heeft God tot leider en verlosser gezonden, door de hand van de engel die hem verschenen was in de doornstruik.", "Ps 98:1": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven.", "Dan 6:23": "Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "Ps 137:1-6": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion;", "Rom 7:4": "Zo dan, mijn broeders, u bent ook voor de wet gedood door het lichaam van Christus, opdat u zou toebehoren aan een Ander, namelijk aan Hem Die van de doden opgewekt is, opdat wij voor God vruchten zouden dragen.", "Deut 4:8": "En welk groot volk is er, dat zulke rechtvaardige inzettingen en rechten heeft als deze hele wet, die ik vandaag voor u leg?", "Luk 1:73": "en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven", "1 Sam 15:22": "Doch Samuël zei: Heeft de HEERE evenveel behagen in brandoffers en slachtoffers, als in het gehoorzamen aan de stem van de HEERE? Zie, gehoorzamen is beter dan slachtoffer, opmerken beter dan het vet van rammen.", "Num 6:27": "Zo zullen zij Mijn Naam op de kinderen van Israël leggen; en Ik zal hen zegenen.", "Deut 10:18": "Die het recht van de wees en van de weduwe doet; en de vreemdeling liefheeft, door hem brood en kleding te geven.", "Jes 60:16": "En u zult de melk van de heidenen zuigen, en u zult de borsten van de koningen zuigen; en u zult weten dat Ik de HEERE ben, uw Heiland, en uw Verlosser, de Machtige van Jakob."}, "noten": {}, "koppeling": {"1": "Verder zal het gebeuren, <span class=\"wl\" data-l=\"L1\" data-code=\"H935\">wanneer</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H430\">u</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H935\">gekomen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H935\">bent</span> in <span class=\"wl\" data-l=\"L2\" data-code=\"H776\">het</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H776\">land</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H430\">dat</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H430\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H430\">HEERE</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H430\">uw</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H430\">God</span>, u als <span class=\"wl\" data-l=\"L5\" data-code=\"H3423\">erfelijk</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3423\">bezit</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H5414\">geven</span> <span class=\"wl\" data-l=\"L4\" data-co \" data-code=\"H776\">land</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> thee for an <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> and <span class=\"wl wl-kjv\" data-code=\"H3423\">possessest</span> it, and dwellest", "2": "That thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H7225\">first</span> of all the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">earth,</span> which thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> of thy <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> thee, and shalt <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> it in a <span class=\"wl wl-kjv\" data-code=\"H2935\">basket,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> to <span class=\"wl wl-kjv\" data-code=\"H7931\">place</span> his name", "3": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> that shall be in those <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, I <span class=\"wl wl-kjv\" data-code=\"H5046\">profess</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that I am <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> for to give", "4": "And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H2935\">basket</span> out of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and set it <span class=\"wl wl-kjv\" data-code=\"H3240\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy God.", "5": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6030\">speak</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> A <span class=\"wl wl-kjv\" data-code=\"H761\">Syrian</span> ready to <span class=\"wl wl-kjv\" data-code=\"H6\">perish</span> was my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and he went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourned</span> there <span class=\"wl wl-kjv\" data-code=\"H4962\">with</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">few,</span> and became there a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great,</span> <span class=\"wl wl-kjv\" data-code=\"H6099\">mighty,</span> and populous:", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptians</span> evil <span class=\"wl wl-kjv\" data-code=\"H7489\">entreated</span> us, and <span class=\"wl wl-kjv\" data-code=\"H6031\">afflicted</span> us, and <span class=\"wl wl-kjv\" data-code=\"H5414\">laid</span> upon us <span class=\"wl wl-kjv\" data-code=\"H7186\">hard</span> bondage:", "7": "And when we <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> our <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> on our <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction,</span> and our <span class=\"wl wl-kjv\" data-code=\"H5999\">labour,</span> and our oppression:", "8": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> brought us <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> with a <span class=\"wl wl-kjv\" data-code=\"H2389\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and with an <span class=\"wl wl-kjv\" data-code=\"H5186\">outstretched</span> <span class=\"wl wl-kjv\" data-code=\"H2220\">arm,</span> and with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4172\">terribleness,</span> and with <span class=\"wl wl-kjv\" data-code=\"H226\">signs,</span> and with wonders:", "9": "And he hath <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> us into this <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> us this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> even a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that <span class=\"wl wl-kjv\" data-code=\"H2100\">floweth</span> with <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> and honey.", "10": "And now, behold, I have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">firstfruits</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> which thou, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> hast <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> me. And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3240\">set</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy God:", "11": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> in every <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> thing which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto thee, and unto thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> thou, and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> that is among", "12": "When thou hast made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H6237\">tithing</span> all the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithes</span> of thine <span class=\"wl wl-kjv\" data-code=\"H8393\">increase</span> the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> which is the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H4643\">tithing,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> it unto the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite,</span> the <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger,</span> the <span class=\"wl wl-kjv\" data-code=\"H3490\">fatherless,</span> and the <span class=\"wl wl-kjv\" data-code=\"H490\">widow,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> within thy <span class=\"wl wl-kjv\" data-code=\"H8179\">gates,</span> and be filled;", "13": "Then thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> I have brought <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> the hallowed <span class=\"wl wl-kjv\" data-code=\"H6944\">things</span> out of mine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and also have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> them unto the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite,</span> and unto the <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger,</span> to the <span class=\"wl wl-kjv\" data-code=\"H3490\">fatherless,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H490\">widow,</span> according to all thy <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> me: I have not <span class=\"wl wl-kjv\" data-code=\"H5674\">transgressed</span> thy <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> neither have I forgotten", "14": "I have not <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> thereof in my <span class=\"wl wl-kjv\" data-code=\"H205\">mourning,</span> neither have I taken <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> ought thereof for any <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> use, nor <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> ought thereof for the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead:</span> but I have <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> to the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> according to all that thou hast commanded", "15": "Look <span class=\"wl wl-kjv\" data-code=\"H8259\">down</span> from thy <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H4583\">habitation,</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> us, as thou <span class=\"wl wl-kjv\" data-code=\"H7650\">swarest</span> unto our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that <span class=\"wl wl-kjv\" data-code=\"H2100\">floweth</span> with <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> and honey.", "16": "This <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> thee to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> these <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes</span> and <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments:</span> thou shalt therefore <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them with all thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and with all thy soul.", "17": "Thou hast <span class=\"wl wl-kjv\" data-code=\"H559\">avouched</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to be thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> his <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto his voice:", "18": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">avouched</span> thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to be his <span class=\"wl wl-kjv\" data-code=\"H5459\">peculiar</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> as he hath <span class=\"wl wl-kjv\" data-code=\"H1696\">promised</span> thee, and that thou shouldest <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> all his commandments;", "19": "And to <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee <span class=\"wl wl-kjv\" data-code=\"H5945\">high</span> above all <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> which he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> in <span class=\"wl wl-kjv\" data-code=\"H8416\">praise,</span> and in <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and in <span class=\"wl wl-kjv\" data-code=\"H8597\">honour;</span> and that thou mayest be an <span class=\"wl wl-kjv\" data-code=\"H6918\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> as he hath spoken."}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
