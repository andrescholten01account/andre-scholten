vrucht van uw schoot, en de vrucht van uw land, en de vrucht van uw vee, de aanwas van uw koeien, en de kudden van uw kleinvee.","5":"Gezegend zal zijn uw korf, en uw baktrog.","6":"Gezegend zult u zijn in uw ingaan, gezegend zult u zijn in uw uitgaan.","7":"De HEERE zal geven dat uw vijanden, die tegen u opstaan, verslagen worden voor uw ogen; door één weg zullen zij tegen u uittrekken, maar door zeven wegen zullen zij voor u vluchten.","8":"De HEERE zal de zegen gebieden, zodat Hij met u is in uw schuren, en in alles waar u uw hand aan slaat; en Hij zal u zegenen in het land dat de HEERE, uw God, u geven zal.","9":"De HEERE zal u voor Zichzelf tot een heilig volk bevestigen, zoals Hij u gezworen heeft, wanneer u de geboden van de HEERE, uw God, houdt, en in Zijn wegen wandelt.","10":"En alle volken van de aarde zullen zien dat de Naam van de HEERE over u uitgeroepen is, en zij zullen voor u vrezen.","11":"En de HEERE zal u laten overvloeien in het goede, in de vrucht van uw schoot, en in de vrucht van uw vee, en in de vrucht van uw land; in het land dat de HEERE uw vaderen gezworen heeft u te zullen geven.","12":"De HEERE zal voor u Zijn goede schat openen, de hemel, om aan uw land regen te geven op zijn tijd, en om al het werk van uw hand te zegenen; en u zult aan veel volken lenen, maar u zult niet lenen van anderen.","13":"En de HEERE zal u tot een hoofd maken, en niet tot een staart, en u zult alleen boven zijn, en niet onder zijn; wanneer u luistert naar de geboden van de HEERE, uw God, die ik u heden gebied te houden en te doen;","14":"En als u niet afwijkt van al de woorden die ik u heden gebied, naar rechts of naar links, om andere goden na te lopen om ze te dienen.","15":"Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen.","16":"Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld.","17":"Vervloekt zal zijn uw korf, en uw baktrog.","18":"Vervloekt zal zijn de vrucht van uw schoot, en de vrucht van uw land, de aanwas van uw koeien, en de kudden van uw kleinvee.","19":"Vervloekt zult u zijn in uw ingaan, en vervloekt zult u zijn in uw uitgaan.","20":"De HEERE zal onder u zenden de vloek, de verstoring en het verderf, in alles waar u uw hand aan slaat om te doen; totdat u verdelgd wordt, en totdat u haastig omkomt, vanwege de slechtheid van uw daden, waarmee u Mij verlaten hebt.","21":"De HEERE zal de pestilentie aan u laten kleven, totdat Hij u wegvaagt uit het land waar u naartoe gaat om het te erven.","22":"De HEERE zal u slaan met tering, en met koorts, en met ontsteking, en met hitte, en met droogte, en met korenbrand, en met meeldauw, die u zullen achtervolgen totdat u omkomt.","23":"En uw hemel, die boven uw hoofd is, zal koper zijn, en de aarde, die onder u is, zal ijzer zijn.","24":"De HEERE, uw God, zal stof en poeder tot regen van uw land geven; vanuit de hemel zal het op u neerdalen, totdat u verdelgd wordt.","25":"De HEERE zal geven dat u verslagen wordt voor uw vijanden; door één weg zult u tegen hem uittrekken, en door zeven wegen zult u voor hem vluchten; en u zult heen en weer gedreven worden onder alle koninkrijken van de aarde.","26":"En uw dode lichaam zal voedsel zijn voor alle vogels van de hemel, en voor de dieren van de aarde; en niemand zal ze verjagen.","27":"De HEERE zal u slaan met zweren van Egypte, en met gezwellen, en met droge schurft, en met huiduitslag, waarvan u niet zult kunnen genezen.","28":"De HEERE zal u slaan met waanzin, en met blindheid, en met verbijstering van hart;","29":"Zodat u op de middag zult rondtasten, zoals een blinde rondtast in het donker, en uw wegen niet voorspoedig zult maken; maar u zult alleen maar verdrukt en beroofd zijn, alle dagen, en er zal geen redder zijn.","30":"U zult een vrouw ondertrouwen, maar een ander zal met haar slapen; een huis zult u bouwen, maar er niet in wonen; een wijngaard zult u planten, maar de vrucht ervan niet gewoon gebruiken.","31":"Uw os zal voor uw ogen geslacht worden, maar u zult er niet van eten; uw ezel zal voor uw ogen geroofd worden, en niet bij u terugkeren; uw kleinvee zal aan uw vijanden gegeven worden, en voor u zal geen redder zijn.","32":"Uw zonen en uw dochters zullen aan een ander volk gegeven worden, terwijl uw ogen toekijken en de hele dag naar hen smachten; maar het zal niet in de macht van uw hand zijn.","33":"De vrucht van uw land en al uw arbeid zal een volk opeten dat u niet gekend hebt; en u zult alle dagen alleen maar verdrukt en gepletterd zijn.","34":"En u zult waanzinnig worden vanwege wat uw ogen te zien krijgen.","35":"De HEERE zal u slaan met kwaadaardige zweren aan de knieën en aan de benen, waarvan u niet zult kunnen genezen, van uw voetzool af tot aan uw schedel.","36":"De HEERE zal u, alsook uw koning die u over u aangesteld zult hebben, doen gaan naar een volk dat u niet gekend hebt, noch uw vaderen; en daar zult u andere goden dienen, hout en steen.","37":"En u zult tot een schrik, tot een spreekwoord en tot een spotlied worden, onder al de volken waarheen de HEERE u leiden zal.","38":"U zult veel zaad naar de akker uitbrengen, maar u zult weinig inzamelen; want de sprinkhaan zal het opeten.","39":"Wijngaarden zult u planten en bewerken, maar u zult geen wijn drinken, noch iets vergaren; want de worm zal het opeten.","40":"Olijfbomen zult u hebben binnen al uw grondgebied, maar u zult u met olie niet zalven; want uw olijfboom zal zijn vrucht afwerpen.","41":"Zonen en dochters zult u verwekken, maar zij zullen niet voor u zijn; want zij zullen in gevangenschap gaan.","42":"Al uw geboomte, en de vrucht van uw land, zal het schadelijke gewormte in bezit nemen.","43":"De vreemdeling die in uw midden is, zal steeds hoger boven u opklimmen; en u zult steeds lager neerdalen.","44":"Hij zal u lenen, maar u zult hem niet lenen; hij zal tot een hoofd zijn, en u zult tot een staart zijn.","45":"En al deze vloeken zullen over u komen, en u achtervolgen, en u treffen, totdat u verdelgd wordt; omdat u niet naar de stem van de HEERE, uw God, geluisterd hebt, om Zijn geboden en Zijn inzettingen te houden, die Hij u geboden heeft.","46":"En zij zullen onder u tot een teken en tot een wonder zijn, ja, onder uw nageslacht tot in eeuwigheid.","47":"Omdat u de HEERE, uw God, niet gediend hebt met vreugde en blijdschap van hart, vanwege de overvloed van alles;","48":"Zo zult u uw vijanden, die de HEERE tegen u zenden zal, dienen, in honger en in dorst, en in naaktheid, en in gebrek aan alles; en Hij zal een ijzeren juk op uw hals leggen, totdat Hij u verdelgt.","49":"De HEERE zal tegen u een volk laten opkomen van ver, van het einde van de aarde, zoals een arend vliegt; een volk waarvan u de taal niet zult verstaan;","50":"Een volk, hard van gezicht, dat geen ontzag zal hebben voor de oude, noch genadig zal zijn voor de jonge.","51":"En het zal de vrucht van uw vee, en de vrucht van uw land opeten, totdat u verdelgd zult zijn; het zal u geen koren, most of olie, aanwas van uw koeien of kudden van uw kleinvee overlaten, totdat het u vernietigt.","52":"En het zal u benauwen in al uw poorten, totdat uw hoge en versterkte muren neervallen, waarop u vertrouwde in uw hele land; ja, het zal u benauwen in al uw poorten, in uw hele land, dat de HEERE, uw God, u gegeven heeft.","53":"En u zult de vrucht van uw schoot eten, het vlees van uw zonen en van uw dochters, die de HEERE, uw God, u gegeven zal hebben; in de belegering en in de benauwdheid waarmee uw vijanden u zullen benauwen.","54":"Wat betreft de man die teder onder u is, en die zeer verwend geweest is, zijn oog zal boosaardig zijn tegen zijn broeder, en tegen de vrouw van zijn schoot, en tegen zijn overige zonen die hij overgehouden zal hebben;","55":"Zodat hij aan niemand van hen iets zal geven van het vlees van zijn zonen die hij eet, omdat hij voor zichzelf niets heeft overgehouden; in de belegering en in de benauwdheid waarmee uw vijand u in al uw poorten zal benauwen.","56":"Wat betreft de tedere en verwende vrouw onder u, die niet vertrouwd was met haar voetzool op de aarde te zetten, vanwege haar verwendheid en tederheid; haar oog zal boosaardig zijn tegen de man van haar schoot, en tegen haar zoon, en tegen haar dochter;","57":"Namelijk vanwege haar nageboorte, die van tussen haar voeten uitgegaan zal zijn, en vanwege haar zonen die zij gebaard zal hebben; want zij zal hen in het verborgene eten, wegens gebrek aan alles; in de belegering en in de benauwdheid waarmee uw vijand u zal benauwen in uw poorten.","58":"Als u niet oplet om al de woorden van deze wet te doen, die in dit boek geschreven zijn, om deze heerlijke en ontzagwekkende Naam te vrezen, de HEERE, uw God;","59":"Dan zal de HEERE uw plagen wonderlijk maken, alsook de plagen van uw nageslacht; het zullen grote en aanhoudende plagen zijn, en kwaadaardige en aanhoudende ziekten.","60":"En Hij zal alle kwalen van Egypte, waarvoor u gevreesd hebt, op u laten terugkeren, en zij zullen aan u blijven kleven.","61":"Ook elke ziekte en elke plaag, die niet geschreven is in het boek van deze wet, zal de HEERE over u laten komen, totdat u verdelgd wordt.","62":"En u zult met weinig mensen overblijven, terwijl u was als de sterren van de hemel in aantal; omdat u niet naar de stem van de HEERE, uw God, geluisterd hebt.","63":"En het zal gebeuren: zoals de HEERE Zich over u verblijdde door u goed te doen en u meer te maken, zo zal de HEERE Zich over u verblijden door u te vernietigen en u te verdelgen; en u zult weggerukt worden uit het land waar u naartoe gaat om het te erven.","64":"En de HEERE zal u verstrooien onder alle volken, van het ene einde van de aarde tot het andere einde van de aarde; en daar zult u andere goden dienen die u niet gekend hebt, noch uw vaderen, hout en steen.","65":"Daarbij zult u onder die volken geen rust vinden, en uw voetzool zal geen rust hebben; want de HEERE zal u daar een bevend hart geven, en bezwijking van de ogen, en kwelling van de ziel.","66":"En uw leven zal voor u onzeker hangen; en u zult nacht en dag angst hebben, en u zult niet zeker zijn van uw leven.","67":"Des morgens zult u zeggen: Was het maar avond; en des avonds zult u zeggen: Was het maar morgen; vanwege de schrik van uw hart, waarmee u geschrokken zult zijn, en vanwege wat uw ogen te zien krijgen.","68":"En de HEERE zal u met schepen laten terugkeren naar Egypte, langs een weg waarvan ik u gezegd heb: U zult die niet meer zien; en daar zult u zich aan uw vijanden willen verkopen als slaven en slavinnen; maar er zal geen koper zijn."},"SV":{"1":"En het zal geschieden, indien gij der stem des HEEREN, uws Gods, vlijtiglijk zult gehoorzamen, waarnemende te doen al Zijn geboden, die ik u heden gebiede, zo zal de HEERE, uw God, u hoog zetten boven alle volken der aarde.","2":"En al deze zegeningen zullen over u komen, en u aantreffen, wanneer gij der stem des HEEREN uws Gods, zult gehoorzaam zijn.","3":"Gezegend zult gij zijn in de stad, en gezegend zult gij zijn in het veld.","4":"Gezegend zal zijn de vrucht uws buiks, en de vrucht uws lands, en de vrucht uwer beesten, de voortzetting uwer koeien, en de kudden van uw klein vee.","5":"Gezegend zal zijn uw korf, en uw baktrog.","6":"Gezegend zult gij zijn in uw ingaan, gezegend zult gij zijn in uw uitgaan.","7":"De HEERE zal geven uw vijanden, die tegen u opstaan, geslagen voor uw aangezicht; door een weg zullen zij tot u uittrekken, maar door zeven wegen zullen zij voor uw aangezicht vlieden.","8":"De HEERE zal den zegen gebieden, dat Hij met u zij in uw schuren, en in alles, waaraan gij uw hand slaat; en Hij zal u zegenen in het land, dat u de HEERE, uw God, geven zal.","9":"De HEERE zal u Zichzelven tot een heilig volk bevestigen, gelijk als Hij u gezworen heeft, wanneer gij de geboden des HEEREN, uws Gods, zult houden, en in Zijn wegen wandelen.","10":"En alle volken der aarde zullen zien, dat de Naam des HEEREN over u genoemd is, en zij zullen voor u vrezen.","11":"En de HEERE zal u doen overvloeien aan goed, in de vrucht uws buiks, en in de vrucht uwer beesten, en in de vrucht uws lands; op het land, dat de HEERE uw vaderen gezworen heeft u te zullen geven.","12":"De HEERE zal u opendoen Zijn goeden schat, den hemel, om aan uw land regen te geven te zijner tijd, en om te zegenen al het werk uwer hand; en gij zult aan vele volken lenen, maar gij zult niet ontlenen.","13":"En de HEERE zal u tot een hoofd maken, en niet tot een staart, en gij zult alleenlijk boven zijn, en niet onder zijn; wanneer gij horen zult naar de geboden des HEEREN, uws Gods, die ik u heden gebiede te houden en te doen;","14":"En gij niet afwijken zult van al de woorden, die ik ulieden heden gebiede, ter rechter *hand* of ter linkerhand, dat gij andere goden nawandelt, om hen te dienen.","15":"Daarentegen zal het geschieden, indien gij de stem des HEEREN, uws Gods, niet zult gehoorzaam zijn, om waar te nemen, dat gij doet al Zijn geboden en Zijn inzettingen, die ik u heden gebiede; zo zullen al deze vloeken over u komen, en u treffen.","16":"Vervloekt zult gij zijn in de stad, en vervloekt zult gij zijn in het veld.","17":"Vervloekt zal zijn uw korf, en uw baktrog.","18":"Vervloekt zal zijn de vrucht uws buiks, en de vrucht uws lands, de voortzetting uwer koeien, en de kudden van uw klein vee.","19":"Vervloekt zult gij zijn in uw ingaan, en vervloekt zult gij zijn in uw uitgaan.","20":"De HEERE zal onder u zenden den vloek, de verstoring en het verderf, in alles, waaraan gij uw hand slaat, dat gij doen zult; totdat gij verdelgd wordt, en totdat gij haastelijk omkomt, vanwege de boosheid uwer werken, waarmede gij Mij verlaten hebt.","21":"De HEERE zal u de pestilentie doen aankleven, totdat Hij u verdoe van het land, waar gij naar toe gaat, om dat te erven.","22":"De HEERE zal u slaan met tering, en met koorts, en met vurigheid, en met hitte, en met droogte, en met brandkoren, en met honigdauw, die u vervolgen zullen, totdat gij omkomt.","23":"En uw hemel, die boven uw hoofd is, zal koper zijn, en de aarde, die onder u is, zal ijzer zijn.","24":"De HEERE, uw God, zal pulver en stof tot regen uws lands geven; van den hemel zal het op u nederdalen, totdat gij verdelgd wordt.","25":"De HEERE zal u geslagen geven voor het aangezicht uwer vijanden; door een weg zult gij tot hem uittrekken, en door zeven wegen zult gij voor zijn aangezicht vlieden; en gij zult van alle koninkrijken der aarde beroerd worden.","26":"En uw dood lichaam zal aan alle gevogelte des hemels, en aan de beesten der aarde tot spijze zijn; en niemand zal ze afschrikken.","27":"De HEERE zal u slaan met zweren van Egypte, en met spenen, en met droge schurft, en met krauwsel, waarvan gij niet zult kunnen genezen worden.","28":"De HEERE zal u slaan met onzinnigheid, en met blindheid, en met verbaasdheid des harten;","29":"Dat gij op den middag zult omtasten, gelijk als een blinde omtast in het donkere, en uw wegen niet zult voorspoedig maken; maar gij zult alleenlijk verdrukt en beroofd zijn alle dagen, en er zal geen verlosser zijn.","30":"Gij zult een vrouw ondertrouwen, maar een ander zal haar beslapen ; een huis zult gij bouwen, maar daarin niet wonen; een wijngaard zult gij planten, maar dien niet gemeen maken.","31":"Uw os zal voor uw ogen geslacht worden, maar gij zult daarvan niet eten; uw ezel zal van voor uw aangezicht geroofd worden, en tot u niet wederkeren; uw klein vee zal aan uw vijanden gegeven worden, en voor u zal geen verlosser zijn.","32":"Uw zonen en uw dochteren zullen aan een ander volk gegeven worden, dat het uw ogen aanzien, en naar hen bezwijken den gansen dag; maar het zal in het vermogen uwer hand niet zijn.","33":"De vrucht van uw land en al uw arbeid zal een volk eten, dat gij niet gekend hebt; en gij zult alle dagen alleenlijk verdrukt en gepletterd zijn.","34":"En gij zult onzinnig zijn, vanwege het gezicht uwer ogen, dat gij zien zult.","35":"De HEERE zal u slaan met boze zweren, aan de knieën en aan de benen, waarvan gij niet zult kunnen genezen worden, van uw voetzool af tot aan uw schedel.","36":"De HEERE zal u, mitsgaders uw koning, dien gij over u zult gesteld hebben, doen gaan tot een volk, dat gij niet gekend hebt, noch uw vaderen; en aldaar zult gij dienen andere goden, hout en steen.","37":"En gij zult zijn tot een schrik, tot een spreekwoord en tot een spotrede, onder al de volken, waarheen u de HEERE leiden zal.","38":"Gij zult veel zaads op den akker uitbrengen, maar gij zult weinig inzamelen; want de sprinkhaan zal het verteren.","39":"Wijngaarden zult gij planten, en bouwen, maar gij zult geen wijn drinken, noch iets vergaderen; want de worm zal het afeten.","40":"Olijfbomen zult gij hebben in al uw landpalen, maar gij zult u met olie niet zalven; want uw olijfboom zal *zijn* *vrucht* afwerpen.","41":"Zonen en dochteren zult gij gewinnen, maar zij zullen voor u niet zijn; want zij zullen in gevangenis gaan.","42":"Al uw geboomte, en de vrucht uws lands zal het boos gewormte erfelijk bezitten.","43":"De vreemdeling, die in het midden van u is, zal hoog, hoog boven u opklimmen; en gij zult laag, laag nederdalen.","44":"Hij zal u lenen, maar gij zult hem niet lenen; hij zal tot een hoofd zijn, en gij zult tot een staart zijn.","45":"En al deze vloeken zullen over u komen, en u vervolgen, en u treffen, totdat gij verdelgd wordt; omdat gij der stem des HEEREN, uws Gods, niet gehoorzaam zult geweest zijn, om te houden Zijn geboden en Zijn inzettingen, die Hij u geboden heeft.","46":"En zij zullen onder u tot een teken, en tot een wonder zijn, ja, onder uw zaad tot in eeuwigheid.","47":"Omdat gij den HEERE, uw God, niet gediend zult hebben met vrolijkheid en goedheid des harten, vanwege de veelheid van alles;","48":"Zo zult gij uw vijanden, die de HEERE onder u zenden zal, dienen, in honger en in dorst, en in naaktheid, en in gebrek van alles; en Hij zal een ijzeren juk op uw hals leggen, totdat Hij u verdelge.","49":"De HEERE zal tegen u een volk verheffen van verre, van het einde der aarde, gelijk als een arend vliegt; een volk, welks spraak gij niet zult verstaan;","50":"Een volk, stijf van aangezicht, dat het aangezicht des ouden niet zal aannemen, noch den jonge genadig zijn.","51":"En het zal de vrucht uwer beesten, en de vrucht uws lands opeten, totdat gij verdelgd zult zijn; hetwelk u geen koren, most noch olie, voortzetting uwer koeien noch kudden van uw klein vee zal overig laten, totdat Hij u verdoe.","52":"En het zal u beangstigen in al uw poorten, totdat uw hoge en vaste muren nedervallen, op welke gij vertrouwdet in uw ganse land; ja, het zal u beangstigen in al uw poorten, in uw ganse land, dat u de HEERE, uw God, gegeven heeft.","53":"En gij zult eten de vrucht uws buiks, het vlees uwer zonen en uwer dochteren, die u de HEERE, uw God, gegeven zal hebben; in de belegering en in de benauwing, waarmede uw vijanden u zullen benauwen.","54":"Aangaande den man, die teder onder u, en die zeer wellustig geweest is, zijn oog zal kwaad zijn tegen zijn broeder, en tegen de huisvrouw zijns schoots, en tegen zijn overige zonen, die hij overgehouden zal hebben;","55":"Dat hij niet aan een van die zal geven van het vlees zijner zonen, die hij eten zal, omdat hij voor zich niets heeft overgehouden; in de belegering en in de benauwing, waarmede uw vijand u in al uw poorten zal benauwen.","56":"Aangaande de tedere en wellustige *vrouw* onder u, die niet verzocht heeft haar voetzool op de aarde te zetten, omdat zij zich wellustig en teder hield; haar oog zal kwaad zijn tegen den man haars schoots, en tegen haar zoon, en tegen haar dochter;","57":"En dat om haar nageboorte, die van tussen haar voeten uitgegaan zal zijn, en om haar zonen, die zij gebaard zal hebben; want zij zal hen eten in het verborgene, vermits gebrek van alles; in de belegering en in de benauwing, waarmede uw vijand u zal benauwen in uw poorten.","58":"Indien gij niet zult waarnemen te doen al de woorden dezer wet, die in dit boek geschreven zijn, om te vrezen dezen heerlijken en vreselijken Naam, den HEERE, uw God;","59":"Zo zal de HEERE uw plagen wonderlijk maken, mitsgaders de plagen van uw zaad; het zullen grote en gewisse plagen, en boze en gewisse krankten zijn.","60":"En Hij zal op u doen keren alle kwalen van Egypte, voor dewelke gij gevreesd hebt, en zij zullen u aanhangen.","61":"Ook alle krankte, en alle plage, die in het boek dezer wet niet geschreven is, zal de HEERE over u doen komen, totdat gij verdelgd wordt.","62":"En gij zult met weinige mensen overgelaten worden, in plaats dat gij geweest zijt als de sterren des hemels in menigte; omdat gij der stem des HEEREN, uws Gods, niet gehoorzaam geweest zijt.","63":"En het zal geschieden, gelijk als de HEERE Zich over ulieden verblijdde, u goed doende en u vermenigvuldigende, alzo zal Zich de HEERE over u verblijden, u verdoende en u verdelgende; en gij zult uitgerukt worden uit het land, waar gij naar toe gaat, om dat te erven.","64":"En de HEERE zal u verstrooien onder alle volken, van het ene einde der aarde tot aan het andere einde der aarde; en aldaar zult gij andere goden dienen, die gij niet gekend hebt, noch uw vaders, hout en steen.","65":"Daartoe zult gij onder dezelve volken niet stil zijn, en uw voetzool zal geen rust hebben; want de HEERE zal u aldaar een bevend hart geven, en bezwijking der ogen, en mattigheid der ziel.","66":"En uw leven zal tegenover u hangen; en gij zult nacht en dag schrikken, en gij zult van uw leven niet zeker zijn.","67":"Des morgens zult gij zeggen: Och, dat het avond ware; en des avonds zult gij zeggen: Och, dat het morgen ware; vermits den schrik uws harten, waarmede gij zult verschrikt zijn, en vermits het gezicht uwer ogen, dat gij zien zult.","68":"En de HEERE zal u naar Egypte doen wederkeren in schepen, door een weg, waarvan ik u gezegd heb: Gij zult dien niet meer zien; en aldaar zult gij u aan uw vijanden willen verkopen tot dienstknechten en tot dienstmaagden; maar er zal geen koper zijn."},"KJV":{"1":"And it shall come to pass, if thou shalt hearken diligently unto the voice of the LORD thy God, to observe *and* to do all his commandments which I command thee this day, that the LORD thy God will set thee on high above all nations of the earth:","2":"And all these blessings shall come on thee, and overtake thee, if thou shalt hearken unto the voice of the LORD thy God.","3":"Blessed *shalt* thou *be* in the city, and blessed *shalt* thou *be* in the field.","4":"Blessed *shall be* the fruit of thy body, and the fruit of thy ground, and the fruit of thy cattle, the increase of thy kine, and the flocks of thy sheep.","5":"Blessed *shall be* thy basket and thy store.","6":"Blessed *shalt* thou *be* when thou comest in, and blessed *shalt* thou *be* when thou goest out.","7":"The LORD shall cause thine enemies that rise up against thee to be smitten before thy face: they shall come out against thee one way, and flee before thee seven ways.","8":"The LORD shall command the blessing upon thee in thy storehouses, and in all that thou settest thine hand unto; and he shall bless thee in the land which the LORD thy God giveth","9":"The LORD shall establish thee an holy people unto himself, as he hath sworn unto thee, if thou shalt keep the commandments of the LORD thy God, and walk in his ways.","10":"And all people of the earth shall see that thou art called by the name of the LORD; and they shall be afraid","11":"And the LORD shall make thee plenteous in goods, in the fruit of thy body, and in the fruit of thy cattle, and in the fruit of thy ground, in the land which the LORD sware unto thy fathers to give","12":"The LORD shall open unto thee his good treasure, the heaven to give the rain unto thy land in his season, and to bless all the work of thine hand: and thou shalt lend unto many nations, and thou shalt not borrow.","13":"And the LORD shall make thee the head, and not the tail; and thou shalt be above only, and thou shalt not be beneath; if that thou hearken unto the commandments of the LORD thy God, which I command thee this day, to observe and to do","14":"And thou shalt not go aside from any of the words which I command thee this day, *to* the right hand, or *to* the left, to go after other gods to serve","15":"But it shall come to pass, if thou wilt not hearken unto the voice of the LORD thy God, to observe to do all his commandments and his statutes which I command thee this day; that all these curses shall come upon thee, and overtake","16":"Cursed *shalt* thou *be* in the city, and cursed *shalt* thou *be* in the field.","17":"Cursed *shall be* thy basket and thy store.","18":"Cursed *shall be* the fruit of thy body, and the fruit of thy land, the increase of thy kine, and the flocks of thy sheep.","19":"Cursed *shalt* thou *be* when thou comest in, and cursed *shalt* thou *be* when thou goest out.","20":"The LORD shall send upon thee cursing, vexation, and rebuke, in all that thou settest thine hand unto for to do, until thou be destroyed, and until thou perish quickly; because of the wickedness of thy doings, whereby thou hast forsaken","21":"The LORD shall make the pestilence cleave unto thee, until he have consumed thee from off the land, whither thou goest to possess","22":"The LORD shall smite thee with a consumption, and with a fever, and with an inflammation, and with an extreme burning, and with the sword, and with blasting, and with mildew; and they shall pursue thee until thou perish.","23":"And thy heaven that *is* over thy head shall be brass, and the earth that is under thee *shall be* iron.","24":"The LORD shall make the rain of thy land powder and dust: from heaven shall it come down upon thee, until thou be destroyed.","25":"The LORD shall cause thee to be smitten before thine enemies: thou shalt go out one way against them, and flee seven ways before them: and shalt be removed into all the kingdoms of the earth.","26":"And thy carcase shall be meat unto all fowls of the air, and unto the beasts of the earth, and no man shall fray *them* away.","27":"The LORD will smite thee with the botch of Egypt, and with the emerods, and with the scab, and with the itch, whereof thou canst not be healed.","28":"The LORD shall smite thee with madness, and blindness, and astonishment of heart:","29":"And thou shalt grope at noonday, as the blind gropeth in darkness, and thou shalt not prosper in thy ways: and thou shalt be only oppressed and spoiled evermore, and no man shall save","30":"Thou shalt betroth a wife, and another man shall lie with her: thou shalt build an house, and thou shalt not dwell therein: thou shalt plant a vineyard, and shalt not gather the grapes","31":"Thine ox *shall be* slain before thine eyes, and thou shalt not eat thereof: thine ass *shall be* violently taken away from before thy face, and shall not be restored to thee: thy sheep *shall be* given unto thine enemies, and thou shalt have none to rescue","32":"Thy sons and thy daughters *shall be* given unto another people, and thine eyes shall look, and fail *with longing* for them all the day long: and *there shall be* no might in thine hand.","33":"The fruit of thy land, and all thy labours, shall a nation which thou knowest not eat up; and thou shalt be only oppressed and crushed alway:","34":"So that thou shalt be mad for the sight of thine eyes which thou shalt see.","35":"The LORD shall smite thee in the knees, and in the legs, with a sore botch that cannot be healed, from the sole of thy foot unto the top of thy head.","36":"The LORD shall bring thee, and thy king which thou shalt set over thee, unto a nation which neither thou nor thy fathers have known; and there shalt thou serve other gods, wood and stone.","37":"And thou shalt become an astonishment, a proverb, and a byword, among all nations whither the LORD shall lead","38":"Thou shalt carry much seed out into the field, and shalt gather *but* little in; for the locust shall consume","39":"Thou shalt plant vineyards, and dress *them*, but shalt neither drink *of* the wine, nor gather *the grapes*; for the worms shall eat","40":"Thou shalt have olive trees throughout all thy coasts, but thou shalt not anoint *thyself* with the oil; for thine olive shall cast","41":"Thou shalt beget sons and daughters, but thou shalt not enjoy them; for they shall go into captivity.","42":"All thy trees and fruit of thy land shall the locust consume.","43":"The stranger that *is* within thee shall get up above thee very high; and thou shalt come down very low.","44":"He shall lend to thee, and thou shalt not lend to him: he shall be the head, and thou shalt be the tail.","45":"Moreover all these curses shall come upon thee, and shall pursue thee, and overtake thee, till thou be destroyed; because thou hearkenedst not unto the voice of the LORD thy God, to keep his commandments and his statutes which he commanded","46":"And they shall be upon thee for a sign and for a wonder, and upon thy seed for ever.","47":"Because thou servedst not the LORD thy God with joyfulness, and with gladness of heart, for the abundance","48":"Therefore shalt thou serve thine enemies which the LORD shall send against thee, in hunger, and in thirst, and in nakedness, and in want of all *things*: and he shall put a yoke of iron upon thy neck, until he have destroyed","49":"The LORD shall bring a nation against thee from far, from the end of the earth, *as swift* as the eagle flieth; a nation whose tongue thou shalt not understand;","50":"A nation of fierce countenance, which shall not regard the person of the old, nor shew favour to the young:","51":"And he shall eat the fruit of thy cattle, and the fruit of thy land, until thou be destroyed: which *also* shall not leave thee *either* corn, wine, or oil, *or* the increase of thy kine, or flocks of thy sheep, until he have destroyed","52":"And he shall besiege thee in all thy gates, until thy high and fenced walls come down, wherein thou trustedst, throughout all thy land: and he shall besiege thee in all thy gates throughout all thy land, which the LORD thy God hath given","53":"And thou shalt eat the fruit of thine own body, the flesh of thy sons and of thy daughters, which the LORD thy God hath given thee, in the siege, and in the straitness, wherewith thine enemies shall distress","54":"*So that* the man *that is* tender among you, and very delicate, his eye shall be evil toward his brother, and toward the wife of his bosom, and toward the remnant of his children which he shall leave:","55":"So that he will not give to any of them of the flesh of his children whom he shall eat: because he hath nothing left him in the siege, and in the straitness, wherewith thine enemies shall distress thee in all thy gates.","56":"The tender and delicate woman among you, which would not adventure to set the sole of her foot upon the ground for delicateness and tenderness, her eye shall be evil toward the husband of her bosom, and toward her son, and toward her daughter,","57":"And toward her young one that cometh out from between her feet, and toward her children which she shall bear: for she shall eat them for want of all *things* secretly in the siege and straitness, wherewith thine enemy shall distress thee in thy gates.","58":"If thou wilt not observe to do all the words of this law that are written in this book, that thou mayest fear this glorious and fearful name, THE LORD THY GOD;","59":"Then the LORD will make thy plagues wonderful, and the plagues of thy seed, *even* great plagues, and of long continuance, and sore sicknesses, and of long continuance.","60":"Moreover he will bring upon thee all the diseases of Egypt, which thou wast afraid of; and they shall cleave","61":"Also every sickness, and every plague, which *is* not written in the book of this law, them will the LORD bring upon thee, until thou be destroyed.","62":"And ye shall be left few in number, whereas ye were as the stars of heaven for multitude; because thou wouldest not obey the voice of the LORD thy God.","63":"And it shall come to pass, *that* as the LORD rejoiced over you to do you good, and to multiply you; so the LORD will rejoice over you to destroy you, and to bring you to nought; and ye shall be plucked from off the land whither thou goest to possess","64":"And the LORD shall scatter thee among all people, from the one end of the earth even unto the other; and there thou shalt serve other gods, which neither thou nor thy fathers have known, *even* wood and stone.","65":"And among these nations shalt thou find no ease, neither shall the sole of thy foot have rest: but the LORD shall give thee there a trembling heart, and failing of eyes, and sorrow of mind:","66":"And thy life shall hang in doubt before thee; and thou shalt fear day and night, and shalt have none assurance of thy life:","67":"In the morning thou shalt say, Would God it were even! and at even thou shalt say, Would God it were morning! for the fear of thine heart wherewith thou shalt fear, and for the sight of thine eyes which thou shalt see.","68":"And the LORD shall bring thee into Egypt again with ships, by the way whereof I spake unto thee, Thou shalt see it no more again: and there ye shall be sold unto your enemies for bondmen and bondwomen, and no man shall buy"}},"tsk":{"1":[{"kopje":"Als u","refs":["Deut 11:13","Deut 15:5","Deut 27:1","Ex 15:26","Lev 26:3-13","Ps 106:3","Ps 111:10","Jes 1:19","Jes 3:10","Jes 55:2","Jes 55:3","Jer 11:4","Jer 12:16","Jer 17:24","Luk 11:28"]},{"kopje":"al Zijn geboden doet","refs":["Ps 119:6","Ps 119:128","Luk 1:6","Joh 15:14","Gal 3:10","Jak 2:10","Jak 2:11"]},{"kopje":"plaatsen","refs":["Deut 26:19","Ps 91:14","Ps 148:14","Luk 9:48","Rom 2:7"]}],"2":[{"kopje":"over u komen","refs":["Deut 28:15","Deut 28:45","Zach 1:6","1 Tim 4:8"]}],"3":[{"kopje":"in de stad","refs":["Ps 107:36","Ps 107:37","Ps 128:1-5","Ps 144:12-15","Jes 65:21-23","Zach 8:3-5"]},{"kopje":"op het veld","refs":["Gen 26:12","Gen 39:5","Amos a-code=\"H7651\">seven</span> ways.","8":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> the <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> upon thee in thy <span class=\"wl wl-kjv\" data-code=\"H618\">storehouses,</span> and in all that thou <span class=\"wl wl-kjv\" data-code=\"H4916\">settest</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto; and he shall <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> thee in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> giveth","9":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H6965\">establish</span> thee an <span class=\"wl wl-kjv\" data-code=\"H6918\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> unto himself, as he hath <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> unto thee, if thou shalt <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> in his ways.","10":"And all <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> that thou art <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> by the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and they shall be afraid","11":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall make thee <span class=\"wl wl-kjv\" data-code=\"H3498\">plenteous</span> in <span class=\"wl wl-kjv\" data-code=\"H2896\">goods,</span> in the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of thy <span class=\"wl wl-kjv\" data-code=\"H990\">body,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of thy <span class=\"wl wl-kjv\" data-code=\"H929\">cattle,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of thy <span class=\"wl wl-kjv\" data-code=\"H127\">ground,</span> in the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> to give","12":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> unto thee his <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H214\">treasure,</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H4306\">rain</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> in his <span class=\"wl wl-kjv\" data-code=\"H6256\">season,</span> and to <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> all the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3867\">lend</span> unto <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and thou shalt not borrow.","13":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thee the <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and not the <span class=\"wl wl-kjv\" data-code=\"H2180\">tail;</span> and thou shalt be above <span class=\"wl wl-kjv\" data-code=\"H4605\">only,</span> and thou shalt not be <span class=\"wl wl-kjv\" data-code=\"H4295\">beneath;</span> if that thou <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> and to do","14":"And thou shalt not go <span class=\"wl wl-kjv\" data-code=\"H5493\">aside</span> from any of the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> which I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> to the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> or to the <span class=\"wl wl-kjv\" data-code=\"H8040\">left,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> to serve","15":"But it shall come to pass, if thou wilt not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all his <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> and his <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> which I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> that all these <span class=\"wl wl-kjv\" data-code=\"H7045\">curses</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon thee, and overtake","16":"<span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> shalt thou be in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H779\">cursed</span> shalt thou be in the field.","17":"<span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> shall be thy <span class=\"wl wl-kjv\" data-code=\"H2935\">basket</span> and thy store.","18":"<span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of thy <span class=\"wl wl-kjv\" data-code=\"H990\">body,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of thy <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> the <span class=\"wl wl-kjv\" data-code=\"H7698\">increase</span> of thy <span class=\"wl wl-kjv\" data-code=\"H504\">kine,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6251\">flocks</span> of thy sheep.","19":"<span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> shalt thou be when thou comest <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H779\">cursed</span> shalt thou be when thou goest out.","20":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> upon thee <span class=\"wl wl-kjv\" data-code=\"H3994\">cursing,</span> <span class=\"wl wl-kjv\" data-code=\"H4103\">vexation,</span> and <span class=\"wl wl-kjv\" data-code=\"H4045\">rebuke,</span> in all that thou <span class=\"wl wl-kjv\" data-code=\"H4916\">settest</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto for to <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> until thou be <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed,</span> and until thou <span class=\"wl wl-kjv\" data-code=\"H6\">perish</span> <span class=\"wl wl-kjv\" data-code=\"H4118\">quickly;</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H7455\">wickedness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H4611\">doings,</span> whereby thou hast forsaken","21":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall make the <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence</span> <span class=\"wl wl-kjv\" data-code=\"H1692\">cleave</span> unto thee, until he have <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> thee from off the <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> whither thou <span class=\"wl wl-kjv\" data-code=\"H935\">goest</span> to possess","22":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> thee with a <span class=\"wl wl-kjv\" data-code=\"H7829\">consumption,</span> and with a <span class=\"wl wl-kjv\" data-code=\"H6920\">fever,</span> and with an <span class=\"wl wl-kjv\" data-code=\"H1816\">inflammation,</span> and with an extreme <span class=\"wl wl-kjv\" data-code=\"H2746\">burning,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and with <span class=\"wl wl-kjv\" data-code=\"H7711\">blasting,</span> and with <span class=\"wl wl-kjv\" data-code=\"H3420\">mildew;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> thee until thou perish.","23":"And thy <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> that is over thy <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5178\">brass,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> that is under thee shall be iron.","24":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H4306\">rain</span> of thy <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H80\">powder</span> and <span class=\"wl wl-kjv\" data-code=\"H6083\">dust:</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> shall it come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> upon thee, until thou be destroyed.","25":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">cause</span> thee to be <span class=\"wl wl-kjv\" data-code=\"H5062\">smitten</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies:</span> thou shalt go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> against them, and <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them: and shalt be <span class=\"wl wl-kjv\" data-code=\"H2189\">removed</span> into all the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of the earth.","26":"And thy <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3978\">meat</span> unto all <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">air,</span> and unto the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and no man shall fray them away.","27":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> thee with the <span class=\"wl wl-kjv\" data-code=\"H7822\">botch</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H2914\">emerods,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H1618\">scab,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H2775\">itch,</span> whereof thou <span class=\"wl wl-kjv\" data-code=\"H3201\">canst</span> not be healed.","28":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> thee with <span class=\"wl wl-kjv\" data-code=\"H7697\">madness,</span> and <span class=\"wl wl-kjv\" data-code=\"H5788\">blindness,</span> and <span class=\"wl wl-kjv\" data-code=\"H8541\">astonishment</span> of heart:","29":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H4959\">grope</span> at <span class=\"wl wl-kjv\" data-code=\"H6672\">noonday,</span> as the <span class=\"wl wl-kjv\" data-code=\"H5787\">blind</span> <span class=\"wl wl-kjv\" data-code=\"H4959\">gropeth</span> in <span class=\"wl wl-kjv\" data-code=\"H653\">darkness,</span> and thou shalt not <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> in thy <span class=\"wl wl-kjv\" data-code=\"H1870\">ways:</span> and thou shalt be only <span class=\"wl wl-kjv\" data-code=\"H6231\">oppressed</span> and <span class=\"wl wl-kjv\" data-code=\"H1497\">spoiled</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">evermore,</span> and no man shall save","30":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H781\">betroth</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with her: thou shalt <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and thou shalt not <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein: thou shalt <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> a <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard,</span> and shalt not gather the grapes","31":"Thine <span class=\"wl wl-kjv\" data-code=\"H7794\">ox</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2873\">slain</span> before thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and thou shalt not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> thereof: thine <span class=\"wl wl-kjv\" data-code=\"H2543\">ass</span> shall be violently taken <span class=\"wl wl-kjv\" data-code=\"H1497\">away</span> from before thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and shall not be <span class=\"wl wl-kjv\" data-code=\"H7725\">restored</span> to thee: thy <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and thou shalt have none to rescue","32":"Thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look,</span> and <span class=\"wl wl-kjv\" data-code=\"H3616\">fail</span> with longing for them all the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> long: and there shall be no <span class=\"wl wl-kjv\" data-code=\"H410\">might</span> in thine hand.","33":"The <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of thy <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> and all thy <span class=\"wl wl-kjv\" data-code=\"H3018\">labours,</span> shall a <span class=\"wl wl-kjv\" data-code=\"H5971\">nation</span> which thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> not eat <span class=\"wl wl-kjv\" data-code=\"H398\">up;</span> and thou shalt be only <span class=\"wl wl-kjv\" data-code=\"H6231\">oppressed</span> and <span class=\"wl wl-kjv\" data-code=\"H7533\">crushed</span> alway:","34":"So that thou shalt be <span class=\"wl wl-kjv\" data-code=\"H7696\">mad</span> for the <span class=\"wl wl-kjv\" data-code=\"H4758\">sight</span> of thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> which thou shalt see.","35":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> thee in the <span class=\"wl wl-kjv\" data-code=\"H1290\">knees,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H7785\">legs,</span> with a <span class=\"wl wl-kjv\" data-code=\"H7451\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H7822\">botch</span> that <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> be <span class=\"wl wl-kjv\" data-code=\"H7495\">healed,</span> from the <span class=\"wl wl-kjv\" data-code=\"H3709\">sole</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> unto the top of thy head.","36":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H3212\">bring</span> thee, and thy <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> which thou shalt <span class=\"wl wl-kjv\" data-code=\"H6965\">set</span> over thee, unto a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> which neither thou nor thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> have <span class=\"wl wl-kjv\" data-code=\"H3045\">known;</span> and there shalt thou <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> and stone.","37":"And thou shalt become an <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment,</span> a <span class=\"wl wl-kjv\" data-code=\"H4912\">proverb,</span> and a <span class=\"wl wl-kjv\" data-code=\"H8148\">byword,</span> among all <span class=\"wl wl-kjv\" data-code=\"H5971\">nations</span> whither the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall lead","38":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H3318\">carry</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> but <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H622\">in;</span> for the <span class=\"wl wl-kjv\" data-code=\"H697\">locust</span> shall consume","39":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">dress</span> them, but shalt neither <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of the <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> nor <span class=\"wl wl-kjv\" data-code=\"H103\">gather</span> the grapes; for the <span class=\"wl wl-kjv\" data-code=\"H8438\">worms</span> shall eat","40":"Thou shalt have olive <span class=\"wl wl-kjv\" data-code=\"H2132\">trees</span> throughout all thy <span class=\"wl wl-kjv\" data-code=\"H1366\">coasts,</span> but thou shalt not <span class=\"wl wl-kjv\" data-code=\"H5480\">anoint</span> thyself with the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil;</span> for thine <span class=\"wl wl-kjv\" data-code=\"H2132\">olive</span> shall cast","41":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H3205\">beget</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> but thou shalt not enjoy them; for they shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> into captivity.","42":"All thy <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> and <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of thy <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> shall the <span class=\"wl wl-kjv\" data-code=\"H6767\">locust</span> consume.","43":"The <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> that is <span class=\"wl wl-kjv\" data-code=\"H7130\">within</span> thee shall get <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> above thee <span class=\"wl wl-kjv\" data-code=\"H4605\">very</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">high;</span> and thou shalt come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H4295\">very</span> low.","44":"He shall <span class=\"wl wl-kjv\" data-code=\"H3867\">lend</span> to thee, and thou shalt not <span class=\"wl wl-kjv\" data-code=\"H3867\">lend</span> to him: he shall be the <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and thou shalt be the tail.","45":"Moreover all these <span class=\"wl wl-kjv\" data-code=\"H7045\">curses</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon thee, and shall <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H5381\">overtake</span> thee, till thou be <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed;</span> because thou <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkenedst</span> not unto the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> his <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> and his <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> which he commanded","46":"And they shall be upon thee for a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> and for a <span class=\"wl wl-kjv\" data-code=\"H4159\">wonder,</span> and upon thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> ever.","47":"Because thou <span class=\"wl wl-kjv\" data-code=\"H5647\">servedst</span> not the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> with <span class=\"wl wl-kjv\" data-code=\"H8057\">joyfulness,</span> and with <span class=\"wl wl-kjv\" data-code=\"H2898\">gladness</span> of <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> for the abundance","48":"Therefore shalt thou <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> against thee, in <span class=\"wl wl-kjv\" data-code=\"H7458\">hunger,</span> and in <span class=\"wl wl-kjv\" data-code=\"H6772\">thirst,</span> and in <span class=\"wl wl-kjv\" data-code=\"H5903\">nakedness,</span> and in <span class=\"wl wl-kjv\" data-code=\"H2640\">want</span> of all things: and he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H6677\">neck,</span> until he have destroyed","49":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bring</span> a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> against thee from <span class=\"wl wl-kjv\" data-code=\"H7350\">far,</span> from the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> as swift as the <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle</span> <span class=\"wl wl-kjv\" data-code=\"H1675\">flieth;</span> a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> whose <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> thou shalt not understand;","50":"A <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> of <span class=\"wl wl-kjv\" data-code=\"H5794\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance,</span> which shall not <span class=\"wl wl-kjv\" data-code=\"H5375\">regard</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">person</span> of the <span class=\"wl wl-kjv\" data-code=\"H2205\">old,</span> nor shew <span class=\"wl wl-kjv\" data-code=\"H2603\">favour</span> to the young:","51":"And he shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of thy <span class=\"wl wl-kjv\" data-code=\"H929\">cattle,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of thy <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> until thou be <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed:</span> which also shall not <span class=\"wl wl-kjv\" data-code=\"H7604\">leave</span> thee either <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> or <span class=\"wl wl-kjv\" data-code=\"H3323\">oil,</span> or the <span class=\"wl wl-kjv\" data-code=\"H7698\">increase</span> of thy <span class=\"wl wl-kjv\" data-code=\"H504\">kine,</span> or <span class=\"wl wl-kjv\" data-code=\"H6251\">flocks</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> until he have destroyed","52":"And he shall <span class=\"wl wl-kjv\" data-code=\"H6887\">besiege</span> thee in all thy <span class=\"wl wl-kjv\" data-code=\"H8179\">gates,</span> until thy <span class=\"wl wl-kjv\" data-code=\"H1364\">high</span> and <span class=\"wl wl-kjv\" data-code=\"H1219\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> come <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> <span class=\"wl wl-kjv\" data-code=\"H2004\">wherein</span> thou <span class=\"wl wl-kjv\" data-code=\"H982\">trustedst,</span> throughout all thy <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H6887\">besiege</span> thee in all thy <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> throughout all thy <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath given","53":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of thine own <span class=\"wl wl-kjv\" data-code=\"H990\">body,</span> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> thee, in the <span class=\"wl wl-kjv\" data-code=\"H4692\">siege,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H4689\">straitness,</span> wherewith thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> shall distress","54":"So that the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that is <span class=\"wl wl-kjv\" data-code=\"H7390\">tender</span> among you, and <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H6028\">delicate,</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3415\">evil</span> toward his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and toward the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of his <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom,</span> and toward the <span class=\"wl wl-kjv\" data-code=\"H3499\">remnant</span> of his <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> which he shall leave:","55":"So that he will not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to <span class=\"wl wl-kjv\" data-code=\"H259\">any</span> of them of the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of his <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> whom he shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat:</span> because he hath nothing <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> him in the <span class=\"wl wl-kjv\" data-code=\"H4692\">siege,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H4689\">straitness,</span> wherewith thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> shall <span class=\"wl wl-kjv\" data-code=\"H6693\">distress</span> thee in all thy gates.","56":"The <span class=\"wl wl-kjv\" data-code=\"H7390\">tender</span> and <span class=\"wl wl-kjv\" data-code=\"H6028\">delicate</span> woman among you, which would not <span class=\"wl wl-kjv\" data-code=\"H5254\">adventure</span> to <span class=\"wl wl-kjv\" data-code=\"H3322\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H3709\">sole</span> of her <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> for <span class=\"wl wl-kjv\" data-code=\"H6026\">delicateness</span> and <span class=\"wl wl-kjv\" data-code=\"H7391\">tenderness,</span> her <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3415\">evil</span> toward the <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> of her <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom,</span> and toward her <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and toward her daughter,","57":"And toward her young <span class=\"wl wl-kjv\" data-code=\"H7988\">one</span> that cometh <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from between her <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and toward her <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> which she shall <span class=\"wl wl-kjv\" data-code=\"H3205\">bear:</span> for she shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> them for <span class=\"wl wl-kjv\" data-code=\"H2640\">want</span> of all things <span class=\"wl wl-kjv\" data-code=\"H5643\">secretly</span> in the <span class=\"wl wl-kjv\" data-code=\"H4692\">siege</span> and <span class=\"wl wl-kjv\" data-code=\"H4689\">straitness,</span> wherewith thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> shall <span class=\"wl wl-kjv\" data-code=\"H6693\">distress</span> thee in thy gates.","58":"If thou wilt not <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of this <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> that are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in this <span class=\"wl wl-kjv\" data-code=\"H5612\">book,</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> this <span class=\"wl wl-kjv\" data-code=\"H3513\">glorious</span> and <span class=\"wl wl-kjv\" data-code=\"H3372\">fearful</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> THE <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> THY GOD;","59":"Then the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6381\">make</span> thy <span class=\"wl wl-kjv\" data-code=\"H4347\">plagues</span> <span class=\"wl wl-kjv\" data-code=\"H6381\">wonderful,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4347\">plagues</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> even <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">plagues,</span> and of long <span class=\"wl wl-kjv\" data-code=\"H539\">continuance,</span> and <span class=\"wl wl-kjv\" data-code=\"H7451\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H2483\">sicknesses,</span> and of long continuance.","60":"Moreover he will <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> upon thee all the <span class=\"wl wl-kjv\" data-code=\"H4064\">diseases</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> which thou wast <span class=\"wl wl-kjv\" data-code=\"H3025\">afraid</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">of;</span> and they shall cleave","61":"Also every <span class=\"wl wl-kjv\" data-code=\"H2483\">sickness,</span> and every <span class=\"wl wl-kjv\" data-code=\"H4347\">plague,</span> which is not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of this <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> them will the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">bring</span> upon thee, until thou be destroyed.","62":"And ye shall be <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> <span class=\"wl wl-kjv\" data-code=\"H4592\">few</span> in <span class=\"wl wl-kjv\" data-code=\"H4962\">number,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">whereas</span> ye were as the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> for <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude;</span> because thou wouldest not <span class=\"wl wl-kjv\" data-code=\"H8085\">obey</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy God.","63":"And it shall come to pass, that as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7797\">rejoiced</span> over you to do you <span class=\"wl wl-kjv\" data-code=\"H3190\">good,</span> and to <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> you; so the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H7797\">rejoice</span> over you to <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> you, and to bring you to <span class=\"wl wl-kjv\" data-code=\"H8045\">nought;</span> and ye shall be <span class=\"wl wl-kjv\" data-code=\"H5255\">plucked</span> from off the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> whither thou <span class=\"wl wl-kjv\" data-code=\"H935\">goest</span> to possess","64":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H6327\">scatter</span> thee among all <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> from the one <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H7097\">other;</span> and there thou shalt <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> which neither thou nor thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> have <span class=\"wl wl-kjv\" data-code=\"H3045\">known,</span> even <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> and stone.","6  gebieden"},{"catchword":"gebieden,","tekst":"Zie Lev 25:21."},{"catchword":"en in alles,","tekst":"Hebreeuws, en in allen aanslag, of, alle uitsteking uwer hand."}],"9":[{"catchword":"heilig volk","tekst":"Zie boven, Deu 7:6, en vergelijk onder, Deu 29:13."},{"catchword":"bevestigen,","tekst":"Of, stellen, oprichten."}],"10":[{"catchword":"dat de Naam des HEEREN","tekst":"Of, dat de naam des HEEREN over u uitgeroepen is, of, dat gij naar den naam des Heeren genoemd zijt. Vergelijk Gen 48:6, Gen 48:16."}],"12":[{"catchword":"hemel,","tekst":"Dat is, de lucht [als zijne schatkamer] alzo regeren, dat u de tijdige regen vandaar afkome."}],"13":[{"catchword":"tot een hoofd maken,","tekst":"Dat gij in aanzien, eer en macht den voortocht zult hebben, gelijk de volgende woorden mede verklaren. Een manier van spreken, die gekomen is van de plaats en achting dezer leden in de beesten. Vergelijk Isa 9:13-14, en Isa 19:15."},{"catchword":"boven zijn,","tekst":"Dat is, overwinnen, en niet onderliggen."}],"20":[{"catchword":"de verstoring en het verderf,","tekst":"De zin is, dat al uw aanslagen verstoord en bedorven, of verhinderd en teruggezet zullen worden."}],"21":[{"catchword":"Hij u verdoe","tekst":"Te weten, de HEERE. Vergelijk onder, vs.48."}],"22":[{"catchword":"vurigheid,","tekst":"Of, ontsteking; dat is, met vurige of hete gezwellen."},{"catchword":"hitte,","tekst":"Ontsteking der lucht. Sommigen verstaan het van inwendigen brand des lichaams, waarop gedurige dorst volgt."},{"catchword":"droogte,","tekst":"Dat het in langen tijd niet regent. Zie 1Ki 17:1, 1Ki 17:7; Hag 1:10-11. Anders, zwaard"},{"catchword":"brandkoren,","tekst":"Een plaag in het gewas, wanneer het door langdurige droogte en hitte, of door een dorren oostenwind verzengt en verdort. Sommigen verstaan door deze twee woorden enige ziekten, als brandzucht en geelzucht."},{"catchword":"honigdauw,","tekst":"Of, meeldauw; een andere plaag in het koren, wanneer het door te veel vocht vervuilt en verrot. Zie van deze plaag 1Ki 8:37; 2Ch 6:28; Amo 4:9; Hag 2:18."}],"23":[{"catchword":"hemel,","tekst":"Dat is, de lucht."},{"catchword":"koper zijn,","tekst":"Zie Lev 26:19."}],"24":[{"catchword":"pulver en stof","tekst":"Anders, den regen des lands tot pulver en stof maken; dat is, de regen zal tot bevochtiging des aardrijks onnut en ondienstig zijn."},{"catchword":"van den hemel zal het op u nederdalen","tekst":"Het stof, door den wind opgedreven zijnde, zal van boven weder op u nedervallen, alsof het op u regende, en dat zal uw regen zijn."}],"25":[{"catchword":"geslagen geven","tekst":"Zie boven, vs.7."},{"catchword":"hem uittrekken,","tekst":"Den vijand."},{"catchword":"beroerd worden","tekst":"Dat is, gij zult in gestadige onrust zijn vanwege buitenlands geweld, of, gij zult onder de omliggende koninkrijken heen en weder gedreven worden. Zie 2Ch 29:8; Jer 15:4, en Jer 24:9, en Jer 29:18, en Jer 34:17."}],"27":[{"catchword":"zweren van Egypte,","tekst":"Die God mensen en beesten in gans Egypteland toeschikte; Exo 9:9."},{"catchword":"krauwsel,","tekst":"Of, jeuksel."}],"28":[{"catchword":"verbaasdheid des harten;","tekst":"Of, bottigheid, plompigheid, bedwelmdheid. Vergelijk Job 5:13-14."}],"30":[{"catchword":"gemeen maken","tekst":"Dat is, geen vruchten daarvan voor u mogen genieten. Zie boven, Deu 20:6, en vergelijk Deu 22:9."}],"32":[{"catchword":"naar hen bezwijken","tekst":"Versta, van omzien en verlangen naar de zonen en dochters zullen uw ogen versmachten."},{"catchword":"het zal in het vermogen","tekst":"Gij zult de macht niet hebben om die te verlossen, of weder te krijgen. Anders, er zal geen sterkte in uw hand zijn."}],"33":[{"catchword":"al uw arbeid","tekst":"Zie Job 20:18-19."}],"34":[{"catchword":"vanwege het gezicht uwer ogen,","tekst":"Dat is, vanwege de dingen, die gij met uw ogen zult moeten aanzien; alzo onder, vs.67."}],"37":[{"catchword":"schrik,","tekst":"Dat de volken zich over uw plagen en ellenden ontzetten zullen. Anders, tot verwoesting"},{"catchword":"spotrede,","tekst":"Of, fabel, schim."}],"42":[{"catchword":"het boos gewormte","tekst":"Anders, de vlam, slag, drop; een plaag in het geboomte en de landvruchten, veroorzaakt door dampen, die van boven [inzonderheid in de hondsdagen] verdroogd en verhit worden, en de bomen en vruchten verzengen, verdorren en verderven."}],"43":[{"catchword":"hoog, hoog boven u opklimmen;","tekst":"Dat is, zeer hoog, en in hoogheid boven u toenemende en voortgaande, gelijk gij in zonden voortgaat."}],"44":[{"catchword":"tot een hoofd zijn,","tekst":"Zie boven, vs.13."}],"46":[{"catchword":"zij zullen onder u","tekst":"Te weten, deze vloeken."}],"47":[{"catchword":"Omdat gij den HEERE,","tekst":"Of, voor, inplaats dat gij den HEERE niet hebt willen dienen in voorspoed, zo zult gij vreemde volken moeten dienen in grote ellende; gelijk in vs.48 gedreigd wordt."},{"catchword":"vrolijkheid en goedheid des harten,","tekst":"Met lust en gewilligheid."},{"catchword":"veelheid van alles;","tekst":"Of, overvloed; waardoor gij weelderig en dartel zult worden. Zie onder, Deu 31:20, en Deu 32:15. De vervulling, zie Neh 9:25-26, en elders."}],"48":[{"catchword":"ijzeren juk op uw hals leggen,","tekst":"Een manier van spreken genomen van het juk der beesten, dat van hout placht te zijn; daartegen dreigt God dat Hij zijn volk een ijzeren juk zal opleggen, dat is, een harde, zware, zeer lastige en langdurige dienstbaarheid; alzo Jer 28:13-14."}],"49":[{"catchword":"gelijk als een arend vliegt;","tekst":"Zo haastig en onvoorziens zal het u overkomen, als een arend pleegt te vliegen."},{"catchword":"verstaan;","tekst":"Hebreeuws, horen. Zie Gen 11:7."}],"50":[{"catchword":"stijf van aangezicht,","tekst":"Dat is, Hebreeuws eigenlijk sterk, onbeschaamd, hard, onbewegelijk, dat niemand zal ontzien of verschonen, over niemand bewogen worden, hij zij oud of jong; gelijk in het volgende verklaard wordt. Alzo Dan 8:23."},{"catchword":"aangezicht des ouden","tekst":"Vergelijk boven, Deu 1:17."}],"51":[{"catchword":"het zal de vrucht uwer beesten,","tekst":"Te weten, het volk, waarvan in het voorgaande gesproken is."},{"catchword":"hetwelk u geen koren,","tekst":"Volk."},{"catchword":"Hij u verdoe","tekst":"Namelijk de Heere."}],"52":[{"catchword":"beangstigen","tekst":"Of, belegeren"},{"catchword":"poorten,","tekst":"Dat is, steden, en zo in het volgende."}],"54":[{"catchword":"wellustig geweest is,","tekst":"Delicaat, lekker, dartel."},{"catchword":"zal kwaad zijn","tekst":"Dat is, zijn oog zal onvriendelijk, nijdig, afgunstig zijn; gelijk ook onder, vs.56. Zie boven, Deu 15:9."},{"catchword":"huisvrouw zijns schoots,","tekst":"Zie boven, Deu 13:6."}],"57":[{"catchword":"om haar nageboorte,","tekst":"Dat is, om haar nieuwgeboren kindje, mitsgaders de gevolgde nageboorte, die deze delicate vrouw haar man, enz. zal misgunnen en zelve in het verborgen, door een gruwelijk oordeel Gods, eten. Zie 2Ki 6:28."},{"catchword":"zonen,","tekst":"Die ouder en groter waren."}],"58":[{"catchword":"Naam, den HEERE, uw God;","tekst":"Vergelijk Gen 2:4; Lev 24:11; 2Sa 6:2, den naam des HEEREN; dat is, de HEERE zelf, wien alleen deze naam JHWH toekomt, te weten, de Vader, de Zoon en de Heilige Geest, als zijnde de enige ware God, in wezen, eigenschappen, heerlijkheid, werkingen, enz."}],"59":[{"catchword":"wonderlijk maken,","tekst":"Zo grote, vreemde en verschrikkelijke plagen zal Hij u toezenden, dat ieder zich daarover zal verwonderen."},{"catchword":"gewisse plagen,","tekst":"Hebreeuws, getrouwe; dat is, die zekerlijk treffen en lang beklijven zullen."}],"60":[{"catchword":"op u doen keren","tekst":"De vreemde, kwade ziekten, waarmede God de Egyptenaars geplaagd heeft, zal Hij alsdan op u leggen. Zie Exo 8:9. Vergelijk boven, Deu 7:15."}],"61":[{"catchword":"alle krankte,","tekst":"Dat is, allerlei."}],"62":[{"catchword":"weinige mensen","tekst":"Hebreeuws, in, of, met mensen, of, lieden der weinigheid. Vergelijk Gen 34:30, en Num 9:20. Zie ook Isa 1:9."}],"64":[{"catchword":"van het ene einde der aarde","tekst":"Hebreeuws, van het einde der wereld tot het einde, enz."}],"65":[{"catchword":"mattigheid der ziel","tekst":"Of, flauwigheid, treurigheid."}],"66":[{"catchword":"tegenover u hangen;","tekst":"Deze manier van spreken wordt verklaard door de volgende woorden: Gij zult uw leven niet zeker zijn. Gelijk wanneer iets aan een dunnen draad voor onze ogen alzo hangt, dat men altijd vreest, het zal nu of dan moeten vallen."},{"catchword":"uw leven niet zeker zijn","tekst":"Hebreeuws, uw leven niet geloven, of, vertrouwen."}],"67":[{"catchword":"Och, dat het avond ware;","tekst":"Hebreeuws, wie zal den avond geven? Idem, wie zal den morgen geven? Zie en vergelijk deze manier van spreken met boven, Deu 5:29."},{"catchword":"het gezicht uwer ogen,","tekst":"Zie boven, vs.34."}],"68":[{"catchword":"door een weg,","tekst":"Versta, die naar Egypteland leidt."},{"catchword":"dien niet meer zien;","tekst":"Of, dat [land], te weten van Egypte. Zie boven, Deu 17:16, alsof de HEERE zeide: Ik zal u weder derwaarts voeren, vanwaar Ik u weggevoerd had, met belofte van eeuwige vrijheid op conditie van gehoorzaamheid. Zie Jer 44, en Hos 8:13, en Hos 8:6."},{"catchword":"maar er zal geen koper zijn","tekst":"Dat is, gij zult zóó veracht en gehaat zijn, dat u niemand zal begeren te kopen, om voor slaaf te gebruiken."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it shall come to pass an dif thou shalt obey diligently [Heb. Obey shalt obey] the voice of the Lord thy God observing to do all his commandments which I command thee this day then shall the Lord thy God set thee on high above all nations of the earth [see above chapter 26 on verse 19.]"}],"2":[{"catchword":null,"tekst":"And all these blessing shall come upon thee and hit thee when thou shalt be obedient unto the voice of the Lord thy God."}],"3":[{"catchword":null,"tekst":"Blessed shalt thou be in the city and blessed shalt thou be in the field."}],"4":[{"catchword":null,"tekst":"B
