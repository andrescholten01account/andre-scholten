 de HEERE zal met hen doen, zoals Hij met Sihon en Og, koningen van de Amorieten, en met hun land gedaan heeft, die Hij weggevaagd heeft.","5":"Wanneer de HEERE hen nu aan u zal hebben overgegeven, dan zult u met hen doen naar elk gebod, dat ik u geboden heb.","6":"Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten.","7":"En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven.","8":"De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.","9":"En Mozes schreef deze wet, en gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël.","10":"En Mozes gebood hun: Aan het einde van elke zeven jaar, op de vastgestelde tijd van het jaar van de vrijlating, op het feest van de loofhutten,","11":"wanneer heel Israël zal komen om te verschijnen voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen, zult u deze wet voorlezen voor heel Israël, ten aanhoren van hen;","12":"verzamel het volk, de mannen, en de vrouwen, en de kinderen, en uw vreemdelingen die in uw poorten zijn; opdat zij horen, en opdat zij leren, en de HEERE, uw God, vrezen, en nauwlettend doen alle woorden van deze wet.","13":"En opdat hun kinderen, die het niet geweten hebben, horen en leren, om de HEERE, uw God, te vrezen, alle dagen dat u leeft op het land waarheen u de Jordaan overtrekt om het te erven.","14":"En de HEERE zei tegen Mozes: Zie, uw dagen zijn genaderd om te sterven; roep Jozua, en stel u op in de tent van de samenkomst, zodat Ik hem een opdracht geef. Zo ging Mozes, en Jozua, en zij stelden zich op in de tent van de samenkomst.","15":"Toen verscheen de HEERE in de tent, in de wolkkolom; en de wolkkolom stond boven de deur van de tent.","16":"En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb.","17":"Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is?","18":"Ik dan zal Mijn aangezicht op die dag geheel en al verbergen, om al het kwaad dat het gedaan heeft; want het heeft zich gewend tot andere goden.","19":"En nu, schrijf u dit lied, en leer het de kinderen van Israël; leg het in hun mond; opdat dit lied Mij tot getuige zij tegen de kinderen van Israël.","20":"Want Ik zal dit *volk* brengen in het land, dat Ik hun vaderen gezworen heb, vloeiend van melk en honing, en het zal eten, en verzadigd, en vet worden; dan zal het zich wenden tot andere goden, en hen dienen, en zij zullen Mij tergen, en Mijn verbond vernietigen.","21":"En het zal gebeuren, wanneer veel kwaad en benauwdheden hen zullen treffen, dan zal dit lied voor hun aangezicht antwoorden tot getuige; want het zal uit de mond van hun nageslacht niet vergeten worden; omdat Ik hun gedachten ken, die het nu al maakt, voordat Ik het breng in het land dat Ik gezworen heb.","22":"Zo schreef Mozes dit lied op die dag, en hij leerde het de kinderen van Israël.","23":"En Hij gebood Jozua, de zoon van Nun, en zei: Wees sterk en heb goede moed, want u zult de kinderen van Israël brengen in het land, dat Ik hun gezworen heb; en Ik zal met u zijn.","24":"En het gebeurde, toen Mozes klaar was met het schrijven van de woorden van deze wet in een boek, totdat ze voltooid waren,","25":"dat Mozes de Levieten gebood, die de ark van het verbond van de HEERE droegen:","26":"Neem dit wetboek, en leg het aan de zijde van de ark van het verbond van de HEERE, uw God, opdat het daar tot getuige zij tegen u.","27":"Want ik ken uw weerspannigheid, en uw harde nek. Zie, terwijl ik vandaag nog met u leef, bent u weerspannig geweest tegen de HEERE; hoeveel te meer na mijn dood!","28":"Verzamel bij mij alle oudsten van uw stammen, en uw opzichters; opdat ik ten aanhoren van hen deze woorden spreek, en tegen hen de hemel en de aarde tot getuigen neem.","29":"Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.","30":"Toen sprak Mozes, ten aanhoren van heel de gemeente van Israël, de woorden van dit lied, totdat ze voltooid waren."},"SV":{"1":"Daarna ging Mozes heen, en sprak deze woorden tot gans Israël,","2":"En zeide tot hen: Ik ben heden honderd en twintig jaren oud; ik zal niet meer kunnen uitgaan en ingaan; daartoe heeft de HEERE tot mij gezegd: Gij zult over deze Jordaan niet gaan.","3":"De HEERE, uw God, Die zal voor uw aangezicht overgaan; Die zal deze volken van voor uw aangezicht verdelgen, dat gij hen erfelijk bezit. Jozua zal voor uw aangezicht overgaan, gelijk als de HEERE gesproken heeft.","4":"En de HEERE zal hun doen, gelijk als Hij aan Sihon en Og, koningen der Amorieten, en aan hun land, gedaan heeft, die Hij verdelgd heeft.","5":"Wanneer hen nu de HEERE voor uw aangezicht zal gegeven hebben, dan zult gij hun doen naar alle gebod, dat ik ulieden geboden heb.","6":"Weest sterk en hebt goeden moed, en vreest niet, en verschrikt niet voor hun aangezicht; want het is de HEERE, uw God, Die met u gaat; Hij zal u niet begeven, noch u verlaten.","7":"En Mozes riep Jozua, en zeide tot hem voor de ogen van gans Israël: Wees sterk en heb goeden moed, want gij zult met dit volk ingaan in het land dat de HEERE hun vaderen gezworen heeft, hun te zullen geven; en gij zult het hun doen erven.","8":"De HEERE nu is Degene, Die voor uw aangezicht gaat; Die zal met u zijn; Hij zal u niet begeven, noch u verlaten; vrees niet, en ontzet u niet.","9":"En Mozes schreef deze wet, en gaf ze aan de priesteren, de zonen van Levi, die de ark des verbonds des HEEREN droegen, en aan alle oudsten van Israël.","10":"En Mozes gebood hun, zeggende: Ten einde van zeven jaren, op den gezetten tijd van het jaar der vrijlating, op het feest der loofhutten,","11":"Als gans Israël zal komen, om te verschijnen voor het aangezicht des HEEREN, uws Gods, in de plaats, die Hij zal verkoren hebben, zult gij deze wet voor gans Israël uitroepen, voor hun oren;","12":"Vergadert het volk, de mannen, en de vrouwen, en de kinderen, en uw vreemdelingen, die in uw poorten zijn; opdat zij horen, en opdat zij leren, en vrezen den HEERE, uw God, en waarnemen te doen alle woorden dezer wet.","13":"En dat hun kinderen, die het niet geweten hebben, horen en leren, om te vrezen den HEERE, uw God, al de dagen, die gij leeft op het land, naar hetwelk gij over de Jordaan zijt heengaande, om dat te erven.","14":"En de HEERE zeide tot Mozes: Zie, uw dagen zijn genaderd, om te sterven; roep Jozua, en stelt ulieden in de tent der samenkomst, dat Ik hem bevel geve. Zo ging Mozes, en Jozua, en zij stelden zich in de tent der samenkomst.","15":"Toen verscheen de HEERE in de tent, in de wolkkolom; en de wolkkolom stond boven de deur der tent.","16":"En de HEERE zeide tot Mozes: Zie, gij zult slapen met uw vaderen; en dit volk zal opstaan, en nahoereren de goden der vreemden van dat land, waar het naar toe gaat, in het midden van hetzelve; en het zal Mij verlaten en vernietigen Mijn verbond, dat Ik met hetzelve gemaakt heb.","17":"Zo zal Mijn toorn te dien dage tegen hetzelve ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, dat zij ter spijze zijn, en vele kwaden en benauwdheden zullen het treffen; dat het te dien dage zal zeggen: Hebben mij deze kwaden niet getroffen, omdat mijn God in het midden van mij niet is?","18":"Ik dan zal Mijn aangezicht te dien dage ganselijk verbergen, om al het kwaad, dat het gedaan heeft; want het heeft zich gewend tot andere goden.","19":"En nu, schrijft ulieden dit lied, en leert het den kinderen Israëls; legt het in hun mond; opdat dit lied Mij ten getuige zij tegen de kinderen Israëls.","20":"Want Ik zal dit *volk* inbrengen in het land, dat Ik zijn vaderen gezworen heb, vloeiende van melk en honig, en het zal eten, en verzadigd, en vet worden; dan zal het zich wenden tot andere goden, en hen dienen, en zij zullen Mij tergen, en Mijn verbond vernietigen.","21":"En het zal geschieden, wanneer vele kwaden en benauwdheden hetzelve zullen treffen, dan zal dit lied voor zijn aangezicht antwoorden tot getuige; want het zal uit den mond zijns zaads niet vergeten worden; dewijl Ik weet zijn gedichtsel dat het heden maakt, aleer Ik het inbreng in het land, dat Ik gezworen heb.","22":"Zo schreef Mozes dit lied te dien dage, en hij leerde het den kinderen Israëls.","23":"En Hij gebood Jozua, den zoon van Nun, en zeide: Zijt sterk en heb goeden moed, want gij zult de kinderen Israëls inbrengen in het land, dat Ik hun gezworen heb; en Ik zal met u zijn.","24":"En het geschiedde, als Mozes voleind had de woorden dezer wet te schrijven in een boek, totdat zij voltrokken waren;","25":"Zo gebood Mozes den Levieten, die de ark des verbonds des HEEREN droegen, zeggende:","26":"Neemt dit wetboek, en legt het aan de zijde van de ark des verbonds des HEEREN, uws Gods, dat het aldaar zij ten getuige tegen u.","27":"Want ik ken uw wederspannigheid, en uw harden nek. Ziet, terwijl ik nog heden met ulieden leve, zijt gij wederspannig geweest tegen den HEERE; hoe veel te meer na mijn dood!","28":"Vergadert tot mij al de oudsten uwer stammen, en uw ambtlieden; dat ik voor hun oren deze woorden spreke, en tegen hen den hemel en de aarde tot getuigen neme.","29":"Want ik weet, dat gij het na mijn dood zekerlijk zult verderven, en afwijken van den weg, dien ik u geboden heb; dan zal u dit kwaad in het laatste der dagen ontmoeten, wanneer gij zult gedaan hebben, dat kwaad is in de ogen des HEEREN, om Hem door het werk uwer handen tot toorn te verwekken.","30":"Toen sprak Mozes, voor de oren der ganse gemeente van Israël, de woorden dezes lieds, totdat zij voltrokken waren."},"KJV":{"1":"And Moses went and spake these words unto all Israel.","2":"And he said unto them, I *am* an hundred and twenty years old this day; I can no more go out and come in: also the LORD hath said unto me, Thou shalt not go over this Jordan.","3":"The LORD thy God, he will go over before thee, *and* he will destroy these nations from before thee, and thou shalt possess them: *and* Joshua, he shall go over before thee, as the LORD hath said.","4":"And the LORD shall do unto them as he did to Sihon and to Og, kings of the Amorites, and unto the land of them, whom he destroyed.","5":"And the LORD shall give them up before your face, that ye may do unto them according unto all the commandments which I have commanded","6":"Be strong and of a good courage, fear not, nor be afraid of them: for the LORD thy God, he *it is* that doth go with thee; he will not fail thee, nor forsake","7":"And Moses called unto Joshua, and said unto him in the sight of all Israel, Be strong and of a good courage: for thou must go with this people unto the land which the LORD hath sworn unto their fathers to give them; and thou shalt cause them to inherit","8":"And the LORD, he *it is* that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee: fear not, neither be dismayed.","9":"And Moses wrote this law, and delivered it unto the priests the sons of Levi, which bare the ark of the covenant of the LORD, and unto all the elders of Israel.","10":"And Moses commanded them, saying, At the end of *every* seven years, in the solemnity of the year of release, in the feast of tabernacles,","11":"When all Israel is come to appear before the LORD thy God in the place which he shall choose, thou shalt read this law before all Israel in their hearing.","12":"Gather the people together, men, and women, and children, and thy stranger that *is* within thy gates, that they may hear, and that they may learn, and fear the LORD your God, and observe to do all the words of this law:","13":"And *that* their children, which have not known *any thing*, may hear, and learn to fear the LORD your God, as long as ye live in the land whither ye go over Jordan to possess","14":"And the LORD said unto Moses, Behold, thy days approach that thou must die: call Joshua, and present yourselves in the tabernacle of the congregation, that I may give him a charge. And Moses and Joshua went, and presented themselves in the tabernacle of the congregation.","15":"And the LORD appeared in the tabernacle in a pillar of a cloud: and the pillar of the cloud stood over the door of the tabernacle.","16":"And the LORD said unto Moses, Behold, thou shalt sleep with thy fathers; and this people will rise up, and go a whoring after the gods of the strangers of the land, whither they go *to be* among them, and will forsake me, and break my covenant which I have made","17":"Then my anger shall be kindled against them in that day, and I will forsake them, and I will hide my face from them, and they shall be devoured, and many evils and troubles shall befall them; so that they will say in that day, Are not these evils come upon us, because our God *is* not among","18":"And I will surely hide my face in that day for all the evils which they shall have wrought, in that they are turned unto other gods.","19":"Now therefore write ye this song for you, and teach it the children of Israel: put it in their mouths, that this song may be a witness for me against the children of Israel.","20":"For when I shall have brought them into the land which I sware unto their fathers, that floweth with milk and honey; and they shall have eaten and filled themselves, and waxen fat; then will they turn unto other gods, and serve them, and provoke me, and break my covenant.","21":"And it shall come to pass, when many evils and troubles are befallen them, that this song shall testify against them as a witness; for it shall not be forgotten out of the mouths of their seed: for I know their imagination which they go about, even now, before I have brought them into the land which I sware.","22":"Moses therefore wrote this song the same day, and taught it the children of Israel.","23":"And he gave Joshua the son of Nun a charge, and said, Be strong and of a good courage: for thou shalt bring the children of Israel into the land which I sware","24":"And it came to pass, when Moses had made an end of writing the words of this law in a book, until they were finished,","25":"That Moses commanded the Levites, which bare the ark of the covenant of the LORD, saying,","26":"Take this book of the law, and put it in the side of the ark of the covenant of the LORD your God, that it may be there for a witness","27":"For I know thy rebellion, and thy stiff neck: behold, while I am yet alive with you this day, ye have been rebellious against the LORD; and how much more after my death?","28":"Gather unto me all the elders of your tribes, and your officers, that I may speak these words in their ears, and call heaven and earth to record","29":"For I know that after my death ye will utterly corrupt *yourselves*, and turn aside from the way which I have commanded you; and evil will befall you in the latter days; because ye will do evil in the sight of the LORD, to provoke him to anger through the work of your hands.","30":"And Moses spake in the ears of all the congregation of Israel the words of this song, until they were ended."}},"tsk":{"2":[{"kopje":"Ik ben vandaag honderdtwintig kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which he shall <span class=\"wl wl-kjv\" data-code=\"H977\">choose,</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> this <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> before all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in their hearing.","12":"<span class=\"wl wl-kjv\" data-code=\"H6950\">Gather</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H6950\">together,</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> and <span class=\"wl wl-kjv\" data-code=\"H2945\">children,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> that is within thy <span class=\"wl wl-kjv\" data-code=\"H8179\">gates,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> and that they may <span class=\"wl wl-kjv\" data-code=\"H3925\">learn,</span> and <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of this law:","13":"And that their <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> which have not <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> any thing, may <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> and <span class=\"wl wl-kjv\" data-code=\"H3925\">learn</span> to <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> as long <span class=\"wl wl-kjv\" data-code=\"H3117\">as</span> ye <span class=\"wl wl-kjv\" data-code=\"H2416\">live</span> in the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> whither ye go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> to possess","14":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> Behold, thy <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H7126\">approach</span> that thou must <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> and <span class=\"wl wl-kjv\" data-code=\"H3320\">present</span> yourselves in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> that I may give him a <span class=\"wl wl-kjv\" data-code=\"H6680\">charge.</span> And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H3320\">presented</span> themselves in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation.","15":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> in a <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar</span> of a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar</span> of the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> over the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the tabernacle.","16":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> Behold, thou shalt <span class=\"wl wl-kjv\" data-code=\"H7901\">sleep</span> with thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers;</span> and this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> will rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and go a <span class=\"wl wl-kjv\" data-code=\"H2181\">whoring</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H5236\">strangers</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> whither they <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to be <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> them, and will <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> me, and <span class=\"wl wl-kjv\" data-code=\"H6565\">break</span> my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> which I have made","17":"Then my <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against them in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> them, and I will <span class=\"wl wl-kjv\" data-code=\"H5641\">hide</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> from them, and they shall be <span class=\"wl wl-kjv\" data-code=\"H398\">devoured,</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evils</span> and <span class=\"wl wl-kjv\" data-code=\"H6869\">troubles</span> shall <span class=\"wl wl-kjv\" data-code=\"H4672\">befall</span> them; so that they will <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> Are not these <span class=\"wl wl-kjv\" data-code=\"H7451\">evils</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">come</span> upon us, because our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is not among","18":"And I will <span class=\"wl wl-kjv\" data-code=\"H5641\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H5641\">hide</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> for all the <span class=\"wl wl-kjv\" data-code=\"H7451\">evils</span> which they shall have <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought,</span> in <span class=\"wl wl-kjv\" data-code=\"H3588\">that</span> they are <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> unto <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> gods.","19":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H3789\">write</span> ye this <span class=\"wl wl-kjv\" data-code=\"H7892\">song</span> for you, and <span class=\"wl wl-kjv\" data-code=\"H3925\">teach</span> it the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> it in their <span class=\"wl wl-kjv\" data-code=\"H6310\">mouths,</span> that this <span class=\"wl wl-kjv\" data-code=\"H7892\">song</span> may be a <span class=\"wl wl-kjv\" data-code=\"H5707\">witness</span> for me against the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","20":"For when I shall have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them into the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> which I <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> that <span class=\"wl wl-kjv\" data-code=\"H2100\">floweth</span> with <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey;</span> and they shall have <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> and <span class=\"wl wl-kjv\" data-code=\"H7646\">filled</span> themselves, and waxen <span class=\"wl wl-kjv\" data-code=\"H1878\">fat;</span> then will they <span class=\"wl wl-kjv\" data-code=\"H6437\">turn</span> unto <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5006\">provoke</span> me, and <span class=\"wl wl-kjv\" data-code=\"H6565\">break</span> my covenant.","21":"And it shall come to pass, when <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evils</span> and <span class=\"wl wl-kjv\" data-code=\"H6869\">troubles</span> are <span class=\"wl wl-kjv\" data-code=\"H4672\">befallen</span> them, that this <span class=\"wl wl-kjv\" data-code=\"H7892\">song</span> shall <span class=\"wl wl-kjv\" data-code=\"H6030\">testify</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">against</span> them as a <span class=\"wl wl-kjv\" data-code=\"H5707\">witness;</span> for it shall not be <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouths</span> of their <span class=\"wl wl-kjv\" data-code=\"H2233\">seed:</span> for I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> their <span class=\"wl wl-kjv\" data-code=\"H3336\">imagination</span> which they go <span class=\"wl wl-kjv\" data-code=\"H6213\">about,</span> even <span class=\"wl wl-kjv\" data-code=\"H3117\">now,</span> before I have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I sware.","22":"<span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> therefore <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> this <span class=\"wl wl-kjv\" data-code=\"H7892\">song</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H3925\">taught</span> it the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","23":"And he gave <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5126\">Nun</span> a <span class=\"wl wl-kjv\" data-code=\"H6680\">charge,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Be <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> and of a good <span class=\"wl wl-kjv\" data-code=\"H553\">courage:</span> for thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I sware","24":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H3789\">writing</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of this <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> in a <span class=\"wl wl-kjv\" data-code=\"H5612\">book,</span> until they were finished,","25":"That <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> which <span class=\"wl wl-kjv\" data-code     `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
