ef schrijft, en die in haar hand geeft, en haar uit zijn huis laat gaan; of als deze laatste man, die haar voor zich tot vrouw genomen heeft, sterft;","4":"dan zal haar eerste man, die haar heeft laten gaan, haar niet mogen terugnemen, zodat zij hem tot vrouw is, nadat zij is verontreinigd; want dat is een gruwel voor het aangezicht van de HEERE; zo zult u het land niet doen zondigen, dat de HEERE, uw God, u tot erfdeel geeft.","5":"Wanneer een man een nieuwe vrouw genomen heeft, zal die niet uittrekken in het leger, en men zal hem geen last opleggen; één jaar lang zal hij vrij zijn in zijn huis, en zijn vrouw, die hij genomen heeft, verheugen.","6":"Men zal geen van beide molenstenen, zelfs niet de bovenste molensteen, te pand nemen; want daarmee neemt men de ziel te pand.","7":"Wanneer iemand gevonden wordt die een mens steelt uit zijn broeders, uit de kinderen van Israël, en met hem handelt als koopwaar, en hem verkoopt; dan zal die dief sterven, en u zult het kwaad uit uw midden wegdoen.","8":"Wacht u voor de plaag van de melaatsheid, dat u nauwkeurig in acht neemt en doet naar alles wat de Levitische priesters u zullen leren; zoals ik hun geboden heb, zult u erop letten het te doen.","9":"Denk aan wat de HEERE, uw God, gedaan heeft aan Mirjam, op de weg, toen u uit Egypte was uitgetrokken.","10":"Wanneer u aan uw naaste iets te leen geeft, zult u zijn huis niet binnengaan om zijn pand te pand te nemen;","11":"buiten zult u staan, en de man aan wie u geleend hebt, zal het pand naar buiten tot u brengen.","12":"Maar als hij een arme man is, zult u met zijn pand niet neerliggen.","13":"U zult hem dat pand zeker teruggeven, als de zon ondergaat, zodat hij in zijn kleed neerligt, en u zegent; en het zal u gerechtigheid zijn voor het aangezicht van de HEERE, uw God.","14":"U zult de arme en behoeftige dagloner niet verdrukken, die uit uw broeders is, of uit uw vreemdelingen die in uw land en in uw poorten zijn.","15":"Op zijn dag zult u hem zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; zodat hij tegen u niet roept tot de HEERE, en er zonde in u is.","16":"De vaders zullen niet gedood worden voor de kinderen, en de kinderen zullen niet gedood worden voor de vaders; ieder zal om zijn eigen zonde gedood worden.","17":"U zult het recht van de vreemdeling en van de wees niet buigen, en u zult het kleed van de weduwe niet te pand nemen.","18":"Maar u zult gedenken dat u een knecht in Egypte geweest bent, en de HEERE, uw God, heeft u van daar verlost; daarom gebied ik u deze zaak te doen.","19":"Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen.","20":"Wanneer u uw olijfboom geschud hebt, zult u de takken daarna niet nauwkeurig doorzoeken; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn.","21":"Wanneer u uw wijngaard hebt afgeplukt, zult u de druiven daarna niet nalezen; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn.","22":"En u zult gedenken dat u een knecht in het land Egypte geweest bent; daarom gebied ik u deze zaak te doen."},"SV":{"1":"Wanneer een man een vrouw zal genomen en die getrouwd hebben, zo zal het geschieden, indien zij geen genade zal vinden in zijn ogen, omdat hij iets schandelijks aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en in haar hand geven, en ze laten gaan uit zijn huis.","2":"Zo zij dan, uit zijn huis uitgegaan zijnde, zal henengaan en een anderen man *ter* *vrouwe* worden,","3":"En deze laatste man haar gehaat, en haar een scheidbrief geschreven, en in haar hand gegeven, en haar uit zijn huis zal hebben laten gaan; of als deze laatste man, die ze voor zich tot een vrouw genomen heeft, zal gestorven zijn;","4":"Zo zal haar eerste man, die haar heeft laten gaan, haar niet mogen wedernemen, dat zij hem ter vrouwe zij, nadat zij is verontreinigd geworden; want dat is een gruwel voor het aangezicht des HEEREN; alzo zult gij het land niet doen zondigen, dat u de HEERE, uw God, ten erve geeft.","5":"Wanneer een man een nieuwe vrouw zal genomen hebben, die zal in het heir niet uittrekken, en men zal hem geen last opleggen; een jaar lang zal hij vrij zijn in zijn huis, en zijn vrouw, die hij genomen heeft, verheugen.","6":"Men zal beide molenstenen, immers den bovensten molensteen, niet te pand nemen; want hij neemt de ziel te pand.","7":"Wanneer iemand gevonden zal worden, die een ziel steelt uit zijn broederen, uit de kinderen Israëls, en drijft gewin met hem, en verkoopt hem; zo zal deze dief sterven, en gij zult het boze uit het midden van u wegdoen.","8":"Wacht u in de plaag der melaatsheid, dat gij naarstiglijk waarneemt en doet naar alles, wat de Levietische priesteren ulieden zullen leren; gelijk als ik hun geboden heb, zult gij waarnemen te doen.","9":"Gedenkt, wat de HEERE, uw God, gedaan heeft aan Mirjam, op den weg, als gij uit Egypte waart uitgetogen.","10":"Wanneer gij aan uw naaste iets zult geleend hebben, zo zult gij tot zijn huis niet ingaan, om zijn pand te pand te nemen;","11":"Buiten zult gij staan, en de man, dien gij geleend hebt, zal het pand naar buiten tot u uitbrengen.","12":"Doch indien hij een arm man is, zo zult gij met zijn pand niet nederliggen.","13":"Gij zult hem dat pand zekerlijk wedergeven, als de zon ondergaat, dat hij in zijn kleed nederligge, en u zegene; en het zal u gerechtigheid zijn voor het aangezicht des HEEREN, uws Gods.","14":"Gij zult den armen en nooddruftigen dagloner niet verdrukken, die uit uw broederen is, of uit uw vreemdelingen, die in uw land en in uw poorten zijn.","15":"Op zijn dag zult gij zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; dat hij tegen u niet roepe tot den HEERE, en zonde in u zij.","16":"De vaders zullen niet gedood worden voor de kinderen, en de kinderen zullen niet gedood worden voor de vaders; een ieder zal om zijn zonde gedood worden.","17":"Gij zult het recht van den vreemdeling *en* van den wees niet buigen, en gij zult het kleed der weduwe niet te pand nemen.","18":"Maar gij zult gedenken, dat gij een knecht in Egypte geweest zijt, en de HEERE, uw God, heeft u van daar verlost; daarom gebiede ik u deze zaak te doen.","19":"Wanneer gij uw oogst op uw akker afgeoogst, en een garf op den akker vergeten zult hebben, zo zult gij niet wederkeren, om die op te nemen; voor den vreemdeling, voor den wees en voor de weduwe zal zij zijn; opdat u de HEERE, uw God, zegene, in al het werk uwer handen.","20":"Wanneer gij uw olijfboom zult geschud hebben, zo zult gij de takken achter u niet nauw doorzoeken; voor den vreemdeling, voor den wees en voor de weduwe zal het zijn.","21":"Wanneer gij uw wijngaard zult afgelezen hebben, zo zult gij de druiven achter u niet nalezen; voor den vreemdeling, voor den wees en voor de weduwe zal het zijn.","22":"En gij zult gedenken, dat gij een knecht in Egypteland geweest zijt; daarom gebiede ik u deze zaak te doen."},"KJV":{"1":"When a man hath taken a wife, and married her, and it come to pass that she find no favour in his eyes, because he hath found some uncleanness in her: then let him write her a bill of divorcement, and give *it* in her hand, and send her out of his house.","2":"And when she is departed out of his house, she may go and be another man's","3":"And *if* the latter husband hate her, and write her a bill of divorcement, and giveth *it* in her hand, and sendeth her out of his house; or if the latter husband die, which took her *to be* his wife;","4":"Her former husband, which sent her away, may not take her again to be his wife, after that she is defiled; for that *is* abomination before the LORD: and thou shalt not cause the land to sin, which the LORD thy God giveth thee *for* an inheritance.","5":"When a man hath taken a new wife, he shall not go out to war, neither shall he be charged with any business: *but* he shall be free at home one year, and shall cheer up his wife which he hath taken.","6":"No man shall take the nether or the upper millstone to pledge: for he taketh *a man's* life to pledge.","7":"If a man be found stealing any of his brethren of the children of Israel, and maketh merchandise of him, or selleth him; then that thief shall die; and thou shalt put evil away from among","8":"Take heed in the plague of leprosy, that thou observe diligently, and do according to all that the priests the Levites shall teach you: as I commanded them, *so* ye shall observe to do.","9":"Remember what the LORD thy God did unto Miriam by the way, after that ye were come forth out of Egypt.","10":"When thou dost lend thy brother any thing, thou shalt not go into his house to fetch his pledge.","11":"Thou shalt stand abroad, and the man to whom thou dost lend shall bring out the pledge abroad","12":"And if the man *be* poor, thou shalt not sleep with his pledge:","13":"In any case thou shalt deliver him the pledge again when the sun goeth down, that he may sleep in his own raiment, and bless thee: and it shall be righteousness unto thee before the LORD thy God.","14":"Thou shalt not oppress an hired servant *that is* poor and needy, *whether he be* of thy brethren, or of thy strangers that *are* in thy land within thy gates:","15":"At his day thou shalt give *him* his hire, neither shall the sun go down upon it; for he *is* poor, and setteth his heart upon it: lest he cry against thee unto the LORD, and it be sin","16":"The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers: every man shall be put to death for his own sin.","17":"Thou shalt not pervert the judgment of the stranger, *nor* of the fatherless; nor take a widow's raiment to pledge:","18":"But thou shalt remember that thou wast a bondman in Egypt, and the LORD thy God redeemed thee thence: therefore I command thee to do this thing.","19":"When thou cuttest down thine harvest in thy field, and hast forgot a sheaf in the field, thou shalt not go again to fetch it: it shall be for the stranger, for the fatherless, and for the widow: that the LORD thy God may bless thee in all the work of thine hands.","20":"When thou beatest thine olive tree, thou shalt not go over the boughs again: it shall be for the stranger, for the fatherless, and for the widow.","21":"When thou gatherest the grapes of thy vineyard, thou shalt not glean *it* afterward: it shall be for the stranger, for the fatherless, and for the widow.","22":"And thou shalt remember that thou wast a bondman in the land of Egypt: therefore I command thee to do this thing."}},"tsk":{"1":[{"kopje":"genomen","refs":["Deut 21:15","Deut 22:13","Ex 21:10"]},{"kopje":"dat hij","refs":["Deut 24:3","Jer 3:8","Matt 5:31","Matt 5:32","Matt 19:7-9","Mark 10:4-12"]},{"kopje":"scheidbrief","refs":["Jes 50:1"]},{"kopje":"haar laten gaan","refs":["Deut 22:19","Deut 22:29","Mal 2:16","Matt 1:19","Luk 16:18","1 Kor 7:11","1 Kor 7:12"]}],"2":[{"kopje":"zal zij heengaan","refs":["Lev 21:7","Lev 21:14","Lev 22:13","Num 30:9","Ezech 44:22","Matt 5:32","Mark 10:11","1 Kor 7:15"]}],"4":[{"kopje":"haar eerste man","refs":["Jer 3:1"]},{"kopje":"zult u","refs":["Lev 18:24-28","Joz 22:17","Joz 22:18"]}],"5":[{"kopje":"een man","refs":["Deut 20:7","Gen 2:24","Matt 19:4-6","Mark 10:6-9","1 Kor 7:10-15","Ef 5:28","Ef 5:29","Tit 2:4","Tit 2:5"]},{"kopje":"verheugen","refs":["Spr 5:18","Pred 9:9","1 Kor 7:29"]}],"6":[{"kopje":"zal pand nemen","refs":["Ex 22:26","Ex 22:27","Openb 18:22"]},{"kopje":"de ziel","refs":["Deut 20:19","Gen 44:30","Luk 12:15"]}],"7":[{"kopje":"gevonden wordt","refs":["Ex 21:16","Ezech 27:13","1 Tim 1:10","Openb 18:13"]},{"kopje":"dan zal die dief","refs":["Ex 21:16","Ex 22:1-4"]},{"kopje":"en u zult","refs":["Deut 19:19"]}],"9":[{"kopje":"Denk","refs":["Luk 17:32","1 Kor 10:6","1 Kor 10:11"]},{"kopje":" \" data-l=\"L3\" data-code=\"H6680\">bent</span>; <span class=\"wl\" data-l=\"L3\" data-code=\"H6680\">daarom</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6680\">gebied</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6680\">ik</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1697\">u</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1697\">deze</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1697\">zaak</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1697\">te</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6213\">doen</span>."},"koppeling_kjv":{"1":"When a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> hath <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and <span class=\"wl wl-kjv\" data-code=\"H1166\">married</span> her, and it come to pass that she <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> no <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> because he hath <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">some</span> <span class=\"wl wl-kjv\" data-code=\"H6172\">uncleanness</span> in her: then let him <span class=\"wl wl-kjv\" data-code=\"H3789\">write</span> her a <span class=\"wl wl-kjv\" data-code=\"H5612\">bill</span> of <span class=\"wl wl-kjv\" data-code=\"H3748\">divorcement,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it in her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> her out of his house.","2":"And when she is departed <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> she may <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> and be <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> man's","3":"And if the <span class=\"wl wl-kjv\" data-code=\"H314\">latter</span> <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> her, and <span class=\"wl wl-kjv\" data-code=\"H3789\">write</span> her a <span class=\"wl wl-kjv\" data-code=\"H5612\">bill</span> of <span class=\"wl wl-kjv\" data-code=\"H3748\">divorcement,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> it in her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sendeth</span> her out of his <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> or if the <span class=\"wl wl-kjv\" data-code=\"H314\">latter</span> <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> which <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> her to be his wife;","4":"Her <span class=\"wl wl-kjv\" data-code=\"H7223\">former</span> <span class=\"wl wl-kjv\" data-code=\"H1167\">husband,</span> which sent her <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">may</span> not <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> her <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to be his <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that she is <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled;</span> for that is <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and thou shalt not cause the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> thee for an inheritance.","5":"When a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> hath <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> a <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> he shall not go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H6635\">war,</span> neither shall he be <span class=\"wl wl-kjv\" data-code=\"H5674\">charged</span> with any <span class=\"wl wl-kjv\" data-code=\"H1697\">business:</span> but he shall be <span class=\"wl wl-kjv\" data-code=\"H5355\">free</span> at <span class=\"wl wl-kjv\" data-code=\"H1004\">home</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> and shall cheer <span class=\"wl wl-kjv\" data-code=\"H8055\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> which he hath taken.","6":"No man shall <span class=\"wl wl-kjv\" data-code=\"H2254\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H7347\">nether</span> or the upper <span class=\"wl wl-kjv\" data-code=\"H7393\">millstone</span> to <span class=\"wl wl-kjv\" data-code=\"H2254\">pledge:</span> for he <span class=\"wl wl-kjv\" data-code=\"H2254\">taketh</span> a man's <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> to pledge.","7":"If a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> be <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H1589\">stealing</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">any</span> of his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and maketh <span class=\"wl wl-kjv\" data-code=\"H6014\">merchandise</span> of him, or <span class=\"wl wl-kjv\" data-code=\"H4376\">selleth</span> him; then that <span class=\"wl wl-kjv\" data-code=\"H1590\">thief</span> shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die;</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H1197\">put</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> from among","8":"Take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> in the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">diligently,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to all that the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> shall <span class=\"wl wl-kjv\" data-code=\"H3384\">teach</span> you: as I <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them, so ye shall <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> to do.","9":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Remember</span> what the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto <span class=\"wl wl-kjv\" data-code=\"H4813\">Miriam</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> after that ye were come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of Egypt.","10":"When thou dost <span class=\"wl wl-kjv\" data-code=\"H5383\">lend</span> thy <span class=\"wl wl-kjv\" data-code=\"H7453\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H3972\">any</span> <span class=\"wl wl-kjv\" data-code=\"H4859\">thing,</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to <span class=\"wl wl-kjv\" data-code=\"H5670\">fetch</span> his pledge.","11":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad,</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to whom thou dost <span class=\"wl wl-kjv\" data-code=\"H5383\">lend</span> shall bring <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H5667\">pledge</span> abroad","12":"And if the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> be <span class=\"wl wl-kjv\" data-code=\"H6041\">poor,</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H7901\">sleep</span> with his pledge:","13":"In any <span class=\"wl wl-kjv\" data-code=\"H7725\">case</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7725\">deliver</span> him the <span class=\"wl wl-kjv\" data-code=\"H5667\">pledge</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> when the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> goeth <span class=\"wl wl-kjv\" data-code=\"H935\">down,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H7901\">sleep</span> in his own <span class=\"wl wl-kjv\" data-code=\"H8008\">raiment,</span> and <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> thee: and it shall be <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> unto thee <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy God.","14":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H6231\">oppress</span> an hired <span class=\"wl wl-kjv\" data-code=\"H7916\">servant</span> that is <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> and <span class=\"wl wl-kjv\" data-code=\"H34\">needy,</span> whether he be of thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> or of thy <span class=\"wl wl-kjv\" data-code=\"H1616\">s /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
