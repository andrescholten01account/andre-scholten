 uw hart en met heel uw ziel.","4":"De HEERE, uw God, zult u navolgen, en Hem vrezen, en Zijn geboden zult u houden, en Zijn stem gehoorzaam zijn, en Hem dienen, en Hem aanhangen.","5":"En die profeet, of dromen-dromer, zal gedood worden; want hij heeft gesproken *tot* een afval van de HEERE, uw God, Die u uit Egypteland heeft uitgevoerd, en u uit het diensthuis verlost; om u af te drijven van de weg, die de HEERE, uw God, u geboden heeft, om daarin te wandelen. Zo zult u het boze uit uw midden wegdoen.","6":"Wanneer uw broer, de zoon van uw moeder, of uw zoon, of uw dochter, of de vrouw van uw schoot, of uw vriend, die als uw eigen ziel is, u heimelijk zal aanporren, en zegt: Laat ons gaan, en andere goden dienen, die u niet gekend hebt, u noch uw vaders;","7":"van de goden van de volken die rondom u zijn, dichtbij u, of ver van u, van het ene einde van de aarde tot aan het andere einde van de aarde;","8":"dan zult u hem niet ter wille zijn, en niet naar hem horen; ook zal uw oog hem niet ontzien, en u zult zich niet ontfermen, hem ook niet verbergen;","9":"maar u zult hem zeker doodslaan; uw hand zal eerst tegen hem zijn, om hem te doden, en daarna de hand van het hele volk.","10":"En u zult hem met stenen stenigen, zodat hij sterft; want hij heeft gezocht u af te drijven van de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgevoerd heeft.","11":"Opdat heel Israël het hoort en vreest, en niet meer voortvaart om te doen naar dit boze stuk in uw midden.","12":"Wanneer u van een van uw steden, die de HEERE, uw God, u geeft om daar te wonen, zult horen zeggen:","13":"Er zijn mannen, kinderen van Belial, uit uw midden uitgegaan, en hebben de inwoners van hun stad aangedreven, en gezegd: Laat ons gaan, en andere goden dienen, die u niet gekend hebt;","14":"dan zult u onderzoeken, en naspeuren, en goed navragen; en zie, als het de waarheid is, de zaak zeker vaststaat, zo'n gruwel in uw midden gedaan is;","15":"dan zult u de inwoners van die stad zeker slaan met de scherpte van het zwaard, haar met de ban slaan, en alles wat daarin is, ook haar beesten, met de scherpte van het zwaard.","16":"En al haar buit zult u verzamelen midden op haar straat, en de stad en al haar buit geheel met vuur verbranden voor de HEERE, uw God; en zij zal een puinhoop zijn voor eeuwig, zij zal niet opnieuw gebouwd worden.","17":"Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;","18":"wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, om al Zijn geboden te houden, die ik u heden gebied, om te doen wat recht is in de ogen van de HEERE, uw God."},"SV":{"1":"Wanneer een profeet, of dromen-dromer, in het midden van u zal opstaan, en u geven een teken of wonder;","2":"En dat teken of dat wonder komt, dat hij tot u gesproken had, zeggende: Laat ons andere goden, die gij niet gekend hebt, navolgen en hen dienen;","3":"Gij zult naar de woorden van dien profeet, of naar dien dromen-dromer niet horen; want de HEERE, uw God, verzoekt ulieden, om te weten, of gij den HEERE, uw God, liefhebt met uw ganse hart en met uw ganse ziel.","4":"Den HEERE, uw God, zult gij navolgen, en Hem vrezen, en Zijn geboden zult gij houden, en Zijn stem gehoorzaam zijn, en Hem dienen, en Hem aanhangen.","5":"En diezelve profeet, of dromen-dromer, zal gedood worden; want hij heeft *tot* een afval gesproken tegen den HEERE, uw God, Die ulieden uit Egypteland heeft uitgevoerd, en u uit het diensthuis verlost; om u af te drijven van den weg, dien u de HEERE, uw God, geboden heeft, om daarin te wandelen. Zo zult gij het boze uit het midden van u wegdoen.","6":"Wanneer uw broeder, de zoon uwer moeder, of uw zoon, of uw dochter, of de vrouw van uw schoot, of uw vriend, die als uw ziel is, u zal aanporren in het heimelijke, zeggende: Laat ons gaan, en dienen andere goden, die gij niet gekend hebt, gij noch uw vaderen;","7":"Van de goden der volken, die rondom u zijn, nabij u, of verre van u, van het ene einde der aarde tot aan het andere einde der aarde;","8":"Zo zult gij hem niet ter wille zijn, en naar hem niet horen; ook zal uw oog hem niet verschonen, en gij zult u niet ontfermen, noch hem verbergen;","9":"Maar gij zult hem zekerlijk doodslaan; uw hand zal eerst tegen hem zijn, om hem te doden, en daarna de hand des gansen volks.","10":"En gij zult hem met stenen stenigen, dat hij sterve; want hij heeft u gezocht af te drijven van den HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgevoerd heeft.","11":"Opdat gans Israël het hore en vreze, en niet voortvare te doen naar dit boze stuk in het midden van u.","12":"Wanneer gij van een uwer steden, die de HEERE, uw God, u geeft, om aldaar te wonen, zult horen zeggen:","13":"Er zijn mannen, Belials-kinderen, uit het midden van u uitgegaan, en hebben de inwoners hunner stad aangedreven, zeggende: Laat ons gaan, en dienen andere goden, die gij niet gekend hebt;","14":"Zo zult gij onderzoeken, en naspeuren, en wel navragen; en ziet, het is de waarheid, de zaak is zeker, zulk een gruwel is in het midden van u gedaan;","15":"Zo zult gij de inwoners derzelver stad ganselijk slaan met de scherpte des zwaards, verbannende haar, en alles, wat daarin is, ook haar beesten, met de scherpte des zwaards.","16":"En al haar roof zult gij verzamelen in het midden van haar straat, en den HEERE, uw God, die stad en al haar roof ganselijk met vuur verbranden; en zij zal een hoop zijn eeuwiglijk, zij zal niet weder gebouwd worden.","17":"Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wende van de hitte Zijns toorns, en u geve barmhartigheid, en Zich uwer erbarme, en u vermenigvuldige, gelijk als Hij uw vaderen gezworen heeft;","18":"Wanneer gij de stem des HEEREN, uws Gods, zult gehoorzaam zijn, om te houden al Zijn geboden, die ik u heden gebiede, om te doen wat recht is in de ogen des HEEREN, uws Gods."},"KJV":{"1":"If there arise among you a prophet, or a dreamer of dreams, and giveth thee a sign or a wonder,","2":"And the sign or the wonder come to pass, whereof he spake unto thee, saying, Let us go after other gods, which thou hast not known, and let us serve","3":"Thou shalt not hearken unto the words of that prophet, or that dreamer of dreams: for the LORD your God proveth you, to know whether ye love the LORD your God with all your heart and with all your soul.","4":"Ye shall walk after the LORD your God, and fear him, and keep his commandments, and obey his voice, and ye shall serve him, and cleave","5":"And that prophet, or that dreamer of dreams, shall be put to death; because he hath spoken to turn *you* away from the LORD your God, which brought you out of the land of Egypt, and redeemed you out of the house of bondage, to thrust thee out of the way which the LORD thy God commanded thee to walk in. So shalt thou put the evil away from the midst","6":"If thy brother, the son of thy mother, or thy son, or thy daughter, or the wife of thy bosom, or thy friend, which *is* as thine own soul, entice thee secretly, saying, Let us go and serve other gods, which thou hast not known, thou, nor thy fathers;","7":"*Namely*, of the gods of the people which *are* round about you, nigh unto thee, or far off from thee, from the *one* end of the earth even unto the *other* end of the earth;","8":"Thou shalt not consent unto him, nor hearken unto him; neither shall thine eye pity him, neither shalt thou spare, neither shalt thou conceal","9":"But thou shalt surely kill him; thine hand shall be first upon him to put him to death, and afterwards the hand of all the people.","10":"And thou shalt stone him with stones, that he die; because he hath sought to thrust thee away from the LORD thy God, which brought thee out of the land of Egypt, from the house of bondage.","11":"And all Israel shall hear, and fear, and shall do no more any such wickedness as this is among","12":"If thou shalt hear *say* in one of thy cities, which the LORD thy God hath given thee to dwell there, saying,","13":"*Certain* men, the children of Belial, are gone out from among you, and have withdrawn the inhabitants of their city, saying, Let us go and serve other gods, which ye have not known;","14":"Then shalt thou enquire, and make search, and ask diligently; and, behold, *if it be* truth, *and* the thing certain, *that* such abomination is wrought among","15":"Thou shalt surely smite the inhabitants of that city with the edge of the sword, destroying it utterly, and all that *is* therein, and the cattle thereof, with the edge of the sword.","16":"And thou shalt gather all the spoil of it into the midst of the street thereof, and shalt burn with fire the city, and all the spoil thereof every whit, for the LORD thy God: and it shall be an heap for ever; it shall not be built again.","17":"And there shall cleave nought of the cursed thing to thine hand: that the LORD may turn from the fierceness of his anger, and shew thee mercy, and have compassion upon thee, and multiply thee, as he hath sworn unto thy fathers;","18":"When thou shalt hearken to the voice of the LORD thy God, to keep all his commandments which I command thee this day, to do *that which is* right in the eyes of the LORD thy God."}},"tsk":{"1":[{"kopje":"profeet","refs":["1 Kon 13:18","Jes 9:14","Jer 6:13","Jer 23:11","Ezech 13:2","Ezech 13:3","Ezech 13:23","Zach 13:4","Matt 7:15","Matt 24:11","Luk 6:26","2 Petr 2:1","1 Joh 4:1"]},{"kopje":"dromen droomt","refs":["Jer 23:25-28","Jer 27:9","Jer 29:8","Jer 29:24","Zach 10:2"]}],"3":[{"kopje":"horen","refs":["Jes 8:20","Hand 17:11","Ef 4:14","1 Joh 4:1"]},{"kopje":"beproeft","refs":["Deut 8:2","Ps 66:10","Ps 81:8","Matt 24:24","1 Kor 11:19","2 Tess 2:11","1 Joh 2:19","1 Joh 4:4","Openb 13:14"]},{"kopje":"u de HEERE, uw God, liefhebt","refs":["Deut 6:5","2 Kor 8:8"]}],"4":[{"kopje":"navolgen","refs":["Deut 6:13","2 Kon 23:3","2 Kron 34:31"," function md(t) {  // *cursief* -> <em>, noot [n] -> sup

    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
