 en grote wonderen.","4":"Maar de HEERE heeft u geen hart gegeven om te verstaan, geen ogen om te zien, en geen oren om te horen, tot op deze dag.","5":"En Ik heb u veertig jaren doen wandelen in de woestijn; uw kleren zijn u niet versleten, en uw schoen is niet versleten aan uw voet.","6":"Brood hebt u niet gegeten, en wijn en sterke drank hebt u niet gedronken; opdat u zou weten, dat Ik de HEERE, uw God, ben.","7":"Toen u nu kwam aan deze plaats, trok Sihon, de koning van Hesbon, uit, en Og, de koning van Bazan, ons tegemoet, ten strijde; en wij versloegen hen.","8":"En wij hebben hun land ingenomen, en dat als erfelijk bezit gegeven aan de Rubenieten en Gadieten, alsook aan de halve stam van de Manassieten.","9":"Houdt dan de woorden van dit verbond, en doet ze; opdat u verstandig handelt in alles, wat u doen zult.","10":"U staat heden allen voor het aangezicht van de HEERE, uw God: uw hoofden van uw stammen, uw oudsten, en uw opzichters, alle mannen van Israël;","11":"Uw kinderen, uw vrouwen, en uw vreemdeling, die in het midden van uw kamp is, van uw houthakker tot uw waterputter toe;","12":"Om over te gaan in het verbond van de HEERE, uw God, en in Zijn vloek, die de HEERE, uw God, heden met u maakt;","13":"Opdat Hij u heden voor Zichzelf tot een volk bevestigt, en Hij u tot een God is, zoals Hij tot u gesproken heeft, en zoals Hij uw vaderen, Abraham, Izak en Jakob, gezworen heeft.","14":"En niet met u alleen maak ik dit verbond en deze vloek;","15":"Maar met hem die heden hier bij ons voor het aangezicht van de HEERE, onze God, staat; en met hem die hier heden bij ons niet is.","16":"Want u weet, hoe wij in Egypteland gewoond hebben, en hoe wij doorgetrokken zijn door het midden van de volken, die u doorgetrokken bent.","17":"En u hebt hun afschuwelijke afgoden gezien, en hun drekgoden*, hout en steen, zilver en goud, die bij hen waren.","18":"Dat onder u niet iemand is, man of vrouw, of gezin, of stam, die zijn hart heden afwendt van de HEERE, onze God, om de goden van deze volken te gaan dienen; dat onder u niet een wortel is, die gal en alsem draagt;","19":"En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst.","20":"De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen.","21":"En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.","22":"Dan zal het navolgende geslacht zeggen, uw kinderen, die na u opstaan zullen, en de vreemde, die uit een ver land komen zal, als zij de plagen van dit land zullen zien en de ziekten waarmee de HEERE het gekweld heeft;","23":"Dat zijn hele aarde zwavel en zout is van de verbranding; die niet bezaaid zal zijn, en geen spruit zal voortgebracht hebben, en geen kruid daarin zal opgekomen zijn; zoals de omkering van Sodom en Gomorra, Adama en Zeboïm, die de HEERE heeft omgekeerd in Zijn toorn en in Zijn grimmigheid;","24":"En alle volken zullen zeggen: Waarom heeft de HEERE dit land zo aangedaan? Wat betekent de gloed van deze grote toorn?","25":"Dan zal men zeggen: Omdat zij het verbond van de HEERE, de God van hun vaderen, verlaten hebben, dat Hij met hen gemaakt had, toen Hij hen uit Egypteland uitleidde;","26":"En zij heengegaan zijn, en andere goden gediend hebben en zich daarvoor gebogen hebben; goden, die zij niet gekend hadden, en die hun niets had toebedeeld;","27":"Daarom is de toorn van de HEERE ontstoken tegen dit land, om daarover te brengen deze hele vloek, die in dit boek geschreven is.","28":"En de HEERE heeft hen uit hun land weggerukt, in toorn, en in grimmigheid, en in grote verbolgenheid; en Hij heeft hen weggeworpen in een ander land, zoals het is op deze dag.","29":"De verborgen dingen zijn voor de HEERE, onze God; maar de geopenbaarde dingen zijn voor ons en voor onze kinderen, tot in eeuwigheid, om al de woorden van deze wet te doen."},"SV":{"1":"Dit zijn de woorden des verbonds, dat de HEERE Mozes geboden heeft te maken met de kinderen Israëls, in het land van Moab, boven het verbond, dat Hij met hen gemaakt had aan Horeb.","2":"En Mozes riep gans Israël, en zeide tot hen: Gij hebt gezien al wat de HEERE in Egypteland voor uw ogen gedaan heeft, aan Farao, en aan al zijn knechten, en aan zijn land;","3":"De grote verzoekingen, die uw ogen gezien hebben, diezelve tekenen en grote wonderen.","4":"Maar de HEERE heeft ulieden niet gegeven een hart om te verstaan, noch ogen om te zien, noch oren om te horen, tot op dezen dag.","5":"En Ik heb ulieden veertig jaren doen wandelen in de woestijn; uw klederen zijn aan u niet verouderd, en uw schoen is niet verouderd aan uw voet.","6":"Brood hebt gij niet gegeten, en wijn en sterken drank hebt gij niet gedronken; opdat gij wistet, dat Ik de HEERE, uw God, ben.","7":"Toen gij nu kwaamt aan deze plaats, toog Sihon, de koning van Hesbon, uit, en Og, de koning van Bazan, ons tegemoet, ten strijde; en wij sloegen hen.","8":"En wij hebben hun land ingenomen, en dat ten erve gegeven aan de Rubenieten en Gadieten, mitsgaders aan den halven stam der Manassieten.","9":"Houdt dan de woorden dezes verbonds, en doet ze; opdat gij verstandelijk handelt in alles, wat gij doen zult.","10":"Gij staat heden allen voor het aangezicht des HEEREN, uws Gods: uw hoofden uwer stammen, uw oudsten, en uw ambtlieden, alle man van Israël;","11":"Uw kinderkens, uw vrouwen, en uw vreemdeling, die in het midden van uw leger is, van uw houthouwer tot uw waterputter toe;","12":"Om over te gaan in het verbond des HEEREN, uws Gods, en in Zijn vloek, hetwelk de HEERE, uw God, heden met u maakt;","13":"Opdat Hij u heden Zichzelven tot een volk bevestige, en Hij u tot een God zij, gelijk als Hij tot u gesproken heeft, en gelijk als Hij uw vaderen, Abraham, Izak en Jakob, gezworen heeft.","14":"En niet met ulieden alleen maak ik dit verbond en dezen vloek;","15":"Maar met dengene, die heden hier bij ons voor het aangezicht des HEEREN, onzes Gods, staat; en met dengene, die hier heden bij ons niet is.","16":"Want gij weet, hoe wij in Egypteland gewoond hebben, en hoe wij doorgetogen zijn door het midden der volken, die gij doorgetogen zijt.","17":"En gij hebt gezien hun verfoeiselen, en hun drekgoden, hout en steen, zilver en goud, die bij hen waren.","18":"Dat onder ulieden niet zij een man, of vrouw, of huisgezin, of stam, die zijn hart heden wende van den HEERE, onzen God, om te gaan dienen de goden dezer volken; dat onder ulieden niet zij een wortel, die gal en alsem drage;","19":"En het geschiede, als hij de woorden dezes vloeks hoort, dat hij zichzelven zegene in zijn hart, zeggende: Ik zal vrede hebben, wanneer ik schoon naar mijns harten goeddunken zal wandelen, om den dronkene te doen tot den dorstige.","20":"De HEERE zal hem niet willen vergeven; maar alsdan zal des HEEREN toorn en ijver roken over denzelven man, en al de vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder den hemel uitdelgen.","21":"En de HEERE zal hem ten kwade afscheiden van al de stammen Israëls, naar alle vloeken des verbonds, dat in het boek dezer wet geschreven is.","22":"Dan zal zeggen het navolgend geslacht, uw kinderen, die na ulieden opstaan zullen, en de vreemde, die uit verren lande komen zal, als zij zullen zien de plagen dezes lands en deszelfs krankheden, waarmede de HEERE het gekrenkt heeft;","23":"Dat zijn ganse aarde zij zwavel en zout der verbranding; die niet bezaaid zal zijn, en geen spruit zal voortgebracht hebben, noch enig kruid daarin zal opgekomen zijn; gelijk de omkering van Sodom en Gomorra, Adama en Zeboim, die de HEERE heeft omgekeerd in Zijn toorn en in Zijn grimmigheid;","24":"En alle volken zullen zeggen: Waarom heeft de HEERE aan dit land alzo gedaan? Wat is de ontsteking van dezen groten toorn?","25":"Dan zal men zeggen: Omdat zij het verbond des HEEREN, des Gods hunner vaderen, hebben verlaten, dat Hij met hen gemaakt had, als Hij hen uit Egypteland uitvoerde;","26":"En zij heengegaan zijn, en andere goden gediend en zich voor die gebogen hebben; goden, die hen niet gekend hadden, en geen van welke hun iets medegedeeld had;","27":"Daarom is de toorn des HEEREN ontstoken tegen dit land, om daarover te brengen al dezen vloek, die in dit boek geschreven is.","28":"En de HEERE heeft hen uit hun land uitgetrokken, in toorn, en in grimmigheid, en in grote verbolgenheid; en Hij heeft hen verworpen in een ander land, gelijk het is te dezen dage.","29":"De verborgene dingen zijn voor den HEERE, onzen God; maar de geopenbaarde zijn voor ons en voor onze kinderen, tot in eeuwigheid, om te doen al de woorden dezer wet."},"KJV":{"1":"These *are* the words of the covenant, which the LORD commanded Moses to make with the children of Israel in the land of Moab, beside the covenant which he made with them in Horeb.","2":"And Moses called unto all Israel, and said unto them, Ye have seen all that the LORD did before your eyes in the land of Egypt unto Pharaoh, and unto all his servants, and unto all his land;","3":"The great temptations which thine eyes have seen, the signs, and those great miracles:","4":"Yet the LORD hath not given you an heart to perceive, and eyes to see, and ears to hear, unto this day.","5":"And I have led you forty years in the wilderness: your clothes are not waxen old upon you, and thy shoe is not waxen old upon thy foot.","6":"Ye have not eaten bread, neither have ye drunk wine or strong drink: that ye might know that I *am* the LORD your God.","7":"And when ye came unto this place, Sihon the king of Heshbon, and Og the king of Bashan, came out against us unto battle, and we smote","8":"And we took their land, and gave it for an inheritance unto the Reubenites, and to the Gadites, and to the half tribe of Manasseh.","9":"Keep therefore the words of this covenant, and do them, that ye may prosper in all that ye do.","10":"Ye stand this day all of you before the LORD your God; your captains of your tribes, your elders, and your officers, *with* all the men of Israel,","11":"Your little ones, your wives, and thy stranger that *is* in thy camp, from the hewer of thy wood unto the drawer of thy water:","12":"That thou shouldest enter into covenant with the LORD thy God, and into his oath, which the LORD thy God maketh with thee this day:","13":"That he may establish thee to day for a people unto himself, and *that* he may be unto thee a God, as he hath said unto thee, and as he hath sworn unto thy fathers, to Abraham, to Isaac, and to Jacob.","14":"Neither with you only do I make this covenant and this oath;","15":"But with *him* that standeth here with us this day before the LORD our God, and also with *him* that *is* not here with us this day:","16":"(For ye know how we have dwelt in the land of Egypt; and how we came through the nations which ye passed by;","17":"And ye have seen their abominations, and their idols, wood and stone, silver and gold,","18":"Lest there should be among you man, or woman, or family, or tribe, whose heart turneth away this day from the LORD our God, to go *and* serve the gods of these nations; lest there should be among you a root that beareth gall and wormwood;","19":"And it come to pass, when he heareth the words of this curse, that he bless himself in his heart, saying, I shall have peace, though I walk in the imagination of mine heart, to add drunkenness to thirst:","20":"The LORD will not spare him, but then the anger of the LORD and his jealousy shall smoke against that man, and all the curses that are written in this book shall lie upon him, and the LORD shall blot out his name from under heaven.","21":"And the LORD shall separate him unto evil out of all the tribes of Israel, according to all the curses of the covenant that are written in this book of the law:","22":"So that the generation to come of your children that shall rise up after you, and the stranger that shall come from a far land, shall say, when they see the plagues of that land, and the sicknesses which the LORD hath laid","23":"*And that* the whole land thereof *is* brimstone, and salt, *and* burning, *that* it is not sown, nor beareth, nor any grass groweth therein, like the overthrow of Sodom, and Gomorrah, Admah, and Zeboim, which the LORD overthrew in his anger, and in his wrath:","24":"Even all nations shall say, Wherefore hath the LORD done thus unto this land? what *meaneth* the heat of this great anger?","25":"Then men shall say, Because they have forsaken the covenant of the LORD God of their fathers, which he made with them when he brought them forth out of the land of Egypt:","26":"For they went and served other gods, and worshipped them, gods whom they knew not, and *whom* he had not given","27":"And the anger of the LORD was kindled against this land, to bring upon it all the curses that are written in this book:","28":"And the LORD rooted them out of their land in anger, and in wrath, and in great indignation, and cast them into another land, as *it is* this day.","29":"The secret *things belong* unto the LORD our God: but those *things which are* revealed *belong* unto us and to our children for ever, that *we* may do all the words of this law."}},"tsk":{"1":[{"kopje":"de woorden","refs":["Deut 29:12","Deut 29:21","Deut 29:25","Lev 26:44","Lev 26:45","2 Kon 23:3","Jer 11:2","Jer 11:6","Jer 34:18","Hand 3:25"]},{"kopje":"naast het","refs":["Deut 4:10","Deut 4:13","Deut 4:23","Deut 5:2","Deut 5:3","Ex 19:3-5","Ex 24:2-8","Jer 31:32","Hebr 8:9"]}],"2":[{"kopje":"U hebt gezien alles","refs":["Ex 8:12","Ex 19:4","Joz 24:5","Joz 24:6","Ps 78:43-51","Ps 105:27-36"]}],"5":[{"kopje":"doen wandelen","refs":["Deut 1:3","Deut 8:2"]},{"kopje":"uw kleren","refs":["Deut 8:4","Neh 9 \"H5869\">eyes</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and unto all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and unto all his land;","3":"The <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4531\">temptations</span> which thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen,</span> the <span class=\"wl wl-kjv\" data-code=\"H226\">signs,</span> and those <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> miracles:","4":"Yet the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath not <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you an <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H3045\">perceive,</span> and <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> and <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> to <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> unto this day.","5":"And I have <span class=\"wl wl-kjv\" data-code=\"H3212\">led</span> you <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness:</span> your <span class=\"wl wl-kjv\" data-code=\"H8008\">clothes</span> are not waxen <span class=\"wl wl-kjv\" data-code=\"H1086\">old</span> upon you, and thy <span class=\"wl wl-kjv\" data-code=\"H5275\">shoe</span> is not waxen <span class=\"wl wl-kjv\" data-code=\"H1086\">old</span> upon thy foot.","6":"Ye have not <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> neither have ye <span class=\"wl wl-kjv\" data-code=\"H8354\">drunk</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> or strong <span class=\"wl wl-kjv\" data-code=\"H7941\">drink:</span> that ye might <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","7":"And when ye <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto this <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon,</span> and <span class=\"wl wl-kjv\" data-code=\"H5747\">Og</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H1316\">Bashan,</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> us unto <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> and we smote","8":"And we <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> their <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it for an <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7206\">Reubenites,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1425\">Gadites,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of Manasseh.","9":"<span class=\"wl wl-kjv\" data-code=\"H8104\">Keep</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of this <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them, that ye may <span class=\"wl wl-kjv\" data-code=\"H7919\">prosper</span> in all that ye do.","10":"Ye <span class=\"wl wl-kjv\" data-code=\"H5324\">stand</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> all of you <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> your <span class=\"wl wl-kjv\" data-code=\"H7218\">captains</span> of your <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes,</span> your <span class=\"wl wl-kjv\" data-code=\"H2205\">elders,</span> and your <span class=\"wl wl-kjv\" data-code=\"H7860\">officers,</span> with all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of Israel,","11":"Your little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones,</span> your <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> that is <span class=\"wl wl-kjv\" data-code=\"H7130\">in</span> thy <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> from the <span class=\"wl wl-kjv\" data-code=\"H2404\">hewer</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7579\">drawer</span> of thy water:","12":"That thou shouldest <span class=\"wl wl-kjv\" data-code=\"H5674\">enter</span> into <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and into his <span class=\"wl wl-kjv\" data-code=\"H423\">oath,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">maketh</span> with thee this day:","13":"That he may <span class=\"wl wl-kjv\" data-code=\"H6965\">establish</span> thee to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> for a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> unto himself, and that he may be unto thee a <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> as he hath <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto thee, and as he hath <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> to <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> to <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and to Jacob.","14":"Neither with you only do I <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> this <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> and this oath;","15":"But with him that <span class=\"wl wl-kjv\" data-code=\"H5975\">standeth</span> here with us <span class=\"wl wl-kjv\" data-code=\"H3426\">this</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and also with him that is not here with us this day:","16":"(For ye <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> how we have <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> and how we <span class=\"wl wl-kjv\" data-code=\"H5674\">came</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> which ye passed by;","17":"And ye have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> their <span class=\"wl wl-kjv\" data-code=\"H8251\">abominations,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1544\">idols,</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> and <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and gold,","18":"Lest there should <span class=\"wl wl-kjv\" data-code=\"H3426\">be</span> among you <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> or <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> or <span class=\"wl wl-kjv\" data-code=\"H4940\">family,</span> or <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe,</span> whose <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> turneth <span class=\"wl wl-kjv\" data-code=\"H6437\">away</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of these <span class=\"wl wl-kjv\" data-code=\"H1471\">nations;</span> lest there should <span class=\"wl wl-kjv\" data-code=\"H3426\">be</span> among you a <span class=\"wl wl-kjv\" data-code=\"H8328\">root</span> that <span class=\"wl wl-kjv\" data-code=\"H6509\">beareth</span> <span class=\"wl wl-kjv\" data-code=\"H7219\">gall</span> and wormwood;","19":"And it come to pass, when he <span class=\"wl wl-kjv\" data-code=\"H8085\">heareth</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of this <span class=\"wl wl-kjv\" data-code=\"H423\">curse,</span> that he <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> himself in his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I shall have <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> <span class=\"wl wl-kjv\" data-code=\"H3588\">though</span> I <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in the <span class=\"wl wl-kjv\" data-code=\"H8307\">imagination</span> of mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> to <span class=\"wl wl-kjv\" data-code=\"H5595\">add</span> <span class=\"wl wl-kjv\" data-code=\"H7302\">drunkenness</span> to thirst:","20":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H14\">will</span> not <span class=\"wl wl-kjv\" data-code=\"H5545\">spare</span> him, but then the <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> and his <span class=\"wl wl-kjv\" data-code=\"H7068\">jealousy</span> shall <span class=\"wl wl-kjv\" data-code=\"H6225\">smoke</span> against that <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H423\">curses</span> that are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in this <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> shall <span class=\"wl wl-kjv\" data-code=\"H7257\">lie</span> upon him, and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall blot <span class=\"wl wl-kjv\" data-code=\"H4229\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> from under heaven.","21":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H914\">separate</span> him unto <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> out of all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> according to all the <span class=\"wl wl-kjv\" data-code=\"H423\">curses</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> that are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in this <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the law:","22":"So that the <span class=\"wl wl-kjv\" data-code=\"H1755\">generation</span> to <span class=\"wl wl-kjv\" data-code=\"H314\">come</span> of your <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> that shall rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> you, and the <span class=\"wl wl-kjv\" data-code=\"H5237\">stranger</span> that shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> from a <span class=\"wl wl-kjv\" data-code=\"H7350\">far</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> when they <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H4347\">plagues</span> of that <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8463\">sicknesses</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath laid","23":"And that the whole <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> thereof is <span class=\"wl wl-kjv\" data-code=\"H1614\">brimstone,</span> and <span class=\"wl wl-kjv\" data-code=\"H4417\">salt,</span> and <span class=\"wl wl-kjv\" data-code=\"H8316\">burning,</span> that it is not <span class=\"wl wl-kjv\" data-code=\"H2232\">sown,</span> nor <span class=\"wl wl-kjv\" data-code=\"H6779\">beareth,</span> nor any <span class=\"wl wl-kjv\" data-code=\"H6212\">grass</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">groweth</span> therein, like the <span class=\"wl wl-kjv\" data-code=\"H4114\">overthrow</span> of <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom,</span> and <span class=\"wl wl-kjv\" data-code=\"H6017\">Gomorrah,</span> <span class=\"wl wl-kjv\" data-code=\"H126\">Admah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6636\">Zeboim,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2015\">overthrew</span> in his <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and in his wrath:","24":"Even all <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Wherefore hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> thus unto this <span class=\"wl wl-kjv\" data-code=\"H776\">land?</span> what meaneth the <span class=\"wl wl-kjv\" data-code=\"H2750\">heat</span> of this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> anger?","25":"Then men shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Because they have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> which he <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> with them when he brought them <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt:","26":"For they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> them, <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> whom they <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not, and whom he had not given","27":"And the <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> upon it all the <span class=\"wl wl-kjv\" data-code=\"H7045\">curses</span> that are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in this book:","28":"And the <span class= (function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |

  document.getElementById('hfdnav').innerHTML =

    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
