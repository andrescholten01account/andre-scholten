elden verbrijzelen, en hun gewijde bomen[1] met vuur verbranden, en de gesneden beelden van hun goden omhakken; en u zult hun naam uitroeien uit die plaats.","4":"Zo zult u de HEERE, uw God, niet doen!","5":"Maar naar de plaats die de HEERE, uw God, uit al uw stammen zal uitkiezen om Zijn Naam daar te vestigen, naar Zijn woning zult u vragen, en daarheen zult u komen;","6":"En daarheen zult u brengen uw brandoffers, en uw slachtoffers, en uw tienden, en het hefoffer van uw hand, en uw geloften, en uw vrijwillige offers, en de eerstgeboorte van uw runderen en van uw schapen.","7":"En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.","8":"U zult niet doen naar alles wat wij hier vandaag doen, ieder al wat in zijn ogen recht is.","9":"Want u bent tot nu toe niet gekomen in de rust en in de erfenis die de HEERE, uw God, u geven zal.","10":"Maar u zult over de Jordaan gaan, en wonen in het land dat de HEERE, uw God, u zal doen erven; en Hij zal u rust geven van al uw vijanden rondom, en u zult veilig wonen.","11":"Dan zal er een plaats zijn die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; daarheen zult u brengen alles wat ik u gebied: uw brandoffers, en uw slachtoffers, uw tienden, en het hefoffer van uw hand, en alle beste keuze van uw geloften, die u de HEERE beloven zult.","12":"En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zonen, en uw dochters, en uw dienstknechten, en uw dienstmaagden, en de Leviet die in uw poorten is; want hij heeft geen deel noch erfenis met u.","13":"Wacht u ervoor dat u uw brandoffers niet offert op elke plaats die u zien zult.","14":"Maar in de plaats die de HEERE in een van uw stammen zal uitkiezen, daar zult u uw brandoffers offeren, en daar zult u doen al wat ik u gebied.","15":"Doch naar alle verlangen van uw ziel zult u slachten en vlees eten, naar de zegen van de HEERE, uw God, die Hij u geeft, in al uw poorten; de onreine en de reine zullen daarvan eten, zoals van een ree en zoals van een hert.","16":"Alleen het bloed zult u niet eten; u zult het op de aarde uitgieten als water.","17":"U zult in uw poorten niet mogen eten de tienden van uw koren, en van uw most, en van uw olie, noch de eerstgeboorte van uw runderen en van uw schapen, noch enige van uw geloften die u zult hebben beloofd, noch uw vrijwillige offers, noch het hefoffer van uw hand.","18":"Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt.","19":"Wacht u ervoor dat u de Leviet niet verlaat, al uw dagen in uw land.","20":"Wanneer de HEERE, uw God, uw gebied zal hebben uitgebreid, zoals Hij tot u gesproken heeft, en u zeggen zult: Ik zal vlees eten; omdat uw ziel verlangt vlees te eten, zo zult u vlees eten, naar alle verlangen van uw ziel.","21":"Als de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te vestigen, ver van u zal zijn, zo zult u slachten van uw runderen en van uw schapen die de HEERE u gegeven heeft, zoals ik u geboden heb; en u zult eten in uw poorten, naar alle verlangen van uw ziel.","22":"Doch zoals een ree en een hert gegeten wordt, zo zult u dat eten; de onreine en de reine zullen het samen eten.","23":"Alleen, houd vast dat u het bloed niet eet; want het bloed is het leven; daarom zult u het leven met het vlees niet eten;","24":"U zult dat niet eten; op de aarde zult u het uitgieten als water;","25":"U zult dat niet eten; opdat het u, en uw kinderen na u, goed gaat, als u zult gedaan hebben wat recht is in de ogen van de HEERE.","26":"Doch uw heilige dingen die u hebben zult, en uw geloften, zult u meenemen en komen naar de plaats die de HEERE zal uitkiezen;","27":"En u zult uw brandoffers, het vlees en het bloed, bereiden op het altaar van de HEERE, uw God; en het bloed van uw slachtoffers zal op het altaar van de HEERE, uw God, worden uitgegoten; maar het vlees zult u eten.","28":"Neem het waar, en hoor al deze woorden die ik u gebied, opdat het u, en uw kinderen na u, goed gaat tot in eeuwigheid, als u zult gedaan hebben wat goed en recht is in de ogen van de HEERE, uw God.","29":"Wanneer de HEERE, uw God, voor uw aangezicht zal hebben uitgeroeid de volken naar wie u heengaat om die in bezit te nemen; en u die in bezit zult nemen, en in hun land wonen;","30":"Wacht u ervoor dat u niet verstrikt raakt door hen te volgen, nadat zij voor uw aangezicht zullen verdelgd zijn; en dat u niet vraagt naar hun goden, en zegt: Zoals deze volken hun goden gediend hebben, zo zal ik ook doen.","31":"Zo zult u niet doen voor de HEERE, uw God; want alles wat de HEERE een gruwel is, dat Hij haat, hebben zij voor hun goden gedaan; want zij hebben zelfs hun zonen en hun dochters met vuur verbrand voor hun goden.","32":"Al dit woord dat ik u gebied, zult u onderhouden om te doen; u zult daar niets aan toevoegen, en daar niets van afdoen."},"SV":{"1":"Dit zijn de inzettingen en de rechten, die gijlieden zult waarnemen om te doen, in dat land, hetwelk u de HEERE, uwer vaderen God, gegeven heeft, om het te erven; al de dagen, die gijlieden op den aardbodem leeft.","2":"Gij zult ganselijk vernielen al de plaatsen, alwaar de volken, die gij zult erven, hun goden gediend hebben; op de hoge bergen, en op de heuvelen, en onder allen groenen boom.","3":"En gij zult hun altaren afwerpen, en hun opgerichte beelden verbreken, en hun bossen met vuur verbranden, en de gesneden beelden hunner goden nederhouwen; en gij zult hun naam te niet doen uit diezelve plaats.","4":"Gij zult den HEERE, uw God, alzo niet doen!","5":"Maar naar de plaats, die de HEERE, uw God, uit al uw stammen verkiezen zal, om Zijn Naam aldaar te zetten, naar Zijn woning zult gijlieden vragen, en daarheen zult gij komen;","6":"En daarheen zult gijlieden brengen uw brandofferen, en uw slachtofferen, en uw tienden, en het hefoffer uwer hand, en uw geloften, en uw vrijwillige offeren, en de eerstgeboorten uwer runderen en uwer schapen.","7":"En aldaar zult gijlieden voor het aangezicht des HEEREN, uws Gods, eten en vrolijk zijn, gijlieden en uw huizen, over alles, waaraan gij uw hand geslagen hebt, waarin u de HEERE, uw God, gezegend heeft.","8":"Gij zult niet doen naar alles, wat wij hier heden doen, een ieder al wat in zijn ogen recht is.","9":"Want gij zijt tot nu toe niet gekomen in de rust en in de erfenis, die de HEERE, uw God, u geven zal.","10":"Maar gij zult over de Jordaan gaan, en wonen in het land, dat u de HEERE, uw God, zal doen erven; en Hij zal u rust geven van al uw vijanden rondom, en gij zult zeker wonen.","11":"Dan zal er een plaats zijn, die de HEERE, uw God, verkiezen zal, om Zijn Naam aldaar te doen wonen; daarheen zult gij brengen alles, wat ik u gebiede: uw brandofferen, en uw slachtofferen, uw tienden, en het hefoffer uwer hand, en alle keur uwer geloften, die gij den HEERE beloven zult.","12":"En gij zult vrolijk zijn voor het aangezicht des HEEREN, uws Gods, gijlieden, en uw zonen, en uw dochteren, en uw dienstknechten, en uw dienstmaagden, en de Leviet, die in uw poorten is; want hij heeft geen deel noch erve met ulieden.","13":"Wacht u, dat gij uw brandofferen niet offert in alle plaats, die gij zien zult.","14":"Maar in de plaats, die de HEERE in een uwer stammen zal verkiezen, daar zult gij uw brandofferen offeren, en daar zult gij doen al wat ik u gebiede.","15":"Doch naar allen lust uwer ziel zult gij slachten en vlees eten, naar den zegen des HEEREN, uws Gods, dien Hij u geeft, in al uw poorten; de onreine en de reine zal daarvan eten, als van een ree, en als van een hert.","16":"Alleenlijk het bloed zult gijlieden niet eten; gij zult het op de aarde uitgieten als water.","17":"Gij zult in uw poorten niet mogen eten de tienden van uw koren, en van uw most, en van uw olie, noch de eerstgeboorten van uw runderen en van uw schapen, noch enige uwer geloften, die gij zult hebben beloofd, noch uw vrijwillige offeren, noch het hefoffer uwer hand.","18":"Maar gij zult dat eten voor het aangezicht des HEEREN, uws Gods, in de plaats, die de HEERE, uw God, verkiezen zal, gij, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet, die in uw poorten is; en gij zult vrolijk zijn voor het aangezicht des HEEREN, uws Gods, over alles, waaraan gij uw handen geslagen hebt.","19":"Wacht u, dat gij den Leviet niet verlaat, al uw dagen in uw land.","20":"Wanneer de HEERE, uw God, uw landpale zal verwijd hebben, gelijk als Hij tot u gesproken heeft, en gij zeggen zult: Ik zal vlees eten; dewijl uw ziel lust heeft vlees te eten, zo zult gij vlees eten, naar allen lust uwer ziel.","21":"Zo de plaats, die de HEERE, uw God, verkiezen zal, om Zijn Naam aldaar te zetten, verre van u zal zijn, zo zult gij slachten van uw runderen en van uw schapen, die de HEERE u gegeven heeft, gelijk als ik u geboden heb; en gij zult eten in uw poorten, naar allen lust uwer ziel.","22":"Doch gelijk als een ree en een hert gegeten wordt, alzo zult gij dat eten; de onreine en de reine zullen het te zamen eten.","23":"Alleen houdt vast, dat gij het bloed niet eet; want het bloed is de ziel; daarom zult gij de ziel met het vlees niet eten;","24":"Gij zult dat niet eten; op de aarde zult gij het uitgieten als water;","25":"Gij zult dat niet eten; opdat het u, en uw kinderen na u, welga, als gij zult gedaan hebben, wat recht is in de ogen des HEEREN.","26":"Doch uw heilige dingen, die gij hebben zult, en uw geloften zult gij opnemen, en komen tot de plaats, die de HEERE verkiezen zal;","27":"En gij zult uw brandofferen, het vlees en het bloed, bereiden op het altaar des HEEREN, uws Gods; en het bloed uwer slachtofferen zal op het altaar des HEEREN, uws Gods, worden uitgegoten; maar het vlees zult gij eten.","28":"Neemt waar, en hoort al deze woorden, die ik u gebiede, opdat het u, en uw kinderen na u, welga tot in eeuwigheid, als gij zult gedaan hebben wat goed en recht is in de ogen des HEEREN, uws Gods.","29":"Wanneer de HEERE, uw God, voor uw aangezicht zal hebben uitgeroeid de volken, naar dewelke gij heengaat, om die erfelijk te bezitten; en gij die erfelijk zult bezitten, en in hun land wonen;","30":"Wacht u, dat gij niet verstrikt wordt achter hen, nadat zij voor uw aangezicht zullen verdelgd zijn; en dat gij niet vraagt naar hun goden, zeggende: Gelijk als deze volken hun goden gediend hebben, alzo zal ik ook doen.","31":"Gij zult alzo niet doen den HEERE, uw God; want al wat den HEERE een gruwel is, dat Hij haat, hebben zij hun goden gedaan; want zij hebben ook hun zonen en hun dochteren met vuur verbrand voor hun goden.","32":"Al dit woord, hetwelk ik ulieden gebiede, zult gij waarnemen om te doen; gij zult daar niet toedoen, en daarvan niet afdoen."},"KJV":{"1":"These *are* the statutes and judgments, which ye shall observe to do in the land, which the LORD God of thy fathers giveth thee to possess it, all the days that ye live upon the earth.","2":"Ye shall utterly destroy all the places, wherein the nations which ye shall possess served their gods, upon the high mountains, and upon the hills, and under every green tree:","3":"And ye shall overthrow their altars, and break their pillars, and burn their groves with fire; and ye shall hew down the graven images of their gods, and destroy the names of them out of that place.","4":"Ye shall not do so unto the LORD your God.","5":"But unto the place which the LORD your God shall choose out of all your tribes to put his name there, *even* unto his habitation shall ye seek, and thither thou shalt come:","6":"And thither ye shall bring your burnt offerings, and your sacrifices, and your tithes, and heave offerings of your hand, and your vows, and your freewill offerings, and the firstlings of your herds and of your flocks:","7":"And there ye shall eat before the LORD your God, and ye shall rejoice in all that ye put your hand unto, ye and your households, wherein the LORD thy God hath blessed","8":"Ye shall not do after all *the things* that we do here this day, every man whatsoever *is* right in his own eyes.","9":"For ye are not as yet come to the rest and to the inheritance, which the LORD your God giveth","10":"But *when* ye go over Jordan, and dwell in the land which the LORD your God giveth you to inherit, and *when* he giveth you rest from all your enemies round about, so that ye dwell in safety;","11":"Then there shall be a place which the LORD your God shall choose to cause his name to dwell there; thither shall ye bring all that I command you; your burnt offerings, and your sacrifices, your tithes, and the heave offering of your hand, and all your choice vows which ye vow unto the LORD:","12":"And ye shall rejoice before the LORD your God, ye, and your sons, and your daughters, and your menservants, and your maidservants, and the Levite that *is* within your gates; forasmuch as he hath no part nor inheritance","13":"Take heed to thyself that thou offer not thy burnt offerings in every place that thou seest:","14":"But in the place which the LORD shall choose in one of thy tribes, there thou shalt offer thy burnt offerings, and there thou shalt do all that I command","15":"Notwithstanding thou mayest kill and eat flesh in all thy gates, whatsoever thy soul lusteth after, according to the blessing of the LORD thy God which he hath given thee: the unclean and the clean may eat thereof, as of the roebuck, and as of the hart.","16":"Only ye shall not eat the blood; ye shall pour it upon the earth as water.","17":"Thou mayest not eat within thy gates the tithe of thy corn, or of thy wine, or of thy oil, or the firstlings of thy herds or of thy flock, nor any of thy vows which thou vowest, nor thy freewill offerings, or heave offering of thine hand:","18":"But thou must eat them before the LORD thy God in the place which the LORD thy God shall choose, thou, and thy son, and thy daughter, and thy manservant, and thy maidservant, and the Levite that *is* within thy gates: and thou shalt rejoice before the LORD thy God in all that thou puttest thine hands","19":"Take heed to thyself that thou forsake not the Levite as long as thou livest upon the earth.","20":"When the LORD thy God shall enlarge thy border, as he hath promised thee, and thou shalt say, I will eat flesh, because thy soul longeth to eat flesh; thou mayest eat flesh, whatsoever thy soul lusteth after.","21":"If the place which the LORD thy God hath chosen to put his name there be too far from thee, then thou shalt kill of thy herd and of thy flock, which the LORD hath given thee, as I have commanded thee, and thou shalt eat in thy gates whatsoever thy soul lusteth after.","22":"Even as the roebuck and the hart is eaten, so thou shalt eat them: the unclean and the clean shall eat *of* them alike.","23":"Only be sure that thou eat not the blood: for the blood *is* the life; and thou mayest not eat the life with the flesh.","24":"Thou shalt not eat it; thou shalt pour it upon the earth as water.","25":"Thou shalt not eat it; that it may go well with thee, and with thy children after thee, when thou shalt do *that which is* right in the sight of the LORD.","26":"Only thy holy things which thou hast, and thy vows, thou shalt take, and go unto the place which the LORD shall choose:","27":"And thou shalt offer thy burnt offerings, the flesh and the blood, upon the altar of the LORD thy God: and the blood of thy sacrifices shall be poured out upon the altar of the LORD thy God, and thou shalt eat the flesh.","28":"Observe and hear all these words which I command thee, that it may go well with thee, and with thy children after thee for ever, when thou doest *that which is* good and right in the sight of the LORD thy God.","29":"When the LORD thy God shall cut off the nations from before thee, whither thou goest to possess them, and thou succeedest them, and dwellest in their land;","30":"Take heed to thyself that thou be not snared by following them, after that they be destroyed from before thee; and that thou enquire not after their gods, saying, How did these nations serve their gods? even so will I do likewise.","31":"Thou shalt not do so unto the LORD thy God: for every abomination to the LORD, which he hateth, have they done unto their gods; for even their sons and their daughters they have burnt in the fire to their gods.","32":"What thing soever I command you, observe to do it: thou shalt not add thereto, nor diminish"}},"tsk":{"1":[{"kopje":"de inzettingen","refs":["Deut 4:1","Deut 4:2","Deut 4:5","Deut 4:45","Deut 6:1","Deut 6:2"]},{"kopje":"al de dagen","refs":["Deut 12:19","Deut 4:19","1 Kon 8:40","Job 7:1","Ps 104:33","Ps 146:2"]}],"2":[{"kopje":"volledig","refs":["Deut 7:5","Deut 7:25","Deut 7:26","Ex 23:24","Ex 34:12-17","Num 33:51","Num 33:52","Richt 2:2"]},{"kopje":"verdrijven","refs":["Num 22:41","2 Kon 16:4","2 Kon 17:10","2 Kon 17:11","2 Kon 23:13","Jer 3:6","Ezech 20:28","Ezech 20:29","Hos 4:13"]}],"3":[{"kopje":"u zult","refs":["Num 33:52","Richt 2:2","2 Kron 31:1"]},{"kopje":"met vuur verbranden","refs":["1 Kon 15:13","2 Kon 18:4","2 Kon 23:14","2 Kron 14:3","2 Kron 19:3","2 Kron 34:3","Jer 17:2","Micha 5:13"]},{"kopje":"en omhakken","refs":["Ex 23:13","Ps 16:4","Hos 2:16","Zach 13:2","Openb 12:18"]}],"5":[{"kopje":"Maar naar","refs":["Deut 12:11","Deut 16:2","Deut 26:2","Joz 9:27","Joz 18:1","1 Kon 8:16","1 Kon 8:20","1 Kon 8:29","1 Kon 14:21","1 Kron 22:1","2 Kron 7:12","Ps 78:68","Ps 87:2","Ps 87:3","Joh 4:20-22","Hebr 12:22","Openb 14:1"]},{"kopje":"woning","refs":["Ex 15:2","Ex 25:22","Num 7:89","1 Kon 8:27","Ps 132:13","Ps 132:14","Jes 66:1","Jes 66:2","Hand 7:48-50","Ef 2:20-22","Kol 2:9"]}],"6":[{"kopje":"uw brandoffers","refs":["Lev 17:3-9","Ezech 20:40"]},{"kopje":"tienden","refs":["Deut 12:17","De ss=\"wl wl-kjv\" data-code=\"H6\">destroy</span> all the <span class=\"wl wl-kjv\" data-code=\"H4725\">places,</span> wherein the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> <span class=\"wl wl-kjv\" data-code=\"H834\">which</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7311\">high</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H1389\">hills,</span> and under every <span class=\"wl wl-kjv\" data-code=\"H7488\">green</span> tree:","3":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H5422\">overthrow</span> their <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> their <span class=\"wl wl-kjv\" data-code=\"H4676\">pillars,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> their <span class=\"wl wl-kjv\" data-code=\"H842\">groves</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> and ye shall hew <span class=\"wl wl-kjv\" data-code=\"H1438\">down</span> the graven <span class=\"wl wl-kjv\" data-code=\"H6456\">images</span> of their <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> of them out of that place.","4":"Ye shall not do <span class=\"wl wl-kjv\" data-code=\"H6213\">so</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","5":"But unto the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> out of all your <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> to <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> there, even unto his <span class=\"wl wl-kjv\" data-code=\"H7933\">habitation</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H1875\">seek,</span> and thither thou shalt come:","6":"And thither ye shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> your burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and your <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices,</span> and your <span class=\"wl wl-kjv\" data-code=\"H4643\">tithes,</span> and heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offerings</span> of your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and your <span class=\"wl wl-kjv\" data-code=\"H5088\">vows,</span> and your freewill <span class=\"wl wl-kjv\" data-code=\"H5071\">offerings,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1062\">firstlings</span> of your <span class=\"wl wl-kjv\" data-code=\"H1241\">herds</span> and of your flocks:","7":"And there ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> in all that ye <span class=\"wl wl-kjv\" data-code=\"H4916\">put</span> your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto, ye and your <span class=\"wl wl-kjv\" data-code=\"H1004\">households,</span> wherein the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath blessed","8":"Ye shall not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> after all the things that we <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> here this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> whatsoever is <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in his own eyes.","9":"For ye are not as yet <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H4496\">rest</span> and to the <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> giveth","10":"But when ye go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> giveth you to <span class=\"wl wl-kjv\" data-code=\"H5157\">inherit,</span> and when he giveth you <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> from all your <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> so that ye <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in safety;","11":"Then there shall be a <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> to cause his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> to <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> there; thither shall ye <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> all that I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> you; your burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and your <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices,</span> your <span class=\"wl wl-kjv\" data-code=\"H4643\">tithes,</span> and the heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> of your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and all your <span class=\"wl wl-kjv\" data-code=\"H4005\">choice</span> <span class=\"wl wl-kjv\" data-code=\"H5088\">vows</span> which ye <span class=\"wl wl-kjv\" data-code=\"H5087\">vow</span> unto the LORD:","12":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> ye, and your <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and your <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and your <span class=\"wl wl-kjv\" data-code=\"H5650\">menservants,</span> and your <span class=\"wl wl-kjv\" data-code=\"H519\">maidservants,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite</span> that is within your <span class=\"wl wl-kjv\" data-code=\"H8179\">gates;</span> <span class=\"wl wl-kjv\" data-code=\"H3588\">forasmuch</span> as he hath no <span class=\"wl wl-kjv\" data-code=\"H2506\">part</span> nor inheritance","13":"Take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to thyself that thou <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> not thy burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> in every <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> that thou seest:","14":"But in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes,</span> there thou shalt <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> thy burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and there thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all that I command","15":"Notwithstanding thou mayest <span class=\"wl wl-kjv\" data-code=\"H2076\">kill</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> in all thy <span class=\"wl wl-kjv\" data-code=\"H8179\">gates,</span> whatsoever thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> lusteth <span class=\"wl wl-kjv\" data-code=\"H185\">after,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> which he hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> thee: the <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> and the <span class=\"wl wl-kjv\" data-code=\"H2889\">clean</span> may <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> thereof, as of the <span class=\"wl wl-kjv\" data-code=\"H6643\">roebuck,</span> and as of the hart.","16":"Only ye shall not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood;</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H8210\">pour</span> it upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> as water.","17":"Thou <span class=\"wl wl-kjv\" data-code=\"H3201\">mayest</span> not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> within thy <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithe</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> or of thy <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> or of thy <span class=\"wl wl-kjv\" data-code=\"H3323\">oil,</span> or the <span class=\"wl wl-kjv\" data-code=\"H1062\">firstlings</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1241\">herds</span> or of thy <span class=\"wl wl-kjv\" data-code=\"H6629\">flock,</span> nor any of thy <span class=\"wl wl-kjv\" data-code=\"H5088\">vows</span> which thou <span class=\"wl wl-kjv\" data-code=\"H5087\">vowest,</span> nor thy freewill <span class=\"wl wl-kjv\" data-code=\"H5071\">offerings,</span> or heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> of thine hand:","18":"But thou must <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H977\">choose,</span> thou, and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H5650\">manservant,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H519\">maidservant,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite</span> that is within thy <span class=\"wl wl-kjv\" data-code=\"H8179\">gates:</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in all that thou <span class=\"wl wl-kjv\" data-code=\"H4916\">puttest</span> thine hands","19":"Take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to thyself that thou <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> not the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite</span> as long as thou <span class=\"wl wl-kjv\" data-code=\"H3117\">livest</span> upon the earth.","20":"When the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H7337\">enlarge</span> thy <span class=\"wl wl-kjv\" data-code=\"H1366\">border,</span> as he hath <span class=\"wl wl-kjv\" data-code=\"H1696\">promised</span> thee, and thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I will <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> because thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H183\">longeth</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh;</span> thou mayest <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> whatsoever thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> lusteth after.","21":"If the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> to <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> there be too <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from thee, then thou shalt <span class=\"wl wl-kjv\" data-code=\"H2076\">kill</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1241\">herd</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H6629\">flock,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> thee, as I have <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> thee, and thou shalt <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> in thy <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> whatsoever thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> lusteth after.","22":"Even as the <span class=\"wl wl-kjv\" data-code=\"H6643\">roebuck</span> and the <span class=\"wl wl-kjv\" data-code=\"H354\">hart</span> is <span class=\"wl wl-kjv\" data-code=\"H398\">eaten,</span> so thou shalt <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> them: the <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> and the <span class=\"wl wl-kjv\" data-code=\"H2889\">clean</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of them alike.","23":"Only be <span class=\"wl wl-kjv\" data-code=\"H2388\">sure</span> that thou <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> not the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> is the <span class=\"wl wl-kjv\" data-code=\"H5315\">life;</span> and thou mayest not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> with the flesh.","24":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it; thou shalt <span class=\"wl wl-kjv\" data-code=\"H8210\">pour</span> it upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> as water.","25":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it; that it may go <span class=\"wl wl-kjv\" data-code=\"H3190\">well</span> with thee, and with thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> thee, when thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> that which is <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of th n"},{"catchword":"bossen met vuur verbranden,","tekst":"Dichte, duistere bossen, ter afgoderij misbruikt, alsof duisternis tot religieusheid diende en enige heiligheid aan zich had."}],"4":[{"catchword":"alzo niet doen","tekst":"Gelijk de heidenen, die afgoderij aanstelden in alle plaatsen, waar het hun lustte."}],"5":[{"catchword":"plaats,","tekst":"De vaste plaats, waartoe naderhand door God verkoren en geordineerd is Jeruzalem. Zie 2Sa 7, en 2Sa 24; 1Ch 22; Psa 122:1-4, en Psa 132:13-14. Eer Jeruzalem daartoe was verordineerd, was er geen vaste plaats, hoewel men God gewoonlijk dienen en raad vragen moest ter plaatse, waar de ark des verbonds of tent der samenkomst door Gods bevel was berustende, gelijk in de volgende boeken zal worden bevonden."},{"catchword":"stammen verkiezen zal,","tekst":"Den stam van Juda heeft God hiermede vereerd, de andere daarin voorbijgaande. Zie Psa 78:67-69."},{"catchword":"Naam aldaar te zetten,","tekst":"Dat de ark des verbonds, zijnde een bijzonder zichtbaar teken mijner genadige tegenwoordigheid, daar vastelijk in mijn tabernakel of huis beruste, en mijn openbare solemnele godsdienst aldaar verricht worde, enz. Vergelijk 2Sa 6:2; 1Ki 8:29; alzo onder, vs.11, 21, en Deu 14:23-24, en Deu 16:2, Deu 16:6, Deu 16:11, enz."}],"6":[{"catchword":"geloften,","tekst":"Dat is, hetgeen gij den HEERE beloofd hebt te geven."}],"7":[{"catchword":"huizen,","tekst":"Dat is, huisgezinnen."},{"catchword":"over alles,","tekst":"Hebreeuws, over alle uitsteking, allen uitslag, aanslag uwer hand; dat is, alles, waartoe gij uw hand hebt uitgestrekt of uitstrekken moogt. Alzo onder, vs.18, en Deu 15:10, enz."}],"8":[{"catchword":"al wat in zijn ogen recht is","tekst":"Dat is, al hetgeen hemzelven goeddunkt. Hoever zich dit uitstrekte, is te zien in vs.11."}],"11":[{"catchword":"keur uwer geloften,","tekst":"Dat is, wat gij van het beste uitgelezen en den HEERE beloofd hebt."}],"12":[{"catchword":"geen deel noch erve met ulieden","tekst":"Zie boven, Deu 1 at is within your gates for he hath no part nor inheritance with you[ see above chapter 10.9.]"}],"13":[{"catchword":null,"tekst":"Take heed to thyself that thou offer not the burnt offerings in all or every place that thou shalt see [namely with delight.]"}],"14":[{"catchword":null,"tekst":"But in the place which the Lord shall choose in one of the tribes there thou shalt offer the burnt offerings and there thou shalt do all that I command thee."}],"15":[{"catchword":null,"tekst":"Yet according to al the lusts of the soul thou shalt eat and kill flesh according to the blessing of the Lord thy God which he giveth thee in all thy gates [that is in all thy cities or dwelling places and so often ] the unclean and the clean shall eat therefore as of a roc and of a hart [not as holy but as common and permitted food harts and rocs were indeed clean beasts which as common foods which might be eaten below chapter 14but they were not brought for offering so below verse 22 and chapter 15.22.]"}],"16":[{"catchword":null,"tekst":"Only ye shall not eat the blood ye shall pour it out upon the earth as water."}],"17":[{"catchword":null,"tekst":"thou mayst not eat within thy gates the tithe of thy corn and of thine new wine and of thine oil [ see concerning tithes Leviticus 27 on verse 30 ] nor the first born of thine oxen of thine sheep nor any of thy vows which thou shalt have vowed nor thy free will offerings nor the heave offering of thine hand."}],"18":[{"catchword":null,"tekst":"But thou shalt eat it before the face of the Lord thy God in the place which the Lord thy God shall choose thou and thy son and thy daughters and thy maidservants and thy man servants and the Levites that is within thy gates and thou shalt rejoice before the face of the Lord in all that thou hast put thine hands unto [see above verse 7 below chapter 15.7.]"}],"20":[{"catchword":null,"tekst":"when the Lord thy God shall have enlarged thy border according as he hath spoken unto thee and thou shalt say I will eat flesh because thy soul lusteth to eat flesh then thou shalt eat flesh according to all the lust of thy soul."}],"21":[{"catchword":null,"tekst":"If the place which the Lord thy God shall choose to put his name there shall be far off from thee then thou shalt kill of thine oxen and of thy sheep which the Lord hath given thee according as I have commanded thee and thou shalt eat within the gates according to all the lusts of thy soul."}],"22":[{"catchword":null,"tekst":"But according as a roc and a hart are eaten [see above on verse 15] so thou shalt eat it the unclean and the clean shall eat it together."}],"23":[{"catchword":null,"tekst":"Only be sure thou eat not the blood for the blood is the soul [see Leviticus 17 on verse 11] therefore thou shalt not eat the soul with the flesh."}],"24":[{"catchword":null,"tekst":"Thou shalt not pour it upon the earth as water [this ceremony commanded also above verse 16 is here especially inculcated see hereof Gen 9:4 and Lev 27:11.]"}],"25":[{"catchword":null,"tekst":"Thou shalt not eat it that is may go well with thee and with thy children after thee when thou shalt have done that right in the sight of the Lord."}],"26":[{"catchword":null,"tekst":"But thy holy things [Heb. Thy holiness that is things that are hallowed and dedicated unto the Lord as is declared in the sequel] which thou shalt have and thy vowed thou shalt take up and go unto the place which the Lord shall choose."}],"27":[{"catchword":null,"tekst":"And thou shalt prepare thy burnt offering the flesh and the blood upon the altar of the Lord thy god and the blood of thy slay offering shall be poured upon the altarof the Lord thy God but thou shalt eat the flesh."}],"28":[{"catchword":null,"tekst":"Ob serve and hear all the words which I command that it may go well with thee and with thy children after thee forever when thou shalt have done that which is good and right in the eyes of the Lord thy God."}],"29":[{"catchword":null,"tekst":"When the Lord thy God shall have destroyed the nations before thy face whither thou goest to possess them [that is their land as above chapter 9.1 and 11.23&c.] hereditarily thou shalt possess them hereditarily and dwell in their land."}],"30":[{"catchword":null,"tekst":"Take heed of thyself that thou not be snared after them [that is so that thou follow them ] after that they shall be destroyed before thy face and that thou then enquire not after their Gods saying according as the nations have served after Gods so will I do likewise."}],"31":[{"catchword":null,"tekst":"Thou shalt not do so unto the Lord thy God for what so ever is an abomination unto the lord which he hateth they have done unto their Gods for they have also burnt and daughters with fire unto their Gods [that is to honor of their idols of this abomination of the heathen imitated by the back sliding Jews see Jer 7:31 and 19.5 and compare 2Ki 16:3 and 17.17 31 and 32 and 23.10.]"}],"32":[{"catchword":null,"tekst":"All this word [or this whole word the like words see above chapter 42] which I command ye shall observe to do it [others everything which I command ye shall &c.] shalt not add thereunto nor diminish from it [see above chapter 4.2 Prov 30:6 revelations 22.18.]"}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
