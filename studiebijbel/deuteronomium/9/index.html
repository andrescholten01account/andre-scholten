 een verterend vuur: Die zal hen verdelgen, en Die zal hen voor uw aangezicht neerwerpen; en u zult ze uit de bezitting verdrijven, en zult hen snel te niet doen, zoals de HEERE tot u gesproken heeft.","4":"Wanneer de HEERE, uw God, hen nu voor uw aangezicht zal hebben uitgestoten, spreek dan niet in uw hart en zeg: De HEERE heeft mij om mijn gerechtigheid ingebracht, om dit land te erven; want om de goddeloosheid van deze volken verdrijft de HEERE hen voor uw aangezicht uit de bezitting.","5":"Niet om uw gerechtigheid, noch om de oprechtheid van uw hart, komt u daar binnen om hun land te erven; maar om de goddeloosheid van deze volken verdrijft de HEERE, uw God, hen voor uw aangezicht uit de bezitting: en om het woord te bevestigen dat de HEERE, uw God, aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft.","6":"Weet dan, dat de HEERE, uw God, u niet om uw gerechtigheid dit goede land geeft om dat te erven; want u bent een hardnekkig volk.","7":"Denk eraan, vergeet niet, dat u de HEERE, uw God, in de woestijn zeer vertoornd hebt; vanaf de dag dat u uit het land Egypte bent uitgegaan, totdat u kwam bij deze plaats, bent u opstandig geweest tegen de HEERE.","8":"Want bij Horeb vertoornde u de HEERE zeer, zodat Hij Zich tegen u vertoornde, om u te verdelgen.","9":"Toen ik op de berg geklommen was, om de stenen tafelen te ontvangen, de tafelen van het verbond dat de HEERE met u gemaakt had, bleef ik veertig dagen en veertig nachten op de berg, ik at geen brood en dronk geen water.","10":"En de HEERE gaf mij de twee stenen tafelen, beschreven met Gods vinger; en daarop stonden al de woorden die de HEERE op de berg, uit het midden van het vuur, op de dag van de verzameling, met u gesproken had.","11":"Zo gebeurde het, na verloop van veertig dagen en veertig nachten, dat de HEERE mij de twee stenen tafelen, de tafelen van het verbond, gaf,","12":"Dat de HEERE tot mij zei: Sta op, ga haastig van hier naar beneden; want uw volk, dat u uit Egypte hebt uitgevoerd, heeft het verdorven; zij zijn snel afgeweken van de weg die Ik hun geboden had; zij hebben zich een gegoten beeld gemaakt.","13":"Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.","14":"Laat Mij begaan, dat Ik hen verdelg, en hun naam van onder de hemel uitwis; en Ik zal u tot een machtiger en groter volk maken dan dit is.","15":"Toen keerde ik mij om, en ging van de berg af; de berg brandde nu van vuur, en de twee tafelen van het verbond waren op mijn beide handen.","16":"En ik zag toe, en zie, u had tegen de HEERE, uw God, gezondigd; u had u een gegoten kalf gemaakt; u was snel afgeweken van de weg die de HEERE u geboden had.","17":"Toen greep ik de twee tafelen, en wierp ze uit mijn beide handen, en brak ze voor uw ogen.","18":"En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken.","19":"Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment.","20":"Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.","21":"Maar uw zonde, het kalf dat u had gemaakt, nam ik, en verbrandde het met vuur, en stampte het, en maalde het fijn, totdat het verpulverd was tot stof; en zijn stof wierp ik in de beek die van de berg afvloeide.","22":"Ook vertoornde u de HEERE zeer te Thab-era en te Massa, en te Kibroth-thaava.","23":"Verder, toen de HEERE u zond uit Kades-barnea en zei: Ga op en erf dat land dat Ik u gegeven heb; toen was u opstandig tegen het bevel van de HEERE, uw God, en geloofde Hem niet, en was Zijn stem niet gehoorzaam.","24":"Opstandig bent u geweest tegen de HEERE, vanaf de dag dat ik u gekend heb.","25":"En ik wierp mij neer voor het aangezicht van de HEERE, die veertig dagen en veertig nachten waarin ik mij neerwierp, omdat de HEERE gezegd had dat Hij u verdelgen zou.","26":"En ik bad tot de HEERE, en zei: Heere, HEERE, verderf Uw volk en Uw erfdeel niet, dat U door Uw grootheid verlost hebt; dat U uit Egypte door een sterke hand hebt uitgevoerd.","27":"Denk aan Uw knechten, Abraham, Izak en Jakob; zie niet op de hardheid van dit volk, noch op zijn goddeloosheid, noch op zijn zonde;","28":"Opdat het land, van waar U ons hebt uitgevoerd, niet zegt: Omdat de HEERE hen niet kon brengen in het land waarvan Hij hun gesproken had, en omdat Hij hen haatte, heeft Hij ze uitgevoerd om hen te doden in de woestijn.","29":"Zij zijn toch Uw volk, en Uw erfdeel, dat U door Uw grote kracht, en door Uw uitgestrekte arm hebt uitgevoerd!"},"SV":{"1":"Hoor, Israël! gij zult heden over de Jordaan gaan, dat gij inkomt, om volken te erven, die groter en sterker zijn dan gij; steden, die groot en tot in den hemel gesterkt zijn;","2":"Een groot en lang volk, kinderen der Enakieten; die gij kent, en *van* *welke* gij gehoord hebt: Wie zou bestaan voor het aangezicht der kinderen van Enak?","3":"Zo zult gij heden weten, dat de HEERE, uw God, Degene is, die voor uw aangezicht doorgaat, een verterend vuur: Die zal hen verdelgen, en Die zal hen voor uw aangezicht nederwerpen; en gij zult ze uit de bezitting verdrijven, en zult hen haastelijk te niet doen, gelijk als de HEERE tot u gesproken heeft.","4":"Wanneer hen nu de HEERE, uw God, voor uw aangezicht zal hebben uitgestoten, zo spreek niet in uw hart, zeggende: De HEERE heeft mij om mijn gerechtigheid ingebracht, om dit land te erven; want, om de goddeloosheid dezer volken, verdrijft hen de HEERE voor uw aangezicht uit de bezitting.","5":"Niet om uw gerechtigheid, noch om de oprechtheid uws harten, komt gij er henen in, om hun land te erven; maar om de goddeloosheid dezer volken, verdrijft hen de HEERE, uw God, voor uw aangezicht uit de bezitting: en om het woord te bevestigen, dat de HEERE, uw God, aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft.","6":"Weet dan, dat u de HEERE, uw God, niet om uw gerechtigheid, ditzelve goede land geeft, om dat te erven; want gij zijt een hardnekkig volk.","7":"Gedenk, vergeet niet, dat gij den HEERE, uw God, in de woestijn, zeer vertoornd hebt; van dien dag af, dat gij uit Egypteland uitgegaan zijt, totdat gij kwaamt aan deze plaats, zijt gijlieden wederspannig geweest tegen den HEERE.","8":"Want aan Horeb vertoorndet gij den HEERE zeer, dat Hij Zich tegen u vertoornde, om u te verdelgen.","9":"Als ik op den berg geklommen was, om te ontvangen de stenen tafelen, de tafelen des verbonds, dat de HEERE met ulieden gemaakt had, toen bleef ik veertig dagen en veertig nachten op den berg, at geen brood, en dronk geen water.","10":"En de HEERE gaf mij de twee stenen tafelen, met Gods vinger beschreven; en op dezelve, naar al de woorden, die de HEERE op den berg, uit het midden des vuurs, ten dage der verzameling, met ulieden gesproken had.","11":"Zo geschiedde het, ten einde van veertig dagen en veertig nachten, *als* mij de HEERE de twee stenen tafelen, de tafelen des verbonds, gaf,","12":"Dat de HEERE tot mij zeide: Sta op, ga haastelijk af van hier; want uw volk, dat gij uit Egypte hebt uitgevoerd, heeft het verdorven; zij zijn haastelijk afgeweken van den weg, dien Ik hun geboden had; zij hebben zich een gegoten beeld gemaakt.","13":"Voorts sprak de HEERE tot mij, zeggende: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.","14":"Laat van Mij af, dat Ik hen verdelge, en hun naam van onder den hemel uitdoe; en Ik zal u tot een machtiger en meerder volk maken, dan dit is.","15":"Toen keerde ik mij, en ging van den berg af; de berg nu brandde van vuur, en de twee tafelen des verbonds waren op beide mijn handen.","16":"En ik zag toe, en ziet, gij hadt tegen den HEERE, uw God, gezondigd; gij hadt u een gegoten kalf gemaakt; gij waart haastelijk afgeweken van den weg, dien u de HEERE geboden had.","17":"Toen vatte ik de twee tafelen, en wierp ze heen uit beide mijn handen, en brak ze voor uw ogen.","18":"En ik wierp mij neder voor het aangezicht des HEEREN, als in het eerst, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die gij hadt gezondigd, doende dat kwaad is in des HEEREN ogen, om Hem tot toorn te verwekken.","19":"Want ik vreesde vanwege den toorn en de grimmigheid waarmede de HEERE zeer op ulieden vertoornd was, om u te verdelgen; doch de HEERE verhoorde mij ook op dat maal.","20":"Ook vertoornde Zich de HEERE zeer tegen Aäron, om hem te verdelgen; doch ik bad ook ter zelver tijd voor Aäron.","21":"Maar uw zonde, het kalf, dat gij hadt gemaakt, nam ik, en verbrandde het met vuur, en stampte het, malende het wel, totdat het verdund werd tot stof; en zijn stof wierp ik in de beek, die van den berg afvliet.","22":"Ook vertoorndet gij den HEERE zeer te Thab-era en te Massa, en te Kibroth-thaava.","23":"Voorts als de HEERE ulieden zond uit Kades-barnea, zeggende: Gaat op en erft dat land, dat Ik u gegeven heb; zo waart gij den mond des HEEREN, uws Gods, wederspannig, en geloofdet Hem niet, en waart Zijn stem niet gehoorzaam.","24":"Wederspannig zijt gij geweest tegen den HEERE, van den dag af, dat ik u gekend heb.","25":"En ik wierp mij neder voor des HEEREN aangezicht, die veertig dagen en veertig nachten, in welke ik mij nederwierp, dewijl de HEERE gezegd had, dat Hij u verdelgen zou.","26":"En ik bad tot den HEERE, en zeide: Heere, HEERE, verderf Uw volk en Uw erfdeel niet, dat Gij door Uw grootheid verlost hebt; dat Gij uit Egypte door een sterke hand hebt uitgevoerd.","27":"Gedenk aan Uw knechten, Abraham, Izak en Jakob; zie niet op de hardigheid dezes volks, noch op zijn goddeloosheid, noch op zijn zonde;","28":"Opdat het land, van waar Gij ons hebt uitgevoerd, niet zegge: Omdat ze de HEERE niet kon brengen in het land, waarvan Hij hun gesproken had, en omdat Hij hen haatte, heeft Hij ze uitgevoerd, om hen te doden in de woestijn.","29":"Zij zijn toch Uw volk, en Uw erfdeel, dat Gij door Uw grote kracht, en door Uw uitgestrekten arm hebt uitgevoerd!"},"KJV":{"1":"Hear, O Israel: Thou *art* to pass over Jordan this day, to go in to possess nations greater and mightier than thyself, cities great and fenced up to heaven,","2":"A people great and tall, the children of the Anakims, whom thou knowest, and *of whom* thou hast heard *say*, Who can stand before the children of Anak!","3":"Understand therefore this day, that the LORD thy God *is* he which goeth over before thee; *as* a consuming fire he shall destroy them, and he shall bring them down before thy face: so shalt thou drive them out, and destroy them quickly, as the LORD hath said","4":"Speak not thou in thine heart, after that the LORD thy God hath cast them out from before thee, saying, For my righteousness the LORD hath brought me in to possess this land: but for the wickedness of these nations the LORD doth drive them out from before","5":"Not for thy righteousness, or for the uprightness of thine heart, dost thou go to possess their land: but for the wickedness of these nations the LORD thy God doth drive them out from before thee, and that he may perform the word which the LORD sware unto thy fathers, Abraham, Isaac, and Jacob.","6":"Understand therefore, that the LORD thy God giveth thee not this good land to possess it for thy righteousness; for thou *art* a stiffnecked people.","7":"Remember, *and* forget not, how thou provokedst the LORD thy God to wrath in the wilderness: from the day that thou didst depart out of the land of Egypt, until ye came unto this place, ye have been rebellious against the LORD.","8":"Also in Horeb ye provoked the LORD to wrath, so that the LORD was angry with you to have destroyed","9":"When I was gone up into the mount to receive the tables of stone, *even* the tables of the covenant which the LORD made with you, then I abode in the mount forty days and forty nights, I neither did eat bread nor drink water:","10":"And the LORD delivered unto me two tables of stone written with the finger of God; and on them *was written* according to all the words, which the LORD spake with you in the mount out of the midst of the fire in the day of the assembly.","11":"And it came to pass at the end of forty days and forty nights, *that* the LORD gave me the two tables of stone, *even* the tables of the covenant.","12":"And the LORD said unto me, Arise, get thee down quickly from hence; for thy people which thou hast brought forth out of Egypt have corrupted *themselves*; they are quickly turned aside out of the way which I commanded them; they have made them a molten image.","13":"Furthermore the LORD spake unto me, saying, I have seen this people, and, behold, it *is* a stiffnecked people:","14":"Let me alone, that I may destroy them, and blot out their name from under heaven: and I will make of thee a nation mightier and greater","15":"So I turned and came down from the mount, and the mount burned with fire: and the two tables of the covenant *were* in my two hands.","16":"And I looked, and, behold, ye had sinned against the LORD your God, *and* had made you a molten calf: ye had turned aside quickly out of the way which the LORD had commanded","17":"And I took the two tables, and cast them out of my two hands, and brake them before your eyes.","18":"And I fell down before the LORD, as at the first, forty days and forty nights: I did neither eat bread, nor drink water, because of all your sins which ye sinned, in doing wickedly in the sight of the LORD, to provoke him to anger.","19":"For I was afraid of the anger and hot displeasure, wherewith the LORD was wroth against you to destroy you. But the LORD hearkened unto me at that time","20":"And the LORD was very angry with Aaron to have destroyed him: and I prayed for Aaron also the same time.","21":"And I took your sin, the calf which ye had made, and burnt it with fire, and stamped it, *and* ground *it* very small, *even* until it was as small as dust: and I cast the dust thereof into the brook that descended out of the mount.","22":"And at Taberah, and at Massah, and at Kibrothhattaavah, ye provoked the LORD to wrath.","23":"Likewise when the LORD sent you from Kadeshbarnea, saying, Go up and possess the land which I have given you; then ye rebelled against the commandment of the LORD your God, and ye believed him not, nor hearkened to his voice.","24":"Ye have been rebellious against the LORD from the day that I knew","25":"Thus I fell down before the LORD forty days and forty nights, as I fell down *at the first*; because the LORD had said he would destroy","26":"I prayed therefore unto the LORD, and said, O Lord GOD, destroy not thy people and thine inheritance, which thou hast redeemed through thy greatness, which thou hast brought forth out of Egypt with a mighty hand.","27":"Remember thy servants, Abraham, Isaac, and Jacob; look not unto the stubbornness of this people, nor to their wickedness, nor to their sin:","28":"Lest the land whence thou broughtest us out say, Because the LORD was not able to bring them into the land which he promised them, and because he hated them, he hath brought them out to slay them in the wilderness.","29":"Yet they *are* thy people and thine inheritance, which thou broughtest out by thy mighty power and by thy stretched out arm."}},"tsk":{"1":[{"kopje":"binnen te komen","refs":["Deut 3:18","Deut 11:31","Deut 27:2","Joz 1:11","Joz 3:6","Joz 3:14","Joz 3:16","Joz 4:5","Joz 4:19"]},{"kopje":"volken","refs":["Deut 4:38","Deut 7:1","Deut 11:23"]},{"kopje":"steden","refs":["Deut 1:28","Num 13:22","Num 13:28-33"]}],"2":[{"kopje":"groot","refs":["Deut 2:11","Deut 2:12","Deut 2:21"]},{"kopje":"Wie zou standhouden","refs":["Deut 7:24","Ex 9:11","Job 11:10","Dan 8:4","Dan 11:16","Nahum 1:6"]}],"3":[{"kopje":"weten","refs":["Deut 9:6","Matt 15:10","Mark 7:14","Ef 5:17"]},{"kopje":"doorgaat","refs":["Deut 1:30","Deut 20:4","Deut 31:3- a-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee; as a <span class=\"wl wl-kjv\" data-code=\"H398\">consuming</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> he shall <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> them, and he shall bring them <span class=\"wl wl-kjv\" data-code=\"H3665\">down</span> before thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face:</span> so shalt thou drive them <span class=\"wl wl-kjv\" data-code=\"H3423\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> them <span class=\"wl wl-kjv\" data-code=\"H4118\">quickly,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath said","4":"<span class=\"wl wl-kjv\" data-code=\"H559\">Speak</span> not thou in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> after that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath cast them <span class=\"wl wl-kjv\" data-code=\"H1920\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> For my <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath brought me <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> this <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> but for the <span class=\"wl wl-kjv\" data-code=\"H7564\">wickedness</span> of these <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> doth drive them <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> from before","5":"Not for thy <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness,</span> or for the <span class=\"wl wl-kjv\" data-code=\"H3476\">uprightness</span> of thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> dost thou <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> their <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> but for the <span class=\"wl wl-kjv\" data-code=\"H7564\">wickedness</span> of these <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> doth drive them <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, and that he may <span class=\"wl wl-kjv\" data-code=\"H6965\">perform</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and Jacob.","6":"<span class=\"wl wl-kjv\" data-code=\"H3045\">Understand</span> therefore, that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> thee not this <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it for thy <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness;</span> for thou art a <span class=\"wl wl-kjv\" data-code=\"H6203\">stiffnecked</span> people.","7":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Remember,</span> and <span class=\"wl wl-kjv\" data-code=\"H7911\">forget</span> not, how thou provokedst the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to <span class=\"wl wl-kjv\" data-code=\"H7107\">wrath</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness:</span> <span class=\"wl wl-kjv\" data-code=\"H4480\">from</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that thou didst depart <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> until ye <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto this <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> ye have been <span class=\"wl wl-kjv\" data-code=\"H4784\">rebellious</span> <span class=\"wl wl-kjv\" data-code=\"H5973\">against</span> the LORD.","8":"Also in <span class=\"wl wl-kjv\" data-code=\"H2722\">Horeb</span> ye <span class=\"wl wl-kjv\" data-code=\"H7107\">provoked</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H7107\">wrath,</span> so that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H599\">angry</span> with you to have destroyed","9":"When I was gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> the <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> even the <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> with you, then I <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> and <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3915\">nights,</span> I neither did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> water:","10":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> unto me <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> with the <span class=\"wl wl-kjv\" data-code=\"H676\">finger</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> and on them was written according to all the <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> with you in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the assembly.","11":"And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> and <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3915\">nights,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> me the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> even the <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> of the covenant.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> get thee <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H4118\">quickly</span> from hence; for thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> which thou hast brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> have <span class=\"wl wl-kjv\" data-code=\"H7843\">corrupted</span> themselves; they are <span class=\"wl wl-kjv\" data-code=\"H4118\">quickly</span> turned <span class=\"wl wl-kjv\" data-code=\"H5493\">aside</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> which I <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them; they have <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> them a molten image.","13":"Furthermore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and, behold, it is a <span class=\"wl wl-kjv\" data-code=\"H6203\">stiffnecked</span> people:","14":"Let me <span class=\"wl wl-kjv\" data-code=\"H7503\">alone,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> them, and blot <span class=\"wl wl-kjv\" data-code=\"H4229\">out</span> their <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> from under <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H854\">of</span> thee a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> <span class=\"wl wl-kjv\" data-code=\"H6099\">mightier</span> and greater","15":"So I <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> and came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H1197\">burned</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> and the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> were in my <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> hands.","16":"And I <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and, behold, ye had <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> you a <span class=\"wl wl-kjv\" data-code=\"H4541\">molten</span> <span class=\"wl wl-kjv\" data-code=\"H5695\">calf:</span> ye had turned <span class=\"wl wl-kjv\" data-code=\"H5493\">aside</span> <span class=\"wl wl-kjv\" data-code=\"H4118\">quickly</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had commanded","17":"And I <span class=\"wl wl-kjv\" data-code=\"H8610\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3871\">tables,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> them out <span class=\"wl wl-kjv\" data-code=\"H5921\">of</span> my <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and <span class=\"wl wl-kjv\" data-code=\"H7665\">brake</span> them before your eyes.","18":"And I fell <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as at the <span class=\"wl wl-kjv\" data-code=\"H7223\">first,</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> and <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3915\">nights:</span> I did neither <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> because of all your <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> which ye <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned,</span> in <span class=\"wl wl-kjv\" data-code=\"H6213\">doing</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedly</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to provoke him to anger.","19":"For I was <span class=\"wl wl-kjv\" data-code=\"H3025\">afraid</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> and hot <span class=\"wl wl-kjv\" data-code=\"H2534\">displeasure,</span> wherewith the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth</span> against you to <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> you. But the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto me at that time","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H599\">angry</span> with <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> to have <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> him: and I <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> for <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> also the same time.","21":"And I <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> your <span class=\"wl wl-kjv\" data-code=\"H2403\">sin,</span> the <span class=\"wl wl-kjv\" data-code=\"H5695\">calf</span> which ye had <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> it with <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and <span class=\"wl wl-kjv\" data-code=\"H3807\">stamped</span> it, and <span class=\"wl wl-kjv\" data-code=\"H2912\">ground</span> it very <span class=\"wl wl-kjv\" data-code=\"H3190\">small,</span> even until it was as <span class=\"wl wl-kjv\" data-code=\"H1854\">small</span> as <span class=\"wl wl-kjv\" data-code=\"H6083\">dust:</span> and I <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> thereof into the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> that descended <span class=\"wl wl-kjv\" data-code=\"H3381\">out</span> of the mount.","22":"And at <span class=\"wl wl-kjv\" data-code=\"H8404\">Taberah,</span> and at <span class=\"wl wl-kjv\" data-code=\"H4532\">Massah,</span> and at <span class=\"wl wl-kjv\" data-code=\"H6914\">Kibrothhattaavah,</span> ye provoked the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to wrath.","23":"Likewise when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> you from <span class=\"wl wl-kjv\" data-code=\"H6947\">Kadeshbarnea,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you; then ye <span class=\"wl wl-kjv\" data-code=\"H4784\">rebelled</span> against the <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H539\">believed</span> him not, nor <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> to his voice.","24":"Ye have been <span class=\"wl wl-kjv\" data-code=\"H4784\">rebellious</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> from the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that I knew","25":"Thus I fell <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> and <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3915\">nights,</span> as I fell <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> at the first; because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> he would destroy","26":"I <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> therefore unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> not thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> and thine <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed</span> through thy <span class=\"wl wl-kjv\" data-code=\"H1433\">greatness,</span> which thou hast brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> with a <span class=\"wl wl-kjv\" data-code=\"H2389\">mighty</span> hand.","27":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Remember</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob;</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">look</span> not unto the <span class=\"wl wl-kjv\" data-code=\"H7190\">stubbornness</span> of this <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> nor to their <span class=\"wl wl-kjv\" data-code=\"H7562\">wickedness,</span> nor to their sin:","28":"Lest the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> whence thou broughtest us <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was not <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> them into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">promised</span> them, and because he <span class=\"wl wl-kjv\" data-code=\"H8135\">hated</span> them, he hath brought them <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> them in the wilder const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
