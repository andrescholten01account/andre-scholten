 "href": "../../deuteronomium/20/#v19", "ref": "Deut 20:19", "svLabel": null}, {"disp": "Deut 20:20", "href": "../../deuteronomium/20/#v20", "ref": "Deut 20:20", "svLabel": null}], "kinderen": []}]}, {"topic": "Siege", "href": "../../nave/s/#t-siege", "kinderen": [{"label": "Conducted by erecting embankments parallel to the walls of the besieged city", "href": "../../nave/s/?hl=Deut.20.20#i19042", "refs": [{"disp": "Deut 20:19", "href": "../../deuteronomium/20/#v19", "ref": "Deut 20:19", "svLabel": null}, {"disp": "Deut 20:20", "href": "../../deuteronomium/20/#v20", "ref": "Deut 20:20", "svLabel": null}, {"disp": "Jes 29:3", "href": "../../jesaja/29/#v3", "ref": "Jes 29:3", "svLabel": null}, {"disp": "Jes 37:33", "href": "../../jesaja/37/#v33", "ref": "Jes 37:33", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Sieges", "href": "../../torrey/s/#t-sieges", "kinderen": [{"label": "The Jews forbidden to cut down fruit trees for the purpose of", "href": "../../torrey/s/?hl=Deut.20.20#i19794", "refs": [{"disp": "Deut 20:19", "href": "../../deuteronomium/20/#v19", "ref": "Deut 20:19", "svLabel": null}, {"disp": "Deut 20:20", "href": "../../deuteronomium/20/#v20", "ref": "Deut 20:20", "svLabel": null}], "kinderen": []}]}, {"topic": "Trees", "href": "../../torrey/t/#t-trees", "kinderen": [{"label": "Were Cut Down", "href": "../../torrey/t/?hl=Deut.20.20#i21720", "refs": [], "kinderen": [{"label": "By besieging armies for erecting forts", "href": "../../torrey/t/?hl=Deut.20.20#i21723", "refs": [{"disp": "Deut 20:20", "href": "../../deuteronomium/20/#v20", "ref": "Deut 20:20", "svLabel": null}, {"disp": "Jer 6:6", "href": "../../jeremia/6/#v6", "ref": "Jer 6:6", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Deut 31:23": "En Hij gebood Jozua, de zoon van Nun, en zei: Wees sterk en heb goede moed, want u zult de kinderen van Israël brengen in het land, dat Ik hun gezworen heb; en Ik zal met u zijn.", "Richt 7:25": "En zij vingen twee vorsten van de Midianieten, Oreb en Zeëb, en doodden Oreb op de rots Oreb, en Zeëb doodden zij bij de perskuip van Zeëb, en achtervolgden de Midianieten; en zij brachten de hoofden van Oreb en Zeëb naar Gideon, aan de overkant van de Jordaan.", "Luk 14:18-20": "En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd. En een ander zei: Ik heb vijf span ossen gekocht, en ik ga erheen om ze te proberen; ik vraag u, houd mij voor verontschuldigd. En weer een ander zei: Ik ben getrouwd, en daarom kan ik niet komen.", "Mark 16:6": "Maar hij zei tegen hen: Wees niet verbaasd; u zoekt Jezus de Nazarener, Die gekruisigd was; Hij is opgestaan; Hij is hier niet; zie de plaats waar zij Hem gelegd hadden.", "Ps 37:40": "En de HEERE zal hen helpen, en zal hen bevrijden; Hij zal hen bevrijden van de goddelozen, en zal hen behouden; want zij vertrouwen op Hem.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Spr 29:25": "De angst voor mensen legt een strik; maar wie op de HEERE vertrouwt, zal veilig gesteld worden.", "Deut 1:15": "Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen.", "Jes 34:6": "Het zwaard van de HEERE is vol bloed, het is vet geworden van vet, van het bloed van de lammeren en de bokken, van het vet van de nieren van de rammen; want de HEERE heeft een offer in Bozra, en een grote slachting in het land van de Edomieten.", "Deut 20:10-12": "Wanneer u nadert tot een stad om tegen haar te strijden, dan zult u haar vrede toeroepen. En het zal gebeuren, als zij u vrede antwoordt, en voor u opendoet, dan zal al het volk dat daarin gevonden wordt, u schatplichtig zijn, en u dienen. Maar als zij geen vrede met u zal maken, maar oorlog tegen u voert, dan zult u haar belegeren.", "2 Kor 5:18-21": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft. Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd. Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Deut 1:28": "Waarheen zouden wij optrekken? Onze broeders hebben ons hart doen smelten, en zeiden: Het is een volk, groter en langer dan wij; de steden zijn groot, en versterkt tot aan de hemel toe; ook hebben wij daar kinderen van de Enakieten gezien.", "Deut 21:10": "Wanneer u uittrekt ten strijde tegen uw vijanden, en de HEERE, uw God, hen in uw hand gegeven heeft, zodat u hun gevangenen gevankelijk wegvoert;", "Job 15:24": "Angst en benauwdheid verschrikken hem; zij overweldigt hem, als een koning die bereid is ten strijde.", "Joz 11:19": "Er was geen stad die vrede maakte met de kinderen van Israël, behalve de Hevieten, inwoners van Gibeon; die namen zij allemaal in door oorlog.", "Joz 11:11-23": "En zij versloegen alle mensen die daarin waren, met de scherpte van het zwaard, ze met de ban treffend; er bleef niets over dat adem had; en Hazor verbrandde hij met vuur. En Jozua nam al de steden van deze koningen in, en al hun koningen, en hij sloeg hen met de scherpte van het zwaard, hen met de ban treffend, zoals Mozes, de dienaar van de HEERE, geboden had. Alleen verbrandden de Israëlieten geen steden die op hun heuvels stonden, behalve Hazor alleen; dat verbrandde Jozua.", "Ezech 17:17": "Ook zal farao, met een groot leger en een grote menigte van het krijgsvolk, niets voor hem uitrichten in de oorlog, wanneer men een wal zal opwerpen, en wanneer men vestingen zal bouwen, om veel mensenlevens uit te roeien.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "1 Kron 27:34": "En na Achitofel was Jojada, de zoon van Benaja, en Abjathar; maar Joab was de legeraanvoerder van de koning.", "Jes 41:10-14": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid. Zie, zij zullen beschaamd worden en te schande gemaakt, allen die tegen u in woede ontstoken zijn; zij zullen worden als niets, en de mensen die met u twisten, zullen vergaan. U zult hen zoeken, maar zult hen niet vinden, de mensen die met u kijven; zij zullen worden als niets, en de mensen die met u oorlogen, als een nietig ding.", "Zach 9:10": "En Ik zal de wagens uit Efraïm uitroeien, en de paarden uit Jeruzalem; ook zal de strijdboog uitgeroeid worden, en Hij zal tot de heidenen vrede spreken; en Zijn heerschappij zal zijn van zee tot aan zee, en van de rivier tot aan de einden van de aarde.", "Ps 27:1-3": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn? Toen de bozen, mijn tegenpartijen en mijn vijanden, tegen mij naar mij toe kwamen om mijn vlees te eten, stieten zij zelf aan en vielen. Ofschoon een leger mij belegerde, mijn hart zou niet vrezen; ofschoon een oorlog tegen mij opstond, toch vertrouw ik hierop.", "1 Kon 11:16": "want Joab bleef daar zes maanden met heel Israël, totdat hij alles wat mannelijk was in Edom had uitgeroeid.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "1 Sam 27:8-11": "David nu trok op met zijn mannen, en zij overvielen de Gesurieten, en de Girzieten, en de Amalekieten (want dezen zijn van oude tijden af de inwoners van het land geweest), op de weg naar Sur, tot aan Egypteland. En David sloeg dat land, en liet geen man en geen vrouw in leven; ook nam hij de schapen en runderen, en de ezels, en kamelen, en kleren, en keerde terug en kwam bij Achis. Toen Achis zei: Waar zijn u vandaag ingevallen? zei David: Tegen het zuiden van Juda, en tegen het zuiden van de Jerahmeelieten, en tegen het zuiden van de Kenieten.", "Ex 3:8": "Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "Ex 23:28": "Ik zal ook horzels voor uw aangezicht zenden; die zullen van voor uw aangezicht wegjagen de Hevieten, de Kanaänieten en de Hethieten.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Hand 18:9": "En de Heere zei tegen Paulus door een gezicht in de nacht: Wees niet bevreesd, maar spreek en zwijg niet.", "Matt 10:31": "Vreest dan niet; u gaat vele musjes te boven.", "Richt 1:2": "En de HEERE zei: Juda zal optrekken; zie, Ik heb dat land in zijn hand gegeven.", "1 Sam 17:45-47": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Luk 19:14": "Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Luk 12:22-32": "En Hij zei tegen Zijn discipelen: Daarom zeg Ik u: wees niet bezorgd voor uw leven, wat u eten zult, en ook niet voor het lichaam, waarmee u zich kleden zult. Het leven is meer dan het voedsel, en het lichaam meer dan de kleding. Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard?", "Joël 3:6": "En u hebt de kinderen van Juda en de kinderen van Jeruzalem verkocht aan de kinderen van de Grieken, om hen ver van hun grondgebied te brengen.", "1 Kon 20:28": "En de man van God trad toe, en sprak tegen de koning van Israël, en zei: Zo zegt de HEERE: Omdat de Syriërs gezegd hebben: De HEERE is een God van de bergen, en Hij is niet een God van de laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat u weet, dat Ik de HEERE ben.", "Richt 6:16": "En de HEERE zei tegen hem: Omdat Ik met u zal zijn, zult u de Midianieten verslaan alsof het één man was.", "Ex 23:24": "U zult zich voor hun goden niet buigen, hen ook niet dienen; ook zult u niet doen naar hun werken; maar u zult ze geheel afbreken, en hun opgerichte beelden helemaal vermorzelen.", "Richt 7:3": "Nu dan, roep nu voor de oren van het volk, en zeg: Wie bang en angstig is, die keert terug en spoedt zich weg van het gebergte van Gilead! Toen keerden er van het volk tweeëntwintigduizend terug, zodat er tienduizend overbleven.", "Joz 9:22": "En Jozua riep hen, en sprak tot hen, en zei: Waarom hebt u ons bedrogen, door te zeggen: Wij wonen zeer ver van u, terwijl u te midden van ons woont?", "2 Sam 20:18-22": "Toen sprak zij, en zei: In vroeger tijden spraken zij gewoonlijk, en zeiden: Zij zullen zeker te Abel vragen; en zo maakten zij de zaak af. Ik ben een van de vreedzamen, van de getrouwen in Israël, en u zoekt een stad te doden, die een moeder is in Israël; waarom zou u het erfdeel van de HEERE verslinden? Toen antwoordde Joab, en zei: Het zij verre, het zij verre van mij, dat ik zou verslinden, en dat ik zou verderven!", "Joz 10:5-8": "Toen werden de vijf koningen van de Amorieten verzameld en trokken op, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en streden tegen haar. De mannen van Gibeon nu stuurden tot Jozua, in het leger van Gilgal, en zeiden: Trek uw handen niet terug van uw knechten, kom haastig tot ons op, en verlos ons, en help ons; want al de koningen van de Amorieten, die op het gebergte wonen, hebben zich tegen ons verzameld. Toen trok Jozua op van Gilgal, hij en al het krijgsvolk met hem, en alle strijdbare helden.", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "Hebr 12:13": "En maak rechte paden voor uw voeten, opdat wat kreupel is niet verdraaid wordt, maar veeleer genezen wordt.", "Deut 31:6": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "Num 2:33": "Maar de Levieten werden niet geteld onder de Israëlieten, zoals de HEERE Mozes geboden had.", "Pred 9:14": "Er was een kleine stad, en er waren maar weinig mensen in; en een groot koning kwam tegen haar op, en hij omsingelde haar, en hij bouwde grote belegeringswerken tegen haar.", "Deut 31:6-8": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten. En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven. De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "1 Sam 17:18": "Maar breng deze tien melkkazen naar de aanvoerder over duizend; en u zult naar uw broers omzien, of het hun goed gaat, en u zult van hen een teken meenemen.", "Jer 33:4": "Want zo zegt de HEERE, de God van Israël, van de huizen van deze stad, en van de huizen van de koningen van Juda, die door de wallen en door het zwaard zijn afgebroken:", "Jes 35:3": "Versterkt de slappe handen, en maakt de struikelende knieën vast.", "1 Sam 15:33": "Maar Samuël zei: Zoals uw zwaard vrouwen van hun kinderen beroofd heeft, zo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht van de HEERE te Gilgal.", "Jes 37:24": "Door middel van uw dienaren hebt u de Heere gehoond, en gezegd: Met de menigte van mijn wagens heb ik de hoogte van de bergen beklommen, de zijden van Libanon; en ik zal zijn hoge cederbomen en zijn beste dennenbomen omhakken; en ik zal komen tot zijn verste hoogte, in het woud van zijn mooie veld.", "1 Sam 14:50": "En de naam van Sauls vrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn legeraanvoerder was Abner, een zoon van Ner, Sauls oom.", "Ps 62:9": "Vertrouw op Hem te allen tijde, o volk! Stort uw hart uit voor Zijn aangezicht; God is ons een Toevlucht. Sela.", "Num 1:47-50": "Maar de Levieten werden naar de stam van hun vaderen niet onder hen geteld. Want de HEERE had tot Mozes gesproken en gezegd: Alleen de stam van Levi zult u niet tellen, en hun aantal niet opnemen onder de zonen van Israël.", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Richt 1:28": "En het gebeurde, toen Israël sterk werd, dat het de Kanaänieten aan zich dienstbaar maakte; maar het verdreef hen niet volledig.", "Deut 20:2-4": "En het zal gebeuren, als u tot de strijd nadert, dan zal de priester naar voren treden en tot het volk spreken. En tot hen zeggen: Hoor, Israël! U bent heden dicht bij de strijd tegen uw vijanden; laat uw hart niet week worden, vrees niet, en beef niet, en verschrik niet voor hun aangezicht. Want het is de HEERE, uw God, Die met u meegaat, om voor u te strijden tegen uw vijanden, om u te verlossen.", "Jer 31:5": "U zult weer wijngaarden planten op de bergen van Samaria; de planters zullen planten, en de vrucht genieten.", "Klaagl 5:13": "Zij hebben de jongemannen weggenomen om te malen, en de jongens struikelden onder het hout.", "Jer 42:11": "Vrees niet voor het aangezicht van de koning van Babel, voor wie u vreest; vrees niet voor hem, spreekt de HEERE; want Ik zal met u zijn, om u te behouden en u van zijn hand te redden.", "Jes 65:22": "Zij zullen niet bouwen, zodat een ander het bewoont; zij zullen niet planten, zodat een ander het eet, want de dagen van Mijn volk zullen zijn als de dagen van een boom, en Mijn uitverkorenen zullen het werk van hun handen verslijten.", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "Joz 8:29": "En de koning van Ai hing hij aan een paal, tot de avond; en omtrent het ondergaan van de zon gebood Jozua dat men zijn dode lichaam van de paal zou afnemen; en zij wierpen het bij de ingang van de stadspoort, en richtten daarop een grote steenhoop op, die er is tot op deze dag.", "Jes 7:14": "Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen.", "2 Kon 19:6": "En Jesaja zei tegen hen: Zo zult u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bevreesd voor de woorden die u gehoord hebt, waarmee de dienaars van de koning van Assyrië Mij gelasterd hebben.", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Deut 2:34": "En wij namen in die tijd al zijn steden in, en wij verbanden alle steden, mannen, en vrouwen, en kinderen; wij lieten niemand overblijven.", "Jer 39:6": "En de koning van Babel slachtte de zonen van Zedekia te Ribla voor zijn ogen; ook slachtte de koning van Babel alle edelen van Juda.", "2 Kor 6:1": "En wij, als medearbeiders, bidden u ook dat u de genade van God niet tevergeefs mag hebben ontvangen.", "1 Kon 9:22": "Doch van de kinderen van Israël maakte Salomo geen slaaf; maar zij waren krijgslieden, en zijn knechten, en zijn vorsten, en zijn hoofdlieden, en de aanvoerders van zijn wagens, en van zijn ruiters.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Num 31:12": "Daarna brachten zij de gevangenen, en de buit, en de roof, tot Mozes en tot Eleazar, de priester, en tot de vergadering van de kinderen van Israël, in het leger, in de vlakke velden van Moab, die aan de Jordaan bij Jericho liggen.", "2 Kron 15:7": "Daarom, wees u sterk, en laat uw handen niet verslappen; want er is loon naar uw werk.", "2 Kron 14:13-15": "Asa nu en het volk, dat met hem was, joegen hen na tot Gerar toe; en er vielen zoveel Moren, dat er voor hen geen herstel meer was; want zij waren verbroken voor de HEERE en voor Zijn leger; en zij droegen zeer veel van het roof daarvan mee. En zij sloegen alle steden rondom Gerar; want de verschrikking van de HEERE was over hen; en zij beroofden al de steden, omdat er veel roof in was. En zij sloegen ook de tenten van het vee, en voerden schapen in menigte weg, en kamelen; en kwamen weer naar Jeruzalem.", "Neh 12:27": "Bij de inwijding nu van de muur van Jeruzalem, zochten zij de Levieten op uit al hun plaatsen, om hen naar Jeruzalem te brengen, om de inwijding te doen met vreugde, en met dankzeggingen, en met gezang, cimbalen, luiten, en met harpen.", "Ps 115:11": "U die de HEERE vreest! vertrouw op de HEERE; Hij is hun Hulp en hun Schild.", "Deut 28:1": "En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen.", "Joz 9:27": "Zo gaf Jozua hen op diezelfde dag over tot houthakkers en waterputters van de vergadering, en dat voor het altaar van de HEERE, tot op deze dag, op de plaats die Hij zou uitkiezen.", "Joz 11:14": "En alle buit van deze steden, en het vee, roofden de kinderen van Israël voor zichzelf; alleen sloegen zij alle mensen met de scherpte van het zwaard, totdat zij hen vernietigden; zij lieten niemand overblijven die adem had.", "2 Sam 8:2": "Ook sloeg hij de Moabieten, en mat hen met een snoer, en liet hen op de aarde neerliggen; en hij mat met twee snoeren om te doden, en met een vol snoer om in het leven te laten. Zo werden de Moabieten David tot knechten, en zij brachten geschenken.", "2 Sam 5:22-24": "Daarna trokken de Filistijnen weer op; en zij verspreidden zich in het dal Refaïm. En David vroeg de HEERE, Die zei: U zult niet optrekken; maar trek om, tot achter hen, zodat u bij hen komt van tegenover de moerbeibomen; En het zal gebeuren, als u het geluid van een gang hoort in de toppen van de moerbeibomen, dat u zich dan haast; want dan is de HEERE voor uw aangezicht uitgegaan, om het leger van de Filistijnen te verslaan.", "Hand 15:37": "En Barnabas besloot Johannes, die Markus genoemd wordt, mee te nemen.", "2 Kon 19:7": "Zie, Ik zal een geest in hem geven, zodat hij een gerucht zal horen en weer naar zijn land zal terugkeren; en Ik zal hem door het zwaard vellen in zijn land.", "Joël 2:21": "Vrees niet, o land! verheug u, en wees blijde; want de HEERE heeft grote dingen gedaan.", "Joz 10:15-40": "Toen keerde Jozua terug, en heel Israël met hem, naar het leger te Gilgal. Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda. En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda.", "Neh 4:14": "En ik zag toe, stond op, en zei tegen de edelen, tegen de leiders en tegen de rest van het volk: Wees niet bang voor hen; denk aan die grote en ontzagwekkende Heere, en strijd voor uw broeders, uw zonen en uw dochters, uw vrouwen en uw huizen.", "2 Kon 5:2": "En er waren benden uit Syrië getrokken, en hadden een klein meisje uit het land van Israël gevangen meegenomen, die in dienst van de vrouw van Naäman was.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "2 Kron 28:8": "En de kinderen van Israël voerden van hun broeders tweehonderdduizend gevangenen weg, vrouwen, zonen en dochters, en plunderden ook veel roof van hen; en zij brachten de roof naar Samaria.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Matt 3:10": "En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "2 Kron 20:15": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God.", "Num 31:17": "Nu dan, dood alles wat mannelijk is onder de kinderen; en dood elke vrouw die door gemeenschap met een man, een man heeft gekend.", "Deut 21:10-14": "Wanneer u uittrekt ten strijde tegen uw vijanden, en de HEERE, uw God, hen in uw hand gegeven heeft, zodat u hun gevangenen gevankelijk wegvoert; En u onder de gevangenen een vrouw ziet die mooi is van uiterlijk, en u naar haar verlangt, zodat u haar tot vrouw wilt nemen; Dan zult u haar in uw huis brengen; en zij zal haar hoofd scheren en haar nagels knippen.", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "2 Sam 22:18": "Hij verloste mij van mijn sterke vijand, van mijn haters, omdat zij machtiger waren dan ik.", "Ps 76:4": "Daar heeft Hij de vurige pijlen van de boog verbroken, het schild, en het zwaard, en de strijd. Sela.", "Jes 37:33": "Daarom, zo zegt de HEERE van de koning van Assyrië: Hij zal in deze stad niet komen, en er ook geen pijl inschieten; ook zal hij niet met een schild ervoor komen, en geen wal daartegen opwerpen.", "Luk 10:5": "En in welk huis u ook binnengaat, zeg eerst: Vrede zij dit huis!", "Deut 28:30": "U zult een vrouw ondertrouwen, maar een ander zal met haar slapen; een huis zult u bouwen, maar er niet in wonen; een wijngaard zult u planten, maar de vrucht ervan niet gewoon gebruiken.", "Jer 50:35-40": "Het zwaard zal zijn over de Chaldeeën, spreekt de HEERE; en over de inwoners van Babel, en over haar vorsten, en over haar wijzen. Het zwaard zal zijn over de leugenaars, zodat zij dwaas worden; het zwaard zal zijn over haar helden, zodat zij versagen; Het zwaard zal zijn over zijn paarden en over zijn wagens, en over de hele gemengde menigte die in hun midden is, zodat zij worden als vrouwen; het zwaard zal zijn over haar schatten, zodat zij geplunderd worden.", "2 Kron 20:25": "Josafat nu en zijn volk kwamen om hun buit te roven, en zij vonden bij hen in overvloed zowel bezittingen en dode lichamen, als kostbare voorwerpen, en zij namen voor zichzelf weg, totdat zij niet meer konden dragen; en zij bleven de buit verzamelen, drie dagen lang, want er was zoveel.", "Hebr 12:12": "Daarom richt de trage handen weer op, en de slappe knieën;", "Hand 27:24": "en zei: Wees niet bang, Paulus, u moet voor de keizer gesteld worden; en zie, God heeft u allen geschonken die met u varen.", "Joz 10:42": "En Jozua nam al deze koningen en hun land in één keer in; want de HEERE, de God van Israël, streed voor Israël.", "Richt 8:21": "Toen zeiden Zebah en Tsalmuna: Sta zelf op en val ons aan, want zoals de man is, zo is zijn kracht. Toen stond Gideon op en doodde Zebah en Tsalmuna, en nam de maantjes die aan de halzen van hun kamelen zaten.", "Joz 11:9": "Jozua nu deed hun zoals de HEERE hem gezegd had; hun paarden verlamde hij, en hun wagens verbrandde hij met vuur.", "1 Tess 5:15": "Zie erop toe dat niemand kwaad met kwaad vergeldt bij wie dan ook; maar jaag altijd het goede na, zowel tegenover elkaar als tegenover allen.", "Num 21:34": "De HEERE nu zei tegen Mozes: Vrees hem niet; want Ik heb hem in uw hand gegeven, en al zijn volk, ook zijn land; en u zult hem doen, zoals u Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt.", "Spr 3:24-26": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn. Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt. Want de HEERE zal uw vertrouwen zijn, en Hij zal uw voet bewaren voor gevangenschap.", "Deut 20:5-9": "Dan zullen de opzichters tot het volk spreken en zeggen: Wie is de man die een nieuw huis heeft gebouwd, en het niet heeft ingewijd? Die ga heen en keert terug naar zijn huis, opdat hij niet misschien sterft in de strijd, en iemand anders dat inwijdt. En wie is de man die een wijngaard geplant heeft, en de vrucht ervan nog niet heeft genoten? Die ga heen en keert terug naar zijn huis, opdat hij niet misschien in de strijd sterft en iemand anders die geniet. En wie is de man die een vrouw ondertrouwd heeft, en haar nog niet tot zich heeft genomen? Die ga heen en keert terug naar zijn huis; opdat hij niet misschien in die strijd sterft, en een andere man haar neemt.", "Num 31:9-20": "Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit. Verder verbrandden zij al hun steden met hun woonplaatsen, en al hun burchten, met vuur. En zij namen alle buit en alle roof, van mensen en van beesten.", "1 Kon 9:21": "Hun kinderen, die na hen in het land overgebleven waren, die de kinderen van Israël niet hadden kunnen verbannen, die heeft Salomo gebracht tot slaafs uitschot, tot op deze dag.", "Joz 6:24": "De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.", "Num 13:31-33": "Maar de mannen die met hem opgetrokken waren, zeiden: Wij zullen tegen dat volk niet kunnen optrekken, want het is sterker dan wij. Zo brachten zij een kwaad gerucht over het land dat zij verspied hadden, aan de kinderen van Israël, en zeiden: Dat land, waar wij doorheen gegaan zijn om het te verspieden, is een land dat zijn inwoners verteert; en al het volk dat wij daarin gezien hebben, zijn mannen van grote lengte. Wij hebben daar ook de reuzen gezien, en de kinderen van Enak, van de reuzen; en wij waren als sprinkhanen in onze ogen, en zo waren wij ook in hun ogen.", "2 Kron 20:17": "U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "Ezech 4:2": "En maak een belegering tegen haar, bouw tegen haar sterkten, werp tegen haar een wal op, stel legers tegen haar en zet tegen haar stormrammen rondom.", "Deut 20:1-4": "Wanneer u zult uittrekken tot de strijd tegen uw vijanden, en zult zien paarden en wagens, een volk, groter dan u, dan zult u voor hen niet vrezen; want de HEERE, uw God, is met u, Die u uit Egypteland heeft opgevoerd. En het zal gebeuren, als u tot de strijd nadert, dan zal de priester naar voren treden en tot het volk spreken. En tot hen zeggen: Hoor, Israël! U bent heden dicht bij de strijd tegen uw vijanden; laat uw hart niet week worden, vrees niet, en beef niet, en verschrik niet voor hun aangezicht.", "Deut 3:6": "En wij verbanden ze, zoals wij met Sihon, de koning van Hesbon, gedaan hadden, waarbij wij alle steden verbanden: mannen, vrouwen en kinderen.", "Jes 57:7": "U legt uw slaapplaats op een hoge en verheven berg; ook klimt u daarheen op om slachtoffer te offeren.", "Richt 14:8": "En na enige dagen kwam hij terug om haar te nemen; toen week hij af om het kadaver van de leeuw te bekijken, en zie, er was een bijenzwerm in het lichaam van de leeuw, met honing.", "Ps 37:5": "Gimel. Leg uw weg in de handen van de HEERE, en vertrouw op Hem; Hij zal het maken;", "Ps 144:1": "Een psalm van David. Geprezen zij de HEERE, mijn Rotssteen, Die mijn handen leert voor de strijd, mijn vingers voor de oorlog;", "Richt 3:5": "Toen de kinderen van Israël nu woonden te midden van de Kanaänieten, de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten,", "Matt 6:25-34": "Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding? Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven? Wie van u kan, door bezorgd te zijn, één el aan zijn lengte toevoegen?", "Spr 3:5": "Vertrouw op de HEERE met heel uw hart, en steun op uw eigen verstand niet.", "Num 14:1-3": "Toen kwam de hele vergadering in opstand, en zij verhieven hun stem, en het volk weende diezelfde nacht. En al de kinderen van Israël morden tegen Mozes en tegen Aäron; en de hele vergadering zei tegen hen: Och, waren wij toch in Egypteland gestorven! Of, och, waren wij toch in deze woestijn gestorven! En waarom brengt de HEERE ons naar dat land, om door het zwaard te vallen, en onze vrouwen en onze kinderen tot roof te worden? Zou het voor ons niet beter zijn om naar Egypte terug te keren?", "Ex 14:14": "De HEERE zal voor u strijden, en u zult stil zijn.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Deut 24:5": "Wanneer een man een nieuwe vrouw genomen heeft, zal die niet uittrekken in het leger, en men zal hem geen last opleggen; één jaar lang zal hij vrij zijn in zijn huis, en zijn vrouw, die hij genomen heeft, verheugen.", "Deut 7:17-21": "Als u in uw hart zei: Deze volken zijn groter dan ik; hoe zou ik hen uit hun bezit kunnen verdrijven? — wees niet bevreesd voor hen; denk goed terug aan wat de HEERE, uw God, aan de farao en aan alle Egyptenaren gedaan heeft; de grote verzoekingen die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en de uitgestrekte arm, waardoor de HEERE, uw God, u heeft uitgevoerd; zo zal de HEERE, uw God, doen aan alle volken voor wie u bevreesd bent.", "1 Tim 6:12": "Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen.", "Jes 34:5": "Want Mijn zwaard is dronken geworden in de hemel; zie, het zal ten oordeel neerdalen op Edom, en op het volk dat Ik met de ban geslagen heb.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Richt 14:5": "Zo ging Simson, met zijn vader en zijn moeder, naar Thimnath. Toen zij nu kwamen tot aan de wijngaarden van Thimnath, zie, daar was een jonge leeuw, die hem brullend tegemoet kwam.", "Num 31:14": "En Mozes werd zeer boos op de aanvoerders van het leger, de hoofdlieden over de duizenden, en de hoofdlieden over de honderden, die uit de strijd van die oorlog kwamen.", "Deut 16:18": "Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen; opdat zij het volk richten met een rechtvaardig oordeel.", "1 Sam 30:8": "Toen vroeg David de HEERE: Zal ik deze bende achternajagen? Zal ik ze inhalen? En Hij zei tegen hem: Jaag na, want u zult zeker inhalen, en u zult zeker verlossen.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Num 31:7-17": "En zij streden tegen de Midianieten, zoals de HEERE Mozes geboden had, en zij doodden alles wat mannelijk was. Daarbij doodden zij, behalve hun overige gesneuvelden, de koningen van de Midianieten: Evi, en Rekem, en Zur, en Hur, en Reba, vijf koningen van de Midianieten; ook doodden zij met het zwaard Bileam, de zoon van Beor. Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit.", "Num 31:7-9": "En zij streden tegen de Midianieten, zoals de HEERE Mozes geboden had, en zij doodden alles wat mannelijk was. Daarbij doodden zij, behalve hun overige gesneuvelden, de koningen van de Midianieten: Evi, en Rekem, en Zur, en Hur, en Reba, vijf koningen van de Midianieten; ook doodden zij met het zwaard Bileam, de zoon van Beor. Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "Ps 46:12": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Joz 11:20": "Want het was van de HEERE om hun harten te verharden, zodat zij Israël in de strijd tegemoet gingen, opdat Hij hen met de ban zou treffen, zodat hun geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.", "2 Kon 8:12": "Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden.", "1 Sam 30:2": "en dat zij de vrouwen die daarin waren, gevangen hadden weggevoerd; maar zij hadden niemand doodgeslagen, van de kleinste tot de grootste, maar hadden hen weggevoerd en waren hun weegs gegaan.", "Jes 35:4": "Zegt tegen de onbedachtzamen van hart: Wees sterk, en vrees niet; zie, uw God zal ter wrake komen met de vergelding van God. Hij zal komen en u verlossen.", "Ef 6:11-18": "Doe de hele wapenrusting van God aan, opdat u kunt staan tegen de listige omleidingen van de duivel. Want wij hebben de strijd niet tegen vlees en bloed, maar tegen de overheden, tegen de machten, tegen de geweldhebbers van de wereld, van de duisternis van deze eeuw, tegen de geestelijke boosheden in de lucht. Daarom, neem de hele wapenrusting van God aan, opdat u kunt weerstaan in de boze dag, en na alles verricht te hebben, staande blijven.", "Ps 33:17": "Het paard schiet tekort voor de overwinning, en bevrijdt niet door zijn grote sterkte.", "Luk 10:6": "En als daar een zoon van de vrede is, zal uw vrede op hem rusten; maar zo niet, dan zal uw vrede tot u terugkeren.", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Ezech 26:8": "Hij zal uw dochters op het veld met het zwaard doden, en hij zal versterkingen tegen u maken, en een wal tegen u opwerpen, en schilden tegen u opheffen.", "Num 31:18": "Maar laat al de kinderen van vrouwelijk geslacht, die geen gemeenschap met een man hebben gehad, voor u leven.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Lev 25:42-46": "Want zij zijn Mijn dienstknechten, die Ik uit het land Egypte geleid heb; zij zullen niet verkocht worden, zoals men een slaaf verkoopt. U zult geen heerschappij over hem hebben met wreedheid; maar u zult vrezen voor uw God. Wat aangaat uw slaaf of uw slavin, die u zult hebben, die zullen zijn van de volken die rondom u zijn; van hen zult u een slaaf of een slavin kopen.", "Ps 31:25": "Wees sterk, en Hij zal uw hart versterken, allen u, die op de HEERE hoopt!", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Gen 1:29": "En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.", "2 Kron 26:15": "Hij maakte ook te Jeruzalem kunstige werktuigen, bedacht door kunstige werkmeesters, om op de torens en op de hoeken te staan, om met pijlen en met grote stenen te schieten; zo ging zijn naam tot ver weg uit, want hij werd wonderlijk geholpen, totdat hij sterk was.", "Joz 10:25": "Toen zei Jozua tot hen: Vrees niet en wees niet ontsteld, wees sterk en heb goede moed; want zo zal de HEERE aan al uw vijanden doen, tegen wie u strijdt.", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Ezech 38:21-23": "Want Ik zal het zwaard over hem roepen op al Mijn bergen, spreekt de Heere HEERE; het zwaard van ieder man zal tegen zijn broeder zijn. En Ik zal met hem rechtspreken, door pestilentie en door bloed; en Ik zal een overstelpende plasregen, en grote hagelstenen, vuur en zwavel op hem laten regenen, en op zijn benden, en op de vele volken die met hem zullen zijn. Zo zal Ik Mij groot maken, en Mij heiligen, en bekend worden voor de ogen van veel heidenen; en zij zullen weten dat Ik de HEERE ben.", "2 Kon 25:1": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom.", "Mark 16:18": "slangen zullen zij oppakken; en al is het dat zij iets dodelijks zullen drinken, het zal hun niet schaden; op zieken zullen zij de handen leggen, en zij zullen gezond worden.", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Joz 1:5-7": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten. Wees sterk en heb goede moed! Want u zult dit volk dat land als erfelijk bezit doen verkrijgen, dat Ik hun vaderen gezworen heb hun te geven. Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Ps 18:35": "Hij leert mijn handen ten strijde, zodat een stalen boog met mijn armen verbroken is.", "Gen 26:3": "Woon als vreemdeling in dat land, en Ik zal met u zijn, en zal u zegenen; want aan u en uw nageslacht zal Ik al deze landen geven, en Ik zal de eed bevestigen die Ik Abraham, uw vader, gezworen heb.", "Jer 46:15": "Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat de HEERE hen voortdreef.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Jes 57:8": "En achter de deur en de posten zet u uw gedenkteken; want u wendt u van Mij af, ontdekt uzelf en klimt op; u maakt uw slaapplaats wijd, en sluit een verbond met sommigen van hen; u hebt hun leger lief, in elke plaats die u ziet.", "Job 18:11": "De verschrikkingen zullen hem van alle kanten schrik aanjagen, en hem opjagen, hem op de voet volgend.", "Deut 32:30": "Hoe zou één duizend achtervolgen, en twee tienduizend doen vluchten, als niet hun Rotssteen hen verkocht had, en de HEERE hen overgeleverd had?", "Richt 7:9": "En het gebeurde in die nacht, dat de HEERE tegen hem zei: Sta op, ga naar beneden naar het leger, want Ik heb het in uw hand gegeven.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "Num 31:48": "Toen kwamen de aanvoerders die over de duizenden van het leger waren, de hoofdlieden der duizenden en de hoofdlieden der honderden, tot Mozes;", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Zef 3:16": "Op die dag zal tegen Jeruzalem gezegd worden: Vrees niet, o Sion! Laat uw handen niet slap worden.", "2 Tim 2:4": "Niemand die als soldaat dient, wikkelt zich in de zaken van het dagelijks leven, opdat hij hem kan behagen die hem tot soldaat heeft aangenomen.", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "Num 32:9": "Toen zij opgekomen waren tot aan het dal Eskol, en dit land bezagen, ontmoedigden zij het hart van de kinderen van Israël, zodat zij niet gingen naar het land dat de HEERE hun gegeven had.", "Gal 6:12": "Allen die een goed gezicht willen tonen naar het vlees, die dwingen u besneden te worden, alleen maar opdat zij vanwege het kruis van Christus niet vervolgd zouden worden.", "Job 35:14": "Dat u ook gezegd hebt: U zult Hem niet aanschouwen; er is toch een oordeel voor Zijn aangezicht, wacht u dan op Hem.", "Num 31:9": "Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit.", "Richt 1:30-35": "Zebulon verdreef de inwoners van Kitron niet, noch de inwoners van Nahalol; maar de Kanaänieten woonden in zijn midden, en werden dienstbaar. Aser verdreef de inwoners van Acco niet, noch de inwoners van Sidon, noch Achlab, noch Achsib, noch Chelba, noch Afik, noch Rechob; Maar de Aserieten woonden in het midden van de Kanaänieten die in het land woonden; want zij verdreven hen niet.", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "Joz 8:25": "En het gebeurde dat allen die op die dag vielen, zowel mannen als vrouwen, twaalfduizend waren, allemaal mensen van Ai.", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "Matt 17:18-20": "En Jezus bestrafte hem, en de duivel ging uit hem weg, en het kind werd vanaf dat moment genezen. Toen kwamen de discipelen apart naar Jezus toe en zeiden: Waarom konden wij hem niet uitdrijven? En Jezus zei tegen hen: Vanwege uw ongeloof; want voorwaar, Ik zeg u: als u een geloof had als een mosterdzaad, zou u tegen deze berg zeggen: Ga van hier daarheen, en hij zou gaan; en niets zou voor u onmogelijk zijn.", "1 Kon 2:35": "En de koning stelde Benaja, de zoon van Jojada, in zijn plaats aan over het leger; en Zadok, de priester, stelde de koning aan in de plaats van Abjathar.", "Ex 33:2": "En Ik zal een Engel voor uw aangezicht zenden (en Ik zal uitdrijven de Kanaänieten, de Amorieten, en de Hethieten, en de Ferezieten, de Hevieten, en de Jebusieten),", "Luk 13:7-9": "En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit? En hij antwoordde en zei tegen hem: Heer, laat hem ook dit jaar nog staan, totdat ik om hem heen gegraven en mest gelegd zal hebben; en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "Rom 8:31": "Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn?", "Hand 18:10": "Want Ik ben met u, en niemand zal de hand aan u leggen om u kwaad te doen; want Ik heb veel volk in deze stad.", "Lev 26:36": "En wat betreft de overgeblevenen onder u, Ik zal in hun hart een angstige zwakheid laten komen in de landen van hun vijanden; zodat het geruis van een opgejaagd blad hen zal opjagen, en zij zullen vluchten, zoals men vlucht voor een zwaard, en zullen vallen, terwijl niemand hen opjaagt.", "Gen 1:30": "Maar aan al de dieren van de aarde, en aan al het gevogelte van de hemel, en aan al het kruipende gedierte op de aarde, waarin een levende ziel is, heb Ik al het groene gewas tot voedsel gegeven. En het was zo.", "Ef 2:17": "En toen Hij kwam, heeft Hij door het Evangelie vrede verkondigd aan u, die ver weg was, en aan hen die nabij waren.", "1 Sam 15:3-9": "Ga nu heen, en sla Amalek, en verban alles wat hij heeft, en verschoon hem niet; maar dood van de man af tot de vrouw toe, van de kinderen tot de zuigelingen, van de ossen tot de schapen, van de kamelen tot de ezels toe. Dit verkondigde Saul aan het volk, en hij telde hen te Telaïm, tweehonderdduizend man van het voetvolk, en tienduizend man van Juda. Toen Saul tot aan de stad Amalek kwam, legde hij een hinderlaag in het dal.", "Ps 120:7": "Ik ben vreedzaam; maar als ik spreek, zijn zij uit op oorlog.", "1 Kon 11:15": "Want het was gebeurd, toen David in Edom was, en Joab, de legeraanvoerder, optrok om de gesneuvelden te begraven, dat hij alles wat mannelijk was in Edom versloeg;", "Joz 6:21": "En zij verbanden alles wat in de stad was, van de man tot de vrouw toe, van het kind tot de oude, en tot de os, en het kleinvee, en de ezel, door de scherpte van het zwaard.", "Hand 10:36": "Dit is het woord dat Hij gezonden heeft aan de kinderen van Israël, terwijl Hij vrede verkondigt door Jezus Christus; Deze is een Heere van allen.", "Hand 15:38": "Maar Paulus vond het niet passend hem mee te nemen, omdat hij van Pamfylië af van hen was weggegaan, en niet met hen was meegegaan tot het werk.", "Ps 3:7": "Ik zal niet bang zijn voor tienduizenden van het volk, die zich rondom tegen mij opstellen.", "Ps 21:9": "Uw hand zal alle vijanden vinden; uw rechterhand zal uw haters vinden.", "Ex 34:11": "Onderhoud u wat Ik u heden gebied! Zie, Ik zal voor uw aangezicht uitdrijven de Amorieten, en de Kanaänieten, en de Hethieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "Num 31:35-54": "En van de mensen, de zielen uit de vrouwen die geen gemeenschap met een man hadden gehad, waren alle zielen tezamen tweeëndertigduizend. En de helft, namelijk het deel van hen die ten strijde getrokken waren, was in getal driehonderdzevenendertigduizend vijfhonderd schapen. En de schatting voor de HEERE van schapen was zeshonderdvijfenzeventig.", "Matt 1:18": "De geboorte van Jezus Christus was nu als volgt. Toen Maria, Zijn moeder, met Jozef in ondertrouw was, bleek zij, voordat zij samengekomen waren, zwanger te zijn uit de Heilige Geest.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "Luk 9:62": "En Jezus zei tegen hem: Niemand die zijn hand aan de ploeg slaat en achterom kijkt, is geschikt voor het Koninkrijk van God.", "Deut 33:27": "De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Lev 19:23-25": "Als u ook in dat land gekomen zult zijn, en alle geboomte tot voedsel geplant zult hebben, dan zult u de voorhuid daarvan, de vrucht ervan, wegsnijden; drie jaren zal het u onbesneden zijn, daarvan zal niet gegeten worden. Maar in het vierde jaar zal al zijn vrucht een heilig ding zijn, tot lofzegging voor de HEERE. En in het vijfde jaar zult u de vrucht ervan eten, om de opbrengst daarvan voor u te vermeerderen; Ik ben de HEERE, uw God!", "Joz 1:1": "Het gebeurde nu, na de dood van Mozes, de knecht van de HEERE, dat de HEERE tegen Jozua, de zoon van Nun, de dienaar van Mozes, sprak en zei:", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Spr 16:3": "Wentel uw werken op de HEERE, en uw gedachten zullen bevestigd worden.", "Jes 50:10": "Wie is er onder u, die de HEERE vreest, die naar de stem van Zijn Knecht luistert? Als hij in de duisternis wandelt, en geen licht heeft, laat hij vertrouwen op de Naam van de HEERE en steunen op zijn God.", "Ps 68:13": "De koningen van de heerscharen vluchtten weg, zij vluchtten weg; en zij die thuis bleef, deelde de buit uit.", "Jer 6:6": "Want zo zegt de HEERE van de heerscharen: Houwt bomen af, en werpt een wal op tegen Jeruzalem; zij is de stad, die bezocht zal worden; in het midden van haar is enkel verdrukking.", "1 Kon 16:16": "Het volk nu, dat zich gelegerd had, hoorde zeggen: Zimri heeft een verbond gesloten, ja, heeft ook de koning verslagen; daarom maakte heel Israël diezelfde dag Omri, de legeraanvoerder, koning over Israël, in het leger.", "Joz 8:24": "En het gebeurde, toen de Israëlieten een einde gemaakt hadden aan het doden van alle inwoners van Ai, op het veld, in de woestijn, waarin zij hen nagejaagd hadden, en dat zij allen door de scherpte van het zwaard gevallen waren, totdat zij allen vernietigd waren; toen keerde heel Israël zich naar Ai, en zij sloegen haar met de scherpte van het zwaard.", "Jes 37:6": "En Jesaja zei tegen hen: Zo moet u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bang voor de woorden die u gehoord hebt, waarmee de knechten van de koning van Assyrië Mij gelasterd hebben.", "Rom 8:37": "Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Deut 2:7": "Want de HEERE, uw God, heeft u gezegend in al het werk van uw hand; Hij kent uw wandelen door deze zo grote woestijn; deze veertig jaren is de HEERE, uw God, met u geweest; niets heeft u ontbroken.", "Jes 44:2": "Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!", "Joz 7:5": "En de mannen van Ai versloegen van hen ongeveer zesendertig man, en achtervolgden hen vanaf de poort tot Schebarim toe, en versloegen hen bij de afgang. Toen versmolt het hart van het volk, en het werd tot water.", "Deut 22:23-25": "Wanneer er een jonge dochter is, die een maagd is, verloofd met een man, en een man treft haar in de stad en ligt bij haar; Dan zult u hen beiden naar de poort van die stad brengen, en u zult hen met stenen stenigen, zodat zij sterven; de jonge dochter, omdat zij niet geroepen heeft, terwijl zij in de stad was, en de man, omdat hij de vrouw van zijn naaste vernederd heeft; zo zult u het kwaad uit uw midden wegdoen. En als een man een verloofde jonge dochter op het veld vindt, en de man haar verkracht en bij haar ligt, dan zal alleen de man die bij haar gelegen heeft, sterven;", "Jes 8:13": "De HEERE van de heerscharen, Die zult u heiligen, en Hij zij uw vrees, en Hij zij uw verschrikking.", "Zef 1:13": "Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken.", "Deut 1:30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "Jes 43:1": "Maar nu, zo zegt de HEERE, uw Schepper, o Jakob! en uw Formeerder, o Israël! Vrees niet, want Ik heb u verlost; Ik heb u bij uw naam geroepen, u bent van Mij.", "Ex 23:23": "Want Mijn Engel zal voor uw aangezicht gaan, en Hij zal u brengen tot de Amorieten, en Hethieten, en Ferezieten, en Kanaänieten, Hevieten, en Jebusieten; en Ik zal hen uitroeien.", "Richt 6:12": "Toen verscheen de Engel van de HEERE aan hem, en zei tegen hem: De HEERE is met u, dappere held!", "Joz 8:2": "U nu zult aan Ai en haar koning doen, zoals u aan Jericho en haar koning gedaan hebt; behalve dat u haar roof en haar vee voor uzelf roven zult; leg een hinderlaag tegen de stad, van achter haar.", "Ps 130:7": "Israël, hoop op de HEERE; want bij de HEERE is goedertierenheid, en bij Hem is veel verlossing.", "Richt 4:2": "Zo verkocht de HEERE hen in de hand van Jabin, koning van de Kanaänieten, die te Hazor regeerde; en zijn legeraanvoerder was Sisera; hij woonde in Haroseth der heidenen.", "Matt 8:26": "En Hij zei tegen hen: Waarom bent u angstig, kleingelovigen? Toen stond Hij op, en bestrafte de winden en de zee; en er kwam een grote stilte.", "Jes 37:25": "Ik heb gegraven en het water gedronken; en ik heb met mijn voetzolen alle rivieren van de belegerde plaatsen drooggelegd.", "Deut 3:22": "Wees niet bang voor hen; want de HEERE, uw God, strijdt voor u.", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "Ps 37:7": "Daleth. Zwijg voor de HEERE, en verwacht Hem; wind u niet op over hem die voorspoedig is op zijn weg; over een man die listige plannen uitvoert.", "1 Kor 15:33": "Dwaal niet. Slechte omgang bederft goede zeden.", "2 Kron 32:7": "Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.", "Joh 15:2-8": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt. U bent nu rein om het woord dat Ik tot u gesproken heb. Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Jes 26:4": "Vertrouw op de HEERE tot in eeuwigheid; want in de HEERE HEERE is een eeuwige rots.", "Deut 11:25": "Niemand zal voor uw aangezicht standhouden; de HEERE, uw God, zal de schrik en de vrees voor u geven over heel het land, waarop u treden zult, zoals Hij tot u gesproken heeft.", "Ps 30:2": "Ik zal U verhogen, HEERE, want U hebt mij opgetrokken, en mijn vijanden over mij niet verblijd.", "Ps 20:8": "Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Ex 15:15": "Dan zullen de vorsten van Edom verbaasd zijn; beving zal de machtigen van de Moabieten bevangen; alle inwoners van Kanaän zullen wegsmelten!", "Ex 34:10": "Toen zei Hij: Zie, Ik maak een verbond; voor uw hele volk zal Ik wonderen doen, die niet geschapen zijn op de hele aarde, noch onder enig volk; zodat dit hele volk, in wiens midden u bent, het werk van de HEERE zien zal, dat het ontzagwekkend is, wat Ik met u doe.", "Jes 51:13": "En u vergeet de HEERE, Die u gemaakt heeft, Die de hemelen heeft uitgebreid, en de aarde gegrond heeft, en u vreest voortdurend de hele dag, vanwege de grimmigheid van de benauwer, wanneer hij zich bereidt om te verderven? Waar is dan de grimmigheid van de benauwer?", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "Mark 11:22-24": "En Jezus antwoordde en zei tegen hen: Heb geloof in God. Want voorwaar, Ik zeg u, dat wie tegen deze berg zal zeggen: Word opgeheven en in de zee geworpen; en niet zal twijfelen in zijn hart, maar zal geloven dat wat hij zegt, zal gebeuren, het zal hem gebeuren, wat hij ook zegt. Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "1 Sam 19:5": "Want hij heeft zijn leven gewaagd, en hij heeft de Filistijn geslagen, en de HEERE heeft een grote overwinning aan heel Israël gegeven; u hebt het gezien, en u bent verblijd geweest; waarom zou u dan tegen onschuldig bloed zondigen, David zonder reden doden?", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Deut 20:13-18": "En de HEERE, uw God, zal haar in uw hand geven; en u zult alles wat mannelijk daarin is, slaan met de scherpte van het zwaard; Behalve de vrouwen, en de kinderen, en de dieren, en al wat in de stad zijn zal, alle buit ervan zult u voor uzelf roven; en u zult eten van de buit van uw vijanden, die de HEERE, uw God, u gegeven heeft. Zo zult u aan alle steden doen die zeer ver van u zijn, die niet zijn van de steden van deze volken.", "Ps 4:6": "Offer offeranden van gerechtigheid, en vertrouw op de HEERE.", "Joz 16:10": "En zij verdreven de Kanaänieten niet, die in Gezer woonden; zo woonden die Kanaänieten in het midden van de Efraïmieten tot op deze dag; maar zij moesten wel dwangarbeid verrichten.", "Zach 10:5": "En zij zullen zijn als de helden, die in het slijk van de straten treden in de strijd, en zij zullen strijden; want de HEERE zal met hen zijn, en zij zullen hen beschamen die op paarden rijden.", "Deut 2:33": "En de HEERE, onze God, gaf hem aan ons over; en wij versloegen hem, en zijn zonen, en al zijn volk.", "Spr 28:1": "De goddelozen vluchten, terwijl geen vervolger er is; maar elke rechtvaardige is moedig, als een jonge leeuw.", "2 Tess 1:7-9": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht; Met vlammend vuur, wraak oefenend over hen die God niet kennen, en over hen die het Evangelie van onze Heere Jezus Christus niet gehoorzaam zijn. Die zullen tot straf het eeuwige verderf ondergaan, weg van het aangezicht van de Heere, en van de heerlijkheid van Zijn sterkte,", "Richt 4:3-9": "Toen riepen de Israëlieten tot de HEERE; want hij had negenhonderd ijzeren wagens, en hij had de Israëlieten met geweld onderdrukt, twintig jaar. Debora nu, een vrouw die een profetes was, de vrouw van Lappidoth, zij richtte in die tijd Israël. En zij woonde onder de palmboom van Debora, tussen Rama en Beth-el, op het gebergte van Efraïm; en de Israëlieten gingen naar haar toe voor de rechtspraak.", "Zach 9:12": "Keert u weer tot de sterkte, gebondenen, die daar hopen! Ook heden verkondig Ik, dat Ik u dubbel zal wedergeven;", "Joël 3:16": "En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.", "Jes 43:10": "U bent Mijn getuigen, spreekt de HEERE, en Mijn knecht, die Ik uitverkoren heb; opdat u het weet, en Mij gelooft, en verstaat, dat Ik Dezelfde ben, dat er vóór Mij geen God geformeerd is, en na Mij geen zijn zal.", "Joz 9:23": "Nu dan, vervloekt bent u! en onder u zullen altijd knechten blijven, houthakkers en waterputters voor het huis van mijn God.", "Openb 3:16": "Zo dan, omdat u lauw bent, en noch koud noch heet, zal Ik u uit Mijn mond spuwen.", "Jes 43:5": "Vrees niet, want Ik ben met u; Ik zal uw nageslacht van de opgang brengen, en Ik zal u verzamelen van de ondergang.", "Jes 26:20": "Ga heen, mijn volk, ga in uw binnenkamers, en sluit uw deuren achter u toe; verberg u voor een klein ogenblik, totdat de gramschap voorbijgaat.", "Joz 23:10": "Eén man onder u zal er duizend opjagen; want het is de HEERE, uw God, Zelf, Die voor u strijdt, zoals Hij tot u gesproken heeft.", "Deut 7:1": "Wanneer de HEERE, uw God, u gebracht zal hebben in het land waar u naar toe gaat om het te erven, en Hij vele volken voor uw aangezicht zal hebben uitgeworpen, de Hethieten, en de Girgasieten, en de Amorieten, en de Kanaänieten, en de Ferezieten, en de Hevieten, en de Jebusieten, zeven volken, die groter en machtiger zijn dan u,", "Deut 7:17-24": "Als u in uw hart zei: Deze volken zijn groter dan ik; hoe zou ik hen uit hun bezit kunnen verdrijven? — wees niet bevreesd voor hen; denk goed terug aan wat de HEERE, uw God, aan de farao en aan alle Egyptenaren gedaan heeft; de grote verzoekingen die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en de uitgestrekte arm, waardoor de HEERE, uw God, u heeft uitgevoerd; zo zal de HEERE, uw God, doen aan alle volken voor wie u bevreesd bent.", "Jer 49:11": "Laat uw wezen achter, en Ik zal hen in het leven behouden, en laat uw weduwen op Mij vertrouwen.", "Deut 23:9": "Wanneer het leger tegen uw vijanden uittrekt, dan zult u zich wachten voor elke kwade zaak.", "Num 23:21": "Hij ziet geen ongerechtigheid in Jakob; ook ziet Hij geen boosheid in Israël. De HEERE, zijn God, is met hem, en het geschal van de Koning is bij hem.", "Deut 3:21": "Ook gebood ik Jozua in die tijd: Uw ogen hebben alles gezien wat de HEERE, uw God, aan deze twee koningen gedaan heeft; zo zal de HEERE doen aan alle koninkrijken waar u doorheen trekt.", "Ps 115:9": "Israël! vertrouw jij op de HEERE; Hij is hun Hulp en hun Schild.", "Joz 11:4-6": "Dezen nu trokken uit, en al hun legers met hen; veel volk, als het zand dat aan de oever van de zee is, in aantal; en heel veel paarden en wagens. Al deze koningen kwamen samen, en trokken op en legerden zich samen aan de wateren van Merom, om tegen Israël te strijden. En de HEERE zei tegen Jozua: Wees niet bang voor hen; want morgen omtrent deze tijd zal Ik hen allemaal verslagen geven voor het aangezicht van Israël; hun paarden zult u verlammen, en hun wagens met vuur verbranden.", "Deut 1:21-31": "Zie, de HEERE, uw God, heeft dat land aan u gegeven; trek op, bezit het erfelijk, zoals de HEERE, de God van uw vaderen, tot u gesproken heeft; wees niet bang, en wees niet ontmoedigd. Toen kwam u allen dichterbij mij, en zei: Laten wij mannen voor ons uit sturen, die het land voor ons verkennen, en ons bericht terugbrengen, welke weg wij daarin op moeten trekken, en tot welke steden wij zullen komen. Deze zaak nu was goed in mijn ogen; zo nam ik uit u twaalf mannen, van elke stam een man.", "Lev 26:37": "En zij zullen de een over de ander vallen als voor het zwaard, terwijl niemand hen opjaagt; en u zult niet kunnen standhouden voor het aangezicht van uw vijanden.", "Joz 1:5-9": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten. Wees sterk en heb goede moed! Want u zult dit volk dat land als erfelijk bezit doen verkrijgen, dat Ik hun vaderen gezworen heb hun te geven. Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Ps 31:20": "O, hoe groot is Uw goed, dat U weggelegd hebt voor hen die U vrezen; dat U gewrocht hebt voor hen die op U vertrouwen, in de tegenwoordigheid van de mensenkinderen!", "Richt 6:14-16": "Toen keerde de HEERE Zich tot hem, en zei: Ga heen in deze kracht van u, en u zult Israël uit de hand van de Midianieten verlossen; heb Ik u niet gezonden? En hij zei tegen Hem: Och, mijn Heere! Waarmee zal ik Israël verlossen? Zie, mijn geslacht is het armste in Manasse, en ik ben de kleinste in mijn vaders huis. En de HEERE zei tegen hem: Omdat Ik met u zal zijn, zult u de Midianieten verslaan alsof het één man was.", "1 Sam 30:7": "En David zei tegen de priester Abjathar, de zoon van Achimelech: Breng mij toch de efod hier. En Abjathar bracht de efod naar David.", "Gen 15:21": "En de Amorieten, en de Kanaänieten, en de Girgazieten, en de Jebusieten.", "2 Kron 20:20": "En zij stonden 's morgens vroeg op en trokken naar de woestijn van Thekoa; en toen zij optrokken, stond Josafat en zei: Hoor mij, o Juda, en u, inwoners van Jeruzalem! Geloof in de HEERE, uw God, dan zult u standhouden; geloof Zijn profeten, dan zult u voorspoedig zijn.", "Matt 7:15-20": "Maar wacht u voor de valse profeten, die in schaapskleren naar u toe komen, maar van binnen zijn het roofzuchtige wolven. Aan hun vruchten zult u hen herkennen. Plukt men ook een druif van doornen, of vijgen van distels? Zo brengt iedere goede boom goede vruchten voort, maar een slechte boom brengt slechte vruchten voort.", "Openb 19:18": "Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Jes 44:8": "Schrik niet, en wees niet bang; heb Ik het u van toen af niet doen horen en verkondigd? Want u bent Mijn getuigen: is er ook een God behalve Mij? Zeker, er is geen andere rotssteen: Ik ken er geen.", "Richt 14:7": "En hij kwam af en sprak met de vrouw; en zij beviel Simson goed.", "Joz 22:8": "En hij sprak tot hen, en zei: Keert terug naar uw tenten met veel rijkdom, en met heel veel vee, met zilver, en met goud, en met koper, en met ijzer, en met heel veel kleding; deelt de buit van uw vijanden met uw broeders.", "Deut 26:6": "Maar de Egyptenaren deden ons kwaad en verdrukten ons, en legden ons een harde dienst op.", "Jes 29:3": "Want Ik zal een leger in het rond om u opslaan, en Ik zal u belegeren met bolwerken, en Ik zal vestingen tegen u opwerpen.", "Joz 11:11": "En zij versloegen alle mensen die daarin waren, met de scherpte van het zwaard, ze met de ban treffend; er bleef niets over dat adem had; en Hazor verbrandde hij met vuur.", "Joz 10:2-40": "Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei: Kom op tot mij, en help mij, dat wij Gibeon slaan; omdat zij vrede gemaakt heeft met Jozua en met de kinderen van Israël.", "Deut 20:1-9": "Wanneer u zult uittrekken tot de strijd tegen uw vijanden, en zult zien paarden en wagens, een volk, groter dan u, dan zult u voor hen niet vrezen; want de HEERE, uw God, is met u, Die u uit Egypteland heeft opgevoerd. En het zal gebeuren, als u tot de strijd nadert, dan zal de priester naar voren treden en tot het volk spreken. En tot hen zeggen: Hoor, Israël! U bent heden dicht bij de strijd tegen uw vijanden; laat uw hart niet week worden, vrees niet, en beef niet, en verschrik niet voor hun aangezicht.", "Ps 2:6-12": "Ik heb Mijn Koning toch gezalfd over Sion, de berg van Mijn heiligheid. Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt. Eis van Mij, en Ik zal de heidenen geven tot Uw erfdeel, en de einden van de aarde tot Uw bezitting.", "Luk 17:6": "En de Heere zei: Als u een geloof had als een mosterdzaad, zou u tegen deze moerbeiboom zeggen: Word ontworteld en in de zee geplant, en hij zou u gehoorzaam zijn.", "Ps 44:13": "U verkoopt Uw volk voor niets; en U verhoogt hun prijs niet.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "1 Sam 15:32": "Toen zei Samuël: Breng Agag, de koning van de Amalekieten, hier bij mij. Agag nu ging vol vertrouwen naar hem toe; en Agag zei: Voorwaar, de bitterheid van de dood is geweken!", "Ps 37:39": "Thau. Toch is het heil van de rechtvaardigen van de HEERE; hun Sterkte in de tijd van benauwdheid.", "Richt 21:11": "Doch dit is de zaak die u doen zult: al wat mannelijk is, en alle vrouwen die gemeenschap met een man gehad hebben, zult u met de ban slaan.", "Deut 3:2": "Toen zei de HEERE tegen mij: Wees niet bang voor hem, want Ik heb hem, en al zijn volk, en zijn land, in uw hand gegeven; en u zult hem doen, zoals u met Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt.", "Jes 41:13": "Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.", "2 Kron 13:12": "Zie daarom, God is met ons aan het hoofd, en Zijn priesters met de trompetten van het geschal, om alarm tegen u te laten klinken; o kinderen van Israël, strijd niet tegen de HEERE, de God van uw vaderen, want u zult geen voorspoed hebben.", "2 Kron 32:8": "Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.", "2 Kron 28:10": "Daartoe denkt u er nu aan om de kinderen van Juda en Jeruzalem u tot slaven en slavinnen te onderwerpen; bent u het zelf niet die schuldig staan? Bij u zijn schulden tegen de HEERE, uw God."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3318\">Wanneer</span> u <span class=\"wl\" data-l=\"L1\" data-code=\"H3318\">zult</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3318\">uittrekken</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3318\">tot</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4421\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4421\" const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});
