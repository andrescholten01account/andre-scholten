hannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Wanneer u zult uittrekken tot de strijd tegen uw vijanden, en zult zien paarden en wagens, een volk, groter dan u, dan zult u voor hen niet vrezen; want de HEERE, uw God, is met u, Die u uit Egypteland heeft opgevoerd.", "2": "En het zal gebeuren, als u tot de strijd nadert, dan zal de priester naar voren treden en tot het volk spreken.", "3": "En tot hen zeggen: Hoor, Israël! U bent heden dicht bij de strijd tegen uw vijanden; laat uw hart niet week worden, vrees niet, en beef niet, en verschrik niet voor hun aangezicht.", "4": "Want het is de HEERE, uw God, Die met u meegaat, om voor u te strijden tegen uw vijanden, om u te verlossen.", "5": "Dan zullen de opzichters tot het volk spreken en zeggen: Wie is de man die een nieuw huis heeft gebouwd, en het niet heeft ingewijd? Die ga heen en keert terug naar zijn huis, opdat hij niet misschien sterft in de strijd, en iemand anders dat inwijdt.", "6": "En wie is de man die een wijngaard geplant heeft, en de vrucht ervan nog niet heeft genoten? Die ga heen en keert terug naar zijn huis, opdat hij niet misschien in de strijd sterft en iemand anders die geniet.", "7": "En wie is de man die een vrouw ondertrouwd heeft, en haar nog niet tot zich heeft genomen? Die ga heen en keert terug naar zijn huis; opdat hij niet misschien in die strijd sterft, en een andere man haar neemt.", "8": "Daarna zullen de opzichters voortgaan met spreken tot het volk, en zeggen: Wie is de man die vreesachtig en week van hart is? Die ga heen en keert terug naar zijn huis, opdat het hart van zijn broeders niet smelt, zoals zijn hart.", "9": "En het zal gebeuren, als die opzichters geëindigd zullen hebben met spreken tot het volk, dan zullen zij aanvoerders van de legers aan het hoofd van het volk aanstellen.", "10": "Wanneer u nadert tot een stad om tegen haar te strijden, dan zult u haar vrede toeroepen.", "11": "En het zal gebeuren, als zij u vrede antwoordt, en voor u opendoet, dan zal al het volk dat daarin gevonden wordt, u schatplichtig zijn, en u dienen.", "12": "Maar als zij geen vrede met u zal maken, maar oorlog tegen u voert, dan zult u haar belegeren.", "13": "En de HEERE, uw God, zal haar in uw hand geven; en u zult alles wat mannelijk daarin is, slaan met de scherpte van het zwaard;", "14": "Behalve de vrouwen, en de kinderen, en de dieren, en al wat in de stad zijn zal, alle buit ervan zult u voor uzelf roven; en u zult eten van de buit van uw vijanden, die de HEERE, uw God, u gegeven heeft.", "15": "Zo zult u aan alle steden doen die zeer ver van u zijn, die niet zijn van de steden van deze volken.", "16": "Maar van de steden van deze volken, die de HEERE, uw God, u als erfdeel geeft, zult u niets laten leven dat adem heeft.", "17": "Maar u zult ze helemaal verbannen: de Hethieten, en de Amorieten, en de Kanaänieten, en de Ferezieten, de Hevieten, en de Jebusieten, zoals de HEERE, uw God, u geboden heeft;", "18": "Opdat zij u niet leren te doen naar al hun gruwelen, die zij hun goden gedaan hebben, en u zondigt tegen de HEERE, uw God.", "19": "Wanneer u een stad vele dagen zult belegeren, strijdend tegen haar, om die in te nemen, dan zult u haar geboomte niet verderven door de bijl daaraan te slaan; want u zult daarvan eten; daarom zult u dat niet omhakken (want het geboomte van het veld is *het voedsel* van de mens), opdat het voor uw aangezicht dient tot een bolwerk.", "20": "Maar het geboomte waarvan u zult weten dat het geen geboomte tot voedsel is, dat zult u verderven en omhakken; en u zult een bolwerk bouwen tegen deze stad, die tegen u oorlog voert, totdat zij valt."}, "SV": {"1": "Wanneer gij zult uittrekken tot den strijd tegen uw vijanden, en zult zien paarden en wagenen, een volk, meerder dan gij, zo zult gij voor hen niet vrezen; want de HEERE, uw God, is met u, Die u uit Egypteland heeft opgevoerd.", "2": "En het zal geschieden, als gijlieden tot den strijd nadert, zo zal de priester toetreden, en tot het volk spreken.", "3": "En tot hen zeggen: Hoort, Israël! gijlieden zijt heden na aan den strijd tegen uw vijanden; uw hart worde niet week, vreest niet, en beeft niet, en verschrikt niet voor hun aangezicht.", "4": "Want het is de HEERE, uw God, Die met u gaat, om voor u te strijden tegen uw vijanden, om u te verlossen.", "5": "Dan zullen de ambtlieden tot het volk spreken, zeggende: Wie is de man, die een nieuw huis heeft gebouwd, en het niet heeft ingewijd? Die ga henen en kere weder naar zijn huis; opdat hij niet misschien sterve in den strijd, en iemand anders dat inwijde.", "6": "En wie is de man, die een wijngaard geplant heeft, en deszelfs vrucht niet heeft genoten? Die ga henen en kere weder naar zijn huis, opdat hij niet misschien in den strijd sterve en iemand anders die geniete.", "7": "En wie is de man, die een vrouw ondertrouwd heeft, en haar niet *tot* *zich* heeft genomen? Die ga henen en kere weder naar zijn huis; opdat hij niet misschien in dien strijd sterve, en een ander man haar neme.", "8": "Daarna zullen de ambtlieden voortvaren te spreken tot het volk, en zeggen: Wie is de man, die vreesachtig en week van hart is? Die ga henen en kere weder naar zijn huis; opdat het hart zijner broederen niet smelte, gelijk zijn hart.", "9": "En het zal geschieden, als die ambtlieden geëindigd zullen hebben te spreken tot het volk, zo zullen zij oversten der heiren aan de spits des volks bestellen.", "10": "Wanneer gij nadert tot een stad om tegen haar te strijden, zo zult gij haar den vrede toeroepen.", "11": "En het zal geschieden, indien zij u vrede zal antwoorden, en u opendoen, zo zal al het volk, dat daarin gevonden wordt, u cijnsbaar zijn, en u dienen.", "12": "Doch zo zij geen vrede met u zal maken, maar krijg tegen u voeren, zo zult gij haar belegeren.", "13": "En de HEERE, uw God, zal haar in uw hand geven; en gij zult alles, wat mannelijk daarin is, slaan met de scherpte des zwaards;", "14": "Behalve de vrouwen, en de kinderkens, en de beesten, en al wat in de stad zijn zal, al haar buit zult gij voor u roven; en gij zult eten den buit uwer vijanden, dien u de HEERE, uw God, gegeven heeft.", "15": "Alzo zult gij aan alle steden doen, die zeer verre van u zijn, die niet zijn van de steden dezer volken.", "16": "Maar van de steden dezer volken, die u de HEERE, uw God, ten erve geeft, zult gij niets laten leven, dat adem heeft.", "17": "Maar gij zult ze ganselijk verbannen: de Hethieten, en de Amorieten, en de Kanaänieten, en de Ferezieten, de Hevieten, en de Jebusieten, gelijk als u de HEERE, uw God, geboden heeft;", "18": "Opdat zij ulieden niet leren te doen naar al hun gruwelen, die zij hun goden gedaan hebben, en gij zondigt tegen den HEERE, uw God.", "19": "Wanneer gij een stad vele dagen zult belegeren, strijdende tegen haar, om die in te nemen, zo zult gij haar geboomte niet verderven, de bijl daaraan drijvende; want gij zult daarvan eten; daarom zult gij dat niet afhouwen (want het geboomte van het veld is des mensen *spijze*), opdat het voor uw aangezicht kome tot een bolwerk.", "20": "Maar het geboomte, hetwelk gij kennen zult, dat het geen geboomte ter spijze is, dat zult gij verderven en afhouwen; en gij zult een bolwerk bouwen tegen deze stad, dewelke tegen u krijg voert, totdat zij ten onderga."}, "KJV": {"1": "When thou goest out to battle against thine enemies, and seest horses, and chariots, *and* a people more than thou, be not afraid of them: for the LORD thy God *is* with thee, which brought thee up out of the land of Egypt.", "2": "And it shall be, when ye are come nigh unto the battle, that the priest shall approach and speak unto the people,", "3": "And shall say unto them, Hear, O Israel, ye approach this day unto battle against your enemies: let not your hearts faint, fear not, and do not tremble, neither be ye terrified because", "4": "For the LORD your God *is* he that goeth with you, to fight for you against your enemies, to save", "5": "And the officers shall speak unto the people, saying, What man *is there* that hath built a new house, and hath not dedicated it? let him go and return to his house, lest he die in the battle, and another man dedicate", "6": "And what man *is he* that hath planted a vineyard, and hath not *yet* eaten of it? let him *also* go and return unto his house, lest he die in the battle, and another man eat", "7": "And what man *is there* that hath betrothed a wife, and hath not taken her? let him go and return unto his house, lest he die in the battle, and another man take", "8": "And the officers shall speak further unto the people, and they shall say, What man *is there that is* fearful and fainthearted? let him go and return unto his house, lest his brethren's heart faint as well as his heart.", "9": "And it shall be, when the officers have made an end of speaking unto the people, that they shall make captains of the armies to lead the people.", "10": "When thou comest nigh unto a city to fight against it, then proclaim peace", "11": "And it shall be, if it make thee answer of peace, and open unto thee, then it shall be, *that* all the people *that is* found therein shall be tributaries unto thee, and they shall serve", "12": "And if it will make no peace with thee, but will make war against thee, then thou shalt besiege", "13": "And when the LORD thy God hath delivered it into thine hands, thou shalt smite every male thereof with the edge of the sword:", "14": "But the women, and the little ones, and the cattle, and all that is in the city, *even* all the spoil thereof, shalt thou take unto thyself; and thou shalt eat the spoil of thine enemies, which the LORD thy God hath given", "15": "Thus shalt thou do unto all the cities *which are* very far off from thee, which *are* not of the cities of these nations.", "16": "But of the cities of these people, which the LORD thy God doth give thee *for* an inheritance, thou shalt save alive nothing that breatheth:", "17": "But thou shalt utterly destroy them; *namely*, the Hittites, and the Amorites, the Canaanites, and the Perizzites, the Hivites, and the Jebusites; as the LORD thy God hath commanded", "18": "That they teach you not to do after all their abominations, which they have done unto their gods; so should ye sin against the LORD your God.", "19": "When thou shalt besiege a city a long time, in making war against it to take it, thou shalt not destroy the trees thereof by forcing an axe against them: for thou mayest eat of them, and thou shalt not cut them down (for the tree of the field *is* man's *life*) to employ *them* in the siege:", "20": "Only the trees which thou knowest that they *be* not trees for meat, thou shalt destroy and cut them down; and thou shalt build bulwarks against the city that maketh war with thee, until it be subdued."}}, "tsk": {"1": [{"kopje": "uittrekken", "refs": ["Deut 3:21", "Deut 3:22", "Deut 7:1"]}, {"kopje": "paarden", "refs": ["Joz 10:5-8", "Joz 11:4-6", "Joz 11:9", "Richt 4:3-9", "2 Kron 14:11", "2 Kron 20:12", "Ps 20:8", "Ps 33:16", "Ps 33:17", "Jes 31:1", "Jes 37:24", "Jes 37:25"]}, {"kopje": "de HEERE", "refs": ["Deut 2:7", "Deut 31:6", "Deut 31:8", "Gen 26:3", "Num 23:21", "Joz 1:5", "Joz 1:9", "Richt 6:12", "2 Kron 32:7", "2 Kron 32:8", "Ps 46:8", "Ps 46:12", "Ps 118:6", "Jes 7:14", "Jes 8:9", "Jes 8:10", "Jes 43:2", "Rom 8:31"]}], "3": [{"kopje": "laat niet", "refs": ["Ps 27:1-3", "Jes 35:3", "Jes 35:4", "Jes 41:10-14", "Matt 10:16", "Matt 10:28", "Matt 10:31", "Ef 6:11-18", "1 Tess 5:15", "Hebr 12:12", "Hebr 12:13", "Openb 2:10"]}, {"kopje": "beef", "refs": ["Jes 28:16"]}, {"kopje": "verschrik niet", "refs": ["Ps 3:7", "Jes 8:12", "Jes 8:13", "Jes 57:7", "Jes 57:8", "Matt 8:26", "Mark 16:6", "Mark 16:18", "Hand 18:9", "Hand 18:10", "Hand 27:24", "1 Tim 6:12", "Hebr 13:6"]}], "4": [{"kopje": "om te strijden", "refs": ["Deut 1:30", "Deut 3:22", "Deut 11:25", "Deut 32:30", "Ex 14:14", "Joz 10:42", "Joz 23:10", "2 Kron 13:12", "2 Kro
