HEERE, uw God, uit uw midden weggevaagd.","4":"U daarentegen, die de HEERE, uw God, aanhing, u bent vandaag allemaal nog in leven.","5":"Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.","6":"Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk!","7":"Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?","8":"En welk groot volk is er, dat zulke rechtvaardige inzettingen en rechten heeft als deze hele wet, die ik vandaag voor u leg?","9":"Wacht u alleen, en let goed op uzelf, dat u niet vergeet wat uw ogen gezien hebben; en dat het niet uit uw hart wijkt, al de dagen van uw leven; en u zult het aan uw kinderen en uw kleinkinderen bekendmaken.","10":"Denk aan de dag dat u voor de HEERE, uw God, bij Horeb stond, toen de HEERE tegen mij zei: Verzamel dit volk voor Mij, en Ik zal hun Mijn woorden laten horen, die zij zullen leren, om Mij te vrezen al de dagen dat zij op de aardbodem leven, en zij zullen ze hun kinderen leren;","11":"En u kwam dichterbij en stond onder aan die berg (die berg brandde nu van vuur tot aan het midden van de hemel; er was duisternis, wolken en donkerheid).","12":"Zo sprak de HEERE tot u uit het midden van het vuur; u hoorde de stem van de woorden, maar u zag geen gelijkenis, alleen de stem.","13":"Toen maakte Hij u Zijn verbond bekend, dat Hij u gebood te doen, de tien woorden, en Hij schreef ze op twee stenen platen.","14":"Ook gebood de HEERE mij in diezelfde tijd dat ik u inzettingen en rechten zou leren; opdat u die deed in het land waar u naar toe trekt, om het in bezit te nemen.","15":"Let dan goed op uzelf; want u hebt geen gelijkenis gezien, op de dag dat de HEERE op Horeb uit het midden van het vuur tot u sprak;","16":"Opdat u zich niet te gronde richt, en u iets gesnedens maakt, de gelijkenis van enig beeld, de gedaante van een man of een vrouw,","17":"De gedaante van enig beest dat op de aarde is; de gedaante van een gevleugelde vogel, die door de hemel vliegt;","18":"De gedaante van iets dat op de aardbodem kruipt; de gedaante van enige vis, die in het water onder de aarde is;","19":"Dat u ook uw ogen niet opheft naar de hemel, en de zon aanziet, en de maan, en de sterren, heel het leger van de hemel; en zich laat verleiden om u daarvoor te buigen en ze te dienen; die de HEERE, uw God, aan alle volken onder de hele hemel heeft toebedeeld.","20":"Maar u heeft de HEERE aangenomen, en uit de ijzeroven, uit Egypte, weggevoerd; opdat u Hem tot een erfvolk zou zijn, zoals het vandaag is.","21":"Ook werd de HEERE toornig op mij vanwege uw woorden; en Hij zwoer dat ik de Jordaan niet zou oversteken, en dat ik niet zou komen in dat goede land, dat de HEERE, uw God, u als erfenis zal geven.","22":"Want ik zal in dit land sterven; ik zal de Jordaan niet oversteken; maar u zult eroverheen gaan, en dat goede land in bezit nemen.","23":"Wacht u ervoor dat u het verbond van de HEERE, uw God, dat Hij met u gesloten heeft, vergeet, zodat u een gesneden beeld zou maken, de gelijkenis van iets dat de HEERE, uw God, u verboden heeft.","24":"Want de HEERE, uw God, is een verterend vuur, een na-ijverig God.","25":"Wanneer u nu kinderen en kleinkinderen verwekt hebt, en oud geworden bent in het land, en u zich te gronde richt door gesneden beelden te maken, de gelijkenis van iets, en door te doen wat kwaad is in de ogen van de HEERE, uw God, om Hem tot toorn te verwekken;","26":"Dan roep ik vandaag de hemel en de aarde tot getuige tegen u, dat u zeker snel zult omkomen uit het land waar u de Jordaan voor oversteekt om het in bezit te nemen; u zult uw dagen daarin niet verlengen, maar helemaal uitgeroeid worden.","27":"En de HEERE zal u verstrooien onder de volken; en u zult met weinigen in getal overblijven onder de heidenvolken waarheen de HEERE u zal leiden.","28":"En daar zult u goden dienen, die het werk van mensenhanden zijn, hout en steen, die niet zien, niet horen, niet eten en niet ruiken.","29":"Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel.","30":"Wanneer u in angst zult zijn, en al deze dingen u zullen treffen, in de laatste dagen, dan zult u terugkeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn.","31":"Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.","32":"Want vraag toch naar de vorige dagen, die vóór u geweest zijn, vanaf de dag dat God de mens op de aarde geschapen heeft, van het ene einde van de hemel tot aan het andere einde van de hemel, of er ooit zo'n groot ding gebeurd of gehoord is als dit:","33":"Of een volk ooit de stem van God gehoord heeft, sprekend uit het midden van het vuur, zoals u gehoord hebt, en in leven is gebleven?","34":"Of: of God ooit beproefd heeft te gaan om Zich een volk uit het midden van een ander volk aan te nemen, door beproevingen, door tekenen, en door wonderen, en door strijd, en door een sterke hand, en door een uitgestrekte arm, en met grote verschrikkingen; naar alles wat de HEERE, uw God, voor u in Egypte voor uw ogen gedaan heeft?","35":"Aan u is het getoond, opdat u weet dat de HEERE die God is; er is niemand anders dan Hij alleen!","36":"Vanuit de hemel heeft Hij u Zijn stem laten horen, om u te onderwijzen; en op de aarde heeft Hij u Zijn grote vuur laten zien; en u hebt Zijn woorden uit het midden van het vuur gehoord.","37":"En omdat Hij uw vaderen liefhad, en hun nageslacht na hen verkoren had, zo heeft Hij u voor Zijn aangezicht door Zijn grote kracht uit Egypte weggevoerd;","38":"Om volken die groter en machtiger waren dan u, voor u uit hun bezit te verdrijven; om u binnen te brengen en u hun land als erfenis te geven, zoals het vandaag is.","39":"Zo zult u vandaag weten, en in uw hart overdenken, dat de HEERE die God is, boven in de hemel en beneden op de aarde, niemand anders!","40":"En u zult Zijn inzettingen en Zijn geboden houden, die ik u vandaag gebied, opdat het u en uw kinderen na u goed gaat, en opdat u de dagen verlengt in het land dat de HEERE, uw God, u geeft, voor altijd.","41":"Toen zonderde Mozes drie steden af, aan deze kant van de Jordaan, tegen de opgang van de zon;","42":"Opdat daarheen kon vluchten de doodslager, die zijn naaste onopzettelijk doodslaat, die hij tot dan toe niet haatte; dat hij naar een van deze steden kon vluchten en in leven bleef;","43":"Bezer in de woestijn, in het effen land, voor de Rubenieten; en Ramoth in Gilead, voor de Gadieten; en Golan in Bazan, voor de Manassieten.","44":"Dit is nu de wet die Mozes de kinderen van Israël voorlegde:","45":"Dit zijn de getuigenissen, en de inzettingen, en de rechten, die Mozes sprak tot de kinderen van Israël, toen zij uit Egypte waren uitgetrokken;","46":"Aan deze kant van de Jordaan, in het dal tegenover Beth-peor, in het land van Sihon, de koning van de Amorieten, die in Hesbon woonde; die Mozes versloeg, samen met de kinderen van Israël, toen zij uit Egypte waren uitgetrokken,","47":"En zijn land in bezit hadden genomen; daarbij het land van Og, koning van Bazan; twee koningen van de Amorieten, die aan deze kant van de Jordaan waren, tegen de opgang van de zon;","48":"Vanaf Aroer, dat aan de oever van de beek Arnon ligt, tot aan de berg Sion, dat is de Hermon;","49":"En heel het vlakke veld, aan deze kant van de Jordaan, oostwaarts, tot aan de zee van het vlakke veld, onder de hellingen van de Pisga."},"SV":{"1":"Nu dan, Israël! hoor naar de inzettingen en naar de rechten, die ik ulieden lere te doen; opdat gij leeft, en henen inkomt, en erft het land, dat de HEERE, uwer vaderen God, u geeft.","2":"Gij zult tot dit woord, dat ik u gebiede, niet toedoen, ook daarvan niet afdoen; opdat gij bewaart de geboden van den HEERE, uw God, die ik u gebiede.","3":"Uw ogen hebben gezien, wat God om Baäl-peor gedaan heeft; want alle man, die Baäl-peor navolgde, dien heeft de HEERE, uw God, uit het midden van u verdaan.","4":"Gij daarentegen, die den HEERE, uw God, aanhingt, gij zijt heden allen levende.","5":"Ziet, ik heb u geleerd de inzettingen en rechten, gelijk als de HEERE, mijn God, mij geboden heeft; opdat gij alzo doet in het midden des lands, waar gij naar toe gaat, om het te erven.","6":"Behoudt ze dan, en doet ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen der volken, die al deze inzettingen horen zullen, en zeggen: Dit grote volk alleen is een wijs en verstandig volk!","7":"Want wat groot volk is er, hetwelk de goden *zo* nabij zijn als de HEERE, onze God, zo dikwijls als wij Hem aanroepen?","8":"En wat groot volk is er, dat *zo* rechtvaardige inzettingen en rechten heeft, als deze ganse wet is, die ik heden voor uw aangezicht geef?","9":"Alleenlijk wacht u, en bewaart uw ziel wel, dat gij niet vergeet de dingen, die uw ogen gezien hebben; en dat zij niet van uw hart wijken, al de dagen uws levens; en gij zult ze aan uw kinderen en uw kindskinderen bekend maken.","10":"Ten dage, als gij voor het aangezicht des HEEREN, uws Gods, aan Horeb stondt, als de HEERE tot mij zeide: Vergader Mij dit volk, en Ik zal hun Mijn woorden doen horen, die zij zullen leren, om Mij te vrezen al de dagen, die zij op den aardbodem zullen leven, en zij zullen ze hun kinderen leren;","11":"En gijlieden naderdet en stondt beneden dien berg; (die berg nu brandde van vuur, tot aan het midden des hemels; er was duisternis, wolken en donkerheid).","12":"Zo sprak de HEERE tot u uit het midden des vuurs; gij hoordet de stem der woorden; maar gij zaagt geen gelijkenis, behalve de stem.","13":"Toen verkondigde Hij u Zijn verbond, dat Hij u gebood te doen, de tien woorden, en schreef ze op twee stenen tafelen.","14":"Ook gebood mij de HEERE ter zelver tijd, dat ik u inzettingen en rechten leren zou; opdat gij die deedt in dat land, naar hetwelk gij doortrekt, om dat te erven.","15":"Wacht u dan wel voor uw zielen; want gij hebt geen gelijkenis gezien, ten dage als de HEERE op Horeb uit het midden des vuurs tot u sprak;","16":"Opdat gij u niet verderft, en maakt u iets gesnedens, de gelijkenis van enig beeld, de gedaante van man of vrouw,","17":"De gedaante van enig beest, dat op de aarde is; de gedaante van enigen gevleugelden vogel, die door den hemel vliegt;","18":"De gedaante van iets, dat op den aardbodem kruipt; de gedaante van enigen vis, die in het water is onder de aarde;","19":"Dat gij ook uw ogen niet opheft naar den hemel, en aanziet de zon, en de maan, en de sterren, des hemels ganse heir; en wordt aangedreven, dat gij u voor die buigt, en hen dient; dewelke de HEERE, uw God, aan alle volken onder den gansen hemel heeft uitgedeeld.","20":"Maar ulieden heeft de HEERE aangenomen, en uit den ijzeroven, uit Egypte, uitgevoerd; opdat gij Hem tot een erfvolk zoudt zijn, gelijk het te dezen dage is.","21":"Ook vertoornde Zich de HEERE over mij, om ulieder woorden; en Hij zwoer, dat ik over de Jordaan niet zou gaan, en dat ik niet zou komen in dat goede land, dat de HEERE, uw God, u ter erfenis geven zal.","22":"Want ik zal in dit land sterven; ik zal over de Jordaan niet gaan; maar gij zult er overgaan, en datzelve goede land erven.","23":"Wacht u, dat gij het verbond des HEEREN, uws Gods, hetwelk Hij met u gemaakt heeft, niet vergeet, dat gij u een gesneden beeld zoudt maken, de gelijkenis van iets, dat de HEERE, uw God, u verboden heeft.","24":"Want de HEERE, uw God, is een verterend vuur, een ijverig God.","25":"Wanneer gij nu kinderen en kindskinderen gewonnen zult hebben, en in het land oud geworden zult zijn, en u zult verderven, dat gij gesneden beelden maakt, de gelijkenis van enig ding, en doet, wat kwaad is in de ogen des HEEREN, uws Gods, om Hem tot toorn te verwekken;","26":"Zo roep ik heden den hemel en de aarde tot getuige tegen ulieden, dat gij voorzeker haast zult omkomen van dat land, waar gij over de Jordaan naar toe trekt, om dat te erven; gij zult uw dagen daarin niet verlengen, maar ganselijk verdelgd worden.","27":"En de HEERE zal u verstrooien onder de volken; en gij zult een klein volksken in getal overblijven onder de heidenen, waar de HEERE u henen leiden zal.","28":"En aldaar zult gij goden dienen, die des mensen handenwerk zijn, hout en steen, die niet zien, noch horen, noch eten, noch rieken.","29":"Dan zult gij van daar den HEERE, uw God, zoeken, en vinden; als gij Hem zoeken zult met uw ganse hart en met uw ganse ziel.","30":"Wanneer gij in angst zult zijn, en u al deze dingen zullen treffen; in het laatste der dagen, dan zult gij wederkeren tot den HEERE, uw God, en Zijn stem gehoorzaam zijn.","31":"Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, noch u verderven; en Hij zal het verbond uwer vaderen, dat Hij hun gezworen heeft, niet vergeten.","32":"Want, vraag toch naar de vorige dagen, die voor u geweest zijn, van dien dag af, dat God den mens op de aarde geschapen heeft, van het *ene* einde des hemels tot aan het *andere* einde des hemels, of zulk een groot ding geschied of gehoord zij, als dit:","33":"Of een volk gehoord hebbe de stem van God, sprekende uit het midden des vuurs, gelijk als gij gehoord hebt, en levend zij gebleven?","34":"Of: of God verzocht heeft te gaan, om Zich een volk uit het midden eens volks aan te nemen, door verzoekingen, door tekenen, en door wonderen, en door strijd, en door een sterke hand, en door een uitgestrekten arm, en met grote verschrikkingen; naar al hetgeen de HEERE, uw God, ulieden voor uw ogen in Egypte gedaan heeft?","35":"U is het getoond, opdat gij wetet, dat de HEERE die God is; er is niemand meer dan Hij alleen!","36":"Van den hemel heeft Hij u Zijn stem laten horen, om u te onderwijzen; en op de aarde heeft Hij u Zijn groot vuur doen zien; en gij hebt Zijn woorden uit het midden des vuurs gehoord.","37":"En omdat Hij uw vaderen liefhad, en hun zaad na hen verkoren had, zo heeft Hij u voor Zijn aangezicht door Zijn grote kracht uit Egypte uitgevoerd;","38":"Om volken, die groter en machtiger waren dan gij, voor uw aangezicht uit de bezitting te verdrijven; om u in te brengen, dat Hij u hunlieder land ter erfenis gave, als het te dezen dage is.","39":"Zo zult gij heden weten, en in uw hart hervatten, dat de HEERE die God is, boven in den hemel, en onder op de aarde, niemand meer!","40":"En gij zult houden Zijn inzettingen en Zijn geboden, die ik u heden gebiede, opdat het u en uw kinderen na u welga, en opdat gij de dagen verlengt in het land, dat de HEERE, uw God, u geeft, voor altoos.","41":"Toen scheidde Mozes drie steden uit, aan deze zijde van de Jordaan, tegen den opgang der zon;","42":"Opdat daarheen vlood de doodslager, die zijn naaste onwetende doodslaat, dien hij van gisteren *en* eergisteren niet haatte; dat hij in een van deze steden vlood en levend bleef;","43":"Bezer in de woestijn, in het effen land, voor de Rubenieten; en Ramoth in Gilead, voor de Gadieten; en Golan in Bazan, voor de Manassieten.","44":"Dit is nu de wet, die Mozes den kinderen Israëls voorstelde:","45":"Dit zijn de getuigenissen, en de inzettingen, en de rechten, die Mozes sprak tot de kinderen Israëls, als zij uit Egypte waren uitgetogen;","46":"Aan deze zijde van de Jordaan, in het dal tegenover Beth-peor, in het land van Sihon, den koning der Amorieten, die te Hesbon woonde; welken Mozes sloeg, en de kinderen Israëls, als zij uit Egypte waren uitgetogen,","47":"En zijn land in bezitting genomen hadden; daartoe het land van Og, koning van Bazan; twee koningen der Amorieten, die aan deze zijde van de Jordaan waren, tegen den opgang der zon;","48":"Van Aroer af, dat aan den oever der beek Arnon is, tot aan den berg Sion, welke is Hermon;","49":"En al het vlakke veld, aan deze zijde van de Jordaan, naar het oosten, tot aan de zee des vlakken velds, onder Asdoth-pisga."},"KJV":{"1":"Now therefore hearken, O Israel, unto the statutes and unto the judgments, which I teach you, for to do *them*, that ye may live, and go in and possess the land which the LORD God of your fathers giveth","2":"Ye shall not add unto the word which I command you, neither shall ye diminish *ought* from it, that ye may keep the commandments of the LORD your God which I command","3":"Your eyes have seen what the LORD did because of Baalpeor: for all the men that followed Baalpeor, the LORD thy God hath destroyed them from among","4":"But ye that did cleave unto the LORD your God *are* alive every one of you this day.","5":"Behold, I have taught you statutes and judgments, even as the LORD my God commanded me, that ye should do so in the land whither ye go to possess","6":"Keep therefore and do *them*; for this *is* your wisdom and your understanding in the sight of the nations, which shall hear all these statutes, and say, Surely this great nation *is* a wise and understanding people.","7":"For what nation *is there so* great, who *hath* God *so* nigh unto them, as the LORD our God *is* in all *things that* we call","8":"And what nation *is there so* great, that hath statutes and judgments *so* righteous as all this law, which I set before you this day?","9":"Only take heed to thyself, and keep thy soul diligently, lest thou forget the things which thine eyes have seen, and lest they depart from thy heart all the days of thy life: but teach them thy sons, and thy sons' sons;","10":"*Specially* the day that thou stoodest before the LORD thy God in Horeb, when the LORD said unto me, Gather me the people together, and I will make them hear my words, that they may learn to fear me all the days that they shall live upon the earth, and *that* they may teach their children.","11":"And ye came near and stood under the mountain; and the mountain burned with fire unto the midst of heaven, with darkness, clouds, and thick darkness.","12":"And the LORD spake unto you out of the midst of the fire: ye heard the voice of the words, but saw no similitude; only *ye heard* a voice.","13":"And he declared unto you his covenant, which he commanded you to perform, *even* ten commandments; and he wrote them upon two tables of stone.","14":"And the LORD commanded me at that time to teach you statutes and judgments, that ye might do them in the land whither ye go over to possess","15":"Take ye therefore good heed unto yourselves; for ye saw no manner of similitude on the day *that* the LORD spake unto you in Horeb out of the midst of the fire:","16":"Lest ye corrupt *yourselves*, and make you a graven image, the similitude of any figure, the likeness of male or female,","17":"The likeness of any beast that *is* on the earth, the likeness of any winged fowl that flieth in the air,","18":"The likeness of any thing that creepeth on the ground, the likeness of any fish that *is* in the waters beneath the earth:","19":"And lest thou lift up thine eyes unto heaven, and when thou seest the sun, and the moon, and the stars, *even* all the host of heaven, shouldest be driven to worship them, and serve them, which the LORD thy God hath divided unto all nations under the whole heaven.","20":"But the LORD hath taken you, and brought you forth out of the iron furnace, *even* out of Egypt, to be unto him a people of inheritance, as *ye are* this day.","21":"Furthermore the LORD was angry with me for your sakes, and sware that I should not go over Jordan, and that I should not go in unto that good land, which the LORD thy God giveth thee *for* an inheritance:","22":"But I must die in this land, I must not go over Jordan: but ye shall go over, and possess that good land.","23":"Take heed unto yourselves, lest ye forget the covenant of the LORD your God, which he made with you, and make you a graven image, *or* the likeness of any *thing*, which the LORD thy God hath forbidden","24":"For the LORD thy God *is* a consuming fire, *even* a jealous God.","25":"When thou shalt beget children, and children's children, and ye shall have remained long in the land, and shall corrupt *yourselves*, and make a graven image, *or* the likeness of any *thing*, and shall do evil in the sight of the LORD thy God, to provoke him to anger:","26":"I call heaven and earth to witness against you this day, that ye shall soon utterly perish from off the land whereunto ye go over Jordan to possess it; ye shall not prolong *your* days upon it, but shall utterly be destroyed.","27":"And the LORD shall scatter you among the nations, and ye shall be left few in number among the heathen, whither the LORD shall lead","28":"And there ye shall serve gods, the work of men's hands, wood and stone, which neither see, nor hear, nor eat, nor smell.","29":"But if from thence thou shalt seek the LORD thy God, thou shalt find *him*, if thou seek him with all thy heart and with all thy soul.","30":"When thou art in tribulation, and all these things are come upon thee, *even* in the latter days, if thou turn to the LORD thy God, and shalt be obedient unto his voice;","31":"(For the LORD thy God *is* a merciful God;) he will not forsake thee, neither destroy thee, nor forget the covenant of thy fathers which he sware","32":"For ask now of the days that are past, which were before thee, since the day that God created man upon the earth, and *ask* from the one side of heaven unto the other, whether there hath been *any such thing* as this great thing *is*, or hath been heard","33":"Did *ever* people hear the voice of God speaking out of the midst of the fire, as thou hast heard, and live?","34":"Or hath God assayed to go *and* take him a nation from the midst of *another* nation, by temptations, by signs, and by wonders, and by war, and by a mighty hand, and by a stretched out arm, and by great terrors, according to all that the LORD your God did for you in Egypt before your eyes?","35":"Unto thee it was shewed, that thou mightest know that the LORD he *is* God; *there is* none else beside him.","36":"Out of heaven he made thee to hear his voice, that he might instruct thee: and upon earth he shewed thee his great fire; and thou heardest his words out of the midst of the fire.","37":"And because he loved thy fathers, therefore he chose their seed after them, and brought thee out in his sight with his mighty power out of Egypt;","38":"To drive out nations from before thee greater and mightier than thou *art*, to bring thee in, to give thee their land *for* an inheritance, as *it is* this day.","39":"Know therefore this day, and consider *it* in thine heart, that the LORD he *is* God in heaven above, and upon the earth","40":"Thou shalt keep therefore his statutes, and his commandments, which I command thee this day, that it may go well with thee, and with thy children after thee, and that thou mayest prolong *thy* days upon the earth, which the LORD thy God giveth","41":"Then Moses severed three cities on this side Jordan toward the sunrising;","42":"That the slayer might flee thither, which should kill his neighbour unawares, and hated him not in times past; and that fleeing unto one of these cities he might live:","43":"*Namely*, Bezer in the wilderness, in the plain country, of the Reubenites; and Ramoth in Gilead, of the Gadites; and Golan in Bashan, of the Manassites.","44":"And this *is* the law which Moses set before the children of Israel:","45":"These *are* the testimonies, and the statutes, and the judgments, which Moses spake unto the children of Israel, after they came forth out of Egypt,","46":"On this side Jordan, in the valley over against Bethpeor, in the land of Sihon king of the Amorites, who dwelt at Heshbon, whom Moses and the children of Israel smote, after they were come forth out of Egypt:","47":"And they possessed his land, and the land of Og king of Bashan, two kings of the Amorites, which *were* on this side Jordan toward the sunrising;","48":"From Aroer, which *is* code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> are <span class=\"wl wl-kjv\" data-code=\"H2416\">alive</span> every one of you this day.","5":"<span class=\"wl wl-kjv\" data-code=\"H7200\">Behold,</span> I have <span class=\"wl wl-kjv\" data-code=\"H3925\">taught</span> you <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes</span> and <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> even <span class=\"wl wl-kjv\" data-code=\"H834\">as</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> me, that ye should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> so <span class=\"wl wl-kjv\" data-code=\"H7130\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> whither ye <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to possess","6":"<span class=\"wl wl-kjv\" data-code=\"H8104\">Keep</span> therefore and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them; for this is your <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> and your <span class=\"wl wl-kjv\" data-code=\"H998\">understanding</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">nations,</span> which shall <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> all these <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Surely this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> is a <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> and <span class=\"wl wl-kjv\" data-code=\"H995\">understanding</span> people.","7":"For what <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> is there so <span class=\"wl wl-kjv\" data-code=\"H1419\">great,</span> who hath <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> so <span class=\"wl wl-kjv\" data-code=\"H7138\">nigh</span> unto them, as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is in all things that we call","8":"And what <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> is there so <span class=\"wl wl-kjv\" data-code=\"H1419\">great,</span> that hath <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes</span> and <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> so <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> as all this <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> which I <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you this day?","9":"Only take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to thyself, and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">diligently,</span> lest thou <span class=\"wl wl-kjv\" data-code=\"H7911\">forget</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">things</span> which thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen,</span> and lest they <span class=\"wl wl-kjv\" data-code=\"H5493\">depart</span> from thy <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2416\">life:</span> but <span class=\"wl wl-kjv\" data-code=\"H3045\">teach</span> them thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons'</span> sons;","10":"Specially the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that thou <span class=\"wl wl-kjv\" data-code=\"H5975\">stoodest</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in <span class=\"wl wl-kjv\" data-code=\"H2722\">Horeb,</span> when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H6950\">Gather</span> me the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H6950\">together,</span> and I will make them <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> my <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H3925\">learn</span> to <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> me all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that they shall <span class=\"wl wl-kjv\" data-code=\"H2416\">live</span> upon the <span class=\"wl wl-kjv\" data-code=\"H127\">earth,</span> and that they may <span class=\"wl wl-kjv\" data-code=\"H3925\">teach</span> their children.","11":"And ye came <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> under the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain;</span> and the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> <span class=\"wl wl-kjv\" data-code=\"H1197\">burned</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3820\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> with <span class=\"wl wl-kjv\" data-code=\"H6205\">darkness,</span> <span class=\"wl wl-kjv\" data-code=\"H6051\">clouds,</span> and thick darkness.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto you out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> ye <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> but <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> no <span class=\"wl wl-kjv\" data-code=\"H8544\">similitude;</span> <span class=\"wl wl-kjv\" data-code=\"H2108\">only</span> ye heard a voice.","13":"And he <span class=\"wl wl-kjv\" data-code=\"H5046\">declared</span> unto you his <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> which he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> you to <span class=\"wl wl-kjv\" data-code=\"H6213\">perform,</span> even <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">commandments;</span> and he <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> them upon <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> of stone.","14":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> me at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> to <span class=\"wl wl-kjv\" data-code=\"H3925\">teach</span> you <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes</span> and <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> that ye might <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> whither ye go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> to possess","15":"Take ye therefore <span class=\"wl wl-kjv\" data-code=\"H3966\">good</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> unto <span class=\"wl wl-kjv\" data-code=\"H5315\">yourselves;</span> for ye <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> no manner of <span class=\"wl wl-kjv\" data-code=\"H8544\">similitude</span> on the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto you in <span class=\"wl wl-kjv\" data-code=\"H2722\">Horeb</span> out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the fire:","16":"Lest ye <span class=\"wl wl-kjv\" data-code=\"H7843\">corrupt</span> yourselves, and <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> you a graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image,</span> the <span class=\"wl wl-kjv\" data-code=\"H8544\">similitude</span> of any <span class=\"wl wl-kjv\" data-code=\"H5566\">figure,</span> the <span class=\"wl wl-kjv\" data-code=\"H8403\">likeness</span> of <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> or female,","17":"The <span class=\"wl wl-kjv\" data-code=\"H8403\">likeness</span> of any <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> that is on the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> the <span class=\"wl wl-kjv\" data-code=\"H8403\">likeness</span> of any <span class=\"wl wl-kjv\" data-code=\"H3671\">winged</span> <span class=\"wl wl-kjv\" data-code=\"H6833\">fowl</span> that <span class=\"wl wl-kjv\" data-code=\"H5774\">flieth</span> in the air,","18":"The <span class=\"wl wl-kjv\" data-code=\"H8403\">likeness</span> of any thing that <span class=\"wl wl-kjv\" data-code=\"H7430\">creepeth</span> on the <span class=\"wl wl-kjv\" data-code=\"H127\">ground,</span> the <span class=\"wl wl-kjv\" data-code=\"H8403\">likeness</span> of any <span class=\"wl wl-kjv\" data-code=\"H1710\">fish</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> <span class=\"wl wl-kjv\" data-code=\"H8478\">beneath</span> the earth:","19":"And lest thou lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> unto <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and when thou <span class=\"wl wl-kjv\" data-code=\"H7200\">seest</span> the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3394\">moon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars,</span> even all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> shouldest be <span class=\"wl wl-kjv\" data-code=\"H5080\">driven</span> to <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> them, which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H2505\">divided</span> unto all <span class=\"wl wl-kjv\" data-code=\"H5971\">nations</span> under the whole heaven.","20":"But the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> you, and brought you <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> <span class=\"wl wl-kjv\" data-code=\"H3564\">furnace,</span> even out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> to be unto him a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> as ye are this day.","21":"Furthermore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H599\">angry</span> with me for your <span class=\"wl wl-kjv\" data-code=\"H1697\">sakes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> that I should not go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> and that I should not <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> in unto that <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> thee for an inheritance:","22":"But I must <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> I must not go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan:</span> but ye shall go <span class=\"wl wl-kjv\" data-code=\"H5674\">over,</span> and <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> that <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> land.","23":"Take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> unto yourselves, lest ye <span class=\"wl wl-kjv\" data-code=\"H7911\">forget</span> the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which he <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> with you, and <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> you a graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image,</span> or the <span class=\"wl wl-kjv\" data-code=\"H8544\">likeness</span> of <span class=\"wl wl-kjv\" data-code=\"H3605\">any</span> thing, which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath forbidden","24":"For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is a <span class=\"wl wl-kjv\" data-code=\"H398\">consuming</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> even a <span class=\"wl wl-kjv\" data-code=\"H7067\">jealous</span> God.","25":"When thou shalt <span class=\"wl wl-kjv\" data-code=\"H3205\">beget</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> and <span class=\"wl wl-kjv\" data-code=\"H1121\">children's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> and ye shall have remained <span class=\"wl wl-kjv\" data-code=\"H3462\">long</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7843\">corrupt</span> yourselves, and <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image,</span> or the <span class=\"wl wl-kjv\" data-code=\"H8544\">likeness</span> of any thing, and shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to provoke him to anger:","26":"I <span class=\"wl wl-kjv\" data-code=\"H5749\">call</span> <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> and <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> to <span class=\"wl wl-kjv\" data-code=\"H5749\">witness</span> against you this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that ye shall <span class=\"wl wl-kjv\" data-code=\"H4118\">soon</span> <span class=\"wl wl-kjv\" data-code=\"H6\">utterly</span> <span class=\"wl wl-kjv\" data-code=\"H6\">perish</span> from off the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> whereunto ye go <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it; ye shall not <span class=\"wl wl-kjv\" data-code=\"H748\">prolong</span> your <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> upon it, but shall <span class=\"wl wl-kjv\" data-code=\"H8045\">utterly</span> be destroyed.","27":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H6327\">scatter</span> you among the <span class=\"wl wl-kjv\" data-code=\"H5971\">nations,</span> and ye shall be <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> <span class=\"wl wl-kjv\" data-code=\"H4962\">few</span> in <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> whither the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall lead","28":"And there ye shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> and <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> which neither <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> nor <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> nor <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> nor smell.","29":"But if from thence thou shalt <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> him, if thou <span class=\"wl wl-kjv\" data-code=\"H1875\">seek</span> him with all thy <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> and with all thy soul.","30":"When thou art in <span class=\"wl wl-kjv\" data-code=\"H6862\">tribulation,</span> and all these <span class=\"wl wl-kjv\" data-code=\"H1697\">things</span> are <span class=\"wl wl-kjv\" data-code=\"H4672\">come</span> upon thee, even in the <span class=\"wl wl-kjv\" data-code=\"H319\">latter</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> if thou <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and shalt be <span class=\"wl wl-kjv\" data-code=\"H8085\">obedient</span> unto his voice;","31":"(For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is a <span class=\"wl wl-kjv\" data-code=\"H7349\">merciful</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God;)</span> he will not <span class=\"wl wl-kjv\" data-code=\"H7503\">forsake</span> thee, neither <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> thee, nor <span class=\"wl wl-kjv\" data-code=\"H7911\">forget</span> the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> which he sware","32":"For <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> now of the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that are <span class=\"wl wl-kjv\" data-code=\"H7223\">past,</span> which <span class=\"wl wl-kjv\" data-code=\"H1961\">were</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, since the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1254\">created</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and ask from the one <span class=\"wl wl-kjv\" data-code=\"H7097\">side</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> unto the other, whether there hath been any such thing as this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> is, or hath been heard","33":"Did ever <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> speaking <span class=\"wl wl-kjv\" data-code=\"H1696\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> as thou hast <span class=\"wl wl-kjv\" data-code=\"H8085\">heard,</span> and live?","34":"Or hath <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5254\">assayed</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> him a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> from the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of another <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> by <span class=\"wl wl-kjv\" data-code=\"H4531\">temptations,</span> by <span class=\"wl wl-kjv\" data-code=\"H226\">signs,</span> and by <span class=\"wl wl-kjv\" data-code=\"H4159\">wonders,</span> and by <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> and by a <span class=\"wl wl-kjv\" data-code=\"H2389\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and by a stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> <span class=\"wl wl-kjv\" data-code=\"H2220\">arm,</span> and by <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4172\">terrors,</span> according to all that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> for you in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> before your eyes?","35":"Unto thee it was <span class=\"wl wl-kjv\" data-code=\"H7200\">shewed,</span> that thou mightest <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> he is <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> there is none <span class=\"wl wl-kjv\" data-code=\"H5750\">else</span> beside him.","36":"Out of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> he made thee to <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> that he might <span class=\"wl wl-kjv\" data-code=\"H3256\">instruct</span> thee: and upon <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> he <span class=\"wl wl-kjv\" data-code=\"H7200\">shewed</span> thee his <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> and thou <span class=\"wl wl-kjv\" data-code=\"H8085\">heardest</span> his <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the fire.","37":"And because he <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> therefore he <span class=\"wl wl-kjv\" data-code=\"H977\">chose</span> their <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them, and brought thee <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> in his <span class=\"wl wl-kjv\" data-code=\"H6440\">sight</span> with his <span class=\"wl wl-kjv\" data-code=\"H1419\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> out of Egypt;","38":"To drive <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee <span class=\"wl wl-kjv\" data-code=\"H1419\">greater</span> and <span class=\"wl wl-kjv\" data-code=\"H6099\">mightier</span> than thou art, to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> thee in, to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee their <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> for an <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> as it is this day.","39":"<span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> therefore this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">consider</span> it in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> he is <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">above,</span> and upon the earth","40":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> therefore his <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> which I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that it may go <span class=\"wl wl-kjv\" data-code=\"H3190\">well</span> with thee, and with thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> thee, and that thou mayest <span class=\"wl wl-kjv\" data-code=\"H748\">prolong</span> thy <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> upon the <span class=\"wl wl-kjv\" data-code=\"H127\">earth,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> giveth","41":"Then <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H914\">severed</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> on this <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> toward the <span class=\"wl wl-kjv\" data-code=\"H8121\">sunrising;</span>","42":"That the <span class=\"wl wl-kjv\" data-code=\"H7523\">slayer</span> might <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> thither, which should <span class=\"wl wl-kjv\" data-code=\"H7523\">kill</span> his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour</span> <span class=\"wl wl-kjv\" data-code=\"H1097\">unawares,</span> and <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> him not in <span class=\"wl wl-kjv\" data-code=\"H8543\">times</span> <span class=\"wl wl-kjv\" data-code=\"H8032\">past;</span> and that <span class=\"wl wl-kjv\" data-code=\"H5127\">fleeing</span> unto <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of <span class=\"wl wl-kjv\" data-code=\"H411\">these</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> he might live:","43":"Namely, <span class=\"wl wl-kjv\" data-code=\"H1221\">Bezer</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> in the <span class=\"wl wl-kjv\" data-code=\"H4334\">plain</span> <span class=\"wl wl-kjv\" data-code=\"H776\">country,</span> of the <span class=\"wl wl-kjv\" data-code=\"H7206\">Reubenites;</span> and <span class=\"wl wl-kjv\" data-code=\"H7216\">Ramoth</span> in <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> of the <span class=\"wl wl-kjv\" data-code=\"H1425\">Gadites;</span> and <span class=\"wl wl-kjv\" data-code=\"H1474\">Golan</span> in <span class=\"wl wl-kjv\" data-code=\"H1316\">Bashan,</span> of the Manassites.","44":"And this is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> which <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel:","45":"These are the <span class=\"wl wl-kjv\" data-code=\"H5713\">testimonies,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> which <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> after they came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of Egypt,","46":"On this <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> in the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> over <span class=\"wl wl-kjv\" data-code=\"H4136\">against</span> <span class=\"wl wl-kjv\" data-code=\"H1047\">Bethpeor,</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> who <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> at <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon,</span> whom <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote,</span> after they were come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of Egypt:","47":"And they <span class=\"wl wl-kjv\" data-code=\"H3423\">possessed</span> his <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H5747\">Og</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H1316\">Bashan,</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> which were on this <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> toward the <span class=\"wl wl-kjv\" data-code=\"H4217\">sunrising;</span>","48":"From <span class=\"wl wl-kjv\" data-code=\"H6177\">Aroer,</span> which is by the <span class=\"wl wl-kjv\" data-code=\"H8193\">bank</span> of the <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> <span class=\"wl wl-kjv\" data-code=\"H769\">Arnon,</span> even unto <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H7865\">Sion,</span> which is Hermon,","49":"And all the <span class=\"wl wl-kjv\" data-code=\"H6160\">plain</span> on this <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> <span class=\"wl wl-kjv\" data-code=\"H4217\">eastward,</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> of the <span class=\"wl wl-kjv\" data-code=\"H6160\">plain,</span> under the <span class=\"wl wl-kjv\" data-code=\"H794\">springs</span> of Pisgah."},"bijbeluitleg":{"kanttekeningen_nl":{"3":[{"catchword":"om Baäl-péor gedaan heeft;","tekst":"Dat is, om de afgoderij met den Baäl-Peor bedreven. Anders, tegen, vanwege, met."}],"6":[{"catchword":"dat zal uw wijsheid en uw verstand zijn","tekst":"Dat is, dit zult gij voor de ware wijsheid en kloekheid houden, en daarvan onder de omliggende volken openbare belijdenis doen, waarbij Ik alzo zal werken, dat zij u alleen voor een recht, wijs en kloek volk zullen houden."},{"catchword":"Dit groot volk alleen","tekst":"Anders, immers, of, gewisselijk is dit grote volk, enz."}],"7":[{"catchword":"nabij zijn als de HEERE,","tekst":"Dat is Goddelijke genadige tegenwoordigheid alzo bewijzende met allerlei zegeningen en bijzonder met zeer wonderlijke, gerede en krachtige hulp in noden en zwarigheden."},{"catchword":"zo dikwijls als wij Hem aanroepen?","tekst":"Hebreeuws, in al ons roepen tot hem; dat is zo dikwijls wij hem aanroepen: of, in alles, waarom wij hem aanroepen."}],"8":[{"catchword":"voor uw aangezicht geef?","tekst":"Anders, u voorstel."}],"9":[{"catchword":"wel,","tekst":"Hebreeuws, zeer; en alzo vs.15, enz."}],"10":[{"catchword":"gij voor het aangezicht des HEEREN,","tekst":"Dit moet men in het algemeen verstaan van het ganse volk Israëls; want degenen, die in dien tijd aan den berg Horeb stonden, waren nu al gestorven, boven, Deu 2:14-16, hoewel het gelooflijk is, dat er van de tegenwoordig levenden, die toen jong waren, mede bij hun vaderen aan den berg Horeb gestaan hebben."}],"11":[{"catchword":"midden des hemels;","tekst":"Hebreeuws, tot aan het hart des hemels; dat is, midden in de lucht. Alzo in het hart van de zee, Exo 15:8; Pro 23:34, en Pro 30:19; idem, in het hart van den eik, 2Sa 18:14; in het hart der aarde, Mat 12:40."}],"12":[{"catchword":"gelijkenis,","tekst":"Te weten, waardoor God zou afgebeeld zijn."},{"catchword":"behalve de stem","tekst":"Dat is, maar hoorde alleen de stem."}],"13":[{"catchword":"woorden,","tekst":"Dat is, geboden."}],"15":[{"catchword":"voor uw zielen;","tekst":"Dat is, ten beste van uw zielen; draagt goede zorg voor uw zielen. Vergelijk Jos 23:11; Jer 17:21; Mal 2:15-16."}],"16":[{"catchword":"u niet verderft,","tekst":"Anders, het niet verderft"},{"catchword":"enig beeld,","tekst":"Versta, tot enig religieus of godsdienstig gebruik. Want dit gaat het burgerlijk, nodig en matig gebruik van schilderijen, beelden, kaarten, munten, enz. niet aan, noch ook het sieraad van den tabernakel, wat de Heere zelf bevolen heeft."}],"17":[{"catchword":"door den hemel vliegt;","tekst":"Dat is, door, of in de lucht."}],"19":[{"catchword":"dewelke de HEERE uw God,","tekst":"Dat is, omdat zij geen god, maar Gods schepselen zijn, die Hij tot algemeen gebruik en dienst der mensen geschapen heeft."}],"20":[{"catchword":"ijzeroven, uit Egypte,","tekst":"Versta, een smeltoven, of smeltketel, waarin men ijzer smelt. Zie 1Ki 8:51. Egypte wordt daarbij vergeleken vanwege de benauwdheid en de ellende, die Israël daar uitgestaan en geleden had."},{"catchword":"tot een erfvolk zoudt zijn,","tekst":"Zie Exo 19:5; Tit 2:14."}],"21":[{"catchword":"Ook vertoornde Zich de HEERE over mij,","tekst":"Zie boven, Deu 1:37."}],"23":[{"catchword":"gemaakt heeft,","tekst":"Zie Gen 15:17-18."},{"catchword":"gesneden beeld zoudt maken,","tekst":"Of, gegraven"},{"catchword":"verboden heeft","tekst":"Hebreeuws, geboden heeft. Van het gebruik van dit woord, zie men Lev 4:2, en boven, Deu 2:37."}],"24":[{"catchword":"vuur,","tekst":"God wordt vergeleken bij een vuur, vanwege zijn haat en schrikkelijken toorn tegen de zonde en den zondaar, dien Hij met tijdelijke en inzonderheid eeuwige straffen [zo hij ongelovig en onboetvaardig blijft] vervolgt en verteert, gelijk een aangestoken en brandend vuur zeer sterk doordringt, en alles, dat brandbaar is, wijd en zijd verteert. Zie onder, Deu 9:3, en Deu 32:22; Psa 21:10 en Psa 78:21; Isa 33:14, enz.; Jer 4:4; Heb 12:29."},{"catchword":"ijverig God","tekst":"Die jaloers is, alleen als God wil gekend en geëerd zijn, en geen medegenoot nevens zich die eer toestaat [ Isa 42:8, en Isa 48:11 ] , houdende zich sterk en vuriglijk over alles, dat zijn eer aangaat, en vijandiglijk hatende alles wat daartegen strijdt."}],"25":[{"catchword":"oud geworden zult zijn,","tekst":"Dat is, lang gewoond zult hebben."},{"catchword":"enig ding,","tekst":"Zie boven, vs.16-19, en Exo 20:4."},{"catchword":"kwaad is","tekst":"Dat is, wat hem mishaagt of kwalijk bevalt."}],"26":[{"catchword":"hemel en de aarde","tekst":"Dat is, alle hemelse en aarse schepselen. Dit is een manier van spreken, waardoor de onvernuftige schepselen tegen den mens, wegens verstoktheid en ongevoeligheid, worden ingevoerd om hem door natuurlijke redenen, die hij in het aanschouwen en gebruiken daarvan behoort te betrachten van zijn hardnekkigheid en ondankbaarheid tegen den machtigen en goeden God aan te klagen en te overtuigen. Zie onder, Deu 30:19, en Deu 31:28, en vergelijk onder, Deu 32:1; Isa 1:2; Mic 6:2."},{"catchword":"voorzeker haast zult omkomen","tekst":"Hebreeuws, omkomende omkomen"},{"catchword":"ganselijk verdelgd worden","tekst":"Hebreeuws, verdelgd wordende verdelgd worden."}],"27":[{"catchword":"een klein volksken","tekst":"Hebreeuws, lieden van getal; dat is, die haast geteld zijn. Zie Gen 34:30."}],"29":[{"catchword":"ganse hart en met uw ganse ziel","tekst":"Zie onder, Deu 6:5."}],"30":[{"catchword":"al deze dingen zullen treffen;","tekst":"Hebreeuws, al deze woorden, of zaken zullen vinden. Zie gelijke manier van spreken onder, Deu 31:17, en 1Sa 23:17; versta die voorgezegde ellenden. Zie boven, vs.26,27."},{"catchword":"dan zult gij wederkeren","tekst":"Dit [alsook vs.29] schijnt een profetie te zijn van de bekering der Joden. Vergelijk onder, Deu 30:1-3, enz. Hos 3:5. Anders, en gij u bekeren zult tot den Heere uwen God, enz., en dan in Deu 5:31, zo zal Hij u niet verlaten, enz."},{"catchword":"tot den HEERE, uw God,","tekst":"Anders, tot den Heere uwen God toe. Zie hiervan Joe 2:12."}],"31":[{"catchword":"uwer vaderen,","tekst":"Dat is, met uwe vaders opgericht, gelijk de volgende woorden aanwijzen."}],"32":[{"catchword":"ene einde des hemels","tekst":"Dat is, in de ganse wereld, die onder den hemel gelegen is, van het ene einde der wereld tot het andere; alzo onder, Deu 30:4; Mat 24:31; Mar 13:27."}],"34":[{"catchword":"verzoekingen,","tekst":"Door welke Farao verzocht werd of hij Israël zou laten trekken, en Israël, of zij hun God zouden vertrouwen. Zie van het woord verzoeken Gen 21:1."},{"catchword":"strijd,","tekst":"Zo tegen Farao, dien God met zijn ganse heirleger in de Rode zee gestort en verdelgd heeft, als tegen Sihon en Og, de koningen der Amorieten."},{"catchword":"verschrikkingen;","tekst":"Die eerst over de Egyptenaars en daarna over andere volken gekomen zijn. Zie Exo 23:27, en boven, Deu 2:25, en onder, Deu 34:12. Anders, verschrikkelijkheden; dat is, schrikkelijke daden."}],"35":[{"catchword":"die God is;","tekst":"Dat is, alleen de ware God is, gelijk de volgende woorden uitwijzen."},{"catchword":"dan Hij alleen","tekst":"Of, behalve Hij alleen, buiten Hem alleen."}],"36":[{"catchword":"Van den hemel","tekst":"Dat is, uit de lucht."},{"catchword":"op de aarde","tekst":"Te weten, op den berg Sinaï."}],"37":[{"catchword":"hun zaad na hen","tekst":"Hebreeuws, zijn zaad na hem; dat is, een ieders zaad na hem."},{"catchword":"voor Zijn aangezicht","tekst":"Anders, met zijn aangezicht; dat is, tegenwoordigheid zonderling betonende door de wolkkolom en de vuurkolom, en u steeds als onder zijn ogen hebbende, om u overal te geleiden. Vergelijk Exo 13:21, en Exo 14:19-20."}],"39":[{"catchword":"in uw hart hervatten,","tekst":"Dat is, indachtig zijn en behartigen."}],"40":[{"catchword":"voor altoos","tekst":"Versta, met conditie van gehoorzaamheid. Vergelijk boven, vs.26,27. Hebreeuws, al de dagen. Welke woorden ook kunnen gevoegd worden in het begin van het vs.: Houdt al de dagen; te weten, uws levens, altijd."}],"41":[{"catchword":"scheidde Mozes drie steden uit,","tekst":"Volgens Gods bevel; Num 35:14."}],"42":[{"catchword":"van gisteren","tekst":"Dat is, van tevoren."}],"43":[{"catchword":"Bezer in de woestijn,","tekst":"Zie Jos 20:8."},{"catchword":"voor de Rubenieten;","tekst":"Hebreeuws, voor den Rubeniet; en zo in het volgende. Anders, van, of der; en zo in het volgende."}],"45":[{"catchword":"Dit zijn de","tekst":"Versta, die in Deu 5 verhaald worden."},{"catchword":"getuigenissen,","tekst":"Versta, Gods heilige leer, getuigende van zijn wezen, wil en werken. Zie onder, Deu 6:17, en Psa 19:8, enz."}],"46":[{"catchword":"Beth-péor,","tekst":"Zie boven, Deu 3:29."}],"48":[{"catchword":"oever der beek Arnon is,","tekst":"Hebreeuws, aan de lip. Zie Gen 41:3."},{"catchword":"Sion, welke is Hermon;","tekst":"Zie boven, Deu 3:9."}],"49":[{"catchword":"zee des vlakken velds,","tekst":"Versta, de Dode zee, of Zoutzee. Zie Gen 14:3."},{"catchword":"Asdoth-pisga","tekst":"Zie boven, Deu 3:17."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now then Israel hearkened unto the statutes and unto the judgments which I teach you to do that ye may live and go in and inherit that land which the Lord god our father giveth ye."}],"2":[{"catchword":null,"tekst":"Ye shall not add unto this word which I command ye neither diminish there from that ye may keep the commandments of the LORD your God which I command ye."}],"3":[{"catchword":null,"tekst":"Your eyes have seen what God did for Baal-Poer [that is for the idolatry committed by Baal Poer others against because of with] for all or every man that followed Baal- Poer the LORD your God have destroyed from the midst of you."}],"4":[{"catchword":null,"tekst":"Ye on the contrary do call unto the LORD your God ye are all alive this day."}],"5":[{"catchword":null,"tekst":"Behold I have taught ye the statutes and judgments according as the LORD my God commanded me that ye might do so in the midst of the land wither ye go to inherit it."}],"6":[{"catchword":null,"tekst":"Keep them then and do them then for that shall be your wisdom and your understanding before the eyes of the nations which shall hear all these statutes and say this same great people alone is a wise and understanding people [that is ye shall hold this to be true wisdom and understanding and make public profession thereof among the nations round about whereby I will also work effectually that they shall hold ye alone to be truly wise and understanding people others surely or certainly this great people I &c.]"}],"7":[{"catchword":null,"tekst":"For what great people are there to whom the Gods are so nigh [that is so manifesting divine gracious presence with all manner of blessings and especially with most wonderful ready and powerful help in distress and difficulties] as the LORD our God is as oft as we call upon him? [In all our calling unto him that is as oft as we call upon him or in all things that we call upon him for.]"}],"8":[{"catchword":null,"tekst":"And that great people is there that hath statutes and judgments as righteous as all this law which I give before your face [others set before you] this day."}],"9":[{"catchword":null,"tekst":"Only take heed to thy soul well [Heb. greatly and so verse 15 &c.] lest thou forget the things which thine eyes have seen and lest they depart from thine heart all the days of thy life and thou shalt make them known to thy children&acirc;&euro;&trade;s children."}],"10":[{"catchword":null,"tekst":"On the day when thou stoodest before the face of the LORD thy God at Horeb [this must in general be understood of all people of Israel for those that stood at mount Horeb were now all dead above chapter 2.14,15,16 however it is probable that some of those that were alive at present that were very young at that time spoke likewise with their fathers at mount Horeb.] when the Lord said unto me gather me these people together and I will make them hear my word which they shall learn to fear me all days that they shall live upon the earth and shall teach them their children."}],"11":[{"catchword":null,"tekst":"And he came near and stood beneath the mountain and now the mountain burnt with fire unto the midst of heaven [Heb. Unto the heart of heaven that is in the midst of the air so in the heart of the sea Exo 15:8 Prov 23:34 and 30.19 so in the heart of the oak 2Sa 18:14 in the heart of the earth Mat 12:40] there was darkness clouds and thick darkness."}],"12":[{"catchword":null,"tekst":"So the LORD spake unto ye in the midst of the fire ye heard the voice of the words but ye saw no similitude [to wit whereby God might be presented ] saving the voice [but ye only heard a voice.]"}],"13":[{"catchword":null,"tekst":"Then he declared unto ye his covenant which h commanded ye to do the ten words [that is commandments] and wrote them upon two tables of stones."}],"14":[{"catchword":null,"tekst":"Also the LORD commanded me at that time to teach ye statutes and the judgments that ye might do them in that land wither to go out to inherit it."}],"15":[{"catchword":null,"tekst":"Take ye then good heed of your souls [that is for the good of your souls take great care of your souls compare Jos 23:11 Jer 17:21 Mal 2:15,16.] For ye saws no similitude on the day when the LORD spake unto ye in Horeb out of the midst of fire."}],"17":[{"catchword":null,"tekst":"The shape of any beast that is on the earth the shape of any winged fowl that flieth through heaven [that is through or in the air.]"}],"18":[{"catchword":null,"tekst":"The shape of anything that creepeth on the earth the shape of any fish that is in the water under the earth."}],"19":[{"catchword":null,"tekst":"Lest thou also lift thine eyes unto heaven and behold the sun and the moon and the stars and all the hosts of heaven and be driven to bow down thyself before them which the LORD thy God hath delivered unto all nations under the whole heaven [ that is because they are not God but gods creatures which he created for the common use and service of man.]"}],"20":[{"catchword":null,"tekst":"But the Lord hath taken ye and brought ye forth out of the iron furnace out of Egypt [understand a melting furnace kettle wherein iron is melted see 1Ki 8:51 Egypt is compared to such a furnace in regard of affliction and misery that Israel had sustained and suffered there] that ye might be unto him a people of inheritance [see Exo 19:5 Titus 2.14] as it is this day."}],"21":[{"catchword":null,"tekst":"Also the LORD was angry with me for your sakes [see above chapter 1 verse 37] and he swear that I should not go over the Jordan and that I should not enter into that good land which the LORD thy God shall give thee for an inheritance."}],"22":[{"catchword":null,"tekst":"For I must die in this land I must go over the Jordan but ye shall go over and inherit that good land."}],"23":[{"catchword":null,"tekst":"Take good heed unto yourselves lest ye forget the covenant of the Lord your God which he made with you [se Genesis 15 on verse 17, 18] that ye should make ye a carved [or graven] image the likeness of anything which the Lord thy God hath forbidden thee [Heb. Hath commanded &c. of the use of this word see Leviticus 4 on verse 2 and above chapter 3.36.]"}],"24":[{"catchword":null,"tekst":"For the LORD thy God is consuming fire [God is compared to fire in regard of his hatred and dreadful anger against sin and sinner whom he followeth and consumeth all combustible matter on every side see below chapter 9.3 and 32.22 Psa 21:10 and 78.21 Isa 33:14&c. Jer 14:4 Heb 12:29] a jealous God [who is jealous is always acknowledged and honored as God and suffereth none to partake with him in honor Psa 42:8 and 48.11 behaving himself strong and zealous against all that concerneth his honor and hateth as a n enemy whatsoever opposeth it.]"}],"25":[{"catchword":null,"tekst":"Now when thou shalt have begotten children and children&acirc;&euro;&trade;s children and shall be grown old [that is shalt have lived long] in the land and shall corrupt yourselves to make a carved image the likeness of any thing [see above verse 16,17,18,19 and Exodus 20 on verse 4] and do that which is evil in the eyes of the Lord thy God [that is that is pleaseth and misliketh him] to provoke him to anger."}],"26":[{"catchword":null,"tekst":"I call heaven and earth to witness against ye [that is all heavenly and earthly creature to witness against ye this is a phrase whereby the brute creatures are brought n against men by reason of his stupidity and senselessness to accuse and convince him by natural reasons which he ought to mind in contemplating and using those creatures of is stifneckedness an unthankfulness towards the almighty and gracious God see below chapter 30.19 and 31.8 and compare below chapter 32.1 Isa 1:11 Micah 6.2] this day that ye shall so assuredly perish [Heb. Perishing perish] from off that land whereunto ye go over the Jordan to inherit ye shall not prolong your days in it but shall utterly be destroyed [Heb. Being destroyed be destroyed.]"}],"27":[{"catchword":null,"tekst":"And the LORD shall scatter ye among the nations and ye shall be left a small people [Heb. Men of number that is that are soon numbered see Gen 34:30.] among the heathen wither the LORD shall lead you."}],"28":[{"catchword":null,"tekst":"And there ye shall serve gods which are the work of men&acirc;&euro;&trade;s hands wood and stone which neither see nor hear nor eat nor smell."}],"29":[{"catchword":null,"tekst":"Then thou shalt seek from thence the LORD thy God and find him when thou shalt seek him with all thine heart and with all thy souls [see below chapter 6 on verse 5.]"}],"30":[{"catchword":null,"tekst":"When then thou shalt be in distress a these things shall hit thee [Heb. All these words or things shall find thee see the like phrase below chapter 31.17 and 1Sa 23:17 understand the foresaid miseries see above verse 26.27] in the last days then thou shalt turn to the LORD thy God [this verse as likewise the former seemeth to be prophesy of conversion of the Jews compare below chapter 30 verse 1,2,3 &c. Hosiah 13.5 others turn to the LORD thy God &c. and then in the following verse he will not forsake thee &c. others even unto the LORD thy God see hereof Joel 2 on verse 12] and be obedient to his voice."}],"31":[{"catchword":null,"tekst":"For the Lord thy God is merciful God he will not f // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
