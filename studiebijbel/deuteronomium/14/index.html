en hert, en een ree, en een buffel, en een steenbok, en een das, en een wilde os, en een gems.","6":"Alle dieren die de klauwen verdelen en in tweeën gekloofde klauwen hebben, *en* herkauwen onder de dieren, die zult u eten.","7":"Maar deze zult u niet eten, van degenen die *alleen* herkauwen, of van degenen die de gekloofde klauw *alleen* verdelen: de kameel, en de haas, en het konijn; want deze herkauwen wel, maar zij verdelen de klauw niet; onrein zullen zij voor u zijn.","8":"Ook het varken; want dat verdeelt zijn klauw wel, maar het herkauwt niet; onrein zal het voor u zijn; van hun vlees zult u niet eten, en hun dode kadaver zult u niet aanraken.","9":"Dit zult u eten van alles wat in het water is; alles wat vinnen en schubben heeft, zult u eten.","10":"Maar alles wat geen vinnen en schubben heeft, zult u niet eten; het zal voor u onrein zijn.","11":"Elke reine vogel zult u eten.","12":"Maar deze zijn het waarvan u niet zult eten: de arend, en de havik, en de zeearend;","13":"En de wouw, en de kraai, en de gier naar zijn soort;","14":"En elke raaf naar zijn soort;","15":"En de struisvogel, en de nachtuil, en de koekoek, en de sperwer naar zijn soort;","16":"En de steenuil, en de schuifuit, en de kauw,","17":"En de roerdomp, en de pelikaan, en het duikertje;","18":"En de ooievaar, en de reiger naar zijn soort; en de hop, en de vleermuis;","19":"Ook al het kruipend gevogelte zal voor u onrein zijn; het zal niet gegeten worden.","20":"Al het reine gevogelte zult u eten.","21":"U zult geen dood aas eten; aan de vreemdeling die in uw poorten is, zult u het geven, zodat hij het eet, of verkoop het aan de vreemde; want u bent een heilig volk voor de HEERE, uw God. U zult het bokje niet koken in de melk van zijn moeder.","22":"U zult getrouw vertienen alle opbrengst van uw zaad, dat elk jaar van het veld voortkomt.","23":"En voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen om Zijn Naam daar te doen wonen, zult u eten de tienden van uw koren, van uw most, en van uw olie, en de eerstgeboorte van uw runderen en van uw schapen; opdat u de HEERE, uw God, leert vrezen alle dagen.","24":"Wanneer dan de weg voor u te lang zal zijn, zodat u het niet zou kunnen dragen, omdat de plaats te ver van u zal zijn – die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te vestigen – wanneer de HEERE, uw God, u gezegend zal hebben;","25":"Zo maak het tot geld, en bind het geld in uw hand, en ga naar de plaats die de HEERE, uw God, zal uitkiezen;","26":"En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.","27":"Maar de Leviet die in uw poorten is, zult u niet verlaten; want hij heeft geen deel noch erfdeel met u.","28":"Aan het einde van drie jaren zult u alle tienden van uw opbrengst voortbrengen, in datzelfde jaar, en u zult ze wegleggen in uw poorten;","29":"Zo zal de Leviet komen – omdat hij geen deel noch erfdeel met u heeft – en de vreemdeling, en de wees en de weduwe die in uw poorten zijn, en zij zullen eten en verzadigd worden; opdat de HEERE, uw God, u zegent in al het werk van uw hand, dat u doen zult."},"SV":{"1":"Gijlieden zijt kinderen des HEEREN, uws Gods; gij zult uzelven niet snijden, noch kaalheid maken tussen uw ogen, over een dode.","2":"Want gij zijt een heilig volk den HEERE, uw God; en u heeft de HEERE verkoren, om Hem tot een volk des eigendoms te zijn, uit al de volken, die op den aardbodem zijn.","3":"Gij zult geen gruwel eten.","4":"Dit zijn de beesten, die gijlieden eten zult; een os, klein vee der schapen, en klein vee der geiten;","5":"Een hert, en een ree, en een buffel, en een steenbok, en een das, en een wilde os, en een gems.","6":"Alle beesten, die de klauwen verdelen, en de kloof in twee klauwen klieven, *en* herkauwen onder de beesten, die zult gij eten.","7":"Maar deze zult gij niet eten, van degenen, die *alleen* herkauwen, of van degenen, die den gekloofden klauw *alleen* verdelen: den kemel, en den haas, en het konijn; want deze herkauwen wel, maar zij verdelen den klauw niet; onrein zullen zij ulieden zijn.","8":"Ook het varken; want dat verdeelt zijn klauw wel, maar het herkauwt niet; onrein zal het ulieden zijn; van hun vlees zult gij niet eten, en hun dood aas zult gij niet aanroeren.","9":"Dit zult gij eten van alles, wat in de wateren is; al wat vinnen en schubben heeft, zult gij eten.","10":"Maar al wat geen vinnen en schubben heeft, zult gij niet eten; het zal ulieden onrein zijn.","11":"Allen reinen vogel zult gij eten.","12":"Maar deze zijn het, van dewelke gij niet zult eten: de arend, en de havik, en de zeearend;","13":"En de wouw, en de kraai, en de gier naar haar aard;","14":"En alle rave naar zijn aard;","15":"En de struis, en de nachtuil, en de koekoek, en de sperwer naar zijn aard;","16":"En de steenuil, en de schuifuit, en de kauw,","17":"En de roerdomp, en de pelikaan, en het duikertje;","18":"En de ooievaar, en de reiger naar zijn aard; en de hop, en de vledermuis;","19":"Ook al het kruipend gevogelte zal ulieden onrein zijn; zij zullen niet gegeten worden.","20":"Al het rein gevogelte zult gij eten.","21":"Gij zult geen dood aas eten; den vreemdeling, die in uw poorten is, zult gij het geven, dat hij het ete, of verkoopt het den vreemde; want gij zijt een heilig volk den HEERE, uw God. Gij zult het bokje niet koken in de melk zijner moeder.","22":"Gij zult getrouwelijk vertienen al het inkomen uws zaads, dat elk jaar van het veld voortkomt.","23":"En voor het aangezicht des HEEREN, uws Gods, ter plaatse, die Hij verkiezen zal, om Zijn Naam aldaar te doen wonen, zult gij eten de tienden van uw koren, van uw most, en van uw olie, en de eerstgeboorten uwer runderen en uwer schapen; opdat gij den HEERE, uw God, leert vrezen alle dagen.","24":"Wanneer dan nog de weg voor u te veel zal zijn, dat gij zulks niet zoudt kunnen heendragen, omdat de plaats te verre van u zal zijn, die de HEERE, uw God, verkiezen zal, om Zijn Naam aldaar te stellen; wanneer de HEERE, uw God, u zal gezegend hebben;","25":"Zo maak het tot geld, en bindt het geld in uw hand, en gaat naar de plaats, die de HEERE, uw God, verkiezen zal;","26":"En geeft dat geld voor alles, wat uw ziel gelust, voor runderen en voor schapen, en voor wijn, en voor sterken drank, en voor alles, wat uw ziel van u begeren zal, en eet aldaar voor het aangezicht des HEEREN, uws Gods, en weest vrolijk, gij en uw huis.","27":"Maar den Leviet, die in uw poorten is, zult gij niet verlaten; want hij heeft geen deel noch erve met u.","28":"Ten einde van drie jaren zult gij voortbrengen alle tienden van uw inkomen, in hetzelve jaar, en gij zult ze wegleggen in uw poorten;","29":"Zo zal komen de Leviet, dewijl hij geen deel noch erve met u heeft, en de vreemdeling, en de wees en de weduwe, die in uw poorten zijn, en zullen eten en verzadigd worden; opdat u de HEERE, uw God, zegene in al het werk uwer hand, dat gij doen zult."},"KJV":{"1":"Ye *are* the children of the LORD your God: ye shall not cut yourselves, nor make any baldness between your eyes for the dead.","2":"For thou *art* an holy people unto the LORD thy God, and the LORD hath chosen thee to be a peculiar people unto himself, above all the nations that *are* upon the earth.","3":"Thou shalt not eat any abominable thing.","4":"These *are* the beasts which ye shall eat: the ox, the sheep, and the goat,","5":"The hart, and the roebuck, and the fallow deer, and the wild goat, and the pygarg, and the wild ox, and the chamois.","6":"And every beast that parteth the hoof, and cleaveth the cleft into two claws, *and* cheweth the cud among the beasts, that ye shall eat.","7":"Nevertheless these ye shall not eat of them that chew the cud, or of them that divide the cloven hoof; *as* the camel, and the hare, and the coney: for they chew the cud, but divide not the hoof; *therefore* they *are* unclean","8":"And the swine, because it divideth the hoof, yet cheweth not the cud, it *is* unclean unto you: ye shall not eat of their flesh, nor touch their dead carcase.","9":"These ye shall eat of all that *are* in the waters: all that have fins and scales shall ye eat:","10":"And whatsoever hath not fins and scales ye may not eat; it *is* unclean","11":"*Of* all clean birds ye shall eat.","12":"But these *are they* of which ye shall not eat: the eagle, and the ossifrage, and the ospray,","13":"And the glede, and the kite, and the vulture after his kind,","14":"And every raven after his kind,","15":"And the owl, and the night hawk, and the cuckow, and the hawk after his kind,","16":"The little owl, and the great owl, and the swan,","17":"And the pelican, and the gier eagle, and the cormorant,","18":"And the stork, and the heron after her kind, and the lapwing, and the bat.","19":"And every creeping thing that flieth *is* unclean unto you: they shall not be eaten.","20":"*But of* all clean fowls ye may eat.","21":"Ye shall not eat *of* any thing that dieth of itself: thou shalt give it unto the stranger that *is* in thy gates, that he may eat it; or thou mayest sell it unto an alien: for thou *art* an holy people unto the LORD thy God. Thou shalt not seethe a kid in his mother's milk.","22":"Thou shalt truly tithe all the increase of thy seed, that the field bringeth forth year by year.","23":"And thou shalt eat before the LORD thy God, in the place which he shall choose to place his name there, the tithe of thy corn, of thy wine, and of thine oil, and the firstlings of thy herds and of thy flocks; that thou mayest learn to fear the LORD thy God always.","24":"And if the way be too long for thee, so that thou art not able to carry it; *or* if the place be too far from thee, which the LORD thy God shall choose to set his name there, when the LORD thy God hath blessed","25":"Then shalt thou turn *it* into money, and bind up the money in thine hand, and shalt go unto the place which the LORD thy God shall choose:","26":"And thou shalt bestow that money for whatsoever thy soul lusteth after, for oxen, or for sheep, or for wine, or for strong drink, or for whatsoever thy soul desireth: and thou shalt eat there before the LORD thy God, and thou shalt rejoice, thou, and thine household,","27":"And the Levite that *is* within thy gates; thou shalt not forsake him; for he hath no part nor inheritance","28":"At the end of three years thou shalt bring forth all the tithe of thine increase the same year, and shalt lay *it* up within thy gates:","29":"And the Levite, (because he hath no part nor inheritance with thee,) and the stranger, and the fatherless, and the widow, which *are* within thy gates, shall come, and shall eat and be satisfied; that the LORD thy God may bless thee in all the work of thine hand which thou doest."}},"tsk":{"1":[{"kopje":"kinderen","refs":["Gen 6:2","Gen 6:4","Ex 4:22","Ex 4:23","Ps 82:6","Ps 82:7","Jer 3:19","Hos 1:10","Joh 1:12","Joh 11:52","Rom 8:16","Rom 9:8","Rom 9:26","2 Kor 6:18","Gal 3:26","Hebr 2:10","1 Joh 3:1","1 Joh 3:2","1 Joh 3:10","1 Joh 5:2"]},{"kopje":"u zult uzelf niet","refs":["Lev 19:27","Lev 19:28","Lev 21:5","Jer 16:6","Jer 41:5","Jer 47:5","1 Tess 4:13"]}],"5":[{"kopje":"een wilde os","refs":["Deut 14:5"]}],"8":[{"kopje":"het varken","refs":["Jes 65:4","Jes 66:3","Jes 66:17","Luk 15:15","Luk 15:16","2 Petr 2:22"]},{"kopje":"aanraken","refs":["Lev 11:26","Lev 11:27"]}],"13":[{"kopje":"de wouw","refs":["Lev 11:14","Deut 14:13"]}],"16":[{"kopje":"de schuifuit","refs":["Deut 14:16"]}],"17":[{"kopje":"de pelikaan","refs":["Deut 14:17"]}],"18":[{"kopje":"de reiger","refs":["Deut 14:18"]}],"21":[{"kopje":"geen dood aas","refs":["Lev 17:15","Lev 22:8","Ezech 4:14","Hand 15:20"]},{"kopje":"de vreemdeling","refs":["Ex 12:43-45","Lev 19:33","Lev 19:34"]},{"kopje":"een heilig volk","refs":["Deut 14:2","Dan 8:24","Dan 12:7","1 Petr 1:16"]},{"kopje":"U zult","refs":["Ex 23:19","Ex 34:26","Rom 12:2"]}],"23":[{"k span> not the <span class=\"wl wl-kjv\" data-code=\"H6541\">hoof;</span> therefore they are unclean","8":"And the <span class=\"wl wl-kjv\" data-code=\"H2386\">swine,</span> because it <span class=\"wl wl-kjv\" data-code=\"H6536\">divideth</span> the <span class=\"wl wl-kjv\" data-code=\"H6541\">hoof,</span> yet cheweth not the <span class=\"wl wl-kjv\" data-code=\"H1625\">cud,</span> it is <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> unto you: ye shall not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of their <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5060\">touch</span> their dead carcase.","9":"These ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of all that are in the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters:</span> all that have <span class=\"wl wl-kjv\" data-code=\"H5579\">fins</span> and <span class=\"wl wl-kjv\" data-code=\"H7193\">scales</span> shall ye eat:","10":"And whatsoever hath not <span class=\"wl wl-kjv\" data-code=\"H5579\">fins</span> and <span class=\"wl wl-kjv\" data-code=\"H7193\">scales</span> ye may not <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> it is unclean","11":"Of all <span class=\"wl wl-kjv\" data-code=\"H2889\">clean</span> <span class=\"wl wl-kjv\" data-code=\"H6833\">birds</span> ye shall eat.","12":"But these are they of which ye shall not <span class=\"wl wl-kjv\" data-code=\"H398\">eat:</span> the <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6538\">ossifrage,</span> and the ospray,","13":"And the <span class=\"wl wl-kjv\" data-code=\"H7201\">glede,</span> and the <span class=\"wl wl-kjv\" data-code=\"H344\">kite,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1772\">vulture</span> after his kind,","14":"And every <span class=\"wl wl-kjv\" data-code=\"H6158\">raven</span> after his kind,","15":"And the <span class=\"wl wl-kjv\" data-c "H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> always.","24":"And if the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> be too <span class=\"wl wl-kjv\" data-code=\"H7235\">long</span> for thee, so <span class=\"wl wl-kjv\" data-code=\"H3588\">that</span> thou art not <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H5375\">carry</span> it; or if the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> be too <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from thee, which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> to <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> there, when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath blessed","25":"Then shalt thou <span class=\"wl wl-kjv\" data-code=\"H5414\">turn</span> it into <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> and bind <span class=\"wl wl-kjv\" data-code=\"H6696\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall choose:","26":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">bestow</span> that <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> for whatsoever thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> lusteth <span class=\"wl wl-kjv\" data-code=\"H183\">after,</span> for <span class=\"wl wl-kjv\" data-code=\"H124 nd the <span class=\"wl wl-kjv\" data-code=\"H490\">widow,</span> which are within thy <span class=\"wl wl-kjv\" data-code=\"H8179\">gates,</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and be <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied;</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> may <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> thee in all the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> which thou doest."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"kinderen des HEEREN,","tekst":"Kinderen der genade en dienvolgens Gods erfgenamen Rom 8:17; hebbende de belofte en hoop der zalige opstanding en des eeuwigen levens; waarom het u niet betaamt over doden te treuren, gelijk de heidenen, die geen hoop hebben; 1Th 4:13."},{"catchword":"snijden,","tekst":"Dat is geen insnijding maken in uw vlees; een heidense manier van rouw, inzonderheid bij het afsterven van enige bijzondere vrienden. Zie Lev 19:28. Vergelijk 1Ki 18:28; Jer 16:6, en Jer 41:5, en Jer 47:5."}],"2":[{"catchword":"op den aardbodem zijn","tekst":"Hebreeuws, op het aangezicht des aardbodems."}],"3":[{"catchword":"gruwel eten","tekst":"Dat is, hetgeen u de HEERE verboden heeft te eten, waarvan gij dienvolgens een gruwel behoort te hebben."}],"6":[{"catchword":"Alle beesten,","tekst":"Zie hiervan en van het volgende, Lev 11:3, enz., en de aantekeningen daar."}],"21":[{"catchword":"vreemdeling,","tekst":"Versta, den onbesneden vreemdeling, die zich tot de onderhouding van Gods wet niet had verbonden, alleenlijk verkerende onder de Israëlieten; want de besneden vreemdelingen waren verbonden tot de onderhouding der wetten van Israël."},{"catchword":"koken in de melk zijner moeder","tekst":"Anders, zieden."}],"22":[{"catchw // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {

    rij.className = 'vers'; rij.id = 'v' + n;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
