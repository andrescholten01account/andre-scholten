er wachten.","5":"Meng u niet met hen; want Ik zal u van hun land niets geven, ook niet zoveel als een voetzool breed; want Ik heb Ezau het gebergte Seir tot erfenis gegeven.","6":"Voedsel zult u voor geld van hen kopen, dat u eet; en ook zult u water voor geld van hen kopen, dat u drinkt.","7":"Want de HEERE, uw God, heeft u gezegend in al het werk van uw hand; Hij kent uw wandelen door deze zo grote woestijn; deze veertig jaren is de HEERE, uw God, met u geweest; niets heeft u ontbroken.","8":"Toen wij nu doorgetrokken waren van onze broeders, de kinderen van Ezau, die in Seir woonden, van de weg van het vlakke veld, van Elath en van Ezeon-Geber, keerden wij ons om en trokken de weg van de woestijn van Moab door.","9":"Toen zei de HEERE tegen mij: Beangstig Moab niet, en meng u niet met hen in de strijd; want Ik zal u geen erfenis van hun land geven, omdat Ik aan de kinderen van Lot Ar tot erfenis gegeven heb.","10":"De Emieten woonden hiervoor daarin, een groot en talrijk volk, en lang van gestalte, zoals de Enakieten.","11":"Ook zij werden voor reuzen gehouden, zoals de Enakieten; en de Moabieten noemden hen Emieten.","12":"Ook woonden de Horieten hiervoor in Seir; maar de kinderen van Ezau verdreven hen uit hun bezit en verdelgden hen van voor hun aangezicht, en hebben in hun plaats gewoond; zoals Israël gedaan heeft met het land van zijn erfenis, dat de HEERE hun gegeven heeft.","13":"Nu, maak u op, en trek over de beek Zered. Zo trokken wij over de beek Zered.","14":"De dagen nu, dat wij gewandeld hebben van Kades-Barnea, totdat wij over de beek Zered getrokken waren, waren achtendertig jaren; totdat het hele geslacht van de krijgslieden uit het midden van de legers verteerd was, zoals de HEERE hun gezworen had.","15":"Zo was ook de hand van de HEERE tegen hen, om hen uit het midden van het leger te verslaan, totdat zij verteerd waren.","16":"En het gebeurde, toen al de krijgslieden uit het midden van het volk verteerd waren en gestorven,","17":"Dat de HEERE tot mij sprak:","18":"U zult heden doortrekken langs Ar, het gebied van Moab;","19":"En u zult naderen tegenover de kinderen van Ammon; beangstig hen niet, en meng u niet met hen; want Ik zal u van het land van de kinderen van Ammon geen erfenis geven, omdat Ik het aan de kinderen van Lot tot erfenis gegeven heb.","20":"Ook dit werd voor een land van reuzen gehouden; de reuzen woonden hiervoor daarin, en de Ammonieten noemden hen Zamzummieten;","21":"Een groot en talrijk volk, en lang van gestalte, zoals de Enakieten; en de HEERE verdelgde hen voor hun aangezicht, zodat zij hen uit hun bezit verdreven, en in hun plaats woonden;","22":"Zoals Hij aan de kinderen van Ezau, die in Seir wonen, gedaan heeft, voor wie Hij de Horieten verdelgde; en zij verdreven hen uit hun bezit, en hebben in hun plaats gewoond tot op deze dag.","23":"Ook hebben de Kafthorieten, die uit Kafthor weggetrokken waren, de Avieten, die in Hazerim tot Gaza toe woonden, verdelgd, en in hun plaats gewoond.","24":"Maak u op, ga op reis, en trek over de beek Arnon; zie, Ik heb Sihon, de koning van Hesbon, de Amoriet, en zijn land in uw hand gegeven; begin het te bezitten, en meng u met hen in de strijd.","25":"Op deze dag zal Ik beginnen uw schrik en uw vrees te geven over het aangezicht van de volken onder de hele hemel; die van u zullen horen, zullen sidderen en bang zijn vanwege u.","26":"Toen zond ik boden uit de woestijn Kedemot naar Sihon, de koning van Hesbon, met woorden van vrede:","27":"Laat mij door uw land doortrekken; ik zal alleen langs de weg voorttrekken; ik zal noch naar rechts noch naar links uitwijken.","28":"Verkoop mij voedsel voor geld, dat ik eet, en geef mij water voor geld, dat ik drink; laat mij alleen te voet doortrekken;","29":"Zoals de kinderen van Ezau, die in Seir wonen, en de Moabieten, die in Ar wonen, mij gedaan hebben; totdat ik over de Jordaan kom in het land, dat de HEERE, onze God, ons geven zal.","30":"Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.","31":"En de HEERE zei tegen mij: Zie, Ik heb begonnen Sihon en zijn land aan u over te geven; begin het dan te bezitten, om zijn land in erfelijk bezit te nemen.","32":"En Sihon trok uit, ons tegemoet, hij en al zijn volk, ten strijde, naar Jahaz.","33":"En de HEERE, onze God, gaf hem aan ons over; en wij versloegen hem, en zijn zonen, en al zijn volk.","34":"En wij namen in die tijd al zijn steden in, en wij verbanden alle steden, mannen, en vrouwen, en kinderen; wij lieten niemand overblijven.","35":"Het vee alleen roofden wij voor onszelf, en de buit van de steden die wij innamen.","36":"Van Aroer af, dat aan de oever van de beek Arnon is, en de stad die aan de beek is, tot Gilead toe, was er geen stad die voor ons te sterk was; de HEERE, onze God, gaf dat alles aan ons over.","37":"Alleen tot het land van de kinderen van Ammon naderde u niet, noch tot de hele oever van de beek Jabbok, noch tot de steden van het gebergte, noch tot iets dat de HEERE, onze God, ons verboden had."},"SV":{"1":"Daarna keerden wij ons, en reisden naar de woestijn, den weg van de Schelfzee, gelijk de HEERE tot mij gesproken had, en wij togen om het gebergte Seir, vele dagen.","2":"Toen sprak de HEERE tot mij, zeggende:","3":"Gijlieden hebt dit gebergte genoeg omgetogen; keert u naar het noorden;","4":"En gebied het volk, zeggende: Gij zult doortrekken aan de landpale uwer broederen, de kinderen van Ezau, die in Seir wonen; zij zullen wel voor u vrezen; maar gij zult u zeer wachten.","5":"Mengt u niet met hen; want Ik zal u van hun land niet geven, ook niet tot de betreding van een voetzool; want Ik heb Ezau het gebergte Seir ter erfenis gegeven.","6":"Spijze zult gij voor geld van hen kopen, dat gij etet; en ook zult gij water voor geld van hen kopen, dat gij drinket.","7":"Want de HEERE, uw God, heeft u gezegend in al het werk uwer hand; Hij kent uw wandelen door deze zo grote woestijn; deze veertig jaren is de HEERE, uw God, met u geweest; geen ding sheeft u ontbroken.","8":"Als wij nu doorgetrokken waren van onze broederen, de kinderen van Ezau, die in Seir woonden, van den weg des vlakken velds, van Elath, en van Ezeon-geber, zo keerden wij ons, en doortogen den weg der woestijn van Moab.","9":"Toen sprak de HEERE tot mij: Beangstig Moab niet, en meng u niet met hen in den strijd; want Ik zal u geen erfenis van hun land geven, dewijl Ik aan Lots kinderen Ar ter erfenis gegeven heb.","10":"De Emieten woonden te voren daarin, een groot, en menigvuldig, en lang volk, gelijk de Enakieten.","11":"Dezen werden ook voor reuzen gehouden, als de Enakieten; en de Moabieten noemden hen Emieten.","12":"Ook woonden de Horieten te voren in Seir; maar de kinderen van Ezau verdreven hen uit de bezitting en verdelgden hen van hun aangezicht, en hebben in hunlieder plaats gewoond; gelijk als Israël gedaan heeft aan het land zijner erfenis, hetwelk de HEERE hun gegeven heeft.","13":"Nu, maakt u op, en trekt over de beek Zered. Alzo trokken wij over de beek Zered.","14":"De dagen nu, die wij gewandeld hebben van Kades-barnea, totdat wij over de beek Zered getogen zijn, waren acht en dertig jaren; totdat het ganse geslacht der krijgslieden uit het midden der heirlegers verteerd was, gelijk de HEERE hun gezworen had.","15":"Zo was ook de hand des HEEREN tegen hen, om hen uit het midden des heirlegers te verslaan, totdat zij verteerd waren.","16":"En het geschiedde, als al de krijgslieden verteerd waren, uit het midden des heirlegers wegstervende,","17":"Dat de HEERE tot mij sprak, zeggende:","18":"Gij zult heden doortrekken aan Ar, de landpale van Moab;","19":"En gij zult naderen tegenover de kinderen Ammons; beangstig die niet, en meng u met hen niet; want Ik zal u van het land der kinderen Ammons geen erfenis geven, dewijl Ik het aan Lots kinderen ter erfenis gegeven heb.","20":"Dit werd ook voor een land der reuzen gehouden; de reuzen woonden te voren daarin, en de Ammonieten noemden hen Zamzummieten;","21":"Een groot, en menigvuldig, en lang volk, als de Enakieten; en de HEERE verdelgde hen voor hun aangezicht, zodat zij hen uit de bezitting verdreven, en aan hunlieder plaats woonden;","22":"Gelijk als Hij aan de kinderen van Ezau, die in Seir wonen, gedaan heeft, voor welker aangezicht Hij de Horieten verdelgde; en zij verdreven hen uit de bezitting, en hebben aan hun plaats gewoond tot op dezen dag.","23":"Ook hebben de Kafthorieten, die uit Kafthor uittogen, de Avieten, die in Hazerim tot Gaza toe woonden, verdelgd, en aan hun plaats gewoond.","24":"Maakt u op, reist heen, en gaat over de beek Arnon; ziet, Ik heb Sihon, den koning van Hesbon, den Amoriet, en zijn land, in uw hand gegeven; begint te erven, en mengt u met hen in den strijd.","25":"Te dezen dage zal Ik beginnen uw schrik en uw vreze te geven over het aangezicht der volken, onder den gansen hemel; die uw gerucht zullen horen, die zullen sidderen, en bang zijn van uw aangezicht.","26":"Toen zond ik boden uit de woestijn Kedemot tot Sihon, den koning van Hesbon, met woorden van vrede, zeggende:","27":"Laat mij door uw land doortrekken; ik zal alleenlijk langs den weg voorttrekken; ik zal noch ter rechter *hand* noch ter linkerhand uitwijken.","28":"Verkoop mij spijze voor geld, dat ik ete, en geef mij water voor geld, dat ik drinke; alleenlijk laat mij op mijn voeten doortrekken;","29":"Gelijk de kinderen van Ezau, die in Seir wonen, en de Moabieten, die in Ar wonen, mij gedaan hebben; totdat ik over de Jordaan kome in het land, dat de HEERE, onze God, ons geven zal.","30":"Maar Sihon, de koning van Hesbon, wilde ons door hetzelve niet laten doortrekken; want de HEERE, uw God, verhardde zijn geest, en verstokte zijn hart, opdat Hij hem in uw hand gave, gelijk het is te dezen dage.","31":"En de HEERE zeide tot mij: Zie, Ik heb begonnen Sihon en zijn land voor uw aangezicht te geven; begin dan te erven, om zijn land erfelijk te bezitten.","32":"En Sihon toog uit ons tegemoet, hij en al zijn volk, ten strijde, naar Jahaz.","33":"En de HEERE, onze God, gaf hem voor ons aangezicht; en wij sloegen hem, en zijn zonen, en al zijn volk.","34":"En wij namen te dier tijd al zijn steden in, en wij verbanden alle steden, mannen, en vrouwen, en kinderkens; wij lieten niemand overblijven.","35":"Het vee alleen roofden wij voor ons, en den roof der steden, die wij innamen.","36":"Van Aroer af, dat aan den oever der beek Arnon is, en de stad, die aan de beek is, ook tot Gilead toe, was er geen stad, die voor ons te hoog was; de HEERE, onze God, gaf dat alles voor ons aangezicht.","37":"Behalve tot het land van de kinderen Ammons naderdet gij niet, noch tot de ganse streek der beek Jabbok, noch tot de steden van het gebergte, noch tot iets, dat de HEERE, onze God, ons verboden had."},"KJV":{"1":"Then we turned, and took our journey into the wilderness by the way of the Red sea, as the LORD spake unto me: and we compassed mount Seir many days.","2":"And the LORD spake unto me, saying,","3":"Ye have compassed this mountain long enough: turn you northward.","4":"And command thou the people, saying, Ye *are* to pass through the coast of your brethren the children of Esau, which dwell in Seir; and they shall be afraid of you: take ye good heed","5":"Meddle not with them; for I will not give you of their land, no, not so much as a foot breadth; because I have given mount Seir unto Esau *for* a possession.","6":"Ye shall buy meat of them for money, that ye may eat; and ye shall also buy water of them for money, that ye may drink.","7":"For the LORD thy God hath blessed thee in all the works of thy hand: he knoweth thy walking through this great wilderness: these forty years the LORD thy God *hath been* with thee; thou hast lacked nothing.","8":"And when we passed by from our brethren the children of Esau, which dwelt in Seir, through the way of the plain from Elath, and from Eziongaber, we turned and passed by the way of the wilderness of Moab.","9":"And the LORD said unto me, Distress not the Moabites, neither contend with them in battle: for I will not give thee of their land *for* a possession; because I have given Ar unto the children of Lot *for* a possession.","10":"The Emims dwelt therein in times past, a people great, and many, and tall, as the Anakims;","11":"Which also were accounted giants, as the Anakims; but the Moabites call them Emims.","12":"The Horims also dwelt in Seir beforetime; but the children of Esau succeeded them, when they had destroyed them from before them, and dwelt in their stead; as Israel did unto the land of his possession, which the LORD gave","13":"Now rise up, *said I*, and get you over the brook Zered. And we went over the brook Zered.","14":"And the space in which we came from Kadeshbarnea, until we were come over the brook Zered, *was* thirty and eight years; until all the generation of the men of war were wasted out from among the host, as the LORD sware","15":"For indeed the hand of the LORD was against them, to destroy them from among the host, until they were consumed.","16":"So it came to pass, when all the men of war were consumed and dead from among the people,","17":"That the LORD spake unto me, saying,","18":"Thou art to pass over through Ar, the coast of Moab, this day:","19":"And *when* thou comest nigh over against the children of Ammon, distress them not, nor meddle with them: for I will not give thee of the land of the children of Ammon *any* possession; because I have given it unto the children of Lot *for* a possession.","20":"(That also was accounted a land of giants: giants dwelt therein in old time; and the Ammonites call them Zamzummims;","21":"A people great, and many, and tall, as the Anakims; but the LORD destroyed them before them; and they succeeded them, and dwelt","22":"As he did to the children of Esau, which dwelt in Seir, when he destroyed the Horims from before them; and they succeeded them, and dwelt in their stead even unto this day:","23":"And the Avims which dwelt in Hazerim, *even* unto Azzah, the Caphtorims, which came forth out of Caphtor, destroyed them, and dwelt","24":"Rise ye up, take your journey, and pass over the river Arnon: behold, I have given into thine hand Sihon the Amorite, king of Heshbon, and his land: begin to possess *it*, and contend with him in battle.","25":"This day will I begin to put the dread of thee and the fear of thee upon the nations *that are* under the whole heaven, who shall hear report of thee, and shall tremble, and be in anguish because of thee.","26":"And I sent messengers out of the wilderness of Kedemoth unto Sihon king of Heshbon with words of peace, saying,","27":"Let me pass through thy land: I will go along by the high way, I will neither turn unto the right hand nor to the left.","28":"Thou shalt sell me meat for money, that I may eat; and give me water for money, that I may drink: only I will pass through on my feet;","29":"(As the children of Esau which dwell in Seir, and the Moabites which dwell in Ar, did unto me;) until I shall pass over Jordan into the land which the LORD our God giveth","30":"But Sihon king of Heshbon would not let us pass by him: for the LORD thy God hardened his spirit, and made his heart obstinate, that he might deliver him into thy hand, as *appeareth* this day.","31":"And the LORD said unto me, Behold, I have begun to give Sihon and his land before thee: begin to possess, that thou mayest inherit his land.","32":"Then Sihon came out against us, he and all his people, to fight at Jahaz.","33":"And the LORD our God delivered him before us; and we smote him, and his sons, and all his people.","34":"And we took all his cities at that time, and utterly destroyed the men, and the women, and the little ones, of every city, we left none to remain:","35":"Only the cattle we took for a prey unto ourselves, and the spoil of the cities which we took.","36":"From Aroer, which *is* by t an class=\"wl wl-kjv\" data-code=\"H6215\">Esau,</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir;</span> and they shall be <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> of you: take ye <span class=\"wl wl-kjv\" data-code=\"H3966\">good</span> heed","5":"<span class=\"wl wl-kjv\" data-code=\"H1624\">Meddle</span> not with them; for I will not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you of their <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> no, not so much as a <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> <span class=\"wl wl-kjv\" data-code=\"H4096\">breadth;</span> because I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir</span> unto <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> for a possession.","6":"Ye shall <span class=\"wl wl-kjv\" data-code=\"H7666\">buy</span> <span class=\"wl wl-kjv\" data-code=\"H400\">meat</span> of them for <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> and ye shall also <span class=\"wl wl-kjv\" data-code=\"H3739\">buy</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of them for <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> that ye may drink.","7":"For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> thee in all the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> of thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> he <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> thy <span class=\"wl wl-kjv\" data-code=\"H3212\">walking</span> through this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness:</span> these <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath been with thee; thou hast <span class=\"wl wl-kjv\" data-code=\"H2637\">lacked</span> nothing.","8":"And when we <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> by from our <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau,</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> through the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H6160\">plain</span> from <span class=\"wl wl-kjv\" data-code=\"H359\">Elath,</span> and from <span class=\"wl wl-kjv\" data-code=\"H6100\">Eziongaber,</span> we <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> and <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of Moab.","9":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H6696\">Distress</span> not the <span class=\"wl wl-kjv\" data-code=\"H4124\">Moabites,</span> neither <span class=\"wl wl-kjv\" data-code=\"H1624\">contend</span> with them in <span class=\"wl wl-kjv\" data-code=\"H4421\">battle:</span> for I will not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee of their <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> for a <span class=\"wl wl-kjv\" data-code=\"H3425\">possession;</span> because I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> <span class=\"wl wl-kjv\" data-code=\"H6144\">Ar</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> for a possession.","10":"The <span class=\"wl wl-kjv\" data-code=\"H368\">Emims</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> therein in times <span class=\"wl wl-kjv\" data-code=\"H6440\">past,</span> a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great,</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">many,</span> and <span class=\"wl wl-kjv\" data-code=\"H7311\">tall,</span> as the Anakims;","11":"<span class=\"wl wl-kjv\" data-code=\"H1992\">Which</span> also were <span class=\"wl wl-kjv\" data-code=\"H2803\">accounted</span> <span class=\"wl wl-kjv\" data-code=\"H7497\">giants,</span> as the <span class=\"wl wl-kjv\" data-code=\"H6062\">Anakims;</span> but the <span class=\"wl wl-kjv\" data-code=\"H4125\">Moabites</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> them Emims.","12":"The <span class=\"wl wl-kjv\" data-code=\"H2752\">Horims</span> also <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">beforetime;</span> but the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> <span class=\"wl wl-kjv\" data-code=\"H3423\">succeeded</span> them, when they had <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> them from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in their stead; as <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of his <span class=\"wl wl-kjv\" data-code=\"H3425\">possession,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> gave","13":"Now rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> said I, and get you <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H2218\">Zered.</span> And we went <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> Zered.","14":"And the <span class=\"wl wl-kjv\" data-code=\"H3117\">space</span> in which we <span class=\"wl wl-kjv\" data-code=\"H1980\">came</span> from <span class=\"wl wl-kjv\" data-code=\"H6947\">Kadeshbarnea,</span> until we were come <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H2218\">Zered,</span> was <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> and <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years;</span> until all the <span class=\"wl wl-kjv\" data-code=\"H1755\">generation</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> were wasted <span class=\"wl wl-kjv\" data-code=\"H8552\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">host,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> sware","15":"For indeed the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was against them, to <span class=\"wl wl-kjv\" data-code=\"H2000\">destroy</span> them from <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">host,</span> until they were consumed.","16":"So it came to pass, when all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> were <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> from <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> the people,","17":"That the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto me, saying,","18":"Thou art to pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> through <span class=\"wl wl-kjv\" data-code=\"H6144\">Ar,</span> the <span class=\"wl wl-kjv\" data-code=\"H1366\">coast</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> this day:","19":"And when thou comest <span class=\"wl wl-kjv\" data-code=\"H7126\">nigh</span> over <span class=\"wl wl-kjv\" data-code=\"H4136\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> <span class=\"wl wl-kjv\" data-code=\"H6696\">distress</span> them not, nor <span class=\"wl wl-kjv\" data-code=\"H1624\">meddle</span> with them: for I will not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> any <span class=\"wl wl-kjv\" data-code=\"H3425\">possession;</span> because I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> it unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> for a possession.","20":"(That also was <span class=\"wl wl-kjv\" data-code=\"H2803\">accounted</span> a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H7497\">giants:</span> <span class=\"wl wl-kjv\" data-code=\"H7497\">giants</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> therein in old <span class=\"wl wl-kjv\" data-code=\"H6440\">time;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5984\">Ammonites</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> them Zamzummims;","21":"A <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great,</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">many,</span> and <span class=\"wl wl-kjv\" data-code=\"H7311\">tall,</span> as the <span class=\"wl wl-kjv\" data-code=\"H6062\">Anakims;</span> but the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them; and they <span class=\"wl wl-kjv\" data-code=\"H3423\">succeeded</span> them, and dwelt","22":"As he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau,</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> when he <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> the <span class=\"wl wl-kjv\" data-code=\"H2752\">Horims</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them; and they <span class=\"wl wl-kjv\" data-code=\"H3423\">succeeded</span> them, and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in their stead even unto this day:","23":"And the <span class=\"wl wl-kjv\" data-code=\"H5761\">Avims</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H2699\">Hazerim,</span> even unto <span class=\"wl wl-kjv\" data-code=\"H5804\">Azzah,</span> the <span class=\"wl wl-kjv\" data-code=\"H3732\">Caphtorims,</span> which came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of <span class=\"wl wl-kjv\" data-code=\"H3731\">Caphtor,</span> <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> them, and dwelt","24":"Rise ye <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> take your <span class=\"wl wl-kjv\" data-code=\"H5265\">journey,</span> and pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> <span class=\"wl wl-kjv\" data-code=\"H769\">Arnon:</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">behold,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon</span> the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorite,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon,</span> and his <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> <span class=\"wl wl-kjv\" data-code=\"H2490\">begin</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it, and <span class=\"wl wl-kjv\" data-code=\"H1624\">contend</span> with him in battle.","25":"This <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> will I <span class=\"wl wl-kjv\" data-code=\"H2490\">begin</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H6343\">dread</span> of thee and the <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of thee upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">nations</span> that are under the whole <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> who shall <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> <span class=\"wl wl-kjv\" data-code=\"H8088\">report</span> of thee, and shall <span class=\"wl wl-kjv\" data-code=\"H7264\">tremble,</span> and be in <span class=\"wl wl-kjv\" data-code=\"H2342\">anguish</span> because of thee.","26":"And I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H6932\">Kedemoth</span> unto <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon</span> with <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> saying,","27":"Let me <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> through thy <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> I will <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> along by the high <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> I will neither <span class=\"wl wl-kjv\" data-code=\"H5493\">turn</span> unto the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> nor to the left.","28":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H7666\">sell</span> me <span class=\"wl wl-kjv\" data-code=\"H400\">meat</span> for <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> for <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H8354\">drink:</span> only I will pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> on my feet;","29":"(As the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4125\">Moabites</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H6144\">Ar,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto me;) until I shall pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> giveth","30":"But <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon</span> <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not let us <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> by him: for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7185\">hardened</span> his <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit,</span> and made his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H553\">obstinate,</span> that he might <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> him into thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> as appeareth this day.","31":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H7200\">Behold,</span> I have <span class=\"wl wl-kjv\" data-code=\"H2490\">begun</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon</span> and his <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee: <span class=\"wl wl-kjv\" data-code=\"H2490\">begin</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess,</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H3423\">inherit</span> his land.","32":"Then <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> us, he and all his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">fight</span> at Jahaz.","33":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> him <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> us; and we <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him, and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and all his people.","34":"And we <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> all his <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> and utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed</span> the <span class=\"wl wl-kjv\" data-code=\"H4962\">men,</span> and the <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> and the little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones,</span> of every <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> we <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> none to remain:","35":"Only the <span class=\"wl wl-kjv\" data-code=\"H929\">cattle</span> we took for a <span class=\"wl wl-kjv\" data-code=\"H962\">prey</span> unto ourselves, and the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> which we took.","36":"From <span class=\"wl wl-kjv\" ijk gebergte van Edom, en ook genoemd het gebergte Seïr en der Amorieten, omdat men langs hetzelve toog naar de Edomieten en Amorieten, bij hetwelk de Israëlieten, weder terugtrekkende naar de Rode zee, lang gereisd hebben, totdat God hun bevolen heeft wederom te keren naar het noorden, voorbij het land der Edomieten en zo voorts naar het land der Moabieten. De lezer kan vergelijken vs.3,4, 8."}],"3":[{"catchword":"Gijlieden","tekst":"Hebreeuws, [het is] u veel, of, genoeg [geweest] om te trekken"},{"catchword":"noorden;","tekst":"Van de Schelfzee, die in het zuiden lag, weder terug naar het land van Edom en Moab, om voorbij beiden te passeren."}],"4":[{"catchword":"kinderen van Ezau,","tekst":"De Amalekieten waren ook wel Edomieten, of van Ezau afkomstig, Gen 36:12, maar van God door een bijzondere ordinantie uitgesloten. Zie Exo 17:14, en onder Deu 25:17."},{"catchword":"vrezen;","tekst":"Gedenkende aan het leed, dat hunlieder voorvader Ezau zijnen broeder Jakob of Israël, uw voorvader, eertijds heeft aangedaan. Of, zij zullen vrezen voor uw macht en de hulp van God, die bij u is. Zie Num 22:3."}],"5":[{"catchword":"Mengt u niet met hen;","tekst":"Te weten, ten strijde, dat gij u met hen in oorlog zoudt begeven; gelijk onder, vs.9, 24. Wat nu naderhand contrarie geschied is, daartoe hebben de Edomieten, Ammonieten en Moabieten door hun vijandschap oorzaak gegeven. Zie 1Sa 14:47; 2Sa 8:14; 1Ki 11:15-16; 2Ki 8:21; 2Ch 20:2, 2Ch 20:10-11; Psa 83:7-9, enz. Vergelijk 2Sa 8:2."},{"catchword":"tot de betreding van een voetzool;","tekst":"Dat is, zoveel de plant van een voet betreden mag."},{"catchword":"gegeven","tekst":"Zie Gen 36:8."}],"6":[{"catchword":"Spijze zult gij voor geld van hen kopen,","tekst":"Die gij, benevens het hemelse manna, zult mogen begeren."}],"7":[{"catchword":"kent uw wandelen","tekst":"Dat is, heeft zorg voor u gedragen in al dit reizen en trekken, dat u niets mocht ontbreken. Zie deze betekenis Psa 1:6, en Psa 31:8; Nah 1:7, en elders."},{"catchword":"met u geweest;","tekst":"Zie Gen 21:22."}],"8":[{"catchword":"Elath,","tekst":"Elath en Ezeongeber worden beide door sommigen gesteld dicht bij de Schelfzee, gemeenlijk genoemd het Rode meer."}],"9":[{"catchword":"Ar ter erfenis gegeven heb","tekst":"De hoofdstad der Moabieten. Zie Num 21:28."}],"10":[{"catchword":"Emieten woonden te voren daarin,","tekst":"Zie Gen 14:5, alzo genoemd [gelijk men meent] omdat zij schrikkelijk en vreeslijk waren."},{"catchword":"Enakieten","tekst":"Zie boven, Deu 1:28, en Num 13:22."}],"11":[{"catchword":"reuzen gehouden,","tekst":"Hebreeuws, Refaïm; zie Gen 14:5."}],"12":[{"catchword":"Horieten te voren in Seïr;","tekst":"Zie Gen 14:6, en Gen 36:20."},{"catchword":"land zijner erfenis,","tekst":"Versta hier, de landen van Sihon en Og, die reeds door de kinderen Israëls waren ingenomen, toen Mozes dit zeide of schreEf."}],"13":[{"catchword":"Zered","tekst":"Zie Num 21:12."}],"14":[{"catchword":"krijgslieden","tekst":"Die door Gods bevel geteld waren, zijnde twintig jaren oud en daarboven. Zie Num 1:3."},{"catchword":"gelijk de HEERE hun gezworen had","tekst":"Zie boven, Deu 1:35, en Num 14:21, enz."}],"18":[{"catchword":"Ar,","tekst":"Zie boven, vs.9."}],"19":[{"catchword":"meng u met hen niet;","tekst":"Zie boven, vs.5."}],"20":[{"catchword":"Zamzummieten;","tekst":"Dat is, gruwelijke booswichten, straatschenders, rovers, voor welke iedereen schrikte."}],"22":[{"catchword":"Hij aan de kinderen van Ezau,","tekst":"Namelijk, de HEERE."}],"23":[{"catchword":"Kafthorieten,","tekst":"Zie Gen 10:14."},{"catchword":"Avieten,","tekst":"Die tevoren in het land der Filistijnen gewoond hebben. Zie Jos 13:3, en 2Ki 17:24, 2Ki 17:31."},{"catchword":"Gaza toe woonden,","tekst":"Zie Gen 10:19."}],"24":[{"catchword":"begint te erven,","tekst":"Hebreeuws, begint erft."}],"25":[{"catchword":"uw schrik en uw vreze te geven","tekst":"Dat is, waarmede zij voor u schrikken en vrezen zullen; alzo onder, Deu 11:25."}],"26":[{"catchword":"woorden van vrede,","tekst":"Dat is, aanbieding van vrede, met weigering waarvan zij oorzaak van hun eigen ondergang zouden zijn. Zie onder, Deu 20:10."}],"27":[{"catchword":"alleenlijk langs den weg voorttrekken;","tekst":"Of, gestadiglijk; strak voor mij heen, zonder mij van den weg af te geven, gelijk de volgende woorden uitwijzen. Hebreeuws, in den weg, in den weg."}],"28":[{"catchword":"voeten doortrekken;","tekst":"Dat is, te voet, gelijk wij meest spreken. Zie dezelfde manier van spreken Num 20:19; Jdg 4:15, Jdg 4:17; 2Sa 15:17, enz."}],"29":[{"catchword":"kinderen van Ezau,","tekst":"Versta dit van het verkopen van brood en water; dat is, spijs en drank, want den doortocht hebben zij Israël afgeslagen, Num 20:18; Jdg 11:17."},{"catchword":"Moabieten,","tekst":"Die Israël wel geen brood noch water hebben tegemoet gebracht [zie onder, 23:4], maar misschien wel dit hun mogen verkocht hebben; daar zij immers hen niet van hun palen afgedreven hebben."}],"30":[{"catchword":"door hetzelve niet laten doortrekken;","tekst":"Dat is, door zijn land."},{"catchword":"verhardde zijn geest,","tekst":"Zie Exo 4:21."}],"31":[{"catchword":"voor uw aangezicht te geven;","tekst":"Zie boven, Deu 1:8."}],"34":[{"catchword":"verbanden alle steden,","tekst":"Dat is, wij verdelgden en roeiden hen uit ten enenmale. Alzo wordt dit woord ook genomen onder Deu 3:6, en Deu 7:2, en elders. Deze verbanning moest geschieden aan allen, die in vijandschap en afgoderij hardnekkig bleven. Vergelijk onder, Deu 20, en Jos 6:17-18, Jos 6:21, en Jos 9:18-19; 1Ki 20:42, enz."}],"36":[{"catchword":"oever der beek Arnon is,","tekst":"Hebreeuws, aan den lip"},{"catchword":"hoog was;","tekst":"Of, of geen stad, die zich tegen ons kon beschermen."}],"37":[{"catchword":"ganse streek der beek Jabbok,","tekst":"Hebreeuws, de ganse zijde van de beek Jabbok en de steden, enz."},{"catchword":"verboden had","tekst":"Hebreeuws, geboden; dat is, verboden. Zie van dit gebruik des woords gebieden Lev 4:2, en onder, Deu 4:23. Hoewel men deze woorden hier ook aldus kon overzetten: waarvan de Heere ons geboden had; te weten, dat wij die niet zouden genaken."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then we turned and took our journey towards the wilderness by the way of the reed-sea[that is back again towards the red-sea which they passed over when they came out of Egypt] as the Lord had spoken unto me and compassed mount Seir many days[some maps do place next unto mount Seir or the mount of the Edomites in which they properly dwelt lying along the southern borders of Canaan yet another mountain extending from the reed-sea to the mount that properly the mount Edom and called likewise mount Seir and the mountain of the Amorites because they went along the same unto the Edomites and unto the Amorites by the which the Israelites going back again towards the red-sea made a long journey until God commanded then to turn northwards along by the land of the Edomites and so on towards the land of the Moabites the reader may be pleased to compare verse 3,4,8.]"}],"2":[{"catchword":null,"tekst":"Then the LORD spake unto me saying:"}],"3":[{"catchword":null,"tekst":"Yea have compassed this mountain enough [Heb. It hath been much or sufficient for you to go about &c.] Turn you northwards [of the reed-sea which lay in the south back again toward the land of Edom and Moab to pass by both them.]"}],"4":[{"catchword":null,"tekst":"And command the people saying ye shall march through by the border of your brethren the children of Esau [the Amalekites were also indeed Edomites or descended from Esau Gen 36:12 but were excluded by God a special ordinance see Exo 17:24 and below chapter 25,17] that dwell in Seir they will indeed be afraid of you [to wit remembering the wrong that their forefather Esau formerly did unto his brother Jacob or Israel your forefather or they shall be afraid of your power and the help of God that is with you see Num 22:3] but ye shall take good heed unto yourselves."}],"5":[{"catchword":null,"tekst":"Meddle not with them [ to wit in the battle that ye should go to war with them as below verse 9 and 24 that now afterwards the contrary appeared the Edomites Amorites and Moabites were the cause of it by their enmity and hatred against the Israelites see 1samuel 14.47 2Sa 8:14 1Ki 11:15,16 2kings 8.21 2Ch 20:2 ,10,11 Psa 83:7,8,9 7c. compare 2Samuel 8 on verse 2] for I will not give ye for their land even not to the treading of the foot sole [that is so much as the sole of the foot may tread on that is not so much as a foot breadeth] for I have given mount Seir unto Esau for an inheritance [ see Gen 36:8]"}],"7":[{"catchword":null,"tekst":"For the LORD God hath blessed thee in all the work of thine hand he knoweth the walking through this great wilderness [that is he hath taken care for thee in all this journeying and marching of thine that nothing might be wanting unto thee see this signification of the word knowing Psa 1:6 and 31.8 Nahum 1.7 and elsewhere] these forty years the ORD thy God hath been with thee [see Genesis 21 on verse 22] nothing hath been lacking to thee."}],"8":[{"catchword":null,"tekst":"Now when we had passed by from our brethren the children of Esau that dwelt in Seir from the way of the plain from Elath from Ezeon-Geber [Elath and Ezeon-geber are placed by some close by the reed-sea ] so we turned and passed through the way of the wilderness of Moab."}],"9":[{"catchword":null,"tekst":"Then the LORD spake unto me distress not unto me Moab neither mingle thyself with them in the battle for I will not give thee any inheritance of their land because I have given Ar [the metropolis or chief city of the Moabites see Num 21:28]unto the children of Lot for an inheritance."}],"10":[{"catchword":null,"tekst":"The Emims [see Genesis 14 on verse 5 so called as conceived because they were dreadful and terrible] dwealt there in times past a great numerous and tall people like Enakims [ see above chapter 1.28 and Num 13:23.]"}],"11":[{"catchword":null,"tekst":"These were also accounted Giants [Heb. Rephaim see Genesis 14. On verse 5] as the Enakims and the Moabites called thou Emims."}],"12":[{"catchword":null,"tekst":"The Horites [see Genesis 14 on verse 6 and 36.20] also dwealt in Seir before time but the children of Esau drave them out of the possession and destroyed them from their face and dwealt in their stead according as Israel had done unto the land of his inheritance [understand here the lands of Sihon and Og which were already taken by the children of Israel then when Moseh spake or wrote this] which the LORD gave unto them."}],"13":[{"catchword":null,"tekst":"Now get ye up and pass over the brook Zered [see Num 21:12] so we passed over the brook Zered."}],"14":[{"catchword":null,"tekst":"Now the days that we waked from Kades-Barnea until we have passed over the brok Zered were eight and thirty years until al the generation f men of war [that were numbered by Gods appointment being twenty years ld and upward see Num 1:3] were consumed out of the midst of the host as the LORD had sworn unto them [see above chapter 1.35 and Num 14:21 &c.]"}],"15":[{"catchword":null,"tekst":"So the hand of the LORD was against them to smite them from the midst of the host until they were consumed."}],"16":[{"catchword":null,"tekst":"And it came to pass when the men of Warre were consumed dying away from the middest of the host."}],"17":[{"catchword":null,"tekst":"That the LORD spake unto me saying:"}],"18":[{"catchword":null,"tekst":"Thou shalt pass over at Ar [ see above verse 9] the border of Moab this day ."}],"19":[{"catchword":null,"tekst":"And thou shalt draw nigh over against the children of Amon distress them not nor mingle thyself with them [see above on verse 5] for I will give thee any inheritance of the land of the children of Ammon for I have given it to the children of Lot for an inheritance."}],"20":[{"catchword":null,"tekst":"This was also accounted a land of Giants dwelt therein in the former time and the Ammonites called the them Zamzummims [that is abominable varlets, rogue, thieves, robbers of everyone is afraid.]"}],"21":[{"catchword":null,"tekst":"A great and numerous and tall people as Enakim and the LORD destroyed them before their face so that they drove them out of the possession and dwelt in their stead."}],"22":[{"catchword":null,"tekst":"As he [namely the LORD] did to the children of Esau that dwell in Seir before whose face he destroyed the Horites and they drove them out of possession and dwelt in their stead until this day."}],"23":[{"catchword":null,"tekst":"Also the Caphtorims [see Genesis 10 on verse 14] which came forth out of Caphtor destroyed the Avites that dwealt in Hazerim unto Gaza [that is which dwelt times past in the Philistines land see Jos 13:3 and 2Ki 17:24,31 of Gaza see Genesis 10 on verse 19] and dwelt in their stead."}],"24":[{"catchword":null,"tekst":"Get ye up take your journey and pass over the brook Arnon behold I have given Sihon the king of Hesbon the Amorite and his land into thine hand begin to inherit [Heb. Begin inherit] and mingle thyself with them in battle."}],"25":[{"catchword":null,"tekst":"This day I will begin to put the dread and thy fear [that is wherewith they shall dread and be afraid of thee so below chapter 11.25] upon the face of the nations under the heaven they that shall hear thy report they shall tremble and be in anguish from thy face."}],"27":[{"catchword":null,"tekst":"Let me pass through thy land I will only pass along by the way [or pass along steadily straight on without turning on either side or giving out of the road way as the following words also declare Heb. In the way in the way] I will neither turn aside to the right hand nor to the left."}],"28":[{"catchword":null,"tekst":"Sell me meat for money that I may eat and give me water for money that I may drink only let me pass through on my feet [that is on foot as we commonly say see the same phrase Num 20:19 Jud 4:15,17 2Sa 15:17 &c.]"}],"29":[{"catchword":null,"tekst":"As the children of Esau which dwelt in Seir and the Moabites which dwealt in Ar did unto me [that which is affirmed here of the former of these nations to wit the Edomites must be understood of the selling of the bread and water that is meat and drink unto the Israelites for they denied them passage through their country Num 20:18 Jud 11:17 the Moabites they indeed met not Israel with bread and water see below chapter 23.4 but yet possible have sold the same unto them at least might not have driven them away from their borders ] until I pass over the Jordan unto the land which the Lord our God shall give us."}],"30":[{"catchword":null,"tekst":"But Sihon the king of Hesbon would not let us pass through him [that is through his land] for the LORD thy God hardened his spirit [see Exodus 4 on verse 21] and made his heart obstinate that he might deliver into thine hand as it is at this day."}],"31":[{"catchword":null,"tekst":"And the LORD said unto behold I have begun to give unto Sihon and his land before thy face [see above chapter 1 on verse 8] begin then to inherit for to possess his land hereditarily."}],"32":[{"catchword":null,"tekst":"And Sihon came forth to meet us he and his people to the battle at Jahaz."}],"33":[{"catchword":null,"tekst":"And the Lord our God gave him before our face and we smote him and his sons and all his people."}],"34":[{"catchword":null,"tekst":"And we took all his cities at that time and we banned all the cities men and women and little children [that is we destroyed and rooted them out at once so is this word banning also taken below chapter 3.6 and chapter7.2 and elsewhere this banning was to be done to all that continued obstinate in enmity and idolatry compare below chapter and Jos 6:17,18,21 and 9.18,19 1Ki 20:42 &c.] we left none to remain."}],"36":[{"catchword":null,"tekst":"From Aroer which is by the bank [Heb. Lip] of the brook Arnon, and the city which is by the brook even unto Gilead, there was no city that was too high for us [Or, no city that would defend itself against us]; the Lord our God gave all that before our face."}],"37":[{"catchword":null,"tekst":"Saving to the land of the children of Ammon thou drew not near; nor (to) all the country of the brook Jabbok nor to the cities of the mountain [Heb. Unto all the sides of the brook Jabbok and unto the cities &c.] nor to anything that the LORD our God had forbidden us [Heb. Commanded us that is forbidden us see of this use of word of commanding Leviticus 4 on verse 23 although those words might be likewise here thus translated whereof the LORD had commanded us to wit that we should not come nigh them.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
