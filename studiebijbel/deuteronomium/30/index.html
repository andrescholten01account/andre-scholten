schap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had.","4":"Al waren uw verdrevenen aan het einde van de hemel, van daar zal de HEERE, uw God, u bijeenbrengen, en van daar zal Hij u halen.","5":"En de HEERE, uw God, zal u brengen in het land dat uw vaderen erfelijk bezeten hebben, en u zult dat erfelijk bezitten; en Hij zal u weldoen, en zal u meer maken dan uw vaderen.","6":"En de HEERE, uw God, zal uw hart besnijden, en het hart van uw nageslacht, om de HEERE, uw God, lief te hebben met uw ganse hart en met uw ganse ziel, opdat u leeft.","7":"En de HEERE, uw God, zal al die vloeken leggen op uw vijanden en op uw haters, die u vervolgd hebben.","8":"U dan zult zich bekeren, en de stem van de HEERE gehoorzaam zijn, en u zult doen al Zijn geboden, die ik u heden gebied.","9":"En de HEERE, uw God, zal u overvloed geven in al het werk van uw hand, in de vrucht van uw buik, en in de vrucht van uw vee, en in de vrucht van uw land, ten goede; want de HEERE zal Zich weer verblijden over u ten goede, zoals Hij Zich over uw vaderen verblijd heeft;","10":"wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, door Zijn geboden en Zijn inzettingen te houden, die in dit boek van de wet geschreven zijn; wanneer u zich zult bekeren tot de HEERE, uw God, met uw ganse hart en met uw ganse ziel.","11":"Want dit gebod, dat ik u heden gebied, dat is voor u niet verborgen, en dat is niet ver weg.","12":"Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen?","13":"Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen?","14":"Want dit woord is heel dichtbij u, in uw mond, en in uw hart, om dat te doen.","15":"Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.","16":"Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven.","17":"Maar als uw hart zich zal afwenden, en u niet horen zult, en u gedreven wordt om u voor andere goden te buigen, en die te dienen;","18":"zo verkondig ik u heden, dat u voorzeker zult omkomen; u zult de dagen niet verlengen op het land, waar u de Jordaan naar overtrekt om erin te komen, om het erfelijk te bezitten.","19":"Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;","20":"door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven."},"SV":{"1":"Voorts zal het geschieden, wanneer al deze dingen over u zullen gekomen zijn, deze zegen of deze vloek, die ik u voorgesteld heb; zo zult gij het weder ter harte nemen, onder alle volken, waarheen u de HEERE, uw God, gedreven heeft;","2":"En gij zult u bekeren tot den HEERE, uw God, en Zijner stem gehoorzaam zijn, naar alles, wat ik u heden gebiede, gij en uw kinderen, met uw ganse hart en met uw ganse ziel.","3":"En de HEERE, uw God, zal uw gevangenis wenden, en Zich uwer ontfermen; en Hij zal u weder vergaderen uit al de volken, waarheen u de HEERE, uw God, verstrooid had.","4":"Al waren uw verdrevenen aan het einde des hemels, van daar zal u de HEERE, uw God, vergaderen, en van daar zal Hij u nemen.","5":"En de HEERE, uw God, zal u brengen in het land, dat uw vaderen erfelijk bezeten hebben, en gij zult dat erfelijk bezitten; en Hij zal u weldoen, en zal u vermenigvuldigen boven uw vaderen.","6":"En de HEERE, uw God, zal uw hart besnijden, en het hart van uw zaad, om den HEERE, uw God, lief te hebben met uw ganse hart en met uw ganse ziel, opdat gij levet.","7":"En de HEERE, uw God, zal al die vloeken leggen op uw vijanden en op uw haters, die u vervolgd hebben.","8":"Gij dan zult u bekeren, en der stemme des HEEREN gehoorzaam zijn, en gij zult doen al Zijn geboden, die ik u heden gebiede.","9":"En de HEERE, uw God, zal u doen overvloeien in al het werk uwer hand, in de vrucht uws buiks, en in de vrucht uwer beesten, en in de vrucht uws lands, ten goede; want de HEERE zal wederkeren, om Zich over u te verblijden ten goede, gelijk als Hij Zich over uw vaderen verblijd heeft;","10":"Wanneer gij der stemme des HEEREN, uws Gods, zult gehoorzaam zijn, houdende Zijn geboden en Zijn inzettingen, die in dit wetboek geschreven zijn; wanneer gij u zult bekeren tot den HEERE, uw God, met uw ganse hart en met uw ganse ziel.","11":"Want ditzelve gebod, hetwelk ik u heden gebiede, dat is van u niet verborgen, en dat is niet verre.","12":"Het is niet in den hemel, om te zeggen: Wie zal voor ons ten hemel varen, dat hij het voor ons hale, en ons hetzelve horen late, dat wij het doen?","13":"Het is ook niet op gene zijde der zee, om te zeggen: Wie zal voor ons overvaren aan gene zijde der zee, dat hij het voor ons hale, en ons hetzelve horen late, dat wij het doen?","14":"Want dit woord is zeer nabij u, in uw mond, en in uw hart, om dat te doen.","15":"Ziet, ik heb u heden voorgesteld het leven, en het goede, en den dood, en het kwade.","16":"Want ik gebiede u heden, den HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en te houden Zijn geboden, en Zijn inzettingen, en Zijn rechten, opdat gij levet en vermenigvuldiget, en de HEERE, uw God, u zegene in het land, waar gij naar toe gaat, om dat te erven.","17":"Maar indien uw hart zich zal afwenden, en gij niet horen zult, en gij gedreven zult worden, dat gij u voor andere goden buigt, en dezelve dient;","18":"Zo verkondig ik ulieden heden, dat gij voorzeker zult omkomen; gij zult de dagen niet verlengen op het land, naar hetwelk gij over de Jordaan zijt heengaande, om daarin te komen, dat gij het erfelijk bezit.","19":"Ik neem heden tegen ulieden tot getuigen den hemel en de aarde; het leven en den dood heb ik u voorgesteld, den zegen en den vloek! Kiest dan het leven, opdat gij levet, gij en uw zaad;","20":"Liefhebbende den HEERE, uw God, Zijner stem gehoorzaam zijnde, en Hem aanhangende; want Hij is uw leven en de lengte uwer dagen; opdat gij blijft in het land, dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven."},"KJV":{"1":"And it shall come to pass, when all these things are come upon thee, the blessing and the curse, which I have set before thee, and thou shalt call *them* to mind among all the nations, whither the LORD thy God hath driven","2":"And shalt return unto the LORD thy God, and shalt obey his voice according to all that I command thee this day, thou and thy children, with all thine heart, and with all thy soul;","3":"That then the LORD thy God will turn thy captivity, and have compassion upon thee, and will return and gather thee from all the nations, whither the LORD thy God hath scattered","4":"If *any* of thine be driven out unto the outmost *parts* of heaven, from thence will the LORD thy God gather thee, and from thence will he fetch","5":"And the LORD thy God will bring thee into the land which thy fathers possessed, and thou shalt possess it; and he will do thee good, and multiply thee above thy fathers.","6":"And the LORD thy God will circumcise thine heart, and the heart of thy seed, to love the LORD thy God with all thine heart, and with all thy soul, that thou mayest live.","7":"And the LORD thy God will put all these curses upon thine enemies, and on them that hate thee, which persecuted","8":"And thou shalt return and obey the voice of the LORD, and do all his commandments which I command thee this day.","9":"And the LORD thy God will make thee plenteous in every work of thine hand, in the fruit of thy body, and in the fruit of thy cattle, and in the fruit of thy land, for good: for the LORD will again rejoice over thee for good, as he rejoiced over thy fathers:","10":"If thou shalt hearken unto the voice of the LORD thy God, to keep his commandments and his statutes which are written in this book of the law, *and* if thou turn unto the LORD thy God with all thine heart, and with all thy soul.","11":"For this commandment which I command thee this day, it *is* not hidden from thee, neither *is* it far off.","12":"It *is* not in heaven, that thou shouldest say, Who shall go up for us to heaven, and bring it unto us, that we may hear it, and do","13":"Neither *is* it beyond the sea, that thou shouldest say, Who shall go over the sea for us, and bring it unto us, that we may hear it, and do","14":"But the word *is* very nigh unto thee, in thy mouth, and in thy heart, that thou mayest do","15":"See, I have set before thee this day life and good, and death and evil;","16":"In that I command thee this day to love the LORD thy God, to walk in his ways, and to keep his commandments and his statutes and his judgments, that thou mayest live and multiply: and the LORD thy God shall bless thee in the land whither thou goest to possess","17":"But if thine heart turn away, so that thou wilt not hear, but shalt be drawn away, and worship other gods, and serve","18":"I denounce unto you this day, that ye shall surely perish, *and that* ye shall not prolong *your* days upon the land, whither thou passest over Jordan to go to possess","19":"I call heaven and earth to record this day against you, *that* I have set before you life and death, blessing and cursing: therefore choose life, that both thou and thy seed may live:","20":"That thou mayest love the LORD thy God, *and* that thou mayest obey his voice, and that thou mayest cleave unto him: for he *is* thy life, and the length of thy days: that thou mayest dwell in the land which the LORD sware unto thy fathers, to Abraham, to Isaac, and to Jacob, to give"}},"tsk":{"1":[{"kopje":"het gebeuren","refs":["Deut 4:30","Lev 26:40-46"]},{"kopje":"deze zegen","refs":["Deut 30:15","Deut 30:19","Deut 11:26-28","Deut 27:1","Deut 28:65","Deut 29:18-23","Lev 26:1-46"]},{"kopje":"zult u het weer ter harte nemen","refs":["Deut 4:29","1 Kon 8:47","1 Kon 8:48","Jes 46:8","Ezech 18:28","Luk 15:17"]},{"kopje":"waarheen","refs":["Gen 4:14","Jer 8:3"]}],"2":[{"kopje":"bekeren tot","refs":["Deut 4:28-31","Neh 1:9","Jes 55:6","Jes 55:7","Klaagl 3:32","Klaagl 3:40","Hos 3:5","Hos 6:1","Hos 6:2","Hos 14:2-4","Joël 2:12","Joël 2:13","Zach 12:10","2 Kor 3:16","1 Joh 1:9"]},{"kopje":"met uw ganse hart","refs":["Deut 6:5","Deut 13:3","1 Kron 29:9","1 Kron 29:17","Ps 41:13","Ps 119:80","Jer 3:10","Jer 4:14","Jer 29:13","Ef 6:24"]}],"3":[{"kopje":"dan zal","refs":["Ps 106:45-47","Ps 126:1-4","Jes 56:8","Jer 29:14","Jer 31:10","Klaagl 3:22","Klaagl 3:32","Rom 11:23","Rom 11:26","Rom 11:31"]},{"kopje":"weer bijeenbrengen","refs":["Ezra 1:1-4","Ps 147:2","Jer 32:37-44","Ezech 34:12","Ezech 34:13","Ezech 36:24","Zach 8:7","Zach 8:8"]}],"4":[{"kopje":"van daar","refs":["Deut 28:64","Neh 1:9","Jes 11:11-16","Ezech 39:25-29","Zef 3:19","Zef 3:20"]}],"6":[{"kopje":"besnijden","refs":["Deut 10:16","Jer 4:4","Jer 9:26","Jer 32:39","Ezech 11:19","Ezech 11:20","Ezech 36:26","Ezech 36:27","Joh 3:3-7","Rom 2:28","Rom 2:29","Rom 11:26","2 Kor 5:17","Kol 2:11"]},{"kopje":"lief te hebben","refs":["Deut 6:5","Ex 20:6","Matt 22:37","Rom 8:28","1 Kor 8:3","Jak 1:12","Jak 2:5","1 Joh 4:7","1 Joh 4:16-19","1 Joh 5:3","1 Joh 5:4"]}],"9":[{"kopje":"geven","refs":["Deut 28:4","Deut 28:11-14","Lev 26:4","Lev 26:6","Lev 26:9","Lev 26:10"]},{"kopje":"verblijden over u","refs":["Deut 28:63","Jes 62:5","Jes 65:19","Jer 32:41","Jer 33:9","Zef 3:17","Luk 15:6-10","Luk 15:32","Joh 15:11"]}],"10":[{"kopje":"gehoorzaam zult zijn","refs":["Deut 30:2","Deut 30:8","Jes 55:2","Jes 55:3","1 Kor 7:19"]},{"ko chword":"u voorgesteld,","tekst":"Hebreeuws, voor uw aangezicht gegeven."}],"20":[{"catchword":"is uw leven en de lengte uwer dagen;","tekst":"Dat is, die u het leven geeft, onderhoudt en verlangt. Vergelijk Act 17:25, Act 17:28."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Moreover it shall come to pass when all these things shall come upon thee this blessing or this curse[ first the blessing on obedience and then the curse on obedience so that thou shalt have an experience of both] which I have set before thee [ Heb. Have given before thy face as above chapter 11.26 and below verse 15, 19] then thou shalt take them again to thine heart [Heb. Cause them to return or to into thine heart compare above chapter 4.29,30 &c. there ye have a like prophesy as is set here and in the following words others thou shalt have taken them again to thine heart] among all the nations whither the Lord thy God hath driven thee."}],"2":[{"catchword":null,"tekst":"And thou shalt return unto the Lord thy God [others thou shalt have returned &c.] and be obedient unto his voice according to all that I command thee this day thou and thine children with all thine heart and with all thy soul."}],"3":[{"catchword":null,"tekst":"And the Lord thy God shall turn thy captivity [that is cause the multitude of thy captivity to return so Psa 69:19 Eph 4:8 others then shall the Lord &c.] and have compassion upon thee and he shall gather thee again [Heb. And he shall return and shall gather thee that are he shall gather thee again or he shall return with his grace and mercy and gather thee again.] From all the nations whither the Lord thy God hath scattered thee."}],"4":[{"catchword":null,"tekst":"Though thy driven ones were at the end of heaven [compare above chapter 4 on verse 34] from thence will the Lord thy Godfathers thee and from thence will he take thee."}],"5":[{"catchword":null,"tekst":"And the Lord thy God will bring thee into the land which thy father possessed hereditarily thou   const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
