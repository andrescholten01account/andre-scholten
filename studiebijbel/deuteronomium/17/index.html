voor de maan, of voor het hele leger van de hemel, wat ik niet geboden heb;","4":"En het wordt u aangezegd, en u hoort het; dan moet u het goed onderzoeken; en zie, het is de waarheid, de zaak staat vast, zo'n gruwel is in Israël gedaan;","5":"Dan moet u die man of die vrouw, die dit boze stuk gedaan hebben, naar uw poorten brengen, die man of die vrouw, zeg ik, en u moet hen met stenen stenigen, totdat zij sterven.","6":"Op het woord van twee getuigen, of drie getuigen, zal hij gedood worden die de dood verdient; op het woord van één enkele getuige zal hij niet gedood worden.","7":"De hand van de getuigen zal eerst tegen hem zijn om hem te doden, en daarna de hand van het hele volk; zo moet u het kwaad uit uw midden wegdoen.","8":"Wanneer een zaak voor het gericht u te zwaar zal zijn, tussen bloed en bloed, tussen rechtszaak en rechtszaak, tussen de ene plaag en de andere plaag, geschillen in uw poorten, dan moet u opstaan en gaan naar de plaats die de HEERE, uw God, zal uitkiezen;","9":"En u moet komen bij de Levitische priesters en bij de rechter die er in die dagen is; en u moet vragen, en zij zullen u de rechterlijke uitspraak bekendmaken.","10":"En u moet doen naar het bevel van het woord dat zij u bekend zullen maken, vanaf die plaats die de HEERE zal uitkiezen, en u moet erop letten te doen naar alles wat zij u zullen leren.","11":"Naar het bevel van de wet die zij u zullen leren, en naar het oordeel dat zij u zullen zeggen, moet u doen; u mag niet afwijken van het woord dat zij u bekend zullen maken, naar rechts of naar links.","12":"De man nu die trots handelt door niet te luisteren naar de priester die daar staat om de HEERE, uw God, te dienen, of naar de rechter, die man zal sterven; en u moet het kwaad uit Israël wegdoen.","13":"Zodat het hele volk het hoort en vreest, en niet meer trots handelt.","14":"Wanneer u gekomen bent in het land dat de HEERE, uw God, u geeft, en u dat erfelijk bezit en daarin woont, en u zegt: Ik wil een koning over mij aanstellen, zoals al de volken die rondom mij zijn;","15":"Dan moet u zeker die tot koning over u aanstellen die de HEERE, uw God, zal uitkiezen; uit uw broeders moet u een koning over u aanstellen; u mag geen vreemde man over u zetten die uw broeder niet is.","16":"Maar hij mag voor zichzelf de paarden niet vermeerderen, en het volk niet laten terugkeren naar Egypte om paarden te vermeerderen; want de HEERE heeft tegen u gezegd: U mag voortaan niet meer terugkeren langs deze weg.","17":"Ook mag hij voor zichzelf de vrouwen niet vermeerderen, opdat zijn hart niet afwijkt; hij mag voor zichzelf ook geen zilver en goud in overvloed vermeerderen.","18":"Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt;","19":"En het moet bij hem blijven, en hij moet daarin lezen al de dagen van zijn leven; opdat hij de HEERE, zijn God, leert vrezen, om al de woorden van deze wet en deze inzettingen te bewaren en te doen;","20":"Zodat zijn hart zich niet verheft boven zijn broeders, en hij niet afwijkt van het gebod, naar rechts of naar links; opdat hij de dagen verlengt in zijn koninkrijk, hij en zijn zonen, te midden van Israël."},"SV":{"1":"Gij zult den HEERE, uw God, geen os of klein vee offeren, waaraan een gebrek zij *of* enig kwaad; want dat is den HEERE, uw God, een gruwel.","2":"Wanneer in het midden van u, in een uwer poorten, die de HEERE, uw God, u geeft, een man of vrouw gevonden zal worden, die doen zal, dat kwaad is in de ogen des HEEREN, uws Gods, overtredende Zijn verbond;","3":"Dat hij heengaat, en dient andere goden, en buigt zich voor die, of voor de zon, of voor de maan, of voor het ganse heir des hemels, hetwelk ik niet geboden heb;","4":"En het wordt u aangezegd, en gij hoort het; zo zult gij het wel onderzoeken; en ziet, het is de waarheid, de zaak is zeker, zulk een gruwel is in Israël gedaan;","5":"Zo zult gij dien man of die vrouw, die ditzelve boze stuk gedaan hebben, tot uw poorten uitbrengen, dien man *zeg* *ik*, of die vrouw; en gij zult hen met stenen stenigen, dat zij sterven.","6":"Op den mond van twee getuigen, of drie getuigen, zal hij gedood worden, die sterven zal; op den mond van een enigen getuige zal hij niet gedood worden.","7":"De hand der getuigen zal eerst tegen hem zijn, om hem te doden, en daarna de hand des gansen volks; zo zult gij het boze uit het midden van u wegdoen.","8":"Wanneer een zaak aan het gericht voor u te zwaar zal zijn, tussen bloed en bloed, tussen rechtshandel en rechtshandel, tussen plage en plage, zijnde twistzaken in uw poorten, zo zult gij u opmaken en opgaan naar de plaats, die de HEERE, uw God, verkiezen zal;","9":"En gij zult komen tot de Levietische priesters, en tot den rechter, die in die dagen zijn zal; en gij zult ondervragen, en zij zullen u de zaak des rechts aanzeggen.","10":"En gij zult doen naar het bevel des woords, dat zij u zullen aanzeggen, van diezelve plaats, die de HEERE verkiezen zal, en gij zult waarnemen te doen naar alles, wat zij u zullen leren.","11":"Naar het bevel der wet, die zij u zullen leren, en naar het oordeel, dat zij u zullen zeggen, zult gij doen; gij zult niet afwijken van het woord, dat zij u zullen aanzeggen, ter rechter *hand* of ter linkerhand.","12":"De man nu, die trotselijk handelen zal, dat hij niet hore naar den priester, dewelke staat, om aldaar den HEERE, uw God, te dienen, of naar den rechter, dezelve man zal sterven; en gij zult het boze uit Israël wegdoen.","13":"Dat het al dat volk hore en vreze, en niet meer trotselijk handele.","14":"Wanneer gij zult gekomen zijn in het land, dat u de HEERE, uw God, geeft, en gij dat erfelijk zult bezitten en daarin wonen, en gij zeggen zult: Ik zal een koning over mij stellen, als al de volken, die rondom mij zijn;","15":"Zo zult gij ganselijk tot koning over u stellen, dien de HEERE, uw God, verkiezen zal; uit het midden uwer broederen zult gij een koning over u stellen; gij zult niet vermogen over u te zetten een vreemden man, die uw broeder niet zij.","16":"Maar hij zal voor zich de paarden niet vermenigvuldigen, en het volk niet doen wederkeren naar Egypte, om paarden te vermenigvuldigen; terwijl de HEERE ulieden gezegd heeft: Gij zult voortaan niet wederkeren door dezen weg.","17":"Ook zal hij voor zich de vrouwen niet vermenigvuldigen, opdat zijn hart niet afwijke; hij zal ook voor zich geen zilver en goud zeer vermenigvuldigen.","18":"Voorts zal het geschieden, als hij op den stoel zijns koninkrijks zal zitten, zo zal hij zich een dubbel van deze wet afschrijven in een boek, uit *hetgeen* voor het aangezicht der Levietische priesteren is;","19":"En het zal bij hem zijn, en hij zal daarin lezen al de dagen zijns levens; opdat hij den HEERE, zijn God, lere vrezen, om te bewaren al de woorden dezer wet en deze inzettingen, om die te doen;","20":"Dat zijn hart zich niet verheffe boven zijn broederen, en dat hij niet afwijke van het gebod, ter rechter *hand* of ter linkerhand; opdat hij de dagen verlenge in zijn koninkrijk, hij en zijn zonen, in het midden van Israël."},"KJV":{"1":"Thou shalt not sacrifice unto the LORD thy God *any* bullock, or sheep, wherein is blemish, *or* any evilfavouredness: for that *is* an abomination unto the LORD thy God.","2":"If there be found among you, within any of thy gates which the LORD thy God giveth thee, man or woman, that hath wrought wickedness in the sight of the LORD thy God, in transgressing his covenant,","3":"And hath gone and served other gods, and worshipped them, either the sun, or moon, or any of the host of heaven, which I have not commanded;","4":"And it be told thee, and thou hast heard *of it*, and enquired diligently, and, behold, *it be* true, *and* the thing certain, *that* such abomination is wrought in Israel:","5":"Then shalt thou bring forth that man or that woman, which have committed that wicked thing, unto thy gates, *even* that man or that woman, and shalt stone them with stones, till they die.","6":"At the mouth of two witnesses, or three witnesses, shall he that is worthy of death be put to death; *but* at the mouth of one witness he shall not be put to death.","7":"The hands of the witnesses shall be first upon him to put him to death, and afterward the hands of all the people. So thou shalt put the evil away from among","8":"If there arise a matter too hard for thee in judgment, between blood and blood, between plea and plea, and between stroke and stroke, *being* matters of controversy within thy gates: then shalt thou arise, and get thee up into the place which the LORD thy God shall choose;","9":"And thou shalt come unto the priests the Levites, and unto the judge that shall be in those days, and enquire; and they shall shew thee the sentence of judgment:","10":"And thou shalt do according to the sentence, which they of that place which the LORD shall choose shall shew thee; and thou shalt observe to do according to all that they inform","11":"According to the sentence of the law which they shall teach thee, and according to the judgment which they shall tell thee, thou shalt do: thou shalt not decline from the sentence which they shall shew thee, *to* the right hand, nor *to* the left.","12":"And the man that will do presumptuously, and will not hearken unto the priest that standeth to minister there before the LORD thy God, or unto the judge, even that man shall die: and thou shalt put away the evil from Israel.","13":"And all the people shall hear, and fear, and do no more presumptuously.","14":"When thou art come unto the land which the LORD thy God giveth thee, and shalt possess it, and shalt dwell therein, and shalt say, I will set a king over me, like as all the nations that *are* about","15":"Thou shalt in any wise set *him* king over thee, whom the LORD thy God shall choose: *one* from among thy brethren shalt thou set king over thee: thou mayest not set a stranger over thee, which *is* not thy brother.","16":"But he shall not multiply horses to himself, nor cause the people to return to Egypt, to the end that he should multiply horses: forasmuch as the LORD hath said unto you, Ye shall henceforth return no more that way.","17":"Neither shall he multiply wives to himself, that his heart turn not away: neither shall he greatly multiply to himself silver and gold.","18":"And it shall be, when he sitteth upon the throne of his kingdom, that he shall write him a copy of this law in a book out of *that which is* before the priests the Levites:","19":"And it shall be with him, and he shall read therein all the days of his life: that he may learn to fear the LORD his God, to keep all the words of this law and these statutes, to do","20":"That his heart be not lifted up above his brethren, and that he turn not aside from the commandment, *to* the right hand, or *to* the left: to the end that he may prolong *his* days in his kingdom, he, and his children, in the midst of Israel."}},"tsk":{"1":[{"kopje":"geen","refs":["Deut 15:21"]},{"kopje":"klein vee","refs":["Gen 41:3","Gen 41:4","Gen 41:19"]},{"kopje":"want dat","refs":["Deut 23:18","Deut 24:4","Deut 25:16","Spr 6:16","Spr 11:1","Spr 15:8","Spr 20:10"]}],"2":[{"kopje":"man","refs":["Deut 17:5","Deut 13:6-18","Deut 29:18"]},{"kopje":"te overtreden","refs":["Deut 4:23","Deut 29:25","Deut 31:20","Lev 26:15","Lev 26:25","Joz 7:11","Joz 7:15","Joz 23:16","Richt 2:20","2 Kon 18:12","Jer 31:32","Ezech 16:38","Hos 6:7","Hos 8:1","Hebr 8:9","Hebr 8:10"]}],"3":[{"kopje":"de zon","refs":["Deut 4:19","2 Kon 21:3","Job 31:26","Job 31:27","Jer 8:2","Ezech 8:16"]},{"kopje":"wat","refs":["Jer 7:22","Jer 7:23","Jer 7:31","Jer 19:5","Jer 32:35"]}],"4":[{"kopje":"onderzoeken","refs":["Deut 13:12-14","Deut 19:18","Spr 25:2","Joh 7:51"]}],"5":[{"kopje":"stenigen","refs":["Deut 13:10","Deut 13:11","Deut 21:21","Deut 22:21","Deut 22:24","Lev 24:14","Lev 24:16","Joz 7:25"]}],"7":[{"kopje":"van de getuigen","refs":["Deut 13:9","Han a-code=\"H7794\">bullock,</span> or <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep,</span> wherein is <span class=\"wl wl-kjv\" data-code=\"H3971\">blemish,</span> or any <span class=\"wl wl-kjv\" data-code=\"H7451\">evilfavouredness:</span> for that is an <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy God.","2":"If there be <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> you, within <span class=\"wl wl-kjv\" data-code=\"H259\">any</span> of thy <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> thee, <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> or <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> that hath <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> in <span class=\"wl wl-kjv\" data-code=\"H5674\">transgressing</span> his covenant,","3":"And hath <span class=\"wl wl-kjv\" data-code=\"H3212\">gone</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> them, either the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun,</span> or <span class=\"wl wl-kjv\" data-code=\"H3394\">moon,</span> or any of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> which I have not commanded;","4":"And it be <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> thee, and thou hast <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of it, and <span class=\"wl wl-kjv\" data-code=\"H1875\">enquired</span> <span class=\"wl wl-kjv\" data-code=\"H3190\">diligently,</span> and, behold, it be <span class=\"wl wl-kjv\" data-code=\"H571\">true,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H3559\">certain,</span> that such <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> is <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> in Israel:","5":"Then shalt thou bring <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> that <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> or that <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> which have <span class=\"wl wl-kjv\" data-code=\"H6213\">committed</span> that <span class=\"wl wl-kjv\" data-code=\"H7451\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">thing,</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H8179\">gates,</span> even that <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> or that <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H5619\">stone</span> them with <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> till they die.","6":"At the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses,</span> or <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses,</span> shall he that is worthy of <span class=\"wl wl-kjv\" data-code=\"H4191\">death</span> be put to <span class=\"wl wl-kjv\" data-code=\"H4191\">death;</span> but at the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H5707\">witness</span> he shall not be put to death.","7":"The <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of the <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> upon him to put him to <span class=\"wl wl-kjv\" data-code=\"H4191\">death,</span> and <span class=\"wl wl-kjv\" data-code=\"H314\">afterward</span> the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span> So thou shalt <span class=\"wl wl-kjv\" data-code=\"H1197\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> from among","8":"If there arise a <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> too <span class=\"wl wl-kjv\" data-code=\"H6381\">hard</span> for thee in <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> between <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> and <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> between <span class=\"wl wl-kjv\" data-code=\"H1779\">plea</span> and <span class=\"wl wl-kjv\" data-code=\"H1779\">plea,</span> and between <span class=\"wl wl-kjv\" data-code=\"H5061\">stroke</span> and <span class=\"wl wl-kjv\" data-code=\"H5061\">stroke,</span> being <span class=\"wl wl-kjv\" data-code=\"H1697\">matters</span> of <span class=\"wl wl-kjv\" data-code=\"H7379\">controversy</span> within thy <span class=\"wl wl-kjv\" data-code=\"H8179\">gates:</span> then shalt thou <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> and get thee <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall choose;","9":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> and unto the <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> that shall be in those <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> and <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> thee the <span class=\"wl wl-kjv\" data-code=\"H1697\">sentence</span> of judgment:","10":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to the <span class=\"wl wl-kjv\" data-code=\"H6310\">sentence,</span> which they of that <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> shall <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> thee; and thou shalt <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to all that they inform","11":"According to the <span class=\"wl wl-kjv\" data-code=\"H6310\">sentence</span> of the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> which they shall <span class=\"wl wl-kjv\" data-code=\"H3384\">teach</span> thee, and according to the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> which they shall <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> thee, thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">do:</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H5493\">decline</span> from the <span class=\"wl wl-kjv\" data-code=\"H1697\">sentence</span> which they shall <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> thee, to the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> nor to the left.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H2087\">presumptuously,</span> and will not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> that <span class=\"wl wl-kjv\" data-code=\"H5975\">standeth</span> to <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> there before the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> or unto the <span class=\"wl wl-kjv\" data-code=\"H8199\">judge,</span> even that <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> and thou shalt put <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> from Israel.","13":"And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> and <span class=\"wl wl-kjv\" data-code=\"H3372\">fear,</span> and do no more presumptuously.","14":"When thou art <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> thee, and shalt <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it, and shalt <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein, and shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I will <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over me, like as all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that are about","15":"Thou shalt in any <span class=\"wl wl-kjv\" data-code=\"H7760\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> him <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over thee, whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H977\">choose:</span> one from <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over thee: thou <span class=\"wl wl-kjv\" data-code=\"H3201\">mayest</span> not <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H5237\">stranger</span> over thee, which is not thy brother.","16":"But he shall not <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> to himself, nor cause the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> to the end that he should <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> <span class=\"wl wl-kjv\" data-code=\"H5483\">horses:</span> forasmuch as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto you, Ye shall <span class=\"wl wl-kjv\" data-code=\"H3254\">henceforth</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> no more that way.","17":"Neither shall he <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> to himself, that his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">turn</span> not away: neither shall he <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> to himself <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and gold.","18":"And it shall be, when he <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of his <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom,</span> that he shall <span class=\"wl wl-kjv\" data-code=\"H3789\">write</span> him a <span class=\"wl wl-kjv\" data-code=\"H4932\">copy</span> of this <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> in a <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> out of that which is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> the Levites:","19":"And it shall be with him, and he shall <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> therein all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H2416\">life:</span> that he may <span class=\"wl wl-kjv\" data-code=\"H3925\">learn</span> to <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> all the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of this <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> and these <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> to do","20":"That his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> be not lifted <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> above his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and that he turn not <span class=\"wl wl-kjv\" data-code=\"H5493\">aside</span> from the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment,</span> to the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> or to the <span class=\"wl wl-kjv\" data-code=\"H8040\">left:</span> to the end that he may <span class=\"wl wl-kjv\" data-code=\"H748\">prolong</span> his <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> in his <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom,</span> he, and his <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of Israel."}};

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
