de ban vernietigen; u zult geen verbond met hen maken, en hun ook niet genadig zijn.","3":"U zult zich ook niet met hen verzwageren; uw dochters zult u niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen.","4":"Want zij zouden uw zonen van Mij doen afwijken, zodat zij andere goden zouden dienen; en de toorn van de HEERE zou tegen u ontsteken, en u snel verdelgen.","5":"Maar zo zult u met hen doen: hun altaren zult u afbreken, en hun opgerichte beelden verbrijzelen, en hun gewijde bomen zult u omhakken, en hun gesneden beelden met vuur verbranden.","6":"Want u bent een heilig volk voor de HEERE, uw God; u heeft de HEERE, uw God, uitgekozen om Hem een volk van het eigendom te zijn, uit alle volken die op de aardbodem zijn.","7":"De HEERE heeft geen liefde tot u opgevat, en u niet uitgekozen, om uw grote aantal boven alle andere volken; want u was het minste van alle volken.","8":"Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.","9":"U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.","10":"En Hij vergeldt ieder van hen die Hem haten, in zijn aangezicht, om hem te verderven; Hij zal het voor wie Hem haat niet uitstellen, in zijn aangezicht zal Hij het hem vergelden.","11":"Houd dan de geboden, en de inzettingen, en de rechten, die ik u vandaag gebied, om die te doen.","12":"Dan zal het gebeuren, omdat u deze rechten zult horen, en houden, en die doen, dat de HEERE, uw God, voor u het verbond en de goedertierenheid zal houden, die Hij uw vaderen gezworen heeft;","13":"en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven.","14":"Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten;","15":"en de HEERE zal alle ziekte van u afweren, en Hij zal u geen van de kwade ziekten van de Egyptenaren, die u kent, opleggen, maar zal ze leggen op allen die u haten.","16":"U zult dan al die volken verteren, die de HEERE, uw God, u geven zal; uw oog zal hen niet ontzien, en u zult hun goden niet dienen; want dat zou u een valstrik zijn.","17":"Als u in uw hart zei: Deze volken zijn groter dan ik; hoe zou ik hen uit hun bezit kunnen verdrijven? —","18":"wees niet bevreesd voor hen; denk goed terug aan wat de HEERE, uw God, aan de farao en aan alle Egyptenaren gedaan heeft;","19":"de grote verzoekingen die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en de uitgestrekte arm, waardoor de HEERE, uw God, u heeft uitgevoerd; zo zal de HEERE, uw God, doen aan alle volken voor wie u bevreesd bent.","20":"Daarbij zal de HEERE, uw God, ook horzels onder hen zenden, totdat zij die overgebleven zijn en zich voor uw aangezicht verborgen hebben, zijn omgekomen.","21":"Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.","22":"En de HEERE, uw God, zal deze volken voor uw aangezicht geleidelijk uitwerpen; u zult hen niet snel mogen vernietigen, omdat anders de wilde dieren van het veld tegen u te veel worden.","23":"En de Heere zal hen aan u overgeven, en Hij zal hen verschrikken met grote verschrikking, totdat zij verdelgd worden.","24":"Ook zal Hij hun koningen in uw hand geven, zodat u hun naam van onder de hemel verdelgt; geen man zal voor uw aangezicht standhouden, totdat u hen zult hebben verdelgd.","25":"De gesneden beelden van hun goden zult u met vuur verbranden; het zilver en goud dat daaraan is, zult u niet begeren, en ook niet voor uzelf nemen, opdat u daardoor niet verstrikt wordt; want dat is voor de HEERE, uw God, een afschuwelijke gruwel.","26":"U zult dan de gruwel niet in uw huis brengen, anders wordt u zelf net zo verbannen als dat is; u zult het helemaal verafschuwen, en er volledig een gruwel van hebben, want het is verbannen."},"SV":{"1":"Wanneer u de HEERE, uw God, zal gebracht hebben in het land, waar gij naar toe gaat, om dat te erven; en Hij vele volken voor uw aangezicht zal hebben uitgeworpen, de Hethieten, en de Girgasieten, en de Amorieten, en de Kanaänieten, en de Ferezieten, en de Hevieten, en de Jebusieten, zeven volken, die meerder en machtiger zijn dan gij;","2":"En de HEERE, uw God, hen zal gegeven hebben voor uw aangezicht, dat gij ze slaat; zo zult gij hen ganselijk verbannen; gij zult geen verbond met hen maken, noch hun genadig zijn.","3":"Gij zult u ook met hen niet vermaagschappen; gij zult uw dochters niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen.","4":"Want zij zouden uw zonen van Mij doen afwijken, dat zij andere goden zouden dienen; en de toorn des HEEREN zou tegen ulieden ontsteken, en u haast verdelgen.","5":"Maar alzo zult gij hun doen: hun altaren zult gij afwerpen, en hun opgerichte beelden verbreken, en hun bossen zult gij afhouwen, en hun gesnedene beelden met vuur verbranden.","6":"Want gij zijt een heilig volk den HEERE, uw God; u heeft de HEERE, uw God, verkoren, dat gij Hem tot een volk des eigendoms zoudt zijn uit alle volken, die op den aardbodem zijn.","7":"De HEERE heeft geen lust tot u gehad, noch u verkoren, om uw veelheid boven alle andere volken; want gij waart het weinigste van alle volken.","8":"Maar omdat de HEERE ulieden liefhad, en opdat Hij hield den eed, dien Hij uw vaderen gezworen had, heeft u de HEERE met een sterke hand uitgevoerd, en heeft u verlost uit het diensthuis, uit de hand van Farao, koning van Egypte.","9":"Gij zult dan weten, dat de HEERE, uw God, die God is, die getrouwe God, welke het verbond en de weldadigheid houdt dien, die Hem liefhebben, en Zijn geboden houden tot in duizend geslachten.","10":"En Hij vergeldt een ieder van hen, die Hem haten, in zijn aangezicht, om hem te verderven; Hij zal het Zijn hater niet vertrekken, in zijn aangezicht zal Hij het hem vergelden.","11":"Houdt dan de geboden, en de inzettingen, en de rechten, die ik u heden gebiede, om die te doen.","12":"Zo zal het geschieden, omdat gij deze rechten zult horen, en houden, en dezelve doen, dat de HEERE, uw God, u het verbond en de weldadigheid zal houden, die Hij uw vaderen gezworen heeft;","13":"En Hij zal u liefhebben, en zal u zegenen, en u doen vermenigvuldigen; en Hij zal zegenen de vrucht uws buiks, en de vrucht uws lands, uw koren, en uw most, en uw olie, de voortzetting uwer koeien, en de kudden van uw klein vee, in het land, dat Hij aan uw vaderen gezworen heeft u te geven.","14":"Gezegend zult gij zijn boven alle volken; er zal onder u noch man noch vrouw onvruchtbaar zijn, ook *niet* onder uw beesten;","15":"En de HEERE zal alle krankheid van u afweren, en Hij zal u geen van de kwade ziekten der Egyptenaren, die gij kent, opleggen, maar zal ze leggen op allen, die u haten.","16":"Gij zult dan al die volken verteren, die de HEERE, uw God, u geven zal; uw oog zal hen niet verschonen, en gij zult hun goden niet dienen; want dat zoude u een strik zijn.","17":"Zo gij in uw hart zeidet: Deze volken zijn meerder dan ik; hoe zou ik hen uit de bezitting kunnen verdrijven?","18":"Vreest niet voor hen; gedenkt steeds, wat de HEERE, uw God, aan Farao en aan alle Egyptenaren gedaan heeft;","19":"De grote verzoekingen, die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en den uitgestrekten arm, door welken u de HEERE, uw God, heeft uitgevoerd; alzo zal de HEERE, uw God, doen aan alle volken, voor welker aangezicht gij vreest.","20":"Daartoe zal de HEERE, uw God, ook horzelen onder hen zenden; totdat zij omkomen, die overgebleven, en voor uw aangezicht verborgen zijn.","21":"Ontzet u niet voor hunlieder aangezicht; want de HEERE, uw God, is in het midden van u, een groot en vreselijk God.","22":"En de HEERE, uw God, zal deze volken voor uw aangezicht allengskens uitwerpen; haastelijk zult gij hen niet mogen te niet doen, opdat het wild des velds niet tegen u vermenigvuldige.","23":"En de Heere zal hen geven voor uw aangezicht, en Hij zal hen verschrikken met grote verschrikking, totdat zij verdelgd worden.","24":"Ook zal Hij hun koningen in uw hand geven, dat gij hun naam van onder den hemel te niet doet; geen man zal voor uw aangezicht bestaan, totdat gij hen zult hebben verdelgd.","25":"De gesneden beelden van hun goden zult gij met vuur verbranden; het zilver en goud, dat daaraan is, zult gij niet begeren, noch voor u nemen, opdat gij daardoor niet verstrikt wordt; want dat is den HEERE, uw God, een gruwel.","26":"Gij zult dan den gruwel in uw huis niet brengen, dat gij een ban zoudt worden, gelijk datzelve is; gij zult het ganselijk verfoeien, en ten enenmaal een gruwel daarvan hebben, want het is een ban."},"KJV":{"1":"When the LORD thy God shall bring thee into the land whither thou goest to possess it, and hath cast out many nations before thee, the Hittites, and the Girgashites, and the Amorites, and the Canaanites, and the Perizzites, and the Hivites, and the Jebusites, seven nations greater and mightier","2":"And when the LORD thy God shall deliver them before thee; thou shalt smite them, *and* utterly destroy them; thou shalt make no covenant with them, nor shew mercy","3":"Neither shalt thou make marriages with them; thy daughter thou shalt not give unto his son, nor his daughter shalt thou take unto thy son.","4":"For they will turn away thy son from following me, that they may serve other gods: so will the anger of the LORD be kindled against you, and destroy thee suddenly.","5":"But thus shall ye deal with them; ye shall destroy their altars, and break down their images, and cut down their groves, and burn their graven images with fire.","6":"For thou *art* an holy people unto the LORD thy God: the LORD thy God hath chosen thee to be a special people unto himself, above all people that *are* upon the face of the earth.","7":"The LORD did not set his love upon you, nor choose you, because ye were more in number than any people; for ye *were* the fewest of all people:","8":"But because the LORD loved you, and because he would keep the oath which he had sworn unto your fathers, hath the LORD brought you out with a mighty hand, and redeemed you out of the house of bondmen, from the hand of Pharaoh king of Egypt.","9":"Know therefore that the LORD thy God, he *is* God, the faithful God, which keepeth covenant and mercy with them that love him and keep his commandments to a thousand generations;","10":"And repayeth them that hate him to their face, to destroy them: he will not be slack to him that hateth him, he will repay him to his face.","11":"Thou shalt therefore keep the commandments, and the statutes, and the judgments, which I command thee this day, to do","12":"Wherefore it shall come to pass, if ye hearken to these judgments, and keep, and do them, that the LORD thy God shall keep unto thee the covenant and the mercy which he sware unto thy fathers:","13":"And he will love thee, and bless thee, and multiply thee: he will also bless the fruit of thy womb, and the fruit of thy land, thy corn, and thy wine, and thine oil, the increase of thy kine, and the flocks of thy sheep, in the land which he sware unto thy fathers to give","14":"Thou shalt be blessed above all people: there shall not be male or female barren among you, or among your cattle.","15":"And the LORD will take away from thee all sickness, and will put none of the evil diseases of Egypt, which thou knowest, upon thee; but will lay them upon all *them* that hate","16":"And thou shalt consume all the people which the LORD thy God shall deliver thee; thine eye shall have no pity upon them: neither shalt thou serve their gods; for that *will be* a snare","17":"If thou shalt say in thine heart, These nations *are* more than I; how can I dispossess","18":"Thou shalt not be afraid of them: *but* shalt well remember what the LORD thy God did unto Pharaoh, and unto all Egypt;","19":"The great temptations which thine eyes saw, and the signs, and the wonders, and the mighty hand, and the stretched out arm, whereby the LORD thy God brought thee out: so shall the LORD thy God do unto all the people of whom thou art afraid.","20":"Moreover the LORD thy God will send the hornet among them, until they that are left, and hide themselves from thee, be destroyed.","21":"Thou shalt not be affrighted at them: for the LORD thy God *is* among you, a mighty God and terrible.","22":"And the LORD thy God will put out those nations before thee by little and little: thou mayest not consume them at once, lest the beasts of the field increase","23":"But the LORD thy God shall deliver them unto thee, and shall destroy them with a mighty destruction, until they be destroyed.","24":"And he shall deliver their kings into thine hand, and thou shalt destroy their name from under heaven: there shall no man be able to stand before thee, until thou have destroyed","25":"The graven images of their gods shall ye burn with fire: thou shalt not desire the silver or gold *that is* on them, nor take *it* unto thee, lest thou be snared therein: for it *is* an abomination to the LORD thy God.","26":"Neither shalt thou bring an abomination into thine house, lest thou be a cursed thing like it: *but* thou shalt utterly detest it, and thou shalt utterly abhor it; for it *is* a cursed thing."}},"tsk":{"1":[{"kopje":"de HEERE","refs":["Deut 4:38","Deut 6:1","Deut 6:10","Deut 6:19","Deut 6:23","Deut 9:1","Deut 9:4","Deut 11:29","Deut 31:3","Deut 31:20","Ex 6:7","Ex 15:7","Num 14:31","Ps 44:3","Ps 44:4","Ps 78:55"]},{"kopje":"de Hethieten","refs":["Gen 15:18-21","Ex 23:28","Ex 33:2"]},{"kopje":"groter","refs":["Deut 4:38","Deut 4:1-3","Deut 20:1"]}],"2":[{"kopj uzelf <span class=\"wl\" data-l=\"L8\" data-code=\"H3947\">nemen</span>, <span class=\"wl\" data-l=\"L9\" data-code=\"H3369\">opdat</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3947\">u</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3369\">daardoor</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3369\">niet</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3369\">verstrikt</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H430\">wordt</span>; <span class=\"wl\" data-l=\"L2\" data-code=\"H430\">want</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H2530\">dat</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H2530\">is</span> voor <span class=\"wl\" data-l=\"L2\" data-code=\"H430\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H430\">HEERE</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H430\">uw</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H430\">God</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H430\">een</span> afschuwelijke <span class=\"wl\" data-l=\"L10\" data-code=\"H8441\">gruwel</span>.","26":"U <span class=\"wl\" data-l=\"L1\" data-code=\"H8441\">zult</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8441\">dan</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8441\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8441\">gruwel</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H935\">niet</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H935\">in</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1004\">uw</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1004\">huis</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H935\">brengen</span>, anders wordt u zelf net zo verbannen als <span class=\"wl\" data-l=\"L4\" data-code=\"H2764\">dat</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2764\">is</span>; u <span class=\"wl\" data-l=\"L5\" data-code=\"H8262\">zult</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8262\">het</span> helemaal verafschuwen, <span class=\"wl\" data-l=\"L6\" data-code=\"H8581\">en</span> er volledig <span class=\"wl\" data-l=\"L6\" data-code=\"H8581\">een</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8581\">gruwel</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8581\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2764\">hebben</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H2764\">want</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2764\">het</span> is verbannen."},"koppeling_kjv":{"1":"When the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> thee into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> whither thou <span class=\"wl wl-kjv\" data-code=\"H935\">goest</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it, and hath cast <span class=\"wl wl-kjv\" data-code=\"H5394\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1622\">Girgashites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6522\">Perizzites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2340\">Hivites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2983\">Jebusites,</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">greater</span> and mightier","2":"And when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee; thou shalt <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> them, and <span class=\"wl wl-kjv\" data-code=\"H2763\">utterly</span> <span class=\"wl wl-kjv\" data-code=\"H2763\">destroy</span> them; thou shalt <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> no <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with them, nor shew mercy","3":"Neither shalt thou make <span class=\"wl wl-kjv\" data-code=\"H2859\">marriages</span> with them; thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> nor his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> unto thy son.","4":"For they will turn <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> from <span class=\"wl wl-kjv\" data-code=\"H310\">following</span> me, that they may <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods:</span> so will the <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against you, and <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> thee suddenly.","5":"But thus shall ye <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> with them; ye shall <span class=\"wl wl-kjv\" data-code=\"H5422\">destroy</span> their <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and break <span class=\"wl wl-kjv\" data-code=\"H7665\">down</span> their <span class=\"wl wl-kjv\" data-code=\"H4676\">images,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H1438\">down</span> their <span class=\"wl wl-kjv\" data-code=\"H842\">groves,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> their graven <span class=\"wl wl-kjv\" data-code=\"H6456\">images</span> with fire.","6":"For thou art an <span class=\"wl wl-kjv\" data-code=\"H6918\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> thee to be a <span class=\"wl wl-kjv\" data-code=\"H5459\">special</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> unto himself, above all <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that are upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the earth.","7":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> did not set his <span class=\"wl wl-kjv\" data-code=\"H2836\">love</span> upon you, nor <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> you, because ye were <span class=\"wl wl-kjv\" data-code=\"H7230\">more</span> in number than any <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> for ye were the <span class=\"wl wl-kjv\" data-code=\"H4592\">fewest</span> of all people:","8":"But because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H160\">loved</span> you, and because he would <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H7621\">oath</span> which he had <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> unto your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> brought you <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> with a <span class=\"wl wl-kjv\" data-code=\"H2389\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed</span> you out of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H5650\">bondmen,</span> from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Egypt.","9":"<span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> therefore that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> he is <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> the <span class=\"wl wl-kjv\" data-code=\"H539\">faithful</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> which <span class=\"wl wl-kjv\" data-code=\"H8104\">keepeth</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> and <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> with them that <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> him and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> his <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> to a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> generations;","10":"And <span class=\"wl wl-kjv\" data-code=\"H7999\">repayeth</span> them that <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> him to their <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> to <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> them: he will not be <span class=\"wl wl-kjv\" data-code=\"H309\">slack</span> to him that <span class=\"wl wl-kjv\" data-code=\"H8130\">hateth</span> him, he will <span class=\"wl wl-kjv\" data-code=\"H7999\">repay</span> him to his face.","11":"Thou shalt therefore <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> which I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> to do","12":"Wherefore it shall come to pass, <span class=\"wl wl-kjv\" data-code=\"H6118\">if</span> ye <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> to these <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them, that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> unto thee the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> and the <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> which he <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto thy fathers:","13":"And he will <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> thee: he will also <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of thy <span class=\"wl wl-kjv\" data-code=\"H990\">womb,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of thy <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> thy <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> and thine <span class=\"wl wl-kjv\" data-code=\"H3323\">oil,</span> the <span class=\"wl wl-kjv\" data-code=\"H7698\">increase</span> of thy <span class=\"wl wl-kjv\" data-code=\"H504\">kine,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6251\">flocks</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> in the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> which he <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> to give","14":"Thou shalt be <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> above all <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> there shall not be <span class=\"wl wl-kjv\" data-code=\"H6135\">male</span> or female <span class=\"wl wl-kjv\" data-code=\"H6135\">barren</span> among you, or among your cattle.","15":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> from thee all <span class=\"wl wl-kjv\" data-code=\"H2483\">sickness,</span> and will <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> none of the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H4064\">diseases</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> which thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest,</span> upon thee; but will <span class=\"wl wl-kjv\" data-code=\"H5414\">lay</span> them upon all them that hate","16":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H398\">consume</span> all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> thee; thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> shall have no <span class=\"wl wl-kjv\" data-code=\"H2347\">pity</span> upon them: neither shalt thou <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">gods;</span> for that will be a snare","17":"If thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> These <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> are <span class=\"wl wl-kjv\" data-code=\"H7227\">more</span> than I; <span class=\"wl wl-kjv\" data-code=\"H349\">how</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">can</span> I dispossess","18":"Thou shalt not be <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> of them: but shalt <span class=\"wl wl-kjv\" data-code=\"H2142\">well</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> what the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and unto all Egypt;","19":"The <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4531\">temptations</span> which thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw,</span> and the <span class=\"wl wl-kjv\" data-code=\"H226\">signs,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4159\">wonders,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2389\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and the stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> <span class=\"wl wl-kjv\" data-code=\"H2220\">arm,</span> whereby the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> brought thee <span class=\"wl wl-kjv\" data-code=\"H3318\">out:</span> so shall the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl- const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
