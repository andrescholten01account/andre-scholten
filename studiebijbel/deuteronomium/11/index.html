ao, de koning van Egypte, en aan zijn hele land;","4":"En wat Hij gedaan heeft aan het leger van de Egyptenaren, aan hun paarden en aan hun wagens; dat Hij het water van de Schelfzee over hun aangezicht liet stromen, toen zij u van achteren vervolgden; en de HEERE hen wegvaagde, tot op deze dag;","5":"En wat Hij u gedaan heeft in de woestijn, totdat u gekomen bent aan deze plaats;","6":"Daarboven, wat Hij gedaan heeft aan Dathan, en aan Abiram, zonen van Eliab, de zoon van Ruben; hoe de aarde haar mond opende, en hen verslond met hun huisgezinnen, en hun tenten, ja, al hun bezit, in het midden van heel Israël.","7":"Want het zijn uw ogen, die al dit grote werk van de HEERE gezien hebben, dat Hij gedaan heeft.","8":"Houd dan alle geboden, die ik u heden gebied; opdat u sterk wordt en het land binnengaat, en het erft, waarheen u overtrekt, om dat te erven;","9":"En opdat u de dagen verlengt in het land, dat de HEERE aan uw vaderen gezworen heeft, aan hen en aan hun nageslacht te geven; een land, vloeiend van melk en honing.","10":"Want het land, waar u naartoe gaat, om dat te erven, is niet als Egypteland, van waar u uitgegaan bent, waar u uw zaad zaaide, en bewaterde met uw voet, als een kruidhof.","11":"Maar het land, waarheen u overtrekt, om dat te erven, is een land van bergen en van dalen; het drinkt water van de regen van de hemel;","12":"Een land, dat de HEERE, uw God, verzorgt; de ogen van de HEERE, uw God, zijn er voortdurend op gericht, van het begin van het jaar tot het einde van het jaar.","13":"En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel;","14":"Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt.","15":"En Ik zal gras geven op uw veld voor uw dieren; en u zult eten en verzadigd worden.","16":"Wacht uzelf, dat uw hart niet verleid wordt, dat u afwijkt, en andere goden dient, en u voor die buigt;","17":"Dat de toorn van de HEERE tegen u ontsteekt, en Hij de hemel toesluit, zodat er geen regen is, en het aardland zijn opbrengst niet geeft; en u snel omkomt uit het goede land, dat de HEERE u geeft.","18":"Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen;","19":"En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat;","20":"En schrijf ze op de posten van uw huis, en aan uw poorten;","21":"Opdat uw dagen, en de dagen van uw kinderen, in het land, dat de HEERE aan uw vaderen gezworen heeft hun te geven, vermenigvuldigen, zoals de dagen van de hemel boven de aarde.","22":"Want als u zorgvuldig al deze geboden houdt, die ik u gebied om die te doen, de HEERE, uw God, liefhebbend, wandelend in al Zijn wegen, en Hem aanhangend;","23":"Dan zal de HEERE al deze volken voor uw aangezicht uit hun bezit verdrijven, en u zult in bezit nemen grotere en machtigere volken dan u bent.","24":"Elke plaats, waar uw voetzool op treedt, zal de uwe zijn; van de woestijn en de Libanon, van de rivier, de rivier de Eufraat, tot aan de verste zee, zal uw gebied zijn.","25":"Niemand zal voor uw aangezicht standhouden; de HEERE, uw God, zal de schrik en de vrees voor u geven over heel het land, waarop u treden zult, zoals Hij tot u gesproken heeft.","26":"Zie, ik stel u heden voor: zegen en vloek:","27":"De zegen, wanneer u zult horen naar de geboden van de HEERE, uw God, die ik u heden gebied;","28":"Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.","29":"En het zal gebeuren, als de HEERE, uw God, u zal hebben binnengebracht in het land, waar u naartoe gaat, om dat te erven; dan zult u de zegen uitspreken op de berg Gerizim, en de vloek op de berg Ebal.","30":"Zijn zij niet aan de overkant van de Jordaan, achter de weg van de ondergang van de zon, in het land van de Kanaänieten, die in het vlakke veld wonen, tegenover Gilgal, bij de eikenbossen van More?","31":"Want u zult over de Jordaan gaan, om binnen te komen en dat land te erven, dat de HEERE, uw God, u geven zal; en u zult het in bezit nemen, en daarin wonen.","32":"Neem dan waar te doen al de inzettingen en de rechten, die ik u heden voorstel."},"SV":{"1":"Daarom zult gij den HEERE, uw God, liefhebben, en gij zult te allen dage onderhouden Zijn bevel, en Zijn inzettingen, en Zijn rechten, en Zijn geboden.","2":"En gijlieden zult heden weten, dat ik niet *spreek* met uw kinderen, die het niet weten, en de onderwijzing des HEEREN, uws Gods, niet gezien hebben. Zijn grootheid, Zijn sterke hand en Zijn uitgestrekten arm;","3":"Daartoe Zijn tekenen en Zijn daden, die Hij in het midden van Egypte gedaan heeft, aan Farao, den koning van Egypte, en aan zijn ganse land;","4":"En wat Hij gedaan heeft aan het heir der Egyptenaren, aan deszelfs paarden en aan deszelfs wagenen; dat Hij de wateren van de Schelfzee boven hun aangezicht deed overzwemmen, als zij ulieden van achteren vervolgden; en de HEERE verdeed hen, tot op dezen dag.","5":"En wat Hij ulieden gedaan heeft in de woestijn, totdat gij gekomen zijt aan deze plaats.","6":"Daarboven, wat Hij gedaan heeft aan Dathan, en aan Abiram, zonen van Eliab, den zoon van Ruben; hoe de aarde haar mond opendeed, en hen verslond met hun huisgezinnen, en hun tenten, ja, al wat bestond, dat hun aanging, in het midden van gans Israël.","7":"Want het zijn uw ogen, die gezien hebben al dit grote werk des HEEREN, dat Hij gedaan heeft.","8":"Houdt dan alle geboden, die ik u heden gebiede; opdat gij gesterkt wordt en inkomt, en erft het land, waarheen gij overtrekt, om dat te erven;","9":"En opdat gij de dagen verlengt in het land, dat de HEERE uw vaderen gezworen heeft, aan hen en aan hun zaad te geven; een land, vloeiende van melk en honig.","10":"Want het land, waar gij naar toe gaat, om dat te erven, is niet als Egypteland, van waar gij uitgegaan zijt, hetwelk gij bezaaidet met uw zaad, en bewaterdet met uw gang, als een kruidhof.","11":"Maar het land, waarheen gij overtrekt, om dat te erven, is een land van bergen en van dalen; het drinkt water bij den regen des hemels;","12":"Een land, dat de HEERE, uw God, bezorgt; de ogen des HEEREN, uws Gods, zijn gedurig daarop, van het begin des jaars tot het einde des jaars.","13":"En het zal geschieden, zo gij naarstiglijk zult horen naar Mijn geboden, die Ik u heden gebiede, om den HEERE, uw God, lief te hebben, en Hem te dienen, met uw ganse hart en met uw ganse ziel;","14":"Zo zal Ik den regen uws lands geven te zijner tijd, vroegen regen en spaden regen, opdat gij uw koren, en uw most, en uw olie inzamelt.","15":"En Ik zal kruid geven op uw veld voor uw beesten; en gij zult eten en verzadigd worden.","16":"Wacht uzelven, dat ulieder hart niet verleid worde, dat gij afwijkt, en andere goden dient, en u voor die buigt;","17":"Dat de toorn des HEEREN tegen ulieden ontsteke, en Hij den hemel toesluite, dat er geen regen zij, en het aardrijk zijn gewas niet geve; en gij haastelijk omkomt van het goede land, dat u de HEERE geeft.","18":"Legt dan deze mijn woorden in uw hart, en in uw ziel, en bindt ze tot een teken op uw hand, dat zij tot voorhoofdspanselen zijn tussen uw ogen;","19":"En leert die uw kinderen, sprekende daarvan, als gij in uw huis zit, en als gij op den weg gaat, en als gij nederligt, en als gij opstaat;","20":"En schrijft ze op de posten van uw huis, en aan uw poorten;","21":"Opdat uw dagen, en de dagen uwer kinderen, in het land, dat de HEERE uw vaderen gezworen heeft hun te geven, vermenigvuldigen, gelijk de dagen des hemels op de aarde.","22":"Want zo gij naarstiglijk houdt al deze geboden, die ik u gebiede om die te doen, den HEERE, uw God, liefhebbende, wandelende in al Zijn wegen, en Hem aanhangende;","23":"Zo zal de HEERE al deze volken voor uw aangezicht uit de bezitting verdrijven, en gij zult erfelijk bezitten groter en machtiger volken, dan gij zijt.","24":"Alle plaats, waar uw voetzool op treedt, zal de uwe zijn; van de woestijn en den Libanon, van de rivier, de rivier Frath, tot aan de achterste zee, zal uw landpale zijn.","25":"Niemand zal voor uw aangezicht bestaan; de HEERE, uw God, zal uw schrik en uw vreze geven over al het land, waarop gij treden zult, gelijk als Hij tot u gesproken heeft.","26":"Ziet, ik stel ulieden heden voor, zegen en vloek:","27":"Den zegen, wanneer gij horen zult naar de geboden des HEEREN, uws Gods, die ik u heden gebiede;","28":"Maar den vloek, zo gij niet horen zult naar de geboden des HEEREN, uws Gods, en afwijkt van den weg, dien ik u heden gebiede, om andere goden na te wandelen, die gij niet gekend hebt.","29":"En het zal geschieden, als u de HEERE, uw God, zal hebben ingebracht in het land, waar gij naar toe gaat, om dat te erven; dan zult gij den zegen uitspreken op den berg Gerizim, en den vloek op den berg Ebal.","30":"Zijn zij niet aan gene zijde van de Jordaan, achter den weg van den ondergang der zon, in het land der Kanaänieten, die in het vlakke veld wonen, tegenover Gilgal, bij de eikenbossen van More?","31":"Want gijlieden zult over de Jordaan gaan, dat gij inkomet om te erven dat land, dat de HEERE, uw God, u geven zal; en gij zult het erfelijk bezitten, en daarin wonen.","32":"Neemt dan waar te doen al de inzettingen en de rechten, die ik u heden voorstel."},"KJV":{"1":"Therefore thou shalt love the LORD thy God, and keep his charge, and his statutes, and his judgments, and his commandments, alway.","2":"And know ye this day: for *I speak* not with your children which have not known, and which have not seen the chastisement of the LORD your God, his greatness, his mighty hand, and his stretched out arm,","3":"And his miracles, and his acts, which he did in the midst of Egypt unto Pharaoh the king of Egypt, and unto all his land;","4":"And what he did unto the army of Egypt, unto their horses, and to their chariots; how he made the water of the Red sea to overflow them as they pursued after you, and *how* the LORD hath destroyed them unto this day;","5":"And what he did unto you in the wilderness, until ye came into this place;","6":"And what he did unto Dathan and Abiram, the sons of Eliab, the son of Reuben: how the earth opened her mouth, and swallowed them up, and their households, and their tents, and all the substance that *was* in their possession, in the midst of all Israel:","7":"But your eyes have seen all the great acts of the LORD which he did.","8":"Therefore shall ye keep all the commandments which I command you this day, that ye may be strong, and go in and possess the land, whither ye go to possess","9":"And that ye may prolong *your* days in the land, which the LORD sware unto your fathers to give unto them and to their seed, a land that floweth with milk and honey.","10":"For the land, whither thou goest in to possess it, *is* not as the land of Egypt, from whence ye came out, where thou sowedst thy seed, and wateredst *it* with thy foot, as a garden of herbs:","11":"But the land, whither ye go to possess it, *is* a land of hills and valleys, *and* drinketh water of the rain of heaven:","12":"A land which the LORD thy God careth for: the eyes of the LORD thy God *are* always upon it, from the beginning of the year even unto the end of the year.","13":"And it shall come to pass, if ye shall hearken diligently unto my commandments which I command you this day, to love the LORD your God, and to serve him with all your heart and with all your soul,","14":"That I will give *you* the rain of your land in his due season, the first rain and the latter rain, that thou mayest gather in thy corn, and thy wine, and thine oil.","15":"And I will send grass in thy fields for thy cattle, that thou mayest eat and be full.","16":"Take heed to yourselves, that your heart be not deceived, and ye turn aside, and serve other gods, and worship","17":"And *then* the LORD'S wrath be kindled against you, and he shut up the heaven, that there be no rain, and that the land yield not her fruit; and *lest* ye perish quickly from off the good land which the LORD giveth","18":"Therefore shall ye lay up these my words in your heart and in your soul, and bind them for a sign upon your hand, that they may be as frontlets between your eyes.","19":"And ye shall teach them your children, speaking of them when thou sittest in thine house, and when thou walkest by the way, when thou liest down, and when thou risest up.","20":"And thou shalt write them upon the door posts of thine house, and upon thy gates:","21":"That your days may be multiplied, and the days of your children, in the land which the LORD sware unto your fathers to give them, as the days of heaven upon the earth.","22":"For if ye shall diligently keep all these commandments which I command you, to do them, to love the LORD your God, to walk in all his ways, and to cleave","23":"Then will the LORD drive out all these nations from before you, and ye shall possess greater nations and mightier","24":"Every place whereon the soles of your feet shall tread shall be yours: from the wilderness and Lebanon, from the river, the river Euphrates, even unto the uttermost sea shall your coast","25":"There shall no man be able to stand before you: *for* the LORD your God shall lay the fear of you and the dread of you upon all the land that ye shall tread upon, as he hath said","26":"Behold, I set before you this day a blessing and a curse;","27":"A blessing, if ye obey the commandments of the LORD your God, which I command you this day:","28":"And a curse, if ye will not obey the commandments of the LORD your God, but turn aside out of the way which I command you this day, to go after other gods, which ye have not known.","29":"And it shall come to pass, when the LORD thy God hath brought thee in unto the land whither thou go e=\"H8104\">keep</span> his <span class=\"wl wl-kjv\" data-code=\"H4931\">charge,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> alway.","2":"And <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> ye this <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> for I speak not with your <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> which have not <span class=\"wl wl-kjv\" data-code=\"H3045\">known,</span> and which have not <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> the <span class=\"wl wl-kjv\" data-code=\"H4148\">chastisement</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> his <span class=\"wl wl-kjv\" data-code=\"H1433\">greatness,</span> his <span class=\"wl wl-kjv\" data-code=\"H2389\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and his stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> arm,","3":"And his <span class=\"wl wl-kjv\" data-code=\"H226\">miracles,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4639\">acts,</span> which he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and unto all his land;","4":"And what he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> unto their <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> and to their <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots;</span> how he made the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of the <span class=\"wl wl-kjv\" data-code=\"H5488\">Red</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> to <span class=\"wl wl-kjv\" data-code=\"H6687\">overflow</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">them</span> as they <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> you, and how the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6\">destroyed</span> them unto this day;","5":"And what he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto you in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> until ye <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into this place;","6":"And what he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto <span class=\"wl wl-kjv\" data-code=\"H1885\">Dathan</span> and <span class=\"wl wl-kjv\" data-code=\"H48\">Abiram,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H446\">Eliab,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben:</span> how the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H6475\">opened</span> her <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and swallowed them <span class=\"wl wl-kjv\" data-code=\"H1104\">up,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1004\">households,</span> and their <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3351\">substance</span> that was in their <span class=\"wl wl-kjv\" data-code=\"H7272\">possession,</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of all Israel:","7":"But your <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> all the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4639\">acts</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> which he did.","8":"Therefore shall ye <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> all the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> <span class=\"wl wl-kjv\" data-code=\"H834\">which</span> I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> you this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that ye may be <span class=\"wl wl-kjv\" data-code=\"H2388\">strong,</span> and go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> and <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> whither ye <span class=\"wl wl-kjv\" data-code=\"H5674\">go</span> to possess","9":"And that ye may <span class=\"wl wl-kjv\" data-code=\"H748\">prolong</span> your <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> in the <span class=\"wl wl-kjv\" data-code=\"H127\">land,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto them and to their <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that <span class=\"wl wl-kjv\" data-code=\"H2100\">floweth</span> with <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> and honey.","10":"For the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> whither thou goest <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it, is not as the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> from whence ye came <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> where thou <span class=\"wl wl-kjv\" data-code=\"H2232\">sowedst</span> thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and <span class=\"wl wl-kjv\" data-code=\"H8248\">wateredst</span> it with thy <span class=\"wl wl-kjv\" data-code=\"H7272\">foot,</span> as a <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> of herbs:","11":"But the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> whither ye <span class=\"wl wl-kjv\" data-code=\"H5674\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> it, is a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H2022\">hills</span> and <span class=\"wl wl-kjv\" data-code=\"H1237\">valleys,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drinketh</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of the <span class=\"wl wl-kjv\" data-code=\"H4306\">rain</span> of heaven:","12":"A <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> careth <span class=\"wl wl-kjv\" data-code=\"H1875\">for:</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> are <span class=\"wl wl-kjv\" data-code=\"H8548\">always</span> upon it, from the <span class=\"wl wl-kjv\" data-code=\"H7225\">beginning</span> of the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H319\">end</span> of the year.","13":"And it shall come to pass, if ye shall <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">diligently</span> unto my <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> which I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> you this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> to <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him with all your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> and with all your soul,","14":"That I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you the <span class=\"wl wl-kjv\" data-code=\"H4306\">rain</span> of your <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> in his due <span class=\"wl wl-kjv\" data-code=\"H6256\">season,</span> the first <span class=\"wl wl-kjv\" data-code=\"H3138\">rain</span> and the latter <span class=\"wl wl-kjv\" data-code=\"H4456\">rain,</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> in thy <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> and thine oil.","15":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">send</span> <span class=\"wl wl-kjv\" data-code=\"H6212\">grass</span> in thy <span class=\"wl wl-kjv\" data-code=\"H7704\">fields</span> for thy <span class=\"wl wl-kjv\" data-code=\"H929\">cattle,</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and be full.","16":"Take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to yourselves, that your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> be not <span class=\"wl wl-kjv\" data-code=\"H6601\">deceived,</span> and ye turn <span class=\"wl wl-kjv\" data-code=\"H5493\">aside,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and worship","17":"And then the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> be <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against you, and he shut <span class=\"wl wl-kjv\" data-code=\"H6113\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> that there be no <span class=\"wl wl-kjv\" data-code=\"H4306\">rain,</span> and that the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">yield</span> not her <span class=\"wl wl-kjv\" data-code=\"H2981\">fruit;</span> and lest ye <span class=\"wl wl-kjv\" data-code=\"H6\">perish</span> <span class=\"wl wl-kjv\" data-code=\"H4120\">quickly</span> from off the <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> giveth","18":"Therefore shall ye lay <span class=\"wl wl-kjv\" data-code=\"H7760\">up</span> these my <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> and in your <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> and <span class=\"wl wl-kjv\" data-code=\"H7194\">bind</span> them for a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> upon your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> that they may be as <span class=\"wl wl-kjv\" data-code=\"H2903\">frontlets</span> between your eyes.","19":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H3925\">teach</span> them your <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking</span> of them when thou <span class=\"wl wl-kjv\" data-code=\"H3427\">sittest</span> in thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and when thou <span class=\"wl wl-kjv\" data-code=\"H3212\">walkest</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> when thou <span class=\"wl wl-kjv\" data-code=\"H7901\">liest</span> down, and when thou risest up.","20":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3789\">write</span> them upon the door <span class=\"wl wl-kjv\" data-code=\"H4201\">posts</span> of thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and upon thy gates:","21":"That your <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> may be <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of your <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> in the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them, as the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> upon the earth.","22":"For if ye shall <span class=\"wl wl-kjv\" data-code=\"H8104\">diligently</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> all these <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> which I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> you, to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them, to <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in all his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and to cleave","23":"Then will the <span class=\"wl wl-kjv\ at is, met uw dienst en arbeid, moetende het water met moeite er in dragen of leiden, om dat te bevochtigen. Anders, naar uw eigen goeddunken."}],"11":[{"catchword":"bij den regen des hemels;","tekst":"Zonder des mensen arbeid en toedoen."}],"12":[{"catchword":"bezorgt;","tekst":"Hebreeuws, zoekt, nazoekt, of navraagt: menselijk van God gesproken. Want de mensen plegen te zoeken en te vragen naar hetgeen zij een bijzondere genegenheid toedragen. Vergelijk Job 3:4; Isa 62:2."}],"13":[{"catchword":"naarstiglijk zult horen","tekst":"Hebreeuws, horende horen zult."}],"14":[{"catchword":"Zo zal Ik den regen","tekst":"Hier voert Mozes God zelven in, aldus sprekende."},{"catchword":"lands geven te Zijner tijd,","tekst":"Dat is, uw land vereisen zal."},{"catchword":"vroegen regen","tekst":"Dien God gaf, nadat het land bebouwd en bezaaid was, om het zaad uit de aarde te doen opschieten."},{"catchword":"spaden regen,","tekst":"Die kort vóór den oogst viel, om de vruchten zwaar en rijp te maken. Zie Jer 5:24; Hos 6:3; Joe 2:23; Jam 5:7."}],"17":[{"catchword":"toesluite,","tekst":"Een manier van spreken, waardoor bij gelijkenis wordt uitgedrukt de goddelijke regering in de lucht, dienende tot wering en ophouding des regens. Zie 1Ki 8:35; 2Ch 6:26, en 2Ch 7:13."}],"18":[{"catchword":"bindt ze tot een teken op uw hand,","tekst":"Zie Exo 13:9, en boven, Deu 6:8."}],"21":[{"catchword":"gelijk de dagen des hemels op de aarde","tekst":"Dat is, zolang de wereld staat zal God zijn volk met zijn zegen bijblijven. Vergelijk Psa 89:37-38; Mat 28:20. Anders, uw en uwer kinderen dagen zullen vele zijn, gelijk de dagen van den hemel vele zijn."}],"22":[{"catchword":"naarstiglijk houdt al deze geboden,","tekst":"Hebreeuws, houdende houdt."}],"23":[{"catchword":"groter en machtiger volken,","tekst":"Dat is, landen van groter en machtiger volken; gelijk boven, Deu 9:1."}],"24":[{"catchword":"waar uw voetzool op treedt,","tekst":"Vergelijk boven, Deu 2:5; Jos 1:3, en Jos 14:9."},{"catchword":"van de woestijn en den Libanon,","tekst":"Vergelijk Gen 10:19, en Gen 15:18; Exo 23:31; Num 34; boven, Deu 1:7; Jos 1:4."},{"catchword":"achterste zee,","tekst":"Dat is, die in het westen gelegen is. Oost, of de opgang der zon, wordt genoemd het voorste deel, en west, of de ondergang, wordt genoemd het achterste. Vergelijk onder, Deu 34:2; Jos 1:4, en Jos 13:5; Joe 2:20."}],"25":[{"catchword":"uw schrik en uw vreze geven","tekst":"Gelijk boven, Deu 2:25."}],"26":[{"catchword":"stel ulieden heden voor,","tekst":"Hebreeuws, ik geef, of, stel voor ulieder aangezicht; alzo onder, vs.32, en Deu 30:1."}],"29":[{"catchword":"zult gij","tekst":"Dat is, gij zult bevel geven dat de zegen uitgesproken wordt. Zie de vervulling Jos 8:33-34."},{"catchword":"zegen","tekst":"Die beschreven wordt onder, Deu 28."},{"catchword":"uitspreken","tekst":"Uiten, uitgeven. Hebreeuws, geven. Vergelijk onder, Deu 13:1; 1Ki 13:5."},{"catchword":"vloek op den berg Ebal","tekst":"Die beschreven wordt onder, Deu 27 en Deu 28."}],"30":[{"catchword":"zij niet aan gene zijde van de Jordaan,","tekst":"Te weten, de plaatsen, in het einde van vs.29 genoemd, zijn gewisselijk daar gelegen."},{"catchword":"More?","tekst":"Zie Gen 12:6."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Therefore thou shalt love the Lord thy God and thou halt keep his charge [Heb. Thou salt keep his keeping that is that which hath given thee in charge to keep see genesis 26 on verse 5] and his statutes and his judgments and his commandments see above chapter 5 on verse 31] all thy days or times [Heb. All the days to wit of thy life as after see chapter 12.1,19 and 10.9 and 17.19 &c.]"}],"2":[{"catchword":null,"tekst":"And I know this day that I speak not with your children that know it not seen the instruction of the Lord your God [that is all that God had done at that time unto his people to instruct which is related in the sequel] his greatness [that is his majesty and great divine power shining and appearing in his works as the following words declare so above chapter 3.24 and 9.27] his strong and his stretched out arm."}],"3":[{"catchword":null,"tekst":"Besides his token and his acts which he did in the midst of Egypt unto Pharaoh the king of Egypt and unto his land?"}],"4":[{"catchword":null,"tekst":"And what he did unto the army of the Egyptians to his horses and to his chariots and that he made the waters of the Red-sea to swim above their face when they pursued after you and how the Lord destroyed them unto this day."}],"5":[{"catchword":null,"tekst":"And what he did for you in the wilderness until ye came to this place."}],"6":[{"catchword":null,"tekst":"Moreover what he did unto Dathan and unto Abiram the son of Eliab the son of Reuben how the earth opened her mouth and swallowed them up with heir household [Heb. Houses] and their tents ye all that subsisted [see Genesis 7on verse 4] that concerned them [Heb. That was their feet that is in their service power or possession or that concerned and attended them compare exodus 11.8] in the midst of all Israel."}],"7":[{"catchword":null,"tekst":"For eyes are they that have seen all his great works of the Lord which he hath done [Moseh intimateth that it was special mercy of God that all these wonders were done in their lifetime add before their eyes compare above chapter 5.3.]"}],"8":[{"catchword":null,"tekst":"Keep then all commandments which I command thee this day [Heb. all or every commandment which I &c. so below verse 22] that ye may be strong and go in and inherit the land whether ye go over to inherit it."}],"9":[{"catchword":null,"tekst":"And ye may prolong your days in the land which the Lord swear unto your father to give unto them and to their seed a land flowing with milk and honey [see exodus 3 on verse 8.]"}],"10":[{"catchword":null,"tekst":"For the land whether thou goest to inherit it, it id not as the land of Egypt from whence ye came out which thou sowedst with thy seed and waterdst with thy going [Heb. With thy foot that is with thy service and labor being lain with labor and pain to bring or carry water into it to moisten it other according to thine own good liking or as it seemed good unto thee ] as a garden of herbs."}],"11":[{"catchword":null,"tekst":"But the land whither go over to inherit is a land of mountains of the valleys it drinketh water by the rain of heaven [without men&acirc;&euro;&trade;s labor of pain.]"}],"12":[{"catchword":null,"tekst":"A land which the Lord thy God careth for [Heb. Seeketh seeketh after or enquireth after its spoken of God after the manner of men for men do use to seek and after that which they bear a special affection to compare job 3.4 Isa 62:12] the eyes of the Lord thy god are continually upon it from the beginning of the year unto the end of the year."}],"13":[{"catchword":null,"tekst":"And it shall come to pass when ye shall hearken diligently [Heb. Hearken shall hearken] unto my commandments which I command ye this day to love the Lord your God and to serve with all your heart and with all your soul."}],"14":[{"catchword":null,"tekst":"Then I will give ye the rain [Here Moses bringeth god himself in speaking thus ] of your land [that is which your land shall require] in due season the early rain [which God gave after the ground tilled and sold to make the seed spring up out of the earth] and the latter rain [which fell a little before harvest to make the fruit heavy and to ripen them see Jer 5:24Hosiah 6.3 Joel 2.24 Jas 5:7] that thou mayest gather in thy corn and thy new wine and thy oil."}],"15":[{"catchword":null,"tekst":"And I will give herb upon thy field for thy beasts and thou shalt and be satisfied."}],"17":[{"catchword":null,"tekst":"The Lord&acirc;&euro;&trade;s wrath kindle against ye and he shut up the heaven [a kind of phrase whereby the way of similitude is expressed the divine providence ruling and governing in the air serving for the removal and with holding of rain see 1Ki 8:39 2Ch 6:26 and 7.13] that there be no rain and the ground yield not her increase and ye suddenly perish from the good land which the lord giveth ye."}],"18":[{"catchword":null,"tekst":"Lay then these my words in your heart and in your soul and bind them for a toke upon your hand that they may be as frontless before your eyes [see Exo 13:9 and above chapter 6 on verse 8.]"}],"19":[{"catchword":null,"tekst":"And teach them your children speaking of them when thou sittest in thine house and thou goest on the way and when thou liest down and when thou riseth up."}],"20":[{"catchword":null,"tekst":"And write them upon the posts of thine house and at thy gates."}],"21":[{"catchword":null,"tekst":"That your days and the days of your children may be multiplied in the land which the Lord swear unto fathers to give them as the days of the heaven upon thy earth [that is as long as the world stands will continue with his people in his blessings compare Psa 89:37,38 Mat 28:20 others thy and thy children days shall be many as the days of heaven are many."}],"22":[{"catchword":null,"tekst":"For if ye diligently keep [Heb. Keep keeping] all these commandments which I command ye to do them loving the Lord your God walking in all his ways and cleaving unto him."}],"23":[{"catchword":null,"tekst":"Then will the Lord drive out of possession all these nations before your face and ye shall hereditarily possess greater and mightier nations [that is the land greater and mightier nations as above chapter 9.1] then ye are."}],"24":[{"catchword":null,"tekst":"All [or every ] place whereon the sole of the foot tradeth [compare above chapter 2.5 Jos 1:3 and 14.9] shall be you&acirc;&euro;&trade;re your from the wilderness and Libanon from the river the river Euphrates unto the hindmost sea [that is which liest in the west the east or the sun rising is called the foremost part and the suns setting the hindmost part compare below chapter 34.2 Joshua and 13.5 Joel 2.20] shall your border be [compare Genesis 10 on verse 19 and 1 function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');

    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');

        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
