eiden door een vergadering van veel volken; die zullen u optrekken in Mijn garen. Dan zal Ik u achterlaten op het land, Ik zal u wegwerpen op het open veld; en Ik zal al het gevogelte van de hemel op u laten wonen, en het gedierte van de hele aarde van u verzadigen.", "Gal 6:2": "Draag elkaars lasten, en vervul zo de wet van Christus.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "Gal 5:21": "Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Deut 25:15": "U zult een volkomen en eerlijk gewicht hebben; u zult een volkomen en eerlijke efa hebben; opdat uw dagen verlengd worden in het land, dat de HEERE, uw God, u geven zal.", "Lev 20:10-12": "Een man ook, die met de vrouw van een ander overspel doet, omdat hij overspel doet met de vrouw van zijn naaste, zal zeker gedood worden, de overspeler en de overspeelster. En een man, die gemeenschap heeft met de vrouw van zijn vader, heeft de schaamte van zijn vader ontdekt; zij beiden zullen zeker gedood worden; hun bloed is op hen! Ook als de man gemeenschap heeft met de vrouw van zijn zoon, zullen zij beiden zeker gedood worden; zij hebben een gruwelijke vermenging gedaan; hun bloed is op hen!", "Joh 8:5": "En Mozes heeft ons in de wet geboden, dat zulke vrouwen gestenigd moeten worden; Wat zegt U dan?", "1 Kor 4:13": "wij worden belasterd, en wij smeken; wij zijn geworden als het uitvaagsel van de wereld, en het afschraapsel van alles, tot nu toe.", "Lev 25:15": "Naar het getal van de jaren, vanaf het jubeljaar, zult u van uw naaste kopen, en naar het getal van de jaren van de opbrengsten zal hij het aan u verkopen.", "Num 15:35": "Toen zei de HEERE tot Mozes: Die man zal zeker gedood worden; de hele vergadering zal hem met stenen stenigen buiten het leger.", "Jes 1:16-20": "Was u, reinig u, doe de boosheid van uw handelingen van voor Mijn ogen weg, houd op met kwaad te doen. Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe. Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "1 Tess 5:14": "En wij bidden u, broeders, vermaan de ongeregelde mensen, vertroost de kleinmoedigen, ondersteun de zwakken, wees geduldig tegenover allen.", "1 Kor 7:5": "Onttrek u niet aan elkaar, tenzij met wederzijdse instemming voor een tijd, opdat u zich aan vasten en bidden kunt wijden; en kom weer bijeen, opdat de satan u niet verzoekt, omdat u zich niet kunt onthouden.", "Lev 25:2-12": "Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer u in het land gekomen zult zijn, dat Ik u geef, dan zal dat land rusten, een sabbat voor de HEERE. Zes jaar zult u uw akker bezaaien, en zes jaar uw wijngaard snoeien, en de opbrengst daarvan inzamelen. Maar in het zevende jaar zal voor het land een sabbat van rust zijn, een sabbat voor de HEERE; uw akker zult u niet bezaaien en uw wijngaard niet snoeien.", "Rom 15:5": "Doch de God van de lijdzaamheid en van de vertroosting geeft u dat u eensgezind bent onder elkaar naar Christus Jezus,", "Richt 11:5-11": "Toen nu de kinderen van Ammon tegen Israël streden, gingen de oudsten van Gilead heen om Jeftha te halen uit het land van Tob. En zij zeiden tegen Jeftha: Kom, en word onze aanvoerder, zodat wij kunnen strijden tegen de kinderen van Ammon. Maar Jeftha zei tegen de oudsten van Gilead: Hebt u mij niet gehaat, en mij uit het huis van mijn vader verstoten? Waarom bent u dan nu naar mij toegekomen, nu u in benauwdheid verkeert?", "Jer 17:11": "Zoals een veldhoen eieren verzamelt, maar ze niet uitbroedt, zo is hij die rijkdom verzamelt, maar niet met recht; in de helft van zijn dagen zal hij die moeten verlaten, en in zijn laatste dagen een dwaas zijn.", "Hebr 13:4": "Het huwelijk is eerbaar onder allen, en het huwelijksbed onbevlekt; maar hoereerders en overspelers zal God oordelen.", "Jes 3:10": "Zegt de rechtvaardige, dat het hem goed zal gaan; dat zij de vrucht van hun werken zullen eten.", "2 Tim 4:2": "Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs.", "Zach 7:9": "Zo sprak de HEERE van de heerscharen: Doe een waarachtig recht, en bewijs goedertierenheid en barmhartigheid, de een aan de ander;", "Gal 5:14": "Want de hele wet wordt in één woord vervuld, namelijk in dit: U zult uw naaste liefhebben als uzelf.", "Mark 7:21": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden,", "Deut 22:17-21": "En zie, hij heeft oorzaak gegeven tot opspraak, en gezegd: Ik heb de maagdelijkheid van uw dochter niet gevonden; maar dit is het bewijs van de maagdelijkheid van mijn dochter. En zij zullen het kleed voor de ogen van de oudsten van de stad uitspreiden. Dan zullen de oudsten van die stad die man meenemen en hem straffen; En zij zullen hem een boete opleggen van honderd zilverlingen, en die geven aan de vader van de jonge dochter, omdat hij een kwade naam heeft verspreid over een jonge dochter van Israël; verder zal zij hem tot vrouw blijven, hij zal haar al zijn dagen niet mogen wegsturen.", "Rom 11:6": "En als het door genade is, dan is het niet meer uit de werken; anders is de genade geen genade meer; en als het is uit de werken, dan is het geen genade meer; anders is het werk geen werk meer.", "Deut 6:18": "En u zult doen, wat recht en goed is in de ogen van de HEERE; opdat het u goed gaat, en dat u erin komt, en het goede land erft, dat de HEERE aan uw vaderen gezworen heeft;", "Spr 10:18": "Wie haat bedekt, heeft valse lippen, en wie een kwaad gerucht verspreidt, is een dwaas.", "Matt 19:8": "Hij zei tegen hen: Mozes heeft vanwege de hardheid van uw harten u toegestaan uw vrouwen te verlaten; maar van het begin af is het zo niet geweest.", "Rom 14:1": "Neem hem aan die zwak is in het geloof, maar niet tot twistige samensprekingen.", "Ex 20:13": "U zult niet doodslaan.", "Richt 20:6": "Toen greep ik mijn bijvrouw, en deelde haar in stukken, en zond haar in het hele land van de erfenis van Israël, omdat zij een schandelijke daad en dwaasheid in Israël gedaan hadden.", "2 Kor 6:14": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis?", "Kol 3:14": "En doe boven dit alles de liefde aan, die de band van de volmaaktheid is.", "Gen 38:24": "En het gebeurde ongeveer drie maanden later, dat men Juda liet weten: Thamar, uw schoondochter, heeft ontucht bedreven, en zie, zij is zelfs zwanger van die ontucht. Toen zei Juda: Breng haar naar buiten, laat zij verbrand worden!", "Lev 24:16": "En wie de Naam van de HEERE lastert, zal zeker gedood worden; de hele gemeenschap zal hem zeker stenigen; zo zal het gaan met de vreemdeling als met de geboren Israëliet: als hij de NAAM lastert, zal hij gedood worden.", "Jak 2:11": "Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.", "Ex 21:28-34": "En wanneer een os een man of een vrouw stoot, zodat hij sterft, zal de os zeker gestenigd worden, en zijn vlees zal niet gegeten worden; maar de eigenaar van de os zal onschuldig zijn. Maar als de os al eerder stotig was, en zijn eigenaar daarvan gewaarschuwd is, en hij hem niet bewaakt heeft, en hij doodt een man of een vrouw, zal die os gestenigd worden, en zijn eigenaar zal ook gedood worden. Als hem losgeld opgelegd wordt, zal hij tot vrijkoop van zijn leven geven naar alles wat hem opgelegd wordt;", "Mark 10:7": "Daarom zal een man zijn vader en zijn moeder verlaten, en zich aan zijn vrouw hechten;", "Lev 19:19": "U zult Mijn inzettingen houden; u zult uw vee niet van twee verschillende soorten met elkaar laten paren; uw akker zult u niet met tweeërlei zaad bezaaien, en een kleed van twee soorten stof, dooreen vermengd, zal u niet aandoen.", "Ex 22:6": "Wanneer een vuur uitbreekt en doornen vat, zodat de korenschoven verteerd worden, of het staande koren, of het veld, dan moet hij die de brand heeft aangestoken, het volledig teruggeven.", "Spr 20:30": "Gezwellen van de wond zijn een zuivering in de boze, alsook de slagen van het binnenste van de buik.", "Hand 22:29": "Meteen dan trokken zij zich terug, zij die hem zouden ondervragen. En ook de leider werd bevreesd, toen hij begreep dat hij een Romein was, en dat hij hem had laten binden.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "2 Kor 12:20": "Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn;", "Joz 8:33": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen.", "Gen 8:17": "Al het gedierte dat met u is, van alle vlees, aan gevogelte, en aan vee, en aan al het kruipend gedierte dat op de aarde kruipt, laat met u uitgaan; en dat zij overvloedig voorttelen op de aarde, en vruchtbaar zijn, en zich vermenigvuldigen op de aarde.", "Ezech 16:38": "Daarbij zal Ik u berechten naar de rechten van overspeelsters en bloedvergietsters; en Ik zal u overgeven aan het bloed van de grimmigheid en van het ijver.", "Hand 22:24": "beval de leider hen hem naar de legerplaats te brengen, en zei dat men hem met geselen zou ondervragen, opdat hij te weten kon komen om welke reden zij zo tegen hem riepen.", "2 Kor 12:15": "En ik zal zeer graag de kosten dragen, en voor uw zielen ten koste gegeven worden; hoewel ik, terwijl ik u overvloediger liefheb, minder bemind word.", "Hebr 11:26": "en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.", "1 Joh 3:17": "Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem?", "Rom 15:1": "Maar wij, die sterk zijn, zijn schuldig de zwakheden van de onsterken te dragen, en niet onszelf te behagen.", "Deut 21:22": "Verder, wanneer iemand een zonde heeft begaan die de doodstraf verdient, zodat hij gedood wordt, en u hem aan het hout hebt opgehangen;", "1 Kor 10:8": "En laten wij niet hoereren, zoals sommigen van hen gehoereerd hebben, en er vielen op één dag drieëntwintigduizend.", "Ex 21:28-36": "En wanneer een os een man of een vrouw stoot, zodat hij sterft, zal de os zeker gestenigd worden, en zijn vlees zal niet gegeten worden; maar de eigenaar van de os zal onschuldig zijn. Maar als de os al eerder stotig was, en zijn eigenaar daarvan gewaarschuwd is, en hij hem niet bewaakt heeft, en hij doodt een man of een vrouw, zal die os gestenigd worden, en zijn eigenaar zal ook gedood worden. Als hem losgeld opgelegd wordt, zal hij tot vrijkoop van zijn leven geven naar alles wat hem opgelegd wordt;", "Luk 18:20": "U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Ps 15:1-3": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid? Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "Ps 50:20": "U zit, u spreekt tegen uw broeder; tegen de zoon van uw moeder uit u lastering.", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Openb 22:12": "En zie, Ik kom haastig, en Mijn loon is met Mij, om ieder te vergelden zoals zijn werk zal zijn.", "Ex 20:16": "U zult geen valse getuigenis spreken tegen uw naaste.", "Deut 23:25": "Wanneer u in het staande koren van uw naaste komt, dan mag u de aren met uw hand afplukken; maar de sikkel zult u niet gebruiken over het staande koren van uw naaste.", "Matt 10:32": "Ieder dan die Mij belijden zal voor de mensen, die zal Ik ook belijden voor Mijn Vader, Die in de hemelen is.", "1 Tim 5:2": "De oudere vrouwen als moeders; de jongeren als zusters, in alle reinheid.", "1 Kor 11:3": "Maar ik wil dat u weet, dat Christus het Hoofd is van iedere man, en de man het hoofd van de vrouw, en God het Hoofd van Christus.", "Ex 20:12": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.", "Kol 3:18": "Vrouwen, wees uw eigen mannen onderdanig, zoals het betaamt in de Heere.", "Matt 9:16": "Ook zet niemand een lap ongeweven laken op een oud kleed; want de aangezette lap scheurt af van het kleed, en er ontstaat een ergere scheur.", "Deut 11:18-21": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen; En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat; En schrijf ze op de posten van uw huis, en aan uw poorten;", "Lev 19:23-25": "Als u ook in dat land gekomen zult zijn, en alle geboomte tot voedsel geplant zult hebben, dan zult u de voorhuid daarvan, de vrucht ervan, wegsnijden; drie jaren zal het u onbesneden zijn, daarvan zal niet gegeten worden. Maar in het vierde jaar zal al zijn vrucht een heilig ding zijn, tot lofzegging voor de HEERE. En in het vijfde jaar zult u de vrucht ervan eten, om de opbrengst daarvan voor u te vermeerderen; Ik ben de HEERE, uw God!", "Luk 15:4-6": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "Ezech 16:40": "Daarna zullen zij een menigte tegen u laten opkomen, en zij zullen u met stenen stenigen, en u met hun zwaarden doorsteken.", "Spr 1:15": "Mijn zoon! wandel niet met hen op de weg; weer uw voet van hun pad.", "Deut 17:2-13": "Wanneer in uw midden, in een van uw poorten die de HEERE, uw God, u geeft, een man of vrouw gevonden wordt die doet wat kwaad is in de ogen van de HEERE, uw God, door Zijn verbond te overtreden, Doordat hij heengaat en andere goden dient, en zich voor die buigt, of voor de zon, of voor de maan, of voor het hele leger van de hemel, wat ik niet geboden heb; En het wordt u aangezegd, en u hoort het; dan moet u het goed onderzoeken; en zie, het is de waarheid, de zaak staat vast, zo'n gruwel is in Israël gedaan;", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "Richt 20:10": "En wij zullen tien mannen nemen van honderd, van alle stammen van Israël, en honderd van duizend, en duizend van tienduizend, om proviand te nemen voor het volk, zodat zij, wanneer zij komen te Gibea-van-Benjamin, met haar doen naar al de dwaasheid die zij in Israël gedaan heeft.", "Spr 28:17": "Een mens, gedrukt door het bloed van iemand, zal naar de kuil toevluchten; men houde hem niet tegen!", "Deut 5:17": "U zult niet doodslaan.", "Jes 59:3": "Want uw handen zijn met bloed bevlekt, en uw vingers met ongerechtigheid; uw lippen spreken valsheid, uw tong spreekt onrecht uit.", "Ruth 4:1": "Boaz ging naar de poort en zette zich daar neer. En zie, de losser, van wie Boaz gesproken had, kwam voorbij. Toen zei hij: Kom eens hier, zet u hier neer, u daar! En hij kwam erbij en zette zich neer.", "Luk 12:8": "En Ik zeg u: ieder die Mij belijden zal voor de mensen, die zal ook de Zoon des mensen belijden voor de engelen van God.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Spr 22:22": "Beroof de arme niet, omdat hij arm is; en verbrijzel de ellendige niet in de poort.", "2 Kron 24:22": "Zo dacht de koning Joas niet aan de weldadigheid die zijn vader Jojada aan hem gedaan had, maar doodde zijn zoon; en toen deze stierf, zei hij: De HEERE zal het zien en het vergelden!", "Ezech 3:20": "Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Deut 27:22": "Vervloekt is hij die bij zijn zuster ligt, de dochter van zijn vader of de dochter van zijn moeder! En heel het volk zal zeggen: Amen.", "Hos 10:14": "Daarom zal er een groot rumoer ontstaan onder uw volken, en al uw vestingen zullen verwoest worden, zoals Salman Beth-arbel verwoestte op de dag van de strijd; de moeder werd verpletterd met de zonen.", "Jer 29:23": "Omdat zij een dwaasheid deden in Israël, en overspel bedreven met de vrouwen van hun naasten, en het woord leugenachtig spraken in Mijn Naam, wat Ik hun niet geboden had; en Ik ben Degene Die het weet, en een getuige daarvan, spreekt de HEERE.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Lev 18:8": "U zult de schaamte van de vrouw van uw vader niet ontdekken; het is de schaamte van uw vader.", "Matt 19:18": "Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Mal 2:14-16": "U zegt nu: Waarom? Omdat de HEERE een Getuige geweest is tussen u en de vrouw van uw jeugd, met wie u trouweloos handelt; terwijl zij toch uw metgezellin is, en de vrouw van uw verbond. Heeft Hij niet maar één gemaakt, hoewel Hij van de Geest overvloed had? En waarom die ene? Hij zocht een zaad van God. Daarom, wees op uw hoede met uw geest, en laat niemand trouweloos handelen tegen de vrouw van zijn jeugd. Want de HEERE, de God van Israël, zegt dat Hij het wegzenden haat, hoewel hij het geweld bedekt met zijn kleed, zegt de HEERE van de heerscharen; daarom wees op uw hoede met uw geest, dat u niet trouweloos handelt.", "Hebr 10:36": "Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Zach 7:10": "en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "1 Tess 4:6": "Dat niemand zijn broeder tekortdoet, of hem bedriegt in zijn zaken; want de Heere is een wreker over dit alles, zoals wij u ook van tevoren gezegd en betuigd hebben.", "Spr 3:29": "Smeed geen kwaad tegen uw naaste, aangezien hij met vertrouwen bij u woont.", "Spr 6:16": "Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel:", "Openb 9:21": "En hebben zich ook niet bekeerd van hun doodslagen, noch van hun toverijen, noch van hun hoererij, noch van hun dieverijen.", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Joh 20:23": "Als u iemands zonden vergeeft, worden ze hem vergeven; als u ze houdt, blijven ze gehouden.", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "Openb 18:10": "Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen.", "Deut 27:20": "Vervloekt is hij die bij de vrouw van zijn vader ligt, omdat hij de slipt van zijn vader ontdekt heeft! En heel het volk zal zeggen: Amen.", "Pred 9:9": "Geniet het leven met de vrouw die u liefhebt, al de dagen van uw vergankelijke leven, dat God u gegeven heeft onder de zon, al uw vergankelijke dagen; want dit is uw deel in dit leven en van uw arbeid, die u verricht onder de zon.", "Spr 20:10": "Tweeërlei weegsteen, tweeërlei efa is de HEERE een gruwel, ja, die beide.", "Matt 15:24": "Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Spr 17:10": "De bestraffing gaat dieper in de verstandige, dan de dwaas honderdmaal te slaan.", "Matt 15:19": "Want uit het hart komen voort boze overwegingen, doodslagen, overspelen, hoererijen, dieverijen, valse getuigenissen, lasteringen.", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "Jak 2:8": "Als u dan de koninklijke wet vervult, naar de Schrift: U zult uw naaste liefhebben als uzelf, dan doet u goed;", "Spr 25:23": "De noordenwind verdrijft de regen, en een vertoornd aangezicht de verborgen tong.", "Lev 19:16-18": "U zult niet rondgaan als een kwaadspreker onder uw volken; u zult niet opstaan tegen het bloed van uw naaste; Ik ben de HEERE! U zult uw broeder in uw hart niet haten; u zult uw naaste zeker berispen, en zult de zonde in hem niet laten voortbestaan. U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "Spr 14:21": "Wie zijn naaste veracht, zondigt; maar wie zich over de nederigen ontfermt, die is gelukkig.", "Luk 6:34": "En als u leent aan hen van wie u hoopt terug te ontvangen, wat voor dank hebt u dan? Want ook de zondaars lenen aan zondaars, om net zoveel terug te ontvangen.", "Num 15:38": "Spreek tot de kinderen van Israël en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken van hun kleren, bij hun geslachten; en op het snoertje van de hoek zullen zij een hemelsblauwe draad zetten.", "Deut 22:1-3": "U zult de os of het kleinvee van uw broeder niet zien afdwalen en u daarvoor verbergen; u zult ze zeker naar uw broeder terugbrengen. En als uw broeder niet dicht bij u woont, of u hem niet kent, zo zult u ze binnen in uw huis verzamelen, dat ze bij u blijven totdat uw broeder ze zoekt, en u ze hem teruggeeft. Zo zult u ook doen met zijn ezel, en zo zult u doen met zijn kleding, ja, zo zult u doen met alles wat uw broeder verloren heeft en wat u gevonden hebt; u mag u niet verbergen.", "2 Kor 13:1": "Dit is de derde keer dat ik naar u toe kom; op grond van de verklaring van twee of drie getuigen zal elk woord vaststaan.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "1 Tim 5:8": "Maar als iemand voor de zijnen, en vooral voor zijn huisgenoten, niet zorgt, die heeft het geloof verloochend, en is erger dan een ongelovige.", "2 Tess 3:14": "Maar als iemand ons woord, geschreven door deze brief, niet gehoorzaam is, tekent hem aan; en ga niet met hem om, opdat hij beschaamd wordt;", "Gal 6:10": "Zo dan, terwijl we tijd hebben, laten we goeddoen aan allen, maar vooral aan de huisgenoten van het geloof.", "2 Kor 7:8": "Want hoewel ik u in de brief bedroefd heb, heb ik daar geen berouw over, hoewel ik er wel berouw over heb gehad; want ik zie dat die brief, al was het maar voor een korte tijd, u bedroefd heeft.", "Ex 21:18": "En wanneer mannen ruzie hebben, en de een slaat de ander met een steen of met een vuist, en hij sterft niet, maar moet het bed houden;", "1 Kor 10:32": "Wees zonder aanstoot te geven, zowel voor de Joden als voor de Grieken als voor de gemeente van God.", "Ex 21:29-32": "Maar als de os al eerder stotig was, en zijn eigenaar daarvan gewaarschuwd is, en hij hem niet bewaakt heeft, en hij doodt een man of een vrouw, zal die os gestenigd worden, en zijn eigenaar zal ook gedood worden. Als hem losgeld opgelegd wordt, zal hij tot vrijkoop van zijn leven geven naar alles wat hem opgelegd wordt; of hij nu een zoon gestoten heeft, of een dochter gestoten heeft, naar dit recht zal hem gedaan worden.", "Matt 18:7": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt!", "Spr 3:28": "Zeg niet tegen uw naaste: Ga heen, en kom terug, en morgen zal ik geven, terwijl u het bij u hebt.", "Gen 34:7": "En de zonen van Jakob kwamen van het veld toen zij dit hoorden; en het deed deze mannen verdriet, en zij ontstaken in grote woede, omdat hij dwaasheid in Israël gedaan had door bij Jakobs dochter te liggen, wat zo niet gedaan had mogen worden.", "Spr 3:32": "Want de afwijker is de HEERE een gruwel; maar Zijn verborgenheid is met de oprechte.", "Rom 13:10": "De liefde doet de naaste geen kwaad. Dus is de liefde de vervulling van de wet.", "2 Sam 13:14": "Doch hij wilde niet naar haar luisteren; maar omdat hij sterker was dan zij, verkrachtte hij haar, en lag bij haar.", "Deut 21:1-9": "Wanneer in het land, dat de HEERE, uw God, u geven zal om dat te erven, iemand gevonden wordt die gedood is, liggend in het veld, zonder dat bekend is wie hem gedood heeft; Dan zullen uw oudsten en uw rechters uitgaan, en zij zullen meten naar de steden die rondom de gedode liggen. De stad nu die het dichtst bij de gedode ligt, daar zullen de oudsten van die stad een jonge koe nemen waarmee niet gewerkt is, die aan het juk niet getrokken heeft.", "Deut 19:12": "dan zullen de oudsten van zijn stad iemand sturen, en hem vandaar laten halen, en zij zullen hem overgeven in de hand van de bloedwreker, zodat hij sterft.", "Spr 8:7": "Want Mijn gehemelte zal de waarheid bedacht uitspreken, en de goddeloosheid is Mijn lippen een gruwel.", "Ezech 34:4": "De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.", "Gen 24:53": "En de knecht haalde zilveren sieraden, en gouden sieraden, en kleren tevoorschijn, en hij gaf die aan Rebekka; hij gaf ook aan haar broer en haar moeder kostbare geschenken.", "1 Kor 13:4-7": "De liefde is geduldig, zij is vriendelijk; de liefde is niet afgunstig; de liefde handelt niet lichtvaardig, zij is niet opgeblazen; Zij handelt niet ongeschikt, zij zoekt zichzelf niet, zij wordt niet verbitterd, zij denkt geen kwaad; Zij verblijdt zich niet in de ongerechtigheid, maar zij verblijdt zich in de waarheid;", "Matt 5:22": "Maar Ik zeg u: ieder die zonder reden toornig is op zijn broeder, die zal strafbaar zijn voor het gericht; en wie tegen zijn broeder zegt: Raka! die zal strafbaar zijn voor de grote raad; maar wie zegt: Dwaas! die zal strafbaar zijn voor het helse vuur.", "Num 15:33-36": "En zij die hem hout zagen lezen, brachten hem tot Mozes en tot Aäron en tot de hele vergadering. En zij stelden hem in bewaring; want het was niet duidelijk gemaakt wat hem gedaan moest worden. Toen zei de HEERE tot Mozes: Die man zal zeker gedood worden; de hele vergadering zal hem met stenen stenigen buiten het leger.", "Hand 20:26": "Daarom verklaar ik u op deze huidige dag, dat ik rein ben van het bloed van u allen.", "Spr 6:17": "hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten;", "Rom 12:15": "Verblijd u met de blijden, en ween met de wenende.", "2 Kor 10:1-11": "Verder, ik Paulus zelf bid u, door de zachtmoedigheid en goedertierenheid van Christus, die – tegenwoordig zijnde – wel gering ben onder u, maar afwezig stout ben tegen u; Ik bid dan, dat ik, tegenwoordig zijnde, niet stout hoef te zijn met die vrijmoedigheid, waarmee ik denk stout te moeten optreden tegen sommigen, die ons zo beoordelen alsof wij naar het vlees wandelden. Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Num 9:13": "Als een man, die rein is, en niet op reis is, en nalaat het pascha te houden, dan zal die ziel uit haar volk uitgeroeid worden; want hij heeft de offerande van de HEERE op zijn vastgestelde tijd niet geofferd, die man zal zijn zonde dragen.", "Ezra 10:8": "En ieder die niet binnen drie dagen kwam, naar de raad van de vorsten en de oudsten, al zijn bezit zou verbeurd worden; en hijzelf zou afgezonderd worden van de gemeente van de weggevoerden.", "Spr 12:10": "De rechtvaardige kent het leven van zijn dier; maar de barmhartigheden van de goddelozen zijn wreed.", "Spr 27:23-27": "Wees ijverig om het gezicht van uw schapen te kennen; richt uw hart op de kudden. Want de schat is niet voor eeuwig; of zal de kroon van geslacht tot geslacht zijn? Als het gras zich vertoont, en de grasscheuten gezien worden, laat de kruiden van de bergen verzameld worden.", "Ezech 23:47": "En de menigte zal hen met stenen stenigen, en hen met hun zwaarden neerhouwen; hun zonen en hun dochters zullen zij doden, en hun huizen met vuur verbranden.", "Spr 28:9": "Wie zijn oor afwendt van het horen van de wet, diens gebed zelfs zal een gruwel zijn.", "1 Kor 5:4-7": "In de Naam van onze Heere Jezus Christus, wanneer u en mijn geest samen vergaderd zijn, met de kracht van onze Heere Jezus Christus, Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus. Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "2 Tess 3:15": "En houd hem niet als een vijand, maar vermaan hem als een broeder.", "Rom 2:10": "Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.", "Joh 8:4": "En zij zetten haar in het midden, en zeiden tegen Hem: Meester, deze vrouw is op heterdaad betrapt, terwijl zij overspel pleegde.", "2 Kor 13:10": "Daarom schrijf ik deze dingen, terwijl ik afwezig ben, opdat ik niet, wanneer ik aanwezig ben, strengheid zou hoeven te gebruiken, naar de macht die de Heere mij gegeven heeft tot opbouw, en niet tot afbraak.", "Num 35:16-22": "Maar als hij hem met een ijzeren voorwerp geslagen heeft, zodat hij sterft, is hij een doodslager; deze doodslager zal zeker gedood worden. Of als hij hem met een handsteen, waardoor men zou kunnen sterven, geslagen heeft, zodat hij sterft, is hij een doodslager; deze doodslager zal zeker gedood worden. Of als hij hem met een houten handwapen, waardoor men zou kunnen sterven, geslagen heeft, zodat hij sterft, is hij een doodslager; deze doodslager zal zeker gedood worden.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Jer 7:9": "Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent,", "1 Sam 16:4": "Samuël deed toen wat de HEERE gesproken had, en hij kwam in Bethlehem. Toen kwamen de oudsten van de stad hem bevend tegemoet, en zeiden: Komt u met vrede?", "Ex 23:4": "Wanneer u de os van uw vijand, of zijn dwalende ezel, tegenkomt, zult u hem zeker naar hem terugbrengen.", "Deut 25:2": "En het zal gebeuren, als de onrechtvaardige slagen verdiend heeft, dat de rechter hem zal laten neervallen, en hem in zijn tegenwoordigheid laten slaan, naar het aantal dat past bij zijn onrechtvaardigheid.", "1 Joh 3:12": "Niet zoals Kaïn, die uit de boze was en zijn broeder doodsloeg; en waarom sloeg hij hem dood? Omdat zijn werken slecht waren, en die van zijn broeder rechtvaardig.", "Ex 12:15": "Zeven dagen moet u ongezuurde broden eten; maar op de eerste dag moet u het zuurdeeg wegdoen uit uw huizen; want wie het gedesemde eet, van de eerste dag af tot de zevende dag, die ziel zal uitgeroeid worden uit Israël.", "Num 15:39": "En het zal voor u aan de snoertjes zijn, opdat u het aanziet en aan al de geboden van de HEERE denkt en die doet; en dat u niet afdwaalt naar uw eigen hart en naar uw eigen ogen, waar u achteraan hoereert;", "Ex 19:13": "Geen hand zal hem aanraken, maar hij zal zeker gestenigd worden, of zeker doorschoten worden; hetzij een dier, hetzij een man, hij zal niet blijven leven. Als de ramshoorn langzaam klinkt, zullen zij de berg beklimmen.", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "1 Kor 7:33": "maar wie getrouwd is, bekommert zich met de dingen van de wereld, hoe hij de vrouw zal behagen.", "Matt 20:1-16": "Want het Koninkrijk der hemelen is gelijk aan een heer des huizes, die 's morgens vroeg uitging om arbeiders te huren voor zijn wijngaard. En toen hij met de arbeiders overeengekomen was voor een penning per dag, stuurde hij hen naar zijn wijngaard. En hij ging uit, omtrent het derde uur, en zag anderen werkloos staan op de markt.", "Deut 27:20-23": "Vervloekt is hij die bij de vrouw van zijn vader ligt, omdat hij de slipt van zijn vader ontdekt heeft! En heel het volk zal zeggen: Amen. Vervloekt is hij die bij enig beest ligt! En heel het volk zal zeggen: Amen. Vervloekt is hij die bij zijn zuster ligt, de dochter van zijn vader of de dochter van zijn moeder! En heel het volk zal zeggen: Amen.", "Ezech 35:6": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE; Ik zal u voorzeker tot bloed bestemmen, en het bloed zal u achtervolgen; omdat u het bloed niet hebt gehaat, zal het bloed u ook achtervolgen.", "Lev 25:18": "En doe Mijn inzettingen, en houd Mijn rechten, en doe die; dan zult u zeker wonen in het land.", "Deut 25:7": "Maar als die man geen zin heeft om de vrouw van zijn broer te nemen, dan zal de vrouw van zijn broer naar de poort gaan, naar de oudsten, en zeggen: Mijn zwager weigert voor zijn broer een naam te doen voortbestaan in Israël; hij wil de plicht van een zwager niet aan mij vervullen.", "Luk 6:35": "Maar heb uw vijanden lief, en doe goed, en leen, zonder iets terug te hopen; en uw loon zal groot zijn, en u zult kinderen van de Allerhoogste zijn; want Hij is goedertieren over de ondankbaren en de bozen.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "1 Kon 21:10": "En zet tegenover hem twee mannen, zonen van Belial, die tegen hem getuigen en zeggen: U hebt God en de koning gevloekt; en voer hem naar buiten, en stenig hem, dat hij sterft.", "1 Petr 3:9-12": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven. Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "1 Tim 5:19": "Neem tegen een ouderling geen beschuldiging aan, dan alleen op grond van twee of drie getuigen.", "Luk 10:25-37": "En zie, een wetgeleerde stond op, om Hem op de proef te stellen, en zei: Meester, wat moet ik doen om het eeuwige leven te beërven? En Hij zei tegen hem: Wat staat er in de wet geschreven? Hoe leest u het? En hij antwoordde: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw kracht, en met heel uw verstand; en uw naaste als uzelf.", "Ps 101:5": "Wie zijn naaste in het heimelijke belastert, die zal ik verdelgen; die hoogmoedig van ogen is, en trots van hart, die zal ik niet verdragen.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Jer 22:3": "Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.", "Mark 13:13": "En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.", "Ps 112:5": "Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht.", "Joh 9:35": "Jezus hoorde dat zij hem eruit geworpen hadden, en toen Hij hem vond, zei Hij tegen hem: Gelooft u in de Zoon van God?", "Ex 21:22": "Wanneer nu mannen vechten en een zwangere vrouw slaan, zodat haar vrucht afgaat, maar er geen dodelijk letsel is, dan zal hij zeker gestraft worden, zoals de man van de vrouw hem oplegt, en hij zal het geven zoals de rechters bepalen.", "Ezra 10:1-44": "Terwijl Ezra zo bad en deze belijdenis deed, huilend en zich voor het huis van God neerwerpend, verzamelde zich bij hem uit Israël een zeer grote gemeente van mannen, vrouwen en kinderen; want het volk huilde met groot geween. Toen antwoordde Sechanja, de zoon van Jehiel, een van de zonen van Elam, en zei tegen Ezra: Wij hebben overtreden tegen onze God, en wij hebben vreemde vrouwen van de volken van het land bij ons laten wonen; maar nu is er hoop voor Israël wat dit betreft. Laten wij dan nu een verbond maken met onze God, dat wij al die vrouwen, en wat van hen geboren is, zullen wegsturen, naar de raad van de Heere, en van hen die beven voor het gebod van onze God; en laat er gedaan worden naar de wet.", "Joh 9:22": "Dit zeiden zijn ouders, omdat zij de Joden vreesden; want de Joden hadden al met elkaar afgesproken dat als iemand beleed dat Hij de Christus was, die uit de synagoge geworpen zou worden.", "Deut 11:13-16": "En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel; Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt. En Ik zal gras geven op uw veld voor uw dieren; en u zult eten en verzadigd worden.", "Tit 1:13": "Deze getuigenis is waar. Daarom, bestraf hen scherp, opdat zij gezond mogen zijn in het geloof.", "Matt 7:12": "Alles dan wat u wilt dat de mensen u doen, doet u hun ook zo; want dat is de wet en de profeten.", "Deut 27:12-26": "Dezen zullen staan om het volk te zegenen op de berg Gerizim, wanneer u over de Jordaan gegaan bent: Simeon, en Levi, en Juda, en Issaschar, en Jozef, en Benjamin. En dezen zullen staan voor de vervloeking op de berg Ebal: Ruben, Gad en Aser, Zebulon, Dan en Naftali. En de Levieten zullen zich uitspreken en zeggen tegen alle mannen van Israël, met verheven stem:", "Lev 19:10": "Evenzo zult u uw wijngaard niet nalezen, en de afgevallen bessen van uw wijngaard niet opzamelen; de arme en de vreemdeling zult u die overlaten; Ik ben de HEERE, uw God!", "Deut 19:19": "dan zult u hem doen zoals hij van plan was zijn broeder te doen; zo zult u het kwaad uit uw midden wegdoen;", "Spr 1:12": "Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;", "Hand 20:35": "Ik heb u in alles getoond, dat men, zo arbeidend, de zwakken moet opnemen, en zich de woorden van de Heere Jezus herinneren, dat Hij gezegd heeft: Het is zaliger te geven dan te ontvangen.", "Matt 16:19": "En Ik zal u de sleutels geven van het Koninkrijk der hemelen; en alles wat u zult binden op de aarde, zal in de hemelen gebonden zijn; en alles wat u zult ontbinden op de aarde, zal in de hemelen ontbonden zijn.", "Gal 6:1": "Broeders, als een mens door een misdaad vervallen is, moet u, die geestelijk bent, hem die zo is terechtbrengen met een geest van zachtmoedigheid; en let daarbij op uzelf, zodat ook u niet in verzoeking komt.", "Hebr 13:3": "Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "1 Kor 13:7": "Zij bedekt alle dingen, zij gelooft alle dingen, zij hoopt alle dingen, zij verdraagt alle dingen.", "Matt 19:19": "Eer uw vader en moeder; en: U zult uw naaste liefhebben als uzelf.", "Spr 12:6": "De woorden van de goddelozen zijn om op bloed te loeren; maar de mond van de oprechten zal ze redden.", "Ex 30:37": "Maar het reukwerk dat u volgens dit recept gemaakt hebt, mag u voor uzelf niet namaken; het zal u heilig zijn, voor de HEERE.", "Deut 24:19": "Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen.", "Deut 22:1-4": "U zult de os of het kleinvee van uw broeder niet zien afdwalen en u daarvoor verbergen; u zult ze zeker naar uw broeder terugbrengen. En als uw broeder niet dicht bij u woont, of u hem niet kent, zo zult u ze binnen in uw huis verzamelen, dat ze bij u blijven totdat uw broeder ze zoekt, en u ze hem teruggeeft. Zo zult u ook doen met zijn ezel, en zo zult u doen met zijn kleding, ja, zo zult u doen met alles wat uw broeder verloren heeft en wat u gevonden hebt; u mag u niet verbergen.", "Lev 25:19": "En het land zal zijn vrucht geven, en u zult eten tot verzadiging toe; en u zult zeker daarin wonen.", "Num 14:10": "Toen zei de hele vergadering dat men hen met stenen zou stenigen. Maar de heerlijkheid van de HEERE verscheen in de tent van de samenkomst, voor al de kinderen van Israël.", "Luk 23:16": "Ik zal Hem dan kastijden en loslaten.", "Deut 22:13-21": "Wanneer een man een vrouw genomen heeft, en tot haar ingegaan is, en haar dan haat, En haar oorzaak geeft tot naspraak, en een kwade naam over haar verspreidt, en zegt: Deze vrouw heb ik genomen, en toen ik tot haar naderde, heb ik haar maagdelijkheid niet gevonden; Dan zullen de vader van deze jonge dochter en haar moeder haar meenemen, en naar de oudsten van de stad brengen, bij de poort, met het bewijs van de maagdelijkheid van deze jonge vrouw.", "Matt 10:27": "Wat Ik u zeg in het duister, zegt dat in het licht; en wat u hoort in het oor, predikt dat op de daken.", "Lev 22:28": "U zult ook een os, of klein vee, hem en zijn jong, niet op één dag slachten.", "Lev 24:23": "En Mozes zei tegen de Israëlieten dat zij de vloeker naar buiten, tot buiten het kamp, zouden brengen, en hem met stenen zouden stenigen. En de Israëlieten deden zoals de HEERE Mozes geboden had.", "Jak 3:10": "Uit dezelfde mond komt voort zegening en vervloeking. Dit moet, mijn broeders, zo niet gebeuren.", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "2 Tess 3:6": "En wij bevelen u, broeders, in de Naam van onze Heere Jezus Christus, dat u zich onttrekt van iedere broeder die ongeregeld wandelt, en niet naar de overlevering die hij van ons ontvangen heeft.", "Deut 21:19": "Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats.", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Num 5:11-31": "Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tot hen: Wanneer de vrouw van iemand afgeweken zal zijn, en door overtreding tegen hem overtreden zal hebben, Doordat een man gemeenschap met haar gehad heeft, en het voor de ogen van haar man verborgen zal zijn, en zij zich verheeld zal hebben, terwijl zij toch onrein geworden is; en er geen getuige tegen haar is, en zij niet op heterdaad betrapt is;", "Matt 1:19": "Jozef nu, haar man, wilde haar, omdat hij rechtvaardig was en haar niet in het openbaar te schande wilde maken, in stilte verlaten.", "Ps 26:9": "Raap mijn ziel niet weg met de zondaars, en mijn leven niet met de mannen van het bloed;", "Spr 15:26": "De gedachten van de boze zijn de HEERE een gruwel; maar de woorden van de reinen zijn lieflijke woorden.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Num 15:36": "Toen bracht de hele vergadering hem naar buiten, buiten het leger, en zij stenigden hem met stenen, zodat hij stierf, zoals de HEERE Mozes geboden had.", "Matt 18:13": "En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Luk 10:31": "En bij toeval kwam er een priester langs diezelfde weg; en toen hij hem zag, liep hij aan de overkant voorbij.", "Spr 31:26": "Pe. Zij doet haar mond open met wijsheid; en op haar tong is onderwijs van goedheid.", "1 Kor 5:1-13": "Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft. En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden? Want ik, hoewel met het lichaam afwezig, maar aanwezig met de geest, heb al besloten, alsof ik aanwezig was, over hem die dit zo gedaan heeft:", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "2 Kor 6:15": "En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige?", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "1 Petr 3:9": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "Ezech 22:9": "Achterklappers zijn in u geweest om bloed te vergieten, en in u hebben zij op de bergen gegeten, zij hebben schandelijkheid in uw midden gedaan.", "Ef 5:22-33": "Vrouwen, wees uw eigen mannen onderdanig, zoals aan de Heere; want de man is het hoofd van de vrouw, zoals ook Christus het Hoofd van de Gemeente is; en Hij is de Behouder van het lichaam. Daarom, zoals de Gemeente aan Christus onderdanig is, zo ook de vrouwen aan hun eigen mannen in alles.", "Ps 94:3": "Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?", "Deut 27:25": "Vervloekt is hij die geschenken aanneemt om een ziel, het bloed van een onschuldige, te doden! En heel het volk zal zeggen: Amen.", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Deut 13:12-18": "Wanneer u van een van uw steden, die de HEERE, uw God, u geeft om daar te wonen, zult horen zeggen: Er zijn mannen, kinderen van Belial, uit uw midden uitgegaan, en hebben de inwoners van hun stad aangedreven, en gezegd: Laat ons gaan, en andere goden dienen, die u niet gekend hebt; dan zult u onderzoeken, en naspeuren, en goed navragen; en zie, als het de waarheid is, de zaak zeker vaststaat, zo'n gruwel in uw midden gedaan is;", "Ps 107:37": "En bezaaien akkers, en planten wijngaarden, die vrucht opbrengen.", "Gen 29:21": "Toen zei Jakob tegen Laban: Geef mij mijn vrouw, want mijn dagen zijn vervuld, zodat ik bij haar kan komen.", "Kol 3:19": "Mannen, heb uw vrouwen lief, en word niet verbitterd tegen haar.", "Deut 24:19-21": "Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen. Wanneer u uw olijfboom geschud hebt, zult u de takken daarna niet nauwkeurig doorzoeken; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn. Wanneer u uw wijngaard hebt afgeplukt, zult u de druiven daarna niet nalezen; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn.", "Matt 12:1": "In die tijd ging Jezus, op een sabbatdag, door het gezaaide land, en Zijn discipelen kregen honger, en begonnen aren te plukken en te eten.", "Jak 1:6-8": "Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt. Want laat die mens niet menen dat hij iets ontvangen zal van de Heere. Een dubbelhartig man is onstandvastig in al zijn wegen.", "Deut 27:24": "Vervloekt is hij die zijn naaste in het verborgene doodslaat! En heel het volk zal zeggen: Amen.", "Spr 1:16": "Want hun voeten lopen tot het kwade; en zij haasten zich om bloed te storten."}, "noten": {"1": "Vers 30 (SV: \"en hij zal zijns vaders slippe niet ontdekken\"): D.i. hij mag geen seksuele gem l-kjv\" data-code=\"H1121\">young</span> to thee; that it may be <span class=\"wl wl-kjv\" data-code=\"H3190\">well</span> with thee, and that thou mayest <span class=\"wl wl-kjv\" data-code=\"H748\">prolong</span> thy days.", "8": "When thou <span class=\"wl wl-kjv\" data-code=\"H1129\">buildest</span> a <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> then thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H4624\">battlement</span> for thy <span class=\"wl wl-kjv\" data-code=\"H1406\">roof,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H7760\">bring</span> not <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> if any <span class=\"wl wl-kjv\" data-code=\"H5307\">man</span> fall", "9": "Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H2232\">sow</span> thy <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> with divers <span class=\"wl wl-kjv\" data-code=\"H3610\">seeds:</span> lest the <span class=\"wl wl-kjv\" data-code=\"H4395\">fruit</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H2232\">sown,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8393\">fruit</span> of thy <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard,</span> be defiled.", "10": "Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H2790\">plow</span> with an <span class=\"wl wl-kjv\" data-code=\"H7794\">ox</span> and an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass</span> together.", "11": "Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H3847\">wear</span> a garment of divers <span class=\"wl wl-kjv\" data-code=\"H8162\">sorts,</span> as of <span class=\"wl wl-kjv\" data-code=\"H6785\">woollen</span> and <span class=\"wl wl-kjv\" data-code=\"H6593\">linen</span> together.", "12": "Thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> thee <span class=\"wl wl-kjv\" data-code=\"H1434\">fringes</span> upon the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3671\">quarters</span> of thy <span class=\"wl wl-kjv\" data-code=\"H3682\">vesture,</span> wherewith thou coverest", "13": "If any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto her, and hate", "14": "And <span class=\"wl wl-kjv\" data-code=\"H7760\">give</span> <span class=\"wl wl-kjv\" data-code=\"H5949\">occasions</span> of <span class=\"wl wl-kjv\" data-code=\"H1697\">speech</span> against her, and bring <span class=\"wl wl-kjv\" data-code=\"H3318\">up</span> an <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> upon her, and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> this <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> and when I <span class=\"wl wl-kjv\" data-code=\"H7126\">came</span> to her, I <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> her not a maid:", "15": "Then shall the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel,</span> and her <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> and bring <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the tokens of the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel's</span> <span class=\"wl wl-kjv\" data-code=\"H1331\">virginity</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> in the gate:", "16": "And the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> shall <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders,</span> I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> my <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> unto this <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and he hateth", "17": "And, lo, he hath <span class=\"wl wl-kjv\" data-code=\"H7760\">given</span> <span class=\"wl wl-kjv\" data-code=\"H5949\">occasions</span> of <span class=\"wl wl-kjv\" data-code=\"H1697\">speech</span> against her, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> not thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> a <span class=\"wl wl-kjv\" data-code=\"H1331\">maid;</span> and yet these are the tokens of my <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter's</span> <span class=\"wl wl-kjv\" data-code=\"H1331\">virginity.</span> And they shall <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> the <span class=\"wl wl-kjv\" data-code=\"H8071\">cloth</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the city.", "18": "And the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of that <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> that <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> and chastise", "19": "And they shall <span class=\"wl wl-kjv\" data-code=\"H6064\">amerce</span> him in an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> shekels of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them unto the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel,</span> because he hath brought <span class=\"wl wl-kjv\" data-code=\"H3318\">up</span> an <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> upon a <span class=\"wl wl-kjv\" data-code=\"H1330\">virgin</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and she shall be his <span class=\"wl wl-kjv\" data-code=\"H802\">wife;</span> he <span class=\"wl wl-kjv\" data-code=\"H3201\">may</span> not put her <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> all his days.", "20": "But if this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> be <span class=\"wl wl-kjv\" data-code=\"H571\">true,</span> and the tokens of <span class=\"wl wl-kjv\" data-code=\"H1331\">virginity</span> be not <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> for the damsel:", "21": "Then they shall bring <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> to the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of her <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of her <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall <span class=\"wl wl-kjv\" data-code=\"H5619\">stone</span> her with <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> that she <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> because she hath <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> <span class=\"wl wl-kjv\" data-code=\"H5039\">folly</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to play the <span class=\"wl wl-kjv\" data-code=\"H2181\">whore</span> in her <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> so shalt thou <span class=\"wl wl-kjv\" data-code=\"H1197\">put</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> from among", "22": "If a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> be <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lying</span> with a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H1166\">married</span> to an <span class=\"wl wl-kjv\" data-code=\"H1167\">husband,</span> then they shall both of <span class=\"wl wl-kjv\" data-code=\"H8147\">them</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> both the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> and the <span class=\"wl wl-kjv\" data-code=\"H802\">woman:</span> so shalt thou put <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> from Israel.", "23": "If a <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> that is a <span class=\"wl wl-kjv\" data-code=\"H1330\">virgin</span> be <span class=\"wl wl-kjv\" data-code=\"H781\">betrothed</span> unto an <span class=\"wl wl-kjv\" data-code=\"H376\">husband,</span> and a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> her in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and lie", "24": "Then ye shall <span class=\"wl wl-kjv\" data-code=\"H3318\">bring</span> them <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> out unto the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of that <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H5619\">stone</span> them with <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> that they <span class=\"wl wl-kjv\" data-code=\"H4191\">die;</span> the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">because</span> she <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> not, being in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city;</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">because</span> he hath <span class=\"wl wl-kjv\" data-code=\"H6031\">humbled</span> his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife:</span> so thou shalt put <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> from among", "25": "But if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> a <span class=\"wl wl-kjv\" data-code=\"H781\">betrothed</span> <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">force</span> her, and <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with her: then the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> only that <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with her shall die:", "26": "But unto the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">nothing;</span> there is in the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> no <span class=\"wl wl-kjv\" data-code=\"H2399\">sin</span> worthy of <span class=\"wl wl-kjv\" data-code=\"H4194\">death:</span> for as when a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">riseth</span> against his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> and <span class=\"wl wl-kjv\" data-code=\"H7523\">slayeth</span> him, even so is this matter:", "27": "For he <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> her in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and the <span class=\"wl wl-kjv\" data-code=\"H781\">betrothed</span> <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> <span class=\"wl wl-kjv\" data-code=\"H6817\">cried,</span> and there was none to save", "28": "If a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> a <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> that is a <span class=\"wl wl-kjv\" data-code=\"H1330\">virgin,</span> which is not <span class=\"wl wl-kjv\" data-code=\"H781\">betrothed,</span> and lay <span class=\"wl wl-kjv\" data-code=\"H8610\">hold</span> on her, and <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with her, and they be found;", "29": "Then the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with her shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> shekels of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and she shall be his <span class=\"wl wl-kjv\" data-code=\"H802\">wife;</span> because he hath <span class=\"wl wl-kjv\" data-code=\"H6031\">humbled</span> her, he <span class=\"wl wl-kjv\" data-code=\"H3201\">may</span> not put her <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> all his days.", "30": "A <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall not <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1540\">discover</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> skirt."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Matthew Henry-verklaring']],
  ['Geloofsbelijdenissen', ['1689 Baptist Confession', 'Westminster Confession']],
  ['Boeken', ['Institutie — Calvijn', 'A Body of Divinity — Watson']],
  ['Preken', ['Spurgeon']],
  ['Devotionals', ['Spurgeon']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
