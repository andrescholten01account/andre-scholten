oediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "Jer 33:5": "Er zijn er wel gekomen om te strijden tegen de Chaldeeën, maar het is om die te vullen met de dode lichamen van mensen die Ik verslagen heb in Mijn toorn en in Mijn grimmigheid; en omdat Ik Mijn aangezicht van deze stad verborgen heb, vanwege al hun slechtheid.", "Ps 33:4": "Want het woord van de HEERE is recht, en al Zijn werk is trouw.", "Joël 3:21": "En Ik zal hun bloed reinigen, dat Ik niet gereinigd had; en de HEERE zal wonen op Sion.", "Jer 17:4": "Zo zult u aflaten (en dat om uzelf) van uw erfenis, die Ik u gegeven heb, en Ik zal u uw vijanden doen dienen in een land, dat u niet kent; want u hebt een vuur aangestoken in Mijn toorn, tot in eeuwigheid zal het branden.", "Neh 9:8": "En U hebt zijn hart getrouw gevonden voor Uw aangezicht, en hebt een verbond met hem gemaakt, dat U zou geven het land van de Kanaänieten, de Hethieten, de Amorieten, en de Ferezieten, en de Jebusieten, en de Girgasieten, dat U het aan zijn nageslacht zou geven; en U hebt Uw woorden bevestigd, omdat U rechtvaardig bent.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Jes 55:7-9": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig. Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE. Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.", "Jes 57:18": "Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.", "Ps 78:34": "Toen Hij hen doodde, zochten zij Hem, en keerden weer, en zochten God vroeg;", "Ps 118:1-4": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat Israël nu zeggen, dat Zijn goedertierenheid voor eeuwig is. Laat het huis van Aäron nu zeggen, dat Zijn goedertierenheid voor eeuwig is.", "Ps 118:29": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "2 Kon 13:16-25": "En hij zei tegen de koning van Israël: Leg uw hand aan de boog, en hij legde zijn hand daaraan; en Elisa legde zijn handen op de handen van de koning. En hij zei: Doe het venster open naar het oosten. En hij deed het open. Toen zei Elisa: Schiet. En hij schoot. En hij zei: Het is een pijl van de verlossing van de HEERE, en een pijl van de verlossing tegen de Syriërs; want u zult de Syriërs slaan in Afek, tot het verdoen toe. Daarna zei hij: Neem de pijlen. En hij nam ze. Toen zei hij tegen de koning van Israël: Sla tegen de aarde. En hij sloeg driemaal; daarna stond hij stil.", "Ps 12:2": "Behoud, o HEERE; want de goedertierene ontbreekt, want de getrouwen zijn weinig geworden onder de mensenkinderen.", "Ps 65:4": "Onrechtvaardige dingen hadden de overhand over mij; maar onze overtredingen, die verzoent U.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Jes 41:2": "Wie heeft van de opgang die rechtvaardige verwekt? Heeft hem geroepen om hem op zijn voet te doen staan? De heidenvolken voor zijn aangezicht gegeven, en gemaakt dat hij over koningen heerste? Heeft hun zijn zwaard gegeven als stof, zijn boog als een voortgedreven stoppel?", "Jer 21:5": "En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid.", "2 Kon 13:22-25": "Hazaël nu, de koning van Syrië, verdrukte Israël, al de dagen van Joahaz. Doch de HEERE was hun genadig, en ontfermde Zich over hen, en wendde Zich tot hen, omwille van Zijn verbond met Abraham, Izak en Jakob; en Hij wilde hen niet verderven, en heeft hen niet verworpen van Zijn aangezicht, tot nu toe. En Hazaël, de koning van Syrië, stierf, en zijn zoon Benhadad werd koning in zijn plaats.", "Richt 10:16": "En zij deden de vreemde goden uit hun midden weg, en dienden de HEERE. Toen werd Zijn ziel verdrietig over de ellende van Israël.", "2 Kon 24:2": "En de HEERE zond tegen hem de benden van de Chaldeeën, en de benden van de Syriërs, en de benden van de Moabieten, en de benden van de kinderen van Ammon, en zond hen tegen Juda, om dat te verwoesten, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaren, de profeten.", "Ezech 14:14": "Ofschoon deze drie mannen, Noach, Daniël en Job, in het midden daarvan zouden zijn, zouden zij door hun gerechtigheid alleen hun eigen ziel bevrijden, spreekt de Heere HEERE.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "Ps 121:3": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "Ps 100:5": "Want de HEERE is goed; Zijn goedertierenheid is eeuwig, en Zijn trouw van geslacht tot geslacht.", "Jes 65:2": "Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.", "Amos 1:3": "Zo zegt de HEERE: Om drie overtredingen van Damaskus, en om vier zal Ik dat niet afwenden; omdat zij Gilead met ijzeren dorswagens hebben gedorst.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "Num 32:13": "Zo ontstak de toorn van de HEERE tegen Israël, en Hij liet hen ronddwalen in de woestijn, veertig jaar lang, totdat heel het geslacht verteerd was dat gedaan had wat kwaad was in de ogen van de HEERE.", "2 Sam 7:15": "Maar Mijn goedertierenheid zal van hem niet wijken, zoals Ik die weggenomen heb van Saul, die Ik van voor uw aangezicht heb weggenomen.", "Ps 86:5": "Want Gij, Heere! zijt goed, en vergeeft graag, en van grote goedertierenheid voor allen die U aanroepen.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "2 Kon 17:16": "Ja, zij verlieten al de geboden van de HEERE, hun God, en maakten zich gegoten beelden, twee kalveren; en maakten gewijde palen, en bogen zich neer voor heel het leger van de hemel, en dienden Baäl.", "Jer 42:18": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Zoals Mijn toorn en Mijn grimmigheid uitgestort is over de inwoners van Jeruzalem, zo zal Mijn grimmigheid over u uitgestort worden, als u in Egypte gekomen zult zijn; en u zult tot een vervloeking zijn, en tot een ontzetting, en tot een vloek, en tot smaad, en u zult deze plaats niet meer zien.", "1 Kon 16:26": "En hij wandelde in alle wegen van Jerobeam, de zoon van Nebat, en in zijn zonden, waarmee hij Israël had doen zondigen, en verwekte de HEERE, de God van Israël, tot toorn, door hun nietige afgoden.", "Jer 31:37": "Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "2 Kon 13:14-19": "Elisa nu was ziek geweest van zijn ziekte, waaraan hij stierf; en Joas, de koning van Israël, was naar hem toe gekomen, en had geweend over zijn aangezicht, en gezegd: Mijn vader, mijn vader, wagen van Israël en zijn ruiters! En Elisa zei tegen hem: Neem een boog en pijlen. En hij nam een boog en pijlen. En hij zei tegen de koning van Israël: Leg uw hand aan de boog, en hij legde zijn hand daaraan; en Elisa legde zijn handen op de handen van de koning.", "Ezech 33:11": "Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël?", "1 Sam 4:1": "Het woord van Samuël kwam tot heel Israël. En Israël trok uit, de Filistijnen tegemoet ten strijde, en legerde zich bij Eben-haëzer, maar de Filistijnen legerden zich bij Afek.", "Jes 65:16": "Zodat wie zich zal zegenen op aarde, zich zal zegenen in de God van de waarheid; en wie zal zweren op aarde, zal zweren bij de God van de waarheid, omdat de vorige benauwdheden vergeten zullen zijn, en omdat zij voor Mijn ogen verborgen zijn.", "Richt 6:13": "Maar Gideon zei tegen Hem: Och, mijn heer! Als de HEERE met ons is, waarom is ons dan dit alles overkomen? En waar zijn al Zijn wonderen, die onze vaders ons verteld hebben en zeiden: Heeft de HEERE ons niet uit Egypte opgevoerd? Maar nu heeft de HEERE ons verlaten, en heeft ons in de hand van de Midianieten gegeven.", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "Num 32:11": "Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd;", "Num 21:7": "Daarom kwam het volk tot Mozes, en zij zeiden: Wij hebben gezondigd, omdat wij tegen de HEERE en tegen u gesproken hebben; bid tot de HEERE, dat Hij deze slangen van ons wegneemt. Toen bad Mozes voor het volk.", "2 Kon 14:15": "Het overige nu van de geschiedenis van Joas, wat hij gedaan heeft, en zijn macht, en hoe hij gestreden heeft tegen Amazia, de koning van Juda, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?", "Ex 6:3": "En ook heb Ik Mijn verbond met hen opgericht, dat Ik hun het land Kanaän geven zou, het land van hun vreemdelingschap, waarin zij vreemdelingen zijn geweest.", "2 Kon 14:8-16": "Toen zond Amazia boden naar Joas, de zoon van Joahaz, de zoon van Jehu, de koning van Israël, en zei: Kom, laten we elkaar in het gezicht zien. Maar Joas, de koning van Israël, zond naar Amazia, de koning van Juda, en zei: De distel die op de Libanon staat, zond naar de ceder die op de Libanon staat, en zei: Geef uw dochter aan mijn zoon tot vrouw; maar het wilde dier van het veld, dat op de Libanon was, kwam voorbij en vertrapte de distel. U hebt de Edomieten inderdaad geslagen, daarom heeft uw hart u verheven; heb de eer, en blijf in uw huis; want waarom zou u zich in het kwade mengen, zodat u zou vallen, u en Juda met u?", "Gen 12:13": "Zeg toch: U bent mijn zuster; opdat het mij goed gaat om u, en ik in leven blijf om uwentwil.", "Ezra 9:9": "Want wij zijn knechten; maar in onze dienstbaarheid heeft onze God ons niet verlaten; maar Hij heeft weldadigheid tot ons geneigd voor het aangezicht van de koningen van Perzië, dat Hij ons een weinig leven zou geven, om het huis van onze God te verhogen, en de woestenijen ervan op te richten, en om ons een muur te geven in Juda en te Jeruzalem.", "Ps 121:4": "Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen.", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Openb 11:11": "En na die drie dagen en een halve is een geest van leven uit God in hen gegaan; en zij stonden op op hun voeten; en er is grote vrees gevallen op hen die hen aanschouwden.", "Hand 9:13": "En Ananias antwoordde: Heere, ik heb van velen gehoord over deze man, hoeveel kwaad hij Uw heiligen in Jeruzalem heeft aangedaan;", "Ps 119:156": "HEERE! Uw barmhartigheden zijn vele; maak mij levend naar Uw rechten.", "2 Kon 11:21": "Joas was zeven jaar oud, toen hij koning werd.", "Ex 25:17": "U zult ook een verzoendeksel maken van zuiver goud; twee el en een halve zal de lengte daarvan zijn, en anderhalve el de breedte daarvan.", "Num 12:9": "Zo ontstak de toorn van de HEERE tegen hen, en Hij ging weg.", "Ps 136:3-26": "Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig. Hem, Die alleen grote wonderen doet; want Zijn goedertierenheid is voor eeuwig. Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "Micha 7:19": "Hij zal Zich weer over ons ontfermen; Hij zal onze ongerechtigheden dempen; ja, U zult al hun zonden in de diepten van de zee werpen.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Ps 119:90": "Uw trouw is van geslacht tot geslacht; U hebt de aarde vastgemaakt, en zij blijft staan;", "Matt 24:34": "Voorwaar, Ik zeg u: dit geslacht zal beslist niet voorbijgaan, totdat al deze dingen gebeurd zijn.", "Luk 15:4-7": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "2 Kon 13:14-20": "Elisa nu was ziek geweest van zijn ziekte, waaraan hij stierf; en Joas, de koning van Israël, was naar hem toe gekomen, en had geweend over zijn aangezicht, en gezegd: Mijn vader, mijn vader, wagen van Israël en zijn ruiters! En Elisa zei tegen hem: Neem een boog en pijlen. En hij nam een boog en pijlen. En hij zei tegen de koning van Israël: Leg uw hand aan de boog, en hij legde zijn hand daaraan; en Elisa legde zijn handen op de handen van de koning.", "Joz 23:14": "En ziet, ik ga heden in de weg van de hele aarde; en u weet in uw hele hart en in uw hele ziel, dat er niet één woord gevallen is van al die goede woorden, die de HEERE, uw God, over u gesproken heeft; zij zijn u alle overkomen; er is daarvan niet één woord gevallen.", "Ps 78:38": "Doch Hij, barmhartig zijnde, verzoende de ongerechtigheid, en verdierf hen niet; maar wendde dikwijls Zijn toorn af, en wekte Zijn hele grimmigheid niet op.", "Jes 10:5": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand!", "Ex 6:11": "Doch Mozes sprak voor de HEERE en zei: Zie, de kinderen van Israël hebben naar mij niet geluisterd; hoe zou Farao dan naar mij luisteren? Bovendien ben ik onbesneden van lippen.", "Zach 1:17": "Roep nog, en zeg: Zo zegt de HEERE van de heerscharen: Mijn steden zullen nog uitgespreid worden vanwege de voorspoed; want de HEERE zal Sion nog troosten, en Hij zal Jeruzalem nog verkiezen.", "2 Kon 17:20-23": "Zo verwierp de HEERE heel het nageslacht van Israël, en onderdrukte hen, en gaf hen in de hand van rovers, totdat Hij hen van Zijn aangezicht weggeworpen had. Want Hij scheurde Israël af van het huis van David, en zij maakten Jerobeam, de zoon van Nebat, koning; en Jerobeam dreef Israël weg van achter de HEERE vandaan, en liet hen een grote zonde zondigen. Zo wandelden de kinderen van Israël in alle zonden van Jerobeam die hij gedaan had; zij weken daar niet van af;", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Gen 20:11": "En Abraham zei: Want ik dacht: er is beslist geen vreze van God in deze plaats, zodat zij mij zullen doden vanwege mijn vrouw.", "Gen 31:42": "Als de God van mijn vader, de God van Abraham, en de Vreze van Izak, niet bij mij was geweest, dan had u mij zeker nu met lege handen weggezonden! God heeft mijn ellende, en de arbeid van mijn handen, gezien, en heeft u gisteravond bestraft.", "Num 14:18-20": "De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht. Vergeef toch de ongerechtigheid van dit volk, naar de grootte van Uw goedertierenheid, en zoals U dit volk vergeven hebt, van Egypteland af tot hiertoe! En de HEERE zei: Ik heb hun vergeven naar uw woord.", "Jes 36:8": "Nu dan, wed toch met mijn heer, de koning van Assyrië; en ik zal u tweeduizend paarden geven, als u voor uzelf de ruiters daarop kunt geven.", "Ps 107:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Zach 1:5": "Uw vaderen, waar zijn die? En de profeten, zullen zij eeuwig leven?", "Openb 15:1": "En ik zag een ander groot en wonderlijk teken in de hemel: namelijk zeven engelen, die de zeven laatste plagen hadden; want in deze is de toorn van God geëindigd.", "Mark 3:5": "En nadat Hij hen met toorn had aangekeken, bedroefd over de verharding van hun hart, zei Hij tegen de man: Strek uw hand uit. En hij strekte hem uit; en zijn hand werd hersteld, gezond als de andere.", "Ps 125:3": "Want de scepter van de goddeloosheid zal niet rusten op het lot van de rechtvaardigen; opdat de rechtvaardigen hun handen niet uitstrekken tot onrecht.", "2 Kon 12:18": "Maar Joas, de koning van Juda, nam al de geheiligde dingen die Josafat, en Joram, en Ahazia, zijn vaderen, de koningen van Juda, geheiligd hadden, en zijn eigen geheiligde dingen, en al het goud dat gevonden werd in de schatten van het huis van de HEERE en van het huis van de koning, en zond het aan Hazaël, de koning van Syrië; toen trok hij weg van Jeruzalem.", "Richt 7:9-20": "En het gebeurde in die nacht, dat de HEERE tegen hem zei: Sta op, ga naar beneden naar het leger, want Ik heb het in uw hand gegeven. Maar als u ervoor terugschrikt naar beneden te gaan, ga dan af, u en Pura, uw knecht, naar het leger. En u zult horen wat zij zullen zeggen, en daarna zullen uw handen gesterkt worden, zodat u naar het leger zult aftrekken. Toen ging hij af, met Pura, zijn knecht, tot aan het uiterste van de gewapende mannen die in het leger waren.", "2 Kon 8:19": "Toch wilde de HEERE Juda niet verderven, omwille van David, Zijn dienaar; zoals Hij hem gezegd had dat Hij hem altijd een lamp zou geven voor zijn zonen.", "2 Kon 2:12": "En Elisa zag het, en hij riep: Mijn vader, mijn vader, wagen van Israël en zijn ruiters! En hij zag hem niet meer; en hij greep zijn klederen en scheurde ze in twee stukken.", "Ezech 16:62": "Want Ik zal Mijn verbond met u oprichten, en u zult weten dat Ik de HEERE ben;", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Ps 103:8-14": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid. Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden. Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "Ps 25:10": "Caph. Alle paden van de HEERE zijn goedertierenheid en waarheid, voor hun die Zijn verbond en Zijn getuigenissen bewaren.", "Ps 111:4": "Zain. Hij heeft Zijn wonderen tot een gedachtenis gemaakt; Cheth. de HEERE is genadig en barmhartig.", "Jes 42:25": "Daarom heeft Hij over hen uitgestort de grimmigheid van Zijn toorn en de macht van de oorlog; en Hij heeft ze rondom in vlam gezet, doch zij merken het niet; en Hij heeft ze in brand gestoken, doch zij nemen het niet ter harte.", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "2 Kon 3:24-27": "Maar toen zij bij het leger van Israël kwamen, maakten de Israëlieten zich op, en sloegen de Moabieten; en zij vluchtten van voor hen; ja, zij drongen door in het land, en sloegen ook de Moabieten daar. De steden nu braken zij af, en ieder wierp zijn steen op alle goede stukken land, en zij vulden ze, en stopten alle waterfonteinen dicht, en velden alle goede bomen, totdat zij in Kir-hareseth alleen de stenen daarvan lieten overblijven; en de slingeraars omsingelden en sloegen de stad. Doch toen de koning van de Moabieten zag dat de strijd hem te sterk werd, nam hij zevenhonderd man met zich mee, die het zwaard trokken, om door te breken naar de koning van Edom toe; maar zij konden het niet.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Hand 5:15": "zodat zij de zieken uitdroegen op de straten, en legden hen op bedden en matten, opdat, als Petrus kwam, ook maar de schaduw iemand van hen zou mogen beschaduwen.", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Jer 4:8": "Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "2 Tess 1:9": "Die zullen tot straf het eeuwige verderf ondergaan, weg van het aangezicht van de Heere, en van de heerlijkheid van Zijn sterkte,", "1 Kon 11:9": "Daarom vertoornde de HEERE Zich tegen Salomo, omdat hij zijn hart van de HEERE, de God van Israël, had afgewend, Die hem tweemaal verschenen was,", "Jer 51:5": "Want Israël of Juda zal niet in weduwschap gelaten worden door zijn God, door de HEERE van de heerscharen (hoewel hun land vol schuld is), door de Heilige van Israël.", "Ex 22:27": "want dat is zijn enige bedekking, het is zijn kleding voor zijn huid; waarin zou hij anders slapen? Het zal dan gebeuren, wanneer hij tot Mij roept, dat Ik hem zal horen; want Ik ben genadig!", "Hos 14:2-9": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid. Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen. Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Ex 3:9": "En nu, zie, het geschrei van de kinderen van Israël is tot Mij gekomen; en ook heb Ik de verdrukking gezien waarmee de Egyptenaren hen verdrukken.", "2 Sam 7:12": "Wanneer uw dagen vervuld zullen zijn, en u met uw vaderen zult ontslapen zijn, dan zal Ik uw nakomeling na u doen opstaan, die uit uw lijf voortkomen zal, en Ik zal zijn koninkrijk bevestigen.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Klaagl 3:22": "Cheth. Het zijn de blijken van goedertierenheid van de HEERE, dat wij niet vernietigd zijn, dat Zijn barmhartigheden geen einde hebben;", "Richt 10:10": "Toen riepen de Israëlieten tot de HEERE en zeiden: Wij hebben tegen U gezondigd, omdat wij onze God hebben verlaten en de Baäls gediend hebben.", "2 Kron 33:13": "En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Num 11:1": "En het gebeurde dat het volk zich beklaagde, en dat was kwaad in de oren van de HEERE; want de HEERE hoorde het, zodat Zijn toorn ontstak, en het vuur van de HEERE onder hen ontbrandde en verteerde hen die in het uiterste van het leger waren.", "Matt 18:23-27": "Daarom wordt het Koninkrijk der hemelen vergeleken met een zekere koning die met zijn dienstknechten rekening wilde houden. Toen hij nu begon te rekenen, werd er iemand bij hem gebracht die hem tienduizend talenten schuldig was. En omdat hij niet had waarmee hij kon betalen, beval zijn heer dat men hem zou verkopen, en zijn vrouw en kinderen, en alles wat hij had, en dat de schuld zo betaald zou worden.", "Ps 25:6": "Zain. Gedenk, HEERE! Uw barmhartigheden en Uw blijken van goedertierenheid, want die zijn er van eeuwigheid.", "Jes 9:16": "Daarom zal de Heere Zich niet verblijden over hun jongelingen, en over hun wezen en hun weduwen zal Hij Zich niet ontfermen, want zij zijn allen samen huichelaars en boosdoeners, en elke mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "1 Kon 12:26-33": "En Jerobeam zei in zijn hart: Nu zal het koninkrijk weer naar het huis van David terugkeren. Als dit volk zal opgaan om offers te brengen in het huis van de HEERE te Jeruzalem, dan zal het hart van dit volk terugkeren naar hun heer, naar Rehabeam, de koning van Juda; ja, zij zullen mij doden, en terugkeren naar Rehabeam, de koning van Juda. Daarom hield de koning een raad, en maakte twee gouden kalveren; en hij zei tegen hen: Het is voor u teveel om naar Jeruzalem op te gaan; zie uw goden, o Israël, die u uit het land Egypte hebben opgevoerd.", "2 Kon 10:32": "In die dagen begon de HEERE Israël in te korten, want Hazaël sloeg hen in alle grensgebieden van Israël:", "Mark 6:20": "want Herodes was bang voor Johannes, wetend dat hij een rechtvaardig en heilig man was, en hij beschermde hem; en wanneer hij hem hoorde, deed hij veel dingen, en hij luisterde graag naar hem.", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "Jona 4:2": "En hij bad tot de HEERE, en zei: Och HEERE! Was dit niet mijn woord, toen ik nog in mijn land was? Daarom kwam ik het voor, door naar Tarsis te vluchten; want ik wist dat U een genadig en barmhartig God bent, geduldig en groot van goedertierenheid, en berouw hebbend over het kwaad.", "2 Kon 23:26": "Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.", "2 Kon 3:3": "Toch hield hij vast aan de zonden van Jerobeam, de zoon van Nebat, die Israël deed zondigen; hij week daarvan niet af.", "2 Kon 24:20": "Want het gebeurde, vanwege de toorn van de HEERE tegen Jeruzalem en tegen Juda, totdat Hij hen van Zijn aangezicht weggeworpen had. En Zedekia kwam in opstand tegen de koning van Babel.", "2 Kon 3:5-27": "Maar het gebeurde, toen Achab gestorven was, dat de koning van de Moabieten van de koning van Israël afviel. Zo trok koning Joram op dezelfde tijd uit Samaria weg, en telde heel Israël. En hij ging op weg, en zond een bode naar Josafat, de koning van Juda, en zei: De koning van de Moabieten is van mij afgevallen; wilt u met mij optrekken in de oorlog tegen de Moabieten? En hij zei: Ik zal opkomen; ik zal zijn zoals u bent, mijn volk als uw volk, mijn paarden als uw paarden.", "Ps 89:2": "Ik zal de goedertierenheid van de HEERE eeuwig zingen; ik zal Uw waarheid met mijn mond bekend maken, van geslacht tot geslacht.", "Jer 21:6": "En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Deut 6:14": "U zult andere goden niet navolgen, van de goden van de volken, die rondom u zijn.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "Neh 9:27": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten.", "Joh 8:26": "Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld.", "1 Kon 18:7-14": "Toen Obadja nu op de weg was, zie, daar kwam Elia hem tegemoet; en hem herkennend, viel hij op zijn gezicht en zei: Bent u mijn heer Elia? Hij zei: Ik ben het; ga heen, zeg tegen uw heer: Zie, Elia is hier. Maar hij zei: Wat heb ik gezondigd, dat u uw knecht geeft in de hand van Achab, om mij te doden?", "Num 11:10": "Toen hoorde Mozes het volk wenen door hun huisgezinnen, ieder aan de deur van zijn tent; en de toorn van de HEERE ontstak zeer; ook was dat kwaad in de ogen van Mozes.", "Jona 4:11": "En zou Ik dan die grote stad Ninevé niet ontzien? Daarin wonen meer dan honderdtwintigduizend mensen, die geen onderscheid weten te maken tussen hun rechterhand en hun linkerhand; en bovendien nog veel vee?", "Ex 4:10": "Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong.", "Zach 10:6": "En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren.", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Ps 89:9": "O HEERE, God van de heerscharen! Wie is als Gij, grootmachtig, o HEERE! en Uw getrouwheid is rondom U.", "Ezech 16:60": "Toch zal Ik denken aan Mijn verbond met u, in de dagen van uw jeugd, en Ik zal met u een eeuwig verbond oprichten.", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "Ps 130:8": "En Hij zal Israël verlossen van al zijn ongerechtigheden.", "Matt 22:7": "Toen de koning dat hoorde, werd hij toornig, en hij stuurde zijn legers en heeft die moordenaars omgebracht en hun stad in brand gestoken.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "2 Kon 4:40": "Daarna schepten zij voor de mannen op om te eten; en het gebeurde, toen zij van dat moes aten, dat zij riepen en zeiden: Man Gods, de dood is in de pot! En zij konden het niet eten.", "Ezech 5:13": "Zo zal Mijn toorn volbracht worden, en Ik zal Mijn grimmigheid op hen laten rusten, en Mij troosten; en zij zullen weten dat Ik, de HEERE, in Mijn ijver gesproken heb, als Ik Mijn grimmigheid tegen hen volbracht zal hebben.", "Lev 26:17": "Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand.", "Mark 10:14": "Maar Jezus zag dit, en nam het Hem zeer kwalijk, en zei tegen hen: Laat de kinderen bij Mij komen, en verhinder ze niet; want voor zulke is het Koninkrijk van God.", "1 Kon 15:13": "Ja, zelfs zijn moeder Maächa zette hij ook af, zodat zij geen koningin meer was, omdat zij een afgrijselijke afgod in een bos gemaakt had; ook roeide Asa haar afgrijselijke afgod uit, en verbrandde die aan de beek Kidron.", "2 Kon 14:28": "Het overige nu van de geschiedenis van Jerobeam, en alles wat hij gedaan heeft, en zijn macht, hoe hij gestreden heeft, en hoe hij Damaskus en Hamath, die tot Juda behoorden, weer aan Israël teruggebracht heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?", "Jes 51:8": "Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslacht.", "Ps 18:51": "Die de verlossingen van Zijn koning groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn nageslacht tot in eeuwigheid.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Ps 103:8": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid.", "Jer 1:6": "Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Jer 29:10": "Want zo zegt de HEERE: Zeker, als er zeventig jaren te Babel vervuld zullen zijn, zal Ik u bezoeken, en Ik zal Mijn goede woord over u waarmaken, door u terug te brengen naar deze plaats.", "1 Sam 17:24": "Doch alle mannen in Israël vluchtten voor hem weg toen zij die man zagen, en zij vreesden zeer.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "1 Kron 11:2": "Zelfs al eerder, toen Saul nog koning was, hebt u Israël uitgeleid en ingeleid; ook heeft de HEERE, uw God, tot u gezegd: U zult Mijn volk Israël weiden, en u zult voorganger zijn over Mijn volk Israël.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "2 Kon 6:9": "Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen.", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Gen 9:16": "Als deze boog in de wolken zal zijn, dan zal Ik hem aanzien, om te gedenken aan het eeuwige verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.", "Ex 22:24": "en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.", "2 Kon 15:8": "In het achtendertigste jaar van Azaria, de koning van Juda, regeerde Zacharia, de zoon van Jerobeam, over Israël te Samaria, zes maanden.", "Jes 65:8": "Zo zegt de HEERE: Zoals wanneer men most in een tros druiven vindt, men zegt: Verderf ze niet, want er is een zegen in; zo zal Ik het om Mijn knechten doen, dat Ik hen niet allen verderf.", "Num 25:4": "En de HEERE zei tot Mozes: Neem alle hoofden van het volk, en hang hen op voor de HEERE tegen de zon, zo zal de gloed van de toorn van de HEERE gekeerd worden van Israël.", "Richt 3:7": "En de kinderen van Israël deden wat kwaad was in de ogen van de HEERE, en vergaten de HEERE, hun God, en zij dienden de Baäls en de gewijde palen.", "2 Kor 1:20": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons.", "2 Kon 4:6": "En het gebeurde, toen de vaten vol waren, dat zij tegen haar zoon zei: Breng mij nog een vat aan; maar hij zei tegen haar: Er is geen vat meer. En de olie stond stil.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Joz 23:16": "Wanneer u het verbond van de HEERE, uw God, overtreedt, dat Hij u geboden heeft, en u heengaat en dient andere goden, en u voor hen neerbuigt, zo zal de toorn van de HEERE over u ontsteken, en u zult haastig omkomen van het goede land, dat Hij u gegeven heeft.", "Richt 2:12": "En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "Richt 2:1": "En een Engel van de HEERE kwam op van Gilgal naar Bochim, en Hij zei: Ik heb u uit Egypte opgevoerd, en u gebracht in het land dat Ik uw vaderen gezworen heb, en gezegd: Ik zal Mijn verbond met u niet verbreken in eeuwigheid.", "Jes 1:5": "Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat.", "Matt 14:29-31": "En Hij zei: Kom. En Petrus klom uit het schip, en liep op het water, om naar Jezus toe te komen. Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij! En Jezus stak meteen Zijn hand uit, greep hem vast, en zei tegen hem: Kleingelovige! Waarom heb je getwijfeld?", "Richt 3:15": "Toen riepen de kinderen van Israël tot de HEERE, en de HEERE verwekte hun een verlosser, Ehud, de zoon van Gera, een zoon van Jemini, een man die links was. En de kinderen van Israël zonden door zijn hand een geschenk aan Eglon, de koning van de Moabieten.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "2 Kon 12:17": "Toen trok Hazaël, de koning van Syrië, op, en streed tegen Gath, en nam het in; daarna richtte Hazaël zijn gezicht om tegen Jeruzalem op te trekken.", "1 Sam 22:4": "En hij bracht hen voor het aangezicht van de koning van de Moabieten; en zij bleven bij hem al de dagen dat David in de vesting was.", "Richt 10:7-14": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten. Die verdrukten en vertrapten de Israëlieten in datzelfde jaar; achttien jaar lang onderdrukten zij alle Israëlieten die aan de overkant van de Jordaan waren, in het land van de Amorieten, dat in Gilead ligt. Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "1 Kon 17:22": "En de HEERE verhoorde de stem van Elia; en de ziel van het kind kwam weer in hem, zodat het weer levend werd.", "Ps 69:17": "Verhoor mij, o HEERE, want Uw goedertierenheid is goed; zie mij aan naar de grootheid van Uw barmhartigheden.", "1 Kon 22:52": "Ahazia, de zoon van Achab, werd koning over Israël te Samaria, in het zeventiende jaar van Josafat, de koning van Juda, en regeerde twee jaar over Israël.", "Zach 9:11": "U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "Matt 28:17": "En toen zij Hem zagen, aanbaden zij Hem; maar sommigen twijfelden.", "1 Kon 16:33": "Ook maakte Achab een gewijd bos, zodat Achab nog meer deed om de HEERE, de God van Israël, tot toorn te verwekken, dan alle koningen van Israël die voor hem geweest waren.", "1 Kon 14:13": "En heel Israël zal hem beklagen en hem begraven; want deze alleen van Jerobeam zal in het graf komen, omdat in hem iets goeds gevonden is voor de HEERE, de God van Israël, in het huis van Jerobeam.", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Gen 19:30": "En Lot trok weg uit Zoar, en woonde op de berg, en zijn twee dochters met hem; want hij was bang om in Zoar te wonen. En hij woonde in een grot, hij en zijn twee dochters.", "Richt 6:15": "En hij zei tegen Hem: Och, mijn Heere! Waarmee zal ik Israël verlossen? Zie, mijn geslacht is het armste in Manasse, en ik ben de kleinste in mijn vaders huis.", "2 Kon 4:34": "En hij klom op het bed, en ging op het kind liggen, en legde zijn mond op diens mond, en zijn ogen op zijn ogen, en zijn handen op zijn handen, en boog zich over hem heen. En het vlees van het kind werd warm.", "Ezech 5:15": "Zo zal de smaad en hoon een lering en ontzetting zijn voor de heidenvolken die rondom u zijn, wanneer Ik over u gerichten in toorn, en in grimmigheid, en in grimmige straffen oefenen zal; Ik, de HEERE, heb het gesproken!", "Openb 15:7": "En een van de vier dieren gaf de zeven engelen zeven gouden schalen, vol van de toorn van God, Die leeft in alle eeuwigheid.", "Gen 18:26-32": "Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen. En Abraham antwoordde en zei: Zie toch, ik heb het aangedurfd te spreken tot de Heere, hoewel ik stof en as ben! Misschien zullen aan de vijftig rechtvaardigen vijf ontbreken; zult U dan om vijf de hele stad verwoesten? En Hij zei: Ik zal haar niet verwoesten, als Ik er vijfenveertig zal vinden.", "Neh 9:27-31": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten. Maar toen zij rust hadden, keerden zij weer terug om kwaad te doen voor Uw aangezicht; toen verliet U hen in de hand van hun vijanden, zodat zij over hen heersten; en toen zij zich dan bekeerden, en U aanriepen, hebt U hen vanuit de hemel gehoord, en hebt hen naar Uw barmhartigheden vele malen uitgered. En U hebt tegen hen getuigd, om hen te doen terugkeren tot Uw wet; maar zij hebben trots gehandeld, en niet geluisterd naar Uw geboden, en tegen Uw rechten gezondigd, waardoor een mens, als hij ze doet, zal leven; en zij hebben hun schouder teruggetrokken, en hun nek verhard, en niet geluisterd.", "Ezech 18:31": "Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël?", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Jes 48:9": "Om Mijn Naams wil zal Ik Mijn toorn langer uitstellen, en om het roem van Mij wil zal Ik, u ten goede, Mij bedwingen, opdat Ik u niet afhouw.", "Matt 6:14": "Want als u de mensen hun misdaden vergeeft, zal uw hemelse Vader ook u vergeven.", "Ps 94:14": "Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.", "Num 16:48": "En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Luk 1:72": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken;", "Dan 9:4": "Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Num 32:10": "Toen ontstak de toorn van de HEERE op die dag, en Hij zwoer en zei:", "Jer 3:22": "Keer terug, afkerige kinderen! Ik zal uw afkeringen genezen. Zie, hier zijn wij, wij komen tot U, want U bent de HEERE, onze God!", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "1 Kon 16:32": "En hij richtte voor Baäl een altaar op, in het huis van Baäl, dat hij te Samaria gebouwd had.", "Hos 2:13-22": "Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken. En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland. En het zal op die dag gebeuren, spreekt de Heere, dat u Mij zult noemen: Mijn Man; en Mij niet meer zult noemen: Mijn Baäl!", "Gen 15:8": "En hij zei: Heere HEERE, waarbij zal ik weten dat ik het erfelijk bezitten zal?", "Joz 21:45": "Er viel niet één woord weg van al de goede woorden, die de HEERE gesproken had tot het huis van Israël; het kwam allemaal uit.", "Ps 130:7": "Israël, hoop op de HEERE; want bij de HEERE is goedertierenheid, en bij Hem is veel verlossing.", "Gen 17:8": "En Ik zal u en uw nageslacht na u het land waar u als vreemdeling verblijft geven, het hele land Kanaän, tot eeuwig eigendom; en Ik zal hun tot een God zijn.", "Jes 11:5": "Want gerechtigheid zal de gordel van Zijn lendenen zijn; ook zal de trouw de gordel van Zijn lendenen zijn.", "Num 16:21": "Scheid u af uit het midden van deze vergadering, en Ik zal hen in een ogenblik verteren!", "2 Kon 14:27": "En de HEERE had niet gesproken dat Hij de naam van Israël van onder de hemel zou uitwissen; maar Hij verloste hen door de hand van Jerobeam, de zoon van Joas.", "1 Kon 20:26": "Het gebeurde nu bij de wederkomst van het jaar, dat Benhadad de Syriërs monsterde; en hij trok op naar Afek, ten strijde tegen Israël.", "Deut 4:31": "Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Richt 6:6": "Zo werd Israël zeer arm vanwege de Midianieten. Toen riepen de Israëlieten tot de HEERE.", "1 Sam 13:6": "Toen de mannen van Israël zagen dat zij in nood waren (want het volk was benauwd), verborg het volk zich in de holen, en in de doornstruiken, en in de rotsen, en in de vestingen, en in de putten.", "Ps 31:8": "Ik zal mij verheugen en verblijden in Uw goedertierenheid, omdat U mijn ellende hebt aangezien, en mijn ziel in benauwdheden gekend hebt;", "2 Kon 17:18": "Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.", "Jer 44:6": "Daarom is Mijn grimmigheid en Mijn toorn uitgestort, en heeft gebrand in de steden van Juda en in de straten van Jeruzalem; zodat ze tot eenzaamheid en tot verwoesting geworden zijn, zoals het is op deze dag.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Dan 4:22-27": "Dat bent u, o koning, die groot en sterk bent geworden; want uw grootheid is zo toegenomen, dat zij reikt aan de hemel, en uw heerschappij aan het einde van het aardrijk. Dat nu de koning een wachter, namelijk een heilige, gezien heeft, uit de hemel neerkomend, die zei: Houwt deze boom om, en verderf hem; maar laat de stronk met zijn wortels in de aarde, en met een ijzeren en koperen band in het tedere gras van het veld, en in de dauw van de hemel nat gemaakt worden, en dat zijn deel zij met het gedierte van het veld, totdat er zeven tijden over hem voorbijgaan; Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal:", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Matt 18:11-14": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "2 Kon 14:25": "Hij bracht ook het gebied van Israël terug, vanaf de ingang van Hamath tot aan de zee van het vlakke veld; naar het woord van de HEERE, de God van Israël, dat Hij gesproken had door de dienst van Zijn dienaar Jona, de zoon van Amitthai, de profeet, die uit Gath-Hefer was.", "Hebr 3:11": "Zo heb Ik dan gezworen in Mijn toorn: Zij zullen Mijn rust niet binnengaan!", "2 Kron 6:4-15": "En hij zei: Geloofd zij de HEERE, de God van Israël, Die met Zijn mond tot mijn vader David gesproken heeft, en het met Zijn handen vervuld heeft, en zei: Vanaf de dag dat Ik Mijn volk uit Egypteland uitgevoerd heb, heb Ik geen stad verkoren uit alle stammen van Israël om een huis te bouwen, dat Mijn Naam daar zou zijn; en geen man verkoren om een leider te zijn over Mijn volk Israël. Maar Ik heb Jeruzalem verkoren, dat Mijn Naam daar zou zijn; en Ik heb David verkoren, dat hij over Mijn volk Israël zou zijn.", "Richt 3:12": "Maar de kinderen van Israël gingen door met doen wat kwaad was in de ogen van de HEERE; toen sterkte de HEERE Eglon, de koning van de Moabieten, tegen Israël, omdat zij deden wat kwaad was in de ogen van de HEERE.", "Hebr 10:37": "want: Nog een heel klein tijdje en Hij, Die komen zal, zal komen, en niet uitblijven.", "Jer 25:38": "Hij heeft, als een jonge leeuw, Zijn hut verlaten; want hun land is geworden tot een verwoesting, vanwege de gloed van de verdrukker, ja, vanwege de gloed van Zijn toorn.", "2 Kron 22:6": "En hij keerde terug om zich te laten genezen te Jizreël; want hij had wonden, die men hem bij Rama geslagen had, toen hij streed tegen Hazaël, de koning van Syrië; en Azarja, de zoon van Joram, de koning van Juda, kwam af om Joram, de zoon van Achab, te Jizreël te bezoeken, want hij was ziek.", "2 Kon 5:10-14": "Toen stuurde Elisa een bode naar hem, en zei: Ga heen en was u zeven keer in de Jordaan, en uw vlees zal weer gezond worden, en u zult rein zijn. Maar Naäman werd erg boos, en ging weg, en zei: Zie, ik zei bij mijzelf: Hij zal zeker naar buiten komen, en gaan staan, en de Naam van de HEERE, zijn God, aanroepen, en zijn hand over de plaats bewegen, en de melaatse genezen. Zijn Abana en Farpar, de rivieren van Damaskus, niet beter dan al het water van Israël? Zou ik mij daarin niet kunnen wassen en rein worden? Zo keerde hij zich om, en ging weg in woede.", "Joh 5:25": "Voorwaar, voorwaar, Ik zeg u: De tijd komt, en is er nu, waarop de doden de stem van de Zoon van God zullen horen, en zij die ze gehoord hebben, zullen leven.", "2 Sam 5:24": "En het zal gebeuren, als u het geluid van een gang hoort in de toppen van de moerbeibomen, dat u zich dan haast; want dan is de HEERE voor uw aangezicht uitgegaan, om het leger van de Filistijnen te verslaan.", "Ps 76:8": "U, vreselijk bent U; en wie zal voor Uw aangezicht bestaan, vanaf het moment van uw toorn?", "Mark 6:5": "En Hij kon daar geen kracht doen; behalve dat Hij een paar zieken de handen oplegde en hen genas.", "Klaagl 2:6": "Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.", "Num 11:33": "Dat vlees was nog tussen hun tanden, voordat het gekauwd was, toen ontstak de toorn van de HEERE tegen het volk, en de HEERE sloeg het volk met een zeer grote plaag.", "Jes 19:20": "En het zal zijn tot een teken, en tot een getuigenis voor de HEERE van de heerscharen in Egypteland, want zij zullen tot de HEERE roepen vanwege de verdrukkers, en Hij zal hun een Heiland en Meester zenden, Die hen zal verlossen.", "Luk 1:54": "Hij heeft Israël, Zijn knecht, opgenomen, om Zijn barmhartigheid te gedenken,", "Ps 111:7-9": "Mem. De werken van Zijn handen zijn waarheid en oordeel; Nun. al Zijn bevelen zijn betrouwbaar. Samech. Ze zijn ondersteund voor altijd en in eeuwigheid; Ain. gedaan in waarheid en oprechtheid. Pe. Hij heeft Zijn volk verlossing gezonden; Tsade. Hij heeft Zijn verbond in eeuwigheid geboden; Koph. Zijn Naam is heilig en ontzagwekkend.", "Ps 78:4-72": "Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft. Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;", "Rom 10:12": "Want er is geen onderscheid tussen Jood en Griek; want eenzelfde Heere is Heere van allen, rijk over allen die Hem aanroepen.", "Ef 2:4-7": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden), en heeft ons mede opgewekt, en heeft ons mede gezet in de hemel in Christus Jezus;", "2 Sam 6:7": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Zach 3:9": "Want zie, aangaande die steen, die Ik gelegd heb voor het aangezicht van Jozua, op die ene steen zullen zeven ogen zijn; zie, Ik zal zijn graveersel graveren, spreekt de HEERE van de heerscharen, en Ik zal de ongerechtigheid van dit land op één dag wegnemen.", "Ex 5:23": "Want vanaf het moment dat ik bij Farao ben gekomen, om in Uw Naam te spreken, heeft hij dit volk kwaad gedaan; en U hebt Uw volk geenszins verlost.", "Jer 36:7": "Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.", "Matt 17:14-21": "En toen zij bij de menigte gekomen waren, kwam er iemand naar Hem toe, die voor Hem op de knieën viel en zei: Heere, ontferm U over mijn zoon, want hij is maanziek en lijdt zwaar; want vaak valt hij in het vuur, en vaak in het water. En ik heb hem naar Uw discipelen gebracht, maar zij hebben hem niet kunnen genezen.", "2 Kon 4:16": "En hij zei: Op deze vastgestelde tijd, omtrent deze tijd van het jaar, zult u een zoon omhelzen. En zij zei: Nee, mijn heer, u, man Gods, lieg niet tegen uw dienares.", "1 Sam 16:2": "Maar Samuël zei: Hoe zou ik kunnen gaan? Saul zal het horen en mij doden. Toen zei de HEERE: Neem een kalf van de runderen met u mee, en zeg: Ik ben gekomen om de HEERE een offer te brengen.", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Ps 85:3": "De misdaad van Uw volk hebt U weggenomen; U hebt al hun zonden bedekt. Sela.", "Ps 119:65": "Teth. U hebt bij Uw knecht goed gedaan, HEERE, naar Uw woord.", "Openb 14:11": "En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "2 Kron 24:19": "Toch zond Hij profeten onder hen, om hen tot de HEERE te doen terugkeren; die waarschuwden hen, maar zij luisterden niet.", "1 Kon 1:21": "Anders zal het gebeuren, als mijn heer de koning bij zijn vaderen te ruste is gegaan, dat ik en mijn zoon Salomo als zondaars beschouwd zullen worden.", "2 Kron 33:12": "En toen hij in nood verkeerde, zocht hij het aangezicht van de HEERE, zijn God, met ernst, en vernederde zich zeer voor het aangezicht van de God van zijn vaderen,", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Deut 5:29": "Och, dat zij zo'n hart hadden om Mij te vrezen, en al Mijn geboden alle dagen te onderhouden, opdat het hun en hun kinderen goed gaat in eeuwigheid!", "Ezech 20:17": "Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.", "Kol 3:6": "Om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "Ps 105:8": "Hij gedenkt Zijn verbond tot in eeuwigheid, het woord dat Hij ingesteld heeft, tot in duizend geslachten;", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Luk 1:77": "om Zijn volk kennis van het heil te geven, in vergeving van hun zonden,", "2 Kron 22:5": "Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.", "2 Kon 14:8": "Toen zond Amazia boden naar Joas, de zoon van Joahaz, de zoon van Jehu, de koning van Israël, en zei: Kom, laten we elkaar in het gezicht zien.", "2 Kon 13:15-19": "En Elisa zei tegen hem: Neem een boog en pijlen. En hij nam een boog en pijlen. En hij zei tegen de koning van Israël: Leg uw hand aan de boog, en hij legde zijn hand daaraan; en Elisa legde zijn handen op de handen van de koning. En hij zei: Doe het venster open naar het oosten. En hij deed het open. Toen zei Elisa: Schiet. En hij schoot. En hij zei: Het is een pijl van de verlossing van de HEERE, en een pijl van de verlossing tegen de Syriërs; want u zult de Syriërs slaan in Afek, tot het verdoen toe.", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Job 11:6": "En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Lev 26:44": "En hierboven is dit ook: als zij in het land van hun vijanden zullen zijn, zal Ik hen niet verwerpen, en ook niet van hen walgen, om een einde aan hen te maken en Mijn verbond met hen te vernietigen; want Ik ben de HEERE, hun God!", "Jer 33:21": "Dan zou ook Mijn verbond met Mijn knecht David verbroken kunnen worden, zodat hij geen zoon heeft die op zijn troon regeert, en met de Levieten, de priesters, Mijn dienaren.", "1 Kon 14:16": "En Hij zal Israël overgeven, vanwege de zonden van Jerobeam, die gezondigd heeft, en die Israël heeft doen zondigen.", "Jer 33:26": "Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen.", "Rom 11:29": "Want de genadegiften en de roeping van God zijn onberouwelijk.", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "Jer 32:37": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.", "Deut 32:15-18": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil. Zij hebben Hem tot ijver verwekt door vreemde goden; door gruwelen hebben zij Hem tot toorn verwekt. Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben.", "2 Sam 22:8": "Toen daverde en beefde de aarde; de fundamenten van de hemel beroerden zich, en daverden, omdat Hij in toorn ontstoken was.", "1 Kon 16:29": "En Achab, de zoon van Omri, werd koning over Israël, in het achtendertigste jaar van Asa, de koning van Juda; en Achab, de zoon van Omri, regeerde over Israël, te Samaria, tweeëntwintig jaren.", "Ex 20:2": "Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Ps 89:3": "Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd:", "Ex 4:17": "Neem dan deze staf in uw hand, waarmee u die tekenen doen zult.", "Ps 86:15": "Maar Gij, Heere! zijt een barmhartig en genadig God, geduldig, en groot van goedertierenheid en waarheid.", "Ex 5:22": "Toen keerde Mozes weer terug tot de HEERE, en zei: Heere! Waarom hebt U dit volk kwaad gedaan, waarom hebt U mij nu gezonden?", "Jer 17:2": "Zoals hun kinderen aan hun altaren denken, en aan hun bossen, bij het groene geboomte, op de hoge heuvels.", "Ezech 25:14-17": "En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE. Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap; Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen.", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "1 Kon 18:19": "Nu dan, zend heen, verzamel bij mij heel Israël op de berg Karmel, en de vierhonderdvijftig profeten van Baäl, en de vierhonderd profeten van het bos, die van de tafel van Izebel eten.", "2 Kon 20:1": "In die dagen werd Hizkia ziek, tot aan het sterven toe; en de profeet Jesaja, de zoon van Amoz, kwam bij hem en zei tegen hem: Zo zegt de HEERE: Geef bevel aan uw huis, want u zult sterven en niet leven.", "Jes 20:2-4": "In dezelfde tijd sprak de HEERE, door de dienst van Jesaja, de zoon van Amoz, en Hij zei: Ga heen, en maak de zak van uw lendenen los, en doe uw schoenen van uw voeten. En hij deed zo, en liep naakt en barrevoets. Toen zei de HEERE: Zoals Mijn knecht Jesaja naakt en barrevoets rondloopt, drie jaren, tot een teken en wonder over Egypte en over Morenland; zo zal de koning van Assyrië de gevangenen van de Egyptenaren wegvoeren, en de Moren, die weggevoerd zullen worden, jong en oud, naakt en barrevoets, en met ontblote billen, de Egyptenaren tot schande.", "Ps 40:11": "Uw gerechtigheid bedek ik niet in het midden van mijn hart; Uw waarheid en Uw heil spreek ik uit; Uw weldadigheid en Uw trouw verheel ik niet in de grote gemeente.", "Joh 2:5-8": "Zijn moeder zei tegen de dienaars: Wat Hij u ook zal zeggen, doe dat. En daar stonden zes stenen watervaten, volgens het reinigingsgebruik van de Joden, elk met een inhoud van twee of drie metreten. Jezus zei tegen hen: Vul de watervaten met water. En zij vulden ze tot boven toe.", "Ps 106:44": "Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde.", "Ex 32:13": "Denk aan Abraham, aan Izak en aan Israël, Uw dienaren, aan wie Gij bij Uzelf gezworen hebt, en tot wie Gij gesproken hebt: Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel; en dit hele land, waarvan Ik gezegd heb dat Ik het aan uw nageslacht zal geven, zullen zij voor eeuwig in erfelijk bezit hebben.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Joh 11:44": "En de gestorvene kwam naar buiten, gebonden aan handen en voeten met grafdoeken, en zijn gezicht was omwonden met een zweetdoek. Jezus zei tegen hen: Maak hem los, en laat hem gaan.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Num 16:45": "Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, in een ogenblik! Toen vielen zij op hun aangezichten.", "Jer 32:40": "En Ik zal een eeuwig verbond met hen sluiten, dat Ik Mij van achter hen niet zal afkeren, opdat Ik hun goeddoe; en Ik zal Mijn vrees in hun hart geven, zodat zij niet van Mij afwijken.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "2 Kon 10:36": "En de dagen, die Jehu over Israël geregeerd heeft in Samaria, zijn achtentwintig jaren.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Gen 9:15": "dan zal Ik Mijn verbond gedenken, dat er is tussen Mij en tussen u, en tussen alle levende ziel van alle vlees; en het water zal niet meer worden tot een vloed, om alle vlees te verderven.", "2 Kron 21:7": "Doch de HEERE wilde het huis van David niet te gronde richten, omwille van het verbond dat Hij met David gesloten had; en zoals Hij gezegd had hem en zijn zonen voor altijd een lamp te zullen geven.", "2 Sam 22:9": "Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daardoor aangestoken.", "Neh 1:10": "Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Jes 57:17": "Ik was toornig over de ongerechtigheid van zijn hebzucht, en sloeg hem; Ik verborg Mij, en was toornig; toch ging hij afkerig zijn eigen weg, de weg van zijn hart.", "Job 23:2-6": "Ook vandaag is mijn klacht bitter; mijn plaag is zwaarder dan mijn zuchten. Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen.", "2 Kon 14:16": "En Joas ontsliep met zijn vaderen, en werd in Samaria begraven bij de koningen van Israël; en zijn zoon Jerobeam werd koning in zijn plaats.", "1 Sam 13:19-23": "En er werd geen smid gevonden in het hele land van Israël; want de Filistijnen hadden gezegd: Anders maken de Hebreeën zwaard of speer. Daarom moest heel Israël naar de Filistijnen aftrekken, om ieder zijn ploegijzer, of zijn spade, of zijn bijl, of zijn houweel te laten scherpen. Maar zij hadden tandige vijlen voor hun houwelen, en voor hun spaden, en voor de drietandige vorken, en voor de bijlen, en om de prikkels scherp te maken.", "Matt 27:52": "En de graven werden geopend, en veel lichamen van de heiligen die ontslapen waren, werden opgewekt;", "Jes 66:15": "Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.", "Mark 9:14-29": "En toen Hij bij de discipelen kwam, zag Hij een grote menigte om hen heen, en enige Schriftgeleerden die met hen aan het twisten waren. En meteen, toen de hele menigte Hem zag, was zij zeer verbaasd, en zij liepen naar Hem toe en groetten Hem. En Hij vroeg de Schriftgeleerden: Waarover twist u met hen?", "Zach 1:16": "Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "Luk 6:36": "Wees dan barmhartig, zoals ook uw Vader barmhartig is.", "2 Kon 14:26": "Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Joh 11:39-41": "Jezus zei: Neem de steen weg. Martha, de zuster van de gestorvene, zei tegen Hem: Heere, hij ruikt al, want hij ligt er al vier dagen. Jezus zei tegen haar: Heb Ik u niet gezegd dat, als u gelooft, u de heerlijkheid van God zien zult? Zij namen dan de steen weg, waar de gestorvene lag. En Jezus hief de ogen omhoog, en zei: Vader, Ik dank U dat U Mij gehoord hebt.", "Ex 32:10": "En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken.", "Deut 6:15": "Want de HEERE, uw God, is een na-ijverig God in uw midden; dat de toorn van de HEERE, uw God, tegen u niet ontsteekt, en Hij u van de aardbodem verdelgt.", "Rom 3:3": "Want wat is het, al zijn sommigen ongelovig geweest? Zal hun ongeloof het geloof van God tenietdoen?", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Jer 2:27": "Die tot een stuk hout zeggen: U bent mijn vader; en tot een steen: U hebt mij verwekt; want zij keren Mij de nek toe, en niet het aangezicht; maar ten tijde van hun kwaad zeggen zij: Sta op en verlos ons.", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "Jes 26:16": "HEERE, in benauwdheid hebben zij U bezocht; zij hebben hun stil gebed uitgestort, toen Uw tuchtiging over hen was.", "Num 25:3": "Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Gen 12:12": "En het zal gebeuren, wanneer de Egyptenaren u zien, dat zij zullen zeggen: Dat is zijn vrouw; en zij zullen mij doden, en u in leven laten.", "2 Kon 8:29": "Toen keerde koning Joram terug, om zich in Jizreël te laten genezen van de verwondingen die de Syriërs hem in Rama toegebracht hadden, toen hij tegen Hazaël, de koning van Syrië, streed; en Ahazia, de zoon van Jehoram, de koning van Juda, kwam naar Jizreël om Joram, de zoon van Achab, te bezoeken, want hij was ziek.", "Ezech 22:30": "Ik zocht nu onder hen een man die de muur zou kunnen toemuren, en voor Mijn aangezicht in de brest zou kunnen staan voor het land, zodat Ik het niet zou hoeven te verderven; maar Ik vond niemand.", "Micha 7:20": "U zult Jakob de trouw, Abraham de goedertierenheid geven, die U onze vaderen van oude dagen af gezworen hebt.", "Gen 13:16": "En Ik zal uw nageslacht stellen als het stof van de aarde, zodat als iemand het stof van de aarde zal kunnen tellen, ook uw nageslacht geteld zal worden.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Matt 24:35": "De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.", "Hos 5:11": "Efraïm is verdrukt, hij is verpletterd met recht; want hij heeft dat zo gewild; hij heeft gewandeld naar het gebod.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "Hand 13:36": "Want David is, nadat hij in zijn tijd de raad van God gediend had, ontslapen, en is bij zijn vaderen gelegd, en heeft wel verderving gezien;", "Ps 89:25": "En Mijn getrouwheid en Mijn goedertierenheid zullen met hem zijn; en zijn hoorn zal in Mijn Naam verhoogd worden.", "Jer 31:36": "Als deze ordeningen van voor Mijn aangezicht zullen wijken, spreekt de HEERE, dan zal ook het nageslacht van Israël ophouden een volk te zijn voor Mijn aangezicht, alle dagen.", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "Hand 19:12": "zodat ook van zijn lijf op de zieken gedragen werden de zweetdoeken of gordeldoeken, en dat de ziekten van hen weken, en de boze geesten van hen uitvoeren.", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "2 Kon 13:3-7": "Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen. Doch Joahaz bad het aangezicht van de HEERE met ernst aan; en de HEERE verhoorde hem; want Hij zag de verdrukking van Israël, dat de koning van Syrië hen verdrukte. (Zo gaf de HEERE Israël een verlosser, zodat zij van onder de hand van de Syriërs uitkwamen; en de kinderen van Israël woonden in hun tenten, zoals voorheen.", "Jer 32:24": "Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Jes 26:19": "Uw doden zullen leven, ook mijn dode lichaam, zij zullen opstaan; waak op en juich, u die in het stof woont! Want uw dauw zal zijn als een dauw van de moeskruiden, en het land zal de overledenen uitwerpen.", "2 Sam 12:13": "Toen zei David tegen Nathan: Ik heb gezondigd tegen de HEERE! En Nathan zei tegen David: De HEERE heeft ook uw zonde weggenomen, u zult niet sterven.", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Klaagl 2:3": "Gimel. Hij heeft, in ontsteking van de toorn, de gehele hoorn van Israël afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, dat rondom verteert.", "Matt 11:3": "En zei tegen Hem: Bent U Degene, Die komen zou, of verwachten wij een ander?", "Hebr 8:12": "Want Ik zal hun ongerechtigheden genadig zijn, en aan hun zonden en hun overtredingen zal Ik geenszins meer denken.", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "Jer 33:14": "Zie, de dagen komen, spreekt de HEERE, dat Ik het goede woord zal vervullen, dat Ik tot het huis van Israël en over het huis van Juda gesproken heb.", "Ex 4:2": "En de HEERE zei tegen hem: Wat is er in uw hand? En hij zei: Een staf.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Ps 51:13": "Verwerp mij niet van Uw aangezicht, en neem Uw Heilige Geest niet van mij.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Jes 41:16": "U zult ze wannen, en de wind zal ze wegvoeren, en de stormwind zal ze verstrooien; maar u zult u verheugen in de HEERE; in de Heilige van Israël zult u zich beroemen.", "Ps 36:6": "O HEERE! Uw goedertierenheid is tot in de hemelen; Uw waarheid tot de bovenste wolken toe.", "Luk 1:73": "en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven", "Deut 9:13": "Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "1 Sam 12:22": "Want de HEERE zal Zijn volk niet verlaten, omwille van Zijn grote Naam, omdat het de HEERE behaagd heeft, u tot een volk voor Zichzelf te maken.", "Neh 9:7": "U bent die HEERE, de God, Die Abram hebt verkoren, en hem uit Ur der Chaldeeën uitgevoerd; en U hebt zijn naam gesteld Abraham.", "2 Kon 14:1": "In het tweede jaar van Joas, de zoon van Joahaz, de koning van Israël, werd Amazia koning, de zoon van Joas, de koning van Juda.", "Ef 1:6-8": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde; In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade, Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtig
