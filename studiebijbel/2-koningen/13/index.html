heid;", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Gen 21:1": "En de HEERE bezocht Sara, zoals Hij gezegd had; en de HEERE deed aan Sara, zoals Hij gesproken had.", "Deut 9:14": "Laat Mij begaan, dat Ik hen verdelg, en hun naam van onder de hemel uitwis; en Ik zal u tot een machtiger en groter volk maken dan dit is.", "2 Kon 13:2-5": "En hij deed wat kwaad was in de ogen van de HEERE; want hij wandelde na de zonden van Jerobeam, de zoon van Nebat, die Israël zondigen deed; hij week daarvan niet af. Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen. Doch Joahaz bad het aangezicht van de HEERE met ernst aan; en de HEERE verhoorde hem; want Hij zag de verdrukking van Israël, dat de koning van Syrië hen verdrukte."}, "noten": {}, "koppeling": {"1": "In het drieëntwintigste <span class=\"wl\" data-l=\"L2\" data-code=\"H8141\">jaar</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H8141\">van</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3101\">Joas</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H3101\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H274\">Ahazia</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H274\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4428\">van</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3063\">Juda</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H3063\">werd</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3059\">Joahaz</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L4\" data-cod =\"wl wl-kjv\" data-code=\"H3212\">followed</span> the <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5028\">Nebat,</span> which made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin;</span> he <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> not therefrom.", "3": "And the <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael,</span> all their <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>", "4": "And <span class=\"wl wl-kjv\" data-code=\"H3059\">Jehoahaz</span> <span class=\"wl wl-kjv\" data-code=\"H2470\">besought</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">unto</span> him: for he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H3906\">oppression</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> because the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> <span class=\"wl wl-kjv\" data-code=\"H3905\">oppressed</span> them.", "5": "(And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> a <span class=\"wl wl-kjv\" data-code=\"H3467\">saviour,</span> so that they went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in their <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> as <span class=\"wl wl-kjv\" data-code=\"H8032\">beforetime.</span>", "6": "Nevertheless they <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> not from the <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> who made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> but <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> therein: and there <span class=\"wl wl-kjv\" data-code=\"H5975\">remained</span> the <span class=\"wl wl-kjv\" data-code=\"H842\">grove</span> also in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.)</span>", "7": "Neither did he <span class=\"wl wl-kjv\" data-code=\"H7604\">leave</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> to <span class=\"wl wl-kjv\" data-code=\"H3059\">Jehoahaz</span> but <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> and <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H7273\">footmen;</span> for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> had <span class=\"wl wl-kjv\" data-code=\"H6\">destroyed</span> them, and had <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> them like the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> by <span class=\"wl wl-kjv\" data-code=\"H1758\">threshing.</span>", "8": "Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H3059\">Jehoahaz,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1369\">might,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span>", "9": "And <span class=\"wl wl-kjv\" data-code=\"H3059\">Jehoahaz</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers;</span> and they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria:</span> and <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.", "10": "In the <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> began <span class=\"wl wl-kjv\" data-code=\"H3060\">Jehoash</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3059\">Jehoahaz</span> to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> and reigned <span class=\"wl wl-kjv\" data-code=\"H8337\">sixteen</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>", "11": "And he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> he <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> not from all the <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5028\">Nebat,</span> who made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin:</span> but he <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> therein.", "12": "And the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1369\">might</span> wherewith he <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span>", "13": "And <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers;</span> and <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne:</span> and <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> with the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>", "14": "Now <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> was fallen <span class=\"wl wl-kjv\" data-code=\"H2470\">sick</span> of his <span class=\"wl wl-kjv\" data-code=\"H2483\">sickness</span> whereof he <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span> And <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> over his <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen</span> thereof.", "15": "And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> and <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> unto him <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> and <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows.</span>", "16": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H7392\">Put</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7198\">bow.</span> And he <span class=\"wl wl-kjv\" data-code=\"H7392\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon it: and <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hands.</span>", "17": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">Open</span> the <span class=\"wl wl-kjv\" data-code=\"H2474\">window</span> <span class=\"wl wl-kjv\" data-code=\"H6924\">eastward.</span> And he <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> it. Then <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3384\">Shoot.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3384\">shot.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H2671\">arrow</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H8668\">deliverance,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2671\">arrow</span> of <span class=\"wl wl-kjv\" data-code=\"H8668\">deliverance</span> from <span class=\"wl wl-kjv\" data-code=\"H758\">Syria:</span> for thou shalt <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> in <span class=\"wl wl-kjv\" data-code=\"H663\">Aphek,</span> till thou have <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> them.", "18": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> the <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> them. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">Smite</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">ground.</span> And he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">thrice,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stayed.</span>", "19": "And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth</span> with him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou shouldest have <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> or <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times;</span> then hadst thou <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> till thou hadst <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> it: whereas now thou shalt <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> but <span class=\"wl wl-kjv\" data-code=\"H7969\">thrice.</span>", "20": "And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> and they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him. And the <span class=\"wl wl-kjv\" data-code=\"H1416\">bands</span> of the <span class=\"wl wl-kjv\" data-code=\"H4124\">Moabites</span> <span class=\"wl wl-kjv\" data-code=\"H935\">invaded</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> at the coming <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> of the <span class=\"wl wl-kjv\" data-code=\"H8141\">year.</span>", "21": "And it came to pass, as they were <span class=\"wl wl-kjv\" data-code=\"H6912\">burying</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> that, behold, they <span class=\"wl wl-kjv\" data-code=\"H7200\">spied</span> a <span class=\"wl wl-kjv\" data-code=\"H1416\">band</span> of men; and they <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> into the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchre</span> of <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha:</span> and when the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> was let <span class=\"wl wl-kjv\" data-code=\"H3212\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> of <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha,</span> he <span class=\"wl wl-kjv\" data-code=\"H2421\">revived,</span> and stood <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> on his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet.</span>", "22": "But <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> <span class=\"wl wl-kjv\" data-code=\"H3905\">oppressed</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H3059\">Jehoahaz.</span>", "23": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H2603\">gracious</span> unto them, and had <span class=\"wl wl-kjv\" data-code=\"H7355\">compassion</span> on them, and had <span class=\"wl wl-kjv\" data-code=\"H6437\">respect</span> unto them, because <span class=\"wl wl-kjv\" data-code=\"H4616\">of</span> his <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> them, neither <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> he them from his <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> as <span class=\"wl wl-kjv\" data-code=\"H5704\">yet.</span>", "24": "So <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died;</span> and <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.", "25": "And <span class=\"wl wl-kjv\" data-code=\"H3060\">Jehoash</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3059\">Jehoahaz</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> which he had <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3059\">Jehoahaz</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> by <span class=\"wl wl-kjv\" data-code=\"H4421\">war.</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">Three</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times</span> did <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">beat</span> him, and <span class=\"wl wl-kjv\" data-code=\"H7725\">recovered</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');

const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
