 op Uw woord heb ik gehoopt.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "Ex 17:7": "En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?", "Jes 24:5": "Want het land is bevlekt vanwege zijn inwoners; want zij overtreden de wetten, zij veranderen de inzettingen, zij vernietigen het eeuwige verbond.", "Hand 26:14": "En toen wij allen op de grond neergevallen waren, hoorde ik een stem tot mij spreken, die zei in de Hebreeuwse taal: Saul, Saul, waarom vervolgt u Mij? Het is u hard, tegen de prikkels de hielen te slaan.", "Ps 119:166": "O HEERE! ik hoop op Uw heil, en doe Uw geboden.", "Jes 37:23-29": "Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël! Door middel van uw dienaren hebt u de Heere gehoond, en gezegd: Met de menigte van mijn wagens heb ik de hoogte van de bergen beklommen, de zijden van Libanon; en ik zal zijn hoge cederbomen en zijn beste dennenbomen omhakken; en ik zal komen tot zijn verste hoogte, in het woud van zijn mooie veld. Ik heb gegraven en het water gedronken; en ik heb met mijn voetzolen alle rivieren van de belegerde plaatsen drooggelegd.", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">Het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">gebeurde</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7969\">nu</span> <span class=\"wl\ span class=\"wl\" data-l=\"L14\" data-code=\"H5046\">en</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H5046\">zij</span> maakten <span class=\"wl\" data-l=\"L15\" data-code=\"H1697\">hem</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H1697\">de</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H1697\">woorden</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H1697\">van</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H7262\">Rabsake</span> bekend."}, "koppeling_kjv": {"1": "Now it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H7969\">third</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H1954\">Hoshea</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H425\">Elah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H271\">Ahaz</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign.</span>", "2": "<span class=\"wl wl-kjv\" data-code=\"H6242\">Twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> was he when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign;</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H8672\">nine</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> His <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> also was <span class=\"wl wl-kjv\" data-code=\"H21\">Abi,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H2148\">Zachariah.</span>", "3": "And he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> according to all that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did.</span>", "4": "He <span class=\"wl wl-kjv\" data-code=\"H5493\">removed</span> the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places,</span> and <span class=\"wl wl-kjv\" data-code=\"H7665\">brake</span> the <span class=\"wl wl-kjv\" data-code=\"H4676\">images,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H842\">groves,</span> and brake in <span class=\"wl wl-kjv\" data-code=\"H3807\">pieces</span> the <span class=\"wl wl-kjv\" data-code=\"H5178\">brasen</span> <span class=\"wl wl-kjv\" data-code=\"H5175\">serpent</span> that <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made:</span> for unto those <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> did burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> to it: and he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> it <span class=\"wl wl-kjv\" data-code=\"H5180\">Nehushtan.</span>", "5": "He <span class=\"wl wl-kjv\" data-code=\"H982\">trusted</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> so that <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him was none like him among all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> nor any that were <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him.", "6": "For he <span class=\"wl wl-kjv\" data-code=\"H1692\">clave</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> not from <span class=\"wl wl-kjv\" data-code=\"H310\">following</span> him, but <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> his <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses.</span>", "7": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was with him; and he <span class=\"wl wl-kjv\" data-code=\"H7919\">prospered</span> whithersoever he went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth:</span> and he <span class=\"wl wl-kjv\" data-code=\"H4775\">rebelled</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> him not.", "8": "He <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> even unto <span class=\"wl wl-kjv\" data-code=\"H5804\">Gaza,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1366\">borders</span> thereof, from the <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> of the <span class=\"wl wl-kjv\" data-code=\"H5341\">watchmen</span> to the <span class=\"wl wl-kjv\" data-code=\"H4013\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span>", "9": "And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah,</span> which was the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H1954\">Hoshea</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H425\">Elah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that <span class=\"wl wl-kjv\" data-code=\"H8022\">Shalmaneser</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> and <span class=\"wl wl-kjv\" data-code=\"H6696\">besieged</span> it.", "10": "And at the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> they <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> it: even in the <span class=\"wl wl-kjv\" data-code=\"H8337\">sixth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah,</span> that is the <span class=\"wl wl-kjv\" data-code=\"H8672\">ninth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H1954\">Hoshea</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> was <span class=\"wl wl-kjv\" data-code=\"H3920\">taken.</span>", "11": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> did carry <span class=\"wl wl-kjv\" data-code=\"H1540\">away</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> unto <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and <span class=\"wl wl-kjv\" data-code=\"H5148\">put</span> them in <span class=\"wl wl-kjv\" data-code=\"H2477\">Halah</span> and in <span class=\"wl wl-kjv\" data-code=\"H2249\">Habor</span> by the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H1470\">Gozan,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H4074\">Medes:</span>", "12": "Because they <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> not the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> but <span class=\"wl wl-kjv\" data-code=\"H5674\">transgressed</span> his <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> and all that <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded,</span> and would not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> them, nor <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them.", "13": "Now in the <span class=\"wl wl-kjv\" data-code=\"H702\">fourteenth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> did <span class=\"wl wl-kjv\" data-code=\"H5576\">Sennacherib</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against all the <span class=\"wl wl-kjv\" data-code=\"H1219\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H8610\">took</span> them.", "14": "And <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> to <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I have <span class=\"wl wl-kjv\" data-code=\"H2398\">offended;</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> from me: that which thou <span class=\"wl wl-kjv\" data-code=\"H5414\">puttest</span> on me will I <span class=\"wl wl-kjv\" data-code=\"H5375\">bear.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">appointed</span> unto <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold.</span>", "15": "And <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him all the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> that was <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H214\">treasures</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>", "16": "At that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> did <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> cut <span class=\"wl wl-kjv\" data-code=\"H7112\">off</span> the gold from the <span class=\"wl wl-kjv\" data-code=\"H1817\">doors</span> of the <span class=\"wl wl-kjv\" data-code=\"H1964\">temple</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H547\">pillars</span> which <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> had <span class=\"wl wl-kjv\" data-code=\"H6823\">overlaid,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria.</span>", "17": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H8661\">Tartan</span> and <span class=\"wl wl-kjv\" data-code=\"H7249\">Rabsaris</span> and <span class=\"wl wl-kjv\" data-code=\"H7262\">Rabshakeh</span> from <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish</span> to <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> with a <span class=\"wl wl-kjv\" data-code=\"H3515\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2426\">host</span> against <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> And they went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> And when they were come <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by the <span class=\"wl wl-kjv\" data-code=\"H8585\">conduit</span> of the <span class=\"wl wl-kjv\" data-code=\"H5945\">upper</span> <span class=\"wl wl-kjv\" data-code=\"H1295\">pool,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H4546\">highway</span> of the <span class=\"wl wl-kjv\" data-code=\"H3526\">fuller's</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">field.</span>", "18": "And when they had <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> there came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to them <span class=\"wl wl-kjv\" data-code=\"H471\">Eliakim</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah,</span> which was over the <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and <span class=\"wl wl-kjv\" data-code=\"H7644\">Shebna</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe,</span> and <span class=\"wl wl-kjv\" data-code=\"H3098\">Joah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H623\">Asaph</span> the <span class=\"wl wl-kjv\" data-code=\"H2142\">recorder.</span>", "19": "And <span class=\"wl wl-kjv\" data-code=\"H7262\">Rabshakeh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H559\">Speak</span> ye now to <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> What <span class=\"wl wl-kjv\" data-code=\"H986\">confidence</span> is this wherein thou <span class=\"wl wl-kjv\" data-code=\"H982\">trustest?</span>", "20": "Thou <span class=\"wl wl-kjv\" data-code=\"H559\">sayest,</span> (but they are but <span class=\"wl wl-kjv\" data-code=\"H8193\">vain</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">words,)</span> I have <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> and <span class=\"wl wl-kjv\" data-code=\"H1369\">strength</span> for the <span class=\"wl wl-kjv\" data-code=\"H4421\">war.</span> Now on whom dost thou <span class=\"wl wl-kjv\" data-code=\"H982\">trust,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H4775\">rebellest</span> against me?", "21": "Now, behold, thou <span class=\"wl wl-kjv\" data-code=\"H982\">trustest</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4938\">staff</span> of this <span class=\"wl wl-kjv\" data-code=\"H7533\">bruised</span> <span class=\"wl wl-kjv\" data-code=\"H7070\">reed,</span> even upon <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> on which if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5564\">lean,</span> it will <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into his <span class=\"wl wl-kjv\" data-code=\"H3709\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H5344\">pierce</span> it: so is <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> unto all that <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> on him.", "22": "But if ye <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto me, We <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> is not that he, whose high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> and whose <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> hath taken <span class=\"wl wl-kjv\" data-code=\"H5493\">away,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> Ye shall <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> this <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem?</span>", "23": "Now therefore, I pray thee, give <span class=\"wl wl-kjv\" data-code=\"H6148\">pledges</span> to my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> thee two <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> if thou be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> on thy part to <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H7392\">riders</span> upon them.", "24": "How then wilt thou turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6996\">least</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and put thy <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> on <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> for <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> and for <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen?</span>", "25": "Am I now come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H1107\">without</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> against this <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> it? The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to me, Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> it.", "26": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H471\">Eliakim</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H7644\">Shebna,</span> and <span class=\"wl wl-kjv\" data-code=\"H3098\">Joah,</span> unto <span class=\"wl wl-kjv\" data-code=\"H7262\">Rabshakeh,</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">Speak,</span> I pray thee, to thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> in the Syrian <span class=\"wl wl-kjv\" data-code=\"H762\">language;</span> for we <span class=\"wl wl-kjv\" data-code=\"H8085\">understand</span> it: and <span class=\"wl wl-kjv\" data-code=\"H1696\">talk</span> not with us in the Jews' <span class=\"wl wl-kjv\" data-code=\"H3066\">language</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that are on the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall.</span>", "27": "But <span class=\"wl wl-kjv\" data-code=\"H7262\">Rabshakeh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Hath my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me to thy <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> and to thee, to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">words?</span> hath he not sent me to the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> on the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> their own <span class=\"wl wl-kjv\" data-code=\"H6675\">dung,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> their own <span class=\"wl wl-kjv\" data-code=\"H4325\">piss</span> with you?", "28": "Then <span class=\"wl wl-kjv\" data-code=\"H7262\">Rabshakeh</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">loud</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> in the Jews' <span class=\"wl wl-kjv\" data-code=\"H3066\">language,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria:</span>", "29": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Let not <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H5377\">deceive</span> you: for he shall not be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> you out of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span>", "30": "Neither let <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> make you <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H5337\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> us, and this <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria.</span>", "31": "<span class=\"wl wl-kjv\" data-code=\"H8085\">Hearken</span> not to <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah:</span> for thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">Make</span> an agreement with me by a <span class=\"wl wl-kjv\" data-code=\"H1293\">present,</span> and come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to me, and then <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> ye every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of his own <span class=\"wl wl-kjv\" data-code=\"H1612\">vine,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of his fig <span class=\"wl wl-kjv\" data-code=\"H8384\">tree,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> ye every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of his <span class=\"wl wl-kjv\" data-code=\"H953\">cistern:</span>", "32": "Until I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and take you <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> to a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> like your own <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1715\">corn</span> and <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3323\">oil</span> <span class=\"wl wl-kjv\" data-code=\"H2132\">olive</span> and of <span class=\"wl wl-kjv\" data-code=\"H1706\">honey,</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> and not <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> not unto <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah,</span> when he <span class=\"wl wl-kjv\" data-code=\"H5496\">persuadeth</span> you, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> us.", "33": "Hath <span class=\"wl wl-kjv\" data-code=\"H376\">any</span> of the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> at <span class=\"wl wl-kjv\" data-code=\"H5337\">all</span> his <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria?</span>", "34": "Where are the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of <span class=\"wl wl-kjv\" data-code=\"H2574\">Hamath,</span> and of <span class=\"wl wl-kjv\" data-code=\"H774\">Arpad?</span> where are the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of <span class=\"wl wl-kjv\" data-code=\"H5617\">Sepharvaim,</span> <span class=\"wl wl-kjv\" data-code=\"H2012\">Hena,</span> and <span class=\"wl wl-kjv\" data-code=\"H5755\">Ivah?</span> have they <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> out of mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand?</span>", "35": "Who are they among all the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">countries,</span> that have <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> their <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> out of mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> should <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> out of mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand?</span>", "36": "But the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> held their <span class=\"wl wl-kjv\" data-code=\"H2790\">peace,</span> and <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> him not a <span class=\"wl wl-kjv\" data-code=\"H1697\">word:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> was, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">Answer</span> him not.", "37": "Then <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H471\">Eliakim</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah,</span> which was over the <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and <span class=\"wl wl-kjv\" data-code=\"H7644\">Shebna</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe,</span> and <span class=\"wl wl-kjv\" data-code=\"H3098\">Joah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H623\">Asaph</span> the <span class=\"wl wl-kjv\" data-code=\"H2142\">recorder,</span> to <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> with their <span class=\"wl wl-kjv\" data-code=\"H899\">clothes</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">rent,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H7262\">Rabshakeh.</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
