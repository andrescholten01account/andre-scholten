n/1/"}, {"naam": "Hebreeën", "href": "../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Het gebeurde nu in het derde jaar van Hosea, de zoon van Ela, de koning van Israël, *dat* Hizkia koning werd, de zoon van Achaz, koning van Juda.", "2": "Vijfentwintig jaar was hij oud, toen hij koning werd, en hij regeerde negenentwintig jaar te Jeruzalem, en de naam van zijn moeder was Abi, een dochter van Zacharia.", "3": "En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader David gedaan had.", "4": "Hij nam de hoogten weg, en brak de opgerichte beelden, en roeide de bossen uit; en hij verbrijzelde de koperen slang, die Mozes gemaakt had, omdat de kinderen van Israël tot die dagen toe daarvoor gerookt hadden; en hij noemde die Nehustan.", "5": "Hij vertrouwde op de HEERE, de God van Israël, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die vóór hem geweest waren.", "6": "Want hij kleefde de HEERE aan; hij week niet van Hem af om Hem na te volgen, en hij hield Zijn geboden, die de HEERE aan Mozes geboden had.", "7": "Zo was de HEERE met hem; overal waar hij heen trok, handelde hij kloek; daartoe viel hij af van de koning van Assyrië, zodat hij hem niet diende.", "8": "Hij sloeg de Filistijnen tot Gaza toe, en haar landpalen, van de wachttoren af tot de vaste steden toe.", "9": "Het gebeurde nu in het vierde jaar van koning Hizkia (dat was het zevende jaar van Hosea, de zoon van Ela, de koning van Israël) dat Salmaneser, de koning van Assyrië, optrok tegen Samaria, en het belegerde.", "10": "En zij namen het in na drie jaar, in het zesde jaar van Hizkia; dat was het negende jaar van Hosea, de koning van Israël, toen Samaria ingenomen werd.", "11": "En de koning van Assyrië voerde Israël weg naar Assyrië, en liet hen wonen in Halah, en in Habor, bij de rivier Gozan, en in de steden der Meden.", "12": "Omdat zij de stem van de HEERE, hun God, niet gehoorzaam waren geweest, maar Zijn verbond overtreden hadden; *en* al wat Mozes, de knecht van de HEERE, geboden had, dat hadden zij niet gehoord, noch gedaan.", "13": "Maar in het veertiende jaar van koning Hizkia kwam Sanherib, de koning van Assyrië, op tegen alle vaste steden van Juda, en nam ze in.", "14": "Toen zond Hizkia, de koning van Juda, tot de koning van Assyrië, naar Lachis, en zei: Ik heb gezondigd, keer af van mij; wat u mij oplegt, zal ik dragen. Toen legde de koning van Assyrië Hizkia, de koning van Juda, driehonderd talenten van het zilver en dertig talenten van het goud op.", "15": "Zo gaf Hizkia al het zilver, dat gevonden werd in het huis van de HEERE, en in de schatten van het huis van de koning.", "16": "Te dien tijde sneed Hizkia *het goud* af van de deuren van de tempel van de HEERE, en van de posten, die Hizkia, de koning van Juda, had laten overtrekken, en gaf dat aan de koning van Assyrië.", "17": "Evenwel zond de koning van Assyrië Tartan, en Rabsaris, en Rabsake, van Lachis naar de koning Hizkia, met een zwaar leger naar Jeruzalem; en zij trokken op, en kwamen naar Jeruzalem. En toen zij optrokken en gekomen waren, bleven zij staan bij de watergang van de opperste vijver, die bij de hoge weg van het veld der vollers is.", "18": "En zij riepen naar de koning; toen ging tot hen uit Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier.", "19": "En Rabsake zei tot hen: Zeg nu tot Hizkia: Zo zegt de grote koning, de koning van Assyrië: Wat vertrouwen is dit, waarmee u vertrouwt?", "20": "U zegt (doch het is een woord der lippen): Er is raad en macht tot de oorlog; op wie vertrouwt u nu, dat u tegen mij rebelleert?", "21": "Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "22": "Maar als u tot mij zegt: Wij vertrouwen op de HEERE, onze God; is Hij het niet, Wiens hoogten en Wiens altaren Hizkia weggenomen heeft, en tot Juda en tot Jeruzalem gezegd heeft: Voor dit altaar zult u zich buigen te Jeruzalem?", "23": "Nu dan, wed toch met mijn heer, de koning van Assyrië; en ik zal u tweeduizend paarden geven, als u de ruiters daarop zult kunnen geven.", "24": "Hoe zou u dan het aangezicht van één vorst van de geringste knechten van mijn heer afkeren? Maar u vertrouwt op Egypte, om de wagens en om de ruiters.", "25": "Nu, ben ik zonder de HEERE opgetrokken tegen deze plaats, om die te verderven? De HEERE heeft tot mij gezegd: Trek op tegen dat land, en verderf het.", "26": "Toen zei Eljakim, de zoon van Hilkia, en Sebna, en Joah tot Rabsake: Spreek toch tot uw knechten in het Syrisch, want wij verstaan het *wel*; en spreek met ons niet in het Joods, voor de oren van het volk, dat op de muur is.", "27": "Maar Rabsake zei tot hen: Heeft mijn heer mij tot uw heer en tot u gezonden, om deze woorden te spreken? Is het niet tot de mannen, die op de muur zitten, dat zij met u hun eigen drek eten, en hun eigen water drinken zullen?", "28": "Zo stond Rabsake, en riep met luide stem in het Joods; en hij sprak en zei: Hoort het woord van de grote koning, de koning van Assyrië!", "29": "Zo zegt de koning: Laat Hizkia u niet bedriegen: want hij zal u niet kunnen redden uit zijn hand.", "30": "Daartoe: laat Hizkia u niet doen vertrouwen op de HEERE, door te zeggen: De HEERE zal ons zeker redden, en deze stad zal niet in de hand van de koning van Assyrië gegeven worden.", "31": "Hoort naar Hizkia niet; want zo zegt de koning van Assyrië: Handelt met mij door een geschenk, en komt tot mij uit, en eet, ieder van zijn wijnstok, en ieder van zijn vijgenboom; en drinkt, ieder het water van zijn bornput;", "32": "Totdat ik kom, en u haal in een land, als uw land, een land van koren en van most, een land van brood en van wijngaarden, een land van olijven, van olie en van honing; zo zult u leven en niet sterven; en hoort niet naar Hizkia, want hij hitst u op, door te zeggen: De HEERE zal ons redden.", "33": "Hebben de goden der volken, ieder zijn land, ooit gered uit de hand van de koning van Assyrië?", "34": "Waar zijn de goden van Hamath, en van Arpad? Waar zijn de goden van Sefarvaim, Hena en Ivva? Ja, hebben zij Samaria uit mijn hand gered?", "35": "Welke zijn ze onder alle goden der landen, die hun land uit mijn hand gered hebben, dat de HEERE Jeruzalem uit mijn hand zou redden?", "36": "Doch het volk zweeg stil en antwoordde hem niet één woord; want het gebod van de koning was, en luidde: U zult hem niet antwoorden.", "37": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, tot Hizkia, met gescheurde kleren; en zij maakten hem de woorden van Rabsake bekend."}, "SV": {"1": "Het geschiedde nu in het derde jaar van Hosea, den zoon van Ela, den koning van Israël, *dat* Hizkia koning werd, de zoon van Achaz, koning van Juda.", "2": "Vijf en twintig jaren was hij oud, toen hij koning werd, en hij regeerde negen en twintig jaren te Jeruzalem, en de naam zijner moeder was Abi, een dochter van Zacharia.", "3": "En hij deed dat recht was in de ogen des HEEREN, naar alles, wat zijn vader David gedaan had.", "4": "Hij nam de hoogten weg, en brak de opgerichte beelden, en roeide de bossen uit; en hij verbrijzelde de koperen slang, die Mozes gemaakt had, omdat de kinderen Israëls tot die dagen toe haar gerookt hadden; en hij noemde haar Nehustan.", "5": "Hij betrouwde op den HEERE, den God Israëls, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die voor hem geweest waren.", "6": "Want hij kleefde den HEERE aan; hij week niet van Hem na te volgen, en hij hield Zijn geboden, die de HEERE aan Mozes geboden had.", "7": "Zo was de HEERE met hem; overal, waar hij henen uittrok, handelde hij kloekelijk; daartoe viel hij af van den koning van Assyrië, dat hij hem niet diende.", "8": "Hij sloeg de Filistijnen tot Gaza toe, en haar landpalen, van den wachttoren af tot de vaste steden toe.", "9": "Het geschiedde nu in het vierde jaar van den koning Hizkia ( hetwelk was het zevende jaar van Hosea, den zoon van Ela, den koning van Israël) dat Salmaneser, de koning van Assyrië, opkwam tegen Samaria, en haar belegerde.", "10": "En zij namen haar in ten einde van drie jaren, in het zesde jaar van Hizkia; het was het negende jaar van Hosea, den koning van Israël, als Samaria ingenomen werd.", "11": "En de koning van Assyrië voerde Israël weg naar Assyrië, en deed hen leiden in Halah, en in Habor, bij de rivier Gozan, en in de steden der Meden.", "12": "Daarom dat zij de stem des HEEREN, huns Gods, niet waren gehoorzaam geweest, maar Zijn verbond overtreden hadden; *en* al wat Mozes, de knecht des HEEREN, geboden had, dat hadden zij niet gehoord, noch gedaan.", "13": "Maar in het veertiende jaar van den koning Hizkia kwam Sanherib, de koning van Assyrië, op tegen alle vaste steden van Juda, en nam ze in.", "14": "Toen zond Hizkia, de koning van Juda, tot den koning van Assyrië, naar Lachis, zeggende: Ik heb gezondigd, keer af van mij, wat gij mij opleggen zult, zal ik dragen. Toen leide de koning van Assyrië Hizkia, den koning van Juda, driehonderd talenten zilvers, en dertig talenten gouds op.", "15": "Alzo gaf Hizkia al het zilver, dat gevonden werd in het huis des HEEREN, en in de schatten van het huis des konings.", "16": "Te dier tijd sneed Hizkia *het* *goud* af van de deuren van den tempel des HEEREN, en van de posten, die Hizkia, de koning van Juda, had laten overtrekken, en gaf dat aan de koning van Assyrië.", "17": "Evenwel zond de koning van Assyrië Tartan, en Rabsaris, en Rabsake, van Lachis tot den koning Hizkia, met een zwaar heir naar Jeruzalem; en zij togen op, en kwamen naar Jeruzalem. En als zij optogen en gekomen waren, bleven zij staan bij den watergang des oppersten vijvers, welke is bij den hogen weg van het veld des vollers.", "18": "En zij riepen tot den koning; zo ging tot hen uit Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier.", "19": "En Rabsake zeide tot hen: Zegt nu tot Hizkia: Zo zegt de grote koning, de koning van Assyrië: Wat vertrouwen is dit, waarmede gij vertrouwt?", "20": "Gij zegt ( doch het is een woord der lippen): Er is raad en macht tot den oorlog; op wien vertrouwt gij nu, dat gij tegen mij rebelleert?", "21": "Zie nu, vertrouwt gij u op dien gebroken rietstaf, op Egypte, op denwelken zo iemand leunt, zo zal hij in zijn hand gaan, en die doorboren; alzo is Farao, de koning van Egypte, al dengenen, die op hem vertrouwen.", "22": "Maar zo gij tot mij zegt: Wij vertrouwen op den HEERE, onzen God; is Hij die niet, Wiens hoogten en Wiens altaren Hizkia weggenomen heeft, en tot Juda en tot Jeruzalem gezegd heeft: Voor dit altaar zult gij u buigen te Jeruzalem?", "23": "Nu dan, wed toch met mijn heer, den koning van Assyrië; en ik zal u twee duizend paarden geven, zo gij voor u de ruiters daarop zult kunnen geven.", "24": "Hoe zoudt gij dan het aangezicht van een enigen vorst van de geringste knechten mijns heren afkeren? Maar gij vertrouwt op Egypte, om de wagenen en om de ruiteren.", "25": "Nu, ben ik zonder den HEERE opgetogen tegen deze plaats, om die te verderven? De HEERE heeft tot mij gezegd: Trek op tegen dat land, en verderf het.", "26": "Toen zeide Eljakim, de zoon van Hilkia, en Sebna, en Joah tot Rabsake: Spreek toch tot uw knechten in het Syrisch, want wij verstaan het *wel*; en spreek met ons niet in het Joods, voor de oren des volks, dat op den muur is.", "27": "Maar Rabsake zeide tot hen: Heeft mijn heer mij tot uw heer en tot u gezonden, om deze woorden te spreken? Is het niet tot de mannen, die op den muur zitten, dat zij met ulieden hun drek eten, en hun water drinken zullen?", "28": "Alzo stond Rabsake, en riep met luider stem in het Joods; en hij sprak en zeide: Hoort het woord des groten konings, des konings van Assyrië!", "29": "Zo zegt de koning: Dat Hizkia u niet bedriege: want hij zal u niet kunnen redden uit zijn hand.", "30": "Daartoe dat Hizkia u niet doe vertrouwen op den HEERE, zeggende: De HEERE zal ons zekerlijk redden, en deze stad zal niet in de hand van den koning van Assyrië gegeven worden.", "31": "Hoort naar Hizkia niet; want zo zegt de koning van Assyrië: Handelt met mij door een geschenk, en komt tot mij uit, en eet, een ieder *van* zijn wijnstok, en een ieder *van* zijn vijgeboom; en drinkt een ieder het water zijns bornputs;", "32": "Totdat ik kom, en u haal in een land, als ulieder land, een land van koren en van most, een land van brood en van wijngaarden, een land van olijven, van olie en van honig; zo zult gij leven en niet sterven; en hoort niet naar Hizkia, want hij hitst u op, zeggende: De HEERE zal ons redden.", "33": "Hebben de goden der volken, ieder zijn land, enigszins gered uit de hand van den koning van Assyrië?", "34": "Waar zijn de goden van Hamath, en van Arpad? Waar zijn de goden van Sefarvaim, Hena en Ivva? Ja, hebben zij Samaria uit mijn hand gered?", "35": "Welke zijn ze onder alle goden der landen, die hun land uit mijn hand gered hebben, dat de HEERE Jeruzalem uit mijn hand redden zou?", "36": "Doch het volk zweeg stil en antwoordde hem niet een woord; want het gebod des konings was, zeggende: Gij zult hem niet antwoorden.", "37": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, tot Hizkia, met gescheurde klederen; en zij gaven hem de woorden van Rabsake te kennen."}, "KJV": {"1": "Now it came to pass in the third year of Hoshea son of Elah king of Israel, that Hezekiah the son of Ahaz king of Judah began to reign.", "2": "Twenty and five years old was he when he began to reign; and he reigned twenty and nine years in Jerusalem. His mother's name also was Abi, the daughter of Zachariah.", "3": "And he did that which was right in the sight of the LORD, according to all that David his father did.", "4": "He removed the high places, and brake the images, and cut down the groves, and brake in pieces the brasen serpent that Moses had made: for unto those days the children of Israel did burn incense to it: and he called it Nehushtan.", "5": "He trusted in the LORD God of Israel; so that after him was none like him among all the kings of Judah, nor any that were before him.", "6": "For he clave to the LORD, and departed not from following him, but kept his commandments, which the LORD commanded Moses.", "7": "And the LORD was with him; and he prospered whithersoever he went forth: and he rebelled against the king of Assyria, and served him not.", "8": "He smote the Philistines, even unto Gaza, and the borders thereof, from the tower of the watchmen to the fenced city.", "9": "And it came to pass in the fourth year of king Hezekiah, which was the seventh year of Hoshea son of Elah king of Israel, that Shalmaneser king of Assyria came up against Samaria, and besieged it.", "10": "And at the end of three years they took it: even in the sixth year of Hezekiah, that is the ninth year of Hoshea king of Israel, Samaria was taken.", "11": "And the king of Assyria did carry away Israel unto Assyria, and put them in Halah and in Habor by the river of Gozan, and in the cities of the Medes:", "12": "Because they obeyed not the voice of the LORD their God, but transgressed his covenant, and all that Moses the servant of the LORD commanded, and would not hear them, nor do them.", "13": "Now in the fourteenth year of king Hezekiah did Sennacherib king of Assyria come up against all the fenced cities of Judah, and took them.", "14": "And Hezekiah king of Judah sent to the king of Assyria to Lachish, saying, I have offended; return from me: that which thou puttest on me will I bear. And the king of Assyria appointed unto Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.", "15": "And Hezekiah gave him all the silver that was found in the house of the LORD, and in the treasures of the king's house.", "16": "At that time did Hezekiah cut off the gold from the doors of the temple of the LORD, and from the pillars which Hezekiah king of Judah had overlaid, and gave it to the king of Assyria.", "17": "And the king of Assyria sent Tartan and Rabsaris and Rabshakeh from Lachish to king Hezekiah with a great host against Jerusalem. And they went up and came to Jerusalem. And when they were come up, they came and stood by the conduit of the upper pool, which is in the highway of the fuller's field.", "18": "And when they had called to the king, there came out to them Eliakim the son of Hilkiah, which was over the household, and Shebna the scribe, and Joah the son of Asaph the recorder.", "19": "And Rabshakeh said unto them, Speak ye now to Hezekiah, Thus saith the great king, the king of Assyria, What confidence is this wherein thou trustest?", "20": "Thou sayest, (but they are but vain words,) I have counsel and strength for the war. Now on whom dost thou trust, that thou rebellest against me?", "21": "Now, behold, thou trustest upon the staff of this bruised reed, even upon Egypt, on which if a man lean, it will go into his hand, and pierce it: so is Pharaoh king of Egypt unto all that trust on him.", "22": "But if ye say unto me, We trust in the LORD our God: is not that he, whose high places and whose altars Hezekiah hath taken away, and hath said to Judah and Jerusalem, Ye shall worship before this altar in Jerusalem?", "23": "Now therefore, I pray thee, give pledges to my lord the king of Assyria, and I will deliver thee two thousand horses, if thou be able on thy part to set riders upon them.", "24": "How then wilt thou turn away the face of one captain of the least of my master's servants, and put thy trust on Egypt for chariots and for horsemen?", "25": "Am I now come up without the LORD against this place to destroy it? The LORD said to me, Go up against this land, and destroy it.", "26": "Then said Eliakim the son of Hilkiah, and Shebna, and Joah, unto Rabshakeh, Speak, I pray thee, to thy servants in the Syrian language; for we understand it: and talk not with us in the Jews' language in the ears of the people that are on the wall.", "27": "But Rabshakeh said unto them, Hath my master sent me to thy master, and to thee, to speak these words? hath he not sent me to the men which sit on the wall, that they may eat their own dung, and drink their own piss with you?", "28": "Then Rabshakeh stood and cried with a loud voice in the Jews' language, and spake, saying, Hear the word of the great king, the king of Assyria:", "29": "Thus saith the king, Let not Hezekiah deceive you: for he shall not be able to deliver you out of his hand:", "30": "Neither let Hezekiah make you trust in the LORD, saying, The LORD will surely deliver us, and this city shall not be delivered into the hand of the king of Assyria.", "31": "Hearken not to Hezekiah: for thus saith the king of Assyria, Make an agreement with me by a present, and come out to me, and then eat ye every man of his own vine, and every one of his fig tree, and drink ye every one the waters of his cistern:", "32": "Until I come and take you away to a land like your own land, a land of corn and wine, a land of bread and vineyards, a land of oil olive and of honey, that ye may live, and not die: and hearken not unto Hezekiah, when he persuadeth you, saying, The LORD will deliver us.", "33": "Hath any of the gods of the nations delivered at all his land out of the hand of the king of Assyria?", "34": "Where are the gods of Hamath, and of Arpad? where are the gods of Sepharvaim, Hena, and Ivah? have they delivered Samaria out of mine hand?", "35": "Who are they among all the gods of the countries, that have delivered their country out of mine hand, that the LORD should deliver Jerusalem out of mine hand?", "36": "But the people held their peace, and answered him not a word: for the king's commandment was, saying, Answer him not.", "37": "Then came Eliakim the son of Hilkiah, which was over the household, and Shebna the scribe, and Joah the son of Asaph the recorder, to Hezekiah with their clothes rent, and told him the words of Rabshakeh."}}, "tsk": {"1": [{"kopje": "in het derde", "refs": ["2 Kon 18:9", "2 Kon 15:30", "2 Kon 17:1"] href": "../../2-koningen/12/#v10", "ref": "2 Kon 12:10-12", "svLabel": null}, {"disp": "2 Kon 18:18", "href": "../../2-koningen/18/#v18", "ref": "2 Kon 18:18", "svLabel": null}, {"disp": "2 Kon 18:37", "href": "../../2-koningen/18/#v37", "ref": "2 Kon 18:37", "svLabel": null}, {"disp": "2 Kon 22:1-14", "href": "../../2-koningen/22/#v1", "ref": "2 Kon 22:1-14", "svLabel": null}, {"disp": "1 Kron 27:32", "href": "../../1-kronieken/27/#v32", "ref": "1 Kron 27:32", "svLabel": null}, {"disp": "Est 3:12", "href": "../../esther/3/#v12", "ref": "Est 3:12", "svLabel": null}, {"disp": "Est 8:9", "href": "../../esther/8/#v9", "ref": "Est 8:9", "svLabel": null}], "kinderen": []}]}, {"topic": "Shebna (shebnah)", "href": "../../nave/s/#t-shebna-shebnah", "kinderen": [{"label": "1. A scribe of Hezekiah", "href": "../../nave/s/?hl=2Kgs.18.37#i18605", "refs": [{"disp": "2 Kon 18:18", "href": "../../2-koningen/18/#v18", "ref": "2 Kon 18:18", "svLabel": null}, {"disp": "2 Kon 18:26", "href": "../../2-koningen/18/#v26", "ref": "2 Kon 18:26", "svLabel": null}, {"disp": "2 Kon 18:37", "href": "../../2-koningen/18/#v37", "ref": "2 Kon 18:37", "svLabel": null}, {"disp": "2 Kon 19:2", "href": "../../2-koningen/19/#v2", "ref": "2 Kon 19:2", "svLabel": null}, {"disp": "Jes 36:3", "href": "../../jesaja/36/#v3", "ref": "Jes 36:3", "svLabel": null}, {"disp": "Jes 36:11", "href": "../../jesaja/36/#v11", "ref": "Jes 36:11", "svLabel": null}, {"disp": "Jes 36:22", "href": "../../jesaja/36/#v22", "ref": "Jes 36:22", "svLabel": null}, {"disp": "Jes 37:2", "href": "../../jesaja/37/#v2", "ref": "Jes 37:2", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ps 119:60": "Ik heb gehaast, en niet vertraagd Uw geboden te onderhouden.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "2 Kon 20:20": "Het overige nu van de geschiedenis van Hizkia, en al zijn macht, en hoe hij de vijver en de watergang gemaakt heeft, en water in de stad gebracht heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "Jes 36:18-20": "Laat Hizkia u niet verleiden, door te zeggen: De HEERE zal ons redden; hebben de goden van de volken, ieder zijn eigen land, gered uit de hand van de koning van Assyrië? Waar zijn de goden van Hamath en Arpad? Waar zijn de goden van Sefarvaim? Hebben zij ook Samaria uit mijn hand gered? Welke zijn er onder al de goden van deze landen, die hun land uit mijn hand gered hebben, zodat de HEERE Jeruzalem uit mijn hand zou redden?", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Pred 2:11": "Toen wendde ik mij tot al mijn werken die mijn handen gemaakt hadden, en tot de arbeid die ik met inspanning had verricht; zie, het was allemaal ijdelheid en kwelling van de geest, en daarin was geen voordeel onder de zon.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Jer 3:8": "En Ik zag, toen Ik vanwege alles waarin het afgekeerde Israël overspel had gepleegd, haar had weggestuurd en haar een scheidbrief had gegeven, dat de trouweloze Juda, haar zuster, niet vreesde, maar wegging en zelf ook hoereerde.", "Jes 51:17-20": "Word wakker, word wakker, sta op, Jeruzalem! U die gedronken hebt uit de hand van de HEERE de beker van Zijn grimmigheid; de droesem van de beker van de zwijmeling hebt u gedronken, ja, uitgezogen. Er is niemand van al de kinderen, die zij gebaard heeft, die haar zachtjes leidt; en niemand van al de kinderen, die zij opgevoed heeft, die haar bij de hand grijpt. Deze twee dingen zijn u overkomen, wie heeft medelijden met u? Er is verwoesting, en verbreking, en honger, en zwaard, door wie zal Ik u troosten?", "2 Kron 29:6": "Want onze vaders hebben overtreden, en gedaan wat kwaad was in de ogen van de HEERE, onze God, en hebben Hem verlaten, en zij hebben hun gezicht van de tabernakel van de HEERE afgewend, en hebben Hem de rug toegekeerd.", "1 Kon 20:2": "En hij zond boden naar Achab, de koning van Israël, in de stad.", "Job 15:31": "Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "2 Kon 23:25": "En voor hem was er geen koning zijns gelijke, die zich tot de HEERE, met heel zijn hart, en met heel zijn ziel, en met heel zijn kracht, naar heel de wet van Mozes, bekeerd had; en na hem stond zijns gelijke niet op.", "Openb 3:4": "Toch hebt u enkele weinige namen ook in Sardis, die hun kleren niet bevlekt hebben, en zij zullen met Mij wandelen in witte kleren, omdat zij het waard zijn.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "2 Sam 8:6": "En David legde bezettingen in Syrië van Damaskus, en de Syriërs werden David tot knechten, en zij brachten geschenken; en de HEERE behoedde David overal waar hij heentrok.", "Spr 29:25": "De angst voor mensen legt een strik; maar wie op de HEERE vertrouwt, zal veilig gesteld worden.", "2 Kon 19:22-37": "Wie hebt u gehoond en gelasterd? En tegen wie hebt u de stem verheven, en uw ogen omhoog opgeheven? Tegen de Heilige van Israël! Door uw boden hebt u de Heere gehoond, en gezegd: Ik heb met de menigte van mijn wagens de hoogten van de bergen beklommen, de flanken van de Libanon; en ik zal zijn hoge cederbomen en zijn uitgelezen dennenbomen omhakken; en ik zal komen tot in zijn verste herberg, in het woud van zijn mooie veld. Ik heb gegraven en vreemd water gedronken; en ik heb met mijn voetzolen alle rivieren van de belegerde plaatsen droog gemaakt.", "Ps 43:5": "Wat buigt u zich neer, o mijn ziel! En wat bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de rijke Verlossing van mijn aangezicht, en mijn God.", "Ezech 20:29": "En Ik zei tegen hen: Wat is die hoogte, waarheen u gaat? Toch wordt de naam daarvan tot op deze dag hoogte genoemd.", "Ps 119:168": "Ik onderhoud Uw bevelen en Uw getuigenissen, want al mijn wegen zijn voor U.", "2 Kron 32:18": "En zij riepen met luide stem, in het Joods, tegen het volk van Jeruzalem dat op de muur was, om hen bevreesd te maken en te verontrusten, om zo de stad te kunnen innemen.", "Ps 62:6-8": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "Ps 70:6": "Doch ik ben ellendig en nooddruftig; o God, haast U tot mij; Gij zijt mijn Hulp en mijn Bevrijder; HEERE, vertoef niet!", "2 Kon 18:3-7": "En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader David gedaan had. Hij nam de hoogten weg, en brak de opgerichte beelden, en roeide de bossen uit; en hij verbrijzelde de koperen slang, die Mozes gemaakt had, omdat de kinderen van Israël tot die dagen toe daarvoor gerookt hadden; en hij noemde die Nehustan. Hij vertrouwde op de HEERE, de God van Israël, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die vóór hem geweest waren.", "Ps 42:6": "Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Ps 39:8": "En nu, wat verwacht ik, Heere? Mijn hoop is op U.", "Ps 83:2-13": "O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "Ezech 17:17": "Ook zal farao, met een groot leger en een grote menigte van het krijgsvolk, niets voor hem uitrichten in de oorlog, wanneer men een wal zal opwerpen, en wanneer men vestingen zal bouwen, om veel mensenlevens uit te roeien.", "2 Kron 33:14": "En hierna bouwde hij de buitenmuur bij de stad van David, aan de westzijde van Gihon in het dal, tot aan de ingang van de Vispoort, en omsingelde Ofel, en verhoogde die zeer; hij legde ook legeroversten in alle vaste steden in Juda.", "Neh 1:5": "En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Jer 2:21": "Ik had u toch geplant, een edele wijnstok, een geheel getrouw zaad; hoe bent u Mij dan veranderd in verbasterde ranken van een vreemde wijnstok?", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Ps 138:7": "Als ik wandel in het midden van de benauwdheid, maakt Gij mij levend; Uw hand strekt Gij uit tegen de toorn van mijn vijanden, en Uw rechterhand behoudt mij.", "Hos 14:2": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid.", "Ps 17:6": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden.", "Ps 20:9": "Zij hebben zich gekromd, en zijn gevallen; maar wij zijn opgestaan en staande gebleven.", "Klaagl 4:5": "He. Die lekkernijen aten, komen nu om op de straten; die in karmozijn zijn grootgebracht, omhelzen de vuilnishoop.", "Jer 37:7": "Zo zegt de HEERE, de God van Israël: Zo zult u zeggen tegen de koning van Juda, die u naar Mij gestuurd heeft om Mij te raadplegen: Zie, het leger van Farao, dat u ter hulp is uitgetrokken, zal terugkeren naar zijn land, naar Egypte;", "2 Kor 6:4": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden,", "Ps 119:105": "Nun. Uw woord is een lamp voor mijn voet, en een licht voor mijn pad.", "2 Sam 23:5": "Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.", "Hos 8:14": "Want Israël heeft zijn Maker vergeten en tempels gebouwd, en Juda heeft versterkte steden vermenigvuldigd; maar Ik zal een vuur zenden in zijn steden, dat zal hun paleizen verteren.", "Ps 71:9": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.", "Deut 11:12": "Een land, dat de HEERE, uw God, verzorgt; de ogen van de HEERE, uw God, zijn er voortdurend op gericht, van het begin van het jaar tot het einde van het jaar.", "Ezra 9:14": "zullen wij dan weer teruggaan om Uw geboden te vernietigen, en ons te verzwageren met de volken van deze gruwelen? Zou U dan niet tegen ons toornen tot verterens toe, zodat er geen overblijfsel noch ontkoming zou zijn?", "Jes 10:9-14": "Is niet Kalno gelijk Karchemis? Is Hamath niet gelijk Arfad? Is niet Samaria gelijk Damaskus? Zoals mijn hand de koninkrijken van de afgoden gevonden heeft, ofschoon hun gesneden beelden beter zijn dan die van Jeruzalem, en dan die van Samaria; zou ik, zoals ik gedaan heb aan Samaria en aan haar afgoden, niet zo kunnen doen aan Jeruzalem en aan haar afgoden?", "1 Kon 20:1": "En Benhadad, de koning van Syrië, verzamelde al zijn leger; en twee en dertig koningen waren met hem, en paarden en wagens; en hij trok op, en belegerde Samaria en streed tegen haar.", "Dan 3:15-17": "Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, dan is het goed; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen? Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden. Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "2 Kon 12:10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "Ps 18:45": "Zo gauw als hun oor van mij hoorde, hebben zij mij gehoorzaamd; vreemden hebben zich mij geveinsd onderworpen.", "Hand 24:15": "Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen.", "2 Kron 32:29": "Daarbij had hij zich steden gemaakt, alsook bezit van schapen en runderen in menigte; want God gaf hem zeer veel bezit.", "Jer 49:4": "Wat beroemt u zich op uw dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?", "Jes 36:6": "Zie, u vertrouwt op die gebroken rietstaf, op Egypte; als iemand daarop leunt, zal hij in zijn hand gaan en die doorboren; zo is farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Ps 48:9": "Zoals wij gehoord hadden, zo hebben wij gezien in de stad van de HEERE van de heerscharen, in de stad van onze God; God zal haar bevestigen tot in eeuwigheid. Sela.", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "2 Kon 18:1-8": "Het gebeurde nu in het derde jaar van Hosea, de zoon van Ela, de koning van Israël, dat Hizkia koning werd, de zoon van Achaz, koning van Juda. Vijfentwintig jaar was hij oud, toen hij koning werd, en hij regeerde negenentwintig jaar te Jeruzalem, en de naam van zijn moeder was Abi, een dochter van Zacharia. En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader David gedaan had.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Hand 27:25": "Daarom, houd moed, mannen, want ik geloof God, dat het zo zal zijn zoals het mij gezegd is.", "2 Kon 18:19-36": "En Rabsake zei tot hen: Zeg nu tot Hizkia: Zo zegt de grote koning, de koning van Assyrië: Wat vertrouwen is dit, waarmee u vertrouwt? U zegt (doch het is een woord der lippen): Er is raad en macht tot de oorlog; op wie vertrouwt u nu, dat u tegen mij rebelleert? Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Spr 23:4": "Vermoei u niet om rijk te worden; zie af van uw eigen vernuft.", "Joh 10:27": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij.", "Ex 3:8": "Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "1 Kron 3:13": "zijn zoon was Achaz; zijn zoon was Hizkia; zijn zoon was Manasse;", "Dan 4:30": "Sprak de koning, en zei: Is dit niet het grote Babel, dat ik gebouwd heb tot een huis van het koninkrijk, door de sterkte van mijn macht, en tot eer van mijn heerlijkheid!", "Ezech 29:3": "Spreek en zeg: Zo zegt de Heere HEERE: Zie, Ik zál u, o Farao, koning van Egypte! die grote zeedraak, die in het midden van zijn rivieren ligt; die zegt: Mijn rivier is van mij, en ik heb die voor mijzelf gemaakt.", "Rom 7:12": "Zo is dan de wet heilig, en het gebod is heilig, en rechtvaardig, en goed.", "Klaagl 4:17": "Ain. Nog steeds bezweken onze ogen, terwijl ze uitkeken naar onze nutteloze hulp; wij tuurden met gespannen aandacht naar een volk dat niet kon verlossen.", "Ps 142:6": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden.", "2 Kon 19:18": "En hebben hun goden in het vuur gegooid; want zij waren geen goden, maar het werk van mensenhanden, hout en steen; daarom hebben zij die vernietigd.", "Ps 118:7": "De HEERE is bij mij onder degenen die mij helpen; daarom zal ik mijn lust zien aan degenen die mij haten.", "Ps 119:72": "De wet van Uw mond is mij beter, dan duizenden van goud of zilver.", "Spr 31:7": "dat hij drinkt en zijn armoede vergeet, en aan zijn moeite niet meer denkt.", "1 Kon 3:2": "Alleen offerde het volk op de hoogten, want er was nog geen huis gebouwd voor de Naam van de HEERE, tot op die dagen.", "Deut 8:7-9": "Want de HEERE, uw God, brengt u in een goed land, een land van waterbeken, bronnen en diepe wateren, die in dalen en op bergen ontspringen; Een land van tarwe en gerst, en wijnstokken, en vijgenbomen, en granaatappels; een land van olierijke olijfbomen, en van honing; Een land waarin u brood zult eten zonder gebrek, waarin u niets ontbreken zal; een land waarvan de stenen ijzer zijn, en uit welks bergen u koper zult uithouwen.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Micha 3:4": "Dan zullen zij roepen tot de HEERE, doch Hij zal hen niet verhoren; maar zal Zijn aangezicht op die tijd voor hen verbergen, zoals zij hun handelingen slecht gemaakt hebben.", "Deut 34:5": "Zo stierf Mozes, de knecht van de HEERE, daar in het land van Moab, naar het woord van de HEERE.", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Deut 29:18": "Dat onder u niet iemand is, man of vrouw, of gezin, of stam, die zijn hart heden afwendt van de HEERE, onze God, om de goden van deze volken te gaan dienen; dat onder u niet een wortel is, die gal en alsem draagt;", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Joh 14:15": "Als u Mij liefhebt, bewaar dan Mijn geboden.", "Jes 36:22": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, naar Hizkia met gescheurde kleren; en zij vertelden hem de woorden van Rabsake.", "Ps 99:7": "Hij sprak tot hen in een wolkkolom; zij hebben Zijn getuigenissen onderhouden, en de inzettingen die Hij hun gegeven had.", "Jer 18:13-15": "Daarom, zo zegt de HEERE: Vraag nu onder de heidenvolken; wie heeft zoiets gehoord? De jonkvrouw Israël doet een zeer afschuwelijke zaak. Zal men ook om een rotssteen van het veld de sneeuw van Libanon verlaten? Zullen ook de vreemde, koude, vlietende wateren verlaten worden? Toch heeft Mijn volk Mij vergeten, zij branden reukwerk voor de ijdelheid; want zij hebben hen doen struikelen op hun wegen, op de oude paden, om te wandelen in stegen van een weg die niet opgehoogd is;", "1 Sam 17:45-47": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Job 14:15": "Dat U zou roepen, en ik U zou antwoorden, dat U naar het werk van Uw handen zou verlangen.", "Jes 10:8-13": "Want hij zegt: Zijn niet mijn vorsten allemaal samen koningen? Is niet Kalno gelijk Karchemis? Is Hamath niet gelijk Arfad? Is niet Samaria gelijk Damaskus? Zoals mijn hand de koninkrijken van de afgoden gevonden heeft, ofschoon hun gesneden beelden beter zijn dan die van Jeruzalem, en dan die van Samaria;", "Amos 5:13": "Daarom zal de verstandige in die tijd zwijgen, want het zal een slechte tijd zijn.", "1 Kor 2:15": "Maar de geestelijke mens beoordeelt wel alle dingen, maar hijzelf wordt door niemand beoordeeld.", "Jer 13:25": "Dit zal uw lot zijn, het deel dat u van Mij is toegemeten, spreekt de HEERE; u, die Mij hebt vergeten, en op leugen vertrouwt.", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Ps 18:2-4": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte! De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek. Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "1 Kon 15:11": "En Asa deed wat recht was in de ogen van de HEERE, zoals zijn vader David.", "Ps 16:5": "De HEERE is het deel van mijn erfenis en van mijn beker; U onderhoudt mijn lot.", "Ps 119:8": "Ik zal Uw inzettingen bewaren; verlaat mij niet al te zeer.", "Hos 9:3": "Zij zullen in het land van de Heere niet blijven; maar Efraïm zal weer naar Egypte terugkeren, en zij zullen in Assyrië het onreine eten.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "Jer 6:30": "Men noemt hen een verworpen zilver; want de HEERE heeft hen verworpen.", "Ps 146:6": "Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid.", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "Hebr 3:16-18": "Want sommigen, toen zij die gehoord hadden, hebben Hem verbitterd, maar niet allen die uit Egypte door Mozes weggetrokken zijn. Over wie nu is Hij veertig jaar lang vertoornd geweest? Was het niet over hen die gezondigd hadden, van wie de lichamen gevallen zijn in de woestijn? En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?", "Jes 10:13": "Omdat hij gezegd heeft: Door de kracht van mijn hand heb ik het gedaan, en door mijn wijsheid, want ik ben verstandig; en ik heb de landpalen van de volken weggenomen, en heb hun voorraad geroofd, en heb als een geweldige de inwoners doen neerdalen;", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Jes 56:12": "Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger.", "Job 15:26": "Hij loopt tegen Hem aan met de hals, met zijn dikke, hoog verheven schilden;", "Ps 89:27": "Hij zal Mij noemen: Gij zijt mijn Vader! mijn God, en de Rotssteen van mijn heil!", "Ps 119:129": "Pe. Uw getuigenissen zijn wonderbaar, daarom bewaart ze mijn ziel.", "Ps 18:30": "Want met U loop ik door een bende, en met mijn God spring ik over een muur.", "Deut 32:14": "Boter van koeien, en melk van klein vee, met het vet van de lammeren en van de rammen, die in Basan weiden, en van de bokken, met het vette van de nieren van tarwe; en het druivenbloed, reine wijn, hebt u gedronken.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Jer 17:7": "Gezegend daarentegen is de man die op de HEERE vertrouwt, en wiens vertrouwen de HEERE is!", "Gen 48:21": "Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.", "Ps 116:7": "Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "2 Kon 18:13-17": "Maar in het veertiende jaar van koning Hizkia kwam Sanherib, de koning van Assyrië, op tegen alle vaste steden van Juda, en nam ze in. Toen zond Hizkia, de koning van Juda, tot de koning van Assyrië, naar Lachis, en zei: Ik heb gezondigd, keer af van mij; wat u mij oplegt, zal ik dragen. Toen legde de koning van Assyrië Hizkia, de koning van Juda, driehonderd talenten van het zilver en dertig talenten van het goud op. Zo gaf Hizkia al het zilver, dat gevonden werd in het huis van de HEERE, en in de schatten van het huis van de koning.", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Luk 18:9-14": "En Hij vertelde ook aan sommigen, die op zichzelf vertrouwden dat zij rechtvaardig waren en de anderen niets waard achtten, deze gelijkenis: Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "2 Kon 22:2": "En hij deed wat recht was in de ogen van de HEERE; en hij wandelde in heel de weg van zijn vader David, en week niet af naar rechts of naar links.", "Jer 2:37": "U zult ook van hier uitgaan met uw handen op uw hoofd; want de HEERE heeft al uw vertrouwen verworpen, zodat u daarmee niet zult gedijen.", "2 Kron 32:32": "Het overige van de geschiedenissen van Jehizkia, en zijn goeddadigheden, zie, die zijn geschreven in het visioen van de profeet Jesaja, de zoon van Amoz, en in het boek van de koningen van Juda en Israël.", "Mal 3:7": "Vanaf de dag van uw vaderen af zijn jullie afgeweken van Mijn inzettingen, en hebben ze niet bewaard; keer terug tot Mij, en Ik zal tot u terugkeren, zegt de HEERE van de heerscharen; maar u zegt: Waarin zullen wij terugkeren?", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "2 Kron 31:20": "Zo deed Hizkia in heel Juda; en hij deed wat goed, en recht, en waarachtig was, voor het aangezicht van de HEERE, zijn God.", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "Dan 7:27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge plaatsen, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "Jes 2:6": "Maar U hebt Uw volk, het huis van Jakob, verlaten, want zij zijn vervuld met goddeloosheid, meer dan het oosten, en zij zijn van het guichelaar gelijk de Filistijnen, en aan de kinderen van de vreemden tonen zij hun behagen.", "Luk 6:46-48": "En waarom noemt u Mij Heere, Heere, en doet u niet wat Ik zeg? Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt. Hij is als een mens die een huis bouwde, en groef, en diep uitgroef, en het fundament op een steenrots legde; toen nu de hoge vloed kwam, sloeg de waterstroom tegen dat huis aan, en kon het niet doen bewegen; want het was op de steenrots gefundeerd.", "Job 19:25-27": "Want ik weet: mijn Verlosser leeft, en Hij zal als de laatste over het stof opstaan; En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen; Aan Wie ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.", "Jes 36:13-18": "Zo stond Rabsake, en riep met luide stem in het Joods, en zei: Hoor de woorden van de grote koning, de koning van Assyrië! Zo zegt de koning: Laat Hizkia u niet bedriegen, want hij zal u niet kunnen redden. Bovendien, laat Hizkia u niet doen vertrouwen op de HEERE, door te zeggen: De HEERE zal ons zeker redden; deze stad zal niet in de hand van de koning van Assyrië gegeven worden.", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "2 Kor 4:16-18": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag. Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid; Omdat wij niet letten op de dingen die men ziet, maar op de dingen die men niet ziet; want de dingen die men ziet, zijn tijdelijk, maar de dingen die men niet ziet, zijn eeuwig.", "Jes 1:4-7": "Wee het zondige volk, het volk van zware ongerechtigheid, het nageslacht van de boosdoeners, de verdervende kinderen! Zij hebben de HEERE verlaten, zij hebben de Heilige van Israël gelasterd, zij hebben zich vervreemd, wijkende achterwaarts. Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat. Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.", "Ps 130:5": "Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord.", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "2 Kon 19:1-13": "En het gebeurde, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde en zich met een zak bedekte, en naar het huis van de HEERE ging. Daarna stuurde hij Eljakim, de hofmeester, en Sebna, de schrijver, en de oudsten van de priesters, met zakken bedekt, naar Jesaja, de profeet, de zoon van Amoz; En zij zeiden tegen hem: Zo zegt Hizkia: Deze dag is een dag van benauwdheid, en van bestraffing, en van smaad; want de kinderen zijn tot aan de geboorte gekomen, en er is geen kracht om te baren.", "1 Kon 20:18": "En hij zei: Of zij nu tot vrede uitgetrokken zijn, grijpt hen levend; of ook, dat zij ten strijde uitgetrokken zijn, grijpt hen levend.", "Joz 24:24": "En het volk zei tegen Jozua: Wij zullen de HEERE, onze God, dienen, en wij zullen Zijn stem gehoorzamen.", "2 Kon 17:30": "Want de mensen van Babel maakten Sukkoth-Benoth, en de mensen van Chut maakten Nergal, en de mensen van Hamath maakten Asima,", "Hand 5:29": "Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen.", "Hos 5:1-15": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor. En zij die afwijken, verdiepen zich erin om te slachten; maar Ik zal hun allen een tuchtmeester zijn. Ik ken Efraïm, en Israël is voor Mij niet verborgen; want nu, Efraïm, hoereert u, en Israël is verontreinigd.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Ps 42:7": "O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Amos 6:7": "Daarom zullen zij nu gevankelijk heengaan onder de voorste die in gevangenschap gaan; en het feestmaal van hen die weelderig zijn, zal wegvallen.", "Hebr 10:7": "Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Deut 8:20": "Zoals de heidenvolken, die de HEERE voor uw ogen vernietigd heeft, zo zult u omkomen, omdat u niet geluisterd zult hebben naar de stem van de HEERE, uw God.", "Ps 46:2": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden.", "Jes 57:13": "Wanneer u zult roepen, laat dan degenen die door u verzameld zijn, u redden; maar de wind zal hen allemaal wegvoeren, de leegte zal hen wegnemen. Maar wie op Mij vertrouwt, die zal het land erven, en Mijn heilige berg in bezit krijgen.", "Hebr 11:14": "Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken.", "1 Petr 1:14": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had;", "1 Joh 5:2": "Hieraan weten wij, dat wij de kinderen van God liefhebben, wanneer wij God liefhebben, en Zijn geboden bewaren.", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Ps 119:166-168": "O HEERE! ik hoop op Uw heil, en doe Uw geboden. Mijn ziel onderhoudt Uw getuigenissen, en ik heb ze zeer lief. Ik onderhoud Uw bevelen en Uw getuigenissen, want al mijn wegen zijn voor U.", "Ps 56:12": "Ik vertrouw op God, ik zal niet vrezen; wat zou de mens mij doen?", "1 Kon 15:5": "Omdat David gedaan had wat recht was in de ogen van de HEERE, en niet geweken was van alles wat Hij hem geboden had, al de dagen van zijn leven, behalve alleen in de zaak van Uria, de Hethiet.", "Hab 2:5": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken.", "Job 8:14": "Van wie zijn hoop walgen zal; en zijn vertrouwen zal zijn als het huis van een spin.", "Jes 24:6": "Daarom verteert de vloek het land, en zij die daarin wonen, zullen verwoest worden; daarom zullen de inwoners van het land verbrand worden, en er zullen weinig mensen overblijven.", "Job 1:8": "En de HEERE zei tegen de satan: Hebt u ook acht geslagen op Mijn knecht Job? Want er is niemand op de aarde zoals hij, een man oprecht en vroom, godvrezend en afwijkend van het kwaad.", "Jer 7:8": "Zie, u vertrouwt op valse woorden, die geen nut doen.", "Klaagl 3:24-32": "Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen. Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt. Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Num 14:24": "Maar Mijn dienaar Kaleb, omdat een andere geest met hem geweest is, en hij Mij trouw is blijven volgen, zal Ik hem brengen tot het land waarin hij gekomen was, en zijn nageslacht zal het erfelijk bezitten.", "Hos 2:21": "En de aarde zal het koren verhoren, alsook de nieuwe wijn en de olie; en die zullen Jizreël verhoren.", "Jes 1:22": "Uw zilver is geworden tot schuim; uw wijn is vermengd met water.", "Spr 18:16": "Het geschenk van een mens maakt hem ruimte, en het brengt hem voor het aangezicht van de groten.", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Ps 4:3": "U, mannen, hoe lang zal mijn eer tot schande zijn? Hoe lang zult u de ijdelheid liefhebben, de leugen zoeken? Sela.", "Openb 19:6": "En ik hoorde als een stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.", "Hos 5:13": "Toen Efraïm zijn ziekte zag, en Juda zijn gezwel, ging Efraïm naar Assur, en hij stuurde iemand naar koning Jareb; maar die zal u niet kunnen genezen, en zal het gezwel van u niet helen.", "2 Kon 19:6": "En Jesaja zei tegen hen: Zo zult u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bevreesd voor de woorden die u gehoord hebt, waarmee de dienaars van de koning van Assyrië Mij gelasterd hebben.", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "2 Kron 32:4": "Want er werd veel volk samengebracht, dat alle bronnen dichtte, alsook de beek die door het midden van het land stroomde, en zij zeiden: Waarom zouden de koningen van Assyrië komen en veel water vinden?", "Hos 12:2": "Efraïm weidt zich met wind, en jaagt de oostenwind na; de hele dag vermenigvuldigt hij leugen en verwoesting; en zij maken een verbond met Assur, en de olie wordt naar Egypte gevoerd.", "Jes 37:11": "Zie, u hebt gehoord wat de koningen van Assyrië aan alle landen gedaan hebben, door ze te verwoesten; en zou u dan gered worden?", "Ps 140:8": "HEERE, Heere, sterkte van mijn heil! U hebt mijn hoofd bedekt op de dag van de wapening.", "Ps 119:112": "Ik heb mijn hart geneigd, om Uw inzettingen eeuwig te doen, tot het einde toe.", "Ps 104:15": "En de wijn, die het hart van de mens verheugt, zodat het gezicht blinkt van olie; en het brood, dat het hart van de mens sterkt.", "1 Kon 20:4": "En de koning van Israël antwoordde en zei: Naar uw woord, mijn heer de koning, ik ben van u, en al wat ik heb.", "Jer 2:5": "Zo zegt de HEERE: Wat voor onrecht hebben uw vaders aan Mij gevonden, dat zij ver van Mij zijn geweken, en de ijdelheid hebben nagewandeld, en zelf ijdel zijn geworden?", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "Ps 119:97": "Mem. Hoe lief heb ik Uw wet! Zij is mijn betrachting de hele dag.", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "Jes 47:10": "Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.", "Dan 4:22": "Dat bent u, o koning, die groot en sterk bent geworden; want uw grootheid is zo toegenomen, dat zij reikt aan de hemel, en uw heerschappij aan het einde van het aardrijk.", "Ps 119:56": "Dat is mij gebeurd, omdat ik Uw bevelen bewaard heb.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "2 Kron 32:27-30": "Jehizkia had zeer veel rijkdom en eer; en hij maakte zich schatkamers voor zilver, en voor goud, en voor kostbaar gesteente, en voor specerijen, en voor schilden, en voor allerlei begeerlijk gereedschap; Ook opslagplaatsen voor de opbrengst van koren, en wijn, en olie; en stallen voor allerlei beesten, en kooien voor de kudden. Daarbij had hij zich steden gemaakt, alsook bezit van schapen en runderen in menigte; want God gaf hem zeer veel bezit.", "Ps 6:10": "De HEERE heeft mijn smeking gehoord; de HEERE zal mijn gebed aannemen.", "Jer 2:11-13": "Heeft ook een volk de goden veranderd, hoewel die geen goden zijn? Toch heeft Mijn volk zijn Eer veranderd in iets dat geen nut doet. Ontzet u hierover, hemelen, en wees verschrikt, word zeer woest, spreekt de HEERE. Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Ps 119:48": "En ik zal mijn handen opheffen naar Uw geboden, die ik liefheb, en ik zal Uw inzettingen betrachten.", "Gen 24:7": "De HEERE, de God van de hemel, Die mij uit het huis van mijn vader en uit het land van mijn familie genomen heeft, en Die tot mij gesproken heeft, en Die mij gezworen heeft en zei: Aan uw nageslacht zal Ik dit land geven! Die Zelf zal Zijn Engel voor uw aangezicht zenden, zodat u voor mijn zoon van daar een vrouw neemt.", "Ps 119:59": "Ik heb mijn wegen bedacht, en heb mijn voeten gekeerd tot Uw getuigenissen.", "Ezech 31:3-10": "Zie, Assur was een ceder op de Libanon, mooi van takken, met schaduwrijk loof, en hoog van stam, en zijn top reikte tot tussen de dichte takken. Het water maakte hem groot, de afgrond maakte hem hoog; die ging met zijn stromen rondom zijn planting, en zond zijn waterleidingen uit tot alle bomen van het veld. Daarom werd zijn stam hoger dan alle bomen van het veld; en zijn takjes werden talrijk, en zijn scheuten lang, vanwege het vele water, toen hij uitschoot.", "2 Kron 28:20": "En Tiglath-Pilneser, de koning van Assyrië, kwam tot hem; maar hij benauwde hem, en versterkte hem niet.", "Ex 14:7": "En hij nam zeshonderd uitgelezen wagens, ja, alle wagens van Egypte, en de hoofdlieden over die allemaal.", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Ps 46:3": "Daarom zullen wij niet vrezen, al veranderde de aarde haar plaats, en al werden de bergen verzet in het hart van de zeeën;", "Dan 2:37": "U, o koning, bent een koning der koningen; want de God van de hemel heeft u een koninkrijk, macht, sterkte en eer gegeven;", "Jes 36:12": "Maar Rabsake zei: Heeft mijn heer mij naar uw heer en naar u gezonden om deze woorden te spreken? Is het niet naar de mannen die op de muur zitten, om met u hun eigen drek te eten en hun eigen water te drinken?", "2 Kon 17:6": "In het negende jaar van Hosea nam de koning van Assyrië Samaria in, en voerde Israël weg naar Assyrië, en liet hen wonen in Halah, en in Habor, aan de rivier Gozan, en in de steden van de Meden.", "Spr 26:4": "Antwoord de dwaas niet naar zijn dwaasheid, opdat u ook niet aan hem gelijk wordt.", "Ps 78:56-64": "Maar zij verzochten en verbitterden God, de Allerhoogste, en onderhielden Zijn getuigenissen niet. En zij weken terug, en handelden trouweloos, zoals hun vaders; zij zijn omgekeerd, als een bedrieglijke boog. En zij verwekten Hem tot toorn door hun hoogten, en verwekten Hem tot ijver door hun gesneden beelden.", "Ps 69:20": "U weet mijn smaad, en mijn schaamte, en mijn schande; al mijn belagers zijn voor U.", "Ps 121:2": "Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft.", "Jer 15:1-14": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan. En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap! Want Ik zal een bezoeking over hen brengen met vier soorten straf, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te verscheuren; en met het gevogelte van de hemel, en met het gedierte van de aarde, om op te eten en te vernietigen.", "Neh 7:2": "En ik gaf bevel aan mijn broer Hanani, en aan Hananja, de leider van de burcht in Jeruzalem, want hij was een man van trouw, en godvrezend boven velen.", "Mark 3:35": "Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Jes 7:1-9": "Het gebeurde nu in de dagen van Achaz, de zoon van Jotham, de zoon van Uzzia, de koning van Juda, dat Rezin, de koning van Syrië, en Pekah, de zoon van Remalia, de koning van Israël, optrokken naar Jeruzalem, ten oorlog tegen haar; maar hij kon met strijden niet tegen haar op. Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind. En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller;", "Jer 8:11": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Terwijl er geen vrede is.", "Ps 71:11": "En zeggen: God heeft hem verlaten; jaag hem na, en grijp hem, want er is geen verlosser.", "Spr 5:15": "Drink water uit uw eigen bak, en stromend water uit het midden van uw eigen bron;", "2 Kon 18:33-35": "Hebben de goden der volken, ieder zijn land, ooit gered uit de hand van de koning van Assyrië? Waar zijn de goden van Hamath, en van Arpad? Waar zijn de goden van Sefarvaim, Hena en Ivva? Ja, hebben zij Samaria uit mijn hand gered? Welke zijn ze onder alle goden der landen, die hun land uit mijn hand gered hebben, dat de HEERE Jeruzalem uit mijn hand zou redden?", "2 Kron 32:11": "Zet Jehizkia u niet ertoe aan, om u over te geven om door honger en door dorst te sterven, door te zeggen: De HEERE, onze God, zal ons redden uit de hand van de koning van Assyrië?", "2 Kon 25:11": "Het overige nu van het volk, die in de stad overgelaten waren, en de afvalligen, die tot de koning van Babel gevallen waren, en het overige van de menigte, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk weg.", "Hebr 11:4": "Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is.", "Ezech 13:10": "Daarom, ja, daarom dat zij Mijn volk verleiden, en zeggen: Vrede, terwijl er geen vrede is; en dat de een een lemen wand bouwt, en zie, de anderen die pleisteren met loze kalk.", "Num 13:21": "Zo trokken zij op, en verspiedden het land, van de woestijn Zin af tot Rechob toe, waar men komt bij Hamath.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Hos 11:7": "Want Mijn volk blijft hangen aan de afkering van Mij; zij roepen het wel tot de Allerhoogste, maar niet één verhoogt Hem.", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "1 Kon 14:15": "De HEERE zal ook Israël slaan, zoals een riet heen en weer bewogen wordt in het water, en zal Israël uitrukken uit dit goede land, dat Hij hun vaderen gegeven heeft, en zal hen verstrooien aan de overkant van de rivier; omdat zij hun gewijde palen gemaakt hebben, en de HEERE tot toorn verwekt hebben.", "2 Sam 8:9": "Toen nu Thoi, de koning van Hamath, hoorde dat David het hele leger van Hadad-Ezer geslagen had,", "Joh 13:37": "Petrus zei tegen Hem: Heere, waarom kan ik U nu niet volgen? Ik zal mijn leven voor U geven.", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "2 Sam 10:19": "Toen nu alle koningen die knechten van Hadad-Ezer waren, zagen dat zij voor Israëls aangezicht geslagen waren, sloten zij vrede met Israël, en dienden hen; en de Syriërs vreesden de kinderen Ammons niet meer te verlossen.", "2 Tess 2:4": "die zich tegenstelt en zich verheft boven alles wat God genoemd wordt, of als God vereerd wordt, zodat hij in de tempel van God als God zal zitten, zichzelf voordoend dat hij God is.", "Ezech 2:3-8": "En Hij zei tegen mij: Mensenkind! Ik zend u tot de kinderen van Israël, tot de rebellerende volken, die tegen Mij gerebelleerd hebben; zij en hun vaderen hebben tegen Mij overtreden tot op deze huidige dag. En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE! En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Jes 7:8": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Ps 9:4": "Omdat mijn vijanden achterwaarts gekeerd, gevallen en vergaan zijn van Uw aangezicht.", "Ps 118:17": "Ik zal niet sterven, maar leven; en ik zal de werken van de HEERE vertellen.", "Luk 14:32": "Anders stuurt hij, terwijl die ander nog ver weg is, gezanten en vraagt om vredesvoorwaarden.", "2 Kon 19:22": "Wie hebt u gehoond en gelasterd? En tegen wie hebt u de stem verheven, en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Ps 118:10": "Alle heidenen hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.", "Openb 2:19": "Ik weet uw werken, en liefde, en dienst, en geloof, en uw lijdzaamheid, en uw werken, en dat de laatste meer zijn dan de eerste.", "Ps 60:11": "Wie zal mij brengen in een vaste stad? Wie zal mij leiden tot in Edom?", "Ps 119:40": "Zie, ik heb een begeerte tot Uw bevelen; maak mij levend door Uw gerechtigheid.", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Jer 42:14-18": "en zegt: Nee, maar wij zullen naar Egypteland gaan, waar wij geen oorlog zullen zien, noch het geluid van de bazuin horen, noch naar brood hongeren, en daar zullen wij blijven; nu dan, daarom hoor het woord van de HEERE, overblijfsel van Juda! Zo zegt de HEERE van de heerscharen, de God van Israël: Als u vastbesloten uw aangezichten stelt om naar Egypte te gaan, en daar naartoe gaat om daar als vreemdelingen te wonen; dan zal het gebeuren dat het zwaard waar u voor vreest, u daar in Egypteland zal achterhalen; en de honger waar u voor bezorgd bent, zal u daar in Egypte op de hielen zitten, en daar zult u sterven.", "2 Kon 19:32-34": "Daarom zegt de HEERE dit over de koning van Assyrië: Hij zal in deze stad niet komen, en daar geen pijl inschieten; ook zal hij er niet met een schild voor aankomen, en geen wal daartegen opwerpen. Langs de weg waarlangs hij gekomen is, langs die zal hij terugkeren; maar in deze stad zal hij niet komen, zegt de HEERE. Want Ik zal deze stad beschermen, om die te verlossen, om Mijnentwil, en om de wil van David, Mijn knecht.", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "2 Kon 23:4": "En de koning gebood de hogepriester Hilkia, en de priesters van de tweede rang, en de bewakers van de drempel, dat zij uit de tempel van de HEERE al het gereedschap, dat voor Baäl, en voor het beeld van het bos en voor heel het leger van de hemel gemaakt was, naar buiten zouden brengen; en hij verbrandde dat buiten Jeruzalem in de velden van Kidron, en liet het stof daarvan naar Beth-el brengen.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Ps 119:2": "Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken;", "Ps 119:15": "Ik zal Uw bevelen overdenken, en op Uw paden letten.", "2 Tess 2:8": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst;", "Ps 23:1-6": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Ps 119:30": "Ik heb gekozen de weg van de waarheid, Uw rechten heb ik mij voorgesteld.", "1 Kron 5:26": "Zo verwekte de God van Israël de geest van Pul, de koning van Assyrië, en de geest van Tiglath-Pilneser, de koning van Assyrië, die voerde hen gevankelijk weg, te weten de Rubenieten, en de Gadieten, en de halve stam van Manasse; en hij bracht hen naar Halah, en Habor, en Hara, en aan de rivier Gozan, tot op deze dag.", "Ex 15:26": "en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!", "Lev 26:30": "En Ik zal uw hoogten verderven, en uw zonnebeelden uitroeien, en Ik zal uw dode lichamen op de dode lichamen van uw drekgoden werpen; en Mijn ziel zal van u walgen.", "Ps 33:20-22": "Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild. Want ons hart is in Hem verblijd, omdat wij op de Naam van Zijn heiligheid vertrouwen. Uw goedertierenheid, HEERE! zij over ons, zoals wij op U hopen.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Jer 46:17": "Daar riepen zij: Farao, de koning van Egypte, is maar een gedruis; hij heeft de gezette tijd laten voorbijgaan.", "Matt 12:20": "Het geknakte riet zal Hij niet breken, en de walmende vlaspit zal Hij niet uitblussen, totdat Hij het oordeel tot overwinning zal uitbrengen.", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "Jes 28:18": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Pred 12:6": "Voordat het zilveren koord losraakt, en de gouden schaal in stukken valt, en de kruik bij de bron breekt, en het rad bij de put in stukken valt;", "Jer 14:22": "Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.", "Jer 36:24": "En zij schrokken niet, en scheurden hun kleren niet, de koning noch al zijn dienaren die al deze woorden gehoord hadden.", "Jes 17:11": "Op de dag dat u ze plant, zult u ze doen groeien, en in de morgenstond zult u uw zaad doen bloeien; maar het zal maar een hoop zijn van het gemaaide, op de dag van ziekte en van pijnlijke smart.", "Ps 71:21": "Gij zult mijn grootheid vermeerderen, en mij rondom vertroosten.", "2 Kon 17:24-27": "De koning van Assyrië nu bracht volk uit Babel, en uit Chuta, en uit Avva, en uit Hamath, en Sefarvaim, en liet hen wonen in de steden van Samaria, in de plaats van de kinderen van Israël; en zij namen Samaria in bezit, en woonden in haar steden. En het gebeurde in het begin van hun wonen daar, dat zij de HEERE niet vreesden; toen zond de HEERE leeuwen onder hen, die enkelen van hen doodden. Daarom spraken zij tot de koning van Assyrië en zeiden: De volken die u weggevoerd hebt, en hebt laten wonen in de steden van Samaria, kennen de wijze van de God van het land niet; daarom heeft Hij leeuwen onder hen gezonden, en zie, zij doden hen, omdat zij de wijze van de God van het land niet kennen.", "Hos 10:7": "De koning van Samaria is afgehouwen, als schuim op het water.", "Num 12:7": "Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is.", "Jes 36:11": "Toen zei Eljakim, en Sebna, en Joah tegen Rabsake: Spreek toch tegen uw knechten in het Syrisch, want wij verstaan het wel; en spreek niet met ons in het Joods, ten aanhoren van het volk dat op de muur is.", "Ps 47:3": "Want de HEERE, de Allerhoogste, is ontzagwekkend, een groot Koning over de hele aarde.", "Ezech 18:19": "Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven.", "Ezech 5:1-17": "En u, mensenkind, neem een scherp mes, een scheermes van de barbiers zult u nemen, en dat zult u over uw hoofd en over uw baard laten gaan; daarna zult u
