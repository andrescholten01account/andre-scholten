udas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het gebeurde nu in het derde jaar van Hosea, de zoon van Ela, de koning van Israël, *dat* Hizkia koning werd, de zoon van Achaz, koning van Juda.","2":"Vijfentwintig jaar was hij oud, toen hij koning werd, en hij regeerde negenentwintig jaar te Jeruzalem, en de naam van zijn moeder was Abi, een dochter van Zacharia.","3":"En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader David gedaan had.","4":"Hij nam de hoogten weg, en brak de opgerichte beelden, en roeide de bossen uit; en hij verbrijzelde de koperen slang, die Mozes gemaakt had, omdat de kinderen van Israël tot die dagen toe daarvoor gerookt hadden; en hij noemde die Nehustan.","5":"Hij vertrouwde op de HEERE, de God van Israël, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die vóór hem geweest waren.","6":"Want hij kleefde de HEERE aan; hij week niet van Hem af om Hem na te volgen, en hij hield Zijn geboden, die de HEERE aan Mozes geboden had.","7":"Zo was de HEERE met hem; overal waar hij heen trok, handelde hij kloek; daartoe viel hij af van de koning van Assyrië, zodat hij hem niet diende.","8":"Hij sloeg de Filistijnen tot Gaza toe, en haar landpalen, van de wachttoren af tot de vaste steden toe.","9":"Het gebeurde nu in het vierde jaar van koning Hizkia (dat was het zevende jaar van Hosea, de zoon van Ela, de koning van Israël) dat Salmaneser, de koning van Assyrië, optrok tegen Samaria, en het belegerde.","10":"En zij namen het in na drie jaar, in het zesde jaar van Hizkia; dat was het negende jaar van Hosea, de koning van Israël, toen Samaria ingenomen werd.","11":"En de koning van Assyrië voerde Israël weg naar Assyrië, en liet hen wonen in Halah, en in Habor, bij de rivier Gozan, en in de steden der Meden.","12":"Omdat zij de stem van de HEERE, hun God, niet gehoorzaam waren geweest, maar Zijn verbond overtreden hadden; *en* al wat Mozes, de knecht van de HEERE, geboden had, dat hadden zij niet gehoord, noch gedaan.","13":"Maar in het veertiende jaar van koning Hizkia kwam Sanherib, de koning van Assyrië, op tegen alle vaste steden van Juda, en nam ze in.","14":"Toen zond Hizkia, de koning van Juda, tot de koning van Assyrië, naar Lachis, en zei: Ik heb gezondigd, keer af van mij; wat u mij oplegt, zal ik dragen. Toen legde de koning van Assyrië Hizkia, de koning van Juda, driehonderd talenten van het zilver en dertig talenten van het goud op.","15":"Zo gaf Hizkia al het zilver, dat gevonden werd in het huis van de HEERE, en in de schatten van het huis van de koning.","16":"Te dien tijde sneed Hizkia *het goud* af van de deuren van de tempel van de HEERE, en van de posten, die Hizkia, de koning van Juda, had laten overtrekken, en gaf dat aan de koning van Assyrië.","17":"Evenwel zond de koning van Assyrië Tartan, en Rabsaris, en Rabsake, van Lachis naar de koning Hizkia, met een zwaar leger naar Jeruzalem; en zij trokken op, en kwamen naar Jeruzalem. En toen zij optrokken en gekomen waren, bleven zij staan bij de watergang van de opperste vijver, die bij de hoge weg van het veld der vollers is.","18":"En zij riepen naar de koning; toen ging tot hen uit Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier.","19":"En Rabsake zei tot hen: Zeg nu tot Hizkia: Zo zegt de grote koning, de koning van Assyrië: Wat vertrouwen is dit, waarmee u vertrouwt?","20":"U zegt (doch het is een woord der lippen): Er is raad en macht tot de oorlog; op wie vertrouwt u nu, dat u tegen mij rebelleert?","21":"Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.","22":"Maar als u tot mij zegt: Wij vertrouwen op de HEERE, onze God; is Hij het niet, Wiens hoogten en Wiens altaren Hizkia weggenomen heeft, en tot Juda en tot Jeruzalem gezegd heeft: Voor dit altaar zult u zich buigen te Jeruzalem?","23":"Nu dan, wed toch met mijn heer, de koning van Assyrië; en ik zal u tweeduizend paarden geven, als u de ruiters daarop zult kunnen geven.","24":"Hoe zou u dan het aangezicht van één vorst van de geringste knechten van mijn heer afkeren? Maar u vertrouwt op Egypte, om de wagens en om de ruiters.","25":"Nu, ben ik zonder de HEERE opgetrokken tegen deze plaats, om die te verderven? De HEERE heeft tot mij gezegd: Trek op tegen dat land, en verderf het.","26":"Toen zei Eljakim, de zoon van Hilkia, en Sebna, en Joah tot Rabsake: Spreek toch tot uw knechten in het Syrisch, want wij verstaan het *wel*; en spreek met ons niet in het Joods, voor de oren van het volk, dat op de muur is.","27":"Maar Rabsake zei tot hen: Heeft mijn heer mij tot uw heer en tot u gezonden, om deze woorden te spreken? Is het niet tot de mannen, die op de muur zitten, dat zij met u hun eigen drek eten, en hun eigen water drinken zullen?","28":"Zo stond Rabsake, en riep met luide stem in het Joods; en hij sprak en zei: Hoort het woord van de grote koning, de koning van Assyrië!","29":"Zo zegt de koning: Laat Hizkia u niet bedriegen: want hij zal u niet kunnen redden uit zijn hand.","30":"Daartoe: laat Hizkia u niet doen vertrouwen op de HEERE, door te zeggen: De HEERE zal ons zeker redden, en deze stad zal niet in de hand van de koning van Assyrië gegeven worden.","31":"Hoort naar Hizkia niet; want zo zegt de koning van Assyrië: Handelt met mij door een geschenk, en komt tot mij uit, en eet, ieder van zijn wijnstok, en ieder van zijn vijgenboom; en drinkt, ieder het water van zijn bornput;","32":"Totdat ik kom, en u haal in een land, als uw land, een land van koren en van most, een land van brood en van wijngaarden, een land van olijven, van olie en van honing; zo zult u leven en niet sterven; en hoort niet naar Hizkia, want hij hitst u op, door te zeggen: De HEERE zal ons redden.","33":"Hebben de goden der volken, ieder zijn land, ooit gered uit de hand van de koning van Assyrië?","34":"Waar zijn de goden van Hamath, en van Arpad? Waar zijn de goden van Sefarvaim, Hena en Ivva? Ja, hebben zij Samaria uit mijn hand gered?","35":"Welke zijn ze onder alle goden der landen, die hun land uit mijn hand gered hebben, dat de HEERE Jeruzalem uit mijn hand zou redden?","36":"Doch het volk zweeg stil en antwoordde hem niet één woord; want het gebod van de koning was, en luidde: U zult hem niet antwoorden.","37":"Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, tot Hizkia, met gescheurde kleren; en zij maakten hem de woorden van Rabsake bekend."},"SV":{"1":"Het geschiedde nu in het derde jaar van Hosea, den zoon van Ela, den koning van Israël, *dat* Hizkia koning werd, de zoon van Achaz, koning van Juda.","2":"Vijf en twintig jaren was hij oud, toen hij koning werd, en hij regeerde negen en twintig jaren te Jeruzalem, en de naam zijner moeder was Abi, een dochter van Zacharia.","3":"En hij deed dat recht was in de ogen des HEEREN, naar alles, wat zijn vader David gedaan had.","4":"Hij nam de hoogten weg, en brak de opgerichte beelden, en roeide de bossen uit; en hij verbrijzelde de koperen slang, die Mozes gemaakt had, omdat de kinderen Israëls tot die dagen toe haar gerookt hadden; en hij noemde haar Nehustan.","5":"Hij betrouwde op den HEERE, den God Israëls, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die voor hem geweest waren.","6":"Want hij kleefde den HEERE aan; hij week niet van Hem na te volgen, en hij hield Zijn geboden, die de HEERE aan Mozes geboden had.","7":"Zo was de HEERE met hem; overal, waar hij henen uittrok, handelde hij kloekelijk; daartoe viel hij af van den koning van Assyrië, dat hij hem niet diende.","8":"Hij sloeg de Filistijnen tot Gaza toe, en haar landpalen, van den wachttoren af tot de vaste steden toe.","9":"Het geschiedde nu in het vierde jaar van den koning Hizkia ( hetwelk was het zevende jaar van Hosea, den zoon van Ela, den koning van Israël) dat Salmaneser, de koning van Assyrië, opkwam tegen Samaria, en haar belegerde.","10":"En zij namen haar in ten einde van drie jaren, in het zesde jaar van Hizkia; het was het negende jaar van Hosea, den koning van Israël, als Samaria ingenomen werd.","11":"En de koning van Assyrië voerde Israël weg naar Assyrië, en deed hen leiden in Halah, en in Habor, bij de rivier Gozan, en in de steden der Meden.","12":"Daarom dat zij de stem des HEEREN, huns Gods, niet waren gehoorzaam geweest, maar Zijn verbond overtreden hadden; *en* al wat Mozes, de knecht des HEEREN, geboden had, dat hadden zij niet gehoord, noch gedaan.","13":"Maar in het veertiende jaar van den koning Hizkia kwam Sanherib, de koning van Assyrië, op tegen alle vaste steden van Juda, en nam ze in.","14":"Toen zond Hizkia, de koning van Juda, tot den koning van Assyrië, naar Lachis, zeggende: Ik heb gezondigd, keer af van mij, wat gij mij opleggen zult, zal ik dragen. Toen leide de koning van Assyrië Hizkia, den koning van Juda, driehonderd talenten zilvers, en dertig talenten gouds op.","15":"Alzo gaf Hizkia al het zilver, dat gevonden werd in het huis des HEEREN, en in de schatten van het huis des konings.","16":"Te dier tijd sneed Hizkia *het* *goud* af van de deuren van den tempel des HEEREN, en van de posten, die Hizkia, de koning van Juda, had laten overtrekken, en gaf dat aan de koning van Assyrië.","17":"Evenwel zond de koning van Assyrië Tartan, en Rabsaris, en Rabsake, van Lachis tot den koning Hizkia, met een zwaar heir naar Jeruzalem; en zij togen op, en kwamen naar Jeruzalem. En als zij optogen en gekomen waren, bleven zij staan bij den watergang des oppersten vijvers, welke is bij den hogen weg van het veld des vollers.","18":"En zij riepen tot den koning; zo ging tot hen uit Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier.","19":"En Rabsake zeide tot hen: Zegt nu tot Hizkia: Zo zegt de grote koning, de koning van Assyrië: Wat vertrouwen is dit, waarmede gij vertrouwt?","20":"Gij zegt ( doch het is een woord der lippen): Er is raad en macht tot den oorlog; op wien vertrouwt gij nu, dat gij tegen mij rebelleert?","21":"Zie nu, vertrouwt gij u op dien gebroken rietstaf, op Egypte, op denwelken zo iemand leunt, zo zal hij in zijn hand gaan, en die doorboren; alzo is Farao, de koning van Egypte, al dengenen, die op hem vertrouwen.","22":"Maar zo gij tot mij zegt: Wij vertrouwen op den HEERE, onzen God; is Hij die niet, Wiens hoogten en Wiens altaren Hizkia weggenomen heeft, en tot Juda en tot Jeruzalem gezegd heeft: Voor dit altaar zult gij u buigen te Jeruzalem?","23":"Nu dan, wed toch met mijn heer, den koning van Assyrië; en ik zal u twee duizend paarden geven, zo gij voor u de ruiters daarop zult kunnen geven.","24":"Hoe zoudt gij dan het aangezicht van een enigen vorst van de geringste knechten mijns heren afkeren? Maar gij vertrouwt op Egypte, om de wagenen en om de ruiteren.","25":"Nu, ben ik zonder den HEERE opgetogen tegen deze plaats, om die te verderven? De HEERE heeft tot mij gezegd: Trek op tegen dat land, en verderf het.","26":"Toen zeide Eljakim, de zoon van Hilkia, en Sebna, en Joah tot Rabsake: Spreek toch tot uw knechten in het Syrisch, want wij verstaan het *wel*; en spreek met ons niet in het Joods, voor de oren des volks, dat op den muur is.","27":"Maar Rabsake zeide tot hen: Heeft mijn heer mij tot uw heer en tot u gezonden, om deze woorden te spreken? Is het niet tot de mannen, die op den muur zitten, dat zij met ulieden hun drek eten, en hun water drinken zullen?","28":"Alzo stond Rabsake, en riep met luider stem in het Joods; en hij sprak en zeide: Hoort het woord des groten konings, des konings van Assyrië!","29":"Zo zegt de koning: Dat Hizkia u niet bedriege: want hij zal u niet kunnen redden uit zijn hand.","30":"Daartoe dat Hizkia u niet doe vertrouwen op den HEERE, zeggende: De HEERE zal ons zekerlijk redden, en deze stad zal niet in de hand van den koning van Assyrië gegeven worden.","31":"Hoort naar Hizkia niet; want zo zegt de koning van Assyrië: Handelt met mij door een geschenk, en komt tot mij uit, en eet, een ieder *van* zijn wijnstok, en een ieder *van* zijn vijgeboom; en drinkt een ieder het water zijns bornputs;","32":"Totdat ik kom, en u haal in een land, als ulieder land, een land van koren en van most, een land van brood en van wijngaarden, een land van olijven, van olie en van honig; zo zult gij leven en niet sterven; en hoort niet naar Hizkia, want hij hitst u op, zeggende: De HEERE zal ons redden.","33":"Hebben de goden der volken, ieder zijn land, enigszins gered uit de hand van den koning van Assyrië?","34":"Waar zijn de goden van Hamath, en van Arpad? Waar zijn de goden van Sefarvaim, Hena en Ivva? Ja, hebben zij Samaria uit mijn hand gered?","35":"Welke zijn ze onder alle goden der landen, die hun land uit mijn hand gered hebben, dat de HEERE Jeruzalem uit mijn hand redden zou?","36":"Doch het volk zweeg stil en antwoordde hem niet een woord; want het gebod des konings was, zeggende: Gij zult hem niet antwoorden.","37":"Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, tot Hizkia, met gescheurde klederen; en zij gaven hem de woorden van Rabsake te kennen."},"KJV":{"1":"Now it came to pass in the third year of Hoshea son of Elah king of Israel, that Hezekiah the son of Ahaz king of Judah began to reign.","2":"Twenty and five years old was he when he began to reign; and he reigned twenty and nine years in Jerusalem. His mother's name also was Abi, the daughter of Zachariah.","3":"And he did that which was right in the sight of the LORD, according to all that David his father did.","4":"He removed the high places, and brake the images, and cut down the groves, and brake in pieces the brasen serpent that Moses had made: for unto those days the children of Israel did burn incense to it: and he called it Nehushtan.","5":"He trusted in the LORD God of Israel; so that after him was none like him among all the kings of Judah, nor any that were before him.","6":"For he clave to the LORD, and departed not from following him, but kept his commandments, which the LORD commanded Moses.","7":"And the LORD was with him; and he prospered whithersoever he went forth: and he rebelled against the king of Assyria, and served him not.","8":"He smote the Philistines, even unto Gaza, and the borders thereof, from the tower of the watchmen to the fenced city.","9":"And it came to pass in the fourth year of king Hezekiah, which was the seventh year of Hoshea son of Elah king of Israel, that Shalmaneser king of Assyria came up against Samaria, and besieged it.","10":"And at the end of three years they took it: even in the sixth year of Hezekiah, that is the ninth year of Hoshea king of Israel, Samaria was taken.","11":"And the king of Assyria did carry away Israel unto Assyria, and put them in Halah and in Habor by the river of Gozan, and in the cities of the Medes:","12":"Because they obeyed not the voice of the LORD their God, but transgressed his covenant, and all that Moses the servant of the LORD commanded, and would not hear them, nor do them.","13":"Now in the fourteenth year of king Hezekiah did Sennacherib king of Assyria come up against all the fenced cities of Judah, and took them.","14":"And Hezekiah king of Judah sent to the king of Assyria to Lachish, saying, I have offended; return from me: that which thou puttest on me will I bear. And the king of Assyria appointed unto Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.","15":"And Hezekiah gave him all the silver that was found in the house of the LORD, and in the treasures of the king's house.","16":"At that time did Hezekiah cut off the gold from the doors of the temple of the LORD, and from the pillars which Hezekiah king of Judah had overlaid, and gave it to the king of Assyria.","17":"And the king of Assyria sent Tartan and Rabsaris and Rabshakeh from Lachish to king Hezekiah with a great host against Jerusalem. And they went up and came to Jerusalem. And when they were come up, they came and stood by the conduit of the upper pool, which is in the highway of the fuller's field.","18":"And when they had called to the king, there came out to them Eliakim the son of Hilkiah, which was over the household, and Shebna the scribe, and Joah the son of Asaph the recorder.","19":"And Rabshakeh said unto them, Speak ye now to Hezekiah, Thus saith the great king, the king of Assyria, What confidence is this wherein thou trustest?","20":"Thou sayest, (but they are but vain words,) I have counsel and strength for the war. Now on whom dost thou trust, that thou rebellest against me?","21":"Now, behold, thou trustest upon the staff of this bruised reed, even upon Egypt, on which if a man lean, it will go into his hand, and pierce it: so is Pharaoh king of Egypt unto all that trust on him.","22":"But if ye say unto me, We trust in the LORD our God: is not that he, whose high places and whose altars Hezekiah hath taken away, and hath said to Judah and Jerusalem, Ye shall worship before this altar in Jerusalem?","23":"Now therefore, I pray thee, give pledges to my lord the king of Assyria, and I will deliver thee two thousand horses, if thou be able on thy part to set riders upon them.","24":"How then wilt thou turn away the face of one captain of the least of my master's servants, and put thy trust on Egypt for chariots and for horsemen?","25":"Am I now come up without the LORD against this place to destroy it? The LORD said to me, Go up against this land, and destroy it.","26":"Then said Eliakim the son of Hilkiah, and Shebna, and Joah, unto Rabshakeh, Speak, I pray thee, to thy servants in the Syrian language; for we understand it: and talk not with us in the Jews' language in the ears of the people that are on the wall.","27":"But Rabshakeh said unto them, Hath my master sent me to thy master, and to thee, to speak these words? hath he not sent me to the men which sit on the wall, that they may eat their own dung, and drink their own piss with you?","28":"Then Rabshakeh stood and cried with a loud voice in the Jews' language, and spake, saying, Hear the word of the great king, the king of Assyria:","29":"Thus saith the king, Let not Hezekiah deceive you: for he shall not be able to deliver you out of his hand:","30":"Neither let Hezekiah make you trust in the LORD, saying, The LORD will surely deliver us, and this city shall not be delivered into the hand of the king of Assyria.","31":"Hearken not to Hezekiah: for thus saith the king of Assyria, Make an agreement with me by a present, and come out to me, and then eat ye every man of his own vine, and every one of his fig tree, and drink ye every one the waters of his cistern:","32":"Until I come and take you away to a land like your own land, a land of corn and wine, a land of bread and vineyards, a land of oil olive and of honey, that ye may live, and not die: and hearken not unto Hezekiah, when he persuadeth you, saying, The LORD will deliver us.","33":"Hath any of the gods of the nations delivered at all his land out of the hand of the king of Assyria?","34":"Where are the gods of Hamath, and of Arpad? where are the gods of Sepharvaim, Hena, and Ivah? have they delivered Samaria out of mine hand?","35":"Who are they among all the gods of the countries, that have delivered their country out of mine hand, that the LORD should deliver Jerusalem out of mine hand?","36":"But the people held their peace, and answered him not a word: for the king's commandment was, saying, Answer him not.","37":"Then came Eliakim the son of Hilkiah, which was over the household, and Shebna the scribe, and Joah the son of Asaph the recorder, to Hezekiah with their clothes rent, and told him the words of Rabshakeh."}},"tsk":{"1":[{"kopje":"in het derde","refs":["2 Kon 18:9","2 Kon 15:30","2 Kon 17:1"]},{"kopje":"Hizkia","refs":["2 Kon 16:20","1 Kron 3:13","2 Kron 28:27","2 Kron 29:1","Matt 1:9","Matt 1:10"]}],"2":[{"kopje":"Abi","refs":["2 Kron 29:1"]}],"3":[{"kopje":"recht was in de ogen","refs":["2 Kon 20:3","Ex 15:26","Deut 6:18","2 Kron 31:20","2 Kron 31:21","Job 33:27","Ps 119:128","Rom 7:12","Ef 6:1"]},{"kopje":"naar","refs":["2 Kon 22:2","1 Kon 3:14","1 Kon 11:4","1 Kon 11:38","1 Kon 15:5","1 Kon 15:11","2 Kron 29:2"]}],"4":[{"kopje":"nam weg","refs":["2 Kon 12:3","2 Kon 14:4","2 Kon 15:4","2 Kon 15:35","Lev 26:30","1 Kon 3:2","1 Kon 3:3","1 Kon 15:14","1 Kon 22:44","Ps 78:58","Ezech 20:28","Ezech 20:29"]},{"kopje":"brak","refs":["2 Kon 23:4","Deut 7:5","Deut 12:2","Deut 12:3","Richt 6:25","Richt 6:28","1 Kon 15:12","1 Kon 15:13","2 Kron a-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses.</span>","7":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was with him; and he <span class=\"wl wl-kjv\" data-code=\"H7919\">prospered</span> whithersoever he went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth:</span> and he <span class=\"wl wl-kjv\" data-code=\"H4775\">rebelled</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> him not.","8":"He <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> even unto <span class=\"wl wl-kjv\" data-code=\"H5804\">Gaza,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1366\">borders</span> thereof, from the <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> of the <span class=\"wl wl-kjv\" data-code=\"H5341\">watchmen</span> to the <span class=\"wl wl-kjv\" data-code=\"H4013\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span>","9":"And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah,</span> which was the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H1954\">Hoshea</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H425\">Elah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that <span class=\"wl wl-kjv\" data-code=\"H8022\">Shalmaneser</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> and <span class=\"wl wl-kjv\" data-code=\"H6696\">besieged</span> it.","10":"And at the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> they <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> it: even in the <span class=\"wl wl-kjv\" data-code=\"H8337\">sixth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah,</span> that is the <span class=\"wl wl-kjv\" data-code=\"H8672\">ninth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H1954\">Hoshea</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> was <span class=\"wl wl-kjv\" data-code=\"H3920\">taken.</span>","11":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> did carry <span class=\"wl wl-kjv\" data-code=\"H1540\">away</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> unto <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and <span class=\"wl wl-kjv\" data-code=\"H5148\">put</span> them in <span class=\"wl wl-kjv\" data-code=\"H2477\">Halah</span> and in <span class=\"wl wl-kjv\" data-code=\"H2249\">Habor</span> by the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H1470\">Gozan,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H4074\">Medes:</span>","12":"Because they <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> not the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> but <span class=\"wl wl-kjv\" data-code=\"H5674\">transgressed</span> his <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> and all that <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded,</span> and would not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> them, nor <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them.","13":"Now in the <span class=\"wl wl-kjv\" data-code=\"H702\">fourteenth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> did <span class=\"wl wl-kjv\" data-code=\"H5576\">Sennacherib</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against all the <span class=\"wl wl-kjv\" data-code=\"H1219\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H8610\">took</span> them.","14":"And <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> to <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I have <span class=\"wl wl-kjv\" data-code=\"H2398\">offended;</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> from me: that which thou <span class=\"wl wl-kjv\" data-code=\"H5414\">puttest</span> on me will I <span class=\"wl wl-kjv\" data-code=\"H5375\">bear.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">appointed</span> unto <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him all the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> that was <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H214\">treasures</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","16":"At that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> did <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> cut <span class=\"wl wl-kjv\" data-code=\"H7112\">off</span> the gold from the <span class=\"wl wl-kjv\" data-code=\"H1817\">doors</span> of the <span class=\"wl wl-kjv\" data-code=\"H1964\">temple</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H547\">pillars</span> which <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> had <span class=\"wl wl-kjv\" data-code=\"H6823\">overlaid,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria.</span>","17":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H8661\">Tartan</span> and <span class=\"wl wl-kjv\" data-code=\"H7249\">Rabsaris</span> and <span class=\"wl wl-kjv\" data-code=\"H7262\">Rabshakeh</span> from <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish</span> to <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> with a <span class=\"wl wl-kjv\" data-code=\"H3515\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2426\">host</span> against <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> And they went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> And when they were come <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by the <span class=\"wl wl-kjv\" data-code=\"H8585\">conduit</span> of the <span class=\"wl wl-kjv\" data-code=\"H5945\">upper</span> <span class=\"wl wl-kjv\" data-code=\"H1295\">pool,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H4546\">highway</span> of the <span class=\"wl wl-kjv\" data-code=\"H3526\">fuller's</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">field.</span>","18":"And when they had <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> there came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to them <span class=\"wl wl-kjv\" data-code=\"H471\">Eliakim</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah,</span> which was over the <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and <span class=\"wl wl-kjv\" data-code=\"H7644\">Shebna</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe,</span> and <span class=\"wl wl-kjv\" data-code=\"H3098\">Joah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H623\">Asaph</span> the <span class=\"wl wl-kjv\" data-code=\"H2142\">recorder.</span>","19":"And <span class=\"wl wl-kjv\" data-code=\"H7262\">Rabshakeh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H559\">Speak</span> ye now to <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> What <span class=\"wl wl-kjv\" data-code=\"H986\">confidence</span> is this wherein thou <span class=\"wl wl-kjv\" data-code=\"H982\">trustest?</span>","20":"Thou <span class=\"wl wl-kjv\" data-code=\"H559\">sayest,</span> (but they are but <span class=\"wl wl-kjv\" data-code=\"H8193\">vain</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">words,)</span> I have <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> and <span class=\"wl wl-kjv\" data-code=\"H1369\">strength</span> for the <span class=\"wl wl-kjv\" data-code=\"H4421\">war.</span> Now on whom dost thou <span class=\"wl wl-kjv\" data-code=\"H982\">trust,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H4775\">rebellest</span> against me?","21":"Now, behold, thou <span class=\"wl wl-kjv\" data-code=\"H982\">trustest</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4938\">staff</span> of this <span class=\"wl wl-kjv\" data-code=\"H7533\">bruised</span> <span class=\"wl wl-kjv\" data-code=\"H7070\">reed,</span> even upon <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> on which if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5564\">lean,</span> it will <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into his <span class=\"wl wl-kjv\" data-code=\"H3709\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H5344\">pierce</span> it: so is <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> unto all that <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> on him.","22":"But if ye <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto me, We <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> is not that he, whose high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> and whose <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> hath taken <span class=\"wl wl-kjv\" data-code=\"H5493\">away,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> Ye shall <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> this <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem?</span>","23":"Now therefore, I pray thee, give <span class=\"wl wl-kjv\" data-code=\"H6148\">pledges</span> to my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> thee two <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> if thou be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> on thy part to <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H7392\">riders</span> upon them.","24":"How then wilt thou turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6996\">least</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and put thy <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> on <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> for <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> and for <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen?</span>","25":"Am I now come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H1107\">without</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> against this <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> it? The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to me, Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> it.","26":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H471\">Eliakim</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H7644\">Shebna,</span> and <span class=\"wl wl-kjv\" data-code=\"H3098\">Joah,</span> unto <span class=\"wl wl-kjv\" data-code=\"H7262\">Rabshakeh,</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">Speak,</span> I pray thee, to thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> in the Syrian <span class=\"wl wl-kjv\" data-code=\"H762\">language;</span> for we <span class=\"wl wl-kjv\" data-code=\"H8085\">understand</span> it: and <span class=\"wl wl-kjv\" data-code=\"H1696\">talk</span> not with us in the Jews' <span class=\"wl wl-kjv\" data-code=\"H3066\">language</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that are on the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall.</span>","27":"But <span class=\"wl wl-kjv\" data-code=\"H7262\">Rabshakeh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Hath my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me to thy <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> and to thee, to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">words?</span> hath he not sent me to the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> on the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> their own <span class=\"wl wl-kjv\" data-code=\"H6675\">dung,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> their own <span class=\"wl wl-kjv\" data-code=\"H4325\">piss</span> with you?","28":"Then <span class=\"wl wl-kjv\" data-code=\"H7262\">Rabshakeh</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">loud</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> in the Jews' <span class=\"wl wl-kjv\" data-code=\"H3066\">language,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria:</span>","29":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Let not <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H5377\">deceive</span> you: for he shall not be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> you out of his <span class=\"wl wl-kjv\" data-code=\"H3  wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah,</span> which was over the <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and <span class=\"wl wl-kjv\" data-code=\"H7644\">Shebna</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe,</span> and <span class=\"wl wl-kjv\" data-code=\"H3098\">Joah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H623\">Asaph</span> the <span class=\"wl wl-kjv\" data-code=\"H2142\">recorder,</span> to <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> with their <span class=\"wl wl-kjv\" data-code=\"H899\">clothes</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">rent,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H7262\">Rabshakeh.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"derde jaar","tekst":"Te weten, der laatste negen jaren, waarvan gesproken is boven, 2Ki 17:1."},{"catchword":"Hizkia","tekst":"Genoemd, Ezikias, Mat 1:9."}],"2":[{"catchword":"Vijf en twintig","tekst":"Hebreeuws, een zoon van vijf en twintig jaar."},{"catchword":"Abi,","tekst":"Zij wordt ook genoemd Abia, 2Ch 29:1."},{"catchword":"Zacharia","tekst":"Sommigen houden dezen voor den koning Israëls, waarvan te zien is boven, 2Ki 14:29."}],"4":[{"catchword":"koperen slang,","tekst":"Zie van deze Num 2:8-9, enz."},{"catchword":"Nehustan","tekst":"Dat is, koperwerk, of een stuk koper, of iets dat van koper is. Zo heeft de koning de koperen slang genoemd, om te tonen dat er niets goddelijks in haar was, en vervolgens geen reden om haar door offeranden en aanbiddingen goddelijke eer te bewijzen. Anders, men noemde ze, enz., dat is, het volk had haar, als hun afgod, dien naam gegeven."}],"5":[{"catchword":"zijns gelijke","tekst":"Te weten, in het reformeren en herstellen van den zuiveren godsdienst; welverstaande terstond in den aanvang zijner regering. Anders is dit te verstaan met uitneming van David en Josia; van David, wien hij gelijk gemaakt wordt, en niet overtreffelijker, boven, vs.3; van Josia, wien deze lof ook gegeven wordt, dat voor en na hem geen koning zijns gelijks is geweest, onder, 2Ki 23:25."}],"6":[{"catchword":"van Hem","tekst":"Hebreeuws, van achter hem. Zie 1Ki 9:6."}],"7":[{"catchword":"was de HEERE","tekst":"Zie Gen 21:22, en Gen 26:24; Num 14:9."},{"catchword":"viel hij af","tekst":"Dit wordt gezegd ten aanzien van zijn vader Achaz, die zich den koning van Assyrië onderworpen had, als een leenman en schatplichtige. Zie boven, 2Ki 16:7."},{"catchword":"niet diende","tekst":"Dat is, geen tribuut noch schatting gaf."}],"8":[{"catchword":"Filistijnen","tekst":"Die zijn vader vele steden en land afgenomen hadden. Zie 2Ch 28:18."},{"catchword":"van den wachttoren af","tekst":"Dat is, overal en in verscheidene plaatsen. Zie boven, 2Ki 17:9."}],"9":[{"catchword":"zevende jaar","tekst":"Gerekend van het begin der negen jaren, vermeld boven, 2Ki 17:1."}],"10":[{"catchword":"drie jaren,","tekst":"Te weten, der belegering."}],"11":[{"catchword":"Halah,","tekst":"Zie van deze landen boven, 2Ki 17:6."}],"12":[{"catchword":"niet gehoord,","tekst":"Dat is, niet willen horen."}],"13":[{"catchword":"in","tekst":"Te weten, enige derzelve."}],"14":[{"catchword":"Lachis,","tekst":"Welke stad hij toen belegerde en bestreed."},{"catchword":"talenten zilvers,","tekst":"Zie Exo 25:39."}],"16":[{"catchword":"sneed Hizkia","tekst":"De zin is dat hij de gouden platen heeft afgetrokken, met welke hij tevoren de deuren en posten des tempels overtogen had, als hij den tempel, dien zijn vader toegesloten had, weder opende; 2Ch 29:3."},{"catchword":"dat aan de koning van Assyrië","tekst":"Hebreeuws, die; te weten, deuren en posten; dat is, het goud, waarmede die waren overtogen geweest."}],"17":[{"catchword":"zond de koning","tekst":"Zijn woord niet houdende als hij het geld ontvangen had."},{"catchword":"Rabsaris,","tekst":"Het woord betekent de overste hoveling, of kamerling, gelijk het van enigen overgezet wordt."},{"catchword":"watergang","tekst":"Hiermede verstaan velen een waterloop buiten Jeruzalem, in welken uit een vijver, die daarbij was, water af gelaten werd, waarin de vollers hun lakentuig wiesen. Vergelijk Isa 7:3."},{"catchword":"oppersten vijvers,","tekst":"Zo toegenaamd tot onderscheiding van den vijver, gezegd de onderste; Isa 22:9."},{"catchword":"hogen weg","tekst":"Versta, een hogen en gebaanden weg, die, naar eniger gevoelen, met stenen geplaveid was."},{"catchword":"het veld des vollers","tekst":"Waar de vollers hun wollengoed uitspreidden."}],"18":[{"catchword":"Eljakim,","tekst":"Zie van dezen vromen en godvruchtigen hofmeester, Isa 22:20, enz. Van zulk ambt, zie 1Ki 4:6. Hebreeuws, die over het huis was."},{"catchword":"schrijver,","tekst":"Anders, griffier, of secretaris; te weten, des konings. Zie 1Ki 4:3."},{"catchword":"kanselier","tekst":"Hebreeuws, memoriemaker. Alzo ook vs.37; idem 1Ki 4:3. Zie de aantekening."}],"20":[{"catchword":"een woord der lippen)","tekst":"Dat is, ijdel, vergeefs, vruchteloos, gans nietig, waar niet van worden noch komen zal; of versta een woord, dat slechts in den mond is, en niet uit het hart komt; dat is, dat niet gemeend wordt noch bevestigd zal worden. Anders, gij spreekt; maar het zijn niet dan woorden; raad en macht [zijn vereist] tot den oorlog. Anders, gij zegt maar een woord der lippen, maar [daar moet] raad en kracht ten oorlog zijn; spottende alzo met de gebeden en vertroostingen, die Hizkia gebruikte."}],"21":[{"catchword":"dien gebroken rietstaf,","tekst":"Of, gekrookten. Versta door deze gelijkenis, een hulp, die zwak, trouweloos en ongestadig is. Alzo Isa 36:6; Eze 29:6-7."}],"22":[{"catchword":"dit altaar","tekst":"Te weten, dezen enigen; gelijk er staat 2Ch 32:12. Dat is, voor geen anderen."}],"23":[{"catchword":"wed toch met mijn heer,","tekst":"Of, stel toch mijn heer, enz. borg."}],"24":[{"catchword":"afkeren?","tekst":"Dat is, wederstaan en verdrijven."}],"25":[{"catchword":"heeft tot mij gezegd","tekst":"Dit spreekt hij valselijk door vermetelheid, om Gods volk verschrikt en verbaasd te maken. Hoewel het anderszins door Gods verborgen voorzienigheid geschied is, hetwelk hem nochtans onbekend was. Zie onder, 2Ki 19:25; Isa 10:5-7."}],"26":[{"catchword":"verstaan het wel;","tekst":"Hebreeuws, want wij zijn horende; dat is, wij verstaan en kennen die taal wel. Zie Gen 11:7."}],"27":[{"catchword":"dat zij met ulieden","tekst":"Dat is, dat zij gewaarschuwd zouden worden, dat door een strenge belegering hun gruwelijke ellenden zullen overkomen, ja zelfs dat zij gedwongen zullen worden hun eigen mest te eten, enz., om hun honger en dorst te verzadigen, zo zij zich niet willen overgeven."}],"28":[{"catchword":"luider stem","tekst":"Hebreeuws, grote stem."}],"30":[{"catchword":"zekerlijk redden,","tekst":"Hebreeuws, reddende redden."}],"31":[{"catchword":"geschenk,","tekst":"Het Hebreeuwse woord betekent eigenlijk zegening, maar het wordt ook voor een geschenk genomen. Zie Gen 33:11, met de aantekening. De zin is dat hij den Joden aanbiedt de vredehandeling, opdat zij zijn geweld en harde belegering met het gevolg van dien niet zouden hebben te verwachten."}],"32":[{"catchword":"van koren","tekst":"Versta door deze dingen alle tijdelijke goederen, waarmede God een land zegent. Zie Exo 3:9; Deu 32:13-14; Job 20:17, mitsgaders de aantekening."},{"catchword":"want hij hitst u op,","tekst":"Anders, als hij u verleidt, of ophitst, of overreedt."}],"33":[{"catchword":"enigszins gered","tekst":"Hebreeuws, reddende gered."}],"34":[{"catchword":"Hamath,","tekst":"Zie van deze twee steden ook samengevoegd Jer 49:23. Wij hebben hier de namen der steden en landen, die de koning van Assyrië ingenomen had. Zie boven, 2Ki 17:24, en Isa 37:13."},{"catchword":"Hena en Ivva?","tekst":"Dit houden sommigen voor eigenn // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }

}

      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
