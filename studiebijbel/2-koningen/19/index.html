udas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En het gebeurde, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde en zich met een zak bedekte, en naar het huis van de HEERE ging.","2":"Daarna stuurde hij Eljakim, de hofmeester, en Sebna, de schrijver, en de oudsten van de priesters, met zakken bedekt, naar Jesaja, de profeet, de zoon van Amoz;","3":"En zij zeiden tegen hem: Zo zegt Hizkia: Deze dag is een dag van benauwdheid, en van bestraffing, en van smaad; want de kinderen zijn tot aan de geboorte gekomen, en er is geen kracht om te baren.","4":"Misschien zal de HEERE, uw God, alle woorden horen van Rabsake, door wie zijn heer, de koning van Assyrië, gezonden is, om de levende God te honen en met woorden te schelden, die de HEERE, uw God, gehoord heeft; hef dan een gebed op voor het overblijfsel dat nog gevonden wordt.","5":"En de knechten van koning Hizkia kwamen naar Jesaja.","6":"En Jesaja zei tegen hen: Zo zult u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bevreesd voor de woorden die u gehoord hebt, waarmee de dienaars van de koning van Assyrië Mij gelasterd hebben.","7":"Zie, Ik zal een geest in hem geven, zodat hij een gerucht zal horen en weer naar zijn land zal terugkeren; en Ik zal hem door het zwaard vellen in zijn land.","8":"Zo kwam Rabsake terug en trof de koning van Assyrië aan, strijdend tegen Libna; want hij had gehoord dat hij uit Lachis vertrokken was.","9":"Toen hij nu hoorde zeggen over Tirhaka, de koning van Cusch: Zie, hij is uitgetrokken om tegen u te strijden, stuurde hij opnieuw boden naar Hizkia, en zei:","10":"Zo zult u spreken tegen Hizkia, de koning van Juda: Laat uw God, op Wie u vertrouwt, u niet bedriegen door te zeggen: Jeruzalem zal niet in de hand van de koning van Assyrië gegeven worden.","11":"Zie, u hebt gehoord wat de koningen van Assyrië aan alle landen gedaan hebben, door ze volledig te verwoesten; en zou u dan gered worden?","12":"Hebben de goden van de volken die mijn vaders vernietigd hebben, hen gered — zoals Gozan, en Haran, en Rezef, en de kinderen van Eden die in Telasser waren?","13":"Waar is de koning van Hamath, en de koning van Arpad, en de koning van de stad Sefarvaim, Hena en Ivva?","14":"Toen Hizkia de brieven uit de hand van de boden ontvangen had en die gelezen had, ging hij op naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE.","15":"En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.","16":"HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.","17":"Werkelijk, HEERE, de koningen van Assyrië hebben die heidenvolken en hun land verwoest;","18":"En hebben hun goden in het vuur gegooid; want zij waren geen goden, maar het werk van mensenhanden, hout en steen; daarom hebben zij die vernietigd.","19":"Nu dan, HEERE, onze God, verlos ons toch uit zijn hand; zo zullen alle koninkrijken van de aarde weten dat U, HEERE, alleen God bent.","20":"Toen stuurde Jesaja, de zoon van Amoz, iemand naar Hizkia, en zei: Zo spreekt de HEERE, de God van Israël: Wat u tot Mij gebeden hebt tegen Sanherib, de koning van Assyrië, heb Ik gehoord.","21":"Dit is het woord dat de HEERE over hem gesproken heeft: De jonkvrouw, de dochter van Sion, verkleint u, zij bespot u, de dochter van Jeruzalem schudt het hoofd achter u aan.","22":"Wie hebt u gehoond en gelasterd? En tegen wie hebt u de stem verheven, en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!","23":"Door uw boden hebt u de Heere gehoond, en gezegd: Ik heb met de menigte van mijn wagens de hoogten van de bergen beklommen, de flanken van de Libanon; en ik zal zijn hoge cederbomen en zijn uitgelezen dennenbomen omhakken; en ik zal komen tot in zijn verste herberg, in het woud van zijn mooie veld.","24":"Ik heb gegraven en vreemd water gedronken; en ik heb met mijn voetzolen alle rivieren van de belegerde plaatsen droog gemaakt.","25":"Hebt u niet gehoord dat Ik dit lang van tevoren gedaan heb, en het van oude dagen af gevormd heb? Nu heb Ik het laten komen, dat u de versterkte steden zou verstoren tot puinhopen.","26":"Daarom waren hun inwoners machteloos; zij waren verslagen en beschaamd; zij waren als het gras van het veld, en het groene gras, het hooi van de daken, en het verschroeide koren, voordat het volgroeid is.","27":"Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woeden tegen Mij.","28":"Om uw woeden tegen Mij, en omdat uw geraas voor Mijn oren opgekomen is, zal Ik Mijn haak in uw neus leggen, en Mijn bit in uw lippen, en Ik zal u terug laten keren langs de weg waarlangs u gekomen bent.","29":"En dit zij u een teken: dit jaar zal men eten wat vanzelf gegroeid is, en in het tweede jaar wat daarvan weer opkomt; maar zaai in het derde jaar, en maai, en plant wijngaarden, en eet hun vruchten.","30":"Want wie ontkomen is, die overgebleven is van het huis van Juda, zal opnieuw naar onder wortelen, en naar boven vrucht dragen.","31":"Want uit Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is uit de berg Sion; de na-ijver van de HEERE van de heerscharen² zal dit doen.","32":"Daarom zegt de HEERE dit over de koning van Assyrië: Hij zal in deze stad niet komen, en daar geen pijl inschieten; ook zal hij er niet met een schild voor aankomen, en geen wal daartegen opwerpen.","33":"Langs de weg waarlangs hij gekomen is, langs die zal hij terugkeren; maar in deze stad zal hij niet komen, zegt de HEERE.","34":"Want Ik zal deze stad beschermen, om die te verlossen, om Mijnentwil, en om de wil van David, Mijn knecht.","35":"Het gebeurde toen in diezelfde nacht, dat de Engel van de HEERE uittrok en in het leger van Assyrië honderdvijfentachtigduizend man sloeg. En toen zij zich 's morgens vroeg opmaakten, zie, dat waren allemaal dode lichamen.","36":"Zo vertrok Sanherib, de koning van Assyrië, en ging weg, en keerde terug; en hij bleef in Nineve.","37":"Het gebeurde nu, toen hij in het huis van Nisroch, zijn god, neerboog, dat Adramelech en Sarezer, zijn zonen, hem met het zwaard doodden; maar zij ontkwamen naar het land van Ararat; en Esar-haddon, zijn zoon, werd koning in zijn plaats."},"SV":{"1":"En het geschiedde, als de koning Hizkia *dat* hoorde, zo scheurde hij zijn klederen, en bedekte zich met een zak, en ging in het huis des HEEREN.","2":"Daarna zond hij Eljakim, den hofmeester, en Sebna, den schrijver, en de oudsten der priesteren, met zakken bedekt, tot Jesaja, den profeet, den zoon van Amoz;","3":"En zij zeiden tot hem: Alzo zegt Hizkia: Deze dag is een dag der benauwdheid, en der schelding, en der lastering; want de kinderen zijn gekomen tot aan de geboorte, en er is geen kracht om te baren.","4":"Misschien zal de HEERE, uw God, horen al de woorden van Rabsake, denwelken zijn heer, de koning van Assyrië, gezonden heeft, om den levenden God te honen, en te schelden, met woorden, die de HEERE, uw God, gehoord heeft; hef dan een gebed op voor het overblijfsel, dat gevonden wordt.","5":"En de knechten van den koning Hizkia kwamen tot Jesaja.","6":"En Jesaja zeide tot hen: Zo zult gij tot uw heer zeggen: Zo zegt de HEERE: Vrees niet voor de woorden, die gij gehoord hebt, waarmede Mij de dienaars van den koning van Assyrië gelasterd hebben.","7":"Zie, Ik zal een geest in hem geven, dat hij een gerucht horen zal, en weder in zijn land keren; en Ik zal hem door het zwaard in zijn land vellen.","8":"Zo kwam Rabsake weder, en vond den koning van Assyrië, strijdende tegen Libna; want hij had gehoord, dat hij van Lachis vertrokken was.","9":"Als hij nu hoorde van Tirhaka, den koning van Cusch, zeggen: Ziet, hij is uitgetogen om tegen u te strijden, zond hij weder boden tot Hizkia, zeggende:","10":"Zo zult gij spreken tot Hizkia, den koning van Juda, zeggende: Laat u uw God niet bedriegen, op welken gij vertrouwt, zeggende: Jeruzalem zal in de hand des konings van Assyrië niet gegeven worden.","11":"Zie, gij hebt gehoord, wat de koningen van Assyrië aan alle landen gedaan hebben, die verbannende; en zoudt gij gered worden?","12":"Hebben de goden der volken, die mijn vaders verdorven hebben, dezelve gered, *als* Gozan, en Haran, en Rezef, en de kinderen van Eden, die in Telasser waren?","13":"Waar is de koning van Hamath, en de koning van Arpad, en de koning der stad Sefarvaim, Hena en Ivva?","14":"Als nu Hizkia de brieven uit der boden hand ontvangen, en die gelezen had, ging hij op in het huis des HEEREN, en Hizkia breidde die uit voor het aangezicht des HEEREN.","15":"En Hizkia bad voor het aangezicht des HEEREN, en zeide: O HEERE, God Israëls, Die tussen de cherubim woont! Gij zelf, Gij alleen zijt de God van alle koninkrijken der aarde, Gij hebt den hemel en de aarde gemaakt.","16":"O, HEERE! neig Uw oor en hoor, doe, HEERE! Uw ogen open en zie, en hoor de woorden van Sanherib, die dezen gezonden heeft, om den levenden God te honen.","17":"Waarlijk, HEERE, hebben de koningen van Assyrië die heidenen en hun land verwoest;","18":"En hebben hun goden in het vuur geworpen; want zij waren geen goden, maar het werk van mensenhanden, hout en steen; daarom hebben zij die verdorven.","19":"Nu dan, HEERE, onze God, verlos ons toch uit zijn hand; zo zullen alle koninkrijken der aarde weten, dat Gij, HEERE, alleen God zijt.","20":"Toen zond Jesaja, de zoon van Amoz, tot Hizkia, zeggende: Zo spreekt de HEERE, de God Israëls: Dat gij tot Mij gebeden hebt tegen Sanherib, den koning van Assyrië, heb Ik gehoord.","21":"Dit is het woord, dat de HEERE over hem gesproken heeft: De jonkvrouw, de dochter van Sion, veracht u, zij bespot u, de dochter van Jeruzalem schudt het hoofd achter u.","22":"Wien hebt gij gehoond en gelasterd? en tegen Wien hebt gij de stem verheven, en uw ogen omhoog opgeheven? Tegen den Heilige Israëls!","23":"Door middel uwer boden hebt gij den Heere gehoond, en gezegd: Ik heb met de menigte mijner wagenen beklommen de hoogten der bergen, de zijden van den Libanon; en ik zal zijn hoge cederbomen, en zijn uitgelezen dennebomen afhouwen; en zal komen in zijn uiterste herberg, in het woud zijns schonen velds.","24":"Ik heb gegraven en heb gedronken vreemde wateren; en ik heb met mijn voetzolen alle rivieren der belegerde plaatsen verdroogd.","25":"Hebt gij niet gehoord, dat Ik zulks lang te voren gedaan heb en dat van oude dagen af geformeerd heb? Nu heb Ik dat doen komen, dat gij zoudt zijn, om de vaste steden te verstoren tot woeste hopen.","26":"Daarom waren haar inwoners handeloos; zij waren verslagen en beschaamd; zij waren *als* het gras des velds, en de groene grasscheutjes, het hooi der daken, en het brandkoren, eer het over einde staat.","27":"Maar Ik weet uw zitten, en uw uitgaan, en uw inkomen, en uw woeden tegen Mij.","28":"Om uw woeden tegen Mij, en dat uw woeling voor Mijn oren opgekomen is, zo zal Ik Mijn haak in uw neus leggen, en Mijn gebit in uw lippen, en Ik zal u doen wederkeren door dien weg, door denwelken gij gekomen zijt.","29":"En dat zij u een teken, dat men *in* dit jaar eten zal, wat van zelf gewassen is; en in het tweede jaar, wat daarvan weder uitspruit; maar zaait in het derde jaar, en maait, en plant wijngaarden, en eet hun vruchten.","30":"Want het ontkomene, dat overgebleven is van het huis van Juda, zal wederom nederwaarts wortelen, en zal opwaarts vrucht dragen.","31":"Want van Jeruzalem zal het overblijfsel uitgaan, en het ontkomene van den berg Sion; de ijver van den HEERE der heirscharen zal dit doen.","32":"Daarom zo zegt de HEERE van den koning van Assyrië: Hij zal in deze stad niet komen, noch daar een pijl inschieten; ook zal hij *met* geen schild daarvoor komen, en zal geen wal daartegen opwerpen.","33":"Door den weg, dien hij gekomen is, door dien zal hij wederkeren; maar in deze stad zal hij niet komen, zegt de HEERE.","34":"Want Ik zal deze stad beschermen, om die te verlossen, om Mijnentwil, en om Davids, Mijns knechts wil.","35":"Het geschiedde dan in dienzelven nacht, dat de Engel des HEEREN uitvoer, en sloeg in het leger van Assyrië honderd vijf en tachtig duizend. En toen zij zich des morgens vroeg opmaakten, ziet, die allen waren dode lichamen.","36":"Zo vertrok Sanherib, de koning van Assyrië, en toog henen, en keerde weder; en hij bleef te Nineve.","37":"Het geschiedde nu, als hij in het huis van Nisroch, zijn god, zich nederboog, dat Adramelech en Sarezer, *zijn* *zonen*, hem met het zwaard versloegen; doch zij ontkwamen in het land van Ararat; en Esar-haddon, zijn zoon, werd koning in zijn plaats."},"KJV":{"1":"And it came to pass, when king Hezekiah heard it, that he rent his clothes, and covered himself with sackcloth, and went into the house of the LORD.","2":"And he sent Eliakim, which was over the household, and Shebna the scribe, and the elders of the priests, covered with sackcloth, to Isaiah the prophet the son of Amoz.","3":"And they said unto him, Thus saith Hezekiah, This day is a day of trouble, and of rebuke, and blasphemy: for the children are come to the birth, and there is not strength to bring forth.","4":"It may be the LORD thy God will hear all the words of Rabshakeh, whom the king of Assyria his master hath sent to reproach the living God; and will reprove the words which the LORD thy God hath heard: wherefore lift up thy prayer for the remnant that are left.","5":"So the servants of king Hezekiah came to Isaiah.","6":"And Isaiah said unto them, Thus shall ye say to your master, Thus saith the LORD, Be not afraid of the words which thou hast heard, with which the servants of the king of Assyria have blasphemed me.","7":"Behold, I will send a blast upon him, and he shall hear a rumour, and shall return to his own land; and I will cause him to fall by the sword in his own land.","8":"So Rabshakeh returned, and found the king of Assyria warring against Libnah: for he had heard that he was departed from Lachish.","9":"And when he heard say of Tirhakah king of Ethiopia, Behold, he is come out to fight against thee: he sent messengers again unto Hezekiah, saying,","10":"Thus shall ye speak to Hezekiah king of Judah, saying, Let not thy God in whom thou trustest deceive thee, saying, Jerusalem shall not be delivered into the hand of the king of Assyria.","11":"Behold, thou hast heard what the kings of Assyria have done to all lands, by destroying them utterly: and shalt thou be delivered?","12":"Have the gods of the nations delivered them which my fathers have destroyed; as Gozan, and Haran, and Rezeph, and the children of Eden which were in Thelasar?","13":"Where is the king of Hamath, and the king of Arpad, and the king of the city of Sepharvaim, of Hena, and Ivah?","14":"And Hezekiah received the letter of the hand of the messengers, and read it: and Hezekiah went up into the house of the LORD, and spread it before the LORD.","15":"And Hezekiah prayed before the LORD, and said, O LORD God of Israel, which dwellest between the cherubims, thou art the God, even thou alone, of all the kingdoms of the earth; thou hast made heaven and earth.","16":"LORD, bow down thine ear, and hear: open, LORD, thine eyes, and see: and hear the words of Sennacherib, which hath sent him to reproach the living God.","17":"Of a truth, LORD, the kings of Assyria have destroyed the nations and their lands,","18":"And have cast their gods into the fire: for they were no gods, but the work of men's hands, wood and stone: therefore they have destroyed them.","19":"Now therefore, O LORD our God, I beseech thee, save thou us out of his hand, that all the kingdoms of the earth may know that thou art the LORD God, even thou only.","20":"Then Isaiah the son of Amoz sent to Hezekiah, saying, Thus saith the LORD God of Israel, That which thou hast prayed to me against Sennacherib king of Assyria I have heard.","21":"This is the word that the LORD hath spoken concerning him; The virgin the daughter of Zion hath despised thee, and laughed thee to scorn; the daughter of Jerusalem hath shaken her head at thee.","22":"Whom hast thou reproached and blasphemed? and against whom hast thou exalted thy voice, and lifted up thine eyes on high? even against the Holy One of Israel.","23":"By thy messengers thou hast reproached the Lord, and hast said, With the multitude of my chariots I am come up to the height of the mountains, to the sides of Lebanon, and will cut down the tall cedar trees thereof, and the choice fir trees thereof: and I will enter into the lodgings of his borders, and into the forest of his Carmel.","24":"I have digged and drunk strange waters, and with the sole of my feet have I dried up all the rivers of besieged places.","25":"Hast thou not heard long ago how I have done it, and of ancient times that I have formed it? now have I brought it to pass, that thou shouldest be to lay waste fenced cities into ruinous heaps.","26":"Therefore their inhabitants were of small power, they were dismayed and confounded; they were as the grass of the field, and as the green herb, as the grass on the housetops, and as corn blasted before it be grown up.","27":"But I know thy abode, and thy going out, and thy coming in, and thy rage against me.","28":"Because thy rage against me and thy tumult is come up into mine ears, therefore I will put my hook in thy nose, and my bridle in thy lips, and I will turn thee back by the way by which thou camest.","29":"And this shall be a sign unto thee, Ye shall eat this year such things as grow of themselves, and in the second year that which springeth of the same; and in the third year sow ye, and reap, and plant vineyards, and eat the fruits thereof.","30":"And the remnant that is escaped of the house of Judah shall yet again take root downward, and bear fruit upward.","31":"For out of Jerusalem shall go forth a remnant, and they that escape out of mount Zion: the zeal of the LORD of hosts shall do this.","32":"Therefore thus saith the LORD concerning the king of Assyria, He shall not come into this city, nor shoot an arrow there, nor come before it with shield, nor cast a bank against it.","33":"By the way that he came, by the same shall he return, and shall not come into this city, saith the LORD.","34":"For I will defend this city, to save it, for mine own sake, and for my servant David's sake.","35":"And it came to pass that night, that the angel of the LORD went out, and smote in the camp of the Assyrians an hundred fourscore and five thousand: and when they arose early in the morning, behold, they were all dead corpses.","36":"So Sennacherib king of Assyria departed, and went and returned, and dwelt at Nineveh.","37":"And it came to pass, as he was worshipping in the house of N an class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> in his own <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span>","8":"So <span class=\"wl wl-kjv\" data-code=\"H7262\">Rabshakeh</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">warring</span> against <span class=\"wl wl-kjv\" data-code=\"H3841\">Libnah:</span> for he had <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that he was <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish.</span>","9":"And when he <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> of <span class=\"wl wl-kjv\" data-code=\"H8640\">Tirhakah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3568\">Ethiopia,</span> Behold, he is come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against thee: he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","10":"Thus shall ye <span class=\"wl wl-kjv\" data-code=\"H559\">speak</span> to <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Let not thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in whom thou <span class=\"wl wl-kjv\" data-code=\"H982\">trustest</span> <span class=\"wl wl-kjv\" data-code=\"H5377\">deceive</span> thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria.</span>","11":"Behold, thou hast <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> what the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to all <span class=\"wl wl-kjv\" data-code=\"H776\">lands,</span> by destroying them <span class=\"wl wl-kjv\" data-code=\"H2763\">utterly:</span> and shalt thou be <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered?</span>","12":"Have the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> them which my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> have <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed;</span> as <span class=\"wl wl-kjv\" data-code=\"H1470\">Gozan,</span> and <span class=\"wl wl-kjv\" data-code=\"H2771\">Haran,</span> and <span class=\"wl wl-kjv\" data-code=\"H7530\">Rezeph,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5729\">Eden</span> which were in <span class=\"wl wl-kjv\" data-code=\"H8515\">Thelasar?</span>","13":"Where is the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H2574\">Hamath,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H774\">Arpad,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H5617\">Sepharvaim,</span> of <span class=\"wl wl-kjv\" data-code=\"H2012\">Hena,</span> and <span class=\"wl wl-kjv\" data-code=\"H5755\">Ivah?</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">received</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">letter</span> of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> it: and <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwellest</span> between the <span class=\"wl wl-kjv\" data-code=\"H3742\">cherubims,</span> thou art the <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> even thou alone, of all the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> and <span class=\"wl wl-kjv\" data-code=\"H776\">earth.</span>","16":"<span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> bow <span class=\"wl wl-kjv\" data-code=\"H5186\">down</span> thine <span class=\"wl wl-kjv\" data-code=\"H241\">ear,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear:</span> <span class=\"wl wl-kjv\" data-code=\"H6491\">open,</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see:</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H5576\">Sennacherib,</span> which hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> him to <span class=\"wl wl-kjv\" data-code=\"H2778\">reproach</span> the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","17":"Of a <span class=\"wl wl-kjv\" data-code=\"H551\">truth,</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> have <span class=\"wl wl-kjv\" data-code=\"H2717\">destroyed</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> and their <span class=\"wl wl-kjv\" data-code=\"H776\">lands,</span>","18":"And have <span class=\"wl wl-kjv\" data-code=\"H5414\">cast</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> into the <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> for they were no <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> but the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> and <span class=\"wl wl-kjv\" data-code=\"H68\">stone:</span> therefore they have <span class=\"wl wl-kjv\" data-code=\"H6\">destroyed</span> them.","19":"Now therefore, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> I beseech thee, <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> thou us out of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> that all the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that thou art the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> even thou only.","20":"Then <span class=\"wl wl-kjv\" data-code=\"H3470\">Isaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H531\">Amoz</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> That which thou hast <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> to me against <span class=\"wl wl-kjv\" data-code=\"H5576\">Sennacherib</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard.</span>","21":"This is the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> concerning him; The <span class=\"wl wl-kjv\" data-code=\"H1330\">virgin</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> hath <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> thee, and laughed thee to <span class=\"wl wl-kjv\" data-code=\"H3932\">scorn;</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> hath <span class=\"wl wl-kjv\" data-code=\"H5128\">shaken</span> her <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> at <span class=\"wl wl-kjv\" data-code=\"H310\">thee.</span>","22":"Whom hast thou <span class=\"wl wl-kjv\" data-code=\"H2778\">reproached</span> and <span class=\"wl wl-kjv\" data-code=\"H1442\">blasphemed?</span> and against whom hast thou <span class=\"wl wl-kjv\" data-code=\"H7311\">exalted</span> thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> on <span class=\"wl wl-kjv\" data-code=\"H4791\">high?</span> even against the <span class=\"wl wl-kjv\" data-code=\"H6918\">Holy</span> One of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","23":"<span class=\"wl wl-kjv\" data-code=\"H3027\">By</span> thy <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H2778\">reproached</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> With the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of my <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> I am come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H4791\">height</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> to the <span class=\"wl wl-kjv\" data-code=\"H3411\">sides</span> of <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> and will cut <span class=\"wl wl-kjv\" data-code=\"H3772\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H6967\">tall</span> cedar <span class=\"wl wl-kjv\" data-code=\"H730\">trees</span> thereof, and the <span class=\"wl wl-kjv\" data-code=\"H4004\">choice</span> fir <span class=\"wl wl-kjv\" data-code=\"H1265\">trees</span> thereof: and I will <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H4411\">lodgings</span> of his <span class=\"wl wl-kjv\" data-code=\"H7093\">borders,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H3293\">forest</span> of his <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel.</span>","24":"I have <span class=\"wl wl-kjv\" data-code=\"H6979\">digged</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drunk</span> <span class=\"wl wl-kjv\" data-code=\"H2114\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H3709\">sole</span> of my <span class=\"wl wl-kjv\" data-code=\"H6471\">feet</span> have I <span class=\"wl wl-kjv\" data-code=\"H2717\">dried</span> up all the <span class=\"wl wl-kjv\" data-code=\"H2975\">rivers</span> of besieged <span class=\"wl wl-kjv\" data-code=\"H4693\">places.</span>","25":"Hast thou not <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> long <span class=\"wl wl-kjv\" data-code=\"H7350\">ago</span> how I have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> it, and of <span class=\"wl wl-kjv\" data-code=\"H6924\">ancient</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">times</span> that I have <span class=\"wl wl-kjv\" data-code=\"H3335\">formed</span> it? now have I <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> it to pass, that thou shouldest be to lay <span class=\"wl wl-kjv\" data-code=\"H7582\">waste</span> <span class=\"wl wl-kjv\" data-code=\"H1219\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> into <span class=\"wl wl-kjv\" data-code=\"H5327\">ruinous</span> <span class=\"wl wl-kjv\" data-code=\"H1530\">heaps.</span>","26":"Therefore their <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> were of <span class=\"wl wl-kjv\" data-code=\"H7116\">small</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">power,</span> they were <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed</span> and <span class=\"wl wl-kjv\" data-code=\"H954\">confounded;</span> they were as the <span class=\"wl wl-kjv\" data-code=\"H6212\">grass</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and as the <span class=\"wl wl-kjv\" data-code=\"H3419\">green</span> <span class=\"wl wl-kjv\" data-code=\"H1877\">herb,</span> as the <span class=\"wl wl-kjv\" data-code=\"H2682\">grass</span> on the <span class=\"wl wl-kjv\" data-code=\"H1406\">housetops,</span> and as corn <span class=\"wl wl-kjv\" data-code=\"H7711\">blasted</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> it be grown <span class=\"wl wl-kjv\" data-code=\"H7054\">up.</span>","27":"But I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> thy <span class=\"wl wl-kjv\" data-code=\"H3427\">abode,</span> and thy going <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and thy coming <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H7264\">rage</span> against me.","28":"Because thy <span class=\"wl wl-kjv\" data-code=\"H7264\">rage</span> against me and thy <span class=\"wl wl-kjv\" data-code=\"H7600\">tumult</span> is come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into mine <span class=\"wl wl-kjv\" data-code=\"H241\">ears,</span> therefore I will <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H2397\">hook</span> in thy <span class=\"wl wl-kjv\" data-code=\"H639\">nose,</span> and my <span class=\"wl wl-kjv\" data-code=\"H4964\">bridle</span> in thy <span class=\"wl wl-kjv\" data-code=\"H8193\">lips,</span> and I will turn thee <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> by which thou <span class=\"wl wl-kjv\" data-code=\"H935\">camest.</span>","29":"And this shall be a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> unto thee, Ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> this <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> such things as <span class=\"wl wl-kjv\" data-code=\"H5599\">grow</span> of themselves, and in the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> that which <span class=\"wl wl-kjv\" data-code=\"H7823\">springeth</span> of the same; and in the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> <span class=\"wl wl-kjv\" data-code=\"H2232\">sow</span> ye, and <span class=\"wl wl-kjv\" data-code=\"H7114\">reap,</span> and <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruits</span> thereof.","30":"And the <span class=\"wl wl-kjv\" data-code=\"H7604\">remnant</span> that is <span class=\"wl wl-kjv\" data-code=\"H6413\">escaped</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> shall yet <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> take <span class=\"wl wl-kjv\" data-code=\"H8328\">root</span> <span class=\"wl wl-kjv\" data-code=\"H4295\">downward,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">bear</span> <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">upward.</span>","31":"For out of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant,</span> and they that <span class=\"wl wl-kjv\" data-code=\"H6413\">escape</span> out of <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion:</span> the <span class=\"wl wl-kjv\" data-code=\"H7068\">zeal</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this.","32":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> He shall not <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into this <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3384\">shoot</span> an <span class=\"wl wl-kjv\" data-code=\"H2671\">arrow</span> there, nor come <span class=\"wl wl-kjv\" data-code=\"H6923\">before</span> it with <span class=\"wl wl-kjv\" data-code=\"H4043\">shield,</span> nor <span class=\"wl wl-kjv\" data-code=\"H8210\">cast</span> a <span class=\"wl wl-kjv\" data-code=\"H5550\">bank</span> against it.","33":"By the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that he <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> by the same shall he <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and shall not <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into this <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","34":"For I will <span class=\"wl wl-kjv\" data-code=\"H1598\">defend</span> this <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> to <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> it, for mine own sake, and for my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> sake.","35":"And it came to pass that <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> that the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> in the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of the <span class=\"wl wl-kjv\" data-code=\"H804\">Assyrians</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand:</span> and when they arose <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> behold, they were all <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> <span class=\"wl wl-kjv\" data-code=\"H6297\">corpses.</span>","36":"So <span class=\"wl wl-kjv\" data-code=\"H5576\">Sennacherib</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">departed,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> at <span class=\"wl wl-kjv\" data-code=\"H5210\">Nineveh.</span>","37":"And it came to pass, as he was <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipping</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H5268\">Nisroch</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">god,</span> that <span class=\"wl wl-kjv\" data-code=\"H152\">Adrammelech</span> and <span class=\"wl wl-kjv\" data-code=\"H8272\">Sharezer</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> and they <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H780\">Armenia.</span> And <span class=\"wl wl-kjv\" data-code=\"H634\">Esarhaddon</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"scheurde hij","tekst":"Om daarmede de droefheid zijns harten te betuigen. Alzo boven, 2Ki 18:37."},{"catchword":"bedekte zich","tekst":"Zie van deze ceremonie Gen 37:34."}],"2":[{"catchword":"den hofmeester,","tekst":"Hebreeuws, die over het huis was. Zie boven, 2Ki 18:18."},{"catchword":"den schrijver,","tekst":"Zie boven, 2Ki 12:10."},{"catchword":"Jesája,","tekst":"Wiens profetisch boek onder de boeken der grote profeten het eerste is."}],"3":[{"catchword":"der benauwdheid,","tekst":"Te weten, die ons overkomen is van de vijanden, die mij en mijn volk scheiden en dreigen en den levenden God lasteren."},{"catchword":"kinderen","tekst":"Het is een gelijkenis, waarin de koning zich vergelijkt bij een barende vrouw, zijn volk bij de vrucht, en den tegenwoordigen nood bij de benauwdheid en het gevaar, waarin een vrouw met haar vrucht is, die geen kracht heeft om deze, als zij in de geboorte staat [vergelijk Hos 13:13 ] ter wereld te brengen. Hij wil zeggen dat zij in het uiterste gevaar waren en zonder vermogen om zich daaruit te helpen."}],"4":[{"catchword":"Misschien zal de HEERE,","tekst":"Dat is, in achting nemen; dit is hier geen woord van twijfeling, maar van goede hoop. Vergelijk Num 23:3; Jos 14:12, enz."},{"catchword":"en te schelden,","tekst":"Anders, en zal straffen de woorden, die de HEERE uw God gehoord heeft."},{"catchword":"dat gevonden wordt","tekst":"Dat is, hetwelk tegenwoordig en voorhanden en in wezen is. Versta door dit overblijfsel den stam van Juda, die den rechten godsdienst behouden had en nog uit zijn land niet verdreven was."}],"6":[{"catchword":"dienaars","tekst":"Hebreeuws, jongelingen; dat is, dienaren, of officieren, in getal drie, hier tevoren genaamd boven, 2Ki 18:17. Van het Hebreeuwse woord, zie Gen 22:5."}],"7":[{"catchword":"geest in hem geven,","tekst":"Dat is, wil, voornemen, ijver, genegenheid, beweging. Alzo wordt het woord geest genomen in het goede, 2Ch 36:22; Ezr 1:1; Hag 1:14; en in het kwade, Jdg 8:3; Job 15:13; Pro 16:32, en Pro 25:28. Anderen nemen het woord geest voor geblaas, wind, gedruis."},{"catchword":"gerucht horen zal,","tekst":"Namelijk, van Tirgaka, den koning van Cusch, die uitkomen zou om hem te bestrijden. Zie onder, vs.9."}],"8":[{"catchword":"Libna;","tekst":"Een stad in den stam van Juda, van welke zie Jos 10:29, en Jos 15:42, en Jos 21:13."}],"9":[{"catchword":"hij nu hoorde","tekst":"Namelijk, de koning van Assyrië."},{"catchword":"koning van Cusch,","tekst":"Dat is, der Arabieren, of der Moren. Zie Num 12:1."},{"catchword":"zond hij","tekst":"Hebreeuws, hij keerde weder en zond; dat is, hij zond wederom. Zie Num 11:4."}],"11":[{"catchword":"verbannende;","tekst":"Zie Deu 2:34."},{"catchword":"zoudt gij gered worden?","tekst":"Dat is, gij zult ganselijk niet gered worden. Het is een manier van vragen, die zeer sterkelijk loochent. Zie Gen 18:17."}],"12":[{"catchword":"Gozan,","tekst":"Zie boven, 2Ki 17:6, en de aantekening."},{"catchword":"Haran,","tekst":"Een stad in Mesopotamië. Zie Gen 11:31."},{"catchword":"Rezef,","tekst":"Hebreeuws, Retsef, gelegen in Mesopotamië."},{"catchword":"Eden,","tekst":"Dit was een landschap, gelegen in Chaldea of Babylonië. Zie daarvan Gen 2:8; Eze 27:23."},{"catchword":"Telasser waren?","tekst":"De naam, naar eniger gevoelen, ener sterkte, gelegen in het midden van den Eufraat. Anderen nemen het voor een landschap."}],"13":[{"catchword":"Arpad,","tekst":"Zie boven, 2Ki 18:34."},{"catchword":"Hena en Ivva?","tekst":"Zie boven, 2Ki 18:34."}],"14":[{"catchword":"huis des HEEREN,","tekst":"Dat is, den tempel."},{"catchword":"voor het aangezicht des HEEREN","tekst":"Dat is, in het voorhof, tegenover de ark des verbonds, welke was in het heilige der heiligen, tot een teken van Gods tegenwoordige bijwoning. Zie Lev 1:3, en Lev 9:24."}],"15":[{"catchword":"de cherubim","tekst":"Versta, de twee cherubim, die aan beide de einden van het verzoendeksel der ark stonden, Exo 25:18, enz. Deze benaming Godes is ook 1Sa 4:4. Zie Num 7:89, met de aantekening."},{"catchword":"woont","tekst":"Of, zit."}],"16":[{"catchword":"dezen gezonden heeft,","tekst":"Namelijk, Rabsake. Zie boven, 2Ki 18:17, enz."}],"18":[{"catchword":"geworpen;","tekst":"Hebreeuws, gegeven."}],"21":[{"catchword":"woord,","tekst":"Versta, de zaak, die de Heere den profeet Jesaja geopenbaard had, rakende den koning van Assyrië."},{"catchword":"De jonkvrouw,","tekst":"Versta, den staat of het koninkrijk des Joodsen volks, of de stad Jeruzalem, welke men oordeelt aldus genaamd te zijn, omdat zij nog van niemand ten enenmaal overweldigd en ingenomen was geweest."},{"catchword":"dochter van Sion,","tekst":"Gelijk het woord dochters, na den naam ener stad gesteld zijnde, betekent de dorpen en kleine steden daaronder sorterende, Num 21:15; Jdg 1:27; alzo het woord dochter voor den naam ener stad of van een land gesteld zijnde, betekent de inwoners daarvan, gelijk 1Ki 19:21; Psa 45:13, en Psa 137:8; Isa 23:12, en Isa 47:1."},{"catchword":"schudt het hoofd","tekst":"Het hoofd schudden achter, of over iemand, is, hem verachten en bespotten; Job 16:4; Psa 22:8, en Psa 44:15; Isa 37:22; Jer 18:16; Lam 2:15."}],"22":[{"catchword":"en uw ogen","tekst":"Anders, ja gij hebt uw ogen omhoog opgeheven tegen des Heiligen Israëls."},{"catchword":"Heilige Israëls","tekst":"God is zo genaamd, niet alleen omdat Hij heilig is, ja de heiligheid zelve, maar ook omdat Hij zich een volk afzondert, hetwelk Hij door het bloed en den Geest van Christus heiligt. Zie deze benaming ook Isa 5:24; Jer 51:5, enz."}],"23":[{"catchword":"Door middel","tekst":"Hebreeuws, door de hand."},{"catchword":"uwer boden","tekst":"Namelijk, Tartan, Rabsaris en Rabsake; boven, 2Ki 18:17."},{"catchword":"Libanon;","tekst":"Zie van dit gebergte 1Ki 4:33."},{"catchword":"hoge cederbomen,","tekst":"Hebreeuws, de hoogte zijner cederbomen, en de keur zijnen dennebomen. Sommigen verstaan hiermede de schone en sterke steden van Juda, die de koning van Assyrië ingenomen had; boven, 2Ki 18:13."},{"catchword":"zijn uiterste herberg,","tekst":"Hebreeuws, de herberg van zijn einde, of uiterste. Versta, al de plaatsen van Judea, in wat uiterste einden of hoeken des lands dezelve zouden mogen gelegen zijn. De zin is dat de koning van Assyrië voorgenomen had geen plaats vrij te laten, maar het gehele land af te lopen, in te nemen en te verwoesten."},{"catchword":"schonen velds","tekst":"Anders, Karmels. De naam van een aangenaam en vruchtbaar gebergte, gelegen in den stam van Issaschar, van hetwelk zie 1Ki 18:19; het woord schijnt hier genomen te worden voor een schone, lieflijke en vruchtbare plaats. Alzo Isa 10:18; Jer 2:7, en Jer 4:26, enz."}],"24":[{"catchword":"Ik heb gegraven","tekst":"Dat is, hoewel ik met mijn leger door dorre en waterloze landen gekomen ben, en dat men mij gezocht heeft alle water te benemen, opdat ik genoodzaakt zou zijn dit land te ruimen, 2Ch 32:3-4, nochtans heb ik, door mijn wijsheid en macht, water genoeg bekomen, zelfs in plaatsen, waar het tevoren niet was."},{"catchword":"vreemde wateren;","tekst":"Dat is, nieuwe en nooit tevoren gevonden of bekende wateren."},{"catchword":"en ik heb met mijn voetzolen","tekst":"Hij wil zeggen dat hij niet alleen zijn heir kon verzorgen van water, maar ook zijn vijanden, die hij belegerde, daarvan beroven, en dat door de grote menigte van krijgslieden, die hem volgden."},{"catchword":"rivieren","tekst":"Hebreeuws, rivieren, of beken der belegering."}],"25":[{"catchword":"Hebt gij niet gehoord,","tekst":"Tot hiertoe zijn verhaald de woorden des konings van Assyrië. Nu volgen hier weder de woorden Gods, waarmede Hij den koning toespreekt. Hij wil zeggen, Gij hebt u niet te beroemen op uw victoriën, want zij zijn mijn werk, tot straf der volken, door de verwoesting hunner steden en landen."},{"catchword":"van oude dagen af","tekst":"Hebreeuws, van dagen der oudheid."}],"26":[{"catchword":"Daarom","tekst":"De zin is: Gelijk de overwinning van God komt, alzo ook de vrees en verslagenheid en de zwakheid, waardoor men overwonnen wordt."},{"catchword":"handeloos;","tekst":"Hebreeuws, kort van hand; dat is, van kleine kracht, van krank vermogen. Alzo Isa 37:27."},{"catchword":"groene grasscheutjes,","tekst":"Hebreeuws, de groente van het grasje, of kruidje. Anders, het moeskruid der kruidjes; dat is, het kleine moeskruidje."}],"27":[{"catchword":"zitten,","tekst":"Dat is, als uw voornemen, raad, aanslagen en bedrijf. Vergelijk hiermede de aantekening Deu 31:2."}],"28":[{"catchword":"zo zal Ik","tekst":"Dit is een gelijkenis, genomen van degenen, die met wrede beesten omgaan; om daarmede te verklaren de kracht Gods, die Hij gebruikt om de razende tirannen te bedwingen."},{"catchword":"Mijn gebit","tekst":"Een andere gelijkenis genomen van degenen, die een wild paard te regeren hebben."},{"catchword":"in uw lippen,","tekst":"Dat is, in uw mond."}],"29":[{"catchword":"En dat zij u een teken,","tekst":"Dit wordt gesproken tot den koning Hizkia, om hem en zijn volk te verzekeren, dat zij van het geweld des konings van Assyrië verlost zouden worden."},{"catchword":"wat van zelf gewassen is;","tekst":"Het Hebreeuwse woord betekent hetgeen na den oogst van de uitgevallen zaden vanzelf wast zonder den arbeid der mensen."},{"catchword":"wat daarvan weder uitspruit;","tekst":"Het teken was, dat zij niet alleen in het eerste jaar, als het land van de Assyriërs afgelopen was, maar ook in het volgende daarna genoeg leeftocht, vanzelf opgewassen, in het veld vinden zouden. Zie wijders Isa 37:30."}],"30":[{"catchword":"ontkomene,","tekst":"Hebreeuws, de ontkoming; dat is, die ontkomen zullen zijn. Alzo in vs.31."},{"catchword":"wederom","tekst":"Hebreeuws, zal wortel toedoen."},{"catchword":"nederwaarts","tekst":"Een gelijkenis, genomen van de planten, met welke betekend wordt dat die van Juda gans groten voorspoed en welstand zouden hebben."},{"catchword":"vrucht dragen","tekst":"Hebreeuws, vrucht maken. Het Hebreeuwse woord peri betekent hier niet alleen de vruchten, maar ook de struiken, die de vruchten dragen. Alzo Lev 23:40. Zie de aantekening."}],"31":[{"catchword":"overblijfsel uitgaan,","tekst":"Te weten, dat aan de handen der vijanden ontkomen zal, zijnde bewaard en verzekerd geweest in de stad Jeruzalem, die in het veld der Assyriërs niet vallen zal."},{"catchword":"de ijver","tekst":"Dat is, de brandende liefde Gods voor zijn volk en zijn heftige gramschap tegen de vijanden zullen deze verlossing teweegbrengen. Vergelijk Isa 9:6."}],"34":[{"catchword":"om Mijnentwil,","tekst":"Dat is, opdat mijn naam bekend, geprezen, geëerd en gevreesd worde. Vergelijk Pro 16:4; Isa 48:9, Isa 48:11; Eze 36:21-23."},{"catchword":"om Davids,","tekst":"Zie 1Ki 11:12."}],"35":[{"catchword":"leger van Assyrië","tekst":"Versta, Sanheribs leger, dat voor Libna lag, [of naar sommiger gevoelen, in optocht was naar Jeruzalem], boven, vs.8, waar Rabsake weder tot hem kwam, zonder Jeruzalem te belegeren, gelijk God beloofd had, vs.32. Vergelijk Isa 37:33, Isa 37:36."},{"catchword":"zij zich des morgens","tekst":"Namelijk, de koning van Assyrië en zijn raadsheren."},{"catchword":"die allen waren dode lichamen","tekst":"Te weten, die van den engel geslagen waren."}],"36":[{"catchword":"Ninevé","tekst":"Zie Gen 10:11-12."}],"37":[{"catchword":"Nisroch,","tekst":"De naam van den afgod der Ninevieten."},{"catchword":"nederboog,","tekst":"Te weten, om hem aan te bidden en godsdienstiglijk te eren."},{"catchword":"hem met het zwaard","tekst":"Gelijk voorzegd was, boven, vs.7."},{"catchword":"Ararát;","tekst":"Zie Gen 8:4."},{"catchword":"Esar-haddon,","tekst":"Hij regeerde [zoals enigen schrijven] tien jaren in Ninevé. Na dezen is de monarchie van de Assyriërs op de Babyloniërs gekomen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass when King Hizkia heard (that) then he rent his clothes, [To testify thereby the grief of his heart. So above chap. 18. verse 37.] and covered himself with a sack, [see of this ceremonie, Gen. 37 on verse 34.] and went into the house of the Lord."}],"2":[{"catchword":null,"tekst":"then he sent Eliakim the steward, [Heb, who was over the house. See above chap. 18. on verse 8.] and Sebna the Scribe, [see above chap. 12 on verse 10.] and the eldest of the priests covered with sacks, to Isaia the prophet, [whose prophetical book is the first among the books of the great prophets] the son of Amoz. [see Isaia 1.1.]"}],"3":[{"catchword":null,"tekst":"And they said unto him, thus saith hizkia; this day is a day of distress and of reviling, and of blasphemy, [To wit, which is come upon us by reason of our enemies, who revile and threaten me and my people, and blespheme the living God] for the children are come to birth, and there is no strength to bring forth. [it is a comparison wherein the King compareth himself to a traveling woman, his people to the fruit of the womb, and the present strait to the pang and peril, wherein a woman is with her fruit, having no strength to bring forth the same into the world, when she is upon the very point and time of her delivery. Compare Hos. 13.13. intimating hereby that they were in the extremest danger, and without any power at all, to save themselves.]"}],"4":[{"catchword":null,"tekst":"It may be the LORD thy God will hear [that is, take into consideration. The word peradventure, or it may be, is not here a word of doubting but of good hope. Compare Num. 23.3 and Jos. 14.12, &c.] all the words of Robsake, whom his Lord the king of Assyria hath sent to reproach the living God, and to revile (him) with words, which the Lord thy God, hath heard. [Oth. And will reprove the words which the LORD thy God hath heard] lift then up a prayer for the remnant that is found. [That is, which is present, and at hand, and in being. And understand by this remnant the tribe of Juda, which had kept the right worship of God and were not yet driven out of their land.]"}],"5":[{"catchword":null,"tekst":"And the servants of King Hizkia came to Isaia."}],"6":[{"catchword":null,"tekst":"And Isaia said unto them: thus shall ye say unto your Lord, thus saith the LORD; be not afraid of the words which thou hast heard, wherewith the servants [Heb. Young men, i.e. servants, or officers in number three, named above 18. v. 17. of the Hebrew word see Gen. 22. on v. 5.] of the king of Assyria have blasphemed me."}],"7":[{"catchword":null,"tekst":"Behold, I will give a spirit [i.e. will purpose, zeal, inclination, motion. Thus the word spirit is taken sometimes in a good sence. 2 Chron. 36.22. Ezek. 1.1. Hag. 1.14 and sometimes in a bad, Jud 8:3. job 15.13. Prov. 16.32 and 25.28. Others take the word spirit for blast, wind, sound, noise] into him, (so) that he shall hear a romour [namely of Tithaka King of curse, that should come forth to fight against him. See below v. 9.] and return into his (own) land: and I will cause him to fall by the sword in his (own) land."}],"8":[{"catchword":null,"tekst":"So Rabsake returned, and sound the King of Assyria fighting against Libna; [A city in the tribe of Juda: of which see jos. 190.20 and 15.42 and 21.23.] for he heard that he had departed from Lachis"}],"9":[{"catchword":null,"tekst":"Now when he [Namely, the king of Assyria] heard say of Turbaka king cursh, [i.e. of the Arabians, or of the Moors. See num. 12. on v. 1.] Behold he is come forth ot fight against thee; he sent messenger again [Heb, he returned and sent; that is he sent again. See num. 11 on v.4.] unto Hizkia, saying;"}],"10":[{"catchword":null,"tekst":"Thus shall speak to Hizkia the king of Juda, saying, let not thy God, on whom thou trustest, deceive thee saying: Jerusalem shall not be delivered into the hand of the king of Assyria"}],"11":[{"catchword":null,"tekst":"Behold, thou hast heard what the king of Assyria have done to all lands, banningthem; [see Deut. 2 on verse 34.] and shouldest thou be delivered? [i.e. thou shalt in no wife be delivered. It is a manner of questioning which dnieth very strongly. See gen. 18 on v.17.]"}],"12":[{"catchword":null,"tekst":"Have the Gods of the Nations, which my fathers have destroyed and delivered them? (as) gozan, [ see above chap. 17.6 and the annotate.] and Horam, [a city of Mesopotamia. See Gen. 11 on v. 31.] and reseph, [Hebr. Retseph, lying in Mesopotamia] and the children of Eden [this was a countrey lying in chaldea or Babylonia. See thereof gen. 2 on verse 8. Ezek. 27.23.] which were in Telasser. [the name (as some conceive) of a fort lying in the midst of the Euphrates. Others hold it to be a countrey.]"}],"13":[{"catchword":null,"tekst":"Where is the king of Hamath, ad the king of Arpad and the king of the city of Sepharvam, of Hena and Juva? [see above chap. 18. on v.34.]"}],"14":[{"catchword":null,"tekst":"Now wh // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
