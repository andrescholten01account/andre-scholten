udas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In het zevenentwintigste jaar van Jerobeam, de koning van Israël, werd Azaria koning, de zoon van Amazia, de koning van Juda.","2":"Hij was zestien jaar oud toen hij koning werd, en hij regeerde tweeënvijftig jaar in Jeruzalem; en de naam van zijn moeder was Jecholia, uit Jeruzalem.","3":"En hij deed wat recht was in de ogen van de HEERE, precies zoals zijn vader Amazia gedaan had.","4":"Alleen werden de hoogten niet weggenomen; het volk offerde en bracht nog reukoffers op de hoogten.","5":"En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.","6":"Het overige nu van de geschiedenis van Azaria, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?","7":"En Azaria stierf en werd bij zijn voorouders begraven, in de stad van David; en zijn zoon Jotham werd koning in zijn plaats.","8":"In het achtendertigste jaar van Azaria, de koning van Juda, regeerde Zacharia, de zoon van Jerobeam, over Israël te Samaria, zes maanden.","9":"En hij deed wat kwaad was in de ogen van de HEERE, zoals zijn voorouders gedaan hadden; hij week niet af van de zonden van Jerobeam, de zoon van Nebat, die Israël liet zondigen.","10":"En Sallum, de zoon van Jabes, maakte een samenzwering tegen hem, en sloeg hem voor het volk neer, en doodde hem; en hij werd koning in zijn plaats.","11":"Het overige nu van de geschiedenis van Zacharia, zie, dat is geschreven in het boek van de kronieken van de koningen van Israël.","12":"Dit was het woord van de HEERE, dat Hij tot Jehu gesproken had: Uw zonen zullen tot het vierde geslacht op de troon van Israël zitten; en zo is het gebeurd.","13":"Sallum, de zoon van Jabes, werd koning in het negenendertigste jaar van Uzzia, de koning van Juda; en hij regeerde een volle maand te Samaria.","14":"Want Menahem, de zoon van Gadi, trok op vanuit Thirza, en kwam naar Samaria, en sloeg Sallum, de zoon van Jabes, te Samaria neer, en doodde hem, en werd koning in zijn plaats.","15":"Het overige nu van de geschiedenis van Sallum, en zijn samenzwering die hij smeedde, zie, die zijn geschreven in het boek van de kronieken van de koningen van Israël.","16":"Toen sloeg Menahem Tifsah, met allen die daarin waren, ook haar gebied vanaf Thirza af; omdat men niet voor hem had opengedaan, sloeg hij hen; al haar zwangere vrouwen sneed hij open.","17":"In het negenendertigste jaar van Azaria, de koning van Juda, werd Menahem, de zoon van Gadi, koning over Israël, en regeerde tien jaar te Samaria.","18":"En hij deed wat kwaad was in de ogen van de HEERE; hij week al zijn dagen niet af van de zonden van Jerobeam, de zoon van Nebat, die Israël liet zondigen.","19":"Toen kwam Pul, de koning van Assyrië, tegen het land; en Menahem gaf aan Pul duizend talenten van het zilver, opdat zijn hand met hem zou zijn, om het koninkrijk in zijn hand te versterken.","20":"Menahem nu bracht dit geld op van Israël, van alle vermogende mannen, om aan de koning van Assyrië te geven, voor elke man vijftig zilveren sikkels; zo keerde de koning van Assyrië terug, en bleef daar niet in het land.","21":"Het overige nu van de geschiedenis van Menahem, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","22":"Daarna stierf Menahem en zijn zoon Pekahia werd koning in zijn plaats.","23":"In het vijftigste jaar van Azaria, de koning van Juda, werd Pekahia, de zoon van Menahem, koning over Israël, en regeerde twee jaar te Samaria.","24":"En hij deed wat kwaad was in de ogen van de HEERE; hij week niet af van de zonden van Jerobeam, de zoon van Nebat, die Israël liet zondigen.","25":"En Pekah, de zoon van Remalia, zijn hoofdman, maakte een samenzwering tegen hem, en sloeg hem te Samaria neer, in het paleis van het huis van de koning, samen met Argob en Arje, en met hem vijftig mannen van de kinderen van de Gileadieten; zo doodde hij hem, en werd koning in zijn plaats.","26":"Het overige nu van de geschiedenis van Pekahia, en alles wat hij gedaan heeft, zie, dat is geschreven in het boek van de kronieken van de koningen van Israël.","27":"In het tweeënvijftigste jaar van Azaria, de koning van Juda, werd Pekah, de zoon van Remalia, koning over Israël, en regeerde twintig jaar te Samaria.","28":"En hij deed wat kwaad was in de ogen van de HEERE; hij week niet af van de zonden van Jerobeam, de zoon van Nebat, die Israël liet zondigen.","29":"In de dagen van Pekah, de koning van Israël, kwam Tiglath-Pilezer, de koning van Assyrië, en nam Ijon in, en Abel-Beth-Maächa, en Janoah, en Kedes, en Hazor, en Gilead, en Galilea, het hele land van Nafthali; en hij voerde hen weg naar Assyrië.","30":"En Hosea, de zoon van Ela, smeedde een samenzwering tegen Pekah, de zoon van Remalia, en sloeg hem neer, en doodde hem, en werd koning in zijn plaats; in het twintigste jaar van Jotham, de zoon van Uzzia.","31":"Het overige nu van de geschiedenis van Pekah, en alles wat hij gedaan heeft, zie, dat is geschreven in het boek van de kronieken van de koningen van Israël.","32":"In het tweede jaar van Pekah, de zoon van Remalia, de koning van Israël, werd Jotham koning, de zoon van Uzzia, de koning van Juda.","33":"Hij was vijfentwintig jaar oud toen hij koning werd, en regeerde zestien jaar te Jeruzalem; en de naam van zijn moeder was Jerusa, de dochter van Zadok.","34":"En hij deed wat recht was in de ogen van de HEERE; precies zoals zijn vader Uzzia gedaan had, deed hij.","35":"Alleen werden de hoogten niet weggenomen; het volk offerde en bracht nog reukoffers op de hoogten; hij bouwde de hoge poort aan het huis van de HEERE.","36":"Het overige nu van de geschiedenis van Jotham, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?","37":"In die dagen begon de HEERE tegen Juda te zenden Rezin, de koning van Syrië, en Pekah, de zoon van Remalia.","38":"En Jotham stierf en werd bij zijn voorouders begraven in de stad van zijn vader David; en zijn zoon Achaz werd koning in zijn plaats."},"SV":{"1":"In het zeven en twintigste jaar van Jerobeam, den koning van Israël, werd koning Azaria, de zoon van Amazia, den koning van Juda.","2":"Hij was zestien jaren oud, toen hij koning werd, en hij regeerde twee en vijftig jaren te Jeruzalem; en de naam zijner moeder was Jecholia van Jeruzalem.","3":"En hij deed dat recht was in de ogen des HEEREN, naar al wat zijn vader Amazia gedaan had.","4":"Alleenlijk werden de hoogten niet weggenomen; het volk offerde en rookte nog op de hoogten.","5":"En de HEERE plaagde den koning, dat hij melaats werd tot den dag zijns doods; en hij woonde in een afgezonderd huis; doch Jotham, de zoon des konings, was over het huis, richtende het volk des lands.","6":"Het overige nu der geschiedenissen van Azaria, en al wat hij gedaan heeft, zijn die niet geschreven in het boek der kronieken der koningen van Juda?","7":"En Azaria ontsliep met zijn vaderen, en zij begroeven hem bij zijn vaderen, in de stad Davids; en zijn zoon Jotham werd koning in zijn plaats.","8":"In het acht en dertigste jaar van Azaria, den koning van Juda, regeerde Zacharia, de zoon van Jerobeam, over Israël te Samaria, zes maanden.","9":"En hij deed dat kwaad was in de ogen des HEEREN, gelijk als zijn vaderen gedaan hadden; hij week niet af van de zonden van Jerobeam, den zoon van Nebat, die Israël zondigen deed.","10":"En Sallum, de zoon van Jabes, maakte een verbintenis tegen hem, en sloeg hem voor het volk, en doodde hem; en hij werd koning in zijn plaats.","11":"Het overige nu der geschiedenissen van Zacharia, ziet, dat is geschreven in het boek der kronieken der koningen van Israël.","12":"Dit was het woord des HEEREN, dat Hij gesproken had tot Jehu, zeggende: U zullen zonen van het vierde gelid op den troon van Israël zitten; en het is alzo geschied.","13":"Sallum, de zoon van Jabes, werd koning, in het negen en dertigste jaar van Uzzia, den koning van Juda; en hij regeerde een volle maand te Samaria.","14":"Want Menahem, de zoon van Gadi, toog op van Thirza, en kwam te Samaria, en sloeg Sallum, den zoon van Jabes, te Samaria, en doodde hem, en werd koning in zijn plaats.","15":"Het overige nu der geschiedenissen van Sallum, en zijn verbintenis, die hij maakte, ziet, die zijn geschreven in het boek der kronieken der koningen van Israël.","16":"Toen sloeg Menahem Tifsah, met allen, die daarin waren, ook haar landpalen van Thirza af; omdat men niet *voor* *hem* had opengedaan, zo sloeg hij *hen*; al haar bevruchte vrouwen hieuw hij in stukken.","17":"In het negen en dertigste jaar van Azaria, den koning van Juda, werd Menahem, de zoon van Gadi, koning over Israël, *en* *regeerde* tien jaren te Samaria.","18":"En hij deed dat kwaad was in de ogen des HEEREN; hij week al zijn dagen niet af van de zonden van Jerobeam, den zoon van Nebat, die Israël zondigen deed.","19":"*Toen* kwam Pul, de koning van Assyrië, tegen het land; en Menahem gaf aan Pul duizend talenten zilvers, opdat zijn hand met hem zoude zijn, om het koninkrijk in zijn hand te sterken.","20":"Menahem nu bracht dit geld op van Israël, van alle geweldigen van vermogen, om den koning van Assyrië te geven, voor elk man vijftig zilveren sikkels; alzo keerde de koning van Assyrië weder, en bleef daar niet in het land.","21":"Het overige nu der geschiedenissen van Menahem, en al wat hij gedaan heeft, is dat niet geschreven in het boek der kronieken der koningen van Israël?","22":"Daarna ontsliep Menahem met zijn vaderen; en zijn zoon Pekahia werd koning in zijn plaats.","23":"In het vijftigste jaar van Azaria, den koning van Juda, werd Pekahia, de zoon van Menahem, koning over Israël, *en* *regeerde* twee jaren te Samaria.","24":"En hij deed dat kwaad was in de ogen des HEEREN; hij week niet af van de zonden van Jerobeam, den zoon van Nebat, die Israël zondigen deed.","25":"En Pekah, de zoon van Remalia, zijn hoofdman, maakte een verbintenis tegen hem, en sloeg hem te Samaria, in het paleis van het huis des konings, met Argob en met Arje, en met hem vijftig mannen van de kinderen der Gileadieten; alzo doodde hij hem, en werd koning in zijn plaats.","26":"Het overige nu der geschiedenissen van Pekahia, en al wat hij gedaan heeft, ziet, dat is geschreven in het boek der kronieken der koningen van Israël.","27":"In het twee en vijftigste jaar van Azaria, den koning van Juda, werd Pekah, de zoon van Remalia, koning over Israël, *en* *regeerde* twintig jaren te Samaria.","28":"En hij deed dat kwaad was in de ogen des HEEREN; hij week niet af van de zonden van Jerobeam, den zoon van Nebat, die Israël zondigen deed.","29":"In de dagen van Pekah, den koning van Israël, kwam Tiglath-pilezer, de koning van Assyrië, en nam Ijon in, en Abel-beth-maacha, en Janoah, en Kedes, en Hazor, en Gilead, en Galilea, het ganse land van Nafthali; en hij voerde hen weg naar Assyrië.","30":"En Hosea, de zoon van Ela, maakte een verbintenis tegen Pekah, den zoon van Remalia, en sloeg hem, en doodde hem, en werd koning in zijn plaats; in het twintigste jaar van Jotham, den zoon van Uzzia.","31":"Het overige nu der geschiedenissen van Pekah, en al wat hij gedaan heeft, ziet, dat is geschreven in het boek der kronieken der koningen van Israël.","32":"In het tweede jaar van Pekah, den zoon van Remalia, den koning van Israël, werd Jotham koning, de zoon van Uzzia, den koning van Juda.","33":"Vijf en twintig jaren was hij oud, als hij koning werd, en regeerde zestien jaren te Jeruzalem; en de naam zijner moeder was Jerusa, de dochter van Zadok.","34":"En hij deed dat recht was in de ogen des HEEREN; naar alles, wat zijn vader Uzzia gedaan had, deed hij.","35":"Alleenlijk werden de hoogten niet weggenomen; het volk offerde en rookte nog op de hoogten; dezelve bouwde de hoge poort aan het huis des HEEREN.","36":"Het overige nu der geschiedenissen van Jotham, en al wat hij gedaan heeft, is dat niet geschreven in het boek der kronieken der koningen van Juda?","37":"In die dagen begon de HEERE in Juda te zenden Rezin, den koning van Syrië, en Pekah, den zoon van Remalia.","38":"En Jotham ontsliep met zijn vaderen, en werd begraven bij zijn vaderen in de stad van zijn vader David; en zijn zoon Achaz werd koning in zijn plaats."},"KJV":{"1":"In the twenty and seventh year of Jeroboam king of Israel began Azariah son of Amaziah king of Judah to reign.","2":"Sixteen years old was he when he began to reign, and he reigned two and fifty years in Jerusalem. And his mother's name was Jecholiah of Jerusalem.","3":"And he did that which was right in the sight of the LORD, according to all that his father Amaziah had done;","4":"Save that the high places were not removed: the people sacrificed and burnt incense still on the high places.","5":"And the LORD smote the king, so that he was a leper unto the day of his death, and dwelt in a several house. And Jotham the king's son was over the house, judging the people of the land.","6":"And the rest of the acts of Azariah, and all that he did, are they not written in the book of the chronicles of the kings of Judah?","7":"So Azariah slept with his fathers; and they buried him with his fathers in the city of David: and Jotham his son reigned in his stead.","8":"In the thirty and eighth year of Azariah king of Judah did Zachariah the son of Jeroboam reign over Israel in Samaria six months.","9":"And he did that which was evil in the sight of the LORD, as his fathers had done: he departed not from the sins of Jeroboam the son of Nebat, who made Israel to sin.","10":"And Shallum the son of Jabesh conspired against him, and smote him before the people, and slew him, and reigned in his stead.","11":"And the rest of the acts of Zachariah, behold, they are written in the book of the chronicles of the kings of Israel.","12":"This was the word of the LORD which he spake unto Jehu, saying, Thy sons shall sit on the throne of Israel unto the fourth generation. And so it came to pass.","13":"Shallum the son of Jabesh began to reign in the nine and thirtieth year of Uzziah king of Judah; and he reigned a full month in Samaria.","14":"For Menahem the son of Gadi went up from Tirzah, and came to Samaria, and smote Shallum the son of Jabesh in Samaria, and slew him, and reigned in his stead.","15":"And the rest of the acts of Shallum, and his conspiracy which he made, behold, they are written in the book of the chronicles of the kings of Israel.","16":"Then Menahem smote Tiphsah, and all that were therein, and the coasts thereof from Tirzah: because they opened not to him, therefore he smote it; and all the women therein that were with child he ripped up.","17":"In the nine and thirtieth year of Azariah king of Judah began Menahem the son of Gadi to reign over Israel, and reigned ten years in Samaria.","18":"And he did that which was evil in the sight of the LORD: he departed not all his days from the sins of Jeroboam the son of Nebat, who made Israel to sin.","19":"And Pul the king of Assyria came against the land: and Menahem gave Pul a thousand talents of silver, that his hand might be with him to confirm the kingdom in his hand.","20":"And Menahem exacted the money of Israel, even of all the mighty men of wealth, of each man fifty shekels of silver, to give to the king of Assyria. So the king of Assyria turned back, and stayed not there in the land.","21":"And the rest of the acts of Menahem, and all that he did, are they not written in the book of the chronicles of the kings of Israel?","22":"And Menahem slept with his fathers; and Pekahiah his son reigned in his stead.","23":"In the fiftieth year of Azariah king of Judah Pekahiah the son of Menahem began to reign over Israel in Samaria, and reigned two years.","24":"And he did that which was evil in the sight of the LORD: he departed not from the sins of Jeroboam the son of Nebat, who made Israel to sin.","25":"But Pekah the son of Remaliah, a captain of his, conspired against him, and smote him in Samaria, in the palace of the king's house, with Argob and Arieh, and with him fifty men of the Gileadites: and he killed him, and reigned in his room.","26":"And the rest of the acts of Pekahiah, and all that he did, behold, they are written in the book of the chronicles of the kings of Israel.","27":"In the two and fiftieth year of Azariah king of Judah Pekah the son of Remaliah began to reign over Israel in Samaria, and reigned twenty years.","28":"And he did that which was evil in the sight of the LORD: he departed not from the sins of Jeroboam the son of Nebat, who made Israel to sin.","29":"In the days of Pekah king of Israel came Tiglathpileser king of Assyria, and took Ijon, and Abelbethmaachah, and Janoah, and Kedesh, and Hazor, and Gilead, and Galilee, all the land of Naphtali, and carried them captive to Assyria.","30":"And Hoshea the son of Elah made a conspiracy against Pekah the son of Remaliah, and smote him, and slew him, and reigned in his stead, in the twentieth year of Jotham the son of Uzziah.","31":"And the rest of the acts of Pekah, and all that he did, behold, they are written in the book of the chronicles of the kings of Israel.","32":"In the second year of Pekah the son of Remaliah king of Israel began Jotham the son of Uzziah king of Judah to reign.","33":"Five and twenty years old was he when he began to reign, and he reigned sixteen years in Jerusalem. And his mother's name was Jerusha, the daughter of Zadok.","34":"And he did that which was right in the sight of the LORD: he did according to all that his father Uzziah had done.","35":"Howbeit the high places were not removed: the people sacrificed and burned incense still in the high places. He built the higher gate of the house of the LORD.","36":"Now the rest of the acts of Jotham, and all that he did, are they not written in the book of the chronicles of the kings of Judah?","37":"In those days the LORD began to send against Judah Rezin the king of Syria, and Pekah the son of Remaliah.","38":"And Jotham slept with his fathers, and was buried with his fathers in the city of David his father: and Ahaz his son reigned in his stead."}},"tsk":{"1":[{"kopje":"In het","refs":["2 Kon 15:8","2 Kon 14:16","2 Kon 14:17"]},{"kopje":"Azaria","refs":["2 Kon 15:13","2 Kon 15:30-38","2 Kon 14:21","2 Kron 26:1","2 Kron 26:3","2 Kron 26:4"]}],"4":[{"kopje":"de hoogten","refs":["2 Kon 15:35","2 Kon 14:4","2 Kon 18:4","1 Kon 15:14","1 Kon 22:44","2 Kron 17:6","2 Kron 32:12","2 Kron 34:3"]}],"5":[{"kopje":"de HEERE","refs":["2 Sam 3:29","2 Kron 26:16-20","Job 34:19"]},{"kopje":"zodat","refs":["2 Kon 5:27","Num 12:10"]},{"kopje":"en hij woon \" data-code=\"H7967\">Shallum,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7195\">conspiracy</span> which he <span class=\"wl wl-kjv\" data-code=\"H7194\">made,</span> behold, they are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","16":"Then <span class=\"wl wl-kjv\" data-code=\"H4505\">Menahem</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H8607\">Tiphsah,</span> and all that were therein, and the <span class=\"wl wl-kjv\" data-code=\"H1366\">coasts</span> thereof from <span class=\"wl wl-kjv\" data-code=\"H8656\">Tirzah:</span> because they <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> not to him, therefore he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> it; and all the women therein that were with <span class=\"wl wl-kjv\" data-code=\"H2030\">child</span> he ripped <span class=\"wl wl-kjv\" data-code=\"H1234\">up.</span>","17":"In the <span class=\"wl wl-kjv\" data-code=\"H8672\">nine</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirtieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H5838\">Azariah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> began <span class=\"wl wl-kjv\" data-code=\"H4505\">Menahem</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1424\">Gadi</span> to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and reigned <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl  data-code=\"H1551\">Galilee,</span> all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H5321\">Naphtali,</span> and carried them <span class=\"wl wl-kjv\" data-code=\"H1540\">captive</span> to <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria.</span>","30":"And <span class=\"wl wl-kjv\" data-code=\"H1954\">Hoshea</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H425\">Elah</span> <span class=\"wl wl-kjv\" data-code=\"H7194\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H7195\">conspiracy</span> against <span class=\"wl wl-kjv\" data-code=\"H6492\">Pekah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7425\">Remaliah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him, and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him, and <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead, in the <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3147\">Jotham</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah.</span>","31":"And the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H6492\">Pekah,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> behold, they are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","32":"In the <span class=\"wl wl-kjv\" data-code=\"H8147\">second</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H6492\">Pekah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7425\">Remaliah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> began <span class=\"wl wl-kjv\" data-code=\"H3147\">Jotham</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign.</span>","33":"<span class=\"wl wl-kjv\" data-code=\"H2568\">Five</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> was he when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H8337\">sixteen</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H3388\">Jerusha,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok.</span>","34":"And he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> according to all that his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span>","35":"Howbeit the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> were not <span class=\"wl wl-kjv\" data-code=\"H5493\">removed:</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificed</span> and burned <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> still in the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places.</span> He <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> the <span class=\"wl wl-kjv\" data-code=\"H5945\">higher</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","36":"Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H3147\">Jotham,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah?</span>","37":"In those <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> to <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> against <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H7526\">Rezin</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> and <span class=\"wl wl-kjv\" data-code=\"H6492\">Pekah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7425\">Remaliah.</span>","38":"And <span class=\"wl wl-kjv\" data-code=\"H3147\">Jotham</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> and <span class=\"wl wl-kjv\" data-code=\"H271\">Ahaz</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Jeróbeam,","tekst":"Namelijk, des tweeden van dien naam, den zoon van Joas, boven, 2Ki 14:23."},{"catchword":"werd koning","tekst":"Te weten, om met volle macht als koning alleen te regeren. Anders was hij ook tevoren ettelijke jaren in enige regering geweest, of tenminste als koning gehouden. Zie boven, 2Ki 14:21."},{"catchword":"Azária,","tekst":"Anders genaamd Uzzia, onder, vs.13, 30; 2Ch 26:1."}],"3":[{"catchword":"hij deed","tekst":"Te weten, zolang als de profeet Zacharia leefde; 2Ch 26:5."}],"5":[{"catchword":"plaagde den koning,","tekst":"De oorzaak hiervan was, omdat hij door grote vermetelheid zich aantrok het ambt der priesters, gaande in den tempel om te roken, 2Ch 26:16."},{"catchword":"afgezonderd huis;","tekst":"Hebreeuws, een huis der vrijheid; dat is, in een huis dat vrij, of afgezonderd was van andere huizen en alleen stond, naar het voorschrift der wet, die God van de melaatsen gegeven had; Lev 13:46."},{"catchword":"het huis,","tekst":"Te weten, des konings; dat is, hij was als hofmeester, en had het opperste bevel over het gehele huis en hof des konings."},{"catchword":"richtende","tekst":"Dat is, regerende het gehele land, en opzicht hebbende over de bediening van het recht en de onderhouding van alle goede wetten. Vergelijk 2Ch 26:21."}],"7":[{"catchword":"bij zijn vaderen,","tekst":"Dat is, wel in den akker, of het stuk velds, verordend tot der koningen begraving, maar wat bezijden af van hunne graven, om zijner melaatsheid wil, 2Ch 26:23."}],"10":[{"catchword":"Sallum,","tekst":"Een der oversten."},{"catchword":"voor het volk,","tekst":"Dat is, in het openbaar; waaruit schijnt dat de daad van Sallum het volk niet mishaagde en dat Zacharia in den haat der gemeente was."}],"12":[{"catchword":"U zullen zonen","tekst":"Zie boven, 2Ki 10:30, en de aantekening daarop."}],"13":[{"catchword":"Uzzia,","tekst":"Mat 1:9, genaamd Ozias. Anders, boven, 2Ki 14:21, en in vs.1, 6,7,8, Azaria."},{"catchword":"een volle maand","tekst":"Hebreeuws, een maand der dagen; dat is, ene maand tijds, een volle en gehele maand, hebbende al haar dagen. Alzo Gen 29:14. Zie de aantekening."}],"14":[{"catchword":"Thirza,","tekst":"Zie 1Ki 14:17."}],"16":[{"catchword":"Tifsah,","tekst":"Zie van deze stad 1Ki 4:24."},{"catchword":"had opengedaan,","tekst":"Te weten, de poorten der stad, als hij op de reis was om Sallum te overvallen."}],"17":[{"catchword":"en regeerde","tekst":"Van dit ingevoegde, zie boven, 2Ki 13:1. Alzo onder, vs.23, 27."}],"19":[{"catchword":"Pul,","tekst":"Genoemd in de historiën, naar sommiger mening, Phulbelochus."},{"catchword":"duizend talenten","tekst":"Zie van het gewicht eens talents Exo 25:39."},{"catchword":"opdat zijn hand","tekst":"Dat is, om met deze som den vrede van de Assyriërs te kopen en zich in zijn koninkrijk te verzekeren."}],"20":[{"catchword":"voor elk man","tekst":"Dat is, om aanelken Assyrischen soldaat [zo enigen menen] zoveel te tellen. Zie van het gewicht des zilveren sikkels, Gen 23:15. Anderen vertalen, van elk man; verstaande dit niet van de Assyriërs, die het geld ontvingen, maar van de geweldigen der Israëlieten, die het betalen moesten."}],"25":[{"catchword":"Argob","tekst":"Die hem vergezelschapten, om zijn verraad te helpen uitvoeren; daartoe dienden ook de Gileadieten hier vermeld."},{"catchword":"Arje,","tekst":"Het Hebreeuwse woord betekent die leeuw, gelijk het ook van sommigen zo overgezet wordt, menende dat een zeker persoon alzo is toegenaamd geweest."}],"29":[{"catchword":"Tiglath-pilézer,","tekst":"Ook genaamd Tillgat-Pilneser, 2Ch 28:20, in de wereldse historiën Phulaser, de zoon van Phulbelochus; van denwelken, zie boven, vs.19."},{"catchword":"Ijon in,","tekst":"Zie van deze stad en de naastvolgende 1Ki 15:20."},{"catchword":"Janóah,","tekst":"Een stad, gelegen in de oostpale van den stam van Efraïm bij de Jordaan. Zie van deze Jos 16:6."},{"catchword":"Kedes,","tekst":"Zie van deze stad Jdg 4:6."},{"catchword":"Hazor,","tekst":"Eertijds een vermaarde koninklijke hoofdstad, Jos 11:10, daarna den stam van Nafthali ten erfdeel gevallen, Jos 19:36."},{"catchword":"Gilead,","tekst":"Zie Gen 31:21."},{"catchword":"Galiléa,","tekst":"Zie 1Ki 9:11."},{"catchword":"voerde hen","tekst":"Namelijk, de inwoners der voorgenoemde landen en steden."}],"30":[{"catchword":"in het twintigste jaar","tekst":"Dat is, na twintig jaren van het begin der regering van Jotham; hetwelk is geweest het vierde jaar der regering van Achaz, overmits Jotham maar zestien jaren regeerde, onder, vs.33. Anderen menen dat Jotham enige jaren tevoren met zijn vader, uit oorzaak van zijn melaatsheid, gemeen zijn geweest, die hem hier bij de zestien jaren zijner regering zouden toegevoegd zijn."}],"33":[{"catchword":"Vijf en twintig jaren","tekst":"Hebreeuws, een zoon van vijf en twintig jaar."}],"35":[{"catchword":"Alleenlijk","tekst":"Vergelijk 2Ch 27:2, en de aantekening."},{"catchword":"hoge poort","tekst":"Anders genaamd de poort Sur, en de poort des fondaments. Zie boven, 2Ki 11:6, en 2Ch 23:5, en de aantekening daarop."}],"37":[{"catchword":"In die dagen","tekst":"Omtrent het einde van de regering van Jotham."},{"catchword":"Rezin,","tekst":"Hebreeuws, Retsin."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In the seven and twentieth year of Jerobeam [Namely, the second of that name, the son of Joas, above chap. 14.23.] King of Israel, Azaria [otherwise called Uzzia, below ver.13,30. 2 Chron.26.1.] the son Amazia King of Juda became King. [to wit, to reign alone in full power as King. Otherwise he had been also formerly in some government for some certain years, or at least was esteemed as King: see above chap.14.on vers.21.]"}],"2":[{"catchword":null,"tekst":"he was sixteen years old when he became King, [see 2 Chron.26 13.] and he reigned two and fifty years at Jerusalem: [see 2 Chron.26.1,3.] and his Mothers name was Jecholia of Jerusalem. [see 2 Chron.26. vers.19,20.21.]"}],"3":[{"catchword":null,"tekst":"And he did that which was right in the eyes of the LORD; [To wit, as long as the Prophet Zacharias lived, 2 Chron.26.5.] according to all that Amazia his Father had done."}],"4":[{"catchword":null,"tekst":"Onely the high places were not taken away: the People offered still, and burnt incense on the high places."}],"5":[{"catchword":null,"tekst":"And the LORD plagued the King, (so) that he became a Leper unto the day of his death, [The cause hereof was that in high presumption he usurped upon the office of the Priests, entering into Temple, to burn incense, Chron.26.16.] and he dwelt in a servant house: [Heb. an house of liberty; that is, in a house that was free and separated from other houses, and stood alone by it self, according to the prescript of the law, which God had given concerning the Lepers, Levit.13.46.] but Jotham the Kings son was over the house, [to wit, the Kings house that is, he was the Steward, and had the supream command over all the Kings house and court] judging the people of the land. [i.e. governing the whole Land, and having the oversight over the administration of justice, and the observation of all good laws. Compare 2 Chron.15.5.]"}],"6":[{"catchword":null,"tekst":"Now the rest of the acts of Azaria, and all that he did; are they not written in the books of the Chronicles of the Kings of Juda?"}],"7":[{"catchword":null,"tekst":"And Azaria fell asleep with his fathers, and they buried him by his Fathers, [i.e. Indeed in the field, or plat of ground, appointed for the burial of the Kings, but at some distance from their Sepulchre, because of his Leprosy, 2 Chron.26.23.] in the city of David: and Jotham his son became King in his Stead."}],"8":[{"catchword":null,"tekst":"In the eight and thirtieth year of Azaria the King of Juda, did Zacharia the son of Jerobeam reign over Israel, at Samaria, six months."}],"9":[{"catchword":null,"tekst":"And he did that which was evil in the eyes of the LORD, according as his Fathers had done: he departed not from the sins of Jerobeam the son of Nebat, who made Israel to sin."}],"10":[{"catchword":null,"tekst":"And Sallum [One of the Princes, or Rulers] the son of Jabes made a conspiracy against him, and smote him before the people, [that is, publicly: whence it appeareth, that Sallum act displeased not the people, and that Zacharia was hated by the Commonalty] and put him to death, and he became King in his stead."}],"11":[{"catchword":null,"tekst":"Now the rest of the acts of Zacharia; behold, that is written in the book of the Chronicles of the Kings of Israel."}],"12":[{"catchword":null,"tekst":"This was the word of the LORD, which he had spoken to Jehu, saying; Unto thee shall sons of the fourth generation, sit on the throne of Israel; [See above chap.10.30. and the annotate. thereon] and so it came to pass."}],"13":[{"catchword":null,"tekst":"Sallum the son of Jabes became King in the nine and thirtieth year of Uzzia [Matt.1.9. called Ozias. Oth. above chap.14. ver.21,29. and in this chap.vers.1,6,7,8. Azaria] King of Juda: and he reigned a full month [Heb. a month of days, that is, a month of time, a full, and whole month, having all its days. So Gen 29:14, see the annotate.] at Samaria."}],"14":[{"catchword":null,"tekst":"For Menahen, the son of Gad, marched up from Tirza, [See 1 Kings 14.on v.17.] and came to Samaria, and smote Sallum, the son Jabes, at Samaria, and slew him, and became King in his stead."}],"15":[{"catchword":null,"tekst":"Now the rest of the acts Sallum, and his conspiracy, which he made, behold, they are written in the book of the Chronicles of the Kings of Israel."}],"16":[{"catchword":null,"tekst":"Then Menahen smote Tiphsa, [See of this city, 1 Kings 4.on ver.24.] with all that were therein, also the border thereof, from Thirza: because they had not opened (for him), [to wit, the gates of the city, when he was on his marched, to fall upon Sallum] therefore he smote (them): he rip up all their woman with child."}],"17":[{"catchword":null,"tekst":"In the nine and thirtieth year of Azaria the King of Juda, Menahen the son of Gad, became King over Israel, (and reigned) [Of this insertion, see above chap.13.on v.1. So below v.23, and 27.] ten years at Samaria."}],"18":[{"catchword":null,"tekst":"And he did that which was evil in the eyes of the LORD: he departed not all his days from the sins of Jerobeam the son of Nebat, who made Israel to sin."}],"19":[{"catchword":null,"tekst":"(Then) Pull [Called in Historys (according to the opinion of some) Phalbelochus] King of Assyria, came against the Land; and Menahen gave unto Pull a thousand talents silver, [see of the weight of a talent, Exod.25.on v.39.] that his hand might be with him, to confirm the Kingdom in his land. [i.e. to buy peace of the Assyrians with this sum of money, and to secure himself in his Kingdom.]"}],"20":[{"catchword":null,"tekst":"Now Menahen raised this money of Israel, of all the mighty (men) of substance, to give to the King of Assyria, for each man fifty shekels of silver: [That is, to pay (as some conceive) so much to every Assyrian souldier: see of the weight of the shekels of silver, Gen.23.on ver.15. Others translate it, of each man, each. Understanding this not of the Assyrians, that received the money, but of the mighty men of the Israelites that were to pay it] so the King of Assyrians turned back, and stayed not in the land."}],"21":[{"catchword":null,"tekst":"Now the rest of the acts of Menahen, and all that he did, is that nit written in the Book of the Chronicles of the Kings of Israel?"}],"22":[{"catchword":null,"tekst":"After that Menahen fell a sleep with his Fathers: and Pekah his son became King in his stead.]"}],"23":[{"catchword":null,"tekst":"In the fiftieth year of Azaria King of Judah, Pekahia the son of Menahen became King over Israel, (and reigned) two years at Samaria."}],"24":[{"catchword":null,"tekst":"And he did that which was evil in the eyes of the LORD: he departed not from the sins of Jerobeam the son of Nebat, who made Israel to sin."}],"25":[{"catchword":null,"tekst":"And Pekah the son of Remalia his Captain, made a conspiracy against him, and smote him at Samaria in the Palace of the Kings house, with Argob, and with Arje, [Who accompanied him, to help to executed his treachery, whereunto also the Gileadites, here mentioned, served. The Hebrew word rendered here Arje, signify that Lion: as it likewise translated so by some, conceiving that a certain man was so surnamed] and with him fifty men, of the children of the Gileadites: so he slew him, and became King in his stead."}],"26":[{"catchword":null,"tekst":"Now the rest of the acts of Pekahia, and all that he did; behold, that is written in the book of the Chronicles of the Kings of Israel?"}],"27":[{"catchword":null,"tekst":"In the two and fifteen year of Azaria King of Juda, Pekah the son of Remalia became King over Israel, (and reigned) twenty years at Samaria."}],"28":[{"catchword":null,"tekst": // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {

    data.weergaven.map(w => {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

}
function bijbeluitlegHtml(n) {

  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';

    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +

    } else {
      h += '<em>Geen verwijzingen</em>';

      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
