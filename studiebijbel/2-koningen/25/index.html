m tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom.", "2": "Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia.", "3": "Op de negende van de *vierde* maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,", "4": "Toen werd de stad doorgebroken, en al de krijgslieden *vluchtten* 's nachts door de weg van de poort, tussen de twee muren, die bij de tuin van de koning waren (de Chaldeeën nu waren tegen de stad rondom), en *de koning* trok *door* de weg van het vlakke veld.", "5": "Doch het leger van de Chaldeeën jaagde de koning na, en zij achterhaalden hem in de vlakke velden van Jericho, en heel zijn leger raakte van bij hem verstrooid.", "6": "Zij dan grepen de koning, en voerden hem op naar de koning van Babel, naar Ribla; en zij spraken een oordeel tegen hem.", "7": "En zij slachtten de zonen van Zedekia voor zijn ogen, en men verblindde Zedekia's ogen, en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "8": "Daarna in de vijfde maand, op de zevende van de maand (dit was het negentiende jaar van Nebukadnezar, de koning van Babel) kwam Nebuzaradan, de aanvoerder van de lijfwacht, de knecht van de koning van Babel, in Jeruzalem.", "9": "En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur.", "10": "En het hele leger van de Chaldeeën, dat met de aanvoerder van de lijfwacht was, brak de muren van Jeruzalem rondom af.", "11": "Het overige nu van het volk, die in de stad overgelaten waren, en de afvalligen, die tot de koning van Babel gevallen waren, en het overige van de menigte, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk weg.", "12": "Maar van de armsten van het land liet de aanvoerder van de lijfwacht *enigen* overig tot wijngaardeniers en tot akkerlieden.", "13": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden het koper daarvan naar Babel.", "14": "Zij namen ook de potten, en de schoffels, en de gaffels, en de rookschalen, en al de koperen voorwerpen, waarmee men de dienst verrichtte.", "15": "En de aanvoerder van de lijfwacht nam de wierookvaten en de sprenkelschalen weg, wat geheel goud en wat geheel zilver was.", "16": "De twee pilaren, de ene zee, en de stellingen, die Salomo voor het huis van de HEERE gemaakt had; het koper van al deze voorwerpen was zonder gewicht.", "17": "De hoogte van een pilaar was achttien el, en het kapiteel daarop was van koper; en de hoogte van het kapiteel was drie el; en het net, en de granaatappels op het kapiteel rondom, waren allemaal van koper; en hetzelfde had de andere pilaar, met het net.", "18": "Ook nam de aanvoerder van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders.", "19": "En uit de stad nam hij een hoveling, die over de krijgslieden gesteld was, en vijf mannen van hen die het aangezicht van de koning zagen, die in de stad gevonden werden, alsook de hoofdschrijver van het leger, die het volk van het land opriep voor de oorlog, en zestig mannen van het volk van het land, die in de stad gevonden werden.", "20": "Toen Nebuzaradan, de aanvoerder van de lijfwacht, dezen genomen had, bracht hij hen naar de koning van Babel, naar Ribla.", "21": "En de koning van Babel sloeg hen, en doodde hen te Ribla, in het land van Hamath. Zo werd Juda uit zijn land gevankelijk weggevoerd.", "22": "Maar aangaande het volk, dat in het land van Juda overgebleven was, dat Nebukadnezar, de koning van Babel, had laten overblijven, daarover stelde hij Gedalia aan, de zoon van Ahikam, de zoon van Safan.", "23": "Toen nu alle aanvoerders van de legers, zij en hun mannen, hoorden dat de koning van Babel Gedalia tot leider had aangesteld, kwamen zij tot Gedalia naar Mizpa; namelijk Ismaël, de zoon van Nethanja, en Johanan, de zoon van Kareah, en Seraja, de zoon van Tanhumeth, de Netofathiet, en Jaazanja, de zoon van de Maachathiet, zij en hun mannen.", "24": "En Gedalia zwoer hun en hun mannen, en zei tegen hen: Wees niet bang om knechten van de Chaldeeën te zijn, blijf in het land, en dien de koning van Babel, dan zal het u goed gaan.", "25": "Maar het gebeurde in de zevende maand, dat Ismaël, de zoon van Nethanja, de zoon van Elisama, van koninklijk zaad, kwam, en tien mannen met hem; en zij sloegen Gedalia, zodat hij stierf; alsook de Joden en de Chaldeeën, die met hem te Mizpa waren.", "26": "Toen maakte heel het volk zich op, van de minste tot de grootste, en de aanvoerders van de legers, en zij kwamen in Egypte; want zij waren bang voor de Chaldeeën.", "27": "Het gebeurde daarna in het zevenendertigste jaar van de wegvoering van Jojachin, de koning van Juda, in de twaalfde maand, op de zevenentwintigste van de maand, dat Evilmerodach, de koning van Babel, in het jaar dat hij koning werd, het hoofd van Jojachin, de koning van Juda, uit de gevangenis verhief.", "28": "En hij sprak vriendelijk met hem, en stelde zijn zetel boven de zetel van de koningen, die bij hem te Babel waren.", "29": "En hij veranderde de kleren van zijn gevangenschap, en hij at voortdurend brood voor zijn aangezicht, al de dagen van zijn leven.", "30": "En aangaande zijn levensonderhoud, een voortdurend levensonderhoud werd hem van de koning gegeven, elke dag een vastgesteld deel op zijn dag, al de dagen van zijn leven."}, "SV": {"1": "En het geschiedde in het negende jaar zijner regering, in de tiende maand, op den tienden der maand, *dat* Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn ganse heir, en legerde zich tegen haar; en zij bouwden tegen haar sterkten rondom.", "2": "Zo kwam de stad in belegering, tot in het elfde jaar van den koning Zedekia.", "3": "Op den negenden der *vierde* maand, als de honger in de stad sterk werd, en het volk des lands geen brood had,", "4": "Toen werd de stad doorgebroken, en al de krijgslieden *vloden* des nachts door den weg der poort, tussen de twee muren, die aan des konings hof waren (de Chaldeen nu waren tegen de stad rondom), en *de* *koning* trok *door* den weg des vlakken velds.", "5": "Doch het heir der Chaldeen jaagde den koning na, en zij achterhaalden hem in de vlakke velden van Jericho, en al zijn heir werd van bij hem verstrooid.", "6": "Zij dan grepen den koning, en voerden hem opwaarts tot den koning van Babel, naar Ribla; en zij spraken een oordeel tegen hem.", "7": "En zij slachtten de zonen van Zedekia voor zijn ogen, en men verblindde Zedekia’s ogen, en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "8": "Daarna in de vijfde maand, op den zevenden der maand ( dit was het negentiende jaar van Nebukadnezar, den koning van Babel) kwam Nebuzaradan, de overste der trawanten, de knecht des konings van Babel, te Jeruzalem.", "9": "En hij verbrandde het huis des HEEREN, en het huis des konings, mitsgaders alle huizen van Jeruzalem; en alle huizen der groten verbrandde hij met vuur.", "10": "En het ganse heir der Chaldeen, dat met den overste der trawanten was, brak de muren van Jeruzalem rondom af.", "11": "Het overige nu des volks, die in de stad overgelaten waren, en de afvalligen, die tot den koning van Babel gevallen waren, en het overige der menigte, voerde Nebuzaradan, de overste der trawanten, gevankelijk weg.", "12": "Maar van de armsten des lands liet de overste der trawanten *enigen* overig tot wijngaardeniers en tot akkerlieden .", "13": "Verder braken de Chaldeen de koperen pilaren, die in het huis des HEEREN waren, en de stellingen, en de koperen zee, die in het huis des HEEREN was; en zij voerden het koper daarvan naar Babel.", "14": "Zij namen ook de potten, en de schoffelen, en de gaffelen, en de rookschalen, en al de koperen vaten, daar men den dienst mede deed.", "15": "En de overste der trawanten nam weg de wierookvaten en de sprengbekkens, wat geheel goud en wat geheel zilver was.", "16": "De twee pilaren, de ene zee, en de stellingen, die Salomo voor het huis des HEEREN gemaakt had; het koper van al deze vaten was zonder gewicht.", "17": "De hoogte van een pilaar was achttien ellen, en het kapiteel daarop was koper; en de hoogte des kapiteels was drie ellen; en het net, en de granaatappelen op het kapiteel rondom, waren alle van koper; en dezen gelijk had de andere pilaar, met het net.", "18": "Ook nam de overste der trawanten Seraja, den hoofdpriester, en Zefanja, den tweeden priester, en de drie dorpelbewaarders.", "19": "En uit de stad nam hij een hoveling, die over de krijgslieden gesteld was, en vijf mannen uit degenen, die des konings aangezicht zagen, die in de stad gevonden werden, mitsgaders den oversten schrijver des heirs, die het volk des lands ten oorlog opschreef, en zestig mannen van het volk des lands, die in de stad gevonden werden.", "20": "Als Nebuzaradan, de overste der trawanten, dezen genomen had, zo bracht hij hen tot den koning van Babel, naar Ribla.", "21": "En de koning van Babel sloeg hen, en doodde hen te Ribla, in het land van Hamath. Alzo werd Juda uit zijn land gevankelijk weggevoerd.", "22": "Maar aangaande het volk, dat in het land van Juda overgebleven was, dat Nebukadnezar, de koning van Babel, had laten overblijven, daarover stelde hij Gedalia, den zoon van Ahikam, den zoon van Safan.", "23": "Toen nu al de oversten der heiren, zij en hun mannen, hoorden, dat de koning van Babel Gedalia tot overste gesteld had, kwamen zij tot Gedalia naar Mizpa; namelijk, Ismaël, de zoon van Nethanja, en Johanan, de zoon van Kareah, en Seraja, de zoon van Tanhumeth, de Netofathiet, en Jaazanja, de zoon van den Maachathiet, zij en hun mannen.", "24": "En Gedalia zwoer hun en hun mannen, en zeide tot hen: Vreest niet van te zijn knechten der Chaldeen, blijft in het land, en dient den koning van Babel, zo zal het u wel gaan.", "25": "Maar het geschiedde in de zevende maand, dat Ismaël, de zoon van Nethanja, den zoon van Elisama, van koninklijk zaad, kwam, en tien mannen met hem; en zij sloegen Gedalia, dat hij stierf; mitsgaders de Joden en de Chaldeen, die met hem te Mizpa waren.", "26": "Toen maakte zich al het volk op, van de minste tot den meeste, en de oversten der heiren, en kwamen in Egypte; want zij vreesden voor de Chaldeen.", "27": "Het geschiedde daarna in het zeven en dertigste jaar der wegvoering van Jojachin, den koning van Juda, in de twaalfde maand, op den zeven en twintigsten der maand, dat Evilmerodach, de koning van Babel, in het jaar, als hij koning werd, het hoofd van Jojachin, den koning van Juda, uit het gevangenhuis, verhief.", "28": "En hij sprak vriendelijk met hem, en stelde zijn stoel boven den stoel der koningen, die bij hem te Babel waren.", "29": "En hij veranderde de klederen zijner gevangenis, en hij at geduriglijk brood voor zijn aangezicht, al de dagen zijns levens.", "30": "En aangaande zijn tering, een gedurige tering werd hem van den koning gegeven, elk dagelijks bestemde deel op zijn dag, al de dagen zijns levens."}, "KJV": {"1": "And it came to pass in the ninth year of his reign, in the tenth month, in the tenth day of the month, that Nebuchadnezzar king of Babylon came, he, and all his host, against Jerusalem, and pitched against it; and they built forts against it round about.", "2": "And the city was besieged unto the eleventh year of king Zedekiah.", "3": "And on the ninth day of the fourth month the famine prevailed in the city, and there was no bread for the people of the land.", "4": "And the city was broken up, and all the men of war fled by night by the way of the gate between two walls, which is by the king's garden: (now the Chaldees were against the city round about:) and the king went the way toward the plain.", "5": "And the army of the Chaldees pursued after the king, and overtook him in the plains of Jericho: and all his army were scattered from him.", "6": "So they took the king, and brought him up to the king of Babylon to Riblah; and they gave judgment upon him.", "7": "And they slew the sons of Zedekiah before his eyes, and put out the eyes of Zedekiah, and bound him with fetters of brass, and carried him to Babylon.", "8": "And in the fifth month, on the seventh day of the month, which is the nineteenth year of king Nebuchadnezzar king of Babylon, came Nebuzaradan, captain of the guard, a servant of the king of Babylon, unto Jerusalem:", "9": "And he burnt the house of the LORD, and the king's house, and all the houses of Jerusalem, and every great man's house burnt he with fire.", "10": "And all the army of the Chaldees, that were with the captain of the guard, brake down the walls of Jerusalem round about.", "11": "Now the rest of the people that were left in the city, and the fugitives that fell away to the king of Babylon, with the remnant of the multitude, did Nebuzaradan the captain of the guard carry away.", "12": "But the captain of the guard left of the poor of the land to be vinedressers and husbandmen.", "13": "And the pillars of brass that were in the house of the LORD, and the bases, and the brasen sea that was in the house of the LORD, did the Chaldees break in pieces, and carried the brass of them to Babylon.", "14": "And the pots, and the shovels, and the snuffers, and the spoons, and all the vessels of brass wherewith they ministered, took they away.", "15": "And the firepans, and the bowls, and such things as were of gold, in gold, and of silver, in silver, the captain of the guard took away.", "16": "The two pillars, one sea, and the bases which Solomon had made for the house of the LORD; the brass of all these vessels was without weight.", "17": "The height of the one pillar was eighteen cubits, and the chapiter upon it was brass: and the height of the chapiter three cubits; and the wreathen work, and pomegranates upon the chapiter round about, all of brass: and like unto these had the second pillar with wreathen work.", "18": "And the captain of the guard took Seraiah the chief priest, and Zephaniah the second priest, and the three keepers of the door:", "19": "And out of the city he took an officer that was set over the men of war, and five men of them that were in the king's presence, which were found in the city, and the principal scribe of the host, which mustered the people of the land, and threescore men of the people of the land that were found in the city:", "20": "And Nebuzaradan captain of the guard took these, and brought them to the king of Babylon to Riblah:", "21": "And the king of Babylon smote them, and slew them at Riblah in the land of Hamath. So Judah was carried away out of their land.", "22": "And as for the people that remained in the land of Judah, whom Nebuchadnezzar king of Babylon had left, even over them he made Gedaliah the son of Ahikam, the son of Shaphan, ruler.", "23": "And when all the captains of the armies, they and their men, heard that the king of Babylon had made Gedaliah governor, there came to Gedaliah to Mizpah, even Ishmael the son of Nethaniah, and Johanan the son of Careah, and Seraiah the son of Tanhumeth the Netophathite, and Jaazaniah the son of a Maachathite, they and their men.", "24": "And Gedaliah sware to them, and to their men, and said unto them, Fear not to be the servants of the Chaldees: dwell in the land, and serve the king of Babylon; and it shall be well with you.", "25": "But it came to pass in the seventh month, that Ishmael the son of Nethaniah, the son of Elishama, of the seed royal, came, and ten men with him, and smote Gedaliah, that he died, and the Jews and the Chaldees that were with him at Mizpah.", "26": "And all the people, both small and great, and the captains of the armies, arose, and came to Egypt: for they were afraid of the Chaldees.", "27": "And it came to pass in the seven and thirtieth year of the captivity of Jehoiachin king of Judah, in the twelfth month, on the seven and twentieth day ../2-koningen/25/#v27", "ref": "2 Kon 25:27", "svLabel": null}], "kinderen": []}, {"label": "Released from prison by Evil-merodach, and promoted above other kings, and honored until death", "href": "../../nave/j/?hl=2Kgs.25.27#i10412", "refs": [{"disp": "2 Kon 25:27-30", "href": "../../2-koningen/25/#v27", "ref": "2 Kon 25:27-30", "svLabel": null}, {"disp": "Jer 52:31-34", "href": "../../jeremia/52/#v31", "ref": "Jer 52:31-34", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Babylon", "href": "../../torrey/b/#t-babylon", "kinderen": [{"label": "Treatment of the Jews in", "href": "../../torrey/b/?hl=2Kgs.25.27#i1438", "refs": [{"disp": "2 Kon 25:27-30", "href": "../../2-koningen/25/#v27", "ref": "2 Kon 25:27-30", "svLabel": null}, {"disp": "Dan 1:3-7", "href": "../../daniel/1/#v3", "ref": "Dan 1:3-7", "svLabel": null}], "kinderen": []}]}]}, "28": {"nave": [{"topic": "Kindness", "href": "../../nave/k/#t-kindness", "kinderen": [{"label": "Instances Of", "href": "../../nave/k/?hl=2Kgs.25.28#i12118", "refs": [], "kinderen": [{"label": "Evil-merodach to Jehoiachin", "href": "../../nave/k/?hl=2Kgs.25.28#i12126", "refs": [{"disp": "2 Kon 25:28-30", "href": "../../2-koningen/25/#v28", "ref": "2 Kon 25:28-30", "svLabel": null}], "kinderen": []}]}]}]}, "29": {"torrey": [{"topic": "Prisons", "href": "../../torrey/p/#t-prisons", "kinderen": [{"label": "Persons Confined In", "href": "../../torrey/p/?hl=2Kgs.25.29#i16112", "refs": [], "kinderen": [{"label": "Clothed in prison dress", "href": "../../torrey/p/?hl=2Kgs.25.29#i16122", "refs": [{"disp": "2 Kon 25:29", "href": "../../2-koningen/25/#v29", "ref": "2 Kon 25:29", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ezra 7:27": "Geloofd zij de HEERE, de God van onze vaderen, Die zoiets in het hart van de koning gegeven heeft, om het huis van de HEERE te versieren, dat te Jeruzalem is.", "Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "2 Kon 23:33": "Doch Farao Necho liet hem gevangenzetten te Ribla in het land van Hamath, opdat hij te Jeruzalem niet regeren zou; en hij legde het land een boete op van honderd talenten van het zilver en een talent van het goud.", "Jer 39:5": "Maar het leger van de Chaldeeën jaagde hen achterna; en zij achterhaalden Zedekia in de vlakke velden van Jericho, en vingen hem, en brachten hem naar boven tot Nebukadrezar, de koning van Babel, naar Ribla, in het land van Hamath; die sprak oordelen tegen hem uit.", "Jer 29:25": "Zo spreekt de HEERE van de heerscharen, de God van Israël: Omdat u brieven in uw naam gezonden hebt aan heel het volk dat te Jeruzalem is, en aan Zefanja, de zoon van Maaseja, de priester, en aan alle priesters, en zei:", "2 Kon 24:1": "In zijn dagen trok Nebukadnezar, de koning van Babel, op, en Jojakim werd zijn dienaar, drie jaar lang; daarna keerde hij zich om en kwam in opstand tegen hem.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "Jer 25:12": "Maar het zal gebeuren, als de zeventig jaren vervuld zijn, dan zal Ik over de koning van Babel, en over dat volk, spreekt de HEERE, hun ongerechtigheid bezoeken, alsook over het land van de Chaldeeën, en zal dat stellen tot eeuwige verwoestingen.", "2 Kron 32:18": "En zij riepen met luide stem, in het Joods, tegen het volk van Jeruzalem dat op de muur was, om hen bevreesd te maken en te verontrusten, om zo de stad te kunnen innemen.", "Jer 41:9-12": "Het kuil nu, waarin Ismaël alle dode lichamen van de mannen die hij aan de zijde van Gedalia gedood had, wierp, is hetzelfde dat koning Asa maakte vanwege Baësa, de koning van Israël; dit vulde Ismaël, de zoon van Nethanja, met de gedoden. En Ismaël voerde het hele overblijfsel van het volk, dat te Mizpa was, gevankelijk weg, namelijk de dochters van de koning, en al het volk dat te Mizpa was overgelaten, die Nebuzaradan, de aanvoerder van de lijfwacht, aan Gedalia, de zoon van Ahikam, had toevertrouwd; Ismaël dan, de zoon van Nethanja, voerde hen gevankelijk weg, en trok weg, om over te gaan naar de kinderen van Ammon. Toen nu Johanan, de zoon van Kareah, en al de aanvoerders van de legers die met hem waren, al het kwaad hoorden dat Ismaël, de zoon van Nethanja, gedaan had;", "2 Kron 4:20-22": "En de kandelaars met hun lampen, van gesloten goud, om die naar de gewoonte aan te steken, vóór het binnenste heiligdom; En de bloemen, en de lampen, en de snuiters, van goud; het was het volmaaktste goud; Alsook de gaffels, en de sprenkelschalen, en de rookschalen, en de wierookvaten, van gesloten goud; aangaande de ingang van het huis, zijn binnenste deuren, van het heilige der heiligen, en de deuren van het huis van de tempel waren van goud.", "Jer 40:11": "Toen ook alle Joden die in Moab, en onder de kinderen van Ammon, en in Edom, en die in al die landen waren, hoorden dat de koning van Babel in Juda een overblijfsel gelaten had; en dat hij Gedalia, de zoon van Ahikam, de zoon van Safan, over hen aangesteld had,", "Amos 2:14-16": "Zodat de snelle niet zal ontvlieden, en de sterke zijn kracht niet zal versterken, en een held zijn ziel niet zal bevrijden. En die de boog hanteert, zal niet bestaan, en die licht is op zijn voeten, zal zich niet bevrijden; ook zal, die te paard rijdt, zijn ziel niet bevrijden. En de kloekhartigste onder de helden zal op die dag naakt heenvlieden, spreekt de HEERE.", "2 Kron 8:16": "Zo werd al het werk van Salomo klaargemaakt, tot de dag van de grondlegging van het huis van de HEERE, en tot het voltooien ervan, zodat het huis van de HEERE volmaakt werd.", "1 Kron 6:15": "En Jozadak ging mee toen de HEERE Juda en Jeruzalem gevangen liet wegvoeren door de hand van Nebukadnezar.", "2 Kron 36:20": "En wie overgebleven was van het zwaard, voerde hij weg naar Babel, en zij werden hem en zijn zonen tot knechten, totdat het koninkrijk van Perzië ging regeren;", "Ezra 8:27": "en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.", "Ezech 17:17": "Ook zal farao, met een groot leger en een grote menigte van het krijgsvolk, niets voor hem uitrichten in de oorlog, wanneer men een wal zal opwerpen, en wanneer men vestingen zal bouwen, om veel mensenlevens uit te roeien.", "2 Kon 22:12": "En de koning gebood Hilkia, de priester, en Ahikam, de zoon van Safan, en Achbor, de zoon van Michaja, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei:", "Jer 40:12": "keerden alle Joden terug uit alle plaatsen waarheen zij verdreven waren, en kwamen in het land van Juda tot Gedalia te Mizpa; en zij verzamelden zeer veel wijn en zomervruchten.", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Jer 52:18": "Ook namen zij de potten, en de schoffels, en de gaffels, en de sprenkelschalen, en de rookschalen, en al de koperen vaten waarmee men de dienst deed.", "2 Kon 25:13-16": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden het koper daarvan naar Babel. Zij namen ook de potten, en de schoffels, en de gaffels, en de rookschalen, en al de koperen voorwerpen, waarmee men de dienst verrichtte. En de aanvoerder van de lijfwacht nam de wierookvaten en de sprenkelschalen weg, wat geheel goud en wat geheel zilver was.", "Jer 52:22": "En het kapiteel daarop was van koper, en de hoogte van het ene kapiteel was vijf el, en een net, en granaatappels op het kapiteel rondom, alles koper; en hieraan gelijk had de andere pilaar, met granaatappels.", "2 Kon 12:10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "1 Kon 7:13-22": "En koning Salomo stuurde een boodschap, en liet Hiram uit Tyrus halen. Hij was de zoon van een weduwe, uit de stam van Naftali, en zijn vader was een man uit Tyrus geweest, een koperbewerker, vervuld met wijsheid, verstand en vakkennis om alle werk in koper te maken; hij kwam bij koning Salomo, en maakte al zijn werk. Want hij goot twee koperen pilaren; de hoogte van de ene pilaar was achttien el, en een draad van twaalf el kon de andere pilaar omvatten.", "Jer 32:5": "En hij zal Zedekia naar Babel voeren, en daar zal hij zijn, totdat Ik hem bezoek, spreekt de HEERE; ofschoon u tegen de Chaldeeën strijdt, u zult toch geen geluk hebben.)", "Jer 1:3": "Ook kwam het tot hem in de dagen van Jojakim, zoon van Josia, koning van Juda, totdat het elfde jaar van Zedekia, zoon van Josia, koning van Juda, voleindigd werd; totdat Jeruzalem gevankelijk werd weggevoerd in de vijfde maand.", "Jer 36:5": "En Jeremia gebood Baruch: Ik word tegengehouden, ik zal niet in het huis van de HEERE kunnen gaan.", "Jer 41:1-11": "Het gebeurde in de zevende maand, dat Ismaël, de zoon van Nethanja, de zoon van Elisama, van koninklijk nageslacht, en de leiders van de koning, tien mannen, met hem kwamen naar Gedalia, de zoon van Ahikam, te Mizpa; en zij aten daar samen brood, te Mizpa. En Ismaël, de zoon van Nethanja, maakte zich klaar, alsook de tien mannen die met hem waren, en zij sloegen Gedalia, de zoon van Ahikam, de zoon van Safan, met het zwaard; zo doodde hij hem, die de koning van Babel over het land had aangesteld. Ook sloeg Ismaël al de Joden die met hem, namelijk met Gedalia, te Mizpa waren, en de Chaldeeën, de krijgslieden, die daar gevonden werden.", "Jer 52:24-27": "Ook nam de leider van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders. En uit de stad nam hij een hoveling, die over de krijgslieden gesteld was, en zeven mannen uit degenen die het aangezicht van de koning zagen, die in de stad gevonden werden, alsook de leider van de schrijvers van het leger, die het volk van het land voor de oorlog opschreef, en zestig mannen van het volk van het land, die in het midden van de stad gevonden werden. Toen Nebuzaradan, de leider van de lijfwacht, dezen genomen had, bracht hij hen naar de koning van Babel in Ribla.", "Dan 4:30": "Sprak de koning, en zei: Is dit niet het grote Babel, dat ik gebouwd heb tot een huis van het koninkrijk, door de sterkte van mijn macht, en tot eer van mijn heerlijkheid!", "2 Kon 25:8-10": "Daarna in de vijfde maand, op de zevende van de maand (dit was het negentiende jaar van Nebukadnezar, de koning van Babel) kwam Nebuzaradan, de aanvoerder van de lijfwacht, de knecht van de koning van Babel, in Jeruzalem. En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de aanvoerder van de lijfwacht was, brak de muren van Jeruzalem rondom af.", "Jer 39:9": "Het overige nu van het volk, dat in de stad was overgebleven, en de overlopers, die naar hem overgelopen waren, met het overige van het volk, dat overgebleven was, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk naar Babel.", "Jes 64:11": "Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "1 Kon 7:48": "Ook maakte Salomo alle voorwerpen die voor het huis van de HEERE bestemd waren: het gouden altaar, en de gouden tafel waarop de toonbroden lagen;", "Dan 4:1-18": "Koning Nebukadnezar aan alle volken, natiën en talen, die op de hele aardbodem wonen: uw vrede moet vermenigvuldigd worden! Het behaagt mij te verkondigen de tekenen en wonderen, die de allerhoogste God aan mij gedaan heeft. Hoe groot zijn Zijn tekenen! En hoe machtig Zijn wonderen! Zijn Rijk is een eeuwig Rijk, en Zijn heerschappij is van geslacht tot geslacht.", "2 Kron 36:14": "Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.", "1 Kon 11:17": "Toen vluchtte Hadad, hij en enkele Edomitische mannen uit de dienaren van zijn vader met hem, om naar Egypte te gaan; Hadad was toen nog een kleine jongen.", "Jer 24:5": "Zo zegt de HEERE, de God van Israël: Zoals die goede vijgen, zo zal Ik de weggevoerden van Juda erkennen, die Ik uit deze plaats naar het land van de Chaldeeën heb weggestuurd, tot hun eigen goed.", "Jer 41:11": "Toen nu Johanan, de zoon van Kareah, en al de aanvoerders van de legers die met hem waren, al het kwaad hoorden dat Ismaël, de zoon van Nethanja, gedaan had;", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Micha 3:12": "Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud.", "2 Kron 36:10": "En bij de terugkeer van het jaar zond koning Nebukadnezar heen, en liet hem naar Babel halen, met de kostbare voorwerpen van het huis van de HEERE; en hij maakte zijn broer Zedekia koning over Juda en Jeruzalem.", "2 Sam 19:23": "En de koning zei tegen Simeï: U zult niet sterven. En de koning zwoer het hem.", "1 Kon 7:16": "Hij maakte ook twee kapitelen, van gegoten koper, om op de koppen van de pilaren te zetten; vijf el was de hoogte van het ene kapiteel, en vijf el de hoogte van het andere kapiteel.", "Jer 20:1": "Toen Pashur, de zoon van Immer, de priester (deze was aangesteld als voorganger in het huis van de HEERE), Jeremia hoorde deze woorden profeteren,", "2 Sam 8:8": "Daartoe nam de koning David zeer veel koper uit Betach en uit Berothai, steden van Hadad-Ezer.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Jer 41:2": "En Ismaël, de zoon van Nethanja, maakte zich klaar, alsook de tien mannen die met hem waren, en zij sloegen Gedalia, de zoon van Ahikam, de zoon van Safan, met het zwaard; zo doodde hij hem, die de koning van Babel over het land had aangesteld.", "2 Kon 12:9": "Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "2 Kron 36:18": "En alle voorwerpen van het huis van God, de grote en de kleine, en de schatten van het huis van de HEERE, en de schatten van de koning en zijn vorsten, dit alles bracht hij naar Babel.", "2 Kon 25:1-3": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. Op de negende van de vierde maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,", "Deut 28:53": "En u zult de vrucht van uw schoot eten, het vlees van uw zonen en van uw dochters, die de HEERE, uw God, u gegeven zal hebben; in de belegering en in de benauwdheid waarmee uw vijanden u zullen benauwen.", "Klaagl 1:5-8": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander. Vau. En van de dochter van Sion is al haar sieraad weggegaan; haar vorsten zijn als de herten, die geen weide vinden, en zij gaan krachteloos heen voor het aangezicht van de vervolger. Zain. Jeruzalem is, in de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.", "Neh 1:3": "En zij zeiden tegen mij: De overgeblevenen, die van de gevangenschap daar in het gebied zijn overgebleven, zijn in grote ellende en in smaad; en de muur van Jeruzalem is afgebroken, en haar poorten zijn met vuur verbrand.", "1 Kon 7:48-51": "Ook maakte Salomo alle voorwerpen die voor het huis van de HEERE bestemd waren: het gouden altaar, en de gouden tafel waarop de toonbroden lagen; En de kandelaars, vijf aan de rechterkant, en vijf aan de linkerkant, voor het binnenste heiligdom, van zuiver goud; en de bloemen, de lampen, en de snuiters van goud; Alsook de schalen, de vorken, de sprenkelschalen, de rookschalen, en de wierookvaten, van zuiver goud; daartoe de scharnieren van de deuren van het binnenste huis, het heilige der heiligen, en van de deuren van het huis van de tempel, van goud.", "Dan 1:5": "En de koning bepaalde voor hen wat men hen dag bij dag zou geven van het voedsel van de koning, en van de wijn van zijn drank, en dat men hen drie jaar lang zo grootbracht, en dat zij aan het einde daarvan voor de koning zouden staan.", "Gen 47:4": "Verder zeiden zij tegen Farao: Wij zijn gekomen om als vreemdelingen in dit land te wonen; want er is geen weide voor de schapen die uw knechten hebben, omdat de honger zwaar is in het land Kanaän; en laat nu toch uw knechten in het land Gosen wonen!", "1 Kon 7:47": "En Salomo liet al deze voorwerpen ongewogen vanwege de zeer grote hoeveelheid; het gewicht van het koper werd niet vastgesteld.", "2 Kron 34:20": "En de koning gebood Hilkia, en Ahikam, de zoon van Safan, en Abdon, de zoon van Micha, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei:", "Jer 52:20": "De twee pilaren, de ene zee, en de twaalf koperen runderen, die in de plaats van de stellingen waren, die koning Salomo voor het huis van de HEERE gemaakt had; het koper daarvan, namelijk van al deze vaten, was zonder gewicht.", "2 Kron 11:11": "En hij versterkte deze vestingen, en stelde er leiders in aan, en voorraden voedsel, en olie, en wijn;", "Luk 11:3": "Geef ons elke dag ons dagelijks brood.", "Jer 33:4": "Want zo zegt de HEERE, de God van Israël, van de huizen van deze stad, en van de huizen van de koningen van Juda, die door de wallen en door het zwaard zijn afgebroken:", "Jer 19:9": "En Ik zal hun het vlees van hun zonen en het vlees van hun dochters doen eten, en zij zullen eten, ieder het vlees van zijn naaste, in de belegering en in de benauwing, waarmee hun vijanden, en zij die hun ziel zoeken, hen benauwen zullen.", "Jer 40:13": "Doch Johanan, de zoon van Kareah, en alle aanvoerders van de legers die in het veld waren, kwamen tot Gedalia te Mizpa,", "2 Kron 36:17-20": "Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch de meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand. En alle voorwerpen van het huis van God, de grote en de kleine, en de schatten van het huis van de HEERE, en de schatten van de koning en zijn vorsten, dit alles bracht hij naar Babel. En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Ezech 5:12": "Een derde deel van u zal door de pest sterven, en zal door honger in het midden van u omkomen; en een derde deel zal door het zwaard vallen rondom u; en een derde deel zal Ik naar alle windrichtingen verstrooien, en Ik zal het zwaard achter hen uittrekken.", "2 Kon 11:4": "In het zevende jaar zond Jojada, en nam de leiders van honderd met de hoofdmannen en met de lijfwacht, en hij bracht hen bij zich, in het huis van de HEERE; en hij sloot een verbond met hen en beëdigde hen in het huis van de HEERE, en hij toonde hun de zoon van de koning.", "Hand 6:14": "Want wij hebben hem horen zeggen dat deze Jezus, de Nazarener, deze plaats zal afbreken, en de gebruiken zal veranderen die Mozes ons heeft overgeleverd.", "1 Kon 6:37": "In het vierde jaar werd de grond van het huis van de HEERE gelegd, in de maand Ziv;", "1 Sam 15:33": "Maar Samuël zei: Zoals uw zwaard vrouwen van hun kinderen beroofd heeft, zo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht van de HEERE te Gilgal.", "Hand 6:1": "In diezelfde dagen, toen het aantal discipelen groeide, ontstond er gemor van de Griekssprekenden tegen de Hebreeën, omdat hun weduwen bij de dagelijkse verzorging over het hoofd werden gezien.", "2 Kon 25:27-30": "Het gebeurde daarna in het zevenendertigste jaar van de wegvoering van Jojachin, de koning van Juda, in de twaalfde maand, op de zevenentwintigste van de maand, dat Evilmerodach, de koning van Babel, in het jaar dat hij koning werd, het hoofd van Jojachin, de koning van Juda, uit de gevangenis verhief. En hij sprak vriendelijk met hem, en stelde zijn zetel boven de zetel van de koningen, die bij hem te Babel waren. En hij veranderde de kleren van zijn gevangenschap, en hij at voortdurend brood voor zijn aangezicht, al de dagen van zijn leven.", "Jer 17:26": "En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Jer 39:1-8": "In het negende jaar van Zedekia, koning van Juda, in de tiende maand, kwam Nebukadrezar, de koning van Babel, en al zijn leger, tegen Jeruzalem, en zij belegerden haar. In het elfde jaar van Zedekia, in de vierde maand, op de negende dag van de maand, werd de stad doorgebroken. En alle vorsten van de koning van Babel trokken naar binnen, en hielden halt bij de middelste poort: namelijk Nergal-Sarezer, Samgar-Nebu, Sarsechim, Rab-Saris, Nergal-Sarezer, Rab-Mag, en al de overige vorsten van de koning van Babel.", "Jer 24:8": "En zoals de slechte vijgen, die vanwege de slechtheid niet gegeten kunnen worden (want zo zegt de HEERE), zo zal Ik Zedekia, de koning van Juda, maken, alsook zijn vorsten, en het overblijfsel van Jeruzalem, die in dit land zijn overgebleven, en die in het land Egypte wonen;", "Luk 19:44": "en zij zullen u tot de grond toe neerwerpen, en uw kinderen in u; en zij zullen in u geen steen op de andere steen laten liggen, omdat u de tijd waarin u bezocht werd niet hebt herkend.", "Jer 5:10": "Beklim haar muren, en verwoest ze (maar maak er geen einde aan); haal haar tinnen weg, want zij zijn niet van de HEERE.", "Deut 4:26": "Dan roep ik vandaag de hemel en de aarde tot getuige tegen u, dat u zeker snel zult omkomen uit het land waar u de Jordaan voor oversteekt om het in bezit te nemen; u zult uw dagen daarin niet verlengen, maar helemaal uitgeroeid worden.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "1 Sam 27:11": "En David liet geen man en geen vrouw in leven om naar Gath te brengen, en hij zei: Anders zouden zij misschien over ons vertellen en zeggen: Zo heeft David gedaan! En zo was zijn gewoonte, al de dagen dat hij in het land van de Filistijnen gewoond heeft.", "1 Kron 22:11": "Nu, mijn zoon, de HEERE zal met u zijn, en u zult voorspoedig zijn, en u zult het huis van de HEERE, van uw God, bouwen, zoals Hij van u gesproken heeft.", "Num 31:6": "En Mozes zond hen ten strijde, duizend van elke stam, hen en Pinehas, de zoon van Eleazar, de priester, ten strijde, met de heilige voorwerpen en de trompetten om te schallen in zijn hand.", "Jer 27:16": "Ook sprak ik tot de priesters, en tot heel dit volk, en zei: Zo zegt de HEERE: Luister niet naar de woorden van uw profeten, die u profeteren en zeggen: Zie, de voorwerpen van het huis van de HEERE zullen nu spoedig uit Babel teruggebracht worden; want zij profeteren u leugens.", "Jer 52:25": "En uit de stad nam hij een hoveling, die over de krijgslieden gesteld was, en zeven mannen uit degenen die het aangezicht van de koning zagen, die in de stad gevonden werden, alsook de leider van de schrijvers van het leger, die het volk van het land voor de oorlog opschreef, en zestig mannen van het volk van het land, die in het midden van de stad gevonden werden.", "Jer 52:5-11": "Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. In de vierde maand, op de negende van de maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had; Toen werd de stad doorgebroken, en al de krijgslieden vluchtten, en trokken 's nachts uit de stad, door de weg van de poort tussen de twee muren, die bij de hof van de koning waren (de Chaldeeën nu waren tegen de stad rondom), en zij gingen door de weg van het vlakke veld.", "Jes 13:4": "Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger.", "Jer 34:22": "Zie, Ik zal bevel geven, spreekt de HEERE, en zal hen weer naar deze stad terugbrengen, en zij zullen tegen haar strijden, en zullen ze innemen, en zullen ze met vuur verbranden; en Ik zal de steden van Juda stellen tot een verwoesting, zodat er niemand in woont.", "Est 8:15": "En Mordechai ging weg van voor de koning in een hemelsblauw en wit koninklijk kleed, en met een grote gouden kroon, en met een overkleed van fijn linnen en purper; en de stad Susan juichte en was vrolijk.", "1 Kon 8:10": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.", "Jer 32:3-5": "Want Zedekia, de koning van Juda, had hem opgesloten en gezegd: Waarom profeteert u en zegt u: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal haar innemen; En Zedekia, de koning van Juda, zal aan de hand van de Chaldeeën niet ontkomen; maar hij zal zeker gegeven worden in de hand van de koning van Babel, en zijn mond zal tot diens mond spreken, en zijn ogen zullen diens ogen zien; En hij zal Zedekia naar Babel voeren, en daar zal hij zijn, totdat Ik hem bezoek, spreekt de HEERE; ofschoon u tegen de Chaldeeën strijdt, u zult toch geen geluk hebben.)", "Ezech 12:13-16": "Ik zal ook Mijn net over hem uitspreiden, zodat hij in Mijn jachtnet gegrepen wordt; en Ik zal hem brengen naar Babylonië, het land van de Chaldeeën; ook zal hij dat niet zien, hoewel hij daar zal sterven. En allen die rondom hem zijn tot zijn hulp, en al zijn troepen zal Ik naar alle windrichtingen verstrooien; en Ik zal het zwaard achter hen trekken. Zo zullen zij weten dat Ik de HEERE ben, wanneer Ik hen onder de heidenvolken verspreid en hen in de landen verstrooi.", "Jer 52:12-14": "Daarna, in de vijfde maand, op de tiende van de maand (dit jaar was het negentiende jaar van koning Nebukadrezar, de koning van Babel), toen Nebuzaradan, de leider van de lijfwacht, die voor het aangezicht van de koning van Babel stond, in Jeruzalem gekomen was; Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.", "Jer 39:6": "En de koning van Babel slachtte de zonen van Zedekia te Ribla voor zijn ogen; ook slachtte de koning van Babel alle edelen van Juda.", "Ps 74:3-7": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven. Uw tegenstanders hebben in het midden van Uw vergaderplaatsen gebruld; zij hebben hun eigen tekens tot tekens gesteld. Ieder werd erkend als iemand die de bijlen omhoog hanteert in het dichte geboomte.", "Jer 38:23": "Zij zullen dan al uw vrouwen en al uw zonen naar de Chaldeeën uitvoeren; ook zult u zelf uit hun hand niet ontkomen; maar u zult door de hand van de koning van Babel gegrepen worden, en u zult deze stad met vuur verbranden.", "Ezech 6:12": "Wie ver weg is, zal door de pest sterven, en wie dichtbij is, zal door het zwaard vallen; maar wie overgebleven en belegerd is, zal door honger sterven; zo zal Ik Mijn grimmigheid tegen hen volbrengen.", "2 Kon 24:11": "Zelfs kwam Nebukadnezar, de koning van Babel, tegen de stad, terwijl zijn dienaren die belegerden.", "2 Sam 14:11": "En zij zei: De koning gedenkt toch aan de HEERE, uw God, dat de bloedwrekers niet te talrijk worden om te verderven, zodat zij mijn zoon niet ombrengen. Toen zei hij: Zo waarachtig als de HEERE leeft, er zal geen haar van uw zoon op de aarde vallen!", "Jer 40:10": "En zie, ik woon te Mizpa, om voor de Chaldeeën te staan die tot ons zullen komen; verzamel u dan wijn, en zomervruchten, en olie, en doe ze in uw vaten, en woon in uw steden die u hebt ingenomen.", "1 Sam 1:24": "Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.", "Amos 5:27": "Daarom zal Ik u gevankelijk wegvoeren, ver voorbij Damaskus, zegt de HEERE, Wiens Naam is God van de heerscharen.", "Jer 41:1-18": "Het gebeurde in de zevende maand, dat Ismaël, de zoon van Nethanja, de zoon van Elisama, van koninklijk nageslacht, en de leiders van de koning, tien mannen, met hem kwamen naar Gedalia, de zoon van Ahikam, te Mizpa; en zij aten daar samen brood, te Mizpa. En Ismaël, de zoon van Nethanja, maakte zich klaar, alsook de tien mannen die met hem waren, en zij sloegen Gedalia, de zoon van Ahikam, de zoon van Safan, met het zwaard; zo doodde hij hem, die de koning van Babel over het land had aangesteld. Ook sloeg Ismaël al de Joden die met hem, namelijk met Gedalia, te Mizpa waren, en de Chaldeeën, de krijgslieden, die daar gevonden werden.", "Jer 52:17-23": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden al het koper daarvan naar Babel. Ook namen zij de potten, en de schoffels, en de gaffels, en de sprenkelschalen, en de rookschalen, en al de koperen vaten waarmee men de dienst deed. En de leider van de lijfwacht nam de schalen weg, en de wierookvaten, en de sprenkelschalen, en de potten, en de kandelaars, en de rookschalen, en de kroezen; wat geheel goud, en wat geheel zilver was.", "Jer 52:26": "Toen Nebuzaradan, de leider van de lijfwacht, dezen genomen had, bracht hij hen naar de koning van Babel in Ribla.", "Jer 40:6-12": "Zo kwam Jeremia tot Gedalia, de zoon van Ahikam, te Mizpa; en hij woonde bij hem in het midden van het volk, dat in het land overgebleven was. Toen nu alle aanvoerders van de legers die in het veld waren, zij en hun mannen, hoorden dat de koning van Babel Gedalia, de zoon van Ahikam, over het land aangesteld had, en dat hij aan hem had toevertrouwd de mannen, en de vrouwen, en de kinderen, en de armsten van het land, van hen die niet naar Babel gevankelijk waren weggevoerd, kwamen zij tot Gedalia te Mizpa, namelijk Ismaël, de zoon van Nethanja, en Johanan en Jonathan, de zonen van Kareah, en Seraja, de zoon van Tanhumeth, en de zonen van Efai, de Netofathiet, en Jezanja, de zoon van een Maachathiet, zij en hun mannen.", "Dan 2:37": "U, o koning, bent een koning der koningen; want de God van de hemel heeft u een koninkrijk, macht, sterkte en eer gegeven;", "Jes 36:12": "Maar Rabsake zei: Heeft mijn heer mij naar uw heer en naar u gezonden om deze woorden te spreken? Is het niet naar de mannen die op de muur zitten, om met u hun eigen drek te eten en hun eigen water te drinken?", "Jer 28:5": "Toen zei de profeet Jeremia tegen de profeet Hananja, voor de ogen van de priesters en voor de ogen van het hele volk, dat in het huis van de HEERE stond;", "Lev 26:26": "Als Ik u de staf van het brood zal hebben gebroken, dan zullen tien vrouwen uw brood in één oven bakken, en zullen uw brood bij het gewicht teruggeven; en u zult eten, maar niet verzadigd worden.", "Ezech 33:24": "Mensenkind! De inwoners van die verwoeste plaatsen in het land van Israël zeggen: Abraham was maar één man, en bezat dit land erfelijk; maar wij zijn met velen; het land is ons gegeven tot erfelijk bezit.", "Jer 34:21": "Zelfs Zedekia, de koning van Juda, en zijn vorsten, zal Ik overgeven in de hand van hun vijanden, en in de hand van hen die hun ziel zoeken, namelijk in de hand van het leger van de koning van Babel, dat van u nu is opgetrokken.", "2 Kon 25:22-24": "Maar aangaande het volk, dat in het land van Juda overgebleven was, dat Nebukadnezar, de koning van Babel, had laten overblijven, daarover stelde hij Gedalia aan, de zoon van Ahikam, de zoon van Safan. Toen nu alle aanvoerders van de legers, zij en hun mannen, hoorden dat de koning van Babel Gedalia tot leider had aangesteld, kwamen zij tot Gedalia naar Mizpa; namelijk Ismaël, de zoon van Nethanja, en Johanan, de zoon van Kareah, en Seraja, de zoon van Tanhumeth, de Netofathiet, en Jaazanja, de zoon van de Maachathiet, zij en hun mannen. En Gedalia zwoer hun en hun mannen, en zei tegen hen: Wees niet bang om knechten van de Chaldeeën te zijn, blijf in het land, en dien de koning van Babel, dan zal het u goed gaan.", "2 Kon 25:9-17": "En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de aanvoerder van de lijfwacht was, brak de muren van Jeruzalem rondom af. Het overige nu van het volk, die in de stad overgelaten waren, en de afvalligen, die tot de koning van Babel gevallen waren, en het overige van de menigte, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk weg.", "Jer 26:7": "En de priesters, en de profeten, en al het volk, hoorden Jeremia deze woorden spreken in het huis van de HEERE.", "Jer 42:1": "Toen kwamen alle leiders van de legers naar voren: Johanan, de zoon van Kareah, en Jezanja, de zoon van Hosaja, en al het volk, van de kleinste tot de grootste toe;", "Deut 32:24": "Uitgeteerd zullen zij zijn van honger, opgegeten door de karbonkel en bitter verderf; en Ik zal de tanden van de beesten onder hen sturen, met vurig venijn van slangen van het stof.", "Dan 9:2": "in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was.", "Jer 52:4": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadrezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zij legerden zich tegen haar, en zij bouwden tegen haar sterkten rondom.", "Jer 52:10": "En de koning van Babel slachtte de zonen van Zedekia voor zijn ogen; en hij slachtte ook al de vorsten van Juda te Ribla.", "1 Sam 1:7": "En zo deed hij jaar op jaar; van toen af dat zij opging naar het huis van de HEERE, zo tergde zij haar steeds; daarom weende zij en at niet.", "2 Kron 26:9": "Daartoe bouwde Uzzia torens te Jeruzalem, bij de Hoekpoort en bij de Dalpoort, en bij de hoeken, en hij versterkte ze.", "Num 3:32": "De aanvoerder nu van de aanvoerders van Levi zal zijn Eleazar, de zoon van Aäron, de priester; zijn opzicht zal zijn over degenen, die de wacht van het heiligdom waarnemen.", "Num 4:16": "Het toezicht nu van Eleazar, de zoon van Aäron, de priester, zal zijn over de olie van het licht, en het reukwerk van de welriekende specerijen, en het gedurige spijsoffer, en de zalfolie; het toezicht over de hele tabernakel, en alles wat daarin is, over het heiligdom en zijn gereedschap.", "2 Kon 20:18": "Daarbij zullen zij van uw zonen, die uit u zullen voortkomen, die u zult verwekken, nemen, zodat zij hovelingen zijn in het paleis van de koning van Babel.", "Jer 41:7": "Maar het gebeurde, toen zij midden in de stad gekomen waren, dat Ismaël, de zoon van Nethanja, hen keelde, en hen wierp in het midden van het kuil, hij en de mannen die met hem waren.", "Jes 61:5": "En vreemdelingen zullen klaarstaan en uw kudden weiden; en buitenlanders zullen uw akkerlieden en uw wijngaardeniers zijn.", "Jer 15:1": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan.", "Klaagl 4:4-10": "Daleth. De tong van het zuigeling kleeft aan zijn gehemelte van dorst; de kinderen vragen om brood, er is niemand die het hun uitdeelt. He. Die lekkernijen aten, komen nu om op de straten; die in karmozijn zijn grootgebracht, omhelzen de vuilnishoop. Vau. En de ongerechtigheid van de dochter van mijn volk is groter dan de zonden van Sodom, dat als in een ogenblik omgekeerd werd, zonder dat er handen naar haar uitgestoken werden.", "Jer 40:5": "En omdat hij nog niet zal terugkeren, keer u dan terug tot Gedalia, de zoon van Ahikam, de zoon van Safan, die de koning van Babel over de steden van Juda aangesteld heeft; en woon bij hem in het midden van het volk; of ga overal waar het in uw ogen recht is te gaan. En de aanvoerder van de lijfwacht gaf hem reiskost en een geschenk, en liet hem gaan.", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "1 Kon 7:47-50": "En Salomo liet al deze voorwerpen ongewogen vanwege de zeer grote hoeveelheid; het gewicht van het koper werd niet vastgesteld. Ook maakte Salomo alle voorwerpen die voor het huis van de HEERE bestemd waren: het gouden altaar, en de gouden tafel waarop de toonbroden lagen; En de kandelaars, vijf aan de rechterkant, en vijf aan de linkerkant, voor het binnenste heiligdom, van zuiver goud; en de bloemen, de lampen, en de snuiters van goud;", "2 Kon 25:18-21": "Ook nam de aanvoerder van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders. En uit de stad nam hij een hoveling, die over de krijgslieden gesteld was, en vijf mannen van hen die het aangezicht van de koning zagen, die in de stad gevonden werden, alsook de hoofdschrijver van het leger, die het volk van het land opriep voor de oorlog, en zestig mannen van het volk van het land, die in de stad gevonden werden. Toen Nebuzaradan, de aanvoerder van de lijfwacht, dezen genomen had, bracht hij hen naar de koning van Babel, naar Ribla.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "1 Kron 22:14": "Zie, ik heb in mijn verdrukking voor het huis van de HEERE honderdduizend talenten van het goud bereid, en duizend maal duizend talenten van het zilver; en van het koper en van het ijzer is er geen gewicht, want het is er in overvloed; ik heb ook hout en stenen bereid; voegt u er nog meer aan toe.", "2 Kon 23:2": "En de koning ging op naar het huis van de HEERE, en met hem alle mannen van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van de kleinste tot de grootste; en hij las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was.", "2 Sam 9:7": "En David zei tegen hem: Wees niet bang, want ik zal zeker goedheid aan u bewijzen, omwille van uw vader Jonathan; en ik zal u alle akkers van uw vader Saul teruggeven; en u zult voortdurend brood eten aan mijn tafel.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Jes 32:14": "Want het paleis zal verlaten zijn, het gewoel van de stad zal ophouden; Ofel en de wachttorens zullen tot spelonken zijn, tot in eeuwigheid, een vreugde van de woudezels, een weide voor de kudden.", "Jer 40:15": "Johanan echter, de zoon van Kareah, sprak in het verborgene tot Gedalia, te Mizpa, en zei: Laat mij toch heengaan, en Ismaël, de zoon van Nethanja, doden, en niemand zal het weten; waarom zou hij u om het leven brengen, en heel Juda, dat tot u vergaderd is, verstrooid worden, en het overblijfsel van Juda verloren gaan?", "Ezech 21:22": "De waarzeggerij zal aan zijn rechterhand zijn op Jeruzalem, om hoofdmannen aan te stellen, om de mond te openen tot het doodslaan, om de stem op te heffen met gejuich, om stormrammen op te stellen tegen de poorten, om verhogingen op te werpen, om bolwerken te bouwen.", "Jer 52:21": "Aangaande de pilaren, achttien el was de hoogte van één pilaar, en een draad van twaalf el omving hem; en zijn dikte was vier vingers, en hij was hol.", "Joz 6:24": "De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.", "Jer 52:8": "Doch het leger van de Chaldeeën joeg de koning na, en zij achterhaalden Zedekia in de vlakke velden van Jericho; en zijn hele leger werd van bij hem verstrooid.", "1 Kron 26:12": "Uit dezen waren de verdelingen van de poortwachters onder de hoofden van de mannen, met wachtdiensten tegenover hun broers, om te dienen in het huis van de HEERE.", "Ezech 5:2": "Een derde deel zult u in het midden van de stad met vuur verbranden, nadat de dagen van de belegering vervuld zijn; dan zult u een derde deel nemen, en daaromheen slaan met een zwaard, en een derde deel zult u in de wind strooien; want Ik zal het zwaard achter hen uittrekken.", "Ezech 4:2": "En maak een belegering tegen haar, bouw tegen haar sterkten, werp tegen haar een wal op, stel legers tegen haar en zet tegen haar stormrammen rondom.", "Deut 28:25": "De HEERE zal geven dat u verslagen wordt voor uw vijanden; door één weg zult u tegen hem uittrekken, en door zeven wegen zult u voor hem vluchten; en u zult heen en weer gedreven worden onder alle koninkrijken van de aarde.", "Jer 52:7-11": "Toen werd de stad doorgebroken, en al de krijgslieden vluchtten, en trokken 's nachts uit de stad, door de weg van de poort tussen de twee muren, die bij de hof van de koning waren (de Chaldeeën nu waren tegen de stad rondom), en zij gingen door de weg van het vlakke veld. Doch het leger van de Chaldeeën joeg de koning na, en zij achterhaalden Zedekia in de vlakke velden van Jericho; en zijn hele leger werd van bij hem verstrooid. Zij grepen dan de koning, en voerden hem op naar de koning van Babel in Ribla, in het land van Hamath; die sprak oordelen tegen hem uit.", "Jer 52:14-23": "En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af. Van de armsten nu van het volk en het overige van het volk, die in de stad overgelaten waren, en de afvalligen, die naar de koning van Babel overgelopen waren, en het overige van de menigte, voerde Nebuzaradan, de leider van de lijfwacht, gevankelijk weg. Maar van de armsten van het land liet Nebuzaradan, de leider van de lijfwacht, enigen over tot wijngaardeniers en tot akkerlieden.", "Richt 9:31": "En hij zond in het geheim boden naar Abimelech, en zei: Zie, Gaal, de zoon van Ebed, en zijn broers zijn naar Sichem gekomen, en zie, zij zetten deze stad tegen u op.", "Jer 52:17-20": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden al het koper daarvan naar Babel. Ook namen zij de potten, en de schoffels, en de gaffels, en de sprenkelschalen, en de rookschalen, en al de koperen vaten waarmee men de dienst deed. En de leider van de lijfwacht nam de schalen weg, en de wierookvaten, en de sprenkelschalen, en de potten, en de kandelaars, en de rookschalen, en de kroezen; wat geheel goud, en wat geheel zilver was.", "Jer 39:7": "En hij verblindde de ogen van Zedekia, en bond hem met twee koperen ketenen, om hem naar Babel te voeren.", "Ezra 1:9-11": "En dit is hun aantal: dertig gouden bekkens, duizend zilveren bekkens, negenentwintig messen; Dertig gouden bekers, vierhonderd en tien andere zilveren bekers; andere voorwerpen, duizend. Alle voorwerpen van goud en van zilver waren vijfduizend vierhonderd; deze alle bracht Sesbazar mee, toen degenen die uit de gevangenschap opgevoerd werden, van Babel naar Jeruzalem optrokken.", "Jer 52:17": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden al het koper daarvan naar Babel.", "Jer 26:9": "Waarom hebt u in de Naam van de HEERE geprofeteerd, en gezegd: Dit huis zal worden als Silo, en deze stad zal woest worden, zodat er niemand meer woont? En het hele volk werd verzameld tegen Jeremia, in het huis van de HEERE.", "Ezech 4:1-8": "En u, mensenkind, neem u een tichelsteen, leg die voor uw aangezicht en teken daarop de stad Jeruzalem. En maak een belegering tegen haar, bouw tegen haar sterkten, werp tegen haar een wal op, stel legers tegen haar en zet tegen haar stormrammen rondom. Verder, neem u een ijzeren pan en zet die als een ijzeren muur tussen u en die stad; richt uw aangezicht tegen haar, zodat zij belegerd wordt, en u zult haar belegeren. Dit is voor het huis van Israël een teken.", "Jes 37:14": "Toen Hizkia de brieven uit de hand van de boden ontvangen had, en die gelezen had, ging hij naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE.", "Jer 52:9": "Zij grepen dan de koning, en voerden hem op naar de koning van Babel in Ribla, in het land van Hamath; die sprak oordelen tegen hem uit.", "Jer 34:3-6": "En u zult van zijn hand niet ontkomen, maar zeker gegrepen en in zijn hand gegeven worden; en uw ogen zullen de ogen van de koning van Babel zien, en zijn mond zal tot uw mond spreken, en u zult naar Babel komen. Maar hoor het woord van de HEERE, o Zedekia, koning van Juda! Zo zegt de HEERE van u: U zult door het zwaard niet sterven. U zult sterven in vrede, en zoals bij de brandingen van uw vaderen, de vorige koningen die vóór u geweest zijn, zo zullen zij ook voor u branden, en u beklagen en zeggen: Ach heer! Want Ik heb het woord gesproken, spreekt de HEERE.", "Ex 37:23": "En hij maakte er zeven lampen bij; zijn snuiters en zijn bakjes waren van zuiver goud.", "Ezech 33:27": "Zo zult u tegen hen zeggen: Zo zegt de Heere HEERE: Zo waarachtig als Ik leef, wie in die verwoeste plaatsen zijn, zullen door het zwaard vallen, en wie op het open veld is, die zal Ik aan het wilde gedierte overgeven om hem te verslinden, en wie in de vestingen en in de holen zijn, zullen door de pest sterven!", "2 Kon 23:11": "En hij schafte de paarden af, die de koningen van Juda voor de zon gesteld hadden, bij de ingang van het huis van de HEERE, tot de kamer van Nathan-melech, de hoveling, die in Parvarim was; en de wagens van de zon verbrandde hij met vuur.", "Lev 26:33-35": "Daartoe zal Ik u onder de heidenen verstrooien; en een zwaard achter u trekken; en uw land zal woest zijn, en uw steden zullen een woestijn zijn. Dan zal het land aan zijn sabbatten een welgevallen hebben, al de dagen van de verwoesting, terwijl u in het land van uw vijanden bent; dan zal het land rusten, en aan zijn sabbatten een welgevallen hebben. Al de dagen van de verwoesting zal het rusten, omdat het niet rustte in uw sabbatten, toen u daarin woonde.", "Jer 40:8": "kwamen zij tot Gedalia te Mizpa, namelijk Ismaël, de zoon van Nethanja, en Johanan en Jonathan, de zonen van Kareah, en Seraja, de zoon van Tanhumeth, en de zonen van Efai, de Netofathiet, en Jezanja, de zoon van een Maachathiet, zij en hun mannen.", "Jes 30:16": "En u zegt: Nee, maar op paarden zullen wij vluchten; daarom zult u vluchten! En: Op snelle paarden zullen wij rijden; daarom zullen uw vervolgers ook snel zijn!", "Jes 22:10": "U zult ook de huizen van Jeruzalem tellen; en u zult huizen afbreken, om de muren te versterken.", "2 Kron 26:10": "Hij bouwde ook torens in de woestijn, en hakte veel putten uit, omdat hij veel vee had, zowel in de laagten als in de effent velden; akkerlieden en wijngaardeniers op de bergen en op de vruchtbare velden; want hij was een liefhebber van het bewerken van het land.", "Hand 6:13": "en zetten valse getuigen in, die zeiden: Deze man houdt niet op lasterlijke woorden te spreken tegen deze heilige plaats en de wet.", "Jer 26:24": "Maar de hand van Ahikam, de zoon van Safan, was met Jeremia, zodat men hem niet overgaf in de hand van het volk, om hem te doden.", "2 Kon 17:32": "Ook vreesden zij de HEERE, en maakten zich uit hun geringste eigen priesters van de hoogten, die voor hen dienst deden in de huizen van de hoogten.", "Jer 42:13-18": "Maar als u zult zeggen: Wij zullen in dit land niet blijven; zodat u niet gehoorzaam bent aan de stem van de HEERE, van uw God, en zegt: Nee, maar wij zullen naar Egypteland gaan, waar wij geen oorlog zullen zien, noch het geluid van de bazuin horen, noch naar brood hongeren, en daar zullen wij blijven; nu dan, daarom hoor het woord van de HEERE, overblijfsel van Juda! Zo zegt de HEERE van de heerscharen, de God van Israël: Als u vastbesloten uw aangezichten stelt om naar Egypte te gaan, en daar naartoe gaat om daar als vreemdelingen te wonen;", "Jer 29:14": "En Ik zal door u gevonden worden, spreekt de HEERE, en Ik zal uw gevangenschap wenden, en u verzamelen uit al de volken en uit al de plaatsen waarheen Ik u gedreven heb, spreekt de HEERE; en Ik zal u terugbrengen naar de plaats vanwaar Ik u gevankelijk heb laten wegvoeren.", "Matt 2:13": "Toen zij vertrokken waren, zie, de engel van de Heere verschijnt aan Jozef in de droom en zegt: Sta op, neem het Kindje en Zijn moeder tot u, en vlucht naar Egypte, en blijf daar totdat ik het u zeg; want Herodes zal het Kindje zoeken om Het te doden.", "Deut 20:20": "Maar het geboomte waarvan u zult weten dat het geen geboomte tot voedsel is, dat zult u verderven en omhakken; en u zult een bolwerk bouwen tegen deze stad, die tegen u oorlog voert, totdat zij valt.", "Dan 1:3-7": "En de koning zei tegen Aspenaz, de leider van zijn kamerlingen, dat hij enigen uit de kinderen van Israël voor moest brengen, namelijk uit het koninklijk geslacht, en uit de vooraanstaanden; Jongemannen, aan wie geen gebrek was, maar knap van gezicht, en verstandig in alle wijsheid, en ervaren in kennis, en scherp van verstand, en in wie de bekwaamheid was om te staan in het paleis van de koning; en dat men hen zou onderwijzen in de boeken en taal van de Chaldeeën. En de koning bepaalde voor hen wat men hen dag bij dag zou geven van het voedsel van de koning, en van de wijn van zijn drank, en dat men hen drie jaar lang zo grootbracht, en dat zij aan het einde daarvan voor de koning zouden staan.", "Jer 34:3": "En u zult van zijn hand niet ontkomen, maar zeker gegrepen en in zijn hand gegeven worden; en uw ogen zullen de ogen van de koning van Babel zien, en zijn mond zal tot uw mond spreken, en u zult naar Babel komen.", "2 Kron 4:2-6": "Daartoe maakte hij de gegoten zee; van tien ellen was zij, van de ene rand tot de andere rand, rondom rond, en van vijf ellen in haar hoogte, en een meetsnoer van dertig ellen omving haar rondom. Onder haar nu was de gelijkenis van runderen, die er rondom omheen stonden, tien in een el, die de zee omringden. Twee rijen van deze runderen waren in haar gieting gegoten. Zij stond op twaalf runderen, drie ziende naar het noorden, en drie ziende naar het westen, en drie ziende naar het zuiden, en drie ziende naar het oosten; en de zee was boven op hen; en al hun achterdelen waren naar binnen gekeerd.", "Jer 27:6-11": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen. En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken. En het zal gebeuren: het volk en het koninkrijk dat hem, Nebukadnezar, de koning van Babel, niet zal dienen, en dat zijn hals niet onder het juk van de koning van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.", "Jer 40:6-15": "Zo kwam Jeremia tot Gedalia, de zoon van Ahikam, te Mizpa; en hij woonde bij hem in het midden van het volk, dat in het land overgebleven was. Toen nu alle aanvoerders van de legers die in het veld waren, zij en hun mannen, hoorden dat de koning van Babel Gedalia, de zoon van Ahikam, over het land aangesteld had, en dat hij aan hem had toevertrouwd de mannen, en de vrouwen, en de kinderen, en de armsten van het land, van hen die niet naar Babel gevankelijk waren weggevoerd, kwamen zij tot Gedalia te Mizpa, namelijk Ismaël, de zoon van Nethanja, en Johanan en Jonathan, de zonen van Kareah, en Seraja, de zoon van Tanhumeth, en de zonen van Efai, de Netofathiet, en Jezanja, de zoon van een Maachathiet, zij en hun mannen.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "1 Kon 8:63": "En Salomo offerde als dankoffer, dat hij de HEERE offerde, tweeëntwintigduizend runderen, en honderdtwintigduizend schapen. Zo hebben zij het huis van de HEERE ingewijd, de koning en al de kinderen van Israël.", "2 Kron 29:5": "En hij zei tegen hen: Hoor mij, Levieten; heilig nu uzelf, en heilig het huis van de HEERE, de God van uw vaderen, en breng de onreinheid naar buiten, uit het heiligdom.", "1 Kron 20:3": "Hij bracht ook al het volk dat daarin was naar buiten, en hij zaagde hen met de zaag, en met ijzeren dorswagens, en met bijlen; en zo deed David met al de steden van de kinderen Ammons. Toen keerde David met al het volk terug naar Jeruzalem.", "Ezech 12:12": "En de vorst, die in hun midden is, zal het gereedschap op de schouder dragen in het donker, en hij zal uitgaan; zij zullen door de wand graven, om hem daardoor naar buiten te brengen; hij zal zijn gezicht bedekken, zodat hij met het oog de aarde niet ziet.", "Luk 21:6": "Wat deze dingen aangaat, die u aanschouwt: er zullen dagen komen waarin geen steen op de andere steen gelaten zal worden, die niet zal worden afgebroken.", "Matt 6:11": "Geef ons heden ons dagelijks brood.", "Matt 2:12": "En omdat zij door God in een droom gewaarschuwd waren dat zij niet naar Herodes zouden terugkeren, vertrokken zij via een andere weg naar hun land.", "Jer 20:2": "sloeg Pashur de profeet Jeremia, en zette hem in de gevangenis die in de bovenste poort van Benjamin is, die aan het huis van de HEERE ligt.", "Jer 37:21": "Toen gaf koning Zedekia bevel, en zij brachten Jeremia onder in het voorhof van de gevangenis, en men gaf hem dagelijks een bol brood uit de Bakkerstraat, totdat al het brood van de stad op was. Zo bleef Jeremia in het voorhof van de gevangenis.", "Nahum 2:1": "De verstrooier trekt tegen uw aangezicht op; bewaar de vesting; bezie de weg; sterk de lenden, versterk de kracht zeer.", "Jer 39:14": "zij zonden dan mensen en namen Jeremia uit het voorhof van de bewaring, en gaven hem over aan Gedalia, de zoon van Ahikam, de zoon van Safan, om hem naar huis te brengen; zo bleef hij in het midden van het volk.", "Jer 32:28": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.", "2 Kron 3:15-17": "Nog maakte hij voor het huis twee pilaren, van vijfendertig ellen in lengte; en het kapiteel dat op ieders hoofd was, was van vijf ellen. Ook maakte hij ketenen, zoals bij het binnenste heiligdom, en zette ze op de hoofden van de pilaren; verder maakte hij honderd granaatappels, en zette ze tussen de ketenen. En hij richtte de pilaren op voor de tempel, één rechts en één links; en hij noemde de naam van de rechter Jachin, en de naam van de linker Boaz.", "1 Sam 14:17": "zei Saul tegen het volk dat bij hem was: Tel toch, en zie wie van ons weggegaan zijn. En zij telden, en zie, Jonathan en zijn wapendrager waren daar niet.", "2 Kon 25:28-30": "En hij sprak vriendelijk met hem, en stelde zijn zetel boven de zetel van de koningen, die bij hem te Babel waren. En hij veranderde de kleren van zijn gevangenschap, en hij at voortdurend brood voor zijn aangezicht, al de dagen van zijn leven. En aangaande zijn levensonderhoud, een voortdurend levensonderhoud werd hem van de koning gegeven, elke dag een vastgesteld deel op zijn dag, al de dagen van zijn leven.", "Jer 25:9-11": "Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden. En Ik zal van hen doen vergaan de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid, het geluid van de molens en het licht van de lamp. En dit hele land zal worden tot een woestheid, tot een ontzetting; en deze volken zullen de koning van Babel dienen zeventig jaren.", "Jer 51:59": "Het woord dat de profeet Jeremia opdroeg aan Seraja, de zoon van Nerija, de zoon van Machseja, toen hij met Zedekia, de koning van Juda, naar Babel trok, in het vierde jaar van zijn regering; en Seraja was een vreedzame vorst.", "Jer 28:1": "Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei:", "Jer 40:9": "En Gedalia, de zoon van Ahikam, de zoon van Safan, zwoer hun en hun mannen, en zei: Wees niet bang om de Chaldeeën te dienen; blijf in het land, en dien de koning van Babel, dan zal het u goed gaan.", "2 Kron 36:6": "Nebukadnezar, de koning van Babel, trok tegen hem op, en bond hem met twee koperen ketenen, om hem naar Babel te voeren.", "2 Kron 4:12": "De twee pilaren, en de bollen, en de twee kapitelen, op het hoofd van de pilaren; en de twee netten, om de twee bollen van de kapitelen te bedekken, die op het hoofd van de pilaren waren;", "1 Kon 11:40": "Daarom zocht Salomo Jerobeam te doden; maar Jerobeam maakte zich op en vluchtte naar Egypte, naar Sisak, de koning van Egypte, en was in Egypte totdat Salomo stierf.", "Jer 27:19-22": "Want zo zegt de HEERE van de heerscharen, over de pilaren, en over de zee, en over de onderstellen, en over het overige van de voorwerpen die in deze stad zijn overgebleven, die Nebukadnezar, de koning van Babel, niet heeft weggenomen, toen hij Jechonia, de zoon van Jojakim, koning van Juda, van Jeruzalem naar Babel gevankelijk wegvoerde, alsook alle edelen van Juda en Jeruzalem; ja, zo zegt de HEERE van de heerscharen, de God van Israël, over de voorwerpen die in het huis van de HEERE, en in het huis van de koning van Juda, en in Jeruzalem zijn overgebleven:", "Ezech 7:15": "Het zwaard is buiten, en de pest en de honger van binnen; die op het veld is, zal door het zwaard sterven, en die in de stad is, die zal de honger en de pest verteren.", "1 Kon 10:8": "Gelukkig zijn uw mannen, gelukkig deze knechten van u, die voortdurend voor uw aangezicht staan, die uw wijsheid horen!", "2 Sam 5:9": "Zo woonde David in de burcht en noemde die de stad van David. En David bouwde rondom, vanaf Millo naar binnen toe.", "Klaagl 4:1": "Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!", "Ezech 24:1": "Verder kwam het woord van de HEERE tot mij, in het negende jaar, in de tiende maand, op de tiende dag van de maand, en Hij zei:", "Dan 1:1": "In het derde jaar van het koningschap van Jojakim, de koning van Juda, kwam Nebukadnezar, de koning van Babel, naar Jeruzalem, en belegerde het.", "1 Sam 11:2": "Maar Nahas, de Ammoniet, zei tegen hen: Op deze voorwaarde zal ik een verbond met u sluiten, dat ik bij u allen het rechteroog uitsteek, en dat ik deze schande op heel Israël leg.", "Dan 5:19": "En vanwege de grootheid die Hij hem gegeven had, beefden en sidderden alle volken, naties en talen voor hem; wie hij wilde, doodde hij, en wie hij wilde, hield hij in leven, en wie hij wilde, verhoogde hij, en wie hij wilde, vernederde hij.", "Ezech 12:16": "Toch zal Ik van hen weinige mensen laten overblijven van het zwaard, van de honger en van de pest; opdat zij al hun gruwelen vertellen onder de heidenvolken, waarheen zij komen zullen, en zij zullen weten dat Ik de HEERE ben.", "2 Sam 12:31": "Het volk dat daarin was, voerde hij naar buiten, en zette hen aan het werk met zagen, en met ijzeren dorswagens, en met ijzeren bijlen, en liet hen door de steenoven gaan; en zo deed hij met alle steden van de kinderen van Ammon. Daarna keerde David, met heel het volk, terug naar Jeruzalem.", "2 Kon 25:1-10": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. Op de negende van de vierde maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,", "2 Sam 20:4": "Verder zei de koning tegen Amasa: Roep mij de mannen van Juda samen, tegen de derde dag; en u, stel u dan hier op.", "Ex 23:19": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE uw God brengen. U zult een bokje niet koken in de melk van zijn moeder.", "Klaagl 4:16": "Pe. Het aangezicht van de HEERE heeft hen verstrooid. Hij zal hen voortaan niet meer aanzien; zij hebben het aangezicht van de priesters niet geëerd, zij hebben de ouden geen genade bewezen.", "Jer 36:6": "Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.", "Jes 9:19": "Als hij ter rechterhand snijdt, zal hij toch hongeren, en als hij ter linkerhand eet, zal hij toch niet verzadigd worden; ieder zal het vlees van zijn eigen arm eten;", "Jes 22:11": "Ook zult u een gracht maken tussen beide de muren, voor het water van de oude vijver; maar u zult niet omhoogkijken naar Hem, Die dat gedaan heeft, en Hem niet aanmerken, Die dat van verre tijden gevormd heeft.", "Ps 106:46": "Daarom gaf Hij hun barmhartigheid voor het aangezicht van allen die hen gevangen hadden.", "2 Kon 25:1-8": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. Op de negende van de vierde maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,", "Jer 52:4-30": "En het gebeurde in h
