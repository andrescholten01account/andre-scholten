/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom.","2":"Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia.","3":"Op de negende van de *vierde* maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,","4":"Toen werd de stad doorgebroken, en al de krijgslieden *vluchtten* 's nachts door de weg van de poort, tussen de twee muren, die bij de tuin van de koning waren (de Chaldeeën nu waren tegen de stad rondom), en *de koning* trok *door* de weg van het vlakke veld.","5":"Doch het leger van de Chaldeeën jaagde de koning na, en zij achterhaalden hem in de vlakke velden van Jericho, en heel zijn leger raakte van bij hem verstrooid.","6":"Zij dan grepen de koning, en voerden hem op naar de koning van Babel, naar Ribla; en zij spraken een oordeel tegen hem.","7":"En zij slachtten de zonen van Zedekia voor zijn ogen, en men verblindde Zedekia's ogen, en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.","8":"Daarna in de vijfde maand, op de zevende van de maand (dit was het negentiende jaar van Nebukadnezar, de koning van Babel) kwam Nebuzaradan, de aanvoerder van de lijfwacht, de knecht van de koning van Babel, in Jeruzalem.","9":"En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur.","10":"En het hele leger van de Chaldeeën, dat met de aanvoerder van de lijfwacht was, brak de muren van Jeruzalem rondom af.","11":"Het overige nu van het volk, die in de stad overgelaten waren, en de afvalligen, die tot de koning van Babel gevallen waren, en het overige van de menigte, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk weg.","12":"Maar van de armsten van het land liet de aanvoerder van de lijfwacht *enigen* overig tot wijngaardeniers en tot akkerlieden.","13":"Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden het koper daarvan naar Babel.","14":"Zij namen ook de potten, en de schoffels, en de gaffels, en de rookschalen, en al de koperen voorwerpen, waarmee men de dienst verrichtte.","15":"En de aanvoerder van de lijfwacht nam de wierookvaten en de sprenkelschalen weg, wat geheel goud en wat geheel zilver was.","16":"De twee pilaren, de ene zee, en de stellingen, die Salomo voor het huis van de HEERE gemaakt had; het koper van al deze voorwerpen was zonder gewicht.","17":"De hoogte van een pilaar was achttien el, en het kapiteel daarop was van koper; en de hoogte van het kapiteel was drie el; en het net, en de granaatappels op het kapiteel rondom, waren allemaal van koper; en hetzelfde had de andere pilaar, met het net.","18":"Ook nam de aanvoerder van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders.","19":"En uit de stad nam hij een hoveling, die over de krijgslieden gesteld was, en vijf mannen van hen die het aangezicht van de koning zagen, die in de stad gevonden werden, alsook de hoofdschrijver van het leger, die het volk van het land opriep voor de oorlog, en zestig mannen van het volk van het land, die in de stad gevonden werden.","20":"Toen Nebuzaradan, de aanvoerder van de lijfwacht, dezen genomen had, bracht hij hen naar de koning van Babel, naar Ribla.","21":"En de koning van Babel sloeg hen, en doodde hen te Ribla, in het land van Hamath. Zo werd Juda uit zijn land gevankelijk weggevoerd.","22":"Maar aangaande het volk, dat in het land van Juda overgebleven was, dat Nebukadnezar, de koning van Babel, had laten overblijven, daarover stelde hij Gedalia aan, de zoon van Ahikam, de zoon van Safan.","23":"Toen nu alle aanvoerders van de legers, zij en hun mannen, hoorden dat de koning van Babel Gedalia tot leider had aangesteld, kwamen zij tot Gedalia naar Mizpa; namelijk Ismaël, de zoon van Nethanja, en Johanan, de zoon van Kareah, en Seraja, de zoon van Tanhumeth, de Netofathiet, en Jaazanja, de zoon van de Maachathiet, zij en hun mannen.","24":"En Gedalia zwoer hun en hun mannen, en zei tegen hen: Wees niet bang om knechten van de Chaldeeën te zijn, blijf in het land, en dien de koning van Babel, dan zal het u goed gaan.","25":"Maar het gebeurde in de zevende maand, dat Ismaël, de zoon van Nethanja, de zoon van Elisama, van koninklijk zaad, kwam, en tien mannen met hem; en zij sloegen Gedalia, zodat hij stierf; alsook de Joden en de Chaldeeën, die met hem te Mizpa waren.","26":"Toen maakte heel het volk zich op, van de minste tot de grootste, en de aanvoerders van de legers, en zij kwamen in Egypte; want zij waren bang voor de Chaldeeën.","27":"Het gebeurde daarna in het zevenendertigste jaar van de wegvoering van Jojachin, de koning van Juda, in de twaalfde maand, op de zevenentwintigste van de maand, dat Evilmerodach, de koning van Babel, in het jaar dat hij koning werd, het hoofd van Jojachin, de koning van Juda, uit de gevangenis verhief.","28":"En hij sprak vriendelijk met hem, en stelde zijn zetel boven de zetel van de koningen, die bij hem te Babel waren.","29":"En hij veranderde de kleren van zijn gevangenschap, en hij at voortdurend brood voor zijn aangezicht, al de dagen van zijn leven.","30":"En aangaande zijn levensonderhoud, een voortdurend levensonderhoud werd hem van de koning gegeven, elke dag een vastgesteld deel op zijn dag, al de dagen van zijn leven."},"SV":{"1":"En het geschiedde in het negende jaar zijner regering, in de tiende maand, op den tienden der maand, *dat* Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn ganse heir, en legerde zich tegen haar; en zij bouwden tegen haar sterkten rondom.","2":"Zo kwam de stad in belegering, tot in het elfde jaar van den koning Zedekia.","3":"Op den negenden der *vierde* maand, als de honger in de stad sterk werd, en het volk des lands geen brood had,","4":"Toen werd de stad doorgebroken, en al de krijgslieden *vloden* des nachts door den weg der poort, tussen de twee muren, die aan des konings hof waren (de Chaldeen nu waren tegen de stad rondom), en *de* *koning* trok *door* den weg des vlakken velds.","5":"Doch het heir der Chaldeen jaagde den koning na, en zij achterhaalden hem in de vlakke velden van Jericho, en al zijn heir werd van bij hem verstrooid.","6":"Zij dan grepen den koning, en voerden hem opwaarts tot den koning van Babel, naar Ribla; en zij spraken een oordeel tegen hem.","7":"En zij slachtten de zonen van Zedekia voor zijn ogen, en men verblindde Zedekia’s ogen, en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.","8":"Daarna in de vijfde maand, op den zevenden der maand ( dit was het negentiende jaar van Nebukadnezar, den koning van Babel) kwam Nebuzaradan, de overste der trawanten, de knecht des konings van Babel, te Jeruzalem.","9":"En hij verbrandde het huis des HEEREN, en het huis des konings, mitsgaders alle huizen van Jeruzalem; en alle huizen der groten verbrandde hij met vuur.","10":"En het ganse heir der Chaldeen, dat met den overste der trawanten was, brak de muren van Jeruzalem rondom af.","11":"Het overige nu des volks, die in de stad overgelaten waren, en de afvalligen, die tot den koning van Babel gevallen waren, en het overige der menigte, voerde Nebuzaradan, de overste der trawanten, gevankelijk weg.","12":"Maar van de armsten des lands liet de overste der trawanten *enigen* overig tot wijngaardeniers en tot akkerlieden .","13":"Verder braken de Chaldeen de koperen pilaren, die in het huis des HEEREN waren, en de stellingen, en de koperen zee, die in het huis des HEEREN was; en zij voerden het koper daarvan naar Babel.","14":"Zij namen ook de potten, en de schoffelen, en de gaffelen, en de rookschalen, en al de koperen vaten, daar men den dienst mede deed.","15":"En de overste der trawanten nam weg de wierookvaten en de sprengbekkens, wat geheel goud en wat geheel zilver was.","16":"De twee pilaren, de ene zee, en de stellingen, die Salomo voor het huis des HEEREN gemaakt had; het koper van al deze vaten was zonder gewicht.","17":"De hoogte van een pilaar was achttien ellen, en het kapiteel daarop was koper; en de hoogte des kapiteels was drie ellen; en het net, en de granaatappelen op het kapiteel rondom, waren alle van koper; en dezen gelijk had de andere pilaar, met het net.","18":"Ook nam de overste der trawanten Seraja, den hoofdpriester, en Zefanja, den tweeden priester, en de drie dorpelbewaarders.","19":"En uit de stad nam hij een hoveling, die over de krijgslieden gesteld was, en vijf mannen uit degenen, die des konings aangezicht zagen, die in de stad gevonden werden, mitsgaders den oversten schrijver des heirs, die het volk des lands ten oorlog opschreef, en zestig mannen van het volk des lands, die in de stad gevonden werden.","20":"Als Nebuzaradan, de overste der trawanten, dezen genomen had, zo bracht hij hen tot den koning van Babel, naar Ribla.","21":"En de koning van Babel sloeg hen, en doodde hen te Ribla, in het land van Hamath. Alzo werd Juda uit zijn land gevankelijk weggevoerd.","22":"Maar aangaande het volk, dat in het land van Juda overgebleven was, dat Nebukadnezar, de koning van Babel, had laten overblijven, daarover stelde hij Gedalia, den zoon van Ahikam, den zoon van Safan.","23":"Toen nu al de oversten der heiren, zij en hun mannen, hoorden, dat de koning van Babel Gedalia tot overste gesteld had, kwamen zij tot Gedalia naar Mizpa; namelijk, Ismaël, de zoon van Nethanja, en Johanan, de zoon van Kareah, en Seraja, de zoon van Tanhumeth, de Netofathiet, en Jaazanja, de zoon van den Maachathiet, zij en hun mannen.","24":"En Gedalia zwoer hun en hun mannen, en zeide tot hen: Vreest niet van te zijn knechten der Chaldeen, blijft in het land, en dient den koning van Babel, zo zal het u wel gaan.","25":"Maar het geschiedde in de zevende maand, dat Ismaël, de zoon van Nethanja, den zoon van Elisama, van koninklijk zaad, kwam, en tien mannen met hem; en zij sloegen Gedalia, dat hij stierf; mitsgaders de Joden en de Chaldeen, die met hem te Mizpa waren.","26":"Toen maakte zich al het volk op, van de minste tot den meeste, en de oversten der heiren, en kwamen in Egypte; want zij vreesden voor de Chaldeen.","27":"Het geschiedde daarna in het zeven en dertigste jaar der wegvoering van Jojachin, den koning van Juda, in de twaalfde maand, op den zeven en twintigsten der maand, dat Evilmerodach, de koning van Babel, in het jaar, als hij koning werd, het hoofd van Jojachin, den koning van Juda, uit het gevangenhuis, verhief.","28":"En hij sprak vriendelijk met hem, en stelde zijn stoel boven den stoel der koningen, die bij hem te Babel waren.","29":"En hij veranderde de klederen zijner gevangenis, en hij at geduriglijk brood voor zijn aangezicht, al de dagen zijns levens.","30":"En aangaande zijn tering, een gedurige tering werd hem van den koning gegeven, elk dagelijks bestemde deel op zijn dag, al de dagen zijns levens."},"KJV":{"1":"And it came to pass in the ninth year of his reign, in the tenth month, in the tenth day of the month, that Nebuchadnezzar king of Babylon came, he, and all his host, against Jerusalem, and pitched against it; and they built forts against it round about.","2":"And the city was besieged unto the eleventh year of king Zedekiah.","3":"And on the ninth day of the fourth month the famine prevailed in the city, and there was no bread for the people of the land.","4":"And the city was broken up, and all the men of war fled by night by the way of the gate between two walls, which is by the king's garden: (now the Chaldees were against the city round about:) and the king went the way toward the plain.","5":"And the army of the Chaldees pursued after the king, and overtook him in the plains of Jericho: and all his army were scattered from him.","6":"So they took the king, and brought him up to the king of Babylon to Riblah; and they gave judgment upon him.","7":"And they slew the sons of Zedekiah before his eyes, and put out the eyes of Zedekiah, and bound him with fetters of brass, and carried him to Babylon.","8":"And in the fifth month, on the seventh day of the month, which is the nineteenth year of king Nebuchadnezzar king of Babylon, came Nebuzaradan, captain of the guard, a servant of the king of Babylon, unto Jerusalem:","9":"And he burnt the house of the LORD, and the king's house, and all the houses of Jerusalem, and every great man's house burnt he with fire.","10":"And all the army of the Chaldees, that were with the captain of the guard, brake down the walls of Jerusalem round about.","11":"Now the rest of the people that were left in the city, and the fugitives that fell away to the king of Babylon, with the remnant of the multitude, did Nebuzaradan the captain of the guard carry away.","12":"But the captain of the guard left of the poor of the land to be vinedressers and husbandmen.","13":"And the pillars of brass that were in the house of the LORD, and the bases, and the brasen sea that was in the house of the LORD, did the Chaldees break in pieces, and carried the brass of them to Babylon.","14":"And the pots, and the shovels, and the snuffers, and the spoons, and all the vessels of brass wherewith they ministered, took they away.","15":"And the firepans, and the bowls, and such things as were of gold, in gold, and of silver, in silver, the captain of the guard took away.","16":"The two pillars, one sea, and the bases which Solomon had made for the house of the LORD; the brass of all these vessels was without weight.","17":"The height of the one pillar was eighteen cubits, and the chapiter upon it was brass: and the height of the chapiter three cubits; and the wreathen work, and pomegranates upon the chapiter round about, all of brass: and like unto these had the second pillar with wreathen work.","18":"And the captain of the guard took Seraiah the chief priest, and Zephaniah the second priest, and the three keepers of the door:","19":"And out of the city he took an officer that was set over the men of war, and five men of them that were in the king's presence, which were found in the city, and the principal scribe of the host, which mustered the people of the land, and threescore men of the people of the land that were found in the city:","20":"And Nebuzaradan captain of the guard took these, and brought them to the king of Babylon to Riblah:","21":"And the king of Babylon smote them, and slew them at Riblah in the land of Hamath. So Judah was carried away out of their land.","22":"And as for the people that remained in the land of Judah, whom Nebuchadnezzar king of Babylon had left, even over them he made Gedaliah the son of Ahikam, the son of Shaphan, ruler.","23":"And when all the captains of the armies, they and their men, heard that the king of Babylon had made Gedaliah governor, there came to Gedaliah to Mizpah, even Ishmael the son of Nethaniah, and Johanan the son of Careah, and Seraiah the son of Tanhumeth the Netophathite, and Jaazaniah the son of a Maachathite, they and their men.","24":"And Gedaliah sware to them, and to their men, and said unto them, Fear not to be the servants of the Chaldees: dwell in the land, and serve the king of Babylon; and it shall be well with you.","25":"But it came to pass in the seventh month, that Ishmael the son of Nethaniah, the son of Elishama, of the seed royal, came, and ten men with him, and smote Gedaliah, that he died, and the Jews and the Chaldees that were with him at Mizpah.","26":"And all the people, both small and great, and the captains of the armies, arose, and came to Egypt: for they were afraid of the Chaldees.","27":"And it came to pass in the seven and thirtieth year of the captivity of Jehoiachin king of Judah, in the twelfth month, on the seven and twentieth day of the month, that Evilmerodach king of Babylon in the year that he began to reign did lift up the head of Jehoiachin king of Judah out of prison;","28":"And he spake kindly to him, and set his throne above the throne of the kings that were with him in Babylon;","29":"And changed his prison garments: and he did eat bread continually before him all the days of his life.","30":"And his allowance was a continual allowance given him of the king, a daily rate for every day, all the days of his life."}},"tsk":{"1":[{"kopje":"in het negende jaar","refs":["Jer 34:8-10","2 Kron 36:17-21","Jer 34:2","Jer 34:3-6","Jer 39:1-10","Jer 52:4","Jer 52:5-11","Ezech 24:1","Ezech 24:2-14"]},{"kopje":"Nebukadnezar" class=\"wl wl-kjv\" data-code=\"H7247\">Riblah</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H2574\">Hamath.</span> So <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> was carried <span class=\"wl wl-kjv\" data-code=\"H1540\">away</span> out of their <span class=\"wl wl-kjv\" data-code=\"H127\">land.</span>","22":"And as for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H7604\">remained</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> whom <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadnezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> had <span class=\"wl wl-kjv\" data-code=\"H7604\">left,</span> even over them he made <span class=\"wl wl-kjv\" data-code=\"H1436\">Gedaliah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H296\">Ahikam,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8227\">Shaphan,</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">ruler.</span>","23":"And when all the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H2428\">armies,</span> they and their <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> had made <span class=\"wl wl-kjv\" data-code=\"H1436\">Gedaliah</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">governor,</span> there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1436\">Gedaliah</span> to <span c n class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H2416\">life.</span>","30":"And his <span class=\"wl wl-kjv\" data-code=\"H737\">allowance</span> was a <span class=\"wl wl-kjv\" data-code=\"H8548\">continual</span> <span class=\"wl wl-kjv\" data-code=\"H737\">allowance</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> him of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> a <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">rate</span> for every <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H2416\">life.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zijner regering,","tekst":"Namelijk, van Zedekia."},{"catchword":"sterkten rondom","tekst":"Het Hebreeuwse woord [zoals velen menen] betekent een krijgsgebouw in vorm van een toren, of hoge stelling van hout gemaakt, hetwelk buiten de stad tegenover de muren opgericht werd, om vandaar pijlen en stenen tegen de muren en in de stad te schieten. Hetzelfde woord wordt gevonden, Jer 52:4; Eze 4:2, en Eze 17:17, enz."}],"2":[{"catchword":"kwam de stad","tekst":"Alzo boven, 2Ki 24:10."}],"3":[{"catchword":"vierde maand,","tekst":"Dit woord is hier ingevoegd uit Jer 39:2, en Jer 52:6."}],"4":[{"catchword":"doorgebroken,","tekst":"Te weten, van de Chaldeën, die de stad belegerden en nu de middelpoort ingenomen hadden; Jer 39:2-3."},{"catchword":"vloden","tekst":"Dit woord is hier ook ingevoegd, tot aanvulling van den zin, uit Jer 39:4. Zie deze heimelijke vlucht afgebeeld Eze 12:6."},{"catchword":"poort,","tekst":"Versta, een heimelijke poort of uitgang, die tussen twee muren der stad gemaakt was."},{"catchword":"waren","tekst":"Of, was, te weten, poort, of weg."}],"5":[{"catchword":"Jericho,","tekst":"Zie 2Ki 2:4."}],"6":[{"catchword":"Ribla;","tekst":"Zie boven, 2Ki 23:33. in deze stad heeft Nebukadnezar zijn hof willen houden, totdat hij Jeruzalem veroverd zou hebben, voornamelijk dewijl de belegering lang duurde."},{"catchword":"oordeel tegen hem","tekst":"Want zij beschuldigden hem van ontrouw en valsheid, omdat hij zijn belofte en eed gebroken had; en van ondankbaarheid tegen den koning Nebukadnezar, die hem koning gemaakt had, boven, 2Ki 24:17, 2Ki 24:20. Anders, zij spraken een oordeel met hem; te weten, met den koning van Babel over den koning van Juda."}],"7":[{"catchword":"men verblindde","tekst":"Zie Jer 39:7."}],"8":[{"catchword":"vijfde maand,","tekst":"Komende overeen ten dele met onzen Juli, ten dele met Augustus. Zie Num 33:38."},{"catchword":"overste","tekst":"Zie Gen 37:36. Hebreeuws, de meester der trawanten."}],"9":[{"catchword":"huizen der groten","tekst":"Anders, grote huizen. Versta, de huizen der rijken en machtigen, die van grote middelen of staat geweest waren. Dezen moesten voornamelijk lijden. Waaruit het schijnt dat enige kleine huizen van schamele en slechte lieden zijn verschoond geweest. Groten worden voor rijken genomen, Gen 24:35, en Gen 26:13; 1Sa 25:2; idem voor lieden van staat, 2Ki 10:6; Jon 3:7, van beiden kan het woord hier genomen worden, als ook Lev 19:15."}],"12":[{"catchword":"armsten des lands","tekst":"Hebreeuws, van de dunheid des lands; zie boven, 2Ki 24:14."}],"13":[{"catchword":"koperen pilaren,","tekst":"Zie van deze 1Ki 7:15."},{"catchword":"stellingen,","tekst":"Dat is, de voeten, gestoelten, of pedestallen, op welke de wasvaten of ketels stonden, die Salomo in het voorhof der priesters gesteld had. Zie 1Ki 7:27."},{"catchword":"koperen zee,","tekst":"Zie 1Ki 7:23."}],"14":[{"catchword":"de potten,","tekst":"Van al di /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {

function bereaHtml(n) {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
