et negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadrezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zij legerden zich tegen haar, en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. In de vierde maand, op de negende van de maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had;", "Ezech 4:9-17": "En neem u tarwe, gerst, bonen, linzen, gierst en spelt; doe die in één vat en maak daar brood van; naar het getal van de dagen dat u op uw zijde neerligt, driehonderdnegentig dagen, zult u dat eten. Uw voedsel nu, dat u eten zult, zal in gewicht twintig sikkels per dag zijn; van tijd tot tijd zult u dat eten. U zult ook water drinken naar een bepaalde maat, het zesde deel van een hin; van tijd tot tijd zult u het drinken.", "Ezech 26:8": "Hij zal uw dochters op het veld met het zwaard doden, en hij zal versterkingen tegen u maken, en een wal tegen u opwerpen, en schilden tegen u opheffen.", "Jer 28:3": "In nog twee volle jaren zal Ik naar deze plaats terugbrengen al de voorwerpen van het huis van de HEERE, die Nebukadnezar, de koning van Babel, uit deze plaats heeft weggenomen en naar Babel gebracht.", "2 Kon 22:12-14": "En de koning gebood Hilkia, de priester, en Ahikam, de zoon van Safan, en Achbor, de zoon van Michaja, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei: Ga heen, vraag de HEERE voor mij, en voor het volk, en voor heel Juda, over de woorden van dit boek dat gevonden is; want de grimmigheid van de HEERE is groot, die tegen ons ontstoken is, omdat onze vaderen niet geluisterd hebben naar de woorden van dit boek, om te doen naar alles wat voor ons geschreven is. Toen ging de priester Hilkia, en Ahikam, en Achbor, en Safan, en Asaja naar de profetes Hulda, de vrouw van Sallum, de zoon van Tikva, de zoon van Harhas, de klederbewaarder (zij woonde nu te Jeruzalem, in het tweede deel), en zij spraken met haar.", "Neh 3:8": "Aan zijn hand verbeterde Uzziël, de zoon van Harhoja, een van het goudsmid, en aan zijn hand verbeterde Hananja, de zoon van een van de apothekers; en zij lieten Jeruzalem tot aan de brede muur.", "Ex 34:26": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE, uw God, brengen. U zult het bokje niet koken in de melk van zijn moeder.", "Ps 149:8": "om hun koningen te binden met ketenen, en hun aanzienlijken met ijzeren boeien,", "2 Kron 7:11": "Zo voltooide Salomo het huis van de HEERE, en het huis van de koning; en alles wat in het hart van Salomo gekomen was om in het huis van de HEERE en in zijn huis te maken, voerde hij voorspoedig uit.", "Gen 41:14": "Toen stuurde Farao iemand en riep Jozef, en zij lieten hem haastig uit de kuil komen; en men schoor hem, en men verwisselde zijn kleren; en hij kwam bij Farao.", "Jer 32:2": "(Het leger van de koning van Babel belegerde toen Jeruzalem, en de profeet Jeremia zat opgesloten in het voorhof van de bewaking, dat bij het huis van de koning van Juda is.", "Dan 11:19": "En hij zal zijn aangezicht keren naar de vestingen van zijn land, en hij zal struikelen, en vallen, en niet meer gevonden worden.", "Deut 23:18": "U zult geen hoerenloon noch hondenprijs in het huis van de HEERE, uw God, brengen, voor enige gelofte; want ook die beide zijn de HEERE, uw God, een gruwel.", "Jer 52:12-16": "Daarna, in de vijfde maand, op de tiende van de maand (dit jaar was het negentiende jaar van koning Nebukadrezar, de koning van Babel), toen Nebuzaradan, de leider van de lijfwacht, die voor het aangezicht van de koning van Babel stond, in Jeruzalem gekomen was; Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.", "2 Kon 25:1-30": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. Op de negende van de vierde maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,", "2 Kon 18:13": "Maar in het veertiende jaar van koning Hizkia kwam Sanherib, de koning van Assyrië, op tegen alle vaste steden van Juda, en nam ze in.", "Klaagl 1:10": "Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden.", "Deut 32:25": "Van buiten zal het zwaard beroven, en uit de binnenkamers de verschrikking; ook de jongeling, ook de jonge dochter, het zuigende kind met de grijze man.", "Jes 64:10": "Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting.", "Jer 52:31-34": "Het gebeurde daarna, in het zevenendertigste jaar van de gevankelijke wegvoering van Jojachin, de koning van Juda, in de twaalfde maand, op de vijfentwintigste van de maand, dat Evilmerodach, de koning van Babel, in het eerste jaar van zijn koninkrijk, het hoofd van Jojachin, de koning van Juda, verhief, en hem uit de gevangenis liet uitgaan. En hij sprak vriendelijk met hem, en stelde zijn stoel boven de stoel van de koningen die bij hem in Babel waren. En hij veranderde de kleren van zijn gevangenschap; en hij at voortdurend brood voor zijn aangezicht, al de dagen van zijn leven.", "Deut 32:30": "Hoe zou één duizend achtervolgen, en twee tienduizend doen vluchten, als niet hun Rotssteen hen verkocht had, en de HEERE hen overgeleverd had?", "2 Kon 24:16": "En alle sterke mannen, tot zevenduizend, en timmerlieden en smeden, tot duizend, en alle helden, die geoefend waren voor de oorlog; dezen bracht de koning van Babel gevangen naar Babel.", "Jer 39:2": "In het elfde jaar van Zedekia, in de vierde maand, op de negende dag van de maand, werd de stad doorgebroken.", "Est 4:4": "Toen kwamen de jonge dochters van Esther en haar kamerlingen, en zij vertelden het haar; en het deed de koningin zeer veel verdriet; en zij stuurde kleren om Mordechai aan te doen, en zijn zak van hem af te doen; maar hij nam ze niet aan.", "Deut 20:19": "Wanneer u een stad vele dagen zult belegeren, strijdend tegen haar, om die in te nemen, dan zult u haar geboomte niet verderven door de bijl daaraan te slaan; want u zult daarvan eten; daarom zult u dat niet omhakken (want het geboomte van het veld is het voedsel van de mens), opdat het voor uw aangezicht dient tot een bolwerk.", "Jer 41:1-14": "Het gebeurde in de zevende maand, dat Ismaël, de zoon van Nethanja, de zoon van Elisama, van koninklijk nageslacht, en de leiders van de koning, tien mannen, met hem kwamen naar Gedalia, de zoon van Ahikam, te Mizpa; en zij aten daar samen brood, te Mizpa. En Ismaël, de zoon van Nethanja, maakte zich klaar, alsook de tien mannen die met hem waren, en zij sloegen Gedalia, de zoon van Ahikam, de zoon van Safan, met het zwaard; zo doodde hij hem, die de koning van Babel over het land had aangesteld. Ook sloeg Ismaël al de Joden die met hem, namelijk met Gedalia, te Mizpa waren, en de Chaldeeën, de krijgslieden, die daar gevonden werden.", "Jer 40:1-4": "Het woord dat van de HEERE gebeurd is tot Jeremia, nadat Nebuzaradan, de aanvoerder van de lijfwacht, hem had laten gaan van Rama; toen hij hem had laten halen, terwijl hij met ketenen gebonden was in het midden van alle gevangenen van Jeruzalem en Juda, die naar Babel gevankelijk werden weggevoerd. Want de aanvoerder van de lijfwacht liet Jeremia halen, en zei tegen hem: De HEERE, uw God, heeft dit kwaad over deze plaats gesproken. En de HEERE heeft het doen komen, en gedaan zoals Hij gesproken had; want u hebt gezondigd tegen de HEERE, en Zijn stem niet gehoorzaamd; daarom is u deze zaak gebeurd.", "2 Kron 4:13": "En de vierhonderd granaatappels bij de twee netten: twee rijen van granaatappels bij elk net, om de twee bollen van de kapitelen te bedekken, die boven op de pilaren waren.", "Jer 51:53": "Al klom Babel ten hemel op, en al maakte zij de hoogte van haar sterkte vast, toch zullen haar verstoorders van Mij overkomen, spreekt de HEERE.", "2 Kron 36:17-21": "Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch de meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand. En alle voorwerpen van het huis van God, de grote en de kleine, en de schatten van het huis van de HEERE, en de schatten van de koning en zijn vorsten, dit alles bracht hij naar Babel. En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Gen 31:49": "En Mizpa; omdat hij zei: Laat de HEERE toezicht houden tussen mij en tussen u, wanneer wij van elkaar gescheiden zullen zijn!", "Ezra 1:7": "Ook bracht koning Kores de voorwerpen van het huis van de HEERE naar buiten, die Nebukadnezar uit Jeruzalem had weggehaald, en in het huis van zijn god had gezet.", "Deut 28:52": "En het zal u benauwen in al uw poorten, totdat uw hoge en versterkte muren neervallen, waarop u vertrouwde in uw hele land; ja, het zal u benauwen in al uw poorten, in uw hele land, dat de HEERE, uw God, u gegeven heeft.", "Gen 40:13": "Binnen nog drie dagen zal Farao uw hoofd verheffen, en zal u in uw positie herstellen; en u zult Farao's beker in zijn hand geven, op de vorige wijze, toen u zijn schenker was.", "2 Kon 25:23-25": "Toen nu alle aanvoerders van de legers, zij en hun mannen, hoorden dat de koning van Babel Gedalia tot leider had aangesteld, kwamen zij tot Gedalia naar Mizpa; namelijk Ismaël, de zoon van Nethanja, en Johanan, de zoon van Kareah, en Seraja, de zoon van Tanhumeth, de Netofathiet, en Jaazanja, de zoon van de Maachathiet, zij en hun mannen. En Gedalia zwoer hun en hun mannen, en zei tegen hen: Wees niet bang om knechten van de Chaldeeën te zijn, blijf in het land, en dien de koning van Babel, dan zal het u goed gaan. Maar het gebeurde in de zevende maand, dat Ismaël, de zoon van Nethanja, de zoon van Elisama, van koninklijk zaad, kwam, en tien mannen met hem; en zij sloegen Gedalia, zodat hij stierf; alsook de Joden en de Chaldeeën, die met hem te Mizpa waren.", "Ezech 22:16": "Zo zult u in uzelf ontheiligd zijn voor de ogen van de heidenvolken; en u zult weten dat Ik de HEERE ben.", "Jer 41:16": "Toen nam Johanan, de zoon van Kareah, alsook al de aanvoerders van de legers die met hem waren, het hele overblijfsel van het volk dat hij teruggebracht had van Ismaël, de zoon van Nethanja, van Mizpa, (nadat hij Gedalia, de zoon van Ahikam, gedood had), namelijk de mannen die krijgslieden waren, en de vrouwen, en kinderen, en kamerlingen, die hij van Gibeon had teruggebracht;", "Hos 14:1": "Samaria zal woest worden, want zij is opstandig geweest tegen haar God; zij zullen door het zwaard vallen, hun kinderen zullen verpletterd, en hun zwangere vrouwen zullen opengesneden worden.", "Deut 28:34": "En u zult waanzinnig worden vanwege wat uw ogen te zien krijgen.", "Jer 34:2": "Zo zegt de HEERE, de God van Israël: Ga heen en spreek tot Zedekia, de koning van Juda, en zeg tegen hem: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "Amos 1:13": "Zo zegt de HEERE: Om drie overtredingen van de kinderen van Ammon, en om vier zal Ik dat niet afwenden; omdat zij de zwangere vrouwen van Gilead hebben opengesneden, om hun grondgebied te vergroten.", "Jer 39:1-10": "In het negende jaar van Zedekia, koning van Juda, in de tiende maand, kwam Nebukadrezar, de koning van Babel, en al zijn leger, tegen Jeruzalem, en zij belegerden haar. In het elfde jaar van Zedekia, in de vierde maand, op de negende dag van de maand, werd de stad doorgebroken. En alle vorsten van de koning van Babel trokken naar binnen, en hielden halt bij de middelste poort: namelijk Nergal-Sarezer, Samgar-Nebu, Sarsechim, Rab-Saris, Nergal-Sarezer, Rab-Mag, en al de overige vorsten van de koning van Babel.", "Ezra 7:1": "Na deze geschiedenissen, in het koninkrijk van Arthahsasta, koning van Perzië: Ezra, de zoon van Seraja, de zoon van Azarja, de zoon van Hilkia,", "2 Kon 23:7": "Daartoe brak hij de huizen van de schandjongens af, die bij het huis van de HEERE waren, waar de vrouwen huisjes voor het beeld van het bos weefden.", "Gen 12:10": "En er was hongersnood in dat land; zo trok Abram af naar Egypte om daar als vreemdeling te wonen, omdat de hongersnood zwaar was in dat land.", "Jer 43:10": "en zeg tegen hen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zie, Ik zal iemand heenzenden, en Nebukadrezar, de koning van Babel, Mijn dienaar, halen, en Ik zal zijn troon zetten boven op deze stenen, die Ik verborgen heb; en hij zal zijn koninklijke tent daarover spannen.", "Richt 16:21": "Toen grepen de Filistijnen hem, en groeven zijn ogen uit; en zij voerden hem af naar Gaza, en bonden hem met twee koperen ketenen, en hij moest malen in de gevangenis.", "Est 1:14": "de naaste bij hem waren Carsena, Sethar, Admatha, Tharsis, Meres, Marsena, Memuchan, zeven vorsten van de Perzen en de Meden, die het aangezicht van de koning zagen, die vooraan zaten in het koninkrijk),", "Jer 38:2": "Zo zegt de HEERE: Wie in deze stad blijft, zal door het zwaard, door de honger of door de pestilentie sterven; maar wie naar de Chaldeeën uitgaat, die zal leven, want hij zal zijn leven als buit hebben, en zal leven.", "Amos 2:5": "Daarom zal Ik een vuur in Juda zenden, dat zal Jeruzalems paleizen verteren.", "2 Kron 36:19": "En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Jer 40:5-16": "En omdat hij nog niet zal terugkeren, keer u dan terug tot Gedalia, de zoon van Ahikam, de zoon van Safan, die de koning van Babel over de steden van Juda aangesteld heeft; en woon bij hem in het midden van het volk; of ga overal waar het in uw ogen recht is te gaan. En de aanvoerder van de lijfwacht gaf hem reiskost en een geschenk, en liet hem gaan. Zo kwam Jeremia tot Gedalia, de zoon van Ahikam, te Mizpa; en hij woonde bij hem in het midden van het volk, dat in het land overgebleven was. Toen nu alle aanvoerders van de legers die in het veld waren, zij en hun mannen, hoorden dat de koning van Babel Gedalia, de zoon van Ahikam, over het land aangesteld had, en dat hij aan hem had toevertrouwd de mannen, en de vrouwen, en de kinderen, en de armsten van het land, van hen die niet naar Babel gevankelijk waren weggevoerd,", "Num 7:13": "En zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "Jer 41:1-15": "Het gebeurde in de zevende maand, dat Ismaël, de zoon van Nethanja, de zoon van Elisama, van koninklijk nageslacht, en de leiders van de koning, tien mannen, met hem kwamen naar Gedalia, de zoon van Ahikam, te Mizpa; en zij aten daar samen brood, te Mizpa. En Ismaël, de zoon van Nethanja, maakte zich klaar, alsook de tien mannen die met hem waren, en zij sloegen Gedalia, de zoon van Ahikam, de zoon van Safan, met het zwaard; zo doodde hij hem, die de koning van Babel over het land had aangesteld. Ook sloeg Ismaël al de Joden die met hem, namelijk met Gedalia, te Mizpa waren, en de Chaldeeën, de krijgslieden, die daar gevonden werden.", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Jer 41:1-10": "Het gebeurde in de zevende maand, dat Ismaël, de zoon van Nethanja, de zoon van Elisama, van koninklijk nageslacht, en de leiders van de koning, tien mannen, met hem kwamen naar Gedalia, de zoon van Ahikam, te Mizpa; en zij aten daar samen brood, te Mizpa. En Ismaël, de zoon van Nethanja, maakte zich klaar, alsook de tien mannen die met hem waren, en zij sloegen Gedalia, de zoon van Ahikam, de zoon van Safan, met het zwaard; zo doodde hij hem, die de koning van Babel over het land had aangesteld. Ook sloeg Ismaël al de Joden die met hem, namelijk met Gedalia, te Mizpa waren, en de Chaldeeën, de krijgslieden, die daar gevonden werden.", "1 Kon 7:49-51": "En de kandelaars, vijf aan de rechterkant, en vijf aan de linkerkant, voor het binnenste heiligdom, van zuiver goud; en de bloemen, de lampen, en de snuiters van goud; Alsook de schalen, de vorken, de sprenkelschalen, de rookschalen, en de wierookvaten, van zuiver goud; daartoe de scharnieren van de deuren van het binnenste huis, het heilige der heiligen, en van de deuren van het huis van de tempel, van goud. Zo werd al het werk voltooid dat koning Salomo voor het huis van de HEERE maakte. Daarna bracht Salomo de geheiligde dingen van zijn vader David: het zilver, het goud, en de voorwerpen legde hij bij de schatten van het huis van de HEERE.", "Hagg 1:2": "Zo spreekt de HEERE van de heerscharen: Dit volk zegt: De tijd is niet gekomen, de tijd dat het huis van de HEERE gebouwd moet worden.", "Ezech 33:24-29": "Mensenkind! De inwoners van die verwoeste plaatsen in het land van Israël zeggen: Abraham was maar één man, en bezat dit land erfelijk; maar wij zijn met velen; het land is ons gegeven tot erfelijk bezit. Daarom, zeg tegen hen: Zo zegt de Heere HEERE: U eet vlees met het bloed, en heft uw ogen op naar uw drekgoden, en vergiet bloed; en zou u het land dan erfelijk bezitten? U vertrouwt op uw zwaard; u doet gruwelijke dingen, en ieder van u verontreinigt de vrouw van zijn naaste; en zou u het land dan erfelijk bezitten?", "1 Kon 7:50": "Alsook de schalen, de vorken, de sprenkelschalen, de rookschalen, en de wierookvaten, van zuiver goud; daartoe de scharnieren van de deuren van het binnenste huis, het heilige der heiligen, en van de deuren van het huis van de tempel, van goud.", "Ezech 17:16-20": "Zo waarachtig als Ik leef, spreekt de Heere HEERE, hij zal sterven in de plaats van de koning die hem koning gemaakt heeft, wiens eed hij veracht heeft, en wiens verbond hij gebroken heeft — bij hem, midden in Babel! Ook zal farao, met een groot leger en een grote menigte van het krijgsvolk, niets voor hem uitrichten in de oorlog, wanneer men een wal zal opwerpen, en wanneer men vestingen zal bouwen, om veel mensenlevens uit te roeien. Want hij heeft de eed veracht, door het verbond te breken, terwijl hij, zie, zijn hand gegeven had; omdat hij al deze dingen gedaan heeft, zal hij niet ontkomen.", "Klaagl 4:12": "Lamed. De koningen van de aarde zouden het niet geloofd hebben, en ook geen van de bewoners van de wereld, dat de tegenstander en vijand door de poorten van Jeruzalem zou binnengaan.", "Lev 26:36": "En wat betreft de overgeblevenen onder u, Ik zal in hun hart een angstige zwakheid laten komen in de landen van hun vijanden; zodat het geruis van een opgejaagd blad hen zal opjagen, en zij zullen vluchten, zoals men vlucht voor een zwaard, en zullen vallen, terwijl niemand hen opjaagt.", "2 Kon 12:13": "Toch werden er voor het huis van de HEERE geen zilveren schalen, gaffelen, sprenkelschalen, trompetten, of enig gouden of zilveren voorwerp gemaakt, van het geld dat naar het huis van de HEERE gebracht werd.", "2 Kon 25:8-21": "Daarna in de vijfde maand, op de zevende van de maand (dit was het negentiende jaar van Nebukadnezar, de koning van Babel) kwam Nebuzaradan, de aanvoerder van de lijfwacht, de knecht van de koning van Babel, in Jeruzalem. En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de aanvoerder van de lijfwacht was, brak de muren van Jeruzalem rondom af.", "2 Kon 16:18": "Daarbij haalde hij het overdekte gedeelte van de sabbat, dat zij in het huis gebouwd hadden, en de buitenste ingang van de koning weg van het huis van de HEERE, vanwege de koning van Assyrië.", "Jer 51:51": "U zou kunnen zeggen: Wij zijn beschaamd geworden, want wij hebben smaad gehoord, schaamte heeft ons gezicht bedekt; omdat vreemden over de heiligdommen van het huis van de HEERE gekomen zijn;", "2 Sam 15:24": "En zie, Zadok was ook daar, en alle Levieten met hem, die de ark van het verbond van God droegen; en zij zetten de ark van God neer, en Abjathar klom op, totdat heel het volk uit de stad klaar was met overgaan.", "2 Kon 25:1-4": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. Op de negende van de vierde maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,", "1 Kron 6:14": "En Azarja verwekte Seraja, en Seraja verwekte Jozadak;", "Ps 107:11": "Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden.", "Jer 43:6": "de mannen, en de vrouwen, en de kinderen, en de dochters van de koning, en alle mensen die Nebuzaradan, de aanvoerder van de lijfwacht, bij Gedalia, de zoon van Ahikam, de zoon van Safan, had achtergelaten, ook de profeet Jeremia, en Baruch, de zoon van Nerija;", "2 Kon 6:26-29": "En het gebeurde, toen de koning van Israël over de muur voorbijging, dat een vrouw tegen hem riep, en zei: Help mij, heer koning! En hij zei: De HEERE helpt u niet; waarmee zou ik u helpen? Van de dorsvloer of van de wijnpers? Verder zei de koning tegen haar: Wat is er met u? En zij zei: Deze vrouw heeft tegen mij gezegd: Geef uw zoon, dat wij hem vandaag eten, en morgen zullen wij mijn zoon eten.", "Klaagl 3:34": "Lamed. Dat men al de gevangenen van de aarde onder Zijn voeten verbrijzelt;", "2 Kron 29:15": "En zij verzamelden hun broeders, en heiligden zich, en kwamen, volgens het gebod van de koning, door de woorden van de HEERE, om het huis van de HEERE te reinigen.", "Ezech 22:15": "En Ik zal u verstrooien onder de heidenvolken, en u verspreiden in de landen, en uw onreinheid uit u wegnemen.", "Jer 41:13": "En het gebeurde, toen al het volk dat met Ismaël was, Johanan zag, de zoon van Kareah, en al de aanvoerders van de legers die met hem waren, toen werden zij blij.", "Jer 40:13-16": "Doch Johanan, de zoon van Kareah, en alle aanvoerders van de legers die in het veld waren, kwamen tot Gedalia te Mizpa, en zeiden tegen hem: Weet u wel dat Baälis, de koning van de kinderen van Ammon, Ismaël, de zoon van Nethanja, uitgezonden heeft om u om het leven te brengen? Maar Gedalia, de zoon van Ahikam, geloofde hen niet. Johanan echter, de zoon van Kareah, sprak in het verborgene tot Gedalia, te Mizpa, en zei: Laat mij toch heengaan, en Ismaël, de zoon van Nethanja, doden, en niemand zal het weten; waarom zou hij u om het leven brengen, en heel Juda, dat tot u vergaderd is, verstrooid worden, en het overblijfsel van Juda verloren gaan?", "Ezech 7:27": "De koning zal rouw bedrijven, en de vorsten zullen met verwoesting bekleed zijn, en de handen van het volk van het land zullen verschrikt zijn; Ik zal hun doen naar hun weg, en met hun rechten zal Ik ze richten; en zij zullen weten dat Ik de HEERE ben.", "Lev 26:17": "Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand.", "2 Kon 20:17": "Zie, de dagen komen dat alles wat in uw huis is, en wat uw vaderen tot op deze dag opgeslagen hebben, naar Babel weggevoerd zal worden; er zal niets overblijven, zegt de HEERE.", "1 Kon 7:15-22": "Want hij goot twee koperen pilaren; de hoogte van de ene pilaar was achttien el, en een draad van twaalf el kon de andere pilaar omvatten. Hij maakte ook twee kapitelen, van gegoten koper, om op de koppen van de pilaren te zetten; vijf el was de hoogte van het ene kapiteel, en vijf el de hoogte van het andere kapiteel. De netten waren van vlechtwerk, de banden van ketenwerk voor de kapitelen, die op de kop van de pilaren waren; zeven voor het ene kapiteel, en zeven voor het andere kapiteel.", "2 Kon 24:12": "Toen ging Jojachin, de koning van Juda, naar de koning van Babel, hij, en zijn moeder, en zijn dienaren, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem gevangen in het achtste jaar van zijn regering.", "1 Kon 7:23-45": "Verder maakte hij de gegoten zee; van tien el was zij van de ene rand tot de andere, helemaal rond, en vijf el hoog, en een meetsnoer van dertig el kon haar rondom omvatten. En onder haar rand waren knoppen, die haar rondom omzetten, tien op elke el, die de zee rondom omringden; deze knoppen waren in twee rijen bij de gieting meegegoten. Zij stond op twaalf runderen; drie kijkend naar het noorden, en drie kijkend naar het westen, en drie kijkend naar het zuiden, en drie kijkend naar het oosten; en de zee stond boven op hen, en al hun achterdelen waren naar binnen gekeerd.", "2 Kron 26:11": "Verder had Uzzia een legermacht van geoefenden ten oorlog, die ten leger uittrokken bij benden, naar het getal van hun monstering, onder toezicht van Jeïel, de schrijver, en Maäseja, de ambtenaar, onder het gezag van Hananja, een van de vorsten van de koning.", "Jer 7:14": "daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb.", "Neh 11:23": "Want er was een gebod van de koning over hen, namelijk dat er een vast onderhoud voor de zangers was, dagelijks op zijn dag.", "Jer 51:34": "Nebukadrezar, de koning van Babel, heeft mij opgegeten, hij heeft mij verpletterd, hij heeft mij gesteld als een leeg vat, hij heeft mij verslonden als een draak, hij heeft zijn buik gevuld met mijn lekkernijen, hij heeft mij verdreven.", "Jer 29:10": "Want zo zegt de HEERE: Zeker, als er zeventig jaren te Babel vervuld zullen zijn, zal Ik u bezoeken, en Ik zal Mijn goede woord over u waarmaken, door u terug te brengen naar deze plaats.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Jer 52:4-7": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadrezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zij legerden zich tegen haar, en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. In de vierde maand, op de negende van de maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had;", "2 Kon 17:20": "Zo verwierp de HEERE heel het nageslacht van Israël, en onderdrukte hen, en gaf hen in de hand van rovers, totdat Hij hen van Zijn aangezicht weggeworpen had.", "Jer 40:14": "en zeiden tegen hem: Weet u wel dat Baälis, de koning van de kinderen van Ammon, Ismaël, de zoon van Nethanja, uitgezonden heeft om u om het leven te brengen? Maar Gedalia, de zoon van Ahikam, geloofde hen niet.", "Ex 38:3": "Hij maakte ook al het gereedschap van het altaar, de potten, en de schoffels, en de sprengbekkens, en de krauwels, en de koolpannen; al zijn voorwerpen maakte hij van koper.", "Gen 41:42": "En Farao haalde zijn ring van zijn hand af, en deed hem aan Jozefs hand, en liet hem kleren van fijn linnen aantrekken, en legde hem een gouden keten om zijn hals;", "Jer 52:12": "Daarna, in de vijfde maand, op de tiende van de maand (dit jaar was het negentiende jaar van koning Nebukadrezar, de koning van Babel), toen Nebuzaradan, de leider van de lijfwacht, die voor het aangezicht van de koning van Babel stond, in Jeruzalem gekomen was;", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Jer 40:7-12": "Toen nu alle aanvoerders van de legers die in het veld waren, zij en hun mannen, hoorden dat de koning van Babel Gedalia, de zoon van Ahikam, over het land aangesteld had, en dat hij aan hem had toevertrouwd de mannen, en de vrouwen, en de kinderen, en de armsten van het land, van hen die niet naar Babel gevankelijk waren weggevoerd, kwamen zij tot Gedalia te Mizpa, namelijk Ismaël, de zoon van Nethanja, en Johanan en Jonathan, de zonen van Kareah, en Seraja, de zoon van Tanhumeth, en de zonen van Efai, de Netofathiet, en Jezanja, de zoon van een Maachathiet, zij en hun mannen. En Gedalia, de zoon van Ahikam, de zoon van Safan, zwoer hun en hun mannen, en zei: Wees niet bang om de Chaldeeën te dienen; blijf in het land, en dien de koning van Babel, dan zal het u goed gaan.", "Nahum 3:14": "Schep u water voor de belegering; versterk uw vestingen; ga in de klei, en treed in het leem; verbeter de ticheloven.", "Ezech 26:7": "Want zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, de koning der koningen, van het noorden tegen Tyrus brengen, met paarden en met wagens, en met ruiters, en een leger, en veel volk.", "Luk 21:5": "En toen sommigen spraken over de tempel, dat hij met mooie stenen en geschenken versierd was, zei Hij:", "Jer 6:6": "Want zo zegt de HEERE van de heerscharen: Houwt bomen af, en werpt een wal op tegen Jeruzalem; zij is de stad, die bezocht zal worden; in het midden van haar is enkel verdrukking.", "Deut 28:64": "En de HEERE zal u verstrooien onder alle volken, van het ene einde van de aarde tot het andere einde van de aarde; en daar zult u andere goden dienen die u niet gekend hebt, noch uw vaderen, hout en steen.", "1 Kron 23:4": "Uit dezen waren er vierentwintigduizend om het werk van het huis van de HEERE aan te sturen; en zesduizend opzichters en rechters;", "2 Kon 6:24-29": "En het gebeurde daarna, dat Benhadad, de koning van Syrië, zijn hele leger verzamelde, en optrok, en Samaria belegerde. En er kwam grote honger in Samaria; want zie, zij belegerden de stad, totdat een ezelskop voor tachtig zilverstukken werd verkocht, en een vierde deel van een kab duivenmest voor vijf zilverstukken. En het gebeurde, toen de koning van Israël over de muur voorbijging, dat een vrouw tegen hem riep, en zei: Help mij, heer koning!", "Deut 28:36": "De HEERE zal u, alsook uw koning die u over u aangesteld zult hebben, doen gaan naar een volk dat u niet gekend hebt, noch uw vaderen; en daar zult u andere goden dienen, hout en steen.", "Gen 44:34": "Want hoe zou ik optrekken naar mijn vader, als de jongen niet bij mij was, zodat ik het verdriet niet hoef te zien dat mijn vader zou overkomen.", "Num 7:14": "Een reukschaal van tien gouden sikkels, vol van het reukwerk;", "Klaagl 4:19": "Koph. Onze vervolgers waren sneller dan de arenden van de hemel; zij hebben ons op de bergen fel vervolgd, in de woestijn hebben zij ons een hinderlaag gelegd.", "2 Kon 24:8-16": "Jojachin was achttien jaar oud toen hij koning werd, en regeerde drie maanden in Jeruzalem; en de naam van zijn moeder was Nehusta, een dochter van Elnathan, uit Jeruzalem. En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vader gedaan had. In die tijd trokken de dienaren van Nebukadnezar, de koning van Babel, naar Jeruzalem; en de stad werd belegerd.", "Ezech 44:4": "Daarna bracht hij mij de weg van de noorderpoort, voor het huis; en ik zag, en zie, de heerlijkheid van de HEERE had het huis van de HEERE vervuld; toen viel ik op mijn aangezicht.", "Jer 41:1": "Het gebeurde in de zevende maand, dat Ismaël, de zoon van Nethanja, de zoon van Elisama, van koninklijk nageslacht, en de leiders van de koning, tien mannen, met hem kwamen naar Gedalia, de zoon van Ahikam, te Mizpa; en zij aten daar samen brood, te Mizpa.", "Ezech 24:2-14": "Mensenkind! Schrijf voor uzelf de naam van de dag op, van deze dag zelf; de koning van Babel heeft zich tegen Jeruzalem gelegerd, op deze dag zelf. En gebruik een gelijkenis tegenover dat opstandige huis, en zeg tegen hen: Zo zegt de Heere HEERE: Zet een pot toe, zet hem toe, en giet er ook water in. Doe de stukken ervan samen erin, alle goede stukken, de dij en de schouder, vul hem met de beste beenderen.", "Jer 52:6": "In de vierde maand, op de negende van de maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had;", "Jer 25:11": "En dit hele land zal worden tot een woestheid, tot een ontzetting; en deze volken zullen de koning van Babel dienen zeventig jaren.", "1 Kron 22:1": "En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.", "Ps 116:19": "in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "Jer 39:3": "En alle vorsten van de koning van Babel trokken naar binnen, en hielden halt bij de middelste poort: namelijk Nergal-Sarezer, Samgar-Nebu, Sarsechim, Rab-Saris, Nergal-Sarezer, Rab-Mag, en al de overige vorsten van de koning van Babel.", "1 Kron 9:20": "Zoals Pinehas, de zoon van Eleazar, vroeger voorganger over hen was, met wie de HEERE was.", "2 Kon 23:27": "En de HEERE zei: Ik zal Juda ook van Mijn aangezicht wegdoen, zoals Ik Israël weggedaan heb; en Ik zal deze stad Jeruzalem verwerpen, die Ik verkoren heb, en het huis waarvan Ik gezegd heb: Mijn Naam zal daar zijn.", "Jer 41:14": "En al het volk dat Ismaël van Mizpa gevankelijk had weggevoerd, wendde zich om; en zij keerden zich en gingen over naar Johanan, de zoon van Kareah.", "2 Kon 11:14": "En zij zag toe, en zie, de koning stond bij de pilaar, naar de gewoonte, en de leiders en de trompetten bij de koning; en al het volk van het land was blij en blies op trompetten. Toen scheurde Athalia haar kleren en riep: Verraad, verraad!", "Jer 35:2": "Ga naar het huis van de Rechabieten, en spreek met hen, en breng hen in het huis van de HEERE, in een van de kamers, en geef hun wijn te drinken.", "2 Kron 36:7": "Nebukadnezar bracht ook een deel van de voorwerpen van het huis van de HEERE naar Babel, en zette ze in zijn tempel te Babel.", "Jer 52:21-23": "Aangaande de pilaren, achttien el was de hoogte van één pilaar, en een draad van twaalf el omving hem; en zijn dikte was vier vingers, en hij was hol. En het kapiteel daarop was van koper, en de hoogte van het ene kapiteel was vijf el, en een net, en granaatappels op het kapiteel rondom, alles koper; en hieraan gelijk had de andere pilaar, met granaatappels. En de granaatappels waren zesennegentig, gezet naar de wind; alle granaatappels waren honderd, over het net rondom.", "Jer 41:14-18": "En al het volk dat Ismaël van Mizpa gevankelijk had weggevoerd, wendde zich om; en zij keerden zich en gingen over naar Johanan, de zoon van Kareah. Doch Ismaël, de zoon van Nethanja, ontkwam aan Johanan, met acht mannen, en hij trok weg naar de kinderen van Ammon. Toen nam Johanan, de zoon van Kareah, alsook al de aanvoerders van de legers die met hem waren, het hele overblijfsel van het volk dat hij teruggebracht had van Ismaël, de zoon van Nethanja, van Mizpa, (nadat hij Gedalia, de zoon van Ahikam, gedood had), namelijk de mannen die krijgslieden waren, en de vrouwen, en kinderen, en kamerlingen, die hij van Gibeon had teruggebracht;", "Jer 24:10": "En Ik zal onder hen zenden het zwaard, de honger en de pest, totdat zij verteerd zullen zijn uit het land, dat Ik hun en hun vaderen gegeven had.", "Jer 29:29": "Zefanja nu, de priester, had deze brief voorgelezen voor de oren van de profeet Jeremia.", "Ex 36:38": "en de vijf pilaren daarvan, en hun haken; en hij overtrok hun koppen en hun banden met goud; en hun vijf voetstukken waren van koper.", "Jer 40:7-9": "Toen nu alle aanvoerders van de legers die in het veld waren, zij en hun mannen, hoorden dat de koning van Babel Gedalia, de zoon van Ahikam, over het land aangesteld had, en dat hij aan hem had toevertrouwd de mannen, en de vrouwen, en de kinderen, en de armsten van het land, van hen die niet naar Babel gevankelijk waren weggevoerd, kwamen zij tot Gedalia te Mizpa, namelijk Ismaël, de zoon van Nethanja, en Johanan en Jonathan, de zonen van Kareah, en Seraja, de zoon van Tanhumeth, en de zonen van Efai, de Netofathiet, en Jezanja, de zoon van een Maachathiet, zij en hun mannen. En Gedalia, de zoon van Ahikam, de zoon van Safan, zwoer hun en hun mannen, en zei: Wees niet bang om de Chaldeeën te dienen; blijf in het land, en dien de koning van Babel, dan zal het u goed gaan.", "1 Kon 7:23-26": "Verder maakte hij de gegoten zee; van tien el was zij van de ene rand tot de andere, helemaal rond, en vijf el hoog, en een meetsnoer van dertig el kon haar rondom omvatten. En onder haar rand waren knoppen, die haar rondom omzetten, tien op elke el, die de zee rondom omringden; deze knoppen waren in twee rijen bij de gieting meegegoten. Zij stond op twaalf runderen; drie kijkend naar het noorden, en drie kijkend naar het westen, en drie kijkend naar het zuiden, en drie kijkend naar het oosten; en de zee stond boven op hen, en al hun achterdelen waren naar binnen gekeerd.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "1 Kon 20:26": "Het gebeurde nu bij de wederkomst van het jaar, dat Benhadad de Syriërs monsterde; en hij trok op naar Afek, ten strijde tegen Israël.", "Jer 40:7": "Toen nu alle aanvoerders van de legers die in het veld waren, zij en hun mannen, hoorden dat de koning van Babel Gedalia, de zoon van Ahikam, over het land aangesteld had, en dat hij aan hem had toevertrouwd de mannen, en de vrouwen, en de kinderen, en de armsten van het land, van hen die niet naar Babel gevankelijk waren weggevoerd,", "2 Kon 17:18": "Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.", "2 Kon 18:11": "En de koning van Assyrië voerde Israël weg naar Assyrië, en liet hen wonen in Halah, en in Habor, bij de rivier Gozan, en in de steden der Meden.", "Jer 15:2": "En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap!", "Jer 32:4": "En Zedekia, de koning van Juda, zal aan de hand van de Chaldeeën niet ontkomen; maar hij zal zeker gegeven worden in de hand van de koning van Babel, en zijn mond zal tot diens mond spreken, en zijn ogen zullen diens ogen zien;", "2 Kon 12:16": "Het geld van het schuldoffer en het geld van de zondoffers werd niet naar het huis van de HEERE gebracht; het was voor de priesters.", "Jer 39:10": "Maar van het volk dat arm was, dat niets had, liet Nebuzaradan, de aanvoerder van de lijfwacht, sommigen achter in het land van Juda; en hij gaf hun op die dag wijngaarden en akkers.", "Ezech 24:14": "Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.", "Zach 7:5": "Spreek tot heel het volk van dit land, en tot de priesters: Toen u vastte en rouwklaagde, in de vijfde en in de zevende maand, namelijk nu zeventig jaren, hebt u dan voor Mij, voor Mij, werkelijk gevast?", "1 Kon 3:1": "En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.", "2 Kon 11:18": "Daarna ging al het volk van het land naar het huis van Baäl en brak dat af; zijn altaren en zijn beelden verbraken zij helemaal; en Mattan, de priester van Baäl, sloegen zij dood voor de altaren. De priester stelde toen ambtsdragers aan over het huis van de HEERE.", "Neh 4:2": "Hij sprak in het bijzijn van zijn broeders en van het leger van Samaria, en zei: Wat doen deze zwakke Joden? Zullen zij zichzelf versterken? Zullen zij offeren? Zullen zij het in één dag afmaken? Zullen zij de stenen uit de puinhopen weer levend maken, terwijl die verbrand zijn?", "2 Kon 23:3": "De koning nu stond bij de pilaar, en sloot een verbond voor het aangezicht van de HEERE, om de HEERE na te wandelen, en Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen met heel zijn hart en met heel zijn ziel te houden, om de woorden van dit verbond te bevestigen, die in dit boek geschreven zijn. En heel het volk stond in dit verbond.", "Jer 24:9": "En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben;", "Dan 5:3": "Toen bracht men de gouden vaten, die men uit de tempel van het huis van God, die te Jeruzalem geweest was, weggevoerd had; en de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen dronken daaruit.", "2 Sam 12:20": "Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.", "Gen 48:15": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag;", "Ps 122:1": "Een lied Hammaaloth, van David. Ik verblijd mij over hen die tegen mij zeggen: Wij zullen naar het huis van de HEERE gaan.", "1 Kon 7:27": "Hij maakte ook tien koperen stellingen; vier el was de lengte van één stelling, en vier el haar breedte, en drie el haar hoogte.", "2 Kron 4:14-16": "Hij maakte ook de stellingen; en wasvaten maakte hij op de stellingen; Eén zee, en de twaalf runderen daaronder. Insgelijks de potten, en de schoffels, en de krauwels, en al hun gereedschap maakte Huram Abi voor de koning Salomo, voor het huis van de HEERE, van gepolijst koper.", "2 Kron 33:15": "En hij nam de vreemde goden en die gelijkenis weg uit het huis van de HEERE, alsook alle altaren die hij gebouwd had op de berg van het huis van de HEERE, en te Jeruzalem; en hij wierp ze buiten de stad.", "2 Kron 26:21": "Zo was de koning Uzzia melaats tot aan de dag van zijn dood; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis van de HEERE afgesneden; Jotham nu, zijn zoon, was over het huis van de koning, en oordeelde het volk van het land.", "Jer 29:26": "De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn in het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.", "Ezech 17:20": "En Ik zal Mijn net over hem uitspreiden, zodat hij gegrepen zal worden in Mijn jachtnet; en Ik zal hem naar Babel laten brengen, en zal daar met hem in het gericht gaan over zijn overtreding, waarmee hij tegen Mij overtreden heeft.", "Ezech 5:10": "Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Jes 2:2": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien.", "1 Kon 7:15": "Want hij goot twee koperen pilaren; de hoogte van de ene pilaar was achttien el, en een draad van twaalf el kon de andere pilaar omvatten.", "Jer 41:1-3": "Het gebeurde in de zevende maand, dat Ismaël, de zoon van Nethanja, de zoon van Elisama, van koninklijk nageslacht, en de leiders van de koning, tien mannen, met hem kwamen naar Gedalia, de zoon van Ahikam, te Mizpa; en zij aten daar samen brood, te Mizpa. En Ismaël, de zoon van Nethanja, maakte zich klaar, alsook de tien mannen die met hem waren, en zij sloegen Gedalia, de zoon van Ahikam, de zoon van Safan, met het zwaard; zo doodde hij hem, die de koning van Babel over het land had aangesteld. Ook sloeg Ismaël al de Joden die met hem, namelijk met Gedalia, te Mizpa waren, en de Chaldeeën, de krijgslieden, die daar gevonden werden.", "Jer 34:8-10": "Het woord dat tot Jeremia gebeurde van de HEERE, nadat koning Zedekia een verbond gemaakt had met heel het volk dat te Jeruzalem was, om vrijheid voor hen uit te roepen. Dat ieder zijn knecht, en ieder zijn slavin, die een Hebreeër of een Hebreeuwse is, zou laten vrijgaan; zodat niemand zich van hen, van een Jood, zijn broeder, zou laten dienen. Nu hoorden alle vorsten en heel het volk die het verbond waren ingegaan, dat zij, ieder zijn knecht en ieder zijn slavin, zouden laten vrijgaan, zodat zij zich niet meer van hen zouden laten dienen; zij hoorden dan, en lieten hen gaan.", "1 Kon 7:40": "Daartoe maakte Hiram de wasvaten, de scheppen, en de sprenkelschalen; en Hiram maakte al het werk af dat hij voor koning Salomo maakte voor het huis van de HEERE:", "Jer 52:11": "En hij verblindde de ogen van Zedekia, en hij bond hem met twee koperen ketenen; zo bracht de koning van Babel hem naar Babel, en stelde hem in de gevangenis, tot de dag van zijn dood toe.", "Jer 52:24": "Ook nam de leider van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders.", "Jer 24:6": "En Ik zal Mijn oog op hen richten tot hun goed, en zal hen terugbrengen in dit land; en Ik zal hen bouwen, en niet afbreken; en Ik zal hen planten, en niet uitrukken.", "2 Kon 11:15": "Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.", "2 Kon 25:13-17": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden het koper daarvan naar Babel. Zij namen ook de potten, en de schoffels, en de gaffels, en de rookschalen, en al de koperen voorwerpen, waarmee men de dienst verrichtte. En de aanvoerder van de lijfwacht nam de wierookvaten en de sprenkelschalen weg, wat geheel goud en wat geheel zilver was.", "1 Kon 10:5": "en het voedsel van zijn tafel, en het zitten van zijn knechten, en het staan van zijn dienaren, en hun kleding, en zijn schenkers, en zijn opgang waarlangs hij naar boven ging in het huis van de HEERE, toen was er in haar geen geest meer.", "Ezech 33:21": "En het gebeurde in het twaalfde jaar van onze wegvoering, in de tiende maand, op de vijfde dag van de maand, dat er iemand tot mij kwam die uit Jeruzalem ontkomen was, en hij zei: De stad is ingenomen.", "Ezech 12:15": "Zo zullen zij weten dat Ik de HEERE ben, wanneer Ik hen onder de heidenvolken verspreid en hen in de landen verstrooi.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "Jes 25:12": "En Hij zal de hoge vesten van uw muren buigen, vernederen, ja, Hij zal ze tot de aarde toe, tot het stof toe, doen reiken.", "2 Kon 24:14": "En hij voerde heel Jeruzalem weg, alsook al de vorsten, en alle strijdbare helden, tienduizend gevangenen, en alle timmerlieden en smeden; niemand werd overgelaten, dan het arme volk van het land.", "Neh 12:47": "Daarom gaf heel Israël, in de dagen van Zerubbabel, en in de dagen van Nehemia, de delen van de zangers en van de poortwachters, van elke dag op zijn dag; en zij heiligden gaven voor de Levieten, en de Levieten heiligden gaven voor de kinderen van Aäron.", "Luk 15:22": "Maar de vader zei tegen zijn dienaren: Breng hier het beste kleed, en trek het hem aan, en geef hem een ring aan zijn hand, en schoenen aan zijn voeten;", "Jer 39:9-14": "Het overige nu van het volk, dat in de stad was overgebleven, en de overlopers, die naar hem overgelopen waren, met het overige van het volk, dat overgebleven was, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk naar Babel. Maar van het volk dat arm was, dat niets had, liet Nebuzaradan, de aanvoerder van de lijfwacht, sommigen achter in het land van Juda; en hij gaf hun op die dag wijngaarden en akkers. Maar over Jeremia had Nebukadrezar, de koning van Babel, bevel gegeven aan Nebuzaradan, de aanvoerder van de lijfwacht, en zei:", "1 Kon 7:16-42": "Hij maakte ook twee kapitelen, van gegoten koper, om op de koppen van de pilaren te zetten; vijf el was de hoogte van het ene kapiteel, en vijf el de hoogte van het andere kapiteel. De netten waren van vlechtwerk, de banden van ketenwerk voor de kapitelen, die op de kop van de pilaren waren; zeven voor het ene kapiteel, en zeven voor het andere kapiteel. Zo maakte hij de pilaren, alsook twee rijen rondom over het ene net, om de kapitelen te bedekken die boven op de granaatappels waren; zo deed hij ook bij het andere kapiteel.", "2 Kon 11:3": "En hij was met haar verborgen in het huis van de HEERE, zes jaar; en Athalia regeerde over het land.", "Ps 134:1": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat!", "Joz 10:16-27": "Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda. En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda. Toen zei Jozua: Rol grote stenen voor de opening van de grot, en zet mannen ervoor om hen te bewaken.", "Ps 79:1": "Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt.", "Jer 39:4-7": "En het gebeurde, toen Zedekia, de koning van Juda, en al de krijgslieden hen zagen, dat zij vluchtten, en 's nachts uit de stad trokken, via de weg van de tuin van de koning, door de poort tussen de twee muren; en hij trok uit via de weg van het vlakke veld. Maar het leger van de Chaldeeën jaagde hen achterna; en zij achterhaalden Zedekia in de vlakke velden van Jericho, en vingen hem, en brachten hem naar boven tot Nebukadrezar, de koning van Babel, naar Ribla, in het land van Hamath; die sprak oordelen tegen hem uit. En de koning van Babel slachtte de zonen van Zedekia te Ribla voor zijn ogen; ook slachtte de koning van Babel alle edelen van Juda.", "Zach 3:4": "Toen antwoordde Hij, en sprak tot hen die voor Zijn aangezicht stonden: Doe deze vuile kleren van hem weg. Daarna sprak Hij tot hem: Zie, Ik heb uw ongerechtigheid van u weggenomen, en Ik zal u stellen (extra) kleren aandoen.", "Ezech 14:21": "Want zo zegt de Heere HEERE: Hoeveel te meer als Ik Mijn vier zware oordelen, het zwaard, en de honger, en het boze gedierte, en de pest gezonden zal hebben tegen Jeruzalem, om daaruit mensen en beesten uit te roeien!", "Ezech 21:25-27": "En u, o onheilige, goddeloze vorst van Israël, wiens dag komen zal, in de tijd van de uiterste ongerechtigheid; Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is. Ik zal die kroon omgekeerd, omgekeerd, omgekeerd neerzetten; ja, zij zal er niet zijn, totdat hij komt die daartoe recht heeft, en aan wie Ik hem geven zal.", "Jer 40:16": "Maar Gedalia, de zoon van Ahikam, zei tegen Johanan, de zoon van Kareah: Doe deze zaak niet, want u spreekt vals over Ismaël.", "Jer 40:8-16": "kwamen zij tot Gedalia te Mizpa, namelijk Ismaël, de zoon van Nethanja, en Johanan en Jonathan, de zonen van Kareah, en Seraja, de zoon van Tanhumeth, en de zonen van Efai, de Netofathiet, en Jezanja, de zoon van een Maachathiet, zij en hun mannen. En Gedalia, de zoon van Ahikam, de zoon van Safan, zwoer hun en hun mannen, en zei: Wees niet bang om de Chaldeeën te dienen; blijf in het land, en dien de koning van Babel, dan zal het u goed gaan. En zie, ik woon te Mizpa, om voor de Chaldeeën te staan die tot ons zullen komen; verzamel u dan wijn, en zomervruchten, en olie, en doe ze in uw vaten, en woon in uw steden die u hebt ingenomen.", "Jer 27:8": "En het zal gebeuren: het volk en het koninkrijk dat hem, Nebukadnezar, de koning van Babel, niet zal dienen, en dat zijn hals niet onder het juk van de koning van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.", "Jer 21:1": "Het woord dat van de HEERE gekomen is tot Jeremia, toen koning Zedekia Pashur, de zoon van Malchia, en Zefanja, de zoon van Maaseja, de priester, naar hem toe zond, met de woorden:", "Ezech 17:21": "Daartoe zullen al zijn vluchtelingen met al zijn troepen door het zwaard vallen, en de overgeblevenen zullen naar alle windrichtingen verstrooid worden; en u zult weten dat Ik, de HEERE, dit gesproken heb.", "Klaagl 4:20": "Resch. De adem van onze neus, de gezalfde van de HEERE, is gevangen in hun kuilen; van wie wij zeiden: Wij zullen onder zijn schaduw leven onder de heidenen!", "2 Kon 24:13": "En hij bracht van daar al de schatten van het huis van de HEERE, en de schatten van het huis van de koning; en hij hakte alle gouden vaten stuk die Salomo, de koning van Israël, in de tempel van de HEERE gemaakt had, zoals de HEERE gesproken had.", "Jer 37:8": "En de Chaldeeën zullen terugkeren en tegen deze stad strijden; en zij zullen haar innemen en met vuur verbranden.", "Dan 5:2": "Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken.", "Ex 27:3": "U moet het ook potten maken, om zijn as te ontvangen, ook zijn schoffels, en zijn besprengbekkens, en zijn krauwels, en zijn koolpannen; al zijn gereedschap moet u van koper maken.", "Jer 21:7": "En daarna, spreekt de HEERE, zal Ik Zedekia, de koning van Juda, en zijn dienaren, en het volk, en hen die in deze stad zijn overgebleven van de pest, van het zwaard en van de honger, geven in de hand van Nebukadnezar, de koning van Babel, en in de hand van hun vijanden, en in de hand van hen die hun leven zoeken; en hij zal ze slaan met de scherpte van het zwaard; hij zal ze niet sparen, niet ontzien, en zich niet ontfermen.", "1 Kon 9:8": "En aangaande dit huis, dat verheven zal geweest zijn, ieder die eraan voorbijgaat zal zich ontzetten en fluiten; men zal zeggen: Waarom heeft de HEERE zo gedaan aan dit land en aan dit huis?", "Luk 19:43": "Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "2 Kon 16:6": "In diezelfde tijd bracht Rezin, de koning van Syrië, Elath weer aan Syrië, en verjoeg de Joden uit Elath; en de Syriërs kwamen naar Elath, en hebben daar gewoond tot op deze dag.", "Jer 38:14": "Toen zond de koning Zedekia iemand, en liet de profeet Jeremia bij zich halen, bij de derde ingang die aan het huis van de HEERE was; en de koning zei tegen Jeremia: Ik zal u iets vragen, verberg niets voor mij.", "Joz 22:8": "En hij sprak tot hen, en zei: Keert terug naar uw tenten met veel rijkdom, en met heel veel vee, met zilver, en met goud, en met koper, en met ijzer, en met heel veel kleding; deelt de buit van uw vijanden met uw broeders.", "Jes 29:3": "Want Ik zal een leger in het rond om u opslaan, en Ik zal u belegeren met bolwerken, en Ik zal vestingen tegen u opwerpen.", "Jer 32:1": "Het woord dat tot Jeremia gekomen is van de HEERE, in het tiende jaar van Zedekia, koning van Juda; dit jaar was het achttiende jaar van Nebukadnezar.", "Ezech 21:22-24": "De waarzeggerij zal aan zijn rechterhand zijn op Jeruzalem, om hoofdmannen aan te stellen, om de mond te openen tot het doodslaan, om de stem op te heffen met gejuich, om stormrammen op te stellen tegen de poorten, om verhogingen op te werpen, om bolwerken te bouwen. Dit zal in hun ogen als een nutteloze waarzeggerij zijn, omdat zij met eden beëdigd zijn onder hen; maar hij zal aan de ongerechtigheid denken, opdat zij gegrepen worden. Daarom zegt de Heere HEERE zo: Omdat u uw ongerechtigheid laat gedenken, doordat uw overtredingen ontdekt worden, zodat uw zonden gezien worden in al uw handelingen; omdat aan u gedacht wordt, zult u met de hand gegrepen worden.", "2 Kron 33:11": "Daarom bracht de HEERE over hen de legeroversten van de koning van Assyrië, die Manasse gevangen namen tussen de doornen; en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "Gen 40:20": "En het gebeurde op de derde dag, de dag van Farao's geboorte, dat hij voor al zijn dienaren een maaltijd maakte; en hij verhief het hoofd van de leider van de schenkers, en het hoofd van de leider van de bakkers, te midden van zijn dienaren.", "Dan 11:15": "En de koning van het Noorden zal komen, en een wal opwerpen, en versterkte steden innemen; en de legers van het Zuiden zullen niet standhouden, noch zijn uitgelezen volk, ja, er zal geen kracht zijn om stand te houden.", "2 Kon 25:1-17": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. Op de negende van de vierde maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,", "Jer 52:13": "Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur.", "Gen 37:36": "En de Midianieten verkochten hem in Egypte, aan Potifar, een hoveling van de farao, leider van de lijfwacht.", "Ezech 12:25-28": "Want Ik ben de HEERE, Ik zal spreken; het woord dat Ik zal spreken, zal gebeuren, de tijd zal niet meer worden uitgesteld; want in uw dagen, o opstandig huis, zal Ik een woord spreken, en het doen, spreekt de Heere HEERE. Verder kwam het woord van de HEERE tot mij en Hij zei: Mensenkind, zie, zij van het huis van Israël zeggen: Het visioen dat hij ziet, is voor vele dagen later, en hij profeteert over tijden die ver weg zijn.", "Zach 8:19": "Zo zegt de HEERE van de heerscharen: Het vasten van de vierde, en het vasten van de vijfde, en het vasten van de zevende, en het vasten van de tiende maand, zal voor het huis van Juda tot vreugde, en tot blijdschap, en tot vrolijke hoogtijden wezen; heb dan de waarheid en de vrede lief.", "2 Kon 25:11-21": "Het overige nu van het volk, die in de stad overgelaten waren, en de afvalligen, die tot de koning van Babel gevallen waren, en het overige van de menigte, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk weg. Maar van de armsten van het land liet de aanvoerder van de lijfwacht enigen overig tot wijngaardeniers en tot akkerlieden. Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden het koper daarvan naar Babel.", "Richt 19:18": "En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "Jer 32:24": "Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.", "Jer 37:10": "Want al zou u het hele leger van de Chaldeeën verslaan, die tegen u strijden, en er zouden van hen alleen gewonde mannen overblijven, dan zouden die zich toch, ieder in zijn tent, opmaken en deze stad met vuur verbranden.", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Jer 52:27": "En de koning van Babel sloeg hen en doodde hen te Ribla, in het land van Hamath. Zo werd Juda uit zijn land gevankelijk weggevoerd.", "2 Kron 34:15": "En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek.", "Gen 21:16": "En zij ging weg en ging tegenover hem zitten, op een afstand zo ver als een boogschot; want zij zei: Laat ik het kind niet zien sterven; en zij zat tegenover hem, en hief haar stem op, en huilde.", "2 Kon 20:8": "Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan?", "2 Kon 11:1": "Toen Athalia, de moeder van Ahazia, zag dat haar zoon dood was, maakte zij zich op en bracht al het koninklijke nageslacht om.", "Jer 52:19": "En de leider van de lijfwacht nam de schalen weg, en de wierookvaten, en de sprenkelschalen, en de potten, en de kandelaars, en de rookschalen, en de kroezen; wat geheel goud, en wat geheel zilver was.", "Jer 52:12-24": "Daarna, in de vijfde maand, op de tiende van de maand (dit jaar was het negentiende jaar van koning Nebukadrezar, de koning van Babel), toen Nebuzaradan, de leider van de lijfwacht, die voor het aangezicht van de koning van Babel stond, in Jeruzalem gekomen was; Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.", "2 Kon 11:19": "En hij nam de leiders van honderd, en de hoofdmannen, en de lijfwacht, en al het volk van het land; en zij brachten de koning af uit het huis van de HEERE, en kwamen door de weg van de poort van de lijfwacht naar het huis van de koning, en hij zat op de troon der koningen.", "Jer 52:16": "Maar van de armsten van het land liet Nebuzaradan, de leider van de lijfwacht, enigen over tot wijngaardeniers en tot akkerlieden.", "Jer 41:6": "En Ismaël, de zoon van Nethanja, ging uit Mizpa hun tegemoet, al gaande en huilend; en het gebeurde, toen hij hen aantrof, dat hij zei: Kom naar Gedalia, de zoon van Ahikam!", "Jer 52:12-30": "Daarna, in de vijfde maand, op de tiende van de maand (dit jaar was het negentiende jaar van koning Nebukadrezar, de koning van Babel), toen Nebuzaradan, de leider van de lijfwacht, die voor het aangezicht van de koning van Babel stond, in Jeruzalem gekomen was; Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.", "2 Kon 24:10": "In die tijd trokken de dienaren van Nebukadnezar, de koning van Babel, naar Jeruzalem; en de stad werd belegerd.", "2 Kon 24:10-16": "In die tijd trokken de dienaren van Nebukadnezar, de koning van Babel, naar Jeruzalem; en de stad werd belegerd. Zelfs kwam Nebukadnezar, de koning van Babel, tegen de stad, terwijl zijn dienaren die belegerden. Toen ging Jojachin, de koning van Juda, naar de koning van Babel, hij, en zijn moeder, en zijn dienaren, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem gevangen in het achtste jaar van zijn regering.", "Jer 39:8": "En de Chaldeeën verbrandden het huis van de koning en de huizen van het volk met vuur; en zij braken de muren van Jeruzalem af.", "Jer 22:30": "Zo zegt de HEERE: Schrijf deze man op als kinderloos, een man die niet voorspoedig zal zijn in zijn dagen; want niemand van zijn nageslacht zal voorspoedig zijn, zittend op de troon van David, en nog heersend in Juda."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">het</span> gebeurde in <span class=\"wl\" data-l=\"L2\" data-code=\"H8671\">het</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H8671\">negende</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8141\">jaar</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8141\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H4427\">zijn</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H4427\">regering</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H4427\">in</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6224\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6224\">tiende</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2320\">maand</span>, <span class=\"wl\" data-l=\"L6\" data-code jv\" data-code=\"H5892\">city</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">besieged</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6249\">eleventh</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah.</span>", "3": "And on the <span class=\"wl wl-kjv\" data-code=\"H8672\">ninth</span> day of the fourth <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">prevailed</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and there was no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span>", "4": "And the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> was broken <span class=\"wl wl-kjv\" data-code=\"H1234\">up,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> fled by <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> between two <span class=\"wl wl-kjv\" data-code=\"H2346\">walls,</span> which is by the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1588\">garden:</span> (now the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldees</span> were against the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about:)</span> and the king <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> toward the <span class=\"wl wl-kjv\" data-code=\"H6160\">plain.</spa n.</span>", "8": "And in the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> on the <span class=\"wl wl-kjv\" data-code=\"H7651\">seventh</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> which is the <span class=\"wl wl-kjv\" data-code=\"H8672\">nineteenth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadnezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H5018\">Nebuzaradan,</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard,</span> a <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> unto <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span>", "9": "And he <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and every <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> man's <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> he with <span class=\"wl wl-kjv\" data-code=\"H784\">fire.</span>", "10": "And all the <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldees,</span> that were with the <span class=\"wl wl-kjv\" data-code=\"H7227\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard,</span> brake <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about.</span>", "11": "Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5307\">fugitives</span> that fell <span class=\"wl wl-kjv\" data-code=\"H5307\">away</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> with the <span class=\"wl wl-kjv\" data-code=\"H3499\">remnant</span> of the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> did <span class=\"wl wl-kjv\" data-code=\"H5018\">Nebuzaradan</span> the <span class=\"wl wl-kjv\" data-code=\"H7227\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard</span> carry <span class=\"wl wl-kjv\" data-code=\"H1540\">away.</span>", "12": "But the <span class=\"wl wl-kjv\" data-code=\"H7227\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard</span> <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> of the <span class=\"wl wl-kjv\" data-code=\"H1803\">poor</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> to be <span class=\"wl wl-kjv\" data-code=\"H3755\">vinedressers</span> and <span class=\"wl wl-kjv\" data-code=\"H3009\">husbandmen.</span>", "13": "And the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4350\">bases,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5178\">brasen</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> that was in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> did the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldees</span> break in <span class=\"wl wl-kjv\" data-code=\"H7665\">pieces,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">carried</span> the <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> of them to <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon.</span>", "14": "And the <span class=\"wl wl-kjv\" data-code=\"H5518\">pots,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3257\">shovels,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4212\">snuffers,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3709\">spoons,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> wherewith they <span class=\"wl wl-kjv\" data-code=\"H8334\">ministered,</span> took they <span class=\"wl wl-kjv\" data-code=\"H3947\">away.</span>", "15": "And the <span class=\"wl wl-kjv\" data-code=\"H4289\">firepans,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4219\">bowls,</span> and such things as were of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> in <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> in <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> the <span class=\"wl wl-kjv\" data-code=\"H7227\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard</span> took <span class=\"wl wl wl-kjv\" data-code=\"H2320\">month,</span> that <span class=\"wl wl-kjv\" data-code=\"H192\">Evilmerodach</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> in the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> that he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> did lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H3078\">Jehoiachin</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> out of <span class=\"wl wl-kjv\" data-code=\"H1004\">prison;</span>", "28": "And he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">kindly</span> to him, and <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> above the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> that were with him in <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon;</span>", "29": "And <span class=\"wl wl-kjv\" data-code=\"H8132\">changed</span> his <span class=\"wl wl-kjv\" data-code=\"H3608\">prison</span> <span class=\"wl wl-kjv\" data-code=\"H899\">garments:</span> and he did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H2416\">life.</span>", "30": "And his <span class=\"wl wl-kjv\" data-code=\"H737\">allowance</span> was a <span class=\"wl wl-kjv\" data-code=\"H8548\">continual</span> <span class=\"wl wl-kjv\" data-code=\"H737\">allowance</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> him of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> a <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">rate</span> for every <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H2416\">life.</span>"}};
