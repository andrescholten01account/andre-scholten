dt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "2 Kon 9:28": "En zijn knechten voerden hem naar Jeruzalem, en zij begroeven hem in zijn graf, bij zijn vaderen in de stad van David.", "Ruth 1:1": "In de dagen dat de rechters rechtspraken, gebeurde het dat er honger in het land was; daarom trok een man van Bethlehem-juda weg om als vreemdeling te wonen in de velden van Moab, hij, en zijn vrouw, en zijn twee zonen.", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "Klaagl 5:10": "Onze huid is zwart geworden als een oven, vanwege de verzengende hitte van de honger.", "Luk 1:55": "zoals Hij gesproken heeft tot onze vaderen, tot Abraham en zijn nageslacht, tot in eeuwigheid.", "1 Sam 19:13": "En Michal nam een beeld, en legde het in het bed, en legde een geitenvel aan zijn hoofdkussen, en dekte het met een kleed toe.", "Jes 33:1": "Wee u, verwoester, die zelf niet verwoest bent, en u, die trouweloos handelt, terwijl men niet trouweloos tegen u gehandeld heeft! Als u het verwoesten volbracht zult hebben, zult u verwoest worden; als u het trouweloos handelen voltooid zult hebben, zal men trouweloos tegen u handelen.", "Ps 22:17": "Want honden hebben mij omsingeld; een vergadering van boosdoeners heeft mij omgeven; zij hebben mijn handen en mijn voeten doorgraven.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Ps 37:26": "De hele dag ontfermt hij zich, en leent; en zijn nageslacht is tot zegen.", "Jer 25:29": "Want zie, in de stad, die naar Mijn Naam genoemd is, begin Ik te plagen, en zou u dan zonder meer onschuldig gehouden worden? U zult niet onschuldig worden gehouden; want Ik roep het zwaard over alle inwoners van de aarde, spreekt de HEERE van de heerscharen.", "Luk 21:11": "En er zullen grote aardbevingen zijn op verscheidene plaatsen, en hongersnoden, en pestilentiën; er zullen ook schrikwekkende dingen, en grote tekenen van de hemel gebeuren.", "Gen 41:27": "En die zeven schrale en lelijke koeien, die daarna opkwamen, zijn zeven jaren; en die zeven lege, door de oostenwind verzengde aren zullen zeven jaren van honger zijn.", "Ps 33:4": "Want het woord van de HEERE is recht, en al Zijn werk is trouw.", "Neh 9:8": "En U hebt zijn hart getrouw gevonden voor Uw aangezicht, en hebt een verbond met hem gemaakt, dat U zou geven het land van de Kanaänieten, de Hethieten, de Amorieten, en de Ferezieten, en de Jebusieten, en de Girgasieten, dat U het aan zijn nageslacht zou geven; en U hebt Uw woorden bevestigd, omdat U rechtvaardig bent.", "Joh 11:35": "Jezus weende.", "Deut 28:22-24": "De HEERE zal u slaan met tering, en met koorts, en met ontsteking, en met hitte, en met droogte, en met korenbrand, en met meeldauw, die u zullen achtervolgen totdat u omkomt. En uw hemel, die boven uw hoofd is, zal koper zijn, en de aarde, die onder u is, zal ijzer zijn. De HEERE, uw God, zal stof en poeder tot regen van uw land geven; vanuit de hemel zal het op u neerdalen, totdat u verdelgd wordt.", "Gen 19:15": "En toen de dageraad opging, drongen de engelen bij Lot aan en zeiden: Maak u klaar, neem uw vrouw, en uw twee dochters die hier zijn, opdat u niet omkomt door de ongerechtigheid van deze stad.", "2 Kon 5:5": "Toen zei de koning van Syrië: Ga heen, kom, en ik zal een brief aan de koning van Israël sturen. En hij ging heen, en nam in zijn hand tien talenten van het zilver, en zesduizend sikkelen goud, en tien stellen kleren.", "Joh 9:27": "Hij antwoordde hun: Ik heb het u al gezegd, en u hebt het niet gehoord; waarom wilt u het opnieuw horen? Wilt u soms ook Zijn discipelen worden?", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Spr 16:9": "Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.", "Hand 23:35": "zei hij: Ik zal u horen wanneer ook uw aanklagers hier gekomen zijn. En hij beval dat hij bewaard zou worden in het rechthuis van Herodes.", "Ps 137:9": "Gelukkig zal hij zijn, die uw kinderen grijpt, en tegen de steenrots verpletteren zal.", "Ezech 14:14": "Ofschoon deze drie mannen, Noach, Daniël en Job, in het midden daarvan zouden zijn, zouden zij door hun gerechtigheid alleen hun eigen ziel bevrijden, spreekt de Heere HEERE.", "1 Kon 11:24": "tegen wie hij ook mannen verzameld had, en hij werd aanvoerder van een bende, toen David hen doodde; en zij trokken naar Damascus, woonden daar en regeerden in Damascus.", "Ps 121:3": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "Gen 26:3": "Woon als vreemdeling in dat land, en Ik zal met u zijn, en zal u zegenen; want aan u en uw nageslacht zal Ik al deze landen geven, en Ik zal de eed bevestigen die Ik Abraham, uw vader, gezworen heb.", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "Jes 65:23": "Zij zullen niet tevergeefs arbeiden, noch baren voor verstoring; want zij zijn het nageslacht van de gezegenden van de HEERE, en hun nakomelingen met hen.", "Amos 1:3": "Zo zegt de HEERE: Om drie overtredingen van Damaskus, en om vier zal Ik dat niet afwenden; omdat zij Gilead met ijzeren dorswagens hebben gedorst.", "Ps 100:5": "Want de HEERE is goed; Zijn goedertierenheid is eeuwig, en Zijn trouw van geslacht tot geslacht.", "2 Sam 7:15": "Maar Mijn goedertierenheid zal van hem niet wijken, zoals Ik die weggenomen heb van Saul, die Ik van voor uw aangezicht heb weggenomen.", "1 Kon 16:10": "Zo kwam Zimri binnen, en sloeg hem, en doodde hem, in het zevenentwintigste jaar van Asa, de koning van Juda; en hij werd koning in zijn plaats.", "Richt 11:13": "En de koning van de kinderen van Ammon zei tegen de boden van Jeftha: Omdat Israël, toen het optrok uit Egypte, mijn land heeft afgenomen, van de Arnon af tot aan de Jabbok, en tot aan de Jordaan; geef mij dat nu dus in vrede terug.", "Jer 31:37": "Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "2 Kon 1:16": "En hij sprak tot hem: Zo zegt de HEERE: Omdat u boden gezonden hebt om Baäl-Zebub, de god van Ekron, te vragen (is het omdat er geen God in Israël is, om Zijn woord te vragen?); daarom zult u van dat bed waarop u geklommen bent, niet afkomen, maar u zult zeker sterven.", "Matt 2:8": "En hij stuurde hen naar Bethlehem en zei: Ga erheen, en onderzoek nauwkeurig naar dat Kindje, en als u Het gevonden hebt, laat het mij weten, opdat ik ook kom en Het aanbid.", "Jes 65:16": "Zodat wie zich zal zegenen op aarde, zich zal zegenen in de God van de waarheid; en wie zal zweren op aarde, zal zweren bij de God van de waarheid, omdat de vorige benauwdheden vergeten zullen zijn, en omdat zij voor Mijn ogen verborgen zijn.", "Joz 21:13": "Zo gaven zij aan de kinderen van de priester Aäron de vrijstad voor de doodslager, Hebron en haar voorsteden, en Libna en haar voorsteden;", "1 Kon 11:13": "Maar Ik zal het hele koninkrijk niet afscheuren; één stam zal Ik uw zoon geven, omwille van Mijn dienaar David, en omwille van Jeruzalem, dat Ik verkozen heb.", "Deut 12:28": "Neem het waar, en hoor al deze woorden die ik u gebied, opdat het u, en uw kinderen na u, goed gaat tot in eeuwigheid, als u zult gedaan hebben wat goed en recht is in de ogen van de HEERE, uw God.", "1 Kon 14:31": "En Rehabeam ontsliep met zijn vaderen, en werd begraven bij zijn vaderen in de stad van David; en de naam van zijn moeder was Naäma, de Ammonietische; en zijn zoon Abiam regeerde in zijn plaats.", "Ezech 14:13": "Mensenkind, als een land tegen Mij zondigt door zwaar te overtreden, dan zal Ik Mijn hand daartegen uitstrekken, en de staf van het brood daarvan breken, en een honger daarin zenden, zodat Ik daaruit mensen en beesten uitroei;", "1 Sam 24:15": "Achter wie is de koning van Israël uitgetrokken? Wie jaagt u na? Een dode hond, een enkele vlo!", "Nahum 3:10": "Toch is zij gevankelijk gegaan in de gevangenis; ook zijn haar kinderen op het hoofd van alle straten verpletterd geworden; en over haar geëerde hebben zij het lot geworpen, en al haar groten zijn in boeien gebonden geworden.", "1 Kon 4:13": "De zoon van Geber was te Ramoth in Gilead; hij had de dorpen van Jaïr, de zoon van Manasse, die in Gilead zijn; ook had hij de streek van Argob, die in Basan is, zestig grote steden met muren en koperen grendels.", "2 Kon 21:13": "En Ik zal over Jeruzalem het meetsnoer van Samaria trekken, alsook het paslood van het huis van Achab; en Ik zal Jeruzalem uitwissen, zoals men een schotel uitwist; men wist hem uit, en men keert hem om op zijn holle kant.", "1 Kon 15:18": "Toen nam Asa al het zilver en goud, dat overgebleven was in de schatten van het huis van de HEERE, en de schatten van het huis van de koning, en gaf ze in de hand van zijn knechten; en de koning Asa zond ze tot Benhadad, de zoon van Tabrimmon, de zoon van Hezion, de koning van Syrië, die te Damaskus woonde, en zei:", "Ex 6:3": "En ook heb Ik Mijn verbond met hen opgericht, dat Ik hun het land Kanaän geven zou, het land van hun vreemdelingschap, waarin zij vreemdelingen zijn geweest.", "Ezra 9:9": "Want wij zijn knechten; maar in onze dienstbaarheid heeft onze God ons niet verlaten; maar Hij heeft weldadigheid tot ons geneigd voor het aangezicht van de koningen van Perzië, dat Hij ons een weinig leven zou geven, om het huis van onze God te verhogen, en de woestenijen ervan op te richten, en om ons een muur te geven in Juda en te Jeruzalem.", "Ps 121:4": "Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen.", "Jer 13:17": "Zult u dat dan nog niet horen, dan zal mijn ziel in verborgen plaatsen wenen vanwege de hoogmoed, en mijn oog zal bitter tranen, ja, van tranen neerstromen, omdat de kudde van de HEERE gevankelijk is weggevoerd.", "2 Kon 8:7-15": "Daarna kwam Elisa in Damaskus, toen Benhadad, de koning van Syrië, ziek was; en men vertelde hem: De man Gods is hierheen gekomen. Toen zei de koning tegen Hazaël: Neem een geschenk mee, en ga de man Gods tegemoet, en vraag door hem de HEERE: Zal ik van deze ziekte genezen? Zo ging Hazaël hem tegemoet, en nam een geschenk mee, namelijk al het goede van Damaskus, een last van veertig kamelen; en hij kwam, en stond voor hem, en zei: Uw zoon Benhadad, de koning van Syrië, heeft mij naar u gezonden om te vragen: Zal ik van deze ziekte genezen?", "Luk 1:33": "En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.", "Gen 41:32": "En dat die droom aan Farao voor de tweede keer herhaald is, komt omdat de zaak door God vast besloten is, en dat God zich haast om dat te doen.", "Ps 119:90": "Uw trouw is van geslacht tot geslacht; U hebt de aarde vastgemaakt, en zij blijft staan;", "Gen 26:1": "Er was honger in dat land, naast de eerste honger, die er in de dagen van Abraham geweest was; daarom ging Izak naar Abimelech, de koning van de Filistijnen, naar Gerar.", "Matt 24:34": "Voorwaar, Ik zeg u: dit geslacht zal beslist niet voorbijgaan, totdat al deze dingen gebeurd zijn.", "Ezech 5:17": "Ja, honger en boos gedierte, die u van kinderen zullen beroven, zal Ik over u zenden; ook zal pest en bloed onder u omgaan; en het zwaard zal Ik over u brengen; Ik, de HEERE, heb het gesproken!", "2 Kon 4:3-6": "Toen zei hij: Ga, vraag voor u vaten van buiten, van al uw buren lege vaten; zorg dat het er niet weinig zijn. Kom dan naar binnen, en sluit de deur achter u en uw zonen toe; giet dan olie in al die vaten, en zet weg wat vol is. Zo ging zij bij hem vandaan, en sloot de deur achter zich en haar zonen toe; die brachten haar de vaten aan, en zij goot in.", "Joz 23:14": "En ziet, ik ga heden in de weg van de hele aarde; en u weet in uw hele hart en in uw hele ziel, dat er niet één woord gevallen is van al die goede woorden, die de HEERE, uw God, over u gesproken heeft; zij zijn u alle overkomen; er is daarvan niet één woord gevallen.", "Joz 21:38": "Van de stam van Gad nu, de vrijstad voor de doodslager, Ramoth in Gilead, en haar voorsteden, en Mahanaim en haar voorsteden;", "1 Kon 11:43": "Daarna ontsliep Salomo met zijn vaderen, en werd begraven in de stad van zijn vader David; en Rehabeam, zijn zoon, werd koning in zijn plaats.", "2 Kon 1:9": "En hij zond naar hem een leider over vijftig met zijn vijftigtal. En toen hij naar hem opklom (want zie, hij zat op de top van een berg), sprak hij tot hem: Man van God! De koning zegt: Kom naar beneden.", "Hos 14:1": "Samaria zal woest worden, want zij is opstandig geweest tegen haar God; zij zullen door het zwaard vallen, hun kinderen zullen verpletterd, en hun zwangere vrouwen zullen opengesneden worden.", "Jer 17:1": "De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren;", "Est 6:11": "En Haman nam dat kleed en dat paard, en trok Mordechai het kleed aan, en liet hem rijden door de straten van de stad, en hij riep vóór hem uit: Zo zal men doen met de man aan wie de koning graag eer wil bewijzen!", "2 Kon 11:12-16": "Daarna bracht hij de zoon van de koning naar voren en zette hem de kroon op, en gaf hem de getuigenis; en zij maakten hem koning en zalfden hem; daarbij klapten zij in de handen en zeiden: Leve de koning! Toen Athalia de stem hoorde van de lijfwacht en van het volk, kwam zij bij het volk in het huis van de HEERE. En zij zag toe, en zie, de koning stond bij de pilaar, naar de gewoonte, en de leiders en de trompetten bij de koning; en al het volk van het land was blij en blies op trompetten. Toen scheurde Athalia haar kleren en riep: Verraad, verraad!", "Amos 1:13": "Zo zegt de HEERE: Om drie overtredingen van de kinderen van Ammon, en om vier zal Ik dat niet afwenden; omdat zij de zwangere vrouwen van Gilead hebben opengesneden, om hun grondgebied te vergroten.", "2 Kron 22:3": "Hij wandelde ook in de wegen van het huis van Achab; want zijn moeder was zijn raadgeefster, om goddeloos te handelen.", "Ezech 14:18": "Ofschoon die drie mannen in het midden daarvan waren, zo waarachtig als Ik leef, spreekt de Heere HEERE, zij zouden zonen noch dochters bevrijden, maar zij zelf alleen zouden bevrijd worden.", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "2 Kron 33:9": "Zo deed Manasse Juda en de inwoners van Jeruzalem dwalen, dat zij erger deden dan de heidenen, die de HEERE voor het aangezicht van de kinderen van Israël verdelgd had.", "Gen 14:15": "En hij verdeelde zich tegen hen 's nachts, hij en zijn knechten, en versloeg hen; en hij achtervolgde hen tot Hoba toe, dat ten noorden van Damaskus ligt.", "Gen 12:10": "En er was hongersnood in dat land; zo trok Abram af naar Egypte om daar als vreemdeling te wonen, omdat de hongersnood zwaar was in dat land.", "Rom 8:31": "Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn?", "1 Kon 11:3": "En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "1 Kon 22:52-54": "Ahazia, de zoon van Achab, werd koning over Israël te Samaria, in het zeventiende jaar van Josafat, de koning van Juda, en regeerde twee jaar over Israël. En hij deed wat kwaad was in de ogen van de HEERE; want hij wandelde in de weg van zijn vader, en in de weg van zijn moeder, en in de weg van Jerobeam, de zoon van Nebat, die Israël deed zondigen. En hij diende Baäl, en boog zich voor hem neer, en tergde de HEERE, de God van Israël, naar alles wat zijn vader gedaan had.", "1 Sam 26:9-11": "David zei daarentegen tegen Abisai: Breng hem niet om; want wie heeft ooit zijn hand tegen de gezalfde van de HEERE opgeheven en is onschuldig gebleven? Verder zei David: Zo waarachtig als de HEERE leeft, de HEERE zal hem slaan, of zijn dag zal komen dat hij zal sterven, of hij zal in een strijd trekken en daarin omkomen. De HEERE late het verre van mij zijn, dat ik mijn hand zou leggen aan de gezalfde van de HEERE! Neem toch nu de speer die bij zijn hoofdeinde ligt, en de waterfles, en laten we gaan.", "2 Kon 12:18": "Maar Joas, de koning van Juda, nam al de geheiligde dingen die Josafat, en Joram, en Ahazia, zijn vaderen, de koningen van Juda, geheiligd hadden, en zijn eigen geheiligde dingen, en al het goud dat gevonden werd in de schatten van het huis van de HEERE en van het huis van de koning, en zond het aan Hazaël, de koning van Syrië; toen trok hij weg van Jeruzalem.", "Ezech 13:19": "En zult u Mij ontheiligen bij Mijn volk, voor handvollen gerst en voor stukken brood, om zielen te doden die niet zouden sterven, en om zielen in leven te houden die niet zouden leven, door uw liegen tegen Mijn volk, dat de leugen hoort?", "Ezech 16:62": "Want Ik zal Mijn verbond met u oprichten, en u zult weten dat Ik de HEERE ben;", "Amos 8:1": "De Heere HEERE liet mij dit zien: er was een korf met zomervruchten.", "Gen 41:25": "Toen zei Jozef tot Farao: De droom van Farao is één; wat God gaat doen, heeft Hij Farao bekendgemaakt.", "2 Sam 8:15": "Zo regeerde David over heel Israël, en David deed aan zijn hele volk recht en gerechtigheid.", "Deut 10:15": "Alleen heeft de HEERE behagen gehad in uw vaderen, om hen lief te hebben, en heeft hun nageslacht na hen, u, uit alle volken uitverkoren, zoals het op deze dag is.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Ps 25:10": "Caph. Alle paden van de HEERE zijn goedertierenheid en waarheid, voor hun die Zijn verbond en Zijn getuigenissen bewaren.", "Micha 2:1": "Wee hun die onrecht bedenken en kwaad beramen op hun slaapplaatsen; in het licht van de morgen doen zij het, omdat het in de macht van hun hand is.", "2 Kon 2:24": "En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "2 Kon 16:7": "Achaz nu zond boden naar Tiglath-pilezer, de koning van Assyrië, en zei: Ik ben uw knecht en uw zoon; kom op, en verlos mij uit de hand van de koning van Syrië, en uit de hand van de koning van Israël, die tegen mij opstaan.", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "2 Kron 21:8-10": "In zijn dagen kwamen de Edomieten in opstand tegen het gezag van Juda, en zij stelden een koning over zich aan. Daarom trok Joram op met zijn leiders, en alle wagens met hem; en hij stond 's nachts op en versloeg de Edomieten die hem omsingeld hadden, alsook de aanvoerders van de wagens. Toch kwamen de Edomieten in opstand tegen het gezag van Juda, tot op deze dag; in dezelfde tijd kwam ook Libna in opstand tegen zijn gezag, want hij had de HEERE, de God van zijn voorouders, verlaten.", "1 Kron 12:40": "En ook degenen die dicht bij hen woonden, tot aan Issaschar, en Zebulon, en Nafthali, brachten brood op ezels, en op kamelen, en op muildieren, en op runderen, meel, klompen gedroogde vijgen, en rozijnenkoeken, en wijn, en olie, en runderen, en kleinvee in overvloed; want er was blijdschap in Israël.", "2 Kon 17:22": "Zo wandelden de kinderen van Israël in alle zonden van Jerobeam die hij gedaan had; zij weken daar niet van af;", "Jer 51:5": "Want Israël of Juda zal niet in weduwschap gelaten worden door zijn God, door de HEERE van de heerscharen (hoewel hun land vol schuld is), door de Heilige van Israël.", "2 Sam 7:12": "Wanneer uw dagen vervuld zullen zijn, en u met uw vaderen zult ontslapen zijn, dan zal Ik uw nakomeling na u doen opstaan, die uit uw lijf voortkomen zal, en Ik zal zijn koninkrijk bevestigen.", "1 Sam 17:43": "De Filistijn nu zei tegen David: Ben ik een hond, dat u met stokken naar mij toe komt? En de Filistijn vervloekte David bij zijn goden.", "Matt 13:25": "En toen de mensen sliepen, kwam zijn vijand en zaaide onkruid midden tussen de tarwe, en ging weg.", "Est 6:12": "Daarna keerde Mordechai terug naar de poort van de koning; maar Haman ging haastig naar zijn huis, treurig en met bedekt hoofd.", "2 Kron 23:12-15": "Toen Athalia nu de stem van het volk hoorde, dat toeliep en de koning prees, kwam zij naar het volk in het huis van de HEERE. En zij keek toe; en zie, de koning stond bij zijn pilaar, bij de ingang; en de leiders en de trompetten waren bij de koning; en heel het volk van het land was blij, en blies op de trompetten; en de zangers waren er met muzikale instrumenten, en gaven aanwijzingen om lof te zingen; toen scheurde Athalia haar kleren, en riep: Verraad, verraad! Maar de priester Jojada bracht de aanvoerders van de honderdtallen, die over het leger gesteld waren, naar buiten, en zei tegen hen: Breng haar naar buiten, tussen de gelederen door, en wie haar volgt, zal met het zwaard gedood worden; want de priester had gezegd: U zult haar niet doden in het huis van de HEERE.", "Jes 56:10": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief.", "2 Kon 9:8": "En het hele huis van Achab zal omkomen; en Ik zal van Achab uitroeien wie mannelijk is, ook wie in Israël opgesloten is en wie verlaten is.", "Hand 20:19": "Terwijl ik de Heere diende met alle nederigheid, en veel tranen, en beproevingen, die mij overkwamen door de aanslagen van de Joden;", "2 Kon 10:32": "In die dagen begon de HEERE Israël in te korten, want Hazaël sloeg hen in alle grensgebieden van Israël:", "Ps 112:3": "He. In zijn huis zullen bezit en rijkdom zijn; Vau. en zijn gerechtigheid houdt stand tot in eeuwigheid.", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "Ps 89:2": "Ik zal de goedertierenheid van de HEERE eeuwig zingen; ik zal Uw waarheid met mijn mond bekend maken, van geslacht tot geslacht.", "2 Kon 3:3": "Toch hield hij vast aan de zonden van Jerobeam, de zoon van Nebat, die Israël deed zondigen; hij week daarvan niet af.", "2 Kon 4:18": "Toen het kind groter werd, gebeurde het op een dag, dat het uitging naar zijn vader, naar de maaiers.", "2 Kon 13:23": "Doch de HEERE was hun genadig, en ontfermde Zich over hen, en wendde Zich tot hen, omwille van Zijn verbond met Abraham, Izak en Jakob; en Hij wilde hen niet verderven, en heeft hen niet verworpen van Zijn aangezicht, tot nu toe.", "2 Sam 7:13": "Die zal voor Mijn Naam een huis bouwen; en Ik zal de troon van zijn koninkrijk bevestigen tot in eeuwigheid.", "2 Kon 19:8": "Zo kwam Rabsake terug en trof de koning van Assyrië aan, strijdend tegen Libna; want hij had gehoord dat hij uit Lachis vertrokken was.", "Joh 8:26": "Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld.", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Jes 13:16": "Ook zullen hun kinderen voor hun ogen verpletterd worden; hun huizen zullen geplunderd, en hun vrouwen geschonden worden.", "2 Kon 11:1-3": "Toen Athalia, de moeder van Ahazia, zag dat haar zoon dood was, maakte zij zich op en bracht al het koninklijke nageslacht om. Maar Joseba, de dochter van koning Joram, de zuster van Ahazia, nam Joas, de zoon van Ahazia, en stal hem uit het midden van de zonen van de koning die gedood werden. Zij zette hem en zijn voedster in een slaapkamer en verborg hem voor Athalia, zodat hij niet gedood werd. En hij was met haar verborgen in het huis van de HEERE, zes jaar; en Athalia regeerde over het land.", "Openb 6:5-8": "En toen Het het derde zegel geopend had, hoorde ik het derde dier zeggen: Kom en zie! En ik zag, en zie, een zwart paard, en die daarop zat, had een weegschaal in zijn hand. En ik hoorde een stem in het midden van de vier dieren, die zei: Een maatje tarwe voor een penning, en drie maatjes gerst voor een penning; en beschadig de olie en de wijn niet. En toen Het het vierde zegel geopend had, hoorde ik een stem van het vierde dier, die zei: Kom en zie!", "1 Kon 10:9": "Geloofd zij de HEERE, uw God, Die behagen in u heeft gehad, om u op de troon van Israël te zetten! Omdat de HEERE Israël in eeuwigheid liefheeft, daarom heeft Hij u tot koning gesteld, om recht en gerechtigheid te doen.", "Ezech 16:60": "Toch zal Ik denken aan Mijn verbond met u, in de dagen van uw jeugd, en Ik zal met u een eeuwig verbond oprichten.", "Ps 89:9": "O HEERE, God van de heerscharen! Wie is als Gij, grootmachtig, o HEERE! en Uw getrouwheid is rondom U.", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "2 Kon 13:3": "Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen.", "Gen 18:29": "En hij ging voort tot Hem te spreken, en zei: Misschien zullen daar veertig gevonden worden! En Hij zei: Ik zal het niet doen omwille van de veertig.", "Ps 122:5": "Want daar staan de stoelen van het gericht, de stoelen van het huis van David.", "Jes 51:8": "Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslacht.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Neh 13:26": "Heeft Salomo, de koning van Israël, daarin niet gezondigd, hoewel er onder veel heidenvolken geen koning was zoals hij, en hij door zijn God bemind was, en God hem tot koning over heel Israël gesteld had? Ook hem lieten de vreemde vrouwen zondigen.", "Jer 29:10": "Want zo zegt de HEERE: Zeker, als er zeventig jaren te Babel vervuld zullen zijn, zal Ik u bezoeken, en Ik zal Mijn goede woord over u waarmaken, door u terug te brengen naar deze plaats.", "2 Kon 8:20-22": "In zijn dagen kwamen de Edomieten in opstand tegen het gezag van Juda, en stelden een koning over zich aan. Daarom trok Joram over naar Zaïr, en alle wagens met hem; en hij stond 's nachts op, en versloeg de Edomieten, die hem omsingeld hadden, en ook de aanvoerders van de wagens; en het volk vluchtte naar zijn tenten. De Edomieten bleven echter in opstand tegen het gezag van Juda, tot op deze dag; ook Libna kwam in dezelfde tijd in opstand.", "2 Kron 21:17": "Zij trokken op tegen Juda, braken erin door en voerden al het bezit weg dat in het huis van de koning gevonden werd, zelfs ook zijn kinderen en zijn vrouwen; zodat hem geen zoon overbleef, behalve Joahaz, de jongste van zijn zonen.", "1 Sam 16:12": "Toen stuurde hij iemand, en liet hem komen; hij nu was roodachtig, en had daarbij mooie ogen en een knap voorkomen; en de HEERE zei: Sta op, zalf hem, want deze is het.", "Jer 17:9": "Arglistig is het hart, meer dan enig ding, ja, dodelijk is het; wie zal het kennen?", "Hos 12:8-15": "In de hand van de koopman is een bedrieglijke weegschaal, hij houdt ervan te verdrukken; Nog zegt Efraïm: Toch ben ik rijk geworden, ik heb voor mij groot goed verkregen; in al mijn arbeid zullen zij mij geen ongerechtigheid vinden, die zonde zou zijn. Maar Ik ben de Heere, uw God, van Egypteland af; Ik zal u nog in tenten laten wonen, als in de dagen van het feest.", "Gen 9:16": "Als deze boog in de wolken zal zijn, dan zal Ik hem aanzien, om te gedenken aan het eeuwige verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.", "2 Kron 9:1": "En toen de koningin van Scheba het gerucht van Salomo hoorde, kwam zij naar Jeruzalem, om Salomo met raadsels op de proef te stellen, met een zeer groot leger, en kamelen die specerijen droegen, en veel goud, en kostbaar gesteente; en zij kwam bij Salomo, en sprak met hem over alles wat in haar hart was.", "1 Kon 11:36": "En aan zijn zoon zal Ik één stam geven; opdat Mijn dienaar David altijd een lamp voor Mijn aangezicht heeft in Jeruzalem, de stad die Ik Mij verkozen heb, om Mijn Naam daar te vestigen.", "2 Kor 1:20": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons.", "Ezech 14:20": "Ofschoon Noach, Daniël en Job in het midden daarvan waren, zo waarachtig als Ik leef, spreekt de Heere HEERE, als zij een zoon of een dochter zouden willen bevrijden, zouden zij alleen hun eigen ziel door hun gerechtigheid bevrijden.", "2 Kon 9:16-29": "Toen reed Jehu, en trok naar Jizreël; want Joram lag daar; en Ahazia, de koning van Juda, was afgekomen om Joram te bezoeken. De wachter nu stond op de toren te Jizreël, en zag de troep van Jehu, toen hij aankwam, en zei: Ik zie een troep. Toen zei Joram: Neem een ruiter, en stuur die hun tegemoet, en laat hij zeggen: Is het vrede? En de ruiter te paard ging hem tegemoet, en zei: Zo zegt de koning: Is het vrede? En Jehu zei: Wat hebt u met de vrede te maken? Kom achter mij. En de wachter meldde het, en zei: De bode is bij hen gekomen, maar hij komt niet terug.", "Pred 7:26": "En ik vond iets bitterders dan de dood: een vrouw, wier hart netten en garen, en haar handen boeien zijn; wie goed is voor Gods aangezicht, zal aan haar ontkomen; daarentegen zal de zondaar door haar gevangen worden.", "2 Kon 8:11-15": "En hij hield zijn gezicht strak, tot het schamen toe; en de man Gods weende. Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden. En Hazaël zei: Wat is uw dienaar toch, die een hond is, dat hij deze grote zaak zou doen? En Elisa zei: De HEERE heeft mij getoond dat u koning zult zijn over Syrië.", "Richt 2:1": "En een Engel van de HEERE kwam op van Gilgal naar Bochim, en Hij zei: Ik heb u uit Egypte opgevoerd, en u gebracht in het land dat Ik uw vaderen gezworen heb, en gezegd: Ik zal Mijn verbond met u niet verbreken in eeuwigheid.", "2 Kon 15:30": "En Hosea, de zoon van Ela, smeedde een samenzwering tegen Pekah, de zoon van Remalia, en sloeg hem neer, en doodde hem, en werd koning in zijn plaats; in het twintigste jaar van Jotham, de zoon van Uzzia.", "Richt 16:2": "Toen werd aan de inwoners van Gaza gezegd: Simson is hier binnengekomen; zo gingen zij rondom, en legden hem de hele nacht een hinderlaag bij de stadspoort; maar zij hielden zich de hele nacht stil, en zeiden: Tot aan het morgenlicht, dan zullen wij hem doden.", "2 Kon 12:17": "Toen trok Hazaël, de koning van Syrië, op, en streed tegen Gath, en nam het in; daarna richtte Hazaël zijn gezicht om tegen Jeruzalem op te trekken.", "2 Kon 3:11-13": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot. En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom. Maar Elisa zei tegen de koning van Israël: Wat heb ik met u te doen? Ga naar de profeten van uw vader, en naar de profeten van uw moeder. Doch de koning van Israël zei tegen hem: Nee, want de HEERE heeft deze drie koningen bij elkaar geroepen, om hen in de hand van de Moabieten te geven.", "Matt 24:7": "Want het ene volk zal tegen het andere volk opstaan, en het ene koninkrijk tegen het andere koninkrijk; en er zullen hongersnoden zijn, en pestilentiën, en aardbevingen op verschillende plaatsen.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Hos 10:14": "Daarom zal er een groot rumoer ontstaan onder uw volken, en al uw vestingen zullen verwoest worden, zoals Salman Beth-arbel verwoestte op de dag van de strijd; de moeder werd verpletterd met de zonen.", "2 Kon 4:31-35": "Gehazi nu was voor hen uit gegaan; en hij legde de staf op het gezicht van de jongen; maar er was geen stem, en geen teken van leven. Zo keerde hij terug hem tegemoet, en bracht hem de boodschap en zei: De jongen is niet wakker geworden. En toen Elisa het huis binnenkwam, zie, daar was de jongen dood, neergelegd op zijn bed. Zo ging hij naar binnen, en sloot de deur achter hen beiden toe, en bad tot de HEERE.", "2 Kon 7:2": "Maar een hoofdman, op wiens hand de koning leunde, antwoordde de man Gods, en zei: Zie, al zou de HEERE vensters in de hemel maken, zou die zaak dan kunnen gebeuren? En hij zei: Zie, u zult het met uw ogen zien, maar daarvan niet eten.", "Rom 11:27": "En dit is hun een verbond van Mij, als Ik hun zonden zal wegnemen.", "2 Kon 6:24": "En het gebeurde daarna, dat Benhadad, de koning van Syrië, zijn hele leger verzamelde, en optrok, en Samaria belegerde.", "1 Kon 22:3": "Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen.", "Joël 1:16": "Is niet het voedsel voor onze ogen afgesneden? Blijdschap en verheuging van het huis van onze God?", "Matt 15:26": "Maar Hij antwoordde en zei: Het is niet betamelijk het brood van de kinderen te nemen, en het aan de hondjes voor te werpen.", "Spr 22:25": "opdat u zijn paden niet leert, en een strik over uw ziel haalt.", "1 Kon 18:2": "En Elia ging heen om zich aan Achab te vertonen. En de honger was sterk in Samaria.", "Zach 9:11": "U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Ps 94:14": "Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.", "Luk 1:72": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken;", "Jes 37:35": "Want Ik zal deze stad beschermen om die te verlossen, omwille van Mijzelf, en omwille van David, Mijn knecht.", "2 Kon 1:4": "Daarom nu zegt de HEERE zo: U zult niet afkomen van dat bed waarop u geklommen bent, maar u zult zeker sterven. En Elia ging weg.", "1 Kon 20:34": "En hij zei tegen hem: De steden, die mijn vader van uw vader genomen heeft, zal ik teruggeven, en maak u straten in Damaskus, zoals mijn vader in Samaria gemaakt heeft. En ik, antwoordde Achab, zal u met dit verbond dan laten gaan. Zo sloot hij een verbond met hem, en liet hem gaan.", "Dan 9:4": "Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "1 Kon 11:4": "Want het gebeurde in de tijd van Salomo's ouderdom, dat zijn vrouwen zijn hart deden neigen naar andere goden; zodat zijn hart niet volkomen was met de HEERE, zijn God, zoals het hart van zijn vader David.", "Jer 14:17": "Daarom zult u dit woord tegen hen zeggen: Mijn ogen zullen van tranen neerdalen, nacht en dag, en niet ophouden; want de jonkvrouw, de dochter van Mijn volk, is gebroken met een grote breuk, een plaag die zeer smartelijk is.", "2 Kon 5:20-27": "Gehazi nu, de knecht van Elisa, de man van God, zei: Zie, mijn heer heeft Naäman, deze Syriër, ontzien, doordat hij niet uit zijn hand heeft aangenomen wat hij gebracht had; maar zo waarachtig als de HEERE leeft, ik zal hem achterna lopen, en zal iets van hem aannemen! Zo achtervolgde Gehazi Naäman. En toen Naäman zag dat hij hem achterna liep, sprong hij van de wagen af, hem tegemoet, en zei: Is alles goed? En hij zei: Het is goed; mijn heer heeft mij gestuurd, om te zeggen: Zie, zojuist zijn er twee jonge mannen uit de zonen van de profeten, van het gebergte van Efraïm, bij mij gekomen; geef hun toch een talent van het zilver en twee stellen kleren.", "Jer 32:39": "En Ik zal hun één hart en één weg geven, om Mij te vrezen alle dagen, hun ten goede, alsook hun kinderen na hen.", "Jes 30:6": "De last van de dieren, van het zuiden, naar het land van angst en van benauwdheid, waar de sterke leeuw en de oude leeuw is, de basilisk en de vurige vliegende draak; hun goederen zullen zij voeren op de rug van de veulens, en hun schatten op de bulten van de kamelen, naar het volk dat hun geen nut zal doen.", "Joz 21:45": "Er viel niet één woord weg van al de goede woorden, die de HEERE gesproken had tot het huis van Israël; het kwam allemaal uit.", "Ps 102:29": "De kinderen van Uw knechten zullen wonen, en hun nageslacht zal voor Uw aangezicht bevestigd worden.", "2 Sam 9:8": "Toen boog hij zich neer, en zei: Wat is uw knecht, dat u omgezien hebt naar een dode hond, zoals ik ben?", "2 Kon 7:17": "De koning nu had de hoofdman, op wiens hand hij leunde, aangesteld over die poort; en het volk vertrapte hem in de poort, zodat hij stierf, zoals de man Gods gesproken had, die het sprak toen de koning naar hem toe was gekomen.", "Gen 17:8": "En Ik zal u en uw nageslacht na u het land waar u als vreemdeling verblijft geven, het hele land Kanaän, tot eeuwig eigendom; en Ik zal hun tot een God zijn.", "Jes 11:5": "Want gerechtigheid zal de gordel van Zijn lendenen zijn; ook zal de trouw de gordel van Zijn lendenen zijn.", "Ps 119:136": "Waterbeken vlieten af uit mijn ogen, omdat zij Uw wet niet onderhouden.", "2 Kron 21:13": "maar hebt gewandeld in de weg van de koningen van Israël, en Juda en de inwoners van Jeruzalem overspel hebt laten plegen, naar het overspel van het huis van Achab, en ook uw broers, uit het huis van uw vader, gedood hebt, die beter waren dan u;", "Deut 4:31": "Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "1 Tim 5:8": "Maar als iemand voor de zijnen, en vooral voor zijn huisgenoten, niet zorgt, die heeft het geloof verloochend, en is erger dan een ongelovige.", "2 Kron 6:4-15": "En hij zei: Geloofd zij de HEERE, de God van Israël, Die met Zijn mond tot mijn vader David gesproken heeft, en het met Zijn handen vervuld heeft, en zei: Vanaf de dag dat Ik Mijn volk uit Egypteland uitgevoerd heb, heb Ik geen stad verkoren uit alle stammen van Israël om een huis te bouwen, dat Mijn Naam daar zou zijn; en geen man verkoren om een leider te zijn over Mijn volk Israël. Maar Ik heb Jeruzalem verkoren, dat Mijn Naam daar zou zijn; en Ik heb David verkoren, dat hij over Mijn volk Israël zou zijn.", "2 Kon 2:20-22": "En hij zei: Brengt mij een nieuwe schaal, en legt er zout in. En zij brachten ze naar hem toe. Toen ging hij naar de waterbron, en wierp het zout erin, en zei: Zo zegt de HEERE: Ik heb dit water gezond gemaakt, er zal geen dood noch onvruchtbaarheid meer van komen. Zo werd dat water gezond, tot op deze dag, naar het woord van Elisa, dat hij gesproken had.", "Deut 28:23": "En uw hemel, die boven uw hoofd is, zal koper zijn, en de aarde, die onder u is, zal ijzer zijn.", "Hebr 10:37": "want: Nog een heel klein tijdje en Hij, Die komen zal, zal komen, en niet uitblijven.", "2 Kron 22:6": "En hij keerde terug om zich te laten genezen te Jizreël; want hij had wonden, die men hem bij Rama geslagen had, toen hij streed tegen Hazaël, de koning van Syrië; en Azarja, de zoon van Joram, de koning van Juda, kwam af om Joram, de zoon van Achab, te Jizreël te bezoeken, want hij was ziek.", "2 Kon 8:24-29": "En Joram stierf en werd bij zijn voorvaderen begraven, in de stad van David; en Ahazia, zijn zoon, werd koning in zijn plaats. In het twaalfde jaar van Joram, de zoon van Achab, de koning van Israël, begon Ahazia, de zoon van Jehoram, de koning van Juda, te regeren. Ahazia was tweeëntwintig jaar oud toen hij koning werd, en regeerde één jaar in Jeruzalem; en de naam van zijn moeder was Athalia, de dochter van Omri, de koning van Israël.", "2 Kon 4:28": "En zij zei: Heb ik een zoon van mijn heer gevraagd? Zei ik niet: Bedrieg mij niet?", "2 Kron 22:4": "En hij deed wat kwaad was in de ogen van de HEERE, net als het huis van Achab; want zij waren zijn raadgevers, na de dood van zijn vader, tot zijn verderf.", "Matt 26:16": "En vanaf toen zocht hij een gelegenheid om Hem over te leveren.", "2 Kon 6:6": "En de man van God zei: Waar is het gevallen? En toen hij hem de plaats gewezen had, sneed hij een stuk hout af, en wierp het daarheen, en liet het ijzer boven drijven.", "Gen 21:1": "En de HEERE bezocht Sara, zoals Hij gezegd had; en de HEERE deed aan Sara, zoals Hij gesproken had.", "Hand 25:12": "Toen antwoordde Festus, nadat hij met de raad gesproken had: Hebt u zich op de keizer beroepen? U zult naar de keizer gaan.", "Luk 4:25": "Maar Ik zeg u naar waarheid: Er waren veel weduwen in Israël in de dagen van Elia, toen de hemel drie jaar en zes maanden gesloten was, zodat er grote hongersnood kwam over het hele land.", "Luk 1:54": "Hij heeft Israël, Zijn knecht, opgenomen, om Zijn barmhartigheid te gedenken,", "Ps 111:7-9": "Mem. De werken van Zijn handen zijn waarheid en oordeel; Nun. al Zijn bevelen zijn betrouwbaar. Samech. Ze zijn ondersteund voor altijd en in eeuwigheid; Ain. gedaan in waarheid en oprechtheid. Pe. Hij heeft Zijn volk verlossing gezonden; Tsade. Hij heeft Zijn verbond in eeuwigheid geboden; Koph. Zijn Naam is heilig en ontzagwekkend.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "Ps 145:1": "Een lofzang van David. Aleph. O mijn God, U Koning! Ik zal U verhogen, en Uw Naam loven voor eeuwig en altijd.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Luk 9:9": "En Herodes zei: Johannes heb ik onthoofd; wie is Deze dan, van Wie ik zulke dingen hoor? En hij probeerde Hem te zien.", "Matt 27:11-26": "En Jezus stond voor de stadhouder; en de stadhouder vroeg Hem: Bent U de Koning van de Joden? En Jezus zei tegen hem: U zegt het. En toen Hij door de overpriesters en de oudsten beschuldigd werd, antwoordde Hij niets. Toen zei Pilatus tegen Hem: Hoort U niet hoeveel zij tegen U getuigen?", "Micha 6:16": "Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen.", "Spr 3:33": "De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.", "2 Kon 4:16": "En hij zei: Op deze vastgestelde tijd, omtrent deze tijd van het jaar, zult u een zoon omhelzen. En zij zei: Nee, mijn heer, u, man Gods, lieg niet tegen uw dienares.", "2 Kon 1:6": "En zij zeiden tegen hem: Een man kwam ons tegemoet en zei tegen ons: Ga heen, keer terug naar de koning die u gezonden heeft, en zeg tegen hem: Zo zegt de HEERE: Is het omdat er geen God in Israël is, dat u stuurt om Baäl-Zebub, de god van Ekron, te vragen? Daarom zult u van dat bed waarop u geklommen bent, niet afkomen, maar u zult zeker sterven.", "Hand 16:30": "En hij bracht hen naar buiten en zei: Beste heren, wat moet ik doen om zalig te worden?", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Ps 119:65": "Teth. U hebt bij Uw knecht goed gedaan, HEERE, naar Uw woord.", "2 Kon 15:25": "En Pekah, de zoon van Remalia, zijn hoofdman, maakte een samenzwering tegen hem, en sloeg hem te Samaria neer, in het paleis van het huis van de koning, samen met Argob en Arje, en met hem vijftig mannen van de kinderen van de Gileadieten; zo doodde hij hem, en werd koning in zijn plaats.", "Hand 25:11": "Want als ik onrecht doe en iets gedaan heb dat de dood verdient, weiger ik niet te sterven; maar als er niets waar is van wat dezen mij beschuldigen, kan niemand mij uit gunst aan hen overgeven. Ik beroep mij op de keizer.", "Jes 56:11": "En deze honden zijn sterk van begeerte, zij kunnen niet verzadigd worden, ja, het zijn herders die niets kunnen begrijpen; zij keren zich allemaal naar hun eigen weg, ieder naar zijn eigen winst, elk uit zijn eigen hoek.", "2 Kon 21:9": "Maar zij luisterden niet; want Manasse deed hen dwalen, zodat zij erger deden dan de heidenvolken, die de HEERE voor de kinderen van Israël weggevaagd had.", "Lev 26:20": "En uw macht zal voor niets verbruikt worden; en uw land zal zijn opbrengst niet geven, en het geboomte van het land zal zijn vrucht niet geven.", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "2 Kon 3:7": "En hij ging op weg, en zond een bode naar Josafat, de koning van Juda, en zei: De koning van de Moabieten is van mij afgevallen; wilt u met mij optrekken in de oorlog tegen de Moabieten? En hij zei: Ik zal opkomen; ik zal zijn zoals u bent, mijn volk als uw volk, mijn paarden als uw paarden.", "1 Kon 22:48": "Toen was er geen koning in Edom, maar een stadhouder van de koning.", "Spr 22:24": "Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man;", "Ps 105:8": "Hij gedenkt Zijn verbond tot in eeuwigheid, het woord dat Hij ingesteld heeft, tot in duizend geslachten;", "Hagg 1:11": "Want Ik heb een droogte geroepen over het land, en over de bergen, en over het koren, en over de most, en over de olie, en over wat de aardbodem zou voortbrengen; ook over de mensen, en over de dieren, en over alle arbeid van de handen.", "Ezech 11:25": "En ik sprak tot de weggevoerde gevangenen al de woorden van de HEERE, die Hij mij had laten zien.", "2 Kron 22:5": "Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.", "2 Kon 13:14": "Elisa nu was ziek geweest van zijn ziekte, waaraan hij stierf; en Joas, de koning van Israël, was naar hem toe gekomen, en had geweend over zijn aangezicht, en gezegd: Mijn vader, mijn vader, wagen van Israël en zijn ruiters!", "2 Kon 8:7-10": "Daarna kwam Elisa in Damaskus, toen Benhadad, de koning van Syrië, ziek was; en men vertelde hem: De man Gods is hierheen gekomen. Toen zei de koning tegen Hazaël: Neem een geschenk mee, en ga de man Gods tegemoet, en vraag door hem de HEERE: Zal ik van deze ziekte genezen? Zo ging Hazaël hem tegemoet, en nam een geschenk mee, namelijk al het goede van Damaskus, een last van veertig kamelen; en hij kwam, en stond voor hem, en zei: Uw zoon Benhadad, de koning van Syrië, heeft mij naar u gezonden om te vragen: Zal ik van deze ziekte genezen?", "2 Kron 19:2": "En Jehu, de zoon van Hanani, de ziener, ging naar buiten, hem tegemoet, en zei tegen koning Josafat: Zou u de goddeloze helpen, en hen liefhebben die de HEERE haten? Daarom is er nu van het aangezicht van de HEERE grote toorn over u.", "Amos 2:6-16": "Zo zegt de HEERE: Om drie overtredingen van Israël, en om vier zal Ik dat niet afwenden; omdat zij de rechtvaardige voor geld verkopen, en de arme om een paar schoenen. Die ernaar hijgen dat het stof van de aarde op het hoofd van de armen is, en de weg van de zachtmoedigen verdraaien; en de man en zijn vader gaan naar een jonge dochter om Mijn heilige Naam te ontheiligen. En zij leggen zich neer bij elk altaar op de verpande klederen, en drinken de wijn van de beboeten in het huis van hun goden.", "2 Kon 15:10-14": "En Sallum, de zoon van Jabes, maakte een samenzwering tegen hem, en sloeg hem voor het volk neer, en doodde hem; en hij werd koning in zijn plaats. Het overige nu van de geschiedenis van Zacharia, zie, dat is geschreven in het boek van de kronieken van de koningen van Israël. Dit was het woord van de HEERE, dat Hij tot Jehu gesproken had: Uw zonen zullen tot het vierde geslacht op de troon van Israël zitten; en zo is het gebeurd.", "Lev 26:44": "En hierboven is dit ook: als zij in het land van hun vijanden zullen zijn, zal Ik hen niet verwerpen, en ook niet van hen walgen, om een einde aan hen te maken en Mijn verbond met hen te vernietigen; want Ik ben de HEERE, hun God!", "Gen 41:39": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.", "1 Kon 22:54": "En hij diende Baäl, en boog zich voor hem neer, en tergde de HEERE, de God van Israël, naar alles wat zijn vader gedaan had.", "2 Kon 9:15": "maar de koning Joram was teruggekeerd om zich in Jizreël te laten genezen van de verwondingen die de Syriërs hem toegebracht hadden, toen hij streed tegen Hazaël, de koning van Syrië.) En Jehu zei: Als dit uw wens is, laat dan niemand uit de stad ontkomen, die dit in Jizreël zou gaan vertellen.", "Gen 41:28": "Dit is het woord dat ik tot Farao gesproken heb: wat God gaat doen, heeft Hij Farao getoond.", "Jer 33:26": "Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen.", "1 Kon 14:16": "En Hij zal Israël overgeven, vanwege de zonden van Jerobeam, die gezondigd heeft, en die Israël heeft doen zondigen.", "Jer 33:21": "Dan zou ook Mijn verbond met Mijn knecht David verbroken kunnen worden, zodat hij geen zoon heeft die op zijn troon regeert, en met de Levieten, de priesters, Mijn dienaren.", "Rom 11:29": "Want de genadegiften en de roeping van God zijn onberouwelijk.", "Klaagl 5:11": "Zij hebben de vrouwen in Sion verkracht, en de jonge dochters in de steden van Juda.", "2 Kron 22:10-12": "Toen Athalia, de moeder van Ahazia, zag dat haar zoon dood was, maakte zij zich op en bracht heel het koninklijke nageslacht van het huis van Juda om. Maar Jozabath, de dochter van de koning, nam Joas, de zoon van Ahazia, en stal hem uit het midden van de zonen van de koning die gedood werden, en zette hem en zijn voedster in een slaapkamer; zo verborg Jozabath, de dochter van koning Joram, de vrouw van de priester Jojada (want zij was de zuster van Ahazia), hem voor Athalia, zodat zij hem niet doodde. En hij was bij hen verborgen in het huis van God, zes jaar; en Athalia regeerde over het land.", "Hos 11:5": "Hij zal niet terugkeren naar het land Egypte; maar Assur, die zal zijn koning zijn; omdat zij weigerden zich te bekeren.", "Ps 89:3": "Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd:", "Deut 7:4": "Want zij zouden uw zonen van Mij doen afwijken, zodat zij andere goden zouden dienen; en de toorn van de HEERE zou tegen u ontsteken, en u snel verdelgen.", "Deut 28:24": "De HEERE, uw God, zal stof en poeder tot regen van uw land geven; vanuit de hemel zal het op u neerdalen, totdat u verdelgd wordt.", "2 Kon 3:27": "Toen nam hij zijn eerstgeboren zoon, die in zijn plaats koning zou worden, en offerde hem als brandoffer op de muur. Daaruit kwam een zeer grote toorn over Israël; daarom trokken zij van hem weg, en keerden terug naar hun land.", "Jer 17:2": "Zoals hun kinderen aan hun altaren denken, en aan hun bossen, bij het groene geboomte, op de hoge heuvels.", "Hagg 1:10": "Daarom onthouden de hemelen zich boven u van dauw, en het land onthoudt zijn vruchten.", "Ps 40:11": "Uw gerechtigheid bedek ik niet in het midden van mijn hart; Uw waarheid en Uw heil spreek ik uit; Uw weldadigheid en Uw trouw verheel ik niet in de grote gemeente.", "Ezech 5:16": "Wanneer Ik de boze pijlen van de honger tegen hen uitzenden zal, die tot verderf zullen zijn, die Ik uitzenden zal om u te verderven; zo zal Ik de honger over u vermeerderen, en u de staf van het brood breken.", "1 Kron 28:1": "Toen verzamelde David alle leiders van Israël in Jeruzalem: de leiders van de stammen, de leiders van de afdelingen die de koning dienden bij toerbeurt, de leiders over de duizenden, de leiders over de honderden, de beheerders over alle bezittingen en het vee van de koning en zijn zonen, met de hovelingen, de helden en alle dappere mannen.", "2 Sam 24:13": "Zo kwam Gad bij David, en maakte het hem bekend, en zei tegen hem: Zal er een hongersnood van zeven jaar in uw land tot u komen? Of wilt u drie maanden vluchten voor uw vijanden, terwijl zij u achtervolgen? Of dat er drie dagen pestilentie in uw land is? Merk nu op, en zie toe, wat antwoord ik terug moet brengen aan Hem die mij gezonden heeft.", "Jer 32:40": "En Ik zal een eeuwig verbond met hen sluiten, dat Ik Mij van achter hen niet zal afkeren, opdat Ik hun goeddoe; en Ik zal Mijn vrees in hun hart geven, zodat zij niet van Mij afwijken.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Ruth 2:3": "Zo ging zij heen, en kwam en las op in het veld, achter de maaiers; en het overkwam haar bij toeval dat zij terechtkwam op een deel van het veld van Boaz, die uit het geslacht van Elimelech was.", "2 Kron 18:31": "Het gebeurde dan, toen de aanvoerders van de wagens Josafat zagen, dat zij zeiden: Dat is de koning van Israël; en zij trokken om hem heen om te strijden; maar Josafat riep, en de HEERE hielp hem, en God bracht hen ertoe van hem weg te trekken.", "Jes 17:3-11": "En de vesting zal ophouden in Efraïm, en het koninkrijk in Damaskus, en het overblijfsel van de Syriërs; zij zullen zijn als de heerlijkheid van de kinderen van Israël, spreekt de HEERE van de heerscharen. En het zal op die dag gebeuren, dat de heerlijkheid van Jakob verminderd zal worden, en dat de vettigheid van zijn vlees mager zal worden. Want het zal zijn zoals wanneer een maaier het staande koren verzamelt, en met zijn arm aren afmaait; ja, het zal zijn zoals wanneer iemand aren leest in het dal Refraïm.", "1 Kon 22:31-33": "De koning van Syrië nu had zijn tweeëndertig aanvoerders van de wagens geboden en gezegd: U zult niet vechten tegen klein of groot, maar alleen tegen de koning van Israël. Het gebeurde dan, toen de aanvoerders van de wagens Josafat zagen, dat zij zeiden: Zeker, dat is de koning van Israël; en zij keerden zich naar hem toe om te strijden; maar Josafat riep het uit. En het gebeurde, toen de aanvoerders van de wagens zagen dat hij de koning van Israël niet was, dat zij zich van hem afkeerden en niet meer achtervolgden.", "1 Kon 11:26-37": "Verder kwam Jerobeam, de zoon van Nebat, een Efrathiet uit Zereda, dienaar van Salomo (wiens moeder Zerua heette, een weduwe), ook tegen de koning in opstand. Dit is nu de zaak waarom hij tegen de koning in opstand kwam. Salomo bouwde Millo, en herstelde de bres in de stad van zijn vader David. De man Jerobeam was een dapper held. Toen Salomo deze jongeman zag, dat hij hard werkte, stelde hij hem aan over al de lastdienst van het huis van Jozef.", "Gen 9:15": "dan zal Ik Mijn verbond gedenken, dat er is tussen Mij en tussen u, en tussen alle levende ziel van alle vlees; en het water zal niet meer worden tot een vloed, om alle vlees te verderven.", "2 Kron 21:7": "Doch de HEERE wilde het huis van David niet te gronde richten, omwille van het verbond dat Hij met David gesloten had; en zoals Hij gezegd had hem en zijn zonen voor altijd een lamp te zullen geven.", "2 Kon 15:16": "Toen sloeg Menahem Tifsah, met allen die daarin waren, ook haar gebied vanaf Thirza af; omdat men niet voor hem had opengedaan, sloeg hij hen; al haar zwangere vrouwen sneed hij open.", "2 Kor 6:14-17": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis? En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige? Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "1 Kon 22:53": "En hij deed wat kwaad was in de ogen van de HEERE; want hij wandelde in de weg van zijn vader, en in de weg van zijn moeder, en in de weg van Jerobeam, de zoon van Nebat, die Israël deed zondigen.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Ezech 4:17": "Opdat zij gebrek hebben aan brood en water, en de een met de ander verbaasd worden, en in hun ongerechtigheid wegkwijnen.", "1 Sam 25:8": "Vraag het uw jongemannen, en zij zullen het u vertellen. Laat dan deze jongemannen genade vinden in uw ogen, want wij zijn op een goede dag gekomen; geef toch uw knechten, en uw zoon David, wat uw hand vinden zal.", "1 Kon 21:25": "Doch er was niemand geweest zoals Achab, die zichzelf verkocht had om te doen wat kwaad is in de ogen van de HEERE, omdat Izebel, zijn vrouw, hem ophitste.", "2 Kron 22:3-5": "Hij wandelde ook in de wegen van het huis van Achab; want zijn moeder was zijn raadgeefster, om goddeloos te handelen. En hij deed wat kwaad was in de ogen van de HEERE, net als het huis van Achab; want zij waren zijn raadgevers, na de dood van zijn vader, tot zijn verderf. Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.", "Rom 3:3": "Want wat is het, al zijn sommigen ongelovig geweest? Zal hun ongeloof het geloof van God tenietdoen?", "Hos 1:1-9": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël. Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan. Zo ging hij heen, en nam Gomer, een dochter van Diblaim; en zij ontving, en baarde hem een zoon.", "Hos 4:9": "Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden.", "Deut 7:3": "U zult zich ook niet met hen verzwageren; uw dochters zult u niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen.", "2 Kron 18:1": "Josafat had rijkdom en eer in overvloed; en hij verzwagerde zich aan Achab.", "Luk 12:1": "Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.", "1 Kon 11:34": "Toch zal Ik niets van dit koninkrijk uit zijn hand nemen; maar Ik stel hem tot vorst al de dagen van zijn leven, omwille van Mijn dienaar David, die Ik verkozen heb, die Mijn geboden en Mijn inzettingen gehouden heeft.", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "1 Kon 18:13": "Is mijn heer niet verteld wat ik gedaan heb, toen Izebel de profeten van de HEERE doodde? Dat ik van de profeten van de HEERE honderd man heb verborgen, elk vijftig man in een grot, en hen met brood en water heb onderhouden?", "2 Kron 21:6-13": "En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want hij had de dochter van Achab tot vrouw; en hij deed wat slecht was in de ogen van de HEERE. Doch de HEERE wilde het huis van David niet te gronde richten, omwille van het verbond dat Hij met David gesloten had; en zoals Hij gezegd had hem en zijn zonen voor altijd een lamp te zullen geven. In zijn dagen kwamen de Edomieten in opstand tegen het gezag van Juda, en zij stelden een koning over zich aan.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Micha 7:20": "U zult Jakob de trouw, Abraham de goedertierenheid geven, die U onze vaderen van oude dagen af gezworen hebt.", "Matt 24:35": "De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "Joz 11:11": "En zij versloegen alle mensen die daarin waren, met de scherpte van het zwaard, ze met de ban treffend; er bleef niets over dat adem had; en Hazor verbrandde hij met vuur.", "1 Kon 22:4": "Daarna zei hij tegen Josafat: Zult u met mij optrekken naar de strijd bij Ramoth in Gilead? En Josafat zei tegen de koning van Israël: Ik zal zijn zoals u bent, mijn volk zoals uw volk, mijn paarden zoals uw paarden.", "Ps 89:25": "En Mijn getrouwheid en Mijn goedertierenheid zullen met hem zijn; en zijn hoorn zal in Mijn Naam verhoogd worden.", "Jer 4:19": "O mijn binnenste, mijn binnenste! ik heb weeën, o wanden van mijn hart! Mijn hart maakt getier in mij, ik kan niet zwijgen; want u, mijn ziel! hoort het geluid van de bazuin en het krijgsgeschreeuw.", "Jer 31:36": "Als deze ordeningen van voor Mijn aangezicht zullen wijken, spreekt de HEERE, dan zal ook het nageslacht van Israël ophouden een volk te zijn voor Mijn aangezicht, alle dagen.", "Gen 37:36": "En de Midianieten verkochten hem in Egypte, aan Potifar, een hoveling van de farao, leider van de lijfwacht.", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "1 Sam 26:17": "Saul nu herkende de stem van David, en zei: Is dit uw stem, mijn zoon David? David zei: Het is mijn stem, mijn heer koning!", "Klaagl 5:5": "Wij worden vervolgd, met een juk op onze nek; zijn wij moe, men laat ons geen rust.", "Ps 103:18": "Over hen die Zijn verbond houden, en die aan Zijn bevelen denken, om die te doen.", "Ezech 14:16": "Al waren die drie mannen in het midden daarvan, zo waarachtig als Ik leef, spreekt de Heere HEERE, zij zouden zonen noch dochters bevrijden, zij zelf alleen zouden bevrijd worden, maar het land zou woest worden.", "2 Kon 13:3-7": "Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen. Doch Joahaz bad het aangezicht van de HEERE met ernst aan; en de HEERE verhoorde hem; want Hij zag de verdrukking van Israël, dat de koning van Syrië hen verdrukte. (Zo gaf de HEERE Israël een verlosser, zodat zij van onder de hand van de Syriërs uitkwamen; en de kinderen van Israël woonden in hun tenten, zoals voorheen.", "2 Sam 16:9": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen.", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "2 Kon 4:17": "En de vrouw werd zwanger, en baarde een zoon op die vastgestelde tijd, omtrent de tijd van het jaar, die Elisa tegen haar gesproken had.", "2 Kon 5:25": "Daarna kwam hij binnen, en ging voor zijn heer staan. En Elisa zei tegen hem: Waar kom je vandaan, Gehazi? En hij zei: Uw knecht is nergens heen geweest.", "Deut 28:38-40": "U zult veel zaad naar de akker uitbrengen, maar u zult weinig inzamelen; want de sprinkhaan zal het opeten. Wijngaarden zult u planten en bewerken, maar u zult geen wijn drinken, noch iets vergaren; want de worm zal het opeten. Olijfbomen zult u hebben binnen al uw grondgebied, maar u zult u met olie niet zalven; want uw olijfboom zal zijn vrucht afwerpen.", "2 Kon 5:27": "Daarom zal de melaatsheid van Naäman u aankleven, en uw nageslacht voor eeuwig! Toen ging hij van voor zijn aangezicht weg, melaats, wit als de sneeuw.", "Openb 8:4": "En de rook van het reukwerk steeg, met de gebeden van de heiligen, op uit de hand van de engel voor God.", "1 Sam 15:32": "Toen zei Samuël: Breng Agag, de koning van de Amalekieten, hier bij mij. Agag nu ging vol vertrouwen naar hem toe; en Agag zei: Voorwaar, de bitterheid van de dood is geweken!", "Spr 11:21": "Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.", "Jer 33:14": "Zie, de dagen komen, spreekt de HEERE, dat Ik het goede woord zal vervullen, dat Ik tot het huis van Israël en over het huis van Juda gesproken heb.", "1 Kon 20:13-28": "En zie, een profeet trad naar Achab, de koning van Israël, en zei: Zo zegt de HEERE: Hebt u al deze grote menigte gezien? Zie, Ik zal ze heden in uw hand geven, opdat u weet, dat Ik de HEERE ben. En Achab zei: Door wie? En hij zei: Zo zegt de HEERE: Door de jongens van de leiders van de landschappen. En hij zei: Wie zal de strijd aanbinden? En hij zei: U. Toen telde hij de jongens van de leiders van de landschappen, en zij waren tweehonderdtwee en dertig; en na hen telde hij al het volk, alle kinderen van Israël, zevenduizend.", "2 Kon 11:1": "Toen Athalia, de moeder van Ahazia, zag dat haar zoon dood was, maakte zij zich op en bracht al het koninklijke nageslacht om.", "Richt 21:11": "Doch dit is de zaak die u doen zult: al wat mannelijk is, en alle vrouwen die gemeenschap met een man gehad hebben, zult u met de ban slaan.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "2 Kon 6:12": "En een van zijn knechten zei: Nee, mijn heer koning! Maar Elisa, de profeet die in Israël is, laat de koning van Israël de woorden weten die u in uw binnenste slaapkamer spreekt.", "Ps 36:6": "O HEERE! Uw goedertierenheid is tot in de hemelen; Uw waarheid tot de bovenste wolken toe.", "Richt 3:3": "Vijf vorsten van de Filistijnen, en al de Kanaänieten, en de Sidoniërs, en de Hevieten, die woonden in het gebergte van de Libanon, van de berg Baäl-Hermon tot waar men bij Hamath komt.", "Luk 1:73": "en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven", "2 Kon 8:11-13": "En hij hield zijn gezicht strak, tot het schamen toe; en de man Gods weende. Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden. En Hazaël zei: Wat is uw dienaar toch, die een hond is, dat hij deze grote zaak zou doen? En Elisa zei: De HEERE heeft mij getoond dat u koning zult zijn over Syrië.", "Amos 5:17": "Ja, in alle wijngaarden zal rouwklacht zijn; want Ik zal door uw midden trekken, zegt de HEERE.", "2 Kron 22:2": "Ahazia was tweeënveertig jaar oud toen hij koning werd, en hij regeerde een jaar in Jeruzalem; en de naam van zijn moeder was Athalia, een dochter van Omri.", "Jes 3:1-8": "Want zie, de Heere, HEERE van de heerscharen, zal van Jeruzalem en van Juda wegnemen de stok en de staf, elke stok van het brood, en elke stok van het water; De held en de krijgsman, de rechter en de profeet, en de waarzegger, en de oude; De leider van vijftig, en de aanzienlijke, en de raadsman, en de wijze onder de werkmeesters, en hem die welbespraakt is.", "Gen 21:13": "Maar Ik zal ook de zoon van deze slavin tot een volk maken, omdat hij uw nageslacht is.", "1 Sam 12:22": "Want de HEERE zal Zijn volk niet verlaten, omwille van Zijn grote Naam, omdat het de HEERE behaagd heeft, u tot een volk voor Zichzelf te maken.", "Neh 9:7": "U bent die HEERE, de God, Die Abram hebt verkoren, en hem uit Ur der Chaldeeën uitgevoerd; en U hebt zijn naam gesteld Abraham.", "2 Kon 8:1-3": "Elisa had tegen de vrouw gesproken, van wie hij de zoon levend gemaakt had. Hij zei: Maak u klaar, en ga weg, u en uw huisgezin, en woon als vreemdeling waar u maar wonen kunt; want de HEERE heeft een hongersnood aangekondigd, die ook zeven jaar lang over het land zal komen. En de vrouw had zich klaargemaakt en had gedaan naar het woord van de man Gods; zij was met haar huisgezin weggegaan, en had als vreemdeling gewoond in het land van de Filistijnen, zeven jaar lang. En het gebeurde na het einde van de zeven jaar, dat de vrouw uit het land van de Filistijnen terugkeerde; en zij ging naar de koning om te smeken voor haar huis en voor haar akker.", "1 Kon 15:28": "En Baësa doodde hem, in het derde jaar van Asa, de koning van Juda, en werd koning in zijn plaats."}, "noten": {"1": "SV volgt de grondtekst (Ketiv): \"u zult niet genezen\". De Qere-lezing en veel vertalingen hebben \"zeg hém: u zult zeker genezen\" (ironisch bedoeld); de uitkomst is gelijk — Benhadad sterft."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H477\">Elisa</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H477\">had</span> tegen <span class=\"wl\" data-l=\"L3\" data-code=\"H802\">de</span> <span class=\"wl\
