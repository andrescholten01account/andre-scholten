 Gehazi, de knecht van de man Gods, en zei: Vertel mij toch al de grote dingen die Elisa gedaan heeft.","5":"En het gebeurde, terwijl hij de koning vertelde hoe hij een dode levend gemaakt had, zie, dat de vrouw, van wie hij de zoon levend gemaakt had, tot de koning smeekte voor haar huis en voor haar akker. Toen zei Gehazi: Mijn heer koning! Dit is de vrouw, en dit is haar zoon, die Elisa levend gemaakt heeft.","6":"En de koning ondervroeg de vrouw, en zij vertelde het hem. Toen gaf de koning haar een kamerling mee, en zei: Zorg dat zij alles terugkrijgt wat van haar was, en ook alle opbrengsten van de akker, vanaf de dag dat zij het land verlaten heeft tot nu toe.","7":"Daarna kwam Elisa in Damaskus, toen Benhadad, de koning van Syrië, ziek was; en men vertelde hem: De man Gods is hierheen gekomen.","8":"Toen zei de koning tegen Hazaël: Neem een geschenk mee, en ga de man Gods tegemoet, en vraag door hem de HEERE: Zal ik van deze ziekte genezen?","9":"Zo ging Hazaël hem tegemoet, en nam een geschenk mee, namelijk al het goede van Damaskus, een last van veertig kamelen; en hij kwam, en stond voor hem, en zei: Uw zoon Benhadad, de koning van Syrië, heeft mij naar u gezonden om te vragen: Zal ik van deze ziekte genezen?","10":"En Elisa zei tegen hem: Ga, zeg hem: U zult beslist niet genezen[1]; want de HEERE heeft mij getoond dat hij zeker zal sterven.","11":"En hij hield zijn gezicht strak, tot het schamen toe; en de man Gods weende.","12":"Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden.","13":"En Hazaël zei: Wat is uw dienaar toch, die een hond is, dat hij deze grote zaak zou doen? En Elisa zei: De HEERE heeft mij getoond dat u koning zult zijn over Syrië.","14":"Zo ging hij weg van Elisa, en kwam bij zijn heer, die tegen hem zei: Wat heeft Elisa u gezegd? En hij zei: Hij heeft mij gezegd: U zult zeker genezen.","15":"En het gebeurde de volgende dag, dat hij een deken nam, en in het water doopte, en over zijn gezicht uitspreidde, zodat hij stierf; en Hazaël werd koning in zijn plaats.","16":"In het vijfde jaar van Joram, de zoon van Achab, de koning van Israël, toen Josafat koning was van Juda, begon Jehoram, de zoon van Josafat, de koning van Juda, te regeren.","17":"Hij was tweeëndertig jaar oud toen hij koning werd, en hij regeerde acht jaar in Jeruzalem.","18":"En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want de dochter van Achab was zijn vrouw geworden; en hij deed wat slecht was in de ogen van de HEERE.","19":"Toch wilde de HEERE Juda niet verderven, omwille van David, Zijn dienaar; zoals Hij hem gezegd had dat Hij hem altijd een lamp zou geven voor zijn zonen.","20":"In zijn dagen kwamen de Edomieten in opstand tegen het gezag van Juda, en stelden een koning over zich aan.","21":"Daarom trok Joram over naar Zaïr, en alle wagens met hem; en hij stond 's nachts op, en versloeg de Edomieten, die hem omsingeld hadden, en ook de aanvoerders van de wagens; en het volk vluchtte naar zijn tenten.","22":"De Edomieten bleven echter in opstand tegen het gezag van Juda, tot op deze dag; ook Libna kwam in dezelfde tijd in opstand.","23":"Het overige van de geschiedenis van Joram, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?","24":"En Joram stierf en werd bij zijn voorvaderen begraven, in de stad van David; en Ahazia, zijn zoon, werd koning in zijn plaats.","25":"In het twaalfde jaar van Joram, de zoon van Achab, de koning van Israël, begon Ahazia, de zoon van Jehoram, de koning van Juda, te regeren.","26":"Ahazia was tweeëntwintig jaar oud toen hij koning werd, en regeerde één jaar in Jeruzalem; en de naam van zijn moeder was Athalia, de dochter van Omri, de koning van Israël.","27":"En hij ging de weg van het huis van Achab, en deed wat slecht was in de ogen van de HEERE, zoals het huis van Achab; want hij was een schoonzoon van het huis van Achab.","28":"En hij trok met Joram, de zoon van Achab, ten strijde tegen Hazaël, de koning van Syrië, naar Ramoth in Gilead; en de Syriërs verwondden Joram.","29":"Toen keerde koning Joram terug, om zich in Jizreël te laten genezen van de verwondingen die de Syriërs hem in Rama toegebracht hadden, toen hij tegen Hazaël, de koning van Syrië, streed; en Ahazia, de zoon van Jehoram, de koning van Juda, kwam naar Jizreël om Joram, de zoon van Achab, te bezoeken, want hij was ziek."},"SV":{"1":"Elisa nu had gesproken tot die vrouw, welker zoon hij levend gemaakt had, zeggende: Maak u op, en ga heen, gij en uw huisgezin, en verkeer als vreemdeling, waar gij verkeren kunt; want de HEERE heeft een honger geroepen, die ook in het land zeven jaren komen zal.","2":"En de vrouw had zich opgemaakt, en had gedaan naar het woord van den man Gods; want zij was gegaan met haar huisgezin, en had als vreemdeling verkeerd in het land der Filistijnen, zeven jaren.","3":"En het geschiedde met het einde der zeven jaren, dat de vrouw uit het land der Filistijnen wederkeerde; en zij ging uit, dat zij tot den koning riep, om haar huis en om haar akker.","4":"De koning nu sprak tot Gehazi, den jongen van den man Gods, zeggende: Vertel mij toch al de grote dingen, die Elisa gedaan heeft.","5":"En het geschiedde, als hij den koning vertelde, hoe hij een dode had levend gemaakt, ziet, zo riep de vrouw, welker zoon hij levend gemaakt had, tot den koning, om haar huis en om haar akker. Toen zeide Gehazi: Mijn heer koning! Dit is de vrouw, en dit is haar zoon, dien Elisa heeft levend gemaakt.","6":"En de koning ondervraagde de vrouw, en zij vertelde het hem. Toen gaf de koning haar een kamerling, zeggende: Doe *haar* wederhebben alles, wat het hare was, daartoe alle inkomsten des akkers, van den dag af, dat zij het land verlaten heeft, tot nu toe.","7":"Daarna kwam Elisa te Damaskus, als Benhadad, de koning van Syrië, krank was; en men boodschapte hem, zeggende: De man Gods is herwaarts gekomen.","8":"Toen zeide de koning tot Hazaël: Neem een geschenk in uw hand, en ga den man Gods tegemoet; en vraag door hem den HEERE, zeggende: Zal ik van deze krankheid genezen?","9":"Zo ging Hazaël hem tegemoet, en nam een geschenk in zijn hand, te weten, alle goed van Damaskus, een last van veertig kemelen; en hij kwam, en stond voor zijn aangezicht, en zeide: Uw zoon Benhadad, de koning van Syrië, heeft mij tot u gezonden, om te zeggen: Zal ik van deze krankheid genezen?","10":"En Elisa zeide tot hem: Ga, zeg, gij zult ganselijk niet genezen; want de HEERE heeft mij getoond, dat hij den dood sterven zal.","11":"En hij hield zijn gezicht staande, en zette het vast tot schamens toe; en de man Gods weende.","12":"Toen zeide Hazaël: Waarom weent mijn heer? En hij zeide: omdat ik weet, wat kwaad gij den kinderen Israëls doen zult; gij zult hun sterkten in het vuur zetten, en hun jonge manschap met het zwaard doden, en hun jonge kinderen verpletteren, en hun zwangere vrouwen opensnijden.","13":"En Hazaël zeide: Maar wat is uw knecht, die een hond is, dat hij deze grote zaak doen zou? En Elisa zeide: De HEERE heeft mij getoond, dat gij koning zijn zult over Syrië.","14":"Zo ging hij weg van Elisa, en kwam tot zijn heer, die tot hem zeide: Wat heeft Elisa tot u gezegd? En hij zeide: Hij heeft tot mij gezegd: Gij zult zekerlijk genezen.","15":"En het geschiedde des anderen daags, dat hij een deken nam, en in het water doopte, en over zijn aangezicht uitspreidde, dat hij stierf; en Hazaël werd koning in zijn plaats.","16":"In het vijfde jaar nu van Joram, den zoon van Achab, den koning van Israël, toen Josafat koning was van Juda, *begon* Jehoram, de zoon van Josafat, den koning van Juda, te regeren.","17":"Hij was twee en dertig jaren oud, toen hij koning werd, en hij regeerde acht jaren te Jeruzalem.","18":"En hij wandelde op den weg der koningen van Israël, gelijk als het huis van Achab deed; want de dochter van Achab was hem ter vrouw geworden; en hij deed dat kwaad was in de ogen des HEEREN.","19":"Doch de HEERE wilde Juda niet verderven, om Davids Zijns knechts wil; gelijk als Hij hem gezegd had, dat Hij hem te allen tijde voor zijn zonen een lamp zou geven.","20":"In zijn dagen vielen de Edomieten van onder het gebied van Juda af, en maakten een koning over zich.","21":"Daarom toog Joram over naar Zair, en al de wagenen met hem; en hij maakte zich des nachts op, en sloeg de Edomieten, die rondom hem waren, daartoe de oversten der wagenen; en het volk vlood in zijn hutten.","22":"De Edomieten evenwel vielen van onder het gebied van Juda af, tot op dezen dag; toen viel Libna af in denzelfden tijd.","23":"Het overige nu der geschiedenissen van Joram, en alles wat hij gedaan heeft, is dat niet geschreven in het boek der kronieken der koningen van Juda?","24":"En Joram ontsliep met zijn vaderen, en werd begraven bij zijn vaderen, in de stad Davids; en Ahazia, zijn zoon, werd koning in zijn plaats.","25":"In het twaalfde jaar van Joram, den zoon van Achab, den koning van Israël, *begon* Ahazia, de zoon van Jeroham, den koning van Juda, te regeren.","26":"Twee en twintig jaren was Ahazia oud, als hij koning werd, en regeerde een jaar te Jeruzalem; en de naam zijner moeder was Athalia, de dochter van Omri, den koning van Israël.","27":"En hij wandelde in den weg van het huis van Achab, en deed dat kwaad was in de ogen des HEEREN, gelijk het huis van Achab; want hij was een schoonzoon van het huis van Achab.","28":"En hij toog met Joram, den zoon van Achab, naar den strijd, te Ramoth in Gilead, tegen Hazaël, den koning van Syrië; en de Syriërs sloegen Joram.","29":"Toen keerde Joram, de koning, wederom, opdat hij zich te Jizreël helen liet van de slagen, die hem de Syriërs te Rama geslagen hadden, als hij streed tegen Hazaël, den koning van Syrië; en Ahazia, de zoon van Jehoram, de koning van Juda, kwam af, om Joram, den zoon van Achab, te Jizreël te bezien, want hij was krank."},"KJV":{"1":"Then spake Elisha unto the woman, whose son he had restored to life, saying, Arise, and go thou and thine household, and sojourn wheresoever thou canst sojourn: for the LORD hath called for a famine; and it shall also come upon the land seven years.","2":"And the woman arose, and did after the saying of the man of God: and she went with her household, and sojourned in the land of the Philistines seven years.","3":"And it came to pass at the seven years' end, that the woman returned out of the land of the Philistines: and she went forth to cry unto the king for her house and for her land.","4":"And the king talked with Gehazi the servant of the man of God, saying, Tell me, I pray thee, all the great things that Elisha hath done.","5":"And it came to pass, as he was telling the king how he had restored ➔ a dead body to life, that, behold, the woman, whose son he had restored to life, cried to the king for her house and for her land. And Gehazi said, My lord, O king, this is the woman, and this is her son, whom Elisha restored to life.","6":"And when the king asked the woman, she told him. So the king appointed unto her a certain officer, saying, Restore all that was hers, and all the fruits of the field since the day that she left the land, even until now.","7":"And Elisha came to Damascus; and Benhadad the king of Syria was sick; and it was told him, saying, The man of God is come hither.","8":"And the king said unto Hazael, Take a present in thine hand, and go, meet the man of God, and enquire of the LORD by him, saying, Shall I recover of this disease?","9":"So Hazael went to meet him, and took a present with him, even of every good thing of Damascus, forty camels' burden, and came and stood before him, and said, Thy son Benhadad king of Syria hath sent me to thee, saying, Shall I recover of this disease?","10":"And Elisha said unto him, Go, say unto him, Thou mayest certainly recover: howbeit the LORD hath shewed me that he shall surely die.","11":"And he settled his countenance stedfastly, until he was ashamed: and the man of God wept.","12":"And Hazael said, Why weepeth my lord? And he answered, Because I know the evil that thou wilt do unto the children of Israel: their strong holds wilt thou set on fire, and their young men wilt thou slay with the sword, and wilt dash their children, and rip up their women with child.","13":"And Hazael said, But what, is thy servant a dog, that he should do this great thing? And Elisha answered, The LORD hath shewed me that thou shalt be king over Syria.","14":"So he departed from Elisha, and came to his master; who said to him, What said Elisha to thee? And he answered, He told me that thou shouldest surely recover.","15":"And it came to pass on the morrow, that he took a thick cloth, and dipped it in water, and spread it on his face, so that he died: and Hazael reigned in his stead.","16":"And in the fifth year of Joram the son of Ahab king of Israel, Jehoshaphat being then king of Judah, Jehoram the son of Jehoshaphat king of Judah began to reign.","17":"Thirty and two years old was he when he began to reign; and he reigned eight years in Jerusalem.","18":"And he walked in the way of the kings of Israel, as did the house of Ahab: for the daughter of Ahab was his wife: and he did evil in the sight of the LORD.","19":"Yet the LORD would not destroy Judah for David his servant's sake, as he promised him to give him alway a light, and to his children.","20":"In his days Edom revolted from under the hand of Judah, and made a king over themselves.","21":"So Joram went over to Zair, and all the chariots with him: and he rose by night, and smote the Edomites which compassed him about, and the captains of the chariots: and the people fled into their tents.","22":"Yet Edom revolted from under the hand of Judah unto this day. Then Libnah revolted at the same time.","23":"And the rest of the acts of Joram, and all that he did, are they not written in the book of the chronicles of the kings of Judah?","24":"And Joram slept with his fathers, and was buried with his fathers in the city of David: and Ahaziah his son reigned in his stead.","25":"In the twelfth year of Joram the son of Ahab king of Israel did Ahaziah the son of Jehoram king of Judah begin to reign.","26":"Two and twenty years old was Ahaziah when he began to reign; and he reigned one year in Jerusalem. And his mother's name was Athaliah, the daughter of Omri king of Israel.","27":"And he walked in the way of the house of Ahab, and did evil in the sight of the LORD, as did the house of Ahab: for he was the son in law of the house of Ahab.","28":"And he went with Joram the son of Ahab to the war against Hazael king of Syria in Ramothgilead; and the Syrians wounded Joram.","29":"And king Joram went back to be healed in Jezreel of the wounds which the Syrians had given him at Ramah, when he fought against Hazael king of Syria. And Ahaziah the son of Jehoram king of Judah went down to see Joram the son of Ahab in Jezreel, because he was sick."}},"tsk":{"1":[{"kopje":"van wie hij de zoon","refs":["2 Kon 4:18","2 Kon 4:31-35"]},{"kopje":"woon als vreemdeling","refs":["Gen 12:10","Gen 26:1","Gen 47:4","Ruth 1:1"]},{"kopje":"de HEERE","refs":["Gen 41:25","Gen 41:28","Gen 41:32","Lev 26:19","Lev 26:20","Lev 26:26","Deut 28:22-24","Deut 28:38-40","1 Kon 17:1","1 Kon 18:2","Ps 105:16","Ps 107:34","Hagg 1:11","Luk 21:11","Luk 21:22","Hand 11:28"]},{"kopje":"heeft een hongersnood aangekondigd","refs":["Jer 25:29"]},{"kopje":"zeven jaar","refs":["Gen 41:27","2 Sam 21:1","2 Sam 24:13","Luk 4:25"]}],"2":[{"kopje":"met","refs":["1 Tim 5:8"]},{"kopje":"land","refs":["Richt 3:3","1 Sam 27:1-3"]}],"4":[{"kopje":"Gehazi","refs":["2 Kon 5:20-27","2 Kon 7:3","2 Kon 7:10"]},{"kopje":"Vertel","refs":["Matt 2:8","Luk 9:9","Luk 23:8","Joh 9:27","Hand 24:24"]},{"kopje":"al de grote dingen","refs":["2 Kon 2:14","2 Kon 2:20-22","2 Kon 2:24","2 Kon 3:14 data-code=\"H834\">wheresoever</span> thou canst <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for a <span class=\"wl wl-kjv\" data-code=\"H7458\">famine;</span> and it shall also <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>","2":"And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> after the <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> and she <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with her <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourned</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>","3":"And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years'</span> <span class=\"wl wl-kjv\" data-code=\"H7097\">end,</span> that the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines:</span> and she went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to <span class=\"wl wl-kjv\" data-code=\"H6817\">cry</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> for her <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> and for her <span class=\"wl wl-kjv\" data-code=\"H7704\">land.</span>","4":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5608\">Tell</span> me, I pray thee, all the great <span class=\"wl wl-kjv\" data-code=\"H1419\">things</span> that <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span>","5":"And it came to pass, as he was <span class=\"wl wl-kjv\" data-code=\"H5608\">telling</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> how he had <span class=\"wl wl-kjv\" data-code=\"H2421\">restored</span> ➔ a dead <span class=\"wl wl-kjv\" data-code=\"H4191\">body</span> to <span class=\"wl wl-kjv\" data-code=\"H2421\">life,</span> that, behold, the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> whose <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> he had restored to <span class=\"wl wl-kjv\" data-code=\"H2421\">life,</span> <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> for her <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> and for her <span class=\"wl wl-kjv\" data-code=\"H7704\">land.</span> And <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> this is the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> and this is her <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> whom <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> restored to <span class=\"wl wl-kjv\" data-code=\"H2421\">life.</span>","6":"And when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> she <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> him. So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">appointed</span> unto her a <span class=\"wl wl-kjv\" data-code=\"H259\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H5631\">officer,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Restore</span> all that was hers, and all the <span class=\"wl wl-kjv\" data-code=\"H8393\">fruits</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> since the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that she <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> even until now.","7":"And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus;</span> and <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> was <span class=\"wl wl-kjv\" data-code=\"H2470\">sick;</span> and it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H2008\">hither.</span>","8":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> a <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> by him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Shall I <span class=\"wl wl-kjv\" data-code=\"H2421\">recover</span> of this <span class=\"wl wl-kjv\" data-code=\"H2483\">disease?</span>","9":"So <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him, and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> with <span class=\"wl wl-kjv\" data-code=\"H3027\">him,</span> even of every good <span class=\"wl wl-kjv\" data-code=\"H2898\">thing</span> of <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus,</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H1581\">camels'</span> <span class=\"wl wl-kjv\" data-code=\"H4853\">burden,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me to thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Shall I <span class=\"wl wl-kjv\" data-code=\"H2421\">recover</span> of this <span class=\"wl wl-kjv\" data-code=\"H2483\">disease?</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, Thou mayest <span class=\"wl wl-kjv\" data-code=\"H2421\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">recover:</span> howbeit the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7200\">shewed</span> me that he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span>","11":"And he <span class=\"wl wl-kjv\" data-code=\"H5975\">settled</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">stedfastly,</span> until he was <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed:</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept.</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Why <span class=\"wl wl-kjv\" data-code=\"H1058\">weepeth</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> Because I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that thou wilt <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> their strong <span class=\"wl wl-kjv\" data-code=\"H4013\">holds</span> wilt thou <span class=\"wl wl-kjv\" data-code=\"H7971\">set</span> on <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and their young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> wilt thou <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and wilt <span class=\"wl wl-kjv\" data-code=\"H7376\">dash</span> their <span class=\"wl wl-kjv\" data-code=\"H5768\">children,</span> and rip <span class=\"wl wl-kjv\" data-code=\"H1234\">up</span> their women with <span class=\"wl wl-kjv\" data-code=\"H2030\">child.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> But what, is thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> a <span class=\"wl wl-kjv\" data-code=\"H3611\">dog,</span> that he should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">thing?</span> And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7200\">shewed</span> me that thou shalt be <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H758\">Syria.</span>","14":"So he <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to his <span class=\"wl wl-kjv\" data-code=\"H113\">master;</span> who <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, What <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> to thee? And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> He <span class=\"wl wl-kjv\" data-code=\"H559\">told</span> me that thou shouldest <span class=\"wl wl-kjv\" data-code=\"H2421\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">recover.</span>","15":"And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow,</span> that he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a thick <span class=\"wl wl-kjv\" data-code=\"H4346\">cloth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2881\">dipped</span> it in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> it on his <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> so that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died:</span> and <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.","16":"And in the <span class=\"wl wl-kjv\" data-code=\"H2568\">fifth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> being then <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H3088\">Jehoram</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign.</span>","17":"<span class=\"wl wl-kjv\" data-code=\"H7970\">Thirty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> was he when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign;</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","18":"And he <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> as <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> was his <span class=\"wl wl-kjv\" data-code=\"H802\">wife:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","19":"Yet the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> for <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant's</span> sake, as he <span class=\"wl wl-kjv\" data-code=\"H559\">promised</span> him to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> him <span class=\"wl wl-kjv\" data-code=\"H3117\">alway</span> a <span class=\"wl wl-kjv\" data-code=\"H5216\">light,</span> and to his <span class=\"wl wl-kjv\" data-code=\"H1121\">children.</span>","20":"In his <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> <span class=\"wl wl-kjv\" data-code=\"H6586\">revolted</span> from under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H4427\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over themselves.","21":"So <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> went <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> to <span class=\"wl wl-kjv\" data-code=\"H6811\">Zair,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> with him: and he <span class=\"wl wl-kjv\" data-code=\"H6965\">rose</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H123\">Edomites</span> which compassed him <span class=\"wl wl-kjv\" data-code=\"H5437\">about,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> into their <span class=\"wl wl-kjv\" data-code=\"H168\">tents.</span>","22":"Yet <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> <span class=\"wl wl-kjv\" data-code=\"H6586\">revolted</span> from under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span> Then <span class=\"wl wl-kjv\" data-code=\"H3841\">Libnah</span> <span class=\"wl wl-kjv\" data-code=\"H6586\">revolted</span> at the <span class=\"wl wl-kjv\" data-code=\"H1931\">same</span> <span class=\"wl wl-kjv\" data-code=\"H6256\">time.</span>","23":"And the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah?</span>","24":"And <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> and <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.","25":"In the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> did <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3088\">Jehoram</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> begin to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign.</span>","26":"<span class=\"wl wl-kjv\" data-code=\"H8147\">Two</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> was <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign;</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H6271\">Athaliah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6018\">Omri</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","27":"And he <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as did the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab:</span> for he was the son in <span class=\"wl wl-kjv\" data-code=\"H2860\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab.</span>","28":"And he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> to the <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> against <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> in <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead;</span> and the <span class=\"wl wl-kjv\" data-code=\"H761\">Syrians</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">wounded</span> <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram.</span>","29":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> went <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> to be <span class=\"wl wl-kjv\" data-code=\"H7495\">healed</span> in <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel</span> of the <span class=\"wl wl-kjv\" data-code=\"H4347\">wounds</span> which the <span class=\"wl wl-kjv\" data-code=\"H761\">Syrians</span> had <span class=\"wl wl-kjv\" data-code=\"H5221\">given</span> him at <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah,</span> when he <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria.</span> And <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3088\">Jehoram</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> in <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel,</span> because he was <span class=\"wl wl-kjv\" data-code=\"H2470\">sick.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"huisgezin,","tekst":"Hebreeuws, huis. Zie Gen 7:1."},{"catchword":"heeft een honger","tekst":"Dat is, heeft naar zijn gerechtigheid een duren tijd over het land gezonden, als zijn dienaar en scherprechter om zijne straffen uit te voeren. Zie mede Psa 105:16. Zo wordt ook God gezegd andere plagen te roepen, even alsof zij levende en redelijke schepselen waren, bekwaam om te verstaan en gewillig om te gehoorzamen; Jer 25:29; Hag 1:11."}],"3":[{"catchword":"riep,","tekst":"Dat is, ernstiglijk en met aanhouding verzocht, om haar huis en land, dat enigen in haar afwezen bezeten hadden weder te krijgen. Vergelijk vs.6."}],"4":[{"catchword":"Géhazi,","tekst":"Het schijnt dat dit geschied is vóór de historie van Naäman den Syriër en de melaatsheid van Gehazi, waarvan men zien kan boven, 2Ki 5, omdat niemand lichtelijk sprak met de melaatsen, die van het gezelschap der mensen door Gods wet afgezonderd waren, Lev 13:46. Anderen menen dat deze wet de samenwoning alleen verbood, en niet de aanspraak, die de Israëlieten zowel, boven, 2Ki 7:10, als de heidenen, boven, 2Ki 5:4-5, toegelaten hebben."},{"catchword":"de grote dingen,","tekst":"Dat is, mirakelen en wonderwerken, die deze afgodische koning niet uit waar geloof, maar uit ijdele nieuwsgierigheid zocht te horen."}],"6":[{"catchword":"ondervraagde","tekst":"Te weten, of haar zoon door Elisa van den dood opgewekt was geweest."},{"catchword":"kamerling,","tekst":"Zie Gen 37:36."}],"7":[{"catchword":"Damaskus,","tekst":"Zie Gen 14:15."}],"8":[{"catchword":"Neem een geschenk","tekst":"Zie 1Ki 14:3."},{"catchword":"in uw hand,","tekst":"Dat is, met u. Zie boven, 2Ki 5:5. Alzo in vs.9."},{"catchword":"genezen?","tekst":"Hebreeuws, leven. Alzo Num 21:8, en Jos 5:8, en onder, vs.9,10, 14; Joh 4:50."}],"9":[{"catchword":"alle goed","tekst":"Dat is, allerlei."},{"catchword":"Uw zoon Benhadad,","tekst":"Dat is, die u eert als zijn vader. Alzo heeft de koning Joram dezen profeet zijn vader genoemd, boven, 2Ki 6:21."}],"10":[{"catchword":"gij zult","tekst":"Hebreeuws, gij zult levende niet leven. Anders aldus: Zeg hem, gij zult levende leven. Verstaande dit spottenderwijze gesproken. Vergelijk 1Ki 22:15. De woorden worden ook vertaald aldus: Gij zoudt kunnen zekerlijk genezen. En de zin is dan dat de ziekte van Benhadad wel uit haar natuur niet was ter dood, alzo dat hij daarvan zou hebben kunnen opstaan, maar dat hij evenwel sterven zou door een andere manier, eer de ziekte een einde zou nemen. Zie onder, vs.15."},{"catchword":"den dood","tekst":"Hebreeuws, stervende sterven."}],"11":[{"catchword":"hij hield","tekst":"Te weten, de profeet, die zijn ogen op Hazael geslagen hebbende, dezelve zolang op hem hield, totdat hij zich schaamde langer op hem te zien of totdat Hazael beschaamd werd zolang bezien te worden. Anderen verstaan dit aldus, dat de profeet zijn aangezicht niet op Hazael maar op iets anders vastgehouden heeft, zijnde in de aanmerking der wreedheid, die Hazael tegen Israël bedrijven zou, totdat hem, ofschoon hij zich poogde in te houden, daarover de tranen ontgaan zijn. Naar de andere overzetting nemen het sommigen van Hazael, dat hij zijn aangezicht op den profeet gesteld zou hebben, verwonderd zijnde waarom hij hem strijdende dingen scheen te belasten, om die zijnen heer Benhadad aan te dienen."},{"catchword":"tot schamens toe;","tekst":"Zie van deze manier van spreken ook Jdg 3:25, en boven, 2Ki 2:17. Anders, langen tijd, of tot vertraging."},{"catchword":"weende","tekst":"Uit oorzaak van het kwaad, dat hij door Gods openbaring voorzag den kinderen Israëls door middel van Hazael te zullen overkomen. Vergelijk Jer 14:17, en Luk 19:41."}],"13":[{"catchword":"een hond is,","tekst":"Dat is, gans onwaardig, veracht en onvermogend. Vergelijk 1Sa 24:15; 2Sa 3:8, en 2Sa 9:8; Job 30:1. Anders, wat is uw knecht? een hond? Dat is, zo wreed, fel, moorddadig en onbarmhartig als een hond. Zo worden de wreden en bloeddorstigen bij honden vergeleken; Psa 22:17, Psa 22:21, en Psa 59:7."},{"catchword":"De HEERE","tekst":"Vergelijk 1Ki 19:15."}],"14":[{"catchword":"heer,","tekst":"Den koning van Syrië."},{"catchword":"Gij zult","tekst":"Hebreeuws, levend zijnde zult gij leven; dat is, zekerlijk genezen. Hij verhaalt het tegendeel van hetgeen Elisa hem gezegd had, volgens de overzetting van vs.10."}],"15":[{"catchword":"zijn aangezicht","tekst":"Namelijk van den koning Benhadad. Dit heeft Hazael gedaan met voorbedachten rade, om hem den dood aan te brengen."}],"16":[{"catchword":"vijfde jaar","tekst":"Hetwelk was het twee en twintigste jaar des koninkrijks van Josafat. Vergelijk boven, 2Ki 3:1."},{"catchword":"toen Jósafat","tekst":"Want nog in het leven zijnde en het recht van den koninklijken stoel behoudende, had hij zijn zoon stadhouder gemaakt en met hem enige jaren geregeerd. Vergelijk hiermede de aantekening 1Ki 22:42, en boven, 2Ki 1:17."}],"18":[{"catchword":"dochter","tekst":"Genaamd Athalia, onder, vs.26, alwaar zij wordt gezegd de dochter van Omri, omdat deze Achabs vader was, en dus haar grootvader."},{"catchword":"hij deed","tekst":"Zie 1Ki 11:6."}],"19":[{"catchword":"om Davids","tekst":"Zie 1Ki 11:12."},{"catchword":"te allen tijde","tekst":"Hebreeuws, alle dagen. Zie 1Ki 11:36."},{"catchword":"lamp zou geven","tekst":"Zie 1Ki 11:36."}],"20":[{"catchword":"vielen","tekst":"Aldus werd vervuld de voorzegging van Izak, Gen 27:40."},{"catchword":"het gebied","tekst":"Hebreeuws, hand; dat is, macht en gebied. Alzo onder, vs.22. Zie Gen 16:6."},{"catchword":"koning","tekst":"Want van den tijd van David af was er geen koning onder hen geweest, maar een konings stadhouder, ingezet door den koning van Juda. Zie 1Ki 22:48, en de aantekening daarop."}],"21":[{"catchword":"Zaïr,","tekst":"Hebreeuws, Tsair. De naam ener stad of plaats in Idumea gelegen."}],"22":[{"catchword":"tot op dezen dag;","tekst":"Dat is, welke afval duurt tot op dezen dag, in welken dit boek is geschreven geweest."},{"catchword":"Libna","tekst":"Een stad, gelegen in den stam van Juda, Jos 15:42, en den priesters te bewonen gegeven, Jos 21:13; de oorzaak van haar afval was, omdat Joram den Heere, den God zijner vaderen, verlaten had, 2Ch 21:10. Door dezen afval werd Joram verhinderd zijn victorie tegen de Edomieten te vervolgen, waardoor zij in hun afval gebleven zijn."}],"23":[{"catchword":"in het boek","tekst":"Zie 1Ki 14:29."}],"24":[{"catchword":"ontsliep","tekst":"Zie Deu 31:16; 1Ki 1:21."},{"catchword":"begraven","tekst":"Doch niet in de graven der koningen, maar in een gewoon graf, afgezonderd van de andere en zonder de gewoonlijke verering. Zie 2Ch 21:19-20."}],"25":[{"catchword":"te regeren","tekst":"Hebreeuws, regeerde."}],"26":[{"catchword":"oud,","tekst":"Hebreeuws, een zoon van twee en twintig jaar."},{"catchword":"dochter van Omri,","tekst":"Versta, zijns zoons dochter. Want deze Athalia was de dochter van Achab, boven, vs.18, en Achab de zoon van Omri, 1Ki 16:28-29."}],"27":[{"catchword":"wandelde","tekst":"Zie 1Ki 15:26."},{"catchword":"dat kwaad was","tekst":"Zie 1Ki 11:6."},{"catchword":"schoonzoon","tekst":"Te weten, door het huwelijk van Athalia, de dochter van Achab, met Joram, den zoon van Josafat, den koning van Juda."}],"28":[{"catchword":"sloegen Joram","tekst":"Dat is, wondden, of, kwetsten."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now Elisa had spoken unto that woman, whose son he had restored to life, [See above chap.4.34.] saying; get thee up, and go thy ways, thou and thy household, [Heb. house. See Gen 8.v.1.] and sojourn, where so ever thou canst sojourn: for the LORD hath called for a famine, which shall also come upon the land seven years. [i.e. he hath in his justice sent a famine upon the land; as his minister and executioner, to execute his judgement. See likewise Psa.105.v.10. Thus God is also said to call for other judgements, as if they were living and reasonable creatures, apt to understand, and wishing to obey, Jer 25:29. Hag.1.11.]"}],"2":[{"catchword":null,"tekst":"And the woman had gat her up, and had done according to the word of the man of God: for she was gone with her household, and had sojourned in the land of the Philistines seven years."}],"3":[{"catchword":null,"tekst":"And it came to pass at the seven years end, that the woman returned out of the Philistines; and she went forth, to cry unto the King for her house, and for her field. [That is, she did earnestly, and with importunity beg, to have house and land, which some possessed in her absence, restored to her. Compare the following 6.verse.]"}],"4":[{"catchword":null,"tekst":"Now the King talked with Gehasi, the lad of the man of God, [It seemeth that this happened before the History Naaman the Syrian, and the leprosy of Gehasi, whereof see above chap.5. because none might easily talk or discourse with Lepers, who by the Law of God were separated from the society of men, Lev.13.46. Others conceive that this Law onely forbade co-habitation, and not conference, which the Israelites as well permitted, above chap.7.10. as the Heathen, above chap.5. vers.4.5.] saying; Tell me, I pray thee, all the great things that Elisa hath done. [i.e. the miracles and wonders done by him, which this idolatrous King was desirous to hear of, not out of true faith, but out of vain curiosity.]"}],"5":[{"catchword":null,"tekst":"And it came to pass, when he told the King how he had restored a dead (body) to life, behold, the woman whose son he had restoreth to life, cried then to the King, for her house, and for her field: Then said Gehazi; My Lord, (O) King, this is the woman, and this is her son, whom Elisa restoreth to life."}],"6":[{"catchword":null,"tekst":"And the King examined the woman, [To wit, whether her son was raised from death to life by Elisa] and she related it to him: then the King appointed to her one of the chamber, [See Gen.37.on ver.36.] saying; cause (her) to have again all that was hers, besides, all revenues of the field, from the day that she left the land, until now."}],"7":[{"catchword":null,"tekst":"After that Elisa came to Damascus, [See Gen.14.on ver.15.] when Benhadad the King of Syria was sick, and it was told him, saying, The man of God is come hither."}],"8":[{"catchword":null,"tekst":"Then said the King unto Hazael; Take a Present in thine hand, [i.e. With thee: see above chap.5.on ver.5. So in the following verse] and go meet the man of God: [see 1 Kings 14.on ver.3.] and enquire of the LORD by him, saying; shall I recover [Heb. live. So Num 21:8. & Jos.5.8. and below ver.9,10,14. Joh.4.50.] of this disease."}],"9":[{"catchword":null,"tekst":"So Hazael went to meet him, and took a Present in his hand, to wit, (of) all (or every) [i.e. All manner of] good (thing) of Damascus, fourty camels burden; and he came, and stood before his face, and said; Thy son Benhadad [i.e. that honoureth thee as his Father. Thus King Joram called this Prophet his Father, above chap.6.21.] King of Syria hath sent me unto thee, to say; shall I recover of this disease?"}],"10":[{"catchword":null,"tekst":"And Elisa said unto him; Go, say, thou shalt not recover at all; [Heb. Thou shalt living not live. Oth. thus: tell him thou shalt living live: understanding this to be spoken ironically. Compare 1 King.22.15. The words are likewise translated thus: Thou mayest certainly recover. And the meaning then is, that Benhadads sickness in its own nature was not indeed unto death, so that he might recover and get up from it, but not with standing that he should die some other way, before the sickness should have an end: see below v.15.] for the LORD hath shewed me, that he shall die the death. [Heb. dying die.]"}],"11":[{"catchword":null,"tekst":"And he [To wit, the Prophet] held his countenance standing, and set it fast, till very shame: [see this phrase also Judg.3.25. and above chap.2.17. otherw. along while, or, until weariness] and the man of God wept. [because of the evil which by revelation from God he foresaw would befall the children of Israel by Hazaels means. Compare Jer 14:17. and Luk 19:41. The meaning of the words of this verse is, that the Prophet Elisa having cast his eyes on Hazael, held them so long six upon him, till he was ashamed to look any longer upon him, or, till Hazael was ashamed to be look upon any longer. Others understand this thus; that the Prophet held his countenance fixed, not upon Hazael, but upon somewhat else, being in contemplation of the cruelty that Hazael should act against Israel, until tears trickled down from his eyes threat, although he strove to refrain himself as much as possibly he could. According to the other translation, some take it to be meant of Hazael, as if he should have had his countenance stedfastly fixed upon the Prophet, admiring why he should seem to enjoin him to report unto his Lord Benhadad, things that were repugnant and contradictory.]"}],"12":[{"catchword":null,"tekst":"Then said Hazael; Why weepeth my Lord? and he said; Because I know what evil thou wilt d // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
