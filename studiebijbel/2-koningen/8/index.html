, {"naam": "Hebreeën", "href": "../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Elisa had tegen de vrouw gesproken, van wie hij de zoon levend gemaakt had. Hij zei: Maak u klaar, en ga weg, u en uw huisgezin, en woon als vreemdeling waar u maar wonen kunt; want de HEERE heeft een hongersnood aangekondigd, die ook zeven jaar lang over het land zal komen.", "2": "En de vrouw had zich klaargemaakt en had gedaan naar het woord van de man Gods; zij was met haar huisgezin weggegaan, en had als vreemdeling gewoond in het land van de Filistijnen, zeven jaar lang.", "3": "En het gebeurde na het einde van de zeven jaar, dat de vrouw uit het land van de Filistijnen terugkeerde; en zij ging naar de koning om te smeken voor haar huis en voor haar akker.", "4": "De koning nu sprak met Gehazi, de knecht van de man Gods, en zei: Vertel mij toch al de grote dingen die Elisa gedaan heeft.", "5": "En het gebeurde, terwijl hij de koning vertelde hoe hij een dode levend gemaakt had, zie, dat de vrouw, van wie hij de zoon levend gemaakt had, tot de koning smeekte voor haar huis en voor haar akker. Toen zei Gehazi: Mijn heer koning! Dit is de vrouw, en dit is haar zoon, die Elisa levend gemaakt heeft.", "6": "En de koning ondervroeg de vrouw, en zij vertelde het hem. Toen gaf de koning haar een kamerling mee, en zei: Zorg dat zij alles terugkrijgt wat van haar was, en ook alle opbrengsten van de akker, vanaf de dag dat zij het land verlaten heeft tot nu toe.", "7": "Daarna kwam Elisa in Damaskus, toen Benhadad, de koning van Syrië, ziek was; en men vertelde hem: De man Gods is hierheen gekomen.", "8": "Toen zei de koning tegen Hazaël: Neem een geschenk mee, en ga de man Gods tegemoet, en vraag door hem de HEERE: Zal ik van deze ziekte genezen?", "9": "Zo ging Hazaël hem tegemoet, en nam een geschenk mee, namelijk al het goede van Damaskus, een last van veertig kamelen; en hij kwam, en stond voor hem, en zei: Uw zoon Benhadad, de koning van Syrië, heeft mij naar u gezonden om te vragen: Zal ik van deze ziekte genezen?", "10": "En Elisa zei tegen hem: Ga, zeg hem: U zult beslist niet genezen[1]; want de HEERE heeft mij getoond dat hij zeker zal sterven.", "11": "En hij hield zijn gezicht strak, tot het schamen toe; en de man Gods weende.", "12": "Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden.", "13": "En Hazaël zei: Wat is uw dienaar toch, die een hond is, dat hij deze grote zaak zou doen? En Elisa zei: De HEERE heeft mij getoond dat u koning zult zijn over Syrië.", "14": "Zo ging hij weg van Elisa, en kwam bij zijn heer, die tegen hem zei: Wat heeft Elisa u gezegd? En hij zei: Hij heeft mij gezegd: U zult zeker genezen.", "15": "En het gebeurde de volgende dag, dat hij een deken nam, en in het water doopte, en over zijn gezicht uitspreidde, zodat hij stierf; en Hazaël werd koning in zijn plaats.", "16": "In het vijfde jaar van Joram, de zoon van Achab, de koning van Israël, toen Josafat koning was van Juda, begon Jehoram, de zoon van Josafat, de koning van Juda, te regeren.", "17": "Hij was tweeëndertig jaar oud toen hij koning werd, en hij regeerde acht jaar in Jeruzalem.", "18": "En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want de dochter van Achab was zijn vrouw geworden; en hij deed wat slecht was in de ogen van de HEERE.", "19": "Toch wilde de HEERE Juda niet verderven, omwille van David, Zijn dienaar; zoals Hij hem gezegd had dat Hij hem altijd een lamp zou geven voor zijn zonen.", "20": "In zijn dagen kwamen de Edomieten in opstand tegen het gezag van Juda, en stelden een koning over zich aan.", "21": "Daarom trok Joram over naar Zaïr, en alle wagens met hem; en hij stond 's nachts op, en versloeg de Edomieten, die hem omsingeld hadden, en ook de aanvoerders van de wagens; en het volk vluchtte naar zijn tenten.", "22": "De Edomieten bleven echter in opstand tegen het gezag van Juda, tot op deze dag; ook Libna kwam in dezelfde tijd in opstand.", "23": "Het overige van de geschiedenis van Joram, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "24": "En Joram stierf en werd bij zijn voorvaderen begraven, in de stad van David; en Ahazia, zijn zoon, werd koning in zijn plaats.", "25": "In het twaalfde jaar van Joram, de zoon van Achab, de koning van Israël, begon Ahazia, de zoon van Jehoram, de koning van Juda, te regeren.", "26": "Ahazia was tweeëntwintig jaar oud toen hij koning werd, en regeerde één jaar in Jeruzalem; en de naam van zijn moeder was Athalia, de dochter van Omri, de koning van Israël.", "27": "En hij ging de weg van het huis van Achab, en deed wat slecht was in de ogen van de HEERE, zoals het huis van Achab; want hij was een schoonzoon van het huis van Achab.", "28": "En hij trok met Joram, de zoon van Achab, ten strijde tegen Hazaël, de koning van Syrië, naar Ramoth in Gilead; en de Syriërs verwondden Joram.", "29": "Toen keerde koning Joram terug, om zich in Jizreël te laten genezen van de verwondingen die de Syriërs hem in Rama toegebracht hadden, toen hij tegen Hazaël, de koning van Syrië, streed; en Ahazia, de zoon van Jehoram, de koning van Juda, kwam naar Jizreël om Joram, de zoon van Achab, te bezoeken, want hij was ziek."}, "SV": {"1": "Elisa nu had gesproken tot die vrouw, welker zoon hij levend gemaakt had, zeggende: Maak u op, en ga heen, gij en uw huisgezin, en verkeer als vreemdeling, waar gij verkeren kunt; want de HEERE heeft een honger geroepen, die ook in het land zeven jaren komen zal.", "2": "En de vrouw had zich opgemaakt, en had gedaan naar het woord van den man Gods; want zij was gegaan met haar huisgezin, en had als vreemdeling verkeerd in het land der Filistijnen, zeven jaren.", "3": "En het geschiedde met het einde der zeven jaren, dat de vrouw uit het land der Filistijnen wederkeerde; en zij ging uit, dat zij tot den koning riep, om haar huis en om haar akker.", "4": "De koning nu sprak tot Gehazi, den jongen van den man Gods, zeggende: Vertel mij toch al de grote dingen, die Elisa gedaan heeft.", "5": "En het geschiedde, als hij den koning vertelde, hoe hij een dode had levend gemaakt, ziet, zo riep de vrouw, welker zoon hij levend gemaakt had, tot den koning, om haar huis en om haar akker. Toen zeide Gehazi: Mijn heer koning! Dit is de vrouw, en dit is haar zoon, dien Elisa heeft levend gemaakt.", "6": "En de koning ondervraagde de vrouw, en zij vertelde het hem. Toen gaf de koning haar een kamerling, zeggende: Doe *haar* wederhebben alles, wat het hare was, daartoe alle inkomsten des akkers, van den dag af, dat zij het land verlaten heeft, tot nu toe.", "7": "Daarna kwam Elisa te Damaskus, als Benhadad, de koning van Syrië, krank was; en men boodschapte hem, zeggende: De man Gods is herwaarts gekomen.", "8": "Toen zeide de koning tot Hazaël: Neem een geschenk in uw hand, en ga den man Gods tegemoet; en vraag door hem den HEERE, zeggende: Zal ik van deze krankheid genezen?", "9": "Zo ging Hazaël hem tegemoet, en nam een geschenk in zijn hand, te weten, alle goed van Damaskus, een last van veertig kemelen; en hij kwam, en stond voor zijn aangezicht, en zeide: Uw zoon Benhadad, de koning van Syrië, heeft mij tot u gezonden, om te zeggen: Zal ik van deze krankheid genezen?", "10": "En Elisa zeide tot hem: Ga, zeg, gij zult ganselijk niet genezen; want de HEERE heeft mij getoond, dat hij den dood sterven zal.", "11": "En hij hield zijn gezicht staande, en zette het vast tot schamens toe; en de man Gods weende.", "12": "Toen zeide Hazaël: Waarom weent mijn heer? En hij zeide: omdat ik weet, wat kwaad gij den kinderen Israëls doen zult; gij zult hun sterkten in het vuur zetten, en hun jonge manschap met het zwaard doden, en hun jonge kinderen verpletteren, en hun zwangere vrouwen opensnijden.", "13": "En Hazaël zeide: Maar wat is uw knecht, die een hond is, dat hij deze grote zaak doen zou? En Elisa zeide: De HEERE heeft mij getoond, dat gij koning zijn zult over Syrië.", "14": "Zo ging hij weg van Elisa, en kwam tot zijn heer, die tot hem zeide: Wat heeft Elisa tot u gezegd? En hij zeide: Hij heeft tot mij gezegd: Gij zult zekerlijk genezen.", "15": "En het geschiedde des anderen daags, dat hij een deken nam, en in het water doopte, en over zijn aangezicht uitspreidde, dat hij stierf; en Hazaël werd koning in zijn plaats.", "16": "In het vijfde jaar nu van Joram, den zoon van Achab, den koning van Israël, toen Josafat koning was van Juda, *begon* Jehoram, de zoon van Josafat, den koning van Juda, te regeren.", "17": "Hij was twee en dertig jaren oud, toen hij koning werd, en hij regeerde acht jaren te Jeruzalem.", "18": "En hij wandelde op den weg der koningen van Israël, gelijk als het huis van Achab deed; want de dochter van Achab was hem ter vrouw geworden; en hij deed dat kwaad was in de ogen des HEEREN.", "19": "Doch de HEERE wilde Juda niet verderven, om Davids Zijns knechts wil; gelijk als Hij hem gezegd had, dat Hij hem te allen tijde voor zijn zonen een lamp zou geven.", "20": "In zijn dagen vielen de Edomieten van onder het gebied van Juda af, en maakten een koning over zich.", "21": "Daarom toog Joram over naar Zair, en al de wagenen met hem; en hij maakte zich des nachts op, en sloeg de Edomieten, die rondom hem waren, daartoe de oversten der wagenen; en het volk vlood in zijn hutten.", "22": "De Edomieten evenwel vielen van onder het gebied van Juda af, tot op dezen dag; toen viel Libna af in denzelfden tijd.", "23": "Het overige nu der geschiedenissen van Joram, en alles wat hij gedaan heeft, is dat niet geschreven in het boek der kronieken der koningen van Juda?", "24": "En Joram ontsliep met zijn vaderen, en werd begraven bij zijn vaderen, in de stad Davids; en Ahazia, zijn zoon, werd koning in zijn plaats.", "25": "In het twaalfde jaar van Joram, den zoon van Achab, den koning van Israël, *begon* Ahazia, de zoon van Jeroham, den koning van Juda, te regeren.", "26": "Twee en twintig jaren was Ahazia oud, als hij koning werd, en regeerde een jaar te Jeruzalem; en de naam zijner moeder was Athalia, de dochter van Omri, den koning van Israël.", "27": "En hij wandelde in den weg van het huis van Achab, en deed dat kwaad was in de ogen des HEEREN, gelijk het huis van Achab; want hij was een schoonzoon van het huis van Achab.", "28": "En hij toog met Joram, den zoon van Achab, naar den strijd, te Ramoth in Gilead, tegen Hazaël, den koning van Syrië; en de Syriërs sloegen Joram.", "29": "Toen keerde Joram, de koning, wederom, opdat hij zich te Jizreël helen liet van de slagen, die hem de Syriërs te Rama geslagen hadden, als hij streed tegen Hazaël, den koning van Syrië; en Ahazia, de zoon van Jehoram, de koning van Juda, kwam af, om Joram, den zoon van Achab, te Jizreël te bezien, want hij was krank."}, "KJV": {"1": "Then spake Elisha unto the woman, whose son he had restored to life, saying, Arise, and go thou and thine household, and sojourn wheresoever thou canst sojourn: for the LORD hath called for a famine; and it shall also come upon the land seven years.", "2": "And the woman arose, and did after the saying of the man of God: and she went with her household, and sojourned in the land of the Philistines seven years.", "3": "And it came to pass at the seven years' end, that the woman returned out of the land of the Philistines: and she went forth to cry unto the king for her house and for her land.", "4": "And the king talked with Gehazi the servant of the man of God, saying, Tell me, I pray thee, all the great things that Elisha hath done.", "5": "And it came to pass, as he was telling the king how he had restored ➔ a dead body to life, that, behold, the woman, whose son he had restored to life, cried to the king for her house and for her land. And Gehazi said, My lord, O king, this is the woman, and this is her son, whom Elisha restored to life.", "6": "And when the king asked the woman, she told him. So the king appointed unto her a certain officer, saying, Restore all that was hers, and all the fruits of the field since the day that she left the land, even until now.", "7": "And Elisha came to Damascus; and Benhadad the king of Syria was sick; and it was told him, saying, The man of God is come hither.", "8": "And the king said unto Hazael, Take a present in thine hand, and go, meet the man of God, and enquire of the LORD by him, saying, Shall I recover of this disease?", "9": "So Hazael went to meet him, and took a present with him, even of every good thing of Damascus, forty camels' burden, and came and stood before him, and said, Thy son Benhadad king of Syria hath sent me to thee, saying, Shall I recover of this disease?", "10": "And Elisha said unto him, Go, say unto him, Thou mayest certainly recover: howbeit the LORD hath shewed me that he shall surely die.", "11": "And he settled his countenance stedfastly, until he was ashamed: and the man of God wept.", "12": "And Hazael said, Why weepeth my lord? And he answered, Because I know the evil that thou wilt do unto the children of Israel: their strong holds wilt thou set on fire, and their young men wilt thou slay with the sword, and wilt dash their children, and rip up their women with child.", "13": "And Hazael said, But what, is thy servant a dog, that he should do this great thing? And Elisha answered, The LORD hath shewed me that thou shalt be king over Syria.", "14": "So he departed from Elisha, and came to his master; who said to him, What said Elisha to thee? And he answered, He told me that thou shouldest surely recover.", "15": "And it came to pass on the morrow, that he took a thick cloth, and dipped it in water, and spread it on his face, so that he died: and Hazael reigned in his stead.", "16": "And in the fifth year of Joram the son of Ahab king of Israel, Jehoshaphat being then king of Judah, Jehoram the son of Jehoshaphat king of Judah began to reign.", "17": "Thirty and two years old was he when he began to reign; and he reigned eight years in Jerusalem.", "18": "And he walked in the way of the kings of Israel, as did the house of Ahab: for the daughter of Ahab was his wife: and he did evil in the sight of the LORD.", "19": "Yet the LORD would not destroy Judah for David his servant's sake, as he promised him to give him alway a light, and to his children.", "20": "In his days Edom revolted from under the hand of Judah, and made a king over themselves.", "21": "So Joram went over to Zair, and all the chariots with him: and he rose by night, and smote the Edomites which compassed him about, and the captains of the chariots: and the people fled into their tents.", "22": "Yet Edom revolted from under the hand of Judah unto this day. Then Libnah revolted at the same time.", "23": "And the rest of the acts of Joram, and all that he did, are they not written in the book of the chronicles of the kings of Judah?", "24": "And Joram slept with his fathers, and was buried with his fathers in the city of David: and Ahaziah his son reigned in his stead.", "25": "In the twelfth year of Joram the son of Ahab king of Israel did Ahaziah the son of Jehoram king of Judah begin to reign.", "26": "Two and twenty years old was Ahaziah when he began to reign; and he reigned one year in Jerusalem. And his mother's name was Athaliah, the daughter of Omri king of Israel.", "27": "And he walked in the way of the house of Ahab, and did evil in the sight of the LORD, as did the house of Ahab: for he was the son in law of the house of Ahab.", "28": "And he went with Joram the son of Ahab to the war against Hazael king of Syria in Ramothgilead; and the Syrians wounded Joram.", "29": "And king Joram went back to be healed in Jezreel of the wounds which the Syrians had given him at Ramah, when he fought against Hazael king of Syria. And Ahaziah the son of Jehoram king of Judah went down to see Joram the son of Ahab in Jezreel, because he was sick."}}, "tsk": {"1": [{"kopje": "van wie hij de zoon", "refs": ["2 Kon 4:18", "2 Kon 4:31-35"]}, {"kopje": "woon als vreemdeling", "refs": ["Gen 12:10", "Gen 26:1", "Gen 47:4", "Ruth 1:1"]}, {"kopje": abel": null}, {"disp": "2 Kon 9:14", "href": "../../2-koningen/9/#v14", "ref": "2 Kon 9:14", "svLabel": null}, {"disp": "2 Kon 9:15", "href": "../../2-koningen/9/#v15", "ref": "2 Kon 9:15", "svLabel": null}, {"disp": "2 Kron 22:5", "href": "../../2-kronieken/22/#v5", "ref": "2 Kron 22:5", "svLabel": null}, {"disp": "2 Kron 22:6", "href": "../../2-kronieken/22/#v6", "ref": "2 Kron 22:6", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Syria", "href": "../../torrey/s/#t-syria", "kinderen": [{"label": "Joram king of Israel in seeking to recover Ramothgilead from,severely wounded", "href": "../../torrey/s/?hl=2Kgs.8.29#i20676", "refs": [{"disp": "2 Kon 8:28", "href": "../../2-koningen/8/#v28", "ref": "2 Kon 8:28", "svLabel": null}, {"disp": "2 Kon 8:29", "href": "../../2-koningen/8/#v29", "ref": "2 Kon 8:29", "svLabel": null}, {"disp": "2 Kon 9:15", "href": "../../2-koningen/9/#v15", "ref": "2 Kon 9:15", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"1 Kon 8:56": "Geloofd zij de HEERE, Die aan Zijn volk Israël rust gegeven heeft, naar alles wat Hij gesproken heeft! Niet één woord is er gevallen van al Zijn goede woorden, die Hij gesproken heeft door de dienst van Mozes, Zijn dienaar.", "Ex 12:41": "En het gebeurde aan het einde van de vierhonderd en dertig jaren, op diezelfde dag gebeurde het, dat alle legers van de HEERE uit Egypteland gegaan zijn.", "Richt 7:25": "En zij vingen twee vorsten van de Midianieten, Oreb en Zeëb, en doodden Oreb op de rots Oreb, en Zeëb doodden zij bij de perskuip van Zeëb, en achtervolgden de Midianieten; en zij brachten de hoofden van Oreb en Zeëb naar Gideon, aan de overkant van de Jordaan.", "Gen 19:16": "Maar hij aarzelde; toen grepen die mannen zijn hand, en de hand van zijn vrouw, en de hand van zijn twee dochters, omdat de HEERE hem genadig was; en zij brachten hem naar buiten, en zetten hem buiten de stad neer.", "2 Kon 10:2": "Zo gauw deze brief tot u komt - omdat de zonen van uw heer bij u zijn, ook de wagens en de paarden bij u zijn, alsook een vaste stad, en wapens -", "1 Kon 22:51": "En Josafat ontsliep met zijn vaderen, en werd bij zijn vaderen begraven in de stad van zijn vader David; en zijn zoon Joram werd koning in zijn plaats.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "1 Kon 11:12": "In uw dagen echter zal Ik dat niet doen, omwille van uw vader David; van de hand van uw zoon zal Ik het scheuren.", "2 Kron 22:7": "De val van Ahazia nu was van God, doordat hij naar Joram kwam; want toen hij gekomen was, ging hij met Joram uit naar Jehu, de zoon van Nimsi, aan wie de HEERE gezalfd had om het huis van Achab uit te roeien.", "Ps 105:42": "Want Hij dacht aan Zijn heilig woord, aan Abraham, Zijn knecht.", "Filem 1:14": "Maar ik heb zonder uw goedvinden niets willen doen, opdat uw weldaad niet zou zijn als door dwang, maar vrijwillig.", "Amos 1:4": "Daarom zal Ik een vuur in het huis van Hazaël zenden, dat zal de paleizen van Benhadad verteren.", "Jes 28:1-8": "Wee de hoogmoedige kroon van de dronkaards van Efraïm, wiens heerlijke sieraad een verwelkende bloem is, die daar is op het hoofd van de zeer vruchtbare vallei, van hen die door de wijn geveld zijn. Zie, de Heere heeft een sterke en machtige, er is als een hagelvloed, een verwoestende storm; als een vloed van sterk, overstromend water zal Hij ze met de hand ter aarde neerwerpen. De hoogmoedige kroon van de dronkaards van Efraïm zal met voeten vertrapt worden.", "1 Kor 5:6-8": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt? Zuiver dan de oude zuurdesem weg, opdat u een nieuw deeg mag zijn, zoals u ongezuurd bent. Want ook ons Pascha is voor ons geslacht, namelijk Christus. Laten we dan feest houden, niet met de oude zuurdesem, ook niet met de zuurdesem van kwaadheid en boosheid, maar met de ongezuurde broden van oprechtheid en waarheid.", "1 Kon 14:3": "En neem in uw hand tien broden, en koeken, en een kruik honing, en ga naar hem toe; hij zal u vertellen wat er met deze jongen gebeuren zal.", "2 Kon 3:9": "Zo trok de koning van Israël op, en de koning van Juda, en de koning van Edom; en toen zij zeven dagreizen omgetrokken waren, had het leger en het vee dat hen volgde, geen water.", "Gen 18:30": "Verder zei hij: Laat de Heere toch niet boos worden, dat ik spreek; misschien zullen daar dertig gevonden worden! En Hij zei: Ik zal het niet doen, als Ik daar dertig zal vinden.", "Rom 9:2": "dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is.", "Deut 21:10": "Wanneer u uittrekt ten strijde tegen uw vijanden, en de HEERE, uw God, hen in uw hand gegeven heeft, zodat u hun gevangenen gevankelijk wegvoert;", "2 Kron 22:1-9": "En de inwoners van Jeruzalem maakten Ahazia, zijn jongste zoon, koning in zijn plaats; want de bende die met de Arabieren in het leger gekomen was, had alle oudere broers gedood. Ahazia dan, de zoon van Joram, de koning van Juda, regeerde. Ahazia was tweeënveertig jaar oud toen hij koning werd, en hij regeerde een jaar in Jeruzalem; en de naam van zijn moeder was Athalia, een dochter van Omri. Hij wandelde ook in de wegen van het huis van Achab; want zijn moeder was zijn raadgeefster, om goddeloos te handelen.", "2 Kon 9:32": "En hij hief zijn gezicht op naar het venster, en zei: Wie is met mij? Wie? Toen keken er twee, drie kamerlingen naar hem.", "1 Sam 24:5-8": "Toen zeiden de mannen van David tegen hem: Zie de dag waarop de HEERE tegen u zegt: Zie, Ik geef uw vijand in uw hand, en u zult hem doen zoals het goed zal zijn in uw ogen. En David stond op, en sneed stilletjes een slip van Sauls mantel af. Doch het gebeurde daarna, dat het hart van David hem sloeg, omdat hij de slip van Saul afgesneden had. En hij zei tegen zijn mannen: Laat het ver van mij zijn bij de HEERE, dat ik deze zaak zou doen aan mijn heer, de gezalfde van de HEERE, dat ik mijn hand tegen hem uit zou steken; want hij is de gezalfde van de HEERE!", "Neh 1:5": "En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "2 Kon 9:16": "Toen reed Jehu, en trok naar Jizreël; want Joram lag daar; en Ahazia, de koning van Juda, was afgekomen om Joram te bezoeken.", "Spr 29:12": "Een heerser die op leugentaal let, al zijn dienaars worden goddeloos.", "2 Sam 23:5": "Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.", "Ps 22:21": "Red mijn ziel van het zwaard, mijn eenzame van het geweld van de hond.", "2 Kon 11:13-16": "Toen Athalia de stem hoorde van de lijfwacht en van het volk, kwam zij bij het volk in het huis van de HEERE. En zij zag toe, en zie, de koning stond bij de pilaar, naar de gewoonte, en de leiders en de trompetten bij de koning; en al het volk van het land was blij en blies op trompetten. Toen scheurde Athalia haar kleren en riep: Verraad, verraad! Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.", "Klaagl 3:23": "Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.", "Ps 92:15": "In de grijze ouderdom zullen zij nog vruchten dragen; zij zullen vet en groen zijn,", "1 Kon 20:1": "En Benhadad, de koning van Syrië, verzamelde al zijn leger; en twee en dertig koningen waren met hem, en paarden en wagens; en hij trok op, en belegerde Samaria en streed tegen haar.", "1 Kron 21:12": "Of drie jaren honger, of drie maanden verteerd te worden voor het aangezicht van uw tegenstanders, en dat het zwaard van uw vijanden u achterhaalt; of drie dagen het zwaard van de HEERE, dat is, de pestilentie in het land, en een verdervende engel van de HEERE in al de gebieden van Israël? Zo bezie nu goed, wat antwoord ik Hem zal teruggeven, Die mij gezonden heeft.", "Deut 20:13": "En de HEERE, uw God, zal haar in uw hand geven; en u zult alles wat mannelijk daarin is, slaan met de scherpte van het zwaard;", "2 Kon 8:16-24": "In het vijfde jaar van Joram, de zoon van Achab, de koning van Israël, toen Josafat koning was van Juda, begon Jehoram, de zoon van Josafat, de koning van Juda, te regeren. Hij was tweeëndertig jaar oud toen hij koning werd, en hij regeerde acht jaar in Jeruzalem. En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want de dochter van Achab was zijn vrouw geworden; en hij deed wat slecht was in de ogen van de HEERE.", "Gen 19:22": "Haast u, vlucht daarheen; want Ik zal niets kunnen doen, totdat u daar aangekomen bent. Daarom noemde men de naam van deze stad Zoar.", "2 Kron 18:2": "En na enige jaren trok hij af naar Achab, naar Samaria; en Achab slachtte schapen en runderen voor hem in overvloed, en voor het volk dat bij hem was, en hij spoorde hem aan om samen op te trekken naar Ramoth in Gilead.", "2 Sam 21:1": "Er was in de dagen van David een hongersnood, drie jaren lang, jaar na jaar; en David zocht het aangezicht van de HEERE. En de HEERE zei: Het is om Saul en om zijn bloedhuis, omdat hij de Gibeonieten gedood heeft.", "2 Kon 13:7": "Want hij had Joahaz geen volk laten overblijven dan vijftig ruiters en tien wagens, en tienduizend van het voetvolk; want de koning van Syrië had hen omgebracht, en had hen gemaakt als stof door ze te dorsen.", "Luk 13:23": "En iemand zei tegen Hem: Heere, zijn het er weinig die behouden worden? En Hij zei tegen hen:", "2 Kon 9:24": "Maar Jehu spande de boog met volle kracht, en schoot Joram tussen zijn armen, zodat de pijl door zijn hart naar buiten kwam; en hij zeeg neer in zijn wagen.", "Jer 33:25": "Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, als Ik de ordeningen van de hemel en de aarde niet had vastgesteld;", "2 Kron 23:21": "En heel het volk van het land was blij, en de stad werd stil, nadat zij Athalia met het zwaard gedood hadden.", "1 Kon 22:34": "Toen spande een man zijn boog, zomaar, zonder te mikken, en schoot de koning van Israël tussen de gespen en het pantser. Toen zei hij tegen zijn voerman: Keer uw hand, en breng mij uit het leger, want ik ben zwaar gewond.", "Jes 9:7-20": "De Heere heeft een woord gezonden in Jakob, en het is gevallen in Israël. En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden: De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Rom 11:28": "Zo zijn zij wel vijanden aangaande het Evangelie, om uwentwil, maar aangaande de verkiezing zijn zij geliefden, om de vaderen wil;", "Zach 1:20": "En de HEERE toonde mij vier smeden.", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Gen 12:7": "Toen verscheen de HEERE aan Abram, en zei: Aan uw nageslacht zal Ik dit land geven. Toen bouwde hij daar een altaar voor de HEERE, Die hem verschenen was.", "Luk 23:8": "En toen Herodes Jezus zag, werd hij zeer verblijd; want hij was al geruime tijd begerig geweest Hem te zien, omdat hij veel over Hem hoorde; en hij hoopte een of ander teken te zien dat door Hem gedaan zou worden.", "Hagg 2:6": "Met het woord, waarmee Ik met u een verbond gemaakt heb, toen u uit Egypte trok, en met Mijn Geest, die in uw midden staat: wees niet bevreesd!", "Hos 2:18": "En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.", "Jes 49:7": "Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft.", "2 Kon 6:9-12": "Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer. Toen werd het hart van de koning van Syrië onrustig over deze zaak; en hij riep zijn knechten, en zei tegen hen: Zult u mij dan niet laten weten wie van ons voor de koning van Israël is?", "1 Tess 5:24": "Hij, Die u roept, is getrouw, Die het ook doen zal.", "Jer 29:19": "Omdat zij naar Mijn woorden niet geluisterd hebben, spreekt de HEERE, toen Ik Mijn knechten, de profeten, tot hen zond, vroeg opstaand en zendend; maar u hebt niet geluisterd, spreekt de HEERE.", "2 Kon 19:34": "Want Ik zal deze stad beschermen, om die te verlossen, om Mijnentwil, en om de wil van David, Mijn knecht.", "Gal 5:7-9": "U liep goed; wie heeft u verhinderd de waarheid niet gehoorzaam te zijn? Deze overtuiging komt niet van Hem, Die u roept. Een beetje zuurdesem verzuurt het hele deeg.", "1 Sam 25:18": "Toen haastte Abigaïl zich, en nam tweehonderd broden, en twee lederzakken wijn, en vijf toebereide schapen, en vijf maten geroosterd koren, en honderd stukken rozijnen, en tweehonderd klompen vijgen, en legde die op ezels.", "Gen 26:5": "omdat Abraham Mijn stem gehoorzaam is geweest, en Mijn bevel heeft onderhouden, Mijn geboden, Mijn inzettingen en Mijn wetten.", "Jer 29:17": "Zo zegt de HEERE van de heerscharen: Ziet, Ik zal het zwaard, de honger en de pest onder hen zenden; en Ik zal hen maken als de afschuwelijke vijgen, die vanwege hun slechtheid niet gegeten kunnen worden.", "2 Kon 8:8-15": "Toen zei de koning tegen Hazaël: Neem een geschenk mee, en ga de man Gods tegemoet, en vraag door hem de HEERE: Zal ik van deze ziekte genezen? Zo ging Hazaël hem tegemoet, en nam een geschenk mee, namelijk al het goede van Damaskus, een last van veertig kamelen; en hij kwam, en stond voor hem, en zei: Uw zoon Benhadad, de koning van Syrië, heeft mij naar u gezonden om te vragen: Zal ik van deze ziekte genezen? En Elisa zei tegen hem: Ga, zeg hem: U zult beslist niet genezen; want de HEERE heeft mij getoond dat hij zeker zal sterven.", "2 Kon 11:20": "En al het volk van het land was blij, en de stad werd stil, nadat zij Athalia met het zwaard gedood hadden bij het huis van de koning.", "Gen 26:4": "En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "Rom 11:1": "Ik zeg dan: Heeft God Zijn volk verstoten? Dat zij verre. Want ik ben ook een Israëliet, uit het zaad van Abraham, van de stam Benjamin.", "Ps 146:6": "Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid.", "Gen 18:32": "Nog zei hij: Laat de Heere toch niet boos worden, dat ik alleen deze keer nog spreek: misschien zullen er tien gevonden worden. En Hij zei: Ik zal haar niet verwoesten omwille van de tien.", "2 Kon 6:32": "(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?", "2 Kron 21:5": "Tweeëndertig jaar was Joram oud toen hij koning werd, en hij regeerde acht jaar in Jeruzalem.", "1 Kor 7:14": "Want de ongelovige man is geheiligd door de vrouw, en de ongelovige vrouw is geheiligd door de man; want anders waren uw kinderen onrein, maar nu zijn zij heilig.", "Ex 6:4": "En ook heb Ik het gekerm gehoord van de kinderen van Israël, die de Egyptenaars in dienstbaarheid houden, en Ik heb aan Mijn verbond gedacht.", "2 Kon 5:14": "Toen daalde hij af, en doopte zich zeven keer onder in de Jordaan, naar het woord van de man van God; en zijn vlees kwam weer terug, zoals het vlees van een klein kind; en hij werd rein.", "Hand 20:31": "Daarom, waak, en bedenk dat ik drie jaar lang, nacht en dag, niet heb opgehouden ieder met tranen te vermanen.", "2 Kron 22:1": "En de inwoners van Jeruzalem maakten Ahazia, zijn jongste zoon, koning in zijn plaats; want de bende die met de Arabieren in het leger gekomen was, had alle oudere broers gedood. Ahazia dan, de zoon van Joram, de koning van Juda, regeerde.", "Luk 21:22": "Want dit zijn dagen van wraak, opdat alles vervuld wordt wat geschreven is.", "2 Kron 22:1-4": "En de inwoners van Jeruzalem maakten Ahazia, zijn jongste zoon, koning in zijn plaats; want de bende die met de Arabieren in het leger gekomen was, had alle oudere broers gedood. Ahazia dan, de zoon van Joram, de koning van Juda, regeerde. Ahazia was tweeënveertig jaar oud toen hij koning werd, en hij regeerde een jaar in Jeruzalem; en de naam van zijn moeder was Athalia, een dochter van Omri. Hij wandelde ook in de wegen van het huis van Achab; want zijn moeder was zijn raadgeefster, om goddeloos te handelen.", "Deut 31:6": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten.", "Gen 47:4": "Verder zeiden zij tegen Farao: Wij zijn gekomen om als vreemdelingen in dit land te wonen; want er is geen weide voor de schapen die uw knechten hebben, omdat de honger zwaar is in het land Kanaän; en laat nu toch uw knechten in het land Gosen wonen!", "Rom 11:2": "God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt:", "Ps 18:31": "Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Jer 19:9": "En Ik zal hun het vlees van hun zonen en het vlees van hun dochters doen eten, en zij zullen eten, ieder het vlees van zijn naaste, in de belegering en in de benauwing, waarmee hun vijanden, en zij die hun ziel zoeken, hen benauwen zullen.", "2 Kon 1:10": "Maar Elia antwoordde en sprak tot de leider over vijftig: Als ik dan een man van God ben, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde er vuur uit de hemel neer, en het verteerde hem en zijn vijftigtal.", "Matt 24:22": "En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.", "2 Sam 3:8": "Toen ontstak Abner in grote woede over de woorden van Isboseth, en zei: Ben ik dan een hondenkop, ik, die tegen Juda, aan het huis van Saul, uw vader, aan zijn broers en aan zijn vrienden, tot op vandaag trouw bewijs, en u niet in Davids hand overgeleverd heb, dat u mij vandaag beschuldigt vanwege de schuld met deze vrouw?", "Hand 17:6": "En toen zij hen niet vonden, sleepten zij Jason en enkele broeders voor de leiders van de stad en riepen: Dezen, die de wereld op zijn kop hebben gezet, zijn ook hier gekomen;", "Neh 9:32": "Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag.", "1 Sam 15:33": "Maar Samuël zei: Zoals uw zwaard vrouwen van hun kinderen beroofd heeft, zo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht van de HEERE te Gilgal.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "1 Kon 3:16-28": "Toen kwamen er twee vrouwen, die hoeren waren, bij de koning, en zij stonden voor zijn aangezicht. En de ene vrouw zei: Och, mijn heer. Ik en deze vrouw wonen in één huis; en ik heb bij haar in dat huis een kind gekregen. Het is nu gebeurd op de derde dag na mijn bevalling, dat deze vrouw ook een kind gekregen heeft; en wij waren samen, er was geen vreemde bij ons in dat huis, behalve wij tweeën in het huis.", "2 Kon 6:21": "En de koning van Israël zei tegen Elisa, toen hij hen zag: Zal ik hen doden? Zal ik hen doden, mijn vader?", "Jes 14:30": "En de eerstgeborenen van de armen zullen weiden, en de behoeftigen zullen zeker neerliggen; uw wortel daarentegen zal Ik door de honger doden, en uw overblijfsel zal hij ombrengen.", "Amos 7:1": "De Heere HEERE liet mij dit zien: zie, Hij vormde sprinkhanen, in het begin van het opkomen van het nagras; en zie, het was het nagras, na het maaien van de koning.", "1 Kon 14:1-4": "In die tijd werd Abia, de zoon van Jerobeam, ziek. En Jerobeam zei tegen zijn vrouw: Sta nu op, en verkleed u, zodat men niet merkt dat u Jerobeams vrouw bent, en ga naar Silo. Zie, daar is de profeet Ahia, die tegen mij gezegd heeft dat ik koning zou zijn over dit volk. En neem in uw hand tien broden, en koeken, en een kruik honing, en ga naar hem toe; hij zal u vertellen wat er met deze jongen gebeuren zal.", "2 Tim 2:17": "En hun woord zal voortvreten als de kanker; onder wie zijn Hymeneüs en Filetus;", "2 Kon 7:10": "Zo kwamen zij, en riepen naar de poortwachter van de stad, en meldden het hun, en zeiden: Wij zijn bij het leger van de Syriërs gekomen, en zie, er was daar niemand, ook geen mensenstem; maar wel paarden vastgebonden, en ezels vastgebonden, en de tenten, precies zoals ze waren.", "1 Kon 15:5": "Omdat David gedaan had wat recht was in de ogen van de HEERE, en niet geweken was van alles wat Hij hem geboden had, al de dagen van zijn leven, behalve alleen in de zaak van Uria, de Hethiet.", "Jes 13:18": "Maar hun bogen zullen de jongemannen verpletteren, en zij zullen zich niet ontfermen over de vrucht van de buik; hun oog zal de kinderen niet ontzien.", "Deut 22:2": "En als uw broeder niet dicht bij u woont, of u hem niet kent, zo zult u ze binnen in uw huis verzamelen, dat ze bij u blijven totdat uw broeder ze zoekt, en u ze hem teruggeeft.", "2 Kon 1:2": "En Ahazia viel door een traliewerk in zijn bovenzaal, die te Samaria was, en werd ziek. En hij zond boden en zei tegen hen: Ga heen, vraag Baäl-Zebub, de god van Ekron, of ik van deze ziekte genezen zal worden.", "1 Sam 27:1-3": "David zei in zijn hart: Nu zal ik op een dag door de hand van Saul omkomen. Ik kan niets beters doen dan snel ontkomen naar het land van de Filistijnen, opdat Saul de hoop op mij verliest en mij niet langer zoekt in heel het gebied van Israël; zo zal ik ontkomen uit zijn hand. Toen maakte David zich op en trok weg, hij en de zeshonderd mannen die bij hem waren, naar Achis, de zoon van Maoch, de koning van Gath. En David bleef bij Achis in Gath, hij en zijn mannen, ieder met zijn huisgezin; David met zijn beide vrouwen, Ahinoam, de Jizreëlietische, en Abigaïl, de vrouw van Nabal, de Karmelietische.", "Ps 107:33": "Hij maakt van rivieren een woestijn, en van waterbronnen dorstig land.", "Lev 26:45": "Maar Ik zal hun ten goede denken aan het verbond van hun voorouders, die Ik uit het land Egypte voor de ogen van de heidenen uitgevoerd heb, opdat Ik hun tot een God zou zijn; Ik ben de HEERE!", "2 Kron 21:10": "Toch kwamen de Edomieten in opstand tegen het gezag van Juda, tot op deze dag; in dezelfde tijd kwam ook Libna in opstand tegen zijn gezag, want hij had de HEERE, de God van zijn voorouders, verlaten.", "2 Kon 8:25-27": "In het twaalfde jaar van Joram, de zoon van Achab, de koning van Israël, begon Ahazia, de zoon van Jehoram, de koning van Juda, te regeren. Ahazia was tweeëntwintig jaar oud toen hij koning werd, en regeerde één jaar in Jeruzalem; en de naam van zijn moeder was Athalia, de dochter van Omri, de koning van Israël. En hij ging de weg van het huis van Achab, en deed wat slecht was in de ogen van de HEERE, zoals het huis van Achab; want hij was een schoonzoon van het huis van Achab.", "Neh 13:25": "Zo twistte ik met hen, en vloekte hen, en sloeg sommige mannen van hen, en trok hun het haar uit; en ik liet hen zweren bij God: U zult uw dochters niet aan hun zonen geven, en van hun dochters niet nemen voor uw zonen of voor uzelf!", "1 Kon 16:18": "En het gebeurde, toen Zimri zag dat de stad ingenomen was, dat hij het paleis van het huis van de koning inging, en het huis van de koning boven zich met vuur verbrandde, en stierf;", "Ps 105:16": "Hij riep ook een honger over het land; Hij brak elke staf van het brood.", "2 Kon 8:25-29": "In het twaalfde jaar van Joram, de zoon van Achab, de koning van Israël, begon Ahazia, de zoon van Jehoram, de koning van Juda, te regeren. Ahazia was tweeëntwintig jaar oud toen hij koning werd, en regeerde één jaar in Jeruzalem; en de naam van zijn moeder was Athalia, de dochter van Omri, de koning van Israël. En hij ging de weg van het huis van Achab, en deed wat slecht was in de ogen van de HEERE, zoals het huis van Achab; want hij was een schoonzoon van het huis van Achab.", "Gen 13:15": "Want al dit land, dat u ziet, zal Ik u geven, en aan uw nageslacht, tot in eeuwigheid.", "Joz 8:29": "En de koning van Ai hing hij aan een paal, tot de avond; en omtrent het ondergaan van de zon gebood Jozua dat men zijn dode lichaam van de paal zou afnemen; en zij wierpen het bij de ingang van de stadspoort, en richtten daarop een grote steenhoop op, die er is tot op deze dag.", "Ps 89:6": "Daarom loven de hemelen Uw wonderen, o HEERE! ook is Uw getrouwheid in de gemeente van de heiligen.", "Jes 7:14": "Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen.", "Ps 89:29": "Ik zal hem Mijn goedertierenheid in eeuwigheid bewaren, en Mijn verbond zal hem vast blijven.", "Jer 39:6": "En de koning van Babel slachtte de zonen van Zedekia te Ribla voor zijn ogen; ook slachtte de koning van Babel alle edelen van Juda.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "Ezech 18:13": "Uitleent op woeker, en overwinst neemt; zou die leven? Hij zal niet leven, al die gruwelen heeft hij gedaan; hij zal zeker gedood worden; zijn bloed zal op hem zijn!", "2 Kon 17:21": "Want Hij scheurde Israël af van het huis van David, en zij maakten Jerobeam, de zoon van Nebat, koning; en Jerobeam dreef Israël weg van achter de HEERE vandaan, en liet hen een grote zonde zondigen.", "1 Kon 9:22": "Doch van de kinderen van Israël maakte Salomo geen slaaf; maar zij waren krijgslieden, en zijn knechten, en zijn vorsten, en zijn hoofdlieden, en de aanvoerders van zijn wagens, en van zijn ruiters.", "Hos 11:6": "En het zwaard zal in zijn steden blijven, en zijn grendels verteren, en opeten, vanwege hun beraadslagingen.", "Gen 24:27": "en hij zei: Geloofd zij de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en trouw niet onthouden heeft aan mijn heer; wat mij betreft, de HEERE heeft mij op deze weg geleid, naar het huis van de broers van mijn heer.", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "1 Kon 8:15": "En hij zei: Geloofd zij de HEERE, de God van Israël, Die met Zijn mond tot mijn vader David gesproken heeft, en het met Zijn hand vervuld heeft, en zei:", "Jes 8:4-7": "Want voordat dat jongetje kan roepen: Mijn vader! of: mijn moeder!, zal men de rijkdom van Damaskus en de buit van Samaria wegdragen voor de koning van Assur. En de HEERE sprak nog verder tegen mij en zei: Omdat dit volk het water van Siloa veracht, dat zachtjes stroomt, en er vreugde is bij Rezin en de zoon van Remalia,", "Jes 49:16": "Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.", "Ps 89:34": "Maar Mijn goedertierenheid zal Ik van hem niet wegnemen, en in Mijn getrouwheid niet feilen.", "Jes 44:21": "Denk aan deze dingen, o Jakob, en Israël! Want u bent Mijn knecht, Ik heb u geformeerd; u bent Mijn knecht, Israël, u zult door Mij niet vergeten worden.", "Hebr 6:13-19": "Want toen God aan Abraham de belofte deed, zwoer Hij bij Zichzelf, omdat Hij bij niemand groter kon zweren, en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken. En zo heeft hij, nadat hij geduldig volhard had, de belofte verkregen.", "Ex 14:7": "En hij nam zeshonderd uitgelezen wagens, ja, alle wagens van Egypte, en de hoofdlieden over die allemaal.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "2 Sam 22:31": "Gods weg is volmaakt; het woord van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Lev 26:26": "Als Ik u de staf van het brood zal hebben gebroken, dan zullen tien vrouwen uw brood in één oven bakken, en zullen uw brood bij het gewicht teruggeven; en u zult eten, maar niet verzadigd worden.", "2 Kon 2:15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "Hand 2:39": "Want voor u is de belofte, en voor uw kinderen, en voor allen die ver weg zijn, zoveel als de Heere, onze God, ertoe roepen zal.", "1 Kron 17:27": "Nu dan, het heeft U behaagd het huis van Uw knecht te zegenen, zodat het in eeuwigheid voor Uw aangezicht zal zijn; want U, HEERE, hebt het gezegend, en het zal gezegend zijn in eeuwigheid.", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "1 Kon 14:15": "De HEERE zal ook Israël slaan, zoals een riet heen en weer bewogen wordt in het water, en zal Israël uitrukken uit dit goede land, dat Hij hun vaderen gegeven heeft, en zal hen verstrooien aan de overkant van de rivier; omdat zij hun gewijde palen gemaakt hebben, en de HEERE tot toorn verwekt hebben.", "Hebr 12:15": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.", "Jer 5:1": "Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn.", "Jes 7:8": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is.", "2 Kron 21:1": "Daarna stierf Josafat en werd bij zijn voorouders begraven, in de stad van David; en zijn zoon Joram werd koning in zijn plaats.", "Spr 12:7": "De goddelozen worden omgekeerd, zodat zij niet meer zijn; maar het huis van de rechtvaardigen zal bestaan.", "2 Kon 8:1-6": "Elisa had tegen de vrouw gesproken, van wie hij de zoon levend gemaakt had. Hij zei: Maak u klaar, en ga weg, u en uw huisgezin, en woon als vreemdeling waar u maar wonen kunt; want de HEERE heeft een hongersnood aangekondigd, die ook zeven jaar lang over het land zal komen. En de vrouw had zich klaargemaakt en had gedaan naar het woord van de man Gods; zij was met haar huisgezin weggegaan, en had als vreemdeling gewoond in het land van de Filistijnen, zeven jaar lang. En het gebeurde na het einde van de zeven jaar, dat de vrouw uit het land van de Filistijnen terugkeerde; en zij ging naar de koning om te smeken voor haar huis en voor haar akker.", "2 Sam 8:2": "Ook sloeg hij de Moabieten, en mat hen met een snoer, en liet hen op de aarde neerliggen; en hij mat met twee snoeren om te doden, en met een vol snoer om in het leven te laten. Zo werden de Moabieten David tot knechten, en zij brachten geschenken.", "Hebr 10:23": "Laten wij de onwankelbare belijdenis van de hoop vasthouden (want Die het beloofd heeft, is trouw);", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "1 Sam 24:14": "Zoals het spreekwoord van de ouden zegt: Van de goddelozen komt goddeloosheid voort; maar mijn hand zal niet tegen u zijn.", "Hand 24:24": "En na enige dagen kwam Felix daar met Drusilla, zijn vrouw, die een Jodin was, en hij liet Paulus halen, en hoorde hem over het geloof in Christus.", "Jes 51:6": "Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Gen 6:1-5": "En het gebeurde, toen de mensen op de aardbodem begonnen te vermenigvuldigen, en hun dochters geboren werden, dat Gods zonen de dochters der mensen aanzagen, dat zij mooi waren, en zij namen zich vrouwen uit allen die zij verkozen hadden. Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Matt 26:33-35": "Doch Petrus antwoordde en zei tegen Hem: Al werden zij ook allen aan U geërgerd, ik zal nooit geërgerd worden. Jezus zei tegen hem: Voorwaar, Ik zeg u dat u in deze zelfde nacht, voordat de haan gekraaid zal hebben, Mij driemaal zult verloochenen. Petrus zei tegen Hem: Al moest ik ook met U sterven, ik zal U geenszins verloochenen! Hetzelfde zeiden ook alle discipelen.", "Joz 10:15-40": "Toen keerde Jozua terug, en heel Israël met hem, naar het leger te Gilgal. Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda. En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda.", "2 Kon 10:33": "Vanaf de Jordaan, tegen de opgang van de zon, het gehele land van Gilead, van de Gadieten, en van de Rubenieten, en van de Manassieten; van Aroër, dat aan de beek van Arnon is, en Gilead, en Basan.", "Amos 1:3-5": "Zo zegt de HEERE: Om drie overtredingen van Damaskus, en om vier zal Ik dat niet afwenden; omdat zij Gilead met ijzeren dorswagens hebben gedorst. Daarom zal Ik een vuur in het huis van Hazaël zenden, dat zal de paleizen van Benhadad verteren. En Ik zal de grendel van Damaskus verbreken, en zal de inwoner uitroeien uit Bikeat-aven, en hem die de scepter houdt, uit Beth-eden; en het volk van Syrië zal als gevangenen worden weggevoerd naar Kir, zegt de HEERE.", "1 Sam 9:8": "En de knecht antwoordde Saul verder en zei: Zie, ik heb bij me het vierde deel van een zilveren sikkel; dat zal ik de man van God geven, opdat hij ons onze weg wijst.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Gen 18:26": "Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen.", "Est 5:14": "Toen zei zijn vrouw Zeres tegen hem, alsook al zijn vrienden: Laat men een galg maken, vijftig el hoog, en zeg morgen tegen de koning dat men Mordechai daaraan laat hangen; ga dan vrolijk met de koning naar die maaltijd. Dit voorstel nu leek Haman goed, en hij liet de galg maken.", "2 Kron 25:23": "En Joas, de koning van Israël, greep Amazia, de koning van Juda, de zoon van Joas, de zoon van Joahaz, te Beth-semes; en hij bracht hem naar Jeruzalem, en hij brak een deel van de muur van Jeruzalem af, van de poort van Efraïm tot aan de Hoekpoort, vierhonderd el.", "1 Kon 15:26": "En hij deed wat kwaad was in de ogen van de HEERE, en wandelde in de weg van zijn vader, en in zijn zonde, waarmee hij Israël had doen zondigen.", "Jes 54:9": "Want dat zal Mij zijn als de wateren van Noach, toen Ik zwoer dat de wateren van Noach niet meer over de aarde zouden gaan; zo heb Ik gezworen dat Ik niet meer op u toornen, of u bestraffen zal.", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "Deut 4:37": "En omdat Hij uw vaderen liefhad, en hun nageslacht na hen verkoren had, zo heeft Hij u voor Zijn aangezicht door Zijn grote kracht uit Egypte weggevoerd;", "Hand 13:33": "dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.", "2 Kon 4:42": "En er kwam een man van Baäl-Salisa, en bracht de man Gods brood van de eerstelingen, twintig gerstebroden, en groene aren in hun schillen; en hij zei: Geef aan het volk, zodat zij eten.", "1 Kon 19:15": "En de HEERE zei tegen hem: Ga, keer terug op uw weg, naar de woestijn van Damaskus; en als u daar aankomt, zalf dan Hazaël tot koning over Syrië.", "Rom 15:8": "En ik zeg dat Jezus Christus een dienaar van de besnijdenis geworden is, vanwege de waarheid van God, opdat Hij de beloften aan de vaderen zou bevestigen;", "Deut 7:8": "Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "2 Sam 9:7": "En David zei tegen hem: Wees niet bang, want ik zal zeker goedheid aan u bewijzen, omwille van uw vader Jonathan; en ik zal u alle akkers van uw vader Saul teruggeven; en u zult voortdurend brood eten aan mijn tafel.", "Spr 20:7": "De rechtvaardige wandelt steeds in zijn oprechtheid; gelukkig zijn zijn kinderen na hem.", "1 Kon 15:4": "Maar om Davids wil gaf de HEERE, zijn God, hem een lamp in Jeruzalem, door zijn zoon na hem te verwekken en Jeruzalem te bevestigen.", "Gen 6:18": "Maar met u zal Ik Mijn verbond oprichten; en u zult in de ark gaan, u, en uw zonen, en uw vrouw, en de vrouwen van uw zonen met u.", "Matt 10:29": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader.", "Richt 8:21": "Toen zeiden Zebah en Tsalmuna: Sta zelf op en val ons aan, want zoals de man is, zo is zijn kracht. Toen stond Gideon op en doodde Zebah en Tsalmuna, en nam de maantjes die aan de halzen van hun kamelen zaten.", "1 Kon 22:15": "Toen hij bij de koning gekomen was, zei de koning tegen hem: Micha, zullen wij naar Ramoth in Gilead ten strijde trekken, of zullen wij het nalaten? En hij zei tegen hem: Trek op, en u zult voorspoedig zijn, want de HEERE zal ze in de hand van de koning geven.", "2 Kron 21:6": "En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want hij had de dochter van Achab tot vrouw; en hij deed wat slecht was in de ogen van de HEERE.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Openb 8:3": "En er kwam een andere engel, en hij stond aan het altaar met een gouden wierookvat; en hem werd veel van het reukwerk gegeven, opdat hij dat met de gebeden van alle heiligen zou leggen op het gouden altaar dat voor de troon is.", "Ps 112:2": "Gimel. Zijn nakomelingen zullen machtig zijn op aarde; Daleth. het geslacht van de oprechten zal gezegend worden.", "Gen 32:10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "2 Kron 21:18-20": "En na dit alles trof de HEERE hem in zijn ingewanden met een ziekte waarvoor geen genezing was. Dit gebeurde van jaar tot jaar, zodat, toen de tijd van het einde van de twee jaren aanbrak, zijn ingewanden door de ziekte naar buiten kwamen, en hij stierf aan zware ziekten; en zijn volk maakte voor hem geen vuur, zoals het vuur voor zijn voorouders. Hij was tweeëndertig jaar oud toen hij koning werd, en regeerde acht jaar in Jeruzalem; en hij ging heen zonder dat men hem miste; en zij begroeven hem in de stad van David, maar niet in de graven van de koningen.", "1 Kon 8:20": "Zo heeft de HEERE Zijn woord bevestigd, dat Hij gesproken had; want ik ben opgestaan in de plaats van mijn vader David, en ik zit op de troon van Israël, zoals de HEERE gesproken heeft; en ik heb een huis gebouwd voor de Naam van de HEERE, de God van Israël.", "1 Kon 14:20": "De dagen nu dat Jerobeam geregeerd heeft, zijn tweeëntwintig jaren; en hij ontsliep met zijn vaderen, en Nadab, zijn zoon, regeerde in zijn plaats.", "Joël 1:15": "Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Jer 38:21": "Maar als u weigert uit te gaan, dan is dit het woord dat de HEERE mij heeft laten zien;", "Num 31:9-20": "Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit. Verder verbrandden zij al hun steden met hun woonplaatsen, en al hun burchten, met vuur. En zij namen alle buit en alle roof, van mensen en van beesten.", "2 Sam 15:2": "Ook stond Absalom 's morgens vroeg op, en ging staan aan de kant van de weg naar de poort. En het gebeurde dat Absalom iedere man die een geschil had en naar de koning wilde komen voor een rechtszaak, tot zich riep en zei: Uit welke stad bent u? Als hij dan zei: Uw knecht is uit een van de stammen van Israël,", "2 Kon 9:14": "Zo smeedde Jehu, de zoon van Josafat, de zoon van Nimsi, een samenzwering tegen Joram. (Joram had namelijk Ramoth in Gilead bewaakt, hij en heel Israël, vanwege Hazaël, de koning van Syrië;", "2 Kon 9:21-27": "Toen zei Joram: Span aan. En men spande zijn wagen aan. Zo trok Joram, de koning van Israël, uit, en Ahazia, de koning van Juda, ieder op zijn wagen; en zij trokken Jehu tegemoet, en vonden hem op het stuk land van Naboth, de Jizreëliet. Het gebeurde nu, toen Joram Jehu zag, dat hij zei: Is het ook vrede, Jehu? Maar hij zei: Wat vrede, zolang de hoererijen van uw moeder Izebel, en haar toverijen, zo veel zijn? Toen wendde Joram zijn hand, en vluchtte, en zei tegen Ahazia: Het is bedrog, Ahazia!", "1 Kon 8:24": "Die Uw dienaar, mijn vader David, gehouden hebt wat U tot hem gesproken had; want met Uw mond hebt U gesproken, en met Uw hand vervuld, zoals het op deze dag is.", "Hos 2:19": "En Ik zal u aan Mij verloven in geloof; en u zult de Heere kennen.", "Deut 9:5": "Niet om uw gerechtigheid, noch om de oprechtheid van uw hart, komt u daar binnen om hun land te erven; maar om de goddeloosheid van deze volken verdrijft de HEERE, uw God, hen voor uw aangezicht uit de bezitting: en om het woord te bevestigen dat de HEERE, uw God, aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft.", "2 Kon 1:17": "Zo stierf hij, naar het woord van de HEERE, dat Elia gesproken had; en Joram werd koning in zijn plaats, in het tweede jaar van Joram, de zoon van Josafat, de koning van Juda; want hij had geen zoon.", "Gen 27:40": "En van uw zwaard zult u leven, en u zult uw broer dienen; doch het zal gebeuren, wanneer u zult heersen, dan zult u zijn juk van uw hals afrukken.", "2 Kon 13:22": "Hazaël nu, de koning van Syrië, verdrukte Israël, al de dagen van Joahaz.", "Fil 3:2": "Let op de honden, let op de kwade arbeiders, let op de versnijding.", "Luk 19:41": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar,", "2 Kron 21:1-20": "Daarna stierf Josafat en werd bij zijn voorouders begraven, in de stad van David; en zijn zoon Joram werd koning in zijn plaats. En hij had broers, zonen van Josafat: Azarja, Jehiel, Zecharja, Azarjahu, Michaël en Sefatja; deze allen waren zonen van Josafat, de koning van Israël. En hun vader had hun veel geschenken gegeven van zilver, van goud en van kostbaarheden, alsook versterkte steden in Juda; maar het koninkrijk gaf hij aan Joram, omdat hij de eerstgeborene was.", "2 Kon 8:16-18": "In het vijfde jaar van Joram, de zoon van Achab, de koning van Israël, toen Josafat koning was van Juda, begon Jehoram, de zoon van Josafat, de koning van Juda, te regeren. Hij was tweeëndertig jaar oud toen hij koning werd, en hij regeerde acht jaar in Jeruzalem. En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want de dochter van Achab was zijn vrouw geworden; en hij deed wat slecht was in de ogen van de HEERE.", "2 Kon 4:35": "Daarna kwam hij terug, en liep in het huis heen en weer, en klom weer op het bed, en boog zich over hem heen; en de jongen niesde tot zevenmaal toe; daarna deed de jongen zijn ogen open.", "2 Kon 6:8-23": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "2 Kon 6:17-20": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa. Toen zij nu naar hem afkwamen, bad Elisa tot de HEERE, en zei: Sla toch dit volk met verblindheid. En Hij sloeg hen met verblindheid, naar het woord van Elisa. Toen zei Elisa tegen hen: Dit is de weg niet, en dit is de stad niet; volg mij, en ik zal u leiden tot de man die u zoekt; en hij leidde hen naar Samaria.", "Ps 37:28": "Want de HEERE heeft het recht lief, en zal Zijn gunstgenoten niet verlaten; in eeuwigheid worden zij bewaard; maar het nageslacht van de goddelozen wordt uitgeroeid.", "Luk 1:68-70": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht; zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Gen 37:25": "Daarna zaten zij neer om brood te eten, en zij hieven hun ogen op en zagen, en zie, een reisgezelschap van Ismaëlieten kwam uit Gilead; en hun kamelen droegen specerijen, balsem en mirre, op weg om dat naar Egypte te brengen.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "1 Kron 3:11": "zijn zoon was Joram; zijn zoon was Ahazia; zijn zoon was Joas;", "Ezech 4:16": "Daarna zei Hij tegen mij: Mensenkind, zie, Ik breek de staf van het brood in Jeruzalem, en zij zullen het brood met gewicht en met kommer eten, en het water met een bepaalde maat en met verbaasdheid drinken;", "2 Kon 21:3": "Want hij bouwde de hoogten weer op, die Hizkia, zijn vader, verwoest had; en hij richtte altaren voor Baäl op, en maakte een gewijde paal, zoals Achab, de koning van Israël, gemaakt had, en boog zich neer voor heel het leger van de hemel, en diende het.", "2 Kon 6:26": "En het gebeurde, toen de koning van Israël over de muur voorbijging, dat een vrouw tegen hem riep, en zei: Help mij, heer koning!", "2 Kon 7:1": "Toen zei Elisa: Hoor het woord van de HEERE; zo zegt de HEERE: Morgen omtrent deze tijd zal een maat meelbloem verkocht worden voor een sikkel, en twee maten gerst voor een sikkel, in de poort van Samaria.", "2 Kon 2:14": "En hij nam de mantel van Elia, die van hem afgevallen was, en sloeg het water, en zei: Waar is de HEERE, de God van Elia? Ja, Dezelfde? En hij sloeg het water, en het werd naar de ene en de andere kant verdeeld, en Elisa ging er door.", "1 Kon 10:2": "En zij kwam in Jeruzalem, met een zeer zwaar leger, met kamelen die specerijen droegen, en zeer veel goud, en kostbaar gesteente; en zij kwam bij Salomo, en sprak met hem over alles wat er in haar hart was.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "2 Kron 22:5-8": "Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram. En hij keerde terug om zich te laten genezen te Jizreël; want hij had wonden, die men hem bij Rama geslagen had, toen hij streed tegen Hazaël, de koning van Syrië; en Azarja, de zoon van Joram, de koning van Juda, kwam af om Joram, de zoon van Achab, te Jizreël te bezoeken, want hij was ziek. De val van Ahazia nu was van God, doordat hij naar Joram kwam; want toen hij gekomen was, ging hij met Joram uit naar Jehu, de zoon van Nimsi, aan wie de HEERE gezalfd had om het huis van Achab uit te roeien.", "Amos 7:7": "Nog liet Hij mij dit zien: zie, de Heere stond op een muur, die met een paslood gemaakt was, en een paslood was in Zijn hand.", "Amos 7:4": "Verder liet de Heere HEERE mij dit zien: zie, de Heere HEERE riep, dat Hij wilde twisten met vuur; en het verteerde een grote afgrond, ook verteerde het een stuk land.", "2 Kron 18:3": "Want Achab, de koning van Israël, zei tegen Josafat, de koning van Juda: Zult u met mij meegaan naar Ramoth in Gilead? En hij zei tegen hem: Ik zal zijn zoals u bent, en zoals uw volk is, zo zal mijn volk zijn, en wij zullen met u zijn in deze strijd.", "2 Kon 9:7": "En u zult het huis van Achab, uw heer, verslaan, opdat Ik het bloed van Mijn knechten, de profeten, en het bloed van alle knechten van de HEERE, wreekt op de hand van Izebel.", "Pred 9:11": "Ik keerde mij om en zag onder de zon dat de wedloop niet is voor de snellen, en de strijd niet voor de helden, en ook het brood niet voor de wijzen, en ook de rijkdom niet voor de verstandigen, en ook de gunst niet voor de kundigen; maar dat tijd en toeval hen allen treft.", "Matt 10:30": "En ook uw haren van het hoofd zijn alle geteld.", "Hand 25:20": "En omdat ik in twijfel was over het onderzoek van deze zaak, vroeg ik of hij naar Jeruzalem wilde gaan en daar over deze dingen geoordeeld wilde worden.", "Lev 26:19-29": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper. En uw macht zal voor niets verbruikt worden; en uw land zal zijn opbrengst niet geven, en het geboomte van het land zal zijn vrucht niet geven. En als u tegen Mij in blijft ingaan, en Mij niet wilt horen, zal Ik over u, naar uw zonden, zevenvoudig slagen toedoen.", "Deut 28:38-42": "U zult veel zaad naar de akker uitbrengen, maar u zult weinig inzamelen; want de sprinkhaan zal het opeten. Wijngaarden zult u planten en bewerken, maar u zult geen wijn drinken, noch iets vergaren; want de worm zal het opeten. Olijfbomen zult u hebben binnen al uw grondgebied, maar u zult u met olie niet zalven; want uw olijfboom zal zijn vrucht afwerpen.", "Amos 5:16": "Daarom, zo zegt de HEERE, de God van de heerscharen, de Heere: Op alle straten zal rouwklacht zijn, en in alle wijken zullen zij zeggen: Och! Och! en zij zullen de landbouwer roepen om te treuren, en rouwklacht zal zijn bij hen die verstand van klagen hebben.", "Gen 19:12": "Toen zeiden die mannen tegen Lot: Wie hebt u hier nog meer? Een schoonzoon, of uw zonen, of uw dochters, en allen die u in deze stad hebt, breng hen weg uit deze plaats;", "Amos 4:6-9": "Daarom heb Ik u ook reinheid van de tanden gegeven in al uw steden, en gebrek aan brood in al uw plaatsen; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Gen 45:2": "En hij verhief zijn stem met wenen, zodat de Egyptenaren het hoorden, en dat het huis van Farao het hoorde.", "2 Tim 2:14": "Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders.", "Hand 13:32": "En wij verkondigen u de belofte, die aan de vaderen gedaan is,", "1 Kon 2:10": "En David ontsliep met zijn vaderen, en werd begraven in de stad van David.", "2 Kon 3:2": "En hij deed wat kwaad was in de ogen van de HEERE, doch niet zoals zijn vader en zoals zijn moeder; want hij deed het opgerichte beeld van Baäl weg, dat zijn vader gemaakt had.", "Matt 13:24": "Een andere gelijkenis heeft Hij hun voorgehouden en zei: Het Koninkrijk der hemelen is gelijk aan een mens die goed zaad zaaide in zijn akker.", "1 Kor 1:9": "God is getrouw, door Wie u geroepen bent tot de gemeenschap van Zijn Zoon Jezus Christus, onze Heere.", "Ezech 9:6": "Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren.", "Openb 5:8": "En toen Het dat boek genomen had, vielen de vier dieren en de vierentwintig oudsten voor het Lam neer, elk met een citer en gouden schalen vol reukwerk, dat zijn de gebeden van de heiligen.", "1 Kon 11:1-5": "En koning Salomo had, behalve de dochter van Farao, veel vreemde vrouwen lief: Moabitische, Ammonitische, Edomitische, Sidonische en Hethitische vrouwen; van de volken waarvan de HEERE tegen de kinderen van Israël gezegd had: U zult tot hen niet ingaan, en zij zullen tot u niet inkomen; zij zouden zeker uw hart naar hun goden doen neigen; aan deze hing Salomo met liefde. En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.", "Gen 28:15": "En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal u terugbrengen naar dit land; want Ik zal u niet verlaten, totdat Ik gedaan heb wat Ik tot u gesproken heb.", "Jer 9:18": "En zich haasten, en een klaagzang over ons aanheffen, zodat onze ogen van tranen neerdalen, en onze oogleden van water druipen.", "Jer 14:15-22": "Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden. En het volk, tot wie zij profeteren, zal op de straten van Jeruzalem weggeworpen zijn vanwege de honger en het zwaard; en er zal niemand zijn die hen kan begraven, hen, hun vrouwen, en hun zonen, en hun dochters; zo zal Ik hun slechtheid over hen uitstorten. Daarom zult u dit woord tegen hen zeggen: Mijn ogen zullen van tranen neerdalen, nacht en dag, en niet ophouden; want de jonkvrouw, de dochter van Mijn volk, is gebroken met een grote breuk, een plaag die zeer smartelijk is.", "Ps 92:3": "Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten;", "Hand 23:34": "En de stadhouder, die de brief gelezen had, vroeg uit welke provincie hij was; en toen hij begreep dat hij uit Cilicië kwam,", "Openb 22:1": "En hij toonde mij een zuivere rivier van het water des levens, klaar als kristal, die uit de troon van God en van het Lam kwam.", "2 Tim 2:18": "die van de waarheid zijn afgeweken, en zeggen dat de opstanding al gebeurd is, en het geloof van sommigen omverwerpen.", "Jer 33:20": "Zo zegt de HEERE: Als u Mijn verbond met de dag, en Mijn verbond met de nacht zou kunnen verbreken, zodat er geen dag en nacht meer zijn op hun tijd;", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "2 Kon 7:16-20": "Toen ging het volk naar buiten, en plunderde het leger van de Syriërs; en een maat meelbloem werd verkocht voor een sikkel, en twee maten gerst voor een sikkel, naar het woord van de HEERE. De koning nu had de hoofdman, op wiens hand hij leunde, aangesteld over die poort; en het volk vertrapte hem in de poort, zodat hij stierf, zoals de man Gods gesproken had, die het sprak toen de koning naar hem toe was gekomen. Want het was gebeurd, zoals de man Gods tegen de koning gesproken had, en gezegd: Morgen omtrent deze tijd zullen twee maten gerst voor een sikkel, en een maat meelbloem voor een sikkel verkocht worden, in de poort van Samaria.", "Gal 3:1": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd.", "Gen 7:1": "Daarna zei de HEERE tegen Noach: Ga u, en heel uw huis in de ark; want u heb Ik gezien als rechtvaardige voor Mijn aangezicht in dit geslacht.", "Jes 44:3-5": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen. En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken. Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Hand 8:27-40": "En hij stond op en ging heen; en zie, een Moorman, een kamerling, een machtige heer van Candacé, de koningin van de Moren, die over al haar schat ging, was gekomen om te aanbidden in Jeruzalem; en hij keerde terug en zat op zijn wagen en las de profeet Jesaja. En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "Ps 89:35": "Ik zal Mijn verbond niet ontheiligen, en wat uit Mijn lippen gegaan is, zal Ik niet veranderen.", "Gen 26:24": "En de HEERE verscheen hem diezelfde nacht, en zei: Ik ben de God van Abraham, uw vader; wees niet bang; want Ik ben met u; en Ik zal u zegenen, en uw nageslacht vermenigvuldigen, omwille van Abraham, Mijn knecht.", "Ps 36:5": "Hij bedenkt onrecht op zijn leger; hij stelt zich op een weg, die niet goed is; het kwaad verwerpt hij niet.", "2 Sam 8:14": "En hij legde bezettingen in Edom; in heel Edom legde hij bezettingen; en alle Edomieten werden David tot knechten; en de HEERE behoedde David overal waar hij heentrok.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "1 Kon 19:17": "En het zal gebeuren dat Jehu hem, die aan het zwaard van Hazaël ontkomt, zal doden; en die aan het zwaard van Jehu ontkomt, die zal Elisa doden.", "Ps 137:8": "O dochter van Babel! die verwoest zal worden, gelukkig zal hij zijn, die u uw misdaad vergelden zal, die u aan ons misdaan hebt.", "2 Kon 3:14-16": "En Elisa zei: Zo waarachtig als de HEERE van de heerscharen leeft, voor Wiens aangezicht ik sta: als ik niet het aangezicht van Josafat, de koning van Juda, in aanmerking nam, zou ik u niet aanschouwen, noch u aanzien! Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam. En hij zei: Zo zegt de HEERE: Maakt in dit dal veel grachten.", "Matt 7:6": "Geef het heilige niet aan de honden, en gooi uw parels niet voor de zwijnen; anders vertrappen ze die met hun poten, en verscheuren u nadat ze zich hebben omgekeerd.", "Ps 92:2": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste!", "Ps 19:10": "De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Ps 119:89": "Lamed. O HEERE! Uw woord bestaat in de eeuwigheid in de hemelen.", "Luk 1:32": "Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven.", "2 Kon 7:3": "Er waren nu vier melaatse mannen bij de ingang van de poort; die zeiden tegen elkaar: Waarom blijven wij hier zitten, totdat wij sterven?", "Gen 24:10": "En die knecht nam tien kamelen van de kamelen van zijn heer, en vertrok; en al het goed van zijn heer had hij bij zich; en hij stond op, en vertrok naar Mesopotamië, naar de stad van Nahor.", "Ps 72:1-4": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning. Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht. De bergen zullen aan het volk vrede dragen, ook de heuvels, met gerechtigheid.", "1 Kon 15:25": "Nadab nu, de zoon van Jerobeam, werd koning over Israël, in het tweede jaar van Asa, de koning van Juda; en hij regeerde twee jaren over Israël.", "1 Sam 9:7": "Toen zei Saul tegen zijn knecht: Maar zie, als wij gaan, wat zullen we die man dan brengen? Want het brood is op uit onze zakken, en wij hebben geen geschenk om de man van God te brengen; wat hebben wij?", "1 Kon 8:23": "en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid hou
