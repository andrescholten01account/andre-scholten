"wl\" data-l=\"L20\" data-code=\"H256\">te</span> bezoeken, <span class=\"wl\" data-l=\"L22\" data-code=\"H3588\">want</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3898\">hij</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3898\">was</span> <span class=\"wl\" data-l=\"L23\" data-code=\"H2470\">ziek</span>."}, "koppeling_kjv": {"1": "Then <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> unto the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> whose <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> he had restored to <span class=\"wl wl-kjv\" data-code=\"H2421\">life,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> thou and thine <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn</span> <span class=\"wl wl-kjv\" data-code=\"H834\">wheresoever</span> thou canst <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for a <span class=\"wl wl-kjv\" data-code=\"H7458\">famine;</span> and it shall also <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>", "2": "And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> after the <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> and she <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with her <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourned</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>", "3": "And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years'</span> <span class=\"wl wl-kjv\" data-code=\"H7097\">end,</span> that the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines:</span> and she went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to <span class=\"wl wl-kjv\" data-code=\"H6817\">cry</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> for her <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> and for her <span class=\"wl wl-kjv\" data-code=\"H7704\">land.</span>", "4": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5608\">Tell</span> me, I pray thee, all the great <span class=\"wl wl-kjv\" data-code=\"H1419\">things</span> that <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span>", "5": "And it came to pass, as he was <span class=\"wl wl-kjv\" data-code=\"H5608\">telling</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> how he had <span class=\"wl wl-kjv\" data-code=\"H2421\">restored</span> ➔ a dead <span class=\"wl wl-kjv\" data-code=\"H4191\">body</span> to <span class=\"wl wl-kjv\" data-code=\"H2421\">life,</span> that, behold, the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> whose <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> he had restored to <span class=\"wl wl-kjv\" data-code=\"H2421\">life,</span> <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> for her <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> and for her <span class=\"wl wl-kjv\" data-code=\"H7704\">land.</span> And <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> this is the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> and this is her <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> whom <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> restored to <span class=\"wl wl-kjv\" data-code=\"H2421\">life.</span>", "6": "And when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> she <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> him. So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">appointed</span> unto her a <span class=\"wl wl-kjv\" data-code=\"H259\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H5631\">officer,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Restore</span> all that was hers, and all the <span class=\"wl wl-kjv\" data-code=\"H8393\">fruits</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> since the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that she <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> even until now.", "7": "And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus;</span> and <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> was <span class=\"wl wl-kjv\" data-code=\"H2470\">sick;</span> and it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H2008\">hither.</span>", "8": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> a <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> by him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Shall I <span class=\"wl wl-kjv\" data-code=\"H2421\">recover</span> of this <span class=\"wl wl-kjv\" data-code=\"H2483\">disease?</span>", "9": "So <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him, and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> with <span class=\"wl wl-kjv\" data-code=\"H3027\">him,</span> even of every good <span class=\"wl wl-kjv\" data-code=\"H2898\">thing</span> of <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus,</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H1581\">camels'</span> <span class=\"wl wl-kjv\" data-code=\"H4853\">burden,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me to thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Shall I <span class=\"wl wl-kjv\" data-code=\"H2421\">recover</span> of this <span class=\"wl wl-kjv\" data-code=\"H2483\">disease?</span>", "10": "And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, Thou mayest <span class=\"wl wl-kjv\" data-code=\"H2421\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">recover:</span> howbeit the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7200\">shewed</span> me that he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span>", "11": "And he <span class=\"wl wl-kjv\" data-code=\"H5975\">settled</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">stedfastly,</span> until he was <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed:</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept.</span>", "12": "And <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Why <span class=\"wl wl-kjv\" data-code=\"H1058\">weepeth</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> Because I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that thou wilt <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> their strong <span class=\"wl wl-kjv\" data-code=\"H4013\">holds</span> wilt thou <span class=\"wl wl-kjv\" data-code=\"H7971\">set</span> on <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and their young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> wilt thou <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and wilt <span class=\"wl wl-kjv\" data-code=\"H7376\">dash</span> their <span class=\"wl wl-kjv\" data-code=\"H5768\">children,</span> and rip <span class=\"wl wl-kjv\" data-code=\"H1234\">up</span> their women with <span class=\"wl wl-kjv\" data-code=\"H2030\">child.</span>", "13": "And <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> But what, is thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> a <span class=\"wl wl-kjv\" data-code=\"H3611\">dog,</span> that he should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">thing?</span> And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7200\">shewed</span> me that thou shalt be <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H758\">Syria.</span>", "14": "So he <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> from <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to his <span class=\"wl wl-kjv\" data-code=\"H113\">master;</span> who <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, What <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> to thee? And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> He <span class=\"wl wl-kjv\" data-code=\"H559\">told</span> me that thou shouldest <span class=\"wl wl-kjv\" data-code=\"H2421\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">recover.</span>", "15": "And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow,</span> that he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a thick <span class=\"wl wl-kjv\" data-code=\"H4346\">cloth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2881\">dipped</span> it in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> it on his <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> so that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died:</span> and <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.", "16": "And in the <span class=\"wl wl-kjv\" data-code=\"H2568\">fifth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> being then <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H3088\">Jehoram</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign.</span>", "17": "<span class=\"wl wl-kjv\" data-code=\"H7970\">Thirty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> was he when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign;</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>", "18": "And he <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> as <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> was his <span class=\"wl wl-kjv\" data-code=\"H802\">wife:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>", "19": "Yet the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> for <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant's</span> sake, as he <span class=\"wl wl-kjv\" data-code=\"H559\">promised</span> him to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> him <span class=\"wl wl-kjv\" data-code=\"H3117\">alway</span> a <span class=\"wl wl-kjv\" data-code=\"H5216\">light,</span> and to his <span class=\"wl wl-kjv\" data-code=\"H1121\">children.</span>", "20": "In his <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> <span class=\"wl wl-kjv\" data-code=\"H6586\">revolted</span> from under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H4427\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over themselves.", "21": "So <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> went <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> to <span class=\"wl wl-kjv\" data-code=\"H6811\">Zair,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> with him: and he <span class=\"wl wl-kjv\" data-code=\"H6965\">rose</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H123\">Edomites</span> which compassed him <span class=\"wl wl-kjv\" data-code=\"H5437\">about,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> into their <span class=\"wl wl-kjv\" data-code=\"H168\">tents.</span>", "22": "Yet <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> <span class=\"wl wl-kjv\" data-code=\"H6586\">revolted</span> from under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span> Then <span class=\"wl wl-kjv\" data-code=\"H3841\">Libnah</span> <span class=\"wl wl-kjv\" data-code=\"H6586\">revolted</span> at the <span class=\"wl wl-kjv\" data-code=\"H1931\">same</span> <span class=\"wl wl-kjv\" data-code=\"H6256\">time.</span>", "23": "And the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah?</span>", "24": "And <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> and <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.", "25": "In the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> did <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3088\">Jehoram</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> begin to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign.</span>", "26": "<span class=\"wl wl-kjv\" data-code=\"H8147\">Two</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> was <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign;</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H6271\">Athaliah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6018\">Omri</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>", "27": "And he <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as did the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab:</span> for he was the son in <span class=\"wl wl-kjv\" data-code=\"H2860\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab.</span>", "28": "And he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> to the <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> against <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> in <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead;</span> and the <span class=\"wl wl-kjv\" data-code=\"H761\">Syrians</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">wounded</span> <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram.</span>", "29": "And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> went <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> to be <span class=\"wl wl-kjv\" data-code=\"H7495\">healed</span> in <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel</span> of the <span class=\"wl wl-kjv\" data-code=\"H4347\">wounds</span> which the <span class=\"wl wl-kjv\" data-code=\"H761\">Syrians</span> had <span class=\"wl wl-kjv\" data-code=\"H5221\">given</span> him at <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah,</span> when he <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria.</span> And <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3088\">Jehoram</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> in <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel,</span> because he was <span class=\"wl wl-kjv\" data-code=\"H2470\">sick.</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
