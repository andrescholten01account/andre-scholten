j koning werd, en hij regeerde zestien jaar in Jeruzalem; en hij deed niet wat recht was in de ogen van de HEERE, zijn God, zoals zijn vader David.", "3": "Want hij wandelde in de weg van de koningen van Israël; ja, hij liet ook zijn zoon door het vuur gaan, naar de gruwelen van de heidenvolken, die de HEERE voor de kinderen van Israël verdreven had.", "4": "Hij offerde ook en brandde reukwerk op de hoogten en op de heuvels, ook onder alle groene bomen.", "5": "Toen trok Rezin, de koning van Syrië, op, met Pekah, de zoon van Remalia, de koning van Israël, naar Jeruzalem ten strijde; en zij belegerden Achaz, maar zij konden hem niet overwinnen.", "6": "In diezelfde tijd bracht Rezin, de koning van Syrië, Elath weer aan Syrië, en verjoeg de Joden uit Elath; en de Syriërs kwamen naar Elath, en hebben daar gewoond tot op deze dag.", "7": "Achaz nu zond boden naar Tiglath-pilezer, de koning van Assyrië, en zei: Ik ben uw knecht en uw zoon; kom op, en verlos mij uit de hand van de koning van Syrië, en uit de hand van de koning van Israël, die tegen mij opstaan.", "8": "En Achaz nam het zilver en het goud, dat in het huis van de HEERE en in de schatten van het huis van de koning gevonden werd, en hij stuurde het als geschenk naar de koning van Assyrië.", "9": "Zo luisterde de koning van Assyrië naar hem; want de koning van Assyrië trok op tegen Damaskus, en nam het in, en voerde de bevolking gevankelijk weg naar Kir, en hij doodde Rezin.", "10": "Toen ging koning Achaz Tiglath-pilezer, de koning van Assyrië, tegemoet, naar Damaskus; en toen hij een altaar zag dat in Damaskus was, zond koning Achaz aan de priester Uria de tekening van het altaar, en de afbeelding ervan, naar heel zijn maaksel.", "11": "En Uria, de priester, bouwde een altaar, naar alles wat koning Achaz vanuit Damaskus had laten weten; zo deed de priester Uria het, voordat koning Achaz vanuit Damaskus terugkwam.", "12": "Toen de koning uit Damaskus gekomen was, zag de koning het altaar, en de koning naderde tot het altaar, en offerde daarop.", "13": "En hij stak zijn brandoffer aan, en zijn spijsoffer, en goot zijn drankoffer uit en sprenkelde het bloed van zijn dankoffers op dat altaar.", "14": "Maar het koperen altaar, dat voor het aangezicht van de HEERE was, dat liet hij wegbrengen van de voorkant van het huis, van tussen *zijn* altaar en het huis van de HEERE, en hij zette het aan de kant van *zijn* altaar, noordwaarts.", "15": "En koning Achaz gebood Uria, de priester, en zei: Steek op het grote altaar aan het morgenbrandoffer, en het avondspijsoffer, en het brandoffer van de koning, en zijn spijsoffer, en het brandoffer van heel het volk van het land, en hun spijsoffer, en hun drankoffers; en sprenkel daarop al het bloed van het brandoffer, en al het bloed van het slachtoffer; maar het koperen altaar zal voor mij zijn om te onderzoeken.", "16": "En Uria, de priester, deed naar alles wat koning Achaz geboden had.", "17": "En koning Achaz sneed de lijsten van de stellingen af, en haalde het wasvat er vanaf weg, en haalde de zee weg van de koperen runderen, die daaronder waren; en hij zette die op een stenen vloer.", "18": "Daarbij haalde hij het overdekte gedeelte van de sabbat, dat zij in het huis gebouwd hadden, en de buitenste ingang van de koning weg van het huis van de HEERE, vanwege de koning van Assyrië.", "19": "Het overige nu van de geschiedenis van Achaz, wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "20": "En Achaz ontsliep met zijn vaderen, en werd begraven bij zijn vaderen, in de stad van David; en Hizkia, zijn zoon, werd koning in zijn plaats."}, "SV": {"1": "In het zeventiende jaar van Pekah, den zoon van Remalia, werd Achaz koning, de zoon van Jotham, den koning van Juda.", "2": "Twintig jaren was Achaz oud, toen hij koning werd, en hij regeerde zestien jaren te Jeruzalem; en hij deed niet dat recht was in de ogen des HEEREN zijns Gods, als zijn vader David.", "3": "Want hij wandelde in den weg der koningen van Israël; ja, hij deed ook zijn zoon door het vuur gaan, naar de gruwelen der heidenen, die de HEERE voor de kinderen Israëls verdreven had.", "4": "Hij offerde ook en rookte op de hoogten en op de heuvelen, ook onder alle groen geboomte.", "5": "Toen toog Rezin, de koning van Syrië, op, met Pekah, den zoon van Remalia, den koning van Israël, naar Jeruzalem ten strijde; en zij belegerden Achaz, maar zij vermochten niet met strijden.", "6": "Te dierzelfder tijd bracht Rezin, de koning van Syrië, Elath weder aan Syrië, en wierp de Joden uit Elath; en de Syriërs kwamen te Elath, en hebben daar gewoond tot op dezen dag.", "7": "Achaz nu zond boden tot Tiglath-pilezer, den koning van Assyrië, zeggende: Ik ben uw knecht en uw zoon; kom op, en verlos mij uit de hand van den koning van Syrië, en uit de hand van den koning van Israël, die zich tegen mij opmaken.", "8": "En Achaz nam het zilver en het goud, dat in het huis des HEEREN, en in de schatten van het huis des konings gevonden werd, en hij zond den koning van Assyrië een geschenk.", "9": "Zo hoorde de koning van Assyrië naar hem; want de koning van Assyrië toog op tegen Damaskus, en nam haar in, en voerde hen gevankelijk naar Kir, en hij doodde Rezin.", "10": "Toen toog de koning Achaz Tiglath-pilezer, den koning van Assyrië, tegemoet, naar Damaskus; en gezien hebbende een altaar, dat te Damaskus was, zo zond de koning Achaz aan den priester Uria de gelijkenis van het altaar, en zijn afbeelding, naar zijn ganse maaksel.", "11": "En Uria, de priester, bouwde een altaar, naar alles, wat de koning Achaz van Damaskus ontboden had; alzo deed de priester Uria, tegen dat de koning Achaz van Damaskus kwam.", "12": "Als nu de koning van Damaskus gekomen was, zag de koning het altaar en de koning naderde tot het altaar, en offerde daarop.", "13": "En hij stak zijn brandoffer aan, en zijn spijsoffer, en goot zijn drankoffer en sprengde het bloed zijner dankofferen op dat altaar.", "14": "Maar het koperen altaar, dat voor het aangezicht des HEEREN was, dat bracht hij van het voorste deel van het huis, van tussen *zijn* altaar, en van tussen het huis des HEEREN, en hij zette het aan de zijde *zijns* altaars noordwaarts.", "15": "En de koning Achaz gebood Uria, den priester, zeggende: Steek op het grote altaar aan het morgenbrandoffer, en het avondspijsoffer, en des konings brandoffer, en zijn spijsoffer, en het brandoffer van al het volk des lands, en hun spijsoffer, en hun drankofferen; en spreng daarop al het bloed des brandoffers, en al het bloed des slachtoffers; maar het koperen altaar zal mij zijn, om te onderzoeken.", "16": "En Uria, de priester, deed naar alles, wat de koning Achaz geboden had.", "17": "En de koning Achaz sneed de lijsten der stellingen af, en nam die van boven het wasvat weg, en deed de zee af van de koperen runderen, die daaronder waren; en hij zette die op een stenen vloer.", "18": "Daartoe het deksel des sabbats, dat zij in het huis gebouwd hadden, en den buitensten ingang des konings nam hij weg van het huis des HEEREN, vanwege den koning van Assyrië.", "19": "Het overige nu der geschiedenissen van Achaz, wat hij gedaan heeft, is dat niet geschreven in het boek der kronieken der koningen van Juda?", "20": "En Achaz ontsliep met zijn vaderen, en werd begraven bij zijn vaderen, in de stad Davids; en Hizkia, zijn zoon, werd koning in zijn plaats."}, "KJV": {"1": "In the seventeenth year of Pekah the son of Remaliah Ahaz the son of Jotham king of Judah began to reign.", "2": "Twenty years old was Ahaz when he began to reign, and reigned sixteen years in Jerusalem, and did not that which was right in the sight of the LORD his God, like David his father.", "3": "But he walked in the way of the kings of Israel, yea, and made his son to pass through the fire, according to the abominations of the heathen, whom the LORD cast out from before the children of Israel.", "4": "And he sacrificed and burnt incense in the high places, and on the hills, and under every green tree.", "5": "Then Rezin king of Syria and Pekah son of Remaliah king of Israel came up to Jerusalem to war: and they besieged Ahaz, but could not overcome him.", "6": "At that time Rezin king of Syria recovered Elath to Syria, and drave the Jews from Elath: and the Syrians came to Elath, and dwelt there unto this day.", "7": "So Ahaz sent messengers to Tiglathpileser king of Assyria, saying, I am thy servant and thy son: come up, and save me out of the hand of the king of Syria, and out of the hand of the king of Israel, which rise up against me.", "8": "And Ahaz took the silver and gold that was found in the house of the LORD, and in the treasures of the king's house, and sent it for a present to the king of Assyria.", "9": "And the king of Assyria hearkened unto him: for the king of Assyria went up against Damascus, and took it, and carried the people of it captive to Kir, and slew Rezin.", "10": "And king Ahaz went to Damascus to meet Tiglathpileser king of Assyria, and saw an altar that was at Damascus: and king Ahaz sent to Urijah the priest the fashion of the altar, and the pattern of it, according to all the workmanship thereof.", "11": "And Urijah the priest built an altar according to all that king Ahaz had sent from Damascus: so Urijah the priest made it against king Ahaz came from Damascus.", "12": "And when the king was come from Damascus, the king saw the altar: and the king approached to the altar, and offered thereon.", "13": "And he burnt his burnt offering and his meat offering, and poured his drink offering, and sprinkled the blood of his peace offerings, upon the altar.", "14": "And he brought also the brasen altar, which was before the LORD, from the forefront of the house, from between the altar and the house of the LORD, and put it on the north side of the altar.", "15": "And king Ahaz commanded Urijah the priest, saying, Upon the great altar burn the morning burnt offering, and the evening meat offering, and the king's burnt sacrifice, and his meat offering, with the burnt offering of all the people of the land, and their meat offering, and their drink offerings; and sprinkle upon it all the blood of the burnt offering, and all the blood of the sacrifice: and the brasen altar shall be for me to enquire by.", "16": "Thus did Urijah the priest, according to all that king Ahaz commanded.", "17": "And king Ahaz cut off the borders of the bases, and removed the laver from off them; and took down the sea from off the brasen oxen that were under it, and put it upon a pavement of stones.", "18": "And the covert for the sabbath that they had built in the house, and the king's entry without, turned he from the house of the LORD for the king of Assyria.", "19": "Now the rest of the acts of Ahaz which he did, are they not written in the book of the chronicles of the kings of Judah?", "20": "And Ahaz slept with his fathers, and was buried with his fathers in the city of David: and Hezekiah his son reigned in his stead."}}, "tsk": {"1": [{"kopje": "zeventiende", "refs": ["2 Kon 15:27-30", "2 Kon 15:32", "2 Kon 15:33"]}, {"kopje": "Achaz", "refs": ["2 Kon 15:38", "2 Kron 28:1-4", "Jes 1:1", "Jes 7:1", "Hos 1:1", "Micha 1:1"]}], "2": [{"kopje": "niet", "refs": ["2 Kon 14:3", "2 Kon 15:3", "2 Kon 15:34", "2 Kon 18:3", "2 Kon 22:2", "1 Kon 3:14", "1 Kon 9:4", "1 Kon 11:4-8", "1 Kon 15:3", "2 Kron 17:3", "2 Kron 29:2", "2 Kron 34:2", "2 Kron 34:3"]}], "3": [{"kopje": "hij wandelde", "refs": ["2 Kon 8:18", "1 Kon 12:28-30", "1 Kon 16:31-33", "1 Kon 21:25", "1 Kon 21:26", "1 Kon 22:53", "1 Kon 22:54", "2 Kron 22:3", "2 Kron 28:2-4"]}, {"kopje": "liet... zijn zoon", "refs": ["2 Kon 17:17", "2 Kon 23:10", "Lev 18:21", "Lev 20:2", "Deut 12:31", "Deut 18:10", "2 Kron 33:6", "Ps 106:37", "Ps 106:38", "Jer 32:35", "Ezech 16:21", "Ezech 20:26", "Ezech 20:31"]}, {"kopje": "naar", "refs": ["2 Kon 21:2", "2 Kon 21:11", "Deut 12:31", "1 Kon 14:24", "2 Kron 33:2", "Ps 106:35", "Ezech 16:47"]}], "4": [{"kopje": "op de heuv  van onze vaderen, Die zoiets in het hart van de koning gegeven heeft, om het huis van de HEERE te versieren, dat te Jeruzalem is.", "Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "Ezech 23:16": "Werd zij op hen verliefd bij het zien met haar ogen, en zij zond boden naar hen, naar Chaldea.", "Num 18:4-7": "Maar zij zullen u bijgevoegd worden, en de wacht van de tent der samenkomst waarnemen, in alle dienst van de tent; en een vreemde zal u niet naderen. U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël. Want Ik, zie, Ik heb uw broeders, de Levieten, uit het midden van de kinderen van Israël genomen; zij zijn u een gave, gegeven aan de HEERE, om de dienst van de tent der samenkomst te bedienen.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "Ex 29:40": "Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam.", "2 Kon 15:27-30": "In het tweeënvijftigste jaar van Azaria, de koning van Juda, werd Pekah, de zoon van Remalia, koning over Israël, en regeerde twintig jaar te Samaria. En hij deed wat kwaad was in de ogen van de HEERE; hij week niet af van de zonden van Jerobeam, de zoon van Nebat, die Israël liet zondigen. In de dagen van Pekah, de koning van Israël, kwam Tiglath-Pilezer, de koning van Assyrië, en nam Ijon in, en Abel-Beth-Maächa, en Janoah, en Kedes, en Hazor, en Gilead, en Galilea, het hele land van Nafthali; en hij voerde hen weg naar Assyrië.", "2 Kron 33:6": "En hij deed zijn zonen door het vuur gaan, in het dal van de zoon van Hinnom, en pleegde toverij, en gaf op vogelgeschrei acht, en toverde, en hij stelde waarzeggers en duivelskunstenaars aan; en hij deed zeer veel kwaads in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Jes 7:17": "Maar de HEERE zal over u, en over uw volk, en over het huis van uw vader, dagen doen komen, wat voor dagen niet gekomen zijn vanaf de dag dat Efraïm van Juda is afgeweken, door de koning van Assyrië.", "Ezech 20:29": "En Ik zei tegen hen: Wat is die hoogte, waarheen u gaat? Toch wordt de naam daarvan tot op deze dag hoogte genoemd.", "2 Kron 32:18": "En zij riepen met luide stem, in het Joods, tegen het volk van Jeruzalem dat op de muur was, om hen bevreesd te maken en te verontrusten, om zo de stad te kunnen innemen.", "2 Kron 8:16": "Zo werd al het werk van Salomo klaargemaakt, tot de dag van de grondlegging van het huis van de HEERE, en tot het voltooien ervan, zodat het huis van de HEERE volmaakt werd.", "Jes 8:2": "Toen nam ik mij betrouwbare getuigen, Uria, de priester, en Zacharia, de zoon van Jeberechja.", "Ps 83:2-13": "O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Lev 1:1": "En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:", "Ps 106:38": "En zij hebben onschuldig bloed vergoten, het bloed van hun zonen en hun dochters, die zij aan de afgoden van Kanaän hebben opgeofferd; zodat het land door deze bloedschuld ontheiligd is geworden.", "2 Kon 25:13-16": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden het koper daarvan naar Babel. Zij namen ook de potten, en de schoffels, en de gaffels, en de rookschalen, en al de koperen voorwerpen, waarmee men de dienst verrichtte. En de aanvoerder van de lijfwacht nam de wierookvaten en de sprenkelschalen weg, wat geheel goud en wat geheel zilver was.", "2 Kon 12:10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "Jer 36:5": "En Jeremia gebood Baruch: Ik word tegengehouden, ik zal niet in het huis van de HEERE kunnen gaan.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "1 Kron 3:13": "zijn zoon was Achaz; zijn zoon was Hizkia; zijn zoon was Manasse;", "Klaagl 4:17": "Ain. Nog steeds bezweken onze ogen, terwijl ze uitkeken naar onze nutteloze hulp; wij tuurden met gespannen aandacht naar een volk dat niet kon verlossen.", "2 Kron 28:22-25": "Ja, in de tijd toen men hem benauwde, ging hij nog meer overtreden tegen de HEERE; dit was koning Achaz. Want hij offerde aan de goden van Damascus, die hem geslagen hadden, en zei: Omdat de goden van de koningen van Syrië hen helpen, zal ik hun offeren, opdat zij mij ook helpen; maar zij waren hem tot zijn val, alsook aan heel Israël. En Achaz verzamelde de voorwerpen van het huis van God, en hakte de voorwerpen van het huis van God in stukken, en sloot de deuren van het huis van de HEERE toe; daartoe maakte hij zich altaren in elke hoek van Jeruzalem.", "2 Kon 18:2": "Vijfentwintig jaar was hij oud, toen hij koning werd, en hij regeerde negenentwintig jaar te Jeruzalem, en de naam van zijn moeder was Abi, een dochter van Zacharia.", "2 Kron 36:14": "Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.", "Dan 3:7": "Daarom, op dat moment, toen al die volken het geluid hoorden van de hoorn, de pijp, de citer, de vedel, de psalters, en allerlei soorten muziek, vielen alle volken, naties en tongen neer en aanbaden het gouden beeld, dat de koning Nebukadnezar had opgericht.", "2 Kron 28:23": "Want hij offerde aan de goden van Damascus, die hem geslagen hadden, en zei: Omdat de goden van de koningen van Syrië hen helpen, zal ik hun offeren, opdat zij mij ook helpen; maar zij waren hem tot zijn val, alsook aan heel Israël.", "2 Kron 28:25": "Ook maakte hij in elke stad van Juda hoogten om aan andere goden reukwerk te branden; zo verwekte hij de HEERE, de God van zijn vaderen, tot toorn.", "Dan 9:27": "En hij zal voor velen het verbond versterken, één week; en in de helft van de week zal hij het slachtoffer en het spijsoffer doen ophouden, en over de gruwelijke vleugel zal een verwoester zijn, ook tot de voleinding toe, die vast besloten is, zal uitgestort worden over de verwoeste.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Ezech 20:26": "En Ik verontreinigde hen in hun eigen giften, doordat zij door het vuur lieten doorgaan al wat de baarmoeder opent; opdat Ik hen zou verwoesten, met als doel dat zij zouden weten dat Ik de HEERE ben.", "Ps 106:37": "Daarenboven hebben zij hun zonen en hun dochters aan de duivelen geofferd.", "2 Kon 18:3": "En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader David gedaan had.", "Deut 12:31": "Zo zult u niet doen voor de HEERE, uw God; want alles wat de HEERE een gruwel is, dat Hij haat, hebben zij voor hun goden gedaan; want zij hebben zelfs hun zonen en hun dochters met vuur verbrand voor hun goden.", "Jer 20:1": "Toen Pashur, de zoon van Immer, de priester (deze was aangesteld als voorganger in het huis van de HEERE), Jeremia hoorde deze woorden profeteren,", "Matt 15:9": "Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "1 Petr 1:18": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd,", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "2 Kon 16:10-17": "Toen ging koning Achaz Tiglath-pilezer, de koning van Assyrië, tegemoet, naar Damaskus; en toen hij een altaar zag dat in Damaskus was, zond koning Achaz aan de priester Uria de tekening van het altaar, en de afbeelding ervan, naar heel zijn maaksel. En Uria, de priester, bouwde een altaar, naar alles wat koning Achaz vanuit Damaskus had laten weten; zo deed de priester Uria het, voordat koning Achaz vanuit Damaskus terugkwam. Toen de koning uit Damaskus gekomen was, zag de koning het altaar, en de koning naderde tot het altaar, en offerde daarop.", "Jes 57:5": "U die verhit bent in de eikenbossen, onder elke groene boom; die de kinderen slacht bij de beken, onder de richels van de rotsen?", "Jes 1:1": "Het visioen van Jesaja, de zoon van Amoz, dat hij zag over Juda en Jeruzalem, in de dagen van Uzzia, Jotham, Achaz en Hizkia, de koningen van Juda.", "2 Kon 12:9": "Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "2 Kon 22:2": "En hij deed wat recht was in de ogen van de HEERE; en hij wandelde in heel de weg van zijn vader David, en week niet af naar rechts of naar links.", "Jes 2:6": "Maar U hebt Uw volk, het huis van Jakob, verlaten, want zij zijn vervuld met goddeloosheid, meer dan het oosten, en zij zijn van het guichelaar gelijk de Filistijnen, en aan de kinderen van de vreemden tonen zij hun behagen.", "Jer 52:20": "De twee pilaren, de ene zee, en de twaalf koperen runderen, die in de plaats van de stellingen waren, die koning Salomo voor het huis van de HEERE gemaakt had; het koper daarvan, namelijk van al deze vaten, was zonder gewicht.", "2 Kon 11:4": "In het zevende jaar zond Jojada, en nam de leiders van honderd met de hoofdmannen en met de lijfwacht, en hij bracht hen bij zich, in het huis van de HEERE; en hij sloot een verbond met hen en beëdigde hen in het huis van de HEERE, en hij toonde hun de zoon van de koning.", "1 Kon 6:37": "In het vierde jaar werd de grond van het huis van de HEERE gelegd, in de maand Ziv;", "Jer 17:26": "En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Jes 8:6": "Omdat dit volk het water van Siloa veracht, dat zachtjes stroomt, en er vreugde is bij Rezin en de zoon van Remalia,", "2 Kron 4:1": "Hij maakte ook een koperen altaar, van twintig ellen in zijn lengte en twintig ellen in zijn breedte, en tien ellen in zijn hoogte.", "2 Kron 28:5-8": "Daarom gaf de HEERE, zijn God, hem in de hand van de koning van Syrië, zodat zij hem versloegen en van hem een grote menigte gevangenen wegvoerden, die zij naar Damascus brachten. En hij werd ook gegeven in de hand van de koning van Israël, die hem versloeg met een grote slachting. Want Pekah, de zoon van Remalia, doodde in Juda honderdtwintigduizend man op één dag, allen strijdbare mannen, omdat zij de HEERE, de God van hun vaderen, verlaten hadden. En Zichri, een geweldig man van Efraïm, doodde Maaseja, de zoon van de koning, en Azrikam, de leider van het huis, alsook Elkana, de tweede na de koning.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "1 Kron 22:11": "Nu, mijn zoon, de HEERE zal met u zijn, en u zult voorspoedig zijn, en u zult het huis van de HEERE, van uw God, bouwen, zoals Hij van u gesproken heeft.", "1 Kon 8:10": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.", "Jes 7:14": "Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen.", "1 Kon 20:4": "En de koning van Israël antwoordde en zei: Naar uw woord, mijn heer de koning, ik ben van u, en al wat ik heb.", "1 Sam 1:24": "Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.", "Ezech 16:21": "dat u Mijn kinderen geslacht hebt, en ze overgegeven hebt, doordat u ze voor hen door het vuur hebt laten gaan?", "2 Kron 28:20": "En Tiglath-Pilneser, de koning van Assyrië, kwam tot hem; maar hij benauwde hem, en versterkte hem niet.", "Num 29:6-11": "Behalve het brandoffer van de maand, en zijn spijsoffer, en het gedurige brandoffer, en zijn spijsoffer, met hun drankoffers, naar hun wijze, tot een liefelijke reuk, een vuuroffer voor de HEERE. En op de tiende dag van deze zevende maand zult u een heilige samenkomst hebben, en u zult uw zielen verootmoedigen; geen werk zult u doen; Maar u zult een brandoffer, tot een liefelijke reuk, aan de HEERE aanbieden: een jonge var, een ram, zeven eenjarige lammeren; volkomen zullen zij voor u zijn.", "Jes 7:1-9": "Het gebeurde nu in de dagen van Achaz, de zoon van Jotham, de zoon van Uzzia, de koning van Juda, dat Rezin, de koning van Syrië, en Pekah, de zoon van Remalia, de koning van Israël, optrokken naar Jeruzalem, ten oorlog tegen haar; maar hij kon met strijden niet tegen haar op. Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind. En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller;", "2 Kron 4:15": "Eén zee, en de twaalf runderen daaronder.", "Jer 28:5": "Toen zei de profeet Jeremia tegen de profeet Hananja, voor de ogen van de priesters en voor de ogen van het hele volk, dat in het huis van de HEERE stond;", "Ex 30:9": "U moet geen vreemd reukwerk daarop aansteken, ook geen brandoffer, geen spijsoffer; u moet er ook geen drankoffer op gieten.", "2 Kon 21:2": "En hij deed wat kwaad was in de ogen van de HEERE, naar de gruwelen van de heidenvolken, die de HEERE voor de kinderen van Israël uit de bezitting verdreven had.", "Jes 7:2-9": "Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind. En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller; En zeg tegen hem: Wees op uw hoede, en wees rustig, wees niet bang, en laat uw hart niet week worden vanwege die twee staarten van deze rokende vuurbranden, vanwege de ontsteking van de toorn van Rezin en van de Syriërs, en van de zoon van Remalia;", "Lev 20:2": "U zult ook tegen de kinderen van Israël zeggen: Ieder van de kinderen van Israël, of van de vreemdelingen die als vreemdeling in Israël wonen, die van zijn nageslacht aan de Molech geeft, zal zeker gedood worden; het volk van het land zal hem met stenen stenigen.", "2 Sam 10:19": "Toen nu alle koningen die knechten van Hadad-Ezer waren, zagen dat zij voor Israëls aangezicht geslagen waren, sloten zij vrede met Israël, en dienden hen; en de Syriërs vreesden de kinderen Ammons niet meer te verlossen.", "2 Kon 3:20": "En het gebeurde 's morgens, toen men het spijsoffer offert, dat er, zie, water langs de weg van Edom kwam, en het land met water vervuld werd.", "Jer 26:7": "En de priesters, en de profeten, en al het volk, hoorden Jeremia deze woorden spreken in het huis van de HEERE.", "1 Kon 13:1": "En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken.", "1 Sam 1:7": "En zo deed hij jaar op jaar; van toen af dat zij opging naar het huis van de HEERE, zo tergde zij haar steeds; daarom weende zij en at niet.", "Num 29:18-40": "En hun spijsoffer, en hun drankoffers voor de varren, voor de rammen, en voor de lammeren, naar hun aantal, volgens de wijze; En een geitenbok tot een zondoffer; behalve het gedurige brandoffer, en zijn spijsoffer, met hun drankoffers. En op de derde dag: elf varren, twee rammen, veertien volkomen eenjarige lammeren;", "2 Kon 25:9": "En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur.", "1 Kron 5:26": "Zo verwekte de God van Israël de geest van Pul, de koning van Assyrië, en de geest van Tiglath-Pilneser, de koning van Assyrië, die voerde hen gevankelijk weg, te weten de Rubenieten, en de Gadieten, en de halve stam van Manasse; en hij bracht hen naar Halah, en Habor, en Hara, en aan de rivier Gozan, tot op deze dag.", "Amos 1:3-5": "Zo zegt de HEERE: Om drie overtredingen van Damaskus, en om vier zal Ik dat niet afwenden; omdat zij Gilead met ijzeren dorswagens hebben gedorst. Daarom zal Ik een vuur in het huis van Hazaël zenden, dat zal de paleizen van Benhadad verteren. En Ik zal de grendel van Damaskus verbreken, en zal de inwoner uitroeien uit Bikeat-aven, en hem die de scepter houdt, uit Beth-eden; en het volk van Syrië zal als gevangenen worden weggevoerd naar Kir, zegt de HEERE.", "2 Kron 28:5-15": "Daarom gaf de HEERE, zijn God, hem in de hand van de koning van Syrië, zodat zij hem versloegen en van hem een grote menigte gevangenen wegvoerden, die zij naar Damascus brachten. En hij werd ook gegeven in de hand van de koning van Israël, die hem versloeg met een grote slachting. Want Pekah, de zoon van Remalia, doodde in Juda honderdtwintigduizend man op één dag, allen strijdbare mannen, omdat zij de HEERE, de God van hun vaderen, verlaten hadden. En Zichri, een geweldig man van Efraïm, doodde Maaseja, de zoon van de koning, en Azrikam, de leider van het huis, alsook Elkana, de tweede na de koning.", "Ezech 43:8": "Als zij hun drempel stelden aan Mijn drempel, en hun post naast Mijn post, zodat er maar een wand tussen Mij en tussen hen was, en verontreinigden Mijn heilige Naam met hun gruwelen die zij deden; daarom heb Ik ze verteerd in Mijn toorn.", "2 Kon 25:25": "Maar het gebeurde in de zevende maand, dat Ismaël, de zoon van Nethanja, de zoon van Elisama, van koninklijk zaad, kwam, en tien mannen met hem; en zij sloegen Gedalia, zodat hij stierf; alsook de Joden en de Chaldeeën, die met hem te Mizpa waren.", "1 Kon 18:26": "En zij namen de stier die hij hun gegeven had, en bereidden hem, en riepen de naam van Baäl aan, van de morgen tot de middag, en zeiden: O Baäl, antwoord ons! Maar er was geen stem en geen die antwoordde. En zij sprongen tegen het altaar dat men gemaakt had.", "2 Kon 15:37": "In die dagen begon de HEERE tegen Juda te zenden Rezin, de koning van Syrië, en Pekah, de zoon van Remalia.", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "2 Kon 15:27": "In het tweeënvijftigste jaar van Azaria, de koning van Juda, werd Pekah, de zoon van Remalia, koning over Israël, en regeerde twintig jaar te Samaria.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "1 Kron 22:14": "Zie, ik heb in mijn verdrukking voor het huis van de HEERE honderdduizend talenten van het goud bereid, en duizend maal duizend talenten van het zilver; en van het koper en van het ijzer is er geen gewicht, want het is er in overvloed; ik heb ook hout en stenen bereid; voegt u er nog meer aan toe.", "Ezech 43:11": "En indien zij schaamrood worden vanwege alles wat zij gedaan hebben, maak hun dan bekend de vorm van het huis, en zijn gestalte, en zijn uitgangen, en zijn ingangen, en al zijn vormen, en al zijn ordinantiën, ja, al zijn vormen en al zijn wetten; en schrijf het voor hun ogen, opdat zij zijn hele vorm en al zijn ordinantiën bewaren, en die doen.", "2 Kron 33:2": "En hij deed wat kwaad was in de ogen van de HEERE, naar de gruwelen van de heidenen, die de HEERE voor het aangezicht van de kinderen van Israël uit de bezitting verdreven had.", "1 Kon 21:11-13": "En de mannen van zijn stad, die oudsten en die edelen, die in zijn stad woonden, deden zoals Izebel hun gezonden had; zoals geschreven was in de brieven die zij hun gezonden had. Zij riepen een vasten uit; en zij zetten Naboth vooraan onder het volk. Toen kwamen de twee mannen, zonen van Belial, en gingen tegenover hem zitten; en de mannen van Belial getuigden tegen hem, tegen Naboth, voor het volk, en zeiden: Naboth heeft God en de koning gevloekt. En zij voerden hem de stad uit, en stenigden hem met stenen, zodat hij stierf.", "1 Kon 15:3": "En hij wandelde in al de zonden van zijn vader, die hij vóór hem gedaan had; en zijn hart was niet volkomen met de HEERE, zijn God, zoals het hart van zijn vader David.", "2 Kon 23:2": "En de koning ging op naar het huis van de HEERE, en met hem alle mannen van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van de kleinste tot de grootste; en hij las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was.", "Gen 35:14": "En Jakob zette een gedenkteken op in die plaats waar Hij met hem gesproken had, een stenen gedenkteken; en hij stortte daarop een drankoffer, en goot er olie overheen.", "2 Kron 28:21": "Want Achaz nam een deel van het huis van de HEERE, en van het huis van de koning en van de vorsten, en gaf het aan de koning van Assyrië; maar het hielp hem niet.", "1 Kon 15:4": "Maar om Davids wil gaf de HEERE, zijn God, hem een lamp in Jeruzalem, door zijn zoon na hem te verwekken en Jeruzalem te bevestigen.", "Rom 12:2": "En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is.", "2 Kron 28:27": "En Achaz ontsliep met zijn vaderen, en zij begroeven hem in de stad, in Jeruzalem; maar zij brachten hem niet in de graven van de koningen van Israël; en zijn zoon Jehizkia werd koning in zijn plaats.", "1 Kon 21:26": "En hij deed zeer gruwelijk, door achter de drekgoden aan te gaan; naar alles wat de Amorieten gedaan hadden, die God voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.", "2 Kron 29:21-24": "En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij die op het altaar van de HEERE zouden offeren. Zo slachtten zij de runderen, en de priesters ontvingen het bloed, en sprengden het op het altaar; zij slachtten ook de rammen, en sprengden het bloed op het altaar; evenzo slachtten zij de lammeren, en sprengden het bloed op het altaar. Daarna brachten zij de bokken naderbij, als zondoffer, voor het aangezicht van de koning en de gemeente, en zij legden hun handen op hen.", "Joz 6:24": "De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Jes 57:5-7": "U die verhit bent in de eikenbossen, onder elke groene boom; die de kinderen slacht bij de beken, onder de richels van de rotsen? Aan de gladde stenen van de beek is uw deel; die, die zijn uw lot; ook stort u daarover een drankoffer uit, u offert hun een spijsoffer; zou Ik Mij hierover laten troosten? U legt uw slaapplaats op een hoge en verheven berg; ook klimt u daarheen op om slachtoffer te offeren.", "1 Kron 26:12": "Uit dezen waren de verdelingen van de poortwachters onder de hoofden van de mannen, met wachtdiensten tegenover hun broers, om te dienen in het huis van de HEERE.", "Ezech 22:26": "Haar priesters doen Mijn wet geweld aan, en zij ontheiligen Mijn heilige dingen; tussen het heilige en het onheilige maken zij geen onderscheid, en het verschil tussen het onreine en het reine geven zij niet te kennen; daarbij verbergen zij hun ogen voor Mijn sabbatten; ja, Ik word in hun midden ontheiligd.", "2 Kon 15:27-31": "In het tweeënvijftigste jaar van Azaria, de koning van Juda, werd Pekah, de zoon van Remalia, koning over Israël, en regeerde twintig jaar te Samaria. En hij deed wat kwaad was in de ogen van de HEERE; hij week niet af van de zonden van Jerobeam, de zoon van Nebat, die Israël liet zondigen. In de dagen van Pekah, de koning van Israël, kwam Tiglath-Pilezer, de koning van Assyrië, en nam Ijon in, en Abel-Beth-Maächa, en Janoah, en Kedes, en Hazor, en Gilead, en Galilea, het hele land van Nafthali; en hij voerde hen weg naar Assyrië.", "Deut 18:10": "Onder u mag niemand gevonden worden die zijn zoon of zijn dochter door het vuur laat gaan, die met waarzeggerij omgaat, een guichelaar, of die op vogelgeschrei let, of een tovenaar,", "1 Kon 12:28-30": "Daarom hield de koning een raad, en maakte twee gouden kalveren; en hij zei tegen hen: Het is voor u teveel om naar Jeruzalem op te gaan; zie uw goden, o Israël, die u uit het land Egypte hebben opgevoerd. En hij zette het ene te Beth-el, en het andere plaatste hij te Dan. En deze zaak werd tot zonde; want het volk ging heen voor het ene, tot Dan toe.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "2 Kon 16:7-10": "Achaz nu zond boden naar Tiglath-pilezer, de koning van Assyrië, en zei: Ik ben uw knecht en uw zoon; kom op, en verlos mij uit de hand van de koning van Syrië, en uit de hand van de koning van Israël, die tegen mij opstaan. En Achaz nam het zilver en het goud, dat in het huis van de HEERE en in de schatten van het huis van de koning gevonden werd, en hij stuurde het als geschenk naar de koning van Assyrië. Zo luisterde de koning van Assyrië naar hem; want de koning van Assyrië trok op tegen Damaskus, en nam het in, en voerde de bevolking gevankelijk weg naar Kir, en hij doodde Rezin.", "2 Kron 28:23-25": "Want hij offerde aan de goden van Damascus, die hem geslagen hadden, en zei: Omdat de goden van de koningen van Syrië hen helpen, zal ik hun offeren, opdat zij mij ook helpen; maar zij waren hem tot zijn val, alsook aan heel Israël. En Achaz verzamelde de voorwerpen van het huis van God, en hakte de voorwerpen van het huis van God in stukken, en sloot de deuren van het huis van de HEERE toe; daartoe maakte hij zich altaren in elke hoek van Jeruzalem. Ook maakte hij in elke stad van Juda hoogten om aan andere goden reukwerk te branden; zo verwekte hij de HEERE, de God van zijn vaderen, tot toorn.", "Jes 22:6": "Want Elam heeft de pijlkoker genomen, de man is op de wagen, er zijn ruiters; en Kir ontbloot het schild.", "Ex 40:29": "En hij zette het altaar van het brandoffer bij de deur van de tabernakel, van de tent der samenkomst; en hij offerde daarop brandoffer en spijsoffer, zoals de HEERE aan Mozes geboden had.", "2 Kron 17:3": "En de HEERE was met Josafat; want hij wandelde in de eerdere wegen van zijn vader David, en zocht de Baäls niet.", "Jes 37:14": "Toen Hizkia de brieven uit de hand van de boden ontvangen had, en die gelezen had, ging hij naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE.", "2 Kon 16:5-9": "Toen trok Rezin, de koning van Syrië, op, met Pekah, de zoon van Remalia, de koning van Israël, naar Jeruzalem ten strijde; en zij belegerden Achaz, maar zij konden hem niet overwinnen. In diezelfde tijd bracht Rezin, de koning van Syrië, Elath weer aan Syrië, en verjoeg de Joden uit Elath; en de Syriërs kwamen naar Elath, en hebben daar gewoond tot op deze dag. Achaz nu zond boden naar Tiglath-pilezer, de koning van Assyrië, en zei: Ik ben uw knecht en uw zoon; kom op, en verlos mij uit de hand van de koning van Syrië, en uit de hand van de koning van Israël, die tegen mij opstaan.", "2 Kon 23:11": "En hij schafte de paarden af, die de koningen van Juda voor de zon gesteld hadden, bij de ingang van het huis van de HEERE, tot de kamer van Nathan-melech, de hoveling, die in Parvarim was; en de wagens van de zon verbrandde hij met vuur.", "2 Kon 15:38": "En Jotham stierf en werd bij zijn voorouders begraven in de stad van zijn vader David; en zijn zoon Achaz werd koning in zijn plaats.", "1 Kon 15:20": "En Benhadad luisterde naar de koning Asa, en zond de leiders van de legers die hij had tegen de steden van Israël; en sloeg Ijon, en Dan, en Abel-Beth-Maächa, en het gehele Cinneroth, met het gehele land Nafthali.", "2 Kron 28:1-4": "Achaz was twintig jaar oud toen hij koning werd, en hij regeerde zestien jaar in Jeruzalem; en hij deed niet wat recht was in de ogen van de HEERE, zoals zijn vader David. Maar hij wandelde in de wegen van de koningen van Israël; daartoe maakte hij ook gegoten beelden voor de Baäls. Hij brandde ook reukwerk in het dal van de zoon van Hinnom, en hij verbrandde zijn zonen in het vuur, naar de gruwelen van de heidenen die de HEERE voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.", "2 Kron 29:1": "Hizkia werd koning toen hij vijfentwintig jaar oud was, en regeerde negenentwintig jaar in Jeruzalem; en de naam van zijn moeder was Abia, een dochter van Zacharia.", "Num 28:2-10": "Gebied de kinderen van Israël, en zeg tegen hen: Mijn offerande, Mijn voedsel voor Mijn vuuroffers, Mijn liefelijke reuk, zult u in acht nemen, om Mij te offeren op zijn vastgestelde tijd. En u zult tegen hen zeggen: Dit is het vuuroffer, dat u de HEERE offeren zult: twee volkomen eenjarige lammeren per dag, tot een voortdurend brandoffer. Het ene lam zult u bereiden 's morgens; en het andere lam zult u bereiden tussen de twee avonden.", "2 Kron 28:6": "Want Pekah, de zoon van Remalia, doodde in Juda honderdtwintigduizend man op één dag, allen strijdbare mannen, omdat zij de HEERE, de God van hun vaderen, verlaten hadden.", "2 Kron 18:3": "Want Achab, de koning van Israël, zei tegen Josafat, de koning van Juda: Zult u met mij meegaan naar Ramoth in Gilead? En hij zei tegen hem: Ik zal zijn zoals u bent, en zoals uw volk is, zo zal mijn volk zijn, en wij zullen met u zijn in deze strijd.", "Ex 40:6": "U zult ook het altaar van het brandoffer zetten voor de deur van de tabernakel, van de tent der samenkomst.", "1 Kon 7:27-39": "Hij maakte ook tien koperen stellingen; vier el was de lengte van één stelling, en vier el haar breedte, en drie el haar hoogte. En dit was het werk van de stelling: zij hadden lijsten, en de lijsten zaten tussen kransen. En op de lijsten die tussen de kransen zaten, waren leeuwen, runderen en cherubs; en op de kransen was daarboven nog een voetstuk; en onder de leeuwen en runderen zaten toevoegingen van dun uitgewerkt werk.", "1 Kon 14:23": "Want ook zij bouwden zich hoogten, en gewijde stenen, en gewijde palen, op elke hoge heuvel, en onder elke bladerrijke boom.", "Matt 1:9": "en Uzzia verwekte Jotham, en Jotham verwekte Achaz, en Achaz verwekte Hizkia;", "Ezech 23:39": "Want toen zij hun kinderen voor hun drekgoden geslacht hadden, kwamen zij op diezelfde dag in Mijn heiligdom, om dat te ontheiligen; en zie, zo hebben zij gedaan in het midden van Mijn huis.", "Num 6:17": "Hij zal ook de ram als dankoffer voor de HEERE bereiden, met de korf ongezuurde koeken; en de priester zal zijn spijsoffer en zijn drankoffer bereiden.", "Deut 12:2": "U zult volledig vernielen al de plaatsen waar de volken, die u zult verdrijven, hun goden gediend hebben; op de hoge bergen, en op de heuvels, en onder elke groene boom.", "Jes 8:7": "daarom, zie, zal de Heere over hen laten opkomen dat sterke en geweldige water van de rivier, de koning van Assyrië en al zijn heerlijkheid; en hij zal opkomen over al zijn stromen, en overgaan over al zijn oevers;", "Jes 8:8": "en hij zal doortrekken in Juda, hij zal het overstromen en er doorgaan, hij zal tot aan de hals reiken; en de uitgestrektheid van zijn vleugels zal de breedte van uw land vullen, o Immanuël!", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Jer 10:2": "Zo zegt de HEERE: Leert de weg van de heidenen niet, en schrikt niet van de tekenen van de hemel, omdat de heidenen daarvan schrikken.", "1 Kon 8:63": "En Salomo offerde als dankoffer, dat hij de HEERE offerde, tweeëntwintigduizend runderen, en honderdtwintigduizend schapen. Zo hebben zij het huis van de HEERE ingewijd, de koning en al de kinderen van Israël.", "2 Kron 26:2": "Hij bouwde Eloth, en bracht het weer terug aan Juda, nadat de koning met zijn vaderen ontslapen was.", "Ezech 46:2": "En de vorst zal binnengaan door de weg van het voorhuis van die poort van buiten, en zal staan bij de post van de poort; en de priesters zullen zijn brandoffers en zijn dankoffers bereiden, en hij zal aanbidden bij de drempel van de poort, en daarna uitgaan; maar de poort zal niet gesloten worden tot de avond.", "2 Kron 29:5": "En hij zei tegen hen: Hoor mij, Levieten; heilig nu uzelf, en heilig het huis van de HEERE, de God van uw vaderen, en breng de onreinheid naar buiten, uit het heiligdom.", "2 Kon 18:15": "Zo gaf Hizkia al het zilver, dat gevonden werd in het huis van de HEERE, en in de schatten van het huis van de koning.", "Richt 1:3": "Toen zei Juda tegen zijn broeder Simeon: Trek met mij op in mijn lot, en laten we tegen de Kanaänieten strijden, dan zal ik ook met u optrekken in uw lot. Zo ging Simeon met hem mee.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Ezech 46:4-7": "Het brandoffer nu, dat de vorst de HEERE zal offeren, zal op de sabbatdag zijn: zes volkomen lammeren en een volkomen ram. En het spijsoffer, een efa bij de ram, maar bij de lammeren zal het spijsoffer een gave van zijn hand zijn; en olie, een hin bij een efa. Maar op de dag van de nieuwe maan, een var, een jong rund, van de volkomen dieren, en zes lammeren, en een ram; volkomen zullen ze zijn.", "Jer 20:2": "sloeg Pashur de profeet Jeremia, en zette hem in de gevangenis die in de bovenste poort van Benjamin is, die aan het huis van de HEERE ligt.", "2 Kon 15:3": "En hij deed wat recht was in de ogen van de HEERE, precies zoals zijn vader Amazia gedaan had.", "2 Kron 29:2": "En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader David gedaan had.", "2 Kron 28:3": "Hij brandde ook reukwerk in het dal van de zoon van Hinnom, en hij verbrandde zijn zonen in het vuur, naar de gruwelen van de heidenen die de HEERE voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.", "Lev 23:18": "U zult ook met het brood zeven volkomen eenjarige lammeren, en een var, het jong van een rund, en twee rammen offeren; zij zullen voor de HEERE een brandoffer zijn, met hun spijsoffer en hun drankoffers, een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Deut 12:30": "Wacht u ervoor dat u niet verstrikt raakt door hen te volgen, nadat zij voor uw aangezicht zullen verdelgd zijn; en dat u niet vraagt naar hun goden, en zegt: Zoals deze volken hun goden gediend hebben, zo zal ik ook doen.", "Jer 28:1": "Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei:", "Ps 7:16": "Hij heeft een kuil gegraven, en hem uitgegraven, maar hij is gevallen in de groeve, die hij gemaakt heeft.", "2 Kron 26:18": "En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Hos 4:12": "Mijn volk vraagt zijn hout om raad, en zijn stok zal het hem bekendmaken; want de geest van de hoererijen verleidt hen, zodat zij van onder hun God weghoereren.", "2 Kron 16:2": "Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei:", "Ex 29:39-41": "Het ene lam zult u 's morgens bereiden; maar het andere lam zult u bereiden tussen de twee avonden. Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam. Het andere lam nu zult u bereiden tussen de twee avonden; u zult daarmee doen gelijk met het morgenspijsoffer, en gelijk met het drankoffer daarvan, tot een liefelijke reuk; het is een vuuroffer voor de HEERE.", "Jer 7:31": "En zij hebben de hoogten van Tofeth gebouwd, dat in het dal van de zoon van Hinnom is, om hun zonen en hun dochters met vuur te verbranden; wat Ik niet heb geboden, en wat niet in Mijn hart is opgekomen.", "2 Kon 16:10-16": "Toen ging koning Achaz Tiglath-pilezer, de koning van Assyrië, tegemoet, naar Damaskus; en toen hij een altaar zag dat in Damaskus was, zond koning Achaz aan de priester Uria de tekening van het altaar, en de afbeelding ervan, naar heel zijn maaksel. En Uria, de priester, bouwde een altaar, naar alles wat koning Achaz vanuit Damaskus had laten weten; zo deed de priester Uria het, voordat koning Achaz vanuit Damaskus terugkwam. Toen de koning uit Damaskus gekomen was, zag de koning het altaar, en de koning naderde tot het altaar, en offerde daarop.", "2 Kon 15:32": "In het tweede jaar van Pekah, de zoon van Remalia, de koning van Israël, werd Jotham koning, de zoon van Uzzia, de koning van Juda.", "2 Sam 6:18": "Toen David geëindigd had het brandoffer en de dankoffers te offeren, zegende hij het volk in de Naam van de HEERE van de heerscharen.", "1 Kon 8:64": "Op diezelfde dag heiligde de koning het middelste van de voorhof, dat voor het huis van de HEERE was, omdat hij daar het brandoffer en het spijsoffer bereid had, alsook het vet van de dankoffers; want het koperen altaar, dat voor het aangezicht van de HEERE was, was te klein, om de brandoffers, en de spijsoffers, en het vet van de dankoffers te bevatten.", "Ex 23:19": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE uw God brengen. U zult een bokje niet koken in de melk van zijn moeder.", "2 Kron 26:16-19": "Maar toen hij sterk geworden was, verhief zijn hart zich tot zijn eigen verderf, en hij overtrad tegen de HEERE, zijn God; want hij ging het tempel van de HEERE binnen, om te roken op het reukaltaar. Doch Azaria, de priester, ging hem na, en met hem priesters van de HEERE, tachtig kloeke mannen. En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Lev 23:13": "en zijn spijsoffer twee tienden meelbloem, met olie gemengd, tot een vuuroffer, voor de HEERE tot een liefelijke reuk; en zijn drankoffer van wijn, het vierde deel van een hin.", "Jes 65:4": "Zittend bij de graven, zo overnachten zij bij de bewaarde plaatsen, etend zwijnenvlees, en er is sap van gruwelijke dingen in hun vaten.", "2 Kon 18:4": "Hij nam de hoogten weg, en brak de opgerichte beelden, en roeide de bossen uit; en hij verbrijzelde de koperen slang, die Mozes gemaakt had, omdat de kinderen van Israël tot die dagen toe daarvoor gerookt hadden; en hij noemde die Nehustan.", "Jer 36:6": "Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.", "2 Kron 28:1-27": "Achaz was twintig jaar oud toen hij koning werd, en hij regeerde zestien jaar in Jeruzalem; en hij deed niet wat recht was in de ogen van de HEERE, zoals zijn vader David. Maar hij wandelde in de wegen van de koningen van Israël; daartoe maakte hij ook gegoten beelden voor de Baäls. Hij brandde ook reukwerk in het dal van de zoon van Hinnom, en hij verbrandde zijn zonen in het vuur, naar de gruwelen van de heidenen die de HEERE voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.", "2 Kon 21:26": "En men begroef hem in zijn graf, in de tuin van Uzza; en zijn zoon Josia werd koning in zijn plaats.", "Ex 34:26": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE, uw God, brengen. U zult het bokje niet koken in de melk van zijn moeder.", "Mal 2:7-9": "Want de lippen van de priesters zullen de kennis bewaren, en men zal uit zijn mond de wet zoeken; want hij is een gezant van de HEERE van de heerscharen. Maar u bent van de weg afgeweken, u hebt er velen doen struikelen in de wet, u hebt het verbond met Levi verdorven, zegt de HEERE van de heerscharen. Daarom heb Ik u ook verachtelijk en onwaard gemaakt voor heel het volk, omdat u Mijn wegen niet houdt, maar partijdig bent in de wet.", "1 Kon 7:23": "Verder maakte hij de gegoten zee; van tien el was zij van de ene rand tot de andere, helemaal rond, en vijf el hoog, en een meetsnoer van dertig el kon haar rondom omvatten.", "2 Kon 17:17": "Ook lieten zij hun zonen en hun dochters door het vuur gaan, en gebruikten waarzeggerij, en letten op vogelgeschrei, en verkochten zich om te doen wat kwaad was in de ogen van de HEERE, om Hem tot toorn te verwekken.", "2 Kron 29:19": "Al het gereedschap ook, dat koning Achaz, tijdens zijn koningschap, door zijn overtreding had weggegooid, hebben wij hersteld en geheiligd; en zie, ze staan voor het altaar van de HEERE.", "Deut 23:18": "U zult geen hoerenloon noch hondenprijs in het huis van de HEERE, uw God, brengen, voor enige gelofte; want ook die beide zijn de HEERE, uw God, een gruwel.", "Lev 4:13-26": "Als nu de hele gemeenschap van Israël afgedwaald zal zijn, en de zaak voor de ogen van de gemeente verborgen is, en zij iets gedaan zullen hebben tegen een van alle geboden van de HEERE, wat niet gedaan zou mogen worden, en schuldig geworden zijn; En die zonde, die zij daarmee gezondigd zullen hebben, bekend is geworden; dan zal de gemeente een var, een jong rund, ten zondoffer offeren, en die voor de tent der samenkomst brengen; En de oudsten van de gemeenschap zullen hun handen op het hoofd van de var leggen, voor het aangezicht van de HEERE; en men zal de var slachten voor het aangezicht van de HEERE.", "2 Kron 4:14": "Hij maakte ook de stellingen; en wasvaten maakte hij op de stellingen;", "Ezech 23:37": "Want zij hebben overspel gepleegd, en er is bloed aan hun handen; en zij hebben met hun drekgoden overspel gepleegd; daarbij hebben zij ook hun kinderen, die zij Mij gebaard hadden, voor hen door het vuur laten doorgaan, tot voedsel.", "1 Kon 3:14": "En als u in Mijn wegen wandelt en Mijn inzettingen en Mijn geboden onderhoudt, zoals uw vader David gewandeld heeft, dan zal Ik ook uw dagen verlengen.", "2 Kon 23:12": "Verder brak de koning de altaren af die op het dak van de opperzaal van Achaz waren, die de koningen van Juda gemaakt hadden, alsook de altaren die Manasse in de twee voorhoven van het huis van de HEERE gemaakt had; en hij verbrijzelde ze vandaar, en wierp het stof daarvan in de beek Kidron.", "2 Kron 20:1": "Het gebeurde nu hierna, dat de kinderen van Moab, en de kinderen van Ammon, en met hen anderen naast de Ammonieten, tegen Josafat kwamen om te strijden.", "2 Kon 8:18": "En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want de dochter van Achab was zijn vrouw geworden; en hij deed wat slecht was in de ogen van de HEERE.", "Ezech 16:47": "Toch hebt u niet in hun wegen gewandeld, noch naar hun gruwelen gedaan; het was iets van het geringe, een verdriet; maar u hebt het meer verdorven dan zij, in al uw wegen.", "1 Kon 20:33": "De mannen namen dat nauwkeurig waar, en vatten het snel op, of het van hem was, en zeiden: Uw broeder Benhadad leeft. En hij zei: Komt, brengt hem. Toen kwam Benhadad naar hem uit, en hij liet hem op de wagen klimmen.", "2 Kon 21:11": "Omdat Manasse, de koning van Juda, deze gruwelen gedaan heeft, erger doend dan alles wat de Amorieten gedaan hebben die vóór hem geweest zijn, ja, ook Juda door zijn drekgoden heeft doen zondigen;", "2 Kron 29:35": "En ook waren de brandoffers in overvloed, met het vet van de dankoffers, en met de drankoffers, bij de brandoffers; zo werd de dienst van het huis van de HEERE geregeld.", "Jes 7:4": "En zeg tegen hem: Wees op uw hoede, en wees rustig, wees niet bang, en laat uw hart niet week worden vanwege die twee staarten van deze rokende vuurbranden, vanwege de ontsteking van de toorn van Rezin en van de Syriërs, en van de zoon van Remalia;", "Ex 24:4": "Mozes nu beschreef al de woorden van de HEERE, en hij maakte zich 's morgens vroeg op, en hij bouwde een altaar onder aan de berg, en twaalf kolommen, naar de twaalf stammen van Israël.", "Matt 23:35": "opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar.", "Dan 12:11": "En vanaf de tijd dat het voortdurende offer weggenomen zal zijn, en de verwoestende gruwel zal zijn opgesteld, zullen er duizend tweehonderd en negentig dagen zijn.", "2 Kron 22:3": "Hij wandelde ook in de wegen van het huis van Achab; want zijn moeder was zijn raadgeefster, om goddeloos te handelen.", "1 Kron 28:12": "en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;", "2 Kon 23:7": "Daartoe brak hij de huizen van de schandjongens af, die bij het huis van de HEERE waren, waar de vrouwen huisjes voor het beeld van het bos weefden.", "2 Kon 16:10-12": "Toen ging koning Achaz Tiglath-pilezer, de koning van Assyrië, tegemoet, naar Damaskus; en toen hij een altaar zag dat in Damaskus was, zond koning Achaz aan de priester Uria de tekening van het altaar, en de afbeelding ervan, naar heel zijn maaksel. En Uria, de priester, bouwde een altaar, naar alles wat koning Achaz vanuit Damaskus had laten weten; zo deed de priester Uria het, voordat koning Achaz vanuit Damaskus terugkwam. Toen de koning uit Damaskus gekomen was, zag de koning het altaar, en de koning naderde tot het altaar, en offerde daarop.", "2 Kon 12:18": "Maar Joas, de koning van Juda, nam al de geheiligde dingen die Josafat, en Joram, en Ahazia, zijn vaderen, de koningen van Juda, geheiligd hadden, en zijn eigen geheiligde dingen, en al het goud dat gevonden werd in de schatten van het huis van de HEERE en van het huis van de koning, en zond het aan Hazaël, de koning van Syrië; toen trok hij weg van Jeruzalem.", "Deut 2:8": "Toen wij nu doorgetrokken waren van onze broeders, de kinderen van Ezau, die in Seir woonden, van de weg van het vlakke veld, van Elath en van Ezeon-Geber, keerden wij ons om en trokken de weg van de woestijn van Moab door.", "Hagg 1:2": "Zo spreekt de HEERE van de heerscharen: Dit volk zegt: De tijd is niet gekomen, de tijd dat het huis van de HEERE gebouwd moet worden.", "2 Kon 18:33": "Hebben de goden der volken, ieder zijn land, ooit gered uit de hand van de koning van Assyrië?", "2 Kon 12:13": "Toch werden er voor het huis van de HEERE geen zilveren schalen, gaffelen, sprenkelschalen, trompetten, of enig gouden of zilveren voorwerp gemaakt, van het geld dat naar het huis van de HEERE gebracht werd.", "Ezech 23:17": "De zonen van Babel nu kwamen tot haar, in het bed van de liefde, en verontreinigden haar met hun hoererij; ook verontreinigde zij zich met hen; daarna werd haar ziel van hen afgekeerd.", "Jer 51:51": "U zou kunnen zeggen: Wij zijn beschaamd geworden, want wij hebben smaad gehoord, schaamte heeft ons gezicht bedekt; omdat vreemden over de heiligdommen van het huis van de HEERE gekomen zijn;", "2 Kon 16:1-20": "In het zeventiende jaar van Pekah, de zoon van Remalia, werd Achaz koning, de zoon van Jotham, de koning van Juda. Twintig jaar was Achaz oud, toen hij koning werd, en hij regeerde zestien jaar in Jeruzalem; en hij deed niet wat recht was in de ogen van de HEERE, zijn God, zoals zijn vader David. Want hij wandelde in de weg van de koningen van Israël; ja, hij liet ook zijn zoon door het vuur gaan, naar de gruwelen van de heidenvolken, die de HEERE voor de kinderen van Israël verdreven had.", "2 Kron 29:32": "En het aantal brandoffers, dat de gemeente bracht, was zeventig runderen, honderd rammen, tweehonderd lammeren; deze alle voor de HEERE tot brandoffer.", "Dan 11:31": "En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen.", "Jer 23:11": "Want zowel profeten als priesters zijn huichelaars; zelfs in Mijn huis vind Ik hun boosheid, spreekt de HEERE.", "2 Kon 16:7-9": "Achaz nu zond boden naar Tiglath-pilezer, de koning van Assyrië, en zei: Ik ben uw knecht en uw zoon; kom op, en verlos mij uit de hand van de koning van Syrië, en uit de hand van de koning van Israël, die tegen mij opstaan. En Achaz nam het zilver en het goud, dat in het huis van de HEERE en in de schatten van het huis van de koning gevonden werd, en hij stuurde het als geschenk naar de koning van Assyrië. Zo luisterde de koning van Assyrië naar hem; want de koning van Assyrië trok op tegen Damaskus, en nam het in, en voerde de bevolking gevankelijk weg naar Kir, en hij doodde Rezin.", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "2 Kon 12:3": "Zeker werden de hoogten niet weggenomen; het volk offerde en rookte nog op de hoogten.", "2 Kron 29:15": "En zij verzamelden hun broeders, en heiligden zich, en kwamen, volgens het gebod van de koning, door de woorden van de HEERE, om het huis van de HEERE te reinigen.", "Jer 32:35": "En zij hebben de hoogten van Baäl gebouwd, die in het dal van de zoon van Hinnom zijn, om hun zonen en hun dochters voor de Molech door het vuur te laten gaan; wat Ik hun niet geboden heb, en wat niet in Mijn hart is opgekomen, dat zij deze gruwel zouden doen; om Juda te laten zondigen.", "Num 15:24": "Dan zal het gebeuren, indien iets bij dwaling gedaan is, en voor de ogen van de vergadering verborgen is, dat de hele vergadering een var, een jong rund, zal bereiden tot brandoffer, tot een liefelijke reuk voor de HEERE, met zijn spijsoffer en zijn drankoffer, naar de gebruikelijke wijze; en een geitenbok tot zondoffer.", "Ezech 20:31": "Ja, met het offeren van uw gaven, met het door het vuur laten doorgaan van uw kinderen, bent u verontreinigd met al uw drekgoden tot op deze dag toe; en zou Ik door u gevraagd worden, o huis van Israël? Zo waarachtig als Ik leef, spreekt de Heere HEERE, zo Ik door u gevraagd word!", "Ex 29:41": "Het andere lam nu zult u bereiden tussen de twee avonden; u zult daarmee doen gelijk met het morgenspijsoffer, en gelijk met het drankoffer daarvan, tot een liefelijke reuk; het is een vuuroffer voor de HEERE.", "2 Kon 14:3": "En hij deed wat recht was in de ogen van de HEERE, maar niet zoals zijn vader David; hij deed naar alles wat zijn vader Joas gedaan had.", "Dan 9:21": "terwijl ik nog sprak in het gebed, kwam de man Gabriël, die ik in het begin in een visioen gezien had, snel gevlogen, en raakte mij aan, omtrent de tijd van het avondoffer.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "Jes 9:10": "Want de HEERE zal Rezins tegenstanders tegen hem opheffen, en Hij zal zijn vijanden samen verenigen:", "Lev 3:16": "En de priester zal die aansteken op het altaar; het is een spijs van het vuuroffer, tot een liefelijke reuk; al het vet zal van de HEERE zijn.", "Ps 106:39": "En zij verontreinigden zich door hun werken, en zij hebben gehoereerd door hun daden.", "2 Kon 18:16": "Te dien tijde sneed Hizkia het goud af van de deuren van de tempel van de HEERE, en van de posten, die Hizkia, de koning van Juda, had laten overtrekken, en gaf dat aan de koning van Assyrië.", "1 Kron 29:21": "En zij offerden de HEERE slachtoffers; ook brachten zij de HEERE brandoffers, de volgende morgen na die dag: duizend jonge stieren, duizend rammen, duizend lammeren, met hun drankoffers; en slachtoffers in overvloed, voor heel Israël.", "Ex 39:43": "Mozes nu bezag het gehele werk, en zie, zij hadden het gemaakt zoals de HEERE geboden had; zo hadden zij het gemaakt. Toen zegende Mozes hen.", "1 Kon 20:32": "Toen gordden zij rouwgewaad om hun lenden, en koorden om hun hoofden, en kwamen naar de koning van Israël, en zeiden: Uw knecht Benhadad zegt: Laat toch mijn leven gespaard blijven. En hij zei: Leeft hij dan nog? Hij is mijn broeder.", "1 Kon 11:36": "En aan zijn zoon zal Ik één stam geven; opdat Mijn dienaar David altijd een lamp voor Mijn aangezicht heeft in Jeruzalem, de stad die Ik Mij verkozen heb, om Mijn Naam daar te vestigen.", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Amos 9:7": "Bent u voor Mij niet als de kinderen van de Moren, o kinderen van Israël? spreekt de HEERE. Heb Ik Israël niet opgevoerd uit het land Egypte, en de Filistijnen uit Kafthor, en de Syriërs uit Kir?", "2 Kon 15:30": "En Hosea, de zoon van Ela, smeedde een samenzwering tegen Pekah, de zoon van Remalia, en sloeg hem neer, en doodde hem, en werd koning in zijn plaats; in het twintigste jaar van Jotham, de zoon van Uzzia.", "2 Kron 34:3": "Want in het achtste jaar van zijn regering, toen hij nog een jongeling was, begon hij de God van zijn vader David te zoeken; en in het twaalfde jaar begon hij Juda en Jeruzalem te reinigen van de hoogten en de gewijde bomen, en van de gesneden en de gegoten beelden.", "2 Kon 12:17": "Toen trok Hazaël, de koning van Syrië, op, en streed tegen Gath, en nam het in; daarna richtte Hazaël zijn gezicht om tegen Jeruzalem op te trekken.", "1 Kon 9:26": "De koning Salomo maakte ook schepen te Ezeon-geber, dat bij Eloth is, aan de oever van de Schelfzee, in het land van Edom.", "Joz 10:1-5": "Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren; Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:", "1 Kron 23:4": "Uit dezen waren er vierentwintigduizend om het werk van het huis van de HEERE aan te sturen; en zesduizend opzichters en rechters;", "2 Kon 23:10": "Hij verontreinigde ook Thofeth, dat in het dal van de kinderen van Hinnom is, opdat niemand zijn zoon of zijn dochter voor de Molech door het vuur zou laten gaan.", "Jes 8:9-12": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden! Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons! Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "1 Kon 16:31-33": "En het gebeurde (was het een lichte zaak dat hij wandelde in de zonden van Jerobeam, de zoon van Nebat?), dat hij ook nog Izebel, de dochter van Eth-baal, de koning van de Sidoniërs, tot vrouw nam, en heenging, en Baäl diende, en zich voor hem neerboog. En hij richtte voor Baäl een altaar op, in het huis van Baäl, dat hij te Samaria gebouwd had. Ook maakte Achab een gewijd bos, zodat Achab nog meer deed om de HEERE, de God van Israël, tot toorn te verwekken, dan alle koningen van Israël die voor hem geweest waren.", "1 Kon 12:32": "En Jerobeam maakte een feest in de achtste maand, op de vijftiende dag van de maand, gelijk het feest dat in Juda was, en offerde op het altaar; op dezelfde manier deed hij te Beth-el, terwijl hij de kalveren offerde die hij gemaakt had; hij stelde ook te Beth-el priesters der hoogten aan, die hij gemaakt had.", "2 Kon 18:1": "Het gebeurde nu in het derde jaar van Hosea, de zoon van Ela, de koning van Israël, dat Hizkia koning werd, de zoon van Achaz, koning van Juda.", "2 Kon 3:26": "Doch toen de koning van de Moabieten zag dat de strijd hem te sterk werd, nam hij zevenhonderd man met zich mee, die het zwaard trokken, om door te breken naar de koning van Edom toe; maar zij konden het niet.", "Ezech 46:12-14": "En als de vorst een vrijwillig offer zal brengen, een brandoffer of dankoffers als een vrijwillig offer voor de HEERE, dan zal men hem de poort openen die naar het oosten kijkt; en hij zal zijn brandoffer en zijn dankoffers brengen, zoals hij dat gedaan zal hebben op de sabbatdag; en als hij weer naar buiten gaat, zal men de poort sluiten, nadat hij naar buiten gegaan is. Verder zult u een volkomen eenjarig lam dagelijks bereiden als brandoffer voor de HEERE; elke morgen zult u dat bereiden. En u zult als spijsoffer daarbij doen, elke morgen een zesde deel van een efa, en olie een derde deel van een hin, om de meelbloem te bevochtigen; als een spijsoffer voor de HEERE, als eeuwige inzettingen, voortdurend.", "Ezech 44:4": "Daarna bracht hij mij de weg van de noorderpoort, voor het huis; en ik zag, en zie, de heerlijkheid van de HEERE had het huis van de HEERE vervuld; toen viel ik op mijn aangezicht.", "Jes 7:12": "Doch Achaz zei: Ik zal het niet vragen, en ik zal de HEERE niet op de proef stellen.", "Lev 18:21": "En van uw nageslacht zult u niet geven, niet geven om voor de Molech door het vuur te doen gaan; en de Naam van uw God zult u niet ontheiligen; Ik ben de HEERE!", "Jer 19:4-7": "Omdat zij Mij verlaten, en deze plaats vervreemd hebben, en andere goden daarin gerookt hebben die zij niet gekend hebben, zij, noch hun vaders, noch de koningen van Juda; en hebben deze plaats vervuld met bloed van onschuldigen. Want zij hebben de hoogten van Baäl gebouwd, om hun zonen met vuur te verbranden, aan Baäl tot brandoffers; wat Ik niet geboden heb, noch gesproken heb, noch in Mijn hart is opgekomen. Daarom, ziet, de dagen komen, spreekt de HEERE, dat deze plaats niet meer het Tofeth genoemd zal worden, of dal van de zoon van Hinnom, maar Moorddal.", "Ps 116:19": "in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "1 Kron 22:1": "En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.", "2 Sam 6:17": "Toen zij nu de ark van de HEERE naar binnen brachten, zetten zij die op haar plaats, in het midden van de tent die David voor haar gespannen had; en David offerde brandoffers voor het aangezicht van de HEERE, en dankoffers.", "Richt 6:25": "En het gebeurde in diezelfde nacht, dat de HEERE tegen hem zei: Neem de jonge stier van de ossen, die van uw vader zijn, namelijk de tweede stier, van zeven jaar oud; en breek het altaar van Baäl af, dat van uw vader is, en hak het gewijde bos om, dat daarbij is.", "2 Kron 28:1": "Achaz was twintig jaar oud toen hij koning werd, en hij regeerde zestien jaar in Jeruzalem; en hij deed niet wat recht was in de ogen van de HEERE, zoals zijn vader David.", "Joz 11:1-5": "Het gebeurde daarna, toen Jabin, de koning van Hazor, dit hoorde, dat hij een boodschap stuurde naar Jobab, de koning van Madon, en naar de koning van Simron, en naar de koning van Achsaf, En naar de koningen die tegen het noorden op het gebergte, en op het vlakke, tegen het zuiden van Cinneroth, en in de laagte, en in Nafoth-dor, aan de zee waren; Tot de Kanaänieten tegen het oosten en tegen het westen, en de Amorieten, en de Hethieten, en de Ferezieten; en de Jebusieten op het gebergte, en de Hevieten onder aan Hermon, in het land van Mizpa.", "Jer 35:2": "Ga naar het huis van de Rechabieten, en spreek met hen, en breng hen in het huis van de HEERE, in een van de kamers, en geef hun wijn te drinken.", "1 Kon 16:32": "En hij richtte voor Baäl een altaar op, in het huis van Baäl, dat hij te Samaria gebouwd had.", "Lev 20:2-5": "U zult ook tegen de kinderen van Israël zeggen: Ieder van de kinderen van Israël, of van de vreemdelingen die als vreemdeling in Israël wonen, die van zijn nageslacht aan de Molech geeft, zal zeker gedood worden; het volk van het land zal hem met stenen stenigen. En Ik zal Mijn aangezicht tegen die man richten, en zal hem uit het midden van zijn volk uitroeien; want hij heeft van zijn nageslacht aan de Molech gegeven, om Mijn heiligdom te verontreinigen en Mijn heilige Naam te ontheiligen. En als het volk van het land hun ogen op enige manier verbergen zal voor die man, wanneer hij van zijn nageslacht aan de Molech geeft, zodat het hem niet doodt,", "2 Kron 28:24": "En Achaz verzamelde de voorwerpen van het huis van God, en hakte de voorwerpen van het huis van God in stukken, en sloot de deuren van het huis van de HEERE toe; daartoe maakte hij zich altaren in elke hoek van Jeruzalem.", "Ps 7:17": "Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.", "1 Kon 7:23-26": "Verder maakte hij de gegoten zee; van tien el was zij van de ene rand tot de andere, helemaal rond, en vijf el hoog, en een meetsnoer van dertig el kon haar rondom omvatten. En onder haar rand waren knoppen, die haar rondom omzetten, tien op elke el, die de zee rondom omringden; deze knoppen waren in twee rijen bij de gieting meegegoten. Zij stond op twaalf runderen; drie kijkend naar het noorden, en drie kijkend naar het westen, en drie kijkend naar het zuiden, en drie kijkend naar het oosten; en de zee stond boven op hen, en al hun achterdelen waren naar binnen gekeerd.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "2 Kon 15:33": "Hij was vijfentwintig jaar oud toen hij koning werd, en regeerde zestien jaar te Jeruzalem; en de naam van zijn moeder was Jerusa, de dochter van Zadok.", "1 Kron 19:7": "zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde.", "2 Kon 17:18": "Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.", "2 Kon 12:16": "Het geld van het schuldoffer en het geld van de zondoffers werd niet naar het huis van de HEERE gebracht; het was voor de priesters.", "2 Kron 16:2-9": "Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei: Er is een verbond tussen mij en u, en tussen mijn vader en uw vader; zie, ik zend u zilver en goud; ga heen, verbreek uw verbond met Baësa, de koning van Israël, zodat hij van tegen mij aftrekt. En Benhadad hoorde naar de koning Asa, en zond de aanvoerders van de legers die hij had, tegen de steden van Israël, en zij sloegen Ijon, en Dan, en Abel-Maim, en alle schatsteden van Naftali.", "2 Kron 34:2": "En hij deed wat recht was in de ogen van de HEERE, en wandelde in de wegen van zijn vader David, en week niet af naar rechts of naar links.", "2 Kron 28:5": "Daarom gaf de HEERE, zijn God, hem in de hand van de koning van Syrië, zodat zij hem versloegen en van hem een grote menigte gevangenen wegvoerden, die zij naar Damascus brachten. En hij werd ook gegeven in de hand van de koning van Israël, die hem versloeg met een grote slachting.", "1 Kon 3:1": "En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.", "2 Sam 10:15": "Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich weer samen.", "2 Kon 11:18": "Daarna ging al het volk van het land naar het huis van Baäl en brak dat af; zijn altaren en zijn beelden verbraken zij helemaal; en Mattan, de priester van Baäl, sloegen zij dood voor de altaren. De priester stelde toen ambtsdragers aan over het huis van de HEERE.", "Hos 8:11": "Omdat Efraïm de altaren vermenigvuldigd heeft om te zondigen, zijn hem de altaren geworden tot zondigen.", "2 Sam 10:6": "Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man.", "2 Sam 12:20": "Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.", "2 Kron 1:5": "Ook was het koperen altaar, dat Bezaleël, de zoon van Uri, de zoon van Hur, gemaakt had, daar gezet voor de tabernakel van de HEERE; Salomo nu en de gemeente zochten het.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Ps 122:1": "Een lied Hammaaloth, van David. Ik verblijd mij over hen die tegen mij zeggen: Wij zullen naar he
