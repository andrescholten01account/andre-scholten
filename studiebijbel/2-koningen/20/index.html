udas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In die dagen werd Hizkia ziek, tot aan het sterven toe; en de profeet Jesaja, de zoon van Amoz, kwam bij hem en zei tegen hem: Zo zegt de HEERE: Geef bevel aan uw huis, want u zult sterven en niet leven.","2":"Toen keerde hij zijn gezicht om naar de wand, en hij bad tot de HEERE en zei:","3":"Och, HEERE, gedenk toch dat ik voor Uw aangezicht in waarheid en met een volkomen hart gewandeld heb, en gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg veel.","4":"Het gebeurde nu, toen Jesaja het middelste voorhof nog niet uit was gegaan, dat het woord van de HEERE tot hem kwam en zei:","5":"Keer terug en zeg tegen Hizkia, de leider van Mijn volk: Zo zegt de HEERE, de God van uw vader David: Ik heb uw gebed gehoord, Ik heb uw tranen gezien; zie, Ik zal u gezond maken; op de derde dag zult u opgaan naar het huis van de HEERE;","6":"En Ik zal vijftien jaar aan uw dagen toevoegen, en Ik zal u uit de hand van de koning van Assyrië verlossen, alsook deze stad; en Ik zal deze stad beschermen, omwille van Mijzelf en omwille van Mijn dienaar David.","7":"Daarna zei Jesaja: Neem een klomp vijgen; en zij namen ze en legden ze op de zweer, en hij werd genezen.","8":"Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan?","9":"En Jesaja zei: Dit zal voor u een teken van de HEERE zijn, dat de HEERE het woord dat Hij gesproken heeft, doen zal: zal de schaduw tien graden vooruit gaan, of tien graden achteruit keren?","10":"Toen zei Hizkia: Het is voor de schaduw makkelijk om tien graden naar beneden te gaan; nee, maar dat de schaduw tien graden achterwaarts keert.","11":"En Jesaja, de profeet, riep de HEERE aan; en Hij deed de schaduw tien graden achterwaarts keren, in de graden waarin zij naar beneden gegaan was, op de zonnewijzer van Achaz.","12":"In die tijd zond Berodach-Baladan, de zoon van Baladan, de koning van Babel, brieven en een geschenk aan Hizkia; want hij had gehoord dat Hizkia ziek was geweest.","13":"En Hizkia luisterde naar hen, en hij toonde hun zijn hele schathuis, het zilver en het goud, en de specerijen, en de beste olie, en zijn wapenhuis, en alles wat gevonden werd in zijn schatten; er was geen ding in zijn huis, of in zijn hele heerschappij, dat hij hun niet toonde.","14":"Toen kwam de profeet Jesaja naar de koning Hizkia, en zei tegen hem: Wat hebben die mannen gezegd, en waar zijn zij vandaan bij u gekomen? En Hizkia zei: Zij zijn uit een ver land gekomen, uit Babel.","15":"En hij zei: Wat hebben zij gezien in uw huis? En Hizkia zei: Zij hebben alles gezien wat in mijn huis is; er is geen ding in mijn schatten dat ik hun niet getoond heb.","16":"Toen zei Jesaja tegen Hizkia: Hoor het woord van de HEERE.","17":"Zie, de dagen komen dat alles wat in uw huis is, en wat uw vaderen tot op deze dag opgeslagen hebben, naar Babel weggevoerd zal worden; er zal niets overblijven, zegt de HEERE.","18":"Daarbij zullen zij van uw zonen, die uit u zullen voortkomen, die u zult verwekken, nemen, zodat zij hovelingen zijn in het paleis van de koning van Babel.","19":"Maar Hizkia zei tegen Jesaja: Het woord van de HEERE, dat u gesproken hebt, is goed. Ook zei hij: Zou het niet goed zijn, als er vrede en waarheid in mijn dagen zal zijn?","20":"Het overige nu van de geschiedenis van Hizkia, en al zijn macht, en hoe hij de vijver en de watergang gemaakt heeft, en water in de stad gebracht heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?","21":"En Hizkia ontsliep met zijn vaderen; en zijn zoon Manasse werd koning in zijn plaats."},"SV":{"1":"In die dagen werd Hizkia krank tot stervens toe; en de profeet Jesaja, de zoon van Amoz, kwam tot hem, en zeide tot hem: Zo zegt de HEERE: Geef bevel aan uw huis, want gij zult sterven, en niet leven.","2":"Toen keerde hij zijn aangezicht om naar den wand, en hij bad tot den HEERE, zeggende:","3":"Och, HEERE, gedenk toch, dat ik voor Uw aangezicht in waarheid en met een volkomen hart gewandeld, en wat goed in Uw ogen is, gedaan heb. En Hizkia weende gans zeer.","4":"Het gebeurde nu, als Jesaja uit het middelvoorhof *nog* niet gegaan was, dat het woord des HEEREN tot hem geschiedde, zeggende:","5":"Keer weder en zeg tot Hizkia, den voorganger Mijns volks: Zo zegt de HEERE, de God van uw vader David: Ik heb uw gebed gehoord, Ik heb uw tranen gezien; zie, Ik zal u gezond maken; aan den derden dag zult gij opgaan in het huis des HEEREN;","6":"En Ik zal vijftien jaren tot uw dagen toedoen, en zal u uit de hand des konings van Assyrië verlossen, mitsgaders deze stad; en Ik zal deze stad beschermen om Mijnentwil, en om Mijns knechts Davids wil.","7":"Daarna zeide Jesaja: Neemt een klomp vijgen; en zij namen ze, en leiden ze op de zweer, en hij werd genezen.","8":"Hizkia nu had gezegd tot Jesaja: Welk is het teken, dat de HEERE mij gezond maken zal, en dat ik den derden dag in des HEEREN huis zal opgaan?","9":"En Jesaja zeide: Dit zal u een teken van den HEERE zijn, dat de HEERE het woord, dat Hij gesproken heeft, doen zal: Zal de schaduw tien graden voorwaarts gaan, of tien graden achterwaarts keren?","10":"Toen zeide Hizkia: Het is der schaduwe licht, tien graden nederwaarts te gaan; neen, maar dat de schaduw tien graden achterwaarts kere.","11":"En Jesaja, de profeet, riep den HEERE aan; en Hij deed de schaduw tien graden achterwaarts keren in de graden, dewelke zij nederwaarts gegaan was, in de graden van Achaz’ *zonnewijzer*.","12":"Te dier tijd zond Berodach Baladan de zoon van Baladan, de koning van Babel, brieven en een geschenk aan Hizkia; want hij had gehoord, dat Hizkia krank geweest was.","13":"En Hizkia hoorde naar hen, en hij toonde hun zijn ganse schathuis, het zilver, en het goud, en de specerijen, en de beste olie, en zijn wapenhuis, en al wat gevonden werd in zijn schatten; er was geen ding in zijn huis, noch in zijn ganse heerschappij, dat hij hun niet toonde.","14":"Toen kwam de profeet Jesaja tot den koning Hizkia, en zeide tot hem: Wat hebben die mannen gezegd, en van waar zijn zij tot u gekomen? En Hizkia zeide: Zij zijn uit verren lande gekomen, uit Babel.","15":"En hij zeide: Wat hebben zij gezien in uw huis? En Hizkia zeide: Zij hebben alles gezien, wat in mijn huis is; geen ding is er in mijn schatten, dat ik hun niet getoond heb.","16":"Toen zeide Jesaja tot Hizkia: Hoor des HEEREN woord.","17":"Zie, de dagen komen, dat al wat in uw huis is, en wat uw vaderen tot dezen dage toe opgelegd hebben, naar Babel weggevoerd zal worden; er zal niets overgelaten worden, zegt de HEERE.","18":"Daartoe zullen zij van uw zonen, die uit u zullen voortkomen, die gij gewinnen zult, nemen, dat zij hovelingen zijn in het paleis des konings van Babel.","19":"Maar Hizkia zeide tot Jesaja: Het woord des HEEREN, dat gij gesproken hebt, is goed. Ook zeide hij: Zou het niet, naardien vrede en waarheid in mijn dagen wezen zal?","20":"Het overige nu der geschiedenissen van Hizkia, en al zijn macht, en hoe hij den vijver en den watergang gemaakt heeft, en water in de stad gebracht heeft, zijn die niet geschreven in het boek der kronieken der koningen van Juda?","21":"En Hizkia ontsliep met zijn vaderen; en zijn zoon Manasse werd koning in zijn plaats."},"KJV":{"1":"In those days was Hezekiah sick unto death. And the prophet Isaiah the son of Amoz came to him, and said unto him, Thus saith the LORD, Set thine house in order; for thou shalt die, and not live.","2":"Then he turned his face to the wall, and prayed unto the LORD, saying,","3":"I beseech thee, O LORD, remember now how I have walked before thee in truth and with a perfect heart, and have done that which is good in thy sight. And Hezekiah wept sore.","4":"And it came to pass, afore Isaiah was gone out into the middle court, that the word of the LORD came to him, saying,","5":"Turn again, and tell Hezekiah the captain of my people, Thus saith the LORD, the God of David thy father, I have heard thy prayer, I have seen thy tears: behold, I will heal thee: on the third day thou shalt go up unto the house of the LORD.","6":"And I will add unto thy days fifteen years; and I will deliver thee and this city out of the hand of the king of Assyria; and I will defend this city for mine own sake, and for my servant David's sake.","7":"And Isaiah said, Take a lump of figs. And they took and laid it on the boil, and he recovered.","8":"And Hezekiah said unto Isaiah, What shall be the sign that the LORD will heal me, and that I shall go up into the house of the LORD the third day?","9":"And Isaiah said, This sign shalt thou have of the LORD, that the LORD will do the thing that he hath spoken: shall the shadow go forward ten degrees, or go back ten degrees?","10":"And Hezekiah answered, It is a light thing for the shadow to go down ten degrees: nay, but let the shadow return backward ten degrees.","11":"And Isaiah the prophet cried unto the LORD: and he brought the shadow ten degrees backward, by which it had gone down in the dial of Ahaz.","12":"At that time Berodachbaladan, the son of Baladan, king of Babylon, sent letters and a present unto Hezekiah: for he had heard that Hezekiah had been sick.","13":"And Hezekiah hearkened unto them, and shewed them all the house of his precious things, the silver, and the gold, and the spices, and the precious ointment, and all the house of his armour, and all that was found in his treasures: there was nothing in his house, nor in all his dominion, that Hezekiah shewed them not.","14":"Then came Isaiah the prophet unto king Hezekiah, and said unto him, What said these men? and from whence came they unto thee? And Hezekiah said, They are come from a far country, even from Babylon.","15":"And he said, What have they seen in thine house? And Hezekiah answered, All the things that are in mine house have they seen: there is nothing among my treasures that I have not shewed them.","16":"And Isaiah said unto Hezekiah, Hear the word of the LORD.","17":"Behold, the days come, that all that is in thine house, and that which thy fathers have laid up in store unto this day, shall be carried into Babylon: nothing shall be left, saith the LORD.","18":"And of thy sons that shall issue from thee, which thou shalt beget, shall they take away; and they shall be eunuchs in the palace of the king of Babylon.","19":"Then said Hezekiah unto Isaiah, Good is the word of the LORD which thou hast spoken. And he said, Is it not good, if peace and truth be in my days?","20":"And the rest of the acts of Hezekiah, and all his might, and how he made a pool, and a conduit, and brought water into the city, are they not written in the book of the chronicles of the kings of Judah?","21":"And Hezekiah slept with his fathers: and Manasseh his son reigned in his stead."}},"tsk":{"1":[{"kopje":"werd Hizkia","refs":["2 Kron 32:24-26","Jes 38:1-20","Joh 11:1-5","Fil 2:27","Fil 2:30"]},{"kopje":"de profeet","refs":["2 Kon 19:2","2 Kon 19:20"]},{"kopje":"Geef bevel aan uw huis","refs":["2 Sam 17:23","Jes 38:1"]},{"kopje":"u zult sterven","refs":["Jer 18:7-10","Jona 3:4-10"]}],"2":[{"kopje":"keerde hij","refs":["1 Kon 8:30","Ps 50:15","Jes 38:2","Jes 38:3","Matt 6:6"]}],"3":[{"kopje":"gedenk","refs":["Gen 8:1","Neh 5:19","Neh 13:14","Neh 13:22","Neh 13:31","Ps 25:7","Ps 89:48","Ps 89:51","Ps 119:49","Jes 63:11"]},{"kopje":"gewandeld heb","refs":["2 Kon 18:3-6","Gen 5:22","Gen 5:24","Gen 17:1","1 Kon 2:4","1 Kon 3:6","Job 1:1","Job 1:8","Luk 1:6"]},{"kopje":"in waarheid","refs":["2 Kron 31:20","2 Kron 31:21","Ps 32:2","Ps 145:18","Jer 4:2","Joh 1:48","2 Kor 1:12","1 Joh 3:21","1 Joh 3:22"]},{"kopje":"een volkomen hart","refs":["1 Kon 8:61","1 Kon 11:4","1 Kon 15:14","2 Kron 16:9"]},{"kopje":"huilde erg veel","refs":["2 Sam 12:21","2 Sam 12:22","Ps 6:7","Ps 102:10","Jes 38:14","Hebr 5:7"]}],"4":[{"kopje":"het middelste voorhof","refs":["2 Kon 22:14","1 Kon 7:8"]}],"5":[{"kopje":"Keer terug","refs":["2 Sam 7:3-5","1 Kron 17:2-4"]},{"kopje":"de leider","refs":["Joz 5:14","Joz 5:15","1 Sam 9:16","1 Sam 10:1","2 Sam 5:2","2 Kron 13:12","Hebr 2:10"]},{"kopje":"de God","refs":["2 Kron 34:3","Jes 38:5","Jes 55:3","Matt 22:32"]},{"kopje":"Ik heb uw gebed gehoord","refs":["2 Kon 19:20","Ps 65:3","Ps 66:19","Ps 66:20","Luk 1:13"]},{"kopje":"Ik heb uw tranen gezien","refs":["Ps 39:13","Ps 56:9","Ps 126:5","Openb 7:17"]},{"kopje":"Ik zal u gezond maken","refs":["2 Kon 20:7","Ex 15:26","Deut 32:39","Job 33:19-26","Ps 147:3","Jak 5:14","Jak 5:15"]},{"kopje":"zult u opgaan","refs":["2 Kon 20:8","Ps 66:13-15","Ps 66:19","Ps 66:20","Ps 116:12-14","Ps 118:17-19","Jes 38:22","Joh 5:14"]}],"6":[{"kopje":"Ik zal vijftien jaar aan uw dagen toevoegen","refs":["Ps 116:15","Hand 27: des doods. Vergelijk Jdg 6:17."}],"9":[{"catchword":"Zal e","tekst":"Of, de schaduw is tien graden voortgegaan, zal zij tien graden wederkeren?"},{"catchword":"schaduw","tekst":"Te weten, die door het schijnen der zon van den wijzer over het uurwerk gemaakt werd."},{"catchword":"graden","tekst":"Hebreeuws, opklimmingen, trappen. Versta, de tekenen of streken, of liniën in het uurwerk, door welke de uren onderscheiden en van den wijzer afgetekend waren. Dit is een groot wonderwerk Gods geweest. Aangaande de graden of liniën, of ze halve of gehele uren betekenen, en dergelijke omstandigheden meer, daarvan is verscheiden gevoelen."},{"catchword":"voorwaarts gaan,","tekst":"Dat is, haastiglijk en als in één ogenblik op een extraordinaire wijze, naar het westen."},{"catchword":"achterwaarts keren?","tekst":"Dat is, naar het oosten."}],"10":[{"catchword":"licht,","tekst":"Als met den ordinairen loop der zon meer overeenkomende, hoewel ook mirakuleus."}],"11":[{"catchword":"graden van Achaz'","tekst":"Dat is, in den zonnewijzer, dien zijn vader Achaz had laten maken."}],"12":[{"catchword":"zond Beródach","tekst":"Te weten, om Hizkia geluk te bieden over zijn verkregen gezondheid en om te vernemen naar het mirakel, dat in de zon geschied, [ Isa 38:8 ] , en in Chaldea mede aangemerkt was; 2Ch 32:31."},{"catchword":"Báladan","tekst":"De koning van Babylonië, ook genoemd Merodach, Isa 39:1, en in de wereldse historiën."}],"13":[{"catchword":"hoorde","tekst":"Te weten, met blijdschap. Zie Isa 39:2."},{"catchword":"hen,","tekst":"Versta, de boden, of heren, die de voorgemelde brieven met het geschenk gebracht hadden. Dezen heeft Hizkia vlijtiglijk toegeluisterd over hetgeen dat zij hem aandienden of vraagden."},{"catchword":"schathuis,","tekst":"Of, specerijhuis. Versta, een huis, waarin allerlei lieflijke reukwerken en kostelijke goederen opgesloten waren."},{"catchword":"wapenhuis,","tekst":"Hebreeuws, een huis der vaten, of, instrumenten. Versta, wapenen, of zilveren en goude atchword":"Then he turned his face about, towards the wall","tekst":"to wit, that having turned away his eyes from men he might the better turn his mind to God, to pray earnestly and servently and he prayed unto the Lord, saying;"}],"3":[{"catchword":"Oh Lord, remember, I pray that I have walked before thy face in truth","tekst":"Or, in faithfulness, faithfully"},{"catchword":"and with a perfect heart","tekst":"see 1 Kings 8 on v. 61."},{"catchword":"and have done that which is Gooding thine eyes: And Hizkia wept very sore","tekst":"Heb. Wept a great weeping or with a great weeping. He wept not so much through fear of death as because he was troubled to think what would become of God&acirc;&euro;&trade;s people, the pure worship of God, and the state of the kingdome after his death."}],"4":[{"catchword":"Now it came to pass when Isaia was not (yet) gone out of the middle court","tekst":"To wit, of the king&acirc;&euro;&trade;s house: which court is called the second court, 1 Kings 7.8 oth. Out of the middle city, that is, out of the middle part of the city, which was between the fort and utmost part of the city. It&acirc;&euro;&trade;s conceived that the city of Jerusalem consisted of thre parts; first the city of David on Mont Zion, where the royal fort was. Secondly, the middle part of the city, thirdly, the remaining and utmost part thereof. Compare below chaper 22.14. 2 chron. 34.22. Zeph.1.10. that the word of the Lord came to him, saying;"}],"6":[{"catchword":"And I will adde fifteen years unto thy dayes","tekst":"understand this in respect to the nature of the sickness which was mingled with death and not in respect of God&acirc;&euro;&trade;s purpose who had determined by the almighty fifteen years longer"},{"catchword":"and will deliver thee out of the hand of the King of Assyria","tekst":"to wit, by hindering the Assyrians from re-assuring the war"},{"catchword":"together with this city and I will defend this city for mine own sake","tekst":"see above chap. 19 on v. 34."},{"catchword":"and for my servant David&acirc;&euro;&trade;s sake","tekst":"see 1 Kings 11 on v. 12."}],"7":[{"catchword":"Then said Isaia; take a lump of figs; and they took it and they laid it on the sore, and he was healed","tekst":"Heb. Lived so above chapter 8 on v. 8 that is, he recovered, not so much by the natural virtue of the figs (which indeed are a conducible means thereunto) as chiefly by the special and super-natural power and blessing of the almighty."}],"8":[{"catchword":"Now hizkia said into Isaia, which is token that the Lord will heal me and that I shall go up into the house of the Lord in the third day?","tekst":"he spake this not out of unbelief, as the scribes and Pharises defied a token, Math. 12.38. but of an upright inclination or affection to strengthen his faith, because this promise of life did directly to oppose and contradict the former threatening of death. Compare Jud 6:17."}],"9":[{"catchword":"And Isaia said, this shall be a token unto thee from the Lord, that the Lord will do the thing that he hath spoken; shall the shadow","tekst":"which is made by the shinning of the sun on the dyal, which is on the out-side of the clock"},{"catchword":"go forward","tekst":"i.e. speedily and as it were in a moment, in an extraordinary manner, toward the west"},{"catchword":"ten degrees?","tekst":"Heb. Ascensions, steps. Understand the marks or stroaks, or lines in the clock by which the hours were distinguished and pourtraied on the daill. This was a wonderful work of God. Concerning the degrees or lines, whether they signify half or whole hours and the like circumstance more, thereof are divers opinions."},{"catchword":"or return backward","tekst":"i.e. toward the east"},{"catchword":"ten degrees?","tekst":"or the shadow is gone forward ten degrees, shall it go back ten degrees."}],"10":[{"catchword":"Then saith Jezhizkia; it is a light thing","tekst":"as more agreeing with the ordinary course of the fun, although also miraculous const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
