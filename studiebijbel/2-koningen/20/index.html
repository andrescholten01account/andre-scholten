an de HEERE.", "Hand 7:60": "En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.", "Gen 5:22": "En Henoch wandelde met God, nadat hij Methusalach verwekt had, driehonderd jaren; en hij verwekte zonen en dochters.", "Joh 12:3-5": "Maria dan, die een pond zalf van onvervalste, zeer kostbare nardus genomen had, zalfde de voeten van Jezus, en droogde met haar haren Zijn voeten af; en het huis werd vervuld met de geur van de zalf. Toen zei een van Zijn discipelen, namelijk Judas, Simons zoon, Iskariot, die Hem verraden zou: Waarom is deze zalf niet verkocht voor driehonderd penningen, en aan de armen gegeven?", "Dan 1:3-7": "En de koning zei tegen Aspenaz, de leider van zijn kamerlingen, dat hij enigen uit de kinderen van Israël voor moest brengen, namelijk uit het koninklijk geslacht, en uit de vooraanstaanden; Jongemannen, aan wie geen gebrek was, maar knap van gezicht, en verstandig in alle wijsheid, en ervaren in kennis, en scherp van verstand, en in wie de bekwaamheid was om te staan in het paleis van de koning; en dat men hen zou onderwijzen in de boeken en taal van de Chaldeeën. En de koning bepaalde voor hen wat men hen dag bij dag zou geven van het voedsel van de koning, en van de wijn van zijn drank, en dat men hen drie jaar lang zo grootbracht, en dat zij aan het einde daarvan voor de koning zouden staan.", "Luk 2:10": "En de engel zei tegen hen: Wees niet bang, want zie, ik verkondig u grote blijdschap, die er voor heel het volk zijn zal;", "1 Kon 17:21": "En hij strekte zich driemaal uit over dat kind, en riep de HEERE aan, en zei: HEERE, mijn God, laat toch de ziel van dit kind in hem wederkeren.", "Ps 145:14": "Samech. De HEERE ondersteunt allen die vallen, en Hij richt op alle gebogenen.", "Jes 42:13": "De HEERE zal uittrekken als een held; Hij zal de ijver opwekken als een krijgsman; Hij zal juichen, ja, Hij zal een groot geschreeuw maken; Hij zal Zijn vijanden overweldigen.", "1 Kon 2:10": "En David ontsliep met zijn vaderen, en werd begraven in de stad van David.", "Ps 17:7": "Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan!", "Ps 26:3-6": "Want Uw goedertierenheid is voor mijn ogen, en ik wandel in Uw waarheid. Ik zit niet bij nietswaardige mensen, en met huichelaars ga ik niet om. Ik haat de vergadering van de boosdoeners, en bij de goddelozen zit ik niet.", "2 Kon 4:26": "Loop haar nu toch tegemoet, en zeg tegen haar: Is het goed met u? Is het goed met uw man? Is het goed met uw kind? En zij zei: Het is goed.", "Joz 10:12-14": "Toen sprak Jozua tot de HEERE, op de dag toen de HEERE de Amorieten voor het aangezicht van de kinderen van Israël overgaf, en hij zei voor de ogen van de Israëlieten: Zon, sta stil te Gibeon, en u, maan, in het dal van Ajalon! En de zon stond stil, en de maan bleef staan, totdat het volk zich op zijn vijanden gewroken had. Is dit niet geschreven in het boek van de oprechten? De zon nu stond stil in het midden van de hemel, en haastte zich niet om onder te gaan, ongeveer een volle dag. En er was geen dag aan deze gelijk, ervoor of erna, dat de HEERE de stem van een man zó verhoorde; want de HEERE streed voor Israël.", "2 Kron 25:16": "En het gebeurde, toen hij tot hem sprak, dat hij hem zei: Heeft men u tot raadgever van de koning aangesteld? Houd op; waarom zou men u slaan? Toen hield de profeet op, en zei: Ik merk dat God besloten heeft u te vernietigen, omdat u dit gedaan hebt, en naar mijn raad niet hebt geluisterd.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Ezra 1:8": "En Kores, de koning van Perzië, liet ze uitgeven door de hand van Mithredath, de schatmeester, die ze overhandigde aan Sesbazar, de vorst van Juda, na ze geteld te hebben.", "1 Kon 8:63": "En Salomo offerde als dankoffer, dat hij de HEERE offerde, tweeëntwintigduizend runderen, en honderdtwintigduizend schapen. Zo hebben zij het huis van de HEERE ingewijd, de koning en al de kinderen van Israël.", "Ps 102:21": "Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "2 Kon 4:41": "Maar hij zei: Breng dan meel; en hij wierp het in de pot; en hij zei: Schep voor het volk op, zodat zij eten. Toen was er niets kwaads meer in de pot.", "2 Kron 29:5": "En hij zei tegen hen: Hoor mij, Levieten; heilig nu uzelf, en heilig het huis van de HEERE, de God van uw vaderen, en breng de onreinheid naar buiten, uit het heiligdom.", "Job 33:19-26": "Ook wordt hij gestraft met smart op zijn leger, en de sterke menigte van zijn beenderen; Zodat zijn leven het brood zelf verfoeit, en zijn ziel het begeerlijke voedsel; Dat zijn vlees verdwijnt uit het gezicht, en zijn beenderen, die niet gezien werden, uitsteken;", "Gen 28:15": "En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal u terugbrengen naar dit land; want Ik zal u niet verlaten, totdat Ik gedaan heb wat Ik tot u gesproken heb.", "Deut 1:31": "En in de woestijn, waar u gezien hebt dat de HEERE, uw God, u gedragen heeft, zoals een man zijn zoon draagt, op heel de weg die u gegaan bent, totdat u kwam bij deze plaats.", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "Est 2:12": "Toen nu de beurt van elke jonge dochter naderde om bij koning Ahasveros te komen, nadat haar twaalf maanden lang naar de wet van de vrouwen gebeurd was; want zo werden vervuld de dagen van haar schoonheidsverzorging, zes maanden met mirreolie, en zes maanden met specerijen, en met andere schoonheidsmiddelen van de vrouwen;", "Zef 3:13": "De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedrieglijke tong gevonden worden; maar zij zullen weiden en neerliggen, en niemand zal hen schrik aanjagen.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Ps 25:9": "Jod. Hij zal de zachtmoedigen leiden in het recht, en Hij zal de zachtmoedigen Zijn weg leren.", "Jes 7:3": "En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller;", "Zach 3:10": "Op die dag, spreekt de HEERE van de heerscharen, zult u ieder zijn naaste nodigen tot onder de wijnstok en tot onder de vijgenboom.", "Job 27:4": "Indien mijn lippen onrecht zullen spreken, en indien mijn tong bedrog zal uitspreken!", "Jer 20:2": "sloeg Pashur de profeet Jeremia, en zette hem in de gevangenis die in de bovenste poort van Benjamin is, die aan het huis van de HEERE ligt.", "Job 2:9": "Toen zei zijn vrouw tegen hem: Houdt u nog steeds vast aan uw oprechtheid? Vervloek God en sterf.", "2 Kon 22:17": "Omdat zij Mij verlaten hebben, en voor andere goden reukwerk gebrand hebben, om Mij tot toorn te verwekken met al het werk van hun handen, zal Mijn grimmigheid ontstoken worden tegen deze plaats, en niet uitgeblust worden.", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "Jes 14:4": "dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op!", "Jes 22:9-11": "En u zult de scheuren van de stad van David bekijken, omdat ze veel zijn; en u zult het water van de onderste vijver verzamelen. U zult ook de huizen van Jeruzalem tellen; en u zult huizen afbreken, om de muren te versterken. Ook zult u een gracht maken tussen beide de muren, voor het water van de oude vijver; maar u zult niet omhoogkijken naar Hem, Die dat gedaan heeft, en Hem niet aanmerken, Die dat van verre tijden gevormd heeft.", "Ezra 8:23": "Zo vastten wij en verzochten dat van onze God; en Hij liet Zich door ons verbidden.", "Jes 49:25": "Doch zo zegt de HEERE: Ja, de gevangenen van de machtige zullen hem ontnomen worden, en de vangst van de tiran zal ontkomen; want met hen die u bestrijden zal Ik strijden, en uw kinderen zal Ik verlossen.", "Jer 32:28": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.", "Ps 119:106": "Ik heb gezworen, en zal het bevestigen, dat ik onderhouden zal de rechten van Uw gerechtigheid.", "Jer 13:9-27": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem. Dit boosaardige volk, dat weigert Mijn woorden te horen, dat wandelt naar het goeddunken van zijn hart, en andere goden navolgt om die te dienen en zich voor die neer te buigen; dat zal worden als deze gordel, die nergens meer voor deugt. Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Jer 28:1": "Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei:", "1 Sam 9:16": "Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is.", "Ex 11:7": "Maar bij alle kinderen van Israël zal geen hond zijn tong bewegen, van de mensen af tot de beesten toe; opdat u weet dat de HEERE tussen de Egyptenaren en tussen de Israëlieten een afzondering maakt.", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "Jes 31:5": "Zoals vliegende vogels, zo zal de HEERE van de heerscharen Jeruzalem beschutten, beschuttend zal Hij haar ook verlossen, voorbijgaand zal Hij haar ook uithelpen.", "Ezech 34:25-28": "En Ik zal een verbond van vrede met hen maken, en zal het boze gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden. Want Ik zal hen, en de plaatsen rondom Mijn heuvel, stellen tot een zegen; en Ik zal de plasregen doen neerdalen op zijn tijd, plasregens van zegen zullen er zijn. En het geboomte van het veld zal zijn vrucht geven, en het land zal zijn opbrengst geven, en zij zullen zeker zijn in hun land; en zullen weten, dat Ik de HEERE ben, als Ik de disselbomen van hun juk zal hebben verbroken, en hen gered heb uit de hand van hen die zich door hen deden dienen.", "Jes 49:9": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn.", "2 Kon 18:17": "Evenwel zond de koning van Assyrië Tartan, en Rabsaris, en Rabsake, van Lachis naar de koning Hizkia, met een zwaar leger naar Jeruzalem; en zij trokken op, en kwamen naar Jeruzalem. En toen zij optrokken en gekomen waren, bleven zij staan bij de watergang van de opperste vijver, die bij de hoge weg van het veld der vollers is.", "Ps 6:7": "Ik ben moe van mijn zuchten; ik laat mijn bed de hele nacht zwemmen; ik doornat mijn bedstede met mijn tranen.", "Ps 116:6": "De HEERE bewaart de eenvoudigen; ik was uitgeteerd, maar Hij heeft mij verlost.", "Zach 12:8": "Op die dag zal de HEERE de inwoners van Jeruzalem beschutten; en wie onder hen struikelen zou, zal op die dag zijn als David; en het huis van David zal zijn als goden, als de Engel van de HEERE voor hun aangezicht.", "Amos 2:4": "Zo zegt de HEERE: Om drie overtredingen van Juda, en om vier zal Ik dat niet afwenden; omdat zij de wet van de HEERE verworpen, en Zijn inzettingen niet bewaard hebben; en hun leugens hen verleid hebben, die hun vaders hebben nagevolgd.", "Ps 66:19": "Maar zeker, God heeft gehoord; Hij heeft gemerkt op de stem van mijn gebed.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Openb 7:17": "Want het Lam, Dat in het midden van de troon is, zal hen weiden, en zal hun een Leidsman zijn tot levende fonteinen van water; en God zal alle tranen van hun ogen afwissen.", "2 Tess 3:3": "Maar de Heere is getrouw, Die u zal versterken en bewaren van de boze.", "1 Kon 22:19": "Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger stond naast Hem, aan Zijn rechterhand en aan Zijn linkerhand.", "Ps 119:49": "Zain. Gedenk het woord, tot Uw knecht gesproken, waarop U mij hebt doen hopen.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Jer 31:10": "Hoort het woord van de HEERE, heidenvolken! En verkondigt het in de eilanden die ver weg zijn, en zegt: Hij, Die Israël verstrooid heeft, zal hem weer verzamelen, en hem bewaren zoals een herder zijn kudde.", "Jes 14:4-7": "dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op! De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers. Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "Ex 23:19": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE uw God brengen. U zult een bokje niet koken in de melk van zijn moeder.", "Ps 119:31": "Ik kleef vast aan Uw getuigenissen; o HEERE! beschaam mij niet.", "Job 4:7": "Bedenk toch, wie is de onschuldige die is omgekomen; en waar zijn de oprechten verdelgd?", "Jer 36:6": "Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.", "Ps 106:31": "En het is hem gerekend tot gerechtigheid, van geslacht tot geslacht tot in eeuwigheid.", "Spr 2:7": "Hij legt weg voor de oprechten een bestendig bezit; Hij is een schild voor hen die oprecht wandelen;", "Jes 22:11": "Ook zult u een gracht maken tussen beide de muren, voor het water van de oude vijver; maar u zult niet omhoogkijken naar Hem, Die dat gedaan heeft, en Hem niet aanmerken, Die dat van verre tijden gevormd heeft.", "Jes 35:9": "Er zal geen leeuw zijn, en geen verscheurend gedierte zal daarop komen, en het zal daar niet gevonden worden; maar de verlosten zullen daarop wandelen.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Jer 36:29": "En tegen Jojakim, de koning van Juda, zult u zeggen: Zo zegt de HEERE: U hebt deze rol verbrand, en gezegd: Waarom hebt u daarop geschreven: De koning van Babel zal zeker komen, en dit land verderven, en maken dat mens en dier daarin ophouden te bestaan?", "Ps 18:18": "Hij verloste mij van mijn sterke vijand, en van mijn haters, omdat zij machtiger waren dan ik.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Jer 31:28": "En het zal gebeuren, zoals Ik over hen gewaakt heb om uit te rukken, en af te breken, en te verstoren, en te verderven, en kwaad aan te doen; zo zal Ik over hen waken om te bouwen en te planten, spreekt de HEERE.", "Spr 3:23": "Dan zult u uw weg zeker gaan, en u zult uw voet niet stoten.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "2 Kon 25:13-15": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden het koper daarvan naar Babel. Zij namen ook de potten, en de schoffels, en de gaffels, en de rookschalen, en al de koperen voorwerpen, waarmee men de dienst verrichtte. En de aanvoerder van de lijfwacht nam de wierookvaten en de sprenkelschalen weg, wat geheel goud en wat geheel zilver was.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Ps 31:24": "Heb de HEERE lief, u, al Zijn gunstgenoten! Want de HEERE behoedt de gelovigen, en vergeldt overvloedig hem die hoogmoed bedrijft.", "Ex 34:26": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE, uw God, brengen. U zult het bokje niet koken in de melk van zijn moeder.", "Jes 22:1-14": "De last van het dal van het gezicht. Wat is er nu met u, dat u helemaal naar de daken bent geklommen? U, die vol was van groot rumoer, u woelige stad, u, vrolijk huppelende stad, uw gesneuvelden zijn niet gesneuveld door het zwaard, en ook niet gestorven in de strijd. Al uw leiders zijn samen weggevlucht; zij zijn door de schutters gebonden, allen die in u gevonden zijn, zijn samen gebonden, zij zijn van ver gevlucht.", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Jes 8:14-22": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem. En velen onder hen zullen struikelen, en vallen, en verbroken worden, en zullen verstrikt en gevangen worden. Bind de getuigenis toe; verzegel de wet onder mijn leerlingen.", "Luk 2:14": "Ere zij God in de hoogste hemelen, en vrede op aarde, in de mensen een welbehagen.", "Lev 10:1-3": "En de zonen van Aäron, Nadab en Abihu, namen ieder zijn wierookvat en deden er vuur in, en legden er reukwerk op, en brachten vreemd vuur voor het aangezicht van de HEERE, wat Hij hun niet geboden had. Toen ging er een vuur uit van het aangezicht van de HEERE, en verteerde hen; en zij stierven voor het aangezicht van de HEERE. En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "Mark 6:18": "Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben.", "Ps 56:9": "U hebt mijn omzwerven geteld; leg mijn tranen in Uw fles; staan zij niet in Uw register?", "Spr 16:9": "Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.", "Ps 66:20": "Geloofd zij God, Die mijn gebed niet heeft afgewend, en Zijn goedertierenheid niet van mij.", "Luk 13:35": "Zie, uw huis wordt aan u woest achtergelaten. En voorwaar, Ik zeg u, dat u Mij niet zult zien, totdat de tijd zal zijn gekomen dat u zult zeggen: Gezegend is Hij Die komt in de Naam van de Heere!", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Deut 23:18": "U zult geen hoerenloon noch hondenprijs in het huis van de HEERE, uw God, brengen, voor enige gelofte; want ook die beide zijn de HEERE, uw God, een gruwel.", "1 Kon 2:4": "opdat de HEERE Zijn woord bevestigt, dat Hij over mij gesproken heeft, toen Hij zei: Als uw zonen hun weg bewaren, om voor Mijn aangezicht trouw, met hun hele hart en met hun hele ziel te wandelen, dan zal het u nooit ontbreken, zei Hij, aan een man op de troon van Israël.", "Jes 7:17-25": "Maar de HEERE zal over u, en over uw volk, en over het huis van uw vader, dagen doen komen, wat voor dagen niet gekomen zijn vanaf de dag dat Efraïm van Juda is afgeweken, door de koning van Assyrië. Want het zal op die dag gebeuren, dat de HEERE zal fluiten naar de vliegen, die aan het einde van de rivieren van Egypte zijn, en naar de bijen die in het land van Assyrië zijn. En zij zullen komen, en zij zullen allemaal neerstrijken in de woeste dalen, en in de kloven van de rotsen, en op alle doornhagen, en op alle geprezen plaatsen.", "Job 22:25": "Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;", "2 Tim 1:3": "Ik dank God, aan Wie ik dien vanaf mijn voorouders met een rein geweten, zoals ik zonder ophouden aan u denk in mijn gebeden, nacht en dag;", "Klaagl 3:39": "Mem. Wat klaagt dan een levend mens? Ieder klaagt vanwege zijn zonden.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Hoogl 1:3": "Uw oliën zijn goed van geur, uw naam is een olie die uitgestort wordt; daarom hebben de maagden u lief.", "2 Kron 26:23": "En Uzzia ontsliep met zijn vaderen, en zij begroeven hem bij zijn vaderen, in het veld van de begrafenis dat van de koningen was; want zij zeiden: hij is melaats; en zijn zoon Jotham werd koning in zijn plaats.", "Zach 14:11": "En zij zullen daarin wonen, en er zal geen verbanning meer zijn; want Jeruzalem zal zeker wonen.", "Ex 16:15": "Toen de Israëlieten het zagen, zeiden zij tegen elkaar: Wat is dit? Want zij wisten niet wat het was. Mozes dan zei tegen hen: Dit is het brood, dat de HEERE u te eten gegeven heeft.", "Jes 54:14": "U zult door gerechtigheid bevestigd worden; wees ver van verdrukking, want u zult niet vrezen; en ver van verschrikking, want zij zal tot u niet naderen.", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "1 Tess 2:10": "U bent getuigen, en God ook, hoe heilig, en rechtvaardig, en onberispelijk wij ons onder u, die gelooft, gedragen hebben.", "Hoogl 4:4": "Uw hals is als de toren van David, die gebouwd is tot ophanging van wapentuig, waar duizend rondassen aan hangen, allemaal schilden van de helden.", "1 Kon 14:19": "Het overige nu van de geschiedenis van Jerobeam, hoe hij oorlog voerde, en hoe hij geregeerd heeft, zie, dat staat geschreven in het boek van de kronieken van de koningen van Israël.", "Jes 29:1-10": "Wee Ariël, Ariël! De stad waarin David gelegerd heeft; doe jaar bij jaar; laat ze feestoffers slachten. Toch zal Ik Ariël in het nauw brengen, en er zal treuring en droefheid zijn, en die stad zal Mij gelijk Ariël zijn. Want Ik zal een leger in het rond om u opslaan, en Ik zal u belegeren met bolwerken, en Ik zal vestingen tegen u opwerpen.", "Luk 11:29": "En toen de menigten dicht bijeenkwamen, begon Hij te zeggen: Dit is een slecht geslacht; het verlangt een teken, maar het zal geen teken gegeven worden, dan het teken van Jona, de profeet.", "Neh 3:16": "Na hem verbeterde Nehemia, de zoon van Azbuk, leider van het halve deel van Beth-Zur, tot tegenover Davids graven, en tot aan de aangelegde vijver, en tot aan het huis van de helden.", "Ps 103:2-5": "Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden;", "Jes 30:26": "En het licht van de maan zal zijn als het licht van de zon, en het licht van de zon zal zevenvoudig zijn als het licht van zeven dagen; op de dag dat de HEERE de breuk van Zijn volk zal verbinden, en de wond waarmee het geslagen is, genezen.", "1 Kon 10:15": "behalve wat er binnenkwam van de kramers, en van de handel van de kruideniers, en van alle koningen van Arabië, en van de bestuurders van dat land.", "Luk 18:8": "Ik zeg u dat Hij hun snel recht zal doen. Maar de Zoon des mensen, zal Hij, als Hij komt, geloof vinden op de aarde?", "Luk 1:6": "En zij waren beiden rechtvaardig voor God, en wandelden onberispelijk in alle geboden en voorschriften van de Heere.", "Matt 24:14-42": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen. Wanneer u dan de gruwel van de verwoesting zal zien, waarvan gesproken is door Daniël de profeet, staande op de heilige plaats (die het leest, laat hij daarop letten!), laat dan wie in Judea zijn, vluchten naar de bergen;", "Ps 39:5": "HEERE, maak mij mijn einde bekend, en welke de mate van mijn dagen is; dat ik weet, hoe vergankelijk ik ben.", "Jes 31:4": "Want zo heeft de HEERE tegen mij gezegd: Zoals een leeuw, en een jonge leeuw over zijn prooi brult, wanneer ook een volle menigte herders tegen hem samengeroepen wordt, verschrikt hij voor hun stem niet, en vernedert zich niet vanwege hun grote aantal; zo zal de HEERE van de heerscharen neerdalen, om te strijden voor de berg Sion en voor haar heuvel.", "Ezech 34:22": "Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee.", "Neh 13:22": "Vervolgens zei ik tegen de Levieten dat zij zich zouden reinigen, en de poorten komen bewaken, om de sabbatdag te heiligen. Denk ook hierin aan mij, mijn God! en spaar mij naar de overvloed van Uw goedertierenheid.", "1 Kon 14:31": "En Rehabeam ontsliep met zijn vaderen, en werd begraven bij zijn vaderen in de stad van David; en de naam van zijn moeder was Naäma, de Ammonietische; en zijn zoon Abiam regeerde in zijn plaats.", "Jer 26:18": "Micha, de Morastiet, heeft in de dagen van Hizkia, koning van Juda, geprofeteerd, en tot al het volk van Juda gesproken, en gezegd: Zo zegt de HEERE van de heerscharen: Sion zal als een akker geploegd worden, en Jeruzalem tot steenhopen worden, en de berg van dit huis tot hoogten van het woud.", "Ps 89:48": "Gedenk wat voor eeuw ik ben; waarom zou Gij alle mensenkinderen tevergeefs geschapen hebben?", "Num 9:23": "Naar het bevel van de HEERE legerden zij zich, en naar het bevel van de HEERE trokken zij verder; zij namen de wacht van de HEERE waar, naar het bevel van de HEERE, door de hand van Mozes.", "2 Kon 18:6": "Want hij kleefde de HEERE aan; hij week niet van Hem af om Hem na te volgen, en hij hield Zijn geboden, die de HEERE aan Mozes geboden had.", "Ps 32:6": "Hierom zal iedere heilige U aanbidden in de tijd dat U te vinden bent; ja, in een overstroming van grote wateren zullen zij hem niet aanraken.", "2 Kron 32:28": "Ook opslagplaatsen voor de opbrengst van koren, en wijn, en olie; en stallen voor allerlei beesten, en kooien voor de kudden.", "Ex 14:29": "Maar de kinderen van Israël gingen op het droge, in het midden van de zee; en de wateren waren hun een muur, aan hun rechterhand en aan hun linkerhand.", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "Ezra 1:7": "Ook bracht koning Kores de voorwerpen van het huis van de HEERE naar buiten, die Nebukadnezar uit Jeruzalem had weggehaald, en in het huis van zijn god had gezet.", "Ps 68:23": "De Heere heeft gezegd: Ik zal terugbrengen uit Basan; Ik zal terugbrengen uit de diepten van de zee;", "Deut 7:22": "En de HEERE, uw God, zal deze volken voor uw aangezicht geleidelijk uitwerpen; u zult hen niet snel mogen vernietigen, omdat anders de wilde dieren van het veld tegen u te veel worden.", "Openb 7:3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "Ps 66:13-15": "Ik zal met brandoffers Uw huis binnengaan; ik zal U mijn geloften betalen, Die mijn lippen hebben geuit, en mijn mond heeft uitgesproken, toen het mij bang te moede was. Brandoffers van vetgemeste dieren zal ik U offeren, met rookwerk van rammen; ik zal runderen met bokken bereiden. Sela.", "2 Sam 16:12": "Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "Jer 11:9-23": "Verder zei de HEERE tegen mij: Er is een samenzwering gevonden onder de mannen van Juda, en onder de inwoners van Jeruzalem. Zij zijn teruggekeerd tot de ongerechtigheden van hun voorvaders, die Mijn woorden geweigerd hebben te horen; en zij zijn andere goden nagelopen, om die te dienen; het huis van Israël en het huis van Juda hebben Mijn verbond gebroken, dat Ik met hun vaderen gemaakt heb. Daarom zegt de HEERE zo: Zie, Ik zal een kwaad over hen brengen, waaruit zij niet zullen kunnen ontkomen; als zij dan tot Mij zullen roepen, zal Ik naar hen niet horen.", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "Est 9:30": "En hij zond de brieven aan alle Joden, in de honderdzevenentwintig landschappen van het koninkrijk van Ahasveros, met woorden van vrede en trouw;", "Ps 119:75": "Ik weet, HEERE! dat Uw gerichten de gerechtigheid zijn, en dat U mij uit getrouwheid verdrukt hebt.", "Hab 1:6-11": "Want zie, Ik verwek de Chaldeeën, een bitter en snel volk, dat door de breedten van de aarde trekt, om woningen die niet van hem zijn, in erfelijk bezit te nemen. Schrikkelijk en vreselijk is het; zijn recht en zijn hoogheid gaan van hemzelf uit. Want zijn paarden zijn lichter dan de luipaarden, en zij zijn scherper dan de avondwolven, en zijn ruiters verspreiden zich; ja, zijn ruiters zullen van verre komen, zij zullen vliegen als een arend, die zich haast om te eten.", "1 Kon 11:43": "Daarna ontsliep Salomo met zijn vaderen, en werd begraven in de stad van zijn vader David; en Rehabeam, zijn zoon, werd koning in zijn plaats.", "1 Kon 7:8": "En bij zijn huis, waar hij woonde, was een andere voorhof, meer naar binnen dan dat voorhuis, van hetzelfde werk gemaakt; ook maakte hij voor de dochter van Farao, die Salomo tot vrouw genomen had, een huis, gelijk aan dat voorhuis.", "Ps 41:2-4": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads. De HEERE zal hem bewaren, en zal hem bij het leven behouden; hij zal op aarde gelukkig gemaakt worden. Geef hem ook niet over in de begeerte van zijn vijanden. De HEERE zal hem ondersteunen op het ziekbed; in zijn ziekte verandert U zijn hele leger.", "Klaagl 1:18": "Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond opstandig geweest; hoort toch, alle volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenschap gegaan.", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "Jes 39:7": "Daarbij zullen zij van uw zonen die uit u zullen voortkomen, die u zult verwekken, meenemen, om hovelingen te zijn in het paleis van de koning van Babel.", "2 Kor 7:4": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking.", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "Job 1:1": "Er was een man in het land Uz, zijn naam was Job; en die man was oprecht en vroom, en godvrezend, en week af van het kwaad.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Ex 13:21": "En de HEERE ging voor hun aangezicht uit, overdag in een wolkkolom om hen de weg te leiden, en 's nachts in een vuurkolom om hen licht te geven, zodat zij dag en nacht konden voortgaan.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "2 Kon 23:7": "Daartoe brak hij de huizen van de schandjongens af, die bij het huis van de HEERE waren, waar de vrouwen huisjes voor het beeld van het bos weefden.", "2 Kon 19:20": "Toen stuurde Jesaja, de zoon van Amoz, iemand naar Hizkia, en zei: Zo spreekt de HEERE, de God van Israël: Wat u tot Mij gebeden hebt tegen Sanherib, de koning van Assyrië, heb Ik gehoord.", "2 Kron 32:30": "Deze Jehizkia dichtte ook de bovenste waterloop van Gihon, en leidde die recht naar beneden naar het westen van de stad van David; want Jehizkia had voorspoed in al zijn werk.", "Jes 38:7": "En dit zal u een teken zijn van de HEERE, dat de HEERE het woord dat Hij gesproken heeft, doen zal:", "1 Kon 15:7": "Het overige nu van de geschiedenissen van Abiam, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda? Er was ook oorlog tussen Abiam en Jerobeam.", "2 Kon 20:1-3": "In die dagen werd Hizkia ziek, tot aan het sterven toe; en de profeet Jesaja, de zoon van Amoz, kwam bij hem en zei tegen hem: Zo zegt de HEERE: Geef bevel aan uw huis, want u zult sterven en niet leven. Toen keerde hij zijn gezicht om naar de wand, en hij bad tot de HEERE en zei: Och, HEERE, gedenk toch dat ik voor Uw aangezicht in waarheid en met een volkomen hart gewandeld heb, en gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg veel.", "Spr 11:8": "De rechtvaardige wordt uit benauwdheid bevrijd; en de goddeloze komt in zijn plaats.", "Amos 2:5": "Daarom zal Ik een vuur in Juda zenden, dat zal Jeruzalems paleizen verteren.", "Rom 5:3": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt;", "Amos 7:12": "Daarna zei Amazia tegen Amos: Gij ziener, ga weg, vlucht naar het land van Juda, en eet daar brood, en profeteer daar.", "Joh 18:11": "Jezus dan zei tegen Petrus: Steek uw zwaard in de schede. Zou Ik de drinkbeker die de Vader Mij gegeven heeft, niet drinken?", "Jes 31:1-3": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken. Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken. Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Job 14:14": "Als een man gestorven is, zal hij dan weer leven? Ik zou al de dagen van het strijd hopen, totdat mijn verandering zou komen.", "Jes 39:5-7": "Toen zei Jesaja tegen Hizkia: Hoor het woord van de HEERE van de heerscharen. Zie, de dagen komen dat alles wat in uw huis is, en wat uw vaders tot op deze dag als schat hebben opgelegd, naar Babel weggevoerd zal worden; er zal niets overblijven, zegt de HEERE. Daarbij zullen zij van uw zonen die uit u zullen voortkomen, die u zult verwekken, meenemen, om hovelingen te zijn in het paleis van de koning van Babel.", "Joh 12:3": "Maria dan, die een pond zalf van onvervalste, zeer kostbare nardus genomen had, zalfde de voeten van Jezus, en droogde met haar haren Zijn voeten af; en het huis werd vervuld met de geur van de zalf.", "Jes 38:19": "De levende, de levende, die zal U loven, zoals ik heden doe; de vader zal aan de kinderen Uw waarheid bekendmaken.", "Jes 38:3": "En hij zei: Och HEERE, denk er toch aan dat ik voor Uw gezicht in waarheid en met een volkomen hart gewandeld heb, en dat ik gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg hard.", "Ps 25:7": "Cheth. Gedenk niet de zonden van mijn jonkheid, noch mijn overtredingen; gedenk mij naar Uw goedertierenheid, om Uw goedheid wil, o HEERE!", "Hos 2:17": "En Ik zal op die dag een verbond voor hen sluiten met het wild gedierte van het veld, en met het gevogelte van de hemel, en het kruipend gedierte van de aardbodem; en Ik zal de boog, en het zwaard, en de oorlog van de aarde wegbreken, en Ik zal hen in veiligheid laten neerliggen.", "Zach 1:11": "En zij antwoordden de Engel van de HEERE Die tussen de mirten stond, en zeiden: Wij hebben het land doorwandeld, en zie, het hele land zit rustig en is stil.", "Zach 4:7": "Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem!", "Jes 39:1-8": "In die tijd stuurde Merodach-Baladan, de zoon van Baladan, de koning van Babel, brieven en een geschenk aan Hizkia; want hij had gehoord dat hij ziek was geweest en weer sterk geworden was. En Hizkia verblijdde zich over hen, en hij toonde hun zijn schathuis, het zilver en het goud, de specerijen en de beste olie, en zijn hele wapenhuis, en alles wat gevonden werd in zijn schatten; er was geen ding in zijn huis, of in zijn hele heerschappij, dat Hizkia hun niet toonde. Toen kwam de profeet Jesaja bij koning Hizkia, en zei tegen hem: Wat hebben die mannen gezegd, en waar kwamen zij vandaan bij u? En Hizkia zei: Zij zijn uit een ver land bij mij gekomen, uit Babel.", "Hand 9:40": "Maar Petrus stuurde hen allen naar buiten, knielde neer en bad; en hij keerde zich naar het lichaam en zei: Tabitha, sta op! En zij deed haar ogen open, en toen zij Petrus zag, ging zij overeind zitten.", "Hagg 1:2": "Zo spreekt de HEERE van de heerscharen: Dit volk zegt: De tijd is niet gekomen, de tijd dat het huis van de HEERE gebouwd moet worden.", "Jes 45:4": "Om Jakobs, Mijn knechts wil, en Israëls, Mijn uitverkorenen; ja, Ik riep u bij uw naam, Ik noemde u toe, hoewel u Mij niet kende.", "Jes 27:3": "Ik, de HEERE, behoed die, elk ogenblik zal Ik hem bevochtigen; opdat de vijand hem niet bezoekt, zal Ik hem bewaren, nacht en dag.", "Jes 39:2": "En Hizkia verblijdde zich over hen, en hij toonde hun zijn schathuis, het zilver en het goud, de specerijen en de beste olie, en zijn hele wapenhuis, en alles wat gevonden werd in zijn schatten; er was geen ding in zijn huis, of in zijn hele heerschappij, dat Hizkia hun niet toonde.", "Num 23:23": "Want er is geen toverij tegen Jakob, en geen waarzeggerij tegen Israël. Op dit moment zal van Jakob gezegd worden, en van Israël, wat God tot stand gebracht heeft.", "Jes 46:3": "Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die van Mij gedragen zijn vanaf de buik af, en opgenomen vanaf de baarmoeder af.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "2 Kor 6:3": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt.", "Ps 119:47": "En ik zal mij vermaken in Uw geboden, die ik liefheb.", "Dan 1:4": "Jongemannen, aan wie geen gebrek was, maar knap van gezicht, en verstandig in alle wijsheid, en ervaren in kennis, en scherp van verstand, en in wie de bekwaamheid was om te staan in het paleis van de koning; en dat men hen zou onderwijzen in de boeken en taal van de Chaldeeën.", "Ps 106:30": "Toen stond Pinehas op, en hij voerde het oordeel uit, en de plaag werd opgehouden.", "Klaagl 3:22": "Cheth. Het zijn de blijken van goedertierenheid van de HEERE, dat wij niet vernietigd zijn, dat Zijn barmhartigheden geen einde hebben;", "Ezech 34:31": "U nu, o Mijn schapen, schapen van Mijn weide! U bent mensen; maar Ik ben uw God, spreekt de Heere HEERE.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Ps 29:11": "De HEERE zal Zijn volk sterkte geven; de HEERE zal Zijn volk zegenen met vrede.", "2 Kon 5:26": "Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?", "2 Kon 12:13": "Toch werden er voor het huis van de HEERE geen zilveren schalen, gaffelen, sprenkelschalen, trompetten, of enig gouden of zilveren voorwerp gemaakt, van het geld dat naar het huis van de HEERE gebracht werd.", "Gen 10:10": "En het begin van zijn rijk was Babel, en Erech, en Accad, en Calne, in het land Sinear.", "Jer 18:15-17": "Toch heeft Mijn volk Mij vergeten, zij branden reukwerk voor de ijdelheid; want zij hebben hen doen struikelen op hun wegen, op de oude paden, om te wandelen in stegen van een weg die niet opgehoogd is; Om hun land te maken tot een verschrikking, tot eeuwige aanfluitingen; ieder die daar voorbijgaat, zal ontzet zijn, en met zijn hoofd schudden. Als een oostenwind zal Ik hen verstrooien voor het aangezicht van de vijand; Ik zal hun de nek en niet het aangezicht laten zien, op de dag van hun verderf.", "2 Kon 16:18": "Daarbij haalde hij het overdekte gedeelte van de sabbat, dat zij in het huis gebouwd hadden, en de buitenste ingang van de koning weg van het huis van de HEERE, vanwege de koning van Assyrië.", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Ps 10:18": "Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "2 Kron 32:24": "In die dagen werd Jehizkia ziek, tot aan het sterven toe, en hij bad tot de HEERE, Die tot hem sprak en hem een wonderteken gaf.", "Jer 51:51": "U zou kunnen zeggen: Wij zijn beschaamd geworden, want wij hebben smaad gehoord, schaamte heeft ons gezicht bedekt; omdat vreemden over de heiligdommen van het huis van de HEERE gekomen zijn;", "Ps 119:44": "Zo zal ik Uw wet voortdurend onderhouden, eeuwig en altijd.", "2 Kon 21:1": "Manasse was twaalf jaar oud, toen hij koning werd, en hij regeerde vijfenvijftig jaar te Jeruzalem; en de naam van zijn moeder was Hefzi-bah.", "Ezech 11:7-12": "Daarom, zo zegt de Heere HEERE: Uw gedoden, die u in het midden daarvan neergelegd hebt, die zijn het vlees, en deze stad is de pot; maar u zal Ik uit het midden daarvan doen weggaan. U hebt het zwaard gevreesd; en het zwaard zal Ik over u brengen, spreekt de Heere HEERE. Ook zal Ik u uit het midden daarvan doen weggaan, en Ik zal u overgeven in de hand van vreemden; en Ik zal recht onder u doen.", "Spr 19:23": "De vreze van de HEERE is ten leven; want men zal verzadigd zijnde overnachten; met het kwaad zal men niet bezocht worden.", "2 Kon 23:26": "Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Job 1:22": "In dit alles zondigde Job niet, en schreef God niets van het ongerijmd toe.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Est 3:9": "Als het de koning goeddunkt, laat er geschreven worden dat men hen ombrengt; dan zal ik tienduizend talenten zilver opwegen in de handen van hen die het werk doen, om het in de schatten van de koning te brengen.", "2 Kon 21:12-15": "Daarom, zo zegt de HEERE, de God van Israël: Zie, Ik ga een kwaad over Jeruzalem en Juda brengen, zodat ieder die het hoort, beide zijn oren zullen tuiten. En Ik zal over Jeruzalem het meetsnoer van Samaria trekken, alsook het paslood van het huis van Achab; en Ik zal Jeruzalem uitwissen, zoals men een schotel uitwist; men wist hem uit, en men keert hem om op zijn holle kant. En Ik zal het overblijfsel van Mijn erfdeel verlaten, en zal het in de hand van hun vijanden geven; en zij zullen tot een roof en plundering worden voor al hun vijanden.", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "Rom 5:4": "En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop;", "Ps 31:21": "U verbergt hen in het verborgene van Uw aangezicht voor de hoogmoedigheden van de man; U versteekt hen in een hut voor de twist van de tongen.", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Jes 28:14-22": "Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is! Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen. Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "1 Petr 3:13": "En wie is het die u kwaad zal doen, als u navolgers bent van het goede?", "Neh 2:13-15": "En ik trok 's nachts uit door de Dalpoort, en voorbij de Drakenfontein, en naar de Mestpoort, en ik bekeek de muren van Jeruzalem, die waren afgebroken, en haar poorten die met vuur verteerd waren. En ik ging verder naar de Fonteinpoort, en naar de vijver van de koning; maar daar was geen plaats voor het dier om onder mij door te gaan. Toen ging ik 's nachts omhoog, door de beek, en ik bekeek de muur; en ik keerde terug, en kwam in door de Dalpoort; zo keerde ik terug.", "2 Kron 29:15": "En zij verzamelden hun broeders, en heiligden zich, en kwamen, volgens het gebod van de koning, door de woorden van de HEERE, om het huis van de HEERE te reinigen.", "Ex 12:23": "Want de HEERE zal doorgaan, om de Egyptenaren te slaan; doch wanneer Hij het bloed zien zal aan de bovendorpel en aan de twee zijposten, zal de HEERE de deur voorbijgaan, en de verderver niet toelaten in uw huizen te komen om te slaan.", "2 Kon 24:12": "Toen ging Jojachin, de koning van Juda, naar de koning van Babel, hij, en zijn moeder, en zijn dienaren, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem gevangen in het achtste jaar van zijn regering.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Jes 39:8": "Maar Hizkia zei tegen Jesaja: Het woord van de HEERE dat u gesproken hebt, is goed. Ook zei hij: Er zal immers vrede en waarheid zijn in mijn dagen!", "Hebr 5:7": "Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Ex 23:20-31": "Zie, Ik zend een Engel voor uw aangezicht, om u te behoeden op deze weg, en om u te brengen naar de plaats die Ik voorbereid heb. Wees op uw hoede voor Zijn aangezicht, en wees Zijn stem gehoorzaam, en verbitter Hem niet; want Hij zal uw overtredingen niet vergeven; want Mijn Naam is in Hem. Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Jer 25:8-38": "Daarom, zo zegt de HEERE van de heerscharen: Omdat u Mijn woorden niet hebt gehoord; Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden. En Ik zal van hen doen vergaan de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid, het geluid van de molens en het licht van de lamp.", "Jer 52:17-19": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden al het koper daarvan naar Babel. Ook namen zij de potten, en de schoffels, en de gaffels, en de sprenkelschalen, en de rookschalen, en al de koperen vaten waarmee men de dienst deed. En de leider van de lijfwacht nam de schalen weg, en de wierookvaten, en de sprenkelschalen, en de potten, en de kandelaars, en de rookschalen, en de kroezen; wat geheel goud, en wat geheel zilver was.", "Matt 21:34": "Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Ex 19:4": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Ezech 22:13-22": "Zie dan, Ik heb Mijn hand geslagen om uw gierigheid die u bedreven hebt, en om uw bloed dat in uw midden geweest is. Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen. En Ik zal u verstrooien onder de heidenvolken, en u verspreiden in de landen, en uw onreinheid uit u wegnemen.", "Hand 17:28": "Want in Hem leven wij, en bewegen wij ons, en zijn wij; zoals ook enkelen van uw eigen dichters gezegd hebben: Want wij zijn ook Zijn geslacht.", "Jes 38:21": "Jesaja nu had gezegd: Laat men een klomp vijgen nemen en tot een pleister op het gezwel maken, en hij zal genezen.", "Matt 16:1-4": "En de Farizeeën en Sadduceeën kwamen bij Hem, en om Hem te verzoeken vroegen zij Hem dat Hij hun een teken uit de hemel zou tonen. Maar Hij antwoordde en zei tegen hen: Als het avond geworden is, zegt u: Mooi weer; want de hemel is rood; en 's morgens: Vandaag onweer; want de hemel is somber rood. Huichelaars! Het uiterlijk van de hemel weet u wel te onderscheiden, maar kunt u de tekenen van de tijden niet onderscheiden?", "Job 11:19": "En u zult neerliggen, en niemand zal u verschrikken; en velen zullen uw gezicht smeken.", "2 Kron 33:1-20": "Manasse was twaalf jaar oud, toen hij koning werd, en hij regeerde vijfenvijftig jaar te Jeruzalem. En hij deed wat kwaad was in de ogen van de HEERE, naar de gruwelen van de heidenen, die de HEERE voor het aangezicht van de kinderen van Israël uit de bezitting verdreven had. Want hij bouwde de hoogten weer op, die zijn vader Jehizkia afgebroken had, en richtte voor de Baäls altaren op, en maakte offerbossen, en boog zich neer voor heel het leger van de hemel, en diende ze.", "Zef 3:20": "In die tijd zal Ik u hierheen brengen, in de tijd namelijk dat Ik u verzamelen zal; zeker zal Ik u stellen tot een naam en tot een lof, onder alle volken van de aarde, als Ik uw gevangenschap voor uw ogen terugbrengen zal, zegt de HEERE.", "Jes 30:1-17": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen; Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte. Want de sterkte van Farao zal u tot schaamte zijn, en die toevlucht onder de schaduw van Egypte tot schande.", "1 Kon 8:30": "Hoor dan naar de smeking van Uw dienaar, en van Uw volk Israël, die op deze plaats zullen bidden; en hoor Ú in de plaats van Uw woning, in de hemel, ja, hoor, en vergeef.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "1 Kon 17:20": "En hij riep de HEERE aan, en zei: HEERE, mijn God, hebt Gij dan ook deze weduwe, bij wie ik herberg, zo kwalijk behandeld, dat Gij haar zoon gedood hebt?", "Jes 49:17": "Uw zonen zullen zich haasten; maar uw verstoorders en uw verwoesters zullen van u uitgaan.", "Ezra 7:10": "Want Ezra had zijn hart erop gericht om de wet van de HEERE te zoeken en te doen, en om in Israël de inzettingen en de rechten te leren.", "Mark 6:19": "En Herodias had het op hem voorzien, en wilde hem doden, maar kon het niet;", "Spr 12:21": "De rechtvaardigen zal geen leed overkomen; maar de goddelozen zullen met kwaad vervuld worden.", "2 Sam 12:16": "En David zocht God voor dat jongetje; en David vastte een vasten, en ging naar binnen, en lag heel de nacht op de aarde.", "Ps 39:14": "Wend U van mij af, dat ik verkwikt word, voordat ik heenga, en er niet meer ben.", "Deut 32:10": "Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.", "2 Sam 7:3-5": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Luk 21:18": "Toch zal er geen haar van uw hoofd verloren gaan.", "Ex 6:6": "En Ik zal u tot Mijn volk aannemen, en Ik zal u tot een God zijn; en u zult weten dat Ik de HEERE uw God ben, Die u uitleidt van onder de lasten van de Egyptenaren.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Gen 17:1": "Toen Abram negenennegentig jaar oud was, verscheen de HEERE aan Abram en zei tegen hem: Ik ben God, de Almachtige! Wandel voor Mijn aangezicht en wees oprecht!", "Jer 10:19": "O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!", "Fil 2:27": "En hij is ook ziek geweest, dicht bij de dood; maar God heeft Zich over hem ontfermd; en niet alleen over hem, maar ook over mij, opdat ik niet droefheid op droefheid zou hebben.", "Spr 2:8": "Opdat zij de paden van het recht bewaren; en Hij zal de weg van Zijn gunstgenoten bewaren.", "Zach 9:8": "En Ik zal Mij rondom Mijn huis legeren, vanwege het leger, vanwege de doorgaande, en vanwege de wederkerende, opdat de drijver niet meer door hen doorga; want nu heb Ik het met Mijn ogen aangezien.", "2 Kron 34:3": "Want in het achtste jaar van zijn regering, toen hij nog een jongeling was, begon hij de God van zijn vader David te zoeken; en in het twaalfde jaar begon hij Juda en Jeruzalem te reinigen van de hoogten en de gewijde bomen, en van de gesneden en de gegoten beelden.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Neh 5:19": "Gedenk mij, mijn God, ten goede, alles wat ik voor dit volk gedaan heb.", "1 Kron 23:4": "Uit dezen waren er vierentwintigduizend om het werk van het huis van de HEERE aan te sturen; en zesduizend opzichters en rechters;", "Fil 3:7-14": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Job 5:18-24": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen. In zes benauwdheden zal Hij u verlossen, en in de zevende zal het kwaad u niet aanraken. In de honger zal Hij u verlossen van de dood, en in de oorlog van het geweld van het zwaard.", "Luk 11:30": "Want zoals Jona voor de Ninevieten een teken geweest is, zo zal ook de Zoon des mensen dat zijn voor dit geslacht.", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Jer 46:13-26": "Het woord, dat de HEERE tot de profeet Jeremia sprak, over de aankomst van Nebukadrezar, de koning van Babel, om Egypteland te slaan. Verkondigt in Egypte, en doet het horen te Migdol; doet het ook horen te Nof en Tachpanhes; zegt: Stelt u op, en maakt u gereed, want het zwaard heeft verslonden, wat rondom u is. Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat de HEERE hen voortdreef.", "Micha 4:3": "En Hij zal onder grote volken rechtspreken, en machtige heidenvolken straffen, tot ver weg toe; en zij zullen hun zwaarden omsmeden tot ploegscharen, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen de oorlog niet meer leren.", "Ex 8:23": "En Ik zal een verlossing zetten tussen Mijn volk en uw volk; tegen morgen zal dit teken gebeuren!", "Jer 27:21": "ja, zo zegt de HEERE van de heerscharen, de God van Israël, over de voorwerpen die in het huis van de HEERE, en in het huis van de koning van Juda, en in Jeruzalem zijn overgebleven:", "Deut 33:12": "En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wonen!", "Ezech 44:4": "Daarna bracht hij mij de weg van de noorderpoort, voor het huis; en ik zag, en zie, de heerlijkheid van de HEERE had het huis van de HEERE vervuld; toen viel ik op mijn aangezicht.", "Ex 13:22": "Hij nam de wolkkolom overdag, en de vuurkolom 's nachts, niet weg van voor het aangezicht van het volk.", "2 Sam 8:10": "zond Thoi zijn zoon Joram naar de koning David om hem naar zijn welstand te vragen, en om hem te zegenen, omdat hij tegen Hadad-Ezer had gevochten en hem geslagen had (want Hadad-Ezer voerde steeds oorlog tegen Thoi); en in zijn hand waren zilveren vaten, en gouden vaten, en koperen vaten;", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Ex 15:17": "Hen zult U inbrengen, en planten op de berg van Uw erfenis, op de plaats die U, o HEERE, gemaakt hebt om te wonen, het heiligdom, dat Uw handen gesticht hebben, o Heere!", "Ps 116:19": "in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "1 Kron 22:1": "En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.", "2 Kron 32:24-26": "In die dagen werd Jehizkia ziek, tot aan het sterven toe, en hij bad tot de HEERE, Die tot hem sprak en hem een wonderteken gaf. Maar Jehizkia gaf geen vergelding naar de weldaad die hem was gebeurd, omdat zijn hart hoogmoedig werd; daarom kwam er over hem, en over Juda en Jeruzalem, een grote toorn. Toch verootmoedigde Jehizkia zich vanwege de trots van zijn hart, hij en de inwoners van Jeruzalem, zodat de grote toorn van de HEERE niet over hen kwam in de dagen van Jehizkia.", "Pred 9:4": "Want voor hem die zich bij alle levenden gevoegd heeft, is er hoop; want een levende hond is beter dan een dode leeuw.", "Ps 9:10": "En de HEERE zal een Hoog Vertrek zijn voor de verdrukte, een Hoog Vertrek in tijden van benauwdheid.", "Jes 38:8": "Zie, Ik zal de schaduw van de graden, die met de zon in de graden van de zonnewijzer van Achaz omlaag gegaan is, tien graden achterwaarts doen keren. Zo is de zon tien graden teruggekeerd, in de graden die zij omlaag gegaan was.", "Ex 12:13": "En dat bloed zal voor u een teken zijn aan de huizen waarin u zich bevindt; wanneer Ik het bloed zie, zal Ik u voorbijgaan; en er zal geen plaag onder u zijn tot verderf, wanneer Ik Egypteland zal slaan.", "Ps 46:10": "Die de oorlogen doet ophouden tot aan het einde van de aarde, de boog verbreekt, en de speer in tweeën slaat, de wagens met vuur verbrandt.", "Ps 61:4": "Want U bent mij een Toevlucht geweest, een sterke Toren voor de vijand.", "Jes 37:35": "Want Ik zal deze stad beschermen om die te verlossen, omwille van Mijzelf, en omwille van David, Mijn knecht.", "Jer 4:5-31": "Verkondig het in Juda, en laat het horen te Jeruzalem, en zeg het; ja, blaas de bazuin in het land; roep met volle stem en zeg: Verzamel u, en laten wij ingaan in de versterkte steden! Werp de banier op naar Sion, vlucht met spoed, blijf niet staan! Want Ik breng een kwaad aan van het noorden, en een grote ondergang. De leeuw is opgekomen uit zijn schuilplaats, en de verwoester van de heidenvolken is opgetrokken, hij is uitgegaan uit zijn plaats, om uw land te maken tot een woestenij; uw steden zullen verwoest worden, zodat er niemand in woont.", "Hos 13:10": "Waar is uw koning nu? Laat hij u toch redden in al uw steden! En uw rechters, van wie u zei: Geef mij een koning en vorsten?", "2 Kon 23:27": "En de HEERE zei: Ik zal Juda ook van Mijn aangezicht wegdoen, zoals Ik Israël weggedaan heb; en Ik zal deze stad Jeruzalem verwerpen, die Ik verkoren heb, en het huis waarvan Ik gezegd heb: Mijn Naam zal daar zijn.", "Jer 30:10": "Gij dan, vrees niet, o Mijn knecht Jakob! spreekt de HEERE, wees niet ontzet, Israël! Want zie, Ik zal u uit verre landen verlossen, en uw nageslacht uit het land van hun gevangenschap; en Jakob zal terugkomen, en stil en gerust zijn, en er zal niemand zijn die hem verschrikt.", "1 Kon 11:4": "Want het gebeurde in de tijd van Salomo's ouderdom, dat zijn vrouwen zijn hart deden neigen naar andere goden; zodat zijn hart niet volkomen was met de HEERE, zijn God, zoals het hart van zijn vader David.", "Neh 9:33": "Doch U bent rechtvaardig, in alles wat ons overkomen is; want U hebt trouw gehandeld, maar wij hebben goddeloos gehandeld.", "Jer 35:2": "Ga naar het huis van de Rechabieten, en spreek met hen, en breng hen in het huis van de HEERE, in een van de kamers, en geef hun wijn te drinken.", "Deut 1:30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "Ps 12:8": "U, HEERE, zult hen bewaren; U zult hen behoeden voor dit geslacht, tot in eeuwigheid.", "Jes 13:1": "De last van Babel, die Jesaja, de zoon van Amoz, gezien heeft.", "2 Kon 20:12-18": "In die tijd zond Berodach-Baladan, de zoon van Baladan, de koning van Babel, brieven en een geschenk aan Hizkia; want hij had gehoord dat Hizkia ziek was geweest. En Hizkia luisterde naar hen, en hij toonde hun zijn hele schathuis, het zilver en het goud, en de specerijen, en de beste olie, en zijn wapenhuis, en alles wat gevonden werd in zijn schatten; er was geen ding in zijn huis, of in zijn hele heerschappij, dat hij hun niet toonde. Toen kwam de profeet Jesaja naar de koning Hizkia, en zei tegen hem: Wat hebben die mannen gezegd, en waar zijn zij vandaan bij u gekomen? En Hizkia zei: Zij zijn uit een ver land gekomen, uit Babel.", "Matt 23:35-38": "opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar. Voorwaar, Ik zeg u: Al deze dingen zullen komen over dit geslacht. Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "1 Kron 22:9": "Zie, de zoon die u geboren zal worden, die zal een man van rust zijn, want Ik zal hem rust geven van al zijn vijanden rondom; want zijn naam zal Salomo zijn, en Ik zal vrede en rust over Israël geven in zijn dagen.", "Jer 1:11-16": "Verder kwam het woord van de HEERE tot mij, en zei: Wat ziet u, Jeremia? En ik zei: Ik zie een amandelroede. En de HEERE zei tegen mij: U hebt goed gezien; want Ik zal wakker zijn over Mijn woord, om dat te doen. En het woord van de HEERE kwam voor de tweede keer tot mij, en zei: Wat ziet u? En ik zei: Ik zie een ziedende pot, waarvan het voorste deel tegen het noorden gekeerd is.", "Jes 1:10": "Hoor het woord van de HEERE, leiders van Sodom! Neem de wet van onze God ter oor, volk van Gomorra!", "Ps 17:3": "U hebt mijn hart geproefd, 's nachts bezocht, U hebt mij getoetst. U vindt niets; wat ik gedacht heb, overtreedt mijn mond niet.", "Jer 43:8-13": "Toen kwam het woord van de HEERE tot Jeremia te Tachpanhes, en Hij zei: Neem grote stenen in uw hand, en verberg ze in de klei in de ticheloven, die bij de deur van Farao's huis te Tachpanhes is, voor de ogen van de Joodse mannen; en zeg tegen hen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zie, Ik zal iemand heenzenden, en Nebukadrezar, de koning van Babel, Mijn dienaar, halen, en Ik zal zijn troon zetten boven op deze stenen, die Ik verborgen heb; en hij zal zijn koninklijke tent daarover spannen.", "Hos 6:2": "Hij zal ons na twee dagen levend maken; op de derde dag zal Hij ons doen opstaan, en wij zullen voor Zijn aangezicht leven.", "Job 33:18": "Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "1 Kron 27:25": "En over de schatten van de koning was Azmaveth, de zoon van Adiël; en over de schatten op het land, in de steden, en in de dorpen, en in de torens, was Jonathan, de zoon van Uzzia.", "Jer 7:8-34": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Jes 4:1": "En op die dag zullen zeven vrouwen één man vastgrijpen en zeggen: Ons eigen brood zullen wij eten, en met onze eigen kleren zullen wij bekleed zijn; laat ons alleen naar uw naam genoemd worden, neem onze smaad weg.", "Zach 9:14-16": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden. De HEERE van de heerscharen zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten onder gebracht hebben; zij zullen ook drinken, en een gedruis maken als bij de wijn; en zij zullen vervuld worden, als het bekken, als de hoeken van het altaar. En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "Dan 5:1": "De koning Belsazar maakte een grote maaltijd voor zijn duizend leiders, en hij dronk wijn ten overstaan van die duizend.", "2 Kon 2:20-22": "En hij zei: Brengt mij een nieuwe schaal, en legt er zout in. En zij brachten ze naar hem toe. Toen ging hij naar de waterbron, en wierp het zout erin, en zei: Zo zegt de HEERE: Ik heb dit water gezond gemaakt, er zal geen dood noch onvruchtbaarheid meer van komen. Zo werd dat water gezond, tot op deze dag, naar het woord van Elisa, dat hij gesproken had.", "Jes 14:3": "En het zal gebeuren op de dag, wanneer de HEERE u rust zal geven van uw smart, en van uw onrust, en van de harde dienstbaarheid waarin men u heeft laten dienen,", "2 Kon 12:16": "Het geld van het schuldoffer en het geld van de zondoffers werd niet naar het huis van de HEERE gebracht; het was voor de priesters.", "Deut 11:25": "Niemand zal voor uw aangezicht standhouden; de HEERE, uw God, zal de schrik en de vrees voor u geven over heel het land, waarop u treden zult, zoals Hij tot u gesproken heeft.", "Hoogl 4:10": "Hoe mooi is uw uitnemende liefde, Mijn zuster, o bruid! Hoeveel beter is uw uitnemende liefde dan wijn, en de geur van uw oliën dan alle specerijen!", "Deut 30:4": "Al waren uw verdrevenen aan het einde van de hemel, van daar zal de HEERE, uw God, u bijeenbrengen, en van daar zal Hij u halen.", "1 Kon 3:1": "En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.", "Ps 125:1-3": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid. Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid. Want de scepter van de goddeloosheid zal niet rusten op het lot van de rechtvaardigen; opdat de rechtvaardigen hun handen niet uitstrekken tot onrecht.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Jer 20:5": "Ook zal Ik al het bezit van deze stad geven, en al haar opbrengst, en al haar kostbaarheden, en alle schatten van de koningen van Juda, Ik zal ze geven in de hand van hun vijanden, die zullen ze roven, ze meenemen en ze naar Babel brengen.", "Pred 11:7": "Verder, het licht is zoet, en het is de ogen goed de zon te aanschouwen;", "2 Kron 32:26": "Toch verootmoedigde Jehizkia zich vanwege de trots van zijn hart, hij en de inwoners van Jeruzalem, zodat de grote toorn van de HEERE niet over hen kwam in de dagen van Jehizkia.", "2 Kon 11:18": "Daarna ging al het volk van het land naar het huis van Baäl en brak dat af; zijn altaren en zijn beelden verbraken zij helemaal; en Mattan, de priester van Baäl, sloegen zij dood voor de altaren. De priester stelde toen ambtsdragers aan over het huis van de HEERE.", "Spr 24:16": "Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad neerstruikelen.", "Deut 28:49-57": "De HEERE zal tegen u een volk laten opkomen van ver, van het einde van de aarde, zoals een arend vliegt; een volk waarvan u de taal niet zult verstaan; Een volk, hard van gezicht, dat geen ontzag zal hebben voor de oude, noch genadig zal zijn voor de jonge. En het zal de vrucht van uw vee, en de vrucht van uw land opeten, totdat u verdelgd zult zijn; het zal u geen koren, most of olie, aanwas van uw koeien of kudden van uw kleinvee overlaten, totdat het u vernietigt.", "Jes 7:11": "Vraag u een teken van de HEERE, uw God; vraag het beneden in de diepte, of vraag het boven in de hoogte.", "1 Joh 3:22": "en wat wij ook bidden, ontvangen wij van Hem, omdat wij Zijn geboden bewaren en doen wat welgevallig is voor Hem.", "2 Sam 12:20": "Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.", "Job 27:3": "Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus;", "Fil 1:20-24": "Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood. Want het leven is voor mij Christus, en het sterven is winst. Maar of ik in het vlees zal leven, dat is voor mij een vruchtbare arbeid, en wat ik zal kiezen, weet ik niet.", "Gen 48:15": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag;", "Hand 21:14": "En toen hij zich niet liet overtuigen, hielden wij ons tevreden en zeiden: Laat de wil van de Heere gebeuren.", "2 Kron 25:7-9": "Maar er kwam een man van God tot hem, en hij zei: O koning! Laat het leger van Israël niet met u meegaan; want de HEERE is niet met Israël, met al de kinderen van Efraïm. Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen. En Amazia zei tegen de man van God: Maar wat moet men doen met de honderd talenten, die ik aan de troepen van Israël gegeven heb? En de man van God zei: De HEERE heeft meer dan dit, om u te geven.", "Nahum 1:12": "Zo zegt de HEERE: Al zijn zij voorspoedig, en al zijn er nog zoveel, toch zullen zij afgesneden worden, en hij zal doorgaan. Ik heb u wel vernederd, maar Ik zal u niet meer vernederen.", "Ps 122:1": "Een lied Hammaaloth, van David. Ik verblijd mij over hen die tegen mij zeggen: Wij zullen naar het huis van de HEERE gaan.", "Jes 55:3": "Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Hand 23:1": "En Paulus keek de raad recht aan en zei: Mannen broeders! Ik heb met een geheel goed geweten voor God geleefd tot op deze dag.", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Neh 13:14": "Denk aan mij, mijn God, in dit opzicht; en delg mijn weldaden niet uit, die ik aan het huis van mijn God en aan Zijn wachten gedaan heb.", "2 Kron 33:15": "En hij nam de vreemde goden en die gelijkenis weg uit het huis van de HEERE, alsook alle altaren die hij gebouwd had op de berg van het huis van de HEERE, en te Jeruzalem; en hij wierp ze buiten de stad.", "2 Kron 26:21": "Zo was de koning Uzzia melaats tot aan de dag van zijn dood; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis van de HEERE afgesneden; Jotham nu, zijn zoon, was over het huis van de koning, en oordeelde het volk van het land.", "Jer 29:26": "De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn in het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.", "1 Kon 10:10": "En zij gaf de koning honderdtwintig talenten goud, en zeer veel specerijen, en kostbaar gesteente; zoveel specerijen als de koningin van Scheba de koning Salomo gaf, is er nooit meer in zulke hoeveelheid gekomen.", "Ps 72:7": "In zijn dagen zal de rechtvaardige bloeien, en de veelheid van vrede, totdat de maan niet meer is.", "Gen 6:9": "Dit zijn de afstammelingen van Noach. Noach was een rechtvaardig, oprecht man onder zijn tijdgenoten. Noach wandelde met God.", "Deut 31:3": "De HEERE, uw God, Die zal voor u overtrekken; Die zal deze volken van voor u wegvagen, zodat u hen erfelijk bezit. Jozua zal voor u overtrekken, zoals de HEERE gesproken heeft.", "Ps 32:8": "Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Jes 2:2": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien.", "Matt 24:31": "En Hij zal Zijn engelen uitzenden met een bazuin van groot geluid, en zij zullen Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het ene uiterste van de hemel tot het andere uiterste daarvan.", "Lev 10:3": "En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "Ps 39:10": "Ik ben verstomd, ik zal mijn mond niet opendoen, want U hebt het gedaan.", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "1 Kon 7:40": "Daartoe maakte Hiram de wasvaten, de scheppen, en de sprenkelschalen; en Hiram maakte al het werk af dat hij voor koning Salomo maakte voor het huis van de HEERE:", "Matt 6:6": "Maar u, wanneer u bidt, ga in uw binnenkamer, en sluit uw deur, en bid tot uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.", "2 Kon 19:2": "Daarna stuurde hij Eljakim, de hofmeester, en Sebna, de schrijver, en de oudsten van de priesters, met zakken bedekt, naar Jesaja, de profeet, de zoon van Amoz;", "Ps 147:2": "De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël.", "2 Kon 11:15": "Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.", "Neh 3:13": "De Dalpoort verbeterden Hanun, en de inwoners van Zanoah; zij bouwden die, en richtten haar deuren op, met haar sloten en haar grendelen; daarbij duizend el aan de muur, tot aan de Mistpoort.", "1 Kon 10:5": "en het voedsel van zijn tafel, en het zitten van zijn knechten, en het staan van zijn dienaren, en hun kleding, en zijn schenkers, en zi
