"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En Moab kwam in opstand tegen Israël, na de dood van Achab.","2":"En Ahazia viel door een traliewerk in zijn bovenzaal, die te Samaria was, en werd ziek. En hij zond boden en zei tegen hen: Ga heen, vraag Baäl-Zebub, de god van Ekron, of ik van deze ziekte genezen zal worden.","3":"Maar de Engel van de HEERE sprak tot Elia, de Thisbiet: Maak u op, ga de boden van de koning van Samaria tegemoet, en spreek tot hen: Is het omdat er geen God in Israël is, dat u heengaat om Baäl-Zebub, de god van Ekron, te vragen?","4":"Daarom nu zegt de HEERE zo: U zult niet afkomen van dat bed waarop u geklommen bent, maar u zult zeker sterven. En Elia ging weg.","5":"Zo kwamen de boden weer bij hem; en hij zei tegen hen: Waarom komt u terug?","6":"En zij zeiden tegen hem: Een man kwam ons tegemoet en zei tegen ons: Ga heen, keer terug naar de koning die u gezonden heeft, en zeg tegen hem: Zo zegt de HEERE: Is het omdat er geen God in Israël is, dat u stuurt om Baäl-Zebub, de god van Ekron, te vragen? Daarom zult u van dat bed waarop u geklommen bent, niet afkomen, maar u zult zeker sterven.","7":"En hij sprak tot hen: Hoe zag de man eruit die u tegemoet gekomen is, en deze woorden tot u gesproken heeft?","8":"En zij zeiden tegen hem: Hij was een man met een harig *kleed*, en met een leren gordel om zijn middel gebonden. Toen zei hij: Het is Elia, de Thisbiet.","9":"En hij zond naar hem een leider over vijftig met zijn vijftigtal. En toen hij naar hem opklom (want zie, hij zat op de top van een berg), sprak hij tot hem: Man van God! De koning zegt: Kom naar beneden.","10":"Maar Elia antwoordde en sprak tot de leider over vijftig: Als ik dan een man van God ben, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde er vuur uit de hemel neer, en het verteerde hem en zijn vijftigtal.","11":"En hij zond weer naar hem een andere leider over vijftig met zijn vijftigtal. Deze antwoordde en sprak tot hem: Man van God! Zo zegt de koning: Kom snel naar beneden.","12":"En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.","13":"En weer zond hij een leider over het derde vijftigtal met zijn vijftigtal. Zo ging de derde leider over vijftig omhoog, en kwam en boog zich op zijn knieën voor Elia, en smeekte hem, en sprak tot hem: Man van God, laat toch mijn leven en het leven van deze vijftig van uw knechten kostbaar zijn in uw ogen!","14":"Zie, het vuur is uit de hemel neergedaald, en heeft die twee eerste leiders over vijftig met hun vijftigtallen verteerd; maar laat nu mijn leven kostbaar zijn in uw ogen!","15":"Toen sprak de Engel van de HEERE tot Elia: Ga met hem naar beneden; wees niet bang voor hem. En hij stond op, en ging met hem naar beneden naar de koning.","16":"En hij sprak tot hem: Zo zegt de HEERE: Omdat u boden gezonden hebt om Baäl-Zebub, de god van Ekron, te vragen (is het omdat er geen God in Israël is, om Zijn woord te vragen?); daarom zult u van dat bed waarop u geklommen bent, niet afkomen, maar u zult zeker sterven.","17":"Zo stierf hij, naar het woord van de HEERE, dat Elia gesproken had; en Joram werd koning in zijn plaats, in het tweede jaar van Joram, de zoon van Josafat, de koning van Juda; want hij had geen zoon.","18":"Het overige nu van de daden van Ahazia, die hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?"},"SV":{"1":"En Moab viel van Israël af, na Achabs dood.","2":"En Ahazia viel door een tralie in zijn opperzaal, die te Samaria was, en werd krank. En hij zond boden, en zeide tot hen: Gaat heen, vraagt Baäl-zebub, den god van Ekron, of ik van deze krankheid genezen zal.","3":"Maar de Engel des HEEREN sprak tot Elia, den Thisbiet: Maak u op, ga op, den boden des konings van Samaria tegemoet, en spreek tot hen: Is het, omdat er geen God in Israël is, dat gijlieden heengaat, om Baäl-zebub, den god van Ekron, te vragen?","4":"Daarom nu zegt de HEERE alzo: Gij zult niet afkomen van dat bed, waarop gij geklommen zijt, maar gij zult den dood sterven. En Elia ging weg.","5":"Zo kwamen de boden weder tot hem; en hij zeide tot hen: Wat is dit, *dat* gij wederkomt?","6":"En zij zeiden tot hem: Een man kwam op, ons tegemoet, en zeide tot ons: Gaat heen, keert weder tot den koning die u gezonden heeft, en spreekt tot hem: Zo zegt de HEERE: Is het, omdat er geen God in Israël is, dat gij zendt, om Baäl-zebub, den god van Ekron, te vragen? Daarom zult gij van dat bed, waarop gij geklommen zijt, niet afkomen, maar gij zult den dood sterven.","7":"En hij sprak tot hen: Hoedanig was de gestalte des mans, die u tegemoet opgekomen is, en deze woorden tot u gesproken heeft?","8":"En zij zeiden tot hem: Hij was een man met een harig *kleed*, en met een lederen gordel gegord om zijn lenden. Toen zeide hij: Het is Elia, de Thisbiet.","9":"En hij zond tot hem een hoofdman van vijftig met zijn vijftigen. En als hij tot hem opkwam (want ziet, hij zat op de hoogte eens bergs), zo sprak hij tot hem: Gij, man Gods! de koning zegt: Kom af.","10":"Maar Elia antwoordde en sprak tot den hoofdman van vijftigen: Indien ik dan een man Gods ben, zo dale vuur van den hemel, en vertere u en uw vijftigen. Toen daalde vuur van den hemel, en verteerde hem en zijn vijftigen.","11":"En hij zond wederom tot hem een anderen hoofdman van vijftig met zijn vijftigen. Deze antwoordde en sprak tot hem: Gij, man Gods! zo zegt de koning: Kom haastelijk af.","12":"En Elia antwoordde en sprak tot hem: Ben ik een man Gods, zo dale vuur van den hemel, en vertere u en uw vijftigen. Toen daalde vuur Gods van den hemel en verteerde hem en zijn vijftigen.","13":"En wederom zond hij een hoofdman van de derde vijftigen met zijn vijftigen. Zo ging de derde hoofdman van vijftigen op, en kwam en boog zich op zijn knieën, voor Elia, en smeekte hem, en sprak tot hem: Gij, man Gods, laat toch mijn ziel en de ziel van uw knechten, van deze vijftigen, dierbaar zijn in uw ogen!","14":"Zie, het vuur is van den hemel gedaald, en heeft die twee eerste hoofdmannen van vijftigen met hun vijftigen verteerd; maar nu, laat mijn ziel dierbaar zijn in uw ogen!","15":"Toen sprak de Engel des HEEREN tot Elia: Ga af met hem; vrees niet voor zijn aangezicht. En hij stond op, en ging met hem af tot den koning.","16":"En hij sprak tot hem: Zo zegt de HEERE: Daarom, dat gij boden gezonden hebt, om Baäl-zebub, den god van Ekron, te vragen (is het, omdat er geen God in Israël is, om Zijn woord te vragen?); daarom, van dat bed, waarop gij geklommen zijt, zult gij niet afkomen, maar gij zult den dood sterven.","17":"Alzo stierf hij, naar het woord des HEEREN, dat Elia gesproken had; en Joram werd koning in zijn plaats, in het tweede jaar van Joram, den zoon van Josafat, den koning van Juda; want hij had geen zoon.","18":"Het overige nu der zaken van Ahazia, die hij gedaan heeft, is dat niet geschreven in het boek der kronieken der koningen van Israël?"},"KJV":{"1":"Then Moab rebelled against Israel after the death of Ahab.","2":"And Ahaziah fell down through a lattice in his upper chamber that was in Samaria, and was sick: and he sent messengers, and said unto them, Go, enquire of Baalzebub the god of Ekron whether I shall recover of this disease.","3":"But the angel of the LORD said to Elijah the Tishbite, Arise, go up to meet the messengers of the king of Samaria, and say unto them, Is it not because there is not a God in Israel, that ye go to enquire of Baalzebub the god of Ekron?","4":"Now therefore thus saith the LORD, Thou shalt not come down from that bed on which thou art gone up, but shalt surely die. And Elijah departed.","5":"And when the messengers turned back unto him, he said unto them, Why are ye now turned back?","6":"And they said unto him, There came ➔ a man up to meet us, and said unto us, Go, turn again unto the king that sent you, and say unto him, Thus saith the LORD, Is it not because there is not a God in Israel, that thou sendest to enquire of Baalzebub the god of Ekron? therefore thou shalt not come down from that bed on which thou art gone up, but shalt surely die.","7":"And he said unto them, What manner of man was he which came up to meet you, and told you these words?","8":"And they answered him, He was an hairy man, and girt with a girdle of leather about his loins. And he said, It is Elijah the Tishbite.","9":"Then the king sent unto him a captain of fifty with his fifty. And he went up to him: and, behold, he sat on the top of an hill. And he spake unto him, Thou man of God, the king hath said, Come down.","10":"And Elijah answered and said to the captain of fifty, If I be a man of God, then let fire come down from heaven, and consume thee and thy fifty. And there came down fire from heaven, and consumed him and his fifty.","11":"Again also he sent unto him another captain of fifty with his fifty. And he answered and said unto him, O man of God, thus hath the king said, Come down quickly.","12":"And Elijah answered and said unto them, If I be a man of God, let fire come down from heaven, and consume thee and thy fifty. And the fire of God came down from heaven, and consumed him and his fifty.","13":"And he sent again a captain of the third fifty with his fifty. And the third captain of fifty went up, and came and fell on his knees before Elijah, and besought him, and said unto him, O man of God, I pray thee, let my life, and the life of these fifty thy servants, be precious in thy sight.","14":"Behold, there came ➔ fire down from heaven, and burnt up the two captains of the former fifties with their fifties: therefore let my life now be precious in thy sight.","15":"And the angel of the LORD said unto Elijah, Go down with him: be not afraid of him. And he arose, and went down with him unto the king.","16":"And he said unto him, Thus saith the LORD, Forasmuch as thou hast sent messengers to enquire of Baalzebub the god of Ekron, is it not because there is no God in Israel to enquire of his word? therefore thou shalt not come down off that bed on which thou art gone up, but shalt surely die.","17":"So he died according to the word of the LORD which Elijah had spoken. And Jehoram reigned in his stead in the second year of Jehoram the son of Jehoshaphat king of Judah; because he had no son.","18":"Now the rest of the acts of Ahaziah which he did, are they not written in the book of the chronicles of the kings of Israel?"}},"tsk":{"1":[{"kopje":"Moab","refs":["Num 24:7","2 Sam 8:2","1 Kron 18:2","Ps 60:10"]},{"kopje":"na de","refs":["2 Kon 3:4","2 Kon 3:5","2 Kon 8:20","2 Kon 8:22"]}],"2":[{"kop code=\"H274\">Ahaziah</span> fell <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> through a <span class=\"wl wl-kjv\" data-code=\"H7639\">lattice</span> in his upper <span class=\"wl wl-kjv\" data-code=\"H5944\">chamber</span> that was in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> and was <span class=\"wl wl-kjv\" data-code=\"H2470\">sick:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of <span class=\"wl wl-kjv\" data-code=\"H1176\">Baalzebub</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">god</span> of <span class=\"wl wl-kjv\" data-code=\"H6138\">Ekron</span> whether I shall <span class=\"wl wl-kjv\" data-code=\"H2421\">recover</span> of this <span class=\"wl wl-kjv\" data-code=\"H2483\">disease.</span>","3":"But the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> the <span class=\"wl wl-kjv\" data-code=\"H8664\">Tishbite,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> unto them, Is it not because there is not a <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that ye <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of <span class=\"wl wl-kjv\" data-code=\"H1176\">Baalzebub</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">god</span> of <span class=\"wl wl-kjv\" data-code=\"H6138\">Ekron?</span>","4":"Now therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Thou shalt not come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from that <span class=\"wl wl-kjv\" data-code=\"H4296\">bed</span> on which thou art gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> but shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span> And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">departed.</span>","5":"And when the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> turned <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> unto him, he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Why are ye <span class=\"wl wl-kjv\" data-code=\"H2088\">now</span> turned <span class=\"wl wl-kjv\" data-code=\"H7725\">back?</span>","6":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, There <span class=\"wl wl-kjv\" data-code=\"H5927\">came</span> ➔ a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> us, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto us, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> turn <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> that <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> you, and <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Is it not because there is not a <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H7971\">sendest</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of <span class=\"wl wl-kjv\" data-code=\"H1176\">Baalzebub</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">god</span> of <span class=\"wl wl-kjv\" data-code=\"H6138\">Ekron?</span> therefore thou shalt not come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from that <span class=\"wl wl-kjv\" data-code=\"H4296\">bed</span> on which thou art gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> but shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span>","7":"And he <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto them, What <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> of <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> was he which came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> you, and <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> you these <span class=\"wl wl-kjv\" data-code=\"H1697\">words?</span>","8":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> him, He was an <span class=\"wl wl-kjv\" data-code=\"H8181\">hairy</span> <span class=\"wl wl-kjv\" data-code=\"H1167\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H247\">girt</span> with a <span class=\"wl wl-kjv\" data-code=\"H232\">girdle</span> of <span class=\"wl wl-kjv\" data-code=\"H5785\">leather</span> about his <span class=\"wl wl-kjv\" data-code=\"H4975\">loins.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> the <span class=\"wl wl-kjv\" data-code=\"H8664\">Tishbite.</span>","9":"Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto him a <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> with his <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty.</span> And he went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to him: and, behold, he <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> on the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of an <span class=\"wl wl-kjv\" data-code=\"H2022\">hill.</span> And he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto him, Thou <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">said,</span> Come <span class=\"wl wl-kjv\" data-code=\"H3381\">down.</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty,</span> If I be a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> then let <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">consume</span> thee and thy <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty.</span> And there came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">consumed</span> him and his <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty.</span>","11":"<span class=\"wl wl-kjv\" data-code=\"H7725\">Again</span> also he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto him <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> with his <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty.</span> And he <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto him, O <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> thus hath the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H4120\">quickly.</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto them, If I be a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> let <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">consume</span> thee and thy <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty.</span> And the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">consumed</span> him and his <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty.</span>","13":"And he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> a <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> with his <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty.</span> And the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H3766\">fell</span> on his <span class=\"wl wl-kjv\" data-code=\"H1290\">knees</span> <span class=\"wl wl-kjv\" data-code=\"H5048\">before</span> <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2603\">besought</span> him, and <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto him, O <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> I pray thee, let my <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> of these <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> be <span class=\"wl wl-kjv\" data-code=\"H3365\">precious</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight.</span>","14":"Behold, there <span class=\"wl wl-kjv\" data-code=\"H3381\">came</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and burnt <span class=\"wl wl-kjv\" data-code=\"H398\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H7223\">former</span> <span class=\"wl wl-kjv\" data-code=\"H2572\">fifties</span> with their <span class=\"wl wl-kjv\" data-code=\"H2572\">fifties:</span> therefore let my <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> now be <span class=\"wl wl-kjv\" data-code=\"H3365\">precious</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight.</span>","15":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah,</span> Go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with him: be not <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> of <span class=\"wl wl-kjv\" data-code=\"H6440\">him.</span> And he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with him unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","16":"And he <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Forasmuch as thou hast <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of <span class=\"wl wl-kjv\" data-code=\"H1176\">Baalzebub</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">god</span> of <span class=\"wl wl-kjv\" data-code=\"H6138\">Ekron,</span> is it not because there is no <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of his <span class=\"wl wl-kjv\" data-code=\"H1697\">word?</span> therefore thou shalt not come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> off that <span class=\"wl wl-kjv\" data-code=\"H4296\">bed</span> on which thou art gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> but shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span>","17":"So he <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> which <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken.</span> And <span class=\"wl wl-kjv\" data-code=\"H3088\">Jehoram</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead in the <span class=\"wl wl-kjv\" data-code=\"H8147\">second</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3088\">Jehoram</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> because he had no <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span>","18":"Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> which he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Moab","tekst":"Dien David onder het geweld der Israëlieten door macht van wapenen gebracht had, 2Sa 8:2. Zie van dezen afval breder onder, 2Ki 3:4-5."},{"catchword":"viel van Israël af,","tekst":"Anders, overtrad tegen Israël. Zie van het Hebreeuwse woord 1Ki 12:19."}],"2":[{"catchword":"viel","tekst":"Te weten, wandelende op het dak van zijn huis, waarin een tralievenster was om de opperkamer licht te geven."},{"catchword":"Baäl-zebub,","tekst":"De naam van een afgod, betekenende een heer, of meester der vliegen. Alzo is hij genoemd geweest [gelijk men meent] omdat hij aangeroepen werd tot verdrijving van zekere schadelijke vliegen, waarmede de inwoners van Palestina geplaagd waren; of omdat in zijn tempel altijd veel vliegen waren, zittende op de offeranden der beesten, die hem ter ere in grote menigte geslacht werden; of ook, omdat deze afgod de gedaante ener vlieg [gelijk enigen schrijven] gehad heeft. Dezen naam hebben de Joden den overste der duivelen gegeven, Mat 12:24; Mar 3:22, zo uit haat en verfoeiing van den afgod, als tot verkleining en versmading van de macht des duivels."},{"catchword":"Ekron,","tekst":"Zie van deze stad, Jos 15:45, en Jos 19:43; Jdg 1:18."},{"catchword":"genezen zal","tekst":"Hebreeuws, leven zal; alzo Num 21:8-9."}],"3":[{"catchword":"geen God","tekst":"Te weten, die zo wijs zou mogen zijn dat Hij toekomende dingen zou weten; zo goed dat Hij die den zijnen zou willen openbaren; zo machtig dat Hij hen in hun nood zou kunnen helpen. Versta dit naar het dwaas gevoelen en ongelovig hart des konings Ahazia. Alzo in het volgende. Of, is het niet daarom, dat gij dit gedaan hebt, omdat gij dwaselijk meent dat er geen God, enz."},{"catchword":"te vragen?","tekst":"Te weten, of hij van zijn krankheid opstaan zou; gelijk in vs.2."}],"4":[{"catchword":"den dood sterven","tekst":"Hebreeuws, stervende sterven. Alzo onder, vs.6, 16."}],"5":[{"catchword":"hem;","tekst":"Namelijk, den koning Ahazia."},{"catchword":"Wat is dit,","tekst":"Hij vraagt dit, omdat hij uit de haastigheid van hun wederkomst kon oordelen dat zij te Ekron bij den afgod niet geweest waren."}],"6":[{"catchword":"Is het,","tekst":"Zie boven, vs.3."}],"7":[{"catchword":"de gestalte","tekst":"Hebreeuws, het oordeel. Welk woord hier van velen genomen wordt voor de hoedanigheid en gestaltenis der klederen; van anderen, voor den vorm of gedaante des lichaams. Uit het antwoord der boden in vs.8 schijnt het dat de vraag te verstaan is van de gestalte en het fatsoen der kleding. Hetzelfde woord is Exo 26:30 gebruikt van de gestalte, vorm en fatsoen des tabernakels; waarvoor het woord voorbeeld gesteld wordt, Exo 25:40. Hetwelk Act 7:44 en Heb 8:5, met het Griekse woord typus uitgedrukt wordt."}],"8":[{"catchword":"man met een harig kleed,","tekst":"Hebreeuws, een man heer des haars; dat is, een man, die veel van haar aanhad. Zie van zulk een manier van spreken Gen 14:13, en versta dit van des profeten opperste kleed van haar gemaakt. Hetwelk men houdt geweest te zijn de mantel, waarvan gesproken is 1Ki 19:19. Zie de aantekening, en vergelijk Zec 13:4; Mat 3:4. Anderen duiden dit op de langheid van het haar en den baard van den profeet."}],"9":[{"catchword":"zijn vijftigen","tekst":"Die onder des hoofdmans gebied stonden. Deze alleen waren niet gezonden om den profeet met eerbieding te geleiden, maar met vijandschap te dwingen en gevangen te nemen, indien hij zou weigeren met hem te trekken."},{"catchword":"man Gods","tekst":"Zie Jdg 13:6. Zo heeft hij Elia genaamd, niet uit eerbieding, maar uit trotse wijze, bereid zijnde om tegen hem geweld te gebruiken."}],"10":[{"catchword":"Indien ik","tekst":"Het is zoveel alsof hij zeide: Met een trotse tong noemt gij mij een man Gods; maar ik bid God dat Hij dadelijk bewijze met het teken, hetwelk ik nu begeer, dat ik zodanig in der waarheid ben."},{"catchword":"vuur","tekst":"Te weten, dat God extraordinairlijk door zijn wonderbare kracht uit de lucht gezonden heeft. Vergelijk Num 11:1, en zie de aantekening."}],"11":[{"catchword":"hij","tekst":"Namelijk, de koning. Hebreeuws, hij keerde weder en zond; dat is, hij zond wederom. Alzo vs.13. Zie Num 11:4."},{"catchword":"antwoordde","tekst":"Dat is, hij ving aan uit te spreken dat hij vanwege den koning den profeet Elia had aan te zeggen. Zie 1Ki 13:6."}],"13":[{"catchword":"wederom","tekst":"Hebreeuws, hij keerde weder en zond. Zie boven, vs.11."},{"catchword":"boog zich","tekst":"Hebreeuws, kromde zich op zijn knieën."},{"catchword":"ziel en de ziel","tekst":"Dat is, leven, en alzo in het volgende. Zie Gen 19:17."},{"catchword":"van uw knechten,","tekst":"Dat is, die u toegedaan zijn, om u te erkennen en eer te bewijzen als onzen heer."},{"catchword":"dierbaar zijn","tekst":"Dat is, verschoon ons leven, dat het ons niet ontnomen worde, gelijk den twee voorgaanden vijftigen."}],"15":[{"catchword":"sprak","tekst":"Te weten, door inwendige aanspraak en ingeving, of door verschijning, die wel den profeet zichtbaar was maar niet den hoofdman. Alzo werd de engel des Heeren wel gezien van de ezelin van Bileam, maar in het begin niet van Bileam zelf; Num 22:25, Num 22:31."}],"16":[{"catchword":"is het,","tekst":"Zie boven, vs.3."},{"catchword":"den dood","tekst":"Hebreeuws, stervende sterven."}],"17":[{"catchword":"Joram","tekst":"Te weten, zijn broeder, de zoon van Achab; onder, 2Ki 3:1."},{"catchword":"tweede jaar van Joram,","tekst":"Te weten, nadat hij als stadhouder zijns vaders begonnen had te regeren; hetwelk was in het zeventiende jaar van het koninkrijk zijns vaders. Zie 1Ki 22:42."}],"18":[{"catchword":"het boek","tekst":"Zie 1Ki 14:19."}]},"kanttekeningen_en":{"1":[{"catchword":"And Moab","tekst":"Whom David by force of arms had brought under the power of the Israelites, 2 Sam.8.2."},{"catchword":"revolted from Israel","tekst":"see further of this revolting, below ch.3.v.4, 5. Oth. transgressed against Israel. See of the Hebrew word, 1 Kings 12.on v.19."},{"catchword":"after Achabs death","tekst":"see 2 Kings 3.5."}],"2":[{"catchword":"And Ahazia fell (down) thorough a lattes in his upper chamber, that was at Samaria","tekst":"To wit, walking upon the roof of his house, wherein was a lattes window, to give light to the upper chamber"},{"catchword":"and fell sick; and he sent messengers, and said unto them; go, enquire of Baal-Zebub","tekst":"the name of an idol, signifying a Lord, or, Master of flies. Thus he was called, (as is conceived) because he was called upon to drive away certain hurtful flies, wherewith the inhabitants of Palestine were plagued; or because there were always flies in his Temple, sitting upon the sacrifices, which were slain in great abundance to his honour: Or also, because this idol (as some write) had the form and shape of a fly. This name the Jews gave to the Prince of Devils, Mat 12:24. Mark 3.22. as well out of hatred, and detestation of the idol, as to extenuate and despise the power of the Devil"},{"catchword":"the God of Ekron","tekst":"see of this city, Jos.15.45. and 19.43. and Judg.1.18."},{"catchword":"whether I shall recover","tekst":"Heb. shall live. So Num 21:8, 9. of this sickness."}],"3":[{"catchword":"that ye go to enquire of Baal-Zebub the God of Ekron","tekst":"viz. whether he should recover and get up of his sickness as in the following verse is held forth."}],"4":[{"catchword":"Now therefore thus saith the LORD: Thou shalt not come down from that bed, on which thou art gone up; but thou shalt die the death","tekst":"Heb. dying die. So below v.6. and 16."}],"5":[{"catchword":"So the messengers came back to him","tekst":"Namely, to King Ahazia"},{"catchword":"and he said unto them; what is this (that) ye come back?","tekst":"he asketh this, because he was able to discern by their speedy and quick return that they had not been at Ekron to enquire of the idol."}],"6":[{"catchword":"And they said unto him; (there) came a man up to meet us, and said unto us; go, turn again unto the King that sent you, and speak unto him; Thus saith the LORD is it because there is no God in Israel, that thou sendest to enquire of Baal-Zebub the God of Ekron?","tekst":"see above on v.3. therefore thou shalt not come down from that bed, on which thou art gone up, but thou shalt die the death."}],"7":[{"catchword":"And he spake unto them; what was the shape of the man","tekst":"Heb. the judgement, etc. which word is here taken by many for the quality and shape or fashion of garments: By others for the form or shape of the body. By the answers of the messengers in the next verse, it seemeth that the question or interrogation is to be understood of the shape and fashion of the garment. The same word is used, Exo 26:30. of the shape, form and fashion of the Tabernacle; for which the word type, or pattern is put, Exo 25:40. which Act 7:44. and Heb 8:5. is expressed by the Greek word T U P O S that came up to meet you, and spake these words unto you?"}],"8":[{"catchword":"And they said unto him: he was a man with an hairy (garment)","tekst":"Heb. a man Lord of the hair, that is a man that had much hair on. See of such kind of phrase Gen.14.on v.13. and understand this of the Prophets upper garments made of hair, which is conceived to have been the mantle spoken of 1 King.19.19. See the annotat. And compare Zach.13.4. Mat 3:4. Others apply it to be the length of the hair and beardof the prophet and girt with a leathern girdle about his loines: then he said; it is Elia the Tisbite."}],"9":[{"catchword":"And he sent to him a Captain of fifty with his fifty:","tekst":"Which were under the Captains command, all these were sent, not conduct the Prophet in a reverend and honourable manner but to compel him in a spiteful manner, and to take him prisoner, if he refuse to go along with him"},{"catchwor     `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
