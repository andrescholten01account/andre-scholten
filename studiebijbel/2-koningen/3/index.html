ten van de koning van Israël afviel.","6":"Zo trok koning Joram op dezelfde tijd uit Samaria weg, en telde heel Israël.","7":"En hij ging op weg, en zond *een bode* naar Josafat, de koning van Juda, en zei: De koning van de Moabieten is van mij afgevallen; wilt u met mij optrekken in de oorlog tegen de Moabieten? En hij zei: Ik zal opkomen; ik zal zijn zoals u bent, mijn volk als uw volk, mijn paarden als uw paarden.","8":"En hij zei: Langs welke weg zullen wij optrekken? Hij dan zei: Langs de weg door de woestijn van Edom.","9":"Zo trok de koning van Israël op, en de koning van Juda, en de koning van Edom; en toen zij zeven dagreizen omgetrokken waren, had het leger en het vee dat hen volgde, geen water.","10":"Toen zei de koning van Israël: Ach, dat de HEERE deze drie koningen bij elkaar geroepen heeft, om hen in de hand van de Moabieten te geven!","11":"En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.","12":"En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.","13":"Maar Elisa zei tegen de koning van Israël: Wat heb ik met u te doen? Ga naar de profeten van uw vader, en naar de profeten van uw moeder. Doch de koning van Israël zei tegen hem: Nee, want de HEERE heeft deze drie koningen bij elkaar geroepen, om hen in de hand van de Moabieten te geven.","14":"En Elisa zei: *Zo waarachtig als* de HEERE van de heerscharen[1] leeft, voor Wiens aangezicht ik sta: als ik niet het aangezicht van Josafat, de koning van Juda, in aanmerking nam, zou ik u niet aanschouwen, noch u aanzien!","15":"Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.","16":"En hij zei: Zo zegt de HEERE: Maakt in dit dal veel grachten.","17":"Want zo zegt de HEERE: U zult geen wind zien, en u zult geen regen zien; toch zal dit dal met water vervuld worden, zodat u zult drinken, u en uw vee, en uw beesten.","18":"Daartoe is dat *maar* een klein iets in de ogen van de HEERE, Hij zal ook de Moabieten in uw hand geven.","19":"En u zult alle vaste steden, en alle uitgelezen steden verslaan, en u zult alle goede bomen vellen, en u zult alle waterfonteinen dichtstoppen; en alle goede stukken land zult u met stenen verwoesten.","20":"En het gebeurde 's morgens, toen men het spijsoffer offert, dat er, zie, water langs de weg van Edom kwam, en het land met water vervuld werd.","21":"Toen nu alle Moabieten hoorden dat de koningen opgetrokken waren om tegen hen te strijden, werden zij samen opgeroepen, allen die de gordel aangordden en daarboven, en zij stonden aan de grens.","22":"En toen zij zich 's morgens vroeg opmaakten, en de zon over dat water opkwam, zagen de Moabieten dat water aan de overkant rood, zoals bloed.","23":"En zij zeiden: Dit is bloed; de koningen zijn zeker onderling verdelgd, en hebben de een de ander verslagen; nu dan, aan de buit, Moabieten!","24":"Maar toen zij bij het leger van Israël kwamen, maakten de Israëlieten zich op, en sloegen de Moabieten; en zij vluchtten van voor hen; ja, zij drongen door in *het land*, en sloegen ook de Moabieten daar.","25":"De steden nu braken zij af, en ieder wierp zijn steen op alle goede stukken land, en zij vulden ze, en stopten alle waterfonteinen dicht, en velden alle goede bomen, totdat zij in Kir-hareseth *alleen* de stenen daarvan lieten overblijven; en de slingeraars omsingelden en sloegen de stad.","26":"Doch toen de koning van de Moabieten zag dat de strijd hem te sterk werd, nam hij zevenhonderd man met zich mee, die het zwaard trokken, om door te breken naar de koning van Edom toe; maar zij konden het niet.","27":"Toen nam hij zijn eerstgeboren zoon, die in zijn plaats koning zou worden, en offerde hem als brandoffer op de muur. Daaruit kwam een zeer grote toorn over Israël; daarom trokken zij van hem weg, en keerden terug naar *hun* land."},"SV":{"1":"Joram nu, de zoon van Achab, werd koning over Israël te Samaria, in het achttiende jaar van Josafat, den koning van Juda, en hij regeerde twaalf jaren.","2":"En hij deed dat kwaad was in de ogen des HEEREN, doch niet gelijk zijn vader en gelijk zijn moeder; want hij deed dat opgerichte beeld van Baäl weg, hetwelk zijn vader gemaakt had.","3":"Evenwel hing hij de zonden van Jerobeam, den zoon van Nebat, aan, die Israël deed zondigen; hij week daarvan niet af.","4":"Mesa nu, de koning der Moabieten, was een veehandelaar, en bracht op aan den koning van Israël honderd duizend lammeren, en honderd duizend rammen met de wol.","5":"Maar het geschiedde, als Achab gestorven was, dat de koning der Moabieten van den koning van Israël afviel.","6":"Zo toog de koning Joram ter zelfder tijd uit Samaria, en monsterde gans Israël.","7":"En hij ging heen, en zond tot Josafat, den koning van Juda, zeggende: De koning der Moabieten is van mij afgevallen, zult gij met mij trekken in den oorlog tegen de Moabieten? En hij zeide: Ik zal opkomen; zo zal ik zijn, gelijk gij zijt, zo mijn volk als uw volk, zo mijn paarden als uw paarden.","8":"En hij zeide: Door welken weg zullen wij optrekken? Hij dan zeide: Door den weg der woestijn van Edom.","9":"Alzo toog de koning van Israël heen, en de koning van Juda, en de koning van Edom; en als zij zeven dagreizen omgetogen waren, zo had het leger en het vee, dat hen navolgde, geen water.","10":"Toen zeide de koning van Israël: Ach, dat de HEERE deze drie koningen geroepen heeft, om die in der Moabieten hand te geven!","11":"En Josafat zeide: Is hier geen profeet des HEEREN, dat wij door hem den HEERE mochten vragen? Toen antwoordde een van de knechten des konings van Israël, en zeide: Hier is Elisa, de zoon van Safat, die water op Elia’s handen goot.","12":"En Josafat zeide: Des HEEREN woord is bij hem. Zo togen tot hem af de koning van Israël, en Josafat, en de koning van Edom.","13":"Maar Elisa zeide tot den koning van Israël: Wat heb ik met u te doen? Ga heen tot de profeten uws vaders, en tot de profeten uwer moeder. Doch de koning van Israël zeide tot hem: Neen, want de HEERE heeft deze drie koningen geroepen, om die in der Moabieten hand te geven.","14":"En Elisa zeide: *Zo* *waarachtig* *als* de HEERE der heirscharen leeft, voor Wiens aangezicht ik sta, zo ik niet het aangezicht van Josafat, den koning van Juda, opnam, ik zou u niet aanschouwen, noch u aanzien!","15":"Nu dan, brengt mij een speelman. En het geschiedde, als de speelman op de snaren speelde, dat de hand des HEEREN op hem kwam.","16":"En hij zeide: Zo zegt de HEERE: Maakt in dit dal vele grachten.","17":"Want zo zegt de HEERE: Gijlieden zult geen wind zien, en gij zult geen regen zien; nochtans zal dit dal met water vervuld worden, zodat gij zult drinken, gij en uw vee, en uw beesten.","18":"Daartoe is dat slecht in de ogen des HEEREN, Hij zal ook de Moabieten in ulieder hand geven.","19":"En gij zult alle vaste steden, en alle uitgelezene steden slaan, en zult alle goede bomen vellen, en zult alle waterfonteinen stoppen; en alle goede stukken lands zult gij met stenen verderven.","20":"En het geschiedde des morgens, als men het spijsoffer offert, dat er, ziet, water door den weg van Edom kwam, en het land met water vervuld werd.","21":"Toen nu al de Moabieten hoorden, dat koningen opgetogen waren, om tegen hen te strijden, zo werden zij samen geroepen, van al degenen af, die den gordel aangordden en daarboven, en zij stonden aan de landpale.","22":"En toen zij zich des morgens vroeg opmaakten, en de zon over dat water oprees, zagen de Moabieten dat water tegenover rood, gelijk bloed.","23":"En zij zeiden: Dit is bloed; de koningen hebben voorzeker zich met het zwaard verdorven, en hebben de een den ander verslagen; nu dan aan den buit, gij Moabieten!","24":"Maar als zij aan het leger van Israël kwamen, maakten zich de Israëlieten op, en sloegen de Moabieten; en zij vloden van hun aangezicht; ja, zij kwamen in *het* *land*, slaande ook de Moabieten.","25":"De steden nu braken zij af, en een iegelijk wierp zijn steen op alle goede stukken lands, en zij vulden ze, en stopten alle waterfonteinen, en velden alle goede bomen, totdat zij in Kir-hareseth *alleen* de stenen daarvan lieten overblijven; en de slingeraars omsingelden en sloegen hen.","26":"Doch als de koning der Moabieten zag, dat hem de strijd te sterk was, nam hij tot zich zevenhonderd mannen, die het zwaard uittogen, om door te breken tegen den koning van Edom; maar zij konden niet.","27":"Toen nam hij zijn eerstgeboren zoon, die in zijn plaats koning zou worden, en offerde hem ten brandoffer op den muur. Daaruit werd een zeer grote toorn in Israël; daarom trokken zij van hem af, en keerden weder in *hun* land."},"KJV":{"1":"Now Jehoram the son of Ahab began to reign over Israel in Samaria the eighteenth year of Jehoshaphat king of Judah, and reigned twelve years.","2":"And he wrought evil in the sight of the LORD; but not like his father, and like his mother: for he put away the image of Baal that his father had made.","3":"Nevertheless he cleaved unto the sins of Jeroboam the son of Nebat, which made Israel to sin; he departed not therefrom.","4":"And Mesha king of Moab was a sheepmaster, and rendered unto the king of Israel an hundred thousand lambs, and an hundred thousand rams, with the wool.","5":"But it came to pass, when Ahab was dead, that the king of Moab rebelled against the king of Israel.","6":"And king Jehoram went out of Samaria the same time, and numbered all Israel.","7":"And he went and sent to Jehoshaphat the king of Judah, saying, The king of Moab hath rebelled against me: wilt thou go with me against Moab to battle? And he said, I will go up: I am as thou art, my people as thy people, and my horses as thy horses.","8":"And he said, Which way shall we go up? And he answered, The way through the wilderness of Edom.","9":"So the king of Israel went, and the king of Judah, and the king of Edom: and they fetched a compass of seven days' journey: and there was no water for the host, and for the cattle that followed them.","10":"And the king of Israel said, Alas! that the LORD hath called ➔ these three kings together, to deliver them into the hand of Moab!","11":"But Jehoshaphat said, Is there not here a prophet of the LORD, that we may enquire of the LORD by him? And one of the king of Israel's servants answered and said, Here is Elisha the son of Shaphat, which poured water on the hands of Elijah.","12":"And Jehoshaphat said, The word of the LORD is with him. So the king of Israel and Jehoshaphat and the king of Edom went down to him.","13":"And Elisha said unto the king of Israel, What have I to do with thee? get thee to the prophets of thy father, and to the prophets of thy mother. And the king of Israel said unto him, Nay: for the LORD hath called ➔ these three kings together, to deliver them into the hand of Moab.","14":"And Elisha said, As the LORD of hosts liveth, before whom I stand, surely, were it not that I regard the presence of Jehoshaphat the king of Judah, I would not look toward thee, nor see thee.","15":"But now bring me a minstrel. And it came to pass, when the minstrel played, that the hand of the LORD came upon him.","16":"And he said, Thus saith the LORD, Make this valley full of ditches.","17":"For thus saith the LORD, Ye shall not see wind, neither shall ye see rain; yet that valley shall be filled with water, that ye may drink, both ye, and your cattle, and your beasts.","18":"And this is but a light thing in the sight of the LORD: he will deliver the Moabites also into your hand.","19":"And ye shall smite every fenced city, and every choice city, and shall fell every good tree, and stop all wells of water, and mar every good piece of land with stones.","20":"And it came to pass in the morning, when the meat offering was offered, that, behold, there came water by the way of Edom, and the country was filled with water.","21":"And when all the Moabites heard that the kings were come up to fight against them, they gathered all that were able to put on armour, and upward, and stood in the border.","22":"And they rose up early in the morning, and the sun shone upon the water, and the Moabites saw the water on the other side as red as blood:","23":"And they said, This is blood: the kings are surely slain, and they have smitten one another: now therefore, Moab, to the spoil.","24":"And when they came to the camp of Israel, the Israelites rose up and smote the Moabites, so that they fled before them: but they went forward smiting the Moabites, even in their country.","25":"And they beat down the cities, and on every good piece of land cast every man his stone, and filled it; and they stopped all the wells of water, and felled all the good trees: only in Kirharaseth left they the stones thereof; howbeit the slingers went about it, and smote it.","26":"And when the king of Moab saw that the battle was too sore for him, he took with him seven hundred men that drew swords, to break through even unto the king of Edom: but they could not.","27":"Then he took his eldest son that should have reigned in his stead, and offered him for a burnt offering upon the wall. And there was great indignation against Israel: and they departed from him, and returned to their own land."}},"tsk":{"1":[{"kopje":"Joram","refs":["2 Kon 1:17","2 Kon 8:16","1 Kon 22:52"]}],"2":[{"kopje":"deed","refs":["2 Kon 6:31","2 Kon 6:32","2 Kon 21:6","2 Kon 21:20"]},{"kopje":"doch niet","refs":["1 Kon 16:33","1 Kon 21:20","1 Kon 21:25"]},{"kopje":"en zoals","refs":["2 Kon 9:22","2 Kon 9:34","1 Kon 21:5-15","1 Kon 21:25"]},{"kopje":"Baäl","refs":["2 Kon 10:18","2 Kon 10:26-28","1 Kon 16:31","1 Kon 16:32"]}],"3":[{"kopje":"hield hij vast","refs":["2 Kon 10:20-31"]},{"kopje":"die deed zondigen","refs":["1 Kon 14:16","1 Kon 15:26","1 Kon 15:34","1 Kon 16:31"]},{"kopje":"week daarvan",  <span class=\"wl\" data-l=\"L9\" data-code=\"H2346\">de</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H2346\">muur</span>. <span class=\"wl\" data-l=\"L10\" data-code=\"H1961\">Daaruit</span> kwam <span class=\"wl\" data-l=\"L11\" data-code=\"H1419\">een</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H1419\">zeer</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H1419\">grote</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H7110\">toorn</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H7110\">over</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H3478\">Israël</span>; <span class=\"wl\" data-l=\"L14\" data-code=\"H5265\">daarom</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H5265\">trokken</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H5265\">zij</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H5265\">van</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H5265\">hem</span> weg, <span class=\"wl\" data-l=\"L15\" data-code=\"H7725\">en</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H7725\">keerden</span> terug naar <em>hun</em> <span class=\"wl\" data-l=\"L16\" data-code=\"H776\">land</span>."},"koppeling_kjv":{"1":"Now <span class=\"wl wl-kjv\" data-code=\"H3088\">Jehoram</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> the <span class=\"wl wl-kjv\" data-code=\"H8083\">eighteenth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>","2":"And he <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> but not like his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and like his <span class=\"wl wl-kjv\" data-code=\"H517\">mother:</span> for he put <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H4676\">image</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal</span> that his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made.</span>","3":"Nevertheless he <span class=\"wl wl-kjv\" data-code=\"H1692\">cleaved</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5028\">Nebat,</span> which made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin;</span> he <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> not therefrom.","4":"And <span class=\"wl wl-kjv\" data-code=\"H4338\">Mesha</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> was a <span class=\"wl wl-kjv\" data-code=\"H5349\">sheepmaster,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">rendered</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3733\">lambs,</span> and an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H352\">rams,</span> with the <span class=\"wl wl-kjv\" data-code=\"H6785\">wool.</span>","5":"But it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> was <span class=\"wl wl-kjv\" data-code=\"H4194\">dead,</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> <span class=\"wl wl-kjv\" data-code=\"H6586\">rebelled</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3088\">Jehoram</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">time,</span> and <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","7":"And he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> hath <span class=\"wl wl-kjv\" data-code=\"H6586\">rebelled</span> against me: wilt thou <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with me against <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will go <span class=\"wl wl-kjv\" data-code=\"H5927\">up:</span> I am as thou art, my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> as thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and my <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> as thy <span class=\"wl wl-kjv\" data-code=\"H5483\">horses.</span>","8":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Which <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> shall we go <span class=\"wl wl-kjv\" data-code=\"H5927\">up?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> The <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> through the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom.</span>","9":"So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom:</span> and they fetched a <span class=\"wl wl-kjv\" data-code=\"H5437\">compass</span> of <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days'</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">journey:</span> and there was no <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> for the <span class=\"wl wl-kjv\" data-code=\"H4264\">host,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H929\">cattle</span> that <span class=\"wl wl-kjv\" data-code=\"H7272\">followed</span> them.","10":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H162\">Alas!</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> ➔ these <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">together,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab!</span>","11":"But <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is there not here a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> by him? And <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Here is <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8202\">Shaphat,</span> which <span class=\"wl wl-kjv\" data-code=\"H3332\">poured</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> on the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah.</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> with him. So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to him.","13":"And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> What have I to do with thee? <span class=\"wl wl-kjv\" data-code=\"H3212\">get</span> thee to the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> of thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Nay: for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> ➔ these <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">together,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> whom I <span class=\"wl wl-kjv\" data-code=\"H5975\">stand,</span> surely, were it not <span class=\"wl wl-kjv\" data-code=\"H3884\">that</span> I <span class=\"wl wl-kjv\" data-code=\"H5375\">regard</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> of <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> I would not <span class=\"wl wl-kjv\" data-code=\"H5027\">look</span> toward thee, nor <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> thee.","15":"But now <span class=\"wl wl-kjv\" data-code=\"H3947\">bring</span> me a <span class=\"wl wl-kjv\" data-code=\"H5059\">minstrel.</span> And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H5059\">minstrel</span> <span class=\"wl wl-kjv\" data-code=\"H5059\">played,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came upon him.","16":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">Make</span> this <span class=\"wl wl-kjv\" data-code=\"H5158\">valley</span> full of <span class=\"wl wl-kjv\" data-code=\"H1356\">ditches.</span>","17":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Ye shall not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">wind,</span> neither shall ye <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> <span class=\"wl wl-kjv\" data-code=\"H1653\">rain;</span> yet that <span class=\"wl wl-kjv\" data-code=\"H5158\">valley</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> with <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> both ye, and your <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle,</span> and your <span class=\"wl wl-kjv\" data-code=\"H929\">beasts.</span>","18":"And this is but a light <span class=\"wl wl-kjv\" data-code=\"H7043\">thing</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> he will <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> the <span class=\"wl wl-kjv\" data-code=\"H4124\">Moabites</span> also into your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","19":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> every <span class=\"wl wl-kjv\" data-code=\"H4013\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and every <span class=\"wl wl-kjv\" data-code=\"H4004\">choice</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> every <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">tree,</span> and <span class=\"wl wl-kjv\" data-code=\"H5640\">stop</span> all <span class=\"wl wl-kjv\" data-code=\"H4599\">wells</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and <span class=\"wl wl-kjv\" data-code=\"H3510\">mar</span> every <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H2513\">piece</span> of land with <span class=\"wl wl-kjv\" data-code=\"H68\">stones.</span>","20":"And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> when the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> was <span class=\"wl wl-kjv\" data-code=\"H5927\">offered,</span> that, behold, there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> was <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> with <span class=\"wl wl-kjv\" data-code=\"H4325\">water.</span>","21":"And when all the <span class=\"wl wl-kjv\" data-code=\"H4124\">Moabites</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> were come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against them, they <span class=\"wl wl-kjv\" data-code=\"H6817\">gathered</span> all that were able to <span class=\"wl wl-kjv\" data-code=\"H2296\">put</span> on <span class=\"wl wl-kjv\" data-code=\"H2290\">armour,</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H1366\">border.</span>","22":"And they rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> <span class=\"wl wl-kjv\" data-code=\"H2224\">shone</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4124\">Moabites</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> on the other <span class=\"wl wl-kjv\" data-code=\"H5048\">side</span> as <span class=\"wl wl-kjv\" data-code=\"H122\">red</span> as <span class=\"wl wl-kjv\" data-code=\"H1818\">blood:</span>","23":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This is <span class=\"wl wl-kjv\" data-code=\"H1818\">blood:</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> are <span class=\"wl wl-kjv\" data-code=\"H2717\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H2717\">slain,</span> and they have <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7453\">another:</span> now therefore, <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> to the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil.</span>","24":"And when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> the <span class=\"wl wl-kjv\" data-code=\"H3478\">Israelites</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H4124\">Moabites,</span> so that they <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them: but they went <span class=\"wl wl-kjv\" data-code=\"H5221\">forward</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smiting</span> the <span class=\"wl wl-kjv\" data-code=\"H4124\">Moabites,</span> even in their country.","25":"And they beat <span class=\"wl wl-kjv\" data-code=\"H2040\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and on every <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H2513\">piece</span> of land <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> and <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> it; and they <span class=\"wl wl-kjv\" data-code=\"H5640\">stopped</span> all the <span class=\"wl wl-kjv\" data-code=\"H4599\">wells</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">felled</span> all the <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees:</span> only in <span class=\"wl wl-kjv\" data-code=\"H7025\">Kirharaseth</span> <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> they the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> thereof; howbeit the <span class=\"wl wl-kjv\" data-code=\"H7051\">slingers</span> went <span class=\"wl wl-kjv\" data-code=\"H5437\">about</span> it, and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> it.","26":"And when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> was too <span class=\"wl wl-kjv\" data-code=\"H2388\">sore</span> for him, he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> with him <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H8025\">drew</span> <span class=\"wl wl-kjv\" data-code=\"H2719\">swords,</span> to break <span class=\"wl wl-kjv\" data-code=\"H1234\">through</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom:</span> but they <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not.","27":"Then he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> his <span class=\"wl wl-kjv\" data-code=\"H1060\">eldest</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> that should have <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead, and <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> him for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall.</span> And there was <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7110\">indignation</span> against <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from him, and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to their own <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"achttiende","tekst":"Hetwelk het tweede jaar was van Ahazia's regering. Vergelijk hiermede boven, 2Ki 1:17, en de aantekening."}],"2":[{"catchword":"dat opgerichte","tekst":"Versta, het opgerichte beeld van den afgod der Sidoniërs, door Achab te Samaria opgericht. Zie 1Ki 16:32."}],"3":[{"catchword":"de zonden","tekst":"Want hij diende de gouden kalven, die Jerobeam had laten maken; 1Ki 12:28-29, enz."}],"4":[{"catchword":"veehandelaar,","tekst":"Dat is, hij had groten handel en rijkdom in vee en beesten, waarvan hij schatting moest geven, van dien tijd af dat David hem onder zijn geweld gebracht had, 2Sa 8:12; nu, na de scheiding der tien stammen van den huize Juda, hebben de koningen Israëls dit gebied over de Moabieten aan zich getrokken, gelijk de koningenvan Juda ter andere zijde het gebied over de Edomieten behouden hebben, die onder Joram, den zoon van Josafat, zijn afvallig geworden, onder, 2Ki 8:20, gelijk de Moabieten van Israël onder Joram, den zoon van Achab, in vs.5 en boven, 2Ki 1:1."}],"5":[{"catchword":"van den koning","tekst":"Hebreeuws, tegen den koning Israëls overtrad; alzo in het volgende. Deze afval was geschied onder de regering zijns broeders Ahazia, na den dood zijns vaders Achab; boven, 2Ki 1:1."}],"7":[{"catchword":"mij afgevallen,","tekst":"Die ik ben de wettelijk opvolger in het koninkrijk mijns vaders, en daarom zulk een afval mij moest aantrekken, hoewel hij hier tevoren geschied is. Zie boven, 2Ki 1:1."},{"catchword":"zal ik zijn,","tekst":"Vergelijk 1Ki 22:4, en zie de aantekening."}],"8":[{"catchword":"hij zeide","tekst":"Namelijk, Josafat, die dit vroeg, omdat hij den koning van Edom wilde medenemen. Men kan het ook verstaan van Joram, als zich willende beraden met Josafat."},{"catchword":"Door den weg","tekst":"Te weten, om de Moabieten van achteren te bespringen."}],"9":[{"catchword":"koning van Edom;","tekst":"Die te dezer tijd nog de stadhouder was des konings van Juda, 1Ki 22:48. Vergelijk hiermede de aantekening boven, vs.4. Hij wordt hier een koning genoemd, omdat ij de plaats eens konings bewaarde; gelijk dit woord elders ook voor een gouverneur of regeerder genomen wordt. Zie Jdg 17:6."},{"catchword":"dat hen navolgde,","tekst":"Hebreeuws, dat in, of aan hun voeten was. Zie Jdg 4:10."}],"11":[{"catchword":"die water","tekst":"Dat is, die Elia diende. Want dit is een van de diensten, die de knechten of dienaars hunnen heren plegen te doen."}],"12":[{"catchword":"Des HEEREN woord","tekst":"Hij wil zeggen dat hij een trouw profeet des waren Gods was, en vervolgens vanwege den Heere hun goeden raad zou kunnen geven."},{"catchword":"tot hem","tekst":"Namelijk, tot Elisa, denwelken men meent door Gods drijving het leger gevolgd en niet ver vandaar buiten het leger geweest te zijn."}],"13":[{"catchword":"Wat heb ik","tekst":"Hebreeuws, wat mij en u is? alzo 2Sa 16:10; Mar 1:24; Luk 4:34; Joh 2:4."},{"catchword":"profeten uws vaders,","tekst":"Versta, tot de overige profeten Baäls, van het afgodische woud, en den kalveren Jerobeams. Van zodanigen zie 1Ki 18:19."},{"catchword":"Neen,","tekst":"Dat is, roer die dingen niet aan, of rep daar niet van."},{"catchword":"want de HEERE","tekst":"Hij wil zeggen dat de reden, om welke zij zijn raad verzochten, zeer gewichtig was, zijnde door den tegenwoordigen nood niet alleen zijn leven, maar ook der twee andere koningen in het uiterste gevaar gebracht."}],"14":[{"catchword":"voor Wiens","tekst":"Dat is, dien ik dien. Zie Deu 10:8."},{"catchword":"zo ik niet","tekst":"Dat is, zo ik zijn persoon om zijn godzaligheid en vromigheid wil, met toegenegenheid en eerbieding niet aanzag, enz. Zie Gen 32:20."},{"catchword":"ik zou u niet","tekst":"Hebreeuws, zo ik u zou aanschouwen, of, zo ik u zou aanzien!"}],"15":[{"catchword":"brengt mij","tekst":"Hebreeuws, neemt mij; alzo boven, 2Ki 2:20."},{"catchword":"speelman","tekst":"Het Hebreeuwse woord betekent eigenlijk een, die op muzikale instrumenten speelt, als harp, cither, luit, enz. Zodanig spel schijnt de profeet begeerd te hebben, om zijn hart eensdeels te stillen over de ongezindheid, die hij tegen den koning Joram had, anderdeels door lofzangen en gebeden, die men speelde, tot God op te heffen, en alzo zich te bereiden om hetgeen hem God openbaren zou in een welbereid hart te ontvangen. Vergelijk 1Sa 10:5."},{"catchword":"de hand des HEEREN","tekst":"Versta door deze de kracht van profeteren, om dezen koningen raad te geven en te voorzeggen wat er geschieden zou. Zulke krachten hadden de profeten niet ten allen tijde, maar als het den Heere beliefde die hun te verlenen. Zie onder, 2Ki 4:27; Eze 1:3. Hoewel zij met vasten, zingen, bidden en lezen der Heilige Schrift zich bereiden moesten, om die te ontvangen; Dan 2:17-18."},{"catchword":"kwam","tekst":"Hebreeuws, was, of, werd."}],"16":[{"catchword":"grachten","tekst":"Hebreeuws, grachten, grachten; dat is, vele grachten, hier en daar. Zie van deze verdubbeling eens woords Gen 14:10."}],"17":[{"catchword":"uw vee,","tekst":"Zie Gen 36:6."}],"18":[{"catchword":"slecht","tekst":"Hebreeuws, licht; dat is, boven de weldaad die gij begeerd hebt, te weten overvloed van water, zal u de Heere nog geven dat gij niet begeerd hebt; victorie over uw vijanden."}],"19":[{"catchword":"En gij","tekst":"Dat is niet alleen een bevel van hetgeen zij doen moesten, maar ook een belofte van hetgeen zij daarmede uitrichten zouden tot hun profijt en afbreuk der vijanden."},{"catchword":"goede bomen","tekst":"Dat is, een speciaal bevel, uitgenomen van den gemenen regel, Deu 20:19, of, deze regel is te verstaan alleen van de langdurige belegering van enige stad en niet van de haastige verwoesting van een land."},{"catchword":"met stenen","tekst":"Dat is, door stenen daarop te werpen onvruchtbaar en onbruikbaar maken, zulks dat het door deze verwoesting daarmede zal zijn als met een mens, die van allen beschadigd en verlaten zijnde, treurt en kwijnt."},{"catchword":"verderven","tekst":"Hebreeuws, doen treuren, of weedoen."}],"20":[{"catchword":"als men","tekst":"Zie 1Ki 18:29."}],"21":[{"catchword":"den gordel","tekst":"Te weten, een krijgsgordel met het geweer, en dat voor hun eerste reis. Dat is, die nu eerst bekwaam bevonden werden om de wapenen te gebruiken en in den krijg te trekken."},{"catchword":"de landpale","tekst":"Versta, van hun land, te weten om hun vijanden daaruit te houden."}],"22":[{"catchword":"rood,","tekst":"Deze roodheid was veroorzaakt door de stralen der zon, die nu eerst begon zich den aardbodem te vertonen."}],"23":[{"catchword":"hebben voorzeker","tekst":"Hebreeuws, verdervende zich verdorven; dat is, zekerlijk of ganselijk verdorven, verdaan, of vernield. Het Hebreeuwse woord betekent eigenlijk verwoesten, waarvan het woord zwaard bij de Hebreën zijn benaming heeft, omdat het verwoesting maakt. De zin dan is dat zij zich door onderlinge moorderij verdaan en alzo het leger verwoest hebben."}],"24":[{"catchword":"zij kwamen","tekst":"Namelijk, de Israëlieten, die hun victorie vervolgende, de Moabieten tot in hun land verjaagd en daar ook verslagen en gedempt hebben."},{"catchword":"in het land,","tekst":"Hebreeuws, in hun. Versta, het land der Moabieten, uit hetwelk dezen meenden de Israëlieten uit te keren, boven, vs.21. Anders worden deze woorden aldus vertaald: En zij sloegen hen in hun [land], slaande ook [het land] van de Moabieten. De zin is enerlei."}],"25":[{"catchword":"Kir-haréseth","tekst":"Een van de voornaamste en sterkste steden der Moabieten, hebbende een stenen muur, waarvan zij schijnt haar naam gekregen te hebben. Zie van dezelve ook Isa 16:7."},{"catchword":"de stenen","tekst":"Versta, den stenen muur der genoemde stad, denwelken de Israëlieten onverbroken gelaten hebbende, nadat zij alle andere steden afgebroken en het platteland afgelopen en verwoest hadden."},{"catchword":"slingeraars","tekst":"Dat is, met hun slingers en ander krijgsgereedschap bedreven zij zoveel geweld, dat de burgers hun stadsmuren niet beschermen konden en vele van dezelve verslagen werden."}],"26":[{"catchword":"zwaard","tekst":"Zie de betekenis dezer manier van spreken, Jdg 8:10."},{"catchword":"tegen","tekst":"Of, tot, of door het leger des konings."}],"27":[{"catchword":"hij zijn","tekst":"Namelijk, de koning der Moabieten, die om de hulp zijns afgods Chamos in dezen nood te verkrijgen, zijn eerstgeboren zoon op den stadsmuur, in het aanzien van de belegeraars ten brandoffer heeft geofferd. Want door zodanige offerande meenden de afgodendienaars hun afgoden den allermeesten dienst en eer te bewijzen, zich ijdellijk wijsmakende dat zij hierin Abrahams navolgers waren. Anderen menen dat hij geofferd heeft niet zijn zoon, maar den zoon des konings van Edom, dien hij [gelijk zij zeggen] zou gevangen hebben in den uitval, als hij met zevenhonderd mannen poogde door het leger des konings van Edom door te breken; in vs.26. Tot bewijs van dit gevoelen wordt voorgebracht Amo 2:1. Zie exempelen dergenen, die hun kinderen den afgoden geofferd hebben, Psa 106:37; Eze 20:31, hetwelk God op lijfstraf verboden had, Lev 20:2."},{"catchword":"Daaruit","tekst":"Te weten, omdat zij door deze harde belegering en onverzoenlijken oorlog den koning der Moabieten tot deze desperate en wrede daad gebracht hadden."},{"catchword":"in Israël;","tekst":"Anders, tegen; verstaande dezen toorn specialijk van den koning van Edom en zijn leger, om den gruwelijken moord zijns zoons."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now Joram the son of Achab became King over Israel at Samaria, in the eighteenth year of Josaphat the of Juda, [Which was the twelfth year of Ahazia&acirc;&euro;&trade;s reign. Compare herewith above chap.1.17. and the annotat.] and he reigned twelve years."}],"2":[{"catchword":null,"tekst":"And he did that which was evil in the eyes of the LORD, but not like his father, and like his mother: For he put away the reared image of Baal, which his Father had made. [Understand the reared image of the idol of the Zidonians, reared up at Samaria by Achab. See 1 Kings 16.32.]"}],"3":[{"catchword":null,"tekst":"Nevertheless he cleaved unto the sins of Jerobeam the son of Nebat, [For he served the golden calves, which Jerobeam had caused to be made, 1 Kings 12.28, 29, etc.] that made Israel to sin, he departed not from the same."}],"4":[{"catchword":null,"tekst":"Now Mesa the King of the Moabites was a dealer in cattle, and delivered up to the King of Israel an hundred thousand lambs, and an hundred thousand rams with the wool. [That is, he had great trading and riches in cattle, of which he was to pay tribute from that time that David had brought him under his subjection, 2 Sa.8.12. Now after the separation of the ten tribes from the house of Juda, the Kings of Israel took this jurisdiction over the Moabites to themselves, as the Kings of Juda on the contrary kept to themselves the command over the Edomites, who revolted under Joram the son of Josaphat, below chap.8.20. as the Moabites revolted from Israel under Joram the so of Achab, in the following verse, a // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
