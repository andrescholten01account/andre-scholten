 de kinderen van de moordenaars doodde hij niet; zoals geschreven staat in het wetboek van Mozes, waar de HEERE geboden heeft: De vaders zullen niet gedood worden voor de kinderen, en de kinderen zullen niet gedood worden voor de vaders; maar ieder zal om zijn eigen zonde gedood worden.","7":"Hij sloeg de Edomieten in het Zoutdal, tienduizend man, en nam Sela in met oorlog, en noemde het Jokteel, tot op deze dag.","8":"Toen zond Amazia boden naar Joas, de zoon van Joahaz, de zoon van Jehu, de koning van Israël, en zei: Kom, laten we elkaar in het gezicht zien.","9":"Maar Joas, de koning van Israël, zond naar Amazia, de koning van Juda, en zei: De distel die op de Libanon staat, zond naar de ceder die op de Libanon staat, en zei: Geef uw dochter aan mijn zoon tot vrouw; maar het wilde dier van het veld, dat op de Libanon was, kwam voorbij en vertrapte de distel.","10":"U hebt de Edomieten inderdaad geslagen, daarom heeft uw hart u verheven; heb de eer, en blijf in uw huis; want waarom zou u zich in het kwade mengen, zodat u zou vallen, u en Juda met u?","11":"Doch Amazia luisterde niet; daarom trok Joas, de koning van Israël, op, zodat hij en Amazia, de koning van Juda, elkaar in het gezicht zagen bij Beth-semes, dat in Juda ligt.","12":"En Juda werd verslagen voor Israël, en zij vluchtten, ieder naar zijn tent.","13":"En Joas, de koning van Israël, greep Amazia, de koning van Juda, de zoon van Joas, de zoon van Ahazia, bij Beth-semes, en kwam naar Jeruzalem; en hij brak een deel van de muur van Jeruzalem af, van de poort van Efraïm tot aan de Hoekpoort, vierhonderd el.","14":"En hij nam al het goud en het zilver, en alle voorwerpen die gevonden werden in het huis van de HEERE, en in de schatten van het huis van de koning, alsook gijzelaars; en hij keerde terug naar Samaria.","15":"Het overige nu van de geschiedenis van Joas, wat hij gedaan heeft, en zijn macht, en hoe hij gestreden heeft tegen Amazia, de koning van Juda, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","16":"En Joas ontsliep met zijn vaderen, en werd in Samaria begraven bij de koningen van Israël; en zijn zoon Jerobeam werd koning in zijn plaats.","17":"Amazia nu, de zoon van Joas, koning van Juda, leefde na de dood van Joas, de zoon van Joahaz, de koning van Israël, nog vijftien jaar.","18":"Het overige nu van de geschiedenis van Amazia, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?","19":"En zij maakten een samenzwering tegen hem in Jeruzalem, zodat hij vluchtte naar Lachis; maar zij stuurden hem achterna naar Lachis, en doodden hem daar.","20":"En zij brachten hem op paarden; en hij werd in Jeruzalem begraven, bij zijn vaderen, in de stad van David.","21":"En het hele volk van Juda nam Azaria (die toen zestien jaar oud was), en maakte hem koning in de plaats van zijn vader Amazia.","22":"Die bouwde Elath, en bracht het terug bij Juda, nadat de koning met zijn vaderen ontslapen was.","23":"In het vijftiende jaar van Amazia, de zoon van Joas, de koning van Juda, werd in Samaria koning Jerobeam, de zoon van Joas, koning van Israël, *en* *regeerde* eenenveertig jaar.","24":"En hij deed wat kwaad was in de ogen van de HEERE; hij week niet af van alle zonden van Jerobeam, de zoon van Nebat, die Israël liet zondigen.","25":"Hij bracht ook het gebied van Israël terug, vanaf de ingang van Hamath tot aan de zee van het vlakke veld; naar het woord van de HEERE, de God van Israël, dat Hij gesproken had door de dienst van Zijn dienaar Jona, de zoon van Amitthai, de profeet, die uit Gath-Hefer was.","26":"Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.","27":"En de HEERE had niet gesproken dat Hij de naam van Israël van onder de hemel zou uitwissen; maar Hij verloste hen door de hand van Jerobeam, de zoon van Joas.","28":"Het overige nu van de geschiedenis van Jerobeam, en alles wat hij gedaan heeft, en zijn macht, hoe hij gestreden heeft, en hoe hij Damaskus en Hamath, die tot Juda behoorden, weer aan Israël teruggebracht heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","29":"En Jerobeam ontsliep met zijn vaderen, met de koningen van Israël; en zijn zoon Zacharia werd koning in zijn plaats."},"SV":{"1":"In het tweede jaar van Joas, den zoon van Joahaz, den koning van Israël, werd Amazia koning, de zoon van Joas, den koning van Juda.","2":"Vijf en twintig jaren was hij oud, toen hij koning werd, en regeerde negen en twintig jaren te Jeruzalem; en de naam zijner moeder was Joaddan van Jeruzalem.","3":"En hij deed dat recht was in de ogen des HEEREN, nochtans niet als zijn vader David; hij deed naar alles, wat zijn vader Joas gedaan had.","4":"Alleenlijk werden de hoogten niet weggenomen; het volk offerde en rookte nog op de hoogten.","5":"Het geschiedde nu, als het koninkrijk in zijn hand versterkt was, dat hij zijn knechten sloeg, die den koning, zijn vader, geslagen hadden,","6":"Doch de kinderen der doodslagers doodde hij niet; gelijk geschreven is in het wetboek van Mozes, waar de HEERE geboden heeft, zeggende: De vaders zullen voor de kinderen niet gedood worden, en de kinderen zullen voor de vaders niet gedood worden; maar een ieder zal om zijn zonde gedood worden.","7":"Hij sloeg de Edomieten in het Zoutdal tien duizend, en nam Sela in met krijg, en noemde haar naam Jokteel, tot op dezen dag.","8":"Toen zond Amazia boden tot Joas, den zoon van Joahaz, den zoon van Jehu, den koning van Israël, zeggende: Kom, laat ons elkanders aangezicht zien.","9":"Maar Joas, de koning van Israël, zond tot Amazia, den koning van Juda, zeggende: De distel, die op den Libanon is, zond tot den ceder, die op den Libanon is, zeggende: Geef uw dochter mijn zoon ter vrouw; maar het gedierte des velds, dat op den Libanon is, ging voorbij, en vertrad den distel.","10":"Gij hebt de Edomieten dapper geslagen, daarom heeft uw hart u verheven; heb de eer, en blijf in uw huis; want waarom zoudt gij u in het kwade mengen, dat gij vallen zoudt, gij en Juda met u?","11":"Doch Amazia hoorde niet; daarom toog Joas, de koning van Israël, op, zodat hij en Amazia, de koning van Juda, elkanders aangezicht zagen te Beth-semes, dat in Juda is.","12":"En Juda werd geslagen voor het aangezicht van Israël, en zij vloden, een iegelijk in zijn tenten.","13":"En Joas, de koning van Israël, greep Amazia, den koning van Juda, den zoon van Joas, den zoon van Ahazia, te Beth-semes, en kwam te Jeruzalem; en hij brak aan den muur van Jeruzalem, van de poort van Efraïm tot aan de Hoekpoort, vierhonderd ellen.","14":"En hij nam al het goud, en het zilver, en al de vaten, die gevonden werden in het huis des HEEREN, en in de schatten van des konings huis, mitsgaders gijzelaars; en hij keerde weder naar Samaria.","15":"Het overige nu der geschiedenissen van Joas, wat hij gedaan heeft, en zijn macht, en hoe hij gestreden heeft tegen Amazia, den koning van Juda, zijn die niet geschreven in het boek der kronieken der koningen van Israël?","16":"En Joas ontsliep met zijn vaderen, en werd te Samaria begraven bij de koningen van Israël; en zijn zoon Jerobeam werd koning in zijn plaats.","17":"Amazia nu, de zoon van Joas, koning van Juda, leefde na den dood van Joas, den zoon van Joahaz, den koning van Israël, vijftien jaren.","18":"Het overige nu der geschiedenissen van Amazia, is dat niet geschreven in het boek der kronieken der koningen van Juda?","19":"En zij maakten een verbintenis tegen hem te Jeruzalem, dat hij vluchtte naar Lachis; maar zij zonden hem na tot Lachis, en doodden hem aldaar.","20":"En zij brachten hem op paarden; en hij werd te Jeruzalem begraven, bij zijn vaderen, in de stad Davids.","21":"En het ganse volk van Juda nam Azaria ( die nu zestien jaren oud was), en maakten hem koning in plaats van zijn vader Amazia.","22":"Die bouwde Elath, en bracht haar weder aan Juda, nadat de koning met zijn vaderen ontslapen was.","23":"In het vijftiende jaar van Amazia, den zoon van Joas, den koning van Juda, werd te Samaria koning, Jerobeam, de zoon van Joas, koning van Israël, *en* *regeerde* een en veertig jaren.","24":"En hij deed dat kwaad was in de ogen des HEEREN; hij week niet van alle zonden van Jerobeam, den zoon van Nebat, die Israël zondigen deed.","25":"Hij bracht ook weder de landpale van Israël van den ingang van Hamath, tot aan de zee van het vlakke veld; naar het woord des HEEREN, des Gods van Israël, dat Hij gesproken had door den dienst van Zijn knecht Jona, den zoon van Amitthai, den profeet, die van Gath-hefer was.","26":"Want de HEERE zag, dat de ellende van Israël zeer bitter was, en dat er geen opgeslotenen noch verlatenen waren, en dat Israël geen helper had.","27":"En de HEERE had niet gesproken, dat Hij den naam van Israël van onder den hemel verdelgen zou; maar Hij verloste hen door de hand van Jerobeam, den zoon van Joas.","28":"Het overige nu der geschiedenissen van Jerobeam, en al wat hij gedaan heeft, en zijn macht, hoe hij gekrijgd heeft, en hoe hij Damaskus en Hamath, tot Juda *behorende*, aan Israël wedergebracht heeft, zijn die niet geschreven in het boek der kronieken der koningen van Israël?","29":"En Jerobeam ontsliep met zijn vaderen, met de koningen van Israël; en zijn zoon Zacharia werd koning in zijn plaats."},"KJV":{"1":"In the second year of Joash son of Jehoahaz king of Israel reigned Amaziah the son of Joash king of Judah.","2":"He was twenty and five years old when he began to reign, and reigned twenty and nine years in Jerusalem. And his mother's name was Jehoaddan of Jerusalem.","3":"And he did that which was right in the sight of the LORD, yet not like David his father: he did according to all things as Joash his father did.","4":"Howbeit the high places were not taken away: as yet the people did sacrifice and burnt incense on the high places.","5":"And it came to pass, as soon as the kingdom was confirmed in his hand, that he slew his servants which had slain the king his father.","6":"But the children of the murderers he slew not: according unto that which is written in the book of the law of Moses, wherein the LORD commanded, saying, The fathers shall not be put to death for the children, nor the children be put to death for the fathers; but every man shall be put to death for his own sin.","7":"He slew of Edom in the valley of salt ten thousand, and took Selah by war, and called the name of it Joktheel unto this day.","8":"Then Amaziah sent messengers to Jehoash, the son of Jehoahaz son of Jehu, king of Israel, saying, Come, let us look one another in the face.","9":"And Jehoash the king of Israel sent to Amaziah king of Judah, saying, The thistle that was in Lebanon sent to the cedar that was in Lebanon, saying, Give thy daughter to my son to wife: and there passed by a wild beast that was in Lebanon, and trode down the thistle.","10":"Thou hast indeed smitten Edom, and thine heart hath lifted thee up: glory of this, and tarry at home: for why shouldest thou meddle to thy hurt, that thou shouldest fall, even thou, and Judah with thee?","11":"But Amaziah would not hear. Therefore Jehoash king of Israel went up; and he and Amaziah king of Judah looked one another in the face at Bethshemesh, which belongeth to Judah.","12":"And Judah was put to the worse before Israel; and they fled every man to their tents.","13":"And Jehoash king of Israel took Amaziah king of Judah, the son of Jehoash the son of Ahaziah, at Bethshemesh, and came to Jerusalem, and brake down the wall of Jerusalem from the gate of Ephraim unto the corner gate, four hundred cubits.","14":"And he took all the gold and silver, and all the vessels that were found in the house of the LORD, and in the treasures of the king's house, and hostages, and returned to Samaria.","15":"Now the rest of the acts of Jehoash which he did, and his might, and how he fought with Amaziah king of Judah, are they not written in the book of the chronicles of the kings of Israel?","16":"And Jehoash slept with his fathers, and was buried in Samaria with the kings of Israel; and Jeroboam his son reigned in his stead.","17":"And Amaziah the son of Joash king of Judah lived after the death of Jehoash son of Jehoahaz king of Israel fifteen years.","18":"And the rest of the acts of Amaziah, are they not written in the book of the chronicles of the kings of Judah?","19":"Now they made a conspiracy against him in Jerusalem: and he fled to Lachish; but they sent after him to Lachish, and slew him there.","20":"And they brought him on horses: and he was buried at Jerusalem with his fathers in the city of David.","21":"And all the people of Judah took Azariah, which was sixteen years old, and made him king instead of his father Amaziah.","22":"He built Elath, and restored it to Judah, after that the king slept with his fathers.","23":"In the fifteenth year of Amaziah the son of Joash king of Judah Jeroboam the son of Joash king of Israel began to reign in Samaria, and reigned forty and one years.","24":"And he did that which was evil in the sight of the LORD: he departed not from all the sins of Jeroboam the son of Nebat, who made Israel to sin.","25":"He restored the coast of Israel from the entering of Hamath unto the sea of the plain, according to the word of the LORD God of Israel, which he spake by the hand of his servant Jonah, the son of Amittai, the prophet, which was of Gathhepher.","26":"For the LORD saw the affliction of Israel, that it was very bitter: for there was not any shut up, nor any left, nor any helper for Israel.","27":"And the LORD said not that he would blot out the name of Israel from under heaven: but he saved them by the hand of Jeroboam the son of Joash.","28":"Now the rest of the acts of Jeroboam, and all that he did, and his might, how he warred, and how he recovered Damascus, and Hamath, which belonged to Judah, for Israel, are they not written in the book of the chronicles of the kings of Israel?","29":"And J "}],"8":[{"catchword":"laat ons","tekst":"Dat is, laat ons tegen elkander strijden. Alzo onder, vs.11; idem 2Ki 23:29; 2Ch 25:17, 2Ch 25:21. Het schijnt dat hij den dood zijner vrienden door dezen aangenomen krijg heeft willen wreken, waarvan te zien is boven, 2Ki 9:27, en 2Ki 10:14, of immers de moedwilligheid en roverij der afgedankte Israëlieten, in zijn land geschied; zie daarvan 2Ch 25:13."}],"9":[{"catchword":"De distel,","tekst":"De koning Israëls vergelijkt alhier den koning van Juda bij een distel of doornstruik, en zichzelven bij een cederboom, zijn krijgslieden bij het wild gedierte des Libanons, en de schade, die de koning van Juda te verwachten had, bij de vertreding van den distel. Het is zoveel alsof hij zeide: Indien gij, die in macht van volk en heerlijkheid des koninkrijks bij mij niet meer zijt te vergelijken, dan een verachte distel bij een verheven cederboom, tot mij om vrede en vriendschap gezonden had, het zou u niet gelukt hebben; hoeveel minder zal u deze vijandige vermetelheid wel bekomen? daarom indien gij wijs zijt, doe afstand, u wachtende voor schade."},{"catchword":"Libanon is,","tekst":"Zie 1Ki 4:33."}],"10":[{"catchword":"dapper geslagen,","tekst":"Hebreeuws, slaande geslagen. Zie boven, vs.7."},{"catchword":"het kwade","tekst":"Te weten, van den oorlog. Of, waarom zoudt gij u mengen, of, inlaten [in den strijd] met schade?"}],"11":[{"catchword":"toog Joas,","tekst":"Overmits hij den inval van Amazia niet wilde verwachten in zijn eigen land, maar liever hem bejegenen in het zijne."},{"catchword":"elkanders","tekst":"Dat is, streden tegen elkander. Zie boven, vs.8."},{"catchword":"Beth-sémes,","tekst":"Een stad, gelegen aan de landpale van den stam van Juda, Jos 15:10, den Levieten toegeëigend, Jos 21:16, ingenomen van de Filistijnen onder Achaz, 2Ch 28:18, en te onderscheiden van een ander Beth-Semes, gelegen in den stam van Nafthali, Jdg 1:33."}],"12":[{"catchword":"tenten","tekst":"Dat is, in hun woningen. Zie boven, 2Ki 13:5."}],"13":[{"catchword":"poort van Efraïm","tekst":"Zo genaamd, omdat men door dezelve ging naar het land Efraïms."},{"catchword":"Hoekpoort,","tekst":"Hebreeuws, de poort des hoeks. Anders genaamd de poort der hoeken, Zec 14:10; idem, de uitziende; dat is, als een hoek uitstekende poort. Zie 2Ch 25:23, en de aantekening. Zij was zo genoemd omdat zij stond aan een hoek van de stad."},{"catchword":"ellen","tekst":"Zie Gen 6:15."}],"14":[{"catchword":"gijzelaars;","tekst":"Hebreeuws, zonen der borgtochten, of verpandingen. Versta, personen van zonderlinge afkomst en waarde, die de koning Joas uit Juda medenam, tot verzekering van toekomenden vrede."}],"19":[{"catchword":"maakten","tekst":"Te weten, in het vierde jaar na den dood van Joas, of van de regering zijns zoons Jerobeam."},{"catchword":"Lachis,","tekst":"Een stad, gelegen in de westpale van den stam van Juda. Zie van dezen Jos 10:31, en Jos 15:39."}],"20":[{"catchword":"op paarden;","tekst":"Dat is, op een wagen of koets, die van paarden getrokken of gedragen werd. Vergelijk boven, 2Ki 9:28."}],"21":[{"catchword":"het ganse volk","tekst":"Te weten, als Amazia vluchtte naar Lachis; en hieruit komt dat de elf volgende jaren der regering niet alleen Amazia, maar ook zijn zoon Azaria toegeschreven worden."},{"catchword":"Azária","tekst":"Anders genaamd Uzzia, onder, 2Ki 15:13, 2Ki 15:30; 2 Kron. 26. Onder denzelfden koning begon Jesaja te profeteren, Isa 1:1."}],"22":[{"catchword":"Elath,","tekst":"Zie van deze stad ook Deu 2:8. Azaria nu wordt gezegd die gebouwd te hebben, niet ten aanzien van de eerste grondlegging dezer stad, maar van de herbouwing derzelve, omdat zij vervallen was."},{"catchword":"de koning","tekst":"Namelijk, Amazia zijn vader."}],"23":[{"catchword":"en regeerde","tekst":"Zie van deze ingevoegde woorden, boven, 2Ki 13:1."}],"25":[{"catchword":"bracht ook weder","tekst":"Te weten, onder het gebied der koningen Israëls. Zie boven, 2Ki 13:25."},{"catchword":"Hamath,","tekst":"Zie hiervan Num 13:21, en Num 34:8."},{"catchword":"de zee","tekst":"Zie ook van deze zee Deu 3:17."},{"catchword":"den dienst","tekst":"Hebreeuws, door de hand."},{"catchword":"Jona,","tekst":"Deze is dezelfde, die van den Heere naar Ninevé gezonden werd, en wiens profetie wij bij de andere profeten in den Bijbel hebben."},{"catchword":"Gath-héfer was","tekst":"Een stad, gelegen in den stam van Zebulon; Joh 19:13."}],"26":[{"catchword":"bitter was,","tekst":"Of, wederspannig; dat is, zeer hard en zwaar, welke wederspannigheid sommigen ook duiden op Israël, als die zeer wederspannig geweest was, en daarom gestraft."},{"catchword":"opgeslotenen","tekst":"Zie van deze manier van spreken Deu 32:36; idem 1Ki 14:10; en 1Ki 21:21."}],"27":[{"catchword":"dat Hij den naam","tekst":"De Heere heeft wel kort daarna door den profeet Hosea laten voorzeggen den ondergang van het huis Israëls en de eindelijke verstoting van dit volk, gelijk men zien mag Hos 1:5-6, Hos 1:9; en heeft zulks ook dadelijk uitgevoerd, 2Ki 17:18. Maar Hij heeft dat nog op dezen tijd niet willen doen, maar door zijn grondeloze barmhartigheid Israël nog verschoond, om des verbonds wil, dat Hij met hun vaderen gemaakt had. Zie ook 2Ki 13:23."}],"28":[{"catchword":"Damaskus en Hamath,","tekst":"Deze twee steden zijn door David en Salomo gewonnen, 2Sa 8:6; en 2Ch 8:3, en daarom behoorden zij den koningen van Juda, als zij nog koningen waren over gans Israël. Maar als die daarna verloren en door de Syriërs hem afgenomen waren, 1Ki 11:24, zo heeft deze Jerobeam ze in zijn tijd weder gewonnen, niet voor de koningen van Juda, maar voor de koningen Israëls."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In the second year of Joas the son Of Joahaz the King of Israel, Amazia [Heb. Amatsiaha] the son of Joas King of Juda became King."}],"2":[{"catchword":null,"tekst":"He was five and twenty years old, [Heb. A son of twenty and five years] when he became King, and reigned nine and twenty years at Jerusalem: [In this number are comprehended the twelve years, wherein he lived a banished man at Lachis, being expelled by his own subjects, below v.19.] and his mothers name was Joaddan, [Heb. Jehohaddan] of Jerusalem."}],"3":[{"catchword":null,"tekst":"And he did that which was right in they eyes of the LORD, yet not like David his father: [That is, not with an upright heart, 2 Chron.25.2.] he did according to all that Joas his Father had done. [For as Joas in the first year of his reign, as long as Jojada the Priest lived, behaved himself well, setting up, and maintaining the pure worship of God that was decayed; but afterward by the counsel of his Princes turned aside to Idolatry, above chap.12.3. 2 Chron.24.17,18. So did Amasia also behave himself well at first, but afterward fell to Idolatry, 2 Chron.25.7,&c. and v.14,&c.]"}],"4":[{"catchword":null,"tekst":"Onely the high places were not taken away: [Compare 1 Kings 3.2. Item, above chap.12.3.] the people still offered, and burnt incense in the high places."}],"5":[{"catchword":null,"tekst":"Now it came to pass, when the Kingdom was confirmed in his hand, that he smote [That is, punished with death: see Gen.8.on v.21.] his servants, that had smitten the King hid Father. [see above chap.12. vers.20, 21.]"}],"6":[{"catchword":null,"tekst":"But the children of the murderers, he slew not; as is written in the book of the Law of Moseh, where the LORD commanded, saying; The Father shall not be put to death for the Fathers; but every man shall be put to death for his own sin. [See Deut.24.v.16. and the annotate. thereon; also Eze 18:20.]"}],"7":[{"catchword":null,"tekst":"He smote (of) the Edomites in the valley of salt [Which was in Idumea: see further hereof, 2 Sam.8.13. and Psal.60.2.] ten thousand, and took Sela [i.e. Rock. The Metropolis, or chief city of Arabia Petrea, or, the stony Arabia: which lying upon a rock, took from thence and from the country its denomination. Compare 2 Chron.25.12.] by war, and called the name thereof Jokteel, [This name may be translated the obedience of God; that is, the obedience performed to God. Amazia seemeth to have called this city thus, because he held the subduing of this city to be a reward of this disobedience, which he shewed to God, when at the Prophets command he dishanded the Israelites, which he had hired for an hundred talents, &c. See 2 Chron.25.8,9.] unto this day. [i.e. this name continued still to this very time, wherein this book was written.]"}],"8":[{"catchword":null,"tekst":"Then Amazia sent messengers to Joas the son of Joahaz the son of Jehu the King of Israel, saying; Come let us see one anothers face. [That is, let us fight with one another: so below v.11. Item, chap.23.v.29. and 2 Chron.25.v.17, and 21. It seemeth that he would revenge the death of his friends by this war undertaken, or begun by him, whereof see above chap.9.27. and 10 14. or at least the mischief and robbery done in this land by the disbanded Israelites: of which see 2 Chron. chap.25.v.13.]"}],"9":[{"catchword":null,"tekst":"But Joas King of Israel sent to Amazia King of Juda, saying; The thistle, that is in Libanon, [See 1 Kings 4.on v.33.] sent to the Cedar, that is in Libanon, saying; Give thy daughter to my son to wife; but the beast of the field, that is on Libanon, passeth by, and trod down the thistle. [The King of Israel doth here compare the King of Juda to a thistle, or thorn-bush, and himself to a Cedar-tree, his souldiers to the wild beast of Libanon, and the harm that the King of Israel was to expect to the treading down of the thistle. it is as much as if he had said: If thou (who for strength of people, and royal honour art no more to be compared to me then a poor despised thistle to a tall Cedar) hadst sued to me for peace and friendship, thou shouldest hardly have obtained it; how much less shall this hostile presumption of thine be successful unto thee? therefore, if thou art wise, desist, and keep out of harms way.]"}],"10":[{"catchword":null,"tekst":"Thou hast smitten the Edomites valiantly, [Heb. Smitting smitten: see above v.7.] therefore thine heart hath lifted thee up: take the honour, and tarry at home; for why shouldest thou mingled thy self in the evil, [viz. of war. Or, why shouldest thou mingled, or, thrust thy self (into the battle) to (thy) hurt?] that thou shouldest fall, thou, and Juda with thee? [because he would not tarry till Amazia assaults him own land, but would rather encounter with him in his.]"}],"11":[{"catchword":null,"tekst":"But Amazia hearkened not: Therefore Joas King of Israel marched up, so that he, and Amazia King of Juda looked one another in the face [That is, fought with one another. See above on v.8.] at Beth-Sanes, which is in Juda. [this Beth-Sanes here mentioned, is a city lying in the border of the tribe of Juda. Jos.15.1. allotted to the Levites, Jos.21.16. taken by the Philistines in the this beth-Sames here mentioned is a city lying in the border of the tribe of Juda, Jos.15.1. allotted to the Levites, Jos.21.16. Taken by the Philistines in the reign of Achaz, 2 Chron.28.18. Is to be distinguished from another Beth-Semes, lying in the tribe of Napthali, Judg.1.33.]"}],"12":[{"catchword":null,"tekst":"And Juda was smitten before the face of Israel; and they fled every man into his tents. [i.e. to their dwellings. See above chap.13.on v.5.]"}],"13":[{"catchword":null,"tekst":"And Joas the King Israel took Amazia the King of Juda, the son of Joas the son of Ahazia at Beth-Semes, and came to Jerusalem, from the gate of Ephraim, [so called, because they passed thorough it to the land of Ephraim] unto the corner-gate, [Heb. the gate of the corner: Otherwise called the gate of the corners, zach.14.10. Item, the gate looking out: that is, a gate striking out as it were with a corner. See 2 Chron.25.23. and the anootat. It was so called, because it stood at the corner of a city] four hundred ells. [see Genes.6.on v.15.]"}],"14":[{"catchword":null,"tekst":"And he took all the gold, and the silver, and all the vessels, that were found in the house of the LORD, and in the treasures of the Kings house, as also the hostages: [Heb. sons of suretiships, or, pledges. Understand persons of special descent and quality, which King Joas took with him out of Juda, for the securing of future peace] and he returning to Samaria."}],"15":[{"catchword":null,"tekst":"Now the rest of the acts of Joas, what he did, and his might, and how he fought against Amazia the King of Juda; are they not written in the book of the Chronicles of the Kings of Israel?"}],"16":[{"catchword":null,"tekst":"And Joas fell asleep with his Fathers, and was buried at Samaria by the Kings of Israel: And Jerobeam his son became King in his stead."}],"17":[{"catchword":null,"tekst":"New Amazia the son of Joas King of Juda lived after the death of Joas the son of Joahaz, the King of Israel, fifteen years."}],"18":[{"catchword":null,"tekst":"Now the rest of the acts Amazia; are they not written in the book of the Chronicles of the Kings of Juda?"}],"19":[{"catchword":null,"tekst":"And the made a conspiracy against him at Jerusalem, [To wit, in the fourth year after the death of Joas, or of the reign of Jerobeam his son] (so) that he fled to Lachis: but they sent after him to Lachis, [a city lying in the west-border of the tribe of Juda. See hereof Jos.10.31. and 15.39.] and put him to death there."}],"20":[{"catchword":null,"tekst":"And they brought him on horses; [That is, on a charet, Compare above chap.9.28.] and he was buried at Jerusalem, by his Fathers, in the City of David."}],"21":[{"catchword":null,"tekst":"And all the people of Juda took Azaria, [Otherwise called Uzzia, below chap.15.v.13.30. 2 Chron.26. Under this King did Isaia begim to prophesy, Isa. chap.1.1.] (who was now sixteen years old,) and made him King in the room of his Fathers Amazia. [to wit, when Amazia fled to Lachis. And hence it appeareth, that eleven following years of the reign, are not only ascribed to Amazia, but also to Azaria his son.]"}],"22":[{"catchword":null,"tekst":"He built Elath, [See likewise of this city, Deut.2.8. Now Azari is said to have built this city, not in respect of laying the first foundation thereof, but of repairing the same, because it was decayed] and brought it again to Juda, after that the King [namely, Amazia his father] was fallen asleep with his fathers."}],"23":[{"catchword":null,"tekst":"In the fifteenth year of Amazia the son of Joas King of Juda, Jerobeam the son of Joas became King over Israel at Samaria, (and reigned) [see of these inserted words, above chap.13.on v.1.] one and fourty years."}],"24":[{"catchword":null,"tekst":"And did that which was evil in the eyes of the LORD: He departed not from all the sins of Jerobeam the son of Nebat, who made Israel to sin."}],"25":[{"catchword":null,"tekst":"He brought also against [To wit, under the power and dominion of the Kings of Israel. See above chap.13.on v.25.] the border of Israel from the entering of hamath, [see hereof, Num 13:21. and 34.8.] unto the sea of the plain field, [see likewise of this sea, Deut.3.7.] according to the word of the LORD the God of Israel, which he had spoken by the ministery [Heb.hand] of his servant Jona the son of Amithei the Prophet, [this is the same prophet Jona that was sent by the LORD of Ninive, and whose prophesy we have in the bible with the other Prophets] that was of Gath-Hepher. [a city lying in the tribe of Zebulon, Jos.19.v.13.]"}],"26":[{"catchword":null,"tekst":"For the LORD saw that the misery of Israel was very bitter, [Or rebellious; that is, very hard, and grievious; which rebellion some also apply to Israel, as who were very rebellious, and were therefore punished] and that there were none shut up, nor left, [see of this phrase Deut.32.on v. 36. Item, 1 Kings.14.10. and 21.21.] and that Israel had no helper."}],"27":[{"catchword":null,"tekst":"And the LORD had not spoken that he would destroy the name of Israel from under heaven; [The LORD indeed soon after caused the ruine of the house of Israel, and the final rejection of this people to be foretold by the Prophet Hosea, as appeareth, Hos.1.v5,6,9. and likewise actually executed the same, 2 Kings 17.18. But he would not as yet do it at this time, but in his infinite mercy spared Israel as yet, because of his covenant which he had made with their Fathers. See also chap.13.23.] but he delivered them by the hand of Jerobeam the son of Joas."}],"28":[{"catchword":null,"tekst":"Now the rest of the acts of Jerobeam, and all that he did, and his might, how he warred, and how he brought Damascus, and Hamath (belonging) to Juda, again to Israel; [These two cities were subudued by David and Salomon, 2 Sam.8.6. and 2 Chron.8.3. And therefore belonged to the Kings of Juda, when they were yet Kings over all Israel. But when afterward they were loft, and taken away by them from the Syrians, 1 King.11.24. this Jerobeam in his time recovered them again, not for the Kings of Juda, but for the Kings of Israel] are they not written in the book of the Chronicles of the Kings of Israel?"}],"29":[{"catchword":null,"tekst":"And Jerobeam fell asleep with his Fathers, with the Kings of Israel: and his Zacharia became King in his Stead."}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
