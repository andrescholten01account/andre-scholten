.", "2": "En de HEERE zond tegen hem de benden van de Chaldeeën, en de benden van de Syriërs, en de benden van de Moabieten, en de benden van de kinderen van Ammon, en zond hen tegen Juda, om dat te verwoesten, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaren, de profeten.", "3": "Zeker gebeurde *dit* op bevel van de HEERE tegen Juda, dat Hij hen van Zijn aangezicht wegdeed, om de zonden van Manasse, naar alles wat hij gedaan had;", "4": "Als ook *om* het onschuldige bloed dat hij vergoten had, zodat hij Jeruzalem met onschuldig bloed vervuld had; daarom wilde de HEERE niet vergeven.", "5": "Het overige nu van de geschiedenis van Jojakim, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "6": "En Jojakim ontsliep met zijn vaderen; en zijn zoon Jojachin werd koning in zijn plaats.", "7": "De koning van Egypte trok voortaan niet meer uit zijn land; want de koning van Babel had, van de rivier van Egypte af tot aan de rivier de Eufraat, alles ingenomen wat van de koning van Egypte was.", "8": "Jojachin was achttien jaar oud toen hij koning werd, en regeerde drie maanden in Jeruzalem; en de naam van zijn moeder was Nehusta, een dochter van Elnathan, uit Jeruzalem.", "9": "En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vader gedaan had.", "10": "In die tijd trokken de dienaren van Nebukadnezar, de koning van Babel, naar Jeruzalem; en de stad werd belegerd.", "11": "Zelfs kwam Nebukadnezar, de koning van Babel, tegen de stad, terwijl zijn dienaren die belegerden.", "12": "Toen ging Jojachin, de koning van Juda, naar de koning van Babel, hij, en zijn moeder, en zijn dienaren, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem *gevangen* in het achtste jaar van zijn regering.", "13": "En hij bracht van daar al de schatten van het huis van de HEERE, en de schatten van het huis van de koning; en hij hakte alle gouden vaten stuk die Salomo, de koning van Israël, in de tempel van de HEERE gemaakt had, zoals de HEERE gesproken had.", "14": "En hij voerde heel Jeruzalem weg, alsook al de vorsten, en alle strijdbare helden, tienduizend gevangenen, en alle timmerlieden en smeden; niemand werd overgelaten, dan het arme volk van het land.", "15": "Zo voerde hij Jojachin weg naar Babel, alsook de moeder van de koning, en de vrouwen van de koning, en zijn hovelingen; daartoe bracht hij de machtigen van het land gevangen van Jeruzalem naar Babel;", "16": "En alle sterke mannen, tot zevenduizend, en timmerlieden en smeden, tot duizend, *en* alle helden, die geoefend waren voor de oorlog; dezen bracht de koning van Babel gevangen naar Babel.", "17": "En de koning van Babel maakte Mattanja, diens oom, koning in zijn plaats, en veranderde zijn naam in Zedekia.", "18": "Zedekia was eenentwintig jaar oud toen hij koning werd, en hij regeerde elf jaar in Jeruzalem; en de naam van zijn moeder was Hamutal, een dochter van Jeremia, uit Libna.", "19": "En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat Jojakim gedaan had.", "20": "Want het gebeurde, vanwege de toorn van de HEERE tegen Jeruzalem en tegen Juda, totdat Hij hen van Zijn aangezicht weggeworpen had. En Zedekia kwam in opstand tegen de koning van Babel."}, "SV": {"1": "In zijn dagen toog Nebukadnezar, de koning van Babel, op, en Jojakim werd zijn knecht drie jaren; daarna keerde hij zich om, en rebelleerde tegen hem.", "2": "En de HEERE zond tegen hem de benden der Chaldeen, en de benden der Syriërs, en de benden der Moabieten, en de benden der kinderen Ammons, en zond hen tegen Juda, om dat te verderven, naar het woord des HEEREN, dat Hij gesproken had door den dienst Zijner knechten, de profeten.", "3": "Zekerlijk geschiedde *dit* naar het bevel des HEEREN tegen Juda, dat Hij hen van Zijn aangezicht wegdeed, om de zonden van Manasse, naar alles, wat hij gedaan had;", "4": "Als ook *om* het onschuldig bloed, dat hij vergoten had, zodat hij Jeruzalem met onschuldig bloed vervuld had; daarom wilde de HEERE niet vergeven.", "5": "Het overige nu der geschiedenissen van Jojakim, en al wat hij gedaan heeft, is dat niet geschreven in het boek der kronieken der koningen van Juda?", "6": "En Jojakim ontsliep met zijn vaderen; en zijn zoon Jojachin werd koning in zijn plaats.", "7": "De koning nu van Egypte toog voortaan niet meer uit zijn land; want de koning van Babel had, van de rivier van Egypte af tot aan de rivier Frath, ingenomen al wat van den koning van Egypte was.", "8": "Jojachin was achttien jaren oud, toen hij koning werd, en regeerde drie maanden te Jeruzalem; en de naam zijner moeder was Nehusta, een dochter van Elnathan, van Jeruzalem.", "9": "En hij deed dat kwaad was in de ogen des HEEREN, naar alles, wat zijn vader gedaan had.", "10": "Te dier tijd togen de knechten van Nebukadnezar, den koning van Babel, naar Jeruzalem; en de stad werd belegerd.", "11": "Zelfs kwam Nebukadnezar, de koning van Babel, tegen de stad, als zijn knechten die belegerden.", "12": "Toen ging Jojachin, de koning van Juda, uit tot den koning van Babel, hij, en zijn moeder, en zijn knechten, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem *gevangen* in het achtste jaar zijner regering.", "13": "En hij bracht van daar uit al de schatten van het huis des HEEREN, en de schatten van het huis des konings; en hij hieuw alle gouden vaten af, die Salomo, de koning van Israël, in den tempel des HEEREN gemaakt had, gelijk als de HEERE gesproken had.", "14": "En hij voerde gans Jeruzalem weg, mitsgaders al de vorsten, en alle strijdbare helden, tien duizend gevangen, en alle timmerlieden en smeden; niemand werd overgelaten, dan het arme volk des lands.", "15": "Zo voerde hij Jojachin weg naar Babel, mitsgaders des konings moeder, en des konings vrouwen, en zijn hovelingen; daartoe de machtigen des lands bracht hij gevankelijk van Jeruzalem naar Babel;", "16": "En alle kloeke mannen tot zeven duizend, en timmerlieden en smeden tot een duizend, *en* alle helden, die ten oorlog geoefend waren; dezen bracht de koning van Babel gevankelijk naar Babel.", "17": "En de koning van Babel maakte Mattanja, deszelfs oom, koning in plaats van hem, en veranderde zijn naam in Zedekia.", "18": "Zedekia was een en twintig jaren oud, als hij koning werd, en hij regeerde elf jaren te Jeruzalem; en de naam zijner moeder was Hamutal, een dochter van Jeremia, van Libna.", "19": "En hij deed dat kwaad was in de ogen des HEEREN, naar alles, wat Jojakim gedaan had.", "20": "Want het geschiedde, om den toorn des HEEREN tegen Jeruzalem en tegen Juda, totdat Hij hen van Zijn aangezicht weggeworpen had. En Zedekia rebelleerde tegen den koning van Babel."}, "KJV": {"1": "In his days Nebuchadnezzar king of Babylon came up, and Jehoiakim became his servant three years: then he turned and rebelled against him.", "2": "And the LORD sent against him bands of the Chaldees, and bands of the Syrians, and bands of the Moabites, and bands of the children of Ammon, and sent them against Judah to destroy it, according to the word of the LORD, which he spake by his servants the prophets.", "3": "Surely at the commandment of the LORD came this upon Judah, to remove them out of his sight, for the sins of Manasseh, according to all that he did;", "4": "And also for the innocent blood that he shed: for he filled Jerusalem with innocent blood; which the LORD would not pardon.", "5": "Now the rest of the acts of Jehoiakim, and all that he did, are they not written in the book of the chronicles of the kings of Judah?", "6": "So Jehoiakim slept with his fathers: and Jehoiachin his son reigned in his stead.", "7": "And the king of Egypt came not again any more out of his land: for the king of Babylon had taken from the river of Egypt unto the river Euphrates all that pertained to the king of Egypt.", "8": "Jehoiachin was eighteen years old when he began to reign, and he reigned in Jerusalem three months. And his mother's name was Nehushta, the daughter of Elnathan of Jerusalem.", "9": "And he did that which was evil in the sight of the LORD, according to all that his father had done.", "10": "At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem, and the city was besieged.", "11": "And Nebuchadnezzar king of Babylon came against the city, and his servants did besiege it.", "12": "And Jehoiachin the king of Judah went out to the king of Babylon, he, and his mother, and his servants, and his princes, and his officers: and the king of Babylon took him in the eighth year of his reign.", "13": "And he carried out thence all the treasures of the house of the LORD, and the treasures of the king's house, and cut in pieces all the vessels of gold which Solomon king of Israel had made in the temple of the LORD, as the LORD had said.", "14": "And he carried away all Jerusalem, and all the princes, and all the mighty men of valour, even ten thousand captives, and all the craftsmen and smiths: none remained, save the poorest sort of the people of the land.", "15": "And he carried away Jehoiachin to Babylon, and the king's mother, and the king's wives, and his officers, and the mighty of the land, those carried he into captivity from Jerusalem to Babylon.", "16": "And all the men of might, even seven thousand, and craftsmen and smiths a thousand, all that were strong and apt for war, even them the king of Babylon brought captive to Babylon.", "17": "And the king of Babylon made Mattaniah his father's brother king in his stead, and changed his name to Zedekiah.", "18": "Zedekiah was twenty and one years old when he began to reign, and he reigned eleven years in Jerusalem. And his mother's name was Hamutal, the daughter of Jeremiah of Libnah.", "19": "And he did that which was evil in the sight of the LORD, according to all that Jehoiakim had done.", "20": "For through the anger of the LORD it came to pass in Jerusalem and Judah, until he had cast them out from his presence, that Zedekiah rebelled against the king of Babylon."}}, "tsk": {"1": [{"kopje": "zijn dagen", "refs": ["2 Kon 17:5", "2 Kron 36:6-21", "Jer 25:1", "Jer 25:9", "Jer 46:2", "Dan 1:1"]}], "2": [{"kopje": "de HEERE", "refs": ["2 Kon 6:23", "2 Kon 13:20", "2 Kon 13:21", "Deut 28:49", "Deut 28:50", "2 Kron 33:11", "Job 1:17", "Jes 7:17", "Jes 13:5", "Jer 35:11", "Ezech 19:8"]}, {"kopje": "naar", "refs": ["2 Kon 20:17", "2 Kon 21:12-14", "2 Kon 23:27", "Jes 6:11", "Jes 6:12", "Jer 25:9", "Jer 26:6", "Jer 26:20", "Jer 32:28", "Micha 3:12"]}], "3": [{"kopje": "Zeker", "refs": ["2 Kon 18:25", "Gen 50:20", "2 Kron 24:24", "2 Kron 25:16", "Jes 10:5", "Jes 10:6", "Jes 45:7", "Jes 46:10", "Jes 46:11", "Amos 3:6"]}, {"kopje": "wegdeed", "refs": ["2 Kon 23:26", "2 Kon 23:27", "Lev 26:33-35", "Deut 4:26", "Deut 4:27", "Deut 28:63", "Deut 29:28", "Joz 23:15", "Jer 15:1-4", "Micha 2:10"]}, {"kopje": "om de zonden", "refs": ["2 Kon 21:2-11", "Ex 20:5"]}], "4": [{"kopje": "om het onschuldige", "refs": ["2 Kon 21:16", "Num 35:33", "Deut 19:10", "Jer 2:34", "Jer 19:4"]}, {"kopje": "vervuld had", "refs": ["Ps 106:38"]}, {"kopje": "dat", "refs": ["Jer 15:1", "Jer 15:2", "Klaagl 3:42", "Ezech 33:25"]}], "5": [{"kopje": "het overige", "refs": ["2 Kron 36:8", "Jer 22:13-17", "Jer 26:1", "Jer 36:32"]}], "6": [{"kopje": "ontsliep", "refs": ["2 Kron 36:6", "2 Kron 36:8", "Jer 22:18", "Jer 22:19", "Jer 36:30"]}, {"kopje": "Jojachin", "refs": ["Jer 36:30"]}], "7": [{"kopje": "de koning", "refs": ["Jer 37:5-7", "Jer 46:2"]}, {"kopje": "van de rivier", "refs": ["Gen 15:18", "Num 34:5", "Joz 15:4", "1 Kon 4:21", "Jes 27:12"]}], "8": [{"kopje": "Jojachin", "refs": ["1 Kron 3:16", "Jer 24:1", "Jer 22:24", "Jer 22:28", "Jer 37:1", "Matt 1:11", "Matt 1:12"]}, {"kopje": "achttien jaar", "refs": ["2 Kron 36:9"]}], "9": [{"kopje": "naar alles", "refs": ["2 Kon 24:19", "2 Kron 36:12"]}], "10": [{"kopje": "In die tijd", "refs": ["Dan 1:1", "Dan 1:2"]}, {"kopje": "werd belegerd", "refs": ["2 Kon 25:2"]}], "12": [ : null}, {"disp": "Ezech 17:12-21", "href": "../../ezechiel/17/#v12", "ref": "Ezech 17:12-21", "svLabel": null}], "kinderen": []}, {"label": "The evil reign of", "href": "../../nave/z/?hl=2Kgs.24.20#i22576", "refs": [{"disp": "2 Kon 24:19", "href": "../../2-koningen/24/#v19", "ref": "2 Kon 24:19", "svLabel": null}, {"disp": "2 Kon 24:20", "href": "../../2-koningen/24/#v20", "ref": "2 Kon 24:20", "svLabel": null}, {"disp": "2 Kron 36:12", "href": "../../2-kronieken/36/#v12", "ref": "2 Kron 36:12", "svLabel": null}, {"disp": "2 Kron 36:13", "href": "../../2-kronieken/36/#v13", "ref": "2 Kron 36:13", "svLabel": null}, {"disp": "Jer 37:2", "href": "../../jeremia/37/#v2", "ref": "Jer 37:2", "svLabel": null}, {"disp": "Jer 38:5", "href": "../../jeremia/38/#v5", "ref": "Jer 38:5", "svLabel": null}, {"disp": "Jer 38:19", "href": "../../jeremia/38/#v19", "ref": "Jer 38:19", "svLabel": null}, {"disp": "Jer 38:24-26", "href": "../../jeremia/38/#v24", "ref": "Jer 38:24-26", "svLabel": null}, {"disp": "Jer 52:2", "href": "../../jeremia/52/#v2", "ref": "Jer 52:2", "svLabel": null}], "kinderen": []}]}]}], "torrey": [{"topic": "Babylon", "href": "../../torrey/b/#t-babylon", "kinderen": [{"label": "Nebuchadnezzar King Of", "href": "../../torrey/b/?hl=2Kgs.24.20#i1425", "refs": [], "kinderen": [{"label": "Rebelled against by Zedekiah", "href": "../../torrey/b/?hl=2Kgs.24.20#i1431", "refs": [{"disp": "2 Kon 24:20", "href": "../../2-koningen/24/#v20", "ref": "2 Kon 24:20", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Jer 36:30": "Daarom zegt de HEERE zo van Jojakim, de koning van Juda: Hij zal niemand hebben die op de troon van David zit; en zijn dode lichaam zal weggeworpen worden, overdag in de hitte, en 's nachts in de vorst.", "2 Kon 21:12-14": "Daarom, zo zegt de HEERE, de God van Israël: Zie, Ik ga een kwaad over Jeruzalem en Juda brengen, zodat ieder die het hoort, beide zijn oren zullen tuiten. En Ik zal over Jeruzalem het meetsnoer van Samaria trekken, alsook het paslood van het huis van Achab; en Ik zal Jeruzalem uitwissen, zoals men een schotel uitwist; men wist hem uit, en men keert hem om op zijn holle kant. En Ik zal het overblijfsel van Mijn erfdeel verlaten, en zal het in de hand van hun vijanden geven; en zij zullen tot een roof en plundering worden voor al hun vijanden.", "Jer 15:1": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan.", "2 Kron 36:4-8": "En de koning van Egypte maakte zijn broer Eljakim koning over Juda en Jeruzalem, en veranderde zijn naam in Jojakim; maar zijn broer Joahaz nam Necho mee, en bracht hem naar Egypte. Vijfentwintig jaar was Jojakim oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem; en hij deed wat slecht was in de ogen van de HEERE, zijn God. Nebukadnezar, de koning van Babel, trok tegen hem op, en bond hem met twee koperen ketenen, om hem naar Babel te voeren.", "Ezech 1:2": "Op de vijfde dag van die maand (dit was het vijfde jaar van de wegvoering van koning Jojachin),", "Jer 25:1": "Het woord dat tot Jeremia gebeurd is over het hele volk van Juda, in het vierde jaar van Jojakim, zoon van Josia, koning van Juda (dit was het eerste jaar van Nebukadnezar, koning van Babel);", "Jer 47:1": "Het woord van de HEERE dat gebeurde tot de profeet Jeremia, tegen de Filistijnen; voordat Farao Gaza sloeg.", "Dan 1:2": "En de Heere gaf Jojakim, de koning van Juda, in zijn hand, alsook een deel van de voorwerpen van het huis van God; en hij bracht ze naar het land Sinear, naar het huis van zijn god; en de voorwerpen bracht hij naar het schathuis van zijn god.", "Jer 39:5": "Maar het leger van de Chaldeeën jaagde hen achterna; en zij achterhaalden Zedekia in de vlakke velden van Jericho, en vingen hem, en brachten hem naar boven tot Nebukadrezar, de koning van Babel, naar Ribla, in het land van Hamath; die sprak oordelen tegen hem uit.", "Jer 40:7": "Toen nu alle aanvoerders van de legers die in het veld waren, zij en hun mannen, hoorden dat de koning van Babel Gedalia, de zoon van Ahikam, over het land aangesteld had, en dat hij aan hem had toevertrouwd de mannen, en de vrouwen, en de kinderen, en de armsten van het land, van hen die niet naar Babel gevankelijk waren weggevoerd,", "Jer 52:28-30": "Dit is het volk dat Nebukadrezar gevankelijk heeft weggevoerd: in het zevende jaar, drieduizend drieëntwintig Joden; In het achttiende jaar van Nebukadrezar voerde hij gevankelijk weg achthonderdtweeëndertig zielen uit Jeruzalem; In het drieëntwintigste jaar van Nebukadrezar voerde Nebuzaradan, de leider van de lijfwacht, gevankelijk weg van de Joden zevenhonderdvijfenveertig zielen. Alle zielen zijn vierduizend zeshonderd.", "2 Kon 23:34": "Ook maakte Farao Necho Eljakim, de zoon van Josia, koning, in de plaats van zijn vader Josia, en veranderde zijn naam in Jojakim; maar Joahaz nam hij mee, en hij kwam in Egypte, en stierf daar.", "2 Kon 18:11": "En de koning van Assyrië voerde Israël weg naar Assyrië, en liet hen wonen in Halah, en in Habor, bij de rivier Gozan, en in de steden der Meden.", "2 Kron 24:24": "Hoewel het leger van Syrië met weinig mannen kwam, gaf de HEERE toch in hun hand een leger van zeer grote omvang, omdat zij de HEERE, de God van hun vaderen, verlaten hadden; zo voerden zij de oordelen uit tegen Joas.", "Jer 36:32": "Jeremia dan nam een andere rol, en gaf ze aan de schrijver Baruch, de zoon van Nerija; die schreef daarop, uit de mond van Jeremia, alle woorden van het boek dat Jojakim, de koning van Juda, met vuur verbrand had; en er werden nog veel woorden van dezelfde soort aan toegevoegd.", "2 Kron 36:6-21": "Nebukadnezar, de koning van Babel, trok tegen hem op, en bond hem met twee koperen ketenen, om hem naar Babel te voeren. Nebukadnezar bracht ook een deel van de voorwerpen van het huis van de HEERE naar Babel, en zette ze in zijn tempel te Babel. Het overige nu van de geschiedenis van Jojakim, en zijn gruwelen die hij deed, en wat er tegen hem gevonden werd, zie, dat is geschreven in het boek van de koningen van Israël en Juda; en Jojachin, zijn zoon, werd koning in zijn plaats.", "Ezech 17:12": "Zeg nu tegen dat opstandige huis: Weet u niet wat deze dingen betekenen? Zeg: Zie, de koning van Babel is naar Jeruzalem gekomen, en heeft haar koning genomen, en haar vorsten, en heeft ze naar zich toe gevoerd naar Babel.", "Jer 15:2": "En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap!", "Jes 7:17": "Maar de HEERE zal over u, en over uw volk, en over het huis van uw vader, dagen doen komen, wat voor dagen niet gekomen zijn vanaf de dag dat Efraïm van Juda is afgeweken, door de koning van Assyrië.", "Jer 2:34": "Ja, het bloed van de zielen van de onschuldige behoeftigen is in uw zomen gevonden; Ik heb dat niet door opgraven gevonden, maar aan dat alles.", "Jer 28:4": "Ook zal Ik Jechonia, de zoon van Jojakim, koning van Juda, en allen die gevankelijk uit Juda zijn weggevoerd, die in Babel gekomen zijn, naar deze plaats terugbrengen, spreekt de HEERE; want Ik zal het juk van de koning van Babel verbreken.", "2 Tess 2:9-11": "hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden. En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven;", "Jes 27:12": "En het zal op die dag gebeuren, dat de HEERE zal dorsen, van de stroom van de rivier af tot aan de rivier van Egypte; maar u zult opgeraapt worden, één voor één, o kinderen van Israël!", "2 Kon 24:14-16": "En hij voerde heel Jeruzalem weg, alsook al de vorsten, en alle strijdbare helden, tienduizend gevangenen, en alle timmerlieden en smeden; niemand werd overgelaten, dan het arme volk van het land. Zo voerde hij Jojachin weg naar Babel, alsook de moeder van de koning, en de vrouwen van de koning, en zijn hovelingen; daartoe bracht hij de machtigen van het land gevangen van Jeruzalem naar Babel; En alle sterke mannen, tot zevenduizend, en timmerlieden en smeden, tot duizend, en alle helden, die geoefend waren voor de oorlog; dezen bracht de koning van Babel gevangen naar Babel.", "Gen 15:18": "Op dezelfde dag maakte de HEERE een verbond met Abram, en Hij zei: Aan uw nageslacht heb Ik dit land gegeven, van de rivier van Egypte af, tot aan die grote rivier, de rivier de Eufraat:", "Deut 28:49": "De HEERE zal tegen u een volk laten opkomen van ver, van het einde van de aarde, zoals een arend vliegt; een volk waarvan u de taal niet zult verstaan;", "2 Kron 36:17-21": "Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch de meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand. En alle voorwerpen van het huis van God, de grote en de kleine, en de schatten van het huis van de HEERE, en de schatten van de koning en zijn vorsten, dit alles bracht hij naar Babel. En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Jer 39:10": "Maar van het volk dat arm was, dat niets had, liet Nebuzaradan, de aanvoerder van de lijfwacht, sommigen achter in het land van Juda; en hij gaf hun op die dag wijngaarden en akkers.", "Jer 29:2": "(Nadat koning Jechonia, en de koningin, en de kamerlingen, de vorsten van Juda en Jeruzalem, alsook de timmerlieden en smeden van Jeruzalem waren weggegaan);", "Ezra 1:7": "Ook bracht koning Kores de voorwerpen van het huis van de HEERE naar buiten, die Nebukadnezar uit Jeruzalem had weggehaald, en in het huis van zijn god had gezet.", "Jer 20:5": "Ook zal Ik al het bezit van deze stad geven, en al haar opbrengst, en al haar kostbaarheden, en alle schatten van de koningen van Juda, Ik zal ze geven in de hand van hun vijanden, die zullen ze roven, ze meenemen en ze naar Babel brengen.", "Ezech 19:8": "Toen keerden de volken zich van rondom tegen hem, uit de landschappen, en zij spreidden hun net over hem uit; in hun kuil werd hij gegrepen.", "Ezra 1:7-11": "Ook bracht koning Kores de voorwerpen van het huis van de HEERE naar buiten, die Nebukadnezar uit Jeruzalem had weggehaald, en in het huis van zijn god had gezet. En Kores, de koning van Perzië, liet ze uitgeven door de hand van Mithredath, de schatmeester, die ze overhandigde aan Sesbazar, de vorst van Juda, na ze geteld te hebben. En dit is hun aantal: dertig gouden bekkens, duizend zilveren bekkens, negenentwintig messen;", "2 Kon 23:31": "Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem; en de naam van zijn moeder was Hamutal, de dochter van Jeremia, van Libna.", "Ezech 17:15-20": "Maar hij kwam tegen hem in opstand, door zijn boden naar Egypte te zenden, opdat men hem paarden en veel volk bezorgen zou; zal hij gedijen? Zal hij ontkomen, die zulke dingen doet? Ja, zal hij het verbond breken en ontkomen? Zo waarachtig als Ik leef, spreekt de Heere HEERE, hij zal sterven in de plaats van de koning die hem koning gemaakt heeft, wiens eed hij veracht heeft, en wiens verbond hij gebroken heeft — bij hem, midden in Babel! Ook zal farao, met een groot leger en een grote menigte van het krijgsvolk, niets voor hem uitrichten in de oorlog, wanneer men een wal zal opwerpen, en wanneer men vestingen zal bouwen, om veel mensenlevens uit te roeien.", "1 Kon 4:21": "En Salomo heerste over al de koninkrijken, van de rivier tot het land van de Filistijnen, en tot aan het gebied van Egypte; die brachten geschenken, en dienden Salomo al de dagen van zijn leven.", "2 Kon 24:6-8": "En Jojakim ontsliep met zijn vaderen; en zijn zoon Jojachin werd koning in zijn plaats. De koning van Egypte trok voortaan niet meer uit zijn land; want de koning van Babel had, van de rivier van Egypte af tot aan de rivier de Eufraat, alles ingenomen wat van de koning van Egypte was. Jojachin was achttien jaar oud toen hij koning werd, en regeerde drie maanden in Jeruzalem; en de naam van zijn moeder was Nehusta, een dochter van Elnathan, uit Jeruzalem.", "Joz 13:3": "Van de Sichor af, die voor aan Egypte is, tot aan de grens van Ekron toe naar het noorden, dat aan de Kanaänieten toegerekend wordt; vijf vorsten van de Filistijnen, de Gazatiet en de Asdodiet, de Askeloniet, de Gathiet en de Ekroniet, en de Avvieten.", "Dan 5:3": "Toen bracht men de gouden vaten, die men uit de tempel van het huis van God, die te Jeruzalem geweest was, weggevoerd had; en de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen dronken daaruit.", "Joz 15:4": "en gaat door naar Azmon, en komt uit aan de beek van Egypte; en de uitgangen van dit gebied zullen naar de zee zijn. Dit zal uw grens tegen het zuiden zijn.", "Ps 106:38": "En zij hebben onschuldig bloed vergoten, het bloed van hun zonen en hun dochters, die zij aan de afgoden van Kanaän hebben opgeofferd; zodat het land door deze bloedschuld ontheiligd is geworden.", "Jer 38:17": "Jeremia dan zei tegen Zedekia: Zo zegt de HEERE, de God van de heerscharen, de God van Israël: Als u gewillig naar de vorsten van de koning van Babel uitgaat, dan zal uw leven behouden blijven, en deze stad zal niet met vuur verbrand worden; en u zult leven, u en uw huis.", "1 Sam 23:19-22": "Toen trokken de Zifieten op naar Saul in Gibea, en zeiden: Heeft David zich niet bij ons verborgen in de vestingen in het woud, op de heuvel van Hachila, die ten zuiden van de wildernis ligt? Nu dan, o koning, kom spoedig af, geheel naar de wens van uw hart; en het is onze taak hem over te geven in de hand van de koning. Toen zei Saul: Gezegend bent u door de HEERE, dat u medelijden met mij hebt gehad!", "Est 2:6": "die weggevoerd was uit Jeruzalem met de weggevoerden, die weggevoerd waren met Jechonia, de koning van Juda, die Nebukadnezar, de koning van Babel, had weggevoerd.", "Ezech 21:25": "En u, o onheilige, goddeloze vorst van Israël, wiens dag komen zal, in de tijd van de uiterste ongerechtigheid;", "Jes 10:5": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand!", "2 Kron 36:11-21": "Eenentwintig jaar was Zedekia oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem. En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE. Daarbij werd hij ook afvallig tegen koning Nebukadnezar, die hem bij God had beëdigd; en hij verhardde zijn nek, en verstokte zijn hart, zodat hij zich niet bekeerde tot de HEERE, de God van Israël.", "Jer 38:18": "Maar als u naar de vorsten van de koning van Babel niet uitgaat, dan zal deze stad gegeven worden in de hand van de Chaldeeën, en zij zullen haar met vuur verbranden; ook zult u zelf uit hun hand niet ontkomen.", "Jer 1:3": "Ook kwam het tot hem in de dagen van Jojakim, zoon van Josia, koning van Juda, totdat het elfde jaar van Zedekia, zoon van Josia, koning van Juda, voleindigd werd; totdat Jeruzalem gevankelijk werd weggevoerd in de vijfde maand.", "Jes 23:12": "En Hij heeft gezegd: U zult niet meer vrolijk huppelen, o u verdrukte maagd, dochter van Sidon! Maak u op naar Chittim, vaar over; ook daar zult u geen rust hebben.", "Jer 26:20": "Er was ook een man, die in de Naam van de HEERE profeteerde, Uria, de zoon van Semaja, van Kirjath-jearim; die profeteerde tegen deze stad en tegen dit land, naar al de woorden van Jeremia.", "2 Kon 24:17-25": "En de koning van Babel maakte Mattanja, diens oom, koning in zijn plaats, en veranderde zijn naam in Zedekia. Zedekia was eenentwintig jaar oud toen hij koning werd, en hij regeerde elf jaar in Jeruzalem; en de naam van zijn moeder was Hamutal, een dochter van Jeremia, uit Libna. En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat Jojakim gedaan had.", "Jer 27:20": "die Nebukadnezar, de koning van Babel, niet heeft weggenomen, toen hij Jechonia, de zoon van Jojakim, koning van Juda, van Jeruzalem naar Babel gevankelijk wegvoerde, alsook alle edelen van Juda en Jeruzalem;", "Jer 15:1-4": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan. En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap! Want Ik zal een bezoeking over hen brengen met vier soorten straf, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te verscheuren; en met het gevogelte van de hemel, en met het gedierte van de aarde, om op te eten en te vernietigen.", "2 Kron 4:7-22": "Hij maakte ook tien gouden kandelaars, naar hun wijze, en hij zette ze in de tempel, vijf aan de rechterhand, en vijf aan de linkerhand. Ook maakte hij tien tafels, en hij zette ze in de tempel, vijf aan de rechterhand, en vijf aan de linkerhand; en hij maakte honderd gouden sprenkelschalen. Verder maakte hij het voorhof van de priesters, en het grote voorhof, alsook de deuren voor het voorhof, en overtrok hun deuren met koper.", "Deut 28:50": "Een volk, hard van gezicht, dat geen ontzag zal hebben voor de oude, noch genadig zal zijn voor de jonge.", "Jer 22:24-28": "Zo waarachtig als Ik leef, spreekt de HEERE, al was Chonia, de zoon van Jojakim, de koning van Juda, een zegelring aan Mijn rechterhand, toch zal Ik u vandaar wegrukken. En Ik zal u geven in de hand van hen die uw leven zoeken, en in de hand van hen voor wier gezicht u beeft, namelijk in de hand van Nebukadnezar, de koning van Babel, en in de hand van de Chaldeeën. En Ik zal u, en uw moeder, die u gebaard heeft, wegwerpen in een ander land, waarin u niet geboren bent, en daar zult u sterven.", "Jes 6:11": "Toen zei ik: Hoe lang, Heere? En Hij zei: Totdat de steden verwoest worden, zodat er geen inwoner meer is, en de huizen, zodat er geen mens meer is, en het land met verwoesting verstrooid wordt.", "Micha 2:10": "Maak u dan op en ga heen; want dit land zal de rust niet zijn; omdat het verontreinigd is, zal het u verderven, en dat met een hevige verderving.", "Num 35:33": "Zo zult u het land niet ontheiligen waarin u woont; want het bloed ontheiligt het land; en voor het land kan geen verzoening gedaan worden voor het bloed dat daarin vergoten is, dan door het bloed van hem die het vergoten heeft.", "Amos 3:6": "Zal de bazuin in de stad geblazen worden, zonder dat het volk sidddert? Zal er een kwaad in de stad zijn, dat de HEERE niet doet?", "2 Kon 25:2": "Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia.", "Jes 23:13": "Zie, het land van de Chaldeeën; dit volk bestond niet; Assur heeft het gegrondvest voor hen die in de wildernissen woonden; zij richtten hun vestingtorens op, en bouwden hun paleizen, maar Hij heeft het tot een vervallen puinhoop gemaakt.", "Jer 27:12-15": "Daarna sprak ik tot Zedekia, de koning van Juda, naar al deze woorden, en zei: Breng uw halzen onder het juk van de koning van Babel, en dien hem en zijn volk, dan zult u leven. Waarom zou u sterven, u en uw volk, door het zwaard, door de honger en door de pest, zoals de HEERE gesproken heeft over het volk dat de koning van Babel niet zal dienen? Luister dan niet naar de woorden van de profeten die tegen u spreken en zeggen: U zult de koning van Babel niet dienen; want zij profeteren u leugens.", "Jes 64:11": "Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Jer 38:5": "En de koning Zedekia zei: Zie, hij is in uw hand; want de koning kan niets tegen u.", "2 Kon 23:29-35": "In zijn dagen trok Farao Necho, de koning van Egypte, op tegen de koning van Assyrië, naar de rivier de Frath; en koning Josia trok hem tegemoet, en Necho doodde hem te Megiddo, toen hij hem gezien had. En zijn knechten voerden hem dood op een wagen van Megiddo, en brachten hem naar Jeruzalem, en begroeven hem in zijn graf; en het volk van het land nam Joahaz, de zoon van Josia, en zalfde hem, en maakte hem koning in de plaats van zijn vader. Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem; en de naam van zijn moeder was Hamutal, de dochter van Jeremia, van Libna.", "Matt 1:11": "en Josia verwekte Jechonia en zijn broers, ten tijde van de Babylonische wegvoering.", "2 Kon 23:34-37": "Ook maakte Farao Necho Eljakim, de zoon van Josia, koning, in de plaats van zijn vader Josia, en veranderde zijn naam in Jojakim; maar Joahaz nam hij mee, en hij kwam in Egypte, en stierf daar. En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven. Vijfentwintig jaar was Jojakim oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem; en de naam van zijn moeder was Zebudda, een dochter van Pedaja, van Ruma.", "Jer 29:1": "Verder zijn dit de woorden van de brief die de profeet Jeremia zond van Jeruzalem naar de overige oudsten die gevankelijk waren weggevoerd, alsook naar de priesters, naar de profeten en naar heel het volk dat Nebukadnezar van Jeruzalem gevankelijk had weggevoerd naar Babel.", "Deut 4:27": "En de HEERE zal u verstrooien onder de volken; en u zult met weinigen in getal overblijven onder de heidenvolken waarheen de HEERE u zal leiden.", "Luk 12:10": "En ieder die een woord spreken zal tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest gelasterd zal hebben, die zal het niet vergeven worden.", "2 Kon 24:11-16": "Zelfs kwam Nebukadnezar, de koning van Babel, tegen de stad, terwijl zijn dienaren die belegerden. Toen ging Jojachin, de koning van Juda, naar de koning van Babel, hij, en zijn moeder, en zijn dienaren, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem gevangen in het achtste jaar van zijn regering. En hij bracht van daar al de schatten van het huis van de HEERE, en de schatten van het huis van de koning; en hij hakte alle gouden vaten stuk die Salomo, de koning van Israël, in de tempel van de HEERE gemaakt had, zoals de HEERE gesproken had.", "2 Kron 36:19": "En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "1 Kron 3:16": "De kinderen van Jojakim nu waren: Jechonia zijn zoon, Zedekia zijn zoon.", "2 Kron 36:9": "Acht jaar was Jojachin oud, toen hij koning werd, en hij regeerde drie maanden en tien dagen te Jeruzalem, en deed wat slecht was in de ogen van de HEERE.", "Jer 46:2": "Tegen Egypte; tegen het leger van Farao Necho, koning van Egypte, dat aan de rivier Frath, bij Karchemis was, dat Nebukadrezar, de koning van Babel, sloeg, in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda.", "2 Kron 35:20-24": "Na dit alles, toen Josia het huis gereedgemaakt had, trok Necho, de koning van Egypte, op, om te strijden tegen Karchemis, aan de Frath; en Josia trok uit hem tegemoet. Toen zond hij boden naar hem, en zei: Wat heb ik met u te doen, u, koning van Juda? Wat u aangaat, ik ben heden niet tegen u, maar tegen een huis, dat oorlog voert tegen mij; en God heeft gezegd, dat ik mij haasten zou; houd u af van God, Die met mij is, opdat Hij u niet verderft. Doch Josia keerde zijn aangezicht niet van hem; maar hij vermomde zich, om tegen hem te strijden, en hoorde niet naar de woorden van Necho uit de mond van God; maar hij kwam om te strijden in het dal Megiddo.", "Jer 26:6": "Zo zal Ik dit huis stellen als Silo, en deze stad zal Ik stellen tot een vloek voor alle volken van de aarde.", "Micha 3:12": "Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud.", "2 Kron 36:10": "En bij de terugkeer van het jaar zond koning Nebukadnezar heen, en liet hem naar Babel halen, met de kostbare voorwerpen van het huis van de HEERE; en hij maakte zijn broer Zedekia koning over Juda en Jeruzalem.", "Jer 52:1-11": "Zedekia was eenentwintig jaar oud toen hij koning werd, en hij regeerde elf jaar in Jeruzalem; en de naam van zijn moeder was Hamutal, een dochter van Jeremia, van Libna. En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat Jojakim gedaan had. Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.", "Jer 52:3": "Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.", "2 Kon 25:27": "Het gebeurde daarna in het zevenendertigste jaar van de wegvoering van Jojachin, de koning van Juda, in de twaalfde maand, op de zevenentwintigste van de maand, dat Evilmerodach, de koning van Babel, in het jaar dat hij koning werd, het hoofd van Jojachin, de koning van Juda, uit de gevangenis verhief.", "Jer 27:16-21": "Ook sprak ik tot de priesters, en tot heel dit volk, en zei: Zo zegt de HEERE: Luister niet naar de woorden van uw profeten, die u profeteren en zeggen: Zie, de voorwerpen van het huis van de HEERE zullen nu spoedig uit Babel teruggebracht worden; want zij profeteren u leugens. Luister niet naar hen, maar dien de koning van Babel, dan zult u leven; waarom zou deze stad een puinhoop worden? Maar als zij profeten zijn, en als het woord van de HEERE bij hen is, laat hen dan nu bij de HEERE van de heerscharen voorbede doen, opdat de voorwerpen die in het huis van de HEERE, en in het huis van de koning van Juda, en in Jeruzalem zijn overgebleven, niet naar Babel gaan.", "2 Kon 24:17-20": "En de koning van Babel maakte Mattanja, diens oom, koning in zijn plaats, en veranderde zijn naam in Zedekia. Zedekia was eenentwintig jaar oud toen hij koning werd, en hij regeerde elf jaar in Jeruzalem; en de naam van zijn moeder was Hamutal, een dochter van Jeremia, uit Libna. En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat Jojakim gedaan had.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "2 Kon 25:12": "Maar van de armsten van het land liet de aanvoerder van de lijfwacht enigen overig tot wijngaardeniers en tot akkerlieden.", "Jer 22:13-19": "Wee hem die zijn huis bouwt met ongerechtigheid, en zijn bovenzalen met onrecht; die de dienst van zijn naaste voor niets gebruikt, en hem zijn arbeidsloon niet geeft! Die zegt: Ik zal mij een zeer hoog huis bouwen, en ruime bovenzalen; en hij houwt er zich vensters in uit, en het is bedekt met ceder, en aangestreken met menie. Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Lev 26:33-35": "Daartoe zal Ik u onder de heidenen verstrooien; en een zwaard achter u trekken; en uw land zal woest zijn, en uw steden zullen een woestijn zijn. Dan zal het land aan zijn sabbatten een welgevallen hebben, al de dagen van de verwoesting, terwijl u in het land van uw vijanden bent; dan zal het land rusten, en aan zijn sabbatten een welgevallen hebben. Al de dagen van de verwoesting zal het rusten, omdat het niet rustte in uw sabbatten, toen u daarin woonde.", "Jer 19:4": "Omdat zij Mij verlaten, en deze plaats vervreemd hebben, en andere goden daarin gerookt hebben die zij niet gekend hebben, zij, noch hun vaders, noch de koningen van Juda; en hebben deze plaats vervuld met bloed van onschuldigen.", "1 Kron 7:4": "En met hen, naar hun geslachten, naar hun vaderlijke huizen, waren de groepen van het leger voor de oorlog zesendertigduizend; want zij hadden veel vrouwen en kinderen.", "2 Kon 21:16": "Daartoe vergoot Manasse ook zeer veel onschuldig bloed, totdat hij Jeruzalem van het ene eind tot het andere ermee gevuld had; behalve zijn zonde waarmee hij Juda deed zondigen, door te doen wat kwaad was in de ogen van de HEERE.", "Ezech 47:19": "En de zuidkant, zuidwaarts vanaf Thamar tot aan het twistwater van Kades, vervolgens langs de beek tot aan de grote zee; en dat zal de zuidkant zuidwaarts zijn.", "Klaagl 1:5-8": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander. Vau. En van de dochter van Sion is al haar sieraad weggegaan; haar vorsten zijn als de herten, die geen weide vinden, en zij gaan krachteloos heen voor het aangezicht van de vervolger. Zain. Jeruzalem is, in de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.", "2 Kon 25:1-3": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. Op de negende van de vierde maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,", "Jer 22:24": "Zo waarachtig als Ik leef, spreekt de HEERE, al was Chonia, de zoon van Jojakim, de koning van Juda, een zegelring aan Mijn rechterhand, toch zal Ik u vandaar wegrukken.", "2 Kron 26:10": "Hij bouwde ook torens in de woestijn, en hakte veel putten uit, omdat hij veel vee had, zowel in de laagten als in de effent velden; akkerlieden en wijngaardeniers op de bergen en op de vruchtbare velden; want hij was een liefhebber van het bewerken van het land.", "2 Kon 24:1-6": "In zijn dagen trok Nebukadnezar, de koning van Babel, op, en Jojakim werd zijn dienaar, drie jaar lang; daarna keerde hij zich om en kwam in opstand tegen hem. En de HEERE zond tegen hem de benden van de Chaldeeën, en de benden van de Syriërs, en de benden van de Moabieten, en de benden van de kinderen van Ammon, en zond hen tegen Juda, om dat te verwoesten, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaren, de profeten. Zeker gebeurde dit op bevel van de HEERE tegen Juda, dat Hij hen van Zijn aangezicht wegdeed, om de zonden van Manasse, naar alles wat hij gedaan had;", "2 Kon 23:26": "Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.", "2 Kon 17:32": "Ook vreesden zij de HEERE, en maakten zich uit hun geringste eigen priesters van de hoogten, die voor hen dienst deden in de huizen van de hoogten.", "2 Kon 3:5-27": "Maar het gebeurde, toen Achab gestorven was, dat de koning van de Moabieten van de koning van Israël afviel. Zo trok koning Joram op dezelfde tijd uit Samaria weg, en telde heel Israël. En hij ging op weg, en zond een bode naar Josafat, de koning van Juda, en zei: De koning van de Moabieten is van mij afgevallen; wilt u met mij optrekken in de oorlog tegen de Moabieten? En hij zei: Ik zal opkomen; ik zal zijn zoals u bent, mijn volk als uw volk, mijn paarden als uw paarden.", "Jer 35:11": "Maar het is gebeurd, toen Nebukadrezar, de koning van Babel, naar dit land optrok, dat wij zeiden: Kom, laat ons naar Jeruzalem trekken vanwege het leger van de Chaldeeën, en vanwege het leger van de Syriërs; zo zijn wij in Jeruzalem gebleven.", "2 Kon 13:20": "Daarna stierf Elisa, en zij begroeven hem. De benden van de Moabieten nu kwamen in het land bij het begin van het jaar.", "Jer 52:2": "En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat Jojakim gedaan had.", "Ps 79:1": "Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt.", "2 Kon 21:2-11": "En hij deed wat kwaad was in de ogen van de HEERE, naar de gruwelen van de heidenvolken, die de HEERE voor de kinderen van Israël uit de bezitting verdreven had. Want hij bouwde de hoogten weer op, die Hizkia, zijn vader, verwoest had; en hij richtte altaren voor Baäl op, en maakte een gewijde paal, zoals Achab, de koning van Israël, gemaakt had, en boog zich neer voor heel het leger van de hemel, en diende het. En hij bouwde altaren in het huis van de HEERE, waarvan de HEERE gezegd had: Te Jeruzalem zal Ik Mijn Naam vestigen.", "1 Kron 3:15": "De zonen van Josia nu waren deze: de eerstgeborene Johanan, de tweede Jojakim, de derde Zedekia, de vierde Sallum.", "Jes 6:12": "Want de HEERE zal die mensen ver wegdoen, en de verlating zal groot zijn in het binnenste van het land.", "Jer 52:31": "Het gebeurde daarna, in het zevenendertigste jaar van de gevankelijke wegvoering van Jojachin, de koning van Juda, in de twaalfde maand, op de vijfentwintigste van de maand, dat Evilmerodach, de koning van Babel, in het eerste jaar van zijn koninkrijk, het hoofd van Jojachin, de koning van Juda, verhief, en hem uit de gevangenis liet uitgaan.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Jer 38:17-21": "Jeremia dan zei tegen Zedekia: Zo zegt de HEERE, de God van de heerscharen, de God van Israël: Als u gewillig naar de vorsten van de koning van Babel uitgaat, dan zal uw leven behouden blijven, en deze stad zal niet met vuur verbrand worden; en u zult leven, u en uw huis. Maar als u naar de vorsten van de koning van Babel niet uitgaat, dan zal deze stad gegeven worden in de hand van de Chaldeeën, en zij zullen haar met vuur verbranden; ook zult u zelf uit hun hand niet ontkomen. En de koning Zedekia zei tegen Jeremia: Ik ben bang voor de Joden die naar de Chaldeeën zijn overgelopen, dat zij mij misschien in hun hand overgeven, en zij de spot met mij drijven.", "2 Kon 24:1-16": "In zijn dagen trok Nebukadnezar, de koning van Babel, op, en Jojakim werd zijn dienaar, drie jaar lang; daarna keerde hij zich om en kwam in opstand tegen hem. En de HEERE zond tegen hem de benden van de Chaldeeën, en de benden van de Syriërs, en de benden van de Moabieten, en de benden van de kinderen van Ammon, en zond hen tegen Juda, om dat te verwoesten, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaren, de profeten. Zeker gebeurde dit op bevel van de HEERE tegen Juda, dat Hij hen van Zijn aangezicht wegdeed, om de zonden van Manasse, naar alles wat hij gedaan had;", "Jer 22:13-17": "Wee hem die zijn huis bouwt met ongerechtigheid, en zijn bovenzalen met onrecht; die de dienst van zijn naaste voor niets gebruikt, en hem zijn arbeidsloon niet geeft! Die zegt: Ik zal mij een zeer hoog huis bouwen, en ruime bovenzalen; en hij houwt er zich vensters in uit, en het is bedekt met ceder, en aangestreken met menie. Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Jer 22:19": "Met een ezelsbegrafenis zal hij begraven worden; men zal hem slepen en wegwerpen, ver weg van de poorten van Jeruzalem.", "2 Kron 25:16": "En het gebeurde, toen hij tot hem sprak, dat hij hem zei: Heeft men u tot raadgever van de koning aangesteld? Houd op; waarom zou men u slaan? Toen hield de profeet op, en zei: Ik merk dat God besloten heeft u te vernietigen, omdat u dit gedaan hebt, en naar mijn raad niet hebt geluisterd.", "Jer 22:18": "Daarom zegt de HEERE zo van Jojakim, zoon van Josia, koning van Juda: Zij zullen hem niet beklagen: Och, mijn broeder! of, och, zuster! Zij zullen hem niet beklagen: Och, heer! of, och, zijn majesteit!", "Jer 24:1": "De HEERE liet mij zien, en zie, er waren twee vijgenkorven gezet voor de tempel van de HEERE; nadat Nebukadnezar, de koning van Babel, Jechonia, de zoon van Jojakim, de koning van Juda, gevankelijk had weggevoerd, alsook de vorsten van Juda, en de timmerlieden, en de smeden van Jeruzalem, en hen naar Babel had gebracht.", "2 Kron 36:13": "Daarbij werd hij ook afvallig tegen koning Nebukadnezar, die hem bij God had beëdigd; en hij verhardde zijn nek, en verstokte zijn hart, zodat hij zich niet bekeerde tot de HEERE, de God van Israël.", "Jer 36:25": "Hoewel ook Elnathan, en Delaja, en Gemarja bij de koning ervoor pleitten dat hij de rol niet zou verbranden; toch luisterde hij niet naar hen.", "Deut 19:10": "opdat het bloed van de onschuldige niet vergoten wordt te midden van uw land, dat de HEERE, uw God, u als erfdeel geeft, en er geen bloedschuld op u zou zijn.", "Joz 23:15": "En het zal gebeuren, zoals al die goede dingen over u gekomen zijn, die de HEERE, uw God, tot u gesproken heeft, zo zal de HEERE over u laten komen al die kwade dingen, totdat Hij u verdelgt van dit goede land, dat de HEERE, uw God, u gegeven heeft.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "2 Kon 23:37": "En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vaders gedaan hadden.", "Jer 28:6": "En de profeet Jeremia zei: Amen, de HEERE doet zo! De HEERE bevestigt uw woorden, die u geprofeteerd hebt, dat Hij de voorwerpen van het huis van de HEERE, en allen die gevankelijk zijn weggevoerd, uit Babel terugbrengt naar deze plaats!", "2 Kron 36:3": "Want de koning van Egypte zette hem af te Jeruzalem, en hij legde het land een boete op van honderd talenten zilver en een talent goud.", "2 Kon 20:17": "Zie, de dagen komen dat alles wat in uw huis is, en wat uw vaderen tot op deze dag opgeslagen hebben, naar Babel weggevoerd zal worden; er zal niets overblijven, zegt de HEERE.", "Jer 24:8": "En zoals de slechte vijgen, die vanwege de slechtheid niet gegeten kunnen worden (want zo zegt de HEERE), zo zal Ik Zedekia, de koning van Juda, maken, alsook zijn vorsten, en het overblijfsel van Jeruzalem, die in dit land zijn overgebleven, en die in het land Egypte wonen;", "Job 1:17": "Terwijl deze nog sprak, kwam er een ander en zei: De Chaldeeën stelden drie groepen op, en vielen de kamelen aan, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "Jes 46:11": "Die een roofvogel roept van het oosten, een man van Mijn raad uit een ver land; ja, Ik heb het gesproken, Ik zal het ook doen komen; Ik heb het geformeerd, Ik zal het ook doen.", "Deut 2:30": "Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.", "Deut 4:26": "Dan roep ik vandaag de hemel en de aarde tot getuige tegen u, dat u zeker snel zult omkomen uit het land waar u de Jordaan voor oversteekt om het in bezit te nemen; u zult uw dagen daarin niet verlengen, maar helemaal uitgeroeid worden.", "Dan 5:2": "Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken.", "Jer 38:28": "En Jeremia bleef in het voorhof van de bewaking tot op de dag dat Jeruzalem werd ingenomen; en hij was er nog, toen Jeruzalem werd ingenomen.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "Deut 28:63": "En het zal gebeuren: zoals de HEERE Zich over u verblijdde door u goed te doen en u meer te maken, zo zal de HEERE Zich over u verblijden door u te vernietigen en u te verdelgen; en u zult weggerukt worden uit het land waar u naartoe gaat om het te erven.", "Jer 27:16": "Ook sprak ik tot de priesters, en tot heel dit volk, en zei: Zo zegt de HEERE: Luister niet naar de woorden van uw profeten, die u profeteren en zeggen: Zie, de voorwerpen van het huis van de HEERE zullen nu spoedig uit Babel teruggebracht worden; want zij profeteren u leugens.", "Joz 15:47": "Asdod, haar onderhorige plaatsen en haar dorpen; Gaza, haar onderhorige plaatsen en haar dorpen, tot aan de rivier van Egypte; en de grote zee, en haar gebied.", "Jer 52:4-7": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadrezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zij legerden zich tegen haar, en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. In de vierde maand, op de negende van de maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had;", "2 Kon 22:17": "Omdat zij Mij verlaten hebben, en voor andere goden reukwerk gebrand hebben, om Mij tot toorn te verwekken met al het werk van hun handen, zal Mijn grimmigheid ontstoken worden tegen deze plaats, en niet uitgeblust worden.", "Jer 32:28": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.", "Matt 1:12": "En na de Babylonische wegvoering verwekte Jechonia Sealthiël, en Sealthiël verwekte Zerubbabel;", "Jer 38:19": "En de koning Zedekia zei tegen Jeremia: Ik ben bang voor de Joden die naar de Chaldeeën zijn overgelopen, dat zij mij misschien in hun hand overgeven, en zij de spot met mij drijven.", "Hebr 6:4-6": "Want het is onmogelijk om hen die eens verlicht zijn geweest, en de hemelse gave geproefd hebben, en deelgenoot geworden zijn van de Heilige Geest, en het goede woord van God geproefd hebben, en de krachten van de toekomende eeuw, en die afvallig worden, opnieuw te vernieuwen tot bekering, omdat zij voor zichzelf de Zoon van God opnieuw kruisigen en openlijk te schande maken.", "2 Kron 36:11": "Eenentwintig jaar was Zedekia oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem.", "Jes 19:11-14": "Zeker, de vorsten van Zoan zijn dwazen, de raad van de wijzen, van de raadgevers van Farao, is redeloos geworden; hoe kunt u dan tegen Farao zeggen: Ik ben een zoon van de wijzen, een zoon van de oude koningen? Waar zijn nu uw wijzen? Laat zij u nu te kennen geven of vernemen, wat de HEERE van de heerscharen beraadslaagd heeft tegen Egypte. De vorsten van Zoan zijn zot geworden, de vorsten van Nof zijn bedrogen; zij hebben ook Egypte doen dwalen, tot de uiterste hoek van zijn stammen.", "Klaagl 3:42": "Nun. Wij hebben overtreden, en wij zijn opstandig geweest, daarom hebt U niet gespaard.", "1 Kon 7:48-50": "Ook maakte Salomo alle voorwerpen die voor het huis van de HEERE bestemd waren: het gouden altaar, en de gouden tafel waarop de toonbroden lagen; En de kandelaars, vijf aan de rechterkant, en vijf aan de linkerkant, voor het binnenste heiligdom, van zuiver goud; en de bloemen, de lampen, en de snuiters van goud; Alsook de schalen, de vorken, de sprenkelschalen, de rookschalen, en de wierookvaten, van zuiver goud; daartoe de scharnieren van de deuren van het binnenste huis, het heilige der heiligen, en van de deuren van het huis van de tempel, van goud.", "2 Kron 36:6": "Nebukadnezar, de koning van Babel, trok tegen hem op, en bond hem met twee koperen ketenen, om hem naar Babel te voeren.", "Matt 12:31": "Daarom zeg Ik u: alle zonde en lastering zal de mensen vergeven worden; maar de lastering tegen de Geest zal de mensen niet vergeven worden.", "Jer 27:19-22": "Want zo zegt de HEERE van de heerscharen, over de pilaren, en over de zee, en over de onderstellen, en over het overige van de voorwerpen die in deze stad zijn overgebleven, die Nebukadnezar, de koning van Babel, niet heeft weggenomen, toen hij Jechonia, de zoon van Jojakim, koning van Juda, van Jeruzalem naar Babel gevankelijk wegvoerde, alsook alle edelen van Juda en Jeruzalem; ja, zo zegt de HEERE van de heerscharen, de God van Israël, over de voorwerpen die in het huis van de HEERE, en in het huis van de koning van Juda, en in Jeruzalem zijn overgebleven:", "Jes 39:6": "Zie, de dagen komen dat alles wat in uw huis is, en wat uw vaders tot op deze dag als schat hebben opgelegd, naar Babel weggevoerd zal worden; er zal niets overblijven, zegt de HEERE.", "Jer 52:28": "Dit is het volk dat Nebukadrezar gevankelijk heeft weggevoerd: in het zevende jaar, drieduizend drieëntwintig Joden;", "Jer 24:1-5": "De HEERE liet mij zien, en zie, er waren twee vijgenkorven gezet voor de tempel van de HEERE; nadat Nebukadnezar, de koning van Babel, Jechonia, de zoon van Jojakim, de koning van Juda, gevankelijk had weggevoerd, alsook de vorsten van Juda, en de timmerlieden, en de smeden van Jeruzalem, en hen naar Babel had gebracht. In de ene korf waren zeer goede vijgen, zoals de eerste rijpe vijgen zijn; maar in de andere korf waren zeer slechte vijgen, die vanwege de slechtheid niet gegeten konden worden. En de HEERE zei tegen mij: Wat ziet u, Jeremia? En ik zei: Vijgen; de goede vijgen zijn zeer goed, en de slechte zeer slecht, die vanwege de slechtheid niet gegeten kunnen worden.", "Jer 26:23": "Die voerden Uria uit Egypte, en brachten hem tot de koning Jojakim, en hij sloeg hem met het zwaard, en hij wierp zijn dode lichaam in de graven van de kinderen van het volk.", "Ezech 48:28": "Aan de grens nu van Gad, aan de zuidkant zuidwaarts, daar zal de grens zijn van Thamar af, naar het twistwater van Kades, vervolgens naar de beek heen, tot aan de grote zee.", "Klaagl 4:1": "Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!", "Dan 1:1": "In het derde jaar van het koningschap van Jojakim, de koning van Juda, kwam Nebukadnezar, de koning van Babel, naar Jeruzalem, en belegerde het.", "2 Kon 13:21": "En het gebeurde, toen zij een man begroeven, dat zij, zie, een bende zagen; zo wierpen zij de man in het graf van Elisa; en toen de man daarin kwam, en het gebeente van Elisa aanraakte, werd hij levend, en kwam overeind op zijn voeten.", "2 Kron 33:11": "Daarom bracht de HEERE over hen de legeroversten van de koning van Assyrië, die Manasse gevangen namen tussen de doornen; en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "2 Kon 25:1-17": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. Op de negende van de vierde maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,", "Jer 26:22": "Maar de koning Jojakim zond mannen naar Egypte, Elnathan, de zoon van Achbor, en andere mannen met hem, naar Egypte;", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Jer 52:13": "Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur.", "Jer 52:17-23": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden al het koper daarvan naar Babel. Ook namen zij de potten, en de schoffels, en de gaffels, en de sprenkelschalen, en de rookschalen, en al de koperen vaten waarmee men de dienst deed. En de leider van de lijfwacht nam de schalen weg, en de wierookvaten, en de sprenkelschalen, en de potten, en de kandelaars, en de rookschalen, en de kroezen; wat geheel goud, en wat geheel zilver was.", "Jer 38:24-26": "Toen zei Zedekia tegen Jeremia: Laat niemand van deze woorden weten, dan zult u niet sterven. En als de vorsten horen dat ik met u gesproken heb, en tot u komen en tegen u zeggen: Vertel ons nu, wat hebt u tegen de koning gezegd? Verberg het niet voor ons, dan zullen wij u niet doden; en wat heeft de koning tegen u gezegd? Dan zult u tegen hen zeggen: Ik wierp mijn smeking voor de koning neder, dat hij mij niet terug zou laten brengen naar het huis van Jonathan, om daar te sterven.", "Jer 46:2-10": "Tegen Egypte; tegen het leger van Farao Necho, koning van Egypte, dat aan de rivier Frath, bij Karchemis was, dat Nebukadrezar, de koning van Babel, sloeg, in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda. Rust het schild en de rondas toe, en nadert tot de strijd! Spant de paarden aan, en klimt op, ruiters! En stelt u op met helmen; veegt de speren, trekt de pantsers aan!", "2 Kon 25:11-21": "Het overige nu van het volk, die in de stad overgelaten waren, en de afvalligen, die tot de koning van Babel gevallen waren, en het overige van de menigte, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk weg. Maar van de armsten van het land liet de aanvoerder van de lijfwacht enigen overig tot wijngaardeniers en tot akkerlieden. Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden het koper daarvan naar Babel.", "Ex 9:14-17": "Want ditmaal zal Ik al Mijn plagen in uw hart zenden, en over uw dienaren en over uw volk, zodat u weet dat er niemand is zoals Ik, op de hele aarde. Want nu heb Ik Mijn hand uitgestrekt, om u en uw volk met de pest te slaan, zodat u van de aarde verdelgd zou worden. Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "2 Kon 17:24": "De koning van Assyrië nu bracht volk uit Babel, en uit Chuta, en uit Avva, en uit Hamath, en Sefarvaim, en liet hen wonen in de steden van Samaria, in de plaats van de kinderen van Israël; en zij namen Samaria in bezit, en woonden in haar steden.", "Ezech 17:12-21": "Zeg nu tegen dat opstandige huis: Weet u niet wat deze dingen betekenen? Zeg: Zie, de koning van Babel is naar Jeruzalem gekomen, en heeft haar koning genomen, en haar vorsten, en heeft ze naar zich toe gevoerd naar Babel. Daartoe heeft hij van het koninklijke zaad genomen, en daarmee een verbond gemaakt, en heeft hem tot een eed gebracht, en de machtigen van het land heeft hij weggenomen; opdat het koninkrijk nederig zou zijn, zich niet verheffend, en dat het, zijn verbond houdend, kon bestaan.", "2 Kon 25:11": "Het overige nu van het volk, die in de stad overgelaten waren, en de afvalligen, die tot de koning van Babel gevallen waren, en het overige van de menigte, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk weg.", "Jer 22:28": "Is dan deze man Chonia een veracht, verbrijzeld afgodsbeeld? Of is hij een vat waaraan men geen lust heeft? Waarom zijn hij en zijn nageslacht weggeworpen, ja, weggeworpen in een land dat zij niet kennen?", "2 Kon 6:23": "En hij bereidde voor hen een grote maaltijd, dat zij aten en dronken; daarna liet hij hen gaan, en zij trokken naar hun heer. Zo kwamen de rooftroepen van de Syriërs niet meer in het land van Israël.", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "Jer 36:12": "ging hij naar het huis van de koning, naar de kamer van de schrijver; en zie, daar zaten al de vorsten: Elisama, de schrijver, en Delaja, de zoon van Semaja, en Elnathan, de zoon van Achbor, en Gemarja, de zoon van Safan, en Zedekia, de zoon van Hananja, en al de vorsten.", "1 Kon 8:65": "Op diezelfde tijd hield Salomo ook het feest, en heel Israël met hem, een grote gemeente, vanaf de ingang van Hamath tot de rivier van Egypte, voor het aangezicht van de HEERE, onze God, zeven dagen en zeven dagen, dat is veertien dagen.", "2 Kon 24:8-16": "Jojachin was achttien jaar oud toen hij koning werd, en regeerde drie maanden in Jeruzalem; en de naam van zijn moeder was Nehusta, een dochter van Elnathan, uit Jeruzalem. En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vader gedaan had. In die tijd trokken de dienaren van Nebukadnezar, de koning van Babel, naar Jeruzalem; en de stad werd belegerd.", "Jer 28:3": "In nog twee volle jaren zal Ik naar deze plaats terugbrengen al de voorwerpen van het huis van de HEERE, die Nebukadnezar, de koning van Babel, uit deze plaats heeft weggenomen en naar Babel gebracht.", "Dan 3:1": "De koning Nebukadnezar maakte een beeld van goud, waarvan de hoogte zestig el was, zijn breedte zes el; hij richtte het op in het dal Dura, in het landschap van Babel.", "Jer 52:1": "Zedekia was eenentwintig jaar oud toen hij koning werd, en hij regeerde elf jaar in Jeruzalem; en de naam van zijn moeder was Hamutal, een dochter van Jeremia, van Libna.", "2 Kon 25:13-15": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden het koper daarvan naar Babel. Zij namen ook de potten, en de schoffels, en de gaffels, en de rookschalen, en al de koperen voorwerpen, waarmee men de dienst verrichtte. En de aanvoerder van de lijfwacht nam de wierookvaten en de sprenkelschalen weg, wat geheel goud en wat geheel zilver was.", "2 Kon 25:9-17": "En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de aanvoerder van de lijfwacht was, brak de muren van Jeruzalem rondom af. Het overige nu van het volk, die in de stad overgelaten waren, en de afvalligen, die tot de koning van Babel gevallen waren, en het overige van de menigte, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk weg.", "Num 34:5": "Verder zal deze grens omgaan van Azmon naar de rivier van Egypte, en haar uiteinden zullen bij de zee zijn.", "Deut 29:28": "En de HEERE heeft hen uit hun land weggerukt, in toorn, en in grimmigheid, en in grote verbolgenheid; en Hij heeft hen weggeworpen in een ander land, zoals het is op deze dag.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Jer 25:9": "Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden.", "Jer 32:2": "(Het leger van de koning van Babel belegerde toen Jeruzalem, en de profeet Jeremia zat opgesloten in het voorhof van de bewaking, dat bij het huis van de koning van Juda is.", "1 Joh 5:16": "Als iemand zijn broeder een zonde ziet doen die niet tot de dood is, die zal God bidden en Hij zal hem het leven geven, aan hen namelijk die zondigen niet tot de dood. Er is een zonde tot de dood; voor die zonde zeg ik niet dat hij moet bidden.", "Ezech 17:14": "opdat het koninkrijk nederig zou zijn, zich niet verheffend, en dat het, zijn verbond houdend, kon bestaan.", "Jer 37:2": "Maar hij hoorde niet, hij niet, en zijn knechten niet, en het volk van het land niet, naar de woorden van de HEERE, die Hij sprak door de dienst van de profeet Jeremia.", "2 Kron 36:8": "Het overige nu van de geschiedenis van Jojakim, en zijn gruwelen die hij deed, en wat er tegen hem gevonden werd, zie, dat is geschreven in het boek van de koningen van Israël en Juda; en Jojachin, zijn zoon, werd koning in zijn plaats.", "Jer 52:12-24": "Daarna, in de vijfde maand, op de tiende van de maand (dit jaar was het negentiende jaar van koning Nebukadrezar, de koning van Babel), toen Nebuzaradan, de leider van de lijfwacht, die voor het aangezicht van de koning van Babel stond, in Jeruzalem gekomen was; Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.", "Ezech 1:1": "In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.", "2 Kon 25:1": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom.", "Hand 7:4": "Toen ging hij weg uit het land van de Chaldeeën, en woonde in Haran. En vandaar, nadat zijn vader gestorven was, bracht Hij hem over naar dit land, waarin u nu woont.", "2 Kon 23:27": "En de HEERE zei: Ik zal Juda ook van Mijn aangezicht wegdoen, zoals Ik Israël weggedaan heb; en Ik zal deze stad Jeruzalem verwerpen, die Ik verkoren heb, en het huis waarvan Ik gezegd heb: Mijn Naam zal daar zijn.", "Jer 52:16": "Maar van de armsten van het land liet Nebuzaradan, de leider van de lijfwacht, enigen over tot wijngaardeniers en tot akkerlieden.", "Ezech 33:25": "Daarom, zeg tegen hen: Zo zegt de Heere HEERE: U eet vlees met het bloed, en heft uw ogen op naar uw drekgoden, en vergiet bloed; en zou u het land dan erfelijk bezitten?", "2 Kon 18:25": "Nu, ben ik zonder de HEERE opgetrokken tegen deze plaats, om die te verderven? De HEERE heeft tot mij gezegd: Trek op tegen dat land, en verderf het.", "2 Kon 17:5": "Want de koning van Assyrië trok op door het hele land; ja, hij kwam op naar Samaria, en belegerde het drie jaar.", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "Jer 37:1": "Zedekia, de zoon van Josia, werd koning in plaats van Chonja, de zoon van Jojakim; hem had Nebukadrezar, de koning van Babel, koning gemaakt in het land van Juda.", "Matt 12:32": "En wie een woord zal spreken tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest zal spreken, het zal hem niet vergeven worden, niet in deze eeuw, en ook niet in de toekomende.", "Jes 13:5": "Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.", "2 Kron 26:9": "Daartoe bouwde Uzzia torens te Jeruzalem, bij de Hoekpoort en bij de Dalpoort, en bij de hoeken, en hij versterkte ze.", "1 Kor 1:20": "Waar is de wijze? Waar is de schriftgeleerde? Waar is de onderzoeker van deze eeuw? Heeft God de wijsheid van deze wereld niet dwaas gemaakt?", "Jer 37:5-7": "En het leger van Farao was uit Egypte weggetrokken; en toen de Chaldeeën, die Jeruzalem belegerden, het gerucht over hen gehoord hadden, trokken zij van Jeruzalem weg.) Toen kwam het woord van de HEERE tot de profeet Jeremia, en Hij zei: Zo zegt de HEERE, de God van Israël: Zo zult u zeggen tegen de koning van Juda, die u naar Mij gestuurd heeft om Mij te raadplegen: Zie, het leger van Farao, dat u ter hulp is uitgetrokken, zal terugkeren naar zijn land, naar Egypte;", "2 Kon 24:10-16": "In die tijd trokken de dienaren van Nebukadnezar, de koning van Babel, naar Jeruzalem; en de stad werd belegerd. Zelfs kwam Nebukadnezar, de koning van Babel, tegen de stad, terwijl zijn dienaren die belegerden. Toen ging Jojachin, de koning van Juda, naar de koning van Babel, hij, en zijn moeder, en zijn dienaren, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem gevangen in het achtste jaar van zijn regering.", "2 Kron 36:7": "Nebukadnezar bracht ook een deel van de voorwerpen van het huis van de HEERE naar Babel, en zette ze in zijn tempel te Babel.", "2 Kron 36:4": "En de koning van Egypte maakte zijn broer Eljakim koning over Juda en Jeruzalem, en veranderde zijn naam in Jojakim; maar zijn broer Joahaz nam Necho mee, en bracht hem naar Egypte.", "2 Kon 20:18": "Daarbij zullen zij van uw zonen, die uit u zullen voortkomen, die u zult verwekken, nemen, zodat zij hovelingen zijn in het paleis van de koning van Babel."}, "noten": {}, "koppeling": {"1": "In <span class=\"wl\" data-l=\"L1\" data-code=\"H3117\">zijn</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3117\">dagen</span> trok <span class=\"wl\" data-l=\"L2\" data-code=\"H5019\">Nebukadnezar</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H5019\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4428\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H894\">Babel</span>, <span class=\"wl\" data-l=\"L4\" data- jv\" data-code=\"H7971\">sent</span> them against <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> to <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> it, according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets.</span>", "3": "Surely at the <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came this upon <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> to <span class=\"wl wl-kjv\" data-code=\"H5493\">remove</span> them out of his <span class=\"wl wl-kjv\" data-code=\"H6440\">sight,</span> for the <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> according to all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did;</span>", "4": "And also for the <span class=\"wl wl-kjv\" data-code=\"H5355\">innocent</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> that he <span class=\"wl wl-kjv\" data-code=\"H8210\">shed:</span> for he <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> with <span class=\"wl wl-kjv\" data-code=\"H5355\">innocent</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood;</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H5545\">pardon.</span>", "5": "Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H3079\">Jehoiakim,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah?</span>", "6": "So <span class=\"wl wl-kjv\" data-code=\"H3079\">Jehoiakim</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers:</span> and <span class=\"wl wl-kjv\" data-code=\"H3078\">Jehoiachin</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.", "7": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">came</span> not <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> any more out of his <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> had <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> from the <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> <span class=\"wl wl-kjv\" data-code=\"H6578\">Euphrates</span> all that pertained to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt.</span>", "8": "<span class=\"wl wl-kjv\" data-code=\"H3078\">Jehoiachin</span> was <span class=\"wl wl-kjv\" data-code=\"H8083\">eighteen</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">months.</span> And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H5179\">Nehushta,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H494\">Elnathan</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>", "9": "And he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> according to all that his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span>", "10": "At that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadnezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">besieged.</span>", "11": "And <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadnezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> <span class=\"wl wl-kjv\" dat
