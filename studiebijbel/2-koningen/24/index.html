zodat hij Jeruzalem met onschuldig bloed vervuld had; daarom wilde de HEERE niet vergeven.","5":"Het overige nu van de geschiedenis van Jojakim, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?","6":"En Jojakim ontsliep met zijn vaderen; en zijn zoon Jojachin werd koning in zijn plaats.","7":"De koning van Egypte trok voortaan niet meer uit zijn land; want de koning van Babel had, van de rivier van Egypte af tot aan de rivier de Eufraat, alles ingenomen wat van de koning van Egypte was.","8":"Jojachin was achttien jaar oud toen hij koning werd, en regeerde drie maanden in Jeruzalem; en de naam van zijn moeder was Nehusta, een dochter van Elnathan, uit Jeruzalem.","9":"En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vader gedaan had.","10":"In die tijd trokken de dienaren van Nebukadnezar, de koning van Babel, naar Jeruzalem; en de stad werd belegerd.","11":"Zelfs kwam Nebukadnezar, de koning van Babel, tegen de stad, terwijl zijn dienaren die belegerden.","12":"Toen ging Jojachin, de koning van Juda, naar de koning van Babel, hij, en zijn moeder, en zijn dienaren, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem *gevangen* in het achtste jaar van zijn regering.","13":"En hij bracht van daar al de schatten van het huis van de HEERE, en de schatten van het huis van de koning; en hij hakte alle gouden vaten stuk die Salomo, de koning van Israël, in de tempel van de HEERE gemaakt had, zoals de HEERE gesproken had.","14":"En hij voerde heel Jeruzalem weg, alsook al de vorsten, en alle strijdbare helden, tienduizend gevangenen, en alle timmerlieden en smeden; niemand werd overgelaten, dan het arme volk van het land.","15":"Zo voerde hij Jojachin weg naar Babel, alsook de moeder van de koning, en de vrouwen van de koning, en zijn hovelingen; daartoe bracht hij de machtigen van het land gevangen van Jeruzalem naar Babel;","16":"En alle sterke mannen, tot zevenduizend, en timmerlieden en smeden, tot duizend, *en* alle helden, die geoefend waren voor de oorlog; dezen bracht de koning van Babel gevangen naar Babel.","17":"En de koning van Babel maakte Mattanja, diens oom, koning in zijn plaats, en veranderde zijn naam in Zedekia.","18":"Zedekia was eenentwintig jaar oud toen hij koning werd, en hij regeerde elf jaar in Jeruzalem; en de naam van zijn moeder was Hamutal, een dochter van Jeremia, uit Libna.","19":"En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat Jojakim gedaan had.","20":"Want het gebeurde, vanwege de toorn van de HEERE tegen Jeruzalem en tegen Juda, totdat Hij hen van Zijn aangezicht weggeworpen had. En Zedekia kwam in opstand tegen de koning van Babel."},"SV":{"1":"In zijn dagen toog Nebukadnezar, de koning van Babel, op, en Jojakim werd zijn knecht drie jaren; daarna keerde hij zich om, en rebelleerde tegen hem.","2":"En de HEERE zond tegen hem de benden der Chaldeen, en de benden der Syriërs, en de benden der Moabieten, en de benden der kinderen Ammons, en zond hen tegen Juda, om dat te verderven, naar het woord des HEEREN, dat Hij gesproken had door den dienst Zijner knechten, de profeten.","3":"Zekerlijk geschiedde *dit* naar het bevel des HEEREN tegen Juda, dat Hij hen van Zijn aangezicht wegdeed, om de zonden van Manasse, naar alles, wat hij gedaan had;","4":"Als ook *om* het onschuldig bloed, dat hij vergoten had, zodat hij Jeruzalem met onschuldig bloed vervuld had; daarom wilde de HEERE niet vergeven.","5":"Het overige nu der geschiedenissen van Jojakim, en al wat hij gedaan heeft, is dat niet geschreven in het boek der kronieken der koningen van Juda?","6":"En Jojakim ontsliep met zijn vaderen; en zijn zoon Jojachin werd koning in zijn plaats.","7":"De koning nu van Egypte toog voortaan niet meer uit zijn land; want de koning van Babel had, van de rivier van Egypte af tot aan de rivier Frath, ingenomen al wat van den koning van Egypte was.","8":"Jojachin was achttien jaren oud, toen hij koning werd, en regeerde drie maanden te Jeruzalem; en de naam zijner moeder was Nehusta, een dochter van Elnathan, van Jeruzalem.","9":"En hij deed dat kwaad was in de ogen des HEEREN, naar alles, wat zijn vader gedaan had.","10":"Te dier tijd togen de knechten van Nebukadnezar, den koning van Babel, naar Jeruzalem; en de stad werd belegerd.","11":"Zelfs kwam Nebukadnezar, de koning van Babel, tegen de stad, als zijn knechten die belegerden.","12":"Toen ging Jojachin, de koning van Juda, uit tot den koning van Babel, hij, en zijn moeder, en zijn knechten, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem *gevangen* in het achtste jaar zijner regering.","13":"En hij bracht van daar uit al de schatten van het huis des HEEREN, en de schatten van het huis des konings; en hij hieuw alle gouden vaten af, die Salomo, de koning van Israël, in den tempel des HEEREN gemaakt had, gelijk als de HEERE gesproken had.","14":"En hij voerde gans Jeruzalem weg, mitsgaders al de vorsten, en alle strijdbare helden, tien duizend gevangen, en alle timmerlieden en smeden; niemand werd overgelaten, dan het arme volk des lands.","15":"Zo voerde hij Jojachin weg naar Babel, mitsgaders des konings moeder, en des konings vrouwen, en zijn hovelingen; daartoe de machtigen des lands bracht hij gevankelijk van Jeruzalem naar Babel;","16":"En alle kloeke mannen tot zeven duizend, en timmerlieden en smeden tot een duizend, *en* alle helden, die ten oorlog geoefend waren; dezen bracht de koning van Babel gevankelijk naar Babel.","17":"En de koning van Babel maakte Mattanja, deszelfs oom, koning in plaats van hem, en veranderde zijn naam in Zedekia.","18":"Zedekia was een en twintig jaren oud, als hij koning werd, en hij regeerde elf jaren te Jeruzalem; en de naam zijner moeder was Hamutal, een dochter van Jeremia, van Libna.","19":"En hij deed dat kwaad was in de ogen des HEEREN, naar alles, wat Jojakim gedaan had.","20":"Want het geschiedde, om den toorn des HEEREN tegen Jeruzalem en tegen Juda, totdat Hij hen van Zijn aangezicht weggeworpen had. En Zedekia rebelleerde tegen den koning van Babel."},"KJV":{"1":"In his days Nebuchadnezzar king of Babylon came up, and Jehoiakim became his servant three years: then he turned and rebelled against him.","2":"And the LORD sent against him bands of the Chaldees, and bands of the Syrians, and bands of the Moabites, and bands of the children of Ammon, and sent them against Judah to destroy it, according to the word of the LORD, which he spake by his servants the prophets.","3":"Surely at the commandment of the LORD came this upon Judah, to remove them out of his sight, for the sins of Manasseh, according to all that he did;","4":"And also for the innocent blood that he shed: for he filled Jerusalem with innocent blood; which the LORD would not pardon.","5":"Now the rest of the acts of Jehoiakim, and all that he did, are they not written in the book of the chronicles of the kings of Judah?","6":"So Jehoiakim slept with his fathers: and Jehoiachin his son reigned in his stead.","7":"And the king of Egypt came not again any more out of his land: for the king of Babylon had taken from the river of Egypt unto the river Euphrates all that pertained to the king of Egypt.","8":"Jehoiachin was eighteen years old when he began to reign, and he reigned in Jerusalem three months. And his mother's name was Nehushta, the daughter of Elnathan of Jerusalem.","9":"And he did that which was evil in the sight of the LORD, according to all that his father had done.","10":"At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem, and the city was besieged.","11":"And Nebuchadnezzar king of Babylon came against the city, and his servants did besiege it.","12":"And Jehoiachin the king of Judah went out to the king of Babylon, he, and his mother, and his servants, and his princes, and his officers: and the king of Babylon took him in the eighth year of his reign.","13":"And he carried out thence all the treasures of the house of the LORD, and the treasures of the king's house, and cut in pieces all the vessels of gold which Solomon king of Israel had made in the temple of the LORD, as the LORD had said.","14":"And he carried away all Jerusalem, and all the princes, and all the mighty men of valour, even ten thousand captives, and all the craftsmen and smiths: none remained, save the poorest sort of the people of the land.","15":"And he carried away Jehoiachin to Babylon, and the king's mother, and the king's wives, and his officers, and the mighty of the land, those carried he into captivity from Jerusalem to Babylon.","16":"And all the men of might, even seven thousand, and craftsmen and smiths a thousand, all that were strong and apt for war, even them the king of Babylon brought captive to Babylon.","17":"And the king of Babylon made Mattaniah his father's brother king in his stead, and changed his name to Zedekiah.","18":"Zedekiah was twenty and one years old when he began to reign, and he reigned eleven years in Jerusalem. And his mother's name was Hamutal, the daughter of Jeremiah of Libnah.","19":"And he did that which was evil in the sight of the LORD, according to all that Jehoiakim had done.","20":"For through the anger of the LORD it came to pass in Jerusalem and Judah, until he had cast them out from his presence, that Zedekiah rebelled against the king of Babylon."}},"tsk":{"1":[{"kopje":"zijn dagen","refs":["2 Kon 17:5","2 Kron 36:6-21","Jer 25:1","Jer 25:9","Jer 46:2","Dan 1:1"]}],"2":[{"kopje":"de HEERE","refs":["2 Kon 6:23","2 Kon 13:20","2 Kon 13:21","Deut 28:49","Deut 28:50","2 Kron 33:11","Job 1:17","Jes 7:17","Jes 13:5","Jer 35:11","Ezech 19:8"]},{"kopje":"naar","refs":["2 Kon 20:17","2 Kon 21:12-14","2 Kon 23:27","Jes 6:11","Jes 6:12","Jer 25:9","Jer 26:6","Jer 26:20","Jer 32:28","Micha 3:12"]}],"3":[{"kopje":"Zeker","refs":["2 Kon 18:25","Gen 50:20","2 Kron 24:24","2 Kron 25:16","Jes 10:5","Jes 10:6","Jes 45:7","Jes 46:10","Jes 46:11","Amos 3 span class=\"wl wl-kjv\" data-code=\"H2320\">months.</span> And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H5179\">Nehushta,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H494\">Elnathan</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","9":"And he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> according to all that his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span>","10":"At that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadnezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">besieged.</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadnezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> against the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> did <span class=\"wl wl-kjv\" data-code=\"H6696\">besiege</span> it.","12":"And <span class=\"wl wl-kjv\" data-code=\"H3078\">Jehoiachin</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> he, and his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5631\">officers:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> him in the <span class=\"wl wl-kjv\" data-code=\"H8083\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of his <span class=\"wl wl-kjv\" data-code=\"H4427\">reign.</span>","13":"And he carried <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> thence all the <span class=\"wl wl-kjv\" data-code=\"H214\">treasures</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H214\">treasures</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and cut in <span class=\"wl wl-kjv\" data-code=\"H7112\">pieces</span> all the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> which <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> in the <span class=\"wl wl-kjv\" data-code=\"H1964\">temple</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">said.</span>","14":"And he carried <span class=\"wl wl-kjv\" data-code=\"H1540\">away</span> all <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and all the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">valour,</span> even <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H1540\">captives,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2796\">craftsmen</span> and <span class=\"wl wl-kjv\" data-code=\"H4525\">smiths:</span> none <span class=\"wl wl-kjv\" data-code=\"H7604\">remained,</span> <span class=\"wl wl-kjv\" data-code=\"H2108\">save</span> the poorest <span class=\"wl wl-kjv\" data-code=\"H1803\">sort</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span>","15":"And he carried <span class=\"wl wl-kjv\" data-code=\"H1540\">away</span> <span class=\"wl wl-kjv\" data-code=\"H3078\">Jehoiachin</span> to <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5631\">officers,</span> and the <span class=\"wl wl-kjv\" data-code=\"H352\">mighty</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> those <span class=\"wl wl-kjv\" data-code=\"H3212\">carried</span> he into <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity</span> from <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> to <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon.</span>","16":"And all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">might,</span> even <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> and <span class=\"wl wl-kjv\" data-code=\"H2796\">craftsmen</span> and <span class=\"wl wl-kjv\" data-code=\"H4525\">smiths</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> all that were <span class=\"wl wl-kjv\" data-code=\"H1368\">strong</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">apt</span> for <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> even them the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H1473\">captive</span> to <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon.</span>","17":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> made <span class=\"wl wl-kjv\" data-code=\"H4983\">Mattaniah</span> his father's <span class=\"wl wl-kjv\" data-code=\"H1730\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">king</span> in his stead, and <span class=\"wl wl-kjv\" data-code=\"H5437\">changed</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> to <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah.</span>","18":"<span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> was <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H259\">eleven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H2537\">Hamutal,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> of <span class=\"wl wl-kjv\" data-code=\"H3841\">Libnah.</span>","19":"And he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> according to all that <span class=\"wl wl-kjv\" data-code=\"H3079\">Jehoiakim</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span>","20":"For through the <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> it came to pass in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> until he had cast them <span class=\"wl wl-kjv\" data-code=\"H7993\">out</span> from his <span class=\"wl wl-kjv\" data-code=\"H6440\">presence,</span> that <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4775\">rebelled</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zijn dagen","tekst":"Te weten, in het vierde jaar zijner regering, hetwelk was het eerste jaar van de regering van Nebukadnezar, Jer 25:1."},{"catchword":"zijn knecht","tekst":"Dat is, hem dienstbaar, zijn gebied onderworpen, cijnsbaar, gehouden hem schatting te betalen. Alzo 2Sa 8:2, 2Sa 8:6."}],"2":[{"catchword":"benden","tekst":"Dat is, hopen van krijgslieden. Zie boven, 2Ki 5:2. Deze waren in den dienst des konings van Babel, makende tezamen zijn leger."},{"catchword":"Chaldeën,","tekst":"Een volk, bewonende het land van Chaldea, waarvan de hoofdstad is Babel. Vergelijk Eze 23:15."},{"catchword":"den dienst Zijner knechten,","tekst":"Hebreeuws, door de hand."},{"catchword":"de profeten","tekst":"Te weten, niet alleen in het algemeen door Mozes, Lev 26:17; Deu 28:25, Deu 28:36, Deu 28:68, enz. maar ook in het bijzonder door de profetes Hulda, boven, 2Ki 22:16, en den profeet Jeremia, Jer 25:9."}],"3":[{"catchword":"bevel","tekst":"Hebreeuws, mond."},{"catchword":"van Zijn aangezicht","tekst":"Vergelijk boven, 2Ki 17:18."},{"catchword":"zonden van Manasse,","tekst":"Zie van deze boven, 2Ki 21, onder welke de afgoderij wel de voornaamste geweest is, die het volk zo nagevolgd heeft, dat het van die, noch door de bekering van Manasse, noch door het goed exempel van Josia, en de goede reformatie bij hem gedaan, niet heeft afgelaten. Waarom ook gezegd wordt dat hij Juda zondigen deed, boven, 2Ki 21:16."}],"4":[{"catchword":"vergoten had,","tekst":"Zie boven, 2Ki 21:16, en de aantekening."}],"6":[{"catchword":"ontsliep","tekst":"Te weten, in Babel, of op den weg, alzo hij gebonden naar Babel gevoerd werd, 2Ch 36:6, en zonder begrafenis te krijgen; gelijk door Jeremia voorzegd was; Jer 22:18-19."},{"catchword":"Jójachin","tekst":"Ook genaamd Jechonia, 1Ch 3:16, en uit verachting Chonia; Jer 22:24."}],"7":[{"catchword":"De koning nu","tekst":"Dit verhaal is om aan te wijzen dat de koning van Juda uit Egypte geen hulp tegen den koning van Babel had te verwachten. Wel is waar, dat hij ten tijde van Zedekia poogde wat te doen, maar tevergeefs, zijnde door de Chaldeën gestuit; Jer 37:6-7."},{"catchword":"rivier van Egypte","tekst":"Genaamd Sichot. Zie Jos 13:3."},{"catchword":"Frath,","tekst":"Anders, Eufraat. Zie Gen 2:14."}],"8":[{"catchword":"achttien jaren oud,","tekst":"Hebreeuws, een zoon van achttien jaar."},{"catchword":"koning werd,","tekst":"Te weten, alleen [gelijk enige geleerden oordelen] en volmachtig koning na den dood zijns vaders. Anders, acht jaren oud zijnde, had de vader hem koning gemaakt, om in zoveel beroerten het koninkrijk in zijn huis te verzekeren, en was alzo tien jaren lang, dat is, totdat zijn vader stierf, koning geweest, uit welke oorzaak gezegd wordt dat hij acht jaren oud was toen hij koning werd; 2Ch 36:9."},{"catchword":"drie maanden","tekst":"En tien dagen, 2Ch 36:9. Zo wordt dikwijls een even getal gesteld voor een oneven. Zie Gen 15:13, en 1Ki 16:8, met de aantekening."}],"10":[{"catchword":"dier tijd","tekst":"Te weten, met de wederkomst van het jaar, 2Ch 36:10. Dat is, met de aankomst van den zomer. Zie 1Ki 20:22."},{"catchword":"werd belegerd","tekst":"Hebreeuws, kwam in belegering; dat is, kwam belegerd te worden. Alzo onder, 2Ki 25:2."}],"12":[{"catchword":"ging Jójachin,","tekst":"Men meent dat hij dit gedaan heeft door den raad van den profeet Jeremia, opdat de tempel en het volk niet gans uitgeroeid zouden worden."},{"catchword":"nam hem gevangen","tekst":"Te weten, om hem gevangen te houden. Zie onder, 2Ki 25:27."},{"catchword":"zijner regering","tekst":"Namelijk, van den koning Nebukadnezar, en niet van Jojachin. Want Jojachin regeerde in volle macht maar drie maanden en tien dagen. Zie boven, vs.8. Vergelijk ook onder, 2Ki 25:8."}],"13":[{"catchword":"hij bracht","tekst":"Namelijk, Nebukadnezar."},{"catchword":"van daar uit","tekst":"Van Jeruzalem."},{"catchword":"hieuw","tekst":"Het Hebreeuwse woord betekent wel eigenlijk afsnijden, of afkorten; maar wordt ook wijders genomen voor wegnemen. De zin is dat hij die vaten heeft weggenomen en den tempel daarvan beroofd. Dat hij enige geheel gelaten heeft, blijkt uit Dan 5:2-3."},{"catchword":"alle gouden vaten af,","tekst":"Dat is, allerlei, bijna alle, een goed deel; gelijk af te nemen is onder, 2Ki 25:15."},{"catchword":"gelijk als","tekst":"Zie boven, 2Ki 20:17, en Jer 20:5."}],"14":[{"catchword":"gans Jeruzalem weg,","tekst":"Dat is, het merendeel der inwoners en der voornaamsten. Vergelijk Mat 3:5."},{"catchword":"strijdbare helden,","tekst":"Alzo Jdg 6:12, en boven, 2Ki 5:1. De Hebreeuwse woorden kan men ook verstaan van degenen, die machtig zijn van middelen, gelijk Rth 2:1."},{"catchword":"tien duizend gevangenen,","tekst":"Dat is, de gehele som der gevangenen, die hierna, vs.16, onderscheidenlijk wordt aangetekend."},{"catchword":"smeden;","tekst":"Of, slotenmakers. Zie verder Jer 24:1."},{"catchword":"arme volk des lands","tekst":"Hebreeuws, de dunheid van het volk des lands. Alzo onder, 2Ki 25:12; Jer 40:7, en Jer 52:16. Dat is, van het schamele, geringe, slechte en uitgeteerde volkje des lands."}],"16":[{"catchword":"ten oorlog","tekst":"Hebreeuws, den oorlog deden; dat is, die den krijg volgden. Zie 1Ki 12:21."}],"17":[{"catchword":"deszelfs oom,","tekst":"Zijns vaders broeder."},{"catchword":"veranderde","tekst":"Hebreeuws, wendde, of keerde om. Alzo boven, 2Ki 23:34, en 2Ch 36:4."},{"catchword":"Zedekia","tekst":"Hebreeuws, Tsidkiahu."}],"18":[{"catchword":"Hamutal,","tekst":"Gelijk boven, 2Ki 23:31. Anders, Hamital, de moeder van Joahaz; zodat Zedekia en Joahaz broeders zijn geweest van volle bed, dat is, van één vader en één moeder."}],"19":[{"catchword":"Jójakim","tekst":"Deze was Zedekia's broeder, alleen van halven bed, namelijk, van één vader, en niet van één moeder. Zie 2Ki 23:36."}],"20":[{"catchword":"om den toorn","tekst":"De Heere, willende de zonden des Joodsen volks straffen, heeft Zedekia den geest der ware bekering niet gegeven, maar heeft hem daartoe laten vervallen, dat hij door kwaden raad en zijn eigen moedwil meinedig is geworden en van den koning Nebukadnezar afvallig."},{"catchword":"van Zijn aangezicht","tekst":"Vergelijk boven, 2Ki 17:18."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In his dayes [to wit, in the fourth year of his reign: which was the first year of Nebuchadnezar king of Babel came up and Jojakim became his servant three years; [that is, his vassal, subjects to his power and command, tributary, bound to pay him tax. So 2 Sam.8.2,6.] then he turned about and rebelled against him."}],"2":[{"catchword":null,"tekst":"and the Lord sent against him the hands, [i.e. heaps of souldiers. See above chapter 5. on v.2. These were in the service of the King of Babel, making up all together his army] of the Chaldeans, [a people inhabitating the land of Chaldea of which Babel was the metropolis or chief city. Compare Ezek. 23.15.] and the hands of the Syrians, and the hands of the Moabites and the hands of the children of Ammon and sent them against Juda, to destroy that, according to the word of the Lord, which he had spoken by the ministery, [Heb. Hand] of his servants the prophets. [to wit, not onely in general by Moseh, Lev.26.17. Deut.28.25,36,68, &c. but also in special by hulda the prophetess, above chap.22.16 and by Jeremia the prophet, Jer 25:9,&c.]"}],"3":[{"catchword":null,"tekst":"Surely (this) came to pass according to the command [Heb. Mouth at the Lord against Juda, to remove them from his face [compare above chap.17. on v.18.] for the sins of Manasseh [see of these sins above chap.21. amongst which the chiefest indeed was idolatry, which the people so imitated that they could not be driven from it neither by the repentance and conversion of Manasseh, that he made Juda to sinne, above chap.11.16] according to all that he had done."}],"4":[{"catchword":null,"tekst":"As also (for) the innocent blood, which he had shed, [see above chap.21.16. and the annotate.] so that he had filled Jerusalem with innocent blood: therefore the Lord would not pardon."}],"5":[{"catchword":null,"tekst":"now the rest of the acts of jojakim, and all that he did; are they not written in the book of the Chronicles of the kings of juda?"}],"6":[{"catchword":null,"tekst":"And Jojakim fell asleep with his father: [to wit, in Babel, or by the way, as he was carried bound to Babel, 2 Chron. 36.6. and without receiving burial as was fortold by Jeremie, jer.22.v.18,19.] and Jojakim his son [called also jechonia, 1 Chron.3. ver.16] and by way of contempt Chrona. Jer 22:24.] became king in his stead."}],"7":[{"catchword":null,"tekst":"now the king of Egypt came thereforth no more out of his hand: [this relation is made to shew, that the king of Juda could expect aid from Egypt against the king of Babel. It&acirc;&euro;&trade;s true indeed, that in Zedekia&acirc;&euro;&trade;s time he attempted to do somewhat but in vain being stopt by the Chaldeans. Jer 37:6,7.] for the king of Babel had taken from the river of Egypt, [called Sichor: see Jos.13.3.] unto the river Phratth, [otherw. Called Euphrates: see gen.2 on ver.14] all that was the king of Egypt."}],"8":[{"catchword":null,"tekst":"Jojachin was eighteen years old, [Heb. A son of eighteen years] when he became king, [to wit, alone (as some of the learned judge) king in full and absolute power after the death of his father. Oth. When he was about the age of 8years, his father made him king in the midst of so many troubles to settle and confirm the kingdome in his own house and continued so king for ten yeares together, that is until his father died, for which cause it is said, that he was eight years old when he became king, 2 chron. 36.v.9.] and reigned three moneths at Jerusalem; [and ten dayes, 2 Chron.36.9. thus often times an even number is put for an odde. See gen. 15.13 and 1 kings 16.8. with the annotate] and his mother&acirc;&euro;&trade;s name was Nehustha, a daughter of Elnathan of Jerusalem."}],"9":[{"catchword":null,"tekst":"And he did that which was evil in the eyes of the Lord, according to all that his father had done."}],"10":[{"catchword":null,"tekst":"At that time [To wit, at the return of the year, 2 chron.36.10. that is, at the coming on or beginning of the summer. See 1 kings 20 on v.22.] the servant of Nebuchadnezar King to Babel marched toward Jerusalem; and the city was besieged. [Heb. Came in siege; that is, came to be besieged or was besieged: so below chap.25.2.]"}],"11":[{"catchword":null,"tekst":"Nebuchadnezar king of Babel came himself against the city when his servants besieged it."}],"12":[{"catchword":null,"tekst":"Then Jojakim king of Juda went to the king of Babel, he and his mother and his servants and his princess and his courtiers: [it&acirc;&euro;&trade;s conceived that he did this by the prophet Jeremie&acirc;&euro;&trade;s advice, that the temple and the people might not be utterly destroyed] and the king of Babel took him (captive) [to wit, to keep him prisoner. See below chapter 25.27.] In the eighth year of his reign, [to wit, of king Nebuchadnezar&acirc;&euro;&trade;s reign, not of Jojachins. For Jojachin reigned but three moneths and ten dayes, in full and absolute power. See above on verse 7. compare also below chap.25.8]"}],"13":[{"catchword":null,"tekst":"And he [namely, Nebuchadnezar] carried out thence [i.e. from Jerusalem] all the treasures of the house of the Lord, and the treasures of the king&acirc;&euro;&trade;s house; and be cut down all [i.e. ornaments, of almost all, a great part; as appeareth below, chap. 25.15] the golden vessel, [the word rendred here cutting down, signifieth properly casting off, or shortening off but is also further taken for taking away. The meaning is, that he took away those vessels and robbed the temple of them. That he left some whole and undefaced, appeareth by Dan.5.v2.3.] which Solomon the king of Israel had made the temple of the Lord according as the Lord had spoken. [see above chap. 20.17 and Jer 20:5.]"}],"14":[{"catchword":null,"tekst":"And he carried away all Jerusalem. [that is, the most part of the inhabitants and the chiefest. C // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
