,"href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen riep de profeet Elisa een van de zonen van de profeten, en hij zei tegen hem: Gord uw lenden, en neem deze oliekruik in uw hand, en ga naar Ramoth in Gilead.","2":"Als u daar gekomen bent, kijk dan waar Jehu, de zoon van Josafat, de zoon van Nimsi, is; ga naar binnen, en laat hem opstaan uit het midden van zijn broeders, en breng hem in een binnenste kamer.","3":"En neem de oliekruik, en giet die uit over zijn hoofd, en zeg: Zo zegt de HEERE: Ik heb u tot koning gezalfd over Israël. Doe daarna de deur open, en vlucht, en wacht niet.","4":"Zo ging de jongeman, die jongeman van de profeet, naar Ramoth in Gilead.","5":"En toen hij binnenkwam, zie, daar zaten de hoofdmannen van het leger, en hij zei: Ik heb een woord aan u, o hoofdman! En Jehu zei: Aan wie van ons allen? En hij zei: Aan u, o hoofdman!","6":"Toen stond hij op, en ging het huis in; hij goot de olie op zijn hoofd, en zei tegen hem: Zo zegt de HEERE, de God van Israël: Ik heb u gezalfd tot koning over het volk van de HEERE, over Israël.","7":"En u zult het huis van Achab, uw heer, verslaan, opdat Ik het bloed van Mijn knechten, de profeten, en het bloed van alle knechten van de HEERE, wreekt op de hand van Izebel.","8":"En het hele huis van Achab zal omkomen; en Ik zal van Achab uitroeien wie mannelijk is, ook wie in Israël opgesloten is en wie verlaten is.","9":"Want Ik zal het huis van Achab maken als het huis van Jerobeam, de zoon van Nebat, en als het huis van Baësa, de zoon van Ahia.","10":"Ook zullen de honden Izebel eten op het stuk *land* van Jizreël, en er zal niemand zijn die haar kan begraven. Toen deed hij de deur open en vluchtte.","11":"En toen Jehu naar buiten kwam bij de knechten van zijn heer, zei men tegen hem: Is het al goed? Waarom is deze onzinnige naar u toe gekomen? En hij zei tegen hen: U kent de man en zijn manier van spreken.","12":"Maar zij zeiden: Het is een leugen; vertel het ons nu. En hij zei: Zo en zo heeft hij tegen mij gesproken, en hij zei: Zo zegt de HEERE: Ik heb u gezalfd tot koning over Israël.","13":"Toen haastten zij zich, en ieder nam zijn kleed, en legde het onder hem, op de hoogste trap; en zij bliezen op de bazuin, en zeiden: Jehu is koning geworden!","14":"Zo smeedde Jehu, de zoon van Josafat, de zoon van Nimsi, een samenzwering tegen Joram. (Joram had namelijk Ramoth in Gilead bewaakt, hij en heel Israël, vanwege Hazaël, de koning van Syrië;","15":"maar de koning Joram was teruggekeerd om zich in Jizreël te laten genezen van de verwondingen die de Syriërs hem toegebracht hadden, toen hij streed tegen Hazaël, de koning van Syrië.) En Jehu zei: Als dit uw wens is, laat dan niemand uit de stad ontkomen, die dit in Jizreël zou gaan vertellen.","16":"Toen reed Jehu, en trok naar Jizreël; want Joram lag daar; en Ahazia, de koning van Juda, was afgekomen om Joram te bezoeken.","17":"De wachter nu stond op de toren te Jizreël, en zag de troep van Jehu, toen hij aankwam, en zei: Ik zie een troep. Toen zei Joram: Neem een ruiter, en stuur die hun tegemoet, en laat hij zeggen: Is het vrede?","18":"En de ruiter te paard ging hem tegemoet, en zei: Zo zegt de koning: Is het vrede? En Jehu zei: Wat hebt u met de vrede te maken? Kom achter mij. En de wachter meldde het, en zei: De bode is bij hen gekomen, maar hij komt niet terug.","19":"Toen stuurde hij een tweede ruiter te paard; en toen deze bij hen gekomen was, zei hij: Zo zegt de koning: Is het vrede? En Jehu zei: Wat hebt u met de vrede te maken? Kom achter mij.","20":"En de wachter meldde dit, en zei: Hij is tot bij hen gekomen, maar hij komt niet terug; en het rijden is als het rijden van Jehu, de zoon van Nimsi, want hij rijdt onzinnig.","21":"Toen zei Joram: Span aan. En men spande zijn wagen aan. Zo trok Joram, de koning van Israël, uit, en Ahazia, de koning van Juda, ieder op zijn wagen; en zij trokken Jehu tegemoet, en vonden hem op het stuk *land* van Naboth, de Jizreëliet.","22":"Het gebeurde nu, toen Joram Jehu zag, dat hij zei: Is het ook vrede, Jehu? Maar hij zei: Wat vrede, zolang de hoererijen van uw moeder Izebel, en haar toverijen, zo veel zijn?","23":"Toen wendde Joram zijn hand, en vluchtte, en zei tegen Ahazia: Het is bedrog, Ahazia!","24":"Maar Jehu spande de boog met volle kracht, en schoot Joram tussen zijn armen, zodat de pijl door zijn hart naar buiten kwam; en hij zeeg neer in zijn wagen.","25":"Toen zei Jehu tegen Bidkar, zijn hoofdman: Neem hem op, werp hem op dat stuk land van Naboth, de Jizreëliet; want gedenk, toen ik en u samen achter zijn vader Achab reden, dat de HEERE hem deze last oplegde, en zei:","26":"Zeker heb Ik gisteravond het bloed van Naboth gezien, en het bloed van zijn zonen, zegt de HEERE, en Ik zal het u vergelden op dit stuk *land*, zegt de HEERE. Nu dan, neem hem op, werp hem op dat stuk *land*, naar het woord van de HEERE.","27":"Toen Ahazia, de koning van Juda, dat zag, vluchtte hij via de weg naar het huis van de hoftuin; maar Jehu vervolgde hem, en zei: Sla hem ook neer op de wagen, bij de opgang naar Gur, die bij Jibleam is; en hij vluchtte naar Megiddo, en stierf daar.","28":"En zijn knechten voerden hem naar Jeruzalem, en zij begroeven hem in zijn graf, bij zijn vaderen in de stad van David.","29":"In het elfde jaar van Joram, de zoon van Achab, was Ahazia koning geworden over Juda.","30":"En Jehu kwam te Jizreël. Toen Izebel dat hoorde, blankette zij haar gezicht, en versierde haar hoofd, en keek uit het venster.","31":"Toen Jehu nu door de poort naar binnen kwam, zei zij: Is het goed, o Zimri, doodslager van zijn heer?","32":"En hij hief zijn gezicht op naar het venster, en zei: Wie is met mij? Wie? Toen keken er twee, drie kamerlingen naar hem.","33":"En hij zei: Gooi haar naar beneden. En zij gooiden haar naar beneden, zodat van haar bloed tegen de muur en tegen de paarden gespat werd; en hij vertrapte haar.","34":"Toen hij nu binnengekomen was, en gegeten en gedronken had, zei hij: Kijk nu naar die vervloekte, en begraaf haar; want zij is een koningsdochter.","35":"En zij gingen haar begraven; maar zij vonden niets van haar dan de schedel, en de voeten, en de palmen van haar handen.","36":"Toen kwamen zij terug, en vertelden het hem, en hij zei: Dit is het woord van de HEERE, dat Hij gesproken heeft door de dienst van Zijn knecht Elia, de Thisbiet, en zei: Op het stuk *land* van Jizreël zullen de honden het vlees van Izebel eten.","37":"En het dode lichaam van Izebel zal zijn als mest op het veld, in het stuk *land* van Jizreël, zodat men niet zal kunnen zeggen: Dit is Izebel."},"SV":{"1":"Toen riep de profeet Elisa een van de zonen der profeten, en hij zeide tot hem: Gord uw lenden, en neem deze oliekruik in uw hand, en ga heen naar Ramoth in Gilead.","2":"Als gij daar zult gekomen zijn, zo zie, waar Jehu, de zoon van Josafat, den zoon van Nimsi, is; en ga in, en doe hem opstaan uit het midden zijner broederen, en breng hem in een binnenste kamer.","3":"En neem de oliekruik, en giet ze uit op zijn hoofd, en zeg: Zo zegt de HEERE: Ik heb u tot koning gezalfd over Israël. Doe daarna de deur open, en vlied, en vertoef niet.","4":"Zo ging de jongeling, die jongeling van den profeet, naar Ramoth in Gilead.","5":"En toen hij inkwam, ziet, daar zaten de hoofdmannen van het heir, en hij zeide: Ik heb een woord aan u, o hoofdman! En Jehu zeide: Tot wien van ons allen? En hij zeide: Tot u, o hoofdman!","6":"Toen stond hij op, en ging in huis; hij dan goot de olie op zijn hoofd, en hij zeide tot hem: Zo zegt de HEERE, de God Israëls: Ik heb u gezalfd tot koning over het volk des HEEREN, over Israël.","7":"En gij zult het huis van Achab, uw heer, slaan, opdat Ik het bloed van Mijn knechten, de profeten, en het bloed van alle knechten des HEEREN, wreke van de hand van Izebel.","8":"En het ganse huis van Achab zal omkomen; en Ik zal van Achab uitroeien, wat mannelijk is, ook den beslotene en verlatene in Israël.","9":"Want Ik zal het huis van Achab maken als het huis van Jerobeam, den zoon van Nebat, en als het huis van Baësa, den zoon van Ahia.","10":"Ook zullen de honden Izebel eten op het stuk *lands* van Jizreël, en er zal niemand zijn, die *haar* begrave. Toen deed hij de deur open en vlood.","11":"En als Jehu uitging tot de knechten zijns heren, zeide men tot hem: Is het al wel? Waarom is deze onzinnige tot u gekomen? En hij zeide tot hen: Gij kent den man en zijn spraak.","12":"Maar zij zeiden: Het is leugen; geef het ons nu te kennen. En hij zeide: Zo en zo heeft hij tot mij gesproken, zeggende: Zo zegt de HEERE: Ik heb u gezalfd tot koning over Israël.","13":"Toen haastten zij zich, en een iegelijk nam zijn kleed, en leide het onder hem, op den hoogsten trap; en zij bliezen met de bazuin, en zeiden: Jehu is koning geworden!","14":"Alzo maakte Jehu, de zoon van Josafat, den zoon van Nimsi, een verbintenis tegen Joram. ( Joram nu had Ramoth in Gilead bewaard, hij en gans Israël, uit oorzake van Hazaël, den koning van Syrië;","15":"Maar de koning Joram was wedergekeerd, opdat hij zich te Jizreël helen liet van de slagen, die hem de Syriërs geslagen hadden, als hij streed tegen Hazaël, den koning van Syrië.) En Jehu zeide: Zo het ulieder wil is, laat niemand van de stad uittrekken, die ontkome, om *dit* in Jizreël te gaan verkondigen.","16":"Toen reed Jehu, en toog naar Jizreël; want Joram lag aldaar; en Ahazia, de koning van Juda, was afgekomen, om Joram te bezien.","17":"De wachter nu stond op den toren te Jizreël, en zag den hoop van Jehu, als hij aankwam, en zeide: Ik zie een hoop. Toen zeide Joram: Neem een ruiter, en zend *dien* hunlieden tegemoet, en dat hij zegge: Is het vrede?","18":"En de ruiter te paard toog heen hem tegemoet, en zeide: Zo zegt de koning: Is het vrede? En Jehu zeide: Wat hebt gij met den vrede te doen? Keer om naar achter mij. En de wachter gaf het te kennen, zeggende: De bode is tot hen gekomen, maar hij komt niet weder.","19":"Toen zond hij een anderen ruiter te paard; en als deze tot hen gekomen was, zeide hij: Zo zegt de koning: Is het vrede? En Jehu zeide: Wat hebt gij met den vrede te doen? Keer om naar achter mij.","20":"En de wachter gaf dit te kennen, zeggende: Hij is tot aan hen gekomen, maar hij komt niet weder; en het drijven is als het drijven van Jehu, den zoon van Nimsi, want hij drijft onzinniglijk.","21":"Toen zeide Joram: Span aan. En men spande zijn wagen aan. Zo toog Joram, de koning van Israël, uit, en Ahazia, de koning van Juda, een ieder op zijn wagen; en zij togen uit Jehu tegemoet, en vonden hem op het stuk *lands* van Naboth, den Jizreëliet.","22":"Het geschiedde nu, als Joram Jehu zag, dat hij zeide: Is het ook vrede, Jehu? Maar hij zeide: Wat vrede, zo lang als de hoererijen van uw moeder Izebel, en haar toverijen zo vele zijn?","23":"Toen keerde Joram zijn hand, en vlood, en zeide tot Ahazia: Het is bedrog, Ahazia!","24":"Maar Jehu spande den boog met volle kracht, en schoot Joram tussen zijn armen, dat de pijl door zijn hart uitging; en hij kromde zich in zijn wagen.","25":"Toen zeide *Jehu* tot Bidkar, zijn hoofdman: Neem, werp hem op dat stuk lands van Naboth, den Jizreëliet; want gedenk, als ik en gij nevens elkander achter zijn vader Achab reden, dat hem de HEERE dezen last opleide, *zeggende*:","26":"Zo Ik gisteravond niet gezien heb het bloed van Naboth, en het bloed zijner zonen, zegt de HEERE, en Ik u dat niet vergelde op dit stuk *lands*, zegt de HEERE. Nu dan, neem, werp hem op dat stuk *lands*, naar het woord des HEEREN.","27":"Als Ahazia, de koning van Juda, dat zag, zo vlood hij door den weg van het huis des hofs; doch Jehu vervolgde hem achterna, en zeide: Slaat hem ook op den wagen, aan den opgang naar Gur, die bij Jibleam is; en hij vlood naar Megiddo, en stierf aldaar.","28":"En zijn knechten voerden hem naar Jeruzalem, en zij begroeven hem in zijn graf, bij zijn vaderen in de stad Davids.","29":"In het elfde jaar nu van Joram, den zoon van Achab, was Ahazia koning geworden over Juda.","30":"En Jehu kwam te Jizreël. Als Izebel *dat* hoorde, zo blankette zij haar aangezicht, en versierde haar hoofd, en keek ten venster uit.","31":"Toen nu Jehu ter poorte inkwam, zeide zij: Is het wel, o Zimri, doodslager van zijn heer?","32":"En hij hief zijn aangezicht op naar het venster, en zeide: Wie is met mij? Wie? Toen zagen op hem twee, drie kamerlingen.","33":"En hij zeide: Stoot ze van boven neder. En zij stieten haar van boven neder, zodat van haar bloed aan den wand en aan de paarden gesprengd werd; en hij vertrad haar.","34":"Als hij nu ingekomen was, en gegeten en gedronken had, zeide hij: Ziet nu naar die vervloekte, en begraaf ze; want zij is eens konings dochter.","35":"En zij gingen heen om haar te begraven; doch zij vonden niet van haar, dan het bekkeneel, en de voeten, en de palmen harer handen.","36":"Toen kwamen zij weder, en gaven het hem te kennen, en hij zeide: Dit is het woord des HEEREN, dat Hij gesproken heeft door den dienst van Zijn knecht Elia, den Thisbiet, zeggende: Op het stuk *lands* van Jizreël zullen de honden het vlees van Izebel eten.","37":"En het dode lichaam van Izebel zal zijn gelijk mest op het veld, in het stuk *lands* van Jizreël, dat men niet zal kunnen zeggen: Dit is Izebel."},"KJV":{"1":"And Elisha the prophet called one of the children of the prophets, and said unto him, Gird up thy loins, and take this box of oil in thine hand, and go to Ramothgilead:","2":"And when thou comest thither, look out there Jehu the son of Jehoshaphat the son of Nimshi, and go in, and make him arise up from among his brethren, and carry him to an inner chamber;","3":"Then take the box of oil, and pour it on his head, and say, Thus saith the LORD, I have anointed thee king over Israel. Then open the door, and flee, and tarry not.","4":"So the young man, even the young man the prophet, went to Ramothgilead.","5":"And when he came, behold, the captains of the host were sitting; and he said, I have an errand to thee, O captain. And Jehu said, Unto which of all us? And he said, To thee, O captain.","6":"And he arose, and went into the house; and he poured the oil on his head, and said unto him, Thus saith the LORD God of Israel, I have anointed thee king over the people of the LORD, even over Israel.","7":"And thou shalt smite the house of Ahab thy master, that I may avenge the blood of my servants the prophets, and the blood of all the servants of the LORD, at the hand of Jezebel.","8":"For the whole house of Ahab shall perish: and I will cut off from Ahab him that pisseth against the wall, and him that is shut up and left in Israel:","9":"And I will make the house of Ahab like the house of Jeroboam the son of Nebat, and like the house of Baasha the son of Ahijah:","10":"And the dogs shall eat Jezebel in the portion of Jezreel, and there shall be none to bury her. And he opened the door, and fled.","11":"Then Jehu came forth to the servants of his lord: and one said unto him, Is all well? wherefore came this mad fellow to thee? And he said unto them, Ye know the man, and his communication.","12":"And they said, It is false; tell us now. And he said, Thus and thus spake he to me, saying, Thus saith the LORD, I have anointed thee king over Israel.","13":"Then they hasted, and took every man his garment, and put it under him on the top of the stairs, and blew with trumpets, saying, Jehu is king.","14":"So Jehu the son of Jehoshaphat the son of Nimshi conspired against Joram. (Now Joram had kept Ramothgilead, he and all Israel, because of Hazael king of Syria.","15":"But king Joram was returned to be healed in Jezreel of the wounds which the Syrians had given him, when he fought with Hazael king of Syria.) And Jehu said, If it be your minds, then let none go forth nor escape out of the city to go to tell it in Jezreel.","16":"So Jehu rode in a chariot, and went to Jezreel; for Joram lay there. And Ahaziah king of Judah was come down to see Joram.","17":"And there stood a watchman on the tower in Jezreel, and he spied the company of Jehu as he came, and said, I see a company. And Joram said, Take an horseman, and send to meet them, and let him say, Is it peace?","18":"So there went one on horseback to meet him, and said, Thus saith the king, Is it peace? And Jehu said, What hast thou to do with peace? turn thee behind me. And the watchman told, saying, The messenger came to them, but he cometh not again.","19":"Then he sent out a second on horseback, which came to them, and said, Thus saith the king, Is it peace? And Jehu answered, What hast thou to do with peace? turn thee behind me.","20":"And the watchman told, saying, He came even unto them, and cometh not again: and the driving is like the driving of Jehu the son of Nimshi; for he driveth furiously.","21":"And Joram said, Make ready. And his chariot was made ready. And Joram king of Israel and Ahaziah king of Judah went out, each in his chariot, and they went out against Jehu, and met him in the portion of Naboth the Jezreelite.","22":"And it came to pass, when Joram saw Jehu, that he said, Is it peace, Jehu? And he answered, What peace, so long as the whoredoms of thy mother Jezebel and her witchcrafts are so many?","23":"And Joram turned his hands, and fled, and said to Ahaziah, There is treachery, O Ahaziah.","24":"And Jehu drew a bow with his full strength, and smote Jehoram between his arms, and the arrow went out at his heart, and he sunk down in his chariot.","25":"Then said Jehu to Bidkar his captain, Take up, and cast him in the portion of the field of Naboth the Jezreelite: for remember how that, when I and thou rode together after Ahab his father, the LORD laid this burden upon him;","26":"Surely I have seen yesterday the blood of Naboth, and the blood of his sons, saith the LORD; and I will requite thee in this plat, saith the LORD. Now therefore take and cast him into the plat of ground, according to the word of the LORD.","27":"But when Ahaziah the king of Judah saw this, he fled by the way of the garden house. And Jehu followed after him, and said, Smite him also in the chariot. And they did so at the going up to Gur, which is by Ibleam. And he fled to Megiddo, and died there.","28":"And his servants carried him in a chariot to Jerusalem, and buried him in his sepulchre with his fathers in the city of David.","29":"And in the eleventh year of Joram the son of Ahab began Ahaziah to reign over Judah.","30":"And when Jehu was come to Jezreel, Jezebel heard of it; and she painted her face, and tired her head, and looked out at a window.","31":"And as Jehu entered in at the gate, she said, Had Zimri peace, who slew his master?","32":"And he lifted up his face to the window, and said, Who is on my side? who? And there looked out to him two or three eunuchs.","33":"And he said, Throw her down. So they threw her down: and some of her blood was sprinkled on the wall, and on the horses: and he trode her under foot.","34":"And when he was come in, he did eat and drink, and said, Go, see now this cursed woman, and bury her: for she is a king's daughter.","35":"And they went to bury her: but they found no more of her than the skull, and the feet, and the palms of her hands.","36":"Wherefore they came again, and told him. And he said, This is the word of the LORD, which he spake by his servant Elijah the Tishbite, saying, In the portion of Jezreel shall dogs eat the flesh of Jezebel:","37":"And the carcase of Jezebel shall be as dung upon the face of the field in the portion of Jezreel; so that they shall not say, This is Jezebel."}},"tsk":{"1":[{"kopje":"de zonen","refs":["2 Kon 4:1","2 Kon 6:1-3"]},{"kopje":"Gord uw lenden","refs":["2 Kon 4:29","1 Kon 18:46","Jer 1:17","Luk 12:35-37","1 Petr 1:13"]},{"kopje":"oliekruik","refs":["1 Sam 10:1","1 Sam 16:1","1 Kon 1:39"]},{"kopje":"Ramoth in Gilead","refs":["2 Kon 8:28","2 Kon 8:29","Deut 4:1","Deut 4:3","1 Kon 22:4","1 Kon 22:20"]}],"2":[{"kopje":"Jehu","refs":["2 Kon 9:14","1 Kon 19:16","1 Kon 19:17"]},{"kopje":"uit het midden van zijn broeders","refs":["2 Kon 9:5","2 Kon 9:11"]},{"kopje":"binnenste kamer","refs":["1 Kon 20:30","1 Kon 22:25"]}],"3":[{"kopje":"giet die uit","refs":["Ex 29:7","Lev 8:12","1 Sam 16:13","1 Kon 19:16"]},{"kopje":"Ik heb u tot koning gezalfd","refs":["2 Kon 8:13","1 Sam 9:16","1 Sam 15:1","1 Sam 15:17","1 Sam 16:12","Ps 75:7","Ps 75:8","Spr 8:15","Spr 8:16","Jer 27:5-7","Dan 2:1","Dan 4:35","Dan 5:18","Joh 19:10","Joh 19:11"]},{"kopje":"en vlucht","refs":["1 Sam 16:2","Matt 2:13","Matt 10:16"]}],"4":[{"kopje":"de jongeman","refs":["2 Kon 9:4"]}],"5":[{"kopje":"Ik heb een woord","refs":["Richt 3:19"]}],"6":[{"kopje":"stond hij op","refs":["Hand 23:18","Hand 23:19"]},{"kopje":"Ik heb u gezalfd","refs":["2 Kon 9:3","1 Kon 1:34","1 Kon 19:16","2 Kron 22:7","Ps 2:6","Ps 75:7","Jes 45:1", >","2":"And when thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> thither, look <span class=\"wl wl-kjv\" data-code=\"H7200\">out</span> there <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5250\">Nimshi,</span> and go <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and make him arise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">carry</span> him to an <span class=\"wl wl-kjv\" data-code=\"H2315\">inner</span> <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber;</span>","3":"Then <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H6378\">box</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H3332\">pour</span> it on his <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> I have <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed</span> thee <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span> Then <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door,</span> and <span class=\"wl wl-kjv\" data-code=\"H5127\">flee,</span> and <span class=\"wl wl-kjv\" data-code=\"H2442\">tarry</span> not.","4":"So the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man,</span> even the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead.</span>","5":"And when he <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H2428\">host</span> were <span class=\"wl wl-kjv\" data-code=\"H3427\">sitting;</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I have an <span class=\"wl wl-kjv\" data-code=\"H1697\">errand</span> to thee, O <span class=\"wl wl-kjv\" data-code=\"H8269\">captain.</span> And <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Unto which of all us? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> To thee, O <span class=\"wl wl-kjv\" data-code=\"H8269\">captain.</span>","6":"And he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and he <span class=\"wl wl-kjv\" data-code=\"H3332\">poured</span> the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> on his <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> I have <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed</span> thee <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> even over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","7":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> thy <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H5358\">avenge</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of my <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of all the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> at the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel.</span>","8":"For the whole <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> shall <span class=\"wl wl-kjv\" data-code=\"H6\">perish:</span> and I will cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> him that <span class=\"wl wl-kjv\" data-code=\"H8366\">pisseth</span> against the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall,</span> and him that is shut <span class=\"wl wl-kjv\" data-code=\"H6113\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span>","9":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> like the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5028\">Nebat,</span> and like the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah:</span>","10":"And the <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> in the <span class=\"wl wl-kjv\" data-code=\"H2506\">portion</span> of <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel,</span> and there shall be none to <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> her. And he <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door,</span> and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled.</span>","11":"Then <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of his <span class=\"wl wl-kjv\" data-code=\"H113\">lord:</span> and one <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Is all <span class=\"wl wl-kjv\" data-code=\"H7965\">well?</span> wherefore <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> this <span class=\"wl wl-kjv\" data-code=\"H7696\">mad</span> fellow to thee? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Ye <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7879\">communication.</span>","12":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is <span class=\"wl wl-kjv\" data-code=\"H8267\">false;</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> us now. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thus and thus <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> he to me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> I have <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed</span> thee <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","13":"Then they <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">garment,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> it under him on the <span class=\"wl wl-kjv\" data-code=\"H1634\">top</span> of the <span class=\"wl wl-kjv\" data-code=\"H4609\">stairs,</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> with <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> is <span class=\"wl wl-kjv\" data-code=\"H4427\">king.</span>","14":"So <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5250\">Nimshi</span> <span class=\"wl wl-kjv\" data-code=\"H7194\">conspired</span> against <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram.</span> (Now <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> had <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead,</span> he and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria.</span>","15":"But <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3088\">Joram</span> was <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to be <span class=\"wl wl-kjv\" data-code=\"H7495\">healed</span> in <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel</span> of the <span class=\"wl wl-kjv\" data-code=\"H4347\">wounds</span> which the <span class=\"wl wl-kjv\" data-code=\"H761\">Syrians</span> had <span class=\"wl wl-kjv\" data-code=\"H5221\">given</span> him, when he <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> with <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria.)</span> And <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If it <span class=\"wl wl-kjv\" data-code=\"H3426\">be</span> your <span class=\"wl wl-kjv\" data-code=\"H5315\">minds,</span> then let <span class=\"wl wl-kjv\" data-code=\"H408\">none</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> nor <span class=\"wl wl-kjv\" data-code=\"H6412\">escape</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> it in <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel.</span>","16":"So <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> rode in a <span class=\"wl wl-kjv\" data-code=\"H7392\">chariot,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel;</span> for <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> there. And <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> was come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> <span class=\"wl wl-kjv\" data-code=\"H3141\">Joram.</span>","17":"And there <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> a <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> on the <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> in <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel,</span> and he <span class=\"wl wl-kjv\" data-code=\"H7200\">spied</span> the <span class=\"wl wl-kjv\" data-code=\"H8229\">company</span> of <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> as he <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> a <span class=\"wl wl-kjv\" data-code=\"H8229\">company.</span> And <span class=\"wl wl-kjv\" data-code=\"H3088\">Joram</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> an <span class=\"wl wl-kjv\" data-code=\"H7395\">horseman,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> them, and let him <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Is it <span class=\"wl wl-kjv\" data-code=\"H7965\">peace?</span>","18":"So there <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> one on <span class=\"wl wl-kjv\" data-code=\"H7392\">horseback</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Is it <span class=\"wl wl-kjv\" data-code=\"H7965\">peace?</span> And <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What hast thou to do with <span class=\"wl wl-kjv\" data-code=\"H7965\">peace?</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">turn</span> thee <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> me. And the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to them, but he cometh not <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span>","19":"Then he sent <span class=\"wl wl-kjv\" data-code=\"H7971\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> on <span class=\"wl wl-kjv\" data-code=\"H7392\">horseback,</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to them, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Is it <span class=\"wl wl-kjv\" data-code=\"H7965\">peace?</span> And <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> What hast thou to do with <span class=\"wl wl-kjv\" data-code=\"H7965\">peace?</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">turn</span> thee <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> me.","20":"And the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> He <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> even unto them, and cometh not <span class=\"wl wl-kjv\" data-code=\"H7725\">again:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4491\">driving</span> is like the <span class=\"wl wl-kjv\" data-code=\"H4491\">driving</span> of <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5250\">Nimshi;</span> for he <span class=\"wl wl-kjv\" data-code=\"H5090\">driveth</span> <span class=\"wl wl-kjv\" data-code=\"H7697\">furiously.</span>","21":"And <span class=\"wl wl-kjv\" data-code=\"H3088\">Joram</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Make <span class=\"wl wl-kjv\" data-code=\"H631\">ready.</span> And his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> was made <span class=\"wl wl-kjv\" data-code=\"H631\">ready.</span> And <span class=\"wl wl-kjv\" data-code=\"H3088\">Joram</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> <span class=\"wl wl-kjv\" data-code=\"H376\">each</span> in his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot,</span> and they went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">met</span> him in the <span class=\"wl wl-kjv\" data-code=\"H2513\">portion</span> of <span class=\"wl wl-kjv\" data-code=\"H5022\">Naboth</span> the <span class=\"wl wl-kjv\" data-code=\"H3158\">Jezreelite.</span>","22":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3088\">Joram</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu,</span> that he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is it <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> What <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> so long <span class=\"wl wl-kjv\" data-code=\"H5704\">as</span> the <span class=\"wl wl-kjv\" data-code=\"H2183\">whoredoms</span> of thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> <span class=\"wl wl-kjv\" data-code=\"H348\">Jezebel</span> and her <span class=\"wl wl-kjv\" data-code=\"H3785\">witchcrafts</span> are so <span class=\"wl wl-kjv\" data-code=\"H7227\">many?</span>","23":"And <span class=\"wl wl-kjv\" data-code=\"H3088\">Joram</span> <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah,</span> There is <span class=\"wl wl-kjv\" data-code=\"H4820\">treachery,</span> O <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah.</span>","24":"And <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> drew a <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> with his <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">strength,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H3088\">Jehoram</span> between his <span class=\"wl wl-kjv\" data-code=\"H2220\">arms,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2678\">arrow</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> at his <span class=\"wl wl-kjv\" data-code=\ de Syriërs geslagen hadden. Zie vs.15."}],"18":[{"catchword":"Is het vrede?","tekst":"Dat is, gaat het wel? Is er geen zwarigheid of onraad? alzo onder, vs.19, 22. Zie Gen 29:6."},{"catchword":"Wat hebt gij","tekst":"Hebreeuws, wat is u en den vrede? Dat is, wat hebt gij met den vrede te doen? Alzo in vs.19. Zie 2Sa 16:10."}],"20":[{"catchword":"onzinniglijk","tekst":"Hebreeuws, in onzinnigheid, of met onzinnigheid; dat is met zulke snelheid en onstuimigheid, alsof hi onzinnig was en de paarden zoch den hals af te rijden."}],"21":[{"catchword":"lands","tekst":"Zie boven, vs.10."}],"22":[{"catchword":"hoererijen","tekst":"Versta, geestelijke, welke is afgoderij. Zie Lev 17:7, en Lev 20:5."},{"catchword":"toverijen","tekst":"Versta, de bedriegelijke praktijken, door welke Izebel de mensen tot de afgoderij aanlokte en vervolgde. Vergelijk Nah 3:4."}],"23":[{"catchword":"zijn hand,","tekst":"Te weten, waarmede hij zichzelven omkeerde in den wagen, of zijn voerman de weet gaf, of ook zelf aan de strengen vatte, om den wagen af te wenden en de vlucht te nemen. Vergelijk 1Ki 22:34."},{"catchword":"Het is bedrog,","tekst":"Dat is, Jehu is bedriegelijk en verraderlijk hier gekomen om mij te overvallen en te vermoorden."}],"24":[{"catchword":"spande den boog","tekst":"Hebreeuws, vulde zijn hand met den boog. Versta, dat hij al de kracht zijns arms bijbracht om den boog ten volle te spannen, uit te rekken en daarmede een geweldig schot te geven."},{"catchword":"schoot","tekst":"Hebreeuws, sloeg."},{"catchword":"kromde zich","tekst":"Dat is, zonk neder in zijn wagen."}],"25":[{"catchword":"gedenk,","tekst":"Het schijnt dat Achab, als hij na den dood van Naboth, ging om zijn wijnberg in te nemen, bij zich gehad heeft enige hovelingen en krijgsofficieren, en dat onder dezen geweest zijn Jehu en Bidkar, en gehoord hebben de woorden, in vs.26 gesteld, van Elia tegen Achab uitgesproken."},{"catchword":"last oplegde,","tekst":"Dat is, dit profetisch dreigement, of deze voorzegde straf. Zo wordt het woord last veel bij de profeten genomen, omdat de straffen zwaar zijn, zowel in het horen als zij verkondigd worden, als in het gevoelen, wanneer zij den mens dadelijk treffen; Isa 13:1, en Isa 15:1; Jer 23:33-34; Nah 1:1; Hab 1:1; Zec 9:1."}],"26":[{"catchword":"Ik gisteravond","tekst":"Dit zijn de woorden des Heeren met een eed tegen Achab uitgesproken."},{"catchword":"zijner zonen,","tekst":"Hieruit kan afgenomen worden, dat niet alleen Naboth is vermoord geweest, maar ook zijne kinderen, opdat Achab te geruster het goed van Naboth bezitten mocht."},{"catchword":"lands,","tekst":"Zie boven, vs.10."},{"catchword":"zegt de HEERE","tekst":"Dat is, Ik heb het zekerlijk gezien, en Ik zal het u zekerlijk op dit stuk land vergelden. Zie van deze manier van zweren, ook Gode toegeschreven, Num 14:23."}],"27":[{"catchword":"weg van het huis des hofs;","tekst":"Dat is, die met bomen beplant was, zodat men in het vluchten daar beter dan elders verborgen kon zijn, om zekerlijk weg te komen."},{"catchword":"Slaat hem ook","tekst":"Dat is, brengt hem om, want hij was ook van het geslacht van Achab, te weten, van de zijde zijner moeder, die Achabs dochter was. Zie boven, 2Ki 8:18."},{"catchword":"Gur,","tekst":"Dit schijnt een plaats geweest te zijn op den weg naar Samaria, door welke Ahazia vluchtte, als Jehu bezig was met Joram om te brengen. Jehu nu ziende dat Ahazia hem ontgaan was, heeft zijn krijgslieden hem nagezonden. Deze, naar sommiger mening, zijn hem in deze plaats zo nabij gekomen, dat zij hem aldaar gekwetst hebben, doch niet dodelijk, zulks dat hij te Samaria ontkomen is, waar hij zich verstoken heeft, 2Ch 22:9, totdat hij daar ook vervolgd zijnde om tot Jehu gebracht te worden, dodelijk gewond is geworden, doch ontkomen te Megiddo, waar hij gestorven is."},{"catchword":"Jibleam is;","tekst":"Zie Jos 17:11."},{"catchword":"Megiddo,","tekst":"Zie 1Ki 9:15."}],"28":[{"catchword":"Davids","tekst":"Zie 1Ki 2:10."}],"29":[{"catchword":"elfde jaar","tekst":"Dat is, in het einde van het elfde en begin van het twaalfde jaar. Zie boven, 2Ki 8:25."}],"30":[{"catchword":"blankette","tekst":"Hebreeuws, zette haar ogen in het blanketsel; dat is, heeft haar aangezicht met blanketsel bestreken. Het schijnt dat zij zich stoutelijk toegemaakt en opgepronkt heeft, om Jehu, als door een koninklijke majesteit, schrik en bedwelmheid aan te brengen."}],"31":[{"catchword":"poorte","tekst":"Te weten van het koninklijk paleis, waaruit Izebel keek."},{"catchword":"o Zimri,","tekst":"Zij noemt Jehu een anderen Zimri, die zijn heer Ela, den koning Israëls, vermoord had, 1Ki 16:9-10, welke moord aan Zimri een gruwelijk einde door middel van Omri genomen had. Dit werpt nu Izebel Jehu voor, om hem te beschrikken, maar tevergeefs, omdat hem van God bevolen was te doen dat hij deed. Anders: Is het Zimri wel gegaan, die zijn heer doodsloeg?"}],"32":[{"catchword":"Wie is met mij?","tekst":"Dit sprak Jehu tot degenen, die bij Izebel waren, vragende of iemand van hen zijn zaak toegedaan was."},{"catchword":"kamerlingen","tekst":"Dat is, jonkers, edellieden, hofofficieren, die in het gezelschap van Izebel waren, waar zij uit het venster keek. Het Hebreeuwse woord betekent eigenlijk gesnedenen, hoedanig de kamerlingen der koninginnen en prinsessen in die tijden meest waren, en zulken mogen dezen geweest zijn. Zie Gen 37:36."}],"33":[{"catchword":"hij zeide","tekst":"Namelijk, Jehu."},{"catchword":"zij stieten haar","tekst":"Te weten, de kamerlingen."},{"catchword":"hij vertrad haar","tekst":"Namelijk, Jehu."}],"34":[{"catchword":"ingekomen was,","tekst":"Te weten, in het paleis."},{"catchword":"konings dochter","tekst":"Namelijk, van den koning der Sidoniërs, genoemd Eth-Baäl; 1Ki 16:31."}],"36":[{"catchword":"den dienst van Zijn knecht Elia,","tekst":"Hebreeuws, door de hand."},{"catchword":"Op het stuk lands","tekst":"Zie boven, vs.10, en van deze profetie, zie 1Ki 21:23, waar, hoewel zoveel woorden niet staan, nochtans de zin dezer voorzegde vervulling te vinden is."}],"37":[{"catchword":"het veld,","tekst":"Hebreeuws, op het aangezicht des velds."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then the Prophet Elisa called of the sons of the Prophets: [See 1 King.2.on v.35.] and he said unto him; Gird (up) thy loins, [see 1 King.18.on v.46. and above chap.4.on v.29.] and take this pot of oil in thine hand, and go to Rammoth in Gilead. [see Duet.4.on ver.43. It appeareth by this relation, that Israelites had recovered this city again from the Syrians: see below v.14. and the annotate.]"}],"2":[{"catchword":null,"tekst":"When thou shalt be come thither, then see where Jehu the son of Josaphat, [And consequently is to distinguished from one Jehu that was a Prophet, and was the son of Hanani: see 1 King.16.on ver.1.] the son of Nimsi; and go in, and make him rise up from the midst of his brethren [i.e. of his companions, the rest of the Officers and Commanders of the Army: see below vers.5.] and bring him into an inner chamber. [Heb. chamber in chamber.]"}],"3":[{"catchword":null,"tekst":"And take the pot of oil, and pour it on his head, and say; Thus saith the LORD, I have anointed thee King over Israel: [see 1 King.1. on v.34.] then open the door, and flee, and tarry not."}],"4":[{"catchword":null,"tekst":"So the youth, that youth of the Prophet, [Oth. the youth the Prophet,] went to Ramoth in Gilead."}],"5":[{"catchword":null,"tekst":"And when he came in, behold, there sat the Captains of the host, and he said; I have a word to thee Captain: [i.e. I have somewhat to tell thee alone in secret; Therefore may it please thee to rise up, and to hear me in private] and Jehu said: To which of us all? and he said; To thee, O Captain."}],"6":[{"catchword":null,"tekst":"Then he [Namely Jehu] arose, and went into the house; [into the inner chamber, as above v.2.] then he [to wit, the Prophets youth] poured the oil on his head: and he said unto him: Thus saith the LORD God of Israel; I have anointed thee King over people of the LORD, over Israel."}],"7":[{"catchword":null,"tekst":"And thou shalt smite [i.e. Kill and destroy: see Gen.8.on v.21.] the house [i.e. the family: see 1 King.14.on v.10.] of Achab thy Lord; that I may avenge the blood of my servants the Prophets, and the blood of all the servants of the LORD at the hand of Izebel. [i.e. which was shed by charge and command from Izebel.]"}],"8":[{"catchword":null,"tekst":"And the whole house of Achab shall perish: and I will cut off from Achab, him that pisseth against the wall, [See 1 King.14.on v.10.] also him that is shut up, and left in Israel. [i.e. I will let none remain: see Deut.32.on v.36.]"}],"9":[{"catchword":null,"tekst":"For I will make the house of Achab, as the house of Jerobeam, the son of Nebat; [See 1 King.14 10 and 15.29.] and as the house of Baesa, the son of Ahia. [see 1 King.16.3,11.]"}],"10":[{"catchword":null,"tekst":"Also the dogs shall eat Izebel, on the piece, [Heb.part, or, possession: so below vers.21,25,26,&c.] (of land) [this word is here inserted out of the 25. verse of this Chapter] of Jizreel, [understand the piece or portion of land, or field, which by the false accusations, and cunning plots of Izebel was violently taken away from honest Naboth: see 1 King.21.23. & below v.21,25.] and there shall be none to bury (her) then he opened the door, and fled."}],"11":[{"catchword":null,"tekst":"And when Jebu went forth to the servants of his Lord, they said unto him; Is all well? [Heb. is peace? so below ver.17. See Gen.29.on v.6.] wherefore came this mad (fellow) [thus are the Prophets and Ministers of God called by worldings and wicked men, because they are not able to apprehend their doctrine, nor their practice, Job 10:20. Act.26.24. Perhaps they gave this name to the Prophets, because they had some extraordinary gestures, or manner of a action with them, when the Spirit of the Lord came upon them: see 1 Sam.18.10.] to thee? and he said unto them? Ye know the man. and his communication. [that is, ye may perceive that he is a prophet, and because he is such a one, ye may judge what he is wont to speak, to wit, to exhort every one to his duty, as he hath done to me.]"}],"12":[{"catchword":null,"tekst":"But he said; thus and thus [Heb. according to this, and according to this] spake he to me, saying; thus saith the LORD; I have anointed thee King over Israel."}],"13":[{"catchword":null,"tekst":"Then they hasted, and every man took his garment, and put it under him, [In token of subjection unto Jehu, as to their King. Compare Mat 21:7.] upon the highest stair, [Heb. upon the stairs. Understand (according to the common opinion of the learned) an high and exalted place, over-spread with the upper garments of the Captains, which served instead of Tapistry, on which they set Jehu] and blew with the trumpet, and said; Jehu is become King."}],"14":[{"catchword":null,"tekst":"So Jehu the son of Josaphat, the son of Nimsi made a conspiracy [See concerning the signification of the Hebrew word, 1 Kings 15.on v.27.] against Joram: (Now Joram had kept [i.e. furnished, fenced, and fortified with souldier with souldiers] Ramoth in Gilead, he and all Israel, because of Hazael King of Syria."}],"15":[{"catchword":null,"tekst":"But King Joram was turned to cause himself to he healed at Jizreel of the wounds which the Syrians had given him, when he fought against Hazael King of Syria) [see hereof above chap.8.v.29.] and Jehu said; if it be your will, [Heb. soul. See Gen.23.on ver.8. That is, if ye think good, if it pleaseth you] let none go forth out of the city that may escape, to go to tell (this) [viz. that I am made King] in Jizreel. [where King Joram was.]"}],"16":[{"catchword":null,"tekst":"Then Jehu rode, and went to Jizreel; for Joram lay there: [To wit, sick of wounds, which the Syrians had given him. See the former verse] and Ahazia King of Juda was come down to see Joram."}],"17":[{"catchword":null,"tekst":"Now the watchman stood at the tower at Jizreel, and saw the company of Jehu as he came on, and said; I see a company: then said Joram; take an horseman, and send (him) to meet them, and let him say, is it peace."}],"18":[{"catchword":null,"tekst":"And the horseman went on horseback to meet him, and said; thus saith the King, is it peace? [i.e. Do things go well? Is there no cause of fear or danger? So below v.19.22. see Gen.29.on vers.6.] and Jehu said; what hast thou to do with peace? [Heb. what is it to thee, and the peace: that is, what hast thou to do with peace? So in the following verse. See 2 Sam.16. on v.10.] Turn (thee) behind me: And the watchman told; saying; the messenger came to them, but he cometh not again."}],"19":[{"catchword":null,"tekst":"Then he sent another horseman on horseback, and when this (man) was come to them, he said; thus saith the King, is it peace? And Jebu said ; what hast thou to do with peace? turn (thee) behind me."}],"20":[{"catchword":null,"tekst":"And the watchman told this, saying; he came even unto them, but he cometh not again: And the driving is as the driving of Jehu, the son of Nimsi, for he driveth furiously. [Heb. in outrageousness, or, with outrageousness: that is, with such swiftness and boisterousness, as if he were mad, and meant to ride the horses to death.]"}],"21":[{"catchword":null,"tekst":"Then said Joram; make ready; and they made ready his charet: So Joram the King of Israel went forth, and Ahazia the King of Juda, each in his charet; and they went forth to meet Jehu, and found him on the piece (of land) of Naboth the Jizreelite. [See above on v.10.]"}],"22":[{"catchword":null,"tekst":"Now it came to pass, when Joram saw Jehu, that he said; is it also peace, Jehu, but he said; what peace, as long as the whoredomes [Understand spiritual, which is idolatry. See lev.17.on vers.7. and 20.on vers.5.] of thy mother Izebel, and her witchcrafts [Understand the deceitful practises, whereby Izebel enticed and seduced men to idolatry. Compare Nahum.3.4.] are so many."}],"23":[{"catchword":null,"tekst":"Then Joram turned his hand, [To wit, wherewith he turned himself about in the charets, or pointed to his charet-driver, or also himself caught hold of the reines, to turn the charet about, and to take flight. Compare 1 Kings 22.34.] and fled, and said to Ahazia, it is deceit Ahazia. [i.e. Jehu is come hither in a deceitful and treacherous way, to surprise and murder me.]"}],"24":[{"catchword":null,"tekst":"But Jehu bent the bow with (a) full hand [Heb.filled his hand with the how. Understand, that he put forth all the strength of hi9s arm, to bend the bow to the full, and to stretch it out to the utmost, to give a mighty shot therewith] and shot [Heb. smote] Joram between his arms, that the arrow went out thorough his heart; and he bowed himself in his charet. [i.e. sunk down in his charet.]"}],"25":[{"catchword":null,"tekst":"Then said (Jehu) to Bidka his Captain; Take (and) cast him upon that piece of Land of Naboth the Jizreelite: for remember, when I and thou rode one by another after Achab his father, that the LORD laid this burden [That is, this prophetical threatening, or this aforesaid judgement. So is the word burden frequently taken by the Prophets: because judgements are heavy and grievous, as well in hearing, when they are denounced, as in feeling, when they do actually sieze upon a man, Isa 13:1. and 15.1. Jer 23:33,34. Nah.1.1. Habak.1.1. Zach.9.1.] upon him, [it seemeth that Achab when after the death of Naboth, he went to take possession of his vineyard, had with him certain Courtiers and Officers of the Army, and that amongst them there were Jehu and Bidkar, who had heard the words (mentioned in the following verse) altered by Elia against Achab] (saying;)"}],"26":[{"catchword":null,"tekst":"If I have not seen yester night the blood of Naboth, and the blood of his sons, [Hence appeareth, that not only Naboth was murthered, but also his children, that Achab might the quieter enjoy Naboths estate] saith the LORD! and (if) I do not recompense thee that on this piece (of land) ! [see above on v.10.] saith the LORD: [These are the words of the LORD uttered with an oath against Achab, and they do import as much as if he should have said: Surely I have seen it, and will surely recompense it unto thee on this plat of ground. See of this kind of oath also ascribed to God, Num.14.on v.23.] Now then take and cast him upon that plat (of ground), according to the word of the LORD."}],"27":[{"catchword":null,"tekst":"When Ahazia King of Juda saw (that); then he fled by the way of the garden-house: [Which was planted with trees, so that in fleeing a man could hide himself better then elsewhere, to get safely away] but Jehu pursued after him, and said; smite him also [that is, kill him; for he was also of Achabs family, to wit, by his Mothers side, which was Achabs daughter. See above chap.8.on vers.18.] on the charet, at the going up to the Gur, [This seemeth to have been a place on the way to Samaria, by which Ahazia fled, when Jehu was busy in killing Joram. Now Jehu perceiving that Ahazia was got away from him, sent his souldiers after him. These (as some conceive) came so near to him in this place, that they wounded him there, but not mortally, so that he escaped to Samaria, where he hid himself, 2 Chron.22.9. Until he being there also pursued to be brought to Jehu, was mortally wounded, but escaped to Megiddo, where he died as the following words set forth] which is by Jibleam, [see Jos.17.11.] and he fled to Megiddo, [See 1 Kings 9.on v.15.] and died there."}],"28":[{"catchword":null,"tekst":"And his servants carried him to Jerusalem, and they buried him in his sepulchre, by his fathers in the city of David. [See 1 Kings chapter 2. on verse 10.]"}],"29":[{"catchword":null,"tekst":"Now in the eleventh year [i.e. in the end of the eleventh, and beginning of the twelfth year. See above chap.8.25.] of Joram the son of Achab, did Ahazia become King over Juda."}],"30":[{"catchword":null,"tekst":"And Jahu came to Jizreel: When Izebel heard (that) then she painted her face, [Heb. put her eyes in painting: that is, besmeared face with painting] and tired her head, [it seemeth that she boldly dressed and adorned her self, as it were to awe and daunt Jehu by her Majestic and stately countenance] and looked out at the window."}],"31":[{"catchword":null,"tekst":"Now when Jehu entered in at the gate, [To wit of the Kings Palace, out of which Izebel looked] she said; is it well, O Zimri the slayer of his LORD? [she calleth Jehu a second Zimri, who had murdered his Lord Ela the King of Israel, 1 Kings 16.9,10. which murder had a fearful and abominable end in Zimri by Omri&acirc;&euro;&trade;s means. With this Izebel now upbraideth Jehu, to affeighten him, but in vain, because he was commanded by God to do that which he did. Oth. did Zimri prosper, that slew his LORD.]"}],"32":[{"catchword":null,"tekst":"And he lift up his face towards the window, and said; who is with me? Who? [Jehu spake this to those that were with Izebel, asking if any were affected to his cause] Then there looked on him two (or) three of the chamber [that is, Gentlemen, Noble men, Court-officers, that were in Izebels company, as she looked out of the window. The Hebrew word signifieth properly, Eunuchs, or, gelded men: such as were the Chamberlaines of Queens and Princesses for the most part in those times: And such peradventure these were. See Gen.37.on v.36.]"}],"33":[{"catchword":null,"tekst":"And he [Namely, Jehu] said; Through her down: and they [to wit, the Chamberlaines] threw her down, so that (some) of her blood was sprinkled on the wall, and on the horses, and he [Namely Jehu] trampled upon her."}],"34":[{"catchword":null,"tekst":"Now when he was come in [viz. into the Palace] and had eaten and drunk, he said; look now after that cursed (woman), and bury her, for she is a Kings daughter. [namely, the daughter of the King of the Kings chap.16.1.]"}],"35":[{"catchword":null,"tekst":"And they went to bury her; but they found nothing of her, save the scull, and the feet, and the palmes of her hands."}],"36":[{"catchword":null,"tekst":"Then they returned, and told him; and he said; this is the word LORD, which he spake by the ministery [Heb. hand] of his servant Elia the Tisbite, saying; On the plat (of ground) of Jizreel shall the dogs eat the flesh of Izebel. [see above on v.10. And concerning this prophecy, see 1 Kings 21.23. where, although so many words are no there extant, yet the meaning of this aforesaid accomplishment is to be found.]"}],"37":[{"catchword":null,"tekst":"And the carcase of Izebel shall be as dung upon the field, [Heb. upon the face of the field] in the plat (of ground) of Jizreel; (so) that they shall not be able to say, this is Izebel."}]}}};
