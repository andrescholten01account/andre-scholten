voor de HEERE; en zij brachten de HEERE een slachtoffer, en deden geloften.", "Ex 11:1": "(Want de HEERE had tegen Mozes gesproken: Ik zal nog één plaag over Farao en over Egypte brengen, daarna zal hij u van hier laten trekken; als hij u geheel zal laten trekken, dan zal hij u haastig van hier uitdrijven.", "2 Kon 2:14": "En hij nam de mantel van Elia, die van hem afgevallen was, en sloeg het water, en zei: Waar is de HEERE, de God van Elia? Ja, Dezelfde? En hij sloeg het water, en het werd naar de ene en de andere kant verdeeld, en Elisa ging er door.", "1 Kon 10:2": "En zij kwam in Jeruzalem, met een zeer zwaar leger, met kamelen die specerijen droegen, en zeer veel goud, en kostbaar gesteente; en zij kwam bij Salomo, en sprak met hem over alles wat er in haar hart was.", "Luk 17:15-18": "En een van hen, die zag dat hij genezen was, keerde terug en verheerlijkte God met luide stem. En hij viel op zijn gezicht voor Zijn voeten en dankte Hem; en dat was een Samaritaan. En Jezus antwoordde en zei: Zijn niet de tien gereinigd? Maar waar zijn de negen?", "Amos 7:7": "Nog liet Hij mij dit zien: zie, de Heere stond op een muur, die met een paslood gemaakt was, en een paslood was in Zijn hand.", "Num 14:11": "En de HEERE zei tegen Mozes: Hoelang zal dit volk Mij tergen? En hoelang zullen zij niet aan Mij geloven, ondanks alle tekenen die Ik onder hen gedaan heb?", "2 Tim 4:10": "Want Demas heeft mij verlaten, omdat hij de tegenwoordige wereld heeft liefgekregen, en is naar Thessalonica gereisd; Krescens naar Galatië, Titus naar Dalmatië.", "Matt 15:27": "En zij zei: Ja, Heere! maar de hondjes eten ook van de brokjes die van de tafel van hun heren vallen.", "Jer 9:3": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "Ex 9:14-16": "Want ditmaal zal Ik al Mijn plagen in uw hart zenden, en over uw dienaren en over uw volk, zodat u weet dat er niemand is zoals Ik, op de hele aarde. Want nu heb Ik Mijn hand uitgestrekt, om u en uw volk met de pest te slaan, zodat u van de aarde verdelgd zou worden. Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Luk 22:5": "En zij waren blij, en zijn het eens geworden dat zij hem geld zouden geven.", "Hand 8:18": "En toen Simon zag dat door het opleggen van de handen van de apostelen de Heilige Geest gegeven werd, bood hij hun geld aan,", "Hos 10:13": "U hebt goddeloosheid geploegd, verkeerdheid gemaaid, en de vrucht van de leugen gegeten; want u hebt vertrouwd op uw eigen weg, op de veelheid van uw helden.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "2 Kon 13:20": "Daarna stierf Elisa, en zij begroeven hem. De benden van de Moabieten nu kwamen in het land bij het begin van het jaar.", "Jes 55:9": "Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Jer 10:11": "(Zo zult u tegen hen zeggen: De goden, die de hemel en de aarde niet gemaakt hebben, zullen vergaan van de aarde, en van onder deze hemel.)", "2 Kon 23:35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "Lev 13:2": "Een mens, als er in het vel van zijn vlees een gezwel, of gezweer, of witte blaar zal zijn, welke in het vel van zijn vlees tot een plaag van de melaatsheid zou worden, hij zal dan naar de priester Aäron, of naar een van zijn zonen, de priesters, gebracht worden.", "Joz 7:1": "Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël.", "2 Kron 34:9": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.", "Jak 5:1": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen.", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Ex 4:18": "Toen ging Mozes heen, en keerde terug naar Jethro, zijn schoonvader, en zei tegen hem: Laat mij toch gaan, dat ik terugkeer naar mijn broers, die in Egypte zijn, en zie, of zij nog leven. Jethro dan zei tegen Mozes: Ga in vrede!", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Ex 14:18": "En de Egyptenaren zullen weten dat Ik de HEERE ben, wanneer Ik verheerlijkt zal worden aan Farao, aan zijn wagens en aan zijn ruiters.", "2 Kon 4:26": "Loop haar nu toch tegemoet, en zeg tegen haar: Is het goed met u? Is het goed met uw man? Is het goed met uw kind? En zij zei: Het is goed.", "Jer 27:2": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.", "Joz 3:11": "Zie, de ark van het verbond van de Heere van de hele aarde gaat voor u door de Jordaan.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Job 1:20": "Toen stond Job op, en scheurde zijn mantel, en schoor zijn hoofd, en viel op de aarde, en boog zich neer;", "Dan 9:1-22": "In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Joh 1:6": "Er was een mens door God gezonden, wiens naam Johannes was.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Ps 10:3": "Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE.", "2 Kon 4:41": "Maar hij zei: Breng dan meel; en hij wierp het in de pot; en hij zei: Schep voor het volk op, zodat zij eten. Toen was er niets kwaads meer in de pot.", "Ex 14:24": "En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.", "2 Kron 18:27": "En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!", "Rom 11:13": "Want ik spreek tot u, heidenen, voor zoveel ik apostel van de heidenen ben; ik maak mijn bediening heerlijk;", "Tit 1:7": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "Deut 1:6": "De HEERE, onze God, sprak tot ons bij Horeb, en zei: U bent lang genoeg bij deze berg gebleven.", "Joh 1:43-47": "En hij bracht hem tot Jezus. En Jezus keek hem aan, en zei: U bent Simon, de zoon van Jona; u zult Cefas genoemd worden, wat vertaald wordt als Petrus. De volgende dag wilde Jezus weggaan naar Galilea, en Hij vond Filippus, en zei tegen hem: Volg Mij. Filippus nu was van Bethsaida, uit de stad van Andreas en Petrus.", "Pred 2:1": "Ik zei in mijn hart: Nu, welaan, ik zal u beproeven door vreugde; laat daarom het goede genieten; maar zie, ook dat was ijdelheid.", "Hos 1:2": "Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan.", "1 Kon 20:39": "En het gebeurde, toen de koning voorbijging, dat hij naar de koning riep, en zei: Uw knecht was uitgegaan midden in de strijd; en zie, een man was afgeweken, en bracht een man naar mij toe, en zei: Bewaar deze man, als hij enigszins gemist wordt, dan zal uw leven in de plaats van zijn leven zijn, of u zult een talent van het zilver opwegen.", "2 Sam 15:32": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Jer 26:12": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;", "Jes 37:1": "Het gebeurde nu, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde, en zich met een zak bedekte, en het huis van de HEERE inging.", "2 Kron 7:1-3": "Toen Salomo klaar was met bidden, daalde het vuur van de hemel neer en verteerde het brandoffer en de slachtoffers; en de heerlijkheid van de HEERE vervulde het huis. En de priesters konden niet ingaan in het huis van de HEERE, want de heerlijkheid van de HEERE had het huis van de HEERE vervuld. En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Ex 7:2": "U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.", "Num 23:12": "Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?", "Num 7:89": "En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.", "2 Kon 5:22-25": "En hij zei: Het is goed; mijn heer heeft mij gestuurd, om te zeggen: Zie, zojuist zijn er twee jonge mannen uit de zonen van de profeten, van het gebergte van Efraïm, bij mij gekomen; geef hun toch een talent van het zilver en twee stellen kleren. En Naäman zei: Het is goed, neem twee talenten. En hij drong bij hem aan, en bond twee talenten van het zilver in twee buidels, met twee stellen kleren, en gaf ze aan twee van zijn knechten, die ze voor hem uit droegen. Toen hij nu bij de heuvel kwam, nam hij ze van hun hand over, en bracht ze in een huis in bewaring; en hij liet de mannen gaan, en zij gingen heen.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "2 Kon 3:16": "En hij zei: Zo zegt de HEERE: Maakt in dit dal veel grachten.", "Ezra 9:5": "En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God;", "Richt 13:25": "En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.", "Mal 2:4": "Dan zult u weten dat Ik dit gebod tot u gezonden heb, opdat Mijn verbond met Levi blijft bestaan, zegt de HEERE van de heerscharen.", "2 Kon 4:27": "Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.", "Matt 19:22": "Toen nu de jongeling dit woord hoorde, ging hij bedroefd weg; want hij had veel bezittingen.", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Jer 27:5": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen.", "Jer 11:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "1 Kor 2:14-16": "Maar de natuurlijke mens begrijpt niet de dingen die van de Geest van God zijn; want ze zijn hem dwaasheid, en hij kan ze niet verstaan, omdat ze geestelijk beoordeeld worden. Maar de geestelijke mens beoordeelt wel alle dingen, maar hijzelf wordt door niemand beoordeeld. Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "Jes 1:16": "Was u, reinig u, doe de boosheid van uw handelingen van voor Mijn ogen weg, houd op met kwaad te doen.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "2 Kon 4:12": "Toen zei hij tegen zijn knecht Gehazi: Roep deze Sunamitische. En toen hij haar geroepen had, stond zij voor hem.", "Ezech 11:1": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.", "2 Kon 7:3": "Er waren nu vier melaatse mannen bij de ingang van de poort; die zeiden tegen elkaar: Waarom blijven wij hier zitten, totdat wij sterven?", "2 Kor 11:8-12": "Ik heb andere gemeenten beroofd, doordat ik bezoldiging van hen nam om u te dienen; en toen ik bij u aanwezig was en gebrek had, ben ik niemand lastig gevallen. Want mijn gebrek hebben de broeders vervuld die van Macedonië kwamen; en ik heb mijzelf in alles gehouden zonder u te bezwaren, en ik zal mij nog zo houden. De waarheid van Christus is in mij: dat deze roem in de gewesten van Achaje aan mij niet verhinderd zal worden.", "2 Kon 4:36": "En hij riep Gehazi, en zei: Roep deze Sunamitische. En hij riep haar, en zij kwam bij hem; en hij zei: Neem uw zoon op.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "Luk 9:59-62": "En Hij zei tegen een ander: Volg Mij. Maar hij zei: Heere, sta mij toe dat ik eerst wegga om mijn vader te begraven. Maar Jezus zei tegen hem: Laat de doden hun doden begraven; maar gaat u heen en verkondig het Koninkrijk van God. En ook een ander zei: Heere, ik zal U volgen; maar sta mij toe dat ik eerst afscheid neem van hen die in mijn huis zijn.", "Pred 3:1-8": "Alles heeft een vastgestelde tijd, en alle voornemen onder de hemel heeft zijn tijd. Er is een tijd om geboren te worden, en een tijd om te sterven; een tijd om te planten, en een tijd om het geplante uit te roeien; Een tijd om te doden, en een tijd om te genezen; een tijd om af te breken, en een tijd om te bouwen;", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Dan 6:28": "Hij verlost en redt, en Hij doet tekenen en wonderen in de hemel en op de aarde; Hij heeft Daniël uit de macht van de leeuwen verlost.", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Zach 14:8": "Ook zal het op die dag gebeuren, dat er levend water uit Jeruzalem zal vloeien, de helft daarvan naar de oostzee, en de helft daarvan naar de achterste zee toe; het zal 's zomers en 's winters zijn.", "Ezech 47:1-8": "Daarna bracht hij mij terug naar de deur van het huis, en zie, er stroomde water uit van onder de drempel van het huis naar het oosten; want de voorkant van het huis lag naar het oosten, en het water daalde af van onderen, uit de rechterzijde van het huis, ten zuiden van het altaar. En hij bracht mij naar buiten door de noordpoort, en leidde mij rondom via de weg van buiten naar de buitenpoort, de weg die naar het oosten kijkt; en zie, het water sprong eruit aan de rechterzijde. Toen die man naar het oosten uitging, had hij een meetsnoer in zijn hand; en hij mat duizend el, en liet mij door het water gaan, en het water kwam tot aan de enkels.", "Jes 44:6": "Zo zegt de HEERE, de Koning van Israël, en zijn Verlosser, de HEERE van de heerscharen: Ik ben de Eerste, en Ik ben de Laatste, en behalve Mij is er geen God.", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "1 Kor 1:21": "Want omdat de wereld God, in de wijsheid van God, niet door de wijsheid heeft gekend, heeft het God behaagd om door de dwaasheid van de prediking zalig te maken hen die geloven;", "Deut 30:11-14": "Want dit gebod, dat ik u heden gebied, dat is voor u niet verborgen, en dat is niet ver weg. Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen?", "Num 24:11-13": "En nu, pak u weg naar uw plaats! Ik had gezegd dat ik u hoog zou eren; maar zie, de HEERE heeft u die eer onthouden! Toen zei Bileam tegen Balak: Heb ik ook niet tegen uw boden, die u naar mij gezonden hebt, gesproken en gezegd: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog kan ik het bevel van de HEERE niet overtreden, door uit mijn eigen hart goed of kwaad te doen; wat de HEERE spreken zal, dat zal ik spreken.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Num 24:2-4": "Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!", "Jes 45:6": "Opdat men weet, vanaf de opgang van de zon tot aan de ondergang, dat er buiten Mij niets is, Ik ben de HEERE, en niemand meer.", "2 Kron 24:5": "Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet.", "Joh 13:8": "Petrus zei tegen Hem: U zult mijn voeten niet wassen, in eeuwigheid niet! Jezus antwoordde hem: Als Ik u niet wast, hebt u geen deel met Mij.", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Ps 15:5": "Die zijn geld niet uitleent tegen woeker, en geen geschenk aanneemt tegen de onschuldige. Wie deze dingen doet, zal niet wankelen in eeuwigheid.", "Num 16:28-35": "Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen. Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden. Maar als de HEERE iets nieuws schept, en het aardrijk zijn mond opendoet en hen verslindt met alles wat van hen is, en zij levend in het dodenrijk neerdalen, dan zult u weten dat deze mannen de HEERE getergd hebben.", "Lev 25:51": "Als er nog veel van die jaren zijn, zal hij naar verhouding daarvan tot zijn lossing van het geld waarvoor hij gekocht is, teruggeven.", "Ex 10:2": "En opdat u voor de oren van uw kinderen en uw kleinkinderen kunt vertellen wat Ik in Egypte gedaan heb, en Mijn tekenen, die Ik onder hen gedaan heb; opdat u weet dat Ik de HEERE ben.", "Hand 10:26": "Maar Petrus richtte hem op, en zei: Sta op, ik ben zelf ook maar een mens.", "Ex 11:8": "Dan zullen al deze uw knechten naar mij afkomen, en zich voor mij neerbuigen, en zeggen: Trek uit, u en al het volk dat uw voetstappen volgt; en daarna zal ik uitgaan. En hij ging uit van Farao in grote hitte van de toorn.", "2 Kon 22:7": "Doch er werd met hen geen rekening gehouden van het geld dat in hun hand geleverd was, want zij handelden trouw.", "Hand 8:19": "en zei: Geef ook mij deze macht, opdat ieder aan wie ik de handen opleg, de Heilige Geest ontvangt.", "1 Kon 13:8": "Maar de man van God zei tegen de koning: Al gaf u mij de helft van uw huis, dan zou ik niet met u meegaan, en ik zou op deze plaats geen brood eten, en geen water drinken.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "1 Kor 1:21-25": "Want omdat de wereld God, in de wijsheid van God, niet door de wijsheid heeft gekend, heeft het God behaagd om door de dwaasheid van de prediking zalig te maken hen die geloven; Omdat de Joden een teken begeren, en de Grieken wijsheid zoeken; Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "Joh 5:4": "", "Joz 2:9-11": "En zij sprak tot die mannen: Ik weet dat de HEERE u dit land gegeven heeft, en dat de schrik voor u op ons gevallen is, en dat alle inwoners van dit land voor u vergaan zijn van angst. Want wij hebben gehoord dat de HEERE het water van de Schelfzee heeft laten opdrogen voor u, toen u uit Egypte trok; en wat u gedaan hebt aan de twee koningen van de Amorieten, Sihon en Og, die aan de overkant van de Jordaan waren, die u met de ban geslagen hebt. Toen wij dat hoorden, versmolt ons hart, en er bleef geen moed meer over in iemand, vanwege uw aanwezigheid; want de HEERE, uw God, is een God boven in de hemel, en beneden op de aarde.", "Dan 6:27": "Van mij is een bevel uitgegaan, dat men in de hele heerschappij van mijn koninkrijk moet beven en sidderen voor het aangezicht van de God van Daniël; want Hij is de levende God, en blijvend in eeuwigheid, en Zijn koninkrijk gaat niet te gronde, en Zijn heerschappij duurt tot het einde toe.", "1 Kor 3:2": "Ik heb u met melk gevoed, en niet met vaste spijs; want u kon toen nog niet; ja, u kunt ook nu nog niet.", "Num 12:10": "En de wolk week weg van boven de tent; en zie, Mirjam was melaats, wit als de sneeuw. En Aäron keek naar Mirjam, en zie, zij was melaats.", "1 Sam 17:47": "En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Mal 1:6": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam?", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Hebr 11:8": "Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Mark 1:9": "En het gebeurde in diezelfde dagen dat Jezus kwam van Nazareth, gelegen in Galilea, en werd door Johannes gedoopt in de Jordaan.", "Spr 12:22": "Valse lippen zijn de HEERE een gruwel; maar wie trouw handelen, zijn Zijn welgevallen.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "2 Kon 8:9": "Zo ging Hazaël hem tegemoet, en nam een geschenk mee, namelijk al het goede van Damaskus, een last van veertig kamelen; en hij kwam, en stond voor hem, en zei: Uw zoon Benhadad, de koning van Syrië, heeft mij naar u gezonden om te vragen: Zal ik van deze ziekte genezen?", "Gen 37:34": "Toen scheurde Jakob zijn kleren en legde een zak om zijn heupen; en hij bedreef rouw over zijn zoon, vele dagen.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Deut 2:37": "Alleen tot het land van de kinderen van Ammon naderde u niet, noch tot de hele oever van de beek Jabbok, noch tot de steden van het gebergte, noch tot iets dat de HEERE, onze God, ons verboden had.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "1 Sam 9:6": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.", "Matt 26:65": "Toen scheurde de hogepriester zijn kleren en zei: Hij heeft God gelasterd, waarom hebben wij nog getuigen nodig? Zie, nu hebt u Zijn godslastering gehoord.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "1 Sam 12:18": "Toen Samuël de HEERE aanriep, gaf de HEERE die dag donder en regen; daarom vreesde heel het volk de HEERE en Samuël zeer.", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Dan 2:47": "De koning antwoordde Daniël en zei: Het is werkelijk waar dat uw God een God der goden is, en een Heere der koningen, en Iemand Die geheimen openbaart, omdat u dit geheim hebt kunnen openbaren.", "Mal 2:8": "Maar u bent van de weg afgeweken, u hebt er velen doen struikelen in de wet, u hebt het verbond met Levi verdorven, zegt de HEERE van de heerscharen.", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "2 Kon 4:31": "Gehazi nu was voor hen uit gegaan; en hij legde de staf op het gezicht van de jongen; maar er was geen stem, en geen teken van leven. Zo keerde hij terug hem tegemoet, en bracht hem de boodschap en zei: De jongen is niet wakker geworden.", "Deut 21:14": "En het zal gebeuren, als u geen behagen meer in haar hebt, dat u haar zult laten gaan waarheen zij wil; maar u zult haar beslist niet voor geld verkopen, u zult geen handel met haar drijven, omdat u haar vernederd hebt.", "Neh 5:10": "Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.", "Hos 12:14": "Maar de Heere voerde Israël op uit Egypte door een profeet, en door een profeet werd hij behoed.", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Hebr 5:13": "Want ieder die nog melk krijgt, is onervaren in het woord van de gerechtigheid; want hij is een kind.", "Rom 1:2": "(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),", "Gen 37:29": "Toen Ruben nu naar de kuil terugkeerde, zie, Jozef was niet meer in de kuil; toen scheurde hij zijn kleren.", "Ef 5:26": "opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord,", "2 Kon 2:17": "Maar zij drongen bij hem aan tot het schamen toe; en hij zei: Stuur hen. En zij stuurden vijftig mannen, die drie dagen zochten, doch hem niet vonden.", "Gen 23:9": "Dat hij mij de spelonk van Machpela geeft, die hij heeft, die aan het eind van zijn akker is; dat hij die mij voor het volle geld geeft, tot een eigen graf in het midden van u.", "Matt 26:21-25": "En terwijl zij aten, zei Hij: Voorwaar, Ik zeg u dat één van u Mij zal verraden. En zij werden zeer bedroefd en ieder van hen begon tegen Hem te zeggen: Ben ik het, Heere? En Hij antwoordde en zei: Die de hand met Mij in de schotel indoopt, die zal Mij verraden.", "2 Sam 13:19": "Toen nam Thamar as en strooide die op haar hoofd, en scheurde de veelkleurige mantel die zij aanhad; en zij legde haar hand op haar hoofd, en liep luid schreiend weg.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "Jes 10:5": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand!", "Ezech 33:31": "En zij komen tot u, zoals het volk gewoon is te komen, en zitten voor uw aangezicht als Mijn volk, en horen uw woorden, maar zij doen ze niet; want zij spreken lieve woorden met hun mond, maar hun hart gaat hun hebzucht na.", "Luk 9:3": "En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Richt 9:34": "Abimelech dan maakte zich op, en al het volk dat bij hem was, in de nacht; en zij legden een hinderlaag bij Sichem, met vier groepen.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Hand 5:10": "En zij viel meteen neer voor zijn voeten, en gaf de geest. En de jongelingen kwamen binnen, vonden haar dood, en droegen haar uit, en begroeven haar bij haar man.", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "Lev 25:37": "Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.", "Hebr 11:7": "Door het geloof heeft Noach, door God gewaarschuwd over de dingen die nog niet gezien werden, en bevreesd geworden, de ark gebouwd tot redding van zijn huisgezin; door dit geloof heeft hij de wereld veroordeeld, en is hij een erfgenaam geworden van de rechtvaardigheid die naar het geloof is.", "2 Kon 3:15": "Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "2 Kon 2:25": "En hij ging vandaar naar de berg Karmel; en vandaar keerde hij terug naar Samaria.", "Rom 2:1": "Daarom bent u niet te verontschuldigen, o mens, wie u ook bent die anderen oordeelt; want waarin u een ander oordeelt, veroordeelt u uzelf; want u, die anderen oordeelt, doet dezelfde dingen.", "Joh 4:28": "Toen liet de vrouw haar watervat staan, en ging naar de stad, en zei tegen de mensen:", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Openb 10:7": "maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.", "Hand 5:2": "en onttrok van de prijs, ook met medeweten van zijn vrouw, en bracht een zeker deel, en legde dat aan de voeten van de apostelen.", "Ex 10:16": "Toen haastte Farao zich om Mozes en Aäron te roepen, en zei: Ik heb gezondigd tegen de HEERE, uw God, en tegen u.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "1 Kon 18:37-39": "Antwoord mij, HEERE, antwoord mij; opdat dit volk erkent dat U, HEERE, die God bent, en dat U hun hart weer terug hebt gebracht. Toen viel het vuur van de HEERE, en verteerde dat brandoffer, en dat hout, en die stenen, en dat stof, ja, likte dat water op dat in de geul was. Toen heel het volk dat zag, vielen zij op hun gezicht, en zeiden: De HEERE is God, de HEERE is God!", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "Lev 14:16": "Dan zal de priester zijn rechtervinger indopen, nemende van die olie die in zijn linkerhand is, en zal met zijn vinger van die olie zevenmaal sprengen, voor het aangezicht van de HEERE.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "1 Kron 28:12": "en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;", "Gen 44:1-8": "En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak; En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had. 's Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Hab 2:6": "Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk!", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "Ex 30:16": "U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.", "2 Kon 5:3-8": "Deze zei tegen haar meesteres: Och, was mijn heer maar bij de profeet die in Samaria is, dan zou hij hem van zijn melaatsheid verlossen. Toen ging hij naar binnen en vertelde het zijn heer, en zei: Zo en zo heeft het meisje gesproken, dat uit het land van Israël is. Toen zei de koning van Syrië: Ga heen, kom, en ik zal een brief aan de koning van Israël sturen. En hij ging heen, en nam in zijn hand tien talenten van het zilver, en zesduizend sikkelen goud, en tien stellen kleren.", "2 Kon 2:12": "En Elisa zag het, en hij riep: Mijn vader, mijn vader, wagen van Israël en zijn ruiters! En hij zag hem niet meer; en hij greep zijn klederen en scheurde ze in twee stukken.", "Ex 10:17": "En nu, vergeef mij toch mijn zonde alleen deze keer, en bid vurig tot de HEERE, uw God, dat Hij alleen deze dood van mij wegneemt.", "Gen 43:12-23": "En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing. Neem ook uw broer mee, en maak u op, ga terug naar die man. En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Jak 5:3": "Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "1 Kron 12:40": "En ook degenen die dicht bij hen woonden, tot aan Issaschar, en Zebulon, en Nafthali, brachten brood op ezels, en op kamelen, en op muildieren, en op runderen, meel, klompen gedroogde vijgen, en rozijnenkoeken, en wijn, en olie, en runderen, en kleinvee in overvloed; want er was blijdschap in Israël.", "Rom 14:1": "Neem hem aan die zwak is in het geloof, maar niet tot twistige samensprekingen.", "1 Kon 19:9": "En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?", "Hand 4:21": "Maar zij dreigden hen nog meer, en lieten hen gaan, omdat zij niets vonden waarmee zij hen konden straffen, om het volk; want allen verheerlijkten God over wat er gebeurd was.", "Joh 16:12": "Ik heb u nog veel te zeggen, doch u kunt het nu niet dragen.", "Spr 30:20": "Zo is de weg van een overspelige vrouw; zij eet en veegt haar mond af, en zegt: Ik heb geen onrecht gedaan!", "1 Kon 22:31": "De koning van Syrië nu had zijn tweeëndertig aanvoerders van de wagens geboden en gezegd: U zult niet vechten tegen klein of groot, maar alleen tegen de koning van Israël.", "1 Sam 1:17": "Toen antwoordde Eli en zei: Ga heen in vrede, en de God van Israël geeft u wat u van Hem gebeden hebt.", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "1 Kon 21:15": "Het gebeurde nu, toen Izebel hoorde dat Naboth gestenigd en dood was, dat Izebel tegen Achab zei: Sta op, neem de wijngaard van Naboth, de Jizreëliet, in bezit, die hij u weigerde voor geld te geven; want Naboth leeft niet meer, maar is dood.", "Hand 4:22": "Want de man was meer dan veertig jaar oud, aan wie dit teken van genezing gebeurd was.", "Hand 8:31": "En hij zei: Hoe zou ik dat toch kunnen, als niemand mij onderricht? En hij vroeg Filippus dringend om op te komen en bij hem te zitten.", "Neh 5:4": "Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.", "Jer 27:6": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "1 Kor 1:26": "Want u ziet uw roeping, broeders, dat u niet veel wijzen bent naar het vlees, niet veel machtigen, niet veel edelen.", "Ex 4:6": "En de HEERE zei verder tegen hem: Steek nu uw hand in uw boezem. En hij stak zijn hand in zijn boezem; daarna trok hij ze eruit, en zie, zijn hand was melaats, wit als sneeuw.", "2 Kon 19:1": "En het gebeurde, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde en zich met een zak bedekte, en naar het huis van de HEERE ging.", "Dan 2:19": "Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.", "Gen 30:2": "Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft?", "Ex 16:4-6": "Toen zei de HEERE tegen Mozes: Zie, Ik zal voor u brood uit de hemel laten regenen; en het volk zal uitgaan en verzamelen wat het op elke dag nodig heeft; opdat Ik het beproef, of het naar Mijn wet leeft of niet. En het zal gebeuren op de zesde dag, dat zij klaarmaken wat zij ingebracht zullen hebben; dat zal dubbel zijn boven wat zij dagelijks verzamelen. Toen zeiden Mozes en Aäron tegen alle Israëlieten: Vanavond zult u weten dat de HEERE u uit Egypte geleid heeft;", "2 Kon 15:20": "Menahem nu bracht dit geld op van Israël, van alle vermogende mannen, om aan de koning van Assyrië te geven, voor elke man vijftig zilveren sikkels; zo keerde de koning van Assyrië terug, en bleef daar niet in het land.", "2 Kon 2:8": "Toen nam Elia zijn mantel, en wond hem samen, en sloeg het water, en het werd naar de ene en de andere kant verdeeld; en zij beiden gingen er door op het droge.", "2 Kon 22:19": "Omdat uw hart week geworden is, en u zich voor het aangezicht van de HEERE vernederd hebt, toen u hoorde wat Ik gesproken heb tegen deze plaats en haar inwoners, dat zij tot een verwoesting en vloek zullen worden, en dat u uw kleren gescheurd en voor Mijn aangezicht geweend hebt; zo heb Ik u ook verhoord, spreekt de HEERE.", "Zach 13:1": "Op die dag zal er een bron geopend zijn voor het huis van David en voor de inwoners van Jeruzalem, tegen de zonde en tegen de onreinheid.", "Deut 23:19": "U zult uw broeder geen rente laten betalen, rente van geld, rente van voedsel, rente van enig ding waarover men rente vraagt.", "2 Kron 15:1": "Toen kwam de Geest van God op Azaria, de zoon van Oded.", "2 Kor 11:10": "De waarheid van Christus is in mij: dat deze roem in de gewesten van Achaje aan mij niet verhinderd zal worden.", "1 Kon 13:18": "En hij zei tegen hem: Ik ben ook een profeet, net als u, en een engel heeft tot mij gesproken door het woord van de HEERE, en gezegd: Breng hem met u terug naar uw huis, zodat hij brood eet en water drinkt. Doch hij loog tegen hem.", "Gen 33:11": "Neem toch mijn zegen aan, die u gebracht is, omdat God mij genadig behandeld heeft, en omdat ik alles heb wat ik nodig heb; en hij hield bij hem aan, zodat hij het aannam.", "1 Kon 20:35": "Toen zei een man uit de zonen van de profeten tegen zijn naaste, door het woord van de HEERE: Sla mij toch. En de man weigerde hem te slaan.", "Hand 20:33": "Ik heb niemands zilver, of goud, of kleding begeerd.", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Ps 63:12": "Maar de koning zal zich in God verblijden; ieder die bij Hem zweert, zal zich beroemen; want de mond van de leugensprekers zal gestopt worden.", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "Jer 22:17": "Maar uw ogen en uw hart zijn nergens op gericht dan op uw hebzucht, en op onschuldig bloed, om dat te vergieten, en op verdrukking en geweld, om die te doen.", "1 Sam 17:46": "Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft.", "1 Sam 14:39": "Want zo waarachtig als de HEERE leeft, Die Israël verlost: al was het bij mijn zoon Jonathan, dan zal hij zeker sterven; en niemand uit heel het volk antwoordde hem.", "Lev 13:3": "En de priester zal de plaag in het vel van het vlees bekijken; als het haar in die plaag in wit veranderd is, en het aanzien van de plaag dieper is dan het vel van zijn vlees, is het de plaag van de melaatsheid; als de priester hem bekeken zal hebben, zal hij hem onrein verklaren.", "Num 17:1-13": "Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en neem van hen voor elk vaderlijk huis een staf, van al hun leiders, naar het huis van hun vaderen, twaalf staven; ieders naam zult u schrijven op zijn staf. Doch Aärons naam zult u schrijven op de staf van Levi; want er zal één staf zijn voor het hoofd van het huis van hun vaderen.", "Num 18:16": "Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.", "Joh 12:6": "En dit zei hij niet omdat hij bezorgd was om de armen, maar omdat hij een dief was, en de beurs had, en droeg wat erin gedaan werd.", "Ex 22:25": "Als u Mijn volk, dat arm is onder u, geld leent, mag u zich niet als een woekeraar tegenover hen gedragen; u mag geen rente van hen vragen.", "1 Petr 5:2": "Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed;", "Jer 11:18": "De HEERE nu heeft het mij te kennen gegeven, dat ik het weet; toen hebt U mij hun handelingen laten zien.", "Ezech 11:24": "Daarna nam de Geest mij op, en bracht mij in een gezicht door de Geest van God naar Chaldea, tot de weggevoerde gevangenen; en het gezicht dat ik gezien had, steeg van mij op.", "Joh 4:29": "Kom, kijk naar een Mens Die mij alles gezegd heeft wat ik gedaan heb; is Deze niet de Christus?", "Ex 19:4": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "Matt 9:16": "Ook zet niemand een lap ongeweven laken op een oud kleed; want de aangezette lap scheurt af van het kleed, en er ontstaat een ergere scheur.", "2 Kron 34:14": "En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.", "1 Sam 3:4-10": "dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Joz 3:8": "U zult dan de priesters, die de ark van het verbond dragen, gebieden: Wanneer u komt tot aan de rand van het water van de Jordaan, blijf dan stilstaan in de Jordaan.", "2 Kron 9:1": "En toen de koningin van Scheba het gerucht van Salomo hoorde, kwam zij naar Jeruzalem, om Salomo met raadsels op de proef te stellen, met een zeer groot leger, en kamelen die specerijen droegen, en veel goud, en kostbaar gesteente; en zij kwam bij Salomo, en sprak met hem over alles wat in haar hart was.", "Matt 15:23-26": "Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na. Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël. En zij kwam en aanbad Hem, en zei: Heere, help mij!", "Joh 13:26-30": "Jezus antwoordde: Deze is het, aan wie Ik het stukje brood zal geven, als Ik het ingedoopt heb. En toen Hij het stukje brood ingedoopt had, gaf Hij het aan Judas, de zoon van Simon Iskariot. En na het stukje brood ging de satan in hem. Jezus zei dan tegen hem: Wat u doet, doe het snel. En dit begreep niemand van hen die aan tafel lagen, waarom Hij hem dat zei.", "2 Kon 12:7-16": "Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Matt 2:11": "En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.", "Job 31:13": "Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij;", "Joh 11:4": "En Jezus, dat horende, zei: Deze ziekte is niet tot de dood, maar tot heerlijkheid van God, opdat de Zoon van God erdoor verheerlijkt wordt.", "Deut 2:28": "Verkoop mij voedsel voor geld, dat ik eet, en geef mij water voor geld, dat ik drink; laat mij alleen te voet doortrekken;", "Hand 10:25": "En toen het gebeurde dat Petrus binnenkwam, ging Cornelius hem tegemoet, en viel voor zijn voeten neer, en aanbad hem.", "Jes 59:3": "Want uw handen zijn met bloed bevlekt, en uw vingers met ongerechtigheid; uw lippen spreken valsheid, uw tong spreekt onrecht uit.", "Jer 29:30": "Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Gen 42:25-35": "En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo. En zij laadden hun koren op hun ezels, en trokken vandaar weg. Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.", "2 Kon 5:11-13": "Maar Naäman werd erg boos, en ging weg, en zei: Zie, ik zei bij mijzelf: Hij zal zeker naar buiten komen, en gaan staan, en de Naam van de HEERE, zijn God, aanroepen, en zijn hand over de plaats bewegen, en de melaatse genezen. Zijn Abana en Farpar, de rivieren van Damaskus, niet beter dan al het water van Israël? Zou ik mij daarin niet kunnen wassen en rein worden? Zo keerde hij zich om, en ging weg in woede. Toen kwamen zijn knechten dichterbij, en spraken tegen hem, en zeiden: Mijn vader, als die profeet u een grote zaak opgedragen had, zou u het dan niet gedaan hebben? Hoeveel te meer dan, nu hij tegen u gezegd heeft: Was u, en u zult rein zijn?", "Hand 8:39": "En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.", "Jer 32:20": "U, Die tekenen en wonderen gesteld hebt in het land Egypte, tot op deze dag, zowel in Israël als onder andere mensen, en U hebt Uzelf een Naam gemaakt, zoals dat op deze dag nog blijkt!", "1 Sam 19:20": "Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.", "Num 22:17": "Want ik zal u zeer hoog eren, en al wat u tegen mij zult zeggen, dat zal ik doen; kom toch, vervloek voor mij dit volk!", "Gen 23:13": "En hij sprak tot Efron, ten aanhoren van het volk van het land, en zei: Trouwens, als u het toch wilt geven, hoor mij dan alstublieft; ik zal het geld van de akker geven; neem het van mij aan, dan zal ik mijn dode daar begraven.", "Joh 13:20": "Voorwaar, voorwaar, Ik zeg u: Als Ik iemand zend, wie hem ontvangt, die ontvangt Mij, en wie Mij ontvangt, die ontvangt Hem Die Mij gezonden heeft.", "Matt 4:3": "En de verzoeker kwam naar Hem toe en zei: Als U Gods Zoon bent, zeg dan dat deze stenen broden worden.", "Ex 12:29-33": "En het gebeurde te middernacht, dat de HEERE alle eerstgeborenen in Egypteland sloeg, van de eerstgeborene van Farao af, die op zijn troon zou zitten, tot de eerstgeborene van de gevangene, die in de gevangenis was, en alle eerstgeborenen van het vee. En Farao stond 's nachts op, hij en al zijn dienaren, en alle Egyptenaren; en er was een groot geschreeuw in Egypte; want er was geen huis waarin niet een dode was. Toen riep hij Mozes en Aäron in de nacht, en zei: Maakt u op, trekt uit het midden van mijn volk, u en de kinderen van Israël; en gaat heen, dient de HEERE, zoals u gesproken hebt.", "2 Kon 7:2": "Maar een hoofdman, op wiens hand de koning leunde, antwoordde de man Gods, en zei: Zie, al zou de HEERE vensters in de hemel maken, zou die zaak dan kunnen gebeuren? En hij zei: Zie, u zult het met uw ogen zien, maar daarvan niet eten.", "Amos 9:1": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden.", "Amos 7:14": "Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.", "1 Kon 22:3": "Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen.", "2 Kon 5:2-4": "En er waren benden uit Syrië getrokken, en hadden een klein meisje uit het land van Israël gevangen meegenomen, die in dienst van de vrouw van Naäman was. Deze zei tegen haar meesteres: Och, was mijn heer maar bij de profeet die in Samaria is, dan zou hij hem van zijn melaatsheid verlossen. Toen ging hij naar binnen en vertelde het zijn heer, en zei: Zo en zo heeft het meisje gesproken, dat uit het land van Israël is.", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "2 Kon 5:1-27": "Naäman nu, de legeraanvoerder van de koning van Syrië, was een groot man voor het aangezicht van zijn heer, en van hoog aanzien; want door hem had de HEERE de Syriërs verlossing gegeven; zo was deze man een strijdbaar held, doch melaats. En er waren benden uit Syrië getrokken, en hadden een klein meisje uit het land van Israël gevangen meegenomen, die in dienst van de vrouw van Naäman was. Deze zei tegen haar meesteres: Och, was mijn heer maar bij de profeet die in Samaria is, dan zou hij hem van zijn melaatsheid verlossen.", "Luk 12:15": "En Hij zei tegen hen: Kijk uit en wees op uw hoede voor hebzucht; want het leven van iemand hangt niet af van de overvloed van zijn bezittingen.", "Joh 9:7": "en zei tegen hem: Ga heen, was u in het badwater Siloam (wat vertaald wordt: Uitgezonden). Hij ging toen heen en waste zich, en kwam ziende terug.", "1 Kor 4:8": "Al bent u verzadigd, al bent u rijk geworden, zonder ons hebt u geheerst; en och, was het maar zo dat u heerste, opdat ook wij met u heersen mochten!", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "Ezech 8:1": "Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "1 Petr 3:21": "Waarvan het tegenbeeld, de doop, ons nu ook behoudt — niet als het afleggen van de vuiligheid van het lichaam, maar als de vraag van een goed geweten aan God — door de opstanding van Jezus Christus;", "2 Kon 17:35": "Toch had de HEERE een verbond met hen gemaakt, en had hun geboden en gezegd: U zult geen andere goden vrezen, noch u voor hen neerbuigen, noch hen dienen, noch hun offers brengen.", "Ezech 1:1": "In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "Ex 21:35": "Wanneer nu iemands os de os van zijn naaste zo kwetst, dat hij sterft, dan zal men de levende os verkopen en het geld daarvan gelijk delen, en het dode dier zal men ook gelijk delen.", "Ps 51:9": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw.", "Ezech 11:4": "Daarom, profeteer tegen hen; profeteer, o mensenkind!", "Luk 8:48": "En Hij zei tegen haar: Dochter, heb goede moed, uw geloof heeft u behouden; ga heen in vrede.", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "1 Kor 6:12": "Alle dingen zijn mij toegestaan, maar niet alle dingen zijn nuttig; alle dingen zijn mij toegestaan, maar ik zal mij door niets onder de macht laten brengen.", "Ezech 2:1": "En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.", "2 Kon 11:14": "En zij zag toe, en zie, de koning stond bij de pilaar, naar de gewoonte, en de leiders en de trompetten bij de koning; en al het volk van het land was blij en blies op trompetten. Toen scheurde Athalia haar kleren en riep: Verraad, verraad!", "Gen 16:8": "En hij zei: Hagar, dienstmaagd van Sarai, waar komt u vandaan, en waar zult u heengaan? En zij zei: Ik vlucht van het aangezicht van mijn meesteres Sarai!", "2 Kon 5:20-27": "Gehazi nu, de knecht van Elisa, de man van God, zei: Zie, mijn heer heeft Naäman, deze Syriër, ontzien, doordat hij niet uit zijn hand heeft aangenomen wat hij gebracht had; maar zo waarachtig als de HEERE leeft, ik zal hem achterna lopen, en zal iets van hem aannemen! Zo achtervolgde Gehazi Naäman. En toen Naäman zag dat hij hem achterna liep, sprong hij van de wagen af, hem tegemoet, en zei: Is alles goed? En hij zei: Het is goed; mijn heer heeft mij gestuurd, om te zeggen: Zie, zojuist zijn er twee jonge mannen uit de zonen van de profeten, van het gebergte van Efraïm, bij mij gekomen; geef hun toch een talent van het zilver en twee stellen kleren.", "Est 4:7": "gaf Mordechai hem te kennen alles wat hem overkomen was, en de opgave van het zilver dat Haman gezegd had te zullen wegen in de schatten van de koning, voor de Joden, om hen om te brengen.", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "Kol 2:5": "Want hoewel ik naar het vlees van u ben, ben ik toch met de geest bij u, terwijl ik mij verblijd en uw ordening zie, en de vastheid van uw geloof in Christus.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ezech 3:22": "En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.", "Ex 7:17": "Zo zegt de HEERE: Hieraan zult u weten dat Ik de HEERE ben; zie, ik zal met deze staf, die in mijn hand is, op het water slaan dat in deze rivier is, en het zal in bloed veranderd worden.", "Hos 6:1": "Kom, laten wij terugkeren tot de Heere, want Hij heeft verscheurd, en Hij zal ons genezen; Hij heeft geslagen, en Hij zal ons verbinden.", "Jes 30:6": "De last van de dieren, van het zuiden, naar het land van angst en van benauwdheid, waar de sterke leeuw en de oude leeuw is, de basilisk en de vurige vliegende draak; hun goederen zullen zij voeren op de rug van de veulens, en hun schatten op de bulten van de kamelen, naar het volk dat hun geen nut zal doen.", "Hand 8:18-20": "En toen Simon zag dat door het opleggen van de handen van de apostelen de Heilige Geest gegeven werd, bood hij hun geld aan, en zei: Geef ook mij deze macht, opdat ieder aan wie ik de handen opleg, de Heilige Geest ontvangt. Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "Gen 17:12": "Een zoontje van acht dagen zal bij u besneden worden, alles wat mannelijk is in uw geslachten: degene die in het huis geboren is, en degene die met geld gekocht is van elke vreemdeling die niet van uw nageslacht is;", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "2 Kon 7:17": "De koning nu had de hoofdman, op wiens hand hij leunde, aangesteld over die poort; en het volk vertrapte hem in de poort, zodat hij stierf, zoals de man Gods gesproken had, die het sprak toen de koning naar hem toe was gekomen.", "Deut 14:26": "En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.", "Dan 5:7": "Zodat de koning met kracht riep dat men de sterrenkijkers, de Chaldeeën en de waarzeggers naar binnen zou brengen; en de koning antwoordde en zei tegen de wijzen van Babel: Elke man die dit schrift kan lezen, en mij de uitleg ervan bekend maakt, die zal met purper gekleed worden, met een gouden keten om zijn hals, en hij zal de derde heerser in dit koninkrijk zijn.", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "1 Tim 6:10": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.", "Ps 78:10-32": "Zij hielden Gods verbond niet, en weigerden te wandelen in Zijn wet. En zij vergaten Zijn daden, en Zijn wonderen, die Hij hun had laten zien. Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan.", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "Spr 7:20": "Hij heeft een bundel van het geld in zijn hand genomen; op de vastgestelde dag zal hij naar zijn huis komen.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Lev 16:19": "En hij zal daarop van dat bloed met zijn vinger zevenmaal sprenkelen, en hij zal het reinigen en heiligen van de onreinheden van de kinderen van Israël.", "Jer 23:9": "Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.", "Openb 22:6": "En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "1 Kon 20:31": "Toen zeiden de knechten tegen hem: Zie toch, wij hebben gehoord, dat de koningen van het huis van Israël goedertierene koningen zijn; laat ons toch rouwgewaad om onze lenden leggen, en koorden om onze hoofden, en uitgaan naar de koning van Israël; misschien zal hij uw leven sparen.", "Luk 14:11": "Want ieder die zichzelf verhoogt, zal vernederd worden; en wie zichzelf vernedert, zal verhoogd worden.", "2 Kon 8:8": "Toen zei de koning tegen Hazaël: Neem een geschenk mee, en ga de man Gods tegemoet, en vraag door hem de HEERE: Zal ik van deze ziekte genezen?", "Job 32:9": "De groten zijn niet altijd wijs, en de ouden verstaan het recht niet.", "1 Kor 10:32": "Wees zonder aanstoot te geven, zowel voor de Joden als voor de Grieken als voor de gemeente van God.", "Neh 5:11": "Geeft hun toch, nog vandaag, hun akkers, hun wijngaarden, hun olijfgaarden en hun huizen terug; en het honderdste deel van het geld en van het koren, de most en de olie, die u van hen gevorderd hebt.", "Luk 1:70": "zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Ex 6:28": "Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.", "Luk 4:27": "En er waren veel melaatsen in Israël, in de tijd van de profeet Elisa; en geen van hen werd gereinigd, behalve Naäman, de Syriër.", "2 Kon 5:10-14": "Toen stuurde Elisa een bode naar hem, en zei: Ga heen en was u zeven keer in de Jordaan, en uw vlees zal weer gezond worden, en u zult rein zijn. Maar Naäman werd erg boos, en ging weg, en zei: Zie, ik zei bij mijzelf: Hij zal zeker naar buiten komen, en gaan staan, en de Naam van de HEERE, zijn God, aanroepen, en zijn hand over de plaats bewegen, en de melaatse genezen. Zijn Abana en Farpar, de rivieren van Damaskus, niet beter dan al het water van Israël? Zou ik mij daarin niet kunnen wassen en rein worden? Zo keerde hij zich om, en ging weg in woede.", "2 Kor 11:9": "Want mijn gebrek hebben de broeders vervuld die van Macedonië kwamen; en ik heb mijzelf in alles gehouden zonder u te bezwaren, en ik zal mij nog zo houden.", "Ex 32:22-24": "Toen zei Aäron: De toorn van mijn heer ontsteekt niet! U kent dit volk, dat het geneigd is tot het kwade. Zij zeiden namelijk tegen mij: Maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft opgevoerd, weten wij niet wat er van hem geworden is. Toen zei ik tegen hen: Wie goud heeft, laat die het afrukken en aan mij geven; en ik wierp het in het vuur, en dit kalf is eruit gekomen.", "1 Kon 18:24": "Roep u dan de naam van uw god aan, en ik zal de Naam van de HEERE aanroepen; en de God Die door vuur antwoorden zal, Die zal God zijn. En heel het volk antwoordde en zei: Dat is goed gezegd.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "Matt 26:16": "En vanaf toen zocht hij een gelegenheid om Hem over te leveren.", "1 Sam 13:17": "En de verwoesters trokken uit het leger van de Filistijnen, in drie groepen; de ene groep sloeg de weg in naar Ofra, naar het land Sual;", "Job 31:39": "Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen;", "Hand 22:16": "En nu, waarom wacht u nog? Sta op, laat u dopen en uw zonden afwassen, terwijl u de Naam van de Heere aanroept.", "2 Kron 26:19-23": "Toen werd Uzzia toornig, en het reukwerk was in zijn hand om te roken; en terwijl hij toornig werd tegen de priesters, kwam de melaatsheid op aan zijn voorhoofd, voor het aangezicht van de priesters in het huis van de HEERE, bij het reukaltaar. Toen keek de hoofdpriester Azaria naar hem, en al de priesters, en zie, hij was melaats aan zijn voorhoofd, en zij stootten hem met haast vandaar weg, ja, hij zelf haastte zich ook om naar buiten te gaan, omdat de HEERE hem geplaagd had. Zo was de koning Uzzia melaats tot aan de dag van zijn dood; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis van de HEERE afgesneden; Jotham nu, zijn zoon, was over het huis van de koning, en oordeelde het volk van het land.", "Hand 5:5": "En Ananias, deze woorden horend, viel neer en gaf de geest. En er kwam grote vrees over allen die dit hoorden.", "Ex 4:10-14": "Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong. En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE? En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Gen 3:8": "En zij hoorden de stem van de HEERE God, die wandelde in de hof, bij de avondwind. Toen verborgen Adam en zijn vrouw zich voor het aangezicht van de HEERE God, midden tussen de bomen van de hof.", "Deut 4:33-35": "Of een volk ooit de stem van God gehoord heeft, sprekend uit het midden van het vuur, zoals u gehoord hebt, en in leven is gebleven? Of: of God ooit beproefd heeft te gaan om Zich een volk uit het midden van een ander volk aan te nemen, door beproevingen, door tekenen, en door wonderen, en door strijd, en door een sterke hand, en door een uitgestrekte arm, en met grote verschrikkingen; naar alles wat de HEERE, uw God, voor u in Egypte voor uw ogen gedaan heeft? Aan u is het getoond, opdat u weet dat de HEERE die God is; er is niemand anders dan Hij alleen!", "1 Sam 3:1": "En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.", "Spr 1:32": "Want de afkering van de eenvoudigen zal hen doden, en de voorspoed van de dwazen zal hen te gronde richten.", "Spr 3:7": "Wees niet wijs in uw eigen ogen; vrees de HEERE, en wijk van het kwade.", "Matt 23:9": "En u zult niemand op aarde uw vader noemen; want Eén is uw Vader, namelijk Die in de hemelen is.", "Joz 6:4": "En zeven priesters zullen zeven ramsbazuinen dragen, voor de ark; en u zult op de zevende dag de stad zevenmaal omgaan; en de priesters zullen met de bazuinen blazen.", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Matt 10:4": "Simon Kananites, en Judas Iskariot, die Hem ook verraden heeft.", "1 Sam 25:27": "En nu, dit is de zegen die uw dienstmaagd mijn heer gebracht heeft, dat die gegeven wordt aan de jongemannen die de voetstappen van mijn heer navolgen.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Richt 6:12-17": "Toen verscheen de Engel van de HEERE aan hem, en zei tegen hem: De HEERE is met u, dappere held! Maar Gideon zei tegen Hem: Och, mijn heer! Als de HEERE met ons is, waarom is ons dan dit alles overkomen? En waar zijn al Zijn wonderen, die onze vaders ons verteld hebben en zeiden: Heeft de HEERE ons niet uit Egypte opgevoerd? Maar nu heeft de HEERE ons verlaten, en heeft ons in de hand van de Midianieten gegeven. Toen keerde de HEERE Zich tot hem, en zei: Ga heen in deze kracht van u, en u zult Israël uit de hand van de Midianieten verlossen; heb Ik u niet gezonden?", "2 Kor 9:5": "Ik heb dan nodig geacht deze broeders te vermanen, dat zij eerst tot u zouden komen en van tevoren uw eerder aangediende zegen klaarmaken; zodat die gereed is, als een zegen, en niet als een vrekkigheid.", "Ex 7:5": "Dan zullen de Egyptenaars weten dat Ik de HEERE ben, wanneer Ik Mijn hand over Egypte uitstrek, en de kinderen van Israël uit hun midden uitleid.", "Ex 21:34": "dan zal de eigenaar van de kuil het vergoeden; hij zal aan de eigenaar van het dier het geld teruggeven; maar het dode dier zal hem toebehoren.", "2 Kon 1:6": "En zij zeiden tegen hem: Een man kwam ons tegemoet en zei tegen ons: Ga heen, keer terug naar de koning die u gezonden heeft, en zeg tegen hem: Zo zegt de HEERE: Is het omdat er geen God in Israël is, dat u stuurt om Baäl-Zebub, de god van Ekron, te vragen? Daarom zult u van dat bed waarop u geklommen bent, niet afkomen, maar u zult zeker sterven.", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "1 Sam 6:6-18": "Waarom toch zou u uw hart verharden, zoals de Egyptenaars en farao hun hart verhard hebben? Hebben zij niet, toen Hij wonderlijk met hen gehandeld had, hen laten trekken, zodat zij heengingen? Neem dan nu en maak een nieuwe wagen, en twee zogende koeien waarop geen juk gekomen is; span de koeien voor de wagen, en breng hun kalveren van achter hen terug naar huis. Neem dan de ark van de HEERE, en zet haar op de wagen, en leg de gouden kleinoden die u Hem als schuldoffer teruggeeft in een koffertje aan haar zijde; en zend haar weg, zodat zij vertrekt.", "1 Kon 10:10": "En zij gaf de koning honderdtwintig talenten goud, en zeer veel specerijen, en kostbaar gesteente; zoveel specerijen als de koningin van Scheba de koning Salomo gaf, is er nooit meer in zulke hoeveelheid gekomen.", "Deut 29:5": "En Ik heb u veertig jaren doen wandelen in de woestijn; uw kleren zijn u niet versleten, en uw schoen is niet versleten aan uw voet.", "Deut 1:5": "Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:", "Gen 20:16": "En tegen Sara zei hij: Zie, ik heb uw broeder duizend zilverlingen gegeven; zie, dat moet voor u een bedekking van de ogen zijn, voor allen die bij u zijn,
