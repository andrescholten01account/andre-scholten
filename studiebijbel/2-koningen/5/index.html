de koning van Syrië: Ga heen, kom, en ik zal een brief aan de koning van Israël sturen. En hij ging heen, en nam in zijn hand tien talenten van het zilver, en zesduizend *sikkelen* goud, en tien stellen kleren.","6":"En hij bracht de brief naar de koning van Israël, en zei: Zo gauw deze brief bij u is gekomen, zie, ik heb mijn dienaar Naäman naar u gestuurd, opdat u hem verlost van zijn melaatsheid.","7":"En het gebeurde, toen de koning van Israël de brief gelezen had, dat hij zijn kleren scheurde, en zei: Ben ik dan God, om te doden en levend te maken, dat deze man naar mij toe stuurt, om een man van zijn melaatsheid te verlossen? Want inderdaad, let toch op en zie, dat hij een aanleiding tegen mij zoekt.","8":"Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.","9":"Zo kwam Naäman met zijn paarden en met zijn wagen, en stond voor de deur van het huis van Elisa.","10":"Toen stuurde Elisa een bode naar hem, en zei: Ga heen en was u zeven keer in de Jordaan, en uw vlees zal weer gezond worden, en u zult rein zijn.","11":"Maar Naäman werd erg boos, en ging weg, en zei: Zie, ik zei bij mijzelf: Hij zal zeker naar buiten komen, en gaan staan, en de Naam van de HEERE, zijn God, aanroepen, en zijn hand over de plaats bewegen, en de melaatse genezen.","12":"Zijn Abana en Farpar, de rivieren van Damaskus, niet beter dan al het water van Israël? Zou ik mij daarin niet kunnen wassen en rein worden? Zo keerde hij zich om, en ging weg in woede.","13":"Toen kwamen zijn knechten dichterbij, en spraken tegen hem, en zeiden: Mijn vader, als die profeet u een grote zaak opgedragen had, zou u het dan niet gedaan hebben? Hoeveel te meer dan, nu hij tegen u gezegd heeft: Was u, en u zult rein zijn?","14":"Toen daalde hij af, en doopte zich zeven keer onder in de Jordaan, naar het woord van de man van God; en zijn vlees kwam weer terug, zoals het vlees van een klein kind; en hij werd rein.","15":"Toen keerde hij terug naar de man van God, hij en zijn hele leger, en kwam, en stond voor zijn aangezicht en zei: Zie, nu weet ik dat er geen God is op de hele aarde, dan alleen in Israël! Neem dan nu toch een geschenk aan van uw knecht.","16":"Maar hij zei: *Zo waarachtig als* de HEERE leeft, voor Wiens aangezicht ik sta: ik zal het niet aannemen! En hij drong bij hem aan opdat hij het zou aannemen, maar hij weigerde het.","17":"En Naäman zei: Als het dan niet anders kan, laat toch aan uw knecht gegeven worden een lading aarde, zoveel als een span muildieren dragen kan; want uw knecht zal niet meer brandoffer of slachtoffer aan andere goden brengen, maar alleen aan de HEERE.","18":"In deze zaak moge de HEERE uw knecht vergeven: wanneer mijn heer naar het huis van Rimmon gaat, om zich daar neer te buigen, en hij op mijn hand leunt en ik mij in het huis van Rimmon neerbuig; als ik mij zo neerbuig in het huis van Rimmon, moge de HEERE toch uw knecht in deze zaak vergeven.","19":"En hij zei tegen hem: Ga in vrede. En hij ging van hem weg, een klein stuk weegs.","20":"Gehazi nu, de knecht van Elisa, de man van God, zei: Zie, mijn heer heeft Naäman, deze Syriër, ontzien, doordat hij niet uit zijn hand heeft aangenomen wat hij gebracht had; maar *zo waarachtig als* de HEERE leeft, ik zal hem achterna lopen, en zal iets van hem aannemen!","21":"Zo achtervolgde Gehazi Naäman. En toen Naäman zag dat hij hem achterna liep, sprong hij van de wagen af, hem tegemoet, en zei: Is alles goed?","22":"En hij zei: Het is goed; mijn heer heeft mij gestuurd, om te zeggen: Zie, zojuist zijn er twee jonge mannen uit de zonen van de profeten, van het gebergte van Efraïm, bij mij gekomen; geef hun toch een talent van het zilver en twee stellen kleren.","23":"En Naäman zei: Het is goed, neem twee talenten. En hij drong bij hem aan, en bond twee talenten van het zilver in twee buidels, met twee stellen kleren, en gaf ze aan twee van zijn knechten, die ze voor hem uit droegen.","24":"Toen hij nu bij de heuvel kwam, nam hij ze van hun hand over, en bracht ze in een huis in bewaring; en hij liet de mannen gaan, en zij gingen heen.","25":"Daarna kwam hij binnen, en ging voor zijn heer staan. En Elisa zei tegen hem: Waar kom je vandaan, Gehazi? En hij zei: Uw knecht is nergens heen geweest.","26":"Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?","27":"Daarom zal de melaatsheid van Naäman u aankleven, en uw nageslacht voor eeuwig! Toen ging hij van voor zijn aangezicht weg, melaats, *wit* als de sneeuw."},"SV":{"1":"Naäman nu, de krijgsoverste van den koning van Syrië, was een groot man voor het aangezicht zijns heren, en van hoog aanzien; want door hem had de HEERE den Syriërs verlossing gegeven; zo was deze man een strijdbaar held, *doch* melaats.","2":"En er waren benden uit Syrië getogen, en hadden een kleine jonge dochter uit het land van Israël gevankelijk gebracht, die in den dienst der huisvrouw van Naäman was.","3":"Deze zeide tot haar vrouw: Och, of mijn heer ware voor het aangezicht van den profeet, die te Samaria is, dan zou hij hem van zijn melaatsheid ontledigen.","4":"Toen ging hij in en gaf het zijn heer te kennen, zeggende: Zo en zo heeft de jonge dochter gesproken, die uit het land van Israël is.","5":"Toen zeide de koning van Syrië: Ga heen, kom, en ik zal een brief aan den koning van Israël zenden. En hij ging heen, en nam in zijn hand tien talenten zilvers, en zes duizend *sikkelen* gouds, en tien wisselklederen.","6":"En hij bracht den brief tot den koning van Israël, zeggende: Zo wanneer nu deze brief tot u zal gekomen zijn, zie, ik heb mijn knecht Naäman tot u gezonden, dat gij hem ontledigt van zijn melaatsheid.","7":"En het geschiedde, als de koning van Israël den brief gelezen had, dat hij zijn klederen scheurde, en zeide: Ben ik dan God, om te doden en levend te maken, dat deze tot mij zendt, om een man van zijn melaatsheid te ontledigen? Want voorwaar, merkt toch, en ziet, dat hij oorzaak tegen mij zoekt.","8":"Maar het geschiedde, als Elisa, de man Gods, gehoord had, dat de koning van Israël zijn klederen gescheurd had, dat hij tot den koning zond, om te zeggen: Waarom hebt gij uw klederen gescheurd? Laat hem nu tot mij komen, zo zal hij weten, dat er een profeet in Israël is.","9":"Alzo kwam Naäman met zijn paarden en met zijn wagen, en stond voor de deur van het huis van Elisa.","10":"Toen zond Elisa tot hem een bode, zeggende: Ga heen en was u zevenmaal in de Jordaan, en uw vlees zal u wederkomen, en gij zult rein zijn.","11":"Maar Naäman werd zeer toornig, en toog weg, en zeide: Zie, ik zeide bij mij zelven: Hij zal zekerlijk uitkomen, en staan, en den Naam des HEEREN, Zijns Gods, aanroepen, en zijn hand over de plaats strijken, en den melaatse ontledigen.","12":"Zijn niet Abana en Farpar, de rivieren van Damaskus, beter dan alle wateren van Israël; zou ik mij in die niet kunnen wassen en rein worden? Zo wendde hij zich, en toog weg met grimmigheid.","13":"Toen traden zijn knechten toe, en spraken tot hem, en zeiden: Mijn vader, *zo* die profeet tot u een grote zaak gesproken had, zoudt gij ze niet gedaan hebben? Hoeveel te meer, naardien hij tot u gezegd heeft: Was u, en gij zult rein zijn?","14":"Zo klom hij af, en doopte zich in de Jordaan zevenmaal, naar het woord van den man Gods; en zijn vlees kwam weder, gelijk het vlees van een kleinen jongen; en hij werd rein.","15":"Toen keerde hij weder tot den man Gods, hij en zijn ganse heir, en kwam, en stond voor zijn aangezicht en zeide: Zie, nu weet ik, dat er geen God is op de ganse aarde, dan in Israël! Nu dan, neem toch een zegen van uw knecht.","16":"Maar hij zeide: *Zo* *waarachtig* *als* de HEERE leeft, voor Wiens aangezicht ik sta, indien ik het neme! En hij hield bij hem aan, opdat hij het nam, doch hij weigerde het.","17":"En Naäman zeide: Zo niet; laat toch uw knecht gegeven worden een last aarde van een juk muildieren; want uw knecht zal niet meer brandoffer of slachtoffer aan andere goden doen, maar den HEERE.","18":"In deze zaak vergeve de HEERE uw knecht: wanneer mijn heer in het huis van Rimmon zal gaan, om zich daar neder te buigen, en hij op mijn hand leunen zal en ik mij in het huis van Rimmon nederbuigen zal; als ik mij *alzo* nederbuigen zal in het huis van Rimmon, de HEERE vergeve toch uw knecht in deze zaak.","19":"En hij zeide tot hem: Ga in vrede. En hij ging van hem een kleine streek lands.","20":"Gehazi nu, de jongen van Elisa, den man Gods, zeide: Zie, mijn heer heeft Naäman, dien Syriër belet, dat men uit zijn hand niet genomen heeft, wat hij gebracht had; maar *zo* *waarachtig* *als* de HEERE leeft, ik zal hem nalopen, en zal wat van hem nemen!","21":"Zo volgde Gehazi Naäman achterna. En toen Naäman zag, dat hij hem naliep, viel hij van den wagen af, hem tegemoet, en hij zeide: Is het wel?","22":"En hij zeide: Het is wel; mijn heer heeft mij gezonden, om te zeggen: Zie, nu straks zijn tot mij twee jongelingen uit de zonen der profeten, van het gebergte van Efraïm gekomen; geef hun toch een talent zilvers en twee wisselklederen.","23":"En Naäman zeide: Belieft het u, neem twee talenten. En hij hield aan bij hem, en bond twee talenten zilvers in twee buidels, met twee wisselklederen, en hij leide ze op twee van zijn jongens, die ze voor zijn aangezicht droegen.","24":"Als hij nu op de hoogte kwam, nam hij ze van hun hand, en bestelde ze in een huis; en hij liet de mannen gaan, en zij togen heen.","25":"Daarna kwam hij in, en stond voor zijn heer. En Elisa zeide tot hem: Van waar, Gehazi? En hij zeide: Uw knecht is noch herwaarts noch derwaarts gegaan.","26":"Maar hij zeide tot hem: Ging niet mijn hart mede, als die man zich omkeerde van op zijn wagen u tegemoet? Was het tijd, om dat zilver te nemen, en om klederen te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?","27":"Daarom zal u de melaatsheid van Naäman aankleven, en uw zaad in eeuwigheid! Toen ging hij uit van voor zijn aangezicht, melaats, *wit* als de sneeuw."},"KJV":{"1":"Now Naaman, captain of the host of the king of Syria, was a great man with his master, and honourable, because by him the LORD had given deliverance unto Syria: he was also a mighty man in valour, but he was a leper.","2":"And the Syrians had gone out by companies, and had brought away captive out of the land of Israel a little maid; and she waited on Naaman's wife.","3":"And she said unto her mistress, Would God my lord were with the prophet that is in Samaria! for he would recover him of his leprosy.","4":"And one went in, and told his lord, saying, Thus and thus said the maid that is of the land of Israel.","5":"And the king of Syria said, Go to, go, and I will send a letter unto the king of Israel. And he departed, and took with him ten talents of silver, and six thousand pieces of gold, and ten changes of raiment.","6":"And he brought the letter to the king of Israel, saying, Now when this letter is come unto thee, behold, I have therewith sent Naaman my servant to thee, that thou mayest recover him of his leprosy.","7":"And it came to pass, when the king of Israel had read the letter, that he rent his clothes, and said, Am I God, to kill and to make alive, that this man doth send unto me to recover a man of his leprosy? wherefore consider, I pray you, and see how he seeketh a quarrel against me.","8":"And it was so, when Elisha the man of God had heard that the king of Israel had rent his clothes, that he sent to the king, saying, Wherefore hast thou rent thy clothes? let him come now to me, and he shall know that there is a prophet in Israel.","9":"So Naaman came with his horses and with his chariot, and stood at the door of the house of Elisha.","10":"And Elisha sent a messenger unto him, saying, Go and wash in Jordan seven times, and thy flesh shall come again to thee, and thou shalt be clean.","11":"But Naaman was wroth, and went away, and said, Behold, I thought, He will surely come out to me, and stand, and call on the name of the LORD his God, and strike his hand over the place, and recover the leper.","12":"Are not Abana and Pharpar, rivers of Damascus, better than all the waters of Israel? may I not wash in them, and be clean? So he turned and went away in a rage.","13":"And his servants came near, and spake unto him, and said, My father, if the prophet had bid thee do some great thing, wouldest thou not have done it? how much rather then, when he saith to thee, Wash, and be clean?","14":"Then went he down, and dipped himself seven times in Jordan, according to the saying of the man of God: and his flesh came again like unto the flesh of a little child, and he was clean.","15":"And he returned to the man of God, he and all his company, and came, and stood before him: and he said, Behold, now I know that there is no God in all the earth, but in Israel: now therefore, I pray thee, take a blessing of thy servant.","16":"But he said, As the LORD liveth, before whom I stand, I will receive none. And he urged him to take it; but he refused.","17":"And Naaman said, Shall there not then, I pray thee, be given to thy servant two mules' burden of earth? for thy servant will henceforth offer neither burnt offering nor sacrifice unto other gods, but unto the LORD.","18":"In this thing the LORD pardon thy servant, that when my master goeth into the house of Rimmon to worship there, and he leaneth on my hand, and I bow myself in the house of Rimmon: when I bow down myself in the house of Rimmon, the LORD pardon thy servant in this thing.","19":"And he said unto him, Go in peace. So he departed from him a little way.","20":"But Gehazi, the servant of Elisha the man of God, said, Behold, my master hath spared Naaman this Syrian, in not receiving at his hands that which he brought: but, as the LORD liveth, I will run after him, and take somewhat of him.","21":"So Gehazi followed after Naaman. And when Naaman saw him running after him, he lighted down from the chariot to meet him, and said, Is all well?","22":"And he said, All is well. My master hath sent me, saying, Behold, even now there be come to me from mount Ephraim two young men of the sons of the prophets: give them, I pray thee, a talent of silver, and two changes of garments.","23":"And Naaman said, Be content, take two talents. And he urged him, and bound two talents of silver in two bags, with two changes of garments, and laid them upon two of his servants; and they bare them before him.","24":"And when he came to the tower, he took them from their hand, and bestowed them in the house: and he let the men go, and they departed.","25":"But he went in, and stood before his master. And Elisha said unto him, Whence comest thou, Gehazi? And he said, Thy servant went no whither.","26":"And he said unto him, Went not mine heart with thee, when the man turned again from his chariot to meet thee? Is it a time to receive money, and to receive garments, and oliveyards, and vineyards, and sheep, and oxen, and menservants, and maidservants?","27":"The leprosy therefore of Naaman shall cleave unto thee, and unto thy seed for ever. And he went out from his presence a leper as white as snow."}},"tsk":{"1":[{"kopje":"Naäman","refs":["Luk 4:27"]},{"kopje":"een groot man","refs":["2 Kon 4:8","Ex 11:3","Est 9:4","Est 10:3"]},{"kopje":"door hem","refs":["Spr 21:31","Jes 10:5","Jes 10:6","Jer 27:5","Jer 27:6","Deut 2:37","Joh 19:11","Rom 15:18"]},{"kopje":"melaats","refs":["2 Kon 5:27","2 Kon 7:3","Lev 13:2","Lev 13:3","Lev 13:44-46","Num 12:10-12","2 Sam 3:29","2 Kron 26:19-23","2 Kor 12:7"]}],"2":[{"kopje":"benden","refs":["2 Kon 6:23","2 Kon 13:20","Richt 9:34","1 Sam 13:17","1 Sam 13:18"]},{"kopje  the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> was a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">with</span> his <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">honourable,</span> because by him the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> <span class=\"wl wl-kjv\" data-code=\"H8668\">deliverance</span> unto <span class=\"wl wl-kjv\" data-code=\"H758\">Syria:</span> he was also a <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in <span class=\"wl wl-kjv\" data-code=\"H2428\">valour,</span> but he was a <span class=\"wl wl-kjv\" data-code=\"H6879\">leper.</span>","2":"And the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> had gone <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> by <span class=\"wl wl-kjv\" data-code=\"H1416\">companies,</span> and had brought away <span class=\"wl wl-kjv\" data-code=\"H7617\">captive</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> a <span class=\"wl wl-kjv\" data-code=\"H6996\">little</span> <span class=\"wl wl-kjv\" data-code=\"H5291\">maid;</span> and she waited <span class=\"wl wl-kjv\" data-code=\"H6440\">on</span> <span class=\"wl wl-kjv\" data-code=\"H5283\">Naaman's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>","3":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her <span class=\"wl wl-kjv\" data-code=\"H1404\">mistress,</span> <span class=\"wl wl-kjv\" data-code=\"H305\">Would</span> God my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> were <span class=\"wl wl-kjv\" data-code=\"H6440\">with</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> that is in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria!</span> <span class=\"wl wl-kjv\" data-code=\"H227\">for</span> he would <span class=\"wl wl-kjv\" data-code=\"H622\">recover</span> him of his <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy.</span>","4":"And one went <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> his <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus and thus <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H5291\">maid</span> that is of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","5":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Go <span class=\"wl wl-kjv\" data-code=\"H3212\">to,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">go,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> a <span class=\"wl wl-kjv\" data-code=\"H5612\">letter</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3212\">departed,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> with <span class=\"wl wl-kjv\" data-code=\"H3027\">him</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> pieces of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H2487\">changes</span> of <span class=\"wl wl-kjv\" data-code=\"H899\">raiment.</span>","6":"And he <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">letter</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Now when this <span class=\"wl wl-kjv\" data-code=\"H5612\">letter</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto thee, behold, I have therewith <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H5283\">Naaman</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> to thee, that thou mayest <span class=\"wl wl-kjv\" data-code=\"H622\">recover</span> him of his <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy.</span>","7":"And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">letter,</span> that he <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Am I <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> and to make <span class=\"wl wl-kjv\" data-code=\"H2421\">alive,</span> that this <span class=\"wl wl-kjv\" data-code=\"H2088\">man</span> doth <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> unto me to <span class=\"wl wl-kjv\" data-code=\"H622\">recover</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of his <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy?</span> <span class=\"wl wl-kjv\" data-code=\"H389\">wherefore</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">consider,</span> I pray you, and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> how he seeketh a <span class=\"wl wl-kjv\" data-code=\"H579\">quarrel</span> against me.","8":"And it was so, when <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> that he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Wherefore hast thou <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> thy <span class=\"wl wl-kjv\" data-code=\"H899\">clothes?</span> let him <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> now to me, and he shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that there <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","9":"So <span class=\"wl wl-kjv\" data-code=\"H5283\">Naaman</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> with his <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> and with his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha.</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> a <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">Go</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> in <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> shall come <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to thee, and thou shalt be <span class=\"wl wl-kjv\" data-code=\"H2891\">clean.</span>","11":"But <span class=\"wl wl-kjv\" data-code=\"H5283\">Naaman</span> was <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3212\">away,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, I <span class=\"wl wl-kjv\" data-code=\"H559\">thought,</span> He will <span class=\"wl wl-kjv\" data-code=\"H3318\">surely</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to me, and <span class=\"wl wl-kjv\" data-code=\"H5975\">stand,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> on the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H5130\">strike</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> over the <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H622\">recover</span> the <span class=\"wl wl-kjv\" data-code=\"H6879\">leper.</span>","12":"Are not <span class=\"wl wl-kjv\" data-code=\"H71\">Abana</span> and <span class=\"wl wl-kjv\" data-code=\"H6554\">Pharpar,</span> <span class=\"wl wl-kjv\" data-code=\"H5104\">rivers</span> of <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus,</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> than all the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> may I not <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> in them, and be <span class=\"wl wl-kjv\" data-code=\"H2891\">clean?</span> So he <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> and went <span class=\"wl wl-kjv\" data-code=\"H3212\">away</span> in a <span class=\"wl wl-kjv\" data-code=\"H2534\">rage.</span>","13":"And his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> came <span class=\"wl wl-kjv\" data-code=\"H5066\">near,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> if the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">bid</span> thee do some <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">thing,</span> wouldest thou not have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> it? how much rather <span class=\"wl wl-kjv\" data-code=\"H637\">then,</span> when he <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> to thee, <span class=\"wl wl-kjv\" data-code=\"H7364\">Wash,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2891\">clean?</span>","14":"Then went he <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"H2881\">dipped</span> himself <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times</span> in <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> and his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> came <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> like unto the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of a <span class=\"wl wl-kjv\" data-code=\"H6996\">little</span> <span class=\"wl wl-kjv\" data-code=\"H5288\">child,</span> and he was <span class=\"wl wl-kjv\" data-code=\"H2891\">clean.</span>","15":"And he <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> he and all his <span class=\"wl wl-kjv\" data-code=\"H4264\">company,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him: and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, now I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that there is no <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> but in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> now therefore, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant.</span>","16":"But he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> whom I <span class=\"wl wl-kjv\" data-code=\"H5975\">stand,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> none. And he <span class=\"wl wl-kjv\" data-code=\"H6484\">urged</span> him to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> it; but he <span class=\"wl wl-kjv\" data-code=\"H3985\">refused.</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H5283\">Naaman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Shall there not then, I pray thee, be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H6776\">two</span> <span class=\"wl wl-kjv\" data-code=\"H6505\">mules'</span> <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> of <span class=\"wl wl-kjv\" data-code=\"H127\">earth?</span> for thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> will henceforth <span class=\"wl wl-kjv\" data-code=\"H6213\">offer</span> neither burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> nor <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> unto <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> but unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","18":"In this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5545\">pardon</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> that when my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H935\">goeth</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7417\">Rimmon</span> to <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> there, and he <span class=\"wl wl-kjv\" data-code=\"H8172\">leaneth</span> on my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and I <span class=\"wl wl-kjv\" data-code=\"H7812\">bow</span> myself in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7417\">Rimmon:</span> when I bow <span class=\"wl wl-kjv\" data-code=\"H7812\">down</span> myself in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7417\">Rimmon,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5545\">pardon</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> in this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing.</span>","19":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span> So he <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> from him a <span class=\"wl wl-kjv\" data-code=\"H3530\">little</span> <span class=\"wl wl-kjv\" data-code=\"H776\">way.</span>","20":"But <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi,</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> of <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> hath <span class=\"wl wl-kjv\" data-code=\"H2820\">spared</span> <span class=\"wl wl-kjv\" data-code=\"H5283\">Naaman</span> this <span class=\"wl wl-kjv\" data-code=\"H761\">Syrian,</span> in not <span class=\"wl wl-kjv\" data-code=\"H3947\">receiving</span> at his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> that which he <span class=\"wl wl-kjv\" data-code=\"H935\">brought:</span> but, as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> I will <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H3972\">somewhat</span> of him.","21":"So <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> <span class=\"wl wl-kjv\" data-code=\"H7291\">followed</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H5283\">Naaman.</span> And when <span class=\"wl wl-kjv\" data-code=\"H5283\">Naaman</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> him <span class=\"wl wl-kjv\" data-code=\"H7323\">running</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, he lighted <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> from the <span class=\"wl wl-kjv\" data-code=\"H4818\">chariot</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is all <span class=\"wl wl-kjv\" data-code=\"H7965\">well?</span>","22":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> All is <span class=\"wl wl-kjv\" data-code=\"H7965\">well.</span> My <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, even now there be <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to me from <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets:</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them, I pray thee, a <span class=\"wl wl-kjv\" data-code=\"H3603\">talent</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2487\">changes</span> of <span class=\"wl wl-kjv\" data-code=\"H899\">garments.</span>","23":"And <span class=\"wl wl-kjv\" data-code=\"H5283\">Naaman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Be <span class=\"wl wl-kjv\" data-code=\"H2974\">content,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> two <span class=\"wl wl-kjv\" data-code=\"H3603\">talents.</span> And he <span class=\"wl wl-kjv\" data-code=\"H6555\">urged</span> him, and <span class=\"wl wl-kjv\" data-code=\"H6696\">bound</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> in <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2754\">bags,</span> with <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2487\">changes</span> of <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">laid</span> them upon <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> of his <span class=\"wl wl-kjv\" data-code=\"H5288\">servants;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him.","24":"And when he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H6076\">tower,</span> he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> them from their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H6485\">bestowed</span> them in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and he let the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3212\">departed.</span>","25":"But he went <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> before his <span class=\"wl wl-kjv\" data-code=\"H113\">master.</span> And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H370\">Whence</span> comest thou, <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> no <span class=\"wl wl-kjv\" data-code=\"H575\">whither.</span>","26":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H1980\">Went</span> not mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> with thee, when the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> again from his <span class=\"wl wl-kjv\" data-code=\"H4818\">chariot</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> thee? Is it a <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> and to <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> and <span class=\"wl wl-kjv\" data-code=\"H2132\">oliveyards,</span> and <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> and <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and <span class=\"wl wl-kjv\" data-code=\"H5650\">menservants,</span> and <span class=\"wl wl-kjv\" data-code=\"H8198\">maidservants?</span>","27":"The <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> therefore of <span class=\"wl wl-kjv\" data-code=\"H5283\">Naaman</span> shall <span class=\"wl wl-kjv\" data-code=\"H1692\">cleave</span> unto thee, and unto thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span> And he went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from his <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> a <span class=\"wl wl-kjv\" data-code=\"H6879\">leper</span> as white as <span class=\"wl wl-kjv\" data-code=\"H7950\">snow.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"groot man","tekst":"Dat is, van groot vermogen, uit oorzaak van zijn goede deugden en grote daden. Vergelijk Exo 11:3."},{"catchword":"heren,","tekst":"Namelijk, van den koning van Syrië. Alzo onder, vs.4, 18."},{"catchword":"en van hoog aanzien;","tekst":"Hebreeuws, verheven van aangezicht; dat is, zeer groot geacht en gezien bij allen. Anders, aangenaam; naar een manier van spreken, van welke zie Gen 32:30."},{"catchword":"verlossing","tekst":"Te weten, in krijgsnoden en algemene gevaren des lands, door zijn wijzen raad en mannelijke daden."}],"2":[{"catchword":"En er waren","tekst":"Of, de Syriërs waren uitgetogen bij benden."},{"catchword":"benden","tekst":"Het Hebreeuwse woord betekent hopen en vergaderingen van krijgslieden, die in het land tot roven en plunderen uitvallen. Alzo 1Sa 30:8, onder, 2Ki 13:21, en 2Ki 24:2."},{"catchword":"in den dienst","tekst":"Hebreeuws, voor het aangezicht der huisvrouw van Naäman dat is, die Naämans huisvrouw diende. Alzo, voor iemands aangezicht staan, is hem dienen. Zie Deu 1:38; 1Ki 1:2. Anders, die voor het aangezicht der huisvrouw van Naäman was; dat is, in haar tegenwoordigheid."}],"3":[{"catchword":"ontledigen","tekst":"Sommigen menen dat dit ziet op de afzondering van de melaatsen en hunne vergadering tot het volk, wanneer zij genezen waren. Zie Num 12:14. Alzo onder, vs.6,7, 11. Hebreeuws, verzamelen. Welke manier van spreken, iemand van zijn melaatsheid verzamelen, zoveel is als de melaatsheid van iemand verzamelen; dat is, wegnemen; omdat hetgeen, hetwelk men verzamelt, weggenomen wordt van de plaats, vanwaar men het verzamelt. Zie Psa 26:9."}],"4":[{"catchword":"hij","tekst":"Namelijk, Naäman de Syriër, als men hem de woorden der Israëlietische dochter aangezegd had."},{"catchword":"in","tekst":"Te weten, tot den koning, zijn heer."}],"5":[{"catchword":"nam","tekst":"Te weten, tot een vrijwillig geschenk om den profeet daarmede te vereren. Zie 1Ki 14:3."},{"catchword":"in zijn hand","tekst":"Dat is, met hem. Vergelijk 1Sa 9:8; 2Sa 8:10; 1Ki 14:3; onder, 2Ki 8:8."},{"catchword":"tien talenten","tekst":"Zie van een talent Exo 25:39."},{"catchword":"sikkelen gouds,","tekst":"Zie van de waarde eens gemenen gouden sikkels Gen 24:22; Num 7:14."},{"catchword":"wisselklederen","tekst":"Zie Gen 45:22."}],"6":[{"catchword":"ontledigt","tekst":"Te weten, door middel van uw profeet Elisa, gelijk men kan oordelen dit zijn mening geweest te zijn, uit hetgeen boven, vs.4, verhaald is; maar de koning Israëls heeft dit zo verstaan, alsof hij in eigen persoon door den brief belast geweest ware, den vorst Naäman van zijn melaatsheid te genezen, gelijk blijkt uit vs.7."}],"7":[{"catchword":"zoekt","tekst":"Te weten, om mij oorlog aan te doen indien ik dezen Naäman niet genees, want hij weet wel dat dit in mijn vermogen niet is."}],"8":[{"catchword":"Waarom hebt gij","tekst":"Hij wil zeggen dat hij om deze oorzaak zijn klederen niet behoorde gescheurd, maar wel den Heere door hem raad gevraagd te hebben. Vergelijk boven, 2Ki 1:6, 2Ki 1:16."}],"9":[{"catchword":"zijn wagen,","tekst":"Of, zijn wagenen. Want het getal van één wordt met dit woord in zulks een zaak dikwijls voor het getal van velen genomen, gelijk Gen 50:9; 1Ki 1:5, en 1Ki 10:26; Isa 37:24."}],"10":[{"catchword":"zevenmaal","tekst":"Noch de Jordaan noch de zevenvoudige wassing hadden het vermogen om de melaatsheid te genezen, maar alleen de kracht Gods, die daardoor wilde werken."},{"catchword":"wederkomen,","tekst":"Te weten, dat door de melaatsheid u afgenomen en afgeteerd is."},{"catchword":"gij zult rein zijn","tekst":"Hebreeuws, word rein; dat is, gij zult zekerlijk rein worden. Alzo vs.13."}],"11":[{"catchword":"ik zeide","tekst":"Anders, ik zeide: Tot mij zal hij zekerlijk uitkomen, enz."},{"catchword":"zal zekerlijk","tekst":"Hebreeuws, uitkomende uitkomen."},{"catchword":"plaats strijken,","tekst":"Hebreeuws, bewegen."},{"catchword":"den melaatse","tekst":"Dat is, mij van mijn melaatsheid genezen. Anders, het melaatse; dat is, de melaatsheid wegnemen. Zie boven, vs.3."}],"12":[{"catchword":"Abána","tekst":"Anders genaamd Amana, en bij de historieschrijvers Adonis."},{"catchword":"Farpar,","tekst":"In de historiën genaamd Orontes."},{"catchword":"zou ik","tekst":"Hij meende dat de kracht des wates hem zou kunnen genezen, daar het maar een teken en middel was van de beloofde genezing."}],"13":[{"catchword":"Mijn vader,","tekst":"Dit is een benaming van eerbied, liefde en vreze, die de onderzaten plegen hun oversten te geven, wanneer deze zich als vaders met de daad vertonen. Vergelijk de aantekening Gen 41:43."},{"catchword":"grote zaak","tekst":"Dat is, u wat zwaars geboden had."}],"15":[{"catchword":"zijn ganse heir,","tekst":"Hebreeuws, zijn ganse leger. Versta hierdoor al degenen, die hij met zich in deze reis genomen had, en die in menigte als een heirleger waren."},{"catchword":"zegen","tekst":"Dat is, geschenk. Zie Gen 33:11."}],"16":[{"catchword":"voor Wiens","tekst":"Dat is, denwelken ik dien. Zie Deu 10:8."},{"catchword":"indien","tekst":"Versta daarop, de Heere straffe mij. Want in het eedzweren hebben de Hebreën gemeenlijk de straf verzwegen. Zie Gen 14:23."}],"17":[{"catchword":"Zo niet;","tekst":"Dat is, indien gij mijne giften niet wilt ontvangen, gun mij slechts een andere bede, die ik u nu ga voorstellen. Zie een gelijke manier van spreken 2Sa 13:26."},{"catchword":"uw knecht","tekst":"Dat is, mij die u dienst schuldig ben."},{"catchword":"gegeven","tekst":"Hij verzoekt van den profeet twee dingen:&lt;i&gt;I.&lt;/i&gt; van des lands aarde met zich in Syrië te voeren, om daarvan een altaar te maken, waarop hij den Heere offerande doen zou;&lt;i&gt;II.&lt;/i&gt; dat het hem vergeven zou worden, als hij in het huis van de afgod Rimmon zijnen heer ten dienste wezen zou. Waarmede hij wel toont een goed voornemen om den waren God te dienen, maar niet naar wetenschap, menende dat de ene aarde heiliger was dan de andere, en dat men God ergens elders offeranden mocht doen dan in Jeruzalem, en biddende om vergiffenis van hetgeen hij doen zou met kwetsing zijner eigen conscientie en ergernis van anderen."},{"catchword":"van een juk muildieren;","tekst":"Dat is, zoveel als twee muilen tevens dragen kunnen."}],"18":[{"catchword":"mijn heer","tekst":"Te weten, de koning van Syrië alzo boven, vs.1, 4."},{"catchword":"Rimmon","tekst":"De naam van een afgod, dien de Syriërs dienden."},{"catchword":"buigen,","tekst":"Te weten, met aanbidding."},{"catchword":"nederbuigen","tekst":"Niet om den afgod te aanbidden, of enige godsdienstige eer te bewijzen, maar om zijn koning te dienen, die op zijn hand leunde, wanneer hij zich voor zijn afgod nederboog; waarom ook Naäman genoodzaakt werd zich te buigen."},{"catchword":"vergeve toch","tekst":"Zo verstond hij dan wel dat de nederbuiging voor de afgoden, ofschoon dien ter ere niets gedaan wordt, zonder zonde niet kan geschieden."}],"19":[{"catchword":"Ga in vrede","tekst":"De profeet, zonder hiermede te antwoorden op zijn verzoek of hem hetzelve toe te staan, wenst hem alleen den zegen des Heeren. vs.18 kan ook aldus bekwamelijk naar Hebreeuwsen tekst worden overgezet: In deze zaak vergeve de HEERE uw knecht; wanneer mijn heer in het huis Rimmons is ingegaan om zich daar neder te buigen, en hij zich op mijn hand geleund heeft, en ik mij in het huis Rimmons heb nedergebogen; als ik mij [alzo] heb nedergebogen in het huis Rimmons, de HEERE vergeve toch uw knecht in deze zaak; sprekende alzo niet van het toekomende, maar van het verledene, waarvan hij vergiffenis begeert. Zie een gelijk antwoord 1Sa 1:17."},{"catchword":"kleine streek lands","tekst":"Zie Gen 35:16."}],"20":[{"catchword":"zeide","tekst":"Te weten, bij zichzelven, gelijk boven, vs.11, en Gen 20:11."}],"21":[{"catchword":"viel hij","tekst":"Dat is, trad metterhaast daarvan. Vergelijk Gen 24:64; idem Joh 15:18, en Jdg 1:14."},{"catchword":"Is het wel?","tekst":"Hebreeuws, is het vrede? Zie boven, 2Ki 4:26, en zo in het volgende."}],"24":[{"catchword":"op de hoogte","tekst":"Een hoogte of heuvel, gelegen niet ver van Samaria, waar Elisa nu woonde."},{"catchword":"bestelde ze","tekst":"Of, legde ze weg, of gaf ze te bewaren."}],"26":[{"catchword":"Ging niet","tekst":"Hij wil zeggen: Heeft mij de Heere in den geest niet te kennen gegeven en in een gezicht vertoond waard gij zijt gegaan, wat gij gesproken en gedaan en ontvangen hebt, als of ik zelf in persoon daarbij geweest ware en alles met mijne ogen gezien had?"},{"catchword":"en olijfbomen,","tekst":"Dat is, met welk zilver gij voorgenomen hebt deze dingen te kopen."}],"27":[{"catchword":"de melaatsheid","tekst":"Dat is, de melaatsheid, die Naäman gehad heeft, zal op u en uw kinderen komen, tot een exempel der rechtvaardige straf Gods over gierigheid, simonie en leugentaal."},{"catchword":"als de sneeuw","tekst":"Dat is, van melaatsheid zo wit als sneeuw. Zie Num 12:10."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now Naama the chief Captain of the king of Syria, was a great man, [i.e. Of great power and antiquity, in regard of his qualities, and valiant acts. Compare Exod.11.on vers.3.] before the face of his Lord, [namely, the King of Syria: so below v.4. and 18.] and of high respect: [Heb. exalted of face; i.e. highly esteemed, and regarded by all. Oth. acceptable; according to a certain phrase, or manner of speaking; of which see Gen.32.on v.20.] for by him the LORD had given deliverance unto the Syrians: [to wit, by his wise counsel, and valiant acts] so this man a warlike champion, (but) leprous."}],"2":[{"catchword":null,"tekst":"And there were hands [The Hebrew word signifieth heaps, and assembies of souldiers, that fall into a country to rob and plunder: so 1 Sam.30 8. below ch.13.21. and 24.2.] marched out of Syria, [or, the Syrians had marched forth by hands] and had brought (away) captive out of the land of Israel a little maid, which was in the servant of Naamans wife; [Hebr. before the face of Naamans wife; that is, which waited on Naamans wife, or was servant to her. So, to stand before ones face, is to serve him, or waited on him; see Deut.1.on v.38. 1 Kings on ver.2. Oth. which was before the face of Naamans wife; that is, in her presence.]"}],"3":[{"catchword":null,"tekst":"This (maid) said unto her mistress; Oh if my Lord were before the face of the Prophet, that is at Samaria, then he would recover him of his leprosy. Some conceiveth that this hath regard to the separation of the Lepers, and their gathering unto the people when they were healed: see Numb.12.on v.14. So below chap.6. vers.7,11. Heb. gather, &c. which phrase, to gather one of, or from his leprosy, is as much as, to gather the leprosy on, i.e. to take it away from him, because that which is gathered, is taken away from the place, from which it is gathered: see Prov.26.on v.9.]"}],"4":[{"catchword":null,"tekst":"Then he [Namely, Naaman the Syrian, when these words of the Israelitish woman were told him] went in, [to wit, unto the King his Lord] and made his Lord acquainted with it, saying: Thus and thus spake the maid, that is of the Land of Israel."}],"5":[{"catchword":null,"tekst":"Then said the King of Syria: Go to, come, and I will send a letter to the King of Israel; and he went his way, and took in his hand [i.e. With him. Compare 1 Sam.9.8. 2 Sam.8.10. 1 Kings 14.3. and below chap.8.8.] ten talents of silver, [see of a talent, Exod.25.on ver.3 9.] and six thousand (shekels) of gold, [see of the value of a common shekel of gold, Gen.14.on ver.22. and Numb.7.on v.14] and ten changes of raiment. [see Gen.45.on v.22. These things he took along with him as a free present, to gratify the Prophet therewith. See 1 Kings 14.on v.3.]"}],"6":[{"catchword":null,"tekst":"And he brought the letter to the King of Israel, saying; Now when this letter shall come unto thee; behold, I have sent Naaman my servant unto thee, that thou mayest deliver him of his leprosy. [To wit, by means of thy Prophet Elisa; as a man may judge that this was his meaning, by what was related above v.4. But the King of Israel understood this thus, as if he himself in his own person were charged by the letter, to cure Prince Naaman of his leprosy, as appeareth by the following verse.]"}],"7":[{"catchword":null,"tekst":"And it came to pass, when the King of Israel had read the letter, that he rent his clothes, and said; Am I then a God, to kill, and to make alive, that this (man) doth send to me, to deliver a man of his leprosy? For, of a truth, consider, I pray, and see (how) that he seeketh occasion against me. [viz. to make war against me, if I do not cure this Naaman: for he knoweth right well that it is not in my power to do it.]"}],"8":[{"catchword":null,"tekst":"But it came to pass, when Elisa, the man of God, had heard, that the King of Israel had rent his clothes; that he sent to the King to tell (him); Wherefore hast thou rent thy clothes? [Intimating, that he ought not for this cause to have rent his clothes, but rather to have asked counsel of the Lord by him. Compare above chap.1.ver.6 16.] Let him come now to me, then he shall know, that there is a Prophet in Israel."}],"9":[{"catchword":null,"tekst":"So Naaman come with his horses, and with his charet; [Or, charets. For the singular number is oft with this word, in such transaction as this, taken for the plural; as Gen 50:9. 1 Kings 1.5. & 10.26. Isa 37:24.] and stood before the door of Elisa&acirc;&euro;&trade;s house."}],"10":[{"catchword":null,"tekst":"Then Elisa sent a messenger unto him, saying: Go thy ways, and wash thy self seven times in the Jordan, and thy flesh shall come again to thee, [viz. which by the leprosy was taken off, and consumed away from thee] and thou shalt be clean, [Heb. be thou clean: that is, thou shalt surely be clean. So vers.13. Neither the Jordan, nor the seven-fold washing, had the virtue to cure the leprosy, but onely the power of God, who was pleased to work by that means.]"}],"11":[{"catchword":null,"tekst":"But Naaman grew very angry, and went away, and said; Behold, I said with my self, he will surely come out, [Heb. Coming out, come out. Oth. I said, he will surely come out to me, etc.] and stand, and call on the Name of the LORD his God, and strike [Heb. move] his hand over the place, and recover the leper, [i.e. cure me of my leprosy. oth. that which is leprous: that is, take away the leprosy: see above on v.3.]"}],"12":[{"catchword":null,"tekst":"Are not Abana, [Otherwise called Amana, and by Historians Adonis] and Pharpar [in Histories called Orontes] the Rivers of Damascus, better then all the waters of Israel? might I not wash my self in them, and be clean? [he thought that the virtue of the water could cure him, whereas it was but a token and means of the promised cure] so he turned himself, and went away with indignation."}],"13":[{"catchword":null,"tekst":"Then his servants step forth, and spake unto him, and said, my Father, [This is an appellation of reverence, love, and fear, which inferiors are wont to give to their superiors, when they carry themselves indeed as Fathers. Compare the annotate. Gen.41.on v.43.] nd he shall lean on mine hand, and I shall how down me self in the house of Rimmon; [not to worship the Idol, or to perform any religious honor or service unto it, but to wait and attend upon his King, that leaned on his hand, when he bowed himself down his Idol: for which cause Naaman was also constraint to bow himself] when I shall (thus) bow down me self in the house of Rimmon, the LORD now pardon thy servant in this thing: [he then knew full well, that bowing down before Idols, though it be not done to their honour, cannot be done or performed without sin. In these two verses, viz. the 17, and 18. he requesteth two things of the Prophet. First, to carry some quantity of the Countrys earth along with him into Syria, to build an altar therewith, on which he might offer sacrifice unto the LORD. Secondly, that he might be pardoned, when so ever he should be present in the house of the Idol Rimmon, to wait upon his Lord there, whereby indeed he bewrayeth a good intention to serve the true God, but not according to knowledge, thinking that one kind of earth was holier then another, and that a just man might offer sacrifice to God in any other place, as well as in Jerusalem, and praying for pardon of that which could not be done, without wounding his own conscience, and offending others.]"}],"19":[{"catchword":null,"tekst":"And he said unto him, Go in peace: [The Prophet without answering hereby to his request, or consenting to it, wisheth him onely the blessing of the LORD. The 18. verse may be thus also sitly translated, according to the Hebrew text; The Lord pardon thy servant in this thing, when my Lord went into the house of Rimmon to bow down himself there, and he loaned on mine hand, and I bowed down my self in the house of Rimmon; when I (thus) bowed down my self in the house of Rimmon, the LORD now pardon thy servant in this thing: speaking thus not of that which was to come, or to be done, but of that which was already done and past, of which he desireth pardon: see alike answer, 1 Sam.1.17.] and he departed from him a little space of ground. [see Gen.35.on v.16.]"}],"20":[{"catchword":null,"tekst":"Now Gehazi the lad of Elisa the man of God said, [To wit, with himself, as above v.11. and Gen.20.on ver.11.] Behold; my Lord hath hindred Naaman that Syrian, that what he had brought, hath not been received at his hand: but (as true as) the LORD liveth, I will run after him, and will take somewhat of him."}],"21":[{"catchword":null,"tekst":"So Gehazi followed after Naaman: and when Naamman saw that he ran after him, he fell down from the charet, [That is, he step down with all sped from it. Compare Gen.24 64. Item, Jos.15.18. and Judg.1.14.] to meet him; and he said, is it well? [Heb. is it peace? see above chap.4. on vers.26. and so in the sequel.]"}],"22":[{"catchword":null,"tekst":"And he said, It is well? my Lord sent me, to say (to thee), Behold even now (there) be come to me from mount Ephraim two young men of the sons of the Prophets; give then, I pray, a talent of silver, and two changes of garments."}],"23":[{"catchword":null,"tekst":"And Naaman said, If it please thee, take two talents; and he was importunate with him, and bound two talents of silver in two bags, with two changes of garments, and he laid them on two of his lads, that carried them before his face."}],"24":[{"catchword":null,"tekst":"Now when he came upon the high place, [An high place, or hill, lying not far from Samaria, where Elisa now dwelt] he took them from their hand, and bestowed them [or, laid them away, or, gave them to be kept] in an house, and let the men go, and they departed."}],"25":[{"catchword":null,"tekst":"Then he came in, and stood before his Lord: and Elisa said unto him; From whence (comest thou), Gehazi? and he said, Thy servant went neither hither, nor thither."}],"26":[{"catchword":null,"tekst":"But he said unto him; Went not mine heart with (thee), when that man turned him about from his charet to meet thee? [As if he should say, Hath not the Lord acquainted me in the spirit, and shewed me in a vision, whither thou wentest, what thou hast spoken, and done, and received, as if I my had been there present in person, and had seen all with mine own eyes?] was it (a) time to receive that silver, and receive agarments, and olive-trees, and vineyards, and sheep, and oxen, and (men-) servants, and maid-servants? [i.e. with which silver, or money, thou didst intend to buy these things.]"}],"27":[{"catchword":null,"tekst":"Therefore the leprosy of Naaman shall cleave unto thee, and unto thy seed forever: [That is, the leprosy that Naaman had, shall come upon thee, and upon thy children, for an example of the just judgement of God for covetousness, simony, and lying] then he went out from before his face, a leper, (white) as the snow. [i.e. in leprosy as white as snow. See Numb.12.on v.10. 2 Chron.26.19,20.]"}]}}};
