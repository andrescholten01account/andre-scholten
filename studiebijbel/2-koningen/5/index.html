, {"naam": "Hebreeën", "href": "../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Naäman nu, de legeraanvoerder van de koning van Syrië, was een groot man voor het aangezicht van zijn heer, en van hoog aanzien; want door hem had de HEERE de Syriërs verlossing gegeven; zo was deze man een strijdbaar held, *doch* melaats.", "2": "En er waren benden uit Syrië getrokken, en hadden een klein meisje uit het land van Israël gevangen meegenomen, die in dienst van de vrouw van Naäman was.", "3": "Deze zei tegen haar meesteres: Och, was mijn heer maar bij de profeet die in Samaria is, dan zou hij hem van zijn melaatsheid verlossen.", "4": "Toen ging hij naar binnen en vertelde het zijn heer, en zei: Zo en zo heeft het meisje gesproken, dat uit het land van Israël is.", "5": "Toen zei de koning van Syrië: Ga heen, kom, en ik zal een brief aan de koning van Israël sturen. En hij ging heen, en nam in zijn hand tien talenten van het zilver, en zesduizend *sikkelen* goud, en tien stellen kleren.", "6": "En hij bracht de brief naar de koning van Israël, en zei: Zo gauw deze brief bij u is gekomen, zie, ik heb mijn dienaar Naäman naar u gestuurd, opdat u hem verlost van zijn melaatsheid.", "7": "En het gebeurde, toen de koning van Israël de brief gelezen had, dat hij zijn kleren scheurde, en zei: Ben ik dan God, om te doden en levend te maken, dat deze man naar mij toe stuurt, om een man van zijn melaatsheid te verlossen? Want inderdaad, let toch op en zie, dat hij een aanleiding tegen mij zoekt.", "8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "9": "Zo kwam Naäman met zijn paarden en met zijn wagen, en stond voor de deur van het huis van Elisa.", "10": "Toen stuurde Elisa een bode naar hem, en zei: Ga heen en was u zeven keer in de Jordaan, en uw vlees zal weer gezond worden, en u zult rein zijn.", "11": "Maar Naäman werd erg boos, en ging weg, en zei: Zie, ik zei bij mijzelf: Hij zal zeker naar buiten komen, en gaan staan, en de Naam van de HEERE, zijn God, aanroepen, en zijn hand over de plaats bewegen, en de melaatse genezen.", "12": "Zijn Abana en Farpar, de rivieren van Damaskus, niet beter dan al het water van Israël? Zou ik mij daarin niet kunnen wassen en rein worden? Zo keerde hij zich om, en ging weg in woede.", "13": "Toen kwamen zijn knechten dichterbij, en spraken tegen hem, en zeiden: Mijn vader, als die profeet u een grote zaak opgedragen had, zou u het dan niet gedaan hebben? Hoeveel te meer dan, nu hij tegen u gezegd heeft: Was u, en u zult rein zijn?", "14": "Toen daalde hij af, en doopte zich zeven keer onder in de Jordaan, naar het woord van de man van God; en zijn vlees kwam weer terug, zoals het vlees van een klein kind; en hij werd rein.", "15": "Toen keerde hij terug naar de man van God, hij en zijn hele leger, en kwam, en stond voor zijn aangezicht en zei: Zie, nu weet ik dat er geen God is op de hele aarde, dan alleen in Israël! Neem dan nu toch een geschenk aan van uw knecht.", "16": "Maar hij zei: *Zo waarachtig als* de HEERE leeft, voor Wiens aangezicht ik sta: ik zal het niet aannemen! En hij drong bij hem aan opdat hij het zou aannemen, maar hij weigerde het.", "17": "En Naäman zei: Als het dan niet anders kan, laat toch aan uw knecht gegeven worden een lading aarde, zoveel als een span muildieren dragen kan; want uw knecht zal niet meer brandoffer of slachtoffer aan andere goden brengen, maar alleen aan de HEERE.", "18": "In deze zaak moge de HEERE uw knecht vergeven: wanneer mijn heer naar het huis van Rimmon gaat, om zich daar neer te buigen, en hij op mijn hand leunt en ik mij in het huis van Rimmon neerbuig; als ik mij zo neerbuig in het huis van Rimmon, moge de HEERE toch uw knecht in deze zaak vergeven.", "19": "En hij zei tegen hem: Ga in vrede. En hij ging van hem weg, een klein stuk weegs.", "20": "Gehazi nu, de knecht van Elisa, de man van God, zei: Zie, mijn heer heeft Naäman, deze Syriër, ontzien, doordat hij niet uit zijn hand heeft aangenomen wat hij gebracht had; maar *zo waarachtig als* de HEERE leeft, ik zal hem achterna lopen, en zal iets van hem aannemen!", "21": "Zo achtervolgde Gehazi Naäman. En toen Naäman zag dat hij hem achterna liep, sprong hij van de wagen af, hem tegemoet, en zei: Is alles goed?", "22": "En hij zei: Het is goed; mijn heer heeft mij gestuurd, om te zeggen: Zie, zojuist zijn er twee jonge mannen uit de zonen van de profeten, van het gebergte van Efraïm, bij mij gekomen; geef hun toch een talent van het zilver en twee stellen kleren.", "23": "En Naäman zei: Het is goed, neem twee talenten. En hij drong bij hem aan, en bond twee talenten van het zilver in twee buidels, met twee stellen kleren, en gaf ze aan twee van zijn knechten, die ze voor hem uit droegen.", "24": "Toen hij nu bij de heuvel kwam, nam hij ze van hun hand over, en bracht ze in een huis in bewaring; en hij liet de mannen gaan, en zij gingen heen.", "25": "Daarna kwam hij binnen, en ging voor zijn heer staan. En Elisa zei tegen hem: Waar kom je vandaan, Gehazi? En hij zei: Uw knecht is nergens heen geweest.", "26": "Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?", "27": "Daarom zal de melaatsheid van Naäman u aankleven, en uw nageslacht voor eeuwig! Toen ging hij van voor zijn aangezicht weg, melaats, *wit* als de sneeuw."}, "SV": {"1": "Naäman nu, de krijgsoverste van den koning van Syrië, was een groot man voor het aangezicht zijns heren, en van hoog aanzien; want door hem had de HEERE den Syriërs verlossing gegeven; zo was deze man een strijdbaar held, *doch* melaats.", "2": "En er waren benden uit Syrië getogen, en hadden een kleine jonge dochter uit het land van Israël gevankelijk gebracht, die in den dienst der huisvrouw van Naäman was.", "3": "Deze zeide tot haar vrouw: Och, of mijn heer ware voor het aangezicht van den profeet, die te Samaria is, dan zou hij hem van zijn melaatsheid ontledigen.", "4": "Toen ging hij in en gaf het zijn heer te kennen, zeggende: Zo en zo heeft de jonge dochter gesproken, die uit het land van Israël is.", "5": "Toen zeide de koning van Syrië: Ga heen, kom, en ik zal een brief aan den koning van Israël zenden. En hij ging heen, en nam in zijn hand tien talenten zilvers, en zes duizend *sikkelen* gouds, en tien wisselklederen.", "6": "En hij bracht den brief tot den koning van Israël, zeggende: Zo wanneer nu deze brief tot u zal gekomen zijn, zie, ik heb mijn knecht Naäman tot u gezonden, dat gij hem ontledigt van zijn melaatsheid.", "7": "En het geschiedde, als de koning van Israël den brief gelezen had, dat hij zijn klederen scheurde, en zeide: Ben ik dan God, om te doden en levend te maken, dat deze tot mij zendt, om een man van zijn melaatsheid te ontledigen? Want voorwaar, merkt toch, en ziet, dat hij oorzaak tegen mij zoekt.", "8": "Maar het geschiedde, als Elisa, de man Gods, gehoord had, dat de koning van Israël zijn klederen gescheurd had, dat hij tot den koning zond, om te zeggen: Waarom hebt gij uw klederen gescheurd? Laat hem nu tot mij komen, zo zal hij weten, dat er een profeet in Israël is.", "9": "Alzo kwam Naäman met zijn paarden en met zijn wagen, en stond voor de deur van het huis van Elisa.", "10": "Toen zond Elisa tot hem een bode, zeggende: Ga heen en was u zevenmaal in de Jordaan, en uw vlees zal u wederkomen, en gij zult rein zijn.", "11": "Maar Naäman werd zeer toornig, en toog weg, en zeide: Zie, ik zeide bij mij zelven: Hij zal zekerlijk uitkomen, en staan, en den Naam des HEEREN, Zijns Gods, aanroepen, en zijn hand over de plaats strijken, en den melaatse ontledigen.", "12": "Zijn niet Abana en Farpar, de rivieren van Damaskus, beter dan alle wateren van Israël; zou ik mij in die niet kunnen wassen en rein worden? Zo wendde hij zich, en toog weg met grimmigheid.", "13": "Toen traden zijn knechten toe, en spraken tot hem, en zeiden: Mijn vader, *zo* die profeet tot u een grote zaak gesproken had, zoudt gij ze niet gedaan hebben? Hoeveel te meer, naardien hij tot u gezegd heeft: Was u, en gij zult rein zijn?", "14": "Zo klom hij af, en doopte zich in de Jordaan zevenmaal, naar het woord van den man Gods; en zijn vlees kwam weder, gelijk het vlees van een kleinen jongen; en hij werd rein.", "15": "Toen keerde hij weder tot den man Gods, hij en zijn ganse heir, en kwam, en stond voor zijn aangezicht en zeide: Zie, nu weet ik, dat er geen God is op de ganse aarde, dan in Israël! Nu dan, neem toch een zegen van uw knecht.", "16": "Maar hij zeide: *Zo* *waarachtig* *als* de HEERE leeft, voor Wiens aangezicht ik sta, indien ik het neme! En hij hield bij hem aan, opdat hij het nam, doch hij weigerde het.", "17": "En Naäman zeide: Zo niet; laat toch uw knecht gegeven worden een last aarde van een juk muildieren; want uw knecht zal niet meer brandoffer of slachtoffer aan andere goden doen, maar den HEERE.", "18": "In deze zaak vergeve de HEERE uw knecht: wanneer mijn heer in het huis van Rimmon zal gaan, om zich daar neder te buigen, en hij op mijn hand leunen zal en ik mij in het huis van Rimmon nederbuigen zal; als ik mij *alzo* nederbuigen zal in het huis van Rimmon, de HEERE vergeve toch uw knecht in deze zaak.", "19": "En hij zeide tot hem: Ga in vrede. En hij ging van hem een kleine streek lands.", "20": "Gehazi nu, de jongen van Elisa, den man Gods, zeide: Zie, mijn heer heeft Naäman, dien Syriër belet, dat men uit zijn hand niet genomen heeft, wat hij gebracht had; maar *zo* *waarachtig* *als* de HEERE leeft, ik zal hem nalopen, en zal wat van hem nemen!", "21": "Zo volgde Gehazi Naäman achterna. En toen Naäman zag, dat hij hem naliep, viel hij van den wagen af, hem tegemoet, en hij zeide: Is het wel?", "22": "En hij zeide: Het is wel; mijn heer heeft mij gezonden, om te zeggen: Zie, nu straks zijn tot mij twee jongelingen uit de zonen der profeten, van het gebergte van Efraïm gekomen; geef hun toch een talent zilvers en twee wisselklederen.", "23": "En Naäman zeide: Belieft het u, neem twee talenten. En hij hield aan bij hem, en bond twee talenten zilvers in twee buidels, met twee wisselklederen, en hij leide ze op twee van zijn jongens, die ze voor zijn aangezicht droegen.", "24": "Als hij nu op de hoogte kwam, nam hij ze van hun hand, en bestelde ze in een huis; en hij liet de mannen gaan, en zij togen heen.", "25": "Daarna kwam hij in, en stond voor zijn heer. En Elisa zeide tot hem: Van waar, Gehazi? En hij zeide: Uw knecht is noch herwaarts noch derwaarts gegaan.", "26": "Maar hij zeide tot hem: Ging niet mijn hart mede, als die man zich omkeerde van op zijn wagen u tegemoet? Was het tijd, om dat zilver te nemen, en om klederen te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?", "27": "Daarom zal u de melaatsheid van Naäman aankleven, en uw zaad in eeuwigheid! Toen ging hij uit van voor zijn aangezicht, melaats, *wit* als de sneeuw."}, "KJV": {"1": "Now Naaman, captain of the host of the king of Syria, was a great man with his master, and honourable, because by him the LORD had given deliverance unto Syria: he was also a mighty man in valour, but he was a leper.", "2": "And the Syrians had gone out by companies, and had brought away captive out of the land of Israel a little maid; and she waited on Naaman's wife.", "3": "And she said unto her mistress, Would God my lord were with the prophet that is in Samaria! for he would recover him of his leprosy.", "4": "And one went in, and told his lord, saying, Thus and thus said the maid that is of the land of Israel.", "5": "And the king of Syria said, Go to, go, and I will send a letter unto the king of Israel. And he departed, and took with him ten talents of silver, and six thousand pieces of gold, and ten changes of raiment.", "6": "And he brought the letter to the king of Israel, saying, Now when this letter is come unto thee, behold, I have therewith sent Naaman my servant to thee, that thou mayest recover him of his leprosy.", "7": "And it came to pass, when the king of Israel had read the letter, that he rent his clothes, and said, Am I God, to kill and to make alive, that this man doth send unto me to recover a man of his leprosy? wherefore consider, I pray you, and see how he seeketh a quarrel against me.", "8": "And it was so, when Elisha the man of God had heard that the king of Israel had rent his clothes, that he sent to the king, saying, Wherefore hast thou rent thy clothes? let him come now to me, and he shall know that there is a prophet in Israel.", "9": "So Naaman came with his horses and with his chariot, and stood at the door of the house of Elisha.", "10": "And Elisha sent a messenger unto him, saying, Go and wash in Jordan seven times, and thy flesh shall come again to thee, and thou shalt be clean.", "11": "But Naaman was wroth, and went away, and said, Behold, I thought, He will surely come out to me, and stand, and call on the name of the LORD his God, and strike his hand over the place, and recover the leper.", "12": "Are not Abana and Pharpar, rivers of Damascus, better than all the waters of Israel? may I not wash in them, and be clean? So he turned and went away in a rage.", "13": "And his servants came near, and spake unto him, and said, My father, if the prophet had bid thee do some great thing, wouldest thou not have done it? how much rather then, when he saith to thee, Wash, and be clean?", "14": "Then went he down, and dipped himself seven times in Jordan, according to the saying of the man of God: and his flesh came again like unto the flesh of a little child, and he was clean.", "15": "And he returned to the man of God, he and all his company, and came, and stood before him: and he said, Behold, now I know that there is no God in all the earth, but in Israel: now therefore, I pray thee, take a blessing of thy servant.", "16": "But he said, As the LORD liveth, before whom I stand, I will receive none. And he urged him to take it; but he refused.", "17": "And Naaman said, Shall there not then, I pray thee, be given to thy servant two mules' burden of earth? for thy servant will henceforth offer neither burnt offering nor sacrifice unto other gods, but unto the LORD.", "18": "In this thing the LORD pardon thy servant, that when my master goeth into the house of Rimmon to worship there, and he leaneth on my hand, and I bow myself in the house of Rimmon: when I bow down myself in the house of Rimmon, the LORD pardon thy servant in this thing.", "19": "And he said unto him, Go in peace. So he departed from him a little way.", "20": "But Gehazi, the servant of Elisha the man of God, said, Behold, my master hath spared Naaman this Syrian, in not receiving at his hands that which he brought: but, as the LORD liveth, I will run after him, and take somewhat of him.", "21": "So Gehazi followed after Naaman. And when Naaman saw him running after him, he lighted down from the chariot to meet him, and said, Is all well?", "22": "And he said, All is well. My master hath sent me, saying, Behold, even now there be come to me from mount Ephraim two young men of the sons of the prophets: give them, I pray thee, a talent of silver, and two changes of garments.", "23": "And Naaman said, Be content, take two talents. And he urged him, and bound two talents of silver in two bags, with two changes of garments, and laid them upon two of his servants; and they bare them before him.", "24": "And when he came to the tower, he took them from their hand, and bestowed them in the house: and he let the men go, and they departed.", "25": "But he went in, and stood before his master. And Elisha said unto him, Whence comest thou, Gehazi? And he said, Thy servant went no whither.", "26": "And he said unto him, Went not mine heart with thee, when the man turned again from his chariot to meet thee? Is it a time to receive money, and to receive garments, and oliveyards, and vineyards, and sheep, and oxen, and mens torrey/a/?hl=2Kgs.5.27#i216", "refs": [{"disp": "2 Kon 5:27", "href": "../../2-koningen/5/#v27", "ref": "2 Kon 5:27", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Judgments", "href": "../../torrey/j/#t-judgments", "kinderen": [{"label": "Upon Individuals - Exemplified", "href": "../../torrey/j/?hl=2Kgs.5.27#i10770", "refs": [], "kinderen": [{"label": "Gehazi", "href": "../../torrey/j/?hl=2Kgs.5.27#i10780", "refs": [{"disp": "2 Kon 5:27", "href": "../../2-koningen/5/#v27", "ref": "2 Kon 5:27", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Leprosy", "href": "../../torrey/l/#t-leprosy", "kinderen": [{"label": "Often hereditary", "href": "../../torrey/l/?hl=2Kgs.5.27#i11432", "refs": [{"disp": "2 Sam 3:29", "href": "../../2-samuel/3/#v29", "ref": "2 Sam 3:29", "svLabel": null}, {"disp": "2 Kon 5:27", "href": "../../2-koningen/5/#v27", "ref": "2 Kon 5:27", "svLabel": null}], "kinderen": []}, {"label": "Turned the skin white", "href": "../../torrey/l/?hl=2Kgs.5.27#i11440", "refs": [{"disp": "Ex 4:6", "href": "../../exodus/4/#v6", "ref": "Ex 4:6", "svLabel": null}, {"disp": "2 Kon 5:27", "href": "../../2-koningen/5/#v27", "ref": "2 Kon 5:27", "svLabel": null}], "kinderen": []}]}, {"topic": "Miracles Wrought Through Servants Of God", "href": "../../torrey/m/#t-miracles-wrought-through-servants-of-god", "kinderen": [{"label": "Elisha", "href": "../../torrey/m/?hl=2Kgs.5.27#i13137", "refs": [], "kinderen": [{"label": "Gehazi struck with leprosy", "href": "../../torrey/m/?hl=2Kgs.5.27#i13144", "refs": [{"disp": "2 Kon 5:27", "href": "../../2-koningen/5/#v27", "ref": "2 Kon 5:27", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Richt 14:12": "Simson dan zei tegen hen: Ik zal u nu een raadsel te raden geven; als u het mij in de zeven dagen van deze bruiloft goed kunt verklaren en uitvinden, dan zal ik u dertig stel linnen kleren geven, en dertig stellen (extra) kleren.", "Matt 11:3-5": "En zei tegen Hem: Bent U Degene, Die komen zou, of verwachten wij een ander? En Jezus antwoordde en zei tegen hen: Ga heen en vertel Johannes weer wat u hoort en ziet: De blinden worden ziende, en de kreupelen wandelen; de melaatsen worden gereinigd, en de doven horen; de doden worden opgewekt, en de armen wordt het Evangelie verkondigd.", "Matt 8:2": "En zie, een melaatse kwam en aanbad Hem, en zei: Heere, als U wilt, kunt U mij reinigen.", "Luk 14:18-20": "En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd. En een ander zei: Ik heb vijf span ossen gekocht, en ik ga erheen om ze te proberen; ik vraag u, houd mij voor verontschuldigd. En weer een ander zei: Ik ben getrouwd, en daarom kan ik niet komen.", "Gen 3:9": "En de HEERE God riep Adam, en zei tegen hem: Waar bent u?", "Ezech 11:5": "Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.", "Jona 1:1": "Het woord van de HEERE gebeurde tot Jona, de zoon van Amitthai, en Hij zei:", "Num 23:5": "Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "Jes 5:5": "Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.", "2 Kon 5:1-19": "Naäman nu, de legeraanvoerder van de koning van Syrië, was een groot man voor het aangezicht van zijn heer, en van hoog aanzien; want door hem had de HEERE de Syriërs verlossing gegeven; zo was deze man een strijdbaar held, doch melaats. En er waren benden uit Syrië getrokken, en hadden een klein meisje uit het land van Israël gevangen meegenomen, die in dienst van de vrouw van Naäman was. Deze zei tegen haar meesteres: Och, was mijn heer maar bij de profeet die in Samaria is, dan zou hij hem van zijn melaatsheid verlossen.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "1 Kor 1:22": "Omdat de Joden een teken begeren, en de Grieken wijsheid zoeken;", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Joh 6:70": "Jezus antwoordde hun: Heb Ik u niet twaalf uitgekozen? En één van u is een duivel.", "Num 16:28": "Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.", "Rom 1:20": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Ex 4:1": "Toen antwoordde Mozes, en zei: Maar zie, zij zullen mij niet geloven, en niet naar mijn stem luisteren; want zij zullen zeggen: De HEERE is u niet verschenen!", "Joz 4:24": "Opdat alle volken van de aarde de hand van de HEERE zouden kennen, dat die sterk is; opdat u de HEERE, uw God, vreest, alle dagen.", "1 Kon 13:7": "En de koning zei tegen de man van God: Kom met mij mee naar huis, en sterk u, en ik zal u een geschenk geven.", "1 Kor 12:7-11": "Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "Gen 35:16": "En zij reisden verder van Bethel; en er was nog een kleine afstand om tot Efrath te komen; en Rachel baarde, en zij had het zwaar bij haar bevalling.", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Num 3:48-51": "En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten. Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten. Van de eerstgeborenen van de kinderen van Israël nam hij dat geld, duizend driehonderdvijfenzestig sikkels, naar de sikkel van het heiligdom.", "Lev 1:1": "En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:", "Joz 4:23": "Want de HEERE, uw God, heeft de wateren van de Jordaan voor uw ogen doen uitdrogen, totdat u erdoorheen gegaan was; zoals de HEERE, uw God, aan de Schelfzee gedaan heeft, die Hij voor ons aangezicht heeft doen uitdrogen, totdat wij daardoor gegaan waren;", "Ex 11:3": "En de HEERE gaf het volk genade in de ogen van de Egyptenaren; ook was de man Mozes zeer groot in Egypteland voor de ogen van Farao's knechten, en voor de ogen van het volk.)", "Jer 33:1": "Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:", "Joz 9:24": "Zij dan antwoordden Jozua, en zeiden: Omdat aan uw knechten zeker verteld was, dat de HEERE, uw God, Zijn knecht Mozes geboden heeft dat Hij u dit hele land zou geven, en al de inwoners van het land voor uw ogen zou uitroeien, daarom vreesden wij zeer voor ons leven vanwege u; daarom hebben wij deze zaak gedaan.", "Joz 7:21": "Want ik zag onder de buit een mooi, sierlijk Babylonisch overkleed, en tweehonderd sikkelen van het zilver, en een gouden staaf, met een gewicht van vijftig sikkelen; en ik kreeg er lust naar, en ik nam ze; en zie, ze zijn verborgen in de aarde, midden in mijn tent, en het zilver daaronder.", "Ezra 9:3": "Toen ik deze zaak hoorde, scheurde ik mijn kleed en mijn mantel; en ik trok het haar van mijn hoofd en van mijn baard uit, en zat verbaasd neer.", "Ex 21:11": "En als hij haar deze drie dingen niet doet, zal zij om niet uitgaan, zonder geld.", "Gen 11:3": "En zij zeiden tegen elkaar: Kom aan, laten we tichels strijken en ze goed doorbranden! En de tichel was voor hen in plaats van steen, en het lijm was voor hen in plaats van leem.", "Mark 14:11": "En zij, die dit hoorden, waren verblijd, en beloofden hem geld te geven; en hij zocht hoe hij Hem op een geschikt moment kon overleveren.", "Hand 26:29": "En Paulus zei: Ik zou van God wensen dat, zowel bijna als geheel, niet alleen u, maar ook allen die mij vandaag horen, zulke mensen werden zoals ik ben, uitgezonderd deze boeien.", "Lev 27:15": "En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.", "Matt 8:3": "En Jezus, de hand uitstrekkend, raakte hem aan, en zei: Ik wil, word gereinigd! En meteen werd hij van zijn melaatsheid gereinigd.", "2 Kon 12:10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Luk 19:23": "Waarom hebt u dan mijn geld niet bij de bank gebracht, zodat ik het bij mijn komst met rente had kunnen opeisen?", "Hand 5:9": "En Petrus zei tot haar: Wat is het, dat u onderling hebt afgesproken om de Geest van de Heere te verzoeken? Zie, de voeten van hen die uw man begraven hebben, zijn voor de deur, en zullen u uitdragen.", "Gen 41:43": "En hij liet hem rijden op de tweede wagen die hij had; en zij riepen voor hem uit: Kniel! Zo stelde hij hem over heel Egypteland.", "1 Sam 10:7": "En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Num 14:6": "En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, die bij hen waren die dat land verspied hadden, scheurden hun kleren.", "Matt 8:8": "En de hoofdman over honderd antwoordde en zei: Heere, ik ben het niet waard dat U onder mijn dak zou komen; maar spreek alleen een woord, en mijn knecht zal genezen worden.", "Gen 14:22": "Doch Abram zei tegen de koning van Sodom: Ik heb mijn hand opgeheven tot de HEERE, de allerhoogste God, Die hemel en aarde bezit;", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Hand 14:14": "Maar toen de apostelen Barnabas en Paulus dit hoorden, scheurden zij hun kleren, en sprongen onder de menigte, en riepen:", "Joz 7:12": "Daarom zullen de kinderen van Israël niet kunnen standhouden voor het aangezicht van hun vijanden; zij zullen de rug keren voor het aangezicht van hun vijanden; want zij zijn in de ban. Ik zal voortaan niet meer met u zijn, tenzij u de ban uit uw midden verdelgt.", "1 Kon 20:23": "Want de knechten van de koning van Syrië hadden tegen hem gezegd: Hun goden zijn berggoden, daarom zijn zij sterker geweest dan wij; maar zeker, laat ons tegen hen op het effen veld strijden, dan zullen wij sterker zijn dan zij!", "1 Kon 10:25": "En zij brachten ieder zijn geschenk, zilveren vaten, en gouden vaten, en klederen, en wapenrusting, en specerijen, paarden en muilezels, elk jaar opnieuw.", "Hab 2:9": "Wee hem die met kwade hebzucht rijkdom vergaart voor zijn huis, om zijn nest in de hoogte te zetten, om bevrijd te zijn uit de hand van het kwaad.", "1 Kon 21:16": "En het gebeurde, toen Achab hoorde dat Naboth dood was, dat Achab opstond om naar de wijngaard van Naboth, de Jizreëliet, af te gaan, om die in bezit te nemen.", "1 Sam 3:20": "En heel Israël, van Dan tot Berseba toe, wist dat Samuël bevestigd was tot een profeet van de HEERE.", "Ezech 43:5": "En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "Deut 11:1-8": "Daarom zult u de HEERE, uw God, liefhebben, en u zult altijd onderhouden Zijn bevel, en Zijn inzettingen, en Zijn rechten, en Zijn geboden. En u zult heden weten, dat ik niet spreek met uw kinderen, die het niet weten, en de vermaning van de HEERE, uw God, niet gezien hebben. Zijn grootheid, Zijn sterke hand en Zijn uitgestrekte arm; Daartoe Zijn tekenen en Zijn daden, die Hij in het midden van Egypte gedaan heeft, aan farao, de koning van Egypte, en aan zijn hele land;", "2 Kon 5:20-24": "Gehazi nu, de knecht van Elisa, de man van God, zei: Zie, mijn heer heeft Naäman, deze Syriër, ontzien, doordat hij niet uit zijn hand heeft aangenomen wat hij gebracht had; maar zo waarachtig als de HEERE leeft, ik zal hem achterna lopen, en zal iets van hem aannemen! Zo achtervolgde Gehazi Naäman. En toen Naäman zag dat hij hem achterna liep, sprong hij van de wagen af, hem tegemoet, en zei: Is alles goed? En hij zei: Het is goed; mijn heer heeft mij gestuurd, om te zeggen: Zie, zojuist zijn er twee jonge mannen uit de zonen van de profeten, van het gebergte van Efraïm, bij mij gekomen; geef hun toch een talent van het zilver en twee stellen kleren.", "Mal 2:9": "Daarom heb Ik u ook verachtelijk en onwaard gemaakt voor heel het volk, omdat u Mijn wegen niet houdt, maar partijdig bent in de wet.", "Num 12:13": "Mozes riep dan tot de HEERE en zei: O God! Genees haar toch!", "Lev 16:14": "En hij zal van het bloed van de stier nemen, en zal met zijn vinger op het verzoendeksel aan de oostkant sprenkelen; en voor het verzoendeksel zal hij zevenmaal met zijn vinger van dat bloed sprenkelen.", "Richt 10:6": "Toen gingen de Israëlieten opnieuw doen wat slecht was in de ogen van de HEERE: zij dienden de Baäls en de Astartes, de goden van Syrië, de goden van Sidon, de goden van Moab, de goden van de Ammonieten, alsook de goden van de Filistijnen; zij verlieten de HEERE en dienden Hem niet meer.", "Joz 6:13-16": "En de zeven priesters, die de zeven ramsbazuinen droegen voor de ark van de HEERE, gingen voort, en bliezen op de bazuinen; en de toegerusten gingen voor hun aangezichten, en de achtertocht volgde de ark van de HEERE na, terwijl men ging en blies op de bazuinen. Zo gingen zij eenmaal rondom de stad op de tweede dag; en zij keerden weer terug in het leger. Zo deden zij zes dagen lang. En het gebeurde op de zevende dag, dat zij zich vroeg opmaakten, bij het opgaan van de dageraad, en zij gingen rondom de stad, op dezelfde wijze, zevenmaal; alleen op die dag gingen zij zevenmaal rondom de stad.", "Jes 36:22": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, naar Hizkia met gescheurde kleren; en zij vertelden hem de woorden van Rabsake.", "Ps 10:4": "De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "Num 12:6-8": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken. Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is. Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?", "Job 33:25": "Zijn vlees zal frisser worden dan het was in de jeugd; hij zal tot de dagen van zijn jonkheid wederkeren.", "2 Tess 3:9": "Niet dat wij de macht niet hebben, maar opdat wij onszelf u zouden geven tot een voorbeeld, om ons na te volgen.", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Ps 51:4": "Was mij goed van mijn ongerechtigheid, en reinig mij van mijn zonde.", "Gen 44:13": "Toen scheurden zij hun kleren, en ieder man laadde zijn ezel weer op, en zij keerden terug naar de stad.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "Hand 20:33-35": "Ik heb niemands zilver, of goud, of kleding begeerd. En u weet zelf, dat deze handen gediend hebben voor mijn behoeften, en voor die van hen die met mij waren. Ik heb u in alles getoond, dat men, zo arbeidend, de zwakken moet opnemen, en zich de woorden van de Heere Jezus herinneren, dat Hij gezegd heeft: Het is zaliger te geven dan te ontvangen.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Joël 3:6": "En u hebt de kinderen van Juda en de kinderen van Jeruzalem verkocht aan de kinderen van de Grieken, om hen ver van hun grondgebied te brengen.", "2 Kon 6:32": "(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?", "Deut 5:4-6": "Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Jer 34:1": "Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:", "Ezech 3:14": "Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.", "Num 22:7": "Toen gingen de oudsten van Moab en de oudsten van Midian, met het loon voor de waarzeggerij in hun hand; zo kwamen zij bij Bileam, en spraken tot hem de woorden van Balak.", "Num 19:19": "En de reine zal de onreine op de derde dag, en op de zevende dag besprenkelen; en op de zevende dag zal hij hem ontzondigen; en hij zal zijn kleren wassen, en zichzelf met water baden, en op de avond rein zijn.", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "Joh 2:11": "Dit begin van de tekenen heeft Jezus gedaan te Kana in Galilea, en heeft Zijn heerlijkheid geopenbaard; en Zijn discipelen geloofden in Hem.", "Dan 2:11": "Want de zaak die de koning vraagt is te zwaar, en er is niemand anders die dat voor de koning bekend kan maken, dan de goden, wier woning niet bij het vlees is.", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "Luk 11:54": "Terwijl zij Hem opwachtten en probeerden iets uit Zijn mond op te vangen, om Hem te kunnen beschuldigen.", "Jer 7:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Dan 6:21-28": "Toen hij nu bij de kuil gekomen was, riep hij naar Daniël met droevige stem; de koning antwoordde en zei tegen Daniël: O Daniël, dienaar van de levende God! heeft ook uw God, Die u voortdurend eert, u uit de macht van de leeuwen kunnen verlossen? Toen sprak Daniël tegen de koning: O koning, leef voor eeuwig! Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "2 Kon 6:30": "En het gebeurde, toen de koning de woorden van deze vrouw gehoord had, dat hij zijn kleren scheurde, terwijl hij over de muur voortging; en het volk zag dat er, zie, een zak van binnen over zijn vlees was.", "2 Kon 9:17-22": "De wachter nu stond op de toren te Jizreël, en zag de troep van Jehu, toen hij aankwam, en zei: Ik zie een troep. Toen zei Joram: Neem een ruiter, en stuur die hun tegemoet, en laat hij zeggen: Is het vrede? En de ruiter te paard ging hem tegemoet, en zei: Zo zegt de koning: Is het vrede? En Jehu zei: Wat hebt u met de vrede te maken? Kom achter mij. En de wachter meldde het, en zei: De bode is bij hen gekomen, maar hij komt niet terug. Toen stuurde hij een tweede ruiter te paard; en toen deze bij hen gekomen was, zei hij: Zo zegt de koning: Is het vrede? En Jehu zei: Wat hebt u met de vrede te maken? Kom achter mij.", "Lev 13:44-46": "Is die man melaats, hij is onrein; de priester zal hem helemaal onrein verklaren, zijn plaag is op zijn hoofd. Verder zullen de kleren van de melaatse, in wie die plaag is, gescheurd zijn, en zijn hoofd zal onbedekt zijn, en hij zal zijn bovenlip bedekken; daarbij zal hij roepen: Onrein, onrein! Al de dagen waarin deze plaag in hem zal zijn, zal hij onrein zijn; onrein is hij, hij zal alleen wonen; buiten het leger zal zijn woning zijn.", "1 Kor 10:33": "Zoals ik ook in alles allen probeer te behagen, niet mijn eigen voordeel zoekend, maar dat van velen, opdat zij behouden worden.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "1 Sam 25:35": "Toen nam David uit haar hand wat zij hem gebracht had; en hij zei tegen haar: Trek in vrede op naar uw huis; zie, ik heb naar uw stem geluisterd, en heb u aanvaard.", "Gen 47:14-18": "Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao. Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op. En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.", "Hand 8:27": "En hij stond op en ging heen; en zie, een Moorman, een kamerling, een machtige heer van Candacé, de koningin van de Moren, die over al haar schat ging, was gekomen om te aanbidden in Jeruzalem;", "1 Kon 21:2": "Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven.", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "Mal 2:3": "Zie, Ik zal het zaad voor u verderven; en Ik zal drek op uw gezichten strooien, de drek van uw feesten, zodat men u daarmee wegnemen zal.", "Ezech 1:20": "Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.", "Joh 9:3": "Jezus antwoordde: Deze man heeft niet gezondigd, en zijn ouders ook niet, maar dit is gebeurd, opdat de werken van God in hem openbaar zouden worden.", "Matt 28:15": "En zij namen het geld, en deden zoals hun geleerd was. En dit verhaal is onder de Joden verspreid geraakt tot op deze huidige dag.", "Spr 25:11": "Een woord, op zijn tijd gesproken, is als gouden appels in zilveren gebeelde schalen.", "2 Kon 6:21": "En de koning van Israël zei tegen Elisa, toen hij hen zag: Zal ik hen doden? Zal ik hen doden, mijn vader?", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Est 6:8": "laat men het koninklijke kleed brengen dat de koning gewoonlijk draagt, en het paard waarop de koning gewoonlijk rijdt, en laat de koninklijke kroon op zijn hoofd gezet worden.", "Ex 22:7": "Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven.", "Dan 1:17": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "2 Tess 3:8": "En wij hebben geen brood bij iemand gegeten voor niets, maar in arbeid en moeite, nacht en dag werkend, opdat wij niemand van u lastig zouden zijn;", "2 Kor 12:14": "Zie, ik ben voor de derde keer gereed om naar u toe te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen.", "Ex 8:8-10": "En Farao riep Mozes en Aäron, en zei: Bid vurig tot de HEERE, dat Hij de kikkers van mij en van mijn volk wegneemt; dan zal ik het volk laten trekken, opdat zij de HEERE offeren. Doch Mozes zei tegen Farao: Heb de eer boven mij! Tegen wanneer zal ik voor u, en voor uw knechten, en voor uw volk, vurig bidden, om deze kikkers van u en van uw huizen te verdelgen, zodat zij alleen in de rivier overblijven? Hij dan zei: Tegen morgen. En hij zei: Het zij naar uw woord, opdat u weet dat er niemand is zoals de HEERE, onze God.", "Richt 5:19": "De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan.", "2 Kon 3:14": "En Elisa zei: Zo waarachtig als de HEERE van de heerscharen leeft, voor Wiens aangezicht ik sta: als ik niet het aangezicht van Josafat, de koning van Juda, in aanmerking nam, zou ik u niet aanschouwen, noch u aanzien!", "Joz 7:25": "En Jozua zei: Hoe hebt u ons in het ongeluk gestort? De HEERE zal u op deze dag in het ongeluk storten! En heel Israël stenigde hem met stenen, en zij verbrandden hen met vuur, en overwierpen hen met stenen.", "Ex 4:2-9": "En de HEERE zei tegen hem: Wat is er in uw hand? En hij zei: Een staf. En Hij zei: Werp hem op de grond. En hij wierp hem op de grond! Toen werd hij tot een slang; en Mozes vluchtte voor haar. Toen zei de HEERE tegen Mozes: Strek uw hand uit, en grijp haar bij haar staart! Toen strekte hij zijn hand uit, en greep haar, en zij werd tot een staf in zijn hand.", "Richt 14:19": "Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "2 Kon 5:8-14": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is. Zo kwam Naäman met zijn paarden en met zijn wagen, en stond voor de deur van het huis van Elisa. Toen stuurde Elisa een bode naar hem, en zei: Ga heen en was u zeven keer in de Jordaan, en uw vlees zal weer gezond worden, en u zult rein zijn.", "2 Kon 18:37": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, tot Hizkia, met gescheurde kleren; en zij maakten hem de woorden van Rabsake bekend.", "Hand 7:16": "En zij werden overgebracht naar Sichem, en gelegd in het graf, dat Abraham gekocht had voor een som geld, van de zonen van Hemor, de vader van Sichem.", "Ezech 37:1": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen.", "Spr 26:16": "De luiaard is wijzer in zijn eigen ogen, dan zeven die met verstand antwoorden.", "Zach 5:3": "Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden.", "Ps 106:9-12": "En Hij bestrafte de Schelfzee, zodat zij verdroogde, en Hij deed hen wandelen door de afgronden, als door een woestijn. En Hij verloste hen uit de hand van de hater, en Hij bevrijdde hen van de hand van de vijand. En de wateren overdekten hun tegenstanders; niet één van hen bleef over.", "Deut 34:9-11": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had. En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht, In al de tekenen en de wonderen, waartoe de HEERE hem gezonden had, om die te doen in het land Egypte aan farao, en aan al zijn knechten, en aan heel zijn land;", "2 Sam 10:11": "En hij zei: Als de Syriërs mij te sterk zullen zijn, zult u mij komen verlossen; en als de kinderen Ammons u te sterk zullen zijn, zal ik komen om u te verlossen.", "Gen 14:23": "dat ik van een draad tot een schoenriem toe, ja, dat ik van alles wat het uwe is, niets zal nemen! Opdat u niet zegt: Ik heb Abram rijk gemaakt!", "Ef 5:27": "opdat Hij haar Zichzelf heerlijk zou voorstellen, een Gemeente die geen vlek of rimpel heeft, of iets dergelijks, maar die heilig en onberispelijk zou zijn.", "2 Kon 15:5": "En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.", "Ezech 3:10-12": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren. En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen. Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "Klaagl 5:13": "Zij hebben de jongemannen weggenomen om te malen, en de jongens struikelden onder het hout.", "Lev 14:51": "Dan zal hij dat cederhout, en die hysop, en het scharlaken, en de levende vogel nemen, en zal die in het bloed van de geslachte vogel en in het levende water dopen; en hij zal dat huis zevenmaal besprengen.", "1 Kon 21:6": "En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven.", "Jes 55:8": "Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE.", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Luk 17:12-14": "En toen Hij in een zeker dorp kwam, ontmoetten Hem tien melaatse mannen, die van verre bleven staan; en zij verhieven hun stem en zeiden: Jezus, Meester, ontferm U over ons! En toen Hij hen zag, zei Hij tegen hen: Ga heen en laat uzelf zien aan de priesters. En het gebeurde, terwijl zij heengingen, dat zij gereinigd werden.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "2 Kron 30:18": "Want een menigte van het volk, velen uit Efraïm en Manasse, Issaschar en Zebulon, hadden zich niet gereinigd, maar aten het pascha, niet zoals geschreven is. Doch Hizkia bad voor hen, en zei: De HEERE, die goed is, doe verzoening voor ieder,", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "Matt 25:18": "Maar hij die het ene ontvangen had, ging weg en groef in de aarde, en verborg het geld van zijn heer.", "2 Kon 5:6-8": "En hij bracht de brief naar de koning van Israël, en zei: Zo gauw deze brief bij u is gekomen, zie, ik heb mijn dienaar Naäman naar u gestuurd, opdat u hem verlost van zijn melaatsheid. En het gebeurde, toen de koning van Israël de brief gelezen had, dat hij zijn kleren scheurde, en zei: Ben ik dan God, om te doden en levend te maken, dat deze man naar mij toe stuurt, om een man van zijn melaatsheid te verlossen? Want inderdaad, let toch op en zie, dat hij een aanleiding tegen mij zoekt. Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "Ex 19:3": "En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen:", "2 Kon 3:12": "En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.", "1 Kor 1:27": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen;", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Joh 6:66-69": "Van toen af gingen velen van Zijn discipelen terug, en liepen niet meer met Hem mee. Jezus zei dan tegen de twaalf: Wilt u ook niet weggaan? Simon Petrus antwoordde Hem: Heere, naar wie zouden wij heengaan? U hebt de woorden van het eeuwige leven.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Hand 5:3": "En Petrus zei: Ananias, waarom heeft de satan uw hart vervuld, dat u de Heilige Geest zou liegen, en onttrekken van de prijs van het land?", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "2 Kon 2:15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "Ex 26:30": "Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.", "Matt 28:12": "En zij kwamen samen met de oudsten, en namen samen een besluit, en gaven de soldaten veel geld,", "Matt 27:3-5": "Toen Judas, die Hem verraden had, zag dat Hij veroordeeld was, kreeg hij berouw en heeft hij de dertig zilverstukken aan de overpriesters en de oudsten teruggebracht, en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien. En toen hij de zilverstukken in de tempel geworpen had, vertrok hij; en hij ging heen en verhing zichzelf.", "Ex 12:44": "Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.", "2 Kon 6:23": "En hij bereidde voor hen een grote maaltijd, dat zij aten en dronken; daarna liet hij hen gaan, en zij trokken naar hun heer. Zo kwamen de rooftroepen van de Syriërs niet meer in het land van Israël.", "2 Kon 4:8": "Het gebeurde ook op een dag, toen Elisa naar Sunem doortrok, dat daar een voorname vrouw was, die hem drong om brood te eten. Verder gebeurde het, zo dikwijls hij doortrok, dat hij daar inwijkt om brood te eten.", "1 Kor 9:11": "Als wij u het geestelijke gezaaid hebben, is het dan een grote zaak, als wij het uwe, dat lichamelijk is, maaien?", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "1 Sam 9:15-20": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Lev 27:18": "Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.", "Ex 14:31": "Ook zag Israël de grote hand die de HEERE aan de Egyptenaren bewezen had; en het volk vreesde de HEERE, en geloofde in de HEERE, en in Mozes, Zijn dienaar.", "Joh 5:36": "Maar Ik heb een getuigenis, groter dan dat van Johannes; want de werken die de Vader Mij gegeven heeft om te volbrengen, deze werken die Ik doe, getuigen van Mij dat de Vader Mij gezonden heeft.", "2 Sam 12:1": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.", "Num 22:18": "Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "2 Kon 7:9-11": "Toen zeiden zij tegen elkaar: Wij doen niet goed; deze dag is een dag van goed nieuws, en wij zwijgen stil. Als wij wachten tot de lichte morgen, zal ons onrecht overkomen; daarom nu, kom, laat ons gaan, en dit aan het huis van de koning melden. Zo kwamen zij, en riepen naar de poortwachter van de stad, en meldden het hun, en zeiden: Wij zijn bij het leger van de Syriërs gekomen, en zie, er was daar niemand, ook geen mensenstem; maar wel paarden vastgebonden, en ezels vastgebonden, en de tenten, precies zoals ze waren. En hij riep de poortwachters; en zij deden de boodschap binnen in het huis van de koning.", "Gen 4:9": "En de HEERE zei tegen Kaïn: Waar is Abel, uw broeder? En hij zei: Ik weet het niet; ben ik de hoeder van mijn broeder?", "1 Sam 19:24": "En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?", "Jer 38:7-10": "Toen Ebed-Melech, de Moorman, een van de kamerlingen die toen in het huis van de koning was, hoorde dat zij Jeremia in de kuil gedaan hadden (de koning zat toen in de poort van Benjamin); Zo ging Ebed-Melech het huis van de koning uit, en hij sprak tot de koning: Mijn heer koning! Deze mannen hebben slecht gehandeld in alles wat zij gedaan hebben aan de profeet Jeremia, die zij in de kuil geworpen hebben; want hij zou daar ter plaatse gestorven zijn van de honger, omdat er geen brood meer in de stad is.", "Jer 16:19-21": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed. Zal een mens zich goden maken? Zij zijn toch geen goden. Daarom, zie, Ik zal hun bekendmaken op dit moment; Ik zal hun Mijn hand en Mijn macht bekendmaken; en zij zullen weten, dat Mijn Naam is HEERE.", "Joz 3:15-17": "En toen zij die de ark droegen, tot aan de Jordaan gekomen waren, en de voeten van de priesters die de ark droegen, ondergedompeld werden in de rand van het water (de Jordaan was namelijk vol tot al haar oevers, al de dagen van de oogst); Zo bleven de wateren die van boven afkwamen staan; zij rezen op als één hoop, heel ver van de stad Adam af, die naast Sarthan ligt; en die naar de zee van het vlakke veld liepen, namelijk de Zoutzee, liepen weg, zij werden afgesneden. Toen trok het volk over, tegenover Jericho. Maar de priesters, die de ark van het verbond van de HEERE droegen, stonden onwrikbaar op het droge, in het midden van de Jordaan; en heel Israël ging over op het droge, totdat heel het volk klaar was met de doortocht door de Jordaan.", "Joh 4:48": "Jezus zei toen tegen hem: Als u geen tekenen en wonderen ziet, zult u niet geloven.", "Luk 7:7": "Daarom heb ik ook mijzelf niet waard geacht om naar U toe te komen; maar spreek slechts een woord, en mijn knecht zal genezen worden.", "Gen 43:15": "En die mannen namen dat geschenk, en namen dubbel geld in hun hand, en Benjamin; en zij maakten zich op, en trokken af naar Egypte, en zij stonden voor Jozefs gezicht.", "Gen 31:15": "Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.", "Ex 4:7": "En Hij zei: Steek uw hand opnieuw in uw boezem. En hij stak zijn hand opnieuw in zijn boezem; daarna trok hij ze uit zijn boezem, en zie, zij was weer als zijn andere vlees.", "Mark 16:10": "Zij ging heen, en vertelde het aan hen die met Hem geweest waren, die treurden en weenden.", "2 Kon 2:3": "Toen gingen de zonen van de profeten, die te Beth-el waren, naar Elisa toe, en zeiden tegen hem: Weet u dat de HEERE vandaag uw heer van boven uw hoofd wegnemen zal? En hij zei: Ik weet het ook wel, zwijgt u stil.", "Jer 24:4": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Joh 11:40-42": "Jezus zei tegen haar: Heb Ik u niet gezegd dat, als u gelooft, u de heerlijkheid van God zien zult? Zij namen dan de steen weg, waar de gestorvene lag. En Jezus hief de ogen omhoog, en zei: Vader, Ik dank U dat U Mij gehoord hebt. Maar Ik wist dat U Mij altijd hoort; maar vanwege de menigte die er omheen staat heb Ik dit gezegd, opdat zij geloven dat U Mij gezonden hebt.", "1 Sam 3:21": "En de HEERE ging door met verschijnen te Silo; want de HEERE openbaarde Zich aan Samuël te Silo, door het woord van de HEERE.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "1 Sam 10:6": "En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Est 9:4": "Want Mordechai was groot in het huis van de koning, en zijn faam ging uit door alle landschappen; want die man, Mordechai, werd steeds groter.", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "2 Kon 5:5-7": "Toen zei de koning van Syrië: Ga heen, kom, en ik zal een brief aan de koning van Israël sturen. En hij ging heen, en nam in zijn hand tien talenten van het zilver, en zesduizend sikkelen goud, en tien stellen kleren. En hij bracht de brief naar de koning van Israël, en zei: Zo gauw deze brief bij u is gekomen, zie, ik heb mijn dienaar Naäman naar u gestuurd, opdat u hem verlost van zijn melaatsheid. En het gebeurde, toen de koning van Israël de brief gelezen had, dat hij zijn kleren scheurde, en zei: Ben ik dan God, om te doden en levend te maken, dat deze man naar mij toe stuurt, om een man van zijn melaatsheid te verlossen? Want inderdaad, let toch op en zie, dat hij een aanleiding tegen mij zoekt.", "1 Sam 9:8": "En de knecht antwoordde Saul verder en zei: Zie, ik heb bij me het vierde deel van een zilveren sikkel; dat zal ik de man van God geven, opdat hij ons onze weg wijst.", "Jer 50:20": "In die dagen en op die tijd, spreekt de HEERE, zal de ongerechtigheid van Israël gezocht worden, maar zij zal er niet zijn, en de zonden van Juda, maar zullen niet gevonden worden; want Ik zal het vergeven aan hen die Ik zal doen overblijven.", "2 Kron 28:8": "En de kinderen van Israël voerden van hun broeders tweehonderdduizend gevangenen weg, vrouwen, zonen en dochters, en plunderden ook veel roof van hen; en zij brachten de roof naar Samaria.", "Gen 45:22": "Hij gaf hun allen, ieder een, stellen kleren; maar Benjamin gaf hij driehonderd zilverlingen, en vijf stellen kleren.", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "Amos 7:15": "Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.", "2 Kor 12:16-18": "Maar het zij zo, ik heb u niet bezwaard; maar omdat ik listig was, heb ik u met bedrog gevangen. Heb ik door iemand van hen die ik naar u toe gezonden heb, van u mijn voordeel gezocht? Ik heb Titus gevraagd, en de broeder meegezonden; heeft ook Titus van u zijn voordeel gezocht? Hebben wij niet in dezelfde geest gewandeld? Hebben wij niet in dezelfde voetstappen gewandeld?", "Lev 22:11": "Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten.", "1 Kor 5:3": "Want ik, hoewel met het lichaam afwezig, maar aanwezig met de geest, heb al besloten, alsof ik aanwezig was, over hem die dit zo gedaan heeft:", "Deut 21:10-14": "Wanneer u uittrekt ten strijde tegen uw vijanden, en de HEERE, uw God, hen in uw hand gegeven heeft, zodat u hun gevangenen gevankelijk wegvoert; En u onder de gevangenen een vrouw ziet die mooi is van uiterlijk, en u naar haar verlangt, zodat u haar tot vrouw wilt nemen; Dan zult u haar in uw huis brengen; en zij zal haar hoofd scheren en haar nagels knippen.", "Gen 3:12": "Toen zei Adam: De vrouw die U bij mij gegeven hebt, die heeft mij van die boom gegeven, en ik heb gegeten.", "Jer 36:24": "En zij schrokken niet, en scheurden hun kleren niet, de koning noch al zijn dienaren die al deze woorden gehoord hadden.", "Spr 25:12": "Een wijze bestraffer bij een luisterend oor, is een gouden oorsieraad, en een halssieraad van het fijnste goud.", "Dan 5:17": "Toen antwoordde Daniël, en zei voor de koning: Houd uw gaven voor uzelf, en geef uw beloningen aan een ander; ik zal toch het schrift voor de koning lezen, en de uitleg zal ik hem bekendmaken.", "Est 10:3": "Want de Jood Mordechai was de tweede bij de koning Ahasveros, en groot bij de Joden, en aangenaam bij de menigte van zijn broeders, zoekend naar het beste voor zijn volk, en sprekend voor het welzijn van al zijn nageslacht.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "Richt 2:7": "En het volk diende de HEERE al de dagen van Jozua, en al de dagen van de oudsten die lang geleefd hadden na Jozua; die al dat grote werk van de HEERE gezien hadden, dat Hij voor Israël gedaan had.", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "Num 24:16": "Die hoort de woorden van God, spreekt, en die de kennis van de allerhoogste weet; die het gezicht van de Almachtige ziet, die in verrukking valt, en wiens ogen geopend worden.", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Ex 35:31": "En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;", "Matt 8:21": "En een ander van Zijn discipelen zei tegen Hem: Heere, laat mij toe dat ik eerst heenga en mijn vader kan begraven.", "1 Kon 19:19-21": "Zo ging hij vandaar, en vond Elisa, de zoon van Safat; die was aan het ploegen met twaalf span runderen voor zich uit, en hij zelf was bij het twaalfde; en Elia ging naar hem toe, en wierp zijn mantel op hem. En hij liet de runderen achter, en liep Elia achterna, en zei: Laat mij toch mijn vader en mijn moeder kussen, daarna zal ik u volgen. En hij zei tegen hem: Ga, keer terug; want wat heb ik u gedaan? Zo keerde hij van achter hem terug, en nam een span runderen, en slachtte het, en met het gereedschap van de runderen kookte hij hun vlees, dat hij aan het volk gaf; en zij aten. Daarna stond hij op, en volgde Elia, en diende hem.", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Num 11:29": "Maar Mozes zei tegen hem: Bent u ijverzuchtig voor mij? Och, was al het volk van de HEERE maar profeten, zodat de HEERE Zijn Geest over hen zou geven!", "2 Kon 5:1-14": "Naäman nu, de legeraanvoerder van de koning van Syrië, was een groot man voor het aangezicht van zijn heer, en van hoog aanzien; want door hem had de HEERE de Syriërs verlossing gegeven; zo was deze man een strijdbaar held, doch melaats. En er waren benden uit Syrië getrokken, en hadden een klein meisje uit het land van Israël gevangen meegenomen, die in dienst van de vrouw van Naäman was. Deze zei tegen haar meesteres: Och, was mijn heer maar bij de profeet die in Samaria is, dan zou hij hem van zijn melaatsheid verlossen.", "1 Kor 4:15": "Want al had u tienduizend leermeesters in Christus, dan hebt u toch niet veel vaders; want in Christus Jezus heb ik u door het Evangelie voortgebracht.", "1 Sam 25:14-17": "Doch een van de jongemannen boodschapte het aan Abigaïl, de vrouw van Nabal, en zei: Zie, David heeft boden gezonden uit de woestijn om onze heer te zegenen; maar hij is tegen hen uitgevaren. Nochtans zijn zij ons zeer goede mannen geweest; en wij hebben geen smaad geleden, en wij hebben niets gemist, al de dagen dat wij met hen omgingen, toen wij op het veld waren. Zij zijn een muur om ons geweest, zowel bij nacht als bij dag, al de dagen dat wij bij hen geweest zijn, terwijl wij de schapen weidden.", "1 Kon 16:24": "En hij kocht de berg Samaria van Semer, voor twee talenten van het zilver, en bebouwde de berg; en noemde de naam van de stad die hij bouwde, naar de naam van Semer, de heer van de berg, Samaria.", "2 Kon 22:9": "Daarna kwam Safan, de schrijver, bij de koning, en bracht de koning verslag terug, en hij zei: Uw dienaren hebben het geld dat in het huis gevonden was bij elkaar gebracht, en hebben het gegeven in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE.", "Gen 17:13": "Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "Matt 26:15": "en zei: Wat wilt u mij geven, en ik zal Hem aan u overleveren? En zij hebben hem dertig zilveren munten toegezegd.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Ps 123:2": "Zie, zoals de ogen van de knechten zijn op de hand van hun heren, zoals de ogen van de dienstmaagd zijn op de hand van haar meesteres, zo zijn onze ogen op de HEERE, onze God, totdat Hij ons genadig is.", "2 Sam 13:31": "Toen stond de koning op, en scheurde zijn kleren, en ging op de grond liggen; en al zijn knechten stonden erbij met gescheurde kleren.", "Ex 9:29": "Toen zei Mozes tegen hem: Zodra ik de stad uitgegaan ben, zal ik mijn handen uitspreiden voor de HEERE; de donder zal ophouden, en de hagel zal niet meer zijn; zodat u weet dat de aarde van de HEERE is!", "Joz 3:10": "Verder zei Jozua: Hieraan zult u weten dat de levende God in uw midden is, en dat Hij helemaal voor uw aangezicht zal verdrijven de Kanaänieten, en de Hethieten, en de Hevieten, en de Ferezieten, en de Girgazieten, en de Amorieten en de Jebusieten.", "1 Kor 9:12": "Als anderen deze macht over u deelachtig zijn, waarom wij dan niet veel meer? Toch hebben wij deze macht niet gebruikt, maar wij verdragen alles, opdat wij geen enkele verhindering geven aan het Evangelie van Christus.", "Gen 3:13": "En de HEERE God zei tegen de vrouw: Wat is dit dat u gedaan hebt? En de vrouw zei: De slang heeft mij bedrogen, en ik heb gegeten.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Gen 11:7": "Kom aan, laten Wij neerdalen, en laten Wij daar hun taal verwarren, zodat ieder de taal van zijn naaste niet meer verstaat.", "1 Kon 20:7": "Toen riep de koning van Israël alle oudsten van het land, en zei: Merk toch op en zie, dat deze het kwade zoekt; want hij had naar mij gezonden, om mijn vrouwen, en om mijn kinderen, en om mijn zilver, en om mijn goud, en ik heb het hem niet geweigerd.", "Joh 13:2": "En terwijl het avondmaal gehouden werd, en de duivel al in het hart van Judas, de zoon van Simon Iskariot, gegeven had dat hij Hem verraden zou,", "Joh 2:5": "Zijn moeder zei tegen de dienaars: Wat Hij u ook zal zeggen, doe dat.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Jak 4:13": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken.", "1 Kon 17:23": "En Elia nam het kind, en bracht hem van de opperzaal naar beneden, het huis in, en gaf hem aan zijn moeder; en Elia zei: Zie, uw zoon leeft.", "2 Sam 1:2": "dat het op de derde dag gebeurde dat er, kijk, uit het leger van Saul een man kwam, wiens kleren gescheurd waren, en aarde was op zijn hoofd; en het gebeurde, toen hij bij David kwam, dat hij ter aarde viel en zich neerboog.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "1 Kon 17:24": "Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is.", "Num 23:26": "Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?", "Matt 11:5": "De blinden worden ziende, en de kreupelen wandelen; de melaatsen worden gereinigd, en de doven horen; de doden worden opgewekt, en de armen wordt het Evangelie verkondigd.", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "Jer 2:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "2 Kon 3:11": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.", "Ex 3:19": "Toch weet Ik dat de koning van Egypte u niet zal laten gaan, ook niet door een sterke hand.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Amos 3:8": "De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?", "Joh 19:11": "Jezus antwoordde: U zou geen enkele macht tegen Mij hebben, als het u niet van boven gegeven was; daarom heeft hij die Mij aan u heeft overgeleverd, groter zonde.", "Jer 17:25": "Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid.", "Matt 10:8": "Geneest de zieken; reinigt de melaatsen; wekt de doden op; drijft de duivelen uit. U hebt het voor niets ontvangen, geeft het voor niets.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Zach 1:7": "Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "1 Sam 13:18": "en een groep sloeg de weg in naar Beth-horon; en een groep sloeg de weg in naar het gebied dat uitziet op het dal Zeboim, naar de woestijn toe.", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "Jona 1:14-16": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd. En zij namen Jona op, en wierpen hem in de zee. Toen kwam de zee tot rust van haar woede. Daardoor werden de mannen erg bang
