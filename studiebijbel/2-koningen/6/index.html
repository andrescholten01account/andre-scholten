plaats gewezen had, sneed hij een stuk hout af, en wierp het daarheen, en liet het ijzer boven drijven.","7":"En hij zei: Neem het tot u op. Toen stak hij zijn hand uit, en nam het.","8":"En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats.","9":"Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen.","10":"Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.","11":"Toen werd het hart van de koning van Syrië onrustig over deze zaak; en hij riep zijn knechten, en zei tegen hen: Zult u mij dan niet laten weten wie van ons voor de koning van Israël is?","12":"En een van zijn knechten zei: Nee, mijn heer koning! Maar Elisa, de profeet die in Israël is, laat de koning van Israël de woorden weten die u in uw binnenste slaapkamer spreekt.","13":"En hij zei: Ga heen, en kijk waar hij is, zodat ik iemand zend en hem laat halen. En hem werd meegedeeld: Zie, hij is in Dothan.","14":"Toen zond hij daarheen paarden, en wagens, en een zwaar leger; die kwamen 's nachts, en omsingelden de stad.","15":"En de dienaar van de man van God stond zeer vroeg op, en ging naar buiten; en zie, een leger omringde de stad met paarden en wagens. Toen zei zijn knecht tegen hem: Ach, mijn heer, hoe zullen wij het doen?","16":"En hij zei: Vrees niet; want die bij ons zijn, zijn meer dan die bij hen zijn.","17":"En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.","18":"Toen zij nu naar hem afkwamen, bad Elisa tot de HEERE, en zei: Sla toch dit volk met verblindheid. En Hij sloeg hen met verblindheid, naar het woord van Elisa.","19":"Toen zei Elisa tegen hen: Dit is de weg niet, en dit is de stad niet; volg mij, en ik zal u leiden tot de man die u zoekt; en hij leidde hen naar Samaria.","20":"En het gebeurde, toen zij in Samaria gekomen waren, dat Elisa zei: HEERE, open de ogen van dezen, dat zij zien! En de HEERE opende hun ogen, dat zij zagen; en zie, zij waren midden in Samaria.","21":"En de koning van Israël zei tegen Elisa, toen hij hen zag: Zal ik hen doden? Zal ik hen doden, mijn vader?","22":"Doch hij zei: U zult hen niet doden; zou u ook doden wie u met uw zwaard en met uw boog gevangen had? Zet hun brood en water voor, dat zij eten en drinken, en naar hun heer trekken.","23":"En hij bereidde voor hen een grote maaltijd, dat zij aten en dronken; daarna liet hij hen gaan, en zij trokken naar hun heer. Zo kwamen de rooftroepen van de Syriërs niet meer in het land van Israël.","24":"En het gebeurde daarna, dat Benhadad, de koning van Syrië, zijn hele leger verzamelde, en optrok, en Samaria belegerde.","25":"En er kwam grote honger in Samaria; want zie, zij belegerden de stad, totdat een ezelskop voor tachtig zilverstukken werd *verkocht*, en een vierde deel van een kab duivenmest[1] voor vijf zilverstukken.","26":"En het gebeurde, toen de koning van Israël over de muur voorbijging, dat een vrouw tegen hem riep, en zei: Help mij, heer koning!","27":"En hij zei: De HEERE helpt u niet; waarmee zou ik u helpen? Van de dorsvloer of van de wijnpers?","28":"Verder zei de koning tegen haar: Wat is er met u? En zij zei: Deze vrouw heeft tegen mij gezegd: Geef uw zoon, dat wij hem vandaag eten, en morgen zullen wij mijn zoon eten.","29":"Zo hebben wij mijn zoon gekookt, en hebben hem gegeten; maar toen ik de volgende dag tegen haar zei: Geef uw zoon, dat wij hem eten, toen heeft zij haar zoon verstopt.","30":"En het gebeurde, toen de koning de woorden van deze vrouw gehoord had, dat hij zijn kleren scheurde, terwijl hij over de muur voortging; en het volk zag dat er, zie, een zak van binnen over zijn vlees was.","31":"En hij zei: Zo doe God mij, en doe zo daartoe, als het hoofd van Elisa, de zoon van Safat, vandaag op hem zal blijven staan!","32":"(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?","33":"Terwijl hij nog met hen sprak, zie, zo kwam de bode bij hem af; en hij zei: Zie, dit kwaad is van de HEERE; wat zou ik nog langer op de HEERE wachten?"},"SV":{"1":"En de kinderen der profeten zeiden tot Elisa: Zie nu, de plaats, waar wij wonen voor uw aangezicht, is voor ons te eng.","2":"Laat ons toch tot aan de Jordaan gaan, en elk van daar een timmerhout halen, dat wij ons daar een plaats maken, om er te wonen. En hij zeide: Gaat heen.","3":"En er zeide een: Het believe u toch te gaan met uw knechten. En hij zeide: Ik zal gaan.","4":"Zo ging hij met hen. Als zij nu aan de Jordaan gekomen waren, hieuwen zij hout af.","5":"En het geschiedde, als een het timmerhout velde, dat het ijzer in het water viel; en hij riep, en zeide: Ach, mijn heer, want het was geleend.","6":"En de man Gods zeide: Waar is het gevallen? En toen hij hem de plaats gewezen had, sneed hij een hout af, en wierp het daarhenen, en deed het ijzer boven zwemmen.","7":"En hij zeide: Neem het tot u op. Toen stak hij zijn hand uit, en nam het,","8":"En de koning van Syrië voerde krijg tegen Israël, en beraadslaagde zich met zijn knechten, zeggende: Mijn legering zal zijn in de plaats van zulk een.","9":"Maar de man Gods zond henen tot den koning van Israël, zeggende: Wacht u, dat gij door die plaats niet trekt, want de Syriërs zijn daarhenen afgekomen.","10":"Daarom zond de koning van Israël henen aan die plaats, waarvan hem de man Gods gezegd en hem gewaarschuwd had, en wachtte zich aldaar, niet eenmaal, noch tweemaal.","11":"Toen werd het hart des konings van Syrië onstuimig over dezen handel; en hij riep zijn knechten, en zeide tot hen: Zult gij mij dan niet te kennen geven, wie van de onzen zij voor den koning van Israël?","12":"En een van zijn knechten zeide: Neen, mijn heer koning! Maar Elisa, de profeet, die in Israël is, geeft den koning van Israël te kennen de woorden, die gij in uw binnenste slaapkamer spreekt.","13":"En hij zeide: Gaat heen, en ziet, waar hij is, dat ik zende en hem halen late. En hem werd te kennen gegeven, zeggende: Zie, hij is te Dothan.","14":"Toen zond hij daarhenen paarden, en wagenen, en een zwaar heir; welke des nachts kwamen, en omsingelden de stad.","15":"En de dienaar van den man Gods stond zeer vroeg op, en ging uit; en ziet, een heir omringde de stad met paarden en wagenen. Toen zeide zijn jongen tot hem: Ach, mijn heer, hoe zullen wij doen.","16":"En hij zeide: Vrees niet; want die bij ons zijn, zijn meer, dan die bij hen zijn.","17":"En Elisa bad, en zeide: HEERE, open toch zijn ogen, dat hij zie! En de HEERE opende de ogen van den jongen, dat hij zag; en ziet, de berg was vol vurige paarden en wagenen rondom Elisa.","18":"Als zij nu tot hem afkwamen, bad Elisa tot den HEERE, en zeide: Sla toch dit volk met verblindheden. En Hij sloeg hen met verblindheden, naar het woord van Elisa.","19":"Toen zeide Elisa tot hen: Dit is de weg niet, en dit is de stad niet; volgt mij na, en ik zal u leiden tot den man, dien gij zoekt; en hij leidde hen naar Samaria.","20":"En het geschiedde, als zij te Samaria gekomen waren, dat Elisa zeide: HEERE, open de ogen van dezen, dat zij zien! En de HEERE opende hun ogen, dat zij zagen; en ziet, zij waren in het midden van Samaria.","21":"En de koning van Israël zeide tot Elisa, als hij hen zag: Zal ik hen slaan? Zal ik hen slaan, mijn vader?","22":"Doch hij zeide: Gij zult hen niet slaan; zoudt gij ook slaan, die gij met uw zwaard en met uw boog gevangen hadt? Zet hun brood en water voor, dat zij eten en drinken, en tot hun heer trekken.","23":"En hij bereidde hun een grote maaltijd, dat zij aten en dronken; daarna liet hij hen gaan, en zij trokken tot hun heer. Zo kwamen de benden der Syriërs niet meer in het land van Israël.","24":"En het geschiedde daarna, dat Benhadad, de koning van Syrië, zijn gehele leger verzamelde, en optoog, en Samaria belegerde.","25":"En er werd grote honger in Samaria; want ziet, zij belegerden ze, totdat een ezelskop voor tachtig zilverlingen was *verkocht*, en een vierendeel van een kab duivenmest voor vijf zilverlingen.","26":"En het geschiedde, als de koning op den muur voorbijging, dat een vrouw tot hem riep, zeggende: Help mij, heer koning!","27":"En hij zeide: De HEERE helpt u niet; waarvan zou ik u helpen? Van den dorsvloer of van de wijnpers?","28":"Verder zeide de koning tot haar: Wat is u? En zij zeide: Deze vrouw heeft tot mij gezegd: Geef uw zoon, dat wij hem heden eten, en morgen zullen wij mijn zoon eten.","29":"Zo hebben wij mijn zoon gezoden, en hebben hem gegeten; maar als ik des anderen daags tot haar zeide: Geef uw zoon, dat wij hem eten, zo heeft zij haar zoon verstoken.","30":"En het geschiedde, als de koning de woorden dezer vrouw gehoord had, dat hij zijn klederen scheurde, alzo hij op den muur voortging; en het volk zag, dat, ziet, een zak van binnen over zijn vlees was.","31":"En hij zeide: Zo doe mij God, en doe zo daartoe, indien het hoofd van Elisa den zoon van Safat, heden op hem zal blijven staan!","32":"( Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man van voor zijn aangezicht; maar eer de bode tot hem gekomen was, had hij gezegd tot de oudsten: Hebt gijlieden gezien, hoe die zoon des moordenaars gezonden heeft, om mijn hoofd af te nemen? Ziet toe, als die bode komt, sluit de deur toe, en dringt hem uit met de deur; is niet het geruis der voeten van zijn heer achter hem?","33":"Als hij nog met hen sprak, ziet, zo kwam de bode tot hem af; en hij zeide: Zie, dat kwaad is van den HEERE; wat zou ik verder op den HEERE wachten?"},"KJV":{"1":"And the sons of the prophets said unto Elisha, Behold now, the place where we dwell with thee is too strait for us.","2":"Let us go, we pray thee, unto Jordan, and take thence every man a beam, and let us make us a place there, where we may dwell. And he answered, Go ye.","3":"And one said, Be content, I pray thee, and go with thy servants. And he answered, I will go.","4":"So he went with them. And when they came to Jordan, they cut down wood.","5":"But as one was felling a beam, the axe head fell into the water: and he cried, and said, Alas, master! for it was borrowed.","6":"And the man of God said, Where fell it? And he shewed him the place. And he cut down a stick, and cast it in thither; and the iron did swim.","7":"Therefore said he, Take it up to thee. And he put out his hand, and took it.","8":"Then the king of Syria warred against Israel, and took counsel with his servants, saying, In such and such a place shall be my camp.","9":"And the man of God sent unto the king of Israel, saying, Beware that thou pass not such a place; for thither the Syrians are come down.","10":"And the king of Israel sent to the place which the man of God told him and warned him of, and saved himself there, not once nor twice.","11":"Therefore the heart of the king of Syria was sore troubled for this thing; and he called his servants, and said unto them, Will ye not shew me which of us is for the king of Israel?","12":"And one of his servants said, None, my lord, O king: but Elisha, the prophet that is in Israel, telleth the king of Israel the words that thou speakest in thy bedchamber.","13":"And he said, Go and spy where he is, that I may send and fetch him. And it was told him, saying, Behold, he is in Dothan.","14":"Therefore sent he thither horses, and chariots, and a great host: and they came by night, and compassed ➔ the city about.","15":"And when the servant of the man of God was risen early, and gone forth, behold, an host compassed the city both with horses and chariots. And his servant said unto him, Alas, my master! how shall we do?","16":"And he answered, Fear not: for they that be with us are more than they that be with them.","17":"And Elisha prayed, and said, LORD, I pray thee, open his eyes, that he may see. And the LORD opened the eyes of the young man; and he saw: and, behold, the mountain was full of horses and chariots of fire round about Elisha.","18":"And when they came down to him, Elisha prayed unto the LORD, and said, Smite this people, I pray thee, with blindness. And he smote them with blindness according to the word of Elisha.","19":"And Elisha said unto them, This is not the way, neither is this the city: follow me, and I will bring you to the man whom ye seek. But he led them to Samaria.","20":"And it came to pass, when they were come into Samaria, that Elisha said, LORD, open the eyes of these men, that they may see. And the LORD opened their eyes, and they saw; and, behold, they were in the midst of Samaria.","21":"And the king of Israel said unto Elisha, when he saw them, My father, shall I smite them? shall I smite them?","22":"And he answered, Thou shalt not smite them: wouldest thou smite those whom thou hast taken captive with thy sword and with thy bow? set bread and water before them, that they may eat and drink, and go to their master.","23":"And he prepared great provision for them: and when they had eaten and drunk, he sent them away, and they went to their master. So the bands of Syria came no more into the land of Israel.","24":"And it came to pass after this, that Benhadad king of Syria gathered all his host, and went up, and besieged Samaria.","25":"And there was a great famine in Samaria: and, behold, they besieged it, until an ass's head was sold for fourscore pieces of silver, and the fourth part of a cab of dove's dung for five pieces of silver.","26":"And as the king of Israel was passing by upon the wall, there cried a woman unto him, saying, Help, my lord, O king.","27":"And he said, If the LORD do not help thee, whence shall I help thee? out of the barnfloor, or out of the winepress?","28":"And the king said unto her, What aileth thee? And she answered, This woman said unto me, Give thy son, that we may eat him to day, and we will eat my son to morrow.","29":"So we boiled my son, and did eat him: and I said unto her on the next day, Give thy son, that we may eat him: and she hath hid her son.","30":"And it came to pass, when the king heard the words of the woman, that he rent his clothes; and he passed by upon the wall, and the people looked, and, behold, he had sackcloth within upon his flesh.","31":"Then he said, God do so and more also to me, if the head of Elisha the son of Shaphat shall stand on him this day.","32":"But Elisha sat in his house, and the elders sat with him; and the king sent a man from before him: but ere the messenger came to him, he said to the elders, See ye how this son of a murderer hath sent to take away mine head? look, when the messenger cometh, shut the door, and hold him fast at the door: is not the sound of his master's feet behind him?","33":"And while he yet talked with them, behold, the messenger came down unto him: and he said, Behold, this evil is of the LORD; what should I wait for the LORD any longer?"}},"tsk":{"1":[{"kopje":"de kinderen","refs":["2 Kon 2:3","2 Kon 4:1","1 Kon 20:35"]},{"kopje":"de plaats","refs":["2 Kon 4:38","1 Sam 19:20"]},{"kopje":"te eng","refs":["Joz 17:14","Joz 19:47","Job 36:16","Jes 49:19","Jes 49:20","Jes 54:2","Jes 54:3"]}],"2":[{"kopje":"van daar een stuk timmerhout halen","refs":["Joh 21:3","Hand 18:3","Hand 20:34","Hand 20:35","1 Kor 9:6","1 Tess 2:9","2 Tess 3:8","1 Tim 6:6"]}],"3":[{"kopje":"Het belieft u","refs":["2 Kon 5:23","Richt 19:6","Job 6:28"]},{"kopje":"Ga heen","refs":["Richt 4:8"]}],"4":[{"kopje":"hieuwen zij hout af","refs":["Deut 19:5","Deut 29:11"]}],"5":[{"kopje":"het ijzer", ten</span>?"},"koppeling_kjv":{"1":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">unto</span> <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha,</span> Behold now, the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where we <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> with thee is too <span class=\"wl wl-kjv\" data-code=\"H6862\">strait</span> for us.","2":"Let us <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> we pray thee, unto <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thence every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H6982\">beam,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> us a <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> there, where we may <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> ye.","3":"And <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Be <span class=\"wl wl-kjv\" data-code=\"H2974\">content,</span> I pray thee, and <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3212\">go.</span>","4":"So he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with them. And when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> they cut <span class=\"wl wl-kjv\" data-code=\"H1504\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood.</span>","5":"But as <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> was <span class=\"wl wl-kjv\" data-code=\"H5307\">felling</span> a <span class=\"wl wl-kjv\" data-code=\"H6982\">beam,</span> the axe <span class=\"wl wl-kjv\" data-code=\"H1270\">head</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> into the <span class=\"wl wl-kjv\" data-code=\"H4325\">water:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6817\">cried,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H162\">Alas,</span> <span class=\"wl wl-kjv\" data-code=\"H113\">master!</span> for it was <span class=\"wl wl-kjv\" data-code=\"H7592\">borrowed.</span>","6":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H575\">Where</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> it? And he <span class=\"wl wl-kjv\" data-code=\"H7200\">shewed</span> him the <span class=\"wl wl-kjv\" data-code=\"H4725\">place.</span> And he cut <span class=\"wl wl-kjv\" data-code=\"H7094\">down</span> a <span class=\"wl wl-kjv\" data-code=\"H6086\">stick,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> it in thither; and the <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> did <span class=\"wl wl-kjv\" data-code=\"H6687\">swim.</span>","7":"Therefore <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> he, Take it <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> to thee. And he put <span class=\"wl wl-kjv\" data-code=\"H7971\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> it.","8":"Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">warred</span> against <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and took <span class=\"wl wl-kjv\" data-code=\"H3289\">counsel</span> with his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> In <span class=\"wl wl-kjv\" data-code=\"H6423\">such</span> and <span class=\"wl wl-kjv\" data-code=\"H492\">such</span> a <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> shall be my <span class=\"wl wl-kjv\" data-code=\"H8466\">camp.</span>","9":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">Beware</span> that thou <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> not <span class=\"wl wl-kjv\" data-code=\"H2088\">such</span> a <span class=\"wl wl-kjv\" data-code=\"H4725\">place;</span> for thither the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> are come <span class=\"wl wl-kjv\" data-code=\"H5185\">down.</span>","10":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">told</span> him and <span class=\"wl wl-kjv\" data-code=\"H2094\">warned</span> him of, and <span class=\"wl wl-kjv\" data-code=\"H8104\">saved</span> himself there, not <span class=\"wl wl-kjv\" data-code=\"H259\">once</span> nor <span class=\"wl wl-kjv\" data-code=\"H8147\">twice.</span>","11":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> was sore <span class=\"wl wl-kjv\" data-code=\"H5590\">troubled</span> for this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing;</span> and he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Will ye not <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> me which of us is for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> None, my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> but <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha,</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> that is in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">telleth</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that thou <span class=\"wl wl-kjv\" data-code=\"H1696\">speakest</span> in thy <span class=\"wl wl-kjv\" data-code=\"H2315\">bedchamber.</span>","13":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">spy</span> <span class=\"wl wl-kjv\" data-code=\"H351\">where</span> he is, that I may <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">fetch</span> him. And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, he is in <span class=\"wl wl-kjv\" data-code=\"H1886\">Dothan.</span>","14":"Therefore <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> he thither <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> and <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3515\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">host:</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H5362\">compassed</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H5362\">about.</span>","15":"And when the <span class=\"wl wl-kjv\" data-code=\"H8334\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was <span class=\"wl wl-kjv\" data-code=\"H6965\">risen</span> <span class=\"wl wl-kjv\" data-code=\"H7925\">early,</span> and gone <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> behold, an <span class=\"wl wl-kjv\" data-code=\"H2428\">host</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> both with <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> and <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots.</span> And his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H162\">Alas,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">master!</span> how shall we <span class=\"wl wl-kjv\" data-code=\"H6213\">do?</span>","16":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> not: for they that be with us are <span class=\"wl wl-kjv\" data-code=\"H7227\">more</span> than they that be with them.","17":"And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> I pray thee, <span class=\"wl wl-kjv\" data-code=\"H6491\">open</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H7200\">see.</span> And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6491\">opened</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man;</span> and he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw:</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> was <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> and <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha.</span>","18":"And when they came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to him, <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">Smite</span> this <span class=\"wl wl-kjv\" data-code=\"H1471\">people,</span> I pray thee, with <span class=\"wl wl-kjv\" data-code=\"H5575\">blindness.</span> And he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them with <span class=\"wl wl-kjv\" data-code=\"H5575\">blindness</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha.</span>","19":"And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, This is not the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> neither is <span class=\"wl wl-kjv\" data-code=\"H2090\">this</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">follow</span> me, and I will <span class=\"wl wl-kjv\" data-code=\"H3212\">bring</span> you to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> whom ye <span class=\"wl wl-kjv\" data-code=\"H1245\">seek.</span> But he <span class=\"wl wl-kjv\" data-code=\"H3212\">led</span> them to <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span>","20":"And it came to pass, when they were <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> that <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H6491\">open</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of these men, that they may <span class=\"wl wl-kjv\" data-code=\"H7200\">see.</span> And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6491\">opened</span> their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and they <span class=\"wl wl-kjv\" data-code=\"H7200\">saw;</span> and, behold, they were in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span>","21":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha,</span> when he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> them, My <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> shall I <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> them? shall I <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> them?","22":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> them: wouldest thou <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> those whom thou hast taken <span class=\"wl wl-kjv\" data-code=\"H7617\">captive</span> with thy <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> and with thy <span class=\"wl wl-kjv\" data-code=\"H7198\">bow?</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, that they may <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to their <span class=\"wl wl-kjv\" data-code=\"H113\">master.</span>","23":"And he <span class=\"wl wl-kjv\" data-code=\"H3739\">prepared</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3740\">provision</span> for them: and when they had <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> and <span class=\"wl an class=\"wl wl-kjv\" data-code=\"H2568\">five</span> pieces of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver.</span>","26":"And as the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> was passing <span class=\"wl wl-kjv\" data-code=\"H5674\">by</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> there <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3467\">Help,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","27":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> do not <span class=\"wl wl-kjv\" data-code=\"H3467\">help</span> thee, <span class=\"wl wl-kjv\" data-code=\"H370\">whence</span> shall I <span class=\"wl wl-kjv\" data-code=\"H3467\">help</span> thee? out of the <span class=\"wl wl-kjv\" data-code=\"H1637\">barnfloor,</span> or out of the <span class=\"wl wl-kjv\" data-code=\"H3342\">winepress?</span>","28":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, What aileth thee? And she <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> This <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> him to <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow.</span>","29":"So we <span class=\"wl wl-kjv\" data-code=\"H1310\">boiled</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> him: and I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her on the <span class=\"wl wl-kjv\" data-code=\"H312\">next</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> him: and she hath <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> her <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span>","30":"And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> that he <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes;</span> and he passed <span class=\"wl wl-kjv\" data-code=\"H5674\">by</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and, behold, he had <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">within</span> upon his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh.</span>","31":"Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> so and <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> also to me, if the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8202\">Shaphat</span> shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> on him this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","32":"But <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> with him; and the king <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him: but ere the <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to him, he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">See</span> ye how this <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of a <span class=\"wl wl-kjv\" data-code=\"H7523\">murderer</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> mine <span class=\"wl wl-kjv\" data-code=\"H7218\">head?</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">look,</span> when the <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh,</span> <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door,</span> and hold him <span class=\"wl wl-kjv\" data-code=\"H3905\">fast</span> at the <span class=\"wl wl-kjv\" data-code=\"H1817\">door:</span> is not the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of his <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> him?","33":"And while he yet <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with them, behold, the <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto him: and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> is of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> what should I <span class=\"wl wl-kjv\" data-code=\"H3176\">wait</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> any longer?"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"wonen","tekst":"Of, zitten; te weten, als leerjongens, om van u als onzen leermeester onderwezen te worden. Zie boven, 2Ki 2:3, en 2Ki 4:38, en hier in vs.2."}],"2":[{"catchword":"timmerhout","tekst":"Versta, om daarvan balken of iets anders te maken."},{"catchword":"halen","tekst":"Hebreeuws, nemen; dat is, nemen en brengen; hetwelk is halen. Zie Gen 12:15."}],"5":[{"catchword":"ijzer","tekst":"Versta, de bijl, die van ijzer gemaakt was. Of, het ijzer der bijl, hetwelk van den steel in het water viel."}],"6":[{"catchword":"hij hem","tekst":"Te weten, zijn discipel, dien dat ijzer ontvallen was."},{"catchword":"hij een hout af,","tekst":"Namelijk, Elisa."},{"catchword":"en deed","tekst":"Anders, toen zwom het ijzer."}],"8":[{"catchword":"de plaats","tekst":"Hier zijn twee woorden: Peloni, Almoni, die de Hebreën gebruiken als zij zekeren persoon of iemands plaats betekenen, dien zij met name niet noemen of willen uitdrukken, en van ons met den letter N in gelijke gevallen plegen aangewezen te worden. Zie Rth 4:1; 1Sa 21:2."}],"9":[{"catchword":"zijn daarhenen","tekst":"Of, zijn aldaar loerende, of, afgekomen om lagen te leggen, en te loeren op het volk, dat zou mogen uitkomen."}],"10":[{"catchword":"zond","tekst":"Te weten, om te vernemen of het zo was, gelijk de profeet hem gewaarschuwd had, en dat zo bevindende, op zijn hoede en voorbaat te wezen."},{"catchword":"wachtte","tekst":"Dat is, hij was daar op zijn hoede om alle schade af te keren."},{"catchword":"niet eenmaal,","tekst":"Dat is, menigmaal, tot verscheidene malen."}],"11":[{"catchword":"onstuimig","tekst":"Het Hebreeuwse woord betekent eigenlijk de onstuimigheid der zee, als zij door winden en stormen beroerd wordt. Bij deze wordt alhier vergeleken de ongezindheid en ontsteltenis, die in het hart des konings van Syrië geweest is."}],"12":[{"catchword":"Neen,","tekst":"De zin is, dat het zo niet was, gelijk de koning vermoedde."}],"13":[{"catchword":"Dothan","tekst":"Een stad, gelegen in den stam van Manasse, niet ver van Sichem en Samaria. Zie Gen 37:17."}],"14":[{"catchword":"zwaar heir;","tekst":"Dat is, menigen in getal en groot van macht. Vergelijk 1Ki 3:9, en 1Ki 10:2, en zie Gen 50:9."}],"15":[{"catchword":"stond zeer vroeg op,","tekst":"Hebreeuws, maakte zich vroeg op om op te staan."}],"17":[{"catchword":"open toch","tekst":"Dat is, geef hem met zijn lichamelijke ogen te aanschouwen de uiterlijke gedaanten, waarin uw hemelse heirkrachten verschenen zijn, om met de geestelijke te begrijpen uw grote macht en de tegenwoordige hulp, die Gij voor ons bereid hebt."},{"catchword":"vurige paarden","tekst":"Hebreeuws, paarden en wagens des vuurs. Versta hierdoor een grote menigte van engelen, die van God tot bescherming van den profeet gezonden waren. Vergelijk boven, 2Ki 2:11."}],"18":[{"catchword":"zij nu","tekst":"Namelijk, de Syriërs."},{"catchword":"verblindheden","tekst":"Versta zodanige blindheid niet, waardoor zij gans niet zagen, maar waardoor zij niet recht konden onderscheiden, noch kennen hetgeen zij zagen. Vergelijk Gen 19:11, en zie de aantekening."}],"19":[{"catchword":"Dit is de weg niet,","tekst":"Versta dit ten aanzien van de uitkomst der zaken. Want op dezen weg en in deze stad Dothan hebben zij den profeet niet gevonden, maar door den weg, in welken hij hen leidde, en in de stad Samaria, toen hij hen daarin gebracht had, en zij van hun blindheid genezen waren."}],"21":[{"catchword":"mijn vader?","tekst":"Vergelijk boven, 2Ki 2:12."}],"22":[{"catchword":"zoudt gij","tekst":"De zin is, naardien het niet betaamt dat men allen, die in den oorlog gevangen zijn, doden zal, dat het den koning Joram, nog veel minder betaamde dezen te doden, die hij in den oorlog niet gevangen had."},{"catchword":"brood en water","tekst":"Dat is, spijs en drank. Vergelijk Ezr 10:6."}],"23":[{"catchword":"Zo kwamen de benden der Syriërs niet","tekst":"De zin is, dat de Syriërs in dien tijd niet meer met benden van rovende en plunderende krijgslieden in het land Israëls uitvielen, maar wel openbaren oorlog daartegen voerden; gelijk blijkt uit vs.24."}],"25":[{"catchword":"zilverlingen","tekst":"Dat is, twintig rijksdaalders. Zie Gen 20:16."},{"catchword":"kab","tekst":"Een korenmaat, houdende zoveel als in vier en twintig gewone hoeneierschalen kon gaan. Het vierde deel derzelve van natte waren werd genoemd log; van welke maat zie Lev 14:10."},{"catchword":"duivenmest","tekst":"Sommigen verstaan hierdoor de granen, die de duiven in haar krop uit het veld vergaderd hadden; anderen het ingewand derzelve; enigen ook enkel duivenmest, welke de Samaritanen in deze belegering zouden gebruikt hebben voor hout om daarmede vuur te stoken, hebbende daarvan veel voorraad in de stad om anders het land en de hoven daarmede te mesten; mogelijk hebben zij het ook gegeten. Josefus meent dat deze mest den belegerden inplaats van zout is geweest; in het negende boek der Joodse oudheden, hoofdstuk 2."}],"27":[{"catchword":"De HEERE","tekst":"Dat is, dewijl de Heere, die alleen alle mensen helpen kan, u niet helpt, zo weet ik niet hoe of waarmede ik u zou kunnen helpen. Anders, de Heere helpe u niet; als de woorden van een goddeloos en toornig mens. Vergelijk vs.31. Het kan ook aldus vertaald worden: Niet. De Heere helpe u; dat is, spreekt zo niet, enz."},{"catchword":"Van den dorsvloer","tekst":"Dat is, met u koren te leveren uit den dorsvloer, of u te voorzien van wijn en olie uit de pers?"}],"30":[{"catchword":"scheurde,","tekst":"Tot een teken kwanswijs van droefenis, die hij uit het verhaal der vrouw gekregen had, maar de rechte oorzaak was zijn bittere en felle toornigheid, waarmede zijn gemoed tegen den profeet Elisa ontstoken was. Zie het volgende."},{"catchword":"het volk","tekst":"De zin is dat het volk, als de koning zijn opperkleed gescheurd had, gemerkt heeft dat hij aan zijn naakte lijf een zak of ruwig kleed aanhad, en dat mogelijk om boete te doen en zich alzo met God te verzoenen, blijvende nochtans een huichelaar en zonder bekering. Vergelijk 1Ki 21:27; Isa 58:5."}],"31":[{"catchword":"Zo doe mij God,","tekst":"Zie van deze manier van zweren 1Ki 19:2."},{"catchword":"indien","tekst":"Hij was vergramd op Elisa, omdat hij den vijand van de stad niet afkeerde, gelijk hij tevoren gedaan had, boven, vs.18, of omdat hij den honger niet wegnam, naar het exempel van Elia, 1Ki 17:1, en 1Ki 18:42. Het schijnt ook onder uit vs.33, dat de profeet hem de goddelijke hulp toegezegd had, welke nog niet verschenen zijnde, hij mocht denken van hem bedrogen te zijn."}],"32":[{"catchword":"oudsten","tekst":"Men houdt dezen geweest te zijn, òf enigen van de voornaamsten des volks, die bij Elisa gekomen waren om bij hem troost te halen, òf enige profeten of zonen der profeten en godvrezenden onder het volk, die de voorgangers waren der gelovigen in Israël, nog overgebleven. Zij worden de oudsten genoemd, niet omdat zij allen oud van jaren geweest zijn, maar alle oud in gaven des verstands, in waardigheid huns werks en in vromigheid des levens, hoewel enigen jong van jaren."},{"catchword":"hem","tekst":"In dezen zwaren en benauwden tijd bezig zijnde met leren, vermanen, troosten en bidden voor Gods volk en het gemenebest."},{"catchword":"een man","tekst":"Wie deze geweest is, zie onder, 2Ki 7:2."},{"catchword":"gezien,","tekst":"Te weten, in een profetisch gezicht, hetwelk de Heere mij nu vertoond heeft. Van een gelijk gezicht, zie boven, 2Ki 5:26."},{"catchword":"des moordenaars","tekst":"Namelijk van Achab, door wiens toedoen de bewilliging Naboth en de profeten des Heeren vermoord waren, 1Ki 18:4, en 1Ki 21:9."},{"catchword":"en dringt hem","tekst":"Dat is, houdt hem, namelijk den bode, met kracht buiten het huis, opdat hij niet inkome en mij verhindere het woord te spreken, dat de HEERE mij bevolen heeft te spreken."},{"catchword":"is niet","tekst":"Dat is, volgt hem de koning Joram, die hem gezonden heeft, niet straks op de hielen? Hij wil zeggen, zekerlijk ja. Zie Gen 13:9."},{"catchword":"geruis","tekst":"Zie dergelijke manier van spreken 1Ki 14:6."}],"33":[{"catchword":"hen sprak,","tekst":"Te weten, met de oudsten."},{"catchword":"hij zeide","tekst":"Te weten, de bode, in den naam en uit last des konings. Anderen menen dat de koning zelf dit zou gesproken hebben, zijnde vóór den bode tot des profeten huis gekomen, overmits hij zich gehaast zou hebben om den bode voor te komen en den dood des profeets, waarvan hij berouw had, te verhinderen."},{"catchword":"kwaad","tekst":"Versta, den kindermoord, veroorzaakt door den honger."},{"catchword":"zou ik","tekst":"Woorden van een goddeloos en ongelovig mens, die de beloften der goddelijke hulp, verkondigd door den profeet Elisa, smadelijk verwerpt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the children of the Prophets said unto Elisa; Behold now, the place where we dwell before thy face, [Or, sit, &c. to wit, as Disciples and Scholars, to be instructed by thee, as our Master: see above chap.2.on v.3. & chap.4.on v.38. and here in the following verse] is too strait for us."}],"2":[{"catchword":null,"tekst":"Let us, we pray, go to the Jordan, and fetch [Hebr. Take; that is, take and bring; which is fetching: see Gen 12.on ver.15.] thence every man a piece of timber, [to wit, to make beams, or somewhat else of it] to make us a place there, where we may dwell: and he said, Go your ways."}],"3":[{"catchword":null,"tekst":"And there (was) one (that) said; Let it please thee, I pray, to go with thy servants: and he said, I will go."}],"4":[{"catchword":null,"tekst":"So he went with them: now when they were come to the Jordan, they cut down wood."}],"5":[{"catchword":null,"tekst":"And it came to pass, as one felled the timber, that the iron fell into the water: [Understand the ax which was made of iron; or the iron of the ax, which fell from the helve of it into the water] and he cried, and said; Ah, my Lord! for it was borrowed."}],"6":[{"catchword":null,"tekst":"And the man of God said; Where did it fall? and when he [To wit, his Disciple out of whose hand that iron fell] had shewed him the place, he [to wit, Elisa] cut down a stick, and cast it in thither, and made the iron to swim above. [others, then the iron did swim.]"}],"7":[{"catchword":null,"tekst":"And he said; Take it up to thee: then he put forth his hand, and took it."}],"8":[{"catchword":null,"tekst":"And the King of Syria made war against Israel, and took counsel with servants saying; My camping shall be in the place of such a one. [Here be two words, Peloni, Almoni, which the Hebrew use, when they denote or describe some certain person, or any mans place, whom they do not name, or are not minded to express his name: and are wont to be declared and set forth by us by letters or characters in like case: see Ruth 4.on v.1. 1 Sam.21.2.]"}],"9":[{"catchword":null,"tekst":"But the man of God sent to the King of Israel, saying; Beware, that thou pass not by that place; for the Syrians are come down thither. [Or, lie lurking there, or, come down to lie wait, and to watch the people that should come forth.]"}],"10":[{"catchword":null,"tekst":"Therefore the King of Israel sent to that place, that the man of God had told and warned him of; [To wit, to know if it were so, as the Prophet had forewarned him, and finding it so, might stand upon his guard, and be the better provided] and look to himself there [i.e. he stood there upon his guard to turn away what ever might hurt or endanger him] not once, nor twice. [i.e. frequently, often, and sundry times.]"}],"11":[{"catchword":null,"tekst":"Then the heart of the King of Syria was boisterous [The Hebrew word signifieth properly the tempestuousness of the sea, when it is troubled with winds and tempests. To this is here compared the vexation and distemper that was in the King of Syria&acirc;&euro;&trade;s heart] at this; and he called his servants, and said unto them; Will ye not then tell me, who of ours is for the King of Israel?"}],"12":[{"catchword":null,"tekst":"And one of his servants said; Nay, my Lord, (O) King; [The meaning is, that it was not so as the King suspected] but Elisa the Prophet that is in Israel, acquainteth the King of Israel with the words that thou speakest in thy innermost bed-chamber."}],"13":[{"catchword":null,"tekst":"And he said, Go thy ways, and see where he is, that I may send, and cause him to be fetch: and it was told him, saying; Behold, he is at Dothan. [A city lying in the tribe of Manasseh, not far from Sichem and Samaria: see Gen.37.on v.17.]"}],"14":[{"catchword":null,"tekst":"Then he sent thither horses and charets, and a heavy host, [i.e. Many in number, and great in power. Compare 1 King.3.9. & 10.2. and see Gen.50. on v.9.] which came by night, and compassed the city about."}],"15":[{"catchword":null,"tekst":"And the servant of the man of God rose very early, [Heb. Gat him up betimes to rise] and went out, and behold, an host compassed the city with horse and charets: then his lad said unto him; Ah, my Lord, how shall we do?"}],"16":[{"catchword":null,"tekst":"And he said; Fear not; for those that be with us, are more then those that be with them."}],"17":[{"catchword":null,"tekst":"And Elisa prayed, and said; LORD, open his eyes, I pray, that he may see: [That is, given him to behold with his bodily eyes the outward forms or shapes, in which thy heavenly hosts do appear, that he may with spiritual eyes apprend thy great power, and the present aid which thou hast prepared for us] and the LORD opened the eyes of the lad, that he saw; and behold, the mountain was full of fiery horses and charets round about Elisa. [Heb. horses and charet of fire, etc. Understand hereby a great multitude of Angels, sent from God to defend and protect the Prophet. Compare above chap.2.11.]"}],"18":[{"catchword":null,"tekst":"Now when they [To wit, the Syrians] came down to him, Elisa prayed unto the LORD, and said; Smite this people, I pray thee, with blindness; [Understand not such blindness, whereby they saw not at all, but whereby they would not rightly discern, or know that which they saw. Compare Gen 19:11. and see the annotate.] and he smote them with blindness, according to the word of Elisa."}],"19":[{"catchword":null,"tekst":"Then said Elisa unto them; This is not the way, neither is this the city; [Understand this in respect of the event of things: For by this way, and in this city of Dothan they found not the Prophet, but by the way, in which he led them, and in the city of Samaria, when he had brought them into it, and they were cured of their blindness] follow me, and I will lead you to the man, whom ye seek: and he led them to Samaria."}],"20":[{"catchword":null,"tekst":"And it came to pass, when they were come to Samaria, that Elisa said; LORD, open these (mens) eyes, that they may see; and the LORD opened their eyes, that they saw, and behold, they were in the midst of Samaria."}],"21":[{"catchword":null,"tekst":"And the King of Israel said unto Elisa, when he saw them; My Father [Compare above chap.2.on v.12.] shall I smite them? shall I smite them?"}],"22":[{"catchword":null,"tekst":"But he said; Thou shalt not smite them; shouldest thou also slay them, whom thou hadst taken captive with is not meet to slay all that are taken captive in war, that it much less became King Joram to slay these, whom he had not taken captive in war] set bread and water [i.e. meat and drink. Compare Eze 10:6. before them, that they may eat and drink, and go to their Lord."}],"23":[{"catchword":null,"tekst":"And he prepared a great Feast for them, (so) that they did eat and drink, after that he let them go, and they went to their Lord: so the hands of the Syrians came no more into the land of Israel. [The meaning is, that the Syrians that time invaded no more the land of Israel with bands of robbing and plundering souldiers, but indeed made open war against them: as appeareth by the following verse.]"}],"24":[{"catchword":null,"tekst":"And it came to pass afterwards, That Benhadad the King of Syria gathered all his army, and marched up, and besiege Samaria."}],"25":[{"catchword":null,"tekst":"And there was a great famine in Samaria, for behold, they besieged them until an asses head was (sold) for fourscore silverings, [That is, twenty Rycx-dollers: see gen.20.on ver.16.] and a fourth part of a Kab [a measure of corn, containing the quantity of twenty four hen-egg-shells: the fourth part of which measure in moist Wares, was called a LOG: of which measure, see Lev.14.on ver.10.] of Doves dung [some understand hereby the grains, which the Doves or Pigeons had gathered in their crop out of the field: Others, the bowels of them: some also simple or bare Doves-dung, which the Samaritans in this siege it may be used in stead of wood, to make fires therewith: having much provision thereof in the city, otherwise to dung the land, and the gardens therewith, peradventure they did also eat it. Josephus thinketh that this dung was to the besieged in stead of salt. In the 9 book of the Jewish Antiquities, chap.2.] for five silverlings."}],"26":[{"catchword":null,"tekst":"And it came to pass, when the King passed by upon the wall, that a woman cried too him, saying; Help me (my) Lord (O) King."}],"27":[{"catchword":null,"tekst":"And he said; The LORD helpeth thee not; whence should I help thee? [i.e. seeing the LORD, who alone is able to help all men, doth not help thee, I know not how, or wherewith I should be able to help thee. Oth. the LORD help thee not, as words of a wicked and angry man. Compare v.31. It may be also thus translated, not: the Lord help thee: that is, speak not so, etc.] out of the threshing-floor, or out the wine-press? [i.e. by delivering the corn out of the threshing-floor, or furnishing thee with win and oil out of the press.]"}],"28":[{"catchword":null,"tekst":"Moreover the King said unto her; what ailest thou? and she said; this woman said unto me, give thy son, that we may eat him to day, and tomorrow we will eat my son."}],"29":[{"catchword":null,"tekst":"So we boiled my son, and did eat him: but when I said to her on the next day; give thy son, that we may eat him, then she hid her son."}],"30":[{"catchword":null,"tekst":"And it came to pass, when the King had heard the words of this woman, that he rent his clothes, [As it were in token of grief, conceived by the womans relation, but the true and right cause was his better and vehement wrath, wherewith his mind was kindled against the Prophet Elisa. See the sequel] as he passed by upon the wall: and the people saw that, behold, (there) was a sack within upon his flesh. [the meaning is, that the people perceived, when the King had rent his upper garment, that he had a sack or rough garment upon his bare body, and that (it may be) to do penance, and so to reconcile himself unto God, continuing still an hypocrite, and without true repentance. Compare 1 Kings 21.27. Isa 58:5.]"}],"31":[{"catchword":null,"tekst":"And he said: Let God do so to me, and let him so add thereto, [See of this manner of swearing, 1 King.19 2.] if the head of Elisa the son of Sephat shall remain standing on him this day! [he was incensed against Elisa, because he turned not the Enemy away from the city, as he had done formerly, ab.v.18. or because he did not take away the famine, according to the example of Elisa, 1 Kings 17.1. and 18.42. It seemeth also below by .v.33. that the Prophet had promised him the aid and assistance of God, which because it was not as yet come, he thought perhaps, himself to be deceived by him.]"}],"32":[{"catchword":null,"tekst":"(Now Elisa sat in his house, and the Eldest [Its conceived, that these were either some of the chief of the people, that were come to Elisa, to find comfort by him; or some Prophets, or sons of the Prophets, or some godly persons among the people, that were the leader and examples, or partakers of believers yet remaining in Israel. They are called the Eldest, not because they were all old in years, but all old in gifts of understanding, and worthiness of the work wherein they were employed, and in honestly of life, although it may be some were but young in years] sat with him) [in this sad and distressed time being busy with teaching, admonishing, comforting, and praying Gods people, and the common weal] and he sent a man from before his face; [who this man was, see below chap.7.v.2.] but before the messenger was come to him, he had said to the Eldest; have ye seen, [to wit, in a prophetical vision, which the Lord now shewed me. Of the like vision see above chap.5.26.] how that murderers [viz. Achabs, by whose means and consent Naboth and the Prophets of the LORD were murdered, 1 Kings 18.4. and 21.9.] son hath sent to take off mine head? look, when the messenger cometh; shut the door close, and thrust him out him with the door. [i.e. keep him, namely, the messenger, by force out of the house, that he may not come in, and hinder me from speaking the word which the Lord hath commanded me to speak] is not the sound of his Lords feet behind him? [i.e. doth not King Joram that sent him follow him close at heels? As if he should say, surely he doth. See Gen.13.on v.9. See the like phrase 1 Kin.14.6.]"}],"33":[{"catchword":null,"tekst":"While he yet speak with them, [To wit, with the Eldest] behold, the messenger came down to him, and he said, [to wit, the messenger spake it, in the name, and by command from the King. Others conceive that the king himself spake it, being come to the Prophets house before the messenger gat thither, because he made hast to prevent the messenger, and to hinder the Prophets death, which he after repented of] behold, that evil [meaning the murder of the child, occasioned by the famine] is of the LORD; what should I want on the LORD (any) longer? [words of a wicked and an unbelieving man, who disdainfully rejecteth the promises of divine help, foretold by the Prophet Elisa.]"}]}}};

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
