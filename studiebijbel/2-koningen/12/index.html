ia, zijn zoon, werd koning in zijn plaats.", "Ps 134:1": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat!", "Lev 27:31": "Maar als iemand van zijn tienden iets echt wil afkopen, zal hij zijn vijfde deel daarboven toevoegen.", "2 Kron 34:9-11": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen. Zij gaven het namelijk in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE, en deze gaven het aan hen die het werk deden, die arbeidden aan het huis van de HEERE, om het huis te herstellen en te verbeteren. Want zij gaven het aan de werkmeesters en de bouwlieden, om gehouwen stenen te kopen, en hout voor de verbindingen, en om de huizen te voorzien van vloeren en balken, die de koningen van Juda hadden laten vervallen.", "1 Kron 27:32": "En Jonathan, de oom van David, was raadsman, een verstandig man; hij was ook schrijver; Jehiël nu, de zoon van Hachmoni, was bij de zonen van de koning.", "2 Kron 24:1": "Joas was zeven jaar oud, toen hij koning werd, en hij regeerde veertig jaar te Jeruzalem; en de naam van zijn moeder was Zibja, van Ber-seba.", "2 Kon 22:1-14": "Josia was acht jaar oud, toen hij koning werd, en regeerde eenendertig jaar te Jeruzalem; en de naam van zijn moeder was Jedida, een dochter van Adaja, uit Bozkath. En hij deed wat recht was in de ogen van de HEERE; en hij wandelde in heel de weg van zijn vader David, en week niet af naar rechts of naar links. Het gebeurde nu in het achttiende jaar van koning Josia, dat de koning de schrijver Safan, de zoon van Azalia, de zoon van Mesullam, zond naar het huis van de HEERE, en zei:", "Ex 35:22": "Zo kwamen dan de mannen met de vrouwen, allen die vrijwillig van hart waren; zij brachten haken, en oorsieraden, en ringen, en spangetjes, allerlei gouden voorwerpen; en ieder man die een gouden beweegoffer aan de HEERE offerde,", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "1 Kon 11:27": "Dit is nu de zaak waarom hij tegen de koning in opstand kwam. Salomo bouwde Millo, en herstelde de bres in de stad van zijn vader David.", "2 Kron 34:17": "En zij hebben het geld dat in het huis van de HEERE gevonden is, samengevoegd, en hebben het gegeven in de hand van de opzichters, en in de hand van hen die het werk verrichtten.", "Luk 21:4": "Want die allen hebben van hun overvloed geworpen tot de gaven van God; maar deze heeft van haar gebrek, alle middelen van bestaan die zij had, daarin geworpen.", "1 Kron 15:18": "En met hen hun broeders van de tweede orde: Zecharja, Ben en Jaaziel, en Semiramoth, en Jehiel, en Unni, Eliab, en Benaja, en Maaseja, en Mattithja, en Elifele, en Mikneja, en Obed-edom, en Jeiel, de poortwachters.", "2 Kon 25:18": "Ook nam de aanvoerder van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders.", "2 Kon 22:4": "Ga naar Hilkia, de hogepriester, opdat hij het geld opsomt dat in het huis van de HEERE gebracht is, dat de wachters van de drempel bij het volk verzameld hebben;", "Dan 5:2": "Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken.", "Lev 5:15": "Als een mens door overtreding ontrouw wordt, en door onwetendheid zondigt tegen de heilige dingen van de HEERE, dan zal hij als zijn schuldoffer aan de HEERE brengen een gaaf ram uit de kudde, naar uw schatting aan zilveren sikkels, gerekend naar de sikkel van het heiligdom, als schuldoffer.", "1 Kron 18:1": "Het gebeurde nu hierna, dat David de Filistijnen sloeg, en hen onderwierp; en hij nam Gath en haar onderhorige plaatsen af van de Filistijnen.", "2 Kron 24:6": "En de koning riep Jojada, het hoofd, en zei tegen hem: Waarom hebt u geen onderzoek gedaan bij de Levieten, dat zij uit Juda en uit Jeruzalem inbrengen zouden de schatting van Mozes, de knecht van de HEERE, en van de gemeente van Israël, voor de tent der getuigenis?", "2 Kon 12:7-9": "Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "2 Kon 12:4-18": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE, Zullen de priesters tot zich nemen, ieder van zijn bekende; en zij zullen de breuken van het huis herstellen, naar alles wat er voor breuk gevonden zal worden. Maar het gebeurde in het drieëntwintigste jaar van koning Joas, dat de priesters de breuken van het huis niet hersteld hadden.", "2 Kron 24:11": "Het gebeurde nu ter tijd, als hij de kist, naar het bevel van de koning, door de hand van de Levieten inbracht, en als zij zagen dat er veel van het geld was, dat de schrijver van de koning kwam, en de gestelde van de hoofdpriester, en de kist leegmaakten, en die opnamen, en die terugbrachten naar haar plaats; zo deden zij van dag tot dag, en verzamelden geld in overvloed;", "2 Kon 12:1-21": "In het zevende jaar van Jehu werd Joas koning, en hij regeerde veertig jaren te Jeruzalem; en de naam van zijn moeder was Zibja van Ber-seba. En Joas deed wat recht was in de ogen van de HEERE, al zijn dagen, waarin de priester Jojada hem onderwees. Zeker werden de hoogten niet weggenomen; het volk offerde en rookte nog op de hoogten.", "2 Kon 12:10-12": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd. En zij gaven het geld, goed gewogen, in handen van hen die het werk verzorgden en die aangesteld waren over het huis van de HEERE; en zij betaalden daarmee de timmerlieden en de bouwlieden die het huis van de HEERE herstelden; En de metselaars en de steenhouwers, en om hout en gehouwen stenen te kopen, om de breuken van het huis van de HEERE te herstellen, en voor alles wat uitgegeven werd voor het huis, om dat te herstellen.", "Gen 17:27": "En alle mannen van zijn huis, degenen die in het huis geboren waren, en degenen die met geld gekocht waren, van de vreemdeling af, werden met hem besneden.", "Richt 9:6": "Toen verzamelden zich alle burgers van Sichem, en het hele huis van Millo, en gingen heen en maakten Abimelech tot koning, bij de hoge eik die bij Sichem is.", "Ezra 8:25-28": "En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis van onze God die de koning en zijn raadsheren, en zijn vorsten, en heel Israël, die daar gevonden werden, geofferd hadden; ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten; en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.", "1 Kor 4:2": "En verder wordt van de uitdelers vereist, dat ieder getrouw bevonden wordt.", "Jer 38:14": "Toen zond de koning Zedekia iemand, en liet de profeet Jeremia bij zich halen, bij de derde ingang die aan het huis van de HEERE was; en de koning zei tegen Jeremia: Ik zal u iets vragen, verberg niets voor mij.", "Est 8:9": "Toen werden de schrijvers van de koning geroepen, op datzelfde moment, in de derde maand (dat is de maand Sivan), op de drieëntwintigste daarvan, en er werd geschreven naar alles wat Mordechai gebood, aan de Joden, en aan de stadhouders, en landvoogden, en leiders van de landschappen, die van Indië af tot aan Morenland reiken, honderdzevenentwintig landschappen, ieder landschap naar zijn eigen schrift, ieder volk naar zijn eigen taal; ook aan de Joden naar hun schrift en naar hun taal.", "2 Kon 8:29": "Toen keerde koning Joram terug, om zich in Jizreël te laten genezen van de verwondingen die de Syriërs hem in Rama toegebracht hadden, toen hij tegen Hazaël, de koning van Syrië, streed; en Ahazia, de zoon van Jehoram, de koning van Juda, kwam naar Jizreël om Joram, de zoon van Achab, te bezoeken, want hij was ziek.", "2 Kron 24:10": "Toen verblijdden zich alle leiders en al het volk, en zij brachten in en wierpen in de kist, totdat men klaar was.", "Ex 21:21": "Als hij echter een dag of twee dagen overeind blijft, zal hij niet gewroken worden; want hij is zijn eigen geld waard.", "Deut 2:6": "Voedsel zult u voor geld van hen kopen, dat u eet; en ook zult u water voor geld van hen kopen, dat u drinkt.", "1 Kon 7:51": "Zo werd al het werk voltooid dat koning Salomo voor het huis van de HEERE maakte. Daarna bracht Salomo de geheiligde dingen van zijn vader David: het zilver, het goud, en de voorwerpen legde hij bij de schatten van het huis van de HEERE.", "Richt 19:18": "En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "2 Kon 13:3-7": "Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen. Doch Joahaz bad het aangezicht van de HEERE met ernst aan; en de HEERE verhoorde hem; want Hij zag de verdrukking van Israël, dat de koning van Syrië hen verdrukte. (Zo gaf de HEERE Israël een verlosser, zodat zij van onder de hand van de Syriërs uitkwamen; en de kinderen van Israël woonden in hun tenten, zoals voorheen.", "2 Kon 8:23": "Het overige van de geschiedenis van Joram, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "1 Kon 2:39": "Maar het gebeurde na drie jaar, dat twee knechten van Simeï wegliepen naar Achis, de zoon van Maächa, de koning van Gath; en men liet het Simeï weten en zei: Zie, uw knechten zijn in Gath.", "2 Kron 34:15": "En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek.", "2 Kon 11:2": "Maar Joseba, de dochter van koning Joram, de zuster van Ahazia, nam Joas, de zoon van Ahazia, en stal hem uit het midden van de zonen van de koning die gedood werden. Zij zette hem en zijn voedster in een slaapkamer en verborg hem voor Athalia, zodat hij niet gedood werd.", "2 Kon 20:8": "Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan?", "Ex 25:1": "Toen sprak de HEERE tot Mozes en zei:", "2 Kon 11:1": "Toen Athalia, de moeder van Ahazia, zag dat haar zoon dood was, maakte zij zich op en bracht al het koninklijke nageslacht om.", "Gen 17:23": "Toen nam Abraham zijn zoon Ismaël, en alle mannen die in zijn huis geboren waren, en alle die met zijn geld gekocht waren, alles wat mannelijk was onder de mensen van het huis van Abraham, en hij besneed het vlees van hun voorhuid, op diezelfde dag, zoals God met hem gesproken had.", "2 Kon 11:19": "En hij nam de leiders van honderd, en de hoofdmannen, en de lijfwacht, en al het volk van het land; en zij brachten de koning af uit het huis van de HEERE, en kwamen door de weg van de poort van de lijfwacht naar het huis van de koning, en hij zat op de troon der koningen.", "Richt 16:18": "Toen Delila nu zag, dat hij haar zijn hele hart bekend had gemaakt, zond zij mensen weg, en riep de vorsten van de Filistijnen, en zei: Komt ditmaal, want hij heeft mij zijn hele hart bekendgemaakt. En de vorsten van de Filistijnen kwamen naar haar toe, en brachten dat geld in hun hand.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Jer 32:10": "En ik ondertekende de brief en verzegelde hem, en liet het door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had.", "Mal 1:10": "Wie is er ook onder u, die de deuren voor niets toesluit? En u steekt het vuur niet aan op Mijn altaar voor niets. Ik heb geen behagen in u, zegt de HEERE van de heerscharen, en het spijsoffer is Mij van uw hand niet aangenaam.", "Matt 27:6": "En de overpriesters namen de zilverstukken en zeiden: Het is niet toegestaan die in de offerkist te leggen, omdat het een prijs van bloed is.", "Matt 25:27": "Dan had u mijn geld naar de wisselaars moeten brengen, en zou ik bij mijn komst het mijne met rente teruggekregen hebben.", "1 Kron 29:17": "En ik weet, mijn God, dat U het hart beproeft, en dat U een welgevallen hebt aan oprechtheid. Ik heb in oprechtheid van mijn hart al deze dingen vrijwillig gegeven, en ik heb nu met vreugde Uw volk, dat hier aanwezig is, gezien, dat het zich tegenover U vrijwillig gedragen heeft."}, "noten": {"1": "SV: sprengbekkens"}, "koppeling": {"1": "In <span class=\"wl\" data-l=\"L1\" data-code=\"H7651\">het</span> \" data-code=\"H1\">zijn</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H1\">vaderen</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H1\">in</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H5892\">de</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H5892\">stad</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H5892\">van</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H1732\">David</span>; <span class=\"wl\" data-l=\"L15\" data-code=\"H558\">en</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H558\">Amazia</span>, <span class=\"wl\" data-l=\"L15\" data-code=\"H558\">zijn</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H1121\">zoon</span>, <span class=\"wl\" data-l=\"L16\" data-code=\"H1121\">werd</span> <span class=\"wl\" data-l=\"L17\" data-code=\"H4427\">koning</span> <span class=\"wl\" data-l=\"L17\" data-code=\"H4427\">in</span> <span class=\"wl\" data-l=\"L18\" data-code=\"H8478\">zijn</span> <span class=\"wl\" data-l=\"L18\" data-code=\"H8478\">plaats</span>."}, "koppeling_kjv": {"1": "In the <span class=\"wl wl-kjv\" data-code=\"H7651\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H3060\">Jehoash</span> began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign;</span> and <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> he in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H6645\">Zibiah</span> of <span class=\"wl wl-kjv\" data-code=\"H884\">Beersheba.</span>", "2": "And <span class=\"wl wl-kjv\" data-code=\"H3060\">Jehoash</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> all his <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> wherein <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H3384\">instructed</span> him.", "3": "But the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> were not taken <span class=\"wl wl-kjv\" data-code=\"H5493\">away:</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> still <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificed</span> and burnt <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> in the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places.</span>", "4": "And <span class=\"wl wl-kjv\" data-code=\"H3060\">Jehoash</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> All the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of the dedicated <span class=\"wl wl-kjv\" data-code=\"H6944\">things</span> that is <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> even the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> that <span class=\"wl wl-kjv\" data-code=\"H5674\">passeth</span> the account, the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that every <span class=\"wl wl-kjv\" data-code=\"H5315\">man</span> is set <span class=\"wl wl-kjv\" data-code=\"H6187\">at,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that <span class=\"wl wl-kjv\" data-code=\"H5927\">cometh</span> into any <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span>", "5": "Let the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> it to them, every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of his <span class=\"wl wl-kjv\" data-code=\"H4378\">acquaintance:</span> and let them <span class=\"wl wl-kjv\" data-code=\"H2388\">repair</span> the <span class=\"wl wl-kjv\" data-code=\"H919\">breaches</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> wheresoever any <span class=\"wl wl-kjv\" data-code=\"H919\">breach</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4672\">found.</span>", "6": "But it was so, that in the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3060\">Jehoash</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> had not <span class=\"wl wl-kjv\" data-code=\"H2388\">repaired</span> the <span class=\"wl wl-kjv\" data-code=\"H919\">breaches</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>", "7": "Then <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3060\">Jehoash</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and the other <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Why <span class=\"wl wl-kjv\" data-code=\"H2388\">repair</span> ye not the <span class=\"wl wl-kjv\" data-code=\"H919\">breaches</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house?</span> now therefore <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> no more <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of your <span class=\"wl wl-kjv\" data-code=\"H4378\">acquaintance,</span> but <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> it for the <span class=\"wl wl-kjv\" data-code=\"H919\">breaches</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>", "8": "And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H225\">consented</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> <span class=\"wl wl-kjv\" data-code=\"H1115\">no</span> more <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H1115\">neither</span> to <span class=\"wl wl-kjv\" data-code=\"H2388\">repair</span> the <span class=\"wl wl-kjv\" data-code=\"H919\">breaches</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>", "9": "But <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H727\">chest,</span> and <span class=\"wl wl-kjv\" data-code=\"H5344\">bored</span> a <span class=\"wl wl-kjv\" data-code=\"H2356\">hole</span> in the <span class=\"wl wl-kjv\" data-code=\"H1817\">lid</span> of it, and <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> it <span class=\"wl wl-kjv\" data-code=\"H681\">beside</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> on the right <span class=\"wl wl-kjv\" data-code=\"H3225\">side</span> as <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> that <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H5592\">door</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> therein all the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that was <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>", "10": "And it was so, when they <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that there was <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> in the <span class=\"wl wl-kjv\" data-code=\"H727\">chest,</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe</span> and the <span class=\"wl wl-kjv\" data-code=\"H1419\">high</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and they put up in <span class=\"wl wl-kjv\" data-code=\"H6696\">bags,</span> and <span class=\"wl wl-kjv\" data-code=\"H4487\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that was <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>", "11": "And they <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> the <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> being <spa "H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5592\">bowls</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> <span class=\"wl wl-kjv\" data-code=\"H4212\">snuffers,</span> <span class=\"wl wl-kjv\" data-code=\"H4219\">basons,</span> <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpets,</span> any <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> or <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> of the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that was <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span>", "14": "But they <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> that to the <span class=\"wl wl-kjv\" data-code=\"H4399\">workmen,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">repaired</span> therewith the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>", "15": "Moreover they <span class=\"wl wl-kjv\" data-code=\"H2803\">reckoned</span> not with the <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> into whose <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> they <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> to be <span class=\"wl wl-kjv\" data-code=\"H5414\">bestowed</span> on <span class=\"wl wl-kjv\" data-code=\"H4399\">workmen:</span> for they <span class=\"wl wl-kjv\" data-code=\"H6213\">dealt</span> <span class=\"wl wl-kjv\" data-code=\"H530\">faithfully.</span>", "16": "The <span class=\"wl wl-kjv\" data-code=\"H817\">trespass</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> and <span class=\"wl wl-kjv\" data-co /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
