deed wat recht was in de ogen van de HEERE, al zijn dagen, waarin de priester Jojada hem onderwees.", "3": "Zeker werden de hoogten niet weggenomen; het volk offerde en rookte nog op de hoogten.", "4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, *te weten* het geld van hem die overgaat *tot de getelden*, het geld van ieder man *naar* zijn schatting, *en* al het geld, dat in het hart van ieder komt, om *dat* te brengen in het huis van de HEERE,", "5": "Zullen de priesters tot zich nemen, ieder van zijn bekende; en zij zullen de breuken van het huis herstellen, naar alles wat er voor breuk gevonden zal worden.", "6": "Maar het gebeurde in het drieëntwintigste jaar van koning Joas, dat de priesters de breuken van het huis niet hersteld hadden.", "7": "Toen riep koning Joas de priester Jojada en de *andere* priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis.", "8": "En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen.", "9": "Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "11": "En zij gaven het geld, goed gewogen, in handen van hen die het werk verzorgden en die aangesteld waren over het huis van de HEERE; en zij betaalden daarmee de timmerlieden en de bouwlieden die het huis van de HEERE herstelden;", "12": "En de metselaars en de steenhouwers, en om hout en gehouwen stenen te kopen, om de breuken van het huis van de HEERE te herstellen, en voor alles wat uitgegeven werd voor het huis, om dat te herstellen.", "13": "Toch werden er voor het huis van de HEERE geen zilveren schalen, gaffelen, sprenkelschalen, trompetten, of enig gouden of zilveren voorwerp gemaakt, van het geld dat naar het huis van de HEERE gebracht werd.", "14": "Maar zij gaven dat aan hen die het werk deden; en zij herstelden daarmee het huis van de HEERE.", "15": "Daarbij eisten zij geen rekening van de mannen aan wie zij dat geld in hun handen gaven om aan hen die het werk deden te betalen; want zij handelden trouw.", "16": "Het geld van het schuldoffer en het geld van de zondoffers werd niet naar het huis van de HEERE gebracht; het was voor de priesters.", "17": "Toen trok Hazaël, de koning van Syrië, op, en streed tegen Gath, en nam het in; daarna richtte Hazaël zijn gezicht om tegen Jeruzalem op te trekken.", "18": "Maar Joas, de koning van Juda, nam al de geheiligde dingen die Josafat, en Joram, en Ahazia, zijn vaderen, de koningen van Juda, geheiligd hadden, en zijn eigen geheiligde dingen, en al het goud dat gevonden werd in de schatten van het huis van de HEERE en van het huis van de koning, en zond het aan Hazaël, de koning van Syrië; toen trok hij weg van Jeruzalem.", "19": "Het overige nu van de geschiedenis van Joas, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "20": "En zijn knechten stonden op, en smeedden een samenzwering, en sloegen Joas dood in het huis van Millo, dat afdaalt naar Silla;", "21": "Want Jozacar, de zoon van Simeath, en Jozabad, de zoon van Somer, zijn knechten, sloegen hem, zodat hij stierf; en zij begroeven hem bij zijn vaderen in de stad van David; en Amazia, zijn zoon, werd koning in zijn plaats."}, "SV": {"1": "In het zevende jaar van Jehu werd Joas koning, en regeerde veertig jaren te Jeruzalem; en de naam zijner moeder was Zibja van Ber-seba.", "2": "En Joas deed dat recht was in de ogen des HEEREN, al zijn dagen, in dewelke de priester Jojada hem onderwees.", "3": "Alleenlijk werden de hoogten niet weggenomen; het volk offerde en rookte nog op de hoogten.", "4": "En Joas zeide tot de priesteren: Al het geld der geheiligde dingen, dat gebracht zal worden in het huis des HEEREN, *te* *weten* het geld desgenen, die overgaat *tot* *de* *getelden*, het geld van een ieder der personen *naar* zijn schatting, *en* al het geld, dat in ieders hart komt, om *dat* te brengen in het huis des HEEREN,", "5": "Zullen de priesters tot zich nemen, een ieder van zijn bekende; en zij zullen de breuken van het huis verbeteren, naar alles wat er voor breuk bevonden zal worden.", "6": "Maar het geschiedde in het drie en twintigste jaar van den koning Joas, dat de priesters de breuken van het huis niet gebeterd hadden.", "7": "Toen riep de koning Joas den priester Jojada en de *andere* priesteren, en zeide tot hen: Waarom betert gijlieden niet de breuken van het huis? Nu dan, neemt geen geld van uw bekenden, dat gij het zoudt geven voor de breuken van het huis.", "8": "En de priesters bewilligden van het volk geen geld te nemen, noch de breuken van het huis te verbeteren.", "9": "Maar de priester Jojada nam een kist, en boorde een gat in haar deksel, en zette die bij het altaar ter rechterhand, als iemand inkwam in het huis des HEEREN; en de priesters, die den dorpel bewaarden, staken daarin al het geld, dat ten huize des HEEREN gebracht werd.", "10": "Het geschiedde nu, als zij zagen, dat veel gelds in de kist was, dat des konings schrijver met den hogepriester opkwam, en zij bonden het samen, en telden het geld, dat in het huis des HEEREN gevonden werd.", "11": "En zij gaven het geld wel gewogen in handen der verzorgers van dat werk, die gesteld waren over het huis des HEEREN; en zij besteedden het uit aan de timmerlieden en aan de bouwlieden, die het huis des HEEREN vermaakten;", "12": "En aan de metselaren, en aan de steenhouwers, en om hout en gehouwen stenen te kopen, om de breuken van het huis des HEEREN te verbeteren, en voor al wat uitgegeven werd voor het huis, om *dat* te beteren.", "13": "Evenwel werden niet gemaakt voor het huis des HEEREN zilveren schalen, gaffelen, sprengbekkens, trompetten, *noch* enig gouden vat, of zilveren vat, van het geld, dat ten huize des HEEREN gebracht werd.", "14": "Maar zij gaven dat aan degenen, die het werk deden; en zij verbeterden daarmede het huis des HEEREN.", "15": "Daartoe eisten zij geen rekening van de mannen, wien zij dat geld in hun handen gaven, om aan degenen, die het werk deden, te geven; want zij handelden trouwelijk.", "16": "Het geld van schuldoffer, en het geld van zondofferen werd ten huize des HEEREN niet gebracht; het was voor de priesteren.", "17": "Toen trok Hazaël, de koning van Syrië op, en krijgde tegen Gath, en nam haar in; daarna stelde Hazaël zijn aangezicht, om tegen Jeruzalem op te trekken.", "18": "Maar Joas, de koning van Juda, nam al de geheiligde dingen, die Josafat, en Joram, en Ahazia, zijn vaderen, de koningen van Juda, geheiligd hadden, en zijn geheiligde dingen, en al het goud, dat gevonden werd in de schatten van het huis des HEEREN, en van het huis des konings, en zond het tot Hazaël, den koning van Syrië; toen trok hij op van Jeruzalem.", "19": "Het overige nu der geschiedenissen van Joas, en al wat hij gedaan heeft, is dat niet geschreven in het boek der kronieken der koningen van Juda?", "20": "En zijn knechten stonden op, en maakten een verbintenis, en sloegen Joas, in het huis van Millo, dat afgaat naar Silla;", "21": "Want Jozacar, de zoon van Simeath, en Jozabad, de zoon van Somer, zijn knechten, sloegen hem, dat hij stierf; en zij begroeven hem met zijn vaderen in de stad Davids; en Amazia, zijn zoon, werd koning in zijn plaats."}, "KJV": {"1": "In the seventh year of Jehu Jehoash began to reign; and forty years reigned he in Jerusalem. And his mother's name was Zibiah of Beersheba.", "2": "And Jehoash did that which was right in the sight of the LORD all his days wherein Jehoiada the priest instructed him.", "3": "But the high places were not taken away: the people still sacrificed and burnt incense in the high places.", "4": "And Jehoash said to the priests, All the money of the dedicated things that is brought into the house of the LORD, even the money of every one that passeth the account, the money that every man is set at, and all the money that cometh into any man's heart to bring into the house of the LORD,", "5": "Let the priests take it to them, every man of his acquaintance: and let them repair the breaches of the house, wheresoever any breach shall be found.", "6": "But it was so, that in the three and twentieth year of king Jehoash the priests had not repaired the breaches of the house.", "7": "Then king Jehoash called for Jehoiada the priest, and the other priests, and said unto them, Why repair ye not the breaches of the house? now therefore receive no more money of your acquaintance, but deliver it for the breaches of the house.", "8": "And the priests consented to receive no more money of the people, neither to repair the breaches of the house.", "9": "But Jehoiada the priest took a chest, and bored a hole in the lid of it, and set it beside the altar, on the right side as one cometh into the house of the LORD: and the priests that kept the door put therein all the money that was brought into the house of the LORD.", "10": "And it was so, when they saw that there was much money in the chest, that the king's scribe and the high priest came up, and they put up in bags, and told the money that was found in the house of the LORD.", "11": "And they gave the money, being told, into the hands of them that did the work, that had the oversight of the house of the LORD: and they laid it out to the carpenters and builders, that wrought upon the house of the LORD,", "12": "And to masons, and hewers of stone, and to buy timber and hewed stone to repair the breaches of the house of the LORD, and for all that was laid out for the house to repair it.", "13": "Howbeit there were not made for the house of the LORD bowls of silver, snuffers, basons, trumpets, any vessels of gold, or vessels of silver, of the money that was brought into the house of the LORD:", "14": "But they gave that to the workmen, and repaired therewith the house of the LORD.", "15": "Moreover they reckoned not with the men, into whose hand they delivered the money to be bestowed on workmen: for they dealt faithfully.", "16": "The trespass money and sin money was not brought into the house of the LORD: it was the priests'.", "17": "Then Hazael king of Syria went up, and fought against Gath, and took it: and Hazael set his face to go up to Jerusalem.", "18": "And Jehoash king of Judah took all the hallowed things that Jehoshaphat, and Jehoram, and Ahaziah, his fathers, kings of Judah, had dedicated, and his own hallowed things, and all the gold that was found in the treasures of the house of the LORD, and in the king's house, and sent it to Hazael king of Syria: and he went away from Jerusalem.", "19": "And the rest of the acts of Joash, and all that he did, are they not written in the book of the chronicles of the kings of Judah?", "20": "And his servants arose, and made a conspiracy, and slew Joash in the house of Millo, which goeth down to Silla.", "21": "For Jozachar the son of Shimeath, and Jehozabad the son of Shomer, his servants, smote him, and he died; and they buried him with his fathers in the city of David: and Amaziah his son reigned in his stead."}}, "tsk": {"1": [{"kopje": "zevende", "refs": ["2 Kon 9:27", "2 Kon 11:1", "2 Kon 11:3", "2 Kon 11:4", "2 Kon 11:21", "2 Kron 24:1-14"]}, {"kopje": "Joas", "refs": ["2 Kon 11:2", "1 Kron 3:11"]}], "4": [{"kopje": "zei tegen de priesters", "refs": ["2 Kon 22:4", "2 Kron 29:4-11", "2 Kron 35:2"]}, {"kopje": "het geld", "refs": ["2 Kon 12:18", "1 Kon 7:1", "1 Kron 18:11", "2 Kron 15:18", "2 Kron 31:12"]}, {" , "href": "../../2-koningen/12/#v21", "ref": "2 Kon 12:21", "svLabel": null}, {"disp": "2 Kron 24:26", "href": "../../2-kronieken/24/#v26", "ref": "2 Kron 24:26", "svLabel": null}], "kinderen": []}]}, {"topic": "Shimrith", "href": "../../nave/s/#t-shimrith", "kinderen": [{"label": "Called Shomer", "href": "../../nave/s/?hl=2Kgs.12.21#i18905", "refs": [{"disp": "2 Kon 12:21", "href": "../../2-koningen/12/#v21", "ref": "2 Kon 12:21", "svLabel": null}], "kinderen": []}]}, {"topic": "Zabad", "href": "../../nave/z/#t-zabad", "kinderen": [{"label": "4. An assassin of King Joash", "href": "../../nave/z/?hl=2Kgs.12.21#i22403", "refs": [], "kinderen": [{"label": "Called Jozachar in", "href": "../../nave/z/?hl=2Kgs.12.21#i22404", "refs": [{"disp": "2 Kon 12:21", "href": "../../2-koningen/12/#v21", "ref": "2 Kon 12:21", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ezra 7:27": "Geloofd zij de HEERE, de God van onze vaderen, Die zoiets in het hart van de koning gegeven heeft, om het huis van de HEERE te versieren, dat te Jeruzalem is.", "Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "Lev 5:16": "Zo zal hij vergoeden wat hij, onwetend, tekortgedaan heeft aan de heilige dingen, en zal daarbij een vijfde deel toevoegen, dat hij aan de priester geven zal; zo zal de priester met de ram van het schuldoffer voor hem verzoening doen, en het zal hem vergeven worden.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "2 Kon 22:6": "Aan de timmerlieden en de bouwlieden, en de metselaars, en om hout en gehouwen stenen te kopen, om het huis te herstellen.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "1 Kron 15:24": "En Sebanja, en Josafat, en Nethaneel, en Amasai, en Zecharja, en Benaja, en Eliëzer, de priesters, bliezen op trompetten voor de ark van God; en Obed-edom en Jehia waren poortwachters van de ark.", "Ezra 5:8": "De koning zij bekend, dat wij naar het landschap Juda getrokken zijn, naar het huis van de grote God, dat gebouwd wordt met grote stenen, en het hout wordt gelegd in de wanden; en dat werk wordt snel gedaan en gaat voorspoedig door hun handen voort.", "Luk 9:51": "En het gebeurde, toen de dagen van Zijn opneming vervuld werden, dat Hij vastbesloten Zijn gezicht richtte om naar Jeruzalem te reizen.", "2 Kron 8:16": "Zo werd al het werk van Salomo klaargemaakt, tot de dag van de grondlegging van het huis van de HEERE, en tot het voltooien ervan, zodat het huis van de HEERE volmaakt werd.", "2 Kon 22:12": "En de koning gebood Hilkia, de priester, en Ahikam, de zoon van Safan, en Achbor, de zoon van Michaja, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei:", "Num 3:48-51": "En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten. Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten. Van de eerstgeborenen van de kinderen van Israël nam hij dat geld, duizend driehonderdvijfenzestig sikkels, naar de sikkel van het heiligdom.", "Joh 8:20": "Deze woorden sprak Jezus bij de schatkist, terwijl Hij leerde in de tempel; en niemand greep Hem, want Zijn uur was nog niet gekomen.", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Jer 52:18": "Ook namen zij de potten, en de schoffels, en de gaffels, en de sprenkelschalen, en de rookschalen, en al de koperen vaten waarmee men de dienst deed.", "Ex 21:11": "En als hij haar deze drie dingen niet doet, zal zij om niet uitgaan, zonder geld.", "Mark 14:11": "En zij, die dit hoorden, waren verblijd, en beloofden hem geld te geven; en hij zocht hoe hij Hem op een geschikt moment kon overleveren.", "Lev 27:15": "En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.", "Luk 19:23": "Waarom hebt u dan mijn geld niet bij de bank gebracht, zodat ik het bij mijn komst met rente had kunnen opeisen?", "2 Kron 24:8-11": "En de koning gebood, en zij maakten een kist, en zetten die buiten aan de poort van het huis van de HEERE. En men liet omroepen in Juda en in Jeruzalem, dat men de HEERE inbrengen zou de schatting van Mozes, de knecht van God, over Israël in de woestijn. Toen verblijdden zich alle leiders en al het volk, en zij brachten in en wierpen in de kist, totdat men klaar was.", "Jer 36:5": "En Jeremia gebood Baruch: Ik word tegengehouden, ik zal niet in het huis van de HEERE kunnen gaan.", "1 Kon 5:18": "En de bouwlieden van Salomo, en de bouwlieden van Hiram, en de Giblieten behieuwen ze, en bereidden het hout toe, en de stenen, om dat huis te bouwen.", "Matt 24:45": "Wie is dan de trouwe en verstandige dienstknecht, aan wie zijn heer het gezag over zijn huisbedienden gegeven heeft, om hun op de juiste tijd voedsel te geven?", "1 Kon 10:25": "En zij brachten ieder zijn geschenk, zilveren vaten, en gouden vaten, en klederen, en wapenrusting, en specerijen, paarden en muilezels, elk jaar opnieuw.", "Deut 14:25": "Zo maak het tot geld, en bind het geld in uw hand, en ga naar de plaats die de HEERE, uw God, zal uitkiezen;", "2 Kron 36:14": "Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "2 Kron 34:11": "Want zij gaven het aan de werkmeesters en de bouwlieden, om gehouwen stenen te kopen, en hout voor de verbindingen, en om de huizen te voorzien van vloeren en balken, die de koningen van Juda hadden laten vervallen.", "Jer 20:1": "Toen Pashur, de zoon van Immer, de priester (deze was aangesteld als voorganger in het huis van de HEERE), Jeremia hoorde deze woorden profeteren,", "2 Kon 12:4-14": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE, Zullen de priesters tot zich nemen, ieder van zijn bekende; en zij zullen de breuken van het huis herstellen, naar alles wat er voor breuk gevonden zal worden. Maar het gebeurde in het drieëntwintigste jaar van koning Joas, dat de priesters de breuken van het huis niet hersteld hadden.", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "2 Kron 23:1": "Maar in het zevende jaar bemoedigde Jojada zich, en hij nam de leiders van de honderdtallen, Azarja, de zoon van Jeroham, en Ismaël, de zoon van Johanan, en Azarja, de zoon van Obed, en Maaseja, de zoon van Adaja, en Elisafat, de zoon van Zichri, met zich in een verbond.", "Lev 5:15-18": "Als een mens door overtreding ontrouw wordt, en door onwetendheid zondigt tegen de heilige dingen van de HEERE, dan zal hij als zijn schuldoffer aan de HEERE brengen een gaaf ram uit de kudde, naar uw schatting aan zilveren sikkels, gerekend naar de sikkel van het heiligdom, als schuldoffer. Zo zal hij vergoeden wat hij, onwetend, tekortgedaan heeft aan de heilige dingen, en zal daarbij een vijfde deel toevoegen, dat hij aan de priester geven zal; zo zal de priester met de ram van het schuldoffer voor hem verzoening doen, en het zal hem vergeven worden. En als een mens zondigt, en doet tegen een van alle geboden van de HEERE wat niet gedaan mag worden, ook al heeft hij het niet geweten, toch is hij schuldig, en zal zijn ongerechtigheid dragen.", "Luk 21:1": "En toen Hij omhoogkeek, zag Hij de rijken hun gaven in de schatkist werpen.", "2 Kron 15:18": "En hij bracht in het huis van God de geheiligde dingen van zijn vader, en zijn eigen geheiligde dingen, zilver en goud, en voorwerpen.", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "2 Kron 33:24": "En zijn knechten smeedden een samenzwering tegen hem, en doodden hem in zijn huis.", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "2 Kron 24:7-14": "Want toen Athalia goddeloos handelde, hadden haar zonen het huis van God opengebroken, ja, zelfs alle geheiligde dingen van het huis van de HEERE besteed aan de Baäls. En de koning gebood, en zij maakten een kist, en zetten die buiten aan de poort van het huis van de HEERE. En men liet omroepen in Juda en in Jeruzalem, dat men de HEERE inbrengen zou de schatting van Mozes, de knecht van God, over Israël in de woestijn.", "2 Kon 18:18": "En zij riepen naar de koning; toen ging tot hen uit Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier.", "Ex 34:1": "Toen zei de HEERE tegen Mozes: Houw u twee stenen tafelen, gelijk de eerste waren, zo zal Ik op de tafelen dezelfde woorden schrijven, die op de eerste tafelen geweest zijn, die u gebroken hebt.", "Gen 47:14-18": "Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao. Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op. En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.", "2 Kon 11:4": "In het zevende jaar zond Jojada, en nam de leiders van honderd met de hoofdmannen en met de lijfwacht, en hij bracht hen bij zich, in het huis van de HEERE; en hij sloot een verbond met hen en beëdigde hen in het huis van de HEERE, en hij toonde hun de zoon van de koning.", "1 Kon 21:2": "Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven.", "1 Kon 6:37": "In het vierde jaar werd de grond van het huis van de HEERE gelegd, in de maand Ziv;", "1 Kron 26:27": "Van de oorlogen en van de buit hadden zij het geheiligd, om het huis van de HEERE te onderhouden.", "Matt 28:15": "En zij namen het geld, en deden zoals hun geleerd was. En dit verhaal is onder de Joden verspreid geraakt tot op deze huidige dag.", "Jes 58:12": "En zij die uit u voortkomen, zullen de oude verwoeste plaatsen bouwen; de fundamenten, van geslacht tot geslacht verwoest, zult u oprichten; en u zult genoemd worden: Die de bressen dichtmuurt, die de paden weer opmaakt, om te bewonen.", "Num 10:2": "Maak u twee zilveren trompetten; van dicht werk zult u ze maken; en zij zullen u zijn tot de heilige samenkomst en tot het optrekken van de legers.", "Ex 22:7": "Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven.", "Jer 17:26": "En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Richt 5:19": "De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan.", "2 Kon 14:5": "Het gebeurde toen het koninkrijk in zijn hand versterkt was, dat hij zijn knechten sloeg, die de koning, zijn vader, hadden gedood,", "2 Kron 24:7": "Want toen Athalia goddeloos handelde, hadden haar zonen het huis van God opengebroken, ja, zelfs alle geheiligde dingen van het huis van de HEERE besteed aan de Baäls.", "2 Kron 24:6-14": "En de koning riep Jojada, het hoofd, en zei tegen hem: Waarom hebt u geen onderzoek gedaan bij de Levieten, dat zij uit Juda en uit Jeruzalem inbrengen zouden de schatting van Mozes, de knecht van de HEERE, en van de gemeente van Israël, voor de tent der getuigenis? Want toen Athalia goddeloos handelde, hadden haar zonen het huis van God opengebroken, ja, zelfs alle geheiligde dingen van het huis van de HEERE besteed aan de Baäls. En de koning gebood, en zij maakten een kist, en zetten die buiten aan de poort van het huis van de HEERE.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "2 Kon 18:37": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, tot Hizkia, met gescheurde kleren; en zij maakten hem de woorden van Rabsake bekend.", "Hand 7:16": "En zij werden overgebracht naar Sichem, en gelegd in het graf, dat Abraham gekocht had voor een som geld, van de zonen van Hemor, de vader van Sichem.", "Jes 56:10-12": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief. En deze honden zijn sterk van begeerte, zij kunnen niet verzadigd worden, ja, het zijn herders die niets kunnen begrijpen; zij keren zich allemaal naar hun eigen weg, ieder naar zijn eigen winst, elk uit zijn eigen hoek. Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger.", "1 Kon 2:40": "Toen maakte Simeï zich klaar, en zadelde zijn ezel, en ging naar Gath, naar Achis, om zijn knechten te zoeken; zo ging Simeï, en bracht zijn knechten terug uit Gath.", "1 Kron 22:11": "Nu, mijn zoon, de HEERE zal met u zijn, en u zult voorspoedig zijn, en u zult het huis van de HEERE, van uw God, bouwen, zoals Hij van u gesproken heeft.", "1 Kon 8:10": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.", "1 Kron 18:10": "zond hij zijn zoon Hadoram naar koning David, om naar zijn welzijn te vragen en om hem te feliciteren, omdat hij tegen Hadar-ezer gestreden en hem verslagen had (want Hadar-ezer voerde oorlog tegen Thou), en met hem allerlei gouden, zilveren en koperen voorwerpen.", "1 Kon 21:6": "En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven.", "Luk 16:1": "En Hij zei ook tegen Zijn discipelen: Er was een zeker rijk mens, die een rentmeester had; en deze werd bij hem beschuldigd, dat hij zijn goederen verkwistte.", "Ezra 6:5": "Daarbij moet men ook de gouden en zilveren vaten van het huis van God, die Nebukadnezar uit de tempel die te Jeruzalem was heeft weggevoerd en naar Babel gebracht, teruggeven, zodat zij teruggaan naar de tempel die te Jeruzalem is, ieder naar zijn plaats, en men zal ze brengen naar het huis van God.", "Deut 10:1": "In die tijd zei de HEERE tegen mij: Houw u twee stenen platen, zoals de eerste, en klim naar Mij op deze berg; daarna zult u zich een kist van hout maken.", "Matt 25:18": "Maar hij die het ene ontvangen had, ging weg en groef in de aarde, en verborg het geld van zijn heer.", "1 Sam 1:24": "Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.", "Ezra 1:6": "Allen nu die rondom hen waren, ondersteunden hen met zilveren voorwerpen, met goud, met bezit, en met vee, en met kostbaarheden; behalve alles wat vrijwillig gegeven werd.", "Num 5:8-10": "Maar als die man geen losser zal hebben om de schuld aan hem weer uit te keren, zal die schuld, die aan de HEERE weer uitgekeerd wordt, van de priester zijn; behalve de ram van de verzoening, waarmee hij voor hem verzoening doen zal. Evenzo zal alle heffing van alle geheiligde dingen van de kinderen van Israël, die zij tot de priester brengen, van hem zijn. En ieders geheiligde dingen zullen van hem zijn; wat iemand de priester zal gegeven hebben, zal van hem zijn.", "Neh 7:2": "En ik gaf bevel aan mijn broer Hanani, en aan Hananja, de leider van de burcht in Jeruzalem, want hij was een man van trouw, en godvrezend boven velen.", "Jer 28:5": "Toen zei de profeet Jeremia tegen de profeet Hananja, voor de ogen van de priesters en voor de ogen van het hele volk, dat in het huis van de HEERE stond;", "Matt 28:12": "En zij kwamen samen met de oudsten, en namen samen een besluit, en gaven de soldaten veel geld,", "Ex 12:44": "Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.", "Matt 27:3-5": "Toen Judas, die Hem verraden had, zag dat Hij veroordeeld was, kreeg hij berouw en heeft hij de dertig zilverstukken aan de overpriesters en de oudsten teruggebracht, en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien. En toen hij de zilverstukken in de tempel geworpen had, vertrok hij; en hij ging heen en verhing zichzelf.", "Dan 11:8": "Ook zal hij hun goden, met hun vorsten, met hun kostbare voorwerpen van zilver en goud, als gevangenen naar Egypte brengen; en hij zal enige jaren langer staande blijven dan de koning van het Noorden.", "Lev 27:18": "Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.", "Jer 26:7": "En de priesters, en de profeten, en al het volk, hoorden Jeremia deze woorden spreken in het huis van de HEERE.", "1 Kon 14:29": "Het overige nu van de geschiedenis van Rehabeam, en alles wat hij gedaan heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "1 Kon 7:9": "Al deze dingen waren van kostbare stenen, naar de maten gehouwen, van binnen en van buiten met de zaag gezaagd; en dat van de fundering tot aan de kroonlijst, een handbreed, en van buiten tot aan de grote voorhof.", "1 Sam 1:7": "En zo deed hij jaar op jaar; van toen af dat zij opging naar het huis van de HEERE, zo tergde zij haar steeds; daarom weende zij en at niet.", "Gen 31:15": "Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.", "2 Kon 25:9": "En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur.", "2 Kon 23:4": "En de koning gebood de hogepriester Hilkia, en de priesters van de tweede rang, en de bewakers van de drempel, dat zij uit de tempel van de HEERE al het gereedschap, dat voor Baäl, en voor het beeld van het bos en voor heel het leger van de hemel gemaakt was, naar buiten zouden brengen; en hij verbrandde dat buiten Jeruzalem in de velden van Kidron, en liet het stof daarvan naar Beth-el brengen.", "2 Kon 10:33": "Vanaf de Jordaan, tegen de opgang van de zon, het gehele land van Gilead, van de Gadieten, en van de Rubenieten, en van de Manassieten; van Aroër, dat aan de beek van Arnon is, en Gilead, en Basan.", "Ezra 5:14": "Ja, de vaten van het huis van God, die van goud en zilver waren, die Nebukadnezar uit de tempel die te Jeruzalem was, had weggenomen en had gebracht in de tempel van Babel, die heeft de koning Kores gehaald uit de tempel van Babel, en ze zijn gegeven aan iemand wiens naam Sesbazar was, die hij tot landvoogd had gesteld.", "Lev 22:11": "Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten.", "2 Kon 25:14": "Zij namen ook de potten, en de schoffels, en de gaffels, en de rookschalen, en al de koperen voorwerpen, waarmee men de dienst verrichtte.", "Ex 35:5": "Neemt van hetgeen dat u hebt, een hefoffer voor de HEERE; ieder wiens hart vrijwillig is, zal het brengen als hefoffer voor de HEERE: goud, en zilver, en koper;", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "1 Sam 2:29": "Waarom trapt u achteruit tegen Mijn slachtoffer en tegen Mijn spijsoffer, dat Ik geboden heb in de woning; en eert u uw zonen meer dan Mij, dat u zich mest van het voornaamste van alle spijsoffers van Mijn volk Israël?", "2 Kron 24:24": "Hoewel het leger van Syrië met weinig mannen kwam, gaf de HEERE toch in hun hand een leger van zeer grote omvang, omdat zij de HEERE, de God van hun vaderen, verlaten hadden; zo voerden zij de oordelen uit tegen Joas.", "Num 7:85": "Een zilveren schotel woog honderddertig sikkels, en een sprenkelschaal zeventig; al het zilver van de vaten was tweeduizend vierhonderd sikkels, naar de sikkel van het heiligdom.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "1 Kron 22:14": "Zie, ik heb in mijn verdrukking voor het huis van de HEERE honderdduizend talenten van het goud bereid, en duizend maal duizend talenten van het zilver; en van het koper en van het ijzer is er geen gewicht, want het is er in overvloed; ik heb ook hout en stenen bereid; voegt u er nog meer aan toe.", "2 Kron 24:9": "En men liet omroepen in Juda en in Jeruzalem, dat men de HEERE inbrengen zou de schatting van Mozes, de knecht van God, over Israël in de woestijn.", "2 Kon 23:2": "En de koning ging op naar het huis van de HEERE, en met hem alle mannen van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van de kleinste tot de grootste; en hij las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was.", "Num 18:9": "Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn.", "Mark 12:41": "En Jezus, gezeten tegenover de schatkist, zag hoe de menigte geld in de schatkist wierp; en veel rijken wierpen er veel daarin.", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "2 Kron 34:12": "En die mannen handelden trouw in dit werk; en de opzichters daarover waren Jahath en Obadja, Levieten uit de kinderen van Merari, alsook Zacharia en Mesullam, uit de kinderen van de Kahathieten, om het werk voort te drijven; en die Levieten waren allen kundig op muziekinstrumenten.", "2 Kon 22:9": "Daarna kwam Safan, de schrijver, bij de koning, en bracht de koning verslag terug, en hij zei: Uw dienaren hebben het geld dat in het huis gevonden was bij elkaar gebracht, en hebben het gegeven in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE.", "Gen 17:13": "Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.", "2 Kron 24:1-14": "Joas was zeven jaar oud, toen hij koning werd, en hij regeerde veertig jaar te Jeruzalem; en de naam van zijn moeder was Zibja, van Ber-seba. En Joas deed wat recht was in de ogen van de HEERE, al de dagen van de priester Jojada. En Jojada nam voor hem twee vrouwen; en hij verwekte zonen en dochters.", "1 Kron 29:3-9": "En daarbij, uit mijn genegenheid voor het huis van mijn God, geef ik mijn eigen goud en zilver, dat ik heb, aan het huis van mijn God, boven op alles wat ik al voor het heilige huis klaargemaakt heb; Drieduizend talenten goud, van het goud van Ofir, en zevenduizend talenten gelouterd zilver, om de wanden van de huizen mee te bekleden; Goud voor de gouden voorwerpen, en zilver voor de zilveren voorwerpen, en voor al het werk dat door de hand van de werkmeesters gemaakt moet worden. En wie is er bereid om zich vandaag vrijwillig aan de HEERE te wijden?", "Joz 6:24": "De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.", "Ex 35:29": "Ieder man en vrouw wier hart hen vrijwillig bewoog om te brengen voor al het werk, dat de HEERE geboden had te maken door de hand van Mozes; dat brachten de kinderen van Israël als een vrijwillig offer voor de HEERE.", "2 Kon 9:14": "Zo smeedde Jehu, de zoon van Josafat, de zoon van Nimsi, een samenzwering tegen Joram. (Joram had namelijk Ramoth in Gilead bewaakt, hij en heel Israël, vanwege Hazaël, de koning van Syrië;", "Lev 27:28": "Toch, niets wat verboden is, dat iemand aan de HEERE verboden heeft, van alles wat hij heeft, van een mens, of van een dier, of van de akker van zijn eigendom, zal verkocht of afgekocht worden; alles wat verboden is, zal voor de HEERE allerheiligst zijn.", "1 Kron 26:12": "Uit dezen waren de verdelingen van de poortwachters onder de hoofden van de mannen, met wachtdiensten tegenover hun broers, om te dienen in het huis van de HEERE.", "Ezra 7:16": "alsook al het zilver en goud, dat u vinden zult in het hele landschap van Babel, met de vrijwillige gave van het volk en van de priesters, die vrijwillig geven, voor het huis van hun God, dat te Jeruzalem is;", "2 Kron 24:16": "En zij begroeven hem in de stad van David, bij de koningen; want hij had goed gedaan in Israël, zowel aan God als aan Zijn huis.", "Ex 25:2": "Spreek tot de kinderen van Israël, dat zij voor Mij een hefoffer nemen. Van elke man wiens hart zich vrijwillig bewegen zal, zult u Mijn hefoffer nemen.", "2 Kon 13:22": "Hazaël nu, de koning van Syrië, verdrukte Israël, al de dagen van Joahaz.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "Ezra 1:9-11": "En dit is hun aantal: dertig gouden bekkens, duizend zilveren bekkens, negenentwintig messen; Dertig gouden bekers, vierhonderd en tien andere zilveren bekers; andere voorwerpen, duizend. Alle voorwerpen van goud en van zilver waren vijfduizend vierhonderd; deze alle bracht Sesbazar mee, toen degenen die uit de gevangenschap opgevoerd werden, van Babel naar Jeruzalem optrokken.", "2 Sam 8:17": "En Zadok, zoon van Ahitub, en Achimelech, zoon van Abjathar, waren priesters; en Seraja was schrijver.", "Jes 37:14": "Toen Hizkia de brieven uit de hand van de boden ontvangen had, en die gelezen had, ging hij naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE.", "1 Kron 3:11": "zijn zoon was Joram; zijn zoon was Ahazia; zijn zoon was Joas;", "2 Kon 23:11": "En hij schafte de paarden af, die de koningen van Juda voor de zon gesteld hadden, bij de ingang van het huis van de HEERE, tot de kamer van Nathan-melech, de hoveling, die in Parvarim was; en de wagens van de zon verbrandde hij met vuur.", "Luk 16:11": "Als u dan in de onrechtvaardige Mammon niet getrouw bent geweest, wie zal u het ware vertrouwen?", "2 Kron 24:4-14": "Het gebeurde nu na deze dingen, dat het in het hart van Joas was, het huis van de HEERE te vernieuwen. Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet. En de koning riep Jojada, het hoofd, en zei tegen hem: Waarom hebt u geen onderzoek gedaan bij de Levieten, dat zij uit Juda en uit Jeruzalem inbrengen zouden de schatting van Mozes, de knecht van de HEERE, en van de gemeente van Israël, voor de tent der getuigenis?", "1 Sam 27:2": "Toen maakte David zich op en trok weg, hij en de zeshonderd mannen die bij hem waren, naar Achis, de zoon van Maoch, de koning van Gath.", "2 Kon 8:28": "En hij trok met Joram, de zoon van Achab, ten strijde tegen Hazaël, de koning van Syrië, naar Ramoth in Gilead; en de Syriërs verwondden Joram.", "Luk 22:5": "En zij waren blij, en zijn het eens geworden dat zij hem geld zouden geven.", "Richt 17:2": "Die zei tegen zijn moeder: De duizend en honderd zilverlingen, die u ontnomen zijn, waarom u gevloekt hebt, en ook voor mijn oren gesproken hebt, zie, dat geld is bij mij, ik heb dat genomen. Toen zei zijn moeder: Gezegend zij mijn zoon door de HEERE!", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "2 Kon 23:35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "2 Sam 20:25": "En Seja was schrijver; en Zadok en Abjathar waren priesters.", "Mark 12:43": "En Jezus riep Zijn discipelen tot Zich, en zei tegen hen: Voorwaar, Ik zeg u, dat deze arme weduwe meer heeft ingeworpen dan allen die iets in de schatkist geworpen hebben.", "2 Kron 34:9": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.", "2 Kron 24:2": "En Joas deed wat recht was in de ogen van de HEERE, al de dagen van de priester Jojada.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Luk 9:53": "Maar zij ontvingen Hem niet, omdat Hij duidelijk op weg was naar Jeruzalem.", "1 Kon 8:63": "En Salomo offerde als dankoffer, dat hij de HEERE offerde, tweeëntwintigduizend runderen, en honderdtwintigduizend schapen. Zo hebben zij het huis van de HEERE ingewijd, de koning en al de kinderen van Israël.", "1 Kron 22:2": "En David zei dat men de vreemdelingen moest verzamelen die in het land Israël waren; en hij stelde steenhouwers aan om stenen uit te houwen, om het huis van God te bouwen.", "2 Kron 29:5": "En hij zei tegen hen: Hoor mij, Levieten; heilig nu uzelf, en heilig het huis van de HEERE, de God van uw vaderen, en breng de onreinheid naar buiten, uit het heiligdom.", "2 Kon 18:15": "Zo gaf Hizkia al het zilver, dat gevonden werd in het huis van de HEERE, en in de schatten van het huis van de koning.", "2 Kon 16:4": "Hij offerde ook en brandde reukwerk op de hoogten en op de heuvels, ook onder alle groene bomen.", "Jer 20:2": "sloeg Pashur de profeet Jeremia, en zette hem in de gevangenis die in de bovenste poort van Benjamin is, die aan het huis van de HEERE ligt.", "2 Kon 9:27": "Toen Ahazia, de koning van Juda, dat zag, vluchtte hij via de weg naar het huis van de hoftuin; maar Jehu vervolgde hem, en zei: Sla hem ook neer op de wagen, bij de opgang naar Gur, die bij Jibleam is; en hij vluchtte naar Megiddo, en stierf daar.", "Jer 28:1": "Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei:", "2 Kron 16:2": "Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei:", "2 Sam 5:9": "Zo woonde David in de burcht en noemde die de stad van David. En David bouwde rondom, vanaf Millo naar binnen toe.", "2 Kon 5:23": "En Naäman zei: Het is goed, neem twee talenten. En hij drong bij hem aan, en bond twee talenten van het zilver in twee buidels, met twee stellen kleren, en gaf ze aan twee van zijn knechten, die ze voor hem uit droegen.", "2 Kon 8:12": "Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden.", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Ex 23:19": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE uw God brengen. U zult een bokje niet koken in de melk van zijn moeder.", "Jer 36:6": "Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.", "Luk 16:10": "Wie getrouw is in het minste, die is ook in het grote getrouw; en wie in het minste onrechtvaardig is, die is ook in het grote onrechtvaardig.", "Jer 36:12": "ging hij naar het huis van de koning, naar de kamer van de schrijver; en zie, daar zaten al de vorsten: Elisama, de schrijver, en Delaja, de zoon van Semaja, en Elnathan, de zoon van Achbor, en Gemarja, de zoon van Safan, en Zedekia, de zoon van Hananja, en al de vorsten.", "1 Kon 5:17": "Toen de koning het nu gebood, voerden zij grote stenen aan, kostelijke stenen, gehouwen stenen, om de grond van dat huis te leggen.", "Ex 34:26": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE, uw God, brengen. U zult het bokje niet koken in de melk van zijn moeder.", "2 Kron 24:5": "Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet.", "Ps 15:5": "Die zijn geld niet uitleent tegen woeker, en geen geschenk aanneemt tegen de onschuldige. Wie deze dingen doet, zal niet wankelen in eeuwigheid.", "Lev 25:51": "Als er nog veel van die jaren zijn, zal hij naar verhouding daarvan tot zijn lossing van het geld waarvoor hij gekocht is, teruggeven.", "Deut 23:18": "U zult geen hoerenloon noch hondenprijs in het huis van de HEERE, uw God, brengen, voor enige gelofte; want ook die beide zijn de HEERE, uw God, een gruwel.", "2 Kon 22:7": "Doch er werd met hen geen rekening gehouden van het geld dat in hun hand geleverd was, want zij handelden trouw.", "2 Kron 31:12": "Daarin brachten zij die heffing, en de tienden, en de geheiligde dingen, in trouw; en daarover was Chonanja, de Leviet, leider, en Simeï, zijn broer, de tweede.", "1 Kon 11:41": "Het overige nu van de geschiedenissen van Salomo, en alles wat hij gedaan heeft, en zijn wijsheid, is dat niet geschreven in het boek van de geschiedenissen van Salomo?", "2 Kron 29:34": "Doch van de priesters waren er te weinig, en zij konden niet van al de brandoffers de huid aftrekken; daarom hielpen hun broeders, de Levieten, hen, totdat het werk beëindigd was, en totdat de andere priesters zich geheiligd hadden; want de Levieten waren oprechter van hart om zich te heiligen, dan de priesters.", "1 Kon 14:19": "Het overige nu van de geschiedenis van Jerobeam, hoe hij oorlog voerde, en hoe hij geregeerd heeft, zie, dat staat geschreven in het boek van de kronieken van de koningen van Israël.", "1 Kon 7:1": "Aan zijn eigen huis bouwde Salomo dertien jaar, en hij maakte zijn hele huis af.", "Num 18:8": "Verder sprak de HEERE tot Aäron: En Ik, zie, Ik heb u gegeven de wacht van Mijn hefoffers, met alle heilige dingen van de kinderen van Israël heb Ik ze u gegeven, vanwege de zalving, en aan uw zonen, tot een eeuwige inzetting.", "2 Kron 24:12": "Dat de koning en Jojada gaven aan degenen die het werk van de dienst van het huis van de HEERE verzorgden; en zij huurden houwers en timmerlieden, om het huis van de HEERE te vernieuwen, alsook werkmeesters in ijzer en koper, om het huis van de HEERE te herstellen.", "Fil 2:21": "Want zij zoeken allen hun eigen belang, niet wat van Christus Jezus is.", "1 Kon 15:18": "Toen nam Asa al het zilver en goud, dat overgebleven was in de schatten van het huis van de HEERE, en de schatten van het huis van de koning, en gaf ze in de hand van zijn knechten; en de koning Asa zond ze tot Benhadad, de zoon van Tabrimmon, de zoon van Hezion, de koning van Syrië, die te Damaskus woonde, en zei:", "Ps 84:11": "Want een dag in Uw voorhoven is beter dan duizend elders; ik koos liever aan de drempel in het huis van mijn God te zijn, dan lang te wonen in de tenten van de goddeloosheid.", "Klaagl 3:9": "Gimel. Hij heeft mijn wegen toegemuurd met uitgehouwen stenen, Hij heeft mijn paden krom gemaakt.", "2 Kon 11:21": "Joas was zeven jaar oud, toen hij koning werd.", "Ex 36:3": "Zij namen dan van voor Mozes het hele hefoffer, dat de kinderen van Israël gebracht hadden voor het werk van de dienst van het heiligdom, om dat te maken; maar zij brachten hem nog elke morgen vrijwillig offer.", "1 Kron 22:15": "Ook zijn er bij u in overvloed die het werk kunnen doen: houwers, en werkmeesters in steen en hout, en allerlei wijze mensen in allerlei werk.", "Deut 21:14": "En het zal gebeuren, als u geen behagen meer in haar hebt, dat u haar zult laten gaan waarheen zij wil; maar u zult haar beslist niet voor geld verkopen, u zult geen handel met haar drijven, omdat u haar vernederd hebt.", "Neh 5:10": "Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.", "2 Kron 24:26": "Dezen nu zijn het die een samenzwering tegen hem maakten: Zabad, de zoon van Simeath, de Ammonitische, en Jozabad, de zoon van Simrith, de Moabitische.", "Gen 23:9": "Dat hij mij de spelonk van Machpela geeft, die hij heeft, die aan het eind van zijn akker is; dat hij die mij voor het volle geld geeft, tot een eigen graf in het midden van u.", "2 Kron 24:27": "Aangaande nu zijn zonen, en de grootheid van de last, hem opgelegd, en het gebouw van het huis van God, zie, zij zijn geschreven in de geschiedenis van het boek der koningen; en zijn zoon Amazia werd koning in zijn plaats.", "Lev 5:18": "En hij zal een gaaf ram uit de kudde naar de priester brengen, naar uw schatting, als schuldoffer; en de priester zal voor hem verzoening doen over zijn onwetendheid waardoor hij afgedwaald is, zonder het te weten; zo zal het hem vergeven worden.", "Luk 9:3": "En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Lev 25:37": "Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.", "1 Kron 18:11": "Deze heiligde koning David ook aan de HEERE, met het zilver en het goud dat hij had meegebracht van alle heidenvolken: van de Edomieten, en van de Moabieten, en van de kinderen van Ammon, en van de Filistijnen, en van de Amalekieten.", "2 Kron 29:4-11": "En hij bracht de priesters en de Levieten samen, en verzamelde hen op het plein aan de oostkant. En hij zei tegen hen: Hoor mij, Levieten; heilig nu uzelf, en heilig het huis van de HEERE, de God van uw vaderen, en breng de onreinheid naar buiten, uit het heiligdom. Want onze vaders hebben overtreden, en gedaan wat kwaad was in de ogen van de HEERE, onze God, en hebben Hem verlaten, en zij hebben hun gezicht van de tabernakel van de HEERE afgewend, en hebben Hem de rug toegekeerd.", "1 Kron 28:12": "en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;", "2 Kon 23:7": "Daartoe brak hij de huizen van de schandjongens af, die bij het huis van de HEERE waren, waar de vrouwen huisjes voor het beeld van het bos weefden.", "Gen 44:1-8": "En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak; En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had. 's Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.", "Ex 30:16": "U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.", "1 Kon 6:36": "Daarna bouwde hij het binnenste voorhof met drie rijen gehouwen stenen, en een rij cederen balken.", "Ex 30:12-16": "Als u de som van de kinderen van Israël opneemt, naar hun aantal geteld, dan zal ieder de losprijs voor zijn ziel aan de HEERE geven, wanneer u hen telt; opdat er onder hen geen plaag komt, wanneer u hen telt. Dit moeten zij geven, ieder die overgaat tot de getelden: de helft van een sikkel, naar de sikkel van het heiligdom (deze sikkel is twintig gera); de helft van een sikkel is een hefoffer voor de HEERE. Ieder die overgaat tot de getelden, van twintig jaar oud en daarboven, zal het hefoffer van de HEERE geven.", "Gen 43:12-23": "En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing. Neem ook uw broer mee, en maak u op, ga terug naar die man. En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Num 7:13": "En zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Hagg 1:2": "Zo spreekt de HEERE van de heerscharen: Dit volk zegt: De tijd is niet gekomen, de tijd dat het huis van de HEERE gebouwd moet worden.", "1 Kon 7:50": "Alsook de schalen, de vorken, de sprenkelschalen, de rookschalen, en de wierookvaten, van zuiver goud; daartoe de scharnieren van de deuren van het binnenste huis, het heilige der heiligen, en van de deuren van het huis van de tempel, van goud.", "2 Kon 5:26": "Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?", "2 Kon 16:18": "Daarbij haalde hij het overdekte gedeelte van de sabbat, dat zij in het huis gebouwd hadden, en de buitenste ingang van de koning weg van het huis van de HEERE, vanwege de koning van Assyrië.", "2 Kon 10:32": "In die dagen begon de HEERE Israël in te korten, want Hazaël sloeg hen in alle grensgebieden van Israël:", "Jer 51:51": "U zou kunnen zeggen: Wij zijn beschaamd geworden, want wij hebben smaad gehoord, schaamte heeft ons gezicht bedekt; omdat vreemden over de heiligdommen van het huis van de HEERE gekomen zijn;", "1 Kon 21:15": "Het gebeurde nu, toen Izebel hoorde dat Naboth gestenigd en dood was, dat Izebel tegen Achab zei: Sta op, neem de wijngaard van Naboth, de Jizreëliet, in bezit, die hij u weigerde voor geld te geven; want Naboth leeft niet meer, maar is dood.", "Neh 5:4": "Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.", "2 Kon 15:20": "Menahem nu bracht dit geld op van Israël, van alle vermogende mannen, om aan de koning van Assyrië te geven, voor elke man vijftig zilveren sikkels; zo keerde de koning van Assyrië terug, en bleef daar niet in het land.", "Deut 23:19": "U zult uw broeder geen rente laten betalen, rente van geld, rente van voedsel, rente van enig ding waarover men rente vraagt.", "2 Kron 35:2": "En hij stelde de priesters op hun wachten; en hij sterkte hen tot de dienst van het huis van de HEERE.", "Ezra 8:26": "ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten;", "2 Kon 13:3": "Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen.", "2 Kron 29:15": "En zij verzamelden hun broeders, en heiligden zich, en kwamen, volgens het gebod van de koning, door de woorden van de HEERE, om het huis van de HEERE te reinigen.", "2 Kron 24:4-13": "Het gebeurde nu na deze dingen, dat het in het hart van Joas was, het huis van de HEERE te vernieuwen. Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet. En de koning riep Jojada, het hoofd, en zei tegen hem: Waarom hebt u geen onderzoek gedaan bij de Levieten, dat zij uit Juda en uit Jeruzalem inbrengen zouden de schatting van Mozes, de knecht van de HEERE, en van de gemeente van Israël, voor de tent der getuigenis?", "1 Kor 4:3": "Maar voor mij is het van het minste belang, dat ik door u geoordeeld word, of door een menselijk oordeel; ja, ik oordeel ook mijzelf niet.", "Num 18:16": "Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.", "Ex 22:25": "Als u Mijn volk, dat arm is onder u, geld leent, mag u zich niet als een woekeraar tegenover hen gedragen; u mag geen rente van hen vragen.", "1 Petr 5:2": "Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed;", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Hand 6:1-3": "In diezelfde dagen, toen het aantal discipelen groeide, ontstond er gemor van de Griekssprekenden tegen de Hebreeën, omdat hun weduwen bij de dagelijkse verzorging over het hoofd werden gezien. En de twaalf riepen de menigte van de discipelen bij zich en zeiden: Het is niet passend dat wij het Woord van God verwaarlozen om de tafels te bedienen. Zie daarom om, broeders, naar zeven mannen uit uw midden, die een goede naam hebben, vol van de Heilige Geest en van wijsheid, die wij mogen aanstellen over deze taak.", "2 Kron 34:14": "En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.", "2 Kron 25:27": "Van de tijd af nu dat Amazia afgeweken was van achter de HEERE, smeedden zij in Jeruzalem een samenzwering tegen hem; doch hij vluchtte naar Lachis. Toen zonden zij hem achterna tot Lachis, en doodden hem daar.", "2 Kon 18:16": "Te dien tijde sneed Hizkia het goud af van de deuren van de tempel van de HEERE, en van de posten, die Hizkia, de koning van Juda, had laten overtrekken, en gaf dat aan de koning van Assyrië.", "2 Kon 12:4-16": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE, Zullen de priesters tot zich nemen, ieder van zijn bekende; en zij zullen de breuken van het huis herstellen, naar alles wat er voor breuk gevonden zal worden. Maar het gebeurde in het drieëntwintigste jaar van koning Joas, dat de priesters de breuken van het huis niet hersteld hadden.", "Jer 35:4": "En bracht hen in het huis van de HEERE, in de kamer van de zonen van Hanan, de zoon van Jigdalia, de man Gods; die is bij de kamer van de leiders, die daar is boven de kamer van Maaseja, de zoon van Sallum, de dorpelbewaarder.", "1 Kon 7:48-50": "Ook maakte Salomo alle voorwerpen die voor het huis van de HEERE bestemd waren: het gouden altaar, en de gouden tafel waarop de toonbroden lagen; En de kandelaars, vijf aan de rechterkant, en vijf aan de linkerkant, voor het binnenste heiligdom, van zuiver goud; en de bloemen, de lampen, en de snuiters van goud; Alsook de schalen, de vorken, de sprenkelschalen, de rookschalen, en de wierookvaten, van zuiver goud; daartoe de scharnieren van de deuren van het binnenste huis, het heilige der heiligen, en van de deuren van het huis van de tempel, van goud.", "2 Kon 12:7-16": "Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Deut 2:28": "Verkoop mij voedsel voor geld, dat ik eet, en geef mij water voor geld, dat ik drink; laat mij alleen te voet doortrekken;", "Luk 21:5": "En toen sommigen spraken over de tempel, dat hij met mooie stenen en geschenken versierd was, zei Hij:", "2 Sam 20:24": "En Adoram was over de schatting; en Josafat, de zoon van Ahilud, was kanselier;", "Gen 42:25-35": "En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo. En zij laadden hun koren op hun ezels, en trokken vandaar weg. Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.", "2 Kron 24:22": "Zo dacht de koning Joas niet aan de weldadigheid die zijn vader Jojada aan hem gedaan had, maar doodde zijn zoon; en toen deze stierf, zei hij: De HEERE zal het zien en het vergelden!", "1 Kron 23:4": "Uit dezen waren er vierentwintigduizend om het werk van het huis van de HEERE aan te sturen; en zesduizend opzichters en rechters;", "Gen 23:13": "En hij sprak tot Efron, ten aanhoren van het volk van het land, en zei: Trouwens, als u het toch wilt geven, hoor mij dan alstublieft; ik zal het geld van de akker geven; neem het van mij aan, dan zal ik mijn dode daar begraven.", "2 Kron 24:25": "En toen zij van hem weggetrokken waren (want zij lieten hem achter in grote ziekten), maakten zijn knechten, om het bloed van de zonen van de priester Jojada, een samenzwering tegen hem, en zij sloegen hem dood op zijn bed, zodat hij stierf; en zij begroeven hem in de stad van David, maar zij begroeven hem niet in de graven van de koningen.", "Neh 13:13": "En ik stelde tot schatmeesters over de schatten Selemja, de priester, en Zadok, de schrijver, en Pedaja, uit de Levieten; en aan hun zijde Hanan, de zoon van Zakkur, de zoon van Matthanja; want zij werden betrouwbaar geacht, en hun werd opgelegd het aan hun broeders uit te delen.", "Num 7:14": "Een reukschaal van tien gouden sikkels, vol van het reukwerk;", "Lev 27:2-8": "Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer iemand een gelofte gedaan heeft om iemand af te zonderen, zullen de zielen naar uw schatting van de HEERE zijn. Als uw schatting van een man geldt, van twintig jaar oud tot iemand die zestig jaar oud is, dan zal uw schatting vijftig sikkel zilver zijn, naar de sikkel van het heiligdom. Maar is het een vrouw, dan zal uw schatting dertig sikkel zijn.", "Ezech 44:4": "Daarna bracht hij mij de weg van de noorderpoort, voor het huis; en ik zag, en zie, de heerlijkheid van de HEERE had het huis van de HEERE vervuld; toen viel ik op mijn aangezicht.", "2 Sam 8:10": "zond Thoi zijn zoon Joram naar de koning David om hem naar zijn welstand te vragen, en om hem te zegenen, omdat hij tegen Hadad-Ezer had gevochten en hem geslagen had (want Hadad-Ezer voerde steeds oorlog tegen Thoi); en in zijn hand waren zilveren vaten, en gouden vaten, en koperen vaten;", "Est 3:12": "Toen werden de schrijvers van de koning geroepen, in de eerste maand, op de dertiende dag daarvan, en er werd geschreven naar alles wat Haman beval, aan de stadhouders van de koning, en aan de landvoogden die over elk landschap waren, en aan de vorsten van elk volk, elk landschap naar zijn schrift, en elk volk naar zijn taal; er werd geschreven in de naam van de koning Ahasveros, en het werd met de ring van de koning verzegeld.", "Ps 116:19": "in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "1 Kron 22:1": "En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.", "1 Kron 8:13": "En Beria, en Sema; dezen waren hoofden van de vaderen van de inwoners van Ajalon; dezen hebben de inwoners van Gath verdreven.", "2 Kron 24:8-14": "En de koning gebood, en zij maakten een kist, en zetten die buiten aan de poort van het huis van de HEERE. En men liet omroepen in Juda en in Jeruzalem, dat men de HEERE inbrengen zou de schatting van Mozes, de knecht van God, over Israël in de woestijn. Toen verblijdden zich alle leiders en al het volk, en zij brachten in en wierpen in de kist, totdat men klaar was.", "1 Kon 4:3": "Elihoref en Ahia, de zoon van Sisa, waren schrijvers; Josafat, de zoon van Ahilud, was kanselier.", "Hos 4:8": "Zij eten de zonde van Mijn volk, en verlangen, ieder met zijn ziel, naar hun ongerechtigheid.", "Ex 21:35": "Wanneer nu iemands os de os van zijn naaste zo kwetst, dat hij sterft, dan zal men de levende os verkopen en het geld daarvan gelijk delen, en het dode dier zal men ook gelijk delen.", "1 Kron 21:3": "Toen zei Joab: De HEERE doet Zijn volk, hoeveel zij nu ook zijn, honderd keer zoveel worden; zijn zij niet allen, o mijn heer koning, mijn heer tot knechten? Waarom verzoekt mijn heer dit? Waarom zou het Israël tot schuld worden?", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "Ezra 2:69": "Zij gaven naar hun vermogen aan de schat voor het werk: aan goud eenenzestigduizend drachmen, en aan zilver vijfduizend pond, en honderd priesterrokken.", "Est 4:7": "gaf Mordechai hem te kennen alles wat hem overkomen was, en de opgave van het zilver dat Haman gezegd had te zullen wegen in de schatten van de koning, voor de Joden, om hen om te brengen.", "Jer 35:2": "Ga naar het huis van de Rechabieten, en spreek met hen, en breng hen in het huis van de HEERE, in een van de kamers, en geef hun wijn te drinken.", "2 Kon 8:12-15": "Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden. En Hazaël zei: Wat is uw dienaar toch, die een hond is, dat hij deze grote zaak zou doen? En Elisa zei: De HEERE heeft mij getoond dat u koning zult zijn over Syrië. Zo ging hij weg van Elisa, en kwam bij zijn heer, die tegen hem zei: Wat heeft Elisa u gezegd? En hij zei: Hij heeft mij gezegd: U zult zeker genezen.", "Gen 17:12": "Een zoontje van acht dagen zal bij u besneden worden, alles wat mannelijk is in uw geslachten: degene die in het huis geboren is, en degene die met geld gekocht is van elke vreemdeling die niet van uw nageslacht is;", "Deut 14:26": "En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.", "1 Kron 24:6": "En Semaja, de zoon van Nethaneel, de schrijver, uit de Levieten, schreef hen op, voor het aangezicht van de koning, en van de vorsten, en van de priester Zadok, en van Achimelech, de zoon van Abjathar, en van de familiehoofden onder de priesters en onder de Levieten; één familie werd genomen voor Eleazar, en zo ook werd er één genomen voor Ithamar.", "Spr 7:20": "Hij heeft een bundel van het geld in zijn hand genomen; op de vastgestelde dag zal hij naar zijn huis komen.", "Lev 7:7": "Zoals het zondoffer is, zo zal ook het schuldoffer zijn; er zal één wet voor beide zijn; het zal voor de priester zijn die daarmee verzoening gedaan heeft.", "2 Kon 12:2-16": "En Joas deed wat recht was in de ogen van de HEERE, al zijn dagen, waarin de priester Jojada hem onderwees. Zeker werden de hoogten niet weggenomen; het volk offerde en rookte nog op de hoogten. En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "Neh 5:11": "Geeft hun toch, nog vandaag, hun akkers, hun wijngaarden, hun olijfgaarden en hun huizen terug; en het honderdste deel van het geld en van het koren, de most en de olie, die u van hen gevorderd hebt.", "1 Sam 2:30": "Daarom spreekt de HEERE, de God van Israël: Ik had wel duidelijk gezegd: Uw huis en het huis van uw vader zouden voor Mijn aangezicht wandelen tot in eeuwigheid; maar nu spreekt de HEERE: Dat zij verre van Mij; want die Mij eren, zal Ik eren, maar die Mij versmaden, zullen licht geacht worden.", "2 Kron 22:6": "En hij keerde terug om zich te laten genezen te Jizreël; want hij had wonden, die men hem bij Rama geslagen had, toen hij streed tegen Hazaël, de koning van Syrië; en Azarja, de zoon van Joram, de koning van Juda, kwam af om Joram, de zoon van Achab, te Jizreël te bezoeken, want hij was ziek.", "1 Kron 14:1": "Toen zond Hiram, de koning van Tyrus, boden naar David, en cederhout, en metselaars, en timmerlieden, om hem een huis te bouwen.", "1 Kon 3:1": "En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.", "Job 31:39": "Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen;", "2 Kon 11:18": "Daarna ging al het volk van het land naar het huis van Baäl en brak dat af; zijn altaren en zijn beelden verbraken zij helemaal; en Mattan, de priester van Baäl, sloegen zij dood voor de altaren. De priester stelde toen ambtsdragers aan over het huis van de HEERE.", "2 Sam 12:20": "Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.", "Lev 27:12-27": "En de priester zal het schatten, naardat het goed of slecht is; naar uw schatting, priester, zo zal het zijn. Maar als hij het echt wil afkopen, dan zal hij een vijfde deel boven uw schatting toevoegen. En wanneer iemand zijn huis geheiligd heeft, zodat het de HEERE heilig is, dan zal de priester dat schatten, naardat het goed of slecht is; zoals de priester het geschat heeft, zo zal het blijven staan.", "2 Kon 22:3": "Het gebeurde nu in het achttiende jaar van koning Josia, dat de koning de schrijver Safan, de zoon van Azalia, de zoon van Mesullam, zond naar het huis van de HEERE, en zei:", "Jer 42:15": "nu dan, daarom hoor het woord van de HEERE, overblijfsel van Juda! Zo zegt de HEERE van de heerscharen, de God van Israël: Als u vastbesloten uw aangezichten stelt om naar Egypte te gaan, en daar naartoe gaat om daar als vreemdelingen te wonen;", "Ps 122:1": "Een lied Hammaaloth, van David. Ik verblijd mij over hen die tegen mij zeggen: Wij zullen naar het huis van de HEERE gaan.", "3 Joh 1:5": "Geliefde, u handelt trouw in alles wat u doet aan de broeders en aan de vreemdelingen,", "Ex 21:34": "dan zal de eigenaar van de kuil het vergoeden; hij zal aan de eigenaar van het dier het geld teruggeven; maar het dode dier zal hem toebehoren.", "2 Kron 33:15": "En hij nam de vreemde goden en die gelijkenis weg uit het huis van de HEERE, alsook alle altaren die hij gebouwd had op de berg van het huis van de HEERE, en te Jeruzalem; en hij wierp ze buiten de stad.", "2 Kron 26:21": "Zo was de koning Uzzia melaats tot aan de dag van zijn dood; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis van de HEERE afgesneden; Jotham nu, zijn zoon, was over het huis van de koning, en oordeelde het volk van het land.", "Jer 29:26": "De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn in het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.", "Jes 2:2": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien.", "1 Kon 7:40": "Daartoe maakte Hiram de wasvaten, de scheppen, en de sprenkelschalen; en Hiram maakte al het werk af dat hij voor koning Salomo maakte voor het huis van de HEERE:", "2 Kron 24:23": "Daarom gebeurde het bij de jaarwisseling, dat het leger van Syrië tegen hem optrok, en zij kwamen tot Juda en Jeruzalem, en verdierven uit het volk alle leiders van het volk; en zij zonden al hun buit naar de koning van Damaskus.", "Gen 20:16": "En tegen Sara zei hij: Zie, ik heb uw broeder duizend zilverlingen gegeven; zie, dat moet voor u een bedekking van de ogen zijn, voor allen die bij u zijn, ja, tegenover allen, en wees terechtgewezen.", "Richt 17:4": "Maar hij gaf dat geld aan zijn moeder terug. En zijn moeder nam tweehonderd zilverlingen, en gaf ze aan de goudsmid, die maakte daarvan een gesneden beeld en een gegoten beeld; dat was in het huis van Micha.", "Neh 10:32": "Vervolgens legden wij ons geboden op, waarbij wij ons een derde deel van een sikkel per jaar opgelegd hadden, voor de dienst van het huis van onze God;", "2 Kon 19:2": "Daarna stuurde hij Eljakim, de hofmeester, en Sebna, de schrijver, en de oudsten van de priesters, met zakken bedekt, naar Jesaja, de profeet, de zoon van Amoz;", "Jer 52:24": "Ook nam de leider van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders.", "2 Kon 22:5": "En dat zij dat geven in de hand van de opzichters van het werk, die aangesteld zijn over het huis van de HEERE; opdat zij het geven aan degenen die het werk doen dat in het huis van de HEERE is, om de scheuren van het huis te herstellen;", "2 Kon 11:15": "Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.", "Luk 19:15": "En het gebeurde, toen hij terugkwam nadat hij het koninkrijk ontvangen had, dat hij zei dat die dienstknechten aan wie hij het geld gegeven had bij hem geroepen moesten worden, opdat hij zou weten wat ieder met handel verdiend had.", "1 Kon 10:5": "en het voedsel van zijn tafel, en het zitten van zijn knechten, en het staan van zijn dienaren, en hun kleding, en zijn schenkers, en zijn opgang waarlangs hij naar boven ging in het huis van de HEERE, toen was er in haar geen geest meer.", "2 Kon 22:4-7": "Ga naar Hilkia, de hogepriester, opdat hij het geld opsomt dat in het huis van de HEERE gebracht is, dat de wachters van de drempel bij het volk verzameld hebben; En dat zij dat geven in de hand van de opzichters van het werk, die aangesteld zijn over het huis van de HEERE; opdat zij het geven aan degenen die het werk doen dat in het huis van de HEERE is, om de scheuren van het huis te herstellen; Aan de timmerlieden en de bouwlieden, en de metselaars, en om hout en gehouwen stenen te kopen, om het huis te herstellen.", "2 Kron 22:5": "Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.", "Jer 32:9": "Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels.", "Pred 7:12": "Want de wijsheid is tot een schaduw, en het geld is tot een schaduw; maar de uitnemendheid van de wetenschap is, dat de wijsheid haar bezitters het leven geeft.", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "Ezra 3:7": "Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.", "2 Kon 11:3": "En hij was met haar verborgen in het huis van de HEERE, zes jaar; en Athalia regeerde over het land.", "2 Kon 12:19-21": "Het overige nu van de geschiedenis van Joas, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda? En zijn knechten stonden op, en smeedden een samenzwering, en sloegen Joas dood in het huis van Millo, dat afdaalt naar Silla; Want Jozacar, de zoon van Simeath, en Jozabad, de zoon van Somer, zijn knechten, sloegen hem, zodat hij stierf; en zij begroeven hem bij zijn vaderen in de stad van David; en Amaz
