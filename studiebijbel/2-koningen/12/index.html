en de priesters tot zich nemen, ieder van zijn bekende; en zij zullen de breuken van het huis herstellen, naar alles wat er voor breuk gevonden zal worden.","6":"Maar het gebeurde in het drieëntwintigste jaar van koning Joas, dat de priesters de breuken van het huis niet hersteld hadden.","7":"Toen riep koning Joas de priester Jojada en de *andere* priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis.","8":"En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen.","9":"Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.","10":"Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.","11":"En zij gaven het geld, goed gewogen, in handen van hen die het werk verzorgden en die aangesteld waren over het huis van de HEERE; en zij betaalden daarmee de timmerlieden en de bouwlieden die het huis van de HEERE herstelden;","12":"En de metselaars en de steenhouwers, en om hout en gehouwen stenen te kopen, om de breuken van het huis van de HEERE te herstellen, en voor alles wat uitgegeven werd voor het huis, om dat te herstellen.","13":"Toch werden er voor het huis van de HEERE geen zilveren schalen, gaffelen, sprenkelschalen, trompetten, of enig gouden of zilveren voorwerp gemaakt, van het geld dat naar het huis van de HEERE gebracht werd.","14":"Maar zij gaven dat aan hen die het werk deden; en zij herstelden daarmee het huis van de HEERE.","15":"Daarbij eisten zij geen rekening van de mannen aan wie zij dat geld in hun handen gaven om aan hen die het werk deden te betalen; want zij handelden trouw.","16":"Het geld van het schuldoffer en het geld van de zondoffers werd niet naar het huis van de HEERE gebracht; het was voor de priesters.","17":"Toen trok Hazaël, de koning van Syrië, op, en streed tegen Gath, en nam het in; daarna richtte Hazaël zijn gezicht om tegen Jeruzalem op te trekken.","18":"Maar Joas, de koning van Juda, nam al de geheiligde dingen die Josafat, en Joram, en Ahazia, zijn vaderen, de koningen van Juda, geheiligd hadden, en zijn eigen geheiligde dingen, en al het goud dat gevonden werd in de schatten van het huis van de HEERE en van het huis van de koning, en zond het aan Hazaël, de koning van Syrië; toen trok hij weg van Jeruzalem.","19":"Het overige nu van de geschiedenis van Joas, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?","20":"En zijn knechten stonden op, en smeedden een samenzwering, en sloegen Joas dood in het huis van Millo, dat afdaalt naar Silla;","21":"Want Jozacar, de zoon van Simeath, en Jozabad, de zoon van Somer, zijn knechten, sloegen hem, zodat hij stierf; en zij begroeven hem bij zijn vaderen in de stad van David; en Amazia, zijn zoon, werd koning in zijn plaats."},"SV":{"1":"In het zevende jaar van Jehu werd Joas koning, en regeerde veertig jaren te Jeruzalem; en de naam zijner moeder was Zibja van Ber-seba.","2":"En Joas deed dat recht was in de ogen des HEEREN, al zijn dagen, in dewelke de priester Jojada hem onderwees.","3":"Alleenlijk werden de hoogten niet weggenomen; het volk offerde en rookte nog op de hoogten.","4":"En Joas zeide tot de priesteren: Al het geld der geheiligde dingen, dat gebracht zal worden in het huis des HEEREN, *te* *weten* het geld desgenen, die overgaat *tot* *de* *getelden*, het geld van een ieder der personen *naar* zijn schatting, *en* al het geld, dat in ieders hart komt, om *dat* te brengen in het huis des HEEREN,","5":"Zullen de priesters tot zich nemen, een ieder van zijn bekende; en zij zullen de breuken van het huis verbeteren, naar alles wat er voor breuk bevonden zal worden.","6":"Maar het geschiedde in het drie en twintigste jaar van den koning Joas, dat de priesters de breuken van het huis niet gebeterd hadden.","7":"Toen riep de koning Joas den priester Jojada en de *andere* priesteren, en zeide tot hen: Waarom betert gijlieden niet de breuken van het huis? Nu dan, neemt geen geld van uw bekenden, dat gij het zoudt geven voor de breuken van het huis.","8":"En de priesters bewilligden van het volk geen geld te nemen, noch de breuken van het huis te verbeteren.","9":"Maar de priester Jojada nam een kist, en boorde een gat in haar deksel, en zette die bij het altaar ter rechterhand, als iemand inkwam in het huis des HEEREN; en de priesters, die den dorpel bewaarden, staken daarin al het geld, dat ten huize des HEEREN gebracht werd.","10":"Het geschiedde nu, als zij zagen, dat veel gelds in de kist was, dat des konings schrijver met den hogepriester opkwam, en zij bonden het samen, en telden het geld, dat in het huis des HEEREN gevonden werd.","11":"En zij gaven het geld wel gewogen in handen der verzorgers van dat werk, die gesteld waren over het huis des HEEREN; en zij besteedden het uit aan de timmerlieden en aan de bouwlieden, die het huis des HEEREN vermaakten;","12":"En aan de metselaren, en aan de steenhouwers, en om hout en gehouwen stenen te kopen, om de breuken van het huis des HEEREN te verbeteren, en voor al wat uitgegeven werd voor het huis, om *dat* te beteren.","13":"Evenwel werden niet gemaakt voor het huis des HEEREN zilveren schalen, gaffelen, sprengbekkens, trompetten, *noch* enig gouden vat, of zilveren vat, van het geld, dat ten huize des HEEREN gebracht werd.","14":"Maar zij gaven dat aan degenen, die het werk deden; en zij verbeterden daarmede het huis des HEEREN.","15":"Daartoe eisten zij geen rekening van de mannen, wien zij dat geld in hun handen gaven, om aan degenen, die het werk deden, te geven; want zij handelden trouwelijk.","16":"Het geld van schuldoffer, en het geld van zondofferen werd ten huize des HEEREN niet gebracht; het was voor de priesteren.","17":"Toen trok Hazaël, de koning van Syrië op, en krijgde tegen Gath, en nam haar in; daarna stelde Hazaël zijn aangezicht, om tegen Jeruzalem op te trekken.","18":"Maar Joas, de koning van Juda, nam al de geheiligde dingen, die Josafat, en Joram, en Ahazia, zijn vaderen, de koningen van Juda, geheiligd hadden, en zijn geheiligde dingen, en al het goud, dat gevonden werd in de schatten van het huis des HEEREN, en van het huis des konings, en zond het tot Hazaël, den koning van Syrië; toen trok hij op van Jeruzalem.","19":"Het overige nu der geschiedenissen van Joas, en al wat hij gedaan heeft, is dat niet geschreven in het boek der kronieken der koningen van Juda?","20":"En zijn knechten stonden op, en maakten een verbintenis, en sloegen Joas, in het huis van Millo, dat afgaat naar Silla;","21":"Want Jozacar, de zoon van Simeath, en Jozabad, de zoon van Somer, zijn knechten, sloegen hem, dat hij stierf; en zij begroeven hem met zijn vaderen in de stad Davids; en Amazia, zijn zoon, werd koning in zijn plaats."},"KJV":{"1":"In the seventh year of Jehu Jehoash began to reign; and forty years reigned he in Jerusalem. And his mother's name was Zibiah of Beersheba.","2":"And Jehoash did that which was right in the sight of the LORD all his days wherein Jehoiada the priest instructed him.","3":"But the high places were not taken away: the people still sacrificed and burnt incense in the high places.","4":"And Jehoash said to the priests, All the money of the dedicated things that is brought into the house of the LORD, even the money of every one that passeth the account, the money that every man is set at, and all the money that cometh into any man's heart to bring into the house of the LORD,","5":"Let the priests take it to them, every man of his acquaintance: and let them repair the breaches of the house, wheresoever any breach shall be found.","6":"But it was so, that in the three and twentieth year of king Jehoash the priests had not repaired the breaches of the house.","7":"Then king Jehoash called for Jehoiada the priest, and the other priests, and said unto them, Why repair ye not the breaches of the house? now therefore receive no more money of your acquaintance, but deliver it for the breaches of the house.","8":"And the priests consented to receive no more money of the people, neither to repair the breaches of the house.","9":"But Jehoiada the priest took a chest, and bored a hole in the lid of it, and set it beside the altar, on the right side as one cometh into the house of the LORD: and the priests that kept the door put therein all the money that was brought into the house of the LORD.","10":"And it was so, when they saw that there was much money in the chest, that the king's scribe and the high priest came up, and they put up in bags, and told the money that was found in the house of the LORD.","11":"And they gave the money, being told, into the hands of them that did the work, that had the oversight of the house of the LORD: and they laid it out to the carpenters and builders, that wrought upon the house of the LORD,","12":"And to masons, and hewers of stone, and to buy timber and hewed stone to repair the breaches of the house of the LORD, and for all that was laid out for the house to repair it.","13":"Howbeit there were not made for the house of the LORD bowls of silver, snuffers, basons, trumpets, any vessels of gold, or vessels of silver, of the money that was brought into the house of the LORD:","14":"But they gave that to the workmen, and repaired therewith the house of the LORD.","15":"Moreover they reckoned not with the men, into whose hand they delivered the money to be bestowed on workmen: for they dealt faithfully.","16":"The trespass money and sin money was not brought into the house of the LORD: it was the priests'.","17":"Then Hazael king of Syria went up, and fought against Gath, and took it: and Hazael set his face to go up to Jerusalem.","18":"And Jehoash king of Judah took all the hallowed things that Jehoshaphat, and Jehoram, and Ahaziah, his fathers, kings of Judah, had dedicated, and his own hallowed things, and all the gold that was found in the treasures of the house of the LORD, and in the king's house, and sent it to Hazael king of Syria: and he went away from Jerusalem.","19":"And the rest of the acts of Joash, and all that he did, are they not written in the book of the chronicles of the kings of Judah?","20":"And his servants arose, and made a conspiracy, and slew Joash in the house of Millo, which goeth down to Silla.","21":"For Jozachar the son of Shimeath, and Jehozabad the son of Shomer, his servants, smote him, and he died; and they buried him with his fathers in the city of David: and Amaziah his son reigned in his stead."}},"tsk":{"1":[{"kopje":"zevende","refs":["2 Kon 9:27","2 Kon 11:1","2 Kon 11:3","2 Kon 11:4","2 Kon 11:21","2 Kron 24:1-14"]},{"kopje":"Joas","refs":["2 Kon 11:2","1 Kron 3:11"]}],"4":[{"kopje":"zei tegen de priesters","refs":["2 Kon 22:4","2 Kron 29:4-11","2 Kron 35:2"]},{"kopje":"het geld","refs":["2 Kon 12:18","1 Kon 7:1","1 Kron 18:11","2 Kron 15:18","2 Kron 31:12"]},{"kopje":"geheiligde dingen","refs":["Lev 5:15","Lev 5:16","Lev 27:12-27","Lev 27:31"]},{"kopje":"te weten het geld","refs":["2 Kon 22:4","Ex 30:12-16","2 Kron 24:9","2 Kron 24:10"]},{"kopje":"naar zijn schatting","refs":["Lev 27:2-8"]},{"kopje":"en al het geld","refs":["Ex 25:1","Ex 25:2","Ex 35:5","Ex 35:22","Ex 35:29","Ex 36:3","1 Kron 29:3-9","1 Kron 29:17","Ezra 1:6","Ezra 2:69","Ezra 7:16","Ezra 8:25-28","Luk 21:4"]}],"5":[{"kopje":"de priesters","refs":["2 Kron 24:5"]},{"kopje":"zij zullen herstellen","refs":["2 Kon 12:12","2 Kon 22:5","2 Kon 22:6","1 Kon 11:27","2 Kron 24:7","Jes 58:12"]}],"6":[{"kopje":"de priesters","refs":["1 Sam 2:29","1 Sam 2:30","2 Kron 29:34","Jes 5 9\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> all his <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> wherein <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H3384\">instructed</span> him.","3":"But the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> were not taken <span class=\"wl wl-kjv\" data-code=\"H5493\">away:</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> still <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificed</span> and burnt <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> in the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places.</span>","4":"And <span class=\"wl wl-kjv\" data-code=\"H3060\">Jehoash</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> All the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of the dedicated <span class=\"wl wl-kjv\" data-code=\"H6944\">things</span> that is <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> even the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> that <span class=\"wl wl-kjv\" data-code=\"H5674\">passeth</span> the account, the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that every <span class=\"wl wl-kjv\" data-code=\"H5315\">man</span> is set <span class=\"wl wl-kjv\" data-code=\"H6187\">at,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that <span class=\"wl wl-kjv\" data-code=\"H5927\">cometh</span> into any <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span>","5":"Let the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> it to them, every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of his <span class=\"wl wl-kjv\" data-code=\"H4378\">acquaintance:</span> and let them <span class=\"wl wl-kjv\" data-code=\"H2388\">repair</span> the <span class=\"wl wl-kjv\" data-code=\"H919\">breaches</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> wheresoever any <span class=\"wl wl-kjv\" data-code=\"H919\">breach</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4672\">found.</span>","6":"But it was so, that in the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3060\">Jehoash</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> had not <span class=\"wl wl-kjv\" data-code=\"H2388\">repaired</span> the <span class=\"wl wl-kjv\" data-code=\"H919\">breaches</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","7":"Then <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3060\">Jehoash</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and the other <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Why <span class=\"wl wl-kjv\" data-code=\"H2388\">repair</span> ye not the <span class=\"wl wl-kjv\" data-code=\"H919\">breaches</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house?</span> now therefore <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> no more <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of your <span class=\"wl wl-kjv\" data-code=\"H4378\">acquaintance,</span> but <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> it for the <span class=\"wl wl-kjv\" data-code=\"H919\">breaches</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","8":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H225\">consented</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> <span class=\"wl wl-kjv\" data-code=\"H1115\">no</span> more <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H1115\">neither</span> to <span class=\"wl wl-kjv\" data-code=\"H2388\">repair</span> the <span class=\"wl wl-kjv\" data-code=\"H919\">breaches</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","9":"But <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H727\">chest,</span> and <span class=\"wl wl-kjv\" data-code=\"H5344\">bored</span> a <span class=\"wl wl-kjv\" data-code=\"H2356\">hole</span> in the <span class=\"wl wl-kjv\" data-code=\"H1817\">lid</span> of it, and <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> it <span class=\"wl wl-kjv\" data-code=\"H681\">beside</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> on the right <span class=\"wl wl-kjv\" data-code=\"H3225\">side</span> as <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> <span class=\"wl wl class=\"wl wl-kjv\" data-code=\"H6213\">did</span> the <span class=\"wl wl-kjv\" data-code=\"H4399\">work,</span> that had the <span class=\"wl wl-kjv\" data-code=\"H6485\">oversight</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and they laid it <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to the <span class=\"wl wl-kjv\" data-code=\"H2796\">carpenters</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">builders,</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span>","12":"And to <span class=\"wl wl-kjv\" data-code=\"H1443\">masons,</span> and <span class=\"wl wl-kjv\" data-code=\"H2672\">hewers</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> and to <span class=\"wl wl-kjv\" data-code=\"H7069\">buy</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> and <span class=\"wl wl-kjv\" data-code=\"H4274\">hewed</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> to <span class=\"wl wl-kjv\" data-code=\"H2388\">repair</span> the <span class=\"wl wl-kjv\" data-code=\"H919\">breaches</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and for all that was laid <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to <span class=\"wl wl-kjv\" data-code=\"H2394\">repair</span> it.","13":"Howbeit there were not <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5592\">bowls</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> <span class=\"wl wl-kjv\" data-code=\"H4212\">snuffers,</span> <span class=\"wl wl-kjv\" data-code=\"H4219\">basons,</span> <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpets,</span> any <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> or <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> of the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that was <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span>","14":"But they <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> that to the <span class=\"wl wl-kjv\" data-code=\"H4399\">workmen,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">repaired</span> therewith the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","15":"Moreover they <span class=\"wl wl-kjv\" data-code=\"H2803\">reckoned</span> not with the <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> into whose <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> they <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> to be <span class=\"wl wl-kjv\" data-code=\"H5414\">bestowed</span> on <span class=\"wl wl-kjv\" data-code=\"H4399\">workmen:</span> for they <span class=\"wl wl-kjv\" data-code=\"H6213\">dealt</span> <span class=\"wl wl-kjv\" data-code=\"H530\">faithfully.</span>","16":"The <span class=\"wl wl-kjv\" data-code=\"H817\">trespass</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> and <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> was not <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> it was the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests'.</span>","17":"Then <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> it: and <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> to go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H3060\">Jehoash</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> all the hallowed <span class=\"wl wl-kjv\" data-code=\"H6944\">things</span> that <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> and <span class=\"wl wl-kjv\" data-code=\"H3088\">Jehoram,</span> and <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah,</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> had <span class=\"wl wl-kjv\" data-code=\"H6942\">dedicated,</span> and his own hallowed <span class=\"wl wl-kjv\" data-code=\"H6944\">things,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> that was <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in the <span class=\"wl wl-kjv\" data-code=\"H214\">treasures</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> it to <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria:</span> and he went <span class=\"wl wl-kjv\" data-code=\"H5927\">away</span> from <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","19":"And the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah?</span>","20":"And his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H7194\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H7195\">conspiracy,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H4407\">Millo,</span> which goeth <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H5538\">Silla.</span>","21":"For <span class=\"wl wl-kjv\" data-code=\"H3108\">Jozachar</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8100\">Shimeath,</span> and <span class=\"wl wl-kjv\" data-code=\"H3075\">Jehozabad</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7763\">Shomer,</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him, and he <span class=\"wl wl-kjv\" data-code=\"H4191\">died;</span> and they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> and <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Jehu","tekst":"De koning Israëls; van welken zie boven, 2Ki 9:10."},{"catchword":"Joas","tekst":"Hebreeuws, Jehoas."},{"catchword":"Zibja","tekst":"Hebreeuws, Tsibia."},{"catchword":"Ber-séba","tekst":"Zie van deze stad Gen 21:31."}],"2":[{"catchword":"in dewelke","tekst":"Maar na den dood van Jojada den hogepriester, wiens goede leer hij heeft vergeten, is tot valsen godsdienst vervallen, en daarom ook gestraft geweest. Zie 2Ch 24:17-18."}],"4":[{"catchword":"der geheiligde dingen,","tekst":"Hebreeuws, heiligheden; dat is, die den Heere geheiligd en tot zijn dienst toegeëigend waren; en nu tot den bouw en de vermaking des tempels moesten aangelegd worden. Van deze worden hier zekere soorten vermeld, naar uitwijzen der volgende woorden."},{"catchword":"desgenen,","tekst":"Hebreeuws, des voorbijgaanden of des overgaanden; te weten, onder, of tot de getelden; dat is, die gerekend werd onder degenen, die geschat moesten worden. Dezen nu waren al degenen, die twintig jaren en daarboven oud waren, die, wanneer de telling geschiedde, moesten elk een halven sikkel voor hun hoofd geven, Exo 30:13. Dit was de eerste soort der geheiligde dingen."},{"catchword":"getelden,","tekst":"Dit woord is hier ingevoegd uit Exo 30:13."},{"catchword":"het geld","tekst":"Hebreeuws, des mans geld der zielen zijner schatting; dat is, het geld, waarmede de priester een persoon, die zijn gelofte den Heere gedaan had, geschat heeft, opdat hij zich zou lossen en vrijmaken. Zie de wet hiervan Lev 27:2. Dit was de tweede soort der geheiligde dingen."},{"catchword":"der personen","tekst":"Hebreeuws, zielen. Dit woord is hier voor personen of mensen genomen. Zie Gen 12:5."},{"catchword":"al het geld,","tekst":"De derde soort der geheiligde dingen was, die iemand gans vrijwilliglijk den Heere offerde, zonder daartoe door enige wet genoodzaakt te zijn, maar wel opgewekt zijnde door vermaning, 2Ch 24:5-6. Vergelijk Exo 35:5."},{"catchword":"komt,","tekst":"Hebreeuws, opkomt, of klimt."}],"5":[{"catchword":"verbeteren,","tekst":"Hebreeuws, versterken. En zo in het volgende."},{"catchword":"voor breuk","tekst":"Versta, dat gescheurd, gespleten, gereten, of vervallen was door den ouderdom van het gebouw; of geschonden en verwoest door de goddeloze Athalia. Zie 2Ch 24:7."}],"7":[{"catchword":"neemt geen geld","tekst":"Gelijk gij tevoren gedaan hebt. Zie vs.4,5."},{"catchword":"dat gij","tekst":"Gelijk gij tevoren wel beloofd, maar niet gedaan hebt."}],"9":[{"catchword":"nam een kist,","tekst":"Met toestemming ja door bevel des konings; 2Ch 24:8."},{"catchword":"deksel,","tekst":"Hebreeuws, in haar deur."},{"catchword":"ter rechterhand,","tekst":"Versta, aan de post, of ter zijde der deur, waar men inging in het voorhof der priesters, alwaar het brandofferaltaar stond, aan het einde van het grote voorhof; want zover mocht gans Israël komen, gelijk de Levieten daar aan den dorpel dezer deur de wacht hielden, Num 18:4. Zulk een offerkist was ook nog in den tempel ten tijde van Jezus Christus. Zie Mar 12:41; Luk 21:1."},{"catchword":"dorpel","tekst":"Te weten, der poort van het voorhof der priesters; en dat naar het voorschrift des Heeren; Num 18:4."}],"10":[{"catchword":"schrijver","tekst":"Dat is, griffier, of secretaris. Alzo onder, 2Ki 19:2, en 2Ki 22:3; idem 2Sa 8:17."},{"catchword":"zij bonden het","tekst":"Te weten, in buidels, of zakken."}],"11":[{"catchword":"verzorgers","tekst":"Hebreeuws, doeners van dat werk. Alzo onder, 2Ki 22:5. Dat is, die als opzieners over dit werk des tempels gesteld waren."},{"catchword":"timmerlieden","tekst":"Hebreeuws, werknemers des houts."}],"12":[{"catchword":"metselaren,","tekst":"Het Hebreeuwse woord betekent in het algemeen degenen, die stenen muren en houten wanden en heiningen maken. Alzo onder, 2Ki 22:6; Isa 58:12; Eze 22:30. Hier is het voor metselaars genomen."},{"catchword":"gehouwen","tekst":"Hebreeuws, stenen der uithouwing, of, snijding; dat is, die uit de aarde gehouwen worden, en daarna ook door houwing of snijding tot zeker gebruik moeten gefatsoeneerd worden."},{"catchword":"uitgegeven","tekst":"Hebreeuws, dat uitging; dat is, dat uitgelegd werd van geld, of anders uitbesteed, tot behoefte van de vermaking des tempels."}],"13":[{"catchword":"werden","tekst":"Dat is, zij bevorderden zozeer den bouw des tempels dat zij de vaten, tot den godsdienst behorende, niet maakten voordat het bouwwerk volbracht was; maar daarna hebben zij ook van het overschot des gelds allerlei vaten gemaakt. Zie 2Ch 24:14."},{"catchword":"zilveren schalen,","tekst":"Zie van deze vaten 1Ki 7:50."}],"15":[{"catchword":"eisten","tekst":"Of, deden de mannen geen rekening doen; of rekenden niet met de mannen."},{"catchword":"trouwelijk","tekst":"Hebreeuws, in waarheid, of trouw; dat is, op geloof. De zin is: Gelijk het geld hun vromigheid toevertrouwd was, alzo hebben zij ook hetzelve trouwelijk aangelegd en besteed."}],"17":[{"catchword":"Toen trok Házaël,","tekst":"Namelijk, nadat Jojada nu gestorven was en Joas zijn wegen verdorven had, 2Ch 24:22-23."},{"catchword":"Gath,","tekst":"Zie 1Ki 2:39."},{"catchword":"stelde Házaël","tekst":"Zijn aangezicht ergens naar stellen, is iets ernstiglijk voornemen en aangrijpen. Zie 2Ch 20:3; Jer 42:15; Eze 21:2; Dan 9:3; Luk 9:51."}],"18":[{"catchword":"geheiligde dingen,","tekst":"Hebreeuws, heiligheden. Als boven, vs.4. Zie Lev 5:15."}],"20":[{"catchword":"in het huis van Millo","tekst":"Anders, Bethmillo. Zie Jdg 9:6."},{"catchword":"Silla;","tekst":"De naam ener plaats. Uit de eigenschap des woords menen sommigen dat dit is een zekere gehoogde weg geweest, dien Salomo zou gemaakt hebben om van de stad Davids in den tempel te gaan, 2Ch 9:11. Anderen menen dat Silla is geweest de naam ener stad, niet ver van het huis van Millo gelegen."}],"21":[{"catchword":"Józacar,","tekst":"Anders genaamd Zabad, 2Ch 24:26."},{"catchword":"Simeath,","tekst":"De naam van een Ammonietische vrouw, 2Ch 24:26."},{"catchword":"Józabad,","tekst":"Hebreeuws, Jehozabad."},{"catchword":"Somer,","tekst":"Anders, van Simrith. Deze was een Moabietische vrouw, 2Ch 24:26."},{"catchword":"stad Davids;","tekst":"Maar niet in het graf der koningen van Juda, 2Ch 24:25."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In the seventh year of Jehu [King of Israel; of whom see above chap.9 and 10.] Joas [Heb. Jehoasah] became King, and reigned fourty years at Jerusalem: And his mothers name was Zibia [Heb. Tsibia] of Berseba [see of this city gen.21.on v.31.]"}],"2":[{"catchword":null,"tekst":"And Joas did that which was right in the eyes of the LORD, all his days; wherein Jojada the Priest instructed him. [But after the death of Jojada the high Priest, whose good doctrine he forgot, fell to false worship, and was also punished for it. See 2 Chron.24. ver.17,18.]"}],"3":[{"catchword":null,"tekst":"Only the high places were not taken away: The people still offered, and burnt incense on the high places."}],"4":[{"catchword":null,"tekst":"And Joas unto Priests, all the money of the dedicated things, [Heb. holinesses: that is, that are hallowed unto the LORD, and dedicated to his service, and no were to be employed about the building and repairing of the Temple. Of these certain kinds are here mentioned, as the following words do shew] that shall be brought into the house of the LORD, (to wit) the money of him that passeth over (to them that are numbered); [These words are here inserted out of Exo 30:13. Heb. of the passer by, or goer over: to wit, among, or to those that are numbered: that is, who was counted among those that were to be taxed. These now are all those that were twenty years old and upward, who when the numbering was made, were to give every man half a shekel for his head, or person, Exo 30:13. This was the first sort or kind of consecrated things] the money of every one of the persons [Heb. souls. This word is here taken for persons, or men. See Gen. 12.on v.5.] (according to) of his taxing; that is, the money wherewith the Priest taxed a man that had made a vow unto the LORD, that he might redeem and free himself. See the law concerning this, Lev.27.2. This was the second kind of consecrated things] (and) all the money that cometh [Heb. cometh up, or ascendeth] into the house of the LORD; [the third sort or kind of consecrated things was, which any man offered most freely and willingly unto the LORD, without being compelled thereunto by any law, but indeed stirred up by exhortation, 2 Chron.24.v.5,6. Compare Exod.35,5.]"}],"5":[{"catchword":null,"tekst":"Shall the Priests take to themselves every man of his acquaintance: and they shall repair [Heb. strengthen, fortify: and so in the sequel] the breaches of the house, according to all that shall there (to be a) breach. [understand whatsoever was rent, split, wasted away, or decayed through antiquity of building, or demolished and destroyed by wicked Athalia. See 2 Chron.24.7.]"}],"6":[{"catchword":null,"tekst":"But it came to pass in the three and twentieth year of King Joas; that the Priests had not repair the breaches of the house."}],"7":[{"catchword":null,"tekst":"Then King Joas called Jojada the Priest, and the (other) Priests, and said unto them; why repair ye not the breaches of the house? Now then take no money of your acquaintance, [As ye did before, see v.4.5.] that ye should give it for the breaches of the house. [as ye indeed promised, but did not perform.]"}],"8":[{"catchword":null,"tekst":"And the Priests consented to take no money of the people, neither to repair the breaches of the house."}],"9":[{"catchword":null,"tekst":"But the Priest Jojada took a chest, [With the consent and at the command of the King, 2 Chron.24.8.] and bored a hole in the lid [Heb. door] of it, and set it by the altar on the right hand when any man came into the house of the LORD; [understand at the post, to beside the door, where they entered into the Court of the Priests, where the altar of burnt offering stood, at the end of the great Court: for so far might all Israel come, as the Levites there kept the watch at the threshold of this door, Num 18:4. Such an offering-chest was also yet in the Temple in Christ time. See Mark 11.41. Luk 21:1.] and the Priests that kept the threshold, [to wit, of the gate of the Priests court, and that according to the Lords prescript, Num 18:4.] put therein all the money that was brought into the house of the LORD."}],"10":[{"catchword":null,"tekst":"Now it came to pass, when they saw that (there) was much money in the chest, that the Kings Scribe, [i.e. Notary, or Secretary. So below cha.19.9. and 22.3. also 2 Sam.8.17.] came up with the high Priest, and bound oit together, [to wit, in bundles or bags] and told the money that was found in the house of the LORD."}],"11":[{"catchword":null,"tekst":"And they delivered the money well weighed into the hands of those that took care of that work, [Heb. Doers of that work. So below chap.22.5. That is, that were appointed as Overseers over this work of the Temple] who were appointed over the house of the LORD: and they laid it out to the Carpenters, [Heb. Artificers, or Workmen of the wood] and to the Builders that repaired the house of the LORD."}],"12":[{"catchword":null,"tekst":"And to the Bricklayers, [The Hebrew word signifieth generally those that make stone walls, wooden walls and fences. So below chap.22.6. Isa 58:12. Eze 22:30. Hence it is taken for Bricklayers] and to the Masons, and to buy wood and hewed stones, [Heb. stones of hewing out, or cutting. That is, that are hewed out of the ground, and after that must be squared and fashioned by hewing, or cutting for certain use] to repair the breaches of the house of the LORD: and for all that was given out for the house, to repair (that). [Heb. that went, etc. i.e. that was disbursed or otherewise laid out, toward the repairing of the Temple.]"}],"13":[{"catchword":null,"tekst":"Howbeit, (there) were not made for the house of the LORD silver bowels, flesh-books, spink-basons, trumpets, [See of these vessels 1 Kings 7.50.] (nor) any golden vessel, or silver vessel, of the money that was brought into the house of the LORD. [that is, they furthered the building of the Temple so much, that they made not the vessels belonging to the worship of God, until the whole building or fabric was finished: but after that they made also all manner of vessels of the residue or remainder of the money. See 2 Chron.24.14.]"}],"14":[{"catchword":null,"tekst":"But they gave that to those that did the work: and they repaired therewith the house of the LORD."}],"15":[{"catchword":null,"tekst":"Besides, they demanded no account of the men, [Or caused not the men to make any account, or reckoned not with them] into whose hands they delivered that money, to give (it) to those that did the work: for they dealt faithfully. [Heb. in truth, or faithfulness, that is, in good faith. The meaning is; as the money was trusted to their ho // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
