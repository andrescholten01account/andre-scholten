en.","5":"Daartoe bouwde hij altaren voor heel het leger van de hemel, in beide voorhoven van het huis van de HEERE.","6":"Ja, hij liet zijn zoon door het vuur gaan, en pleegde waarzeggerij en lette op vogelgeschrei; en hij stelde geestenbezweerders en waarzeggers aan; hij deed zeer veel kwaad in de ogen van de HEERE, om *Hem* tot toorn te verwekken.","7":"Hij plaatste ook een gesneden beeld van de gewijde paal die hij gemaakt had, in het huis waarvan de HEERE gezegd had tot David en tot zijn zoon Salomo: In dit huis, en in Jeruzalem, dat Ik uit alle stammen van Israël verkozen heb, zal Ik Mijn Naam vestigen voor eeuwig.","8":"En Ik zal niet langer de voet van Israël laten wankelen uit dit land, dat Ik hun vaderen gegeven heb; alleen als zij nauwlettend doen naar alles wat Ik hun geboden heb, en naar de hele wet die Mijn dienaar Mozes hun geboden heeft.","9":"Maar zij luisterden niet; want Manasse deed hen dwalen, zodat zij erger deden dan de heidenvolken, die de HEERE voor de kinderen van Israël weggevaagd had.","10":"Toen sprak de HEERE door de dienst van Zijn dienaren, de profeten, en zei:","11":"Omdat Manasse, de koning van Juda, deze gruwelen gedaan heeft, erger doend dan alles wat de Amorieten gedaan hebben die vóór hem geweest zijn, ja, ook Juda door zijn drekgoden heeft doen zondigen;","12":"Daarom, zo zegt de HEERE, de God van Israël: Zie, Ik ga een kwaad over Jeruzalem en Juda brengen, zodat ieder die het hoort, beide zijn oren zullen tuiten.","13":"En Ik zal over Jeruzalem het meetsnoer van Samaria trekken, alsook het paslood van het huis van Achab; en Ik zal Jeruzalem uitwissen, zoals men een schotel uitwist; men wist hem uit, en men keert hem om op zijn holle kant.","14":"En Ik zal het overblijfsel van Mijn erfdeel verlaten, en zal het in de hand van hun vijanden geven; en zij zullen tot een roof en plundering worden voor al hun vijanden.","15":"Omdat zij gedaan hebben wat kwaad was in Mijn ogen, en Mij tot toorn verwekt hebben, vanaf de dag dat hun vaderen uit Egypte uitgegaan zijn, tot op deze dag toe.","16":"Daartoe vergoot Manasse ook zeer veel onschuldig bloed, totdat hij Jeruzalem van het ene eind tot het andere ermee gevuld had; behalve zijn zonde waarmee hij Juda deed zondigen, door te doen wat kwaad was in de ogen van de HEERE.","17":"Het overige van de geschiedenis van Manasse, en alles wat hij gedaan heeft, en zijn zonde die hij begaan heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Juda?","18":"En Manasse ontsliep met zijn vaderen, en werd begraven in de tuin van zijn huis, in de tuin van Uzza; en zijn zoon Amon werd koning in zijn plaats.","19":"Amon was tweeëntwintig jaar oud, toen hij koning werd, en hij regeerde twee jaar te Jeruzalem; en de naam van zijn moeder was Mesullemet, een dochter van Haruz uit Jotba.","20":"En hij deed wat kwaad was in de ogen van de HEERE, zoals zijn vader Manasse gedaan had.","21":"Want hij ging in heel de weg die zijn vader gegaan was, en hij diende de drekgoden die zijn vader gediend had, en hij boog zich voor ze neer.","22":"Zo verliet hij de HEERE, de God van zijn vaderen, en hij ging niet in de weg van de HEERE.","23":"En de dienaren van Amon smeedden een samenzwering tegen hem, en zij doodden de koning in zijn huis.","24":"Maar het volk van het land versloeg allen die tegen koning Amon een samenzwering gesmeed hadden; en het volk van het land maakte zijn zoon Josia koning in zijn plaats.","25":"Het overige van de geschiedenis van Amon, wat hij gedaan heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Juda?","26":"En men begroef hem in zijn graf, in de tuin van Uzza; en zijn zoon Josia werd koning in zijn plaats."},"SV":{"1":"Manasse was twaalf jaren oud, toen hij koning werd, en hij regeerde vijf en vijftig jaren te Jeruzalem; en de naam zijner moeder was Hefzi-bah.","2":"En hij deed dat kwaad was in de ogen des HEEREN, naar de gruwelen der heidenen, die de HEERE voor het aangezicht der kinderen Israëls uit de bezitting verdreven had.","3":"Want hij bouwde de hoogten weder op, die Hizkia, zijn vader, verdorven had; en hij richtte Baäl altaren op, en maakte een bos, gelijk als Achab, de koning van Israël, gemaakt had, en boog zich neder voor al het heir des hemels, en diende ze.","4":"En hij bouwde altaren in het huis des HEEREN, waarvan de HEERE gezegd had: Te Jeruzalem zal Ik Mijn Naam zetten.","5":"Daartoe bouwde hij altaren voor al het heir des hemels, in beide de voorhoven van het huis des HEEREN.","6":"Ja, hij deed zijn zoon door het vuur gaan, en pleegde guichelarij en gaf op vogelgeschrei acht; en hij stelde waarzeggers en duivelskunstenaren; hij deed zeer veel kwaads in de ogen des HEEREN, om *Hem* tot toorn te verwekken.","7":"Hij stelde ook een gesneden beeld van het bos, dat hij gemaakt had, in het huis, waarvan de HEERE gezegd had tot David, en tot zijn zoon Salomo: In dit huis, en in Jeruzalem, die Ik uit alle stammen van Israël verkoren heb, zal Ik Mijn Naam zetten in eeuwigheid.","8":"En Ik zal niet voortvaren den voet van Israël te bewegen uit dit land, dat Ik hun vaderen gegeven heb; alleenlijk, zo zij waarnemen te doen, naar alles, wat Ik hun geboden heb, en naar de ganse wet, die Mijn knecht Mozes hun geboden heeft.","9":"Maar zij hoorden niet; want Manasse deed hen dwalen, dat zij erger deden dan de heidenen, die de HEERE voor het aangezicht der kinderen Israëls verdelgd had.","10":"Toen sprak de HEERE door den dienst van Zijn knechten, de profeten, zeggende:","11":"Dewijl dat Manasse, de koning van Juda, deze gruwelen gedaan heeft, erger doende dan al wat de Amorieten gedaan hebben, die voor hem geweest zijn, ja, ook Juda door zijn drekgoden heeft doen zondigen;","12":"Daarom, alzo zegt de HEERE, de God Israëls: Ziet, Ik zal een kwaad over Jeruzalem en Juda brengen, dat een ieder, die het hoort, beide zijn oren klinken zullen.","13":"En Ik zal over Jeruzalem het meetsnoer van Samaria trekken, mitsgaders het paslood van het huis van Achab; en Ik zal Jeruzalem uitwissen, gelijk als men een schotel uitwist; men wist dien uit, en men keert hem om op zijn holligheid.","14":"En Ik zal het overblijfsel Mijns erfdeels verlaten, en zal ze in de hand hunner vijanden geven; en zij zullen tot een roof en plundering worden al hun vijanden.","15":"Daarom, dat zij gedaan hebben dat kwaad was in Mijn ogen, en Mij tot toorn verwekt hebben, van dien dag, dat hun vaderen van Egypte uitgegaan zijn, ook tot op dezen dag toe.","16":"Daartoe vergoot Manasse ook zeer veel onschuldig bloed, totdat hij Jeruzalem van het ene einde tot het andere vervuld had; behalve zijn zonde, die hij Juda zondigen deed, doende wat kwaad was in de ogen des HEEREN.","17":"Het overige der geschiedenissen van Manasse, en al wat hij gedaan heeft, en zijn zonde, die hij gezondigd heeft, zijn die niet geschreven in het boek der kronieken der koningen van Juda?","18":"En Manasse ontsliep met zijn vaderen, en werd begraven in den hof van zijn huis, in den hof van Uzza; en zijn zoon Amon werd koning in zijn plaats.","19":"Amon was twee en twintig jaren oud, toen hij koning werd, en hij regeerde twee jaren te Jeruzalem; en de naam zijner moeder was Mesullemet, een dochter van Haruz van Jotba.","20":"En hij deed dat kwaad was in de ogen des HEEREN; gelijk als zijn vader Manasse gedaan had.","21":"Want hij wandelde in al den weg, dien zijn vader gewandeld had, en hij diende de drekgoden, die zijn vader gediend had, en hij boog zich voor die neder.","22":"Zo verliet hij den HEERE, den God zijner vaderen, en hij wandelde niet in den weg des HEEREN.","23":"En de knechten van Amon maakten een verbintenis tegen hem, en zij doodden den koning in zijn huis.","24":"Maar het volk des lands versloeg allen, die tegen den koning Amon een verbintenis gemaakt hadden; en het volk des lands maakte zijn zoon Josia koning in zijn plaats.","25":"Het overige nu der geschiedenissen van Amon, wat hij gedaan heeft, zijn die niet geschreven in het boek der kronieken der koningen van Juda?","26":"En men begroef hem in zijn graf, in den hof van Uzza; en zijn zoon Josia werd koning in zijn plaats."},"KJV":{"1":"Manasseh was twelve years old when he began to reign, and reigned fifty and five years in Jerusalem. And his mother's name was Hephzibah.","2":"And he did that which was evil in the sight of the LORD, after the abominations of the heathen, whom the LORD cast out before the children of Israel.","3":"For he built up again the high places which Hezekiah his father had destroyed; and he reared up altars for Baal, and made a grove, as did Ahab king of Israel; and worshipped all the host of heaven, and served them.","4":"And he built altars in the house of the LORD, of which the LORD said, In Jerusalem will I put my name.","5":"And he built altars for all the host of heaven in the two courts of the house of the LORD.","6":"And he made his son pass through the fire, and observed times, and used enchantments, and dealt with familiar spirits and wizards: he wrought much wickedness in the sight of the LORD, to provoke him to anger.","7":"And he set a graven image of the grove that he had made in the house, of which the LORD said to David, and to Solomon his son, In this house, and in Jerusalem, which I have chosen out of all tribes of Israel, will I put my name for ever:","8":"Neither will I make the feet of Israel move any more out of the land which I gave their fathers; only if they will observe to do according to all that I have commanded them, and according to all the law that my servant Moses commanded them.","9":"But they hearkened not: and Manasseh seduced them to do more evil than did the nations whom the LORD destroyed before the children of Israel.","10":"And the LORD spake by his servants the prophets, saying,","11":"Because Manasseh king of Judah hath done these abominations, and hath done wickedly above all that the Amorites did, which were before him, and hath made Judah also to sin with his idols:","12":"Therefore thus saith the LORD God of Israel, Behold, I am bringing such evil upon Jerusalem and Judah, that whosoever heareth of it, both his ears shall tingle.","13":"And I will stretch over Jerusalem the line of Samaria, and the plummet of the house of Ahab: and I will wipe Jerusalem as a man wipeth a dish, wiping it, and turning it upside down.","14":"And I will forsake the remnant of mine inheritance, and deliver them into the hand of their enemies; and they shall become a prey and a spoil to all their enemies;","15":"Because they have done that which was evil in my sight, and have provoked me to anger, since the day their fathers came forth out of Egypt, even unto this day.","16":"Moreover Manasseh shed innocent blood very much, till he had filled Jerusalem from one end to another; beside his sin wherewith he made Judah to sin, in doing that which was evil in the sight of the LORD.","17":"Now the rest of the acts of Manasseh, and all that he did, and his sin that he sinned, are they not written in the book of the chronicles of the kings of Judah?","18":"And Manasseh slept with his fathers, and was buried in the garden of his own house, in the garden of Uzza: and Amon his son reigned in his stead.","19":"Amon was twenty and two years old when he began to reign, and he reigned two years in Jerusalem. And his mother's name was Meshullemeth, the daughter of Haruz of Jotbah.","20":"And he did that which was evil in the sight of the LORD, as his father Manasseh did.","21":"And he walked in all the way that his father walked in, and served the idols that his father served, and worshipped them:","22":"And he forsook the LORD God of his fathers, and walked not in the way of the LORD.","23":"And the servants of Amon conspired against him, and slew the king in his own house.","24":"And the people of the land slew all them that had conspired against king Amon; and the people of the land made Josiah his son king in his stead.","25":"Now the rest of the acts of Amon which he did, are they not written in the book of the chronicles of the kings of Judah?","26":"And he was buried in his sepulchre in the garden of Uzza: and Josiah his son reigned in his stead."}},"tsk":{"1":[{"kopje":"twaalf jaar oud","refs":["2 Kon 20:21","1 Kron 3:13","2 Kron 32:33","2 Kron 33:1-9","Matt 1:10"]},{"kopje":"Hefzi-bah","refs":["Spr 5:19","Jes 62:4"]}],"2":[{"kopje":"En hij deed","refs":["2 Kon 21:7","2 Kon 21:16","2 Kon 16:2-4","2 Kon 22:17","2 Kron 33:2-4"]},{"kopje":"naar de gruwelen","refs":["Lev 18:25-29","Deut 12:31","2 Kron 36:14","Ezech 16:51"]}],"3":[{"kopje":"de hoogten","refs":["2 Kon 18:4","2 Kon 18:22","2 Kron 32:12","2 Kron 34:3"]},{"kopje":"richtte op","refs":["2 Kon 10:18-20","1 Kon 16:31-33","1 Kon 18:21","1 Kon 18:26"]},{"kopje":"Achab","refs":["2 Kon 8:18","2 Kon 8:27","Micha 6:16"]},{"kopje":"en diende het","refs":["2 Kon 17:16","2 Kon 23:4","Deut 4:19","Deut 17:3","2 Kron 33:3-5","Job 31:26"]}],"4":[{"kopje":"bouwde","refs":["2 Kon 16:10-16","Jer 32:34"]},{"kopje":"Te Jeruzalem","refs":["Ex 20:24","Deut 12:5","2 Sam 7:13","1 Kon 8:29","1 Kon 9:3","Ps 78:68","Ps 78:69","Ps 132:13","Ps 132:14"]}],"5":[{"kopje":"in beide voorhoven","refs":["2 Kon 23:4","2 Kon 23:6","1 Kon 6:36","1 Kon 7:12","2 Kron 33:5","2 Kron 33:15","Ezech 40:28","Ezech 40:32","Ezech 40:37","Ezech 40:47","Ezech 42:3","Ezech 43:5","Ezech 44:19"]}],"6":[{"kopje":"liet gaan","refs":["2 Kon 16:3","2 Kon 17:17","Lev 18:21","Lev 20:2","Lev 20:3","2 Kron 28:3","2 Kron 33:6","Micha 6:7"]},{"kopje":"lette op vogelgeschrei","refs":["Lev 19:26","Lev 19:31","Deut 18:10-14"]},{"kopje":"geestenbezweerders","refs":["1 Kron 10:13","Jes 8:19","Jes 19:3","Hand 16:16"]},{"kopje":"deed","refs":["2 Kon 24:3","2 Kon 24:4","Gen 13:13"]}],"7":[{"kopje":"plaatste","refs":["2 Kon 23:6","2 Kron 33:7","2 Kron 33:15"]},{"kopje":"In dit huis","refs":["2 Kon 21:4","2 Kon 23:27","2 Sam 7:13","1 Kon 8:29","1 Kon 8:44","1 Kon 9:3","1 Kon 9:7","2 Kron 7:12","2 Kron 7:16","2 Kron 7:20","Neh 1:9","Ps 74:2","Ps 78:68","Ps 78:69","Ps  which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> In <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> will I <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H8034\">name.</span>","5":"And he <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> for all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> in the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2691\">courts</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","6":"And he made his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> through the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and observed <span class=\"wl wl-kjv\" data-code=\"H6049\">times,</span> and used <span class=\"wl wl-kjv\" data-code=\"H5172\">enchantments,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">dealt</span> with familiar <span class=\"wl wl-kjv\" data-code=\"H178\">spirits</span> and <span class=\"wl wl-kjv\" data-code=\"H3049\">wizards:</span> he <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">much</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to provoke him to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger.</span>","7":"And he <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> a graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image</span> of the <span class=\"wl wl-kjv\" data-code=\"H842\">grove</span> that he had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> of which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> In this <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> out of all <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> will I <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span>","8":"Neither will I make the <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5110\">move</span> any <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> out of the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> which I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers;</span> only if they will <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to all that I have <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them, and according to all the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> that my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them.","9":"But they <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> not: and <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> <span class=\"wl wl-kjv\" data-code=\"H8582\">seduced</span> them to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> more <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> than did the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","10":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","11":"Because <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> these <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations,</span> and hath done <span class=\"wl wl-kjv\" data-code=\"H7489\">wickedly</span> above all that the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> which were <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, and hath made <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> also to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> with his <span class=\"wl wl-kjv\" data-code=\"H1544\">idols:</span>","12":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Behold, I am <span class=\"wl wl-kjv\" data-code=\"H935\">bringing</span> such <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> that whosoever <span class=\"wl wl-kjv\" data-code=\"H8085\">heareth</span> of it, <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> his <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> shall <span class=\"wl wl-kjv\" data-code=\"H6750\">tingle.</span>","13":"And I will <span class=\"wl wl-kjv\" data-code=\"H5186\">stretch</span> over <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> the <span class=\"wl wl-kjv\" data-code=\"H6957\">line</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4949\">plummet</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H4229\">wipe</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> as a man <span class=\"wl wl-kjv\" data-code=\"H4229\">wipeth</span> a <span class=\"wl wl-kjv\" data-code=\"H6747\">dish,</span> <span class=\"wl wl-kjv\" data-code=\"H4229\">wiping</span> it, and <span class=\"wl wl-kjv\" data-code=\"H2015\">turning</span> it upside <span class=\"wl wl-kjv\" data-code=\"H6440\">down.</span>","14":"And I will <span class=\"wl wl-kjv\" data-code=\"H5203\">forsake</span> the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of mine <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies;</span> and they shall become a <span class=\"wl wl-kjv\" data-code=\"H957\">prey</span> and a <span class=\"wl wl-kjv\" data-code=\"H4933\">spoil</span> to all their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies;</span>","15":"Because they have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> that which was <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in my <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> and have <span class=\"wl wl-kjv\" data-code=\"H4480\">provoked</span> me to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger,</span> since the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> even unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","16":"Moreover <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H5355\">innocent</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">much,</span> till he had <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> from one <span class=\"wl wl-kjv\" data-code=\"H6310\">end</span> to <span class=\"wl wl-kjv\" data-code=\"H6310\">another;</span> beside his <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> wherewith he made <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> in <span class=\"wl wl-kjv\" data-code=\"H6213\">doing</span> that which was <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","17":"Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> that he <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah?</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in the <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> of his own <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> in the <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> of <span class=\"wl wl-kjv\" data-code=\"H5798\">Uzza:</span> and <span class=\"wl wl-kjv\" data-code=\"H526\">Amon</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.","19":"<span class=\"wl wl-kjv\" data-code=\"H526\">Amon</span> was <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H4922\">Meshullemeth,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H2743\">Haruz</span> of <span class=\"wl wl-kjv\" data-code=\"H3192\">Jotbah.</span>","20":"And he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did.</span>","21":"And he <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> in all the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> walked <span class=\"wl wl-kjv\" data-code=\"H1980\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> the <span class=\"wl wl-kjv\" data-code=\"H1544\">idols</span> that his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">served,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> them:","22":"And he <span class=\"wl wl-kjv\" data-code=\"H5800\">forsook</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> not in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","23":"And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H526\">Amon</span> <span class=\"wl wl-kjv\" data-code=\"H7194\">conspired</span> against him, and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> in his own <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","24":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> all them that had <span class=\"wl wl-kjv\" data-code=\"H7194\">conspired</span> against <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H526\">Amon;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> made <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">king</span> in his stead.","25":"Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H526\">Amon</span> which he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah?</span>","26":"And he was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in his <span class=\"wl wl-kjv\" data-code=\"H6900\">sep l, dat hun zinnen zullen ontzet en bedwelmd worden, gelijk het gehoor des mensen door een geweldig gedeun en stijf geklank, recht voor de oren gemaakt, pleegt verdoofd te worden. Zie dezelfde gelijkenis 1Sa 3:11; Jer 19:3."}],"13":[{"catchword":"meetsnoer van Samaria","tekst":"Versta, de maat, of regel; dat is de hoedanigheid en gelijkheid der straf. De zin is, zulke straf, als Ik over de tien stammen en hun hoofdstad Samaria gezonden heb, zal Ik ook zenden over Juda en Jeruzalem, dat het land overheerd, de stad ingenomen en de inwoners gevankelijk zullen weggevoerd worden. Het is een gelijkenis, genomen van de timmerlieden en metselaars, die naar zekere maat hun werken zo afbreken als maken. Vergelijk Isa 34:11; Amo 7:7-8; Zec 1:16."},{"catchword":"paslood","tekst":"De voorgaande gelijkenis wordt behouden om te verklaren dat Jeruzalem gelijke straf overkomen zou, als het huis Achabs overkomen was."},{"catchword":"Ik zal","tekst":"De zin is, gelijk men de schotels, die tot een rein gebruik geheiligd worden, van alle vuiligheid uitwist of schuurt, en daarna omkeert opdat geen onreinigheid daarin valle; alzo zal Jeruzalem van de boze inwoners door wegvoering gezuiverd en hun regering zo omgekeerd worden, dat het opperste onder liggen zal."},{"catchword":"op zijn holligheid","tekst":"Of, randen. Hebreeuws, op zijn aangezicht."}],"14":[{"catchword":"overblijfsel","tekst":"Versta, den stam van Juda, of de Joden die alleen met degenen, die zich aan dezelve hielden, uit de Israëlieten overig waren, den naam van Gods volk voerende. Dit noemt God zijn erfdeel, omdat het Hem zo lief was als iemand zijn erfdeel is."}],"16":[{"catchword":"bloed,","tekst":"Te weten, dergenen, die zijne gruwelen niet wilden navolgen."},{"catchword":"van het ene einde","tekst":"Hebreeuws, mond aan mond. Zie boven, 2Ki 10:21."},{"catchword":"zonde,","tekst":"Versta, de afgoderij, welke met zonderlinge uitneming zonde genoemd wordt, omdat zij regelrecht gaat tegen de majesteit Gods, van Hem ten hoog fore all the host of heaven, [understand the fun and moon with the rest of the planets and stars. See Deut.4.v.19. and the annotate.] and served them."}],"4":[{"catchword":null,"tekst":"And he built altars in the house of the Lord, [see Jer 32:34] of which the Lord had said; at Jerusalem will I put my name. [Understand the name of the Lord only, and not likewise the names of Idols. See the meaning of these words 1 kings 8. on v.29. see also Deut.12.5,11]"}],"5":[{"catchword":null,"tekst":"Moreover, he built altars for all the host of heaven in both the courts of the house of the Lord. [Whereof the first, or inner court was the priest&acirc;&euro;&trade;s court, standing next to the temple; the other the people&acirc;&euro;&trade;s court, without joining to the first. See of both 1 Kings 6 on v.36.]"}],"6":[{"catchword":null,"tekst":"Yea, he made his son pass thorow the fire; [to wit in the valley of the son of Hinnom, 2 chron.22.6 to the honor of the idol Molech. See Lev.18. on verse 21.] and practiced juggling; [see of the signification of the Hebrew word, Lev.19 on verse 26.] and gave heed to the crying of birds; [see of the signification of the Hebrew word, Lev.19. on verse26.] and he appointed sooth-sayers and Necromancers, [Heb. He made, see of the Hebrew word sooth-sayers and the next following, lev19 on v.31. these Manasseh is said to have made, because he publicly ordained and appoint-pointed them, that thy might be ready to wait and attend upon all men with their devilish arts] he did very much evil in the eyes of the Lord, to provoke (him) [this word is here inserted out of 2 Chron.33.6.] to anger."}],"7":[{"catchword":null,"tekst":"he set also a carved images of the grove, [Or, the carved image, pointing at a certain image of the idolatrous grove] which he had made [see above v3. in the house of which the LORD had said to David and to Solomon his son; I his house and in Jerusalem, which I have chosen out of all the tribes of Israel, [i.e. out of all places and cities, that are inhabited by the tribes] will I put my name [see above on verse 4.] for ever [That is, during the time of the law. See Gen.13 on v.15.]"}],"8":[{"catchword":null,"tekst":"Neither will I proceed to remove the foot of Israel out of this land, which I gave their fathers; [or as it is said 2 Chron.33.8. to make them remove or to take them away, that is, to make the Israelites remove, wander and shift up and down out of this land: as befell the ten tribes, above chapter 18.11.] only if they observer what to do according to all that I have commanded them, and according to all the law, understand the moral ceremonial and judicial lawes. See 2 chron.33 the annotate on verse 8.] Which my servant Moseh commanded them."}],"9":[{"catchword":null,"tekst":"But they hearkened not: for Manasseh made them to erre, (so) that they did worse then the heathen, [to wit, because they most treacherously rejected the light of the true knowledge of God, and the prescript or platform of pure religion, which the heathen had not, and exceeded the heathen in the abomination of the idolatry, who served not many strange idols, containing themselves for the most part with their own. Th. Doing worse; which may also be understood of king Manasseh, as below v.11.] which the Lord had destroyed before the face of the children of Israel."}],"10":[{"catchword":null,"tekst":"then the Lord spake by the ministry [Heb. Hand] of his servants the prophets, saying,"}],"11":[{"catchword":null,"tekst":"Because Manasseh king of Juda hath done these abominations, doing worse then all that the Amorites [under the name of this one nation are often all infidels and heathenish nations of the land of Canaan comprehended. See Gen. 15 on verse 16.] did which were before him, yea hath made Juda also to sin with his dung-Gods: [see Lev.26 on verse 30.]"}],"12":[{"catchword":null,"tekst":"Therefore, thus saith the Lord the God of Israel: behold, I bring an evil upon Jerusalem and Juda, that every one that beareth it, both his cars shall tingle. [understand such an evil that shall cause so great astonishment, fear and terror in all men&acirc;&euro;&trade;s hearts, that their senses shall be amazed and distracted as a man&acirc;&euro;&trade;s hearing is wont to be deafened by an excessive loud sound and a vehement noise made just before or against his ear. See the same comparison, 1 Sam. 8.11. Jer 19:3.]"}],"13":[{"catchword":null,"tekst":"And I will draw the measuring-line of Samaria over Jerusalem, [By the measuring &acirc;&euro;&ldquo;line, here is meant the measure, or rule; that is the quality and likeness of the judgment. The meaning is, such a judgment as I brought upon the ten tribes, and their chief city Samaria, will bring upon Juda and Jerusalem, that the land shall be laid wast, the city taken, and the inhabitants carried away captive. &acirc;&euro;&tilde;tis a comparison taken from carpenters and Masons or bricklayers who both rear and raise their work by line and measure. Compare Isaia. 34.11. Amos 7v7,8. Zach.1.16.] and the plummet of the house of Achah, [the former similitude is still retained, to shew that the like judgment should befall Jerusalem, as befell Achab&acirc;&euro;&trade;s house] and I will wipe Jerusalem, as they wipe a dish; they wipe it, and turn it upside down upon it&acirc;&euro;&trade;s hallowness. [Or, rands,brims. Heb. Upon its face. The meaning is, as dishes are employed for a clean use, are washed and scoured from all filth, and after that turned upside down that no unclean thing may fall into them: so shall Jerusalem by transportation be purged from wicked inhabitants, and the government thereof turned upside down, that the uppermost part shall lie under.]"}],"14":[{"catchword":null,"tekst":"And I will forsake the remnant of the inheritance, [understand the tribe of Juda, or the Jews, who alone, which those that sided with them, were left of the Israelites, bearing the name of the people of god. God calleth this tribe his inheritance, because they were as dear unto him, as an inheritance is to a man] and will deliver them into the hand of their enemies: and they shall become a prey and a spoil to all their enemies:"}],"15":[{"catchword":null,"tekst":"because they did that which was evil in mine eyes, and provoked me to anger from that day, that their fathers came forth out of Egypt, even unto this day."}],"16":[{"catchword":null,"tekst":"Besides, Manasseh shed also very much innocent blood, [to wit, of those that would not follow his abominations] till he had filled Jerusalem from one end to another; [Heb. Mouth to mouth. See above chap.10 on v.21] beside his sin, [understand idolatry, which by the way of special eminency is called sin, because it directly opposeth and crosseth the Majesty of God, is in the highest degree hated and forbidden, and left unpunished by him, se e 1 kings 11 on v.6 and 12 on v.30.] which he made Juda to sin doing that which was evil in the eyes of the Lord."}],"17":[{"catchword":null,"tekst":"Now the rest of the acts of Manasseh, and all that he did and his sin, [understand especially his idolatry against God, and his tyranny against men] which he sinned, are they not written in the book of the chronicles of the kings of Judah? [Understand herewith his captivity, repentance and conversion, and actions that followed thereon, of which see also, 2 chron. 33.11, 12]"}],"18":[{"catchword":null,"tekst":"And Manasseh fell asleep which his fathers, and was buried in the garden of his (own) house, in the garden of Uzza: And Amon his son became King in his stead."}],"19":[{"catchword":null,"tekst":"Amon was two and twenty years old, [Heb. A son of two and twenty years] when he became King, and he reigned two years at Jerusalem: And his mothers name was Messullement, a daughter of Haruz of Jotha, [some are of opinion that this was Jotbath, where the Israelites had a camping place, when they journeyed from Egypt thorow the wilderness towards the land of Canaan, Num. 33.33 (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
