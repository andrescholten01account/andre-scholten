 de HEERE heeft mij naar Beth-el gezonden. Maar Elisa zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Zo gingen zij af naar Beth-el.", "3": "Toen gingen de zonen van de profeten, die te Beth-el waren, naar Elisa toe, en zeiden tegen hem: Weet u dat de HEERE vandaag uw heer van boven uw hoofd wegnemen zal? En hij zei: Ik weet het ook wel, zwijgt u stil.", "4": "En Elia zei tegen hem: Elisa, blijf toch hier, want de HEERE heeft mij naar Jericho gezonden. Maar hij zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Zo kwamen zij te Jericho.", "5": "Toen traden de zonen van de profeten, die te Jericho waren, naar Elisa toe, en zeiden tegen hem: Weet u dat de HEERE vandaag uw heer van boven uw hoofd wegnemen zal? En hij zei: Ik weet het ook wel, zwijgt u stil.", "6": "En Elia zei tegen hem: Blijf toch hier, want de HEERE heeft mij naar de Jordaan gezonden. Maar hij zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! En zij beiden gingen verder.", "7": "En vijftig mannen van de zonen van de profeten gingen erheen, en gingen op afstand tegenover hen staan; en die beiden stonden bij de Jordaan.", "8": "Toen nam Elia zijn mantel, en wond hem samen, en sloeg het water, en het werd naar de ene en de andere kant verdeeld; en zij beiden gingen er door op het droge.", "9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "10": "En hij zei: U hebt een moeilijke zaak gevraagd; als u mij zult zien wanneer ik van bij u weggenomen word, zal het u zo gebeuren; maar zo niet, dan zal het niet gebeuren.", "11": "En het gebeurde, terwijl zij verder gingen, al gaande en sprekende, zie, zo was er een vurige wagen met vurige paarden, die tussen hen beiden scheiding maakten. Zo voer Elia met een storm ten hemel.", "12": "En Elisa zag het, en hij riep: Mijn vader, mijn vader, wagen van Israël en zijn ruiters! En hij zag hem niet meer; en hij greep zijn klederen en scheurde ze in twee stukken.", "13": "Hij nam ook Elia's mantel op, die van hem afgevallen was, en keerde terug, en ging bij de oever van de Jordaan staan.", "14": "En hij nam de mantel van Elia, die van hem afgevallen was, en sloeg het water, en zei: Waar is de HEERE, de God van Elia? Ja, Dezelfde? En hij sloeg het water, en het werd naar de ene en de andere kant verdeeld, en Elisa ging er door.", "15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "16": "En zij zeiden tegen hem: Zie toch, er zijn bij uw knechten vijftig dappere mannen; laat hen toch heengaan, en uw heer zoeken, of niet misschien de Geest van de HEERE hem opgenomen heeft, en op een van de bergen, of in een van de dalen hem geworpen heeft. Doch hij zei: Stuur hen niet.", "17": "Maar zij drongen bij hem aan tot het schamen toe; en hij zei: Stuur hen. En zij stuurden vijftig mannen, die drie dagen zochten, doch hem niet vonden.", "18": "Toen kwamen zij weer bij hem, terwijl hij te Jericho gebleven was; en hij zei tegen hen: Heb ik niet tegen u gezegd: Gaat niet?", "19": "En de mannen van de stad zeiden tegen Elisa: Zie toch, de ligging van deze stad is goed, zoals mijn heer ziet; maar het water is slecht, en het land onvruchtbaar.", "20": "En hij zei: Brengt mij een nieuwe schaal, en legt er zout in. En zij brachten ze naar hem toe.", "21": "Toen ging hij naar de waterbron, en wierp het zout erin, en zei: Zo zegt de HEERE: Ik heb dit water gezond gemaakt, er zal geen dood noch onvruchtbaarheid meer van komen.", "22": "Zo werd dat water gezond, tot op deze dag, naar het woord van Elisa, dat hij gesproken had.", "23": "En hij ging vandaar op naar Beth-el. Toen hij nu de weg opging, kwamen er kleine jongens uit de stad; die bespotten hem, en zeiden tegen hem: Kaalkop, ga op, kaalkop, ga op!", "24": "En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.", "25": "En hij ging vandaar naar de berg Karmel; en vandaar keerde hij terug naar Samaria."}, "SV": {"1": "Het geschiedde nu, als de HEERE Elia met een onweder ten hemel opnemen zou, dat Elia met Elisa ging van Gilgal.", "2": "En Elia zeide tot Elisa: Blijf toch hier, want de HEERE heeft mij naar Beth-el gezonden. Maar Elisa zeide: *Zo* *waarachtig* *als* de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Alzo gingen zij af naar Beth-el.", "3": "Toen gingen de zonen der profeten, die te Beth-el waren, tot Elisa uit, en zeiden tot hem: Weet gij, dat de HEERE heden uw heer van uw hoofd wegnemen zal? En hij zeide: Ik weet het ook wel, zwijgt gij stil.", "4": "En Elia zeide tot hem: Elisa, blijf toch hier, want de HEERE heeft mij naar Jericho gezonden. Maar hij zeide: *Zo* *waarachtig* *als* de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Alzo kwamen zij te Jericho.", "5": "Toen traden de zonen der profeten, die te Jericho waren, naar Elisa toe, en zeiden tot hem: Weet gij, dat de HEERE heden uw heer van uw hoofd wegnemen zal? En hij zeide: Ik weet het ook wel, zwijgt gij stil.", "6": "En Elia zeide tot hem: Blijf toch hier, want de HEERE heeft mij naar de Jordaan gezonden. Maar hij zeide: *Zo* *waarachtig* *als* de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! En zij beiden gingen henen.", "7": "En vijftig mannen van de zonen der profeten gingen henen, en stonden tegenover van verre; en die beiden stonden aan de Jordaan.", "8": "Toen nam Elia zijn mantel, en wond *hem* samen, en sloeg het water, en het werd herwaarts en derwaarts verdeeld; en zij beiden gingen er door op het droge.", "9": "Het geschiedde nu, als zij overgekomen waren, dat Elia zeide tot Elisa: Begeer wat ik u doen zal, eer ik van bij u weggenomen worde. En Elisa zeide: Dat toch twee delen van uw geest op mij zijn!", "10": "En hij zeide: Gij hebt een harde zaak begeerd; indien gij mij zult zien, als ik van bij u weggenomen worde, het zal u alzo geschieden; doch zo niet, het zal niet geschieden.", "11": "En het gebeurde, als zij voortgingen, gaande en sprekende, ziet, zo was er een vurige wagen met vurige paarden, die tussen hen beiden scheiding maakten. Alzo voer Elia met een onweder ten hemel.", "12": "En Elisa zag het, en hij riep: Mijn vader, mijn vader, wagen Israëls en zijn ruiteren! En hij zag hem niet meer; en hij vatte zijn klederen en scheurde ze in twee stukken.", "13": "Hij hief ook Elia’s mantel op, die van hem afgevallen was, en keerde weder, en stond aan den oever van de Jordaan.", "14": "En hij nam den mantel van Elia, die van hem afgevallen was, en sloeg het water, en zeide: Waar is de HEERE, de God van Elia? Ja, Dezelve? En hij sloeg het water, en het werd herwaarts en derwaarts verdeeld, en Elisa ging er door.", "15": "Als nu de kinderen der profeten, die tegenover te Jericho waren, hem zagen, zo zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neder ter aarde.", "16": "En zij zeiden tot hem: Zie nu, er zijn bij uw knechten vijftig dappere mannen; laat hen toch heengaan, en uw heer zoeken, of niet misschien de Geest des HEEREN hem opgenomen, en op een der bergen, of in een der dalen hem geworpen heeft. Doch hij zeide: Zendt niet.", "17": "Maar zij hielden bij hem aan tot schamens toe; en hij zeide: Zendt. En zij zonden vijftig mannen, die drie dagen zochten, doch hem niet vonden.", "18": "Toen kwamen zij weder tot hem, daar hij te Jericho gebleven was; en hij zeide tot hen: Heb ik tot ulieden niet gezegd: Gaat niet?", "19": "En de mannen der stad zeiden tot Elisa: Zie toch, de woning dezer stad is goed, gelijk als mijn heer ziet; maar het water is kwaad, en het land onvruchtbaar.", "20": "En hij zeide: Brengt mij een nieuwe schaal, en legt er zout in. En zij brachten ze tot hem.", "21": "Toen ging hij uit tot de waterwel, en wierp het zout daarin, en zeide: Zo zegt de HEERE: Ik heb dit water gezond gemaakt, er zal geen dood noch onvruchtbaarheid meer van worden.", "22": "Alzo werd dat water gezond, tot op dezen dag, naar het woord van Elisa, dat hij gesproken had.", "23": "En hij ging van daar op naar Beth-el. Als hij nu den weg opging, zo kwamen kleine jongens uit de stad; die bespotten hem, en zeiden tot hem: Kaalkop, ga op, kaalkop, ga op!", "24": "En hij keerde zich achterom, en hij zag ze, en vloekte hen, in den Naam des HEEREN. Toen kwamen twee beren uit het woud, en verscheurden van dezelve twee en veertig kinderen.", "25": "En hij ging van daar naar den berg Karmel; en van daar keerde hij weder naar Samaria."}, "KJV": {"1": "And it came to pass, when the LORD would take up Elijah into heaven by a whirlwind, that Elijah went with Elisha from Gilgal.", "2": "And Elijah said unto Elisha, Tarry here, I pray thee; for the LORD hath sent me to Bethel. And Elisha said unto him, As the LORD liveth, and as thy soul liveth, I will not leave thee. So they went down to Bethel.", "3": "And the sons of the prophets that were at Bethel came forth to Elisha, and said unto him, Knowest thou that the LORD will take away thy master from thy head to day? And he said, Yea, I know it; hold ye your peace.", "4": "And Elijah said unto him, Elisha, tarry here, I pray thee; for the LORD hath sent me to Jericho. And he said, As the LORD liveth, and as thy soul liveth, I will not leave thee. So they came to Jericho.", "5": "And the sons of the prophets that were at Jericho came to Elisha, and said unto him, Knowest thou that the LORD will take away thy master from thy head to day? And he answered, Yea, I know it; hold ye your peace.", "6": "And Elijah said unto him, Tarry, I pray thee, here; for the LORD hath sent me to Jordan. And he said, As the LORD liveth, and as thy soul liveth, I will not leave thee. And they two went on.", "7": "And fifty men of the sons of the prophets went, and stood to view afar off: and they two stood by Jordan.", "8": "And Elijah took his mantle, and wrapped it together, and smote the waters, and they were divided hither and thither, so that they two went over on dry ground.", "9": "And it came to pass, when they were gone over, that Elijah said unto Elisha, Ask what I shall do for thee, before I be taken away from thee. And Elisha said, I pray thee, let a double portion of thy spirit be upon me.", "10": "And he said, Thou hast asked a hard thing: nevertheless, if thou see me when I am taken from thee, it shall be so unto thee; but if not, it shall not be so.", "11": "And it came to pass, as they still went on, and talked, that, behold, there appeared a chariot of fire, and horses of fire, and parted them both asunder; and Elijah went up by a whirlwind into heaven.", "12": "And Elisha saw it, and he cried, My father, my father, the chariot of Israel, and the horsemen thereof. And he saw him no more: and he took hold of his own clothes, and rent them in two pieces.", "13": "He took up also the mantle of Elijah that fell from him, and went back, and stood by the bank of Jordan;", "14": "And he took the mantle of Elijah that fell from him, and smote the waters, and said, Where is the LORD God of Elijah? and when he also had smitten the waters, they parted hither and thither: and Elisha went over.", "15": "And when the sons of the prophets which were to view at Jericho saw him, they said, The spirit of Elijah doth rest on Elisha. And they came to meet him, and bowed themselves to the ground before him.", "16": "And they said unto him, Behold now, there be with thy servants fifty strong men; let them go, we pray thee, and seek thy master: lest peradventure the Spirit of the LORD hath taken him up, and cast him upon some mountain, or into some valley. And he said, Ye shall not send.", "17": "And when they urged him till he was ashamed, he said, Send. They sent therefore fifty men; and they sought three days, but found him not.", "18": "And when they came again to him, (for he tarried at Jericho,) he said unto them, Did I not say unto you, Go not?", "19": "And the men of the city said unto Elisha, Behold, I pray thee, the situation of this city is pleasant, as my lord seeth: but the water is naught, and the ground barren.", "20": "And he said, Bring me a new cruse, and put salt therein. And they brought it to him.", "21": "And he went forth unto the spring of the waters, and cast the salt in there, and said, Thus saith the LORD, I have healed these waters; there shall not be from thence any more death or barren land.", "22": "So the waters were healed unto this day, according to the saying of Elisha which he spake.", "23": "And he went up from thence unto Bethel: and as he was going up by the way, there came forth little children out of the city, and mocked him, and said unto him, Go up, thou bald head; go up, thou bald head.", "24": "And he turned back, and looked on them, and cursed them in the name of the LORD. And there came forth two she bears out of the wood, and tare forty and two children of them.", "25": "And he went from thence to mount Carmel, and from thence he returned to Samaria."}}, "tsk": {"1": [{"kopje": "ten hemel op zou nemen", "refs": ["Gen 5:24", "1 Kon 19:4", "Luk 9:51", "Hand 1:9", "Hebr 11:5", "Openb 11:12"]}, {"kopje": "met een storm", "refs": ["1 Kon 18:12", "1 Kon 19:11", "Job 38:1"]}, {"kopje": "Elisa", "refs": ["1 Kon 19:16-21"]}, {"kopje": "Gilgal", "refs": ["Joz 4:19", "Joz 5:9"]}], "2": [{"kopje": "Blijf toch hier", "refs": ["Ruth 1:15", "Ruth 1:16", "2 Sam 15:19", "2 Sam 15:20", "Joh 6:67", "Joh 6:68"]}, {"kopje": "Zo waarachtig als de HEERE", "refs": ["2 Kon 2:4", "2 Kon 2:6", "2 Kon 4:30", "1 Sam 1:26", "1 Sam 17:55", "1 Sam 25:26", "Jer 4:2"]}, {"kopje": "ik zal u niet", "refs": ["Ruth 1:16-18", "2 Sam 15:21", "1 Joh 2:19"]}, {"kopje": "Beth-el", "refs": ["Gen 28:19", "1 Kon 12:29", "1 Kon 12:33" el": null}, {"disp": "2 Kon 5:3", "href": "../../2-koningen/5/#v3", "ref": "2 Kon 5:3", "svLabel": null}, {"disp": "2 Kon 6:32", "href": "../../2-koningen/6/#v32", "ref": "2 Kon 6:32", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ps 37:18": "Jod. De HEERE kent de dagen van de oprechten; en hun erfenis zal in eeuwigheid blijven.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Ps 107:33-38": "Hij maakt van rivieren een woestijn, en van waterbronnen dorstig land. Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen. Hij maakt van de woestijn een waterpoel, en van het dorre land waterbronnen.", "Zef 2:9": "Daarom, zo waarachtig als Ik leef, spreekt de HEERE van de heerscharen, de God van Israël: Moab zal zeker zijn als Sodom, en de kinderen van Ammon als Gomorra, een netelveld, en een zoutgroeve, en een verwoesting tot in eeuwigheid! De overigen van Mijn volk zullen hen beroven, en het overige van Mijn volk zal hen erfelijk bezitten.", "Ezech 11:5": "Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.", "Jona 1:1": "Het woord van de HEERE gebeurde tot Jona, de zoon van Amitthai, en Hij zei:", "Num 23:5": "Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Openb 3:4": "Toch hebt u enkele weinige namen ook in Sardis, die hun kleren niet bevlekt hebben, en zij zullen met Mij wandelen in witte kleren, omdat zij het waard zijn.", "Joh 5:28": "Verwonder u hier niet over, want de tijd komt waarin allen die in de graven zijn Zijn stem zullen horen;", "Ps 49:16": "Maar God zal mijn ziel uit de macht van het graf verlossen, want Hij zal mij opnemen. Sela.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "Job 34:9": "Want hij heeft gezegd: Het baat een man niet, als hij welbehagen heeft aan God.", "2 Kon 9:1": "Toen riep de profeet Elisa een van de zonen van de profeten, en hij zei tegen hem: Gord uw lenden, en neem deze oliekruik in uw hand, en ga naar Ramoth in Gilead.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Joz 5:9": "Verder zei de HEERE tegen Jozua: Vandaag heb Ik de smaad van Egypte van u afgewenteld; daarom noemde men de naam van die plaats Gilgal, tot op deze dag.", "Luk 9:51": "En het gebeurde, toen de dagen van Zijn opneming vervuld werden, dat Hij vastbesloten Zijn gezicht richtte om naar Jeruzalem te reizen.", "Num 16:28": "Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.", "Klaagl 1:7": "Zain. Jeruzalem is, in de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Hos 10:5": "De inwoners van Samaria zullen bang zijn vanwege het kalf van Beth-aven; want zijn volk zal erover treuren, alsook zijn afgodspriesters (die zich erover verheugden), over zijn heerlijkheid, omdat die van hen is weggegaan.", "1 Kon 14:3": "En neem in uw hand tien broden, en koeken, en een kruik honing, en ga naar hem toe; hij zal u vertellen wat er met deze jongen gebeuren zal.", "Joh 17:9-13": "Ik bid voor hen; Ik bid niet voor de wereld, maar voor hen die U Mij gegeven hebt, want zij zijn van U. En al het Mijne is van U, en het Uwe is van Mij; en Ik ben in hen verheerlijkt. En Ik ben niet meer in de wereld, maar dezen zijn in de wereld, en Ik kom tot U, Heilige Vader, bewaar hen in Uw Naam, die U Mij gegeven hebt, opdat zij één zijn, zoals Wij.", "Job 38:1": "Daarna antwoordde de HEERE Job uit een onweder, en zei:", "1 Kon 20:36": "En hij zei tegen hem: Omdat u de stem van de HEERE niet gehoorzaam bent geweest, zie, zodra u van mij weggegaan bent, zal een leeuw u doden. En toen hij van bij hem weggegaan was, vond een leeuw hem, die hem doodde.", "1 Kor 12:7-11": "Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Hos 9:14": "Geef hun, Heere! Wat zult U geven? Geef hun een baarmoeder die een miskraam krijgt, en uitdrogende borsten.", "Spr 17:12": "Beter dat een berin die van haar jongen beroofd is, een man tegemoetkomt, dan een dwaas in zijn dwaasheid.", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "Openb 21:9-11": "En er kwam naar mij een van de zeven engelen, die de zeven schalen hadden, die vol geweest waren van de zeven laatste plagen, en hij sprak met mij en zei: Kom hier, ik zal u de Bruid tonen, de Vrouw van het Lam. En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God. En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal.", "Joz 4:14": "Diezelfde dag maakte de HEERE Jozua groot voor de ogen van heel Israël; en zij vreesden hem, zoals zij Mozes gevreesd hadden, al de dagen van zijn leven.", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Dan 8:10": "En hij werd groot tot aan het leger van de hemel; en hij wierp sommigen van dat leger, namelijk van de sterren, neer ter aarde, en vertrapte ze.", "Jer 28:16": "Daarom, zo zegt de HEERE: Zie, Ik zal u wegwerpen van de aardbodem; dit jaar zult u sterven, omdat u een afval gesproken hebt tegen de HEERE.", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Lev 1:1": "En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:", "Hebr 9:15": "En daarom is Hij de Middelaar van het nieuwe testament, opdat, nu de dood daartussen gekomen is, tot verzoening van de overtredingen die er waren onder het eerste testament, degenen die geroepen zijn de belofte van de eeuwige erfenis zouden ontvangen.", "Jer 33:1": "Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:", "Ezra 9:3": "Toen ik deze zaak hoorde, scheurde ik mijn kleed en mijn mantel; en ik trok het haar van mijn hoofd en van mijn baard uit, en zat verbaasd neer.", "Openb 1:7": "Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.", "Joh 6:67": "Jezus zei dan tegen de twaalf: Wilt u ook niet weggaan?", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Luk 19:1": "En Jezus ging Jericho binnen en trok erdoorheen.", "Hand 1:10": "En terwijl zij hun ogen naar de hemel gericht hielden toen Hij wegvoer, zie, twee mannen stonden bij hen in witte kleding;", "Rom 9:20": "Maar toch, o mens, wie bent u, die tegen God antwoordt? Zal ook het maaksel tegen hem die het gemaakt heeft zeggen: Waarom hebt u mij zo gemaakt?", "Matt 27:39-44": "En zij die voorbijgingen, beschimpten Hem en schudden hun hoofd, en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af. En evenzo zeiden ook de overpriesters, met de schriftgeleerden en oudsten, en Farizeeën, terwijl zij Hem bespotten:", "Hand 5:9": "En Petrus zei tot haar: Wat is het, dat u onderling hebt afgesproken om de Geest van de Heere te verzoeken? Zie, de voeten van hen die uw man begraven hebben, zijn voor de deur, en zullen u uitdragen.", "Openb 14:1-3": "En ik zag, en zie, het Lam stond op de berg Sion, en met Hem honderdvierenveertigduizend, die de naam van Zijn Vader geschreven hadden op hun voorhoofden. En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers; en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren.", "Jer 50:29": "Laat u horen tegen Babel, u schutters! U allen die de boog spant! Leger u tegen haar rondom, laat niemand van hen ontkomen; vergeld haar naar haar werk, doe haar naar alles wat zij gedaan heeft; want zij heeft trots gehandeld tegen de HEERE, tegen de Heilige van Israël.", "1 Sam 10:7": "En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.", "Ps 21:5": "Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos.", "Matt 19:16": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb?", "Num 14:6": "En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, die bij hen waren die dat land verspied hadden, scheurden hun kleren.", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "Amos 3:14": "Dat Ik, op de dag dat Ik Israëls overtredingen over hem bezoeken zal, ook bezoeking zal doen over de altaren van Beth-el; en de hoorns van het altaar zullen worden afgehouwen, en op de aarde vallen.", "Jes 28:14": "Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is!", "Hand 26:25": "Maar hij zei: Ik ben niet gek, machtigste Festus, maar ik spreek woorden van waarheid en van een gezond verstand;", "Hand 14:14": "Maar toen de apostelen Barnabas en Paulus dit hoorden, scheurden zij hun kleren, en sprongen onder de menigte, en riepen:", "Ezech 43:5": "En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "1 Sam 3:20": "En heel Israël, van Dan tot Berseba toe, wist dat Samuël bevestigd was tot een profeet van de HEERE.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Hos 13:8": "Ik ontmoette hen als een berin die van haar jongen beroofd is, en scheurde het omhulsel van hun hart open; en Ik verslond hen daar als een leeuw; het wilde dier van het veld verscheurde hen.", "Tit 3:7": "Opdat wij, gerechtvaardigd door Zijn genade, erfgenamen zouden worden naar de hoop van het eeuwige leven.", "Amos 7:13": "Maar in Beth-el zult u voortaan niet meer profeteren; want dat is het heiligdom van de koning, en dat is het huis van het koninkrijk.", "Ps 4:7": "Velen zeggen: Wie zal ons het goede laten zien? Verhef U over ons het licht van uw aangezicht, o HEERE!", "Jes 36:22": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, naar Hizkia met gescheurde kleren; en zij vertelden hem de woorden van Rabsake.", "Jes 29:20": "Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "2 Kon 5:3": "Deze zei tegen haar meesteres: Och, was mijn heer maar bij de profeet die in Samaria is, dan zou hij hem van zijn melaatsheid verlossen.", "Ex 14:12": "Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "Amos 7:16": "Nu dan, hoor het woord van de HEERE: U zegt: U zult niet profeteren tegen Israël, en niets uitspreken tegen het huis van Izak.", "Num 12:6-8": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken. Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is. Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Hand 8:2": "En godvruchtige mannen droegen Stefanus samen naar het graf en bedreven grote rouw over hem.", "2 Kor 5:2": "Want ook hierin zuchten wij, verlangend om met onze woning die uit de hemel is overkleed te worden.", "Amos 5:5": "Maar zoek Beth-el niet, en kom niet naar Gilgal, en trek niet over naar Ber-seba; want Gilgal zal zeker in gevangenschap weggevoerd worden, en Beth-el zal tot niets worden.", "Joz 4:19": "Het volk nu was op de tiende dag van de eerste maand uit de Jordaan opgeklommen; en zij legerden zich te Gilgal, aan het oosteinde van Jericho.", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Joh 6:54": "Wie Mijn vlees eet en Mijn bloed drinkt, heeft het eeuwige leven; en Ik zal hem opwekken op de laatste dag.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "Gen 44:13": "Toen scheurden zij hun kleren, en ieder man laadde zijn ezel weer op, en zij keerden terug naar de stad.", "Joh 11:26": "en ieder die leeft en in Mij gelooft, zal niet sterven in eeuwigheid. Gelooft u dat?", "Matt 5:3": "Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Job 34:17-19": "Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen? Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen! Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "1 Kon 19:19": "Zo ging hij vandaar, en vond Elisa, de zoon van Safat; die was aan het ploegen met twaalf span runderen voor zich uit, en hij zelf was bij het twaalfde; en Elia ging naar hem toe, en wierp zijn mantel op hem.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Luk 19:14": "Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Amos 7:17": "Daarom zegt de HEERE zo: Uw vrouw zal in de stad hoereren, en uw zonen en uw dochters zullen door het zwaard vallen, en uw land zal met het meetsnoer verdeeld worden; en u zult in een onrein land sterven, en Israël zal zeker uit zijn land gevankelijk worden weggevoerd.", "2 Kron 30:10": "Zo trokken de boodschappers van stad tot stad, door het land van Efraïm en Manasse, tot Zebulon toe; maar zij lachten hen uit, en bespotten hen.", "2 Kon 6:32": "(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?", "Job 15:26": "Hij loopt tegen Hem aan met de hals, met zijn dikke, hoog verheven schilden;", "1 Kon 20:28": "En de man van God trad toe, en sprak tegen de koning van Israël, en zei: Zo zegt de HEERE: Omdat de Syriërs gezegd hebben: De HEERE is een God van de bergen, en Hij is niet een God van de laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat u weet, dat Ik de HEERE ben.", "Deut 5:4-6": "Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "2 Sam 12:23": "Maar nu is het dood, waarom zou ik nu vasten? Zal ik het nog kunnen terughalen? Ik zal wel naar hem toe gaan, maar hij zal niet naar mij terugkomen.", "Ezech 3:14": "Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.", "2 Kon 1:10-12": "Maar Elia antwoordde en sprak tot de leider over vijftig: Als ik dan een man van God ben, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde er vuur uit de hemel neer, en het verteerde hem en zijn vijftigtal. En hij zond weer naar hem een andere leider over vijftig met zijn vijftigtal. Deze antwoordde en sprak tot hem: Man van God! Zo zegt de koning: Kom snel naar beneden. En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "Matt 27:29-31": "en zij vlochten een kroon van doornen en zetten die op Zijn hoofd, en gaven Hem een rietstok in Zijn rechterhand; en zij vielen voor Hem op de knieën en bespotten Hem, en zeiden: Gegroet, Koning van de Joden! En zij spuugden op Hem, en namen de rietstok en sloegen Hem op Zijn hoofd. En nadat zij Hem bespot hadden, deden zij Hem de mantel af, en deden Hem Zijn eigen kleren aan, en leidden Hem weg om Hem te kruisigen.", "Jer 34:1": "Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:", "Joh 5:39": "Onderzoek de Schriften; want u meent daarin het eeuwige leven te hebben; en die zijn het, die van Mij getuigen.", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "Luk 16:14": "En al deze dingen hoorden ook de Farizeeën, die geldgierig waren, en zij beschimpten Hem.", "Jer 7:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "2 Kon 6:30": "En het gebeurde, toen de koning de woorden van deze vrouw gehoord had, dat hij zijn kleren scheurde, terwijl hij over de muur voortging; en het volk zag dat er, zie, een zak van binnen over zijn vlees was.", "Luk 15:10": "Zo, zeg Ik u, is er blijdschap voor de engelen van God over één zondaar die zich bekeert.", "Ef 1:18": "Namelijk verlichte ogen van uw verstand, opdat u mag weten wat de hoop is van Zijn roeping, en wat de rijkdom is van de heerlijkheid van Zijn erfenis in de heiligen;", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Ps 48:3": "Schoon van ligging, een vreugde van de hele aarde is de berg Sion, aan de zijden van het noorden; de stad van de grote Koning.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Kol 1:5": "Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie;", "1 Sam 26:11": "De HEERE late het verre van mij zijn, dat ik mijn hand zou leggen aan de gezalfde van de HEERE! Neem toch nu de speer die bij zijn hoofdeinde ligt, en de waterfles, en laten we gaan.", "Jes 57:4-11": "Over wie maakt u zich vrolijk, tegen wie sperrt u de mond wijd open en steekt u de tong lang uit? Bent u geen kinderen van de overtreding, een nageslacht van de valsheid? U die verhit bent in de eikenbossen, onder elke groene boom; die de kinderen slacht bij de beken, onder de richels van de rotsen? Aan de gladde stenen van de beek is uw deel; die, die zijn uw lot; ook stort u daarover een drankoffer uit, u offert hun een spijsoffer; zou Ik Mij hierover laten troosten?", "Ezech 18:2": "Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden?", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "2 Kon 2:3-11": "Toen gingen de zonen van de profeten, die te Beth-el waren, naar Elisa toe, en zeiden tegen hem: Weet u dat de HEERE vandaag uw heer van boven uw hoofd wegnemen zal? En hij zei: Ik weet het ook wel, zwijgt u stil. En Elia zei tegen hem: Elisa, blijf toch hier, want de HEERE heeft mij naar Jericho gezonden. Maar hij zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Zo kwamen zij te Jericho. Toen traden de zonen van de profeten, die te Jericho waren, naar Elisa toe, en zeiden tegen hem: Weet u dat de HEERE vandaag uw heer van boven uw hoofd wegnemen zal? En hij zei: Ik weet het ook wel, zwijgt u stil.", "Ezech 1:20": "Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "2 Kon 4:38": "Toen Elisa weer in Gilgal kwam, was er honger in dat land, en de zonen der profeten zaten voor hem; en hij zei tegen zijn knecht: Zet de grote pot aan, en kook moes voor de zonen der profeten.", "Spr 28:15": "De goddeloze, heersend over een arm volk, is een brullende leeuw, en een beer, die heen en weer rondloopt.", "Dan 1:17": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Jes 3:8": "Want Jeruzalem is gestruikeld, en Juda is gevallen, omdat hun tong en hun daden tegen de HEERE zijn, om de ogen van Zijn heerlijkheid te verbitteren.", "Joh 9:6": "Dit gezegd hebbend, spuugde Hij op de grond en maakte slijk van dat speeksel, en streek dat slijk op de ogen van de blinde;", "1 Sam 1:26": "En zij zei: Och, mijn heer! zo waarachtig als uw ziel leeft, mijn heer! Ik ben die vrouw, die hier bij u stond, om tot de HEERE te bidden.", "Rom 6:22": "Maar nu, vrijgemaakt van de zonde, en dienstbaar gemaakt aan God, hebt u uw vrucht tot heiliging, en het einde het eeuwige leven.", "Joh 15:27": "En u zult ook getuigen, want u bent van het begin met Mij geweest.", "Job 22:14": "De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Richt 14:19": "Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "Jes 38:18": "Want het graf zal U niet loven, de dood zal U niet prijzen; wie in de kuil neerdalen, zullen op Uw waarheid niet hopen.", "Ezech 37:1": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen.", "Deut 34:9-11": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had. En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht, In al de tekenen en de wonderen, waartoe de HEERE hem gezonden had, om die te doen in het land Egypte aan farao, en aan al zijn knechten, en aan heel zijn land;", "Joh 14:12-14": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, de werken die Ik doe, zal hij ook doen, en zal grotere doen dan deze, want Ik ga heen tot Mijn Vader. En wat u ook zult vragen in Mijn Naam, dat zal Ik doen, opdat de Vader in de Zoon verheerlijkt wordt. Als u iets zult vragen in Mijn Naam, Ik zal het doen.", "2 Sam 18:22": "Doch Ahimaäz, de zoon van Zadok, hield vol en zei tegen Joab: Wat er ook gebeurt, laat mij toch ook achter Cuschi aan lopen. En Joab zei: Waarom zou u nu gaan lopen, mijn zoon, als u toch geen bericht hebt waarmee u iets bereikt?", "Joh 10:28": "En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken.", "Kol 1:12": "terwijl u de Vader dankt, Die ons bekwaam gemaakt heeft om deel te hebben aan de erfenis van de heiligen in het licht;", "Openb 21:18": "En het gebouw van haar muur was Jaspis; en de stad was zuiver goud, gelijk aan zuiver glas.", "2 Kor 12:3": "En ik ken zo'n mens (of het in het lichaam, of buiten het lichaam gebeurd is, weet ik niet, God weet het),", "Ezech 3:10-12": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren. En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen. Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "Jes 28:9": "Aan wie zou Hij dan de kennis leren, en aan wie zou Hij het gehoorde te verstaan geven? Aan hen die van de melk gespeend zijn, die van de borsten weggehaald zijn?", "1 Kon 18:7": "Toen Obadja nu op de weg was, zie, daar kwam Elia hem tegemoet; en hem herkennend, viel hij op zijn gezicht en zei: Bent u mijn heer Elia?", "Job 4:17-21": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker? Zie, op Zijn knechten zou Hij niet vertrouwen; ook Zijn engelen heeft Hij van dwaasheid beschuldigd. Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot.", "Hand 13:45": "Doch de Joden, die de menigten zagen, werden vervuld met afgunst, en weerspraken wat door Paulus gezegd werd, en tegenspraken en lasterden.", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Jes 45:10": "Wee hem die tegen zijn vader zegt: Wat verwekt u? en tegen de vrouw: Wat baart u?", "Ps 133:3": "Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.", "Ex 15:23": "Toen kwamen zij bij Mara; maar zij konden het water van Mara niet drinken, want het was bitter; daarom werd het Mara genoemd.", "Ezech 36:2": "Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden!", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "1 Kon 18:36-39": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb. Antwoord mij, HEERE, antwoord mij; opdat dit volk erkent dat U, HEERE, die God bent, en dat U hun hart weer terug hebt gebracht. Toen viel het vuur van de HEERE, en verteerde dat brandoffer, en dat hout, en die stenen, en dat stof, ja, likte dat water op dat in de geul was.", "Ezech 32:31": "Farao zal hen zien, en zich troosten over zijn hele menigte; de verslagenen van het zwaard van Farao en zijn hele leger, spreekt de Heere HEERE.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Hebr 11:13-16": "Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren. Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken. En als zij aan dat vaderland gedacht hadden waar zij uit weggegaan waren, zouden zij de tijd gehad hebben om terug te keren;", "Matt 25:24-27": "Maar hij die het ene talent ontvangen had, kwam ook en zei: Heer, ik kende u, dat u een hard mens bent, die maait waar u niet gezaaid hebt, en verzamelt vandaar waar u niet gestrooid hebt; En ik was bang, en ben weggegaan, en heb uw talent verborgen in de aarde; zie, u hebt het uwe. Maar zijn heer antwoordde en zei tegen hem: U slechte en luie dienstknecht! U wist dat ik maai waar ik niet gezaaid heb, en vandaar verzamel waar ik niet gestrooid heb.", "Jes 47:10": "Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.", "Jes 29:16": "Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.", "Hand 17:18": "En sommigen van de Epicureïsche en Stoïcijnse wijsgeren streden met hem; en sommigen zeiden: Wat wil deze praatjesmaker toch zeggen? Maar anderen zeiden: Hij lijkt een verkondiger te zijn van vreemde goden; omdat hij hun Jezus en de opstanding verkondigde.", "Ex 19:3": "En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen:", "Spr 20:11": "Een jongen zal ook door zijn daden zich bekend maken, of zijn werk zuiver is, en of het recht zal zijn.", "Dan 7:25": "En het zal woorden spreken tegen de Allerhoogste, en het zal de heiligen van de hoge plaatsen uitputten, en het zal proberen de tijden en de wet te veranderen, en zij zullen in zijn hand overgegeven worden tot een tijd, en tijden, en een deel van een tijd.", "2 Kon 3:12": "En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Joh 6:50": "Dit is het Brood dat uit de hemel neerdaalt, zodat de mens ervan eet en niet sterft.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Ex 26:30": "Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Hand 1:9": "En toen Hij dit gezegd had, werd Hij opgenomen, terwijl zij het zagen, en een wolk nam Hem weg van voor hun ogen.", "Mark 3:22": "En de Schriftgeleerden die van Jeruzalem gekomen waren, zeiden: Hij heeft Beëlzebul, en door de leider van de duivels drijft Hij de duivels uit.", "Rom 10:2": "Want ik geef hun getuigenis, dat zij een ijver voor God hebben, maar niet met verstand.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "1 Sam 9:15-20": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "Jes 57:3": "Maar kom hier dichterbij, kinderen van de waarzegster! Overspelig nageslacht, en u die hoererij bedrijft!", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Ex 14:22": "En de kinderen van Israël gingen het midden van de zee in, op het droge; en de wateren waren hun een muur, aan hun rechterhand en aan hun linkerhand.", "2 Sam 12:1": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.", "Num 22:18": "Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.", "1 Sam 19:24": "En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?", "Ps 59:8": "Zie, zij storten overvloedig uit met hun mond; zwaarden zijn op hun lippen; want wie hoort het?", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Rom 5:17": "Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus.", "1 Kon 13:1": "En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken.", "Openb 3:21": "Wie overwint, hem zal Ik geven met Mij te zitten op Mijn troon, zoals Ik ook overwonnen heb, en Mij gezet heb met Mijn Vader op Zijn troon.", "1 Kon 12:29": "En hij zette het ene te Beth-el, en het andere plaatste hij te Dan.", "Jer 24:4": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Ps 94:7-9": "En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet. Let op, u onverstandigen onder het volk! En u dwazen! Wanneer zult u verstandig worden? Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien?", "Job 30:1": "Maar nu lachen zij die jonger zijn dan ik, om mij, van wie ik hun vaderen versmaad zou hebben, om ze bij de honden van mijn kudde te zetten.", "1 Sam 3:21": "En de HEERE ging door met verschijnen te Silo; want de HEERE openbaarde Zich aan Samuël te Silo, door het woord van de HEERE.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "1 Sam 10:6": "En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Jes 47:11": "Daarom zal er over u een kwaad komen, u zult de dageraad daarvan niet weten; en een verderf zal er op u vallen, dat u niet zult kunnen verzoenen; want er zal snel een onstuimige verwoesting over u komen, zodat u het niet weten zult.", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "Ps 42:3": "Mijn ziel dorst naar God, naar de levende God; wanneer zal ik binnengaan en voor het aangezicht van God verschijnen?", "Gen 48:19": "Maar zijn vader weigerde het, en zei: Ik weet het, mijn zoon! Ik weet het; hij zal ook tot een volk worden, en hij zal ook groot worden; maar toch zal zijn jongste broer groter worden dan hij, en zijn nageslacht zal een volle menigte van volken worden.", "Job 30:9": "Maar nu ben ik hun een spotlied geworden, en ik ben hun tot een spreekwoord.", "Openb 22:2": "In het midden van haar straat en aan de ene en de andere zijde van de rivier was de boom des levens, die twaalf keer vrucht droeg, van maand tot maand zijn vrucht gevend; en de bladeren van de boom waren tot genezing van de heidenen.", "Ex 15:26": "en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!", "Hand 2:42": "En zij bleven volharden in de leer van de apostelen, en in de gemeenschap, en in het breken van het brood, en in de gebeden.", "Matt 8:11": "Maar Ik zeg u dat velen zullen komen van oost en west, en met Abraham, en Izak, en Jakob, zullen aanzitten in het Koninkrijk der hemelen;", "Ex 7:19": "Verder zei de HEERE tegen Mozes: zeg tegen Aäron: Neem uw staf, en steek uw hand uit over de wateren van de Egyptenaren, over hun stromen, over hun rivieren, en over hun poelen, en over alle verzamelingen van hun water, zodat zij bloed worden; en er zal bloed zijn in het hele Egypteland, zowel in houten als in stenen vaten.", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "Num 12:11": "Daarom zei Aäron tegen Mozes: Och, mijn heer! Leg toch niet op ons de zonde waarmee wij dwaas gedaan hebben, en waarmee wij gezondigd hebben!", "Amos 7:15": "Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.", "Jes 41:1": "Zwijg voor Mij, eilanden! En laat de volken hun kracht vernieuwen; laat ze naderbij komen, laat ze dan spreken; laat ons samen tot het gericht naderen.", "Openb 22:5": "En daar zal geen nacht zijn, en zij zullen geen kaars noch licht van de zon nodig hebben; want de Heere God verlicht hen; en zij zullen als koningen heersen tot in alle eeuwigheid.", "Openb 11:12": "En zij hoorden een grote stem uit de hemel, die tegen hen zei: Kom hier boven. En zij voeren op naar de hemel, in de wolk; en hun vijanden aanschouwden hen.", "Jer 5:14": "Daarom zegt de HEERE, de God van de heerscharen, zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk tot hout, en het zal hen verteren.", "2 Kon 4:25": "Zo ging zij heen, en kwam bij de man Gods, bij de berg Karmel. En het gebeurde, toen de man Gods haar van verre zag, dat hij tegen Gehazi, zijn knecht, zei: Zie, daar is de Sunamitische.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "1 Tess 2:12": "en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.", "Gen 28:19": "En hij noemde de naam van die plaats Beth-el; hoewel de naam van die stad vroeger Luz was.", "2 Kon 2:1-6": "Het gebeurde nu, toen de HEERE Elia met een storm ten hemel op zou nemen, dat Elia met Elisa van Gilgal ging. En Elia zei tegen Elisa: Blijf toch hier, want de HEERE heeft mij naar Beth-el gezonden. Maar Elisa zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Zo gingen zij af naar Beth-el. Toen gingen de zonen van de profeten, die te Beth-el waren, naar Elisa toe, en zeiden tegen hem: Weet u dat de HEERE vandaag uw heer van boven uw hoofd wegnemen zal? En hij zei: Ik weet het ook wel, zwijgt u stil.", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "Num 24:16": "Die hoort de woorden van God, spreekt, en die de kennis van de allerhoogste weet; die het gezicht van de Almachtige ziet, die in verrukking valt, en wiens ogen geopend worden.", "2 Sam 17:8": "Verder zei Husai: U kent uw vader en zijn mannen, dat zij helden zijn, en verbitterd van gemoed, als een beer die van haar jongen beroofd is in het veld; daarbij is uw vader een krijgsman, en zal niet overnachten bij het volk.", "2 Kron 32:15-19": "Laat Jehizkia u dan nu niet bedriegen, en laat hij u op deze manier niet opruien, en geloof hem niet; want geen god van enig volk en koninkrijk heeft zijn volk kunnen redden uit mijn hand en de hand van mijn vaderen; hoeveel te minder zal uw God u kunnen redden uit mijn hand? Daarbij spraken zijn dienaren nog meer tegen God, de HEERE, en tegen Zijn dienaar Jehizkia. Ook schreef hij brieven, om de HEERE, de God van Israël, te honen en om tegen Hem te spreken, en zei: Zoals de goden van de volken van de landen hun volk niet gered hebben uit mijn hand, zo zal de God van Jehizkia Zijn volk niet redden uit mijn hand.", "Matt 27:40-43": "en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af. En evenzo zeiden ook de overpriesters, met de schriftgeleerden en oudsten, en Farizeeën, terwijl zij Hem bespotten: Anderen heeft Hij verlost, Zichzelf kan Hij niet verlossen. Als Hij de Koning van Israël is, laat Hij nu van het kruis afkomen, en wij zullen Hem geloven.", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Ex 35:31": "En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;", "Hand 23:8": "Want de Sadduceeën zeggen dat er geen opstanding is, en ook geen engel of geest; maar de Farizeeën belijden het beide.", "Pred 7:19": "De wijsheid versterkt de wijze meer dan tien heersers die in een stad zijn.", "1 Kon 18:4": "Want het gebeurde, toen Izebel de profeten van de HEERE uitroeide, dat Obadja honderd profeten nam, en ze verborg bij vijftig man in een grot, en hen onderhield met brood en water.", "2 Kon 4:37": "Zo kwam zij, en viel voor zijn voeten neer, en boog zich ter aarde, en zij nam haar zoon op, en ging naar buiten.", "2 Kor 10:6": "En gereed hebbend om alle ongehoorzaamheid te wreken, wanneer uw gehoorzaamheid vervuld zal zijn.", "Job 36:23": "Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?", "Deut 33:3": "Zeker bemint Hij de volken! Al Zijn heiligen zijn in Uw hand; zij zullen in het midden tussen Uw voeten gezet worden; ieder zal ontvangen van Uw woorden.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "2 Kor 5:4": "Want ook wij die in deze tent zijn, zuchten, bezwaard als wij zijn; omdat wij niet ontkleed willen worden, maar overkleed, opdat het sterfelijke door het leven verslonden wordt.", "Hand 27:24": "en zei: Wees niet bang, Paulus, u moet voor de keizer gesteld worden; en zie, God heeft u allen geschonken die met u varen.", "1 Petr 1:4": "Tot een onvergankelijke, onbevlekte en onverwelkbare erfenis, die in de hemelen bewaard is voor u.", "Ps 53:2": "De dwaas zegt in zijn hart: Er is geen God; zij verderven het, en zij bedrijven gruwelijk onrecht; er is niemand die goed doet.", "Hos 10:15": "Zo heeft Beth-el u gedaan, vanwege de grote boosheid van uw boosheid; Israëls koning is in de vroege morgen volledig uitgeroeid.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "1 Kon 13:2": "En hij riep tegen het altaar, door het woord van de HEERE, en zei: Altaar, altaar, zo zegt de HEERE: Zie, er zal aan het huis van David een zoon geboren worden, wiens naam Josia zal zijn; die zal op u de priesters van de hoogten offeren, die op u roken, en men zal mensenbeenderen op u verbranden.", "Spr 11:11": "Door de zegen van de oprechten wordt een stad verheven; maar door de mond van de goddelozen wordt zij verbroken.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "2 Sam 13:31": "Toen stond de koning op, en scheurde zijn kleren, en ging op de grond liggen; en al zijn knechten stonden erbij met gescheurde kleren.", "Joël 2:17": "Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Ps 14:1": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet.", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Joh 6:47": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, heeft het eeuwige leven.", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "2 Kon 6:1-7": "De kinderen van de profeten zeiden tegen Elisa: Zie toch, de plaats waar wij voor uw aangezicht wonen, is voor ons te eng. Laat ons toch tot aan de Jordaan gaan, en elk van daar een stuk timmerhout halen, dat wij ons daar een plaats maken, om er te wonen. En hij zei: Ga heen. En een van hen zei: Het belieft u toch om te gaan met uw knechten. En hij zei: Ik zal gaan.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Openb 7:9": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen.", "Jes 11:2": "En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE.", "Ezech 47:11": "Maar de modderige plaatsen en moerassen ervan zullen niet gezond worden, ze zijn aan het zout overgegeven.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "Jer 4:2": "Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "2 Sam 1:2": "dat het op de derde dag gebeurde dat er, kijk, uit het leger van Saul een man kwam, wiens kleren gescheurd waren, en aarde was op zijn hoofd; en het gebeurde, toen hij bij David kwam, dat hij ter aarde viel en zich neerboog.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "Deut 29:19-21": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "2 Sam 15:20": "Gisteren bent u gekomen, en zou ik u vandaag met ons laten meetrekken, terwijl ik zelf ga waarheen ik maar kan gaan? Keer terug, en breng uw broeders mee terug; goedertierenheid en trouw zij met u.", "1 Kon 17:24": "Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is.", "Num 23:26": "Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?", "Jer 2:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "2 Kon 2:1-18": "Het gebeurde nu, toen de HEERE Elia met een storm ten hemel op zou nemen, dat Elia met Elisa van Gilgal ging. En Elia zei tegen Elisa: Blijf toch hier, want de HEERE heeft mij naar Beth-el gezonden. Maar Elisa zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Zo gingen zij af naar Beth-el. Toen gingen de zonen van de profeten, die te Beth-el waren, naar Elisa toe, en zeiden tegen hem: Weet u dat de HEERE vandaag uw heer van boven uw hoofd wegnemen zal? En hij zei: Ik weet het ook wel, zwijgt u stil.", "Jes 10:15": "Zal een bijl zich beroemen tegen hem die daarmee houwt? Zal een zaag pochen tegen hem die ze trekt? Alsof een staf beweegt wie hem opheffen? Als men een stok opheft, is het geen hout?", "2 Kon 3:11": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.", "Mark 16:20": "En zij gingen heen, en predikten overal, en de Heere werkte mee, en bevestigde het Woord door tekenen die daarop volgden. Amen.", "Hebr 13:14": "Want wij hebben hier geen blijvende stad, maar wij zoeken de toekomstige.", "Dan 8:25": "En door zijn sluwheid zal hij de bedrieglijkheid doen slagen in zijn hand; en hij zal zich in zijn hart verheffen; en in een tijd van schijnbare rust zal hij velen te gronde richten, en hij zal opstaan tegen de Vorst der vorsten, maar hij zal gebroken worden, zonder mensenhand.", "Hand 8:17": "Toen legden zij hun de handen op, en zij ontvingen de Heilige Geest.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Amos 3:8": "De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?", "Ruth 1:16": "Maar Ruth zei: Dring er bij mij niet op aan om u te verlaten, om van achter u terug te keren; want waar u heen zult gaan, zal ik ook heen gaan, en waar u zult overnachten, zal ik overnachten; uw volk is mijn volk, en uw God mijn God.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Luk 12:32": "Wees niet bang, klein kuddeke, want het is het welbehagen van uw Vader om u het Koninkrijk te geven.", "Zach 1:7": "Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "2 Kron 30:6": "De boodschappers dan gingen weg met de brieven uit de hand van de koning en zijn leiders, door heel Israël en Juda, en naar het bevel van de koning, en zeiden: Kinderen van Israël, bekeer u tot de HEERE, de God van Abraham, Izak en Israël, dan zal Hij Zich keren naar wie ontkomen waren, die voor u overgebleven zijn uit de hand van de koningen van Assyrië.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "Matt 19:21": "Jezus zei tegen hem: Als u volmaakt wilt zijn, ga heen, verkoop wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom hier, volg Mij.", "1 Kron 29:19": "En geef mijn zoon Salomo een volkomen hart, om Uw geboden, Uw getuigenissen en Uw inzettingen te houden; en om alles te doen, en om dit paleis te bouwen, dat ik klaargemaakt heb.", "Openb 21:1-5": "En ik zag een nieuwe hemel en een nieuwe aarde; want de eerste hemel en de eerste aarde waren voorbijgegaan, en de zee was er niet meer. En ik, Johannes, zag de heilige stad, het nieuwe Jeruzalem, neerdalen van God uit de hemel, gereedgemaakt als een bruid, die voor haar man versierd is. En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn.", "Joh 17:5-7": "En nu, verheerlijk Mij, U, Vader, bij Uzelf, met de heerlijkheid die Ik bij U had, voordat de wereld was. Ik heb Uw Naam geopenbaard aan de mensen die U Mij uit de wereld gegeven hebt. Zij waren van U, en U hebt Mij hen gegeven; en zij hebben Uw woord bewaard. Nu weten zij, dat alles wat U Mij gegeven hebt, van U is.", "Amos 7:7": "Nog liet Hij mij dit zien: zie, de Heere stond op een muur, die met een paslood gemaakt was, en een paslood was in Zijn hand.", "1 Kon 19:4": "Maar hijzelf ging een dagreis de woestijn in, en kwam en ging zitten onder een jeneverboom; en bad dat hij mocht sterven, en zei: Het is genoeg; neem nu, HEERE, mijn leven, want ik ben niet beter dan mijn vaderen.", "Job 22:17": "Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Ezech 18:29": "Toch zegt het huis van Israël: De weg van de Heere is niet recht. Zouden Mijn wegen, o huis van Israël, niet recht zijn? Zijn niet uw wegen onrecht?", "Jes 5:18": "Wee hun die de ongerechtigheid trekken met koorden van ijdelheid, en de zonde als met dikke wagentouwen!", "1 Joh 2:25": "En dit is de belofte, die Hij ons beloofd heeft, namelijk het eeuwige leven.", "Ex 16:7": "En morgen zult u de heerlijkheid van de HEERE zien, omdat Hij uw gemor tegen de HEERE gehoord heeft; want wat zijn wij, dat u tegen ons mort?", "Neh 9:5": "En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Sta op, loof de HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love de Naam van Uw heerlijkheid, die verhoogd is boven alle lof en prijs!", "Openb 21:21-25": "En de twaalf poorten waren twaalf parels, elke poort was uit één parel; en de straat van de stad was zuiver goud, als doorzichtig glas. En ik zag geen tempel daarin; want de Heere, de almachtige God, is haar tempel, en het Lam. En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Richt 9:20": "Maar zo niet, laat er dan vuur uitgaan van Abimelech, dat de burgers van Sichem en het huis van Millo verteert; en laat er vuur uitgaan van de burgers van Sichem en van het huis van Millo, dat Abimelech verteert!", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Ruth 1:15": "Daarom zei zij: Zie, uw schoonzuster is teruggekeerd naar haar volk en naar haar goden; keer ook u terug, uw schoonzuster achterna.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Deut 28:11": "En de HEERE zal u laten overvloeien in het goede, in de vrucht van uw schoot, en in de vrucht van uw vee, en in de vrucht van uw land; in het land dat de HEERE uw vaderen gezworen heeft u te zullen geven.", "Ps 102:5": "Mijn hart is geslagen en verdord als gras, zodat ik vergeten heb mijn brood te eten.", "Jer 27:2": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.", "Jes 14:9": "Het rijk van de dood van onderen is beroerd om uwentwil, om u tegemoet te gaan, toen u kwam; het wekt om uwentwil de doden op, al de bokken van de aarde; het doet al de koningen van de heidenvolken van hun tronen opstaan.", "Job 1:20": "Toen stond Job op, en scheurde zijn mantel, en schoor zijn hoofd, en viel op de aarde, en boog zich neer;", "Dan 9:1-22": "In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Joh 1:6": "Er was een mens door God gezonden, wiens naam Johannes was.", "Hos 7:15": "Ik heb hen wel getuchtigd, en hun armen gesterkt; maar zij denken kwaad tegen Mij.", "Luk 11:15": "Maar sommigen van hen zeiden: Hij drijft de demonen uit door Beëlzebul, de leider van de demonen.", "Deut 28:2-4": "En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld. Gezegend zal zijn de vrucht van uw schoot, en de vrucht van uw land, en de vrucht van uw vee, de aanwas van uw koeien, en de kudden van uw kleinvee.", "Joh 15:26": "Maar wanneer de Trooster gekomen zal zijn, Die Ik u zenden zal van de Vader, namelijk de Geest van de waarheid, Die van de Vader uitgaat, Die zal van Mij getuigen.", "2 Sam 15:21": "Maar Ithai antwoordde de koning en zei: Zo waarachtig als de HEERE leeft, en mijn heer de koning leeft, op de plaats waar mijn heer de koning zal zijn, hetzij ten dode, hetzij ten leven, daar zal uw knecht voorzeker ook zijn!", "Luk 15:7": "Ik zeg u, dat er zo blijdschap zal zijn in de hemel over één zondaar die zich bekeert, meer dan over negenennegentig rechtvaardigen, die de bekering niet nodig hebben.", "2 Kon 4:41": "Maar hij zei: Breng dan meel; en hij wierp het in de pot; en hij zei: Schep voor het volk op, zodat zij eten. Toen was er niets kwaads meer in de pot.", "Job 34:33": "Zal het van u zijn, hoe Hij iets vergelden zal, omdat u Hem versmaadt? Zou u dan verkiezen, en niet ik? Wat weet u dan? Spreek.", "1 Sam 17:55": "Toen Saul David zag uitgaan, de Filistijn tegemoet, zei hij tegen Abner, de legeraanvoerder: Wiens zoon is deze jongeman, Abner? En Abner zei: Zo waarachtig als uw ziel leeft, o koning, ik weet het niet.", "2 Kron 18:27": "En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!", "Spr 24:9": "De gedachte van de dwaasheid is zonde; en een spotter is de mensen een gruwel.", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Luk 24:45-51": "Toen opende Hij hun verstand, zodat zij de Schriften begrepen. En Hij zei tegen hen: Zo staat er geschreven, en zo moest de Christus lijden, en op de derde dag opstaan uit de doden. En in Zijn Naam moesten bekering en vergeving van de zonden gepredikt worden onder alle volken, te beginnen bij Jeruzalem.", "Mal 1:7": "U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk.", "Rom 2:7": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "Spr 22:6": "Leer de jongen de eerste beginselen naar de eis van zijn weg; ook als hij oud geworden is, zal hij daar niet van afwijken.", "Deut 1:6": "De HEERE, onze God, sprak tot ons bij Horeb, en zei: U bent lang genoeg bij deze berg gebleven.", "Joz 6:26": "En terzelfder tijd bezwoer Jozua hen, en zei: Vervloekt zij die man voor het aangezicht van de HEERE, die zic
