 HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "1 Kon 18:19": "Nu dan, zend heen, verzamel bij mij heel Israël op de berg Karmel, en de vierhonderdvijftig profeten van Baäl, en de vierhonderd profeten van het bos, die van de tafel van Izebel eten.", "Job 2:12": "En toen zij hun ogen van verre opsloegen, herkenden zij hem niet, en zij verhieven hun stem en weenden; daarbij scheurden zij ieder hun mantel, en strooiden stof op hun hoofden, omhoog naar de hemel.", "Ex 16:3": "En de Israëlieten zeiden tegen hen: Was ons maar in Egypte gestorven door de hand van de HEERE, toen wij bij de vleespotten zaten, toen wij tot verzadiging brood aten! Want u hebt ons naar deze woestijn gebracht, om deze hele gemeente door honger te laten sterven.", "Hand 8:29": "En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "Ps 107:12": "Daarom heeft Hij hun hart door zwarigheid vernederd; zij zijn gestruikeld, en er was geen helper.", "Ezech 11:3": "Die zeggen: Men moet niet snel huizen bouwen; deze stad is de pot, en wij zijn het vlees.", "Ps 106:25": "Maar zij morden in hun tenten; naar de stem van de HEERE luisterden zij niet.", "Pred 9:16-18": "Toen zei ik: Wijsheid is beter dan kracht, hoewel de wijsheid van de arme veracht wordt, en zijn woorden niet gehoord worden. De woorden van de wijzen moeten in stilte aangehoord worden, meer dan het geroep van hem die over de dwazen heerst. De wijsheid is beter dan oorlogswapens, maar één zondaar verderft veel goeds.", "Hab 2:20": "Maar de HEERE is in Zijn heilige tempel. Zwijg voor Zijn aangezicht, heel de aarde!", "1 Kon 13:24": "Zo ging hij weg, en een leeuw vond hem op de weg, en doodde hem; en zijn dode lichaam lag geworpen op de weg, en de ezel stond ernaast; ook stond de leeuw bij het dode lichaam.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Jer 13:1-3": "Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "2 Kon 4:1": "Een vrouw uit de vrouwen van de zonen der profeten riep tot Elisa en zei: Uw knecht, mijn man, is gestorven, en u weet dat uw knecht de HEERE was vrezende; nu is de schuldeiser gekomen om mijn beide kinderen voor zich tot knechten te nemen.", "Gen 5:24": "Henoch dan wandelde met God; en hij was er niet meer; want God nam hem weg.", "Deut 34:9": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Jer 50:24": "Ik heb u een strik gesteld, en daardoor bent u ook gevangen, o Babel! Zonder dat u het wist; u bent gevonden, en ook gegrepen, omdat u zich tegen de HEERE in strijd gemengd hebt.", "1 Kon 22:24": "Toen kwam Zedekia, de zoon van Kenaana, dichterbij en sloeg Micha op de wang, en hij zei: Langs welke weg is de geest van de HEERE van mij weggegaan om u aan te spreken?", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "Joh 11:25": "Jezus zei tegen haar: Ik ben de Opstanding en het Leven; wie in Mij gelooft zal leven, ook al was hij gestorven;", "Jer 2:31": "Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?", "1 Tim 6:19": "en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "1 Kon 18:12": "En het zou kunnen gebeuren, zodra ik van u weggegaan ben, dat de Geest van de HEERE u wegneemt, ik weet niet waarheen; en dan kom ik om dat aan Achab te melden, en hij vindt u niet, dan zou hij mij doden; terwijl ik, uw knecht, de HEERE al van mijn jeugd af aan vrees.", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "2 Sam 1:11": "Toen greep David zijn kleren en scheurde ze; evenzo ook al de mannen die met hem waren.", "1 Kon 18:10": "Zo waarachtig als de HEERE, uw God, leeft: er is geen volk of koninkrijk waar mijn heer niet naartoe gezonden heeft om u te zoeken; en als zij zeiden: Hij is hier niet, liet hij dat koninkrijk en dat volk zweren dat zij u niet hadden gevonden.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Richt 11:35": "En het gebeurde, toen hij haar zag, dat hij zijn kleren scheurde, en zei: Ach, mijn dochter! U hebt mij helemaal terneergeslagen, en u bent onder degenen die mij in het ongeluk storten; want ik heb mijn mond opengedaan tegen de HEERE, en ik kan niet terug.", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "1 Tim 4:8": "Want de lichamelijke oefening is van weinig nut; maar de godvruchtigheid is nuttig voor alles, omdat zij de belofte heeft van het tegenwoordige en van het toekomende leven.", "Luk 10:20": "Maar verblijd u daar niet in, dat de geesten zich aan u onderwerpen; verblijd u veel meer dat uw namen opgeschreven zijn in de hemelen.", "Micha 7:10": "En mijn vijandin zal het zien, en schaamte zal haar bedekken; zij die tegen mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen op haar neerzien; nu zal zij worden tot vertreding, als slijk van de straten.", "Mal 3:13": "Uw woorden zijn tegen Mij te sterk geworden, zegt de HEERE; maar u zegt: Wat hebben wij tegen U gesproken?", "Mark 12:26": "Maar wat de doden betreft, dat zij opgewekt zullen worden: hebt u niet gelezen in het boek van Mozes, hoe God in de doornstruik tot hem gesproken heeft: Ik ben de God van Abraham, en de God van Izak, en de God van Jakob?", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Kol 3:4": "Wanneer nu Christus geopenbaard zal zijn, Die ons leven is, dan zult ook u met Hem geopenbaard worden in heerlijkheid.", "Spr 22:15": "De dwaasheid zit gebonden in het hart van de jongen; de roede van de tucht zal ze ver van hem wegdoen.", "Luk 16:22": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven.", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Ezech 47:8-11": "Toen zei hij tegen mij: Dit water stroomt uit naar het oostelijke gebied, en daalt af in het vlakke veld; daarna komt het in de zee; wanneer het in de zee is uitgekomen, wordt het water gezond. Ja, het zal gebeuren dat elk levend wezen dat er wemelt, zal leven, overal waarheen een van de twee beken zal komen; en daar zal heel veel vis zijn, omdat dit water daarheen zal zijn gekomen, en het zal gezond worden, en alles zal leven, waarheen deze beek zal komen. Ook zal het gebeuren dat er vissers bij zullen staan, van En-Gedi tot En-Eglaim toe; daar zullen plaatsen zijn om netten uit te spreiden; de vis zal naar zijn soort zijn als de vis van de grote zee, heel talrijk.", "Ps 10:13": "Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Joh 12:26": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren.", "Ps 42:4": "Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "1 Kon 18:13": "Is mijn heer niet verteld wat ik gedaan heb, toen Izebel de profeten van de HEERE doodde? Dat ik van de profeten van de HEERE honderd man heb verborgen, elk vijftig man in een grot, en hen met brood en water heb onderhouden?", "Ezech 20:49": "En ik zei: Ach, Heere HEERE, zij zeggen van mij: Spreekt hij niet in gelijkenissen?", "1 Tess 4:13-18": "Maar, broeders, ik wil niet dat u onwetend bent over hen die ontslapen zijn, opdat u niet bedroefd bent, zoals ook de anderen, die geen hoop hebben. Want als wij geloven dat Jezus gestorven is en opgestaan, zo zal God ook hen die in Jezus ontslapen zijn, met Hem terug brengen. Want dit zeggen wij u door het Woord van de Heere, dat wij, die levend overblijven tot de komst van de Heere, hen die ontslapen zijn niet zullen voorgaan.", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "2 Kon 22:11": "Het gebeurde nu, toen de koning de woorden van het wetboek hoorde, dat hij zijn kleren scheurde.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "Ps 12:4": "De HEERE snijdt alle vleiende lippen af, en de tong die grootspreekt;", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Dan 3:15": "Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, dan is het goed; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen?", "Rom 3:5": "Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.)", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Mark 12:27": "God is niet een God van de doden, maar een God van de levenden. U dwaalt dus zeer.", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Job 34:7": "Wat man is er, gelijk Job? Hij drinkt de bespotting in als water;", "Ps 35:15": "Maar toen ik hinkte, waren zij verblijd, en verzamelden zich; zij verzamelden zich tegen mij als geslagenen, en ik merkte niets; zij scheurden hun kleren, en zwegen niet stil.", "Mark 11:21": "En Petrus, die zich dit herinnerde, zei tegen Hem: Rabbi, zie, de vijgenboom die U vervloekt hebt, is verdord.", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "Jes 26:19": "Uw doden zullen leven, ook mijn dode lichaam, zij zullen opstaan; waak op en juich, u die in het stof woont! Want uw dauw zal zijn als een dauw van de moeskruiden, en het land zal de overledenen uitwerpen.", "2 Petr 2:1": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen;", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Joh 14:12": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, de werken die Ik doe, zal hij ook doen, en zal grotere doen dan deze, want Ik ga heen tot Mijn Vader.", "Joz 1:1-9": "Het gebeurde nu, na de dood van Mozes, de knecht van de HEERE, dat de HEERE tegen Jozua, de zoon van Nun, de dienaar van Mozes, sprak en zei: Mijn knecht Mozes is gestorven; maak u nu op, trek deze Jordaan over, u en al dit volk, naar het land dat Ik hun, de kinderen van Israël, geef. Elke plaats waarop uw voetzool treden zal, heb Ik u gegeven, zoals Ik tegen Mozes gesproken heb.", "Hand 26:7": "Waarnaar onze twaalf stammen, voortdurend nacht en dag God dienend, hopen te komen; over die hoop, o koning Agrippa, word ik door de Joden beschuldigd.", "2 Kon 1:8": "En zij zeiden tegen hem: Hij was een man met een harig kleed, en met een leren gordel om zijn middel gebonden. Toen zei hij: Het is Elia, de Thisbiet.", "Hand 17:32": "Toen zij nu van de opstanding van de doden hoorden, spotten sommigen daarmee; en sommigen zeiden: Wij zullen u hierover een andere keer horen.", "Jes 45:9": "Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of zal uw werk zeggen: Hij heeft geen handen?", "Ps 24:3": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid?", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Ruth 1:16-18": "Maar Ruth zei: Dring er bij mij niet op aan om u te verlaten, om van achter u terug te keren; want waar u heen zult gaan, zal ik ook heen gaan, en waar u zult overnachten, zal ik overnachten; uw volk is mijn volk, en uw God mijn God. Waar u zult sterven, zal ik sterven, en daar zal ik begraven worden; zo doe mij de HEERE en zo doe Hij daar nog aan toe, als niet de dood alléén scheiding zal maken tussen mij en u! Toen zij nu zag dat zij vast van plan was met haar mee te gaan, hield zij op tegen haar te spreken.", "Jer 7:18": "De kinderen rapen hout, en de vaders steken het vuur aan, en de vrouwen kneden het deeg, om koeken te maken voor de koningin van de hemel, en drankoffers te offeren aan andere goden, om Mij verdriet aan te doen.", "2 Kon 4:30": "Doch de moeder van de jongen zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Hij stond dan op, en volgde haar.", "Ps 17:15": "Maar ik zal Uw aangezicht in gerechtigheid aanschouwen, ik zal verzadigd worden met Uw beeld, als ik zal ontwaken.", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "Ex 15:25": "Hij dan riep tot de HEERE; en de HEERE wees hem een stuk hout, dat wierp hij in het water; toen werd het water zoet. Daar stelde Hij het volk een inzetting en recht, en daar beproefde Hij hen,", "Hand 22:3": "Ik ben een Joodse man, geboren te Tarsen in Cilicië, maar opgevoed in deze stad, aan de voeten van Gamaliël onderwezen naar de nauwkeurigste wijze van de wet van de vaderen, en ik was een ijveraar voor God, zoals u allen heden bent.", "Job 30:8-31": "Zij waren kinderen van dwazen, en kinderen zonder naam; zij waren uit het land verjaagd. Maar nu ben ik hun een spotlied geworden, en ik ben hun tot een spreekwoord. Zij hebben een afschuw van mij, zij houden zich ver van mij, ja, zij weerhouden zich er niet van om voor mijn aangezicht te spugen.", "Hebr 11:29": "Door het geloof zijn zij door de Rode Zee getrokken, als over droog land; en toen de Egyptenaren dat ook probeerden, zijn zij verdronken.", "Ex 17:7": "En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "Gal 4:29": "Maar zoals destijds hij die naar het vlees geboren was, hem vervolgde die naar de Geest geboren was, zo is het ook nu."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">Het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">gebeurde</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H452\">nu</span>, toen <span class=\"wl\" data-l=\"L2\" data-code=\"H452\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H452\">HEERE</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H452\">Elia</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H452\">met</span> een storm <span class=\"wl\" data-l=\"L3\" data-code=\"H8064\">ten</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8064\">hemel</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8064\">op</span> zou nemen, <span class=\"wl\" data-l=\"L4\" data-code=\"H452\">dat</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H452\">Elia</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H452\">met</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H477\">Elisa</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H477\">van</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1537\">Gilgal</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3212\">ging</span>.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H452\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H452\">Elia</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H559\">zei</span> tegen <span class=\"wl\" data-l=\"L3\" data-code=\"H477\">Elisa</span>: <span class=\"wl\" data-l=\"L4\" data-code=\"H3427\">Blijf</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4994\">toch</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6311\">hier</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H3588\">want</span data-l=\"L3\" data-code=\"H7200\">hij</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7200\">zag</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8034\">hen</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H7043\">en</span> vervloekte hen, in <span class=\"wl\" data-l=\"L5\" data-code=\"H8034\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8034\">Naam</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8034\">van</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3318\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3318\">HEERE</span>. <span class=\"wl\" data-l=\"L6\" data-code=\"H3318\">Toen</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3318\">kwamen</span> er <span class=\"wl\" data-l=\"L7\" data-code=\"H8147\">twee</span> berinnen <span class=\"wl\" data-l=\"L8\" data-code=\"H4480\">uit</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4480\">het</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3293\">woud</span>, <span class=\"wl\" data-l=\"L10\" data-code=\"H1234\">en</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H1234\">verscheurden</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H1234\">van</span> hen tweeënveertig <span class=\"wl\" data-l=\"L11\" data-code=\"H3206\">kinderen</span>.", "25": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3212\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3212\">hij</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3212\">ging</span> vandaar <span class=\"wl\" data-l=\"L3\" data-code=\"H413\">naar</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H413\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2022\">berg</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3760\">Karmel</span>; <span class=\"wl\" data-l=\"L2\" data-code=\"H4480\">en</span> vandaar <span class=\"wl\" data-l=\"L6\" data-code=\"H7725\">keerde</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7725\">hij</span> terug <span class=\"wl\" data-l=\"L7\" data-code=\"H8111\">naar</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H8111\">Samaria</span>."}, "koppeling_kjv": {"1": "And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> would take <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> into <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> by a <span class=\"wl wl-kjv\" data-code=\"H5591\">whirlwind,</span> that <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> from <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal.</span>", "2": "And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">Tarry</span> here, I pray thee; for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me to <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel.</span> And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> and as thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> thee. So they went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel.</span>", "3": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> that were at <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3045\">Knowest</span> thou that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will take <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> from thy <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Yea, I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> it; hold ye your <span class=\"wl wl-kjv\" data-code=\"H2814\">peace.</span>", "4": "And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">tarry</span> here, I pray thee; for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me to <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> and as thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> thee. So they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho.</span>", "5": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> that were at <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3045\">Knowest</span> thou that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will take <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> from thy <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> Yea, I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> it; hold ye your <span class=\"wl wl-kjv\" data-code=\"H2814\">peace.</span>", "6": "And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3427\">Tarry,</span> I pray thee, here; for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me to <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> and as thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> thee. And they <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> went <span class=\"wl wl-kjv\" data-code=\"H3212\">on.</span>", "7": "And <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> to <span class=\"wl wl-kjv\" data-code=\"H5048\">view</span> afar <span class=\"wl wl-kjv\" data-code=\"H7350\">off:</span> and they <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan.</span>", "8": "And <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> his <span class=\"wl wl-kjv\" data-code=\"H155\">mantle,</span> and wrapped it <span class=\"wl wl-kjv\" data-code=\"H1563\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> and they were <span class=\"wl wl-kjv\" data-code=\"H2673\">divided</span> hither and thither, so that they <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> went <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> on <span class=\"wl wl-kjv\" data-code=\"H2724\">dry</span> ground.", "9": "And it came to pass, when they were gone <span class=\"wl wl-kjv\" data-code=\"H5674\">over,</span> that <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha,</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">Ask</span> what I shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> for thee, before I be taken <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> from thee. And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I pray thee, let a <span class=\"wl wl-kjv\" data-code=\"H8147\">double</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">portion</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> be upon me.", "10": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou hast <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> a hard <span class=\"wl wl-kjv\" data-code=\"H7185\">thing:</span> nevertheless, if thou <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> me when I am <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> from thee, it shall be so unto thee; but if not, it shall not be so.", "11": "And it came to pass, as they <span class=\"wl wl-kjv\" data-code=\"H1980\">still</span> went <span class=\"wl wl-kjv\" data-code=\"H1980\">on,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">talked,</span> that, behold, there appeared a <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and <span class=\"wl wl-kjv\" data-code=\"H6504\">parted</span> them <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> <span class=\"wl wl-kjv\" data-code=\"H996\">asunder;</span> and <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> by a <span class=\"wl wl-kjv\" data-code=\"H5591\">whirlwind</span> into <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven.</span>", "12": "And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> it, and he <span class=\"wl wl-kjv\" data-code=\"H6817\">cried,</span> My <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen</span> thereof. And he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> him no more: and he took <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> of his own <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> them in <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H7168\">pieces.</span>", "13": "He took <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> also the <span class=\"wl wl-kjv\" data-code=\"H155\">mantle</span> of <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> that <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> from him, and went <span class=\"wl wl-kjv\" data-code=\"H7725\">back,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by the <span class=\"wl wl-kjv\" data-code=\"H8193\">bank</span> of <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan;</span>", "14": "And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H155\">mantle</span> of <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> that <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> from him, and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Where is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah?</span> and when he also had <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> they <span class=\"wl wl-kjv\" data-code=\"H2673\">parted</span> hither and thither: and <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> went <span class=\"wl wl-kjv\" data-code=\"H5674\">over.</span>", "15": "And when the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> which were to view at <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> him, they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> doth <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> on <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha.</span> And they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him, and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> themselves to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> before him.", "16": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Behold now, there <span class=\"wl wl-kjv\" data-code=\"H3426\">be</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">men;</span> let them <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> we pray thee, and <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> thy <span class=\"wl wl-kjv\" data-code=\"H113\">master:</span> lest peradventure the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath taken him <span class=\"wl wl-kjv\" data-code=\"H5375\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> him upon <span class=\"wl wl-kjv\" data-code=\"H259\">some</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> or into <span class=\"wl wl-kjv\" data-code=\"H259\">some</span> <span class=\"wl wl-kjv\" data-code=\"H1516\">valley.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Ye shall not <span class=\"wl wl-kjv\" data-co /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],

).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';

    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?

    return label + refChips(nd.refs) + kids;

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>

function renderPaneel(n) {

    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
