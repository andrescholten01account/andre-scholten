 en uw ziel leeft, ik zal u niet verlaten! Zo kwamen zij te Jericho.","5":"Toen traden de zonen van de profeten, die te Jericho waren, naar Elisa toe, en zeiden tegen hem: Weet u dat de HEERE vandaag uw heer van boven uw hoofd wegnemen zal? En hij zei: Ik weet het ook wel, zwijgt u stil.","6":"En Elia zei tegen hem: Blijf toch hier, want de HEERE heeft mij naar de Jordaan gezonden. Maar hij zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! En zij beiden gingen verder.","7":"En vijftig mannen van de zonen van de profeten gingen erheen, en gingen op afstand tegenover hen staan; en die beiden stonden bij de Jordaan.","8":"Toen nam Elia zijn mantel, en wond hem samen, en sloeg het water, en het werd naar de ene en de andere kant verdeeld; en zij beiden gingen er door op het droge.","9":"Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!","10":"En hij zei: U hebt een moeilijke zaak gevraagd; als u mij zult zien wanneer ik van bij u weggenomen word, zal het u zo gebeuren; maar zo niet, dan zal het niet gebeuren.","11":"En het gebeurde, terwijl zij verder gingen, al gaande en sprekende, zie, zo was er een vurige wagen met vurige paarden, die tussen hen beiden scheiding maakten. Zo voer Elia met een storm ten hemel.","12":"En Elisa zag het, en hij riep: Mijn vader, mijn vader, wagen van Israël en zijn ruiters! En hij zag hem niet meer; en hij greep zijn klederen en scheurde ze in twee stukken.","13":"Hij nam ook Elia's mantel op, die van hem afgevallen was, en keerde terug, en ging bij de oever van de Jordaan staan.","14":"En hij nam de mantel van Elia, die van hem afgevallen was, en sloeg het water, en zei: Waar is de HEERE, de God van Elia? Ja, Dezelfde? En hij sloeg het water, en het werd naar de ene en de andere kant verdeeld, en Elisa ging er door.","15":"Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.","16":"En zij zeiden tegen hem: Zie toch, er zijn bij uw knechten vijftig dappere mannen; laat hen toch heengaan, en uw heer zoeken, of niet misschien de Geest van de HEERE hem opgenomen heeft, en op een van de bergen, of in een van de dalen hem geworpen heeft. Doch hij zei: Stuur hen niet.","17":"Maar zij drongen bij hem aan tot het schamen toe; en hij zei: Stuur hen. En zij stuurden vijftig mannen, die drie dagen zochten, doch hem niet vonden.","18":"Toen kwamen zij weer bij hem, terwijl hij te Jericho gebleven was; en hij zei tegen hen: Heb ik niet tegen u gezegd: Gaat niet?","19":"En de mannen van de stad zeiden tegen Elisa: Zie toch, de ligging van deze stad is goed, zoals mijn heer ziet; maar het water is slecht, en het land onvruchtbaar.","20":"En hij zei: Brengt mij een nieuwe schaal, en legt er zout in. En zij brachten ze naar hem toe.","21":"Toen ging hij naar de waterbron, en wierp het zout erin, en zei: Zo zegt de HEERE: Ik heb dit water gezond gemaakt, er zal geen dood noch onvruchtbaarheid meer van komen.","22":"Zo werd dat water gezond, tot op deze dag, naar het woord van Elisa, dat hij gesproken had.","23":"En hij ging vandaar op naar Beth-el. Toen hij nu de weg opging, kwamen er kleine jongens uit de stad; die bespotten hem, en zeiden tegen hem: Kaalkop, ga op, kaalkop, ga op!","24":"En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.","25":"En hij ging vandaar naar de berg Karmel; en vandaar keerde hij terug naar Samaria."},"SV":{"1":"Het geschiedde nu, als de HEERE Elia met een onweder ten hemel opnemen zou, dat Elia met Elisa ging van Gilgal.","2":"En Elia zeide tot Elisa: Blijf toch hier, want de HEERE heeft mij naar Beth-el gezonden. Maar Elisa zeide: *Zo* *waarachtig* *als* de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Alzo gingen zij af naar Beth-el.","3":"Toen gingen de zonen der profeten, die te Beth-el waren, tot Elisa uit, en zeiden tot hem: Weet gij, dat de HEERE heden uw heer van uw hoofd wegnemen zal? En hij zeide: Ik weet het ook wel, zwijgt gij stil.","4":"En Elia zeide tot hem: Elisa, blijf toch hier, want de HEERE heeft mij naar Jericho gezonden. Maar hij zeide: *Zo* *waarachtig* *als* de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Alzo kwamen zij te Jericho.","5":"Toen traden de zonen der profeten, die te Jericho waren, naar Elisa toe, en zeiden tot hem: Weet gij, dat de HEERE heden uw heer van uw hoofd wegnemen zal? En hij zeide: Ik weet het ook wel, zwijgt gij stil.","6":"En Elia zeide tot hem: Blijf toch hier, want de HEERE heeft mij naar de Jordaan gezonden. Maar hij zeide: *Zo* *waarachtig* *als* de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! En zij beiden gingen henen.","7":"En vijftig mannen van de zonen der profeten gingen henen, en stonden tegenover van verre; en die beiden stonden aan de Jordaan.","8":"Toen nam Elia zijn mantel, en wond *hem* samen, en sloeg het water, en het werd herwaarts en derwaarts verdeeld; en zij beiden gingen er door op het droge.","9":"Het geschiedde nu, als zij overgekomen waren, dat Elia zeide tot Elisa: Begeer wat ik u doen zal, eer ik van bij u weggenomen worde. En Elisa zeide: Dat toch twee delen van uw geest op mij zijn!","10":"En hij zeide: Gij hebt een harde zaak begeerd; indien gij mij zult zien, als ik van bij u weggenomen worde, het zal u alzo geschieden; doch zo niet, het zal niet geschieden.","11":"En het gebeurde, als zij voortgingen, gaande en sprekende, ziet, zo was er een vurige wagen met vurige paarden, die tussen hen beiden scheiding maakten. Alzo voer Elia met een onweder ten hemel.","12":"En Elisa zag het, en hij riep: Mijn vader, mijn vader, wagen Israëls en zijn ruiteren! En hij zag hem niet meer; en hij vatte zijn klederen en scheurde ze in twee stukken.","13":"Hij hief ook Elia’s mantel op, die van hem afgevallen was, en keerde weder, en stond aan den oever van de Jordaan.","14":"En hij nam den mantel van Elia, die van hem afgevallen was, en sloeg het water, en zeide: Waar is de HEERE, de God van Elia? Ja, Dezelve? En hij sloeg het water, en het werd herwaarts en derwaarts verdeeld, en Elisa ging er door.","15":"Als nu de kinderen der profeten, die tegenover te Jericho waren, hem zagen, zo zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neder ter aarde.","16":"En zij zeiden tot hem: Zie nu, er zijn bij uw knechten vijftig dappere mannen; laat hen toch heengaan, en uw heer zoeken, of niet misschien de Geest des HEEREN hem opgenomen, en op een der bergen, of in een der dalen hem geworpen heeft. Doch hij zeide: Zendt niet.","17":"Maar zij hielden bij hem aan tot schamens toe; en hij zeide: Zendt. En zij zonden vijftig mannen, die drie dagen zochten, doch hem niet vonden.","18":"Toen kwamen zij weder tot hem, daar hij te Jericho gebleven was; en hij zeide tot hen: Heb ik tot ulieden niet gezegd: Gaat niet?","19":"En de mannen der stad zeiden tot Elisa: Zie toch, de woning dezer stad is goed, gelijk als mijn heer ziet; maar het water is kwaad, en het land onvruchtbaar.","20":"En hij zeide: Brengt mij een nieuwe schaal, en legt er zout in. En zij brachten ze tot hem.","21":"Toen ging hij uit tot de waterwel, en wierp het zout daarin, en zeide: Zo zegt de HEERE: Ik heb dit water gezond gemaakt, er zal geen dood noch onvruchtbaarheid meer van worden.","22":"Alzo werd dat water gezond, tot op dezen dag, naar het woord van Elisa, dat hij gesproken had.","23":"En hij ging van daar op naar Beth-el. Als hij nu den weg opging, zo kwamen kleine jongens uit de stad; die bespotten hem, en zeiden tot hem: Kaalkop, ga op, kaalkop, ga op!","24":"En hij keerde zich achterom, en hij zag ze, en vloekte hen, in den Naam des HEEREN. Toen kwamen twee beren uit het woud, en verscheurden van dezelve twee en veertig kinderen.","25":"En hij ging van daar naar den berg Karmel; en van daar keerde hij weder naar Samaria."},"KJV":{"1":"And it came to pass, when the LORD would take up Elijah into heaven by a whirlwind, that Elijah went with Elisha from Gilgal.","2":"And Elijah said unto Elisha, Tarry here, I pray thee; for the LORD hath sent me to Bethel. And Elisha said unto him, As the LORD liveth, and as thy soul liveth, I will not leave thee. So they went down to Bethel.","3":"And the sons of the prophets that were at Bethel came forth to Elisha, and said unto him, Knowest thou that the LORD will take away thy master from thy head to day? And he said, Yea, I know it; hold ye your peace.","4":"And Elijah said unto him, Elisha, tarry here, I pray thee; for the LORD hath sent me to Jericho. And he said, As the LORD liveth, and as thy soul liveth, I will not leave thee. So they came to Jericho.","5":"And the sons of the prophets that were at Jericho came to Elisha, and said unto him, Knowest thou that the LORD will take away thy master from thy head to day? And he answered, Yea, I know it; hold ye your peace.","6":"And Elijah said unto him, Tarry, I pray thee, here; for the LORD hath sent me to Jordan. And he said, As the LORD liveth, and as thy soul liveth, I will not leave thee. And they two went on.","7":"And fifty men of the sons of the prophets went, and stood to view afar off: and they two stood by Jordan.","8":"And Elijah took his mantle, and wrapped it together, and smote the waters, and they were divided hither and thither, so that they two went over on dry ground.","9":"And it came to pass, when they were gone over, that Elijah said unto Elisha, Ask what I shall do for thee, before I be taken away from thee. And Elisha said, I pray thee, let a double portion of thy spirit be upon me.","10":"And he said, Thou hast asked a hard thing: nevertheless, if thou see me when I am taken from thee, it shall be so unto thee; but if not, it shall not be so.","11":"And it came to pass, as they still went on, and talked, that, behold, there appeared a chariot of fire, and horses of fire, and parted them both asunder; and Elijah went up by a whirlwind into heaven.","12":"And Elisha saw it, and he cried, My father, my father, the chariot of Israel, and the horsemen thereof. And he saw him no more: and he took hold of his own clothes, and rent them in two pieces.","13":"He took up also the mantle of Elijah that fell from him, and went back, and stood by the bank of Jordan;","14":"And he took the mantle of Elijah that fell from him, and smote the waters, and said, Where is the LORD God of Elijah? and when he also had smitten the waters, they parted hither and thither: and Elisha went over.","15":"And when the sons of the prophets which were to view at Jericho saw him, they said, The spirit of Elijah doth rest on Elisha. And they came to meet him, and bowed themselves to the ground before him.","16":"And they said unto him, Behold now, there be with thy servants fifty strong men; let them go, we pray thee, and seek thy master: lest peradventure the Spirit of the LORD hath taken him up, and cast him upon some mountain, or into some valley. And he said, Ye shall not send.","17":"And when they urged him till he was ashamed, he said, Send. They sent therefore fifty men; and they sought three days, but found him not.","18":"And when they came again to him, (for he tarried at Jericho,) he said unto them, Did I not say unto you, Go not?","19":"And the men of the city said unto Elisha, Behold, I pray thee, the situation of this city is pleasant, as my lord seeth: but the water is naught, and the ground barren.","20":"And he said, Bring me a new cruse, and put salt therein. And they brought it to him.","21":"And he went forth unto the spring of the waters, and cast the salt in there, and said, Thus saith the LORD, I have healed these waters; there shall not be from thence any more death or barren land.","22":"So the waters were healed unto this day, according to the saying of Elisha which he spake.","23":"And he went up from thence unto Bethel: and as he was going up by the way, there came forth little children out of the city, and mocked him, and said unto him, Go up, thou bald head; go up, thou bald head.","24":"And he turned back, and looked on them, and cursed them in the name of the LORD. And there came forth two she bears out of the wood, and tare forty and two children of them.","25":"And he went from thence to mount Carmel, and from thence he returned to Samaria."}},"tsk":{"1":[{"kopje":"ten hemel op zou nemen","refs":["Gen 5:24","1 Kon 19:4","Luk 9:51","Hand 1:9","Hebr 11:5","Openb 11:12"]},{"kopje":"met een storm","refs":["1 Kon 18:12","1 Kon 19:11","Job 38:1"]},{"kopje":"Elisa","refs":["1 Kon 19:16-21"]},{"kopje":"Gilgal","refs":["Joz 4:19","Joz 5:9"]}],"2":[{"kopje":"Blijf toch hier","refs":["Ruth 1:15","Ruth 1:16","2 Sam 15:19","2 Sam 15:20","Joh 6:67","Joh 6:68"]},{"kopje":"Zo waarachtig als de HEERE","refs":["2 Kon 2:4","2 Kon 2:6","2 Kon 4:30","1 Sam 1:26","1 Sam 17:55","1 Sam 25:26","Jer 4:2"]},{"kopje":"ik zal u niet","refs":["Ruth 1:16-18","2 Sam 15:21","1 Joh 2:19"]},{"kopje":"Beth-el","refs":["Gen 28:19","1 Kon 12:29","1 Kon 12:33","1 Kon 13:1","1 Kon 13:2"]}],"3":[{"kopje":"Toen gingen de zonen","refs":["2 Kon 2:5","2 Kon 2:7","2 Kon 2:15","2 Kon 4:1","2 Kon 4:38","2 Kon 9:1","1 Sam 10:10-12","1 Sam 19:20","1 Kon 18:4","1 Kon 20:35","Jes 8:18"]},{"kopje":"uw heer","refs":["Deut 33:3","Hand 22:3"]}],"4":[{"kopje":"Jericho","refs":["Joz 6:26","1 Kon 16:34","Luk 19:1"]},{"kopje":"Zo waarachtig als de HEERE","refs":["2 Kon 2:2","2 Kon 4:30","Hand 2:42","Hand 11:23"]}],"5":[{"kopje":"uw heer","refs":["2 Kon 2:3","Joz 1:1","Joz 1:2","Luk 24:51","Joh 17:5-7","Hand 1:2","Hand 1:11","Hand 26:25"]},{"kopje":"Ik weet het","refs":["Gen 48:19","Pred 3:7","Jes 41:1","Hab 2:20"]}],"7":[{"kopje":"vijftig mannen","refs":["2 Kon 2:17","1 Kon 18:4","1 Kon 18:13"]}],"8":[{ t <span class=\"wl wl-kjv\" data-code=\"H5674\">over.</span>","15":"And when the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> which were to view at <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> him, they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah</span> doth <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> on <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha.</span> And they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him, and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> themselves to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> before him.","16":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Behold now, there <span class=\"wl wl-kjv\" data-code=\"H3426\">be</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">men;</span> let them <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> we pray thee, and <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> thy <span class=\"wl wl-kjv\" data-code=\"H113\">master:</span> lest peradventure the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath taken him <span class=\"wl wl-kjv\" data-code=\"H5375\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> him upon <span class=\"wl wl-kjv\" data-code=\"H259\">some</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> or into <span class=\"wl wl ":"Hieruit blijkt dat de profeten in veel steden hun scholen gehad hebben, in welke jonge profeten en leraars tot bekering van het afvallige Israël opgekweekt werden."}],"7":[{"catchword":"stonden","tekst":"Te weten, om waar te nemen wat den profeet Elia wedervaren zou."}],"9":[{"catchword":"twee delen","tekst":"Hebreeuws, de mond van twee, in, of van uw geest op, of tot mij; dat is, het deel van twee; hetwelk is twee delen. Het woord mond is voor het deel van enige zaak genomen, Deu 21:17; Zec 13:8. De zin is, alsof hij zeide: Dewijl gij, o mijn vader, veel kinderen, dat is jonge profeten, nalaat, die allen een deel uwer gaven zullen behoeven, zo is mijn bede dat ik twee delen heb; dat is, dat mijn deel nog eens zo groot zij als het hunne, zijnde gelijk uw eerstgeboren en voornaamste discipel, die in uw plaats opvolgen moet. Anderen nemen de dubbele portie ten aanzien en in vergelijking van Elia, zodat Elisa zou begeerd hebben nog eens zoveel van de profetische gaven als Elia daarvan had. Ook kan men de begeerte van Elisa eenvoudig aldus verstaan, dat hij begeerd heeft de tweeërlei profetische gaven, in welke Elia onder andere profeten zeer heeft uitgestoken, welke waren:&lt;i&gt;I.&lt;/i&gt; het voorzeggen van toekomende dingen;&lt;i&gt;II.&lt;/i&gt; het doen van grote wonderwerken. Of hij verstaat het deel der profetie, hetwelk Elia had gehad, hetwelk tweevoudig, dat is zeer groot was geweest, ten aanzien van veel andere profeten."}],"10":[{"catchword":"harde zaak","tekst":"Hebreeuws, gij hebt het hard gemaakt met bidden. Hard wordt hier genoemd dat de mensen niet geven kunnen, maar God alleen geeft, en dat zeer zelden."},{"catchword":"indien","tekst":"Dit wordt hem als een teken voorgesteld van hetgeen God, rakende zijne begeerte, doen zou, opdat hij hier intussen, naar de vervulling van het teken met vurige gebeden verlangen zou, en dat ontvangen hebbende, van nieuws in het beroep van zijn profetisch ambt gesterkt mocht worden."},{"catchword":"zult zien,","tekst":"Hebreeuws, zult zien van bij u weggenomen worden."}],"11":[{"catchword":"wagen","tekst":"Geregeerd en bestuurd van de heilige engelen. Vergelijk onder, 2Ki 6:17."}],"12":[{"catchword":"Mijn vader,","tekst":"Zo noemt hij zijn meester uit liefde en eerbied, gelijk ter andere zijde de discipelen zonen hunner meesters genoemd worden. Zie 1Ki 20:35, en de aantekening daarop."},{"catchword":"wagen Israëls","tekst":"Dat is, de macht en de sterkte Israëls, welke ten oorlog meest in wagens en ruiters was gelegen. De zin is, dat Elia's leer, gebeden en werken meerdere kracht tot bescherming des lands was dan in het geweld van den oorlog. Vergelijk onder, 2Ki 13:14."},{"catchword":"en scheurde ze","tekst":"Tot een teken van treurigheid, die hij maakte over de wegneming van zijn meester. Zie Gen 37:29."},{"catchword":"stukken","tekst":"Hebreeuws, scheuringen."}],"14":[{"catchword":"HEERE,","tekst":"Te weten, die in een gelijke daad door Elia zijn kracht in het verdelen der wateren recht tevoren bewezen had. Zie boven, vs.8."}],"15":[{"catchword":"bogen","tekst":"Hem burgerlijke eer bewijzende, als een profeet, gekomen in Elia's plaats en rijkelijk met zijn profetische gaven voorzien. Zie Gen 18:2."}],"16":[{"catchword":"uw knechten","tekst":"Dat is, bij ons, die bereid zijn u te dienen."},{"catchword":"dappere","tekst":"Of, sterke. Hebreeuws, mannen, zonen der dapperheid, sterkte, of kloekheid. Versta zulken, die bekwaam waren om deze reis en dit werk aan te nemen."},{"catchword":"opgenomen,","tekst":"Zij meenden dat hij hun niet voor altijd, maar alleen voor zekere dagen ontnomen was. Vergelijk de aantekening op 1Ki 18:12."},{"catchword":"Zendt niet","tekst":"Want hij wist voorzeker dat hij naar lijf en ziel tot God in den hemel opgenomen was."}],"17":[{"catchword":"tot schamens toe;","tekst":"Dit kan bekwamelijk verstaan worden van Elisa, omdat hij zolang moest gebeden worden, hoewel men het ook zou kunnen verstaan van de zonen der profeten, omdat zij zolang en veel moesten bidden."}],"19":[{"catchword":"onvruchtbaar","tekst":"Dat is, het land laat de vruchten der aarde niet tot haar vollen wasdom en rijpheid komen; ja ook is het leven der mensen en der beesten, mitsgaders huns lijfs dracht en vrucht, schadelijk, waardoor het land van inwoners beroofd wordt. Waarop het Hebreeuwse woord ziet, betekenende beroven van kinderen, mensen, of wat den mens lief is."}],"20":[{"catchword":"Brengt","tekst":"Hebreeuws, neemt mij; dat is, neemt en brengt mij. Zie Gen 12:15."}],"21":[{"catchword":"dood","tekst":"Aan mensen en beesten."},{"catchword":"onvruchtbaarheid","tekst":"Te weten, niet alleen aan mensen en beesten, maar ook aan het land en het gewas der aarde. Zie boven, vs.19."}],"23":[{"catchword":"die bespotten hem,","tekst":"Uit verachting niet alleen zijns persoons, omdat hij kaal was, maar ook zijns ambts, omdat hij een profeet des Heeren was en dienvolgens een gedurig bestraffer der afgoderij, die deze jongens van der jeugd af ingedronken hadden, en die daar binnen Behtel zo afgrijslijk gepleegd werd, dat de profeten deze stad Bethaven, dat is een huis der ijdelheid en goddeloosheid genoemd hebben, Hos 4:15; Amo 5:5."},{"catchword":"Kaalkop,","tekst":"Hebreeuws, kaal; dat is, die kaal is."}],"24":[{"catchword":"vloekte hen,","tekst":"Niet uit haat van hun personen, maar van de afgoderij, die zij zozeer beminden, dat zij den waren God en zijn trouwe dienaren, van den tijd dat zij enig verstand gehad hadden, geleerd en gewend waren vijandelijk te haten."},{"catchword":"in den Naam des HEEREN","tekst":"Dat is, door bevel en ingeving des Heeren; of met aanroeping zijns naams. In den naam des Heeren iets doen, is zulks te doen:&lt;i&gt;I.&lt;/i&gt; door bevel, last en drijving Gods, Deu 18:19; 2Ch 33:18; Joh 5:43;&lt;i&gt;II.&lt;/i&gt; met het vertrouwen op Gods hulp en de aanroeping zijns naams, Psa 44:6, en Psa 63:5;&lt;i&gt;III.&lt;/i&gt; om Godswil, of ter oorzaak van hem, Mat 18:5; ter ere Gods, Col 3:17."}],"25":[{"catchword":"Karmel;","tekst":"Zie 1Ki 18:19."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now it came to pass, when the LORD would take up Elia into heaven by a tempest; that Elia went with Elisa from Gilgal. [See of this place, Deut.11, 30. Jos.4.19. and 5.9.]"}],"2":[{"catchword":null,"tekst":"And Elia said unto Elisa; tarry here, I pray; [He giveth this in charge to try Elisa, or out of an holy humility to hide and conceal the manner of his taking up, it being not revealed to him, that Elisa was to be present at it] for the LORD hath sent me to Bethel, [see of this city, Gen.12.on vers.8.] but Elisa said; (as of true as) the LORD liveth, and soul liveth; I will not leave thee: [i.e. as it is true, that the Lord liveth, and that thou livest, so true it is also that I will not part from thee. This is here properly no oath, respect of the second branch or member, but an asseveration of that which he faith by comparing it with somewhat else, which is out of doubt. So in the sequel, and 1 Sam.1. 26. and 25.26. and below chap.4.30, &c. Heb. if I shall leave thee! So v.4, 6.] So they went down to Bethel."}],"3":[{"catchword":null,"tekst":"Then the sons of the Prophets, [See 1 Kings 20.on v.35.] that were at Bethel, went, forth to Elisa, and said unto him; knowest thou that the LORD will take away thy Lord [namely, Elia, whose discipline and servant Elisa was] from thine head [Heb. from upon, or over thine head: that is, from thee. They speak thus, looking at the manner of sitting in the schools, where the master or teacher, sitting in an high or exalted place, had his disciples heads at his feet, so that the parting from them, went as it were away from their heads. Compare Deu.33.3. below chap.4.38. and Act 22:3.] to day? And he said; I also know it well, [they and Elisa knew this, doubtless by Gods revelation, and by the spirit of prophecy] hold you your peace."}],"4":[{"catchword":null,"tekst":"And Elisa said unto him, Elisa tarry here, I pray: for the LORD hath sent me to Jericho: [A city lying in the tribe of Benjamin, not far from the Jordan. It is surnamed the Palm-city, Deut,34.3. See the annot.] but he said; (as true as) the LORD liveth, and thy soul liveth, I will not leave thee: so they came to Jericho."}],"5":[{"catchword":null,"tekst":"Then the sons of the Prophets which were at Jericho [Hence it appeareth that the Prophets had their Colleges in many cities, wherein young Prophets and Teachers were trained up for the converting of back sliding Israel] stepped to Elisa, and said unto him, knowest thou that the LORD will take away thy Lord from thine head to day? And he said, I also know it well, hold you your peace."}],"6":[{"catchword":null,"tekst":"And Elia said unto him, tarry here I pray, for the LORD hath sent me to Jordan; but he said; (as true as) the LORD liveth, and thy soul liveth, I will not forsake thee: and they both went on."}],"7":[{"catchword":null,"tekst":"And fifty men of the sons of the Prophets went, and stood over against (them) afar off: [viz. to see and observed what would befall the prophet Elia] and they both stood by the Jordan."}],"8":[{"catchword":null,"tekst":"Then Elia took his mantle, and wept (it) together and smote the water; and it was divided hither and thither: and they both went thorough it on dry (ground)."}],"9":[{"catchword":null,"tekst":"Now it came to pass, when they were got over, that Elia said unto Elisa: ask what I shall do for thee, before I be taken away from thee: And Elisa said: I pray thee, let two parts of thy spirit be upon me. [Heb. the mouth of two, in, or of thy spirit, upon, or to me. That is, the part of two; which is two parts. The word mouth is taken for the part of any thing, Deu.21.17. Zach.13.8. The meaning is, as if he had said: Seeing thou, my father, leavest many children, that is, young Prophets behind, who will all stand in need of a part of thy gifts, therefore my request is, I that I may have parts, that is, that my part may be double to theirs, I being as thy first-born, and chiefest disciple, that must succeed in thy room. Others take the double portion in respect, and in comparison of Elisa, so that Elisa should have desired to have once again as much of the Prophetical gifts, as Elia had. Elisa&acirc;&euro;&trade;s request may be also simply thus understood, that he desired the two kinds of Prophetical gifts, wherein Elia was very eminent above other Prophets, which were, First, the foretelling of things to come. Secondly, the working of great miracles. Or else he understandeth that part or portion of prophecy, which Elia had, which was twofold, that is, exceeding great, in respect of many other Prophets.]"}],"10":[{"catchword":null,"tekst":"And he said; thou hast asked a hard thing: [Heb. thou hast made the matter hard by asking. Hard is taken in this place for that which men cannot, but God only can give, yea and doth give very seldom] if thou shalt see me when I am taken away from thee, [Heb. shalt see from being taken away from thee] it shall so come to pass unto thee; but if not, it shall not come to pass. [this is propounded to him as a token of that which God would do touching his request, that in the mean while he might long with servant prayers for the fulfilling of the token, and have received it, might a new be strengthened and confirmed in the call of his prophetical office.]"}],"11":[{"catchword":null,"tekst":"And it came to pass, when they went on, going and talking, behold, there was then a fiery charets with fiery horses, [Guided and governed by the Holy Angels. Compare below chap.6.17.] which made a partition between them both both: so Elia went up by a tempest to Heaven."}],"12":[{"catchword":null,"tekst":"And Elisa saw it, and he cryed: My Father, my Father, [So he calleth his master, out of love and reverence: as also on the other side disciples and scholars are called sons of their masters. See 1 Kings 20.3 5. and the annotate. thereon] the charet of Israel, and the horsemen thereof; [i.e. the power and strength of Israel, which in war lay most in charets and horsemen, The meaning is, that there was more strength for the lands defence, in Elia&acirc;&euro;&trade;s doctrine, prayers and works, then in the power of war. Compare below chap.13.14.] and he saw him no more: and he took hold of his (own) cloathes, and rent them in two pieces. [Heb. rents, viz. in token of sorrow and grief for the loss of his master. See Gen.37.on v.29.]"}],"13":[{"catchword":null,"tekst":"He took up also Elia&acirc;&euro;&trade;s mantle, that was fallen down from him; and went back, and stood by the bank of the Jordan."}],"14":[{"catchword":null,"tekst":"And be took the mantle of Elia that was fallen down from him; and smote the water and said; where is the LORD the God of Elia? [viz. who in a like action had immediately before by Elia manifested his power in dividing the waters See above v.8.] yea the same, and he smote the water and it was divided hither and thither and Elisa went thorough it."}],"15":[{"catchword":null,"tekst":"Now when the children of the Prophets which were over against at Jericho, saw him, then they said, the spirit of Elia resteth on Elisa: and they came to meet him, and bowed themselves down to the ground before him. [Giving him civil honour and respect, as a Prophet come in Elia&acirc;&euro;&trade;s room, and abundantly furnished with his Prophetical gifts. Gen.18.on v.2.]"}],"16":[{"catchword":null,"tekst":"And they said unto him, behold now, there are with thy servants [i.e. with us, who are ready to serve thee] fifty valiant [or, strong] men, [Heb. men, [Heb. men, sons of valour, strength. Understand such as were sit to undertake this journey, and this work] let them go, we pray, and seek thy LORD, left peradvernture the spirit of the LORD hath taken him up, and cast him upon one of the mountains, or into one of the valleys: [they thought that he was not taken away from them forever, but only for certain days. Compare 1 Kings 18. the annotat.on v. 12.] but he said , send not. [for he knew certainly, that he was both in body and soul taken up to God into heaven.]"}],"17":[{"catchword":null,"tekst":"But they were instant with him, even unto shame, [This may fitly be understand of Elisa, for being so long entreated before he would yield: although it may also be understood of the sons of the Prophets, because they were sain to entreat so long while, and so much] and he said; and they sent fifty men, who sought three days, but found him not."}],"18":[{"catchword":null,"tekst":"Then they came to him again, while he tarried at Jericho; and he said them; did I not say unto you, go not?"}],"19":[{"catchword":null,"tekst":"And the men of the city said unto Elisa; Behold, now the dwelling of this city is good, according as my Lord seeth, but the water is bad, and the land barren. [i.e. The land brings not the fruits of the Earth to maturity and ripeness, yea, its also hurtful to the lives of men and beasts, and likewise to the fruit of their body, whereby the land is bare and left desolate of inhabitants: at which the Hebrew word looketh, signifying bereaving of children, men, and whatever is dear unto man.]"}],"20":[{"catchword":null,"tekst":"And he said; bring me [Heb. take me; that is, take it and bring it to me. See Gen.12 on v.15.] a new bowl, and put salt therein: and they brought it to him."}],"21":[{"catchword":null,"tekst":"Then he went forth to the water well, and cast the salt therein: and said; Thus saith the LORD; I have healed this water; there shall be no more death, [On men and beasts] nor barrenness [to wit, not only on men and beasts, but also on the land, and the fruits of the Earth. See above on ver.19.] from thence."}],"22":[{"catchword":null,"tekst":"So that water was healed unto this day: according to the word of Elisa, which he had spoken."}],"23":[{"catchword":null,"tekst":"And he went up from thence unto Bethel: Now as he went up the way, there came little boys out of the city, which mocked him, and said unto him, bald-paie [Heb. bald; that is, who is bald] go up, bald-paie up. [they mocked him thus, not only out of contempt of his person, because he was bald, but also of his of his office, because he was a Prophet of the Lord, and consequently a continual reprove of idolatry, which these boys from their infancy had sucked in, and was so practised in Bethel, that the Prophets called this city Bethaven, that is, the house of vanity and wickedness, Hos 4:15. Amos 5.5.]"}],"24":[{"catchword":null,"tekst":"And he turned himself back, and looked on them, and cursed them [Not out of hatred of their persons, but of their idolatry, which they had so exceedingly loved, that ever since they had any knowledge or understanding, they were taught and accustomed to hate the true God and his faithful ministers with a deadly hatred] in the name of the LORD: [i.e. by command and inspiration of the Lord, or with calling upon his name. To do any thing in the name of the Lord, is to do it, First, by command, charge and motion, or compulsion of God, Deut.18.19. 2 Chron.33.18. Job 5:43. Secondly, with confidence on God, and with calling on his name, Psa 44:6. and 63.5. Thirdly, for Gods sake, or because of him, Mat 18:5. Fourthly, to the glory of God, Col.3.17.] Then there came forth two bears out of the wood, and tare two and fourty children of them."}],"25":[{"catchword":null,"tekst":"And h went from thence to mount Carmel; [See 1 Kings 18.on v.19.] and from thence he returned to Samaria."}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {

  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
