 Kron 22:11": "Maar Jozabath, de dochter van de koning, nam Joas, de zoon van Ahazia, en stal hem uit het midden van de zonen van de koning die gedood werden, en zette hem en zijn voedster in een slaapkamer; zo verborg Jozabath, de dochter van koning Joram, de vrouw van de priester Jojada (want zij was de zuster van Ahazia), hem voor Athalia, zodat zij hem niet doodde.", "Jes 2:2": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien.", "Ezech 44:3": "De vorst, de vorst, die zal erin zitten om brood te eten voor het aangezicht van de HEERE; door de weg van het voorhuis van de poort zal hij naar binnen gaan, en door de weg daarvan zal hij naar buiten gaan.", "1 Kon 7:40": "Daartoe maakte Hiram de wasvaten, de scheppen, en de sprenkelschalen; en Hiram maakte al het werk af dat hij voor koning Salomo maakte voor het huis van de HEERE:", "2 Kon 12:1": "In het zevende jaar van Jehu werd Joas koning, en hij regeerde veertig jaren te Jeruzalem; en de naam van zijn moeder was Zibja van Ber-seba.", "2 Kron 34:4": "En men brak voor zijn ogen de altaren van de Baäls af; en de zonnebeelden, die daarboven stonden, hieuw hij af; ook verbrak en vergruisde hij de gewijde bomen en de gesneden en gegoten beelden, en strooide dat op de graven van hen die eraan geofferd hadden.", "Dan 6:22": "Toen sprak Daniël tegen de koning: O koning, leef voor eeuwig!", "Deut 12:3": "En u zult hun altaren afbreken, en hun opgerichte beelden verbrijzelen, en hun gewijde bomen met vuur verbranden, en de gesneden beelden van hun goden omhakken; en u zult hun naam uitroeien uit die plaats.", "1 Kon 10:5": "en het voedsel van zijn tafel, en het zitten van zijn knechten, en het staan van zijn dienaren, en hun kleding, en zijn schenkers, en zijn opgang waarlangs hij naar boven ging in het huis van de HEERE, toen was er in haar geen geest meer.", "1 Kon 1:35": "Dan moet u achter hem optrekken, en hij zal komen en op mijn troon zitten, en hij zal koning zijn in mijn plaats; want ik heb geboden dat hij een voorganger zal zijn over Israël en over Juda.", "2 Sam 3:31": "David dan zei tegen Joab en tegen al het volk dat bij hem was: Scheur uw kleren, en doe rouwgewaden aan, en klaag over Abner. En koning David liep zelf achter de baar.", "1 Kon 1:39": "En Zadok, de priester, nam de oliehoorn uit de tent en zalfde Salomo; en zij bliezen op de bazuin, en al het volk zei: Leve de koning Salomo!", "Spr 29:2": "Als de rechtvaardigen groot worden, verblijdt het volk zich; maar als de goddeloze heerst, zucht het volk.", "Jer 33:21": "Dan zou ook Mijn verbond met Mijn knecht David verbroken kunnen worden, zodat hij geen zoon heeft die op zijn troon regeert, en met de Levieten, de priesters, Mijn dienaren.", "Deut 5:3": "Met onze vaderen heeft de HEERE dit verbond niet gemaakt, maar met ons, wij die hier vandaag allemaal levend zijn.", "Jer 33:26": "Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen.", "1 Kron 23:3-6": "En de Levieten werden geteld, van dertig jaar af en daarboven; en hun aantal was, naar hun hoofden, aan mannen, achtendertigduizend. Uit dezen waren er vierentwintigduizend om het werk van het huis van de HEERE aan te sturen; en zesduizend opzichters en rechters; En vierduizend poortwachters, en vierduizend lofzangers van de HEERE, met instrumenten die ik gemaakt heb, zei David, om lof te zingen.", "2 Kron 22:10-12": "Toen Athalia, de moeder van Ahazia, zag dat haar zoon dood was, maakte zij zich op en bracht heel het koninklijke nageslacht van het huis van Juda om. Maar Jozabath, de dochter van de koning, nam Joas, de zoon van Ahazia, en stal hem uit het midden van de zonen van de koning die gedood werden, en zette hem en zijn voedster in een slaapkamer; zo verborg Jozabath, de dochter van koning Joram, de vrouw van de priester Jojada (want zij was de zuster van Ahazia), hem voor Athalia, zodat zij hem niet doodde. En hij was bij hen verborgen in het huis van God, zes jaar; en Athalia regeerde over het land.", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "Zach 13:2": "En het zal op die dag gebeuren, spreekt de HEERE van de heerscharen, dat Ik de namen van de afgoden uit het land zal uitroeien, zodat er niet meer aan gedacht wordt; en ook de profeten en de onreine geest zal Ik uit het land wegdoen.", "2 Kon 23:14": "Insgelijks brak hij de opgerichte beelden, en roeide de bossen uit; en hij vulde hun plaats met mensenbeenderen.", "Ps 134:1": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat!", "Ezra 10:3-44": "Laten wij dan nu een verbond maken met onze God, dat wij al die vrouwen, en wat van hen geboren is, zullen wegsturen, naar de raad van de Heere, en van hen die beven voor het gebod van onze God; en laat er gedaan worden naar de wet. Sta op, want deze zaak komt u toe; en wij zullen met u zijn; wees sterk en doe het. Toen stond Ezra op en liet de leiders van de priesters, de Levieten en heel Israël zweren dat zij zouden doen naar dit woord; en zij zwoeren.", "Neh 5:13": "Ook schudde ik mijn boezem uit, en zei: Zo schudde God uit iedere man die dit woord niet zal nakomen, uit zijn huis en uit zijn arbeid, en hij worde zo uitgeschud en leeg. En de hele gemeente zei: Amen! En zij prezen de HEERE. En het volk deed volgens dit woord.", "1 Tess 2:7": "maar wij zijn vriendelijk geweest in uw midden, zoals een voedster haar kinderen koestert;", "2 Kron 29:27": "En Hizkia gaf bevel dat men het brandoffer op het altaar zou offeren; en op het moment dat het brandoffer begon, begon ook het gezang van de HEERE, met de trompetten en met de instrumenten van David, de koning van Israël.", "2 Kon 9:3": "En neem de oliekruik, en giet die uit over zijn hoofd, en zeg: Zo zegt de HEERE: Ik heb u tot koning gezalfd over Israël. Doe daarna de deur open, en vlucht, en wacht niet.", "Job 2:12": "En toen zij hun ogen van verre opsloegen, herkenden zij hem niet, en zij verhieven hun stem en weenden; daarbij scheurden zij ieder hun mantel, en strooiden stof op hun hoofden, omhoog naar de hemel.", "1 Kon 2:28-31": "Toen het bericht Joab bereikte (want Joab had zich achter Adonia geschaard, hoewel hij zich niet achter Absalom had geschaard), vluchtte Joab naar de tent van de HEERE, en greep de hoornen van het altaar vast. En het werd de koning Salomo verteld dat Joab naar de tent van de HEERE gevlucht was, en zie, hij is bij het altaar. Toen stuurde Salomo Benaja, de zoon van Jojada, en zei: Ga, val op hem aan. En Benaja kwam bij de tent van de HEERE, en zei tegen hem: Zo zegt de koning: Kom naar buiten. En hij zei: Nee, hier zal ik sterven! En Benaja bracht het antwoord terug aan de koning en zei: Zo heeft Joab gesproken, en zo heeft hij mij geantwoord.", "Jer 33:17": "Want zo zegt de HEERE: Aan David zal het nooit ontbreken aan een Man, Die op de troon van het huis van Israël zit.", "2 Kron 15:12": "En zij sloten een verbond, dat zij de HEERE, de God van hun vaderen, zouden zoeken met hun hele hart en met hun hele ziel.", "1 Sam 10:1": "Toen nam Samuël een oliekruik, en goot ze uit op zijn hoofd, en kuste hem, en zei: Is het niet zo, dat de HEERE u tot een voorganger over Zijn erfdeel gezalfd heeft?", "1 Kron 28:1": "Toen verzamelde David alle leiders van Israël in Jeruzalem: de leiders van de stammen, de leiders van de afdelingen die de koning dienden bij toerbeurt, de leiders over de duizenden, de leiders over de honderden, de beheerders over alle bezittingen en het vee van de koning en zijn zonen, met de hovelingen, de helden en alle dappere mannen.", "Hos 12:1": "Die van Efraïm hebben Mij omsingeld met leugen, en het huis van Israël met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.", "2 Kron 34:32": "En hij liet allen die in Jeruzalem en in Benjamin gevonden werden, hierbij instemmen; en de inwoners van Jeruzalem deden naar het verbond van God, de God van hun vaderen.", "Klaagl 4:20": "Resch. De adem van onze neus, de gezalfde van de HEERE, is gevangen in hun kuilen; van wie wij zeiden: Wij zullen onder zijn schaduw leven onder de heidenen!", "2 Kor 8:5": "En zij deden niet alleen, zoals wij gehoopt hadden, maar gaven zichzelf eerst aan de Heere en daarna aan ons, door de wil van God.", "1 Sam 18:3": "Jonathan nu en David maakten een verbond, omdat hij hem liefhad als zijn eigen ziel.", "1 Kron 23:32": "En dat zij de wacht van de tent der samenkomst zouden waarnemen, en de wacht van het heiligdom, en de wacht van de zonen van Aäron, hun broeders, in de dienst van het huis van de HEERE.", "2 Kon 11:1-12": "Toen Athalia, de moeder van Ahazia, zag dat haar zoon dood was, maakte zij zich op en bracht al het koninklijke nageslacht om. Maar Joseba, de dochter van koning Joram, de zuster van Ahazia, nam Joas, de zoon van Ahazia, en stal hem uit het midden van de zonen van de koning die gedood werden. Zij zette hem en zijn voedster in een slaapkamer en verborg hem voor Athalia, zodat hij niet gedood werd. En hij was met haar verborgen in het huis van de HEERE, zes jaar; en Athalia regeerde over het land.", "1 Kon 18:10": "Zo waarachtig als de HEERE, uw God, leeft: er is geen volk of koninkrijk waar mijn heer niet naartoe gezonden heeft om u te zoeken; en als zij zeiden: Hij is hier niet, liet hij dat koninkrijk en dat volk zweren dat zij u niet hadden gevonden.", "2 Sam 1:11": "Toen greep David zijn kleren en scheurde ze; evenzo ook al de mannen die met hem waren.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Richt 11:35": "En het gebeurde, toen hij haar zag, dat hij zijn kleren scheurde, en zei: Ach, mijn dochter! U hebt mij helemaal terneergeslagen, en u bent onder degenen die mij in het ongeluk storten; want ik heb mijn mond opengedaan tegen de HEERE, en ik kan niet terug.", "2 Kron 29:10": "Nu is het mijn hartsverlangen om een verbond te sluiten met de HEERE, de God van Israël, opdat de hitte van Zijn toorn van ons afkeert.", "Joz 22:34": "En de kinderen van Ruben en de kinderen van Gad noemden dat altaar: Getuige, want het zij een getuige tussen ons, dat de HEERE God is.", "2 Kron 15:15": "En heel Juda was verblijd over deze eed; want zij hadden met hun hele hart gezworen, en met hun hele wil Hem gezocht; en Hij werd door hen gevonden, en de HEERE gaf hun rust van rondom.", "Ruth 4:16": "En Naomi nam dat kind en zette het op haar schoot, en werd zijn voedster.", "2 Kon 12:1-21": "In het zevende jaar van Jehu werd Joas koning, en hij regeerde veertig jaren te Jeruzalem; en de naam van zijn moeder was Zibja van Ber-seba. En Joas deed wat recht was in de ogen van de HEERE, al zijn dagen, waarin de priester Jojada hem onderwees. Zeker werden de hoogten niet weggenomen; het volk offerde en rookte nog op de hoogten.", "1 Kon 6:8": "De deur van de middelste zijkamer was aan de rechterzijde van het huis; en door wenteltrappen ging men naar de middelste zijkamer, en van de middelste naar de derde.", "Jer 34:15": "U nu was heden weer teruggekeerd, en had gedaan wat recht is in Mijn ogen, vrijheid uitroepend, ieder voor zijn naaste; en u had een verbond gemaakt voor Mijn aangezicht, in het huis dat naar Mijn Naam genoemd is.", "Neh 10:28": "En de rest van het volk, de priesters, de Levieten, de poortwachters, de zangers, de Nethinim, en iedereen die zich van de volken van de landen had afgescheiden voor de wet van God, hun vrouwen, hun zonen en hun dochters, iedereen die kennis en verstand had;", "Luk 18:10": "Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar.", "Hand 5:26": "Toen ging de hoofdman heen, met de dienaren, en bracht hen, doch niet met geweld (want zij vreesden het volk, dat zij niet gestenigd zouden worden).", "Jer 38:14": "Toen zond de koning Zedekia iemand, en liet de profeet Jeremia bij zich halen, bij de derde ingang die aan het huis van de HEERE was; en de koning zei tegen Jeremia: Ik zal u iets vragen, verberg niets voor mij.", "Jer 42:5": "Toen zeiden zij tegen Jeremia: De HEERE zij tussen ons tot een waarachtig en betrouwbaar Getuige: als wij niet handelen naar elk woord waarmee de HEERE, uw God, u naar ons toe zal zenden!", "2 Kon 23:4-6": "En de koning gebood de hogepriester Hilkia, en de priesters van de tweede rang, en de bewakers van de drempel, dat zij uit de tempel van de HEERE al het gereedschap, dat voor Baäl, en voor het beeld van het bos en voor heel het leger van de hemel gemaakt was, naar buiten zouden brengen; en hij verbrandde dat buiten Jeruzalem in de velden van Kidron, en liet het stof daarvan naar Beth-el brengen. Daartoe schafte hij de afgodspriesters af, die de koningen van Juda aangesteld hadden, opdat men zou roken op de hoogten, in de steden van Juda, en rondom Jeruzalem, alsook hen die voor Baäl, de zon, en de maan, en de andere planeten, en heel het leger van de hemel rookten. Hij bracht ook het beeld van het bos weg uit het huis van de HEERE, buiten Jeruzalem, naar de beek Kidron, en verbrandde het bij de beek Kidron, en vergruisde het tot stof; en hij wierp het stof daarvan op de graven van de kinderen van het volk.", "2 Sam 12:30": "En hij nam de kroon van hun koning van zijn hoofd af, waarvan het gewicht een talent goud was, met edelstenen; en die werd op Davids hoofd gezet; ook bracht hij een zeer grote roof van de stad naar buiten.", "2 Kon 22:11": "Het gebeurde nu, toen de koning de woorden van het wetboek hoorde, dat hij zijn kleren scheurde.", "Richt 19:18": "En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "2 Kron 23:18-20": "Jojada nu stelde de diensten van het huis van de HEERE aan, onder leiding van de Levitische priesters, die David in het huis van de HEERE ingedeeld had, om de brandoffers van de HEERE te offeren, zoals in de wet van Mozes geschreven staat, met blijdschap en met gezang, naar de instelling van David. En hij stelde de poortwachters aan bij de poorten van het huis van de HEERE, opdat niemand die op enige wijze onrein was, naar binnen zou komen. En hij nam de aanvoerders van de honderdtallen, en de machtigen, en hen die heerschappij hadden onder het volk, en heel het volk van het land, en bracht de koning van het huis van de HEERE af, en zij kwamen door het midden van de hoge poort naar het huis van de koning; en zij zetten de koning op de troon van het koninkrijk.", "Est 2:17": "En de koning beminde Esther boven alle vrouwen, en zij verkreeg genade en gunst bij hem, boven alle maagden; en hij zette de koninklijke kroon op haar hoofd, en hij maakte haar koningin in de plaats van Vasthi.", "Ps 47:2": "Al u volken, klapt in de hand; juicht tot God met een stem van vreugdegezang.", "Luk 11:51": "Van het bloed van Abel tot het bloed van Zacharia, die omgekomen is tussen het altaar en het huis van God; ja, Ik zeg u, het zal opgeëist worden van dit geslacht!", "Ps 11:4": "De HEERE is in het paleis van Zijn heiligheid, de troon van de HEERE is in de hemel; Zijn ogen aanschouwen, Zijn oogleden beproeven de mensenkinderen.", "2 Kron 34:15": "En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek.", "Hand 7:20": "In die tijd werd Mozes geboren, en hij was buitengewoon mooi; hij werd drie maanden opgevoed in het huis van zijn vader.", "2 Kon 20:8": "Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan?", "Deut 29:12": "Om over te gaan in het verbond van de HEERE, uw God, en in Zijn vloek, die de HEERE, uw God, heden met u maakt;", "2 Kron 22:2": "Ahazia was tweeënveertig jaar oud toen hij koning werd, en hij regeerde een jaar in Jeruzalem; en de naam van zijn moeder was Athalia, een dochter van Omri.", "Rom 13:1-6": "Ieder mens moet onderworpen zijn aan de machten die over hem gesteld zijn; want er is geen macht dan van God, en de machten die er zijn, zijn door God aangesteld. Zodat hij die zich tegen de macht stelt, de instelling van God weerstaat; en zij die weerstaan, zullen over zichzelf een oordeel halen. Want de leiders zijn niet tot een schrik voor de goede werken, maar voor de kwade. Wilt u nu de macht niet vrezen? Doe het goede, en u zult lof van haar hebben;", "Jer 26:10": "Toen nu de vorsten van Juda deze woorden hoorden, gingen zij op uit het huis van de koning naar het huis van de HEERE; en zij zetten zich bij de deur van de nieuwe poort van de HEERE.", "Jer 22:30": "Zo zegt de HEERE: Schrijf deze man op als kinderloos, een man die niet voorspoedig zal zijn in zijn dagen; want niemand van zijn nageslacht zal voorspoedig zijn, zittend op de troon van David, en nog heersend in Juda.", "2 Kon 11:4-16": "In het zevende jaar zond Jojada, en nam de leiders van honderd met de hoofdmannen en met de lijfwacht, en hij bracht hen bij zich, in het huis van de HEERE; en hij sloot een verbond met hen en beëdigde hen in het huis van de HEERE, en hij toonde hun de zoon van de koning. En hij gebood hun en zei: Dit is de zaak die u doen zult: een derde deel van u, die op de sabbat de dienst ingaan, zal de wacht waarnemen van het huis van de koning; en een derde deel zal zijn bij de poort Sur; en een derde deel bij de poort achter de lijfwacht; zo zult u de wacht van dit huis waarnemen, tegen inbraak."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H6271\">Toen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H6271\">Athalia</span>, <span class=\"wl\" data-l=\"L1\" data-code=\"H6271\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H517\">moeder</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H517\">van</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H274\">Ahazia</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H7200\">zag</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3588\">dat</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3588\">haar</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4191\">dood</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4191\">was</span>, <span class=\"wl\" data-l=\"L8\" data-code=\"H6965\">maakte</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H6965\">zij</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H6965\">zich</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H6965\">op</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H6\">en</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H6\">bracht</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3605\">al</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3605\">het</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H4467\">koninklijke</span> nageslacht om.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3089\">Maar</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3089\">Joseba</span>, <span class=\"wl\" data-l=\"L1\" data-code=\"H3089\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1323\">dochter</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1323\">van</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3141\">Joram</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H3141\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H2 /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
