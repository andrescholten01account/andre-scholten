t een verbond met hen en beëdigde hen in het huis van de HEERE, en hij toonde hun de zoon van de koning.","5":"En hij gebood hun en zei: Dit is de zaak die u doen zult: een derde deel van u, die op de sabbat de dienst ingaan, zal de wacht waarnemen van het huis van de koning;","6":"en een derde deel zal zijn bij de poort Sur; en een derde deel bij de poort achter de lijfwacht; zo zult u de wacht van dit huis waarnemen, tegen inbraak.","7":"En de twee delen van u, allen die op de sabbat de dienst uitgaan, zullen de wacht van het huis van de HEERE waarnemen bij de koning.","8":"En u zult de koning rondom omsingelen, ieder met zijn wapens in zijn hand, en wie tussen de gelederen intreedt, zal gedood worden; en wees bij de koning, als hij uitgaat en als hij binnenkomt.","9":"De leiders van honderd deden naar alles wat de priester Jojada geboden had, en namen ieder zijn mannen, die op de sabbat de dienst ingingen, met hen die op de sabbat de dienst uitgingen; en zij kwamen bij de priester Jojada.","10":"En de priester gaf aan de leiders van honderd de spiesen en de schilden die van koning David geweest waren, die in het huis van de HEERE geweest waren.","11":"En de lijfwacht stond, ieder met zijn wapens in zijn hand, van de rechterzijde van het huis tot de linkerzijde van het huis, naar het altaar en naar het huis toe, bij de koning rondom.","12":"Daarna bracht hij de zoon van de koning naar voren en zette hem de kroon op, en *gaf* *hem* de getuigenis; en zij maakten hem koning en zalfden hem; daarbij klapten zij in de handen en zeiden: Leve de koning!","13":"Toen Athalia de stem hoorde van de lijfwacht *en* van het volk, kwam zij bij het volk in het huis van de HEERE.","14":"En zij zag toe, en zie, de koning stond bij de pilaar, naar de gewoonte, en de leiders en de trompetten bij de koning; en al het volk van het land was blij en blies op trompetten. Toen scheurde Athalia haar kleren en riep: Verraad, verraad!","15":"Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.","16":"En zij legden de handen aan haar; en zij ging de weg van de ingang der paarden naar het huis van de koning, en zij werd daar gedood.","17":"En Jojada sloot een verbond tussen de HEERE en de koning, en het volk, dat het de HEERE tot een volk zou zijn; alsook tussen de koning en het volk.","18":"Daarna ging al het volk van het land naar het huis van Baäl en brak dat af; zijn altaren en zijn beelden verbraken zij helemaal; en Mattan, de priester van Baäl, sloegen zij dood voor de altaren. De priester stelde toen ambtsdragers aan over het huis van de HEERE.","19":"En hij nam de leiders van honderd, en de hoofdmannen, en de lijfwacht, en al het volk van het land; en zij brachten de koning af uit het huis van de HEERE, en kwamen door de weg van de poort van de lijfwacht naar het huis van de koning, en hij zat op de troon der koningen.","20":"En al het volk van het land was blij, en de stad werd stil, nadat zij Athalia met het zwaard gedood hadden *bij* het huis van de koning.","21":"Joas was zeven jaar oud, toen hij koning werd."},"SV":{"1":"Toen nu Athalia, de moeder van Ahazia, zag, dat haar zoon dood was, zo maakte zij zich op, en bracht al het koninklijke zaad om.","2":"Maar Joseba, de dochter van den koning Joram, de zuster van Ahazia, nam Joas, den zoon van Ahazia, en stal hem uit het midden van des konings zonen, die gedood werden, *zettende* hem en zijn voedster in een slaapkamer; en zij verborgen hem voor Athalia, dat hij niet gedood werd.","3":"En hij was met haar verstoken in het huis des HEEREN zes jaren; en Athalia regeerde over het land.","4":"In het zevende jaar nu zond Jojada, en nam de oversten van honderd met de hoofdmannen, en met de trawanten, en hij bracht hen tot zich, in het huis des HEEREN; en hij maakte een verbond met hen, en hij beedigde hen in het huis des HEEREN, en hij toonde hun den zoon des konings.","5":"En hij gebood hun, zeggende: Dit is de zaak, die gij doen zult: een derde deel van u, die op den sabbat ingaan, zullen de wacht waarnemen van het huis des konings;","6":"En een derde deel zal zijn aan de poort Sur; en een derde deel aan de poort achter de trawanten; zo zult gij waarnemen de wacht van dit huis, tegen inbreking.","7":"En de twee delen van ulieden, allen, die op den sabbat uitgaan, zullen de wacht van het huis des HEEREN waarnemen bij den koning.","8":"En gij zult den koning rondom omsingelen, een ieder met zijn wapenen in zijn hand, en hij, die tussen de ordeningen intreedt, zal gedood worden; en zijt gij bij den koning, als hij uitgaat, en als hij inkomt.","9":"De oversten dan van honderd deden naar al wat de priester Jojada geboden had, en namen ieder zijn mannen, die op den sabbat ingingen, met degenen, die op den sabbat uitgingen; en zij kwamen tot den priester Jojada.","10":"En de priester gaf aan de oversten van honderd de spiesen en de schilden, die van den koning David geweest waren, die in het huis des HEEREN geweest waren.","11":"En de trawanten stonden, ieder met zijn wapenen in zijn hand, van de rechterzijde van het huis, tot de linkerzijde van het huis, naar het altaar en naar het huis toe, bij den koning rondom.","12":"Daarna bracht hij des konings zoon voor, en zette hem de kroon op, en *gaf* *hem* de getuigenis; en zij maakten hem koning, en zalfden hem; daartoe klapten zij met de handen, en zeiden: De koning leve!","13":"Toen Athalia hoorde de stem der trawanten *en* des volks, zo kwam zij tot het volk in het huis des HEEREN.","14":"En zij zag toe, en ziet, de koning stond bij den pilaar, naar de wijze, en de oversten en de trompetten bij den koning; en al het volk des lands was blijde, en blies met trompetten. Toen verscheurde Athalia haar klederen, en zij riep: Verraad, verraad!","15":"Maar de priester Jojada gebood aan de oversten van honderd, die over het heir gesteld waren, en zeide tot hen: Brengt haar uit tot buiten de ordeningen, en doodt, wie haar volgt, met het zwaard; want de priester had gezegd: Laat ze in het huis des HEEREN niet gedood worden.","16":"En zij leiden de handen aan haar; en zij ging den weg van den ingang der paarden naar het huis des konings, en zij werd daar gedood.","17":"En Jojada maakte een verbond tussen den HEERE en tussen den koning, en tussen het volk, dat het den HEERE tot een volk zou zijn; mitsgaders tussen den koning en tussen het volk.","18":"Daarna ging al het volk des lands in het huis van Baäl, en braken dat af; zijn altaren en zijn beelden verbraken zij recht wel; en Mattan, den priester van Baäl, sloegen zij dood voor de altaren. De priester nu bestelde de ambten in het huis des HEEREN.","19":"En hij nam de oversten van honderd, en de hoofdmannen, en de trawanten, en al het volk des lands; en zij brachten den koning af uit het huis des HEEREN, en kwamen door den weg van de poort der trawanten tot het huis des konings, en hij zat op den troon der koningen.","20":"En al het volk des lands was blijde, en de stad werd stil, nadat zij Athalia met het zwaard gedood hadden *bij* des konings huis.","21":"Joas was zeven jaren oud, toen hij koning werd."},"KJV":{"1":"And when Athaliah the mother of Ahaziah saw that her son was dead, she arose and destroyed all the seed royal.","2":"But Jehosheba, the daughter of king Joram, sister of Ahaziah, took Joash the son of Ahaziah, and stole him from among the king's sons which were slain; and they hid him, even him and his nurse, in the bedchamber from Athaliah, so that he was not slain.","3":"And he was with her hid in the house of the LORD six years. And Athaliah did reign over the land.","4":"And the seventh year Jehoiada sent and fetched the rulers over hundreds, with the captains and the guard, and brought them to him into the house of the LORD, and made a covenant with them, and took an oath of them in the house of the LORD, and shewed them the king's son.","5":"And he commanded them, saying, This is the thing that ye shall do; A third part of you that enter in on the sabbath shall even be keepers of the watch of the king's house;","6":"And a third part shall be at the gate of Sur; and a third part at the gate behind the guard: so shall ye keep the watch of the house, that it be not broken down.","7":"And two parts of all you that go forth on the sabbath, even they shall keep the watch of the house of the LORD about the king.","8":"And ye shall compass the king round about, every man with his weapons in his hand: and he that cometh within the ranges, let him be slain: and be ye with the king as he goeth out and as he cometh in.","9":"And the captains over the hundreds did according to all things that Jehoiada the priest commanded: and they took every man his men that were to come in on the sabbath, with them that should go out on the sabbath, and came to Jehoiada the priest.","10":"And to the captains over hundreds did the priest give king David's spears and shields, that were in the temple of the LORD.","11":"And the guard stood, every man with his weapons in his hand, round about the king, from the right corner of the temple to the left corner of the temple, along by the altar and the temple.","12":"And he brought forth the king's son, and put the crown upon him, and gave him the testimony; and they made him king, and anointed him; and they clapped their hands, and said, God save the king.","13":"And when Athaliah heard the noise of the guard and of the people, she came to the people into the temple of the LORD.","14":"And when she looked, behold, the king stood by a pillar, as the manner was, and the princes and the trumpeters by the king, and all the people of the land rejoiced, and blew with trumpets: and Athaliah rent her clothes, and cried, Treason, Treason.","15":"But Jehoiada the priest commanded the captains of the hundreds, the officers of the host, and said unto them, Have her forth without the ranges: and him that followeth her kill with the sword. For the priest had said, Let her not be slain in the house of the LORD.","16":"And they laid hands on her; and she went by the way by the which the horses came into the king's house: and there was she slain.","17":"And Jehoiada made a covenant between the LORD and the king and the people, that they should be the LORD'S people; between the king also and the people.","18":"And all the people of the land went into the house of Baal, and brake it down; his altars and his images brake they in pieces thoroughly, and slew Mattan the priest of Baal before the altars. And the priest appointed officers over the house of the LORD.","19":"And he took the rulers over hundreds, and the captains, and the guard, and all the people of the land; and they brought down the king from the house of the LORD, and came by the way of the gate of the guard to the king's house. And he sat on the throne of the kings.","20":"And all the people of the land rejoiced, and the city was in quiet: and they slew Athaliah with the sword beside the king's house.","21":"Seven years old was Jehoash when he began to reign."}},"tsk":{"1":[{"kopje":"Athalia","refs":["2 Kron 22:10","2 Kron 24:7"]},{"kopje":"de moeder","refs":["2 Kon 8:26","2 Kon 9:27"]},{"kopje":"bracht om","refs":["Matt 2:13","Matt 2:16","Matt 21:38","Matt 21:39"]},{"kopje":"koninklijke nageslacht","refs":["2 Kon 25:25","Jer 41:1"]}],"2":[{"kopje":"Joseba","refs":["2 Kron 22:11"]},{"kopje":"Joram","refs":["2 Kon 8:16"]},{"kopje":"Joas","refs":["2 Kon 12:1","2 Kon 12:2"]},{"kopje":"verborg hem","refs":["2 Kon 8:19","Spr 21:30","Jes 7:6","Jes 7:7","Jes 37:35","Jes 65:8","Jes 65:9","Jer 33:17","Jer 33:21","Jer 33:26"]},{"kopje":"in een slaapkamer","refs":["1 Kon 6:5","1 Kon 6:6","1 Kon 6:8","1 Kon 6:10","Jer 35:2","Ezech 40:45"]}],"3":[{"kopje":"En Athalia","refs":["2 Kron 22:12","Ps 12:9","Mal 3:15"]}],"4":[{"kopje":"het zevende","refs":["2 Kron 23:1-15"] H2421\">save</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","13":"And when <span class=\"wl wl-kjv\" data-code=\"H6271\">Athaliah</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of the <span class=\"wl wl-kjv\" data-code=\"H7323\">guard</span> and of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> she <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">temple</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","14":"And when she <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by a <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar,</span> as the <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> was, and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> and the <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpeters</span> by the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H8056\">rejoiced,</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> with <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpets:</span> and <span class=\"wl wl-kjv\" data-code=\"H6271\">Athaliah</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> her <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">cried,</span> <span class=\"wl wl-kjv\" data-code=\"H7195\">Treason,</span> <span class=\"wl wl-kjv\" data-code=\"H7195\">Treason.</span>","15":"But <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H3967\">hundreds,</span> the <span class=\"wl wl-kjv\" data-code=\"H6485\">officers</span> of the <span class=\"wl wl-kjv\" data-code=\"H2428\">host,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Have her <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">without</span> the <span class=\"wl wl-kjv\" data-code=\"H7713\">ranges:</span> and him that <span class=\"wl wl-kjv\" data-code=\"H935\">followeth</span> her <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword.</span> For the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let her not be <span class=\"wl wl-kjv\" data-code=\"H4191\">slain</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","16":"And they <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> on her; and she <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> by the which the <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> <span class=\"wl wl-kjv\" data-code=\"H3996\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and there was she <span class=\"wl wl-kjv\" data-code=\"H4191\">slain.</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> between the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that they should be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> between the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> also and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","18":"And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> and brake it <span class=\"wl wl-kjv\" data-code=\"H5422\">down;</span> his <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> and his <span class=\"wl wl-kjv\" data-code=\"H6754\">images</span> brake they in <span class=\"wl wl-kjv\" data-code=\"H7665\">pieces</span> <span class=\"wl wl-kjv\" data-code=\"H3190\">thoroughly,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H4977\">Mattan</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altars.</span> And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">appointed</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">officers</span> over the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","19":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> over <span class=\"wl wl-kjv\" data-code=\"H3967\">hundreds,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3746\">captains,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7323\">guard,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> and they brought <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H7323\">guard</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> on the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings.</span>","20":"And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> was in <span class=\"wl wl-kjv\" data-code=\"H8252\">quiet:</span> and they <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H6271\">Athaliah</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> beside the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","21":"<span class=\"wl wl-kjv\" data-code=\"H7651\">Seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> was <span class=\"wl wl-kjv\" data-code=\"H3060\">Jehoash</span> when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Athália","tekst":"Welke was Achabs dochter, de huisvrouw van Joram en moeder van Ahazia, dien Jehu gedood had, boven, 2Ki 8:18, en 2Ki 9:27."},{"catchword":"Aházia,","tekst":"Zie boven, 2Ki 9:27."},{"catchword":"al het koninklijke zaad","tekst":"Hebreeuws, al het zaad des koninkrijks; dat is, al de prinsen van den bloede, op welke de successie der kroon mocht komen. Versta dit, van Athalia's voornemen, niet van de volle daad; want één is ontkomen; gelijk vs.2 uitwijst."}],"2":[{"catchword":"Joséba,","tekst":"Hebreeuws, Jehoschebah. Anders, Jehoschabbath, 2Ch 22:11, alwaar ook staat dat zij was de huisvrouw van den hogepriester Jojada, maar men meent dat zij uit een andere huisvrouw van Joram dan uit de afgodische Athalia geboren was."},{"catchword":"Joas,","tekst":"Hebreeuws, Joas; anders, Jehoas, onder, 2Ki 12:2."},{"catchword":"zettende","tekst":"Dit woord is hier ingevoegd uit 2Ch 22:11."},{"catchword":"een slaapkamer;","tekst":"Hebreeuws, een kamer der bedden; dat is, in een der kamers, die aan den tempel getimmerd waren, waarin de bedden der priesters waren, waarop zij sliepen, als zij op hun beurt den godsdienst moesten waarnemen. Zie Jer 35:2."},{"catchword":"zij verborgen hem","tekst":"Te weten, Jojada en Joseba."},{"catchword":"voor Athália,","tekst":"Hebreeuws, voor het aangezicht van Athalia."}],"4":[{"catchword":"Jójada,","tekst":"Hebreeuws, Jehojadah, de zoon van Ahimaäz, den zoon van Zadok, hogepriester en onderscheiden van Jojada, den vader van Benaja, die leefde ten tijde van David, 2Sa 8:18."},{"catchword":"oversten van honderd","tekst":"Dezen waren vijf in getal, en worden genoemd 2Ch 23:1. Zij schijnen priesters geweest te zijn, gelijk men mag afnemen vs.5, 7, 9."},{"catchword":"hij maakte","tekst":"Te weten, om Athalia te doden, Joas in het koninkrijk te stellen, de afgoderij te weren, en den zuiveren godsdienst weder op te richten."}],"5":[{"catchword":"u,","tekst":"Versta, priesters en Levieten; 2Ch 23:4."},{"catchword":"ingaan,","tekst":"Te weten, in den tempel. De priesters en de Levieten waren verdeeld in vier en twintig beurten, 1Ch 24, naar welke verdeling zij bij beurte alle week in den tempel kwamen, om den godsdienst naar de gestelde orde te verzorgen; hetwelk wordt genoemd ingaan, te weten, in den tempel, om de wacht waar te nemen. Anders, die in de week ingaan."},{"catchword":"huis des konings;","tekst":"Dat is, aan de kamer in den tempel, waar de jonge koning werd verborgen gehouden."}],"6":[{"catchword":"Sur;","tekst":"Dit was de poort tegen het oosten, en was de grootste poort des tempels, daarom wordt zij ook genoemd de hoge-poort , onder, 2Ki 15:35; ook de fondament-poort , 2Ch 23:5; idem de nieuwe poort, Jer 26:10, omdat zij van den koning Jotham is vernieuwd, 2Ch 27:3."},{"catchword":"achter de trawanten;","tekst":"Deze poort was aan het zuiden, naar den voorhof der priesters, die anders [gelijk enigen menen] genaamd werd Sippim, dat is, de dorpelpoort; 2Ch 23:4."},{"catchword":"tegen inbreking","tekst":"Of, tegen afrukking, of wegneming; dat is, gij zult den tempel alzo bewaren, dat daaraan niet gebroken worde, en dat de koning met geweld daar niet uit genomen noch weggevoerd worde."}],"7":[{"catchword":"delen","tekst":"Hebreeuws, handen."},{"catchword":"uitgaan,","tekst":"Versta, degenen, die uit den tempel naar huis zouden keren, hebbende voor die week hun dienst op hun beurt volbracht. Want op elken sabbat moesten nieuwe in hun plaats treden."}],"8":[{"catchword":"tussen","tekst":"Of, tussen de gelederen, die in orde gesteld zijn; dat is, in uw wacht, als gij zult optrekken, of rondom den koning zijn, om hem te bewaren."}],"10":[{"catchword":"die van den koning","tekst":"Dat is, die David van zijn vijanden had genomen, en mogelijk den Heere in den tabernakel tot een gedachtenis geheiligd had; gelijk het zwaard van Goliath, 1Sa 21:9, en de schilden der Syriërs, 2Sa 8:7, die daarna schijnen van Salomo in den tempel gebracht te zijn, 1Ki 7:51."}],"11":[{"catchword":"rechterzijde","tekst":"Dat is, de zuidzijde."},{"catchword":"linkerzijde","tekst":"Dat is, de noordzijde."},{"catchword":"het altaar","tekst":"Te weten, der brandoffers; welke was bij de oostpoort des tempels."},{"catchword":"het huis toe,","tekst":"Dat is, den tempel, die van het altaar westwaarts stond."}],"12":[{"catchword":"hij des konings zoon","tekst":"Namelijk, Jojada."},{"catchword":"getuigenis;","tekst":"Hetwelk hij hem in de hand gaf, en was het wetboek, waarin God getuigt hoe hij zich in zijne regering moest gedragen. Zie Deu 17:18."},{"catchword":"zalfden hem;","tekst":"Die hun vader naar de gewoonlijke orde in het rijk opvolgden, werden naar sommiger mening, niet gezalfd, maar alleen, die na enige verandering in het regiment of buiten de ordinaire wet, of uit vrees van toekomende zwarigheid, koning werden, gelijk Saul, 1Sa 10:1; David, 1Sa 16:13; Salomo, 1Ki 1:34; Jehu, 2Ki 9:6; Joahaz, 2Ki 23:30; en hier Joas, die zijn vader opgevolgd is, nadat Athalia het rijk geweldiglijk en tirannelijk aan zich getrokken had."},{"catchword":"klapten","tekst":"Tot een teken en bewijs der vreugde. Alzo wordt de klapping der handen genomen, Psa 98:8; Eze 25:6; elders voor een teken der droefheid, Eze 6:11."}],"14":[{"catchword":"pilaar,","tekst":"Of, gestoelte; dat is, op het koninklijk gestoelte, dat Salomo van koper gemaakt had, en stond in het voorhof des volks aan een pilaar. Zie onder, 2Ki 23:3, en 2Ch 6:13."},{"catchword":"naar de wijze,","tekst":"Dat is, naar de manier van doen; of, gelijk de koning gewoon was, aan die kolom te staan als hij in den tempel kwam om God te dienen, of het volk aan te spreken. Vergelijk onder, 2Ki 23:3."},{"catchword":"verscheurde","tekst":"Een teken van spijt, droefheid en grote beroering des geestes. Zie Gen 37:29."}],"15":[{"catchword":"de ordeningen,","tekst":"Zie boven, vs.8."}],"16":[{"catchword":"zij legden","tekst":"Anders, zij bestelden aan haar zijdwacht, of, zij gaven, of, maakten haar plaats; te weten, om uit den tempel te gaan. Hebreeuws, zij zetten haar handen, of zijden, of ruimten, of plaatsen."},{"catchword":"den weg","tekst":"Dat is, den weg van de stadspoort Davids, die zo genoemd was en noordwaarts stond; vanwaar men ging naar de poort van Efraïm. Zie onder, 2Ki 14:13. Sommigen menen dat deze weg den naam heeft van den ingang der paarden, omdat men door denzelven bekwamelijk tot des konings huis te paard kon rijden."}],"17":[{"catchword":"een verbond","tekst":"Te weten, eerst een kerkelijk verbond tussen God en den koning met het volk, aangaande de oprichting en handhaving van den zuiveren en waren godsdienst; daarna ook een politiek verbond, aangaande het ambt des konings tegen zijn volk, in zijn regering, en den schuldigen plicht des volks tegen den koning, in politieke gehoorzaamheid."},{"catchword":"den HEERE tot een volk","tekst":"Dat is, dat het den Heere alleen voor den waren God kennen en naar zijn woord dienen zou, verwerpende alle afgoderij en valsen godsdienst, welke verklaring bevestigd wordt met hun volgende daad, vs.18."}],"18":[{"catchword":"bestelde","tekst":"Of, herstelde; overmits de zuiverheid van den godsdienst door de verkeerdheid des tijds zeer vervallen was. Zie breder en meer bijzonder hiervan 2Ch 23:18-19."}],"19":[{"catchword":"poort der trawanten","tekst":"Genaamd anders de hoge poort, 2Ch 23:20. Zie aldaar de aantekening."},{"catchword":"hij zat","tekst":"Zie 1Ki 1:46."}],"20":[{"catchword":"bij","tekst":"Anders, in."}],"21":[{"catchword":"zeven jaren","tekst":"Men kan hieruit afnemen dat Joas maar een jaar oud was, als Athalia hem zocht te doden en hij in den tempel met zijn voedstervrouw verborgen werd, want is hij daar zes jaren bewaard geweest, boven, vs.3."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now when Athalia [Which was Achabs daughter, the wife of Joram, and mother of Ahazia, (as the following words declare) whom Jehu had slain, above chap.8.18. and 9.27.] the mother of Ahazia [see above chap.9 27.] saw, that her son was dead; then she gat her up, and destroyed all the royal seed. [Heb. all the seed of the Kingdom: that is, all the Princes of the blood, unto whom the succession of the Crown might come. Understand this of Athalia&acirc;&euro;&trade;s intent and purpose, not of the full and perfect act: for one escaped, as the following verse sheweth.]"}],"2":[{"catchword":null,"tekst":"But Joseba [Heb. Jehoschebah. Oth. Jehoschabbath, 2 Chron.22.11. where its also mentioned that she was the wife of Jojada the High Priest: but its conceived that she was born of another wife of Joram, then of the Idolatrous Athalia] the daughter of King Joram, the sister of Ahazia, took Joas [Hebr. Joas ch. Oth. Jehim out of the midst of the Kings sons, that were slain, (putting) [this word is here inserted out of 2 Chron.22.11.] him, and his nurse in a bed-chamber: [Heb. a chamber of beds: that is, in one ofthe chambers, that were built near the Temple, wherein were beds of the priests, on which they lay, when in their turns they were to wait upon the service of God. See Jer 35:2.] and they [to wit, Jojada, and Joseba] hid him from Athalia [Heb. before the face of Athalia] (so) that he was not slain."}],"3":[{"catchword":null,"tekst":"And he was with her hid in the house of the LORD six years: and Athalia reigned over the land."}],"4":[{"catchword":null,"tekst":"Now in the seventh year Jojada [Heb. Jehojadah, the son of Azarias, the son of Achimaaz, the son of Zadok the High Priest, and distinguished from Jojada the Father of Benaja, who lived in Davids time, 2 Sam.8.18.] sent, and took the Rulers of hundreds, [these were five in number, and are named 2 Chron.23.1. They seem to have been Priests, as may be gathered from ver.5,7,9.] with the Captains, and with the Guard, and he brought them to him, into the house of the LORD, and be made a Covenant with them, [to wit, to slay Athalia, to place Joas in the Kingdom, to root out Idolatry, and to restore the pure worship of God] and took an oath of them in the house of the LORD, and he shewed them the Kings son."}],"5":[{"catchword":null,"tekst":"And he commanded them, saying; This is the thing, which ye shall do: a third part of you [Meaning Priests, and Levites, 2 Chron.23.4.] that enter in [to wit, into the Temple. The Priests and the Levites were divided into 24. Orders, 1 Chron.24. according to which division they entered every week by turns into the Temple, to heed the worship of God, according to the appointed order, which is called entring in, to wit, into the Temple, to keep the Watch] on the Sabbath, [oth. in the week] shall keep the watch of the Kings house. [i.e. at the Chamber in the Temple, where the young King was hid.]"}],"6":[{"catchword":null,"tekst":"And a third part shall be at the gate of Sur; [This was the gate towards the East, and was the greatest gate of the Temple, therefore it is also called the high gate, below chap.15.35. also the Foundation gate, 2 Chron.23.5. also the new gate, Jer 26:10. because it was renewed by King Jotham, 2 Chron.27.3.] and a third part at the gate behind the guard: [this gate was in the South, toward the Court of the Priests; which (as some conceive) was otherwise called Sippim, that is, the threshold-gate, 2 Chron.23.4.] so ye shall keep the watch of this house, against breaking in. [or, against pulling, or, taking away; that is, ye shall so keep the Temple, that nothing of it be broken, and that the King be not taken from thence by force, and carried away.]"}],"7":[{"catchword":null,"tekst":"And the two parts [Heb. hands] of you, all that go forth on the Sabbath, [understand those that went forth out of the Temple homeward, having for that week performed their office in their turn: for on every Sabbath new ones were to succeed in their room] they shall keep the watch of the house of the LORD near the King."}],"8":[{"catchword":null,"tekst":"And ye shall compass the King round about, every man with his weapons in his hand, and he that entereth in between the ranks, [Or between the files, that are placed in rank and order: that is, cometh into your guard, when ye shall advance, or be about the King to safeguard him] shall be slain: and be ye with the King, when he goeth out; and when he cometh in."}],"9":[{"catchword":null,"tekst":"The Rulers of hundreds then did according to all that Jojada the Priest had commanded, and took every man his men, that came in on the Sabbath, with those that went out on the Sabbath: and they came to Jojada the Priest."}],"10":[{"catchword":null,"tekst":"And the Priest gave to the commanders of hundreds the spears and the shields, which had been King Davids: [i.e. which David had taken from his Enemies, and perhaps had dedicated them to the Lord in the Tabernacle for a memorial; as he had done the sword of Goliath, 1 Sam.21.2. and the shields of the Syrians, 2 Sam.8.7. which afterward seem to have been brought into the Temple by Salomon, 1 Kings 7.51.] which were in the house of the LORD."}],"11":[{"catchword":null,"tekst":"And the guard stood, every man with his weapons in his hand, from the right side [i.e. the south-side] of the house, to the left side [i.e. the north-side] of the house, toward the altar, [to wit, of burnt-offerings; which was by the East-gate of the Temple] and toward the house, [i.e. the Temple, which stood west-ward from the altar] round about the King."}],"12":[{"catchword":null,"tekst":"Then he [Namely, Jojada] brought forth the Kings son, and put the crown upon him; and (gave him) the testimony, [which he gave him in his hand, and it was the book of the law, wherein God testifieth how he ought to demean himself in his government. See Deut.17.18.] and they made him King, and anointed him: [those that succeeded their Fathe // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
