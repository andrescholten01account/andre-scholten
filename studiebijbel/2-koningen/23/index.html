n/1/"}, {"naam": "Hebreeën", "href": "../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Toen zond de koning boden, en tot hem verzamelden zich alle oudsten van Juda en Jeruzalem.", "2": "En de koning ging op naar het huis van de HEERE, en met hem alle mannen van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van de kleinste tot de grootste; en hij las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was.", "3": "De koning nu stond bij de pilaar, en sloot een verbond voor het aangezicht van de HEERE, om de HEERE na te wandelen, en Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen met heel zijn hart en met heel zijn ziel te houden, om de woorden van dit verbond te bevestigen, die in dit boek geschreven zijn. En heel het volk stond in dit verbond.", "4": "En de koning gebood de hogepriester Hilkia, en de priesters van de tweede rang, en de bewakers van de drempel, dat zij uit de tempel van de HEERE al het gereedschap, dat voor Baäl, en voor het beeld van het bos en voor heel het leger van de hemel gemaakt was, naar buiten zouden brengen; en hij verbrandde dat buiten Jeruzalem in de velden van Kidron, en liet het stof daarvan naar Beth-el brengen.", "5": "Daartoe schafte hij de afgodspriesters af, die de koningen van Juda aangesteld hadden, opdat men zou roken op de hoogten, in de steden van Juda, en rondom Jeruzalem, alsook hen die voor Baäl, de zon, en de maan, en de andere planeten, en heel het leger van de hemel rookten.", "6": "Hij bracht ook het beeld van het bos weg uit het huis van de HEERE, buiten Jeruzalem, naar de beek Kidron, en verbrandde het bij de beek Kidron, en vergruisde het tot stof; en hij wierp het stof daarvan op de graven van de kinderen van het volk.", "7": "Daartoe brak hij de huizen van de schandjongens af, die bij het huis van de HEERE waren, waar de vrouwen huisjes voor het beeld van het bos weefden.", "8": "En hij bracht al de priesters uit de steden van Juda, en verontreinigde de hoogten, waar die priesters gerookt hadden, van Geba af tot Berseba toe; en hij brak de hoogten van de poorten af, ook die welke bij de deur van de poort van Jozua, de leider van de stad, was, welke aan iemands linkerhand lag, als men de stadspoort binnenging.", "9": "Doch de priesters van de hoogten offerden niet op het altaar van de HEERE te Jeruzalem; maar zij aten ongezuurde broden te midden van hun broeders.", "10": "Hij verontreinigde ook Thofeth, dat in het dal van de kinderen van Hinnom is, opdat niemand zijn zoon of zijn dochter voor de Molech door het vuur zou laten gaan.", "11": "En hij schafte de paarden af, die de koningen van Juda voor de zon gesteld hadden, bij de ingang van het huis van de HEERE, tot de kamer van Nathan-melech, de hoveling, die in Parvarim was; en de wagens van de zon verbrandde hij met vuur.", "12": "Verder brak de koning de altaren af die op het dak van de opperzaal van Achaz waren, die de koningen van Juda gemaakt hadden, alsook de altaren die Manasse in de twee voorhoven van het huis van de HEERE gemaakt had; en hij verbrijzelde ze vandaar, en wierp het stof daarvan in de beek Kidron.", "13": "De hoogten ook, die vooraan bij Jeruzalem waren, die aan de rechterhand van de berg Mashith lagen, die Salomo, de koning van Israël, gebouwd had voor Astoreth, het verfoeisel van de Sidoniërs, en voor Kamos, het verfoeisel van de Moabieten, en voor Milchom, de gruwel van de kinderen van Ammon, verontreinigde de koning.", "14": "Insgelijks brak hij de opgerichte beelden, en roeide de bossen uit; en hij vulde hun plaats met mensenbeenderen.", "15": "Daartoe ook het altaar dat te Beth-el was, en de hoogte, die Jerobeam, de zoon van Nebat, die Israël liet zondigen, gemaakt had; zowel dat altaar als die hoogte brak hij af; ja, hij verbrandde de hoogte, hij vergruisde ze tot stof, en hij verbrandde het bos.", "16": "En toen Josia zich omkeerde, zag hij de graven die daar op de berg waren, en hij zond boden, en nam de beenderen uit de graven, en verbrandde ze op dat altaar, en verontreinigde dat; naar het woord van de HEERE, dat de man van God had uitgeroepen, die deze woorden uitriep.", "17": "Verder zei hij: Wat is dat voor een grafteken, dat ik zie? En de mannen van de stad zeiden tegen hem: Het is het graf van de man van God, die uit Juda kwam, en deze dingen, die u tegen dit altaar van Beth-el gedaan hebt, uitgeroepen heeft.", "18": "En hij zei: Laat hem liggen, dat niemand zijn beenderen verroert. Zo lieten zij zijn beenderen met rust, met de beenderen van de profeet die uit Samaria gekomen was.", "19": "Daartoe nam Josia ook al de huizen van de hoogten weg, die in de steden van Samaria waren, die de koningen van Israël gemaakt hadden om de Heere tot toorn te verwekken; en hij deed daarmee naar alle daden die hij te Beth-el gedaan had.", "20": "En hij slachtte al de priesters van de hoogten die daar waren, op de altaren, en verbrandde mensenbeenderen op die altaren. Daarna keerde hij terug naar Jeruzalem.", "21": "En de koning gebood heel het volk en zei: Houd voor de HEERE, uw God, pascha, zoals in dit boek van het verbond geschreven is.", "22": "Want zoals dit pascha was er geen gehouden, vanaf de dagen van de richters die Israël gericht hadden, noch in al de dagen van de koningen van Israël, noch van de koningen van Juda.", "23": "Maar in het achttiende jaar van koning Josia, werd dit pascha voor de HEERE te Jeruzalem gehouden.", "24": "En ook deed Josia de waarzeggers weg, en de duivelskunstenaars, en de terafim, en de drekgoden, en alle verfoeiselen die in het land van Juda en in Jeruzalem gezien werden; opdat hij de woorden van de wet zou bevestigen, die geschreven waren in het boek dat de priester Hilkia in het huis van de HEERE gevonden had.", "25": "En voor hem was er geen koning zijns gelijke, die zich tot de HEERE, met heel zijn hart, en met heel zijn ziel, en met heel zijn kracht, naar heel de wet van Mozes, bekeerd had; en na hem stond zijns gelijke niet op.", "26": "Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.", "27": "En de HEERE zei: Ik zal Juda ook van Mijn aangezicht wegdoen, zoals Ik Israël weggedaan heb; en Ik zal deze stad Jeruzalem verwerpen, die Ik verkoren heb, en het huis waarvan Ik gezegd heb: Mijn Naam zal daar zijn.", "28": "Het overige nu van de geschiedenis van Josia, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "29": "In zijn dagen trok Farao Necho, de koning van Egypte, op tegen de koning van Assyrië, naar de rivier de Frath; en koning Josia trok hem tegemoet, en Necho doodde hem te Megiddo, toen hij hem gezien had.", "30": "En zijn knechten voerden hem dood op een wagen van Megiddo, en brachten hem naar Jeruzalem, en begroeven hem in zijn graf; en het volk van het land nam Joahaz, de zoon van Josia, en zalfde hem, en maakte hem koning in de plaats van zijn vader.", "31": "Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem; en de naam van zijn moeder was Hamutal, de dochter van Jeremia, van Libna.", "32": "En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vaderen gedaan hadden.", "33": "Doch Farao Necho liet hem gevangenzetten te Ribla in het land van Hamath, opdat hij te Jeruzalem niet regeren zou; en hij legde het land een boete op van honderd talenten van het zilver en een talent van het goud.", "34": "Ook maakte Farao Necho Eljakim, de zoon van Josia, koning, in de plaats van zijn vader Josia, en veranderde zijn naam in Jojakim; maar Joahaz nam hij mee, en hij kwam in Egypte, en stierf daar.", "35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "36": "Vijfentwintig jaar was Jojakim oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem; en de naam van zijn moeder was Zebudda, een dochter van Pedaja, van Ruma.", "37": "En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vaders gedaan hadden."}, "SV": {"1": "Toen zond de koning henen, en tot hem verzamelden al die oudsten van Juda en Jeruzalem.", "2": "En de koning ging op in het huis des HEEREN, en met hem alle man van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van den minste tot den meeste; en hij las voor hun oren al de woorden van het boek des verbonds, dat in het huis des HEEREN gevonden was.", "3": "De koning nu stond aan den pilaar, en maakte een verbond voor des HEEREN aangezicht, om den HEERE na te wandelen, en Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen met ganser harte en met ganser ziele te houden, bevestigende de woorden dezes verbonds, die in dit boek geschreven zijn. En het ganse volk stond in dit verbond.", "4": "En de koning gebood den hogepriester Hilkia, en den priesteren der tweede ordening, en den dorpelbewaarders, dat zij uit den tempel des HEEREN alle gereedschap, dat voor Baäl, en voor het *beeld* *van* *het* bos, en voor al het heir des hemels gemaakt was, uitbrengen zouden; en hij verbrandde dat buiten Jeruzalem in de velden van Kidron, en liet het stof daarvan naar Beth-el dragen.", "5": "Daartoe schafte hij de Chemarim af, die de koningen van Juda gesteld hadden, opdat men roken zou op de hoogten, in de steden van Juda, en rondom Jeruzalem, mitsgaders, die voor Baäl, de zon, en de maan, en de *andere* planeten, en al het heir des hemels rookten.", "6": "Hij bracht ook het *beeld* *van* *het* bos uit het huis des HEEREN weg, buiten Jeruzalem, tot de beek Kidron, en verbrandde het aan de beek Kidron, en vergruisde het tot stof; en hij wierp het stof daarvan op de graven der kinderen des volks.", "7": "Daartoe brak hij de huizen der schandjongens af, die aan het huis des HEEREN waren, alwaar de vrouwen huisjes voor het *beeld* *van* *het* bos weefden.", "8": "En hij bracht al de priesters uit de steden van Juda, en verontreinigde de hoogten, alwaar die priesters gerookt hadden, van Geba af tot Ber-seba toe; en hij brak de hoogten der poorten af, *ook* die aan de deur der poort van Jozua, den overste der stad, was, welke aan iemands linkerhand was, in de stadspoort *gaande*.", "9": "Doch de priesters der hoogten offerden niet op het altaar des HEEREN te Jeruzalem; maar zij aten ongezuurde *broden* in het midden van hun broederen.", "10": "Hij verontreinigde ook Thofeth, dat in het dal der kinderen van Hinnom is, opdat niemand zijn zoon of zijn dochter voor den Molech door het vuur deed gaan.", "11": "En hij schafte de paarden af, die de koningen van Juda voor de zon gesteld hadden, van den ingang van het huis des HEEREN, tot de kamer van Nathan-melech, den hoveling, die in Parvarim was; en de wagenen der zon verbrandde hij met vuur.", "12": "Verder de altaren die op het dak der opperzaal van Achaz waren, die de koningen van Juda gemaakt hadden, mitsgaders de altaren, die Manasse in de twee voorhoven van het huis des HEEREN gemaakt had, brak de koning af; en hij verbrijzelde ze van daar, en wierp het stof daarvan in de beek Kidron.", "13": "De hoogten ook, die vooraan Jeruzalem waren, dewelke waren ter rechterhand van den berg Mashith, die Salomo, de koning van Israël, voor Astoreth, het verfoeisel der Sidoniërs, en voor Kamos, het verfoeisel der Moabieten, en voor Milchom, den gruwel der kinderen Ammons, gebouwd had, verontreinigde de koning.", "14": "Insgelijks brak hij de opgerichte beelden, en roeide de bossen uit; en hij vervulde hun plaats met mensenbeenderen.", "15": "Daartoe ook het altaar, dat te Beth-el was, *en* de hoogte, die Jerobeam, de zoon van Nebat, dewelke Israël zondigen deed, gemaakt had; te zamen dat altaar en die hoogte brak hij af; ja, hij verbrandde de hoogte, hij vergruisde ze tot stof, en hij verbrandde het bos.", "16": "En als Josia zich omkeerde, zag hij de graven, die daar op den berg waren, en zond henen, en nam de beenderen uit de graven, en verbrandde ze op dat altaar, en verontreinigde dat; naar het woord des HEEREN, dat de man Gods uitgeroepen had, die deze woorden uitriep.", "17": "Verder zeide hij: Wat is dat voor een grafteken, dat ik zie? En de lieden der stad zeiden tot hem: Het is het graf van den man Gods, die uit Juda kwam, en deze dingen, die gij tegen dit altaar van Beth-el gedaan hebt, uitgeroepen heeft.", "18": "En hij zeide: Laat hem liggen, dat niemand zijn beenderen verroere. Zo bevrijdden zij zijn beenderen, met de beenderen van den profeet, die uit Samaria gekomen was.", "19": "Daartoe nam Josia ook weg al de huizen der hoogten, die in de steden van Samaria waren, die de koningen van Israël gemaakt hadden, om *den* Heere tot toorn te verwekken; en hij deed dezelve naar al de daden, die hij te Beth-el gedaan had.", "20": "En hij slachtte al de priesteren der hoogten, die daar waren, op de altaren, en verbrandde mensenbeenderen op dezelve. Daarna keerde hij weder naar Jeruzalem.", "21": "En de koning gebood het ganse volk, zeggende: Houdt den HEERE, uw God, pascha, gelijk in dit boek des verbonds geschreven is.", "22": "Want gelijk dit pascha was er geen gehouden, van de dagen der richteren af, die Israël gericht hadden, noch in al de dagen der koningen van Israël, noch der koningen van Juda.", "23": "Maar in het achttiende jaar van den koning Josia, werd dit pascha den HEERE te Jeruzalem gehouden.", "24": "En ook deed Josia weg de waarzeggers, en de duivelskunstenaars, en de terafim, en de drekgoden, en alle verfoeiselen, die in het land van Juda en in Jeruzalem gezien werden; opdat hij bevestigde de woorden der wet, die geschreven waren in het boek, dat de priester Hilkia in het huis des HEEREN gevonden had.", "25": "En voor hem was geen koning zijns gelijke, die zich tot den HEERE, met zijn ganse hart, en met zijn ganse ziel, en met zijn ganse kracht, naar al de wet van Mozes, bekeerd had; en na hem stond zijns gelijke niet op.", "26": "Nochtans keerde zich de HEERE van den brand Zijns groten toorns niet af, waarmede Zijn toorn brandde tegen Juda, om al de tergingen, waarmede Manasse Hem getergd had.", "27": "En de HEERE zeide: Ik zal Juda ook van Mijn aangezicht wegdoen, gelijk als Ik Israël weggedaan heb; en Ik zal deze stad Jeruzalem verwerpen, die Ik verkoren heb, en het huis, waarvan Ik gezegd heb: Mijn Naam zal daar wezen.", "28": "Het overige nu der geschiedenissen van Josia, en al wat hij gedaan heeft, zijn die niet geschreven in het boek der kronieken der koningen van Juda?", "29": "In zijn dagen toog Farao Necho, de koning van Egypte, op tegen den koning van Assyrië, naar de rivier Frath; en de koning Josia toog hem tegemoet, en hij doodde hem te Megiddo, als hij hem gezien had.", "30": "En zijn knechten voerden hem dood op een wagen van Megiddo, en brachten hem te Jeruzalem, en begroeven hem in zijn graf; en het volk des lands nam Joahaz, den zoon van Josia, en zalfden hem, en maakten hem koning in zijns vaders plaats.", "31": "Drie en twintig jaren was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem; en de naam zijner moeder was Hamutal, de dochter van Jeremia, van Libna.", "32": "En hij deed dat kwaad was in de ogen des HEEREN, naar alles, wat zijn vaderen gedaan hadden.", "33": "Doch Farao Necho liet hem binden te Ribla in het land van Hamath, opdat hij te Jeruzalem niet regeren zou; en hij leide het land een boete op van honderd talenten zilvers en een talent gouds.", "34": "Ook maakte Farao Necho Eljakim, den zoon van Josia, koning, in de plaats van zijn vader Josia, en veranderde zijn naam in Jojakim; maar Joahaz nam hij mede, en hij kwam in Egypte, en stierf aldaar.", "35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij schatte het land, om dat geld naar het bevel van Farao te geven; een ieder naar zijn schatting eiste hij het zilver en goud af van het volk des lands, om aan Farao Necho te geven.", "36": "Vijf en twintig jaren was Jojakim oud, toen hij koning werd, en regeerde elf jaren te Jeruzalem; en de naam zijner moeder was Zebudda, een dochter van Pedaja, van Ruma.", "37": "En hij deed dat kwaad was in de ogen des HEEREN, naar alles, wat zijn vaders gedaan hadden."}, "KJV": {"1": "And the king sent, and they gathered unto him all the elders of Judah and of Jerusalem.", "2": "And the king went up into the house of the LORD, and all the men of Judah and all the inhabitants of Jerusalem with him, and the priests, and the prophets, and all the people, both small and great: and he read in their ears all the words of the book of the covenant which was found in the house of the LORD.", "3": "And the king stood by a pillar, and made a covenant before the LORD, to walk after the LORD, and to keep his commandments and his testimonies and his statutes with all their heart and all their soul, to perform the words of this covenant that were written in this book. And all the people stood to the covenant.", "4": "And the king commanded Hilkiah the high priest, and the priests of the second order, and the keepers of the door, to bring forth out of the temple of the LORD all the vessels that were made for Baal, and for the grove, and for all the host of heaven: and he burned them without Jerusalem in the fields of Kidron, and carried the ashes of them unto Bethel.", "5": "And he put down the idolatrous priests, whom the kings of Judah had ordained to burn incense in the high places in the cities of Judah, and in the places round about Jerusalem; them also that burned incense unto Baal, to the sun, and to the moon, and to the planets, and to all the host of heaven.", "6": "And he brought out the grove from the house of the LORD, without Jerusalem, unto the brook Kidron, and burned it at the brook Kidron, and stamped it small to powder, and cast the powder thereof upon the graves of the children of the people.", "7": "And he brake down the houses of the sodomites, that were by the house of the LORD, where the women wove hangings for the grove.", "8": "And he brought all the priests out of the cities of Judah, and defiled the high places where the priests had burned incense, from Geba to Beersheba, and brake down the high places of the gates that were in the entering in of the gate of Joshua the governor of the city, which were on a man's left hand at the gate of the city.", "9": "Nevertheless the priests of the high places came not up to the altar of the LORD in Jerusalem, but they did eat of the unleavened bread among their brethren.", "10": "And he defiled Topheth, which is in the valley of the children of Hinnom, that no man might make his son or his daughter to pass through the fire to Molech.", "11": "And he took away the horses that the kings of Judah had given to the sun, at the entering in of the house of the LORD, by the chamber of Nathanmelech the chamberlain, which was in the suburbs, and burned the chariots of the sun with fire.", "12": "And the altars that were on the top of the upper chamber of Ahaz, which the kings of Judah had made, and the altars which Manasseh had made in the two courts of the house of the LORD, did the king beat down, and brake them down from thence, and cast the dust of them into the brook Kidron.", "13": "And the high places that were before Jerusalem, which were on the right hand of the mount of corruption, which Solomon the king of Israel had builded for Ashtoreth the abomination of the Zidonians, and for Chemosh the abomination of the Moabites, and for Milcom the abomination of the children of Ammon, did the king defile.", "14": "And he brake in pieces the images, and cut down the groves, and filled their places with the bones of men.", "15": "Moreover the altar that was at Bethel, and the high place which Jeroboam the son of Nebat, who made Israel to sin, had made, both that altar and the high place he brake down, and burned the high place, and stamped it small to powder, and burned the grove.", "16": "And as Josiah turned himself, he spied the sepulchres that were there in the mount, and sent, and took the bones out of the sepulchres, and burned them upon the altar, and polluted it, according to the word of the LORD which the man of God proclaimed, who proclaimed these words.", "17": "Then he said, What title is that that I see? And the men of the city told him, It is the sepulchre of the man of God, which came from Judah, and proclaimed these things that thou hast done against the altar of Bethel.", "18": "And he said, Let him alone; let no man move his bones. So they let his bones alone, with the bones of the prophet that came out of Samaria.", "19": "And all the houses also of the high places that were in the cities of Samaria, which the kings of Israel had made to provoke the LORD to anger, Josiah took away, and did to them according to all the acts that he had done in Bethel.", "20": "And he slew all the priests of the high places that were there upon the altars, and burned men's bones upon them, and returned to Jerusalem.", "21": "And the king commanded all the people, saying, Keep the passover unto the LORD your God, as it is written in the book of this covenant.", "22": "Surely there was not holden such a passover from the days of the judges that judged Israel, nor in all the days of the kings of Israel, nor of the kings of Judah;", "23": "But in the eighteenth year of king Josiah, wherein this passover was holden to the LORD in Jerusalem.", "24": "Moreover the workers with familiar spirits, and the wizards, and the images, and the idols, and all the abominations that were spied in the land of Judah and in Jerusalem, did Josiah put away, that he might perform the words of the law which were written in the book that Hilkiah the priest found in the house of the LORD.", "25": "And like unto him was there no king before him, that turned to the LORD with all his heart, and with all his soul, and with all his might, according to all the law of Moses; neither after him arose there any like him.", "26": "Notwithstanding the LORD turned not from the fierceness of his great wrath, wherewith his anger was kindled against Judah, because of all the provocations that Manasseh had provoked him withal.", "27": "And the LORD said, I will remove Judah also out of my sight, as I have removed Israel, and will cast off this city Jerusalem which I have chosen, and the house of which I said, My name shall be there.", "28": "Now the rest of the acts of Josiah, and all that he did, are they not written in the book of the chronicles of the kings of Judah?", "29": "In his days Pharaohnechoh king of Egypt went up against the king of Assyria to the river Euphrates: and king Josiah went against him; and he slew him at Megiddo, when he had seen him.", "30": "And his servants carried him in a chariot dead from Megiddo, and brought him to Jerusalem, and buried him in his own sepulchre. And the people of the land took Jehoahaz the son of Josiah, and anointed him, and made him king in his father's stead.", "31": "Jehoahaz was twenty and three years old when he began to reign; and he reigned three months in Jerusalem. And his mother's name was Hamutal, the daughter of Jeremiah of Libnah.", "32": "And he did that which was evil in the sight of the LORD, according to all that his fathers had done.", "33": "And Pharaohnechoh put him in bands at Riblah in the land of Hamath, that he might not reign in Jerusalem; and put the land to a tribute of an hundred talents of silver, and a talent of gold.", "34": "And Pharaohnechoh made Eliakim the son of Josiah king in the room of Josiah his father, and turned his name to Jehoiakim, and took ➔ Jehoahaz away: and he came to Egypt, and died there.", "35": "And Jehoiakim gave the silver and the gold to Pharaoh; but he taxed the land to give the money according to the commandment of Pharaoh: he exacted the silver and the gold of the people of the land, of every one according to his taxation, to give it unto Pharaohnechoh.", "36": "Jehoiakim was twenty and five years old when he began to reign; and he reigned eleven years in Jerusalem. And his mother's name was Zebudah, the daughter of Peda 7", "href": "../../2-koningen/23/#v37", "ref": "2 Kon 23:37", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ezra 7:27": "Geloofd zij de HEERE, de God van onze vaderen, Die zoiets in het hart van de koning gegeven heeft, om het huis van de HEERE te versieren, dat te Jeruzalem is.", "Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "Jer 4:4": "Besnijd u voor de HEERE en doe de voorhuiden van uw hart weg, mannen van Juda en inwoners van Jeruzalem! Anders zal Mijn grimmigheid uitvaren als een vuur, en branden zodat niemand het kan blussen, vanwege de slechtheid van uw daden.", "2 Kron 36:1-3": "Toen nam het volk van het land Joahaz, de zoon van Josia, en zij maakten hem koning in de plaats van zijn vader, te Jeruzalem. Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem. Want de koning van Egypte zette hem af te Jeruzalem, en hij legde het land een boete op van honderd talenten zilver en een talent goud.", "Jer 50:5": "Zij zullen naar Sion vragen; op de weg hierheen zullen hun gezichten gericht zijn; zij zullen komen en zich bij de HEERE aansluiten, met een eeuwig verbond, dat niet zal worden vergeten.", "2 Kon 20:20": "Het overige nu van de geschiedenis van Hizkia, en al zijn macht, en hoe hij de vijver en de watergang gemaakt heeft, en water in de stad gebracht heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "2 Kon 25:6": "Zij dan grepen de koning, en voerden hem op naar de koning van Babel, naar Ribla; en zij spraken een oordeel tegen hem.", "Matt 21:33": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland.", "Jer 39:5": "Maar het leger van de Chaldeeën jaagde hen achterna; en zij achterhaalden Zedekia in de vlakke velden van Jericho, en vingen hem, en brachten hem naar boven tot Nebukadrezar, de koning van Babel, naar Ribla, in het land van Hamath; die sprak oordelen tegen hem uit.", "1 Sam 28:18": "Zoals u naar de stem van de HEERE niet geluisterd hebt, en de gloed van Zijn toorn niet uitgevoerd hebt tegen Amalek; daarom heeft de HEERE u deze zaak aangedaan op deze dag.", "Jer 51:45": "Ga uit, Mijn volk, uit haar midden, en red ieder zijn ziel, vanwege de gloed van de toorn van de HEERE.", "Gen 19:5": "En zij riepen Lot toe, en zeiden tegen hem: Waar zijn die mannen die deze nacht bij u gekomen zijn? Breng hen naar buiten, naar ons toe, opdat wij met hen gemeenschap hebben.", "Neh 13:1": "Op die dag werd er gelezen in het boek van Mozes, voor de oren van het volk; en daarin werd geschreven gevonden, dat de Ammonieten en Moabieten niet zouden komen in de gemeente van God, tot in eeuwigheid;", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "1 Sam 2:36": "En het zal gebeuren, dat ieder die van uw huis over is, zal komen om zich voor hem neer te buigen voor een stukje geld en een bol brood, en zal zeggen: Neem mij toch aan tot een van de priesterlijke bedieningen, dat ik een stukje brood mag eten.", "Jer 3:12": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden.", "Gen 41:48": "En hij verzamelde al het voedsel van de zeven jaren die in Egypteland waren, en legde het voedsel op in de steden; het voedsel van het veld rondom elke stad, legde hij daarbinnen op.", "2 Kon 17:16-18": "Ja, zij verlieten al de geboden van de HEERE, hun God, en maakten zich gegoten beelden, twee kalveren; en maakten gewijde palen, en bogen zich neer voor heel het leger van de hemel, en dienden Baäl. Ook lieten zij hun zonen en hun dochters door het vuur gaan, en gebruikten waarzeggerij, en letten op vogelgeschrei, en verkochten zich om te doen wat kwaad was in de ogen van de HEERE, om Hem tot toorn te verwekken. Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "1 Tim 1:9": "En als hij dit weet, dat de wet niet gemaakt is voor de rechtvaardige, maar voor de onrechtvaardigen en de weerspannigen, de goddelozen en de zondaars, de onheiligen en de ongodsdienstigen, de vadermoordenaars en de moedermoordenaars, de doodslagers,", "2 Kron 33:6": "En hij deed zijn zonen door het vuur gaan, in het dal van de zoon van Hinnom, en pleegde toverij, en gaf op vogelgeschrei acht, en toverde, en hij stelde waarzeggers en duivelskunstenaars aan; en hij deed zeer veel kwaads in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Jes 13:10": "Want de sterren van de hemel en zijn sterrenbeelden zullen hun licht niet laten schijnen; de zon zal verduisterd worden wanneer zij opgaat, en de maan zal haar licht niet laten schijnen.", "Jes 34:6": "Het zwaard van de HEERE is vol bloed, het is vet geworden van vet, van het bloed van de lammeren en de bokken, van het vet van de nieren van de rammen; want de HEERE heeft een offer in Bozra, en een grote slachting in het land van de Edomieten.", "Zef 1:4": "En Ik zal Mijn hand uitstrekken tegen Juda, en tegen alle inwoners van Jeruzalem; en Ik zal uit deze plaats uitroeien het overblijfsel van Baäl, en de naam van de afgodspriesters met de priesters;", "Amos 6:10": "En de naaste bloedverwant zal ieder van hen opnemen, degene die hem verbrandt, om de beenderen uit het huis naar buiten te brengen, en zal zeggen tegen hem die binnen in het huis is: Is er nog iemand bij u? En hij zal zeggen: Niemand. Dan zal hij zeggen: Zwijg! Want wij mogen de Naam van de HEERE niet noemen.", "Hos 10:5": "De inwoners van Samaria zullen bang zijn vanwege het kalf van Beth-aven; want zijn volk zal erover treuren, alsook zijn afgodspriesters (die zich erover verheugden), over zijn heerlijkheid, omdat die van hen is weggegaan.", "2 Kron 8:16": "Zo werd al het werk van Salomo klaargemaakt, tot de dag van de grondlegging van het huis van de HEERE, en tot het voltooien ervan, zodat het huis van de HEERE volmaakt werd.", "Jes 6:9-13": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op. Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest. Toen zei ik: Hoe lang, Heere? En Hij zei: Totdat de steden verwoest worden, zodat er geen inwoner meer is, en de huizen, zodat er geen mens meer is, en het land met verwoesting verstrooid wordt.", "2 Kron 35:1": "Daarna hield Josia het pascha voor de HEERE te Jeruzalem; en zij slachtten het pascha op de veertiende dag van de eerste maand.", "1 Sam 7:3": "Toen sprak Samuël tot heel het huis van Israël en zei: Als u zich met heel uw hart tot de HEERE bekeert, doe dan de vreemde goden uit uw midden weg, ook de Astharoths; en richt uw hart op de HEERE, en dien Hem alleen, dan zal Hij u uit de hand van de Filistijnen rukken.", "2 Kron 29:16": "Maar de priesters gingen naar binnen, in het huis van de HEERE, om dat te reinigen, en zij brachten al de onreinheid die zij in de tempel van de HEERE vonden, naar buiten in het voorhof van het huis van de HEERE; en de Levieten namen het op, om het naar buiten te brengen, naar de beek Kidron.", "2 Kon 22:12": "En de koning gebood Hilkia, de priester, en Ahikam, de zoon van Safan, en Achbor, de zoon van Michaja, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei:", "Neh 9:38": "En om dit alles maken wij een vast verbond en schrijven het; en onze vorsten, onze Levieten en onze priesters zullen het verzegelen.", "Num 3:48-51": "En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten. Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten. Van de eerstgeborenen van de kinderen van Israël nam hij dat geld, duizend driehonderdvijfenzestig sikkels, naar de sikkel van het heiligdom.", "Ex 32:20": "En hij nam het kalf dat zij gemaakt hadden, en verbrandde het in het vuur, en vermaalde het tot het klein werd, en strooide het op het water, en liet de kinderen van Israël dat drinken.", "Luk 23:28-31": "En Jezus keerde Zich naar hen toe en zei: Dochters van Jeruzalem, weent niet over Mij, maar weent over uzelf, en over uw kinderen. Want zie, er komen dagen waarin men zal zeggen: Zalig zijn de onvruchtbaren, en de buiken die niet gebaard hebben, en de borsten die niet gezoogd hebben. Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Jer 44:17-19": "Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad. Maar vanaf het moment dat wij opgehouden zijn wierook te branden voor de koningin van de hemel, en haar drankoffers te offeren, hebben wij van alles gebrek gehad, en zijn wij door het zwaard en door de honger verteerd. Ook wanneer wij voor de koningin van de hemel wierook branden en haar drankoffers offeren, maken wij haar gebeelde koeken om haar af te beelden, en offeren wij haar drankoffers, zonder onze mannen?", "Ps 106:38": "En zij hebben onschuldig bloed vergoten, het bloed van hun zonen en hun dochters, die zij aan de afgoden van Kanaän hebben opgeofferd; zodat het land door deze bloedschuld ontheiligd is geworden.", "1 Kon 20:5": "Daarna kwamen de boden terug, en zeiden: Zo spreekt Benhadad en zegt: Ik heb wel naar u gezonden en gezegd: Uw zilver, en uw goud, en uw vrouwen, en uw kinderen zult u mij geven;", "Jer 7:20": "Daarom zegt de Heere HEERE zo: Zie, Mijn toorn en Mijn grimmigheid zal uitgestort worden over deze plaats, over de mensen en over de dieren, en over de bomen van het veld, en over de vrucht van het aardrijk; en het zal branden, en niet uitgeblust worden.", "Ex 21:11": "En als hij haar deze drie dingen niet doet, zal zij om niet uitgaan, zonder geld.", "Openb 1:7": "Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.", "Mark 14:11": "En zij, die dit hoorden, waren verblijd, en beloofden hem geld te geven; en hij zocht hoe hij Hem op een geschikt moment kon overleveren.", "Lev 20:13": "Wanneer ook een man gemeenschap heeft met een man, zoals met een vrouw, hebben zij beiden een gruwel gedaan; zij zullen zeker gedood worden; hun bloed is op hen!", "Lev 27:15": "En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.", "Jer 7:32": "Daarom zie, de dagen komen, spreekt de HEERE, dat het niet meer Tofeth genoemd zal worden, noch dal van de zoon van Hinnom, maar moorddal; en zij zullen ze in Tofeth begraven, omdat er geen plaats meer zal zijn.", "2 Kon 12:10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "Klaagl 4:11": "Caph. De HEERE heeft Zijn grimmigheid volbracht, Hij heeft de gloed van Zijn toorn uitgestort; en Hij heeft in Sion een vuur aangestoken, dat haar fundamenten verteerd heeft.", "Jer 1:3": "Ook kwam het tot hem in de dagen van Jojakim, zoon van Josia, koning van Juda, totdat het elfde jaar van Zedekia, zoon van Josia, koning van Juda, voleindigd werd; totdat Jeruzalem gevankelijk werd weggevoerd in de vijfde maand.", "Jer 36:5": "En Jeremia gebood Baruch: Ik word tegengehouden, ik zal niet in het huis van de HEERE kunnen gaan.", "Deut 10:12": "Nu dan, Israël! Wat vraagt de HEERE, uw God, van u, dan de HEERE, uw God, te vrezen, in al Zijn wegen te wandelen, en Hem lief te hebben, en de HEERE, uw God, te dienen, met heel uw hart en met heel uw ziel;", "Luk 19:23": "Waarom hebt u dan mijn geld niet bij de bank gebracht, zodat ik het bij mijn komst met rente had kunnen opeisen?", "Ps 106:23": "Daarom zei Hij dat Hij hen zou verdelgen, ware het niet dat Mozes, Zijn uitverkorene, in de scheur voor Zijn aangezicht gestaan had, om Zijn grimmigheid af te keren, zodat Hij hen niet verdierf.", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "2 Kron 36:2-4": "Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem. Want de koning van Egypte zette hem af te Jeruzalem, en hij legde het land een boete op van honderd talenten zilver en een talent goud. En de koning van Egypte maakte zijn broer Eljakim koning over Juda en Jeruzalem, en veranderde zijn naam in Jojakim; maar zijn broer Joahaz nam Necho mee, en bracht hem naar Egypte.", "2 Kron 14:5": "Hij nam ook uit alle steden van Juda de hoogten en de zonnebeelden weg; en het koninkrijk was voor hem stil.", "Amos 3:14": "Dat Ik, op de dag dat Ik Israëls overtredingen over hem bezoeken zal, ook bezoeking zal doen over de altaren van Beth-el; en de hoorns van het altaar zullen worden afgehouwen, en op de aarde vallen.", "Micha 1:7": "En al haar gesneden beelden zullen vermorzeld worden, en al haar hoerenbeloningen zullen met vuur verbrand worden, en al haar afgoden zal Ik stellen tot een woestheid; want zij heeft ze van hoerenloon vergaderd, en zij zullen tot hoerenloon terugkeren.", "Lev 23:5-8": "In de eerste maand, op de veertiende van de maand, tussen twee avonden is het pascha van de HEERE. En op de vijftiende dag van diezelfde maand is het feest van de ongezuurde broden van de HEERE; zeven dagen zult u ongezuurde broden eten. Op de eerste dag zult u een heilige samenkomst hebben; geen dienstwerk zult u doen.", "Deut 14:25": "Zo maak het tot geld, en bind het geld in uw hand, en ga naar de plaats die de HEERE, uw God, zal uitkiezen;", "1 Kon 13:32": "Want de zaak zal zeker gebeuren, die hij door het woord van de HEERE uitgeroepen heeft tegen het altaar dat te Beth-el is, en tegen alle huizen van de hoogten die in de steden van Samaria zijn.", "Deut 7:25": "De gesneden beelden van hun goden zult u met vuur verbranden; het zilver en goud dat daaraan is, zult u niet begeren, en ook niet voor uzelf nemen, opdat u daardoor niet verstrikt wordt; want dat is voor de HEERE, uw God, een afschuwelijke gruwel.", "2 Kron 28:22-25": "Ja, in de tijd toen men hem benauwde, ging hij nog meer overtreden tegen de HEERE; dit was koning Achaz. Want hij offerde aan de goden van Damascus, die hem geslagen hadden, en zei: Omdat de goden van de koningen van Syrië hen helpen, zal ik hun offeren, opdat zij mij ook helpen; maar zij waren hem tot zijn val, alsook aan heel Israël. En Achaz verzamelde de voorwerpen van het huis van God, en hakte de voorwerpen van het huis van God in stukken, en sloot de deuren van het huis van de HEERE toe; daartoe maakte hij zich altaren in elke hoek van Jeruzalem.", "2 Kron 36:14": "Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.", "Mal 2:9": "Daarom heb Ik u ook verachtelijk en onwaard gemaakt voor heel het volk, omdat u Mijn wegen niet houdt, maar partijdig bent in de wet.", "Ps 78:21": "Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "2 Kon 23:29-35": "In zijn dagen trok Farao Necho, de koning van Egypte, op tegen de koning van Assyrië, naar de rivier de Frath; en koning Josia trok hem tegemoet, en Necho doodde hem te Megiddo, toen hij hem gezien had. En zijn knechten voerden hem dood op een wagen van Megiddo, en brachten hem naar Jeruzalem, en begroeven hem in zijn graf; en het volk van het land nam Joahaz, de zoon van Josia, en zalfde hem, en maakte hem koning in de plaats van zijn vader. Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem; en de naam van zijn moeder was Hamutal, de dochter van Jeremia, van Libna.", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Rom 1:27": "en evenzo hebben ook de mannen het natuurlijke gebruik van de vrouw verlaten, en zijn in hun begeerte naar elkaar in vuur geraakt, mannen die met mannen schandelijkheid bedrijven, en de vergelding voor hun dwaling, die daarbij hoorde, in zichzelf ontvangend.", "Richt 10:6": "Toen gingen de Israëlieten opnieuw doen wat slecht was in de ogen van de HEERE: zij dienden de Baäls en de Astartes, de goden van Syrië, de goden van Sidon, de goden van Moab, de goden van de Ammonieten, alsook de goden van de Filistijnen; zij verlieten de HEERE en dienden Hem niet meer.", "Richt 11:24": "Zou u niet erven wat uw god Kamos voor u uit het bezit verdreef? Zo zullen wij alles erven wat de HEERE, onze God, voor ons aangezicht uit het bezit verdrijft.", "Dan 9:27": "En hij zal voor velen het verbond versterken, één week; en in de helft van de week zal hij het slachtoffer en het spijsoffer doen ophouden, en over de gruwelijke vleugel zal een verwoester zijn, ook tot de voleinding toe, die vast besloten is, zal uitgestort worden over de verwoeste.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "Neh 8:19": "En men las uit het wetboek van God, dag na dag, van de eerste dag tot de laatste dag. En zij vierden het feest zeven dagen, en op de achtste dag hielden zij een verbodsdag, naar het voorschrift.", "Jer 19:13": "En de huizen van Jeruzalem en de huizen van de koningen van Juda zullen, evenals alle plaatsen van Tofeth, onrein worden, met al de huizen, op wier daken zij aan heel het leger van de hemel gerookt en aan vreemde goden drankoffers geofferd hebben.", "Jer 21:4-7": "Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad. En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid. En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "2 Kron 36:5-8": "Vijfentwintig jaar was Jojakim oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem; en hij deed wat slecht was in de ogen van de HEERE, zijn God. Nebukadnezar, de koning van Babel, trok tegen hem op, en bond hem met twee koperen ketenen, om hem naar Babel te voeren. Nebukadnezar bracht ook een deel van de voorwerpen van het huis van de HEERE naar Babel, en zette ze in zijn tempel te Babel.", "Ezech 20:26": "En Ik verontreinigde hen in hun eigen giften, doordat zij door het vuur lieten doorgaan al wat de baarmoeder opent; opdat Ik hen zou verwoesten, met als doel dat zij zouden weten dat Ik de HEERE ben.", "Hos 3:4": "Want de kinderen van Israël zullen veel dagen blijven zitten, zonder koning, en zonder vorst, en zonder offer, en zonder opgericht beeld, en zonder efod en terafim.", "Hos 4:12-14": "Mijn volk vraagt zijn hout om raad, en zijn stok zal het hem bekendmaken; want de geest van de hoererijen verleidt hen, zodat zij van onder hun God weghoereren. Op de toppen van de bergen offeren zij, en op de heuvels branden zij reukwerk, onder een eik, en populier, en iepenboom, omdat de schaduw daarvan goed is; daarom hoereren uw dochters, en uw bruiden plegen overspel. Ik zal over uw dochters geen straf² brengen, omdat zij hoereren, en over uw bruiden, omdat zij overspel plegen; want zij zelf zonderen zich af met de hoeren, en offeren met de snoodste hoeren; het volk dan, dat geen verstand heeft, zal ten onder gaan.", "Ps 106:37": "Daarenboven hebben zij hun zonen en hun dochters aan de duivelen geofferd.", "Jer 20:1": "Toen Pashur, de zoon van Immer, de priester (deze was aangesteld als voorganger in het huis van de HEERE), Jeremia hoorde deze woorden profeteren,", "Deut 12:31": "Zo zult u niet doen voor de HEERE, uw God; want alles wat de HEERE een gruwel is, dat Hij haat, hebben zij voor hun goden gedaan; want zij hebben zelfs hun zonen en hun dochters met vuur verbrand voor hun goden.", "1 Kon 8:48": "en zij zich tot U bekeren, met hun hele hart, en met hun hele ziel, in het land van hun vijanden, die hen gevankelijk zullen hebben weggevoerd; en tot U bidden zullen in de richting van hun land (dat U hun vaderen gegeven hebt), naar deze stad, die U verkoren hebt, en naar dit huis, dat ik voor Uw Naam gebouwd heb;", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "Amos 4:5": "En laat rook opgaan van het gedesemde als een lofoffer, en roep vrijwillige offers uit, laat het horen; want zo hebt u het graag, kinderen van Israël! spreekt de Heere HEERE.", "Richt 20:1": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa.", "2 Kon 23:21-23": "En de koning gebood heel het volk en zei: Houd voor de HEERE, uw God, pascha, zoals in dit boek van het verbond geschreven is. Want zoals dit pascha was er geen gehouden, vanaf de dagen van de richters die Israël gericht hadden, noch in al de dagen van de koningen van Israël, noch van de koningen van Juda. Maar in het achttiende jaar van koning Josia, werd dit pascha voor de HEERE te Jeruzalem gehouden.", "Openb 16:19": "En de grote stad werd in drie delen gescheurd, en de steden van de heidenvolken vielen; en aan het grote Babylon werd gedacht voor God, om haar de drinkbeker te geven van de wijn van de toorn van Zijn gramschap.", "Klaagl 5:6": "Wij hebben de Egyptenaar de hand gegeven, en de Assyriër, om met brood verzadigd te worden.", "Rom 1:26": "Daarom heeft God hen overgegeven aan oneerlijke driften; want ook hun vrouwen hebben het natuurlijke gebruik veranderd in het gebruik tegen de natuur;", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "Ex 23:24": "U zult zich voor hun goden niet buigen, hen ook niet dienen; ook zult u niet doen naar hun werken; maar u zult ze geheel afbreken, en hun opgerichte beelden helemaal vermorzelen.", "Jes 57:5": "U die verhit bent in de eikenbossen, onder elke groene boom; die de kinderen slacht bij de beken, onder de richels van de rotsen?", "Joh 7:19": "Heeft Mozes u niet de wet gegeven? En niemand van u doet de wet. Waarom probeert u Mij te doden?", "2 Kon 12:9": "Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Jes 1:1-24": "Het visioen van Jesaja, de zoon van Amoz, dat hij zag over Juda en Jeruzalem, in de dagen van Uzzia, Jotham, Achaz en Hizkia, de koningen van Juda. Hoor, hemelen! en neem het ter oor, aarde! Want de HEERE spreekt: Ik heb kinderen groot gemaakt en verhoogd, maar zij hebben tegen Mij overtreden. Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet.", "2 Kon 22:2": "En hij deed wat recht was in de ogen van de HEERE; en hij wandelde in heel de weg van zijn vader David, en week niet af naar rechts of naar links.", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "Num 19:18": "En een rein man zal hysop nemen, en die dopen in dat water, en het sprenkelen op die tent, en op alle voorwerpen, en op de personen die daar geweest zijn; evenzo op hem die een gebeente, of een gedode, of een dode, of een graf aangeraakt heeft.", "Neh 11:31": "De kinderen van Benjamin nu woonden, van Geba af, in Michmas, en Aja, en Beth-el, en haar onderhorige plaatsen,", "Jer 48:46": "Wee u, Moab! Het volk van Kamos is verloren; want uw zonen zijn weggenomen in gevangenschap; ook zijn uw dochters in gevangenschap.", "2 Kron 33:7": "Hij stelde ook de gelijkenis van een gesneden beeld, dat hij gemaakt had, in het huis van God, waarvan God gezegd had tot David en tot zijn zoon Salomo: In dit huis, en te Jeruzalem, dat Ik uit alle stammen van Israël verkozen heb, zal Ik Mijn Naam zetten tot in eeuwigheid.", "1 Tim 4:13": "Houd aan met het voorlezen, met het vermanen, met het onderwijzen, totdat ik kom.", "Klaagl 2:1": "Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.", "2 Kron 34:20": "En de koning gebood Hilkia, en Ahikam, de zoon van Safan, en Abdon, de zoon van Micha, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei:", "1 Kron 3:15": "De zonen van Josia nu waren deze: de eerstgeborene Johanan, de tweede Jojakim, de derde Zedekia, de vierde Sallum.", "2 Kon 21:7": "Hij plaatste ook een gesneden beeld van de gewijde paal die hij gemaakt had, in het huis waarvan de HEERE gezegd had tot David en tot zijn zoon Salomo: In dit huis, en in Jeruzalem, dat Ik uit alle stammen van Israël verkozen heb, zal Ik Mijn Naam vestigen voor eeuwig.", "Joz 24:24": "En het volk zei tegen Jozua: Wij zullen de HEERE, onze God, dienen, en wij zullen Zijn stem gehoorzamen.", "Gen 47:14-18": "Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao. Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op. En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.", "2 Kon 17:30": "Want de mensen van Babel maakten Sukkoth-Benoth, en de mensen van Chut maakten Nergal, en de mensen van Hamath maakten Asima,", "2 Kon 11:4": "In het zevende jaar zond Jojada, en nam de leiders van honderd met de hoofdmannen en met de lijfwacht, en hij bracht hen bij zich, in het huis van de HEERE; en hij sloot een verbond met hen en beëdigde hen in het huis van de HEERE, en hij toonde hun de zoon van de koning.", "1 Kon 15:22": "Toen liet de koning Asa door heel Juda uitroepen (niemand was vrijgesteld), dat zij de stenen van Rama, en het hout daarvan, zouden wegdragen, waarmee Baësa gebouwd had; en de koning Asa bouwde daarmee Geba-Benjamins, en Mizpa.", "Gen 19:5-8": "En zij riepen Lot toe, en zeiden tegen hem: Waar zijn die mannen die deze nacht bij u gekomen zijn? Breng hen naar buiten, naar ons toe, opdat wij met hen gemeenschap hebben. Toen ging Lot naar buiten naar hen toe, bij de deur, en hij sloot de deur achter zich toe; en hij zei: Mijn broeders! Doe toch geen kwaad!", "Hos 4:14": "Ik zal over uw dochters geen straf² brengen, omdat zij hoereren, en over uw bruiden, omdat zij overspel plegen; want zij zelf zonderen zich af met de hoeren, en offeren met de snoodste hoeren; het volk dan, dat geen verstand heeft, zal ten onder gaan.", "2 Kron 35:22-24": "Doch Josia keerde zijn aangezicht niet van hem; maar hij vermomde zich, om tegen hem te strijden, en hoorde niet naar de woorden van Necho uit de mond van God; maar hij kwam om te strijden in het dal Megiddo. En de schutters schoten koning Josia. Toen zei de koning tegen zijn knechten: Voer mij weg, want ik ben zwaar gewond. En zijn knechten namen hem weg van de wagen, en voerden hem op de tweede wagen, die hij had, en brachten hem naar Jeruzalem; en hij stierf, en werd begraven in de graven van zijn vaderen; en heel Juda en Jeruzalem bedreven rouw over Josia.", "1 Kon 6:37": "In het vierde jaar werd de grond van het huis van de HEERE gelegd, in de maand Ziv;", "1 Kon 21:2": "Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven.", "Ex 12:3-20": "Spreekt tot de hele vergadering van Israël en zeg: Op de tiende dag van deze maand moet ieder een lam nemen, naar de huizen van de vaderen, een lam voor een huis. Maar als een huis te klein is voor een lam, dan moet hij het samen met zijn buurman, die het dichtst bij zijn huis woont, nemen, naar het aantal zielen; ieder naar wat hij eten kan, zo moet u het rekenen voor het lam. U moet een volkomen lam hebben, een mannetje, een jaar oud; van de schapen of van de geitenbokken moet u het nemen.", "1 Kron 26:1-19": "Aangaande de verdelingen van de poortwachters: van de Korahieten was Meselemja, de zoon van Kore, van de kinderen van Asaf. Meselemja nu had kinderen; Zecharja was de eerstgeborene, Jediaël de tweede, Zebadja de derde, Jathniël de vierde, Elam de vijfde, Johanan de zesde, Eljehoenai de zevende.", "Jer 30:24": "De gloed van de toorn van de HEERE zal zich niet afwenden, totdat Hij het gedaan heeft, en totdat Hij tot stand gebracht heeft de gedachten van Zijn hart; in het laatste van de dagen zult u daarop letten.", "Matt 28:15": "En zij namen het geld, en deden zoals hun geleerd was. En dit verhaal is onder de Joden verspreid geraakt tot op deze huidige dag.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "Jes 8:19": "Wanneer zij dan tegen u zeggen zullen: Vraag waarzeggers en duivelskunstenaars, die daar piepen en binnensmonds mompelen; zo zeg: Zal een volk niet zijn God vragen? Zal men voor de levenden de doden vragen?", "Ex 22:7": "Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven.", "1 Kon 19:3": "Toen hij dat zag, maakte hij zich op en ging heen om zijn leven te redden, en kwam in Berseba, dat in Juda ligt, en liet zijn knecht daar.", "Hand 16:16-18": "En het gebeurde, toen wij naar het gebed gingen, dat een zekere dienstmeisje, dat een waarzeggende geest had, ons tegemoet kwam; zij bracht haar heren veel van het gewin met waarzeggen. Zij volgde Paulus en ons achterna en riep: Deze mensen zijn dienstknechten van God, de Allerhoogste, die ons de weg van de zaligheid verkondigen. En dit deed zij vele dagen lang. Maar Paulus, die daarover geërgerd was, keerde zich om en zei tegen de geest: Ik gebied u in de Naam van Jezus Christus dat u van haar uitgaat. En hij ging uit op datzelfde moment.", "Jer 17:26": "En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "2 Kron 34:30-33": "En de koning ging op naar het huis van de HEERE, en alle mannen van Juda en de inwoners van Jeruzalem, alsook de priesters en de Levieten, en heel het volk, van de grootste tot de kleinste toe; en men las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was. En de koning stond op zijn plaats, en sloot een verbond voor het aangezicht van de HEERE, om de HEERE te volgen, en om Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen, met heel zijn hart en met heel zijn ziel, te onderhouden, door de woorden van het verbond te doen, die in dat boek geschreven zijn. En hij liet allen die in Jeruzalem en in Benjamin gevonden werden, hierbij instemmen; en de inwoners van Jeruzalem deden naar het verbond van God, de God van hun vaderen.", "Richt 5:19": "De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan.", "Joz 7:25": "En Jozua zei: Hoe hebt u ons in het ongeluk gestort? De HEERE zal u op deze dag in het ongeluk storten! En heel Israël stenigde hem met stenen, en zij verbrandden hen met vuur, en overwierpen hen met stenen.", "Luk 19:44": "en zij zullen u tot de grond toe neerwerpen, en uw kinderen in u; en zij zullen in u geen steen op de andere steen laten liggen, omdat u de tijd waarin u bezocht werd niet hebt herkend.", "1 Kon 15:5": "Omdat David gedaan had wat recht was in de ogen van de HEERE, en niet geweken was van alles wat Hij hem geboden had, al de dagen van zijn leven, behalve alleen in de zaak van Uria, de Hethiet.", "Jer 48:13": "En Moab zal beschaamd worden vanwege Kamos, zoals het huis van Israël beschaamd is geworden vanwege Bethel, hun vertrouwen.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "Jes 9:20": "Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Jer 42:13-22": "Maar als u zult zeggen: Wij zullen in dit land niet blijven; zodat u niet gehoorzaam bent aan de stem van de HEERE, van uw God, en zegt: Nee, maar wij zullen naar Egypteland gaan, waar wij geen oorlog zullen zien, noch het geluid van de bazuin horen, noch naar brood hongeren, en daar zullen wij blijven; nu dan, daarom hoor het woord van de HEERE, overblijfsel van Juda! Zo zegt de HEERE van de heerscharen, de God van Israël: Als u vastbesloten uw aangezichten stelt om naar Egypte te gaan, en daar naartoe gaat om daar als vreemdelingen te wonen;", "Luk 21:5-25": "En toen sommigen spraken over de tempel, dat hij met mooie stenen en geschenken versierd was, zei Hij: Wat deze dingen aangaat, die u aanschouwt: er zullen dagen komen waarin geen steen op de andere steen gelaten zal worden, die niet zal worden afgebroken. En zij vroegen Hem: Meester, wanneer zullen deze dingen dan gebeuren, en wat is het teken wanneer deze dingen zullen gebeuren?", "Hand 7:16": "En zij werden overgebracht naar Sichem, en gelegd in het graf, dat Abraham gekocht had voor een som geld, van de zonen van Hemor, de vader van Sichem.", "1 Kron 22:11": "Nu, mijn zoon, de HEERE zal met u zijn, en u zult voorspoedig zijn, en u zult het huis van de HEERE, van uw God, bouwen, zoals Hij van u gesproken heeft.", "Hos 13:11": "Ik gaf u een koning in Mijn toorn en nam hem weg in Mijn woede.", "2 Kon 21:21": "Want hij ging in heel de weg die zijn vader gegaan was, en hij diende de drekgoden die zijn vader gediend had, en hij boog zich voor ze neer.", "Spr 19:19": "Die groot is van grimmigheid, zal straf dragen; want als u hem redt, zult u het nog moeten herhalen.", "Jes 30:33": "Want Tofeth is van oudsher bereid; ja, hij is ook voor de koning bereid; Hij heeft hem diep en wijd gemaakt, het vuur en hout van zijn brandstapel is veel; de adem van de HEERE zal hem aansteken als een zwavelstroom.", "Deut 9:18-20": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken. Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment. Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.", "Richt 10:7": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten.", "Joz 15:8": "En deze grens zal opgaan door het dal van de zoon van Hinnom, aan de kant van de Jebusiet van het zuiden, dat is Jeruzalem; en deze grens zal opwaarts gaan tot de top van de berg, die voor het dal van Hinnom is, westwaarts, wat in het uiterste van het dal van de Refaïeten is, tegen het noorden.", "1 Kon 8:10": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.", "2 Kon 24:17": "En de koning van Babel maakte Mattanja, diens oom, koning in zijn plaats, en veranderde zijn naam in Zedekia.", "Jer 23:20": "De toorn van de HEERE zal zich niet afwenden, totdat Hij het zal hebben gedaan, en totdat Hij de gedachten van Zijn hart tot stand zal hebben gebracht; in de laatste dagen zult u dat met verstand inzien.", "1 Kon 21:6": "En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven.", "2 Kon 23:1-20": "Toen zond de koning boden, en tot hem verzamelden zich alle oudsten van Juda en Jeruzalem. En de koning ging op naar het huis van de HEERE, en met hem alle mannen van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van de kleinste tot de grootste; en hij las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was. De koning nu stond bij de pilaar, en sloot een verbond voor het aangezicht van de HEERE, om de HEERE na te wandelen, en Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen met heel zijn hart en met heel zijn ziel te houden, om de woorden van dit verbond te bevestigen, die in dit boek geschreven zijn. En heel het volk stond in dit verbond.", "2 Kon 14:11": "Doch Amazia luisterde niet; daarom trok Joas, de koning van Israël, op, zodat hij en Amazia, de koning van Juda, elkaar in het gezicht zagen bij Beth-semes, dat in Juda ligt.", "Rom 11:33": "O diepte van de rijkdom, én van de wijsheid én van de kennis van God, hoe ondoorzoekelijk zijn Zijn oordelen, en onnaspeurlijk Zijn wegen!", "Rom 16:23": "U groet Gajus, de huiswaard van mij en van de hele Gemeente. U groet Erastus, de rentmeester van de stad, en de broeder Quartus.", "Lev 21:21": "Geen man, uit het nageslacht van Aäron, de priester, aan wie een gebrek is, zal toetreden om de vuuroffers van de HEERE te offeren; een gebrek is in hem, hij zal niet toetreden om het voedsel van zijn God te offeren.", "2 Kon 10:27": "Zij braken ook het opgerichte beeld van Baäl af; daartoe braken zij het huis van Baäl af, en maakten dat tot heimelijke gemakken, tot op deze dag.", "Deut 5:1": "En Mozes riep het hele Israël bijeen en zei tegen hen: Hoor, Israël! De inzettingen en rechten die ik vandaag voor uw oren spreek: leer ze en neem ze in acht, om ze te doen.", "Jer 39:6": "En de koning van Babel slachtte de zonen van Zedekia te Ribla voor zijn ogen; ook slachtte de koning van Babel alle edelen van Juda.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "2 Kron 29:20": "Toen stond koning Hizkia vroeg op, en verzamelde de leiders van de stad, en hij ging op naar het huis van de HEERE.", "1 Kron 9:11": "En Azarja, de zoon van Hilkija, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, leider van het huis van God;", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "Matt 25:18": "Maar hij die het ene ontvangen had, ging weg en groef in de aarde, en verborg het geld van zijn heer.", "1 Sam 1:24": "Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.", "Ezech 16:21": "dat u Mijn kinderen geslacht hebt, en ze overgegeven hebt, doordat u ze voor hen door het vuur hebt laten gaan?", "Deut 31:28": "Verzamel bij mij alle oudsten van uw stammen, en uw opzichters; opdat ik ten aanhoren van hen deze woorden spreek, en tegen hen de hemel en de aarde tot getuigen neem.", "Jer 33:24": "Hebt u niet gezien wat dit volk zegt: De twee geslachten die de HEERE verkozen had, die heeft Hij nu verworpen? Ja, zij versmaden Mijn volk, zodat het geen volk meer is voor hun aangezicht.", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Jer 22:24-30": "Zo waarachtig als Ik leef, spreekt de HEERE, al was Chonia, de zoon van Jojakim, de koning van Juda, een zegelring aan Mijn rechterhand, toch zal Ik u vandaar wegrukken. En Ik zal u geven in de hand van hen die uw leven zoeken, en in de hand van hen voor wier gezicht u beeft, namelijk in de hand van Nebukadnezar, de koning van Babel, en in de hand van de Chaldeeën. En Ik zal u, en uw moeder, die u gebaard heeft, wegwerpen in een ander land, waarin u niet geboren bent, en daar zult u sterven.", "Jer 52:26": "Toen Nebuzaradan, de leider van de lijfwacht, dezen genomen had, bracht hij hen naar de koning van Babel in Ribla.", "Jer 27:9": "U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen.", "Num 19:16": "En ieder die in het open veld iemand die met het zwaard gedood is, of een dode, of het gebeente van een mens, of een graf aangeraakt heeft, zal zeven dagen onrein zijn.", "Jer 28:5": "Toen zei de profeet Jeremia tegen de profeet Hananja, voor de ogen van de priesters en voor de ogen van het hele volk, dat in het huis van de HEERE stond;", "Lev 20:15": "Verder, als een man gemeenschap heeft met enig dier, zal hij zeker gedood worden; ook zult u het dier doden.", "Jer 44:15-19": "Toen antwoordden aan Jeremia al de mannen die wisten dat hun vrouwen aan andere goden wierook brandden, en al de vrouwen die daar stonden, een grote menigte, alsook al het volk dat in Egypteland, in Pathros, woonde, en zij zeiden: Wat betreft het woord dat u tot ons in de Naam van de HEERE gesproken hebt, wij zullen niet naar u horen. Maar wij zullen zeker doen al wat uit onze mond is uitgegaan, terwijl wij wierook branden voor de koningin van de hemel, en haar drankoffers offeren, zoals wij gedaan hebben, wij en onze vaders, onze koningen en onze vorsten, in de steden van Juda en in de straten van Jeruzalem; toen werden wij met brood verzadigd, en waren vrolijk, en zagen geen kwaad.", "Jer 15:1-14": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan. En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap! Want Ik zal een bezoeking over hen brengen met vier soorten straf, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te verscheuren; en met het gevogelte van de hemel, en met het gedierte van de aarde, om op te eten en te vernietigen.", "Matt 28:12": "En zij kwamen samen met de oudsten, en namen samen een besluit, en gaven de soldaten veel geld,", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Openb 14:10": "die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "Ex 12:44": "Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.", "2 Kon 25:11": "Het overige nu van het volk, die in de stad overgelaten waren, en de afvalligen, die tot de koning van Babel gevallen waren, en het overige van de menigte, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk weg.", "1 Kon 12:31": "Hij maakte ook een huis der hoogten; en maakte priesters van de geringste mensen van het volk, die niet uit de zonen van Levi waren.", "2 Kon 23:4-20": "En de koning gebood de hogepriester Hilkia, en de priesters van de tweede rang, en de bewakers van de drempel, dat zij uit de tempel van de HEERE al het gereedschap, dat voor Baäl, en voor het beeld van het bos en voor heel het leger van de hemel gemaakt was, naar buiten zouden brengen; en hij verbrandde dat buiten Jeruzalem in de velden van Kidron, en liet het stof daarvan naar Beth-el brengen. Daartoe schafte hij de afgodspriesters af, die de koningen van Juda aangesteld hadden, opdat men zou roken op de hoogten, in de steden van Juda, en rondom Jeruzalem, alsook hen die voor Baäl, de zon, en de maan, en de andere planeten, en heel het leger van de hemel rookten. Hij bracht ook het beeld van het bos weg uit het huis van de HEERE, buiten Jeruzalem, naar de beek Kidron, en verbrandde het bij de beek Kidron, en vergruisde het tot stof; en hij wierp het stof daarvan op de graven van de kinderen van het volk.", "Richt 18:18": "Toen dezen dus het huis van Micha waren binnengegaan, en het gesneden beeld, de efod, en de terafim, en het gegoten beeld hadden weggenomen, zei de priester tegen hen: Wat doet u?", "Num 13:21": "Zo trokken zij op, en verspiedden het land, van de woestijn Zin af tot Rechob toe, waar men komt bij Hamath.", "Jer 52:1": "Zedekia was eenentwintig jaar oud toen hij koning werd, en hij regeerde elf jaar in Jeruzalem; en de naam van zijn moeder was Hamutal, een dochter van Jeremia, van Libna.", "Richt 19:22": "Toen zij nu hun hart vrolijk maakten, zie, omringden de mannen van die stad (mannen, die kinderen van Belial waren) het huis, en klopten op de deur; en zij spraken tegen de oude man, de heer van het huis, en zeiden: Breng de man die in uw huis gekomen is naar buiten, zodat wij hem bekennen.", "Lev 27:18": "Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "Joz 21:17": "En van de stam van Benjamin, Gibeon en haar voorsteden, Geba en haar voorsteden;", "Jer 26:7": "En de priesters, en de profeten, en al het volk, hoorden Jeremia deze woorden spreken in het huis van de HEERE.", "1 Kon 13:1": "En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken.", "2 Sam 5:21": "En zij lieten hun afgoden daar achter; en David en zijn mannen namen ze mee.", "Zach 13:3": "En het zal gebeuren, wanneer iemand nog profeteert, dat zijn vader en zijn moeder, die hem verwekt hebben, tegen hem zullen zeggen: U zult niet leven, omdat u leugens gesproken hebt in de Naam van de HEERE; en zijn vader en zijn moeder, die hem verwekt hebben, zullen hem doorsteken, wanneer hij profeteert.", "Jer 52:10": "En de koning van Babel slachtte de zonen van Zedekia voor zijn ogen; en hij slachtte ook al de vorsten van Juda te Ribla.", "1 Sam 1:7": "En zo deed hij jaar op jaar; van toen af dat zij opging naar het huis van de HEERE, zo tergde zij haar steeds; daarom weende zij en at niet.", "2 Kon 23:1-30": "Toen zond de koning boden, en tot hem verzamelden zich alle oudsten van Juda en Jeruzalem. En de koning ging op naar het huis van de HEERE, en met hem alle mannen van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van de kleinste tot de grootste; en hij las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was. De koning nu stond bij de pilaar, en sloot een verbond voor het aangezicht van de HEERE, om de HEERE na te wandelen, en Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen met heel zijn hart en met heel zijn ziel te houden, om de woorden van dit verbond te bevestigen, die in dit boek geschreven zijn. En heel het volk stond in dit verbond.", "1 Kon 12:29": "En hij zette het ene te Beth-el, en het andere plaatste hij te Dan.", "Gen 31:15": "Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "2 Kon 25:9": "En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur.", "Ex 33:5": "En de HEERE had tot Mozes gezegd: Zeg tegen de Israëlieten: U bent een hardnekkig volk; in één ogenblik zou Ik in uw midden optrekken, en u vernietigen; doch nu, leg uw sieraad van u af, en Ik zal weten wat Ik u doen zal.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Pred 9:1": "Zeker, dit alles heb ik in mijn hart overwogen, opdat ik dit alles klaar mocht verstaan: dat de rechtvaardigen en de wijzen en hun werken in de hand van God zijn; ook liefde, ook haat, weet de mens niet uit al wat voor zijn aangezicht is.", "Amos 2:1": "Zo zegt de HEERE: Om drie overtredingen van Moab, en om vier zal Ik dat niet afwenden; omdat hij de beenderen van de koning van Edom tot kalk verbrand heeft.", "Openb 14:8": "En er is een andere engel gevolgd, die zei: Zij is gevallen, zij is gevallen, Babylon, die grote stad, omdat zij uit de wijn van de toorn van haar hoererij alle volken heeft laten drinken.", "Ps 69:25": "Stort over hen Uw gramschap uit; en de gloed van Uw toorn grijpt hen aan.", "Ps 78:49": "Hij zond onder hen de gloed van Zijn toorn, verbolgenheid, en verstoordheid, en benauwdheid, met uitzending van boden van veel kwaad.", "2 Kon 20:18": "Daarbij zullen zij van uw zonen, die uit u zullen voortkomen, die u zult verwekken, nemen, zodat zij hovelingen zijn in het paleis van de koning van Babel.", "2 Kron 15:12-14": "En zij sloten een verbond, dat zij de HEERE, de God van hun vaderen, zouden zoeken met hun hele hart en met hun hele ziel. En ieder die de HEERE, de God van Israël, niet zou zoeken, zou gedood worden, van klein tot groot, en van man tot vrouw toe. En zij zwoeren de HEERE met luide stem en met gejuich, en ook met trompetten en met bazuinen.", "Num 25:11": "Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, heeft Mijn grimmigheid van over de kinderen van Israël afgewend, omdat hij Mijn ijver geijverd heeft in hun midden, zodat Ik de kinderen van Israël in Mijn ijver niet vernietigd heb.", "Ex 35:25": "En alle vrouwen die wijs van hart waren, sponnen met hun handen, en zij brachten het gesponnene, het hemelsblauwe garen, en het purper, het scharlaken, en het fijn linnen.", "1 Kon 18:26": "En zij namen de stier die hij hun gegeven had, en bereidden hem, en riepen de naam van Baäl aan, van de morgen tot de middag, en zeiden: O Baäl, antwoord ons! Maar er was geen stem en geen die antwoordde. En zij sprongen tegen het altaar dat men gemaakt had.", "Gen 26:23": "Daarna trok hij daarvandaan op naar Berseba.", "Deut 22:8": "Wanneer u een nieuw huis bouwt, zult u op uw dak een leuning maken; opdat u geen bloedschuld op uw huis legt, wanneer iemand ervan afvalt.", "Lev 22:11": "Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten.", "Dan 1:2": "En de Heere gaf Jojakim, de koning van Juda, in zijn hand, alsook een deel van de voorwerpen van het huis van God; en hij bracht ze naar
