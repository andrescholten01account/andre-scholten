d Abib is, als u de HEERE, uw God, pascha viert; want in de maand Abib heeft de HEERE, uw God, u bij nacht uit Egypteland uitgevoerd. Dan zult u de HEERE, uw God, het pascha slachten, schapen en runderen, in de plaats die de HEERE zal uitkiezen om Zijn Naam daar te doen wonen. U zult daarbij niets eten van het gedesemd; zeven dagen zult u daarbij ongezuurde broden eten, brood van de ellende (want u bent in haast uit Egypteland getrokken), opdat u gedenkt aan de dag van uw uittrekken uit Egypteland, alle dagen van uw leven.", "Jer 8:1": "In die tijd, spreekt de HEERE, zullen ze de beenderen van de koningen van Juda, en de beenderen van hun vorsten, en de beenderen van de priesters, en de beenderen van de profeten, en de beenderen van de inwoners van Jeruzalem, uit hun graven halen.", "Job 3:19": "De kleine en de grote is daar; en de knecht vrij van zijn heer.", "Openb 20:12": "En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken.", "Gen 17:23": "Toen nam Abraham zijn zoon Ismaël, en alle mannen die in zijn huis geboren waren, en alle die met zijn geld gekocht waren, alles wat mannelijk was onder de mensen van het huis van Abraham, en hij besneed het vlees van hun voorhuid, op diezelfde dag, zoals God met hem gesproken had.", "1 Kon 13:1-22": "En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken. En hij riep tegen het altaar, door het woord van de HEERE, en zei: Altaar, altaar, zo zegt de HEERE: Zie, er zal aan het huis van David een zoon geboren worden, wiens naam Josia zal zijn; die zal op u de priesters van de hoogten offeren, die op u roken, en men zal mensenbeenderen op u verbranden. En hij gaf op dezelfde dag een wonderteken, en zei: Dit is het wonderteken waarvan de HEERE gesproken heeft: Zie, het altaar zal vaneen scheuren, en de as die erop ligt, zal eraf gestort worden.", "2 Kon 11:19": "En hij nam de leiders van honderd, en de hoofdmannen, en de lijfwacht, en al het volk van het land; en zij brachten de koning af uit het huis van de HEERE, en kwamen door de weg van de poort van de lijfwacht naar het huis van de koning, en hij zat op de troon der koningen.", "Jer 19:5": "Want zij hebben de hoogten van Baäl gebouwd, om hun zonen met vuur te verbranden, aan Baäl tot brandoffers; wat Ik niet geboden heb, noch gesproken heb, noch in Mijn hart is opgekomen.", "Ps 51:13": "Verwerp mij niet van Uw aangezicht, en neem Uw Heilige Geest niet van mij.", "Richt 16:18": "Toen Delila nu zag, dat hij haar zijn hele hart bekend had gemaakt, zond zij mensen weg, en riep de vorsten van de Filistijnen, en zei: Komt ditmaal, want hij heeft mij zijn hele hart bekendgemaakt. En de vorsten van de Filistijnen kwamen naar haar toe, en brachten dat geld in hun hand.", "Jer 7:18": "De kinderen rapen hout, en de vaders steken het vuur aan, en de vrouwen kneden het deeg, om koeken te maken voor de koningin van de hemel, en drankoffers te offeren aan andere goden, om Mij verdriet aan te doen.", "Deut 9:13": "Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.", "Ezech 16:17": "Daarbij hebt u de voorwerpen van uw sieraad genomen, van Mijn goud en van Mijn zilver, dat Ik u gegeven had, en u hebt zich mannenbeelden gemaakt, en u hebt daarmee gehoereerd.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "2 Kron 36:1": "Toen nam het volk van het land Joahaz, de zoon van Josia, en zij maakten hem koning in de plaats van zijn vader, te Jeruzalem.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de t de=\"H842\">grove</span> from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H6939\">Kidron,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> it at the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H6939\">Kidron,</span> and stamped it <span class=\"wl wl-kjv\" data-code=\"H1854\">small</span> to <span class=\"wl wl-kjv\" data-code=\"H6083\">powder,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> the <span class=\"wl wl-kjv\" data-code=\"H6083\">powder</span> thereof upon the <span class=\"wl wl-kjv\" data-code=\"H6913\">graves</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>", "7": "And he brake <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of the <span class=\"wl wl-kjv\" data-code=\"H6945\">sodomites,</span> that were by the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> where the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> <span class=\"wl wl-kjv\" data-code=\"H707\">wove</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">hangings</span> for the <span class=\"wl wl-kjv\" data-code=\"H842\">grove.</span>", "8": "And he <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> all the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> where the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> had burned <span class=\"wl wl-kjv\" data-code=\"H6999\">incense,</span> from <span class=\"wl wl-kjv\" data-code=\"H1387\">Geba</span> to <span class=\"wl wl-kjv\" data-code=\"H884\">Beersheba,</span> and brake <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> that were in the entering <span class=\"wl wl-kjv\" data-code=\"H6607\">in</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">governor</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> which were on a <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> left <span class=\"wl wl-kjv\" data-code=\"H8040\">hand</span> at the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span>", "9": "Nevertheless the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> of the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> came not <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> but they did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of the unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren.</span>", "10": "And he <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> <span class=\"wl wl-kjv\" data-code=\"H8612\">Topheth,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H2011\">Hinnom,</span> that no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> might make his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> or his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> to pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> to <span class=\"wl wl-kjv\" data-code=\"H4432\">Molech.</span>", "11": "And he took <span class=\"wl wl-kjv\" data-code=\"H7673\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun,</span> at the entering <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> by the <span class=\"wl wl-kjv\" data-code=\"H3957\">chamber</span> of <span class=\"wl wl-kjv\" data-code=\"H5419\">Nathanmelech</span> the <span class=\"wl wl-kjv\" data-code=\"H5631\">chamberlain,</span> which was in the <span class=\"wl wl-kjv\" data-code=\"H6503\">suburbs,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> the <span class=\"wl wl-kjv\" data-code=\"H4818\">chariots</span> of the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire.</span>", "12": "And the <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> that were on the <span class=\"wl wl-kjv\" data-code=\"H1406\">top</span> of the upper <span class=\"wl wl-kjv\" data-code=\"H5944\">chamber</span> of <span class=\"wl wl-kjv\" data-code=\"H271\">Ahaz,</span> which the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> which <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> in the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2691\">courts</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> did the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> beat <span class=\"wl wl-kjv\" data-code=\"H5422\">down,</span> and brake them <span class=\"wl wl-kjv\" data-code=\"H7323\">down</span> from thence, and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> of them into the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H6939\">Kidron.</span>", "13": "And the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> that were <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> which were on the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of <span class=\"wl wl-kjv\" data-code=\"H4889\">corruption,</span> which <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had <span class=\"wl wl-kjv\" data-code=\"H1129\">builded</span> for <span class=\"wl wl-kjv\" data-code=\"H6253\">Ashtoreth</span> the <span class=\"wl wl-kjv\" data-code=\"H8251\">abomination</span> of the <span class=\"wl wl-kjv\" data-code=\"H6722\">Zidonians,</span> and for <span class=\"wl wl-kjv\" data-code=\"H3645\">Chemosh</span> the <span class=\"wl wl-kjv\" data-code=\"H8251\">abomination</span> of the <span class=\"wl wl-kjv\" data-code=\"H4124\">Moabites,</span> and for <span class=\"wl wl-kjv\" data-code=\"H4445\">Milcom</span> the <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> did the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2930\">defile.</span>", "14": "And he brake in <span class=\"wl wl-kjv\" data-code=\"H7665\">pieces</span> the <span class=\"wl wl-kjv\" data-code=\"H4676\">images,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H842\">groves,</span> and <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> their <span class=\"wl wl-kjv\" data-code=\"H4725\">places</span> with the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men.</span>", "15": "Moreover the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> that was at <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> and the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> which <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5028\">Nebat,</span> who made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> both that <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> and the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> he brake <span class=\"wl wl-kjv\" data-code=\"H5422\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H1854\">stamped</span> it small to <span class=\"wl wl-kjv\" data-code=\"H6083\">powder,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> the <span class=\"wl wl-kjv\" data-code=\"H842\">grove.</span>", "16": "And as <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> himself, he <span class=\"wl wl-kjv\" data-code=\"H7200\">spied</span> the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchres</span> that were there in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchres,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> them upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and <span class=\"wl wl-kjv\" data-code=\"H2930\">polluted</span> it, according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> which the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed,</span> who <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">words.</span>", "17": "Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What <span class=\"wl wl-kjv\" data-code=\"H6725\">title</span> is <span class=\"wl wl-kjv\" data-code=\"H1975\">that</span> that I <span class=\"wl wl-kjv\" data-code=\"H7200\">see?</span> And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H559\">told</span> him, It is the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchre</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">things</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> against the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel.</span>", "18": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let him <span class=\"wl wl-kjv\" data-code=\"H3240\">alone;</span> let no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5128\">move</span> his <span class=\"wl wl-kjv\" data-code=\"H6106\">bones.</span> So they let his <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">alone,</span> with the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> that came <span class=\"wl wl-kjv\" data-code=\"H935\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span>", "19": "And all the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> also of the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> which the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> to provoke the LORD to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger,</span> <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> took <span class=\"wl wl-kjv\" data-code=\"H5493\">away,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> to them according to all the <span class=\"wl wl-kjv\" data-code=\"H4639\">acts</span> that he had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel.</span>", "20": "And he <span class=\"wl wl-kjv\" data-code=\"H2076\">slew</span> all the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> of the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> that were there upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> <span class=\"wl wl-kjv\" data-code=\"H120\">men's</span> <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> upon them, and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>", "21": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">Keep</span> the <span class=\"wl wl-kjv\" data-code=\"H6453\">passover</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> as it is <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of this <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant.</span>", "22": "Surely there was not <span class=\"wl wl-kjv\" data-code=\"H6213\">holden</span> such a <span class=\"wl wl-kjv\" data-code=\"H6453\">passover</span> from the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of the <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> that <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> nor in all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> nor of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span>", "23": "But in the <span class=\"wl wl-kjv\" data-code=\"H8083\">eighteenth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah,</span> wherein this <span class=\"wl wl-kjv\" data-code=\"H6453\">passover</span> was <span class=\"wl wl-kjv\" data-code=\"H6213\">holden</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>", "24": "Moreover the workers with familiar <span class=\"wl wl-kjv\" data-code=\"H178\">spirits,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3049\">wizards,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8655\">images,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1544\">idols,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H8251\">abominations</span> that were <span class=\"wl wl-kjv\" data-code=\"H7200\">spied</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> did <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> put <span class=\"wl wl-kjv\" data-code=\"H1197\">away,</span> const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.

  } catch (e) { cache[code] = null; }
  return cache[code];
}

  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
