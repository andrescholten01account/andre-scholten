as","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen zond de koning boden, en tot hem verzamelden zich alle oudsten van Juda en Jeruzalem.","2":"En de koning ging op naar het huis van de HEERE, en met hem alle mannen van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van de kleinste tot de grootste; en hij las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was.","3":"De koning nu stond bij de pilaar, en sloot een verbond voor het aangezicht van de HEERE, om de HEERE na te wandelen, en Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen met heel zijn hart en met heel zijn ziel te houden, om de woorden van dit verbond te bevestigen, die in dit boek geschreven zijn. En heel het volk stond in dit verbond.","4":"En de koning gebood de hogepriester Hilkia, en de priesters van de tweede rang, en de bewakers van de drempel, dat zij uit de tempel van de HEERE al het gereedschap, dat voor Baäl, en voor het beeld van het bos en voor heel het leger van de hemel gemaakt was, naar buiten zouden brengen; en hij verbrandde dat buiten Jeruzalem in de velden van Kidron, en liet het stof daarvan naar Beth-el brengen.","5":"Daartoe schafte hij de afgodspriesters af, die de koningen van Juda aangesteld hadden, opdat men zou roken op de hoogten, in de steden van Juda, en rondom Jeruzalem, alsook hen die voor Baäl, de zon, en de maan, en de andere planeten, en heel het leger van de hemel rookten.","6":"Hij bracht ook het beeld van het bos weg uit het huis van de HEERE, buiten Jeruzalem, naar de beek Kidron, en verbrandde het bij de beek Kidron, en vergruisde het tot stof; en hij wierp het stof daarvan op de graven van de kinderen van het volk.","7":"Daartoe brak hij de huizen van de schandjongens af, die bij het huis van de HEERE waren, waar de vrouwen huisjes voor het beeld van het bos weefden.","8":"En hij bracht al de priesters uit de steden van Juda, en verontreinigde de hoogten, waar die priesters gerookt hadden, van Geba af tot Berseba toe; en hij brak de hoogten van de poorten af, ook die welke bij de deur van de poort van Jozua, de leider van de stad, was, welke aan iemands linkerhand lag, als men de stadspoort binnenging.","9":"Doch de priesters van de hoogten offerden niet op het altaar van de HEERE te Jeruzalem; maar zij aten ongezuurde broden te midden van hun broeders.","10":"Hij verontreinigde ook Thofeth, dat in het dal van de kinderen van Hinnom is, opdat niemand zijn zoon of zijn dochter voor de Molech door het vuur zou laten gaan.","11":"En hij schafte de paarden af, die de koningen van Juda voor de zon gesteld hadden, bij de ingang van het huis van de HEERE, tot de kamer van Nathan-melech, de hoveling, die in Parvarim was; en de wagens van de zon verbrandde hij met vuur.","12":"Verder brak de koning de altaren af die op het dak van de opperzaal van Achaz waren, die de koningen van Juda gemaakt hadden, alsook de altaren die Manasse in de twee voorhoven van het huis van de HEERE gemaakt had; en hij verbrijzelde ze vandaar, en wierp het stof daarvan in de beek Kidron.","13":"De hoogten ook, die vooraan bij Jeruzalem waren, die aan de rechterhand van de berg Mashith lagen, die Salomo, de koning van Israël, gebouwd had voor Astoreth, het verfoeisel van de Sidoniërs, en voor Kamos, het verfoeisel van de Moabieten, en voor Milchom, de gruwel van de kinderen van Ammon, verontreinigde de koning.","14":"Insgelijks brak hij de opgerichte beelden, en roeide de bossen uit; en hij vulde hun plaats met mensenbeenderen.","15":"Daartoe ook het altaar dat te Beth-el was, en de hoogte, die Jerobeam, de zoon van Nebat, die Israël liet zondigen, gemaakt had; zowel dat altaar als die hoogte brak hij af; ja, hij verbrandde de hoogte, hij vergruisde ze tot stof, en hij verbrandde het bos.","16":"En toen Josia zich omkeerde, zag hij de graven die daar op de berg waren, en hij zond boden, en nam de beenderen uit de graven, en verbrandde ze op dat altaar, en verontreinigde dat; naar het woord van de HEERE, dat de man van God had uitgeroepen, die deze woorden uitriep.","17":"Verder zei hij: Wat is dat voor een grafteken, dat ik zie? En de mannen van de stad zeiden tegen hem: Het is het graf van de man van God, die uit Juda kwam, en deze dingen, die u tegen dit altaar van Beth-el gedaan hebt, uitgeroepen heeft.","18":"En hij zei: Laat hem liggen, dat niemand zijn beenderen verroert. Zo lieten zij zijn beenderen met rust, met de beenderen van de profeet die uit Samaria gekomen was.","19":"Daartoe nam Josia ook al de huizen van de hoogten weg, die in de steden van Samaria waren, die de koningen van Israël gemaakt hadden om de Heere tot toorn te verwekken; en hij deed daarmee naar alle daden die hij te Beth-el gedaan had.","20":"En hij slachtte al de priesters van de hoogten die daar waren, op de altaren, en verbrandde mensenbeenderen op die altaren. Daarna keerde hij terug naar Jeruzalem.","21":"En de koning gebood heel het volk en zei: Houd voor de HEERE, uw God, pascha, zoals in dit boek van het verbond geschreven is.","22":"Want zoals dit pascha was er geen gehouden, vanaf de dagen van de richters die Israël gericht hadden, noch in al de dagen van de koningen van Israël, noch van de koningen van Juda.","23":"Maar in het achttiende jaar van koning Josia, werd dit pascha voor de HEERE te Jeruzalem gehouden.","24":"En ook deed Josia de waarzeggers weg, en de duivelskunstenaars, en de terafim, en de drekgoden, en alle verfoeiselen die in het land van Juda en in Jeruzalem gezien werden; opdat hij de woorden van de wet zou bevestigen, die geschreven waren in het boek dat de priester Hilkia in het huis van de HEERE gevonden had.","25":"En voor hem was er geen koning zijns gelijke, die zich tot de HEERE, met heel zijn hart, en met heel zijn ziel, en met heel zijn kracht, naar heel de wet van Mozes, bekeerd had; en na hem stond zijns gelijke niet op.","26":"Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.","27":"En de HEERE zei: Ik zal Juda ook van Mijn aangezicht wegdoen, zoals Ik Israël weggedaan heb; en Ik zal deze stad Jeruzalem verwerpen, die Ik verkoren heb, en het huis waarvan Ik gezegd heb: Mijn Naam zal daar zijn.","28":"Het overige nu van de geschiedenis van Josia, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda?","29":"In zijn dagen trok Farao Necho, de koning van Egypte, op tegen de koning van Assyrië, naar de rivier de Frath; en koning Josia trok hem tegemoet, en Necho doodde hem te Megiddo, toen hij hem gezien had.","30":"En zijn knechten voerden hem dood op een wagen van Megiddo, en brachten hem naar Jeruzalem, en begroeven hem in zijn graf; en het volk van het land nam Joahaz, de zoon van Josia, en zalfde hem, en maakte hem koning in de plaats van zijn vader.","31":"Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem; en de naam van zijn moeder was Hamutal, de dochter van Jeremia, van Libna.","32":"En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vaderen gedaan hadden.","33":"Doch Farao Necho liet hem gevangenzetten te Ribla in het land van Hamath, opdat hij te Jeruzalem niet regeren zou; en hij legde het land een boete op van honderd talenten van het zilver en een talent van het goud.","34":"Ook maakte Farao Necho Eljakim, de zoon van Josia, koning, in de plaats van zijn vader Josia, en veranderde zijn naam in Jojakim; maar Joahaz nam hij mee, en hij kwam in Egypte, en stierf daar.","35":"En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.","36":"Vijfentwintig jaar was Jojakim oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem; en de naam van zijn moeder was Zebudda, een dochter van Pedaja, van Ruma.","37":"En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vaders gedaan hadden."},"SV":{"1":"Toen zond de koning henen, en tot hem verzamelden al die oudsten van Juda en Jeruzalem.","2":"En de koning ging op in het huis des HEEREN, en met hem alle man van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van den minste tot den meeste; en hij las voor hun oren al de woorden van het boek des verbonds, dat in het huis des HEEREN gevonden was.","3":"De koning nu stond aan den pilaar, en maakte een verbond voor des HEEREN aangezicht, om den HEERE na te wandelen, en Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen met ganser harte en met ganser ziele te houden, bevestigende de woorden dezes verbonds, die in dit boek geschreven zijn. En het ganse volk stond in dit verbond.","4":"En de koning gebood den hogepriester Hilkia, en den priesteren der tweede ordening, en den dorpelbewaarders, dat zij uit den tempel des HEEREN alle gereedschap, dat voor Baäl, en voor het *beeld* *van* *het* bos, en voor al het heir des hemels gemaakt was, uitbrengen zouden; en hij verbrandde dat buiten Jeruzalem in de velden van Kidron, en liet het stof daarvan naar Beth-el dragen.","5":"Daartoe schafte hij de Chemarim af, die de koningen van Juda gesteld hadden, opdat men roken zou op de hoogten, in de steden van Juda, en rondom Jeruzalem, mitsgaders, die voor Baäl, de zon, en de maan, en de *andere* planeten, en al het heir des hemels rookten.","6":"Hij bracht ook het *beeld* *van* *het* bos uit het huis des HEEREN weg, buiten Jeruzalem, tot de beek Kidron, en verbrandde het aan de beek Kidron, en vergruisde het tot stof; en hij wierp het stof daarvan op de graven der kinderen des volks.","7":"Daartoe brak hij de huizen der schandjongens af, die aan het huis des HEEREN waren, alwaar de vrouwen huisjes voor het *beeld* *van* *het* bos weefden.","8":"En hij bracht al de priesters uit de steden van Juda, en verontreinigde de hoogten, alwaar die priesters gerookt hadden, van Geba af tot Ber-seba toe; en hij brak de hoogten der poorten af, *ook* die aan de deur der poort van Jozua, den overste der stad, was, welke aan iemands linkerhand was, in de stadspoort *gaande*.","9":"Doch de priesters der hoogten offerden niet op het altaar des HEEREN te Jeruzalem; maar zij aten ongezuurde *broden* in het midden van hun broederen.","10":"Hij verontreinigde ook Thofeth, dat in het dal der kinderen van Hinnom is, opdat niemand zijn zoon of zijn dochter voor den Molech door het vuur deed gaan.","11":"En hij schafte de paarden af, die de koningen van Juda voor de zon gesteld hadden, van den ingang van het huis des HEEREN, tot de kamer van Nathan-melech, den hoveling, die in Parvarim was; en de wagenen der zon verbrandde hij met vuur.","12":"Verder de altaren die op het dak der opperzaal van Achaz waren, die de koningen van Juda gemaakt hadden, mitsgaders de altaren, die Manasse in de twee voorhoven van het huis des HEEREN gemaakt had, brak de koning af; en hij verbrijzelde ze van daar, en wierp het stof daarvan in de beek Kidron.","13":"De hoogten ook, die vooraan Jeruzalem waren, dewelke waren ter rechterhand van den berg Mashith, die Salomo, de koning van Israël, voor Astoreth, het verfoeisel der Sidoniërs, en voor Kamos, het verfoeisel der Moabieten, en voor Milchom, den gruwel der kinderen Ammons, gebouwd had, verontreinigde de koning.","14":"Insgelijks brak hij de opgerichte beelden, en roeide de bossen uit; en hij vervulde hun plaats met mensenbeenderen.","15":"Daartoe ook het altaar, dat te Beth-el was, *en* de hoogte, die Jerobeam, de zoon van Nebat, dewelke Israël zondigen deed, gemaakt had; te zamen dat altaar en die hoogte brak hij af; ja, hij verbrandde de hoogte, hij vergruisde ze tot stof, en hij verbrandde het bos.","16":"En als Josia zich omkeerde, zag hij de graven, die daar op den berg waren, en zond henen, en nam de beenderen uit de graven, en verbrandde ze op dat altaar, en verontreinigde dat; naar het woord des HEEREN, dat de man Gods uitgeroepen had, die deze woorden uitriep.","17":"Verder zeide hij: Wat is dat voor een grafteken, dat ik zie? En de lieden der stad zeiden tot hem: Het is het graf van den man Gods, die uit Juda kwam, en deze dingen, die gij tegen dit altaar van Beth-el gedaan hebt, uitgeroepen heeft.","18":"En hij zeide: Laat hem liggen, dat niemand zijn beenderen verroere. Zo bevrijdden zij zijn beenderen, met de beenderen van den profeet, die uit Samaria gekomen was.","19":"Daartoe nam Josia ook weg al de huizen der hoogten, die in de steden van Samaria waren, die de koningen van Israël gemaakt hadden, om *den* Heere tot toorn te verwekken; en hij deed dezelve naar al de daden, die hij te Beth-el gedaan had.","20":"En hij slachtte al de priesteren der hoogten, die daar waren, op de altaren, en verbrandde mensenbeenderen op dezelve. Daarna keerde hij weder naar Jeruzalem.","21":"En de koning gebood het ganse volk, zeggende: Houdt den HEERE, uw God, pascha, gelijk in dit boek des verbonds geschreven is.","22":"Want gelijk dit pascha was er geen gehouden, van de dagen der richteren af, die Israël gericht hadden, noch in al de dagen der koningen van Israël, noch der koningen van Juda.","23":"Maar in het achttiende jaar van den koning Josia, werd dit pascha den HEERE te Jeruzalem gehouden.","24":"En ook deed Josia weg de waarzeggers, en de duivelskunstenaars, en de terafim, en de drekgoden, en alle verfoeiselen, die in het land van Juda en in Jeruzalem gezien werden; opdat hij bevestigde de woorden der wet, die geschreven waren in het boek, dat de priester Hilkia in het huis des HEEREN gevonden had.","25":"En voor hem was geen koning zijns gelijke, die zich tot den HEERE, met zijn ganse hart, en met zijn ganse ziel, en met zijn ganse kracht, naar al de wet van Mozes, bekeerd had; en na hem stond zijns gelijke niet op.","26":"Nochtans keerde zich de HEERE van den brand Zijns groten toorns niet af, waarmede Zijn toorn brandde tegen Juda, om al de tergingen, waarmede Manasse Hem getergd had.","27":"En de HEERE zeide: Ik zal Juda ook van Mijn aangezicht wegdoen, gelijk als Ik Israël weggedaan heb; en Ik zal deze stad Jeruzalem verwerpen, die Ik verkoren heb, en het huis, waarvan Ik gezegd heb: Mijn Naam zal daar wezen.","28":"Het overige nu der geschiedenissen van Josia, en al wat hij gedaan heeft, zijn die niet geschreven in het boek der kronieken der koningen van Juda?","29":"In zijn dagen toog Farao Necho, de koning van Egypte, op tegen den koning van Assyrië, naar de rivier Frath; en de koning Josia toog hem tegemoet, en hij doodde hem te Megiddo, als hij hem gezien had.","30":"En zijn knechten voerden hem dood op een wagen van Megiddo, en brachten hem te Jeruzalem, en begroeven hem in zijn graf; en het volk des lands nam Joahaz, den zoon van Josia, en zalfden hem, en maakten hem koning in zijns vaders plaats.","31":"Drie en twintig jaren was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem; en de naam zijner moeder was Hamutal, de dochter van Jeremia, van Libna.","32":"En hij deed dat kwaad was in de ogen des HEEREN, naar alles, wat zijn vaderen gedaan hadden.","33":"Doch Farao Necho liet hem binden te Ribla in het land van Hamath, opdat hij te Jeruzalem niet regeren zou; en hij leide het land een boete op van honderd talenten zilvers en een talent gouds.","34":"Ook maakte Farao Necho Eljakim, den zoon van Josia, koning, in de plaats van zijn vader Josia, en veranderde zijn naam in Jojakim; maar Joahaz nam hij mede, en hij kwam in Egypte, en stierf aldaar.","35":"En Jojakim gaf dat zilver en dat goud aan Farao; doch hij schatte het land, om dat geld naar het bevel van Farao te geven; een ieder naar zijn schatting eiste hij het zilver en goud af van het volk des lands, om aan Farao Necho te geven.","36":"Vijf en twintig jaren was Jojakim oud, toen hij koning werd, en regeerde elf jaren te Jeruzalem; en de naam zijner moeder was Zebudda, een dochter van Pedaja, van Ruma.","37":"En hij deed dat kwaad was in de ogen des HEEREN, naar alles, wat zijn vaders gedaan hadden."},"KJV":{"1":"And the king sent, and they gathered unto him all the elders of Judah and of Jerusalem.","2":"And the king went up into the house of the LORD, and all the men of Judah and all the inhabitants of Jerusalem with him, and the priests, and the prophets, and all the people, both small and great: and he read in their ears all the words of the book of the covenant which was found in the house of the LORD.","3":"And the king stood by a pillar, and made a covenant before the LORD, to walk after the LORD, and to keep his commandments and his testimonies and his statutes with all their heart and all their soul, to perform the words of this covenant that were written in this book. And all the people stood to the covenant.","4":"And the king commanded Hilkiah the high priest, and the priests of the second order, and the keepers of the door, to bring forth out of the temple of the LORD all the vessels that were made for Baal, and for the grove, and for all the host of heaven: and he burned them without Jerusalem in the fields of Kidron, and carried the ashes of them unto Bethel.","5":"And he put down the idolatrous priests, whom the kings of Judah had ordained to burn incense in the high places in the cities of Judah, and in the places round about Jerusalem; them also that burned incense unto Baal, to the sun, and to the moon, and to the planets, and to all the host of heaven.","6":"And he brought out the grove from the house of the LORD, without Jerusalem, unto the brook Kidron, and burned it at the brook Kidron, and stamped it small to powder, and cast the powder thereof upon the graves of the children of the people.","7":"And he brake down the houses of the sodomites, that were by the house of the LORD, where the women wove hangings for the grove.","8":"And he brought all the priests out of the cities of Judah, and defiled the high places where the priests had burned incense, from Geba to Beersheba, and brake down the high places of the gates that were in the entering in of the gate of Joshua the governor of the city, which were on a man's left hand at the gate of the city.","9":"Nevertheless the priests of the high places came not up to the altar of the LORD in Jerusalem, but they did eat of the unleavened bread among their brethren.","10":"And he defiled Topheth, which is in the valley of the children of Hinnom, that no man might make his son or his daughter to pass through the fire to Molech.","11":"And he took away the horses that the kings of Judah had given to the sun, at the entering in of the house of the LORD, by the chamber of Nathanmelech the chamberlain, which was in the suburbs, and burned the chariots of the sun with fire.","12":"And the altars that were on the top of the upper chamber of Ahaz, which the kings of Judah had made, and the altars which Manasseh had made in the two courts of the house of the LORD, did the king beat down, and brake them down from thence, and cast the dust of them into the brook Kidron.","13":"And the high places that were before Jerusalem, which were on the right hand of the mount of corruption, which Solomon the king of Israel had builded for Ashtoreth the abomination of the Zidonians, and for Chemosh the abomination of the Moabites, and for Milcom the abomination of the children of Ammon, did the king defile.","14":"And he brake in pieces the images, and cut down the groves, and filled their places with the bones of men.","15":"Moreover the altar that was at Bethel, and the high place which Jeroboam the son of Nebat, who made Israel to sin, had made, both that altar and the high place he brake down, and burned the high place, and stamped it small to powder, and burned the grove.","16":"And as Josiah turned himself, he spied the sepulchres that were there in the mount, and sent, and took the bones out of the sepulchres, and burned them upon the altar, and polluted it, according to the word of the LORD which the man of God proclaimed, who proclaimed these words.","17":"Then he said, What title is that that I see? And the men of the city told him, It is the sepulchre of the man of God, which came from Judah, and proclaimed these things that thou hast done against the altar of Bethel.","18":"And he said, Let him alone; let no man move his bones. So they let his bones alone, with the bones of the prophet that came out of Samaria.","19":"And all the houses also of the high places that were in the cities of Samaria, which the kings of Israel had made to provoke the LORD to anger, Josiah took away, and did to them according to all the acts that he had done in Bethel.","20":"And he slew all the priests of the high places that were there upon the altars, and burned men's bones upon them, and returned to Jerusalem.","21":"And the king commanded all the people, saying, Keep the passover unto the LORD your God, as it is written in the book of this covenant.","22":"Surely there was not holden such a passover from the days of the judges that judged Israel, nor in all the days of the kings of Israel, nor of the kings of Judah;","23":"But in the eighteenth year of king Josiah, wherein this passover was holden to the LORD in Jerusalem.","24":"Moreover the workers with familiar spirits, and the wizards, and the images, and the idols, and all the abominations that were spied in the land of Judah and in Jerusalem, did Josiah put away, that he might perform the words of the law which were written in the book that Hilkiah the priest found in the house of the LORD.","25":"And like unto him was there no king before him, that turned to the LORD with all his heart, and with all his soul, and with all his might, according to all the law of Moses; neither after him arose there any like him.","26":"Notwithstanding the LORD turned not from the fierceness of his great wrath, wherewith his anger was kindled against Judah, because of all the provocations that Manasseh had provoked him withal.","27":"And the LORD said, I will remove Judah also out of my sight, as I have removed Israel, and will cast off this city Jerusalem which I have chosen, and the house of which I said, My name shall be there.","28":"Now the rest of the acts of Josiah, and all that he did, are they not written in the book of the chronicles of the kings of Judah?","29":"In his days Pharaohnechoh king of Egypt went up against the king of Assyria to the river Euphrates: and king Josiah went against him; and he slew him at Megiddo, when he had seen him.","30":"And his servants carried him in a chariot dead from Megiddo, and brought him to Jerusalem, and buried him in his own sepulchre. And the people of the land took Jehoahaz the son of Josiah, and anointed him, and made him king in his father's stead.","31":"Jehoahaz was twenty and three years old when he began to reign; and he reigned three months in Jerusalem. And his mother's name was Hamutal, the daughter of Jeremiah of Libnah.","32":"And he did that which was evil in the sight of the LORD, according to all that his fathers had done.","33":"And Pharaohnechoh put him in bands at Riblah in the land of Hamath, that he might not reign in Jerusalem; and put the land to a tribute of an hundred talents of silver, and a talent of gold.","34":"And Pharaohnechoh made Eliakim the son of Josiah king in the room of Josiah his father, and turned his name to Jehoiakim, and took ➔ Jehoahaz away: and he came to Egypt, and died there.","35":"And Jehoiakim gave the silver and the gold to Pharaoh; but he taxed the land to give the money according to the commandment of Pharaoh: he exacted the silver and the gold of the people of the land, of every one according to his taxation, to give it unto Pharaohnechoh.","36":"Jehoiakim was twenty and five years old when he began to reign; and he reigned eleven years in Jerusalem. And his mother's name was Zebudah, the daughter of Pedaiah of Rumah.","37":"And he did that which was evil in the sight of the LORD, according to all that his fathers had done."}},"tsk":{"1":[{"kopje":"de koning","refs":["Deut 31:28","2 Sam 6:1","2 Kron 29:20","2 Kron 30:2","2 Kron 34:29","2 Kron 34:30-33"]}],"2":[{"kopje":"van de kleinste tot de grootste","refs":["Gen 19:11","1 Sam 5:9","1 Sam 30:2","2 Kron 15:13","Est 1:5","Job 3:19","Ps 115:13","Hand 26:22","Openb 20:12"]},{"kopje":"hij las","refs":["Deut 31:10-13","2 Kron 17:9","Neh 8:2-9","Neh 9:3","Neh 13:1"]},{"kopje":"het boek","refs":["2 Kon 22:8","Deut 31:26","1 Kon 8:9"]}],"3":[{"kopje":"stond","refs":["2 Kon 11:14","2 Kon 11:17","2 Kron 23:13","2 Kron 34:31","2 Kron 34:32"]},{"kopje":"sloot een verbond","refs":["Ex 24:7","Ex 24:8","D ss=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> and the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> which <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5028\">Nebat,</span> who made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> both that <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> and the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> he brake <span class=\"wl wl-kjv\" data-code=\"H5422\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H1854\">stamped</span> it small to <span class=\"wl wl-kjv\" data-code=\"H6083\">powder,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> the <span class=\"wl wl-kjv\" data-code=\"H842\">grove.</span>","16":"And as <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> himself, he <span class=\"wl wl-kjv\" data-code=\"H7200\">spied</span> the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchres</span> that were there in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchres,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> them upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and <span class=\"wl wl-kjv\" data-code=\"H2930\">polluted</span> it, according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> which the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed,</span> who <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">words.</span>","17":"Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What <span class=\"wl wl-kjv\" data-code=\"H6725\">title</span> is <span class=\"wl wl-kjv\" data-code=\"H1975\">that</span> that I <span class=\"wl wl-kjv\" data-code=\"H7200\">see?</span> And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H559\">told</span> him, It is the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchre</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">things</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> against the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel.</span>","18":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let him <span class=\"wl wl-kjv\" data-code=\"H3240\">alone;</span> let no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5128\">move</span> his <span class=\"wl wl-kjv\" data-code=\"H6106\">bones.</span> So they let his <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">alone,</span> with the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> that came <span class=\"wl wl-kjv\" data-code=\"H935\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span>","19":"And all the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> also of the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> which the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> to provoke the LORD to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger,</span> <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> took <span class=\"wl wl-kjv\" data-code=\"H5493\">away,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> to them according to all the <span class=\"wl wl-kjv\" data-code=\"H4639\">acts</span> that he had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel.</span>","20":"And he <span class=\"wl wl-kjv\" data-code=\"H2076\">slew</span> all the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> of the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> that were there upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> <span class=\"wl wl-kjv\" data-code=\"H120\">men's</span> <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> upon them, and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","21":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> all \" data-code=\"H310\">after</span> him <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> there any like him.","26":"Notwithstanding the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">turned</span> not from the <span class=\"wl wl-kjv\" data-code=\"H2740\">fierceness</span> of his <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H639\">wrath,</span> wherewith his <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> because of all the <span class=\"wl wl-kjv\" data-code=\"H3708\">provocations</span> that <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> had <span class=\"wl wl-kjv\" data-code=\"H3707\">provoked</span> him withal.","27":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5493\">remove</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> also out of my <span class=\"wl wl-kjv\" data-code=\"H6440\">sight,</span> as I have <span class=\"wl wl-kjv\" data-code=\"H5493\">removed</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and will cast <span class=\"wl wl-kjv\" data-code=\"H3988\">off</span> this <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> which I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of which I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> shall be there.","28":"Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class= jv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H2080\">Zebudah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6305\">Pedaiah</span> of <span class=\"wl wl-kjv\" data-code=\"H7316\">Rumah.</span>","37":"And he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> according to all that his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zond de koning henen,","tekst":"Te weten, boden; welken hij last gaf de oudsten bijeen te roepen."},{"catchword":"oudsten","tekst":"Versta degenen, die in de regering en in het leerambt boven anderen gesteld waren. Zie Exo 3:16; Lev 4:15."}],"2":[{"catchword":"alle man van Juda,","tekst":"Versta, de voornaamsten."},{"catchword":"profeten,","tekst":"Sommigen verstaan door dezen: Jeremia, Zefanja en Uria; die in dezen tijd geleefd hebben. Anderen de discipelen der profeten, of de schriftgeleerden en ervarenen in de wet des Heeren."}],"3":[{"catchword":"pilaar,","tekst":"Zie boven, 2Ki 11:14."},{"catchword":"voor des HEEREN aangezicht,","tekst":"Dat is, in het voorhof des volks, dat voor het voorhof der priesters, voor aan den tempel des Heeren was, waarin de ark des verbonds was, boven welke zich de Heere openbaarde. Zie Lev 1:3."},{"catchword":"den HEERE na te wandelen,","tekst":"Dat is, in de wegen des Heeren te wandelen. Wat dit is, zie 1Ki 11:33, en de woorden hier volgende."},{"catchword":"met ganser harte","tekst":"Zie Deu 6:5."},{"catchword":"bevestigende","tekst":"Zie Deu 27:26."},{"catchword":"stond in dit verbond","tekst":"Dat is, hield zich daaraan, en was daarmede tevreden. Alzo is ons verboden te staan in een kwade zaak, Ecc 8:3. Dat is, zich daaraan te houden en dezelve toe te staan."}],"4":[{"catchword":"tweede ordening,","tekst":"Deze priesters zijn onder den overpriester de voornaamste geweest."},{"catchword":"dorpelbewaarders,","tekst":"Te weten, van den tempel des Heeren. Alzo boven, 2Ki 22:4. Zie de aantekening."},{"catchword":"Kidron,","tekst":"Zie 1Ki 2:37."},{"catchword":"Beth-el dragen","tekst":"Een der steden, waar Jerobeam een gouden kalf had opgericht, 1Ki 12:29, en daardoor een poel van afgoderij; uit welke oorzaak zij Bethaven, dat is, een huis der boosheid, genoemd wordt, Hos 4:15, en Hos 10:5, en hier van Josia smadelijk onteerd wordt met de as der verbrande afgodische vaten daar uit te werpen."}],"5":[{"catchword":"Chemárim af,","tekst":"Een soort der afgodische priesters van Baäl; van welken zie ook Hos 10:5, en Zep 1:4. De naam chemarim komt van een woord, betekenende warm zijn, branden; idem, zwart worden; ook tezamen getrokken, gerimpeld en ingerold, hetwelk door den brand veroorzaakt wordt; vanwaar ook is bij de Chaldeën de betekenis van insluiten. Hieruit is het gevoelen der geleerden van deze benaming verscheiden. Velen menen dat deze Baäls-papen zo geheten werden, omdat hun orde was zwarte kleding te dragen; enigen omdat zij zwart en berookt uitzagen, vermits zij altijd met roken en offeren bezig waren; anderen, omdat zij zich in hun afgodendienst gelieten zeer vurig en brandend van ijver te wezen. Sommigen omdat zij zich uit een schijn der heiligheid opsloten, om zich van de wereld af te zonderen en alleen te leven, enz."}],"6":[{"catchword":"bos","tekst":"Hetwelk van den koning Manasse in den tempel gesteld was, boven, 2Ki 21:7."},{"catchword":"de beek Kidron,","tekst":"Anders, tot het dal Kidron. Alzo onder hier in vs.6."},{"catchword":"wierp het stof","tekst":"Te weten, tot verfoeiing aller gestorven afgodisten, en voorbeeldige waarschuwing der levenden."},{"catchword":"kinderen des volks","tekst":"Dat is, van de inwoners des lands, die afgodendienaars geweest waren. Vergelijk 2Ch 34:4, of der gemene lieden."}],"7":[{"catchword":"schandjongens","tekst":"Zie Deu 23:17."},{"catchword":"het huis des HEEREN waren,","tekst":"Versta, in het voorhof des volks, waar de afgodendienaars [zo men meent] hun woonplaatsjes hadden."},{"catchword":"huisjes voor het","tekst":"Versta, kapelletjes, of kabinetten en kasten, gemaakt van geweven, of genaaid en gestikt werk, waarin de afgodenbeeldjes stonden. Anderen verstaan zulke tenten, waarin de afgodendienaars hun schandelijke vuiligheden ter ere hunner afgoden tezamen bedreven."}],"8":[{"catchword":"priesters","tekst":"Namelijk, de afgodische."},{"catchword":"verontreinigde","tekst":"Te weten, mits die onbekwaam en onwaardig tot hun afgodendienst te maken."},{"catchword":"Geba","tekst":"Een stad in Benjamin, de noordpale des koninkrijks van Juda. Zie 1Ki 15:22."},{"catchword":"Ber-séba","tekst":"Gelegen in Juda, en de zuidpale van het gehele land Kanaän. Zie Gen 21:31."},{"catchword":"der poorten af,","tekst":"Dat is, die aan de poorten waren."},{"catchword":"van Jozua,","tekst":"Dat is, hij heeft zowel der geweldigen en oversten, als der armen en geringen afgoderij verhinderd."},{"catchword":"linkerhand","tekst":"Hebreeuws, de linkerhand eens mans; namelijk desgenen, die ter stadspoort inkwam."}],"9":[{"catchword":"offerden niet","tekst":"Of, kwamen niet op tot het altaar, enz. De zin is dat deze priesters, omdat zij den afgoden geofferd hadden, met hun nakomelingen verstoken waren van het priesterambt, als onwaardig daarvan zijnde, Eze 44:13, hoewel zij nochtans, omdat zij zich bekeerden, hun onderhoud hadden van de ongedesemde koeken, die de priesters alleen mochten eten, Lev 2:4, Lev 2:10, zijnde daarin den gebrekkelijken nakomelingen Aärons gelijk gemaakt; Lev 21:17, Lev 21:22."}],"10":[{"catchword":"verontreinigde","tekst":"Te weten, met aldaar mest, drek, dode en verrotte lichamen en alle vuiligheid te doen werpen."},{"catchword":"Thofeth,","tekst":"Een plaats bij de stad van Jeruzalem, in een schone en vermakelijke landouw gelegen, zo genaamd van het woord Toph, trommel; waar de afgodendienaars hun kinderen den afgod Molech offerden, doende hen door het vuur gaan, of ook geheel verbranden; tot welk einde zij gelegd werden in de armen van een gloeiend beeld, dat van binnen hol en vol vuur was. Alzo nu de kinderen door de pijn des brands groot getier maakten, zo heeft men een groot geluid met trommels gemaakt, opdat het geschrei derzelve van de ouders of vrienden niet zou gehoord worden. Vergelijk Lev 18:21; Jer 7:31."},{"catchword":"Hinnom is,","tekst":"De naam van een man, wiens kinderen deze plaats eertijds toebehoord had, zodat zij daarvan heet het Ge-Bene Hinnom, Jos 15:8, dat is, het dal der kinderen van Hinnom, of, Gehinnom, dat is, het dal van Hinnom, Neh 11:30. Van de zeer gruwelijke pijn des vuurs, die de kinderen der afgodendienaars daar geleden hebben, is de hel genoemd Gehenna, Mat 5:22, welke is een onuitblusselijk vuur, Mar 9:43."},{"catchword":"Molech","tekst":"Onder, 2Ki 13, genaamd Milkom. Zie Lev 18:21."}],"11":[{"catchword":"paarden af,","tekst":"Sommigen verstaan dit van levende paarden, die ter ere van de zon gehouden en gebruikt werden; want zekere mannen [alzo enigen menen] waren geordineerd om des morgens de opgaande zon met deze paarden van het huis des Heeren tot het huis van Nathan Melech in het gemoet te rijden, en die te groeten, te aanbidden en godsdienstiglijk te vereren. Anderen verstaan niet dan de beeltenissen dezer paarden en wagens."},{"catchword":"gesteld hadden,","tekst":"Of, gegeven hadden."},{"catchword":"kamer","tekst":"Dat is, tot het huis."},{"catchword":"Parvárim","tekst":"Of, in de voorsteden; te weten, der stad Davids, niet ver van den tempel gelegen. Het Hebreeuwse woord Parvarim nemen sommigen voor den naam ener plaats bij den tempel; doch wat het voor een plaats geweest is, is onbekend."},{"catchword":"zon verbrandde","tekst":"Dat is, ter ere van de zon, naar de wijze der heidenen gemaakt."}],"12":[{"catchword":"dak der opperzaal","tekst":"Zijnde daar gemaakt ter ere van het heir des hemels. Zie Jer 19:13; Zep 1:5."},{"catchword":"en wierp het stof","tekst":"Hetwelk geschiedde, eensdeels tot openbare versmading dezer afgodische overblijfselen, en anderdeels tot volkomen uitroeiing daarvan, opdat van dezelve niets zou overgelaten worden."}],"13":[{"catchword":"Mashith,","tekst":"Anders, des verdervers. Versta, den Olijfberg, gelegen bij Jeruzalem, hier genaamd de berg van Mashith; dat is, des verdervenden, of des verdervers, omdat de Joden zich daar door afgoderij verdierven. Anders heet hij de berg Mischah, dat is, der zalving, omdat daarop vele olijven wiessen, van welke de zalfolie gemaakt werd; zulks dat tussen beide de namen kleine ongelijkheid is in de letters, maar groot in de betekenis. Zie 1Ki 11:7."},{"catchword":"Astoreth,","tekst":"Deze naam met de twee volgende, Kamos en Milkom, zijn namen van afgodische beelden. Zie van Astoreth Jdg 2:13."},{"catchword":"Kamos,","tekst":"Zie 1Ki 11:7."},{"catchword":"Milchom,","tekst":"Zie Lev 18:21."}],"14":[{"catchword":"mensenbeenderen","tekst":"Die hij uit de graven der afgodendienaars liet halen, om daarmede de afgodische plaatsen te verontreinigen en afschuwelijk te maken. Vergelijk onder, vs.16, 20; idem, Eze 6:5."}],"16":[{"catchword":"dat altaar,","tekst":"Te weten, die te Bethel van Jerobeam opgericht was, vs.15."},{"catchword":"uitriep","tekst":"Dat is, voorzeide; te weten meer dan drie honderd jaren tevoren. Zie 1Ki 13:2, en vergelijk daarmede wat hier staat en onder, vs.20."}],"18":[{"catchword":"bevrijdden zij","tekst":"Dat zij namelijk niet verbrand werden op het altaar te Bethel, met de andere beenderen."},{"catchword":"profeet,","tekst":"Die begeerd had dat men hem bij den profeet van Juda begraven zou; 1Ki 13:31."},{"catchword":"Samaria","tekst":"Versta, niet de stad, maar het land van Samaria, waarin de stad Bethel gelegen was en deze profeet woonde, toen hij naar den profeet van Juda kwam, 1Ki 13:11; alzo is ook de naam Samaria voor het land genomen in vs.19."}],"19":[{"catchword":"steden","tekst":"Namelijk, die onder het gebied van het koninkrijk Juda gebracht waren."}],"20":[{"catchword":"slachtte","tekst":"Anders, offerde; dat is, hij doodde hen op de altaren; tot een bewijd dat hij niet alleen de afgoderij ten allerhoogste haatte, maar zelfs de plaatsen, waar zij gepleegd werd; die verontreinigende met daarop mensenbloed te vergieten en hun beenderen te verbranden. Versta dit van de priesters, die, naar Jerobeams instelling, uit het volk gemaakt waren, en in hun afgoderij verhard bleven. Zie 1Ki 12:31."}],"21":[{"catchword":"boek des verbonds","tekst":"Versta, het wetboek; waarvan zie, boven, 2Ki 22:8, enz. en hier vs.2, enz."}],"22":[{"catchword":"Want gelijk","tekst":"Anders, zekerlijk. Hier wordt reden gegeven, bewijzende dat des konings gebod zeer wel is achtervolgd geweest."},{"catchword":"van de dagen der richteren af,","tekst":"Welverstaande, die daarin niet gerekend zijn. Want 2Ch 35:18 staat, van de dagen Samuels, die de laatste der richters is geweest. De zin is dat van den aanvang der koningen, die op de richters gevolgd zijn, geen pasen met zo grote toebereiding, vergadering, reinigheid, aandacht en devotie, als dit gehouden is geweest."}],"24":[{"catchword":"waarzeggers,","tekst":"Zie van dezen en de duivelskunstenaars, Lev 19:31."},{"catchword":"terafim,","tekst":"Zie Gen 31:19."},{"catchword":"drekgoden,","tekst":"Zie Lev 26:30."}],"25":[{"catchword":"gelijke,","tekst":"Versta dit eigenlijk ten aanzien van de vurigheid zijns ijvers in het weren van alle gruwelen, die in zijn tijd zeer de overhand genomen hadden, en van de onnozelheid zijns levens, door de naarstige betrachting van de wet des Heeren, gelijk de volgende woorden van dit vs. medebrengen. Vergelijk boven, vs.18, de aantekeningen vs.5."},{"catchword":"ganse hart,","tekst":"Zie 1Ki 2:4."}],"26":[{"catchword":"keerde zich","tekst":"Niet omdat de koning zijn God niet behaagde, maar omdat het volk zijn koning niet volgde, noch in de ongeveinsde aanneming van zijn zuiveren godsdienst, noch in de oprechte bekering des levens, gelijk zulks zeer haast naar des konings dood gebleken is."},{"catchword":"waarmede Manasse","tekst":"Te weten, omdat Juda dezelve den koning Manasse nadeed, hem volgende in zijn gruwelen, maar niet in zijn bekering."}],"27":[{"catchword":"van Mijn aangezicht wegdoen,","tekst":"Zie boven, 2Ki 17:18."},{"catchword":"gelijk als Ik","tekst":"Te weten, door wegvoering uit zijn land, hoewel die niet voor altijd zou zijn, als van de Israëlieten. Zie boven, 2Ki 17:18, 2Ki 17:20, en 2Ki 18:11, en 2Ki 21:13, met de aantekening."},{"catchword":"Mijn Naam zal daar wezen","tekst":"Zie 1Ki 8:29, en 1Ki 9:3; idem boven, 2Ki 21:4."}],"29":[{"catchword":"zijn dagen","tekst":"Te weten, gelijk Josia het vermaken van het huis des Heeren voleind had. Zie 2Ch 35:20."},{"catchword":"Necho,","tekst":"Zie van denzelfden ook onder, vs.33; Jer 46:2."},{"catchword":"naar de rivier Frath;","tekst":"Naar de stad Karchemis, gelegen aan den Eufraat, die de koning van Assyrië den Syriërs afgenomen had; waarover hij den roem draagt, Isa 10:9."},{"catchword":"toog hem tegemoet,","tekst":"Te weten om hem af te keren en te verhinderen, dat hij met zijn leger door zijn land niet zou trekken, vrezende schade voor zijn eigen koninkrijk, of willende daarmede den koning van Assyrië vriendschap doen."},{"catchword":"doodde hem","tekst":"Dat is, de schutters des konings Necho wondden hem dodelijk; zodat hij, naar Jeruzalem gevoerd zijnde, stierf op den weg, of binnen Jeruzalem, hebbende bij Megiddo de doodwond gekregen; 2Ch 35:23-24."},{"catchword":"Megiddo,","tekst":"Een stad, in den stam van Manasse gelegen. Zie 1Ki 9:15."},{"catchword":"hem gezien had","tekst":"Dat is, als Josia gekomen was om hem onder de ogen te zien en tegen hem streed. Zie boven, 2Ki 14:8, en de aantekening."}],"30":[{"catchword":"dood","tekst":"Dat is, dodelijk gewond en als voor dood gehouden. Alzo zeggen wij: Hij is een dood man, van dengene die sterft of haast sterven moet. Zo is bijna het woord dood genomen Gen 20:3."},{"catchword":"Jóahaz,","tekst":"Anders ook genoemd [zo enigen oordelen] Johanan, 1Ch 3:15, en Salium, Jer 22:11."},{"catchword":"zalfden hem,","tekst":"Alzo naar sommiger gevoelen, openlijk verklarende dat zij hem in dezen gemenen nood metterhaast tot koning begeerden, om door hem tegen den koning Necho beschermd te worden, en het land met het rijk te behouden."}],"31":[{"catchword":"Jeremia,","tekst":"Die te onderscheiden is van Jeremia den profeet; want de profeet was van Anatoth in Benjamin, Jer 1:1, maar deze van Libna in Juda."}],"32":[{"catchword":"zijn vaderen","tekst":"Namelijk, zijn grootvader Amon en zijn oudgrootvaders Manasse, Achaz, enz."}],"33":[{"catchword":"liet hem binden","tekst":"Dat is, legde hem in gevangenis. Dit geschiedde terwijl hij bezig was met den oorlog tegen de stad Karchemis; waarvan zie 2Ch 35:20; Jer 46:2."},{"catchword":"te Ribla","tekst":"Een stad, gelegen in Syrië, van sommigen voor Apamia gehouden, van anderen voor Antiochië."},{"catchword":"opdat hij","tekst":"Anders, als hij regeerde te Jeruzalem."},{"catchword":"talenten zilvers","tekst":"Zie Exo 25:39."}],"34":[{"catchword":"veranderde","tekst":"Hebreeuws, wendde, of keerde om. Hij wilde daarmede bewijzen dat hij macht en gebied over hem had. Zie gelijke exempelen onder, 2Ki 24:17; Dan 1:7."},{"catchword":"aldaar","tekst":"Te weten, gelijk Jeremia voorzegd had, 2Ki 22:12, waar hij vs.11"}],"35":[{"catchword":"schatte het land,","tekst":"Dat is, Jojakim schatte of waardeerde de middelen van alle ingezetenen des lands, en deed hen daarnaar hun aandeel opbrengen."},{"catchword":"bevel van Faraö","tekst":"Hebreeuws, mond."},{"catchword":"naar zijn schatting","tekst":"Dat is, naar dat hij van den koning geschat was."}],"36":[{"catchword":"koning werd,","tekst":"Te weten, alleen en volmachtig, na den dood van zijn broeder Joahaz, die, gevangen zijnde, nog voor koning gehouden werd, hoewel hij, namelijk Jojakim, het koninkrijk bediende. Anderen menen dat Jojakim vijf en twintig jaren oud was, als zijn broeder Joahaz afgezet en gevankelijk naar Egypte weggevoerd werd, en volgens dat hij de oudste der zonen van Josia was; verklarende de plaats 1Ch 3:15 van de eerstgeboorte, niet der natuurlijke voortteling, maar der koninklijke regering, en dat Joahaz daarom in zijn huldiging gezalfd zou zijn geweest, om zijn verkiezing te beter te verzekeren tegen de wederspreking van zijn oudsten broeder Jojakim, gelijk Salomo om zulk een oorzaak gezalfd werd, 1Ki 1:34, 1Ki 1:39."},{"catchword":"elf jaren","tekst":"Welverstaande, zo men zijn regering berekent van dien tijd af, dat hij de plaats zijns broeders bewaard heeft; hetwelk was terstond nadat zijn broeder in Egypte gevankelijk gevoerd was."}],"37":[{"catchword":"vaders","tekst":"Zie boven, vs.32."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Ten the king sent [to wit, messengers, to whom he gave charge to summon the eldest together] and to him were gathered all the eldest of Juda and Jerusalem. [Understand those who in government both of church and common-wealth were seated above others. See Exod.3. on v.16 and Lev.4 on v.15.]"}],"2":[{"catchword":null,"tekst":"And the king went up into the house of the Lord, and with all the men&acirc;&euro;&trade;s of Juda, [Understand the chiefest] and all the inhabitants of Jerusalem and the priests, and the prophets, [some understand by these, Jeremy. Zephania and Uria, who lived at this time. Others, the disciples or scholars of the prophets or the scribes, and such as well skilled and in the law of God] and all the people, from the least, to the greatest; and he read before their ears all the words of the book of the covenant, which was found in the house of the Lord. [see above chap. 22.8.]"}],"3":[{"catchword":null,"tekst":"Now the king stood by the pillar, [see above chapter 11 on v.14.] and made a covenant before the face of the Lord, [i.e. in the people&acirc;&euro;&trade;s court, which was before the court of the priests, in the fore-part of the temple of the Lord, wherein the ark of the covenant was, upon which the Lord manifested himself, see Lev.1. on v.3.] to walk after the Lord, [that is, to walk in th wayes of the Lord. What this is, see 1 kings 11 on v.33. and the words here following] and to keep his commandments, and his testimonies, and his statutes with all (their0 hear, and with all their soul, [see Deut.6. on v.5.] confirming the words of this covenant, which are writte in this boo: [see Deut. 27. on v.26.] and all the people stood in this covenant. [i.e. stood close to it, and were contented with it. So we are forbidden to stand in an evil thing, Ecc 8:3. That is, to stick close to it, and to yield unto it.]"}],"4":[{"catchword":null,"tekst":"And the king commanded Hilkia the high priest, and the priests of the second order, [these priests were the chiefest under the high priest] and the keepers of the threshold, [to wit, of the temple of the Lord. So above chap. 22.4. see the annotate.] to bring forth out of the temple all the furniture that were made for Baal, and for the (image) the grove and for all the host of heaven; and he burnt them without Jerusalem in the fields of Kiron, [see 1 Kings 2 on v.37.] and caused the dust thereof to be carries to bethel. [one of the cities where Jerobeam had raised up a golden calf, 1 kings. 12 v.29 and consequently a sink of idolatry; for which cause t is called Bethaven, that is an house of wickedness, hos.4.15 and 18.5 and is most shamefully disgraced by Josia in casting out the ashes of the burnt idolatrous vessels there.]"}],"5":[{"catchword":null,"tekst":"Besides, be put down the Chemarims, [A kind of idolatrous priests of Baal; of whom see also Hos. 10.5. and Zeph.1.4. The name Chemarims is derived from a word signifying to be warn, to burn, also to grow black, also pulled together, rumpled and rolled together, which is caused by burning, whence there is also with the Chaldeans the signification of shutting in. Hence there he divers opinions of the learned concerning this appellation. Many conceive that these priests of baal were so called, because their order was to wear black apparel; some think they were so called, because they were of a blackish or swarty and smoaky countenance being always busied in burning of incense ad offering of sacrifices.] whom the kings of Juda had ordained to burn incense on the high places, in the cities of Juda and round about Jerusalem, together with those that burnt incense to Baal, to the sun, and to the moon and to (the rest of) the places and to all the host of heaven."}],"6":[{"catchword":null,"tekst":"He also brought away the (image of the) grove out of the house of the LORD, [which image was set up in the temple by king Manasseh, above chap.21.7] without Jerusalem unto the brook Kidron, [oth. Unto the valley of kidron, v.12. so below in the same verse] and burnt it all at the brook Kidron, and stampt it small to powder and cast the powder thereof upon the graves of the children of the people. [i.e. of the inhabitants of the land that had idolaters. Compare 2 Chron. 2 Chron.34.4 or of the common people. This he did in detestation of all deceased idolaters, and for an example and admonition to those idolaters that were alive.]"}],"7":[{"catchword":null,"tekst":"moreover, he brake down the houses of the buggers, [see Deut. 23. on v.17.] which were by the house of the Lord; [to wit, in the people&acirc;&euro;&trade;s court, where the idol-ministers (as is conceived) had their abode] were the women wove shrines for the (image of the) grove. [Understand by these shrines, little Chappels, or Cabbimets, and cases made of woven or needle and embroidered work, in which the images of the idols stood. Others understand such kind of tents, wherein idolaters did jointly and with one accord commit their filthy abomination to the honor of their Idols"}],"8":[{"catchword":null,"tekst":"And he brought all the priests, [Namely the idolatrous&acirc;&euro;&trade; priests] out of the cities of Juda and defiledthe high places, [to wit, by making them unfit and incense from Geba [A city in Benjamin, the North-border of the kingdome of Juda. See 1 kings 15 on verse 22.] to Berseba: [laying in Juda and the south-border of the whole land of Canaan. See Gen.21 on verse 31.] and he brake down the high places of the gate, [i.e. which were at the gates] (also) that which was at the door of the gate of Josua the governor of the city, [i.e. he hindred as well as the idolatry of the great and mighty men, as of the poorer and meaner sort of people] which was at a man&acirc;&euro;&trade;s left hand, (entering) into the gate of the city. [Heb the left hand of a man: namely, of him that came into the gate of the city.]"}],"9":[{"catchword":null,"tekst":"Howbeit the priests of the high places offered not upon the altar of the Lord at Jerusalem: but they did eat unleavened bread in the midst of their brethren. [Or came not up to the altar.] The meaning is that these priests, because they had offered unto idols, were with their posterity deposed from the priesthood, as being unworthy of it, Eze 44:13. although notwithstanding, because they repented, they had livelihood and maintenance allowed them out of the unleavened cakes, of which none might eat, save the priests onely, Lev.2.4,10 being therein equalized with the blemished posterity of Aaron, Lev.21.17,22.]"}],"10":[{"catchword":null,"tekst":"He also defiled Topheth. [By causing Dung excrements, dead putrified bodies and all manner of filthy to be cast forth there. Topheth was a place near unto the city of Jerusalem, lying in a fair and pleasant field so called from the word Toph, signifying a drum where the idolaters offered up their children to the idol Molech, causing them to pass thorow th fire, or also quite be to burnt and consuming, for which end & purpose they were put into the arms of an image that was made red-hot which was hallow within and full of fire. Now because the children feeling the pain and smart of fire made a doleful and lamentable cry, therefore they made a huge noise with drums and tabret to drown the skreckings and roaring of the children that the same might not be heard by the parents and friends thereof. Compare Lev.1821. Jer 7:31.] which is in the valley of the children of Hinnom; [the name of a man to whose children this place did formerly belong, so that from thence it was called Ge-Bene-Hinnom; Jos.15.8 that is, the valley of the children hinnom; or Gebinnom, that is, the valley of Hinnom, Neh.11.30. from the most terrible pain of fire, which the children of idolaters there suffered, hell (the place for the damned) hath its denomination being called Gebenna, Mat 5:22. which is an unquenchably fire, Mark 9.43.] that no man might make his son, o his daughter to pass thorow the fire to molech. [Below v.13 caused Milcom. See Lev8.on v21.]"}],"11":[{"catchword":null,"tekst":"And he put down the horse, which the king of Juda had appointed [Or, given] to the sun from entering into the house of the lord,unto the chamber [i.e. to the house] of Nathan-Melith the Courtier, which was parvarim: [or in the suburbs, to wit, of the city of David, not far distant from the temple. Some take the Hebrew word parvarim to be the name of a place near to the temple: but what place it was is uncertain. Concerning the horses mentioned in this verse, some understand it of living horses, which were kept and used to the honor of the sun: for certain men (as some conceive) were appointed every morning with these horses to ride to meet the sun rising from the house of the Lord to the house of Nathan Melech, and to salute and worship it and to perform divine honor unto it. Others understand it onely of the images and pictures of these horses & charets] he burnt the charets of the sun with fire. [i.e. those charets which were made to the honor of the sun after the manner and custome of the heathen.]"}],"12":[{"catchword":null,"tekst":"moreover the altars which were on the roof of the upper chamber of Achaz [Being made there to the honor of the host of heaven. See jer.19.13. Zeph.1.5.] Which Manasseh had made in two courts of the house of the Lord [see above chap. 21.5.] did the king break down: and he ground them from dust thence and cast the dust of them into the brook kidron, [which was done partly to manifest publick detesting of these idolatrous reliques and partly to root them out utterly that nothing thereof at all might be left.]"}],"13":[{"catchword":null,"tekst":"Alsothe high places, that was before Jerusalem, which were on the right hand of the mount of mashith, [Oth. Of the corrupted. Understand the mount of Olives lying near Jerusalem here called the mount of Mashith, that is, of him that corrupteth, or of the corrupter, because the Jews did there corrupt themselves by idolatry. Oth. It was called the mount ofMischab, that is, of anointing because many olives grew on it, of which the anointing oil was made: so that between both the names there is but small difference in regard of the letters but there is a great difference in regard of their significations. See 1 kings 11.7.] which Salomon the king of Israel had builded for Asthoreth, [this name, with the two following, Camos and Milcom, are names of idolatrous images. See of Asthoreth, judges 2.13.] The abomination of the Zidonians and for Camos. [See I kings 11.on v.7.] The abomination of the Moabites and for Milcom [see lev.18 on verse 21.] the abomination of the children of Ammon did the king defile"}],"14":[{"catchword":null,"tekst":"he likewise broke (in pieces) the reared images, and destroyed the groves: he filled their place with the bones of men. [which he caused to be taken out of the graves of idolaters, to defile therewith the idolaterous places and to make them to be abhorred. Compare below v. 16 and 20. Itera Ezra 6.5]"}],"15":[{"catchword":null,"tekst":"moreover also the altar that was at Bathel, and the high place, which Jerobeam the son of Nebat, who made Israel to sinne, had made both that altar and that high place he brake down: ye burnt the high place, he stamp it small to powder and burnt the grove."}],"16":[{"catchword":null,"tekst":"And as Josia turned himself, he spied that were on the mount and sent, and took the bones out of the Sepuchres and burnt them upon the altar, [to wit, which was reared up at Bethel by Jerobeam, verse 15.] and polluted it, according to the word of the Lord, which the man of god had proclaimed who proclaimed [i.e. foretold: to wit, more then three hundred years before: see 1 kings 13.2 and compare therewith, that which is here related and below v.20] these words. [see 1 kings 13.2.]"}],"17":[{"catchword":null,"tekst":"Moreover he said, what monument is that which I see? And the men of the city said unto him; it is the Sepulchreof the man of god that came from Juda and proclaimed those things, which thou hast done against this altar of Bethel."}],"18":[{"catchword":null,"tekst":"And he said; let him lie (still) let no man meddle with his bones: s they delivered his bones, [Namely that they were not burnt upon the altar at Bethel, with the other bones] with the bones of the prophet, [who had desired to be buried close by the prophet of Juda, 1 King.13.31.] that was come out of Samari. [Understand not the city but land of Samaria, wherein the city of Bethel lay and this prophet dwelt hen he came to the prophet of Juda, 1 Kings 13.11. so the name Samaria is also taken for the countrey of Samaria in the following verse.]"}],"19":[{"catchword":null,"tekst":"Besides, josia took away all the house of the high places which were in the cities of Samaria, [namely, which were brought under the dominion of the kingdome of Juda] which the Kings of Israel had had to provoke (the Lord) to anger and he did to them according to all the acts which he had done at Bethel."}],"20":[{"catchword":null,"tekst":"And he slew all the priests of the high places that were there upon the altar and burnt men&acirc;&euro;&trade;s bones upon them, [oth offered, &c. that is, put them to death upon the altars, to shew that he not onely hated idolatry in the highest degree, but even the very places where it was practiced, polluting the by shedding men&acirc;&euro;&trade;s blood, and burning their bones upon them. [understand this of the priests, who (according to Jerobeams institution) were made of the lowest of the people, and did obstinately first in their idolatry, see 1 kings 12.31.] after that he returned to Jerusalem."}],"21":[{"catchword":null,"tekst":"And the king commanded all the people, saying; keep the Passover unto the Lord thy God: [see 2 Chron.35.1.] as it is written in this book of the covenant. [namely, the book of the law: of which see above chapter 22.8 &c. see also Exod. 12.3. Deut. 16.2]"}],"22":[{"catchword":null,"tekst":"for like unto this Passover there was none kept [oth. Surely like unto, &c.] Here a reason is given, shewing that the king command was very well observed] from the dayes of the judges, that had judged Israel, [meaning those that are not counted there. For 2 Chron. 35.18. it&acirc;&euro;&trade;s said, from the dayes&acirc;&euro;&trade; of Samuel who was the last of the judges] nor in all the dayes of the kings of Israel, nor of the Kings of Juda. [the meaning is, that from the beginning of the government of Kings, who did immediately succeed the Judges, no Passover was ever kept with so great preparation, assembly, purity, reverence, attention and devotion, as this was kept.]"}],"23":[{"catchword":null,"tekst":"But in the eighteenth year of King Josiah, this Passover was kept unto the Lord at Jerusalem."}],"24":[{"catchword":null,"tekst":"And Josia did put away the soothsayer, and Necromancers, [see of both these, Lev.19. on verse 31.] and the Teraphim, [see Gen. 31. on v.19.] and the dung-Gods, [see Lev. 26. on ver.30] and all the abominations that were set in the land of Juda, and in Jerusalem: that he might confirm the words of the law that were written in the book, which Hilkia the priest had found in the house of the Lord."}],"25":[{"catchword":null,"tekst":"And before him there was no king like unto him, [understand this properly in respect of the fervency of his zeal in rooting out all abominations, that bare a great sway in his time; and in respect of the innocence and integrity of his life, in diligent heeding the law of the Lord, as the following words of this verse import. Compare above chapter 18 on v5.] that had turned to the Lord with all his heart, and with all his soul, [see 1 Kings 2 on v.4.] and with all his might, according to the law of Moseh: and after him there arose not (any) like unto him."}],"26":[{"catchword":null,"tekst":"Notwithstanding, the Lord turned from the fierce of his great wrath, [Not because the king did not please his God, but because the people did not follow their King, neither in the unfeigned acceptation of his pure worship, nor in the right conversion and amendment of life, as it did soon appear after the kings decease] wherewith his anger burned against Juda, because of all the provocations wherewith Manasseh had provoked him. [to wit. Because they did commit the same, after the example of King Manasseh, following him in his abomination but not in his repentance and conversion.]"}],"27":[{"catchword":null,"tekst":"And the Lord said; I will also remove Juda from my face; [See above chap.17 on v. 18] according as I have removed Israel, [to wit, by carrying them away out of their land, although the same should not be forever as the carrying away of the Israelites was. See above chap. 17.v.18,20 and // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
