"href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen zei Elisa: Hoor het woord van de HEERE; zo zegt de HEERE: Morgen omtrent deze tijd zal een maat meelbloem verkocht worden voor een sikkel, en twee maten gerst voor een sikkel, in de poort van Samaria.","2":"Maar een hoofdman, op wiens hand de koning leunde, antwoordde de man Gods, en zei: Zie, al zou de HEERE vensters in de hemel maken, zou die zaak dan kunnen gebeuren? En hij zei: Zie, u zult het met uw ogen zien, maar daarvan niet eten.","3":"Er waren nu vier melaatse mannen bij de ingang van de poort; die zeiden tegen elkaar: Waarom blijven wij hier zitten, totdat wij sterven?","4":"Als wij zeggen: Laat ons de stad in gaan, dan is de honger in de stad, en zullen wij daar sterven, en als wij hier blijven, zullen wij ook sterven; nu dan, kom, laat ons naar het leger van de Syriërs overlopen; als zij ons laten leven, zullen wij leven; en als zij ons doden, zullen wij maar sterven.","5":"En zij stonden op in de schemering, om naar het leger van de Syriërs te gaan. Toen zij aan het einde van het leger van de Syriërs kwamen, zie, toen was daar niemand.","6":"Want de Heere had het leger van de Syriërs een geluid van wagens laten horen, en een geluid van paarden, het geluid van een groot leger; zodat zij tegen elkaar zeiden: Zie, de koning van Israël heeft tegen ons de koningen van de Hethieten en de koningen van de Egyptenaren gehuurd, om tegen ons op te trekken.","7":"Daarom hadden zij zich klaargemaakt, en waren in de schemering gevlucht, en hadden hun tenten achtergelaten, en hun paarden, en hun ezels, het leger precies zoals het was; en waren gevlucht om hun leven te redden.","8":"Toen deze melaatsen aan het einde van het leger kwamen, gingen zij een tent in, en aten en dronken, en namen daaruit zilver, en goud, en kleren, en gingen weg, en verborgen het; daarna keerden zij terug, en kwamen in een andere tent, namen daaruit ook, en gingen weg, en verborgen het.","9":"Toen zeiden zij tegen elkaar: Wij doen niet goed; deze dag is een dag van goed nieuws, en wij zwijgen stil. Als wij wachten tot de lichte morgen, zal ons onrecht overkomen; daarom nu, kom, laat ons gaan, en dit aan het huis van de koning melden.","10":"Zo kwamen zij, en riepen naar de poortwachter van de stad, en meldden het hun, en zeiden: Wij zijn bij het leger van de Syriërs gekomen, en zie, er was daar niemand, ook geen mensenstem; maar wel paarden vastgebonden, en ezels vastgebonden, en de tenten, precies zoals ze waren.","11":"En hij riep de poortwachters; en zij deden de boodschap binnen in het huis van de koning.","12":"En de koning stond op in de nacht, en zei tegen zijn knechten: Ik zal u nu bekendmaken wat de Syriërs ons hebben aangedaan; zij weten dat wij hongerig zijn; daarom zijn zij uit het leger gegaan om zich in het veld te verstoppen, en zeiden: Als zij de stad uit gaan, zullen wij hen levend grijpen, en zullen wij de stad in gaan.","13":"Toen antwoordde een van zijn knechten, en zei: Laat men toch vijf van de overgebleven paarden nemen, die hierbinnen over zijn (zie, zij zijn als de hele menigte van de Israëlieten die hierbinnen over zijn; zie, zij zijn als de hele menigte van de Israëlieten die omgekomen zijn), laat ons die sturen, en kijken.","14":"Zij namen dan twee wagenpaarden. En de koning stuurde het leger van de Syriërs achterna, en zei: Ga en kijk.","15":"En zij volgden hen na tot aan de Jordaan; en zie, de hele weg lag vol met kleren en gereedschap, die de Syriërs in hun haast hadden weggegooid. De boden nu keerden terug, en meldden het aan de koning.","16":"Toen ging het volk naar buiten, en plunderde het leger van de Syriërs; en een maat meelbloem werd verkocht voor een sikkel, en twee maten gerst voor een sikkel, naar het woord van de HEERE.","17":"De koning nu had de hoofdman, op wiens hand hij leunde, aangesteld over die poort; en het volk vertrapte hem in de poort, zodat hij stierf, zoals de man Gods gesproken had, die het sprak toen de koning naar hem toe was gekomen.","18":"Want het was gebeurd, zoals de man Gods tegen de koning gesproken had, en gezegd: Morgen omtrent deze tijd zullen twee maten gerst voor een sikkel, en een maat meelbloem voor een sikkel verkocht worden, in de poort van Samaria.","19":"En die hoofdman had de man Gods geantwoord en gezegd: Zie, al zou de HEERE vensters in de hemel maken, zou het dan ook naar dit woord kunnen gebeuren? En hij had gezegd: Zie, u zult het met uw ogen zien, maar daarvan niet eten.","20":"Precies zo gebeurde het hem, want het volk vertrapte hem in de poort, zodat hij stierf."},"SV":{"1":"Toen zeide Elisa: Hoort het woord des HEEREN; zo zegt de HEERE: Morgen omtrent dezen tijd zal een maat meelbloem *verkocht* worden voor een sikkel, en twee maten gerst voor een sikkel, in de poort van Samaria.","2":"Maar een hoofdman, op wiens hand de koning leunde, antwoordde den man Gods, en zeide: Zie, zo de HEERE vensteren in den hemel maakte, zou die zaak *kunnen* geschieden? En hij zeide: Zie, gij zult het met uw ogen zien, doch daarvan niet eten.","3":"Er waren nu vier melaatse mannen voor de deur der poort; die zeiden, de een tot den ander: Wat blijven wij hier, totdat wij sterven?","4":"Indien wij zeggen: Laat ons in de stad komen, zo is de honger in de stad, en wij zullen daar sterven, en indien wij hier blijven, wij zullen ook sterven; nu dan, komt, en laat ons in het leger der Syriërs vallen; indien zij ons laten leven, wij zullen leven; en indien zij ons doden, wij zullen maar sterven.","5":"En zij stonden op in de schemering, om in het leger der Syriërs te komen. Toen zij aan het uiterste van het leger der Syriërs kwamen, ziet, toen was er niemand.","6":"Want de Heere had het heir der Syriërs doen horen een geluid van wagenen, en een geluid van paarden, het geluid ener grote heirkracht; zodat zij zeiden de een tot den ander: Zie, de koning van Israël heeft tegen ons gehuurd de koningen der Hethieten, en de koningen der Egyptenaren, om tegen ons te komen.","7":"Derhalve hadden zij zich opgemaakt, en waren in de schemering gevloden, en hadden hun tenten gelaten, en hun paarden, en hun ezelen, het leger gelijk als het was; en waren gevloden om huns levens wil.","8":"Als nu deze melaatsen aan het uiterste des legers kwamen, zo gingen zij in een tent, en aten en dronken, en namen van daar zilver, en goud, en klederen, en gingen henen, en verborgen het; daarna keerden zij weder, en kwamen in een andere tent, namen van daar ook, en gingen henen, en verborgen het.","9":"Toen zeiden zij, de een tot den ander: Wij doen niet recht; deze dag is een dag van goede boodschap, en wij zwijgen stil. Indien wij vertoeven tot den lichten morgen, zo zal ons de ongerechtigheid vinden; daarom nu, komt, laat ons gaan, en *dit* aan het huis des konings boodschappen.","10":"Zo kwamen zij, en riepen tot den poortier der stad, en boodschapten hun, zeggende: Wij zijn gekomen tot het leger der Syriërs, en ziet, niemand was daar, noch eens mensen stem; maar paarden aangebonden, en ezels aangebonden, en tenten, gelijk als zij waren.","11":"En hij riep de poortiers; en zij deden de boodschap binnen in het huis des konings.","12":"En de koning stond op in den nacht, en zeide tot zijn knechten: Ik zal u nu te kennen geven, wat de Syriërs ons gedaan hebben; zij weten, dat wij hongerig zijn; daarom zijn zij uit het leger gegaan, om zich in het veld te versteken, zeggende: Als zij uit de stad gegaan zullen zijn, dan zullen wij hen levend grijpen, en wij zullen in de stad komen.","13":"Toen antwoordde een van zijn knechten, en zeide: Dat men toch neme vijf van de overige paarden, die hierbinnen overgebleven zijn ( zie, zij zijn als de gehele menigte der Israëlieten, die hierbinnen overgebleven zijn; zie, zij zijn als de gehele menigte der Israëlieten, die vergaan zijn), laat ons die zenden, en zien.","14":"Zij namen dan twee wagenpaarden. En de koning zond het leger der Syriërs achterna, zeggende: Gaat henen, en ziet.","15":"En zij volgden hen na tot de Jordaan toe; en ziet, de ganse weg was vol van klederen en gereedschap, die de Syriërs in hun verhaasten weggeworpen hadden. De boden nu keerden weder, en boodschapten het den koning.","16":"Toen ging het volk uit, en beroofde het leger der Syriërs; en een maat meelbloem werd *verkocht* voor een sikkel, en twee maten gerst voor een sikkel, naar het woord des HEEREN.","17":"De koning nu had den hoofdman, op wiens hand hij leunde, over die poort gesteld; en het volk vertrad hem in de poort, dat hij stierf, gelijk de man Gods gesproken had, die het sprak, als de koning tot hem afgekomen was.","18":"Want het was geschied, gelijk de man Gods gesproken had tot den koning, zeggende: Morgen omtrent dezen tijd zullen twee maten gerst voor een sikkel, en een maat meelbloem voor een sikkel *verkocht* worden, in de poort van Samaria.","19":"En die hoofdman had den man Gods geantwoord en gezegd: Zie, zo de HEERE vensteren in den hemel maakte, zou het ook naar dit woord geschieden *kunnen*? En hij had gezegd: Zie, gij zult het met uw ogen zien, doch daarvan niet eten.","20":"Even alzo geschiedde hem, want het volk vertrad hem in de poort, dat hij stierf."},"KJV":{"1":"Then Elisha said, Hear ye the word of the LORD; Thus saith the LORD, To morrow about this time shall a measure of fine flour be sold for a shekel, and two measures of barley for a shekel, in the gate of Samaria.","2":"Then a lord on whose hand the king leaned answered the man of God, and said, Behold, if the LORD would make windows in heaven, might this thing be? And he said, Behold, thou shalt see it with thine eyes, but shalt not eat thereof.","3":"And there were four leprous men at the entering in of the gate: and they said one to another, Why sit we here until we die?","4":"If we say, We will enter into the city, then the famine is in the city, and we shall die there: and if we sit still here, we die also. Now therefore come, and let us fall unto the host of the Syrians: if they save us alive, we shall live; and if they kill us, we shall but die.","5":"And they rose up in the twilight, to go unto the camp of the Syrians: and when they were come to the uttermost part of the camp of Syria, behold, there was no man there.","6":"For the Lord had made the host of the Syrians to hear a noise of chariots, and a noise of horses, even the noise of a great host: and they said one to another, Lo, the king of Israel hath hired against us the kings of the Hittites, and the kings of the Egyptians, to come upon us.","7":"Wherefore they arose and fled in the twilight, and left their tents, and their horses, and their asses, even the camp as it was, and fled for their life.","8":"And when these lepers came to the uttermost part of the camp, they went into one tent, and did eat and drink, and carried thence silver, and gold, and raiment, and went and hid it; and came again, and entered into another tent, and carried thence also, and went and hid it.","9":"Then they said one to another, We do not well: this day is a day of good tidings, and we hold our peace: if we tarry till the morning light, some mischief will come upon us: now therefore come, that we may go and tell the king's household.","10":"So they came and called unto the porter of the city: and they told them, saying, We came to the camp of the Syrians, and, behold, there was no man there, neither voice of man, but horses tied, and asses tied, and the tents as they were.","11":"And he called the porters; and they told it to the king's house within.","12":"And the king arose in the night, and said unto his servants, I will now shew you what the Syrians have done to us. They know that we be hungry; therefore are they gone out of the camp to hide themselves in the field, saying, When they come out of the city, we shall catch them alive, and get into the city.","13":"And one of his servants answered and said, Let some take, I pray thee, five of the horses that remain, which are left in the city, (behold, they are as all the multitude of Israel that are left in it: behold, I say, they are even as all the multitude of the Israelites that are consumed:) and let us send and see.","14":"They took therefore two chariot horses; and the king sent after the host of the Syrians, saying, Go and see.","15":"And they went after them unto Jordan: and, lo, all the way was full of garments and vessels, which the Syrians had cast away in their haste. And the messengers returned, and told the king.","16":"And the people went out, and spoiled the tents of the Syrians. So a measure of fine flour was sold for a shekel, and two measures of barley for a shekel, according to the word of the LORD.","17":"And the king appointed the lord on whose hand he leaned to have the charge of the gate: and the people trode upon him in the gate, and he died, as the man of God had said, who spake when the king came down to him.","18":"And it came to pass as the man of God had spoken to the king, saying, Two measures of barley for a shekel, and a measure of fine flour for a shekel, shall be to morrow about this time in the gate of Samaria:","19":"And that lord answered the man of God, and said, Now, behold, if the LORD should make windows in heaven, might such a thing be? And he said, Behold, thou shalt see it with thine eyes, but shalt not eat thereof.","20":"And so it fell out unto him: for the people trode upon him in the gate, and he died."}},"tsk":{"1":[{"kopje":"zei Elisa","refs":["2 Kon 6:33","2 Kon 20:16","1 Kon 22:19","Jes 1:10","Ezech 37:4"]},{"kopje":"Morgen","refs":["2 Kon 7:18","2 Kon 7:19","Ex 8:23","Ex 9:5","Ex 9:6","Ex 14:13","Ex 16:12","Joz 3:5","1 Sam 11:9","Ps 46:6"]},{"kopje":"een maat meelbloem","refs":["2 Kon 6:25","Openb 6:6"]},{"kopje":"gerst","refs":["2 Kon 4:42","Joh 6:9"]},{"kopje":"in de poort van Samaria","refs":["2 Kon 7:18"]}],"2":[{"kopje":"een hoofdman","refs":["2 Kon 5:18"]},{"kopje":"al zou de HEERE","refs":["Gen 18:12-14","Num 11:21-23","Ps 78:19-21","Ps 78:41"]},{"kopje":"vensters","refs":["Gen 7:11","Mal 3:10"]},{"kopje":"u zult het met uw ogen zien","refs":["2 Kon 7:17-20","Deut 3:27","2 Kron 20:20","Jes 7:9","Rom 3:3","2 Tim 2:13","Hebr 3:17-19"]}],"3":[{"kopje":"vier melaatse","refs":["2 Kon 5:1","2 Kon 8:4","Lev 13:46","Num 5:2-4","Num 12:14"]},{"kopje":"Waarom","refs":["2 Kon 7:4","Jer 8:14","Jer 27:13"]}],"4":[{"kopje":"de stad in gaan","refs":["Jer 14:18"]},{"kopje":"laat ons overlopen","refs":["1 Kron 12:19","Jer 37:13","Jer 37:14"]},{"kopje":"als zij ons laten leven","refs":["Est 4:16","Jer 8:14","Jona 3:9","Luk 15:17-19"]},{"kopje":"zullen wij maar sterven","refs":["2 Sam 14:14","Hebr 9:27"]}],"5":[{"kopje":"in de schemering","refs":["1 Sam 30:17","Ezech 12:6","Ezech 12:7","Ezech 12:12"]},{"kopje":"zie","refs":["Lev 27:8","Lev 27:26","Deut 28:7","Deut 3 class=\"wl\" data-l=\"L5\" data-code=\"H853\">in</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8179\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8179\">poort</span>, zodat <span class=\"wl\" data-l=\"L7\" data-code=\"H4191\">hij</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4191\">stierf</span>."},"koppeling_kjv":{"1":"Then <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> ye the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> To <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> about this <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> shall a <span class=\"wl wl-kjv\" data-code=\"H5429\">measure</span> of fine <span class=\"wl wl-kjv\" data-code=\"H5560\">flour</span> be sold for a <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel,</span> and two <span class=\"wl wl-kjv\" data-code=\"H5429\">measures</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley</span> for a <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel,</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span>","2":"Then a <span class=\"wl wl-kjv\" data-code=\"H7991\">lord</span> on whose <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8172\">leaned</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, if the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> would <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H699\">windows</span> in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> might this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> be? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, thou shalt <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> it with thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> but shalt not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> thereof.","3":"And there were <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H6879\">leprous</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> at the entering <span class=\"wl wl-kjv\" data-code=\"H6607\">in</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate:</span> and they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H7453\">another,</span> Why <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> we here until we <span class=\"wl wl-kjv\" data-code=\"H4191\">die?</span>","4":"If we <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> We will <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> then the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> is in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and we shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> there: and if we sit <span class=\"wl wl-kjv\" data-code=\"H3427\">still</span> here, we <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> also. Now therefore <span class=\"wl wl-kjv\" data-code=\"H3212\">come,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians:</span> if they save us <span class=\"wl wl-kjv\" data-code=\"H2421\">alive,</span> we shall <span class=\"wl wl-kjv\" data-code=\"H2421\">live;</span> and if they <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> us, we shall but <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span>","5":"And they rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> in the <span class=\"wl wl-kjv\" data-code=\"H5399\">twilight,</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians:</span> and when they were <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the uttermost <span class=\"wl wl-kjv\" data-code=\"H7097\">part</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> behold, there was no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> there.","6":"For the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> had made the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> to <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> a <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and a <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> even the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">host:</span> and they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H251\">another,</span> Lo, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> hath <span class=\"wl wl-kjv\" data-code=\"H7936\">hired</span> against us the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians,</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon us.","7":"Wherefore they <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> in the <span class=\"wl wl-kjv\" data-code=\"H5399\">twilight,</span> and <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> their <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> and their <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> and their <span class=\"wl wl-kjv\" data-code=\"H2543\">asses,</span> even the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> as it was, and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> for their <span class=\"wl wl-kjv\" data-code=\"H5315\">life.</span>","8":"And when these <span class=\"wl wl-kjv\" data-code=\"H6879\">lepers</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the uttermost <span class=\"wl wl-kjv\" data-code=\"H7097\">part</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> they <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">carried</span> thence <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H899\">raiment,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H2934\">hid</span> it; and came <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">carried</span> thence also, and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H2934\">hid</span> it.","9":"Then they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H7453\">another,</span> We <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> not well: this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> is a <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of good <span class=\"wl wl-kjv\" data-code=\"H1309\">tidings,</span> and we hold our <span class=\"wl wl-kjv\" data-code=\"H2814\">peace:</span> if we <span class=\"wl wl-kjv\" data-code=\"H2442\">tarry</span> till the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H216\">light,</span> some <span class=\"wl wl-kjv\" data-code=\"H5771\">mischief</span> will <span class=\"wl wl-kjv\" data-code=\"H4672\">come</span> upon us: now therefore <span class=\"wl wl-kjv\" data-code=\"H3212\">come,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">household.</span>","10":"So they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7778\">porter</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> We <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians,</span> and, behold, there was no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> there, neither <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> but <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> <span class=\"wl wl-kjv\" data-code=\"H631\">tied,</span> and <span class=\"wl wl-kjv\" data-code=\"H2543\">asses</span> <span class=\"wl wl-kjv\" data-code=\"H631\">tied,</span> and the <span class=\"wl wl-kjv\" data-code=\"H168\">tents</span> as they were.","11":"And he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H7778\">porters;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> it to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H6441\">within.</span>","12":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> I will now <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> you what the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to us. They <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that we be <span class=\"wl wl-kjv\" data-code=\"H7457\">hungry;</span> therefore are they gone <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> to <span class=\"wl wl-kjv\" data-code=\"H2247\">hide</span> themselves in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> When they come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> we shall <span class=\"wl wl-kjv\" data-code=\"H8610\">catch</span> them <span class=\"wl wl-kjv\" data-code=\"H2416\">alive,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">get</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let some <span class=\"wl wl-kjv\" data-code=\"H3947\">take,</span> I pray thee, <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> of the <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> that <span class=\"wl wl-kjv\" data-code=\"H7604\">remain,</span> which are <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> in the city, (behold, they are as all the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> that are <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> in it: behold, I say, they are even as all the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of the <span class=\"wl wl-kjv\" data-code=\"H3478\">Israelites</span> that are <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed:)</span> and let us <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see.</span>","14":"They <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> therefore <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> <span class=\"wl wl-kjv\" data-code=\"H5483\">horses;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see.</span>","15":"And they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them unto <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan:</span> and, lo, all the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> was <span class=\"wl wl-kjv\" data-code=\"H4392\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H899\">garments</span> and <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> which the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> had cast <span class=\"wl wl-kjv\" data-code=\"H7993\">away</span> in their <span class=\"wl wl-kjv\" data-code=\"H2648\">haste.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","16":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H962\">spoiled</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">tents</span> of the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians.</span> So a <span class=\"wl wl-kjv\" data-code=\"H5429\">measure</span> of fine <span class=\"wl wl-kjv\" data-code=\"H5560\">flour</span> was sold for a <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel,</span> and two <span class=\"wl wl-kjv\" data-code=\"H5429\">measures</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley</span> for a <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","17":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">appointed</span> the <span class=\"wl wl-kjv\" data-code=\"H7991\">lord</span> on whose <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> he <span class=\"wl wl-kjv\" data-code=\"H8172\">leaned</span> to have the charge of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7429\">trode</span> upon him in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> as the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">said,</span> who <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to him.","18":"And it came to pass as the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Two <span class=\"wl wl-kjv\" data-code=\"H5429\">measures</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley</span> for a <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel,</span> and a <span class=\"wl wl-kjv\" data-code=\"H5429\">measure</span> of fine <span class=\"wl wl-kjv\" data-code=\"H5560\">flour</span> for a <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel,</span> shall be to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> about this <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria:</span>","19":"And that <span class=\"wl wl-kjv\" data-code=\"H7991\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Now, behold, if the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> should <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H699\">windows</span> in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> might such a <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> be? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, thou shalt <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> it with thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> but shalt not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> thereof.","20":"And so it fell out unto him: for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7429\">trode</span> upon him in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zeide Elisa","tekst":"Te weten, tot de oudsten, die bij hem verzameld waren, tot den bode, die van den koning gezonden was, en tot den koning zelf, die straks na zijn bode volgde. Zie 2Ki 6:32-33 en onder, vs.17,18."},{"catchword":"maat meelbloem","tekst":"Bij de Hebreën genaamd seah. Zie van deze maat Gen 18:6."},{"catchword":"sikkel,","tekst":"De gemene zilveren sikkel, waarvan hier gesproken wordt, deed ruim of een weinig meer dan het vierde deel eens rijksdaalders. Zie Gen 23:15."}],"2":[{"catchword":"hoofdman,","tekst":"Deze meent men geweest te zijn de man, die van den koning uitgezonden was om den profeet het hoofd af te slaan; boven, 2Ki 6:32."},{"catchword":"leunde,","tekst":"Naar de gewoonte der koningen en grote prinsen. Zie boven, 2Ki 5:18."},{"catchword":"vensteren","tekst":"Te weten, om daardoor meel of koren met groten overvloed als een regen uit te storten. Zie van het Hebreeuwse woord Gen 7:11."},{"catchword":"zou die zaak","tekst":"Hij loochent aldus sterkelijk dat het mogelijk was. Zie Gen 18:17."}],"3":[{"catchword":"deur der poort;","tekst":"De melaatsen moesten in het leger en in de steden niet wonen, maar daarbuiten, afgezonderd van het gezelschap der mensen, Lev 13:46. Dezen nu waren genaderd, tot aan de poort der stad gevlucht zijnde om het leger der Syriërs, dat voor dezelve lag."}],"4":[{"catchword":"zeggen","tekst":"Dat is, denken, of voornemen bij onszelven in de stad te gaan. Zie Gen 20:11."}],"5":[{"catchword":"schemering,","tekst":"Het Hebreeuwse woord betekent den tijd des morgens, of des avonds, als het is tussen licht en donker. Hier wordt het voor de avondschemering genomen, gelijk af te nemen is uit vs.9, evenals de Syriërs weggevloden waren, vs.7. Alzo Pro 7:9. Voor de morgenschemering is het genomen Psa 119:147. Zie ook 1Sa 30:17."},{"catchword":"uiterste","tekst":"Versta het voorste einde des legers, dat naast de plaats, waar de melaatsen aankwamen, gelegen was. Alzo onder, vs.8."}],"6":[{"catchword":"geluid van wagenen,","tekst":"Hetwelk was, òf in hun oren, alleen, òf ook in de lucht van God door zijn heilige engelen gemaakt."},{"catchword":"de een tot den ander","tekst":"Hebreeuws, de man tot zijn broeder."},{"catchword":"der Hethieten,","tekst":"Door deze worden verstaan niet de Hethieten, afkomstig van Heth, Gen 10:15, die lang vóór dezen uitgeroeid waren, maar [gelijk sommigen menen] de koningen der eilanden Cyprus, Creta, enz."}],"7":[{"catchword":"schemering","tekst":"Te weten, recht, eer de melaatsen aan het leger gekomen waren. Zie boven, vs.5."},{"catchword":"als het was;","tekst":"Te weten, toen zij nog daarin waren voor hun vlucht, die hun zo onvoorziens en met zulke verschrikking overkomen is, dat zij, nergens naar omziende, alles gelaten hebben zo het was, om slechts hun leven daarvan te brengen. Vergelijk vs.5 met onder, vs.10."},{"catchword":"levens wil","tekst":"Hebreeuws, ziel. Zie Gen 19:17."}],"9":[{"catchword":"de een tot den ander","tekst":"Hebreeuws, de man tot zijn naaste, of metgezel. Vergelijk boven, de aantekening vs.6."},{"catchword":"de ongerechtigheid","tekst":"Dat is, de straf der zonde. Want de zonde wordt ons gezegd te vinden, niet alleen als wij in dezelve bevonden en achterhaald, maar ook daarom gestraft worden. Zie Num 32:23, en de aantekening daarop."}],"10":[{"catchword":"den poortier","tekst":"Anders, tot de portiers."},{"catchword":"hun,","tekst":"Namelijk, den portier en dengenen, die met hem aan de poort de wacht hielden."}],"11":[{"catchword":"hij riep","tekst":"Te weten de stadsportier, die de voorwacht had."},{"catchword":"de poortiers;","tekst":"Te weten zijn metgezellen, die met hem de wacht aan de poort hielden; of de portiers van het huis des konings. Anders, de portiers riepen uit."}],"12":[{"catchword":"knechten","tekst":"Dat is, raadsheren en voornaamste officieren. Zie Gen 20:8."}],"13":[{"catchword":"hierbinnen","tekst":"Dat is, in deze stad."},{"catchword":"zij zijn","tekst":"Hij wil zeggen dat deze paarden niet meer te achten waren dan de belegerde Israëlieten, die toch moeten sterven, gelijk de anderen, die alrede gestorven zijn, zo er geen ontzet komt."}],"14":[{"catchword":"wagenpaarden","tekst":"Hebreeuws, twee wagens van paarden; dat is, twee paarden van wagens. Versta, die men aan den wagen placht te spannen. Anders, twee ruiters te paard; te weten, denwelken de koning bevolen had het leger der Syriërs te bezichtigen en te vernemen hoe het daarmede gelegen was."}],"15":[{"catchword":"gereedschap,","tekst":"Of, vaten."},{"catchword":"verhaasten","tekst":"Het Hebreeuwse woord betekent eigenlijk een verhaasting, die met vrees voor het aanstaande gevaar verenigd is. Vergelijk 2Sa 4:4; Psa 48:6."}],"17":[{"catchword":"op wiens hand","tekst":"Zie boven, vs.2."},{"catchword":"die poort","tekst":"Door welke men ging naar het leger der Syriërs."},{"catchword":"volk","tekst":"Te weten, dat met grote menigte en in haast ten dele uit de stad zocht te wezen, zeer begering naar de spijs en den buit, die in het leger en daar buiten met overvloed te bekomen waren, ten dele inkwam, geladen met spijs, drank, klederen, wapens, enz., en medebrengende veel beesten."}],"18":[{"catchword":"Morgen","tekst":"Zie boven, vs.1."}],"19":[{"catchword":"vensteren","tekst":"Zie boven, vs.2."},{"catchword":"zou het ook","tekst":"Of, zou ook zulk een zaak geschieden kunnen?"},{"catchword":"hij had gezegd","tekst":"Namelijk, de profeet Elisa."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then Elisa said; [To wit, to the Eldest, that were assembled with him; to the messenger that was sent by the King; and to the King himself, who immediately followed after his messenger. See the two last verses of the former chapter, and below v.17.18.] hear the word of the LORD: thus saith the LORD, tomorrow about this time shall a measure [called with the Hebrews Seah. See of this measure Gen.18.on v.6.] of meal-flower he (sold) for a shekel, [the common shekel of silver, whereof mention is made here, was full out, or a little more than a fourth part of a Rycks Doller. See Gen.23.on v.16.] and two measures of barley for one shekel, in the gate at Samaria."}],"2":[{"catchword":null,"tekst":"But a Captain, whose hand the King leaned, [According to the custom of Kings and great Princes. See above chap.5.18. This man is thought to have been that man that was sent out by the King, to take off the Prophets head, above chap.6.v.32.] answered the man of God, and said; behold, if the LORD should make windows in heaven, [viz. to pour out thorough the same meal and corn in great abundance, as rain is poured down from heaven. See of the Hebrew word, Gen.7. on ver.11.] (could) that thing come to pass. [thus he strongly denyeth that is was possible. See Gen.18.on vers.17.] And he said; behold, thou shalt see it with thine eyes, but not eat thereof."}],"3":[{"catchword":null,"tekst":"Now there were four leprous men before the door of the gate: [The lepers might not dwelling in the camp, nor in the cities, but without those places, being separated from the society and company of men, Lev.13.46. Now these had approached to the very gate of the city, being fled, because of the camp of the Syrians that lay before it] those said the one to the other; why tarry we here, until we die?"}],"4":[{"catchword":null,"tekst":"If we say, let us enter into the city, [i.e. Think, or determine with our selves, to enter into the city. See Gen.20.on v.11.] then the famine is in the city, and we shall die there; and if we tarry here, we shall also die: now then come and fall into the camp of the Syrians; if they let us live, we shall live; and if they kill us, we shall but die."}],"5":[{"catchword":null,"tekst":"And they rose up in the twilight, [The Hebrew word signifieth the morning or evening-time, when it is between light and dark. There it&acirc;&euro;&trade;s taken for the evening twilight, as appeareth by v.9. just when the Syrians fled away, v.7.9. For the morning twilight it is taken, Psa.119.v.147. See also 1 Sam.30.on v.17.] to enter into the camp of the Syrians: Now when he came to the uttermost (part) of the camp of the Syrians, [understand the foremost end of the camp, that lay nearest to the place where the lepers came. So below v.8.] behold, then no man was there."}],"6":[{"catchword":null,"tekst":"For the LORD had caused the host of the Syrians to hear a sound of charets, and a sound of horses, the sound of a great army, [which was either in their ears only, or also in the air, made by God by the ministry of his Angels] so that they said the one to the other, [Heb. the man to his brother] Behold, the King of Israel hath hired against us the Kings of the Hithites, [by these are understood, not the Hethites descended from Heth, Gen 10:15. who were long before time destroyed, but (as some conceive) the Kings of the Islands, Cyprus, Crete, etc.] and the Kings of the Egyptians, to come against us."}],"7":[{"catchword":null,"tekst":"Therefore they had got them up, and were fled (away) in the twilight, [To wit, just before the lepers were come to the camp. See above on.v.5.] and had left their tents, and their horses, and their asses, the camp as it was: [viz. when they were in it before the slight, which came upon them so unawares, and with such terror, that looking after nothing at all, they left all behind, as it was, barely to save their lives. Compare herewith below v.10.] and were fled for their life. [Heb. soul. See Gen.19.on v.17.]"}],"8":[{"catchword":null,"tekst":"Now when these lepers came to the uttermost (part) of the camp, then they went into one tent, and did eat, and drink, and took thence silver, and gold, and raiment, and went away and hid it: Then they returned and went into another tent, took from thence also, and went away and hid it."}],"9":[{"catchword":null,"tekst":"Then they said the one to the other, [Heb. the the man to his neighbour, or companion. Compare above the anotat. on v.6.] We do not well: This day is a day of good tidings, and we hold our peace: If we tarry till the morning light, then iniquity will find us: [i.e. the punishment of sin will light upon us. For sin is said to find us, not only when we are found and overtaken in it, but are also punished for it. See Num 32:23. and the annotate. thereon] therefore bow come, let us go, and report (this) to the Kings house."}],"10":[{"catchword":null,"tekst":"So they came, and called unto the Porter [Oth.unto the Porters] of the city, and told them, saying; we came to the camp of the Syrians, and behold, (there) was no man there, nor any mans voice; but horses tied, and asses tied, and tents according as they were."}],"11":[{"catchword":null,"tekst":"And he [To wit, the city Porter, that had the watch] called the Porters: [to wit, his fellows, or companions, that kept guard with him at the gate; or the Porters of the Kings house. Oth. the Porters cryed] and they made the report within to the Kings house."}],"12":[{"catchword":null,"tekst":"And the King arose in the night, and said unto his servants; [i.e. Counsellors, and chiefest Officers. See Gen.20.on v.8.] I will tell you now what the Syrians have done to us: They know that we be hungry, therefore they are gone out of the camp, to hide themselves in the field, saying; when they shall be come out of the city, then we shall catch them alive, and we shall come into the city."}],"13":[{"catchword":null,"tekst":"Then one of his servants answered, and said; let them take five of the remaining horses, that are left here within, [i.e. in this city] (behold, they are as all the multitude of the Israelites, that are left here within, behold, they are as all the multitude of the Israelites, that are perished) [intimating, that these horses were no more to be esteemed then the besiege Israelites, who needs must die as well as the rest that were already dead, if no relief came] let us send them, and see."}],"14":[{"catchword":null,"tekst":"They took then two charet-horses: And the King sent after the camp of the Syrians, saying; go your ways, and see. [Heb. two charets of horses, etc. i.e. two horses of charets: Understand which are wont to be fastned to the charet. Oth. two horsemen on horseback: to wit, whom the King had commanded to view the camp of the Syrians, and to enquire how the case stood with them.]"}],"15":[{"catchword":null,"tekst":"And they followed them to the Jordan, and behold all the way was full of garments and furniture, [Or, vessels] which the Syrians had thrown away in their hastening: [the Hebrew word signifieth properly such an hastening as is accompanied with fear of eminent danger Compare 2 Sam.4.4. Psa 48:6.] Now the messengers returned, and reported it to the King."}],"16":[{"catchword":null,"tekst":"Then the people went forth, and spoiled the camp of the Syrians: and a measure of meal flower was (sold) for a shekel, and two measures of barley for a shekel, according to the word of the LORD."}],"17":[{"catchword":null,"tekst":"Now the King had set the Captain, on whose hand he leaned, [See above on v.2.] over that gate, [thorough which they passed to the camp of the Syrians] and the people [to wit which in great multitude and hast sought to be out of the city, very greedy after food and prey, that were to be had in great abundance both in the camp and out of it; and partly came in, loaden with meat, drink, garments, arms, etc. and bringing many beasts and cattle along with them] trod upon him in the gate, that he died: as the man of God had spoken, who spake it, when the King was come down unto him."}],"18":[{"catchword":null,"tekst":"For it came to pass, as the man of God had spoken unto the King, saying; tomorrow about this time shall two measures of barley be (sold) for one shekel, and one measure of meal flower for one shekel in the gate of Samaria. [See above on v.1.]"}],"19":[{"catchword":null,"tekst":"And that Captain had answered the man of God, and said; behold, if the LORD should make windows in heaven, [See above on v.2.] were it (possible) to be done according to this word? [or could also such a thing be done] And he [namely, the Prophet Elisa] had said; behold, thou shalt see it with thine eyes, but not eat of it."}],"20":[{"catchword":null,"tekst":"Even so it happened to him: for the people trod upon him in the gate, that he died."}]}}};

(function bouwHfdnav() {
  const m = D.meta;

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;

      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
