udas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In het twaalfde jaar van Achaz, de koning van Juda, werd Hosea, de zoon van Ela, koning over Israël te Samaria, en hij regeerde negen jaar.","2":"En hij deed wat kwaad was in de ogen van de HEERE; toch niet zoals de koningen van Israël die vóór hem geweest waren.","3":"Tegen hem trok Salmaneser, koning van Assyrië, op; en Hosea werd zijn knecht, zodat hij hem een geschenk gaf.","4":"Maar de koning van Assyrië ontdekte een samenzwering bij Hosea, doordat hij boden gezonden had naar So, de koning van Egypte, en het geschenk aan de koning van Assyrië niet meer, zoals voorheen, van jaar tot jaar bracht; daarom sloot de koning van Assyrië hem op en bond hem vast in de gevangenis.","5":"Want de koning van Assyrië trok op door het hele land; ja, hij kwam op naar Samaria, en belegerde het drie jaar.","6":"In het negende jaar van Hosea nam de koning van Assyrië Samaria in, en voerde Israël weg naar Assyrië, en liet hen wonen in Halah, en in Habor, aan de rivier Gozan, en in de steden van de Meden.","7":"Want het was gebeurd, omdat de kinderen van Israël gezondigd hadden tegen de HEERE, hun God, Die hen uit het land Egypte opgevoerd had, onder de hand van de farao, de koning van Egypte, vandaan; en zij hadden andere goden gevreesd;","8":"En hadden gewandeld in de inzettingen van de heidenvolken, die de HEERE voor de kinderen van Israël uit verdreven had, en in die van de koningen van Israël, die zij gemaakt hadden.","9":"En de kinderen van Israël hadden dingen die niet recht zijn tegen de HEERE, hun God, verborgen gedaan; en hadden zich hoogten gebouwd in al hun steden, van de wachttoren af tot de versterkte stad toe.","10":"En zij hadden zich staande beelden opgericht en gewijde palen, op elke hoge heuvel en onder elke groene boom.","11":"En zij hadden daar op alle hoogten reukwerk gebrand, zoals de heidenvolken die de HEERE voor hen weggevoerd had; en zij hadden slechte dingen gedaan, om de HEERE tot toorn te verwekken.","12":"En zij hadden de drekgoden[1] gediend, waarvan de HEERE tegen hen gezegd had: U zult dit niet doen.","13":"Toen nu de HEERE tegen Israël en tegen Juda, door de dienst van alle profeten en van alle zieners, gewaarschuwd had en zei: Bekeer u van uw slechte wegen en houd Mijn geboden en Mijn inzettingen, naar de hele wet die Ik uw vaderen geboden heb, en die Ik u door de hand van Mijn knechten, de profeten, gezonden heb;","14":"Zo luisterden zij niet, maar verhardden hun nek, zoals de nek van hun vaderen geweest was, die in de HEERE, hun God, niet geloofd hadden.","15":"Daarbij verwierpen zij Zijn inzettingen, en Zijn verbond, dat Hij met hun vaderen gemaakt had, en Zijn getuigenissen die Hij tegen hen betuigd had, en zij liepen de leegheid achterna, zodat zij zelf leeg werden, en liepen achter de heidenvolken aan die rondom hen waren, van wie de HEERE hun geboden had dat zij niet net zo zouden doen als die.","16":"Ja, zij verlieten al de geboden van de HEERE, hun God, en maakten zich gegoten beelden, twee kalveren; en maakten gewijde palen, en bogen zich neer voor heel het leger van de hemel, en dienden Baäl.","17":"Ook lieten zij hun zonen en hun dochters door het vuur gaan, en gebruikten waarzeggerij, en letten op vogelgeschrei, en verkochten zich om te doen wat kwaad was in de ogen van de HEERE, om Hem tot toorn te verwekken.","18":"Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.","19":"Zelfs Juda hield de geboden van de HEERE, hun God, niet; maar zij wandelden in de inzettingen van Israël, die zij gemaakt hadden.","20":"Zo verwierp de HEERE heel het nageslacht van Israël, en onderdrukte hen, en gaf hen in de hand van rovers, totdat Hij hen van Zijn aangezicht weggeworpen had.","21":"Want Hij scheurde Israël af van het huis van David, en zij maakten Jerobeam, de zoon van Nebat, koning; en Jerobeam dreef Israël weg van achter de HEERE vandaan, en liet hen een grote zonde zondigen.","22":"Zo wandelden de kinderen van Israël in alle zonden van Jerobeam die hij gedaan had; zij weken daar niet van af;","23":"Totdat de HEERE Israël van Zijn aangezicht wegdeed, zoals Hij gesproken had door de dienst van al Zijn knechten, de profeten; zo werd Israël weggevoerd uit zijn land naar Assyrië, tot op deze dag.","24":"De koning van Assyrië nu bracht *volk* uit Babel, en uit Chuta, en uit Avva, en uit Hamath, en Sefarvaim, en liet hen wonen in de steden van Samaria, in de plaats van de kinderen van Israël; en zij namen Samaria in bezit, en woonden in haar steden.","25":"En het gebeurde in het begin van hun wonen daar, dat zij de HEERE niet vreesden; toen zond de HEERE leeuwen onder hen, die enkelen van hen doodden.","26":"Daarom spraken zij tot de koning van Assyrië en zeiden: De volken die u weggevoerd hebt, en hebt laten wonen in de steden van Samaria, kennen de wijze van de God van het land niet; daarom heeft Hij leeuwen onder hen gezonden, en zie, zij doden hen, omdat zij de wijze van de God van het land niet kennen.","27":"Toen gaf de koning van Assyrië bevel en zei: Breng een van de priesters daarheen, die u vandaar weggevoerd hebt, laat hen heentrekken, en daar wonen; en laat hij hun de wijze van de God van het land leren.","28":"Zo kwam een van de priesters die zij van Samaria weggevoerd hadden, en woonde te Beth-El; en hij leerde hun hoe zij de HEERE vrezen moesten.","29":"Maar elk volk maakte zijn eigen goden; en zij zetten ze in de huizen van de hoogten, die de Samaritanen gemaakt hadden, elk volk in hun steden waar zij woonden.","30":"Want de mensen van Babel maakten Sukkoth-Benoth, en de mensen van Chut maakten Nergal, en de mensen van Hamath maakten Asima,","31":"En de Avieten maakten Nibhaz en Tartak, en de Sefarvieten verbrandden hun zonen voor Adramelech en Anamelech, de goden van Sefarvaim, met vuur.","32":"Ook vreesden zij de HEERE, en maakten zich uit hun geringste eigen priesters van de hoogten, die voor hen *dienst* deden in de huizen van de hoogten.","33":"Zij vreesden de HEERE, en dienden *ook* hun eigen goden, naar de wijze van de volken van wie zij weggevoerd waren.","34":"Tot op deze dag doen zij naar de eerdere gewoonten; zij vrezen de HEERE niet, en zij doen niet naar hun inzettingen, en naar hun rechten, en naar de wet, en naar het gebod, dat de HEERE geboden heeft aan de kinderen van Jakob, aan wie Hij de naam Israël gaf.","35":"Toch had de HEERE een verbond met hen gemaakt, en had hun geboden en gezegd: U zult geen andere goden vrezen, noch u voor hen neerbuigen, noch hen dienen, noch hun offers brengen.","36":"Maar de HEERE, Die u uit het land Egypte met grote kracht en met een uitgestrekte arm opgevoerd heeft, Hem zult u vrezen, en voor Hem zult u zich buigen, en Hem zult u offers brengen;","37":"En de inzettingen, en de rechten, en de wet, en het gebod, die Hij u geschreven heeft, zult u in acht nemen om ze te doen, alle dagen; en u zult geen andere goden vrezen.","38":"En het verbond dat Ik met u gemaakt heb, zult u niet vergeten; en u zult geen andere goden vrezen.","39":"Maar de HEERE, uw God, zult u vrezen; en Hij zal u redden uit de hand van al uw vijanden.","40":"Toch luisterden zij niet, maar zij deden naar hun eerdere gewoonte.","41":"Maar deze volken vreesden de HEERE, en dienden hun gesneden beelden; ook doen hun kinderen en hun kleinkinderen, zoals hun vaders gedaan hebben, tot op deze dag."},"SV":{"1":"In het twaalfde jaar van Achaz, den koning van Juda, werd Hosea, de zoon van Ela, koning over Israël te Samaria, *en* *regeerde* negen jaren.","2":"En hij deed dat kwaad was in de ogen des HEEREN; evenwel niet, als de koningen van Israël, die voor hem geweest waren.","3":"Tegen hem toog op Salmaneser, koning van Assyrië; en Hosea werd zijn knecht, dat hij hem een geschenk gaf.","4":"Maar de koning van Assyrië bevond een verbintenis in Hosea, dat hij tot So, den koning van Egypte, boden gezonden had, en het geschenk aan den koning van Assyrië niet als te voren van jaar tot jaar opbracht; zo besloot hem de koning van Assyrië, en bond hem in het gevangenhuis.","5":"Want de koning van Assyrië toog op in het ganse land; ja, hij kwam op naar Samaria, en hij belegerde haar drie jaren.","6":"In het negende jaar van Hosea, nam de koning van Assyrië Samaria in, en voerde Israël weg in Assyrië, en deed ze wonen in Halah, en in Habor, aan de rivier Gozan, en in de steden der Meden.","7":"Want het was geschied, dat de kinderen Israëls gezondigd hadden tegen den HEERE, hun God, Die hen uit Egypteland opgebracht had, van onder de hand van Farao, den koning van Egypte; en hadden andere goden gevreesd;","8":"En hadden gewandeld in de inzettingen der heidenen, die de HEERE voor het aangezicht der kinderen Israëls verdreven had, en der koningen van Israël, die ze gemaakt hadden.","9":"En de kinderen Israëls hadden de zaken, die niet recht zijn, tegen den HEERE, hun God, bemanteld; en hadden zich hoogten gebouwd in al hun steden, van den wachttoren af tot de vaste steden toe.","10":"En zij hadden zich staande beelden opgericht en bossen, op allen hogen heuvel en onder alle groen geboomte.","11":"En zij hadden daar gerookt op alle hoogten, gelijk de heidenen, die de HEERE van hun aangezichten weggevoerd had; en zij hadden kwade dingen gedaan, om den HEERE tot toorn te verwekken.","12":"En zij hadden de drekgoden gediend, waarvan de HEERE tot hen gezegd had: Gij zult deze zaak niet doen.","13":"Als nu de HEERE tegen Israël en tegen Juda, door den dienst van alle profeten, van alle zieners, betuigd had, zeggende: Bekeert u van uw boze wegen en houdt Mijn geboden, *en* Mijn inzettingen, naar al de wet, die Ik uw vaderen geboden heb, en die Ik tot u door de hand van Mijn knechten, de profeten, gezonden heb;","14":"Zo hoorden zij niet, maar zij verhardden hun nek, gelijk de nek hunner vaderen geweest was, die aan den HEERE, hun God, niet geloofd hadden.","15":"Daartoe verwierpen zij Zijn inzettingen, en Zijn verbond, dat Hij met hun vaderen gemaakt had, en Zijn getuigenissen, die Hij tegen hen betuigd had, en wandelden de ijdelheid na, dat zij ijdel werden, en achter de heidenen, die rondom hen waren, van dewelke de HEERE hun geboden had, dat zij niet zouden doen gelijk die.","16":"Ja, zij verlieten al de geboden des HEEREN, huns Gods, en maakten zich gegoten beelden, twee kalveren; en maakten bossen, en bogen zich voor alle heir des hemels, en dienden Baäl.","17":"Ook deden zij hun zonen en hun dochteren door het vuur gaan, en gebruikten waarzeggerijen, en gaven op vogelgeschrei acht, en verkochten zich, om te doen dat kwaad was in de ogen des HEEREN, om Hem tot toorn te verwekken.","18":"Daarom vertoornde zich de HEERE zeer over Israël, dat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.","19":"Zelfs hield Juda de geboden des HEEREN, huns Gods, niet; maar zij wandelden in de inzettingen van Israël, die zij gemaakt hadden.","20":"Zo verwierp de HEERE het ganse zaad van Israël, en bedrukte hen, en gaf ze in de hand der rovers, totdat Hij hen van Zijn aangezicht weggeworpen had.","21":"Want Hij scheurde Israël van het huis van David af, en zij maakten Jerobeam, den zoon van Nebat, koning; en Jerobeam dreef Israël af van achter den HEERE, en hij deed ze een grote zonde zondigen.","22":"Alzo wandelden de kinderen Israëls in alle zonden van Jerobeam die hij gedaan had; zij weken daarvan niet af;","23":"Totdat de HEERE Israël van Zijn aangezicht wegdeed, gelijk als Hij gesproken had door den dienst van al Zijn knechten, de profeten; alzo werd Israël weggevoerd uit zijn land naar Assyrië, tot op dezen dag.","24":"De koning nu van Assyrië bracht *volk* van Babel, en van Chuta, en van Avva, en van Hamath, en Sefarvaim, en deed hen wonen in de steden van Samaria, in de plaats der kinderen Israëls; en zij namen Samaria erfelijk in, en woonden in haar steden.","25":"En het geschiedde in het begin hunner woning aldaar, dat zij den HEERE niet vreesden; zo zond de HEERE leeuwen onder hen, die *enigen* van hen doodden.","26":"Daarom spraken zij tot den koning van Assyrië, zeggende: De volken, die gij vervoerd hebt, en hebt doen wonen in de steden van Samaria, weten de wijze des Gods van het land niet; daarom heeft Hij leeuwen onder hen gezonden, en ziet, zij doden hen, dewijl zij niet weten de wijze des Gods van het land.","27":"Toen gebood de koning van Assyrië, zeggende: Brengt een der priesteren daarheen, die gijlieden van daar weggevoerd hebt, dat zij henentrekken, en wonen aldaar; en dat hij hun lere de wijze des Gods van het land.","28":"Zo kwam een uit de priesteren, die zij van Samaria weggevoerd hadden, en woonde te Beth-el; en hij leerde hun, hoe zij den HEERE vrezen zouden.","29":"Maar elk volk maakte zijn goden; en zij stelden ze in de huizen der hoogten, die de Samaritanen gemaakt hadden, elk volk in hun steden, waarin zij woonachtig waren.","30":"Want de lieden van Babel maakten Sukkoth Benoth, en de lieden van Chut maakten Nergal, en de lieden van Hamath maakten Asima,","31":"En de Avieten maakten Nibhaz en Tartak, en de Sefarvieten verbrandden hun zonen voor Adramelech en Anamelech, de goden van Sefarvaim, met vuur.","32":"Ook vreesden zij den HEERE, en maakten zich van hun geringsten priesteren der hoogten, dewelke voor hen *dienst* deden in de huizen der hoogten.","33":"Zij vreesden den HEERE, en dienden *ook* hun goden, naar de wijze der volken, van dewelke zij die weggevoerd hadden.","34":"Tot op dezen dag toe doen die naar de eerste wijzen; zij vrezen den HEERE niet, en zij doen niet naar hun inzettingen, en naar hun rechten, en naar de wet, en naar het gebod, dat de HEERE geboden heeft aan de kinderen van Jakob, dien Hij den naam Israël gaf.","35":"Nochtans had de HEERE een verbond met hen gemaakt, en had hun geboden, zeggende: Gij zult geen andere goden vrezen, noch u voor hen nederbuigen, noch hen dienen, noch hun offerande doen.","36":"Maar den HEERE, Die u uit Egypteland met grote kracht en met een uitgestrekten arm opgevoerd heeft, Dien zult gij vrezen, en voor Hem zult gij u buigen, en Hem zult gij offerande doen;","37":"En de inzettingen, en de rechten, en de wet, en het gebod, die Hij u geschreven heeft, zult gij waarnemen te doen te allen dag; en gij zult andere goden niet vrezen.","38":"En het verbond, dat Ik met u gemaakt heb, zult gij niet vergeten; en gij zult andere goden niet vrezen.","39":"Maar den HEERE, uw God, zult gij vrezen; en Hij zal u redden uit de hand van al uw vijanden.","40":"Doch zij hoorden niet, maar zij deden naar hun eerste wijze.","41":"Maar deze volken vreesden den HEERE, en dienden hun gesneden beelden; ook doen hun kinderen en hun kindskinderen, gelijk als hun vaders gedaan hebben, tot op dezen dag."},"KJV":{"1":"In the twelfth year of Ahaz king of Judah began Hoshea the son of Elah to reign in Samaria over Israel nine years.","2":"And he did that which was evil in the sight of the LORD, but not as the kings of Israel that were before him.","3":"Against him came up Shalmaneser king of Assyria; and Hoshea became his servant, and gave him presents.","4":"And the king of Assyria found conspiracy in Hoshea: for he had sent messengers to So king of Egypt, and brought no present to the king of Assyria, as he had done year by year: therefore the king of Assyria shut him up, and bound him in prison.","5":"Then the king of Assyria came up throughout all the land, and went up to Samaria, and besieged it three years.","6":"In the ninth year of Hoshea the king of Assyria took Samaria, and carried ➔ Israel away into Assyria, and placed them in Halah and in Habor by the river of Gozan, and in the cities of the Medes.","7":"For so it was, that the children of Israel had sinned against the LORD their God, which had brought them up out of the land of Egypt, from under the hand of Pharaoh king of Egypt, and had feared other gods,","8":"And walked in the statutes of the heathen, whom the LORD cast out from before the children of Israel, and of the kings of Israel, which they had made.","9":"And the children of Israel did secretly those things that were not right against the LORD their God, and they built them high places in all their cities, from the tower of the watchmen to the fenced city.","10":"And they set them up images and groves in every high hill, and under every green tree:","11":"And there they burnt incense in all the high places, as did the heathen whom the LORD carried away before them; and wrought wicked things to provoke the LORD to anger:","12":"For they served idols, whereof the LORD had said unto them, Ye shall not do this thing.","13":"Yet the LORD testified against Israel, and against Judah, by all the prophets, and by all the seers, saying, Turn ye from your evil ways, and keep my commandments and my statutes, according to all the law which I commanded your fathers, and which I sent to you by my servants the prophets.","14":"Notwithstanding they would not hear, but hardened their necks, like to the neck of their fathers, that did not believe in the LORD their God.","15":"And they rejected his statutes, and his covenant that he made with their fathers, and his testimonies which he testified against them; and they followed vanity, and became vain, and went after the heathen that were round about them, concerning whom the LORD had charged them, that they should not do like them.","16":"And they left all the commandments of the LORD their God, and made them molten images, even two calves, and made a grove, and worshipped all the host of heaven, and served Baal.","17":"And they caused their sons and their daughters to pass through the fire, and used divination and enchantments, and sold themselves to do evil in the sight of the LORD, to provoke him to anger.","18":"Therefore the LORD was very angry with Israel, and removed them out of his sight: there was none left but the tribe of Judah only.","19":"Also Judah kept not the commandments of the LORD their God, but walked in the statutes of Israel which they made.","20":"And the LORD rejected all the seed of Israel, and afflicted them, and delivered them into the hand of spoilers, until he had cast them out of his sight.","21":"For he rent Israel from the house of David; and they made Jeroboam the son of Nebat king: and Jeroboam drave Israel from following the LORD, and made them sin a great sin.","22":"For the children of Israel walked in all the sins of Jeroboam which he did; they departed not from them;","23":"Until the LORD removed Israel out of his sight, as he had said by all his servants the prophets. So was Israel carried away out of their own land to Assyria unto this day.","24":"And the king of Assyria brought men from Babylon, and from Cuthah, and from Ava, and from Hamath, and from Sepharvaim, and placed them in the cities of Samaria instead of the children of Israel: and they possessed Samaria, and dwelt in the cities thereof.","25":"And so it was at the beginning of their dwelling there, that they feared not the LORD: therefore the LORD sent lions among them, which slew some of them.","26":"Wherefore they spake to the king of Assyria, saying, The nations which thou hast removed, and placed in the cities of Samaria, know not the manner of the God of the land: therefore he hath sent lions among them, and, behold, they slay them, because they know not the manner of the God of the land.","27":"Then the king of Assyria commanded, saying, Carry thither one of the priests whom ye brought from thence; and let them go and dwell there, and let him teach them the manner of the God of the land.","28":"Then one of the priests whom they had carried away from Samaria came and dwelt in Bethel, and taught them how they should fear the LORD.","29":"Howbeit every nation made gods of their own, and put them in the houses of the high places which the Samaritans had made, every nation in their cities wherein they dwelt.","30":"And the men of Babylon made Succothbenoth, and the men of Cuth made Nergal, and the men of Hamath made Ashima,","31":"And the Avites made Nibhaz and Tartak, and the Sepharvites burnt their children in fire to Adrammelech and Anammelech, the gods of Sepharvaim.","32":"So they feared the LORD, and made unto themselves of the lowest of them priests of the high places, which sacrificed for them in the houses of the high places.","33":"They feared the LORD, and served their own gods, after the manner of the nations whom they carried away from thence.","34":"Unto this day they do after the former manners: they fear not the LORD, neither do they after their statutes, or after their ordinances, or after the law and commandment which the LORD commanded the children of Jacob, whom he named Israel;","35":"With whom the LORD had made a covenant, and charged them, saying, Ye shall not fear other gods, nor bow yourselves to them, nor serve them, nor sacrifice to them:","36":"But the LORD, who brought you up out of the land of Egypt with great power and a stretched out arm, him shall ye fear, and him shall ye worship, and to him shall ye do sacrifice.","37":"And the statutes, and the ordinances, and the law, and the commandment, which he wrote for you, ye shall observe to do for evermore; and ye shall not fear other gods.","38":"And the covenant that I have made with you ye shall not forget; neither shall ye fear other gods.","39":"But the LORD your God ye shall fear; and he shall deliver you out of the hand of all your enemies.","40":"Howbeit they did not hearken, but they did after their former manner.","41":"So these nations feared the LORD, and served their graven images, both their children, and their children's children: as did their fathers, so do they unto this day."}},"tsk":{"1":[{"kopje":"In het twaalfde","refs":["2 Kon 15:30","2 Kon 15:30","2 Kon 17:1"]},{"kopje":"Hosea","refs":["2 Kon 15:30","2 Kon 18:9","2 Kon 17:1"]}],"2":[{"kopje":"toch niet zoals de koningen","refs":["2 Kon 3:2","2 Kon 10:31","2 Kon 13:2","2 Kon 13:11","2 Kon 15:9","2 Kon 15:18","2 Kon 15:24","2 Kron 30:5-11"]}],"3":[{"kopje":"Salmaneser","refs":["2 Kon 18:9","Hos 10:14"]},{"kopje":"koning van Assyrië","refs":["2 Kon 15:19","2 Kon 15:29","2 Kon 16:7","2 Kon 18:13","2 Kon 19:36","2 Kon 19:37","Jes 7:7","Jes 7:8","Jes 10:5","Jes 10:6","Jes 10:11","Jes 10:12"]},{"kopje":"en Hosea","refs":["2 Kon 16:8","2 Kon 18:14-16","2 Kon 18:31"]},{"kopje":"geschenk","refs":["2 Sam 8:2","2 Sam 8:6"]}],"4":[{"kopje":"ontdekte een samenzwering","refs":["2 Kon 24:1","2 Kon 24:20","Ezech 17:13-19"]},{"kopje":"koning van Egypte","refs":["2 Kon 18:21","Jes 30:1-4","Jes 31:1-3","Ezech 17:15"]},{"kopje":"bracht","refs":["2 Kon 18:14","2 Kon 18:15"]},{"kopje":"bond hem vast","refs":["2 Kon 25:7","2 Kron 32:11","Ps 149:7","Ps 149:8"]}],"5":[{"kopje" \">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> but not as the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> that were <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him.","3":"Against him came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H8022\">Shalmaneser</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria;</span> and <span class=\"wl wl-kjv\" data-code=\"H1954\">Hoshea</span> became his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">gave</span> him <span class=\"wl wl-kjv\" data-code=\"H4503\">presents.</span>","4":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H7195\">conspiracy</span> in <span class=\"wl wl-kjv\" data-code=\"H1954\">Hoshea:</span> for he had <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to <span class=\"wl wl-kjv\" data-code=\"H5471\">So</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H5927\">brought</span> no <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> as he had done <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> by <span class=\"wl wl-kjv\" data-code=\"H8141\">year:</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> shut him <span class=\"wl wl-kjv\" data-code=\"H6113\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> him in <span class=\"wl wl-kjv\" data-code=\"H1004\">prison.</span>","5":"Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> and <span class=\"wl wl-kjv\" data-code=\"H6696\">besieged</span> it <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>","6":"In the <span class=\"wl wl-kjv\" data-code=\"H8671\">ninth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H1954\">Hoshea</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> and <span class=\"wl wl-kjv\" data-code=\"H1540\">carried</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H1540\">away</span> into <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">placed</span> them in <span class=\"wl wl-kjv\" data-code=\"H2477\">Halah</span> and in <span class=\"wl wl-kjv\" data-code=\"H2249\">Habor</span> by the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H1470\">Gozan,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H4074\">Medes.</span>","7":"For so it was, that the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which had brought them <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> from under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and had <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> cast <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which they had <span class=\"wl wl-kjv\" data-code=\"H6213\">made.</span>","9":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> did <span class=\"wl wl-kjv\" data-code=\"H2644\">secretly</span> those <span class=\"wl wl-kjv\" data-code=\"H1697\">things</span> that were not right against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and they <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> them high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> in all their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> from the <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> of the <span class=\"wl wl-kjv\" data-code=\"H5341\">watchmen</span> to the <span class=\"wl wl-kjv\" data-code=\"H4013\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span>","10":"And they set them <span class=\"wl wl-kjv\" data-code=\"H5324\">up</span> <span class=\"wl wl-kjv\" data-code=\"H4676\">images</span> and <span class=\"wl wl-kjv\" data-code=\"H842\">groves</span> in every <span class=\"wl wl-kjv\" data-code=\"H1364\">high</span> <span class=\"wl wl-kjv\" data-code=\"H1389\">hill,</span> and under every <span class=\"wl wl-kjv\" data-code=\"H7488\">green</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">tree:</span>","11":"And there they burnt <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> in all the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places,</span> as did the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> carried <span class=\"wl wl-kjv\" data-code=\"H1540\">away</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them; and <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">things</span> to provoke the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger:</span>","12":"For they <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> <span class=\"wl wl-kjv\" data-code=\"H1544\">idols,</span> whereof the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Ye shall not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing.</span>","13":"Yet the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5749\">testified</span> against <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and against <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> all the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> and by all the <span class=\"wl wl-kjv\" data-code=\"H2374\">seers,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Turn</span> ye from your <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> and my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> according to all the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> which I <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and which I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to you <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets.</span>","14":"Notwithstanding they would not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> but <span class=\"wl wl-kjv\" data-code=\"H7185\">hardened</span> their <span class=\"wl wl-kjv\" data-code=\"H6203\">necks,</span> like to the <span class=\"wl wl-kjv\" data-code=\"H6203\">neck</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> that did not <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","15":"And they <span class=\"wl wl-kjv\" data-code=\"H3988\">rejected</span> his <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> that he <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> with their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5715\">testimonies</span> which he <span class=\"wl wl-kjv\" data-code=\"H5749\">testified</span> against them; and they <span class=\"wl wl-kjv\" data-code=\"H3212\">followed</span> <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity,</span> and became <span class=\"wl wl-kjv\" data-code=\"H1891\">vain,</span> and went <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> that were round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> them, concerning whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> them, that they should not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> like them.","16":"And they <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> all the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> them molten <span class=\"wl wl-kjv\" data-code=\"H4541\">images,</span> even <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H5695\">calves,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H842\">grove,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal.</span>","17":"And they caused their <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and their <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> to <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> through the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and <span class=\"wl wl-kjv\" data-code=\"H7080\">used</span> <span class=\"wl wl-kjv\" data-code=\"H7081\">divination</span> and <span class=\"wl wl-kjv\" data-code=\"H5172\">enchantments,</span> and <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> themselves to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to provoke him to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger.</span>","18":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H599\">angry</span> with <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5493\">removed</span> them out of his <span class=\"wl wl-kjv\" data-code=\"H6440\">sight:</span> there was none <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> but the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> only.","19":"Also <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> not the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> but <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> which they <span class=\"wl wl-kjv\" data-code=\"H6213\">made.</span>","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3988\">rejected</span> all the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H6031\">afflicted</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H8154\">spoilers,</span> until he had <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> them out of his <span class=\"wl wl-kjv\" data-code=\"H6440\">sight.</span>","21":"For he <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David;</span> and they made <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5028\">Nebat</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">king:</span> and <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> <span class=\"wl wl-kjv\" data-code=\"H5080\">drave</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> from <span class=\"wl wl-kjv\" data-code=\"H310\">following</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and made them <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2401\">sin.</span>","22":"For the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> in all the <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> which he <span class=\"wl wl-kjv\" data-code=\"H6213\">did;</span> they <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> not from them;","23":"Until the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">removed</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of his <span class=\"wl wl-kjv\" data-code=\"H6440\">sight,</span> as he had <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets.</span> So was <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> carried <span class=\"wl wl-kjv\" data-code=\"H1540\">away</span> out of their own <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> to <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","24":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> men from <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and from <span class=\"wl wl-kjv\" data-code=\"H3575\">Cuthah,</span> and from <span class=\"wl wl-kjv\" data-code=\"H5755\">Ava,</span> and from <span class=\"wl wl-kjv\" data-code=\"H2574\">Hamath,</span> and from <span class=\"wl wl-kjv\" data-code=\"H5617\">Sepharvaim,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">placed</span> them in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> instead of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and they <span class=\"wl wl-kjv\" data-code=\"H3423\">possessed</span> <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> thereof.","25":"And so it was at the <span class=\"wl wl-kjv\" data-code=\"H8462\">beginning</span> of their <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelling</span> there, that they <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> not the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H738\">lions</span> among them, which <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> some of them.","26":"Wherefore they <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H1540\">removed,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">placed</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> <span class=\"wl wl-kjv\" -code=\"H341\">enemies.</span>","40":"Howbeit they did not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken,</span> but they <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> after their <span class=\"wl wl-kjv\" data-code=\"H7223\">former</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">manner.</span>","41":"So these <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> <span class=\"wl wl-kjv\" data-code=\"H3373\">feared</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> their graven <span class=\"wl wl-kjv\" data-code=\"H6456\">images,</span> both their <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1121\">children's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children:</span> as <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> so <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> they unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"twaalfde jaar","tekst":"Hij had het koninkrijk Israëls in het vierde jaar van Achaz, dat is acht jaren tevoren, wel ingenomen, boven, 2Ki 15:30, maar alzo het land vol twisten en beroerten om de kroon was, schijnt noch hij, noch iemand de acht jaren een bevestigd koning geweest te zijn; of, indien hij nog voor koning gehouden is geweest, zo was hij onder het tribuut des konings van Assyrië, ja ook [alzo enigen menen] als zijn gevangene; zulks dat de voorgemelde acht jaren hier niet komen in rekening van zijn koninkrijk; anders heeft hij zeventien jaren geregeerd. Vergelijk boven, 2Ki 15:30; onder, 2Ki 18:9. Anderen menen dat hij de eerste acht jaren onafhankelijk als souverein heeft geregeerd, en de andere negen als schatplichtige, en dat de Heilige Schriftuur van deze laatste alleen hier gewag maakt."},{"catchword":"en regeerde","tekst":"Van deze ingevoegde woorden zie 1Ki 15:33."}],"2":[{"catchword":"niet,","tekst":"Dat is, niet met zulke grote afgoderij; want de vorigen hadden meest niet alleen de gouden kalven, maar ook Baäl en andere gruwelen der heidenen gediend. Sommigen verstaan ook dat hij zijn volk heeft laten gaan naar Jeruzalem om daar te offeren, hetwelk tevoren verboden was; 1Ki 12:27."}],"3":[{"catchword":"Salmanéser,","tekst":"Anders ook genaamd in sommige historiën Nabonassar. Hoewel anderen menen dat zij onderscheiden zijn."},{"catchword":"een geschenk gaf","tekst":"Dat is, jaarlijks tribuut of schatting."}],"4":[{"catchword":"bevond","tekst":"Namelijk, omtrent het vijfde of zesde jaar dezer regering van Hosea. Vergelijk onder, 2Ki 18:9."},{"catchword":"So,","tekst":"Anders in de historiën genoemd Sabachos, die zijn voorganger Asychis verdreven hebbende, vele jaren over Egypte geregeerd heeft. Diens hulp heeft Hosea verzocht tegen de Assyriërs."},{"catchword":"gevangenhuis","tekst":"Hebreeuws, het huis der besluiting, of, des bedwangs. Dit is geschied in het negende jaar der regering van den koning Hosea, vermeld in vs.1."}],"6":[{"catchword":"Halah,","tekst":"Eenigen houden het voor Calacine van Assyrië, gelegen boven Adiabene. Zie hiervan ook onder, 2Ki 18:11; 1Ch 5:26."},{"catchword":"Habor,","tekst":"Hetwelk men meent te zijn een bergachtig land van Assyrië, palende aan Medië. Zie onder, 2Ki 18:11."},{"catchword":"rivier","tekst":"Een rivier in Mesopotamië, onder, 2Ki 18:11; 1Ch 5:26. Andres, Nehar-Gozan, een landschap [naar sommiger gevoelen] in Medië."},{"catchword":"Meden","tekst":"Zie Gen 10:2."}],"7":[{"catchword":"andere goden","tekst":"Zie Gen 35:2."}],"8":[{"catchword":"die ze gemaakt hadden","tekst":"Versta, de inzettingen, die de koningen Israëls gemaakt hadden. Alzo onder, vs.19; of der koningen Israëls, die zij, te weten de kinderen Israëls, opgeworpen hadden."}],"9":[{"catchword":"tegen den HEERE,","tekst":"Anders, met den HEERE; dat is, met den naam of dekmantel van den dienst des Heeren."},{"catchword":"bemanteld;","tekst":"Hebreeuws eigenlijk, bedekt; dat is, zij hebben hun afgoderij verschoond en bekleed met den naam en schijn van godsdienstigheid, heiligheid en goede mening, willende God dienen, niet naar zijn woord, maar naar hun goeddunken tegen het uitgedrukte bevel Gods; Num 15:39."},{"catchword":"van den wachttoren af","tekst":"Dat is, overal, door het gehele land, zowel in kleine en onbewoonde plaatsen en in het veld, als in grote en volkrijke plaatsen en in steden. De wachttorens waren hier en daar in het land, om het volk voor de vijanden te waarschuwen, of om het vee en de vruchten te bewaren."}],"10":[{"catchword":"staande beelden","tekst":"Zie Lev 26:1."},{"catchword":"bossen,","tekst":"Zie Exo 34:13, en Deu 7:5, met de aantekeningen. Anders, bosgoden, bosbeelden."},{"catchword":"op allen hogen heuvel","tekst":"Zie Deu 12:2."}],"12":[{"catchword":"drekgoden","tekst":"Zie Lev 26:30."}],"13":[{"catchword":"dienst","tekst":"Hebreeuws, door de hand."},{"catchword":"zieners,","tekst":"Te weten, dien God zijn wil verklaard had op allerlei manieren, die God in die tijden gebruikte om de mensen te onderwijzen, als door aanspraken, gezichten, of dromen. Zie Num 12:6."}],"14":[{"catchword":"verhardden","tekst":"Dat is, zij waren ten uiterste toe ongehoorzaam en wederspannig, niet willende zich naar de vermaningen des Heeren neigen. Zie Exo 32:9."},{"catchword":"aan den HEERE,","tekst":"Dat is, zijn dreigementen niet geloofd hadden."}],"15":[{"catchword":"ijdelheid na,","tekst":"De afgoderij werd ijdelheid genaamd, zowel omdat de afgoden een nietig ding zijn, als omdat het vertrouwen, daarop gesteld, tevergeefs is, ja ook omdat de afgodendienaars van het rechte verstand en oordeel beroofd zijn."}],"16":[{"catchword":"alle heir des hemels,","tekst":"Zie Deu 4:19."},{"catchword":"Baäl","tekst":"Zie Jdg 2:11."}],"17":[{"catchword":"door het vuur gaan,","tekst":"Zie Lev 18:21."},{"catchword":"gebruikten","tekst":"Hebreeuws, waarzeiden, waarzeggingen."},{"catchword":"gaven","tekst":"Zie Lev 19:26."},{"catchword":"verkochten zich,","tekst":"Zie den zin dezer manier van spreken 1Ki 21:20."}],"18":[{"catchword":"Zijn aangezicht;","tekst":"Dat is, uit het land Kanaän, hetwelk Hij hem tot een woning geheiligd had, hebbende daarin zijn kerk, in welker midden Hij woonde, en in deze de uiterlijke tekenen zijner tegenwoordigheid vertoonde. Alzo onder, vs.20, 23, en 2Ki 23:27, en 2Ki 24:3."},{"catchword":"de stam van Juda","tekst":"Zijnde hieronder begrepen de Levieten, die in den stam van Juda woonden, en de Simeonieten, die daaronder gemengd waren, met een deel van Benjamin. Zie 1Ki 11:32."}],"19":[{"catchword":"Juda","tekst":"Dit heeft de zonde der Israëlieten vermeerderd, dat zij door hun kwaad exempel ook die van Juda deden zondigen en tot afgoderij verwekten. Zie Hos 4:15."},{"catchword":"die zij gemaakt hadden","tekst":"Te weten, de Israëlieten."}],"20":[{"catchword":"ganse zaad","tekst":"Te weten, de tien stammen, die Israël genaamd worden tot een onderscheid van Juda, gelijk af te nemen is uit vs.21."}],"21":[{"catchword":"Hij scheurde","tekst":"Namelijk, de Heere, 1Ki 12:24. Of, Israël scheurde zich van het huis Davids af."},{"catchword":"een grote zonde","tekst":"Zie 1Ki 12:30."}],"22":[{"catchword":"die hij gedaan had;","tekst":"Zie 1Ki 14:16."}],"23":[{"catchword":"den dienst","tekst":"Hebreeuws, door de hand."},{"catchword":"tot op dezen dag","tekst":"Dat is, welke vervoering maakt dat zij tot heden, als dit geschreven is, uitlandig zijn en in ballingschap blijven."}],"24":[{"catchword":"Chuta,","tekst":"Een landschap [zo men meent] van woest Arabië, bewoond van de Citaniërs, die aan Syrië grenzen; of van Perzië, hebbende den naam van de rivier Cuta."},{"catchword":"Avva,","tekst":"Zie Deu 2:23, ook Ivva genoemd, onder, 18:34."},{"catchword":"Hamath,","tekst":"Zie Num 13:21."},{"catchword":"Sefarváïm,","tekst":"Het land der stad Sefora, gelegen in Mesopotamië aan den Eufraat."}],"25":[{"catchword":"niet vreesden;","tekst":"Dat is, zij dienden hem niet naar de wettelijke wijze door Mozes voorgeschreven."}],"26":[{"catchword":"spraken zij","tekst":"Namelijk, de nieuwe inwoners door gezanten, die zij tot den koning afvaardigden om hem deze zwarigheid bekend te maken."}],"27":[{"catchword":"der priesteren","tekst":"Dewelke waren, niet de Levietische priesters, maar die de koningen Israëls uit de geringsten des volks gemaakt hadden, 1Ki 12:31."},{"catchword":"dat zij henentrekken,","tekst":"Namelijk, de priester met zijn gevolg, dienaars en huisgezin; of met degenen, die hem geleidden."}],"28":[{"catchword":"vrezen zouden","tekst":"Dat is, dienen; hoewel zonder twijfel meer in de afgodische wijze der voorgaande koningen Israëls dan naar de wet Gods, door Mozes gegeven. Alzo onder, vs.32-33, 41."}],"29":[{"catchword":"elk volk","tekst":"Hebreeuws, volk, volk; alzo in het volgende van vs.29. Zie Gen 7:2."}],"30":[{"catchword":"Sukkôth Benôth,","tekst":"Deze naam, met de volgende in vs.30,31, worden meestendeel gehouden voor namen van afgoden, die de Samaritanen dienden; doch hiervan is verscheiden gevoelen onder de geleerden."}],"31":[{"catchword":"Nibhaz en Tartak,","tekst":"Anders, Nibhan."},{"catchword":"verbrandden","tekst":"Zie Lev 18:21."}],"32":[{"catchword":"van hun geringsten","tekst":"Hebreeuws, van hun einden, of van hun uiterste delen. Zie 1Ki 12:31."}],"33":[{"catchword":"dienden","tekst":"Te weten, elk zijn afgod, naar de wijze zijns lands, waaruit ieder aldaar van de Assyriërs gebracht was."},{"catchword":"van dewelke zij","tekst":"Hebreeuws, van waar."}],"34":[{"catchword":"die naar de eerste wijzen;","tekst":"Versta, de Israëlieten, van welken zie, boven, vs.23; want hier wordt een tegenstelling gemaakt tussen de hardnekkigheid der Israëlieten, die in Assyrië weggevoerd waren, omdat zij hun oude afgoderij niet wilden verlaten; en de veranderlijkheid der Assyriërs om den Heere naar de afgodische manier der Israëlieten te dienen, hoewel zij zulks nooit tevoren gedaan hadden."},{"catchword":"dien Hij","tekst":"Dit wordt hierbij gevoegd om de Israëlieten te verwijten dat zij vergeten hadden de zeer grote weldaden, die God hunnen vader Jakob en meteen hun bewezen had, omtrent dien tijd, als Hij hem den naam Israël gegeven had, hetwelk hen behoorde bewogen te hebben om dien God alleen zuiverlijk te dienen en trouwelijk aan te hangen."}],"35":[{"catchword":"een verbond","tekst":"Zie Gen 17:7; Exo 19:5, enz., en Exo 24:7, enz."}],"36":[{"catchword":"een uitgestrekten arm","tekst":"Zie Exo 6:5."}],"37":[{"catchword":"inzettingen,","tekst":"Versta door deze vier woorden:&lt;i&gt;I.&lt;/i&gt; de wet der ceremonie;&lt;i&gt;II.&lt;/i&gt; de burgerlijke rechten;&lt;i&gt;III.&lt;/i&gt; de ware leer;&lt;i&gt;IV.&lt;/i&gt; de wet der zeden. Zie Gen 26:5."}],"40":[{"catchword":"eerste wijze","tekst":"Die van Jerobeam en andere afgodische koningen ingesteld was."}],"41":[{"catchword":"deze volken","tekst":"Namelijk, de heidenen, die uit Assyrië in Samaria en der Israëlieten land waren komen wonen."},{"catchword":"vreesden den HEERE,","tekst":"Te weten, naar de afgodische wijze der Israëlieten. Zie boven, vs.28."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In the twelveth year of Achaz King of Juda, Hosea the son of Ela became king over Israel at Samaria, (and reigned) [of these inserted words, see 1 Kings 15 on verse 33.] nine years. [he had indeed taken possession of the Kingdome of Israel in the fourth year of Achaz, that is, eight years before, above chapter 15 on verse 30 but in regard the land was full of contestings and troubles about the crown, neither he, nor any man else seemeth to have confirmed, or settled King those eight years, or if he had been yet held to be king he was notwithstanding under the tribute of the King of Assyria, yea also (as some conceive) his prisoner; so that the fore mentioned eight years, come not here in the account of his reign: else he had reigned seventeen years. Compare above chapter 15 verse 30 and below chap. 18 verse 9. others conceive that he reigned the first eight years absolutely as sovereign and the other nine as tributary and that the holy scripture here onely maketh mention of these last."}],"2":[{"catchword":null,"tekst":"And he did that which was evil in the eyes of the LORD: yet not as the King of Israel that had been before him. [that is, not with such great Idolatry: for the former Kigs had for the most part worshipped not onely the golden calves, but also Baal and other abominations of the heathen. Some likewise conceive, that he had let his people go up to Jerusalem, to offer there; which was formerly fobbiden them.]"}],"3":[{"catchword":null,"tekst":"Against him marched Salmaneser. [Otherwise, called also in some Histories, Nabonasser. Although some is of opinion that they were diver&acirc;&euro;&trade;s men] King of Assria: and hosea became his servant. (so) that he gave him a present. [That is, a yearly Tribute, or Tax."}],"4":[{"catchword":null,"tekst":"But the King of Assyria perceived a conspiracy in Hosea, [Namely about the fifth, or sixth year of this reign of Hosea. Compare below chap. 18. V. 9.] that he had sent messengers to So, king of Egypt, [otherwise called in Histories Sabachos, who having expelled his Predecessor Zychis, reigned many years over Egypt. This man&acirc;&euro;&trade;s help did Hosea crave against the Assyrians] and brought not up the present from year to year to the king of Assyria, as formerly (he had done) from year to year: so the king of Assyria shut him up and bound him to prison. [Heb. The house of shut ting up, or compulsion. This was done in the ninth year of king Hosea&acirc;&euro;&trade;s reign, mentioned in first verse.]"}],"5":[{"catchword":null,"tekst":"For the King of Assyria marched up into all the land; yea he marched up into all the land; yea marched up to Samaria, and he besieged it three years."}],"6":[{"catchword":null,"tekst":"in the ninth year of Hosea, the King of Assyria took Samaria, and carried Isreal into Assyria, and made them dwell in Hakah, [samoe hold it to be Calacine of Assyria, lying above Abiabene. See hereof also below chapter 18.11. 1 Chron. 5. Vers. 26.] and in habor, [which is conceived to be an hilly land of Assyria, bordering on Media. See below chap. 18.11.] by the river of Gozan, [a river in Mesopotamia, below chapter 18.11. 1 Chron. 15. V 26: oth. Nebar-Gozan, a country (as some conceive) in Media] and in the cities of Medes. [Gen. 10. On ver. 2.]"}],"7":[{"catchword":null,"tekst":"for it came to pass, that the children of Israel had sinned against the LORD their God who had brought them up out of the land of Egypt, from under the hand of Pharaoh the King of Egypt; and had feared other Gods. [see Gen. 35 on v. 2.]"}],"8":[{"catchword":null,"tekst":"And had walked in the statutes of the Heathen, which the Lord had driven out before the face of the children of Israel, and of the Kings of Isreal, that had made them. [understand the statutes, which the Kings of Israel had made see below v.19. or the Kings of Israel, which they, to wit, the children of Isreal, had set up.]"}],"9":[{"catchword":null,"tekst":"And the children of Israel had cloaked [Heb. Properly covered] the things that are not right, against the Lord their God: [oth, with the Lord, &c. that is, with the name, or clock of the service of God. The meaning is, they excused their idolatry and sins and cloathed them with the name and shew of Religion, holiness and good meaning, willing to serve God, not according to his word, but according to their own fancie, against the express command of God, Numb. 15.39.] and had built them high places in all places all their cities, from the watch-tower to the fenced cities. [i.e. every where thorow out the whole land, as well in small, and unhibited places, and in the field as in great and populous places and cities. The Watch-Towers were here and there built in the land, to warn the people of the enemies approach, or to secure the cattel, and the fruits of the ground.]"}],"10":[{"catchword":null,"tekst":"And they had reared them up standing images, [see Lev. 26. On v. 1] and groves, [see Exod. 34.13. and Deu. 7.5. with the annotate. Oth. Grove-gods, grove-images] on all, (or every) high hill and all (or every) green tree. [see Deu. 12 on v. 2.]"}],"11":[{"catchword":null,"tekst":"And there they had burnt incense on all the high places, as (did) the heathen, whom the LORD had carred away from their faces: and they had done evil things to provoke the LORD to anger."}],"12":[{"catchword":null,"tekst":"And they served the Dung-Gods [See Lev. 26. On v. 30] whereof the LORD had said uto them; thou shalt not do this thing. [see Exo 20:3;4;19. Deut. 4.7, 8.]"}],"13":[{"catchword":null,"tekst":"Now when the LORD had testified against Israel, and against Juda by the ministry [Heb. Hand] of all the Prophets, (and) of all the seers, [to wit, to whom God had declared his will, in all manner of ways, which he used in those times to instruct men by, as by Oracles, Vision, or dreams: see Numb. 12 on v. 6:] saying; turn ye from your evil ways and keep my commandments, (and) my statutes, according to all the law, which I commended your fathers; and which I sent to you by the hand of my servants the prophets: [see Jerem. 8.11 and 25.5. and 35.15.]"}],"14":[{"catchword":null,"tekst":"They then hearkened not; but they hardened their neck, [that is, they were disobedient, and rebellious to the utmost, refusing to yield the exhortations of God: see Exod. 22 on vers. 9] as the neck of their fathers had been, that had not believed o the Lord their God. [that is, had not believed his threatening.]"}],"15":[{"catchword":null,"tekst":"Moreover, they rejected their statutes, and his covenant, which he had made with their fathers, and his testimonies, which he had testified against them and walked after vanity, [idolatry is called vanity, as well because idols are a thing of nothing, as because of the confidence fixed on them is in vain; yea also because idolaters are deprived of right judgment and understanding] (so) that they became vain, and after the heathen, that were round about them, concerning whom the Lord had charged them, that they should not do like them."}],"16":[{"catchword":null,"tekst":"Yea they left all the commandments of the Lord their God, and made them molten images, two calves, and made gloves, and bowed themselves before all the host of heaven, [see Deu. 4. On verse 19.] and served Baal. [see Judges 2 on ver 11.]"}],"17":[{"catchword":null,"tekst":"they also caused their son and their daughters to pass through the fire, [see Lev. 18. On v. 21] and used sooth-saying, [Heb sooth-sayings] and gave bead to the noise of fowls, [see Lev. 19 on verse 26] and sold themselves to do that which was evil in the eyes of the LORD, [see the meaning of this phrase, 1 Kings 21 on verse 21 to provoke him to anger."}],"18":[{"catchword":null,"tekst":"Therefore the Lord was angry against Israel, (so) that he removed them from his face: [i.e. out of the Land of Canaan, which he had hallowed for a habitation to himself, having therein his church in the midst whereof he dwelt, and wherein he shewed the outward tokens of his presence: so below v 20 and 23 and chap. 23 v. 27 and 24.3.] there was nothing left, save the tribe of Juda onely. [being here-under comprised the Levites, that dwelt in the tribe of Juda and Simeonites, that were mingled among them, with a part of Benjamin. [see 1 Kings 1 on v. 32]"}],"19":[{"catchword":null,"tekst":"Even Juda kept not the commandments of the Lord their God: but they walked in the statutes of Israel, which they [to wit, the Israelites] he made. [this aggravate the sinne of the Israelites, that they made by their evil examples those of Juda also to sinne and provoked them to idolatry: see Hos. 4.15:]"}],"20":[{"catchword":null,"tekst":"So the LORD rejected all the seed of Israel, [to wit, the ten tribes, who are called Israel, to distinguish them from Juda, as appeareth by the following verse] and afflicted them, and delivered them into the hands of the spoilers: until he had cast them away from his face."}],"21":[{"catchword":null,"tekst":"For he rent the house from the house of David, [He, namely the LORD, 1 Kings 14.24. or Israel rent itself from the house of David] and they made Jerobeam the son of Nebat King, and Jerobeam drave Israel away from after the Lord and he made them to sin a great sinne. [see 1 Kings 12 on verse 30]"}],"22":[{"catchword":null,"tekst":"So the children of Israel walked in all the sins of Jerobean, which he had done: [see above chap. 14 on v. 16.] they departed not from them."}],"23":[{"catchword":null,"tekst":"Until the LORD removed Israel from his face according as he had spoken by the ministery [Heb. Hand] of all his servants the Prophets: so Israel was carried away out of their (own) land to Assyria, unto his day. [i.e. which transportation maketh them to be Exiles, and to continue in banishment unto this day, when this was written.]"}],"24":[{"catchword":null,"tekst":"Now the king of Assyria brought (people) from Babeland from Cata, [A countery (as is thought) of desert Arabia, inhabited by the Citanians, which border on Syria: or Persia, having the name from the river Cata,] and from Ava, [see Deut. 2 on verse 23, called also Java, below chap. 18.34.] and from Hamath, [see Numb 13 on verse 21.] and Sepharvaim, [the land of the city of Sephora, lying in Mesopotamia by Euphrates] and made them dwell in the cities of Samari, Instead of the chidren of Israel: and they took Samaria hereditarily, and dwelt in the cities thereof."}],"25":[{"catchword":null,"tekst":"And it came to pass in the beginning of their dwelling there, that they feared not the LORD, [that is, they feared him not according to the lawful manner prescribed by Moseh] so the Lord sent Lions among them, which killed some of them."}],"26":[{"catchword":null,"tekst":"Therefore they spake unto the King of Assyria, [to wit, the Inhabitants by their Ambassadors, whom they dispatched away to the King, to acquaint him with this grievance of theirs] saying; The Nations which thou hast carried away, and hast caused to dwell in the cities of Samaria, know not the manner of the God of the Land: therefore he hath sent Lions among them, and behold they kill them, becase they know not the manner of the God of the Land."}],"27":[{"catchword":null,"tekst":"Then the King of Assyria commanded, saying; bring hither one of the Priests. [which were not the Levitical Priests, but which King of Israel had made of the meanest of the people, 1 Kings 12.31.] whom ye brought away from thence, that they [to wit, the priest with his retinue, servants and household; or with those that conducted him] may go, and dwell there: and that he may teach them the manner of the God of the land."}],"28":[{"catchword":null,"tekst":"So one of the Priests, whom they had carried away from Samaria, came and dwelt at Bethel: and he taught them how they should fear the LORD. [i.e. Serve him: although doubtless more after the Idolatrous manner of the former kings, then after the Law of God given by Moseh: So below v. 32,33,41.]"}],"29":[{"catchword":null,"tekst":"But every Naion [Heb. Nation, nation: so in the following words of this verse: see Gen. 7.on v. 2.] made their (own) Gods, and they put them in the Houses of the high places, which the Samaritans had made; each nation in their cities, wherein they dwelt."}],"30":[{"catchword":null,"tekst":"For the men Babel made Succoth Benoth; [this name, with the rest that follow in this verse, and in the Samaritans worshipped. But hereof are divers opinions among the learned] and the men of Chutmade Nergal; and the men of Hamath made Afima;"}],"31":[{"catchword":null,"tekst":"And the Avvites made Nibba, [otherwise, Nibban] and tartak and the Separvites burnt their sons with fire to Adramelech and Anamelech, the Gods of Separvaim. [see Lev. 18 on v. 21.]"}],"32":[{"catchword":null,"tekst":"They also feared the Lord and made unto themselves priestd of the high places, of their meanest (ones) [Heb. Of their ends, or of their uttermost parts: see 1Kings 12 on verse 31.] which did (service) for them in the houses of the high places."}],"33":[{"catchword":null,"tekst":"they feared the LORD and served (also) their (own) Gods, after the manner of the Nations, from whom [Heb. From whence they had carried them away. [to wit, each their Idol, accrding to the manner of their country from whence each Nation was carried thither by the Assyrias. See Zeph. 1.5.]"}],"34":[{"catchword":null,"tekst":"Until this day they do after the former manners: [understand here the Israelites: of whom see above verse. 23 For here is made an opposition between the stiffneckedness of the Israelites, that are carried away into Assyria, because they would not live their old Idolatry;and the changeableness of The Assyrians to serve the Lord after the aolatrous manner of the Israelites although they had not formerly done it.] they fear not the Lord, neither do they after their statutes, or after their rights, and after the law, and after the commandment which the Lord commanded the children of Jacob to whom he gave the name of Israel. [this is here added, to upbraid the Israelites, that they had forgotten the exceeding great mercies, which God had shewed to their father Jacob and likewise to them; which ought to have moved them to serve the same God alone purely and to cleave unto him faithfully.]"}],"35":[{"catchword":null,"tekst":"Yet the Lord had made a covenant with them, [see Gen 17.7. Exod. 19.5, &c and 24.7&c.] and had changed them saying: ye shall not fear other Gods. Nor how down your selves before them, nor serve them nor do sacrifice to them. [see Jud 6:10]"}],"36":[{"catchword":null,"tekst":"but the LORD who brought you up out of the land of Egypt with great power and with a stretched out arm, [see Exod.6. on v.5.] him shall ye fear and before him shall ye do sacrifice."}],"37":[{"catchword":null,"tekst":"And the statutes and the ordinances, and the law and the commandment, [Understand by these four words: first the ceremonial Law. Secondly, the judicial or civil Laws, Thirdly, the true doctrine. Fourthly, the moral law. See Genesis 26 on v. 5] which he wrote for you, you shall observe to do at all dayes: and ye shall not fear other Gods."}],"38":[{"catchword":null,"tekst":"And the covenant, which I have made with you, ye shall not forget; and ye shall not fear other Gods."}],"39":[{"catchword":null,"tekst":"but ye shall fear God your LORD your god: and he shall deliver you out of the hand of all your enemies."}],"40":[{"catchword":null,"tekst":"Yet they hearkened not, but they did after their former manner. [Which was ordained by Jerobeam, and other Idolatrous Kings.]"}],"41":[{"catchword":null,"tekst":"But these Nations [namely the Heathen, which were come out of Assyria, to dwell in Samaria, and in the land of the Israelites] feared the Lord [to wit, after the idolatrous manner of the Israelites. See above on verse 28.] and spread their carved images: their children also and their children do unto this day, according as their father have done."}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const concordCache = {};

  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);

  } catch (e) { cache[code] = null; }

}

const popupCache = {};

  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];

// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;

document.addEventListener('mouseover', e => {

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
