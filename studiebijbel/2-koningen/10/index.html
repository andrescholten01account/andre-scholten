s","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Achab had zeventig zonen te Samaria; en Jehu schreef brieven, die hij zond naar Samaria, tot de leiders van Jizreël, de oudsten, en tot de voedsterheren van Achab, en zei:","2":"Zo gauw deze brief tot u komt - omdat de zonen van uw heer bij u zijn, ook de wagens en de paarden bij u zijn, alsook een vaste stad, en wapens -","3":"zo kijkt naar de beste en meest geschikte van de zonen van uw heer, zet hem op de troon van zijn vader; en strijdt voor het huis van uw heer.","4":"Doch zij vreesden heel erg, en zeiden: Zie, twee koningen hebben niet voor zijn aangezicht standgehouden, hoe zouden wij dan standhouden?","5":"Die dan over het huis was, en die over de stad was, en de oudsten, en de voedsterheren zonden tot Jehu, en zeiden: Wij zijn uw knechten, en al wat u tot ons zeggen zult, zullen wij doen; wij zullen niemand koning maken; doe wat goed is in uw ogen.","6":"Toen schreef hij voor de tweede keer een brief tot hen, en zei: Als u mijn kant kiest, en u naar mijn stem luistert, neem dan de hoofden van de mannen, de zonen van uw heer, en kom tot mij morgen omtrent deze tijd naar Jizreël. (De zonen van de koning nu, zeventig mannen, waren bij de groten van de stad, die hen opvoedden.)","7":"Het gebeurde dan, toen die brief tot hen kwam, dat zij de zonen van de koning namen, en zeventig mannen slachtten; en zij legden hun hoofden in korven, die zij tot hem zonden naar Jizreël.","8":"En er kwam een bode, en meldde hem, en zei: Zij hebben de hoofden van de zonen van de koning gebracht. En hij zei: Legt ze in twee hopen, aan de deur van de poort, tot morgen.","9":"En het gebeurde 's morgens, toen hij uitging, dat hij stil stond, en tot al het volk zei: U bent rechtvaardig. Zie, ik heb een samenzwering gemaakt tegen mijn heer, en heb hem doodgeslagen; maar wie heeft al dezen geslagen?","10":"Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.","11":"Daartoe sloeg Jehu al de overgeblevenen van het huis van Achab te Jizreël, en al zijn groten, en zijn bekenden, en zijn priesters; totdat hij hem geen overigen liet overblijven.","12":"En hij maakte zich op, en trok heen en ging naar Samaria; en toen hij was te Beth-heked van de herders, onderweg,","13":"vond Jehu de broeders van Ahazia, de koning van Juda, en hij zei: Wie bent u? En zij zeiden: Wij zijn de broeders van Ahazia, en zijn afgekomen, om de zonen van de koning en de zonen van de koningin te groeten.","14":"Toen zei hij: Grijpt hen levend. En zij grepen hen levend; en zij slachtten hen bij de put van Beth-heked, tweeënveertig mannen, en hij liet niemand van hen over.","15":"En van daar weggegaan zijnde, vond hij Jonadab, de zoon van Rechab, hem tegemoet; die hem groette; en hij zei tot hem: Is uw hart oprecht, zoals mijn hart met uw hart is? En Jonadab zei: Het is zo, ja, het is zo; geef mij uw hand. En hij gaf zijn hand, en hij liet hem bij zich op de wagen klimmen.","16":"En hij zei: Ga met mij, en zie mijn ijver aan voor de HEERE. Zo lieten zij hem rijden op zijn wagen.","17":"En toen hij te Samaria kwam, sloeg hij allen, die aan Achab te Samaria overgebleven waren, totdat hij hem had uitgeroeid, naar het woord van de HEERE, dat Hij tot Elia gesproken had.","18":"En Jehu verzamelde al het volk, en zei tot hen: Achab heeft Baäl een weinig gediend; Jehu zal hem veel dienen.","19":"Nu daarom roept alle profeten van Baäl, al zijn dienaren, en al zijn priesters tot mij, dat niemand gemist wordt; want ik heb een grote offerande aan Baäl; al wie gemist wordt, zal niet leven. Doch Jehu deed dat door listigheid, opdat hij de dienaren van Baäl ombracht.","20":"Verder zei Jehu: Heiligt Baäl een dag van het verbod. En zij riepen die uit.","21":"Ook zond Jehu in het gehele Israël; en alle Baälsdienaren kwamen, zodat er niet één man overbleef, die niet kwam; en zij kwamen in het huis van Baäl, zodat het huis van Baäl vol werd van het ene einde tot het andere einde.","22":"Toen zei hij tot hem die over het klerenmagazijn was: Breng voor alle dienaren van Baäl de kleding naar buiten. En hij bracht voor hen de kleding naar buiten.","23":"En Jehu kwam met Jonadab, de zoon van Rechab, in het huis van Baäl; en hij zei tot de dienaren van Baäl: Onderzoekt, en kijkt goed toe, dat hier misschien niemand bij u is van de dienaren van de HEERE, maar alleen van de dienaren van Baäl.","24":"Toen zij nu binnenkwamen, om slachtoffers en brandoffers te doen, stelde Jehu daarbuiten tachtig mannen op, en zei: Als iemand van de mannen, die ik in uw handen gebracht heb, ontkomt, zal zijn ziel in de plaats van diens ziel zijn.","25":"En het gebeurde, toen hij klaar was met het brandoffer te brengen, dat Jehu zei tot de wachters en tot de hoofdmannen: Komt binnen, slaat hen, dat niemand naar buiten komt. En zij sloegen hen met de scherpte van het zwaard; en de wachters en hoofdmannen wierpen hen weg; daarna gingen zij naar de stad, naar het huis van Baäl;","26":"en zij brachten de opgerichte beelden uit het huis van Baäl naar buiten, en verbrandden ze.","27":"Zij braken ook het opgerichte beeld van Baäl af; daartoe braken zij het huis van Baäl af, en maakten dat tot heimelijke gemakken, tot op deze dag.","28":"Zo verdelgde Jehu Baäl uit Israël.","29":"Maar van de zonden van Jerobeam, de zoon van Nebat, die Israël zondigen deed, week Jehu niet af, namelijk van de gouden kalveren, die te Beth-el en die te Dan waren.","30":"De HEERE dan zei tot Jehu: Omdat u goed gedaan hebt, door te doen wat recht is in Mijn ogen, en hebt aan het huis van Achab gedaan, naar alles wat in Mijn hart was, zullen uw zonen tot het vierde geslacht op de troon van Israël zitten.","31":"Maar Jehu nam niet in acht om te wandelen in de wet van de HEERE, de God van Israël, met zijn gehele hart; hij week niet af van de zonden van Jerobeam, die Israël zondigen deed.","32":"In die dagen begon de HEERE Israël in te korten, want Hazaël sloeg hen in alle grensgebieden van Israël:","33":"Vanaf de Jordaan, tegen de opgang van de zon, het gehele land van Gilead, van de Gadieten, en van de Rubenieten, en van de Manassieten; van Aroër, dat aan de beek van Arnon is, en Gilead, en Basan.","34":"Het overige nu van de geschiedenissen van Jehu, en al wat hij gedaan heeft, en al zijn macht, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","35":"En Jehu ontsliep met zijn vaderen, en zij begroeven hem te Samaria, en zijn zoon Joahaz werd koning in zijn plaats.","36":"En de dagen, die Jehu over Israël geregeerd heeft in Samaria, zijn achtentwintig jaren."},"SV":{"1":"Achab nu had zeventig zonen te Samaria; en Jehu schreef brieven, dewelke hij zond naar Samaria, tot de oversten van Jizreël, de oudsten, en tot de voedsterheren van Achab, zeggende:","2":"Zo wanneer nu deze brief tot u zal gekomen zijn, dewijl de zonen van uw heer bij u zijn, ook de wagenen en de paarden bij u zijn, mitsgaders een vaste stad, en wapenen;","3":"Zo ziet naar den beste en gerechtigste van de zonen uws heren, zet dien op zijns vaders troon; en strijdt voor het huis uws heren.","4":"Doch zij vreesden gans zeer, en zeiden: Ziet, twee koningen bestonden niet voor zijn aangezicht, hoe zouden wij dan bestaan?","5":"Die dan over het huis was, en die over de stad was, en de oudsten, en de voedsterheren zonden tot Jehu, zeggende: Wij zijn uw knechten, en al wat gij tot ons zeggen zult, zullen wij doen; wij zullen niemand koning maken; doe wat goed is in uw ogen.","6":"Toen schreef hij ten tweeden male tot hen een brief, zeggende: Zo gij mijn zijt, en gij naar mijn stem hoort, neemt de hoofden van de mannen, de zonen uws heren, en komt tot mij morgen omtrent dezen tijd naar Jizreël. (De zonen nu de konings, zeventig mannen, waren bij de groten der stad, die hen opvoedden.)","7":"Het geschiedde dan, als die brief tot hen kwam, dat zij de zonen des konings namen, en zeventig mannen sloegen; en zij leiden hun hoofden in korven, die zij tot hem zonden naar Jizreël.","8":"En er kwam een bode, en boodschapte hem, zeggende: Zij hebben de hoofden van de zonen des konings gebracht. En hij zeide: Legt ze in twee hopen, aan de deur der poort, tot morgen.","9":"En het geschiedde des morgens, toen hij uitging, dat hij stil stond, en tot al het volk zeide: Gij zijt rechtvaardig. Ziet, ik heb een verbintenis gemaakt tegen mijn heer, en heb hem doodgeslagen; en wie heeft alle deze geslagen?","10":"Weet nu, dat niets van het woord des HEEREN, hetwelk de HEERE tegen het huis van Achab gesproken heeft, zal op de aarde vallen; want de HEERE heeft gedaan, wat Hij door den dienst van Zijn knecht Elia gesproken heeft.","11":"Daartoe sloeg Jehu al de overgeblevenen van het huis van Achab te Jizreël, en al zijn groten, en zijn bekenden, en zijn priesteren; totdat hij hem geen overigen liet overblijven.","12":"En hij maakte zich op, en toog heen en ging naar Samaria; en zijnde te Beth-heked der herderen, op den weg,","13":"Vond Jehu de broederen van Ahazia, den koning van Juda, en hij zeide: Wie zijt gijlieden? En zij zeiden: Wij zijn de broederen van Ahazia, en zijn afgekomen, om de zonen des konings en de zonen der koningin te groeten.","14":"Toen zeide hij: Grijpt hen levend. En zij grepen hen levend; en zij sloegen hen bij den bornput van Beth-heked, twee en veertig mannen, en hij liet niet een van hen over.","15":"En van daar gegaan zijnde, zo vond hij Jonadab, den zoon van Rechab, hem tegemoet; die hem groette; en hij zeide tot hem: Is uw hart recht, gelijk als mijn hart met uw hart is? En Jonadab zeide: Het is, ja, het is; geef uw hand. En hij gaf zijn hand, en hij deed hem tot zich op den wagen klimmen.","16":"En hij zeide: Ga met mij, en zie mijn ijver aan voor den HEERE. Zo deden zij hem rijden op zijn wagen.","17":"En toen hij te Samaria kwam, sloeg hij allen, die aan Achab te Samaria overgebleven waren, totdat hij hem verdelgd had, naar het woord des HEEREN, dat Hij tot Elia gesproken had.","18":"En Jehu verzamelde al het volk, en zeide tot hen: Achab heeft Baäl een weinig gediend; Jehu zal hem veel dienen.","19":"Nu daarom roept alle profeten van Baäl, al zijn dienaren, en al zijn priesteren tot mij, dat niemand gemist worde; want ik heb een grote offerande aan Baäl; al wie gemist wordt, zal niet leven. Doch Jehu deed dat door listigheid, opdat hij de dienaren van Baäl ombracht.","20":"Verder zeide Jehu: Heiligt Baäl een verbods *dag*. en zij riepen *dien* uit.","21":"Ook zond Jehu in het ganse Israël; en alle Baälsdienaren kwamen, dat niet een man overbleef, die niet kwam; en zij kwamen in het huis van Baäl, dat het huis van Baäl vervuld werd van het ene einde tot het andere einde.","22":"Toen zeide hij tot dengene, die over het klederhuis was: Breng voor alle dienaren van Baäl de kleding uit. En hij bracht voor hen de kleding uit.","23":"En Jehu kwam met Jonadab, den zoon van Rechab, in het huis van Baäl; en hij zeide tot de dienaren van Baäl: Onderzoekt, en ziet toe, dat hier misschien bij u niemand zij van de dienaren des HEEREN, maar van de dienaren van Baäl alleen.","24":"Toen zij nu inkwamen, om slachtofferen en brandofferen te doen, bestelde zich Jehu daarbuiten tachtig mannen, en hij zeide: Zo iemand van de mannen, die ik in uw handen gebracht heb, ontkomt, zijn ziel zal voor deszelfs ziel zijn.","25":"En het geschiedde, als hij voleind had het brandoffer te doen, dat Jehu zeide tot de trawanten en tot de hoofdmannen: Komt in, slaat hen, dat niemand uitkome. En zij sloegen hen met de scherpte des zwaard; en de trawanten en hoofdmannen wierpen hen weg; daarna kwamen zij tot de stad in het huis van Baäl;","26":"En zij brachten de opgerichte beelden uit het huis van Baäl, en verbrandden ze.","27":"Zij braken ook het opgerichte beeld van Baäl af; daartoe braken zij het huis van Baäl af, en maakten dat tot heimelijke gemakken, tot op dezen dag.","28":"Alzo verdelgde Jehu Baäl uit Israël.","29":"Maar van de zonden van Jerobeam, den zoon van Nebat, die Israël zondigen deed, na te volgen, week Jehu niet af, *te* *weten*, van de gouden kalveren, die te Beth-el en die te Dan waren.","30":"De HEERE dan zeide tot Jehu: Daarom dat gij welgedaan hebt, doende wat recht is in Mijn ogen, *en* hebt aan het huis van Achab gedaan, naar alles, wat in Mijn hart was, zullen u zonen tot het vierde gelid op den troon van Israël zitten.","31":"Maar Jehu nam niet waar te wandelen in de wet des HEEREN, des Gods van Israël, met zijn ganse hart; hij week niet van de zonden van Jerobeam, die Israël zondigen deed.","32":"In die dagen begon de HEERE Israël af te korten, want Hazaël sloeg ze in alle landpalen van Israël:","33":"Van de Jordaan af, tegen den opgang der zon, het ganse land van Gilead, der Gadieten, en der Rubenieten, en der Manassieten; van Aroer, dat aan de beek van Arnon is, en Gilead, en Basan.","34":"Het overige nu der geschiedenissen van Jehu, en al wat hij gedaan heeft, en al zijn macht, zijn die niet geschreven in het boek der kronieken der koningen van Israël?","35":"En Jehu ontsliep met zijn vaderen, en zij begroeven hem te Samaria, en zijn zoon Joahaz werd koning in zijn plaats.","36":"En de dagen, die Jehu over Israël geregeerd heeft in Samaria, zijn acht en twintig jaren."},"KJV":{"1":"And Ahab had seventy sons in Samaria. And Jehu wrote letters, and sent to Samaria, unto the rulers of Jezreel, to the elders, and to them that brought up Ahab's children, saying,","2":"Now as soon as this letter cometh to you, seeing your master's sons are with you, and there are with you chariots and horses, a fenced city also, and armour;","3":"Look even out the best and meetest of your master's sons, and set him on his father's throne, and fight for your master's house.","4":"But they were exceedingly afraid, and said, Behold, two kings stood not before him: how then shall we stand?","5":"And he that was over the house, and he that was over the city, the elders also, and the bringers up of the children, sent to Jehu, saying, We are thy servants, and will do all that thou shalt bid us; we will not make any king: do thou that which is good in thine eyes.","6":"Then he wrote a letter the second time to them, saying, If ye be mine, and if ye will hearken unto my voice, take ye the heads of the men your master's sons, and come to me to Jezreel by to morrow this time. Now the king's sons, being seventy persons, were with the great men of the city, which brought them up.","7":"And it came to pass, when the letter came to them, that they took the king's sons, and slew seventy persons, and put their heads in baskets, and sent him them to Jezreel.","8":"And there came a messenger, and told him, saying, They have brought the heads of the king's sons. And he said, Lay ye them in two heaps at the entering in of the gate until the morning.","9":"And it came to pass in the morning, that he went out, and stood, and said to all the people, Ye be righteous: behold, I conspired against my master, and slew him: but who slew all these?","10":"Know now that there shall fall unto the earth nothing of the word of the LORD, which the LORD spake concerning the house of Ahab: for the LORD hath done that which he spake by his servant Elijah.","11":"So Jehu slew all that remained of the house of Ahab in Jezreel, and all his great men, and his kinsfolks, and his priests, until he left him none remaining.","12":"And he arose and departed, and came to Samaria. And as he was at the shearing house in the way,","13":"Jehu met with the brethren of Ahaziah king of Judah, and said, Who are ye? And they answered, We are the brethren of Ahaziah; and we go down to salute the children of the king and the children of the queen.","14":"And he said, Take them alive. And they took them alive, and slew them at the pit of the shearing house, even two and forty men; neither left he any of them.","15":"And when he was departed thence, he lighted on Jehonadab the son of Rechab coming to meet him: and he saluted him, and said to him, Is thine heart right, as my heart is with thy heart? And Jehonadab answered, It is. If it be, give me thine hand. And he gave him his hand; and he took him up to him into the chariot.","16":"And he said, Come with me, and see my zeal for the LORD. So they made him ride in his chariot.","17":"And when he came to Samaria, he slew all that remained unto Ahab in Samaria, till he had destroyed him, according to the saying of the LORD, which he spake to Elijah.","18":"And Jehu gathered ➔ all the people together, and said unto them, Ahab served Baal a little; but Jehu shall serve him much.","19":"Now therefore call unto me all the prophets of Baal, all his servants, and all his priests; let none be wanting: for I have a great sacrifice to do to Baal; whosoever shall be wanting, he shall not live. But Jehu did it in subtilty, to the intent that he might destroy the worshippers of Baal.","20":"And Jehu said, Proclaim a solemn assembly for Baal. And they proclaimed it.","21":"And Jehu sent through all Israel: and all the worshippers of Baal came, so that there was not a man left that came not. And they came into the house of Baal; and the house of Baal was full from one end to another.","22":"And he said unto him that was over the vestry, Bring forth vestments for all the worshippers of Baal. And he brought them forth vestments.","23":"And Jehu went, and Jehonadab the son of Rechab, into the house of Baal, and said unto the worshippers of Baal, Search, and look that there be here with you none of the servants of the LORD, but the worshippers of Baal only.","24":"And when they went in to offer sacrifices and burnt offerings, Jehu appointed fourscore men without, and said, If any of the men whom I have brought into your hands escape, he that letteth him go, his life shall be for the life of him.","25":"And it came to pass, as soon as he had made an end of offering the burnt offering, that Jehu said to the guard and to the captains, Go in, and slay them; let none come forth. And they smote them with the edge of the sword; and the guard and the captains cast them out, and went to the city of the house of Baal.","26":"And they brought forth the images out of the house of Baal, and burned them.","27":"And they brake down the image of Baal, and brake down the house of Baal, and made it a draught house unto this day.","28":"Thus Jehu destroyed Baal out of Israel.","29":"Howbeit from the sins of Jeroboam the son of Nebat, who made Israel to sin, Jehu departed not from after them, to wit, the golden calves that were in Bethel, and that were in Dan.","30":"And the LORD said unto Jehu, Because thou hast done well in executing that which is right in mine eyes, and hast done unto the house of Ahab according to all that was in mine heart, thy children of the fourth generation shall sit on the throne of Israel.","31":"But Jehu took no heed to walk in the law of the LORD God of Israel with all his heart: for he departed not from the sins of Jeroboam, which made Israel to sin.","32":"In those days the LORD began to cut ➔ Israel short: and Hazael smote them in all the coasts of Israel;","33":"From Jordan eastward, all the land of Gilead, the Gadites, and the Reubenites, and the Manassites, from Aroer, which is by the river Arnon, even Gilead and Bashan.","34":"Now the rest of the acts of Jehu, and all that he did, and all his might, are they not written in the book of the chronicles of the kings of Israel?","35":"And Jehu slept with his fathers: and they buried him in Samaria. And Jehoahaz his son reigned in his stead.","36":"And the time that Jehu reigned over Israel in Samaria was twenty and eight years."}},"tsk":{"1":[{"kopje":"zeventig zonen","refs":["Richt 8:30","Richt 10:4","Richt 12:14"]},{"kopje":"te Samaria","refs":["2 Kon 5:3","1 Kon 13:32","1 Kon 16:28","2 Kron 22:9"]},{"kopje":"de leiders","refs":["Deut 16:18","1 Kon 21:8-14"]}],"2":[{"kopje":"zo gauw","refs":["2 Kon 5:6"]}],"3":[{"kopje":"kijkt naar","refs":["Deut 17:14","Deut 17:15","1 Sam 10:24","1 Sam 11:15","2 Sam 2:8","2 Sam 2:9","1 Kon 1:24","1 Kon 1:25","1 Kon 12:20"]},{"kopje":"strijdt voor","refs":["2 Sam 2:12-17","1 Kon 12:21","Joh 18:36"]}],"4":[{"kopje":"Zie","refs":["2 Kon 9:24","2 Kon 9:27"]},{"kopje":"hoe zouden wij dan standhouden","refs":["Jes 27:4","Jer 49:19","Nahum 1:6","Luk 14:31"]}],"5":[{"kopje":"Wij zijn uw knechten","refs":["2 Kon 18:14","Joz 9:11","Joz 9:24","Joz 9:25","1 Kon 20:4","1 Kon 20:32","Jer 27:7","Jer 27:8","Jer 27:17","Joh 12:26"]}],"6":[{"kopje":"Als u mijn kant kiest","refs":["2 Kon 9:32","Matt 12:30","Luk 9:50"]},{"kopje":"neem","refs":["Num 25:4"]},{"kopje":"de zonen van uw heer","refs":["Deut 5:9","Joz 7:24","Joz 7:25","Job 21:19","Jes 14: data-l=\"L3\" data-code=\"H3058\">over</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3478\">Israël</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4427\">geregeerd</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4427\">heeft</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8111\">in</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8111\">Samaria</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H8111\">zijn</span> achtentwintig <span class=\"wl\" data-l=\"L7\" data-code=\"H8141\">jaren</span>."},"koppeling_kjv":{"1":"And <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> had <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span> And <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> <span class=\"wl wl-kjv\" data-code=\"H5612\">letters,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> of <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel,</span> to the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders,</span> and to them that brought <span class=\"wl wl-kjv\" data-code=\"H539\">up</span> <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab's</span> children, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","2":"Now as soon as this <span class=\"wl wl-kjv\" data-code=\"H5612\">letter</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> to you, seeing your <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> are with you, and there are with you <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> and <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> a <span class=\"wl wl-kjv\" data-code=\"H4013\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> also, and <span class=\"wl wl-kjv\" data-code=\"H5402\">armour;</span>","3":"Look even <span class=\"wl wl-kjv\" data-code=\"H7200\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H2896\">best</span> and <span class=\"wl wl-kjv\" data-code=\"H3477\">meetest</span> of your <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> him on his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> for your <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","4":"But they were <span class=\"wl wl-kjv\" data-code=\"H3966\">exceedingly</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> not <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him: how then shall we <span class=\"wl wl-kjv\" data-code=\"H5975\">stand?</span>","5":"And he that was over the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and he that was over the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> also, and the bringers <span class=\"wl wl-kjv\" data-code=\"H539\">up</span> of the children, <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> We are thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all that thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">bid</span> us; we will not make <span class=\"wl wl-kjv\" data-code=\"H376\">any</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">king:</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> thou that which is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes.</span>","6":"Then he <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> a <span class=\"wl wl-kjv\" data-code=\"H5612\">letter</span> the second <span class=\"wl wl-kjv\" data-code=\"H8145\">time</span> to them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If ye be mine, and if ye will <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto my <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> ye the <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> your <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to me to <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel</span> by to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> this <span class=\"wl wl-kjv\" data-code=\"H6256\">time.</span> Now the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> being <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H376\">persons,</span> were with the great <span class=\"wl wl-kjv\" data-code=\"H1419\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> which brought them <span class=\"wl wl-kjv\" data-code=\"H1431\">up.</span>","7":"And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H5612\">letter</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to them, that they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H376\">persons,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> in <span class=\"wl wl-kjv\" data-code=\"H1731\">baskets,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> him them to <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel.</span>","8":"And there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> a <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> They have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">Lay</span> ye them in <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H6652\">heaps</span> at the entering <span class=\"wl wl-kjv\" data-code=\"H6607\">in</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> until the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning.</span>","9":"And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> that he went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Ye be <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous:</span> behold, I <span class=\"wl wl-kjv\" data-code=\"H7194\">conspired</span> against my <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> him: but who <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> all these?","10":"<span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> <span class=\"wl wl-kjv\" data-code=\"H645\">now</span> that there shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> nothing of the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> that which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah.</span>","11":"So <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> all that <span class=\"wl wl-kjv\" data-code=\"H7604\">remained</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> in <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel,</span> and all his great <span class=\"wl wl-kjv\" data-code=\"H1419\">men,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3045\">kinsfolks,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> until he <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> him none <span class=\"wl wl-kjv\" data-code=\"H8300\">remaining.</span>","12":"And he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">departed,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span> And as he was at the <span class=\"wl wl-kjv\" data-code=\"H7462\">shearing</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span>","13":"<span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">met</span> with the <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> of <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who are ye? And they <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> We are the <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> of <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah;</span> and we go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7965\">salute</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H1377\">queen.</span>","14":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8610\">Take</span> them <span class=\"wl wl-kjv\" data-code=\"H2416\">alive.</span> And they <span class=\"wl wl-kjv\" data-code=\"H8610\">took</span> them <span class=\"wl wl-kjv\" data-code=\"H2416\">alive,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">slew</span> them at the <span class=\"wl wl-kjv\" data-code=\"H953\">pit</span> of the shearing <span class=\"wl wl-kjv\" data-code=\"H1044\">house,</span> even <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> and <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men;</span> neither <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> he <span class=\"wl wl-kjv\" data-code=\"H376\">any</span> of them.","15":"And when he was <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> thence, he <span class=\"wl wl-kjv\" data-code=\"H4672\">lighted</span> on <span class=\"wl wl-kjv\" data-code=\"H3082\">Jehonadab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7394\">Rechab</span> coming to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him: and he <span class=\"wl wl-kjv\" data-code=\"H1288\">saluted</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, <span class=\"wl wl-kjv\" data-code=\"H3426\">Is</span> thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H3477\">right,</span> as my <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> is with thy <span class=\"wl wl-kjv\" data-code=\"H3824\">heart?</span> And <span class=\"wl wl-kjv\" data-code=\"H3082\">Jehonadab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> It <span class=\"wl wl-kjv\" data-code=\"H3426\">is.</span> If it be, <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span> And he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> and he took him <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to him into the <span class=\"wl wl-kjv\" data-code=\"H4818\">chariot.</span>","16":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come</span> with me, and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> my <span class=\"wl wl-kjv\" data-code=\"H7068\">zeal</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> So they made him <span class=\"wl wl-kjv\" data-code=\"H7392\">ride</span> in his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot.</span>","17":"And when he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> he <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> all that <span class=\"wl wl-kjv\" data-code=\"H7604\">remained</span> unto <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> till he had <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> him, according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> to <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah.</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> ➔ all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">little;</span> but <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him <span class=\"wl wl-kjv\" data-code=\"H7235\">much.</span>","19":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> unto me all the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> all his <span class=\"wl wl-kjv\" data-code=\"H5647\">servants,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H3548\">priests;</span> let <span class=\"wl wl-kjv\" data-code=\"H376\">none</span> be <span class=\"wl wl-kjv\" data-code=\"H6485\">wanting:</span> for I have a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> to do to <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal;</span> whosoever shall be <span class=\"wl wl-kjv\" data-code=\"H6485\">wanting,</span> he shall not <span class=\"wl wl-kjv\" data-code=\"H2421\">live.</span> But <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> it in <span class=\"wl wl-kjv\" data-code=\"H6122\">subtilty,</span> to the intent that he might <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H5647\">worshippers</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal.</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">Proclaim</span> a solemn <span class=\"wl wl-kjv\" data-code=\"H6116\">assembly</span> for <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal.</span> And they <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed</span> it.","21":"And <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> through all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5647\">worshippers</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> so that there was not a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> not. And they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal</span> was <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> from one <span class=\"wl wl-kjv\" data-code=\"H6310\">end</span> to <span class=\"wl wl-kjv\" data-code=\"H6310\">another.</span>","22":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him that was over the <span class=\"wl wl-kjv\" data-code=\"H4458\">vestry,</span> Bring <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H3830\">vestments</span> for all the <span class=\"wl wl-kjv\" data-code=\"H5647\">worshippers</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal.</span> And he brought them <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H4403\">vestments.</span>","23":"And <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H935\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H3082\">Jehonadab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7394\">Rechab,</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5647\">worshippers</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> <span class=\"wl wl-kjv\" data-code=\"H2664\">Search,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> that there <span class=\"wl wl-kjv\" data-code=\"H3426\">be</span> here with you none of the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> but the <span class=\"wl wl-kjv\" data-code=\"H5647\">worshippers</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal</span> only.","24":"And when they went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">offer</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> and burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">appointed</span> <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If <span class=\"wl wl-kjv\" data-code=\"H376\">any</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> whom I have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> into your <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">escape,</span> he that letteth him go, his <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> shall be for the <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> of him.","25":"And it came to pass, as soon as he had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H6213\">offering</span> the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> that <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H7323\">guard</span> and to the <span class=\"wl wl-kjv\" data-code=\"H7991\">captains,</span> Go <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slay</span> them; let <span class=\"wl wl-kjv\" data-code=\"H376\">none</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth.</span> And they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> and the <span class=\"wl wl-kjv\" data-code=\"H7323\">guard</span> and the <span class=\"wl wl-kjv\" data-code=\"H7991\">captains</span> cast them <span class=\"wl wl-kjv\" data-code=\"H7993\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal.</span>","26":"And they brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H4676\">images</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> them.","27":"And they brake <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H4676\">image</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> and brake <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> it a draught <span class=\"wl wl-kjv\" data-code=\"H4163\">house</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","28":"Thus <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal</span> out of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","29":"Howbeit from the <span class=\"wl wl-kjv\" data-code=\"H2399\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5028\">Nebat,</span> who made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin,</span> <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> not from <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them, to wit, the <span class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H5695\">calves</span> that were in <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> and that were in <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan.</span>","30":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu,</span> Because thou hast done <span class=\"wl wl-kjv\" data-code=\"H2895\">well</span> in <span class=\"wl wl-kjv\" data-code=\"H6213\">executing</span> that which is <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> according to all that was in mine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> generation shall <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> on the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","31":"But <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> took no <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with all his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart:</span> for he <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> not from the <span class=\"wl wl-kjv\" data-code=\"H2403\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam,</span> which made <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">sin.</span>","32":"In those <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> to <span class=\"wl wl-kjv\" data-code=\"H7096\">cut</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7096\">short:</span> and <span class=\"wl wl-kjv\" data-code=\"H2371\">Hazael</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them in all the <span class=\"wl wl-kjv\" data-code=\"H1366\">coasts</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span>","33":"From <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> <span class=\"wl wl-kjv\" data-code=\"H4217\">eastward,</span> all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> the <span class=\"wl wl-kjv\" data-code=\"H1425\">Gadites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7206\">Reubenites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4520\">Manassites,</span> from <span class=\"wl wl-kjv\" data-code=\"H6177\">Aroer,</span> which is by the <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> <span class=\"wl wl-kjv\" data-code=\"H769\">Arnon,</span> even <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> and <span class=\"wl wl-kjv\" data-code=\"H1316\">Bashan.</span>","34":"Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu,</span> and all that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H1369\">might,</span> are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">chronicles</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span>","35":"And <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers:</span> and they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span> And <span class=\"wl wl-kjv\" data-code=\"H3059\">Jehoahaz</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.","36":"And the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> that <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> was <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zeventig zonen","tekst":"Die hem zonder twijfel uit verscheidene vrouwen geboren waren; zijnde ook onder dezelve begrepen de zonen van zijn zoon Joram en van andere kinderen, van welke Achab grootvader was. Zie onder, vs.3."},{"catchword":"de oversten","tekst":"Versta, enige voortreffelijke hovelingen, welke, ofschoon zij hun ordinaire woning te Jizreël hadden, waren nochtans van Joram naar Samaria gezonden, om acht te nemen op de koninklijke kinderen, terwijl hij in den oorlog tegen de Syriërs bezig was."},{"catchword":"oudsten,","tekst":"Zo genoemd, òf vanwege hun ambt, omdat zij raadsheren waren, òf uit oorzaak van hun ouderdom, omdat zij niet bekwaam zijnde tot den oorlog, nochtans de gemeente met raad en de jeugd met autoriteit voorgaan."},{"catchword":"voedsterheren","tekst":"Die als voogden of leermeesters zorg droegen voor de opvoeding en onderwijzing dezer jonge heren."}],"2":[{"catchword":"Zo wanneer","tekst":"Alzo begint ook de brief des konings van Syrië aan den koning Israëls, boven, 2Ki 5:6."},{"catchword":"vaste stad,","tekst":"Namelijk, Samaria."}],"3":[{"catchword":"beste","tekst":"Hebreeuws, die goed en recht is; dat is, die bekwaamst is om te regeren."},{"catchword":"heren,","tekst":"Namelijk, van Achab, of Joram."},{"catchword":"dien op zijns vaders troon;","tekst":"Dit meent hij niet, maar hij wil de oversten der Samaritanen beproeven, om te weten hoe zij gezind waren, en met wien zij het hielden. Iemand op den stoel zijns vaders zetten, is hem in de plaats zijns vaders koning te maken. Zie 1Ki 2:24, en vergelijk onder, vs.5."}],"4":[{"catchword":"gans zeer,","tekst":"Hebreeuws, zeer zeer."},{"catchword":"twee koningen","tekst":"Namelijk, Joram de koning van Israël, en Ahazia de koning van Juda, boven, 2Ki 9:24, 2Ki 9:27."}],"6":[{"catchword":"mannen,","tekst":"Men oordeelt uit het Hebreeuwse woord dat enige dezer zonen of nakomelingen van Achab tot redelijken ouderdom gekomen waren, welke, gelijk zij navolgers van Achabs boosheid konden zijn, ook deelachtig zijn geworden zijner straffen, naar het rechtvaardig dreigement Gods; Exo 20:5; Deu 5:9."},{"catchword":"groten stad,","tekst":"Dat is, de voornaamsten van staat en waardigheid. Vergelijk onder, 2Ki 25:9, en zie de aantekeningen."},{"catchword":"opvoedden","tekst":"Hebreeuws, groot maakten."}],"7":[{"catchword":"sloegen;","tekst":"Hebreeuws, slachtten, keelden; alzo vs.14."}],"8":[{"catchword":"der poort,","tekst":"Waar men gewoon was recht te doen. Zie Gen 22:17."}],"9":[{"catchword":"Gij zijt rechtvaardig","tekst":"Dat is, ik verklaar u onschuldig over den dood dezer zonen van Achab, denkt niet dat ik gekomen ben om u daarover te beschuldigen; maar zo gij iemand de schuld daarvan zoudt willen opleggen, ziet op mij, die een verbond tegen mijn heer den koning Joram gemaakt, ja ook hem gedood heb; doch niet uit mijn eigen vermeten, maar naar des Heeren voornemen en uitgedrukt bevel. Daarom, gelijk gij onschuldig zijt omdat gij gevolgd hebt mijn last, alzo ik mede omdat ik gevolgd heb Gods last."},{"catchword":"en wie","tekst":"Deze waren geslagen van de oudsten van Samaria uit last van Jehu; beide door besturing des Heeren, gelijk volgt."}],"10":[{"catchword":"dat niets","tekst":"Hij betuigt hiermede openlijk, ofschoon zijn doen kwalijk zou mogen geduid worden, dat hij nochtans anders niet dan naar het woord des Heeren gedaan had. Zie boven, 2Ki 9:7-8."},{"catchword":"zal op de aarde","tekst":"Zie 1Ki 8:56."},{"catchword":"door den dienst","tekst":"Hebreeuws, door de hand. Zie Lev 8:36."}],"11":[{"catchword":"groten,","tekst":"Zonder twijfel, die door Achab groot en vermogend geworden waren in staat, rijkdom en naam."},{"catchword":"bekenden,","tekst":"Of, bloedverwanten; gelijk Rth 2:1."}],"12":[{"catchword":"Beth-héked","tekst":"Dat is, het huis van de binding der herders. Sommigen menen dat dit een dorp is geweest bij Samaria aan den weg gelegen, hebbende zijn naam van binden, omdat de herders daar hun schapen bonden om geschoren te worden."}],"13":[{"catchword":"de broederen van Aházia,","tekst":"Versta, de zonen zijner broeders, 2Ch 22:8. Zie Gen 13:8, waar het woord broeders zo genomen wordt."},{"catchword":"om de zonen","tekst":"Hebreeuws, tot den vrede der zonen van den koning en der zonen der koningin; dat is, opdat wij hun vrede en welstand zouden toewensen. Hetwelk wij noemen groeten."},{"catchword":"konings","tekst":"Namelijk, van Joram en van zijn huisvrouw. Het schijnt dat zij niet wisten dat Ahazia door Jehu omgebracht was."}],"15":[{"catchword":"Rechab,","tekst":"Van een vermaarden man uit het geslacht der Kenieten, en afkomstig van Jethro, den schoonvader van Mozes, 1Ch 2:55; Jer 35:6."},{"catchword":"hem","tekst":"Namelijk, Jehu."},{"catchword":"groette;","tekst":"Hebreeuws, zegende. Zie Gen 31:55."},{"catchword":"Is uw hart recht,","tekst":"Dat is, zijt gij mij van harte toegedaan, gelijk ik u toegedaan ben met al mijn hart?"},{"catchword":"geef uw hand","tekst":"Dit kan men nemen als woorden van Jonadab, of, als anderen, van Jehu."}],"16":[{"catchword":"ijver aan","tekst":"Wat ijver eigenlijk is, zie 1Ki 19:10."},{"catchword":"zij hem rijden","tekst":"Te weten, zijn dienaars, trawanten, of lakeien."}],"17":[{"catchword":"hem verdelgd had,","tekst":"Dat is, zijn huisgezin en geslacht."},{"catchword":"Elia","tekst":"Zie 1Ki 21:21."}],"18":[{"catchword":"Baäl","tekst":"Zie 1Ki 16:31."},{"catchword":"veel dienen","tekst":"Zie de aantekeningen op vs.19."}],"19":[{"catchword":"een grote","tekst":"Hij spreekt met leugen en dubbelzinnigheid [welke middelen niet te prijzen zijn], menende Baäl al zijn priesters en profeten en dienaars te slachten of te doden, en alzo zijn grote offerande te volbrengen."}],"20":[{"catchword":"Verbods- dag.","tekst":"Dat is, een groten vierdag, op denwelken alle dienstelijke werken verboden waren. Zie Lev 23:36."}],"21":[{"catchword":"huis van Baäl,","tekst":"Dat is, den tempel Baäls."},{"catchword":"van het ene einde","tekst":"Hebreeuws, mond aan mond. Alzo onder, 2Ki 21:16."}],"22":[{"catchword":"klederhuis was","tekst":"Of, klederkamer; versta, een kamer, in welke de klederen opgesloten waren, die de Baälpriesters in hun dienst gebruiken moesten. Anders, de klederkast, of, de klederen."},{"catchword":"de kleding uit","tekst":"Omdat God in het Oude Testament zijn priesters een bijzondere kleding [die in het Nieuwe Testament met het priesterdom opgehouden heeft] voorgeschreven had, zo heeft de duivel zulks in zijn priesters willen nabootsen."}],"23":[{"catchword":"dienaren des HEEREN,","tekst":"Dezen wilde hij bij dit werk niet hebben, kwanswijs met dezen schijn, opdat zij hetzelve door hun tegenwoordigheid niet zouden ontheiligen, zijnde van een andere religie, maar in der waarheid, opdat zij onder de dienaars Baäls niet onwetend zouden omgebracht worden."}],"24":[{"catchword":"zijn ziel","tekst":"Dat is, de ziel desgenen, die een zal laten ontkomen, zonder hem te doden. Het woord ziel is hier voor het leven genomen. Zie Gen 19:17."},{"catchword":"deszelfs ziel zijn","tekst":"Dat is, desgenen die ontkomt. De zin is, indien iemand der bestelde mannen een liet ontlopen, dat hij zelf zou moeten sterven."}],"25":[{"catchword":"hij voleind had","tekst":"Te weten, de overste priester der Baälieten. Of toen men voleind had, enz."},{"catchword":"trawanten","tekst":"Dat is, tot die tachtig mannen, van welke in vs.24 gesproken is."},{"catchword":"wierpen hen weg;","tekst":"Versta, de dode lichamen der omgebrachten, die buiten de stad weggeworpen werden."},{"catchword":"huis van Baäl;","tekst":"Dit kan men verstaan van dezelfde stad, of van elke stad waar een huis van Baäl was. Alzo in vs.26. Zie vs.28."}],"27":[{"catchword":"heimelijke gemakken,","tekst":"Dat is, tot privaten of secreten, waar de mensen hun gevoeg maakten, hetwelk zij gedaan hebben tot versmading en verachting van den afgod en den afgodendienst, die daarin gepleegd was geweest. Vergelijk Isa 36:12. In denzelfden zin worden de afgoden in de Heilige Schrift drekgoden genaamd. Zie Lev 26:30, en de aantekeningen daarop."}],"29":[{"catchword":"die te Beth-el en die te Dan waren","tekst":"Te weten, in elke plaats een."}],"30":[{"catchword":"dan zeide","tekst":"Namelijk door iemand van de profeten; gelijk hij ook door een hunner den last ontvangen had, om deze goddelijke wraak uit te voeren; boven, 2Ki 9:7."},{"catchword":"zonen","tekst":"Hebreeuws, zonen der vierden; de vervulling hiervan, zie eerst in Joahaz, onder, vs.35, en daarin in Joas, 2Ki 13:10, ten derde in Jerobeam, 2Ki 14:23, ten vierde in Zacharia, 2Ki 15:8."}],"31":[{"catchword":"zonden van Jeróbeam,","tekst":"Deze zonden worden uitgedrukt boven, vs.29."}],"32":[{"catchword":"af te korten,","tekst":"Of, af te snijden; dat is, zijn landpalen in te trekken en te verminderen. Zie vs.33. En dit is geschied achtervolgens de profetie van Elisa; boven, 2Ki 8:12."},{"catchword":"Házaël","tekst":"De koning van Syrië."}],"33":[{"catchword":"tegen den opgang","tekst":"Versta, ten aanzien van de gelegenheid des lands van Kanaän."},{"catchword":"Gilead,","tekst":"Zie Gen 31:21."},{"catchword":"Aróër,","tekst":"Een stad, gelegen over de Jordaan in den stam van Gad, van welke zie Num 32:34; Jos 12:2."},{"catchword":"Arnon is,","tekst":"Zie Num 21:14; Deu 2:36."},{"catchword":"Gilead,","tekst":"Vergelijk dit met Deu 3:12-14, enz., en de aantekeningen daarop."}],"34":[{"catchword":"in het boek","tekst":"Zie 1Ki 14:19."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":":\\p &c.] had made an end of doing burnt-offering, that Jehu said unto the Guard, [that is, to those fourscore men, of which is spoken in the former verses] and to the Captains; Go in, smite them, let none come forth; and they smote them with the edge of the sword; and the Footmen, and the Captains cast them away: [meaning the dead bodies of those that were slain, which were thrown away out of the city] then they went to the city, into the house of Baal [this may be understood of the same city, or every city where there was an house of Baal: so in the following verse: see v.28.]"}],"2":[{"catchword":null,"tekst":"Now when this letter shall come to you, [Thus beginneth also the letter of the King of Syria to the King of Israel, above chap.5.6.] seeing your Lords sons are likewise a fenced city, [namely, at Samaria] and arms."}],"3":[{"catchword":null,"tekst":"Look then out the best and justest [Heb. that is good and just: that is, that is fit and meet to govern] of your Lords [viz. Achabs or Jorams] sons, set him on his Fathers Throne: [he meant not this in good earnest, but was minded to try the Rulers of the Samaritans, to know how they stood affected, and with whom they sided. To set any one upon his Fathers throne, is to make him King in his Fathers room. See 1 King.2.on v,24. and compare v.5.] and fight for your Lords house."}],"4":[{"catchword":null,"tekst":"But they were very sore [Heb. sore, sore] afraid, and said; behold, two Kings [namely, Joram King of Israel, and Ahazia King of Juda, above chap.9.24,27.] subsisted not before his face; how then should we subsist."}],"5":[{"catchword":null,"tekst":"He then that was over the house, and he that was over the city, and the eldest, and the bringers up (of the children) sent to Jebu, saying; We are thy servants, and whatsoever thou shalt say to us, we will do; we will make no man King, do what is good in thine eyes."}],"6":[{"catchword":null,"tekst":"Then he wrote a letter the second time to them, saying; if ye be mine, and ye hearken to my voice, take the heads of the men, your Lords sons, [It is judged by the Hebrew word, that some of these sons or posterity of Achab were come to a reasonable age, who as they were probably followers of Achabs wickedness, so they were partakers of his punishment, according to the righteous threatening of God, Exo 20:5. Deut.5.9.] and come to me tomorrow about this time to Jizreel: (now the Kings sons, seventy men were with the great (men) [i.e. the chiefest in state and dignity. Compare below chap.25.9. and see the annotate.] of the city, which brought them up.) [Heb. made them great.]"}],"7":[{"catchword":null,"tekst":"It came to pass then, when that letter came to them that they took the Kings sons, and smote [Heb. slew, eat the throats. So v.14.] seventy men: and they put their heads in baskets, which they sent to him to Jizreel."}],"8":[{"catchword":null,"tekst":"And there came a messenger, and told him, saying; they have brought the heads of the Kings sons: and he said; Lay then in two heaps, at the door of the gate [which was the place of Judicature: see Gen.22.on v.17.] until the morning."}],"9":[{"catchword":null,"tekst":"And it came to pass in the morning, when he went forth, that he stood still, and said to all the people: Ye are righteous; Behold, I made a conspiracy against my LORD, and slew him; [that is, I pronounce you innocent and guiltless touching the death of these sons of Achab; think not that I am come to accuse you for it: but if you will lay the blame upon any man, look upon me, that have made a Covenant against my Lord King me, that have made Covenant against my Lord King Joram, yea have also slain him: but not out of mine own presumption, but according to the Lords determination, and express command. Therefore as ye are guiltless, because ye have followed my command, so am I also, because I have followed Gods command] and who hath smitten all these? [these were smitten by the Eldest of Samaria, at Jehu&acirc;&euro;&trade;s command: both by the Lords direction, as followeth.]"}],"10":[{"catchword":null,"tekst":"Know now that there shall fall to the earth nothing of the Word of the LORD, [See 1 Kings 8.on ver.56.] which the LORD spake against the house of Achab: [He testifieth here publicly, that though his practice might be ill construed, yet notwithstanding he had done nothing otherwise then according to the Word of the Lord: see above chap.9. ver.7,8.] for the LORD hath done that which he spake by the ministery [Hebr.hand. See Levit.8.on verse 36.] of his servant Elia. [see 1 Kings 21.v.19,21,29.]"}],"11":[{"catchword":null,"tekst":"Besides Jehu smote all that remained in the house of Achab at Jizreel, and all his Great (men), [Doubtless those that by Achabs means were become great and mighty in state, riches, and name] and his acquaintance, [or, kinsfolks: as Ruth 2.1.] and his Priests: until he left him none remaining."}],"12":[{"catchword":null,"tekst":"And he gat him up, and departed, and went to Samaria; and being at Beth-Heked of the shepherds, [i.e. the house of the binding of the shepherds. Some conceive that this was a Village by Samaria lying or by the way, having its name from binding, because the shepherds bound their sheep there, when they were to be shorn] on the way."}],"13":[{"catchword":null,"tekst":"Jehu found the brethren of Ahazia, king of Juda, [Understand the sons of his brethren, 2 Chron.22.8. See Gen.13.on ver.8. where the word brethren is so taken] and he said; Who are ye? and they said; We are the brethren of Ahazia, and are come down, to salute the sons of the King, and the sons of the Queen. [namely Jorams, and his wifes children. It seemeth that they knew not that Ahazia was slain by Jehu. Hebr. to the peace of the sons of the King, and of the sons of the Queen. i.e. to with them peace and prosperity, which we call saluting, greeting.]"}],"14":[{"catchword":null,"tekst":"Then he said; Take them by the Well of Beth-Heked, two and fourty men, neither left he one of them."}],"15":[{"catchword":null,"tekst":"And being departed thence, he found Jonadab, the son of Rechab, [A noted man of the Family of the Rechabites, and descending from Jethro, Moses Father in Law, 1 Chron.2.55. Jer 35:6.] (coming) to meet him, who saluted [Heb. blessed. See Gen.31.on v.55.] him; [namely Jehu] and he said unto him; Is thy heart right, according as my heart is with thy heart? [i.e. art thou heartily affected toward me, as I am with all my heart affected toward me, as I am with all my heart affected toward thee] and Jonadab said; It is, yea it is, give (me) thine hand: [this may be taken as the words of Jonadab; or, (as others conceive) as the words of Jehu] and he gave (him) his hand, and he made him come up to him into charet."}],"16":[{"catchword":null,"tekst":"And he said: Go with me, and see my zeal [What zeal properly is, see 1 Kings 19.on v.19.] for the LORD: so they [To wit, his Servants, Footmen, or Lackeys] made him ride on his charet."}],"17":[{"catchword":null,"tekst":"And when he came to Samaria, until he had destroyed him: [i.e. His Household and Family] according to the Word of the LORD, which he had spoken to Elias. [see 1 Kings 21.21.]"}],"18":[{"catchword":null,"tekst":"And Jehu assembled all the people, and said unto them; Achab served Baal [See 1 Kings 16.on v.31.] a little: Jehu shall serve him much. [see the annotate.on the following verse.]"}],"19":[{"catchword":null,"tekst":"Now therefore call unto me all the Prophets of Baal, all his servants, and all his Priests, let none be missing, for I have a great sacrifice (to do) to Baal; [He speaketh lyingly and equivocally, (which means are not to be commended) intending to slay, or kill unto Baal, all his Priests, Prophets, and Ministers, and so to perform his great sacrifice] whosoever is wanting, he shall not live: but Jehu did that in subtilty, that he might destroy the worshippers of Baal."}],"20":[{"catchword":null,"tekst":"Moreover, Jehu said; Hallow a Prohibition-(day) [i.e. A great feast day or festival, on which all servile works were forbidden: see Lev.23.on v.36.] for Baal, and they proclaimed it."}],"21":[{"catchword":null,"tekst":"Jehu also sent into all Israel; and all the worshippers of Baal came; (so) that (there) was not a man left that came not: and they came into the house of Baal, [i.e. the Temple of Baal] (so) that the house of Baal was filled, from the one end, to the other end. [Heb. mouth to mouth: so below chap.21.]"}],"22":[{"catchword":null,"tekst":"Then he said to him, that was over the Vestry; [Or, Wardrobe. Understand a chamber, wherein the garments were lock up and kept, which Baals Priests used in the worship of their Idol. Oth. the garment chest, or, the garments] Bring forth the garments for the worshippers of Baal: [because God had prescribed in the Old Testament a certain kind of garment to be worn by his Priests, (which in the New Testament ceased with the Priesthood) therefore the Devil would imitate the same in his Priests] and he brought forth the apparel for them."}],"23":[{"catchword":null,"tekst":"And Jehu came with Jonadab the son of Rechab into the house of Baal: and he said unto the worshippers of Baal; Search, and look, that peradventure there be here none of the servants of the LORD, [These he would not have to be present at this work, under this pretence, that they might not prophane it by their presence, being of another Religion: but in deed and in deed and in truth, that they might not ignorantly be destroyed among the worshippers of Baal onely."}],"24":[{"catchword":null,"tekst":"Now when they came in to perform slay-offerings, and burnt-offerings, Jebu appointed him fourscore men without, and said; If any of the men, that I have brought into your hands, escape, his soul [That is, the soul of him, that letteth one escape, and doth not escape, and doth not kill him. The word soul is here taken for life. See Gen.19.on ver.17.] shall be for the soul of him. [i.e. of him that escapeth. The meaning is, that if any o // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {

  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
