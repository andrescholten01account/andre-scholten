les; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.", "2 Kon 4:33-36": "Zo ging hij naar binnen, en sloot de deur achter hen beiden toe, en bad tot de HEERE. En hij klom op het bed, en ging op het kind liggen, en legde zijn mond op diens mond, en zijn ogen op zijn ogen, en zijn handen op zijn handen, en boog zich over hem heen. En het vlees van het kind werd warm. Daarna kwam hij terug, en liep in het huis heen en weer, en klom weer op het bed, en boog zich over hem heen; en de jongen niesde tot zevenmaal toe; daarna deed de jongen zijn ogen open.", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "2 Kon 13:18": "Daarna zei hij: Neem de pijlen. En hij nam ze. Toen zei hij tegen de koning van Israël: Sla tegen de aarde. En hij sloeg driemaal; daarna stond hij stil.", "1 Sam 1:10": "Zij dan, bitter bedroefd zijnde, bad tot de HEERE, en zij weende zeer.", "Hand 12:20": "En Herodes was zeer verbolgen op de Tyriërs en Sidoniërs; maar zij kwamen eensgezind naar hem toe, en nadat zij Blastus, de kamerheer van de koning, hadden overreed, vroegen zij om vrede, omdat hun land werd bevoorraad vanuit het land van de koning.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Jes 56:2": "Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "Matt 16:8-10": "En Jezus, die dit wist, zei tegen hen: Wat overlegt u bij uzelf, kleingelovigen, dat u geen brood meegenomen hebt? Begrijpt u nog niet, en herinnert u zich niet de vijf broden van de vijfduizend mannen, en hoeveel korven u opnam? Ook niet de zeven broden van de vierduizend mannen, en hoeveel manden u opnam?", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Joh 11:42": "Maar Ik wist dat U Mij altijd hoort; maar vanwege de menigte die er omheen staat heb Ik dit gezegd, opdat zij geloven dat U Mij gezonden hebt.", "Jes 49:10": "Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.", "Spr 19:6": "Velen smeken de gunst van de vorst af; en ieder is een vriend van hem die geschenken geeft.", "Matt 25:40": "En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.", "Gen 41:39": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.", "Rom 12:17": "Vergeld niemand kwaad voor kwaad. Zorg voor wat eerlijk is voor alle mensen.", "2 Sam 16:11": "Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "Job 1:13-22": "Er was nu een dag, dat zijn zonen en zijn dochters aten en wijn dronken in het huis van hun broer, de eerstgeborene. Dat er een bode tot Job kwam en zei: De runderen waren aan het ploegen, en de ezelinnen weidden aan hun zijden. Doch de Sabeeërs deden een inval, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "Jes 26:20": "Ga heen, mijn volk, ga in uw binnenkamers, en sluit uw deuren achter u toe; verberg u voor een klein ogenblik, totdat de gramschap voorbijgaat.", "1 Kon 13:20": "En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;", "Hand 3:16": "En door het geloof in Zijn Naam heeft Zijn Naam deze man sterk gemaakt, die u ziet en kent; en het geloof, dat door Hem is, heeft hem deze volmaakte gezondheid gegeven, in aanwezigheid van u allen.", "Ex 20:8-11": "Gedenk de sabbatdag, dat u die heiligt. Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is;", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "1 Sam 20:29": "En hij zei: Laat mij toch gaan; want ons geslacht heeft een offer in de stad, en mijn broer heeft het mij zelf opgedragen; heb ik nu genade in uw ogen gevonden, laat mij toch wegkomen, dat ik mijn broers zie; hierom is hij niet aan de tafel van de koning gekomen.", "1 Kron 28:19": "Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.", "Joh 11:43": "En toen Hij dit gezegd had, riep Hij met luide stem: Lazarus, kom naar buiten!", "2 Kron 17:7-9": "In het derde jaar van zijn regering nu zond hij naar zijn vorsten, naar Ben-chaïl, en naar Obadja, en naar Zecharja, en naar Nathaneël, en naar Michaja, om te leren in de steden van Juda. En met hen de Levieten, Semaja en Nethanja, en Zebadja, en Asaël, en Semiramoth, en Jonathan, en Adonia, en Tobia, en Tob-adonia, de Levieten, en met hen de priesters Elisama en Joram. En zij leerden in Juda, en het wetboek van de HEERE was bij hen; en zij gingen rond in alle steden van Juda, en leerden onder het volk.", "Neh 5:13": "Ook schudde ik mijn boezem uit, en zei: Zo schudde God uit iedere man die dit woord niet zal nakomen, uit zijn huis en uit zijn arbeid, en hij worde zo uitgeschud en leeg. En de hele gemeente zei: Amen! En zij prezen de HEERE. En het volk deed volgens dit woord.", "Jer 42:4": "En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.", "Luk 20:9-16": "En Hij begon tegen het volk deze gelijkenis te vertellen: Een zeker mens plantte een wijngaard, en verhuurde die aan landbouwers, en ging voor lange tijd naar het buitenland. En toen het de tijd was, stuurde hij een dienstknecht naar de landbouwers, opdat zij hem van de vrucht van de wijngaard zouden geven; maar de landbouwers sloegen hem, en stuurden hem met lege handen weg. En opnieuw stuurde hij nog een andere dienstknecht; maar ook die sloegen zij en behandelden hem schandelijk, en stuurden hem met lege handen weg.", "Ex 4:17": "Neem dan deze staf in uw hand, waarmee u die tekenen doen zult.", "Gen 17:17": "Toen viel Abraham op zijn aangezicht, en hij lachte; en hij zei in zijn hart: Zal aan iemand die honderd jaar oud is een kind geboren worden; en zal Sara, die negentig jaar oud is, baren?", "Ruth 2:4": "En zie, Boaz kwam van Bethlehem, en zei tegen de maaiers: De HEERE zij met u! En zij zeiden tegen hem: De HEERE zegent u!", "Deut 5:31": "Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.", "Gen 29:6": "Verder zei hij tegen hen: Gaat het goed met hem? En zij zeiden: Het gaat goed; en zie, Rachel, zijn dochter, komt met de schapen.", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "2 Kon 9:3": "En neem de oliekruik, en giet die uit over zijn hoofd, en zeg: Zo zegt de HEERE: Ik heb u tot koning gezalfd over Israël. Doe daarna de deur open, en vlucht, en wacht niet.", "1 Kon 18:19": "Nu dan, zend heen, verzamel bij mij heel Israël op de berg Karmel, en de vierhonderdvijftig profeten van Baäl, en de vierhonderd profeten van het bos, die van de tafel van Izebel eten.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Gen 22:2": "En Hij zei: Neem toch uw zoon, uw enige, die u liefhebt, Izak, en ga naar het land Moria, en offer hem daar tot een brandoffer, op een van de bergen die Ik u zeggen zal.", "Luk 9:13": "Maar Hij zei tegen hen: Geeft u hun te eten. En zij zeiden: Wij hebben niet meer dan vijf broden en twee vissen; of we zouden op pad moeten gaan om voor al dit volk voedsel te kopen.", "Hand 8:29": "En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "1 Sam 1:8": "Toen zei Elkana, haar man: Hanna, waarom weent u, en waarom eet u niet, en waarom is uw hart bedroefd? Ben ik u niet beter dan tien zonen?", "2 Kon 2:9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "1 Kor 1:25": "Want het dwaze van God is wijzer dan de mensen; en het zwakke van God is sterker dan de mensen.", "Luk 14:23": "En de heer zei tegen de dienstknecht: Ga de wegen en heggen langs, en dwing hen binnen te komen, zodat mijn huis vol wordt.", "Joh 11:44": "En de gestorvene kwam naar buiten, gebonden aan handen en voeten met grafdoeken, en zijn gezicht was omwonden met een zweetdoek. Jezus zei tegen hen: Maak hem los, en laat hem gaan.", "Ps 103:10": "Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "1 Sam 25:24": "En zij viel aan zijn voeten en zei: Och, mijn heer, laat de misdaad op mij zijn, en laat toch uw dienstmaagd voor uw oren spreken, en hoor de woorden van uw dienstmaagd.", "Mark 5:39": "En toen Hij naar binnen gegaan was, zei Hij tegen hen: Waarom maakt u zo'n opschudding, en waarom weent u? Het kind is niet gestorven, maar het slaapt.", "Hand 13:14": "En zij trokken van Perge het land door, en kwamen te Antiochië, een stad in Pisidië; en gingen op de dag van de sabbat de synagoge in, en gingen zitten.", "Lev 23:1-3": "Daarna sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tegen hen: De vaste feesttijden van de HEERE, die u uitroepen zult, zullen heilige samenkomsten zijn; deze zijn Mijn vaste feesttijden. Zes dagen zal men het werk doen, maar op de zevende dag is de sabbat van de rust, een heilige samenkomst; geen werk zult u doen; het is de sabbat van de HEERE, in al uw woningen.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Matt 10:12": "En als u het huis ingaat, groet het dan.", "2 Tess 1:4": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;", "Jer 13:1-3": "Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:", "2 Kon 9:2": "Als u daar gekomen bent, kijk dan waar Jehu, de zoon van Josafat, de zoon van Nimsi, is; ga naar binnen, en laat hem opstaan uit het midden van zijn broeders, en breng hem in een binnenste kamer.", "2 Kon 2:19": "En de mannen van de stad zeiden tegen Elisa: Zie toch, de ligging van deze stad is goed, zoals mijn heer ziet; maar het water is slecht, en het land onvruchtbaar.", "Joh 4:27": "En daarop kwamen Zijn discipelen en verwonderden zich dat Hij met een vrouw sprak. Toch zei niemand: Wat vraagt U, of: Wat spreekt U met haar?", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ex 33:12-16": "En Mozes zei tegen de HEERE: Zie, U zegt tegen mij: Voer dit volk op! maar U laat mij niet weten aan wie U met mij zult zenden; terwijl U gezegd hebt: Ik ken u bij naam! en ook: U hebt genade gevonden in Mijn ogen! Nu dan, ik bid U, als ik genade gevonden heb in Uw ogen, laat mij dan nu Uw weg weten, en ik zal U kennen, opdat ik genade vind in Uw ogen; en zie aan dat dit volk Uw volk is! Hij dan zei: Zou Mijn aangezicht met u meegaan, om u rust te geven?", "Richt 3:20": "En Ehud kwam bij hem binnen, terwijl hij zat in een koele bovenzaal, die hij voor zich alleen had; zo zei Ehud: Ik heb een woord van God aan u. Toen stond hij op van de stoel.", "Mal 3:16": "Toen spraken zij die de HEERE vrezen, ieder tot zijn naaste: De HEERE merkt er toch op en hoort, en er is een gedenkboek voor Zijn aangezicht geschreven, voor hen die de HEERE vrezen, en voor hen die aan Zijn Naam denken.", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Neh 9:13": "En U bent neergedaald op de berg Sinaï, en hebt met hen gesproken uit de hemel; en U hebt hun rechtmatige rechten gegeven, en getrouwe wetten, goede inzettingen en geboden.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "2 Kon 8:5": "En het gebeurde, terwijl hij de koning vertelde hoe hij een dode levend gemaakt had, zie, dat de vrouw, van wie hij de zoon levend gemaakt had, tot de koning smeekte voor haar huis en voor haar akker. Toen zei Gehazi: Mijn heer koning! Dit is de vrouw, en dit is haar zoon, die Elisa levend gemaakt heeft.", "Ps 118:24": "Dit is de dag, die de HEERE gemaakt heeft; laten we ons daarover verheugen, en verblijd zijn.", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "2 Kon 2:7": "En vijftig mannen van de zonen van de profeten gingen erheen, en gingen op afstand tegenover hen staan; en die beiden stonden bij de Jordaan.", "Neh 5:3-5": "Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen. Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden. Nu is toch ons vlees als het vlees van onze broeders, onze kinderen zijn als hun kinderen; en zie, wij onderwerpen onze zonen en onze dochters tot slaven; ja, er zijn er al enkele van onze dochters onderworpen, zodat het niet in de macht van onze handen is hen vrij te kopen; en anderen hebben onze akkers en onze wijngaarden.", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "Joz 6:5": "En het zal gebeuren, als men langzaam op de ramshoorn blaast, als u het geluid van de bazuin hoort, dan zal heel het volk juichen met een groot gejuich; dan zal de stadsmuur onder zich vallen, en het volk zal daarin klimmen, ieder tegenover zich.", "1 Kon 17:18": "En zij zei tegen Elia: Wat heb ik met u te doen, man van God? Bent u bij mij binnengekomen om mijn ongerechtigheid in gedachtenis te brengen, en om mijn zoon te doden?", "Hand 9:38": "En omdat Lydda dicht bij Joppe was, stuurden de discipelen, toen zij hoorden dat Petrus daar was, twee mannen naar hem toe, die hem smeekten niet te aarzelen naar hen over te komen.", "Lev 23:27-32": "Maar op de tiende van deze zevende maand zal de verzoendag zijn, een heilige samenkomst zult u hebben; dan zult u uw zielen verootmoedigen, en zult de HEERE een vuuroffer offeren. En op diezelfde dag zult u geen werk doen; want het is de verzoendag, om over u verzoening te doen voor het aangezicht van de HEERE, uw God. Want elke ziel, die op diezelfde dag niet verootmoedigd zal zijn geweest, die zal uitgeroeid worden uit haar volk.", "Gen 15:3": "Verder zei Abram: Zie, mij hebt U geen nageslacht gegeven, en zie, de zoon van mijn huis zal mijn erfgenaam zijn!", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "2 Sam 18:33": "Toen raakte de koning zeer ontroerd, en ging naar boven, naar de bovenzaal boven de poort, en huilde; en al gaande zei hij dit: Mijn zoon Absalom, mijn zoon, mijn zoon Absalom! Was ik maar, was ik maar in uw plaats gestorven, Absalom, mijn zoon, mijn zoon!", "Rom 16:2": "opdat u haar ontvangt in de Heere, zoals het de heiligen betaamt, en haar bijstaat in welke zaak zij u ook nodig zou hebben; want zij is een voorstandster geweest van velen, ook van mijzelf.", "Matt 10:42": "En wie een van deze kleinen slechts een beker koud water te drinken geeft, in de naam van een discipel, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.", "Matt 14:16": "Maar Jezus zei tegen hen: Het is voor hen niet nodig om weg te gaan, geeft u hun te eten.", "1 Kon 17:16": "Het meel van de kruik werd niet verteerd, en de olie van de fles ontbrak niet, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Elia.", "Jes 5:4": "Wat is er meer te doen aan Mijn wijngaard, wat Ik daaraan niet gedaan heb? Waarom heb Ik verwacht dat hij goede druiven voortbrengen zou, terwijl hij stinkende druiven heeft voortgebracht?", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Jer 17:21": "Zo zegt de HEERE: Wacht u voor uw zielen, en draag geen last op de sabbatdag, en breng die niet in door de poorten van Jeruzalem.", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Hand 13:44": "En op de volgende sabbat kwam bijna de hele stad samen om het Woord van God te horen.", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Luk 8:53": "En zij lachten Hem uit, omdat zij wisten dat zij gestorven was.", "2 Sam 16:10": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan?", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Num 28:9": "Maar op de sabbatdag twee volkomen eenjarige lammeren, en twee tienden meelbloem, als spijsoffer, met olie gemengd, alsook zijn drankoffer.", "Richt 19:20": "Toen zei de oude man: Vrede zij u! Al wat u ontbreekt, is toch voor mijn rekening; alleen overnacht niet op het plein.", "Luk 1:31": "En zie, u zult zwanger worden, en een Zoon baren, en u zult Hem de naam JEZUS geven.", "1 Kon 17:12": "Maar zij zei: Zo waarachtig als de HEERE, uw God, leeft, ik heb geen koek, alleen een hand vol van het meel in de kruik, en een beetje olie in de fles! En zie, ik heb een paar stukken hout gesprokkeld, en ik ga naar binnen, en zal het voor mij en voor mijn zoon bereiden, zodat wij het eten, en sterven.", "Joh 9:1-34": "Toen Hij voorbijging, zag Hij een man die blind was van zijn geboorte af. En Zijn discipelen vroegen Hem: Rabbi, wie heeft er gezondigd, deze man of zijn ouders, dat hij blind geboren zou worden? Jezus antwoordde: Deze man heeft niet gezondigd, en zijn ouders ook niet, maar dit is gebeurd, opdat de werken van God in hem openbaar zouden worden.", "Fil 4:18": "Maar ik heb alles ontvangen, en ik heb overvloed; ik ben vervuld geworden, nu ik van Epafroditus ontvangen heb wat door u gestuurd was, als een welriekende geur, een aangenaam offer, God welgevallig.", "1 Sam 20:34": "Daarom stond Jonathan van de tafel op in gloed van de toorn; en hij at op de tweede dag van de nieuwe maan geen brood, want hij was bekommerd om David, omdat zijn vader hem gesmaad had.", "Mark 6:43": "En zij verzamelden twaalf volle manden met stukken brood, en van de vissen.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "Jer 4:19": "O mijn binnenste, mijn binnenste! ik heb weeën, o wanden van mijn hart! Mijn hart maakt getier in mij, ik kan niet zwijgen; want u, mijn ziel! hoort het geluid van de bazuin en het krijgsgeschreeuw.", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Num 28:11": "En in het begin van uw maanden zult u een brandoffer de HEERE offeren: twee jonge stieren, en een ram, zeven volkomen eenjarige lammeren;", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Hand 19:12": "zodat ook van zijn lijf op de zieken gedragen werden de zweetdoeken of gordeldoeken, en dat de ziekten van hen weken, en de boze geesten van hen uitvoeren.", "2 Kon 2:21": "Toen ging hij naar de waterbron, en wierp het zout erin, en zei: Zo zegt de HEERE: Ik heb dit water gezond gemaakt, er zal geen dood noch onvruchtbaarheid meer van komen.", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "2 Sam 15:26": "Maar als Hij zo zal zeggen: Ik heb geen behagen in u; zie, hier ben ik, laat Hij met mij doen zoals het goed is in Zijn ogen.", "Hand 13:5": "En toen zij in Salamis gekomen waren, verkondigden zij het woord van God in de synagogen van de Joden; en zij hadden ook Johannes als dienaar.", "2 Kon 1:11": "En hij zond weer naar hem een andere leider over vijftig met zijn vijftigtal. Deze antwoordde en sprak tot hem: Man van God! Zo zegt de koning: Kom snel naar beneden.", "Hagg 2:13": "Zie, iemand draagt heilig vlees in de slip van zijn kleed, en hij raakt met zijn slip het brood aan, of het moes, of de wijn, of de olie, of enig voedsel, zal dat heilig worden? En de priesters antwoordden en zeiden: Nee.", "Deut 28:38-40": "U zult veel zaad naar de akker uitbrengen, maar u zult weinig inzamelen; want de sprinkhaan zal het opeten. Wijngaarden zult u planten en bewerken, maar u zult geen wijn drinken, noch iets vergaren; want de worm zal het opeten. Olijfbomen zult u hebben binnen al uw grondgebied, maar u zult u met olie niet zalven; want uw olijfboom zal zijn vrucht afwerpen.", "Joh 6:11": "En Jezus nam de broden, en nadat Hij gedankt had, deelde Hij ze uit aan de discipelen, en de discipelen aan hen die neergezeten waren; evenzo ook van de visjes, zoveel als zij wilden.", "Joh 19:31": "De Joden dan, opdat de lichamen niet aan het kruis zouden blijven op de sabbat, omdat het de voorbereiding was (want die dag van de sabbat was een grote dag), vroegen Pilatus dat hun benen gebroken zouden worden, en zij weggenomen zouden worden.", "2 Kon 4:8-37": "Het gebeurde ook op een dag, toen Elisa naar Sunem doortrok, dat daar een voorname vrouw was, die hem drong om brood te eten. Verder gebeurde het, zo dikwijls hij doortrok, dat hij daar inwijkt om brood te eten. En zij zei tegen haar man: Zie toch, ik heb gemerkt dat deze man Gods heilig is, die altijd bij ons doortrekt. Laten we toch een kleine bovenkamer aan een muur maken, en daar voor hem neerzetten een bed, en tafel, en stoel, en kandelaar; dan zal het gebeuren, wanneer hij bij ons komt, dat hij daar inwijkt.", "Jer 17:24-27": "Het zal dan gebeuren, als u vlijtig naar Mij zult horen, spreekt de HEERE, dat u geen last door de poorten van deze stad op de sabbatdag inbrengt, en u de sabbatdag heiligt, dat u geen werk daarop doet; Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid. En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "Matt 18:30": "Maar hij wilde niet, maar ging weg en wierp hem in de gevangenis, totdat hij de schuld zou betaald hebben.", "2 Kon 6:12": "En een van zijn knechten zei: Nee, mijn heer koning! Maar Elisa, de profeet die in Israël is, laat de koning van Israël de woorden weten die u in uw binnenste slaapkamer spreekt.", "Ruth 1:16-18": "Maar Ruth zei: Dring er bij mij niet op aan om u te verlaten, om van achter u terug te keren; want waar u heen zult gaan, zal ik ook heen gaan, en waar u zult overnachten, zal ik overnachten; uw volk is mijn volk, en uw God mijn God. Waar u zult sterven, zal ik sterven, en daar zal ik begraven worden; zo doe mij de HEERE en zo doe Hij daar nog aan toe, als niet de dood alléén scheiding zal maken tussen mij en u! Toen zij nu zag dat zij vast van plan was met haar mee te gaan, hield zij op tegen haar te spreken.", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "1 Petr 1:13": "Omgord daarom de lenden van uw verstand, wees nuchter, en hoop volkomen op de genade die u gebracht wordt bij de openbaring van Jezus Christus.", "Ex 15:25": "Hij dan riep tot de HEERE; en de HEERE wees hem een stuk hout, dat wierp hij in het water; toen werd het water zoet. Daar stelde Hij het volk een inzetting en recht, en daar beproefde Hij hen,", "1 Kon 18:9": "Maar hij zei: Wat heb ik gezondigd, dat u uw knecht geeft in de hand van Achab, om mij te doden?", "Hand 22:3": "Ik ben een Joodse man, geboren te Tarsen in Cilicië, maar opgevoed in deze stad, aan de voeten van Gamaliël onderwezen naar de nauwkeurigste wijze van de wet van de vaderen, en ik was een ijveraar voor God, zoals u allen heden bent.", "Joh 6:11-13": "En Jezus nam de broden, en nadat Hij gedankt had, deelde Hij ze uit aan de discipelen, en de discipelen aan hen die neergezeten waren; evenzo ook van de visjes, zoveel als zij wilden. En toen zij verzadigd waren, zei Hij tegen Zijn discipelen: Verzamel de overgebleven brokken, zodat er niets verloren gaat. Zij verzamelden ze dan, en vulden twaalf korven met brokken van de vijf gerstebroden, die overgebleven waren bij hen die gegeten hadden.", "Ex 12:11": "Zo moet u het eten: uw lendenen opgeschort, uw schoenen aan uw voeten, en uw staf in uw hand; en u moet het met haast eten; het is het pascha van de HEERE.", "2 Kon 2:2": "En Elia zei tegen Elisa: Blijf toch hier, want de HEERE heeft mij naar Beth-el gezonden. Maar Elisa zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Zo gingen zij af naar Beth-el.", "Mark 10:35": "En Jakobus en Johannes, de zonen van Zebedeüs, kwamen naar Hem toe, en zeiden: Meester, wij zouden graag willen dat U voor ons deed wat wij ook zullen vragen.", "1 Kron 23:31": "En voor al het offeren van de brandoffers van de HEERE, op de sabbatten, op de nieuwe manen, en op de vastgestelde feesten, in getal, naar de orde onder hen, voortdurend, voor het aangezicht van de HEERE;", "1 Kon 18:29": "En het gebeurde, toen de middag voorbij was, dat zij profeteerden totdat men het spijsoffer zou offeren; maar er was geen stem, en geen die antwoordde, en geen die er acht op sloeg."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H259\">Een</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H802\">vrouw</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H802\">uit</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H802\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H802\">vrouwen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H802\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L4\" data-code= oorzetten</span>? <span class=\"wl\" data-l=\"L2\" data-code=\"H559\">En</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H559\">hij</span> zei: <span class=\"wl\" data-l=\"L8\" data-code=\"H5414\">Geef</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H5414\">aan</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5971\">het</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5971\">volk</span>, zodat <span class=\"wl\" data-l=\"L10\" data-code=\"H398\">zij</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H398\">eten</span>; <span class=\"wl\" data-l=\"L11\" data-code=\"H3588\">want</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H3541\">zo</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H559\">zegt</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H398\">de</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H398\">HEERE</span>: <span class=\"wl\" data-l=\"L10\" data-code=\"H398\">Men</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H398\">zal</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H398\">eten</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H3498\">en</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H3498\">overhouden</span>.", "44": "<span class=\"wl\" data-l=\"L1\" data-code=\"H5414\">Zo</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5414\">zette</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5414\">hij</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5414\">het</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6440\">hun</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6440\">voor</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H3498\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H398\">zij</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H398\">aten</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H398\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3498\">zij</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3498\">hielden</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3498\">over</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H6440\">naar</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6440\">het</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1697\">woord</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1697\">van</span> de HEERE."}, "koppeling_kjv": {"1": "Now there <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> a <span class=\"wl wl-kjv\" data-code=\"H259\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> of the <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> unto <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> my <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead;</span> and thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> that thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> did <span class=\"wl wl-kjv\" data-code=\"H3373\">fear</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5383\">creditor</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> unto him my <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3206\">sons</span> to be <span class=\"wl wl-kjv\" data-code=\"H5650\">bondmen.</span>", "2": "And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, What shall I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> for thee? <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, what <span class=\"wl wl-kjv\" data-code=\"H3426\">hast</span> thou in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house?</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thine <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid</span> hath not any thing in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> save a <span class=\"wl wl-kjv\" data-code=\"H610\">pot</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil.</span>", "3": "Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">borrow</span> thee <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad</span> of all thy <span class=\"wl wl-kjv\" data-code=\"H7934\">neighbours,</span> even <span class=\"wl wl-kjv\" data-code=\"H7386\">empty</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels;</span> borrow not a <span class=\"wl wl-kjv\" data-code=\"H4591\">few.</span>", "4": "And when thou art come <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door</span> upon thee and upon thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and shalt pour <span class=\"wl wl-kjv\" data-code=\"H3332\">out</span> into all those <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> and thou shalt set <span class=\"wl wl-kjv\" data-code=\"H5265\">aside</span> that which is <span class=\"wl wl-kjv\" data-code=\"H4392\">full.</span>", "5": "So she <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> from him, and <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door</span> upon her and <span class=\"wl wl-kjv\" data-code=\"H1157\">upon</span> her <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> <span class=\"wl wl-kjv\" data-code=\"H1992\">who</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">brought</span> the vessels to her; and she poured <span class=\"wl wl-kjv\" data-code=\"H3332\">out.</span>", "6": "And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> were <span class=\"wl wl-kjv\" data-code=\"H4390\">full,</span> that she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">Bring</span> me yet a <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, There is not a <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> more. And the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stayed.</span>", "7": "Then she <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H7999\">pay</span> thy <span class=\"wl wl-kjv\" data-code=\"H5386\">debt,</span> and <span class=\"wl wl-kjv\" data-code=\"H2421\">live</span> thou and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H3498\">rest.</span>", "8": "And it fell on a <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> to <span class=\"wl wl-kjv\" data-code=\"H7766\">Shunem,</span> where was a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman;</span> and she <span class=\"wl wl-kjv\" data-code=\"H2388\">constrained</span> him to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread.</span> And so it was, that as <span class=\"wl wl-kjv\" data-code=\"H1767\">oft</span> as he passed <span class=\"wl wl-kjv\" data-code=\"H5674\">by,</span> he <span class=\"wl wl-kjv\" data-code=\"H5493\">turned</span> in thither to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread.</span>", "9": "And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her <span class=\"wl wl-kjv\" data-code=\"H376\">husband,</span> Behold now, I <span class=\"wl wl-kjv\" data-code=\"H3045\">perceive</span> that this is an <span class=\"wl wl-kjv\" data-code=\"H6918\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which <span class=\"wl wl-kjv\" data-code=\"H5674\">passeth</span> by us <span class=\"wl wl-kjv\" data-code=\"H8548\">continually.</span>", "10": "Let us <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H6996\">little</span> <span class=\"wl wl-kjv\" data-code=\"H5944\">chamber,</span> I pray thee, on the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall;</span> and let us <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> for him there a <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7979\">table,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3678\">stool,</span> and a <span class=\"wl wl-kjv\" data-code=\"H4501\">candlestick:</span> and it shall be, when he <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> to us, that he shall <span class=\"wl wl-kjv\" data-code=\"H5493\">turn</span> in thither.", "11": "And it fell on a <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> thither, and he <span class=\"wl wl-kjv\" data-code=\"H5493\">turned</span> into the <span class=\"wl wl-kjv\" data-code=\"H5944\">chamber,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> there.", "12": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> this <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite.</span> And when he had <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> her, she <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him.", "13": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> now unto her, Behold, thou hast been <span class=\"wl wl-kjv\" data-code=\"H2729\">careful</span> for us with all this <span class=\"wl wl-kjv\" data-code=\"H2731\">care;</span> what is to be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> for thee? <span class=\"wl wl-kjv\" data-code=\"H3426\">wouldest</span> thou be <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> for to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> or to the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host?</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> mine own <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>", "14": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What then is to be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> for her? And <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> <span class=\"wl wl-kjv\" data-code=\"H61\">Verily</span> she hath no <span class=\"wl wl-kjv\" data-code=\"H1121\">child,</span> and her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> is <span class=\"wl wl-kjv\" data-code=\"H2204\">old.</span>", "15": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> her. And when he had <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> her, she <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H6607\">door.</span>", "16": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> About this <span class=\"wl wl-kjv\" data-code=\"H4150\">season,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">life,</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H2263\">embrace</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Nay, my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> thou <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> do not <span class=\"wl wl-kjv\" data-code=\"H3576\">lie</span> unto thine <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid.</span>", "17": "And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> at that <span class=\"wl wl-kjv\" data-code=\"H4150\">season</span> that <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto her, according to the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">life.</span>", "18": "And when the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> was <span class=\"wl wl-kjv\" data-code=\"H1431\">grown,</span> it fell on a <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that he went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> to the <span class=\"wl wl-kjv\" data-code=\"H7114\">reapers.</span>", "19": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> My <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> my <span class=\"wl wl-kjv\" data-code=\"H7218\">head.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to a <span class=\"wl wl-kjv\" data-code=\"H5288\">lad,</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">Carry</span> him to his <span class=\"wl wl-kjv\" data-code=\"H517\">mother.</span>", "20": "And when he had <span class=\"wl wl-kjv\" data-code=\"H5375\">taken</span> him, and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him to his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> he <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> on her <span class=\"wl wl-kjv\" data-code=\"H1290\">knees</span> till <span class=\"wl wl-kjv\" data-code=\"H6672\">noon,</span> and then <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span>", "21": "And she went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">laid</span> him on the <span class=\"wl wl-kjv\" data-code=\"H4296\">bed</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the door upon him, and went <span class=\"wl wl-kjv\" data-code=\"H3318\">out.</span>", "22": "And she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto her <span class=\"wl wl-kjv\" data-code=\"H376\">husband,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">Send</span> me, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H860\">asses,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and come <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span>", "23": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wherefore wilt thou <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> to him to <span class=\"wl wl-kjv\" data-code=\"H3117\">day?</span> it is neither new <span class=\"wl wl-kjv\" data-code=\"H2320\">moon,</span> nor <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath.</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It shall be <span class=\"wl wl-kjv\" data-code=\"H7965\">well.</span>", "24": "Then she <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled</span> an <span class=\"wl wl-kjv\" data-code=\"H860\">ass,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to her <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H5090\">Drive,</span> and go <span class=\"wl wl-kjv\" data-code=\"H3212\">forward;</span> <span class=\"wl wl-kjv\" data-code=\"H6113\">slack</span> not thy <span class=\"wl wl-kjv\" data-code=\"H7392\">riding</span> for me, except I <span class=\"wl wl-kjv\" data-code=\"H559\">bid</span> thee.", "25": "So she <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel.</span> And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> saw her afar <span class=\"wl wl-kjv\" data-code=\"H7200\">off,</span> that he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> Behold, yonder is <span class=\"wl wl-kjv\" data-code=\"H1975\">that</span> <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite:</span>", "26": "<span class=\"wl wl-kjv\" data-code=\"H7323\">Run</span> now, I pray thee, to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> her, and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto her, Is it <span class=\"wl wl-kjv\" data-code=\"H7965\">well</span> with thee? is it <span class=\"wl wl-kjv\" data-code=\"H7965\">well</span> with thy <span class=\"wl wl-kjv\" data-code=\"H376\">husband?</span> is it <span class=\"wl wl-kjv\" data-code=\"H7965\">well</span> with the <span class=\"wl wl-kjv\" data-code=\"H3206\">child?</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> It is <span class=\"wl wl-kjv\" data-code=\"H7965\">well.</span>", "27": "And when she <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to the <span class=\"wl wl-kjv\" data-code=\"H2022\">hill,</span> she <span class=\"wl wl-kjv\" data-code=\"H2388\">caught</span> him by the <span class=\"wl wl-kjv\" data-code=\"H7272\">feet:</span> but <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> came <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> to thrust her <span class=\"wl wl-kjv\" data-code=\"H1920\">away.</span> And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let her <span class=\"wl wl-kjv\" data-code=\"H7503\">alone;</span> for her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> is <span class=\"wl wl-kjv\" data-code=\"H4843\">vexed</span> within her: and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5956\">hid</span> it from me, and hath not <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> me.", "28": "Then she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Did I <span class=\"wl wl-kjv\" data-code=\"H7592\">desire</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord?</span> did I not <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Do not <span class=\"wl wl-kjv\" data-code=\"H7952\">deceive</span> me?", "29": "Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi,</span> Gird <span class=\"wl wl-kjv\" data-code=\"H2296\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H4975\">loins,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> my <span class=\"wl wl-kjv\" data-code=\"H4938\">staff</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and go thy <span class=\"wl wl-kjv\" data-code=\"H3212\">way:</span> if thou <span class=\"wl wl-kjv\" data-code=\"H4672\">meet</span> any <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">salute</span> him not; and if <span class=\"wl wl-kjv\" data-code=\"H376\">any</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">salute</span> thee, answer him not <span class=\"wl wl-kjv\" data-code=\"H6030\">again:</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> my <span class=\"wl wl-kjv\" data-code=\"H4938\">staff</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H5288\">child.</span>", "30": "And the <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> of the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> and as thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> thee. And he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">followed</span> her.", "31": "And <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> the <span class=\"wl wl-kjv\" data-code=\"H4938\">staff</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H5288\">child;</span> but there was neither <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> nor <span class=\"wl wl-kjv\" data-code=\"H7182\">hearing.</span> Wherefore he went <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> is not <span class=\"wl wl-kjv\" data-code=\"H6974\">awaked.</span>", "32": "And when <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">laid</span> upon his <span class=\"wl wl-kjv\" data-code=\"H4296\">bed.</span>", "33": "He went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> therefore, and <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door</span> upon them <span class=\"wl wl-kjv\" data-code=\"H8147\">twain,</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>", "34": "And he went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3206\">child,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> upon his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> upon his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3709\">hands:</span> and he <span class=\"wl wl-kjv\" data-code=\"H1457\">stretched</span> himself upon the child; and the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> waxed <span class=\"wl wl-kjv\" data-code=\"H2552\">warm.</span>", "35": "Then he <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H259\">to</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">fro;</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H1457\">stretched</span> himself upon him: and the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> <span class=\"wl wl-kjv\" data-code=\"H2237\">sneezed</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> <span class=\"wl wl-kjv\" data-code=\"H6491\">opened</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes.</span>", "36": "And he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> this <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite.</span> So he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> her. And when she was come <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto him, he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Take <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span>", "37": "Then she went <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> at his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> herself to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and took <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> her <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3318\">out.</span>", "38": "And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> came <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal:</span> and there was a <span class=\"wl wl-kjv\" data-code=\"H7458\">dearth</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> were <span class=\"wl wl-kjv\" data-code=\"H3427\">sitting</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him: and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H8239\">Set</span> on the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5518\">pot,</span> and <span class=\"wl wl-kjv\" data-code=\"H1310\">seethe</span> <span class=\"wl wl-kjv\" data-code=\"H5138\">pottage</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets.</span>", "39": "And <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> to <span class=\"wl wl-kjv\" data-code=\"H3950\">gather</span> <span class=\"wl wl-kjv\" data-code=\"H219\">herbs,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> a <span class=\"wl wl-kjv\" data-code=\"H7704\">wild</span> <span class=\"wl wl-kjv\" data-code=\"H1612\">vine,</span> and <span class=\"wl wl-kjv\" data-code=\"H3950\">gathered</span> thereof <span class=\"wl wl-kjv\" data-code=\"H7704\">wild</span> <span class=\"wl wl-kjv\" data-code=\"H6498\">gourds</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">lap</span> <span class=\"wl wl-kjv\" data-code=\"H4393\">full,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H6398\">shred</span> them into the <span class=\"wl wl-kjv\" data-code=\"H5518\">pot</span> of <span class=\"wl wl-kjv\" data-code=\"H5138\">pottage:</span> for they <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> them not.", "40": "So they poured <span class=\"wl wl-kjv\" data-code=\"H3332\">out</span> for the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span> And it came to pass, as they were <span class=\"wl wl-kjv\" data-code=\"H398\">eating</span> of the <span class=\"wl wl-kjv\" data-code=\"H5138\">pottage,</span> that they cried <span class=\"wl wl-kjv\" data-code=\"H6817\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O thou <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> there is <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> in the <span class=\"wl wl-kjv\" data-code=\"H5518\">pot.</span> And they <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> thereof.", "41": "But he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Then <span class=\"wl wl-kjv\" data-code=\"H3947\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H7058\">meal.</span> And he <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> it into the <span class=\"wl wl-kjv\" data-code=\"H5518\">pot;</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Pour <span class=\"wl wl-kjv\" data-code=\"H3332\">out</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span> And there was no <span class=\"wl wl-kjv\" data-code=\"H1697\">harm</span> in the <span class=\"wl wl-kjv\" data-code=\"H5518\">pot.</span>", "42": "And there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> from <span class=\"wl wl-kjv\" data-code=\"H1190\">Baalshalisha,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of the <span class=\"wl wl-kjv\" data-code=\"H1061\">firstfruits,</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">loaves</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley,</span> and full ears of <span class=\"wl wl-kjv\" data-code=\"H3759\">corn</span> in the <span class=\"wl wl-kjv\" data-code=\"H6861\">husk</span> thereof. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span>", "43": "And his <span class=\"wl wl-kjv\" data-code=\"H8334\">servitor</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What, should I <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> this <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men?</span> He said <span class=\"wl wl-kjv\" data-code=\"H559\">again,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H398\">eat:</span> for thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> They shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3498\">leave</span> thereof.", "44": "So he <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and they did <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> thereof, according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';

const bijbel = document.getElementById('bijbel');
