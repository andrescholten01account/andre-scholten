"href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een vrouw uit de vrouwen van de zonen der profeten riep tot Elisa en zei: Uw knecht, mijn man, is gestorven, en u weet dat uw knecht de HEERE was vrezende; nu is de schuldeiser gekomen om mijn beide kinderen voor zich tot knechten te nemen.","2":"En Elisa zei tegen haar: Wat zal ik voor u doen? Vertel mij wat u in het huis hebt. En zij zei: Uw dienares heeft helemaal niets in het huis, dan een kruik met olie.","3":"Toen zei hij: Ga, vraag voor u vaten van buiten, van al uw buren lege vaten; zorg dat het er niet weinig zijn.","4":"Kom dan naar binnen, en sluit de deur achter u en uw zonen toe; giet dan olie in al die vaten, en zet weg wat vol is.","5":"Zo ging zij bij hem vandaan, en sloot de deur achter zich en haar zonen toe; die brachten haar de vaten aan, en zij goot in.","6":"En het gebeurde, toen de vaten vol waren, dat zij tegen haar zoon zei: Breng mij nog een vat aan; maar hij zei tegen haar: Er is geen vat meer. En de olie stond stil.","7":"Toen kwam zij, en vertelde het de man Gods; en hij zei: Ga heen, verkoop de olie, en betaal uw schuld; leef u dan met uw zonen van wat overblijft.","8":"Het gebeurde ook op een dag, toen Elisa naar Sunem doortrok, dat daar een voorname vrouw was, die hem drong om brood te eten. Verder gebeurde het, zo dikwijls hij doortrok, dat hij daar inwijkt om brood te eten.","9":"En zij zei tegen haar man: Zie toch, ik heb gemerkt dat deze man Gods heilig is, die altijd bij ons doortrekt.","10":"Laten we toch een kleine bovenkamer aan een muur maken, en daar voor hem neerzetten een bed, en tafel, en stoel, en kandelaar; dan zal het gebeuren, wanneer hij bij ons komt, dat hij daar inwijkt.","11":"En het gebeurde op een dag, dat hij daar kwam; en hij week uit naar die bovenkamer, en ging daar liggen.","12":"Toen zei hij tegen zijn knecht Gehazi: Roep deze Sunamitische. En toen hij haar geroepen had, stond zij voor hem.","13":"(Want hij had hem gezegd: Zeg toch tegen haar: Zie, u bent zo bezorgd voor ons geweest, met al deze zorg; wat kan er voor u gedaan worden? Moet er voor u gesproken worden tot de koning, of tot de legeraanvoerder? En zij had gezegd: Ik woon te midden van mijn volk.","14":"Toen had hij gezegd: Wat kan er dan voor haar gedaan worden? En Gehazi had gezegd: Zij heeft immers geen zoon, en haar man is oud.","15":"Daarom had hij gezegd: Roep haar. En toen hij haar geroepen had, stond zij in de deur.)","16":"En hij zei: Op deze vastgestelde tijd, omtrent deze tijd van het jaar, zult u een zoon omhelzen. En zij zei: Nee, mijn heer, u, man Gods, lieg niet tegen uw dienares.","17":"En de vrouw werd zwanger, en baarde een zoon op die vastgestelde tijd, omtrent de tijd van het jaar, die Elisa tegen haar gesproken had.","18":"Toen het kind groter werd, gebeurde het op een dag, dat het uitging naar zijn vader, naar de maaiers.","19":"En het zei tegen zijn vader: Mijn hoofd, mijn hoofd! Hij dan zei tegen een knecht: Draag hem naar zijn moeder.","20":"En hij droeg hem, en bracht hem naar zijn moeder. En hij zat op haar knieën tot de middag toe; toen stierf hij.","21":"En zij ging naar boven, en legde hem op het bed van de man Gods; daarna sloot zij de deur achter hem toe, en ging naar buiten.","22":"En zij riep naar haar man, en zei: Stuur mij toch een van de knechten, en een van de ezelinnen, zodat ik naar de man Gods kan lopen, en weer terugkom.","23":"En hij zei: Waarom gaat u vandaag naar hem toe? Het is geen nieuwe maan, en ook geen sabbat. En zij zei: Het zal goed zijn.","24":"Toen zadelde zij de ezelin, en zei tegen haar knecht: Drijf aan, en ga voort; houd mij niet op met rijden, tenzij ik het u zeg.","25":"Zo ging zij heen, en kwam bij de man Gods, bij de berg Karmel. En het gebeurde, toen de man Gods haar van verre zag, dat hij tegen Gehazi, zijn knecht, zei: Zie, daar is de Sunamitische.","26":"Loop haar nu toch tegemoet, en zeg tegen haar: Is het goed met u? Is het goed met uw man? Is het goed met uw kind? En zij zei: Het is goed.","27":"Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.","28":"En zij zei: Heb ik een zoon van mijn heer gevraagd? Zei ik niet: Bedrieg mij niet?","29":"En hij zei tegen Gehazi: Gord uw lendenen, en neem mijn staf in uw hand, en ga heen; als u iemand tegenkomt, groet hem niet; en als iemand u groet, antwoord hem niet; en leg mijn staf op het gezicht van de jongen.","30":"Doch de moeder van de jongen zei: *Zo waarachtig als* de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Hij stond dan op, en volgde haar.","31":"Gehazi nu was voor hen uit gegaan; en hij legde de staf op het gezicht van de jongen; maar er was geen stem, en geen teken van leven. Zo keerde hij terug hem tegemoet, en bracht hem de boodschap en zei: De jongen is niet wakker geworden.","32":"En toen Elisa het huis binnenkwam, zie, daar was de jongen dood, neergelegd op zijn bed.","33":"Zo ging hij naar binnen, en sloot de deur achter hen beiden toe, en bad tot de HEERE.","34":"En hij klom op het bed, en ging op het kind liggen, en legde zijn mond op diens mond, en zijn ogen op zijn ogen, en zijn handen op zijn handen, en boog zich over hem heen. En het vlees van het kind werd warm.","35":"Daarna kwam hij terug, en liep in het huis heen en weer, en klom weer op het bed, en boog zich over hem heen; en de jongen niesde tot zevenmaal toe; daarna deed de jongen zijn ogen open.","36":"En hij riep Gehazi, en zei: Roep deze Sunamitische. En hij riep haar, en zij kwam bij hem; en hij zei: Neem uw zoon op.","37":"Zo kwam zij, en viel voor zijn voeten neer, en boog zich ter aarde, en zij nam haar zoon op, en ging naar buiten.","38":"Toen Elisa weer in Gilgal kwam, was er honger in dat land, en de zonen der profeten zaten voor hem; en hij zei tegen zijn knecht: Zet de grote pot aan, en kook moes voor de zonen der profeten.","39":"Toen ging er iemand het veld in, om moeskruiden te verzamelen, en hij vond een wilde wijnstok, en verzamelde daarvan, zijn kleed vol wilde kolokwinten, en kwam, en sneed ze in de moespot; want zij kenden ze niet.","40":"Daarna schepten zij voor de mannen op om te eten; en het gebeurde, toen zij van dat moes aten, dat zij riepen en zeiden: Man Gods, de dood is in de pot! En zij konden het niet eten.","41":"Maar hij zei: Breng dan meel; en hij wierp het in de pot; en hij zei: Schep voor het volk op, zodat zij eten. Toen was er niets kwaads meer in de pot.","42":"En er kwam een man van Baäl-Salisa, en bracht de man Gods brood van de eerstelingen, twintig gerstebroden, en groene aren in hun schillen; en hij zei: Geef aan het volk, zodat zij eten.","43":"Doch zijn dienaar zei: Wat, zou ik dit aan honderd mannen voorzetten? En hij zei: Geef aan het volk, zodat zij eten; want zo zegt de HEERE: Men zal eten en overhouden.","44":"Zo zette hij het hun voor, en zij aten, en zij hielden over, naar het woord van de HEERE."},"SV":{"1":"Een vrouw nu uit de vrouwen van de zonen der profeten riep tot Elisa, zeggende: Uw knecht, mijn man, is gestorven, en gij weet, dat uw knecht den HEERE was vrezende; nu is de schuldheer gekomen, om mijn beide kinderen voor zich tot knechten te nemen.","2":"En Elisa zeide tot haar: Wat zal ik u doen? Geef mij te kennen, wat gij in het huis hebt. En zij zeide: Uw dienstmaagd heeft niet met al in het huis, dan een kruik met olie.","3":"Toen zeide hij: Ga, eis voor u vaten van buiten, van al uw naburen ledige vaten; maak er niet weinig te hebben.","4":"Kom dan in, en sluit de deur voor u en voor uw zonen toe; daarna giet in al die vaten, en zet weg, dat vol is.","5":"Zo ging zij van hem, en sloot de deur voor zich en voor haar zonen toe; die brachten haar de vaten toe, en zij goot in.","6":"En het geschiedde, als die vaten vol waren, dat zij tot haar zoon zeide: Breng mij nog een vat aan; maar hij zeide tot haar: Er is geen vat meer. En de olie stond stil.","7":"Toen kwam zij, en gaf het den man Gods te kennen; en hij zeide: Ga heen, verkoop de olie, en betaal uw schuldheer; gij dan *met* uw zonen, leef bij het overige.","8":"Het geschiedde ook op een dag, als Elisa naar Sunem doortrok, dat aldaar een grote vrouw was, dewelke hem aanhield om brood te eten. Voorts geschiedde het, zo dikwijls hij doortrok, week hij daarin, om brood te eten.","9":"En zij zeide tot haar man: Zie nu, ik heb gemerkt, dat deze man Gods heilig is, die bij ons altoos doortrekt.","10":"Laat ons toch een kleine opperkamer van een wand maken, en laat ons daar voor hem zetten een bed, en tafel, en stoel, en kandelaar; zo zal het geschieden, wanneer hij tot ons komt, dat hij daar inwijke.","11":"En het geschiedde op een dag, dat hij daar kwam; en hij week in die opperkamer, en leide zich daar neder.","12":"Toen zeide hij tot zijn jongen Gehazi: Roep deze Sunamietische. En als hij ze geroepen had, stond zij voor zijn aangezicht.","13":"(Want hij had hem gezegd: Zeg nu tot haar: Zie, gij zijt zorgvuldig voor ons geweest, met al deze zorgvuldigheid; wat is er voor u te doen? Is er iets om voor u te spreken tot den koning, of tot den krijgsoverste? En zij had gezegd: Ik woon in het midden mijns volks.","14":"Toen had hij gezegd: Wat is er dan voor haar te doen? En Gehazi had gezegd: Zij heeft toch geen zoon, en haar man is oud.","15":"Daarom had hij gezegd: Roep haar. En als hij ze geroepen had, stond zij in de deur.)","16":"En hij zeide: Op dezen gezetten tijd, omtrent dezen tijd des levens zult gij een zoon omhelzen. En zij zeide: Neen, mijn heer, gij, man Gods, lieg tegen uw dienstmaagd niet.","17":"En de vrouw werd zwanger, en baarde een zoon op dien gezette tijd, omtrent den tijd des levens, dien Elisa tot haar gesproken had.","18":"Toen nu het kind groot werd, geschiedde het op een dag, dat het uitging tot zijn vader, tot de maaiers.","19":"En het zeide tot zijn vader: Mijn hoofd, mijn hoofd! Hij dan zeide tot een jongen: Draag hem tot zijn moeder.","20":"En hij droeg hem, en bracht hem tot zijn moeder. En hij zat op haar knieën tot aan den middag toe; toen stierf hij.","21":"En zij ging op, en leide hem op het bed van den man Gods; daarna sloot zij voor hem toe, en ging uit.","22":"En zij riep om haar man, en zeide: Zend mij toch een van de jongens, en een van de ezelinnen, dat ik tot den man Gods lope, en wederkome.","23":"En hij zeide: Waarom gaat gij heden tot hem? Het is geen nieuwe maan, noch sabbat. En zij zeide: Het zal wel zijn.","24":"Toen zadelde zij de ezelin, en zeide tot haar jongen: Drijf, en ga voort; houd mij niet op voort te rijden, tenzij dan dat ik het u zegge.","25":"Alzo toog zij heen, en kwam tot den man Gods, tot den berg Karmel. En het geschiedde, als de man Gods haar van tegenover zag, dat hij tot Gehazi, zijn jongen, zeide: Zie, daar is de Sunamietische.","26":"Nu loop toch haar tegemoet, en zeg tot haar: Is het wel met u? Is het wel met uw man? Is het wel met uw kind? En zij zeide: Het is wel.","27":"Toen zij nu tot den man Gods op den berg kwam, vatte zij zijn voeten. Maar Gehazi trad toe, om haar af te stoten. Doch de man Gods zeide: Laat ze geworden; want haar ziel is in haar bitterlijk bedroefd, en de HEERE heeft het voor mij verborgen, en mij niet verkondigd.","28":"En zij zeide: Heb ik een zoon van mijn heer begeerd? Zeide ik niet: Bedrieg mij niet?","29":"En hij zeide tot Gehazi: Gord uw lenden, en neem mijn staf in uw hand, en ga henen; zo gij iemand vindt, groet hem niet; en zo u iemand groet, antwoord hem niet; en leg mijn staf op het aangezicht van den jongen.","30":"Doch de moeder van den jongen zeide: *Zo* *waarachtig* *als* de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Hij stond dan op, en volgde haar na.","31":"Gehazi nu was voor hun aangezicht doorgegaan; en hij leide den staf op het aangezicht van den jongen; doch er was geen stem, noch opmerking. Zo keerde hij weder hem tegemoet, en bracht hem boodschap, zeggende: De jongen is niet ontwaakt.","32":"En toen Elisa in het huis kwam, ziet, zo was de jongen dood, zijnde gelegd op zijn bed.","33":"Zo ging hij in, en sloot de deur voor hen beiden toe, en bad tot den HEERE.","34":"En hij klom op, en leide zich neder op het kind, en leggende zijn mond op deszelfs mond, en zijn ogen op zijn ogen, en zijn handen op zijn handen, breidde zich over hem uit. En het vlees des kinds werd warm.","35":"Daarna kwam hij weder, en wandelde in het huis eens herwaarts, en eens derwaarts, en klom *weder* op, en breidde zich over hem uit; en de jongen niesde tot zevenmaal toe; daarna deed de jongen zijn ogen open.","36":"En hij riep Gehazi, en zeide: Roep deze Sunamietische. En hij riep ze, en zij kwam tot hem; en hij zeide: Neem uw zoon op.","37":"Zo kwam zij, en viel voor zijn voeten, en boog zich ter aarde, en zij nam haar zoon op, en ging uit.","38":"Als nu Elisa weder te Gilgal kwam, zo was er honger in dat land, en de zonen der profeten zaten voor zijn aangezicht; en hij zeide tot zijn jongen: Zet den groten pot aan, en zied moes voor de zonen der profeten.","39":"Toen ging er een uit in het veld, om moeskruiden te lezen, en hij vond een wilden wijnstok, en las daarvan, zijn kleed vol wilde kolokwinten, en kwam, en sneed ze in den moespot; want zij kenden ze niet.","40":"Daarna schepten zij voor de mannen op om te eten; en het geschiedde, als zij aten van dat moes, dat zij riepen en zeiden: Man Gods, de dood is in den pot! En zij konden het niet eten.","41":"Maar hij zeide: Brengt dan meel; en hij wierp het in den pot; en hij zeide: Schep voor het volk op, dat zij eten. Toen was er niets kwaads in den pot.","42":"En er kwam een man van Baäl-salisa, en bracht den man Gods broden der eerstelingen, twintig gerstebroden, en groene aren in haar hulzen; en hij zeide: Geef aan het volk, dat zij eten.","43":"Doch zijn dienaar zeide: Wat zou ik dat aan honderd mannen voorzetten? En hij zeide: Geef aan het volk, dat zij eten; want alzo zegt de HEERE: Men zal eten en overhouden.","44":"Zo zette hij het hun voor, en zij aten, en zij hielden over, naar het woord des HEEREN."},"KJV":{"1":"Now there cried a certain woman of the wives of the sons of the prophets unto Elisha, saying, Thy servant my husband is dead; and thou knowest that thy servant did fear the LORD: and the creditor is come to take unto him my two sons to be bondmen.","2":"And Elisha said unto her, What shall I do for thee? tell me, what hast thou in the house? And she said, Thine handmaid hath not any thing in the house, save a pot of oil.","3":"Then he said, Go, borrow thee vessels abroad of all thy neighbours, even empty vessels; borrow not a few.","4":"And when thou art come in, thou shalt shut the door upon thee and upon thy sons, and shalt pour out into all those vessels, and thou shalt set aside that which is full.","5":"So she went from him, and shut the door upon her and upon her sons, who brought the vessels to her; and she poured out.","6":"And it came to pass, when the vessels were full, that she said unto her son, Bring me yet a vessel. And he said unto her, There is not a vessel more. And the oil stayed.","7":"Then she came and told the man of God. And he said, Go, sell the oil, and pay thy debt, and live thou and thy children of the rest.","8":"And it fell on a day, that Elisha passed to Shunem, where was a great woman; and she constrained him to eat bread. And so it was, that as oft as he passed by, he turned in thither to eat bread.","9":"And she said unto her husband, Behold now, I perceive that this is an holy man of God, which passeth by us continually.","10":"Let us make a little chamber, I pray thee, on the wall; and let us set for him there a bed, and a table, and a stool, and a candlestick: and it shall be, when he cometh to us, that he shall turn in thither.","11":"And it fell on a day, that he came thither, and he turned into the chamber, and lay there.","12":"And he said to Gehazi his servant, Call this Shunammite. And when he had called her, she stood before him.","13":"And he said unto him, Say now unto her, Behold, thou hast been careful for us with all this care; what is to be done for thee? wouldest thou be spoken for to the king, or to the captain of the host? And she answered, I dwell among mine own people.","14":"And he said, What then is to be done for her? And Gehazi answered, Verily she hath no child, and her husband is old.","15":"And he said, Call her. And when he had called her, she stood in the door.","16":"And he said, About this season, according to the time of life, thou shalt embrace a son. And she said, Nay, my lord, thou man of God, do not lie unto thine handmaid.","17":"And the woman conceived, and bare a son at that season that Elisha had said unto her, according to the time of life.","18":"And when the child was grown, it fell on a day, that he went out to his father to the reapers.","19":"And he said unto his father, My head, my head. And he said to a lad, Carry him to his mother.","20":"And when he had taken him, and brought him to his mother, he sat on her knees till noon, and then died.","21":"And she went up, and laid him on the bed of the man of God, and shut the door upon him, and went out.","22":"And she called unto her husband, and said, Send me, I pray thee, one of the young men, and one of the asses, that I may run to the man of God, and come again.","23":"And he said, Wherefore wilt thou go to him to day? it is neither new moon, nor sabbath. And she said, It shall be well.","24":"Then she saddled an ass, and said to her servant, Drive, and go forward; slack not thy riding for me, except I bid thee.","25":"So she went and came unto the man of God to mount Carmel. And it came to pass, when the man of God saw her afar off, that he said to Gehazi his servant, Behold, yonder is that Shunammite:","26":"Run now, I pray thee, to meet her, and say unto her, Is it well with thee? is it well with thy husband? is it well with the child? And she answered, It is well.","27":"And when she came to the man of God to the hill, she caught him by the feet: but Gehazi came near to thrust her away. And the man of God said, Let her alone; for her soul is vexed within her: and the LORD hath hid it from me, and hath not told me.","28":"Then she said, Did I desire a son of my lord? did I not say, Do not deceive me?","29":"Then he said to Gehazi, Gird up thy loins, and take my staff in thine hand, and go thy way: if thou meet any man, salute him not; and if any salute thee, answer him not again: and lay my staff upon the face of the child.","30":"And the mother of the child said, As the LORD liveth, and as thy soul liveth, I will not leave thee. And he arose, and followed her.","31":"And Gehazi passed on before them, and laid the staff upon the face of the child; but there was neither voice, nor hearing. Wherefore he went again to meet him, and told him, saying, The child is not awaked.","32":"And when Elisha was come into the house, behold, the child was dead, and laid upon his bed.","33":"He went in therefore, and shut the door upon them twain, and prayed unto the LORD.","34":"And he went up, and lay upon the child, and put his mouth upon his mouth, and his eyes upon his eyes, and his hands upon his hands: and he stretched himself upon the child; and the flesh of the child waxed warm.","35":"Then he returned, and walked in the house to and fro; and went up, and stretched himself upon him: and the child sneezed seven times, and the child opened his eyes.","36":"And he called Gehazi, and said, Call this Shunammite. So he called her. And when she was come in unto him, he said, Take up thy son.","37":"Then she went in, and fell at his feet, and bowed herself to the ground, and took up her son, and went out.","38":"And Elisha came again to Gilgal: and there was a dearth in the land; and the sons of the prophets were sitting before him: and he said unto his servant, Set on the great pot, and seethe pottage for the sons of the prophets.","39":"And one went out into the field to gather herbs, and found a wild vine, and gathered thereof wild gourds his lap full, and came and shred them into the pot of pottage: for they knew them not.","40":"So they poured out for the men to eat. And it came to pass, as they were eating of the pottage, that they cried out, and said, O thou man of God, there is death in the pot. And they could not eat thereof.","41":"But he said, Then bring meal. And he cast it into the pot; and he said, Pour out for the people, that they may eat. And there was no harm in the pot.","42":"And there came a man from Baalshalisha, and brought the man of God bread of the firstfruits, twenty loaves of barley, and full ears of corn in the husk thereof. And he said, Give unto the people, that they may eat.","43":"And his servitor said, What, should I set this before an hundred men? He said again, Give the people, that they may eat: for thus saith the LORD, They shall eat, and shall leave thereof.","44":"So he set it before them, and they did eat, and left thereof, according to the word of the LORD."}},"tsk":{"1":[{"kopje":"zonen","refs":["2 Kon 4:38","2 Kon 2:3","2 Kon 2:5","1 Kon 20:35"]},{"kopje":"uw knecht de HEERE was vrezende","refs":["Gen 22:12","1 Kon 18:3","Neh 7:2","Ps 103:11","Ps 103:17","Ps 112:1","Ps 112:2","Ps 115:13","Ps 147:11","Pred 8:12","Pred 12:13","Mal 3:16","Mal 4:2","Hand 13:26","Openb 15:4","Openb 19:5"]},{"kopje":"de schuldeiser","refs":["Lev 25:39","Lev 25:40","Lev 25:48","Neh 5:2-5","Neh 10:31","Jer 34:14","Matt 18:25","Matt 18:30","Matt 18:35","Jak 2:13"]}],"2":[{"kopje":"Wat zal ik","refs":["2 Kon 2:9","2 Kon 6:26","2 Kon 6:27","Matt 15:34","Joh 6:5-7","Hand 3:6","2 Kor 6:10"]},{"kopje":"dan een kruik met olie","refs":["1 Kon 17:12","Jak 2:5"]}],"3":[{"kopje":"lege vaten","refs":["2 Kon 3:16","Joh 2:7"]},{"kopje":"zorg dat het er niet weinig zijn","refs":["2 Kon 13:18","2 Kon 13:19","Ps 81:11","Joh 16:24"]}],"4":[{"kopje":"sluit","refs":["2 Kon 4:32","2 Kon 4:33","1 Kon 17:19","1 Kon 17:20","Jes 26:20","Matt 6:6","Mark 5:40","Hand 9:40"]},{"kopje":"giet","refs":["Mark 6:37-44","Mark 8:5-9","Joh 2:7-9","Joh 6:11","Ef 3:20"]}],"5":[{"kopje":"ging","refs":["2 Kon 5:11","1 Kon 17:15","1 Kon 17:16","Luk 1:45","Hebr 11:7","Hebr 11:8"]}],"6":[{"kopje":"toen de vaten","refs":["2 Kon 4:43","2 Kon 4:44","Matt 9:29","Matt 13:58","Matt 14:20","Matt 15:37","Luk 6:19","2 Kron 6:12","2 Kron 6:13"]},{"kopje":"En de olie","refs":["2 Kon 13:19","Joz 5:12","1 Kon 17:14","Joh 6:12"]}],"7":[{"kopje":"betaal","refs":["Ps 37:21","Rom 12:17","Fil 4:8","1 Tess 2:9","1 Tess 2:10","1 Tess 4:12","2 Tess 3:7-12"]}],"8":[{"kopje":"gebeurde ook op","refs":["2 Kon 4:11","2 Kon 4:18"]},{"kopje":"Sunem","refs":["2 Kon 4:12"," 3588\">want</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H3541\">zo</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H559\">zegt</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H398\">de</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H398\">HEERE</span>: <span class=\"wl\" data-l=\"L10\" data-code=\"H398\">Men</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H398\">zal</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H398\">eten</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H3498\">en</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H3498\">overhouden</span>.","44":"<span class=\"wl\" data-l=\"L1\" data-code=\"H5414\">Zo</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5414\">zette</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5414\">hij</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5414\">het</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6440\">hun</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6440\">voor</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H3498\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H398\">zij</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H398\">aten</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H398\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3498\">zij</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3498\">hielden</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3498\">over</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H6440\">naar</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6440\">het</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1697\">woord</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1697\">van</span> de HEERE."},"koppeling_kjv":{"1":"Now there <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> a <span class=\"wl wl-kjv\" data-code=\"H259\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> of the <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> unto <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> my <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead;</span> and thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> that thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> did <span class=\"wl wl-kjv\" data-code=\"H3373\">fear</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5383\">creditor</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> unto him my <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3206\">sons</span> to be <span class=\"wl wl-kjv\" data-code=\"H5650\">bondmen.</span>","2":"And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, What shall I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> for thee? <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, what <span class=\"wl wl-kjv\" data-code=\"H3426\">hast</span> thou in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house?</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thine <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid</span> hath not any thing in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> save a <span class=\"wl wl-kjv\" data-code=\"H610\">pot</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil.</span>","3":"Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">borrow</span> thee <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad</span> of all thy <span class=\"wl wl-kjv\" data-code=\"H7934\">neighbours,</span> even <span class=\"wl wl-kjv\" data-code=\"H7386\">empty</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels;</span> borrow not a <span class=\"wl wl-kjv\" data-code=\"H4591\">few.</span>","4":"And when thou art come <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door</span> upon thee and upon thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and shalt pour <span class=\"wl wl-kjv\" data-code=\"H3332\">out</span> into all those <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> and thou shalt set <span class=\"wl wl-kjv\" data-code=\"H5265\">aside</span> that which is <span class=\"wl wl-kjv\" data-code=\"H4392\">full.</span>","5":"So she <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> from him, and <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door</span> upon her and <span class=\"wl wl-kjv\" data-code=\"H1157\">upon</span> her <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> <span class=\"wl wl-kjv\" data-code=\"H1992\">who</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">brought</span> the vessels to her; and she poured <span class=\"wl wl-kjv\" data-code=\"H3332\">out.</span>","6":"And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> were <span class=\"wl wl-kjv\" data-code=\"H4390\">full,</span> that she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">Bring</span> me yet a <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, There is not a <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> more. And the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stayed.</span>","7":"Then she <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H7999\">pay</span> thy <span class=\"wl wl-kjv\" data-code=\"H5386\">debt,</span> and <span class=\"wl wl-kjv\" data-code=\"H2421\">live</span> thou and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H3498\">rest.</span>","8":"And it fell on a <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> to <span class=\"wl wl-kjv\" data-code=\"H7766\">Shunem,</span> where was a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman;</span> and she <span class=\"wl wl-kjv\" data-code=\"H2388\">constrained</span> him to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread.</span> And so it was, that as <span class=\"wl wl-kjv\" data-code=\"H1767\">oft</span> as he passed <span class=\"wl wl-kjv\" data-code=\"H5674\">by,</span> he <span class=\"wl wl-kjv\" data-code=\"H5493\">turned</span> in thither to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread.</span>","9":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her <span class=\"wl wl-kjv\" data-code=\"H376\">husband,</span> Behold now, I <span class=\"wl wl-kjv\" data-code=\"H3045\">perceive</span> that this is an <span class=\"wl wl-kjv\" data-code=\"H6918\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which <span class=\"wl wl-kjv\" data-code=\"H5674\">passeth</span> by us <span class=\"wl wl-kjv\" data-code=\"H8548\">continually.</span>","10":"Let us <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H6996\">little</span> <span class=\"wl wl-kjv\" data-code=\"H5944\">chamber,</span> I pray thee, on the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall;</span> and let us <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> for him there a <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7979\">table,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3678\">stool,</span> and a <span class=\"wl wl-kjv\" data-code=\"H4501\">candlestick:</span> and it shall be, when he <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> to us, that he shall <span class=\"wl wl-kjv\" data-code=\"H5493\">turn</span> in thither.","11":"And it fell on a <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> thither, and he <span class=\"wl wl-kjv\" data-code=\"H5493\">turned</span> into the <span class=\"wl wl-kjv\" data-code=\"H5944\">chamber,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> there.","12":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> this <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite.</span> And when he had <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> her, she <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him.","13":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> now unto her, Behold, thou hast been <span class=\"wl wl-kjv\" data-code=\"H2729\">careful</span> for us with all this <span class=\"wl wl-kjv\" data-code=\"H2731\">care;</span> what is to be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> for thee? <span class=\"wl wl-kjv\" data-code=\"H3426\">wouldest</span> thou be <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> for to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> or to the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host?</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> mine own <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","14":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What then is to be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> for her? And <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> <span class=\"wl wl-kjv\" data-code=\"H61\">Verily</span> she hath no <span class=\"wl wl-kjv\" data-code=\"H1121\">child,</span> and her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> is <span class=\"wl wl-kjv\" data-code=\"H2204\">old.</span>","15":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> her. And when he had <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> her, she <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H6607\">door.</span>","16":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> About this <span class=\"wl wl-kjv\" data-code=\"H4150\">season,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">life,</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H2263\">embrace</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Nay, my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> thou <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> do not <span class=\"wl wl-kjv\" data-code=\"H3576\">lie</span> unto thine <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid.</span>","17":"And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> at that <span class=\"wl wl-kjv\" data-code=\"H4150\">season</span> that <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto her, according to the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">life.</span>","18":"And when the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> was <span class=\"wl wl-kjv\" data-code=\"H1431\">grown,</span> it fell on a <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that he went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> to the <span class=\"wl wl-kjv\" data-code=\"H7114\">reapers.</span>","19":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> My <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> my <span class=\"wl wl-kjv\" data-code=\"H7218\">head.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to a <span class=\"wl wl-kjv\" data-code=\"H5288\">lad,</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">Carry</span> him to his <span class=\"wl wl-kjv\" data-code=\"H517\">mother.</span>","20":"And when he had <span class=\"wl wl-kjv\" data-code=\"H5375\">taken</span> him, and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him to his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> he <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> on her <span class=\"wl wl-kjv\" data-code=\"H1290\">knees</span> till <span class=\"wl wl-kjv\" data-code=\"H6672\">noon,</span> and then <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span>","21":"And she went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">laid</span> him on the <span class=\"wl wl-kjv\" data-code=\"H4296\">bed</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the door upon him, and went <span class=\"wl wl-kjv\" data-code=\"H3318\">out.</span>","22":"And she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto her <span class=\"wl wl-kjv\" data-code=\"H376\">husband,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">Send</span> me, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H860\">asses,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and come <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span>","23":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wherefore wilt thou <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> to him to <span class=\"wl wl-kjv\" data-code=\"H3117\">day?</span> it is neither new <span class=\"wl wl-kjv\" data-code=\"H2320\">moon,</span> nor <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath.</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It shall be <span class=\"wl wl-kjv\" data-code=\"H7965\">well.</span>","24":"Then she <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled</span> an <span class=\"wl wl-kjv\" data-code=\"H860\">ass,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to her <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H5090\">Drive,</span> and go <span class=\"wl wl-kjv\" data-code=\"H3212\">forward;</span> <span class=\"wl wl-kjv\" data-code=\"H6113\">slack</span> not thy <span class=\"wl wl-kjv\" data-code=\"H7392\">riding</span> for me, except I <span class=\"wl wl-kjv\" data-code=\"H559\">bid</span> thee.","25":"So she <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel.</span> And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> saw her afar <span class=\"wl wl-kjv\" data-code=\"H7200\">off,</span> that he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> Behold, yonder is <span class=\"wl wl-kjv\" data-code=\"H1975\">that</span> <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite:</span>","26":"<span class=\"wl wl-kjv\" data-code=\"H7323\">Run</span> now, I pray thee, to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> her, and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto her, Is it <span class=\"wl wl-kjv\" data-code=\"H7965\">well</span> with thee? is it <span class=\"wl wl-kjv\" data-code=\"H7965\">well</span> with thy <span class=\"wl wl-kjv\" data-code=\"H376\">husband?</span> is it <span class=\"wl wl-kjv\" data-code=\"H7965\">well</span> with the <span class=\"wl wl-kjv\" data-code=\"H3206\">child?</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> It is <span class=\"wl wl-kjv\" data-code=\"H7965\">well.</span>","27":"And when she <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to the <span class=\"wl wl-kjv\" data-code=\"H2022\">hill,</span> she <span class=\"wl wl-kjv\" data-code=\"H2388\">caught</span> him by the <span class=\"wl wl-kjv\" data-code=\"H7272\">feet:</span> but <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> came <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> to thrust her <span class=\"wl wl-kjv\" data-code=\"H1920\">away.</span> And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let her <span class=\"wl wl-kjv\" data-code=\"H7503\">alone;</span> for her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> is <span class=\"wl wl-kjv\" data-code=\"H4843\">vexed</span> within her: and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5956\">hid</span> it from me, and hath not <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> me.","28":"Then she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Did I <span class=\"wl wl-kjv\" data-code=\"H7592\">desire</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord?</span> did I not <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Do not <span class=\"wl wl-kjv\" data-code=\"H7952\">deceive</span> me?","29":"Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi,</span> Gird <span class=\"wl wl-kjv\" data-code=\"H2296\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H4975\">loins,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> my <span class=\"wl wl-kjv\" data-code=\"H4938\">staff</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and go thy <span class=\"wl wl-kjv\" data-code=\"H3212\">way:</span> if thou <span class=\"wl wl-kjv\" data-code=\"H4672\">meet</span> any <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">salute</span> him not; and if <span class=\"wl wl-kjv\" data-code=\"H376\">any</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">salute</span> thee, answer him not <span class=\"wl wl-kjv\" data-code=\"H6030\">again:</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> my <span class=\"wl wl-kjv\" data-code=\"H4938\">staff</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H5288\">child.</span>","30":"And the <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> of the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> and as thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> thee. And he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">followed</span> her.","31":"And <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> the <span class=\"wl wl-kjv\" data-code=\"H4938\">staff</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H5288\">child;</span> but there was neither <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> nor <span class=\"wl wl-kjv\" data-code=\"H7182\">hearing.</span> Wherefore he went <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> is not <span class=\"wl wl-kjv\" data-code=\"H6974\">awaked.</span>","32":"And when <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">laid</span> upon his <span class=\"wl wl-kjv\" data-code=\"H4296\">bed.</span>","33":"He went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> therefore, and <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door</span> upon them <span class=\"wl wl-kjv\" data-code=\"H8147\">twain,</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","34":"And he went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3206\">child,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> upon his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> upon his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3709\">hands:</span> and he <span class=\"wl wl-kjv\" data-code=\"H1457\">stretched</span> himself upon the child; and the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> waxed <span class=\"wl wl-kjv\" data-code=\"H2552\">warm.</span>","35":"Then he <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H259\">to</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">fro;</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H1457\">stretched</span> himself upon him: and the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> <span class=\"wl wl-kjv\" data-code=\"H2237\">sneezed</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> <span class=\"wl wl-kjv\" data-code=\"H6491\">opened</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes.</span>","36":"And he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H1522\">Gehazi,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> this <span class=\"wl wl-kjv\" data-code=\"H7767\">Shunammite.</span> So he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> her. And when she was come <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto him, he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Take <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span>","37":"Then she went <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> at his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> herself to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and took <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> her <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3318\">out.</span>","38":"And <span class=\"wl wl-kjv\" data-code=\"H477\">Elisha</span> came <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal:</span> and there was a <span class=\"wl wl-kjv\" data-code=\"H7458\">dearth</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> were <span class=\"wl wl-kjv\" data-code=\"H3427\">sitting</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him: and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H8239\">Set</span> on the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5518\">pot,</span> and <span class=\"wl wl-kjv\" data-code=\"H1310\">seethe</span> <span class=\"wl wl-kjv\" data-code=\"H5138\">pottage</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets.</span>","39":"And <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> to <span class=\"wl wl-kjv\" data-code=\"H3950\">gather</span> <span class=\"wl wl-kjv\" data-code=\"H219\">herbs,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> a <span class=\"wl wl-kjv\" data-code=\"H7704\">wild</span> <span class=\"wl wl-kjv\" data-code=\"H1612\">vine,</span> and <span class=\"wl wl-kjv\" data-code=\"H3950\">gathered</span> thereof <span class=\"wl wl-kjv\" data-code=\"H7704\">wild</span> <span class=\"wl wl-kjv\" data-code=\"H6498\">gourds</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">lap</span> <span class=\"wl wl-kjv\" data-code=\"H4393\">full,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H6398\">shred</span> them into the <span class=\"wl wl-kjv\" data-code=\"H5518\">pot</span> of <span class=\"wl wl-kjv\" data-code=\"H5138\">pottage:</span> for they <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> them not.","40":"So they poured <span class=\"wl wl-kjv\" data-code=\"H3332\">out</span> for the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span> And it came to pass, as they were <span class=\"wl wl-kjv\ s</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley,</span> and full ears of <span class=\"wl wl-kjv\" data-code=\"H3759\">corn</span> in the <span class=\"wl wl-kjv\" data-code=\"H6861\">husk</span> thereof. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span>","43":"And his <span class=\"wl wl-kjv\" data-code=\"H8334\">servitor</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What, should I <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> this <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men?</span> He said <span class=\"wl wl-kjv\" data-code=\"H559\">again,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H398\">eat:</span> for thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> They shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3498\">leave</span> thereof.","44":"So he <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and they did <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> thereof, according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zonen der profeten","tekst":"Zie 1Ki 20:35."},{"catchword":"schuldheer","tekst":"Dat is, dien ik schuldig ben van geleend geld, of gekocht goed, of anderszins."},{"catchword":"tot knechten","tekst":"Dat is, tot lijfeigenen, te weten, opdat hij die als zulke, òf zelf gebruike, òf aan anderen verkope voor hetgeen ik hem schuldig ben en niet kan betalen. Zie van deze soort der dienstbaarheid de wet Gods, Lev 25:39."}],"2":[{"catchword":"kruik","tekst":"Te weten, die vol olie was, of immers waar enige olie nog in was."}],"3":[{"catchword":"weinig","tekst":"Zowel uit uw eigen huis als van anderen geleend, en tezamen bijeengebracht."}],"4":[{"catchword":"sluit","tekst":"Te weten, opdat niemand u hinderlijk zij, noch in het werk, dat ik u beveel, noch in de aandacht, die gij daarover tot den HEERE hebben moet."},{"catchword":"voor u","tekst":"Of, over, of, nevens u."},{"catchword":"giet in","tekst":"Te weten, olie uit uw kruik."}],"6":[{"catchword":"stond stil","tekst":"Dat is, werd niet meer vermenigvuldigd, overmits de kruik, waaruit zij gegoten had, niet meer olie uitgaf."}],"7":[{"catchword":"den man Gods","tekst":"Namelijk, Elisa. Zie Jdg 13:6."},{"catchword":"overige","tekst":"Te weten, van de olie, of van het geld, dat gij van de olie boven uw schuld gemaakt zult hebben."}],"8":[{"catchword":"Sunem","tekst":"Zie 1Ki 1:3."},{"catchword":"grote vrouw","tekst":"Van afkomst, van naam en van middelen. Zie Gen 24, en Gen 35, en de aantekeningen. Idem, vergelijk 1Sa 25:2."},{"catchword":"brood","tekst":"Dat is, zijn maal bij haar te houden. Zie Gen 31:54, alzo in het volgende."}],"9":[{"catchword":"heilig is,","tekst":"Zie Lev 19:2."}],"10":[{"catchword":"opperkamer","tekst":"Hebreeuws, opperkamer des wands; dat is, een kamertje, hetwelk met een wand afgeschut was. Het Hebreeuwse woord is gebruikt van stenen muren, boven, 2Ki 3:25, en van houten wanden, Lev 1:15, waar van den wand des altaars gesproken wordt, die van hout gemaakt was, Exo 27:1. Anders, van, of met wanden."}],"12":[{"catchword":"jongen","tekst":"Of, knecht, of dienaar. Het Hebreeuwse woord wordt niet alleen van jongelingen gezegd, maar ook van volwassen mannen. Zie Gen 22:5 hoedanig een Gehazi schijnt geweest te zijn, uit hetgeen verhaald wordt onder, 2Ki 5:27."},{"catchword":"zijn aangezicht","tekst":"Dat is, voor Elisa."}],"13":[{"catchword":"hem gezegd","tekst":"Namelijk, zijn dienaar Gehazi."},{"catchword":"zorgvuldigheid;","tekst":"Het woord betekent zodanige zorg, die met vrees en bevinding verenigd is, waardoor men bezorgd is iets noodzakelijks na te laten, of naar behoren niet te verrichten. Vergelijk Luk 10:40-41."},{"catchword":"Ik woon","tekst":"Dat is, ik heb vrede en vriendschap met het volk, waaronder ik woon, zulks dat ik met niemand iets uitstaande heb, uit welke oorzaak ik den koning of zijn krijgsoverste zou behoeven lastig te vallen."}],"14":[{"catchword":"hij gezegd","tekst":"Namelijk Elisa tot zijn dienaar Gehazi, als hij zijn heer Elisa het antwoord der vrouw aangediend had."}],"15":[{"catchword":"hij gezegd","tekst":"Namelijk Elisa tot zijn dienaar Gehazi."},{"catchword":"in de deur","tekst":"Te weten, van des profeten kamertje. Vergelijk dit met vs.12 waarop het gepast moet worden, na het verhaal der tussenrede, begrepen in vs.13-15."}],"16":[{"catchword":"Op dezen","tekst":"Dat is, op dezen tijd des jaars; alzo in vs.17. Zie deze zelfde woorden Gen 18:14."},{"catchword":"omtrent","tekst":"Zie Gen 18:10."},{"catchword":"lieg","tekst":"Dat is, geef mij niet de belofte van enig goed, waarvan de vervulling niet zou volgen."}],"19":[{"catchword":"Mijn hoofd,","tekst":"Zo geeft het kind te kennen de pijn, die het in zijn hoofd gevoelde."},{"catchword":"Hij dan zeide","tekst":"Te weten, de vader."}],"21":[{"catchword":"op, en legde hem","tekst":"Te weten, naar de opperkamer, die zij voor Elisa had laten maken. Zie boven, vs.10."},{"catchword":"voor hem","tekst":"Zie boven, vs.4."},{"catchword":"toe,","tekst":"Te weten, de deur."}],"22":[{"catchword":"en zeide","tekst":"Dat is, liet hem aanzeggen."}],"23":[{"catchword":"geen nieuwe maan,","tekst":"Dit zegt hij, omdat de vromen, die nog in Israël overgebleven waren, de nieuwe maanden, sabbaten en andere vierdagen besteedden in godsdienstige werken, en tot dien einde de profeten des Heeren verzochten, die vergadering hielden tot bewaring van de rechte leer en den zuiveren godsdienst."},{"catchword":"Het zal wel zijn","tekst":"Hebreeuws, vrede. Zie Gen 37:14. Zij wil zeggen dat alle dingen wel zouden wezen, dewijl zij tot een goed einde deze reis deed; ondertussen verzwijgt zij voor haar man den dood haars zoons, zowel om hem niet plotseling te bedroeven, alsook opdat haar reis niet zou belet worden."}],"24":[{"catchword":"houd mij niet op","tekst":"Dat is, wil om mijns gemaks wil de reis niet verachteren of vertragen."}],"25":[{"catchword":"Karmel","tekst":"Zie 1Ki 18:19."}],"26":[{"catchword":"Is het wel met u?","tekst":"Hebreeuws, hebt gij vrede? heeft uw man vrede? enz. Zie Gen 29:6."}],"27":[{"catchword":"vatte zij","tekst":"Dit deed zij niet alleen uit ootmoedige eerbieding, maar ook uit ijverige genegenheid om wat van Elisa te verzoeken, begerende dat hij zich niet verroeren zou uit zijn plaats, eer dat hij haar gehoord zou hebben. Vergelijk Mat 28:9."},{"catchword":"af te stoten","tekst":"Te weten, opdat zij zijn heer niet moeilijk zou vallen. Vergelijk Mar 10:13."},{"catchword":"is in haar","tekst":"Hebreeuws, is haar bitter; dat is, met enige droefheid, die haar zeer ter harte gaat, bevangen. Bitterheid wordt voor droefenis en kwelling des harten genomen; Gen 26:35; Rth 1:20; 1Sa 1:10, en 1Sa 22:2; Job 3:20, en Job 7:11, en Job 9:18; Pro 14:10."}],"28":[{"catchword":"Heb ik een zoon","tekst":"Zij wil zeggen dat zij dien van Elisa niet begeerd had maar dat hij vanzelf haar dien beloofd had, en daarom nu met zijn gebeden behoorde te maken dat zij hem wederkrijgen mocht."},{"catchword":"Bedrieg mij niet?","tekst":"Anders, zeg mij geen geluk toe."}],"29":[{"catchword":"Gord uw lenden,","tekst":"Te weten, om de reis, die hem hier belast wordt, te vaardiger af te doen, waartoe de langheid der klederen, die de mannen droegen, hinderlijk was. Vergelijk 1Ki 18:46; 2Ki 9:1; Jer 1:17."},{"catchword":"groet hem niet;","tekst":"Hebreeuws, zegen hem niet. Zie Gen 31:55. Het is een manier van spreken, te kennen gevende dat hij zijn reis moest bespoedigen en in dezelve geen voorvallende verachtering aannemen, maar van zich afweren. Vergelijk Luk 10:4."},{"catchword":"leg mijn staf","tekst":"Tot een teken van het wonderwerk, dat God doen zal. Alzo heeft God gewrocht door den staf van Mozes, Exo 14:16; door de mantel van Elisa, 2Ki 2:8; door de zweetdoeken en gordel van Paulus, Act 19:12. Hetwelk kwam alleen van de kracht Gods, waarvan deze dingen maar middelen en tekenen waren, als het God beliefde daardoor te werken."}],"30":[{"catchword":"Zo waarachtig","tekst":"Zie boven, 2Ki 2:2."},{"catchword":"ik zal u niet","tekst":"Hebreeuws, zo ik u verlate!"}],"31":[{"catchword":"stem,","tekst":"Dat is, geen teken des levens. De reden was, omdat Elisa zijn gebed tot God nog neit gedaan had, zonder hetwelk de oplegging des stafs vruchteloos was. Nu had hij zijn gebed niet gedaan, omdat hij door het ernstig aanhouden der moeder vanzins geworden was, zelf tot het kind te gaan en daar zijn gebed tot den Heere uit te storten, hetwelk hij anders in zijn eigen huis gedaan zou hebben."},{"catchword":"opmerking","tekst":"Dat is, gehoor, of toeluistering."},{"catchword":"ontwaakt","tekst":"Te weten, van den slaap des doods. Vergelijk Isa 26:19; Dan 12:2."}],"32":[{"catchword":"huis kwam,","tekst":"Te weten, der Sunamietische vrouw."},{"catchword":"zijn bed","tekst":"Te weten, van den man Gods, boven, vs.21, welk bed was op de kamer, die de Sunamietische voor den profeet in haar huis had laten maken, boven, vs.10."}],"33":[{"catchword":"ging hij in,","tekst":"Versta, in de kamer, waarin hij somtijds was geherbergd geweest en waar het dode lichaam op het bed lag."},{"catchword":"hen beiden toe,","tekst":"Namelijk, voor hem en voor het kind."}],"34":[{"catchword":"klom op,","tekst":"Te weten, op het bed, waar het dode kind op lag, alzo in vs.35."},{"catchword":"legde zich","tekst":"Zie gelijk exepelen 1Ki 17:21; Act 20:10."}],"35":[{"catchword":"en klom weder op,","tekst":"De mirakelen worden volmaakt tweezins:&lt;i&gt;I.&lt;/i&gt; straks en op staanden voet, als 1Ki 18:37-38; Joh 11:43-44, en onder, vs.41, enz.;&lt;i&gt;II.&lt;/i&gt; somtijds allengskens, gelijk hier, 1Ki 18:44-45; Mar 8:24-25."}],"37":[{"catchword":"en viel","tekst":"Om hem met burgerlijke eerbieding te bedanken voor de weldaad, die God door zijn dienst aan haar bewezen had."}],"38":[{"catchword":"Gilgal","tekst":"Zie boven, 2Ki 2:1."},{"catchword":"zaten","tekst":"Te weten, als discipel voor zijn voeten, om van hem als van hun meester en leraar onderwezen te worden. Zie boven, 2Ki 2:3."},{"catchword":"Zet den groten","tekst":"Of, schik, of maak den groten pot toe."}],"39":[{"catchword":"wilden wijnstok,","tekst":"Hebreeuws, wijnstok des velds; dat is, die in het veld, of in het wild wast; alzo terstond, kolokwinten des velds; dat is, wilde kolokwinten; gewoonlijk genoemd kouwoerden over zee, of kwintappels."},{"catchword":"wilde kolokwinten,","tekst":"Welks ranken men schrijft den ranken des wijnstoks niet ongelijk te zijn. Het kan wezen dat zij bij dezen wilden wijnstok opgelopen en met deszelfs ranken en bladeren vermengd zijn geweest, gelijk de wilde kouwoerden plegen te doen; of dat de namen van wilden wijstok en wilde kolokwinten vermits de gelijkheid der bladeren en ranken verwisseld zijn."},{"catchword":"kenden ze niet","tekst":"Namelijk, dat zijne vrucht zo bitter en schadelijk was."}],"40":[{"catchword":"schepten","tekst":"Hebreeuws, goten zij uit; dat is, schepten op en goten in, te weten, in de vaten waaruit zij eten zouden."},{"catchword":"mannen","tekst":"Namelijk, de zonen der profeten."},{"catchword":"dood","tekst":"Dat is, een spijs, waaraan men den dood zou kunnen eten. Vergelijk Exo 10:17."},{"catchword":"konden","tekst":"Te weten, om de grote bitterheid wil."}],"41":[{"catchword":"Brengt dan meel;","tekst":"Hebreeuws, neemt; dat is, neemt en brengt. Zie Gen 12:15."},{"catchword":"niets kwaads","tekst":"Hebreeuws, geen kwaad ding. Dit had het meel niet weggenomen, maar de kracht Gods, waarvan het meel alleen een teken en middel was."}],"42":[{"catchword":"Baäl-salisa,","tekst":"Een landschap in Benjamin. Zie 1Sa 9:4."},{"catchword":"hulzen;","tekst":"Of, in hun huisjes; versta, dat zij in hun kaf nog staken, niet uitgedorst zijnde. Anders, in zijn kleed."},{"catchword":"het volk,","tekst":"Dat is, den zonen der profeten."}],"43":[{"catchword":"Wat zou ik","tekst":"Hebreeuws, voor hun aangezicht zetten. Hij acht de broden weinig, vergelijkende de veelheid des volks, die honderd in getal waren, bij de kleinheid der broden, van welke een man [zo men houdt] gemakkelijk twintig dragen Kon. Vergelijk Joh 6:9"}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now a (certain) woman of the wives of the sons of the Prophets [See 1 Kings 20.on ver.35.] cried unto Elisa, saying; Thy servant, my husband, is dead, and thou knowest, that thy servant feared the LORD; now the creditour [to whom I am indebted for moneys borrowed, or Wares bought, or otherwise] is come, to take both my children (to be) his servants. [i.e. bond-men, slaves: to wit, either that he himself may use them as such, or else fell them to others, for that which I owe him, and am not able up pay. See the: Law of God concerning this kind of bondage, Lev.25.39.]"}],"2":[{"catchword":null,"tekst":"And Elisa said unto her; What shall I do for thee? tell me; What hast thou in the house? and she said, Thine hand-maid hath nothing at all in the house, save a pitcher with oil. [To wit, which was full of oil, or at least wherein some oil was yet left.]"}],"3":[{"catchword":null,"tekst":"Then he said; Go ask for thy self vessels abroad, of all thy neighbour, empty vessels; see that thou hast not a few. [As well out of thine own house, as borrowed of others, and brought all together.]"}],"4":[{"catchword":null,"tekst":"Then come in, and shut the door before thee [Or, upon, or, by thee] and before thy sons: [viz. That none may hinder thee, either in the work, which I enjoy thee to do, or in the devotion, which thou must have therein unto the LORD] then pour into all these vessels, [to wit, oil out of thy pitcher] and fell away that which is full."}],"5":[{"catchword":null,"tekst":"So she went from him, and shut up the door before her, and before her sons; they brought her the vessels, and she poured in."}],"6":[{"catchword":null,"tekst":"And it came to pass, when these vessels were full, that she said unto her son, Bring me yet a vessel: but he said unto her, There is not a vessel more: and the oil stood still. [i.e. Was not multitude more, forasmuch as the pitcher, out of which she had poured, yielded no more oil.]"}],"7":[{"catchword":null,"tekst":"Then she came, and told it to the man of God; [Namely Elisa: see Judg.13.on v.6.] and he said, Go thy ways, sell thy oil, and pay thy Creditour: thou then (with) thy sons live by the rest. [To wit, of the oil, or the money, that thou shalt have made of the oil over and above thy debt.]"}],"8":[{"catchword":null,"tekst":"Also it came to pass on a day, when Elisa passed on to Sunem, [See 1 Kings 1 on v.3.] that there was a great woman, [great, in descent, name, and means. See Gen 14:35. and the annotate. also compare 1 Sam.25.2.] that besought him, to eat bread: [i.e. to take his repast with her. See Gen.31.on v.54. so in the sequel] more over, it came to pass, (that) as oft (as) he passed by, he turned in thither, to eat bread."}],"9":[{"catchword":null,"tekst":"And he said unto her husband; Behold now, I have perceived that this man of God is holy; [See Lev.19.on v.2.] which passeth by us continually."}],"10":[{"catchword":null,"tekst":"Let us, I pray, make a little upper chamber of a wall, [Heb.upper chamber of the wall; that is, a little chamber, that butted out with a wall. The Hebrew word is used both of stone-walls, above chap.3.25. and of board, or timber-walls, Levit.1.15. where mention is made of the wall of the Altar, which was made of wood, Exo 17:1. Oth.of, or, with walls] and let us set for him there a bed, and (a) table, and (a) candlestick, so it shall come to pass, when he cometh to us, (that) he shall turn in thither."}],"11":[{"catchword":null,"tekst":"And it came to pass on a day, that he came thither; and he turned into that upper chamber, and laid himself down there."}],"12":[{"catchword":null,"tekst":"Then he said unto his lad, [Or, servant, or, minister. The Hebrew word is affirmed not only of youths, or young men, but also of men of full growth and age. See Gen.22.on v.5. Such an one seemeth Gehazi to have been, by what is related below, chap.5.ver.27.] Gehazi, Call this Sunamitish (woman) and when he had called her, she stood before his face, [i.e. before Elisa.]"}],"13":[{"catchword":null,"tekst":"(For he said him, [Namely to his servant Gehazi] say now unto her, Behold, thou hast been careful for us with all this carefulness, [The word signifieth such a care as is accompanied with fear and trembling, whereby a man is afraid to omit, or neglect anything that is needful and necessary, or not do it so as it ought to be done. Compare Luk 10:40,41.] what is there to be done for thee? Is there any thing to be spoken for thee to the King; or to the chief Captain? and she had said, I dwell in the midst of my people. [i.e. I have peace and friendship with the people among whom I dwell, so that I am at variance with none, for which cause I should have need to trouble either the King, or his chief Captain.]"}],"14":[{"catchword":null,"tekst":"Then he [Namely Elisa] had said; [to wit, to his servant Gehazi, when he had told his master Elisa, what the woman had answered] What is there then to be done for her? And Gehazi had said; She hath indeed no son, and her husband is old."}],"15":[{"catchword":null, et made his prayer to God, without which the laying on of the staff was fruitless. Now he had not made his prayer, because by the mother earnest importunity he was minded himself to go the child, and there to pour out his prayer unto the LORD, which otherwise he would have done at home in his own house] nor any attention [i.e. hearing, or listening] so he turned back to meet him, and brought him word, saying; The lad is not awaked. [to wit, from the sleep of death. Compare Isa 26:19. Da.12.2.]"}],"32":[{"catchword":null,"tekst":"And when Elisa came into the house, [To wit, of the Shunamite] Behold, the lad was dead, being laid upon his bed. [to wit, upon the man of Gods bed, above ver.21.which bed was in the chamber, which the Sunamite had caused to be made in her house for the prophet, above ver.10.]"}],"33":[{"catchword":null,"tekst":"So he went in, [To wit, into the chamber, wherein he had been sometimes lodged, and where the dead body lay upon the bed] and shut the door upon both: [Namely, before him, and before the child] and prayed unto the LORD."}],"34":[{"catchword":null,"tekst":"And he went up, [To wit, upon the bed, whereon the dead child lay: so in the following verse] and laid himself down upon the child, and laying his mouth upon his mouth, and his eyes upon his eyes, and his hands upon his hands, spreading himself upon him, [see the examples, 1 Kings hands, spread himself upon him, [see the examples, 1 Kings 17.21. Act.20.10.] and the flesh of the child waxed warm."}],"35":[{"catchword":null,"tekst":"Then he returned, and walked in the house once hither, and once thither, and went up (again), and stretched himself out upon him, and the lad sneezed seven times, after that the lad opened his eyes. [Miracle are finished two manner of ways: First, sometimes forthwith, and immediately, as 1 Kings 18.37,38. Job 11:43,44. below ver.41.&c. Secondly sometimes by little and little, or by degrees, as here; so 1 Kings 18.44 45. Mark 8. ver.24, 52.]"}],"36":[{"catchword":null,"tekst":"And he called Gehezi, and said, call this Sunamite; and he called her, and she came to him: and he said, Take up thy son."}],"37":[{"catchword":null,"tekst":"So she came, and fell before his feet, and bowed herself to the ground: [With civil reverence, to give him thanks for the mercy, that God had bestowed upon her by his Ministery] and she took up her son, and went forth."}],"38":[{"catchword":null,"tekst":"Now when Elisa came again to Gigal, [See above chap.2.on v.1.] then there was (a) famine in that land, and the sons of the Prophets sat before his face: [To wit, as Disciples at his feet, to be instructed by him, as by their Master and Teacher: see above chap.2.on verse 3.] and he said unto his lad; Set on the great pot, [or, order, or make ready the great pot] and see the pottage sons of the Prophets."}],"39":[{"catchword":null,"tekst":"Then one went out into the field to gather pottage herbs, and he found a wild vine, [Heb. Vine of the field; that is, that growth in the field, or in some wild place: so ye have straightway Gourds of the field, that is, wild gourds, or colorinints] and gathered thereof, his garment full of wild gourds, [the branches whereof they writ that they be not unlike to the vine. It may be that they did shoot up neer this wild vine, and were mingled with the branches and leaves thereof, as wild gourds are wont to do: or that the names of wild vine, and wild gourds, in respect of the likeness of leaves and branches, were changed] and came, and shred them into the pot of pottage, for they knew them not. [namely, that their fruit was so bitter and dangerous.]"}],"40":[{"catchword":null,"tekst":"Then they filled up [Heb. Poured out, that is filled up, and poured in, to wit, into the vessels out of which they were to eat] for the men [namely, the sons of the Prophets] to eat: and it came to pass, when they did eat of that pottage, that they cried, and said, Man of God, death is in the pot: [that is, a kind of meat, whereof a man may eat his bane, or, death. Compare Exod.10.on v.17.] and they could not eat it. [to wit, because of the great bitterness.]"}],"41":[{"catchword":null,"tekst":"But he said, Then bring [Heb. Take; that is, take and bring: see Gen.12.on v.15.] meal: and he cast it into the pot: [see Exo 15:25.] and he said, take up for the people that they may eat; Then there was no barm in the pot. [Heb. no evil thing, &c. the meal had not taken this away, but the power of God, whereof the meal was onely a token and means.]"}],"42":[{"catchword":null,"tekst":"And there came a man from Baal Salisa, [A country in Benjamin: see 1 Sam 9.4.] and brought the man of God (loaves of) bread, of the fruits, twenty barley loaves, and green ears in their husks: [or, in their little houses; understand, that they stuck yet in their chaff, being not thrashed, or beaten out, oth. in his garment] and he said, Give unto the people [i.e. unto the sons of the Prophets] that they may eat."}],"43":[{"catchword":null,"tekst":"But his servant said; What should I set that before an hundred men? [Heb. Set that before their face. He counteth the loaves to be few, comparing the multitude of the people, which were an hundred in number, with the smallness of the loaves, of which one man (as is conceived) might easily carry twenty. Compare Job.6 9.] and he said, Give unto people, that they may eat; for thus saith the LORD; They shall eat, and leave (thereof) [see Job 6:11.]"}],"44":[{"catchword":null,"tekst":"So he set it before them, and they did eat, and they left (thereof) according to the Word of the LORD."}]}}};
