et, mijn broeders, als de wereld u haat. Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood. Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Richt 3:8": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van Cuschan-Rischataïm, koning van Mesopotamië; en de kinderen van Israël dienden Cuschan-Rischataïm acht jaren.", "Ezech 7:2-12": "Verder, mensenkind, zo zegt de Heere HEERE, van het land van Israël: Het einde is er, het einde is gekomen over de vier hoeken van het land. Nu is het einde over u; want Ik zal Mijn toorn tegen u zenden, en Ik zal u richten naar uw wegen, en Ik zal op u brengen al uw gruwelen. En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben.", "Ps 22:8": "Allen die mij zien, bespotten mij; zij steken de lip uit, zij schudden het hoofd en zeggen:", "Rom 9:29": "En zoals Jesaja van tevoren gezegd heeft: Als de Heere Sebaoth ons geen nageslacht had overgelaten, dan waren wij geworden als Sodom, en gelijk gemaakt aan Gomorra.", "Deut 28:25": "De HEERE zal geven dat u verslagen wordt voor uw vijanden; door één weg zult u tegen hem uittrekken, en door zeven wegen zult u voor hem vluchten; en u zult heen en weer gedreven worden onder alle koninkrijken van de aarde.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Jes 5:21": "Wee hun die in hun eigen ogen wijs, en naar hun eigen oordeel verstandig zijn!", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "2 Kron 29:21": "En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij die op het altaar van de HEERE zouden offeren.", "Spr 20:22": "Zeg niet: Ik zal het kwaad vergelden; wacht op de HEERE, en Hij zal u verlossen.", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Matt 24:21": "Want dan zal er grote verdrukking zijn, wat voor verdrukking er niet geweest is vanaf het begin van de wereld tot nu toe, en er ook nooit meer zal zijn.", "1 Joh 2:26": "Dit heb ik u geschreven over hen, die u verleiden.", "Jes 30:16": "En u zegt: Nee, maar op paarden zullen wij vluchten; daarom zult u vluchten! En: Op snelle paarden zullen wij rijden; daarom zullen uw vervolgers ook snel zijn!", "Ezech 48:8": "Aan de grens nu van Juda, van de oostkant tot de westkant toe, zal het hefoffer zijn, dat u zult offeren, vijfentwintigduizend meetrieten in breedte, en de lengte, als van een van de andere delen, van de oostkant tot de westkant toe; en het heiligdom zal in het midden daarvan zijn.", "Jes 43:27": "Uw eerste vader heeft gezondigd, en uw uitleggers hebben tegen Mij overtreden.", "Hos 10:13": "U hebt goddeloosheid geploegd, verkeerdheid gemaaid, en de vrucht van de leugen gegeten; want u hebt vertrouwd op uw eigen weg, op de veelheid van uw helden.", "Jer 18:3": "Zo ging ik naar het huis van de pottenbakker; en zie, hij maakte een werk op de schijven.", "Matt 24:48-51": "Maar als die slechte dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg, en zou beginnen zijn mededienstknechten te slaan, en te eten en te drinken met de dronkaards, dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Ezech 30:8": "En zij zullen weten dat Ik de HEERE ben, als Ik een vuur in Egypte zal hebben aangestoken, en al zijn helpers zullen verbroken worden.", "Ps 106:32": "Zij maakten Hem ook zeer toornig aan het twistwater, en het ging Mozes kwalijk om hunnentwil.", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Ezech 29:6": "En alle inwoners van Egypte zullen weten dat Ik de HEERE ben, omdat zij voor het huis van Israël een rietstok geweest zijn.", "1 Sam 24:7": "En hij zei tegen zijn mannen: Laat het ver van mij zijn bij de HEERE, dat ik deze zaak zou doen aan mijn heer, de gezalfde van de HEERE, dat ik mijn hand tegen hem uit zou steken; want hij is de gezalfde van de HEERE!", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Joz 7:26": "En zij richtten over hem een grote steenhoop op, die er tot op deze dag nog is. Zo keerde de HEERE zich af van de gloed van Zijn toorn. Daarom noemde men de naam van die plaats het dal van Achor, tot op deze dag toe.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Jer 23:19": "Zie, een onweer van de HEERE, een grimmigheid is uitgegaan, ja, een pijnlijk onweer, het zal blijven op het hoofd van de goddelozen.", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Obadja 1:10-14": "Om het geweld, gepleegd tegen uw broeder Jakob, zal schaamte u bedekken; en u zult voor eeuwig worden uitgeroeid. Op de dag dat u tegenover hem stond, op de dag dat vreemden zijn leger gevangen wegvoerden, en buitenlanders zijn poorten binnentrokken, en over Jeruzalem het lot wierpen, was u ook als een van hen. U had niet moeten kijken naar de dag van uw broeder, de dag van zijn vervreemding; en u had zich niet moeten verblijden over de kinderen van Juda, op de dag van hun ondergang; en u had uw mond niet groot moeten maken, op de dag van de benauwdheid;", "1 Kon 16:2-13": "Omdat Ik u uit het stof heb verheven, en u tot een voorganger over Mijn volk Israël heb aangesteld, en u gewandeld hebt in de weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, en Mij tot toorn hebt verwekt door hun zonden; Zie, zo zal Ik de nakomelingen van Baësa, en de nakomelingen van zijn huis wegdoen; en Ik zal uw huis maken zoals het huis van Jerobeam, de zoon van Nebat. Wie van Baësa in de stad sterft, zullen de honden opeten, en wie van hem in het veld sterft, zullen de vogels van de hemel opeten.", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Hebr 13:9": "Laat u niet meeslepen door allerlei vreemde leringen; want het is goed dat het hart gesterkt wordt door genade, niet door spijzen, waarmee zij die daarin gewandeld hebben, geen nuttigheid hebben verkregen.", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "2 Kron 26:18": "En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Ezech 25:15": "Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap;", "Num 6:2-21": "Spreek tot de kinderen van Israël, en zeg tot hen: Wanneer een man of een vrouw zich afgescheiden zal hebben, door de gelofte van een Nazireeër te beloven, om zich voor de HEERE af te zonderen; Van wijn en sterke drank zal hij zich afzonderen; wijnazijn en azijn van sterke drank zal hij niet drinken, ook geen vocht van druiven zal hij drinken, en geen verse of gedroogde druiven eten. Al de dagen van zijn Nazireeërschap zal hij niets eten van wat van de wijnstok van de wijn gemaakt is, van de kernen af tot de basten toe.", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Deut 28:65": "Daarbij zult u onder die volken geen rust vinden, en uw voetzool zal geen rust hebben; want de HEERE zal u daar een bevend hart geven, en bezwijking van de ogen, en kwelling van de ziel.", "Jes 29:21": "die een mens schuldig maken om een woord, en die strikken leggen voor hem die bestraft in de poort; en die de rechtvaardige verdrijven met valse argumenten.", "Klaagl 3:48": "Pe. Met waterbeken loopt mijn oog neer, vanwege de breuk van de dochter van mijn volk.", "Tit 3:11": "Wetend dat zo iemand verkeerd is, en zondigt, terwijl hij zichzelf veroordeelt.", "Klaagl 5:10": "Onze huid is zwart geworden als een oven, vanwege de verzengende hitte van de honger.", "Gen 49:7": "Vervloekt is hun toorn, want hij is heftig; en hun verbolgenheid, want zij is hard! Ik zal hen verdelen onder Jakob, en zal hen verstrooien onder Israël.", "Hand 7:52": "Wie van de profeten hebben uw vaders niet vervolgd? En zij hebben degenen gedood die van tevoren de komst van de Rechtvaardige verkondigd hebben, van Wie u nu verraders en moordenaars geworden bent.", "Jer 48:33": "Zodat de blijdschap en vreugde uit het vruchtbare veld, namelijk uit Moabs land, weggenomen is; want Ik heb de wijn doen ophouden uit de kuipen; men zal geen druiven treden met vreugdegeroep; het vreugdegeroep zal geen vreugdegeroep zijn.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Jes 22:11": "Ook zult u een gracht maken tussen beide de muren, voor het water van de oude vijver; maar u zult niet omhoogkijken naar Hem, Die dat gedaan heeft, en Hem niet aanmerken, Die dat van verre tijden gevormd heeft.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Ps 10:6": "Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Jer 21:5": "En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid.", "Hoogl 5:10": "Mijn Liefste is blank en rood, Hij draagt de banier boven tienduizend.", "Jer 14:13": "Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Job 24:8": "Van de stromen op de bergen worden zij nat, en zonder toevlucht omhelzen zij de rotsen.", "1 Joh 4:5": "Zij zijn uit de wereld; daarom spreken zij uit de wereld, en de wereld hoort hen.", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Luk 17:26-30": "En zoals het gebeurde in de dagen van Noach, zo zal het ook zijn in de dagen van de Zoon des mensen. Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot de dag waarop Noach in de ark ging, en de zondvloed kwam en hen allen verdierf. Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "Klaagl 4:4-6": "Daleth. De tong van het zuigeling kleeft aan zijn gehemelte van dorst; de kinderen vragen om brood, er is niemand die het hun uitdeelt. He. Die lekkernijen aten, komen nu om op de straten; die in karmozijn zijn grootgebracht, omhelzen de vuilnishoop. Vau. En de ongerechtigheid van de dochter van mijn volk is groter dan de zonden van Sodom, dat als in een ogenblik omgekeerd werd, zonder dat er handen naar haar uitgestoken werden.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Hebr 9:1": "Zo had dan het eerste verbond wel regels van de eredienst, en het aardse heiligdom.", "Rom 1:29-32": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid; kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders; onverstandigen, verbondbrekers, zonder natuurlijke liefde, onverzoenlijken, onbarmhartigen;", "Tit 1:10-14": "Want er zijn ook veel ongeregelde mensen, mensen die zinloze praat verkondigen en misleiden, vooral zij die uit de besnijdenis zijn; hun moet men de mond snoeren, want zij brengen hele huizen in verwarring, en leren wat niet behoort, om het schandelijke gewin. Iemand uit hen, hun eigen profeet, heeft gezegd: De Kretenzers zijn altijd leugenachtig, kwade beesten, luie buiken.", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Num 12:9": "Zo ontstak de toorn van de HEERE tegen hen, en Hij ging weg.", "Job 28:18": "De Ramoth en Gabisch zullen niet gedacht worden; want de trek van de wijsheid is meer dan die van Robijnen.", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "Spr 24:17": "Verblijd u niet, als uw vijand valt; en als hij neerstruikelt, laat uw hart zich niet verheugen;", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Hand 20:29": "Want dit weet ik, dat na mijn vertrek zware wolven onder u zullen komen, die de kudde niet sparen.", "Jer 19:11": "En u zult tegen hen zeggen: Zo zegt de HEERE van de heerscharen: Zo zal Ik dit volk en deze stad verbreken, zoals men een pottenbakkersvat verbreekt, dat niet weer heel gemaakt kan worden; en zij zullen hen in Tofeth begraven, omdat er geen andere plaats zal zijn om te begraven.", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "2 Kron 36:19": "En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Mark 9:33-35": "En Hij kwam in Kapernaüm, en toen Hij in huis was, vroeg Hij hun: Waarover had u het onderweg met elkaar? Maar zij zwegen; want zij hadden onderweg met elkaar getwist over wie de belangrijkste zou zijn. En Hij ging zitten, riep de twaalf, en zei tegen hen: Als iemand de eerste wil zijn, die zal de laatste van allen zijn, en de dienaar van allen.", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Jes 42:25": "Daarom heeft Hij over hen uitgestort de grimmigheid van Zijn toorn en de macht van de oorlog; en Hij heeft ze rondom in vlam gezet, doch zij merken het niet; en Hij heeft ze in brand gestoken, doch zij nemen het niet ter harte.", "Jer 23:14-16": "Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra. Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van de profeten van Jeruzalem is de huichelarij uitgegaan in het hele land. Zo zegt de HEERE van de heerscharen: Hoor niet naar de woorden van de profeten, die u profeteren; zij maken u ijdel; zij spreken het visioen van hun eigen hart, niet uit de mond van de HEERE.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Openb 18:7": "Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien.", "Hos 4:8-13": "Zij eten de zonde van Mijn volk, en verlangen, ieder met zijn ziel, naar hun ongerechtigheid. Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden. En zij zullen eten, maar niet verzadigd worden, zullen hoereren, maar niet toenemen in aantal; want zij hebben nagelaten de Heere in acht te nemen.", "Jes 52:1": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen.", "Jes 47:8": "Nu dan, hoor dit, weelderige! Die zo zeker woont, die in haar hart zegt: Ik ben het, en niemand meer dan ik: ik zal geen weduwe zitten, en de beroving van kinderen niet kennen.", "Num 11:1": "En het gebeurde dat het volk zich beklaagde, en dat was kwaad in de oren van de HEERE; want de HEERE hoorde het, zodat Zijn toorn ontstak, en het vuur van de HEERE onder hen ontbrandde en verteerde hen die in het uiterste van het leger waren.", "Jes 56:10": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief.", "Ps 10:14": "U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Jes 9:16": "Daarom zal de Heere Zich niet verblijden over hun jongelingen, en over hun wezen en hun weduwen zal Hij Zich niet ontfermen, want zij zijn allen samen huichelaars en boosdoeners, en elke mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Lev 26:21": "En als u tegen Mij in blijft ingaan, en Mij niet wilt horen, zal Ik over u, naar uw zonden, zevenvoudig slagen toedoen.", "2 Kon 23:26": "Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Jer 23:11": "Want zowel profeten als priesters zijn huichelaars; zelfs in Mijn huis vind Ik hun boosheid, spreekt de HEERE.", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Kol 2:19": "En hij houdt het Hoofd niet vast, van waaruit het hele lichaam, door de gewrichten en banden gevoed en samengevoegd, groeit met een goddelijke groei.", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Ps 22:9": "Hij heeft het op de HEERE gewenteld, dat Hij hem nu uithelpt, dat Hij hem redt, omdat Hij lust aan hem heeft!", "Mark 15:10": "(Want hij wist dat de overpriesters Hem uit afgunst overgeleverd hadden.)", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Jes 20:5": "En zij zullen verschrikken en beschaamd zijn over de Moren, op wie zij hun hoop hadden gevestigd, en over de Egyptenaars, hun roem.", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Ezech 14:9": "Als nu een profeet overreed is en iets gesproken heeft, Ik, de HEERE, heb die profeet overreed, en Ik zal Mijn hand tegen hem uitstrekken, en zal hem verdelgen uit het midden van Mijn volk Israël.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "2 Kon 18:21": "Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Micha 3:6": "Daarom zal het nacht voor u worden vanwege het visioen, en u zal duisternis zijn vanwege de waarzegging; en de zon zal over deze profeten ondergaan; en de dag zal over hen zwart worden.", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Ps 119:150": "Die kwade praktijken najagen, genaken mij, zij wijken ver van Uw wet.", "Jer 6:12": "En hun huizen zullen omgewend worden tot anderen, samen met de akkers en vrouwen; want Ik zal Mijn hand uitstrekken tegen de inwoners van dit land, spreekt de HEERE.", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Jer 6:3": "Maar er zullen herders tot haar komen met hun kudden; zij zullen tenten rondom tegen haar opslaan; zij zullen ieder zijn ruimte afweiden.", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "Ezech 5:15": "Zo zal de smaad en hoon een lering en ontzetting zijn voor de heidenvolken die rondom u zijn, wanneer Ik over u gerichten in toorn, en in grimmigheid, en in grimmige straffen oefenen zal; Ik, de HEERE, heb het gesproken!", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "Jes 48:9": "Om Mijn Naams wil zal Ik Mijn toorn langer uitstellen, en om het roem van Mij wil zal Ik, u ten goede, Mij bedwingen, opdat Ik u niet afhouw.", "Ezech 12:13": "Ik zal ook Mijn net over hem uitspreiden, zodat hij in Mijn jachtnet gegrepen wordt; en Ik zal hem brengen naar Babylonië, het land van de Chaldeeën; ook zal hij dat niet zien, hoewel hij daar zal sterven.", "Jes 29:11": "Daarom is voor u elk visioen geworden als de woorden van een verzegeld boek, dat men geeft aan iemand die lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet, want het is verzegeld.", "Ps 51:9": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw.", "Num 32:10": "Toen ontstak de toorn van de HEERE op die dag, en Hij zwoer en zei:", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Jes 1:10": "Hoor het woord van de HEERE, leiders van Sodom! Neem de wet van onze God ter oor, volk van Gomorra!", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Jer 6:13": "Want van hun kleinste aan tot hun grootste toe pleegt ieder van hen gierigheid, en van de profeet aan tot de priester toe bedrijft ieder van hen valsheid.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Num 11:33": "Dat vlees was nog tussen hun tanden, voordat het gekauwd was, toen ontstak de toorn van de HEERE tegen het volk, en de HEERE sloeg het volk met een zeer grote plaag.", "Jes 29:10": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.", "Jer 24:9": "En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben;", "Jer 3:2": "Sla uw ogen op naar de hoge plaatsen, en zie toe: waar bent u niet beslapen? U hebt voor hen gezeten langs de wegen, als een Arabier in de woestijn; zo hebt u het land ontheiligd met uw hoererijen en met uw slechtheid.", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "Jer 36:7": "Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.", "Ezech 42:20": "Hij mat het aan de vier zijden; het had een muur rondom, de lengte was vijfhonderd rieten, en de breedte vijfhonderd, om onderscheid te maken tussen het heilige en het onheilige.", "2 Petr 2:6": "en de steden Sodom en Gomorra tot as heeft laten verbranden en met een omkering veroordeeld heeft, en tot een voorbeeld gesteld heeft voor hen die goddeloos zouden leven;", "Joh 8:44": "U bent uit uw vader de duivel, en u wilt de begeerten van uw vader doen; die was een mensenmoordenaar van het begin af aan, en is niet in de waarheid blijven staan, want er is geen waarheid in hem. Wanneer hij de leugen spreekt, spreekt hij uit wat van hemzelf is; want hij is een leugenaar, en de vader daarvan.", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Kol 3:6": "Om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "Jer 49:18": "Zoals de omkering van Sodom en Gomorra en haar buren, zal het zijn, zegt de HEERE; niemand zal daar wonen, en geen mensenkind daarin verblijven.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Jes 13:19": "Zo zal Babel, het sieraad van de koninkrijken, de heerlijkheid, de hovaardigheid van de Chaldeeën, zijn zoals toen God Sodom en Gomorra omgekeerd heeft.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Ezech 44:5": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Ps 71:13": "Laat hen beschaamd worden, laat hen verteerd worden, die mijn ziel tegenstaan; laat hen met smaad en schande overdekt worden, die mijn kwaad zoeken.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Dan 8:11": "Ja, hij verhief zich tot aan de Vorst van dat leger, en van Hem werd het voortdurende offer weggenomen, en de woning van Zijn heiligdom werd neergeworpen.", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "Openb 14:9-11": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "1 Kron 9:29": "Want uit hen zijn er aangesteld over de voorwerpen, en over al de heilige voorwerpen, en over de meelbloem, en wijn, en olie, en wierook, en specerijen.", "Ps 106:44": "Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Jes 1:21": "Hoe is de trouwe stad tot een hoer geworden! Zij was vol recht, gerechtigheid herbergde daarin, maar nu doodslagers.", "Ezech 5:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE (omdat u Mijn heiligdom verontreinigd hebt met al uw verfoeisels, en met al uw gruwelen), zeker zal Ik ook u daarom verminderen, en Mijn oog zal u niet verschonen, en Ik zal ook niet sparen!", "Ezech 45:3": "Zo zult u met deze maat meten: de lengte van vijfentwintigduizend, en de breedte van tienduizend, en daarin zal het heiligdom zijn, met het heilige der heiligen.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Amos 1:11": "Zo zegt de HEERE: Om drie overtredingen van Edom, en om vier zal Ik dat niet afwenden; omdat hij zijn broeders met het zwaard heeft vervolgd, en zijn medelijden heeft verdorven; en dat zijn toorn eeuwig verscheurt, en hij zijn woede altijd blijft koesteren.", "Jer 46:27": "Maar u, Mijn knecht Jakob! Vrees niet, en wees niet ontzet, Israël! Want zie, Ik zal u verlossen uit verre landen, en uw nageslacht uit het land van hun gevangenschap; en Jakob zal wederkomen, en stil en gerust zijn, en niemand zal hem verschrikken.", "Ezech 4:17": "Opdat zij gebrek hebben aan brood en water, en de een met de ander verbaasd worden, en in hun ongerechtigheid wegkwijnen.", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Jer 25:20": "En de hele gemengde volksmassa, en alle koningen van het land van Uz; en alle koningen van het land van de Filistijnen, en Askelon, en Gaza, en Ekron, en het overblijfsel van Asdod;", "2 Kon 25:5": "Doch het leger van de Chaldeeën jaagde de koning na, en zij achterhaalden hem in de vlakke velden van Jericho, en heel zijn leger raakte van bij hem verstrooid.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Ezech 33:10": "Daarom, mensenkind! Zeg tegen het huis van Israël: U spreekt zo en zegt: Omdat onze overtredingen en onze zonden op ons zijn, en wij daarin wegkwijnen, hoe zouden wij dan leven?", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "2 Kron 30:15": "Toen slachtten zij het pascha, op de veertiende dag van de tweede maand; en de priesters en de Levieten waren beschaamd geworden, en hadden zich geheiligd, en hadden brandoffers gebracht in het huis van de HEERE.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "Jes 11:14": "Maar zij zullen op de schouder van de Filistijnen vliegen naar het westen, en zij zullen samen die van het oosten beroven; aan Edom en Moab zullen zij hun handen slaan, en de kinderen van Ammon zullen hun gehoorzaam zijn.", "Obadja 1:10": "Om het geweld, gepleegd tegen uw broeder Jakob, zal schaamte u bedekken; en u zult voor eeuwig worden uitgeroeid.", "Jer 6:11": "Daarom ben ik vol van de grimmigheid van de HEERE, ik ben moe geworden van inhouden; ik zal het uitstorten over de kinderen op de straat, en over de vergadering van de jongelingen samen; want zelfs de man met de vrouw zullen gevangen worden, de oude met hem, die vol is van dagen.", "Klaagl 2:3": "Gimel. Hij heeft, in ontsteking van de toorn, de gehele hoorn van Israël afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, dat rondom verteert.", "Luk 12:19": "en ik zal tegen mijn ziel zeggen: Ziel, je hebt veel goederen liggen, voor vele jaren; neem rust, eet, drink, wees vrolijk.", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Jer 5:31": "De profeten profeteren vals, en de priesters heersen door hun eigen hand; en Mijn volk heeft het graag zo; maar wat zult u aan het einde daarvan doen?", "Spr 11:21": "Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "Deut 9:13": "Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.", "Hos 12:3": "Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.", "Jes 64:5-7": "U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden."}, "noten": {"1": "Vers 22, \"bezoeken\": SV-woord met de oorspronkelijke betekenis \"straffen, vergelden\"."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H2091\">Aleph</span>. <span class=\"wl\" data-l=\"L1\" data-code=\"H2091\">Hoe</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H2091\">is</span> <spa span> the <span class=\"wl wl-kjv\" data-code=\"H7699\">breast,</span> they give <span class=\"wl wl-kjv\" data-code=\"H3243\">suck</span> to their young <span class=\"wl wl-kjv\" data-code=\"H1482\">ones:</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> is become <span class=\"wl wl-kjv\" data-code=\"H393\">cruel,</span> like the <span class=\"wl wl-kjv\" data-code=\"H3283\">ostriches</span> in the wilderness.", "4": "The <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> of the sucking <span class=\"wl wl-kjv\" data-code=\"H3243\">child</span> <span class=\"wl wl-kjv\" data-code=\"H1692\">cleaveth</span> to the roof of his <span class=\"wl wl-kjv\" data-code=\"H2441\">mouth</span> for <span class=\"wl wl-kjv\" data-code=\"H6772\">thirst:</span> the young <span class=\"wl wl-kjv\" data-code=\"H5768\">children</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and no man breaketh", "5": "They that did <span class=\"wl wl-kjv\" data-code=\"H398\">feed</span> <span class=\"wl wl-kjv\" data-code=\"H4574\">delicately</span> are <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate</span> in the <span class=\"wl wl-kjv\" data-code=\"H2351\">streets:</span> they that were brought <span class=\"wl wl-kjv\" data-code=\"H539\">up</span> in <span class=\"wl wl-kjv\" data-code=\"H8438\">scarlet</span> <span class=\"wl wl-kjv\" data-code=\"H2263\">embrace</span> dunghills.", "6": "For the punishment of the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> is <span class=\"wl wl-kjv\" data-code=\"H1431\">greater</span> than the <span class=\"wl wl-kjv\" data-code=\"H2403\">punishment</span> of the sin of <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom,</span> that was <span class=\"wl wl-kjv\" data-code=\"H2015\">overthrown</span> as in a <span class=\"wl wl-kjv\" data-code=\"H7281\">moment,</span> and no <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> stayed", "7": "Her <span class=\"wl wl-kjv\" data-code=\"H5139\">Nazarites</span> were <span class=\"wl wl-kjv\" data-code=\"H2141\">purer</span> than <span class=\"wl wl-kjv\" data-code=\"H7950\">snow,</span> they were <span class=\"wl wl-kjv\" data-code=\"H6705\">whiter</span> than <span class=\"wl wl-kjv\" data-code=\"H2461\">milk,</span> they were more <span class=\"wl wl-kjv\" data-code=\"H119\">ruddy</span> in <span class=\"wl wl-kjv\" data-code=\"H6106\">body</span> than <span class=\"wl wl-kjv\" data-code=\"H6443\">rubies,</span> their <span class=\"wl wl-kjv\" data-code=\"H1508\">polishing</span> was of sapphire:", "8": "Their <span class=\"wl wl-kjv\" data-code=\"H8389\">visage</span> is <span class=\"wl wl-kjv\" data-code=\"H2821\">blacker</span> than a <span class=\"wl wl-kjv\" data-code=\"H7815\">coal;</span> they are not <span class=\"wl wl-kjv\" data-code=\"H5234\">known</span> in the <span class=\"wl wl-kjv\" data-code=\"H2351\">streets:</span> their <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> <span class=\"wl wl-kjv\" data-code=\"H6821\">cleaveth</span> to their <span class=\"wl wl-kjv\" data-code=\"H6106\">bones;</span> it is <span class=\"wl wl-kjv\" data-code=\"H3001\">withered,</span> it is become like a stick.", "9": "They that be <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> are <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> than they that be <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> with <span class=\"wl wl-kjv\" data-code=\"H7458\">hunger:</span> for <span class=\"wl wl-kjv\" data-code=\"H1992\">these</span> pine <span class=\"wl wl-kjv\" data-code=\"H2100\">away,</span> <span class=\"wl wl-kjv\" data-code=\"H1856\">stricken</span> through for want of the <span class=\"wl wl-kjv\" data-code=\"H8570\">fruits</span> of the field.", "10": "The <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of the <span class=\"wl wl-kjv\" data-code=\"H7362\">pitiful</span> <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> have <span class=\"wl wl-kjv\" data-code=\"H1310\">sodden</span> their own <span class=\"wl wl-kjv\" data-code=\"H3206\">children:</span> they were their <span class=\"wl wl-kjv\" data-code=\"H1262\">meat</span> in the <span class=\"wl wl-kjv\" data-code=\"H7667\">destruction</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of my people.", "11": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H3615\">accomplished</span> his <span class=\"wl wl-kjv\" data-code=\"H2534\">fury;</span> he hath poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H3341\">kindled</span> a <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> and it hath <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> the foundations", "12": "The <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H8398\">world,</span> would not have <span class=\"wl wl-kjv\" data-code=\"H539\">believed</span> that the <span class=\"wl wl-kjv\" data-code=\"H6862\">adversary</span> and the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> should have <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of J /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
