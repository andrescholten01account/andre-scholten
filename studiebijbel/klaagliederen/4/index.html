ht is van de HEERE.", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "Jer 9:9-11": "Zou Ik hen om deze dingen niet straffen? spreekt de HEERE; zou Mijn ziel zich niet wreken aan zo'n volk, als dit is? Ik zal een geween en een klaagzang aanheffen over de bergen, en een klaaglied over de herdershutten van de woestijn; want zij zijn afgebrand, zodat er niemand doorgaat, en men hoort er geen stem van vee; van de vogels van de hemel tot de dieren toe zijn zij weggevlucht, weggegaan! En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner.", "Deut 29:23": "Dat zijn hele aarde zwavel en zout is van de verbranding; die niet bezaaid zal zijn, en geen spruit zal voortgebracht hebben, en geen kruid daarin zal opgekomen zijn; zoals de omkering van Sodom en Gomorra, Adama en Zeboïm, die de HEERE heeft omgekeerd in Zijn toorn en in Zijn grimmigheid;", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "Matt 14:19": "En Hij beval de menigten neer te zitten op het gras, en nam de vijf broden en de twee vissen, en Hij keek op naar de hemel, zegende ze; en toen Hij ze gebroken had, gaf Hij de broden aan de discipelen, en de discipelen aan de menigten.", "Ezech 24:23": "En uw hoofddeksels zullen op uw hoofden zijn, en uw schoenen aan uw voeten; u zult niet rouwklagen, en ook niet wenen, maar u zult wegkwijnen in uw ongerechtigheden, en ieder zal tegen zijn broeder zuchten.", "Luk 9:46": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.", "Jer 2:37": "U zult ook van hier uitgaan met uw handen op uw hoofd; want de HEERE heeft al uw vertrouwen verworpen, zodat u daarmee niet zult gedijen.", "Luk 21:22": "Want dit zijn dagen van wraak, opdat alles vervuld wordt wat geschreven is.", "Ps 73:17": "Totdat ik in Gods heiligdommen inging, en op hun einde lette.", "Ps 74:20": "Zie naar het verbond; want de duistere plaatsen van het land zijn vol woningen van geweld.", "Jes 21:12": "De wachter zei: De morgenstond is gekomen, en het is nog nacht; als u wilt vragen, vraag; keer terug, kom.", "Jes 51:18": "Er is niemand van al de kinderen, die zij gebaard heeft, die haar zachtjes leidt; en niemand van al de kinderen, die zij opgevoed heeft, die haar bij de hand grijpt.", "Ruth 1:20": "Maar zij zei tegen hen: Noem mij niet Naomi, noem mij Mara; want de Almachtige heeft mij grote bitterheid aangedaan.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "Ezech 12:27": "Mensenkind, zie, zij van het huis van Israël zeggen: Het visioen dat hij ziet, is voor vele dagen later, en hij profeteert over tijden die ver weg zijn.", "Zach 8:17": "En denk niet, de een over de ander, kwaad in uw hart; en heb een valse eed niet lief; want al deze dingen zijn wat Ik haat, spreekt de HEERE.", "Luk 6:39": "En Hij vertelde hun een gelijkenis: Kan een blinde soms een blinde leiden? Zullen zij niet beiden in de kuil vallen?", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "2 Kon 6:21": "En de koning van Israël zei tegen Elisa, toen hij hen zag: Zal ik hen doden? Zal ik hen doden, mijn vader?", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "Matt 10:15": "Voorwaar, Ik zeg u: het zal voor het land van Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "Ezech 35:11-15": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE: Ik zal ook handelen naar uw toorn en naar uw jaloezie, die u uit uw haat tegen hen hebt uitgevoerd; en Ik zal Mij aan hen bekendmaken, wanneer Ik u geoordeeld zal hebben. En u zult weten, dat Ik, de HEERE, al uw lasteringen gehoord heb, die u tegen de bergen van Israël gesproken hebt, en u zei: Zij zijn verwoest, zij zijn ons tot voedsel gegeven. Zo hebt u zich met uw mond tegen Mij groot gemaakt, en uw woorden tegen Mij vermenigvuldigd; Ik heb het gehoord.", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Gen 27:29": "Volken zullen u dienen, en volken zullen zich voor u neerbuigen; wees heer over uw broers, en de zonen van uw moeder zullen zich voor u neerbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!", "Deut 9:18-20": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken. Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment. Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Spr 6:18": "een hart dat verdorven plannen smeedt; voeten die zich haasten om naar het kwaad te lopen;", "Deut 32:32": "Want hun wijnstok is uit de wijnstok van Sodom, en uit de velden van Gomorra; hun wijndruiven zijn vergiftige wijndruiven; zij hebben bittere druiventrossen.", "Deut 32:26": "Ik zei: In alle hoeken zou Ik hen verstrooien; Ik zou hun gedachtenis van onder de mensen doen ophouden;", "Matt 18:28-35": "Maar deze dienstknecht ging naar buiten en vond een van zijn mededienstknechten, die hem honderd penningen schuldig was; hij greep hem vast en greep hem bij de keel, en zei: Betaal mij wat u schuldig bent. Zijn mededienstknecht viel toen aan zijn voeten neer en smeekte hem: Heb geduld met mij, en ik zal u alles betalen. Maar hij wilde niet, maar ging weg en wierp hem in de gevangenis, totdat hij de schuld zou betaald hebben.", "Klaagl 2:21": "Schin. De jongen en de ouden liggen op de aarde op de straten; mijn jonkvrouwen en mijn jongelingen zijn door het zwaard gevallen; Gij hebt ze gedood in de dag van Uw toorn, Gij hebt ze geslacht en niet verschoond.", "Ezech 25:14": "En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE.", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Jes 47:10": "Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Ef 4:14": "Opdat wij niet meer kinderen zouden zijn, die heen en weer bewogen en meegevoerd worden met elke wind van leer, door het bedrog van de mensen, door arglistigheid, om listig tot dwaling te brengen;", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "2 Sam 18:3": "Maar het volk zei: U mag niet meetrekken; want als wij op de vlucht slaan, zullen zij zich niet om ons bekommeren; ja, al stierf de helft van ons, zij zullen zich niet om ons bekommeren; maar u bent nu als tienduizend van ons waard. Zo zal het nu beter zijn, dat u ons vanuit de stad te hulp komt.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Ps 71:11": "En zeggen: God heeft hem verlaten; jaag hem na, en grijp hem, want er is geen verlosser.", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Mal 2:1-3": "En nu, priesters, dit gebod wordt tot u gezonden. Als u niet zult horen, en als u het niet ter harte zult nemen om Mijn Naam eer te geven, zegt de HEERE van de heerscharen, dan zal Ik de vloek onder u zenden, en Ik zal uw zegeningen vervloeken; ja, Ik heb ook al elk daarvan vervloekt, omdat u het niet ter harte neemt. Zie, Ik zal het zaad voor u verderven; en Ik zal drek op uw gezichten strooien, de drek van uw feesten, zodat men u daarmee wegnemen zal.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Joh 13:37": "Petrus zei tegen Hem: Heere, waarom kan ik U nu niet volgen? Ik zal mijn leven voor U geven.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Jes 9:17-20": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook. Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien. Als hij ter rechterhand snijdt, zal hij toch hongeren, en als hij ter linkerhand eet, zal hij toch niet verzadigd worden; ieder zal het vlees van zijn eigen arm eten;", "Deut 32:24": "Uitgeteerd zullen zij zijn van honger, opgegeten door de karbonkel en bitter verderf; en Ik zal de tanden van de beesten onder hen sturen, met vurig venijn van slangen van het stof.", "Spr 14:22": "Dwalen zij niet, die kwaad beramen? Maar goedertierenheid en trouw is er voor hen die goed beramen.", "Gen 36:28": "Dit zijn de zonen van Disan: Uz en Aran.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Matt 26:33-35": "Doch Petrus antwoordde en zei tegen Hem: Al werden zij ook allen aan U geërgerd, ik zal nooit geërgerd worden. Jezus zei tegen hem: Voorwaar, Ik zeg u dat u in deze zelfde nacht, voordat de haan gekraaid zal hebben, Mij driemaal zult verloochenen. Petrus zei tegen Hem: Al moest ik ook met U sterven, ik zal U geenszins verloochenen! Hetzelfde zeiden ook alle discipelen.", "Matt 13:12-15": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Jer 50:20": "In die dagen en op die tijd, spreekt de HEERE, zal de ongerechtigheid van Israël gezocht worden, maar zij zal er niet zijn, en de zonden van Juda, maar zullen niet gevonden worden; want Ik zal het vergeven aan hen die Ik zal doen overblijven.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "Jer 49:22": "Zie, hij zal opkomen en snel vliegen, als een arend, en zijn vleugels over Bozra uitspreiden; en het hart van Edoms helden zal op die dag wezen als het hart van een vrouw die in nood is.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Klaagl 4:4-10": "Daleth. De tong van het zuigeling kleeft aan zijn gehemelte van dorst; de kinderen vragen om brood, er is niemand die het hun uitdeelt. He. Die lekkernijen aten, komen nu om op de straten; die in karmozijn zijn grootgebracht, omhelzen de vuilnishoop. Vau. En de ongerechtigheid van de dochter van mijn volk is groter dan de zonden van Sodom, dat als in een ogenblik omgekeerd werd, zonder dat er handen naar haar uitgestoken werden.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "Mark 14:29-31": "En Petrus zei tegen Hem: Al zouden zij allen aanstoot nemen, ik zal het toch niet doen. En Jezus zei tegen hem: Voorwaar, Ik zeg u, dat u heden, in deze nacht, voordat de haan tweemaal gekraaid zal hebben, Mij driemaal zult verloochenen. Maar hij zei des te heftiger: Al moest ik met U sterven, ik zal U geenszins verloochenen! En evenzo zeiden zij ook allen.", "Matt 7:22": "Velen zullen op die dag tegen Mij zeggen: Heere, Heere! Hebben wij niet in Uw Naam geprofeteerd, en in Uw Naam demonen uitgeworpen, en in Uw Naam veel krachten gedaan?", "1 Tess 2:16": "en ons verhinderen tot de heidenen te spreken, opdat zij behouden worden; zodat zij altijd de maat van hun zonden vol maken. En de toorn is over hen gekomen tot het einde.", "Jes 28:18-22": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Jer 5:30": "Een verschrikkelijke en afschuwelijke zaak gebeurt er in het land.", "Jes 32:9-14": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor. Vele dagen over het jaar zult u beroerd zijn, u dochters, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen. Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "1 Kor 10:5-11": "Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "1 Tess 5:15": "Zie erop toe dat niemand kwaad met kwaad vergeldt bij wie dan ook; maar jaag altijd het goede na, zowel tegenover elkaar als tegenover allen.", "Joh 3:10": "Jezus antwoordde en zei tegen hem: Bent u een leraar van Israël, en weet u deze dingen niet?", "Ezech 22:14": "Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.", "Jes 5:26-28": "Want Hij zal een banier opwerpen voor de heidenvolken van ver, en Hij zal hen hierheen lokken met een fluitsignaal, van het einde van de aarde; en zie, haastig, snel zullen zij aankomen. Geen vermoeide, en geen struikelende zal onder hen zijn; niemand zal sluimeren noch slapen, noch zal de gordel om zijn heupen losraken, noch zal de schoenriem van zijn schoenen afscheuren. Hun pijlen zullen scherp zijn, en al hun bogen gespannen; de hoeven van hun paarden zullen als een rots geacht worden, en hun wielen als een wervelwind.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Ps 109:16-18": "Omdat hij niet gedacht heeft weldadigheid te doen, maar de ellendige en de behoeftige man heeft vervolgd, en de verslagene van hart, om hem te doden. Omdat hij de vloek heeft liefgehad, laat die hem overkomen, en heeft geen lust gehad tot de zegen, laat die dan ver van hem zijn. En laat hij bekleed zijn met de vloek, als met zijn kleed, en laat die gaan tot in zijn binnenste als het water, en als de olie in zijn beenderen.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Openb 2:15": "Zo hebt u ook mensen die de leer van de Nikolaieten vasthouden; wat Ik haat.", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "2 Kon 22:13": "Ga heen, vraag de HEERE voor mij, en voor het volk, en voor heel Juda, over de woorden van dit boek dat gevonden is; want de grimmigheid van de HEERE is groot, die tegen ons ontstoken is, omdat onze vaderen niet geluisterd hebben naar de woorden van dit boek, om te doen naar alles wat voor ons geschreven is.", "Hebr 8:9": "Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Mal 1:2-4": "Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad, en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn. Ofschoon Edom zei: Wij zijn arm geworden, maar wij zullen de verwoeste plaatsen weer opbouwen; zo zegt de HEERE van de heerscharen: Zullen zij bouwen, dan zal Ik afbreken; en men zal hen noemen: Gebied van de goddeloosheid, en een volk, op wie de HEERE toornig is tot in eeuwigheid.", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Jer 25:15-17": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend; Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden. En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had;", "Ezech 12:23": "Daarom, zeg tegen hen: Zo zegt de Heere HEERE: Ik zal dit spreekwoord doen ophouden, zodat zij het niet meer als spreekwoord zullen gebruiken in Israël. Maar spreek tot hen: De dagen zijn nabijgekomen, en het woord van elk visioen.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Obadja 1:15": "Want de dag van de HEERE is nabij, over alle heidenvolken; zoals u gedaan hebt, zal u gedaan worden; uw vergelding zal op uw eigen hoofd terugkeren.", "1 Kor 3:21": "Niemand roemt dan op mensen; want alles is van u.", "Klaagl 5:12": "De vorsten zijn door hun hand opgehangen; de gezichten van de oudsten zijn niet geëerd geweest.", "Deut 32:33": "Hun wijn is vurig drakenvenijn, en een wreed adderenvergif.", "Matt 18:34": "En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.", "Jer 12:10": "Veel herders hebben Mijn wijngaard verdorven, zij hebben Mijn akker vertrapt; zij hebben Mijn gewenste akker gesteld tot een woeste wildernis.", "Ps 55:4": "Om het geroep van de vijand, vanwege de beangstiging van de goddeloze; want zij schuiven ongerechtigheid op mij, en in toorn haten zij mij.", "Matt 18:7-9": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Joz 7:1": "Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Jer 19:3-11": "En zeg: Hoort het woord van de HEERE, koningen van Juda en inwoners van Jeruzalem! Zo zegt de HEERE van de heerscharen, de God van Israël: Ziet, Ik zal een kwaad brengen over deze plaats, waarvan een ieder die het hoort, zijn oren zullen klinken; Omdat zij Mij verlaten, en deze plaats vervreemd hebben, en andere goden daarin gerookt hebben die zij niet gekend hebben, zij, noch hun vaders, noch de koningen van Juda; en hebben deze plaats vervuld met bloed van onschuldigen. Want zij hebben de hoogten van Baäl gebouwd, om hun zonen met vuur te verbranden, aan Baäl tot brandoffers; wat Ik niet geboden heb, noch gesproken heb, noch in Mijn hart is opgekomen.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Jer 10:21": "Want de herders zijn redeloos geworden, en hebben de HEERE niet gezocht; daarom hebben zij niet verstandig gehandeld, en hun hele kudde is verstrooid.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "Ps 78:50": "Hij baande een pad voor Zijn toorn; Hij onttrok hun ziel niet aan de dood; en hun gedierte gaf Hij over aan de pestilentie.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "Jer 6:2": "Ik heb wel de dochter Sions bij een schone en wellustige vrouw vergeleken;", "Klaagl 2:11-22": "Caph. Mijn ogen zijn verteerd door tranen, mijn ingewand wordt beroerd; mijn lever is ter aarde uitgeschud, vanwege de breuk van de dochter van mijn volk; omdat het kind en de zuigeling op de straten van de stad in onmacht zinken; Lamed. Als zij tegen hun moeders zeggen: Waar is koren en wijn, als zij op de straten van de stad in onmacht zinken, als de verslagenen; als hun ziel zich uitschudt in de schoot van hun moeders. Mem. Wat getuigen zal ik u brengen, wat zal ik bij u vergelijken, u dochter van Jeruzalem? Wat zal ik bij u vergelijken, dat ik u zou troosten, u jonkvrouw, dochter van Sion, want uw breuk is zo groot als de zee, wie kan u helen?", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Ezech 13:11": "Zeg tegen hen die met loze kalk pleisteren, dat hij omvallen zal; er zal een overstelpende plasregen zijn; en u, grote hagelstenen, zult vallen, en een grote stormwind zal hem splijten.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "Ps 74:7": "Zij hebben Uw heiligdommen in het vuur gezet; tot op de grond hebben zij de woning van Uw Naam ontheiligd.", "Jer 48:11": "Moab is van zijn jeugd af aan rustig geweest, en hij heeft op zijn droesem stilgelegen, en is van vat in vat niet overgegoten, en heeft niet in gevangenschap gewandeld; daarom is zijn smaak in hem gebleven, en zijn geur niet veranderd.", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Jer 27:19-22": "Want zo zegt de HEERE van de heerscharen, over de pilaren, en over de zee, en over de onderstellen, en over het overige van de voorwerpen die in deze stad zijn overgebleven, die Nebukadnezar, de koning van Babel, niet heeft weggenomen, toen hij Jechonia, de zoon van Jojakim, koning van Juda, van Jeruzalem naar Babel gevankelijk wegvoerde, alsook alle edelen van Juda en Jeruzalem; ja, zo zegt de HEERE van de heerscharen, de God van Israël, over de voorwerpen die in het huis van de HEERE, en in het huis van de koning van Juda, en in Jeruzalem zijn overgebleven:", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "2 Kon 25:10": "En het hele leger van de Chaldeeën, dat met de aanvoerder van de lijfwacht was, brak de muren van Jeruzalem rondom af.", "Jer 39:4": "En het gebeurde, toen Zedekia, de koning van Juda, en al de krijgslieden hen zagen, dat zij vluchtten, en 's nachts uit de stad trokken, via de weg van de tuin van de koning, door de poort tussen de twee muren; en hij trok uit via de weg van het vlakke veld.", "Joh 18:22": "En toen Hij dit zei, gaf een van de dienaars die daarbij stond Jezus een klap in het gezicht en zei: Antwoordt U zo de hogepriester?", "Jes 34:13": "En in hun paleizen zullen doornen opschieten, netels en distels in hun vestingen; en het zal een woonplaats van jakhalzen zijn, een plek voor de jongen van de struisvogels.", "Spr 10:12": "Haat verwekt ruzies; maar de liefde bedekt alle overtredingen.", "Matt 26:52": "Toen zei Jezus tegen hem: Steek uw zwaard terug op zijn plaats; want allen die het zwaard nemen, zullen door het zwaard omkomen.", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Jes 3:9": "Het gelaat van hun aangezicht getuigt tegen hen, en hun zonden spreken zij vrij uit, net als Sodom; zij verbergen ze niet. Wee hun ziel; want zij doen zichzelf kwaad.", "Ps 69:5": "Die mij zonder oorzaak haten, zijn meer dan de haren van mijn hoofd; die mij zoeken te vernielen, die mij om valse oorzaken vijand zijn, zijn machtig geworden; wat ik niet geroofd heb, moet ik dan teruggeven.", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Jer 3:23": "Waarlijk, tevergeefs verwacht men het van de heuvels en de menigte van bergen; waarlijk, in de HEERE, onze God, is het heil van Israël!", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Gen 19:4-13": "Eer zij zich te slapen legden, omsingelden de mannen van die stad, de mannen van Sodom, van de jongste tot de oudste toe, dat huis, het hele volk, van alle kanten. En zij riepen Lot toe, en zeiden tegen hem: Waar zijn die mannen die deze nacht bij u gekomen zijn? Breng hen naar buiten, naar ons toe, opdat wij met hen gemeenschap hebben. Toen ging Lot naar buiten naar hen toe, bij de deur, en hij sloot de deur achter zich toe;", "Amos 2:11": "En Ik heb sommigen uit uw zonen tot profeten verwekt, en uit uw jongelingen tot nazireeërs; is dit niet zo, kinderen van Israël? spreekt de HEERE.", "Jer 5:13": "Ja, die profeten zullen tot wind worden, want het woord is niet bij hen; hun zelf zal zo gebeuren.", "Ezech 32:29": "Daar is Edom, haar koningen en al haar vorsten, die met hun macht gelegd zijn bij de verslagenen van het zwaard; die liggen met de onbesnedenen en met hen die in het kuil zijn neergedaald.", "1 Sam 12:3": "Zie, hier ben ik, getuig tegen mij voor de HEERE, en voor Zijn gezalfde: van wie heb ik een os genomen, en van wie heb ik een ezel genomen, en wie heb ik onrecht aangedaan, wie heb ik onderdrukt, en uit wiens hand heb ik een geschenk genomen om daarmee mijn ogen dicht te doen? Dan zal ik het u teruggeven.", "Ps 59:7": "Tegen de avond keren zij terug, zij tieren als een hond, en gaan rond om de stad.", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Num 32:11": "Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd;", "Jes 49:15": "Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "Mal 2:8": "Maar u bent van de weg afgeweken, u hebt er velen doen struikelen in de wet, u hebt het verbond met Levi verdorven, zegt de HEERE van de heerscharen.", "Jer 2:18": "En nu, wat hebt u te doen met de weg van Egypte, om de wateren van Sihor te drinken? En wat hebt u te doen met de weg van Assur, om de wateren van de rivier te drinken?", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Hand 20:30": "En uit uzelf zullen mannen opstaan, die verkeerde dingen spreken, om de discipelen achter zich aan te trekken.", "Spr 18:11": "Het bezit van de rijke is de stad van zijn sterkte, en als een hoge muur in zijn eigen inbeelding.", "2 Kon 6:29": "Zo hebben wij mijn zoon gekookt, en hebben hem gegeten; maar toen ik de volgende dag tegen haar zei: Geef uw zoon, dat wij hem eten, toen heeft zij haar zoon verstopt.", "Mal 1:6-10": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam? U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk. Want als u iets blinds aanbrengt om te offeren, is dat bij u niet kwaad; en als u iets kreupels of iets kranks aanbrengt, is dat niet kwaad! Breng dat toch aan uw vorst; zal hij welgevallen aan u hebben? of zal hij u gunstig ontvangen? zegt de HEERE van de heerscharen.", "Ps 140:2-5": "Red mij, HEERE, van de kwade mens; behoed mij voor de man van geweld; Die veel kwaad in het hart bedenken, elke dag komen zij samen om te oorlogen. Zij scherpen hun tong als een slang; heet addervergif is onder hun lippen. Sela.", "Ps 102:12": "Mijn dagen zijn als een afgaande schaduw, en ik verdor als gras.", "2 Petr 2:12-17": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Num 32:23": "Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!", "Num 35:33": "Zo zult u het land niet ontheiligen waarin u woont; want het bloed ontheiligt het land; en voor het land kan geen verzoening gedaan worden voor het bloed dat daarin vergoten is, dan door het bloed van hem die het vergoten heeft.", "Jer 1:12": "En de HEERE zei tegen mij: U hebt goed gezien; want Ik zal wakker zijn over Mijn woord, om dat te doen.", "Ps 137:6": "Mijn tong kleeft aan mijn gehemelte, als ik aan u niet gedenk, als ik Jeruzalem niet verhef boven het hoogste van mijn blijdschap!", "Deut 27:18": "Vervloekt is hij die een blinde op de weg laat dwalen! En heel het volk zal zeggen: Amen.", "1 Kor 11:19": "want er moeten ook afwijkende meningen onder u zijn, opdat degenen die oprecht zijn, openbaar worden onder u.", "Hebr 8:2": "Een Bedienaar van het heiligdom, en van de ware tabernakel, die de Heere heeft opgericht, en geen mens.", "Neh 13:29": "Denk aan hen, mijn God, omdat zij het priesterdom hebben verontreinigd, ja, het verbond van het priesterdom en van de Levieten.", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Jes 3:16-26": "Verder zegt de HEERE: Omdat de dochters van Sion zich verheffen, en gaan met uitgestrekte hals, en lonken met de ogen, al gaande en trippelende daarheen treden, en alsof haar voeten gebonden waren. Zo zal de Heere de schedel van de dochters van Sion schurftig maken, en de HEERE zal haar schaamte ontbloten. Op diezelfde dag zal de Heere wegnemen het sieraad van de kousebanden, en de netjes, en de maantjes,", "Ezech 25:6": "Want zo zegt de Heere HEERE: Omdat u met de hand geklapt, en met de voet gestampt hebt, en van harte verheugd bent geweest over al uw plundering, over het land van Israël;", "Job 33:21": "Dat zijn vlees verdwijnt uit het gezicht, en zijn beenderen, die niet gezien werden, uitsteken;", "Num 18:5": "U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "Matt 15:14": "Laat hen gaan; zij zijn blinde leiders van blinden. Als nu de blinde de blinde leidt, zullen zij beiden in de gracht vallen.", "Ps 109:6-19": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "1 Kon 11:9": "Daarom vertoornde de HEERE Zich tegen Salomo, omdat hij zijn hart van de HEERE, de God van Israël, had afgewend, Die hem tweemaal verschenen was,", "Jer 48:7": "Want om uw vertrouwen op uw werken, en op uw schatten, zult u ook ingenomen worden; en Kamos zal weggaan in gevangenschap, zijn priesters en zijn vorsten samen.", "Ps 57:7": "Zij hebben een net klaargezet voor mijn voeten, mijn ziel was neergebukt; zij hebben een kuil voor mij gegraven; zij zijn er zelf middenin gevallen. Sela.", "Obadja 1:10-16": "Om het geweld, gepleegd tegen uw broeder Jakob, zal schaamte u bedekken; en u zult voor eeuwig worden uitgeroeid. Op de dag dat u tegenover hem stond, op de dag dat vreemden zijn leger gevangen wegvoerden, en buitenlanders zijn poorten binnentrokken, en over Jeruzalem het lot wierpen, was u ook als een van hen. U had niet moeten kijken naar de dag van uw broeder, de dag van zijn vervreemding; en u had zich niet moeten verblijden over de kinderen van Juda, op de dag van hun ondergang; en u had uw mond niet groot moeten maken, op de dag van de benauwdheid;", "Hand 1:25": "om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "Hand 1:18": "Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "Deut 6:14": "U zult andere goden niet navolgen, van de goden van de volken, die rondom u zijn.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Spr 10:27-31": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Ps 10:7-10": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht. Hij zit in de hinderlaag bij de hoeven, in verborgen plaatsen doodt hij de onschuldige; zijn ogen verbergen zich tegen de arme. Hij legt lagen in een verborgen plaats, zoals een leeuw in zijn hol; hij legt lagen om de ellendige te roven; hij rooft de ellendige als hij hem trekt in zijn net.", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Jer 5:17": "En het zal uw oogst en uw brood opeten, dat uw zonen en uw dochters zouden eten; het zal uw schapen en uw runderen opeten; het zal uw wijnstok en uw vijgenboom opeten; uw vaste steden, waarop u vertrouwt, zal het arm maken door het zwaard.", "Openb 18:7-9": "Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien. Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt. En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien;", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Joh 10:1": "Voorwaar, voorwaar zeg Ik u: die niet door de deur ingaat in de schaapskooi, maar van elders inklimt, die is een dief en rover.", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "Micha 1:11": "Ga door, u inwoonster van Safir! Met blote schaamte; de inwoonster van Zaanan gaat niet uit; rouwklaagt is te Beth-haezel; hij zal zijn stand van u nemen.", "Luk 22:24": "En er ontstond ook twist onder hen, wie van hen scheen de meeste te zijn.", "Spr 6:14-16": "in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie. Daarom zal zijn ondergang snel komen; plotseling zal hij verbroken worden, zonder dat er genezing is. Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel:", "Ps 109:2-5": "Want de mond van de goddeloze en de mond van het bedrog zijn tegen mij opengedaan; zij hebben tegen mij gesproken met een valse tong. En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak. Voor mijn liefde staan zij mij tegen; maar ik was steeds in het gebed.", "Ps 103:8": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid.", "Ps 89:32": "als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;", "Ps 107:17": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "Rom 9:21-23": "Of heeft de pottenbakker geen macht over het leem, om uit dezelfde klomp het ene vat tot eer te maken, en het andere tot oneer? En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf; en opdat Hij de rijkdom van Zijn heerlijkheid bekend zou maken over de vaten van de barmhartigheid, die Hij van tevoren klaargemaakt heeft tot heerlijkheid?", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "1 Sam 16:12": "Toen stuurde hij iemand, en liet hem komen; hij nu was roodachtig, en had daarbij mooie ogen en een knap voorkomen; en de HEERE zei: Sta op, zalf hem, want deze is het.", "Amos 6:13": "U, die blij bent over een nietig ding; u, die zegt: Hebben wij niet door onze eigen kracht hoorns voor onszelf verkregen?", "Luk 6:29": "Wie u op de ene wang slaat, biedt hem ook de andere aan; en wie u de mantel afneemt, weerhoud hem niet ook uw hemd te nemen.", "1 Kron 22:19": "Zo richt dan nu uw hart en uw ziel erop om de HEERE, uw God, te zoeken, en maak u op, en bouw het heiligdom van God, de HEERE; opdat men de ark van het verbond van de HEERE en de heilige voorwerpen van God in dit huis brengt, dat gebouwd zal worden voor de Naam van de HEERE.", "Luk 23:29": "Want zie, er komen dagen waarin men zal zeggen: Zalig zijn de onvruchtbaren, en de buiken die niet gebaard hebben, en de borsten die niet gezoogd hebben.", "2 Tess 1:5-9": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Spr 11:5-8": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid. De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid. Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Ps 102:9": "Mijn vijanden smaden mij de hele dag; die tegen mij razen, zweren bij mij.", "Zef 3:3": "Haar vorsten zijn brullende leeuwen in haar midden; haar rechters zijn avondwolven, die de beenderen niet breken tot aan de morgen.", "Joz 23:16": "Wanneer u het verbond van de HEERE, uw God, overtreedt, dat Hij u geboden heeft, en u heengaat en dient andere goden, en u voor hen neerbuigt, zo zal de toorn van de HEERE over u ontsteken, en u zult haastig omkomen van het goede land, dat Hij u gegeven heeft.", "Richt 2:12": "En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "Amos 6:1-7": "Wee de geruste mensen in Sion, en degenen die zeker zijn op de berg van Samaria! Zij zijn de voornaamste van de eerstelingen der volken, en tot hen komen die van het huis van Israël. Ga over naar Kalne, en zie toe; en ga vandaar naar Hamath, de grote stad, en trek af naar Gath van de Filistijnen; zijn zij beter dan deze koninkrijken, of is hun gebied groter dan uw gebied? U, die de kwade dag ver weg zet, en de zetel van het geweld dichtbij brengt.", "Deut 28:64": "En de HEERE zal u verstrooien onder alle volken, van het ene einde van de aarde tot het andere einde van de aarde; en daar zult u andere goden dienen die u niet gekend hebt, noch uw vaderen, hout en steen.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Deut 27:17": "Vervloekt is hij die het gebied van zijn naaste verlegt! En heel het volk zal zeggen: Amen.", "Micha 6:13": "zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.", "Gen 19:1-29": "En die twee engelen kwamen 's avonds in Sodom aan; en Lot zat in de poort van Sodom; en toen Lot hen zag, stond hij op om hun tegemoet te gaan, en boog zich met het gezicht ter aarde. En hij zei: Zie toch, mijn heren! Keert u toch af naar het huis van uw knecht, en overnacht daar, en wast uw voeten; dan kunt u vroeg opstaan en verder gaan op uw weg. En zij zeiden: Nee, maar wij zullen op straat overnachten. En hij hield sterk bij hen aan, zodat zij bij hem introkken, en in zijn huis kwamen; en hij maakte hun een maaltijd, en bakte ongezuurde koeken, en zij aten.", "Matt 23:33-37": "Slangen, addergebroed! Hoe zou u de helse verdoemenis ontvluchten? Daarom, zie, Ik zend tot u profeten, en wijzen, en schriftgeleerden, en van hen zult u sommigen doden en kruisigen, en sommigen van hen zult u geselen in uw synagogen, en vervolgen van stad tot stad; opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar.", "Job 15:20-24": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Spr 30:14": "Een geslacht wiens tanden zwaarden zijn, en wiens baktanden messen zijn, om de ellendigen van de aarde en de behoeftigen onder de mensen te verslinden.", "Spr 13:21": "Het kwaad zal de zondaars vervolgen; maar de rechtvaardige zal men met goed vergelden.", "Ps 69:27": "Want zij vervolgen hem die U geslagen hebt; en maken een praat van de smart van Uw verwonden.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Matt 25:5": "Toen de bruidegom uitbleef, werden zij allemaal slaperig, en vielen in slaap.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Matt 21:44": "En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.", "Jer 24:8-10": "En zoals de slechte vijgen, die vanwege de slechtheid niet gegeten kunnen worden (want zo zegt de HEERE), zo zal Ik Zedekia, de koning van Juda, maken, alsook zijn vorsten, en het overblijfsel van Jeruzalem, die in dit land zijn overgebleven, en die in het land Egypte wonen; En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben; En Ik zal onder hen zenden het zwaard, de honger en de pest, totdat zij verteerd zullen zijn uit het land, dat Ik hun en hun vaderen gegeven had.", "Jer 23:25-39": "Ik heb gehoord wat de profeten zeggen, die in Mijn Naam leugen profeteren, en zeggen: Ik heb gedroomd, ik heb gedroomd. Hoe lang? Is er dan een droom in het hart van de profeten, die de leugen profeteren? Ja, het zijn profeten van de bedriegerij van hun eigen hart. Die daar denken om Mijn volk Mijn Naam te doen vergeten, door hun dromen, die zij, ieder aan zijn naaste, vertellen; net zoals hun vaders Mijn Naam vergeten hebben door Baäl.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Jer 2:13": "Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Ezech 5:8-17": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Hebr 3:11": "Zo heb Ik dan gezworen in Mijn toorn: Zij zullen Mijn rust niet binnengaan!", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Jer 23:14": "Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra.", "Hos 6:9": "Zoals de benden van straatrovers op iemand wachten, zo is het gezelschap van de priesters; zij moorden op de weg naar Sichem, waarlijk, zij doen schandelijke daden.", "Ezech 24:14": "Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.", "Klaagl 2:8": "Cheth. De HEERE heeft gedacht te verderven de muur van de dochter van Sion; Hij heeft het richtsnoer daarover getrokken, Hij heeft Zijn hand niet afgewend, dat Hij ze niet zou verslinden; en Hij heeft de voormuur en de muur samen treurig gemaakt, zij zijn verzwakt.", "Ps 76:8": "U, vreselijk bent U; en wie zal voor Uw aangezicht bestaan, vanaf het moment van uw toorn?", "2 Tim 4:3": "Want er zal een tijd komen dat zij de gezonde leer niet zullen verdragen, maar doordat hun oren jeuken, zullen zij zich naar hun eigen begeerten leraars in menigte bijeenzoeken;", "Spr 11:19": "Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.", "Jer 49:5": "Zie, Ik zal vrees over u brengen, spreekt de Heere, de HEERE van de heerscharen, van allen die rondom u zijn, en u zult, ieder voor zich heen, weggedreven worden, en niemand zal hen die omzwerven bijeenbrengen.", "2 Kor 11:1-31": "Och, of u mij een weinig verdroeg in de onwijsheid; ja, verdraag mij ook! Want ik ben ijverig over u met een ijver van God; want ik heb u toebereid om u als een reine maagd aan één man voor te stellen, namelijk aan Christus. Doch ik vrees dat, zoals de slang Eva door haar arglistigheid bedrogen heeft, zo ook uw gedachten op enigerlei wijze bedorven worden, om af te wijken van de eenvoudigheid die in Christus is.", "Spr 12:10": "De rechtvaardige kent het leven van zijn dier; maar de barmhartigheden van de goddelozen zijn wreed.", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "Ps 32:4": "Want Uw hand was dag en nacht zwaar op mij; mijn sap veranderde in zomerdroogte. Sela.", "Matt 11:23": "En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.", "Spr 21:12": "De rechtvaardige let verstandig op het huis van de goddeloze, als God de goddelozen in het kwaad stort.", "Spr 28:26": "Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.", "Ezech 12:22": "Mensenkind, wat is dit voor een spreekwoord dat u hebt in het land Israël, namelijk: de dagen worden verlengd, en elk visioen vervalt?", "Ezech 16:48": "Zo waar Ik leef, spreekt de Heere HEERE, Sodom, uw zuster, heeft niet gedaan, zij en haar dochters niet, zoals u gedaan hebt, u en uw dochters!", "2 Sam 3:39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.", "Spr 11:17": "Een goedertieren mens doet zijn eigen ziel goed; maar wie wreed is, brengt zijn eigen vlees in beroering.", "Ps 41:6-9": "Mijn vijanden spreken kwaad van mij, en zeggen: Wanneer zal hij sterven, en zijn naam vergaan? En als iemand van hen komt om mij te zien, spreekt hij valsheid; zijn hart verzamelt onrecht; gaat hij naar buiten, dan spreekt hij ervan. Al mijn haters mompelen samen tegen mij; ze bedenken tegen mij wat mij kwaad doet, en zeggen:", "Hos 8:1": "De bazuin aan uw mond; hij komt als een arend tegen het huis van de Heere; omdat zij Mijn verbond hebben overtreden, en tegen Mijn wet in opstand zijn gekomen.", "Ps 55:20": "God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.", "Ps 143:3": "Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Ps 49:7": "Aangaande hen die op hun bezit vertrouwen, en op de overvloed van hun rijkdom roemen;", "1 Sam 26:16": "Deze zaak die u gedaan hebt, is niet goed; zo waarachtig als de HEERE leeft, u bent kinderen van de dood, omdat u geen wacht gehouden hebt over uw heer, de gezalfde van de HEERE! En nu, kijk waar de speer van de koning is, en de waterfles die bij zijn hoofdeinde was.", "2 Sam 22:8": "Toen daverde en beefde de aarde; de fundamenten van de hemel beroerden zich, en daverden, omdat Hij in toorn ontstoken was.", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "Hos 9:15": "Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "Jes 10:3": "Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "Jer 14:16": "En het volk, tot wie zij profeteren, zal op de straten van Jeruzalem weggeworpen zijn vanwege de honger en het zwaard; en er zal niemand zijn die hen kan begraven, hen, hun vrouwen, en hun zonen, en hun dochters; zo zal Ik hun slechtheid over hen uitstorten.", "Jer 6:14": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Doch daar is geen vrede.", "Ps 69:11-13": "En ik heb geweend in het vasten van mijn ziel; maar het is mij tot allerlei smaad geworden. En ik heb een zak tot mijn kleed aangedaan; maar ik ben hun tot een spreekwoord geworden. Die in de poort zitten, praten over mij; en ik ben een lied voor hen die sterke drank drinken.", "Openb 2:12": "En schrijf aan de engel van de gemeente die in Pergamus is: Dit zegt Hij, Die het tweesnijdend scherpe zwaard heeft:", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Jer 17:5": "Zo zegt de HEERE: Vervloekt is de man die op een mens vertrouwt, en vlees tot zijn arm stelt, en wiens hart van de HEERE afwijkt!", "Ps 75:9": "Want in de hand van de HEERE is een beker, en de wijn is beroerd, vol van mengeling, en Hij schenkt daaruit; doch alle goddelozen van de aarde zullen zijn droesems drinken, terwijl ze die uitzuigen.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Zach 13:2-5": "En het zal op die dag gebeuren, spreekt de HEERE van de heerscharen, dat Ik de namen van de afgoden uit het land zal uitroeien, zodat er niet meer aan gedacht wordt; en ook de profeten en de onreine geest zal Ik uit het land wegdoen. En het zal gebeuren, wanneer iemand nog profeteert, dat zijn vader en zijn moeder, die hem verwekt hebben, tegen hem zullen zeggen: U zult niet leven, omdat u leugens gesproken hebt in de Naam van de HEERE; en zijn vader en zijn moeder, die hem verwekt hebben, zullen hem doorsteken, wanneer hij profeteert. En het zal op die dag gebeuren, dat die profeten beschaamd zullen worden, ieder vanwege zijn visioen, wanneer hij profeteert; en zij zullen geen haren mantel aandoen om te liegen.", "Jer 32:40": "En Ik zal een eeuwig verbond met hen sluiten, dat Ik Mij van achter hen niet zal afkeren, opdat Ik hun goeddoe; en Ik zal Mijn vrees in hun hart geven, zodat zij niet van Mij afwijken.", "Ezech 14:10": "En zij zullen hun ongerechtigheid dragen; zoals de ongerechtigheid van de vrager zal zijn, zo zal de ongerechtigheid van de profeet zijn;", "2 Kon 6:25": "En er kwam grote honger in Samaria; want zie, zij belegerden de stad, totdat een ezelskop voor tachtig zilverstukken werd verkocht, en een vierde deel van een kab duivenmest voor vijf zilverstukken.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "2 Kon 24:13": "En hij bracht van daar al de schatten van het huis van de HEERE, en de schatten van het huis van de koning; en hij hakte alle gouden vaten stuk die Salomo, de koning van Israël, in de tempel van de HEERE gemaakt had, zoals de HEERE gesproken had.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Jes 57:17": "Ik was toornig over de ongerechtigheid van zijn hebzucht, en sloeg hem; Ik verborg Mij, en was toornig; toch ging hij afkerig zijn eigen weg, de weg van zijn hart.", "Ps 38:17": "Want ik zei: Laat hen zich toch over mij niet verblijden! Wanneer mijn voet zou wankelen, zouden zij zich tegen mij groot maken.", "Jer 9:26": "Over Egypte, en over Juda, en over Edom, en over de kinderen van Ammon, en over Moab, en over allen die aan de hoeken kortgeknipt zijn, die in de woestijn wonen; want alle heidenen hebben de voorhuid, maar het hele huis van Israël heeft de voorhuid van het hart.", "Ps 28:5": "Omdat zij niet letten op de daden van de HEERE, en ook niet op het werk van Zijn handen, zal Hij hen afbreken en niet meer opbouwen.", "Ex 32:10": "En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken.", "Deut 11:26": "Zie, ik stel u heden voor: zegen en vloek:", "Joh 5:43": "Ik ben gekomen in de Naam van Mijn Vader, en u neemt Mij niet aan; als een ander komt in zijn eigen naam, die zult u aannemen.", "1 Sam 26:9": "David zei daarentegen tegen Abisai: Breng hem niet om; want wie heeft ooit zijn hand tegen de gezalfde van de HEERE opgeheven en is onschuldig gebleven?", "Jer 52:13": "Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur.", "Jes 33:12": "En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.", "Jer 22:28": "Is dan deze man Chonia een veracht, verbrijzeld afgodsbeeld? Of is hij een vat waaraan men geen lust heeft? Waarom zijn hij en zijn nageslacht weggeworpen, ja, weggeworpen in een land dat zij niet kennen?", "Ps 9:6": "Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.", "Openb 19:17-21": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Luk 22:33": "En hij zei tegen Hem: Heere, ik ben bereid, met U ook in de gevangenis en in de dood te gaan.", "Jer 44:23": "Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "1 Joh 2:11": "Maar wie zijn broeder haat, is in de duisternis, en wandelt in de duisternis, en weet niet, waar hij heengaat; want de duisternis heeft zijn ogen verblind.", "Ezech 44:27": "En op de dag dat hij in het heilige naar binnen gaat, in het binnenste voorhof, om in het heilige te dienen, zal hij zijn zondoffer offeren, spreekt de Heere HEERE.", "Joh 7:34": "U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Matt 24:2": "En Jezus zei tegen hen: Ziet u niet al deze dingen? Voorwaar, Ik zeg u: hier zal geen steen op de andere steen gelaten worden, die niet zal worden afgebroken.", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "Matt 11:24": "Maar Ik zeg u, dat het het land van Sodom draaglijker zal zijn op de dag van het oordeel, dan u.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Ps 59:5": "Zij lopen en maken zich klaar zonder dat ik iets misdaan heb; word wakker mij tegemoet, en zie.", "Ps 104:35": "De zondaars zullen van de aarde weggevaagd worden, en de goddelozen zullen niet meer zijn. Loof de HEERE, mijn ziel! Hallelujah!", "Zef 2:9": "Daarom, zo waarachtig als Ik leef, spreekt de HEERE van de heerscharen, de God van Israël: Moab zal zeker zijn als Sodom, en de kinderen van Ammon als Gomorra, een netelveld, en een zoutgroeve, en een verwoesting tot in eeuwigheid! De overigen van Mijn volk zullen hen beroven, en het overige van Mijn volk zal hen erfelijk bezitten.", "Jes 9:17": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook.", "Ps 144:12": "opdat onze zonen zijn als planten, die groot geworden zijn in hun jeugd; onze dochters als hoekstenen, uitgehouwen naar het voorbeeld van een paleis.", "Jer 3:12": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden.", "Ps 71:10": "Want mijn vijanden spreken van mij, en zij die op mijn ziel loeren, beraadslagen samen,", "Jer 2:34": "Ja, het bloed van de zielen van de onschuldige behoeftigen is in uw zomen gevonden; Ik heb dat niet door opgraven gevonden, maar aan dat alles.", "Ps 35:16": "Onder spotachtige tafelbroeders die huichelden, knerste men over mij met de tanden.", "Jes 26:21": "Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden.", "Matt 26:24": "De Zoon des mensen gaat wel heen, zoals over Hem geschreven is; maar wee die mens door wie de Zoon des mensen verraden wordt; het zou beter voor hem geweest zijn als die mens niet geboren was.", "Kol 2:8": "Kijk uit dat niemand u als een roof meesleept door de filosofie en loze verleiding, naar de overlevering van de mensen, naar de eerste beginselen van de wereld, en niet naar Christus;", "Joh 8:21": "Jezus zei dan weer tegen hen: Ik ga heen, en u zult Mij zoeken, en in uw zonden zult u sterven; waar Ik heenga, kunt u niet komen.", "Ps 20:9": "Zij hebben zich gekromd, en zijn gevallen; maar wij zijn opgestaan en staande gebleven.", "2 Tim 2:14-18": "Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders. Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt. Maar verzet u tegen het ongoddelijk ijdel geklets; want zij zullen in meerdere goddeloosheid toenemen.", "Num 7:9": "Maar aan de zonen van Kohath gaf hij niets; want de dienst van de heilige dingen die op hen rustte, moesten zij op de schouders dragen.", "Ps 106:18": "En een vuur brandde onder hun groep, een vlam stak de goddelozen in brand.", "Klaagl 2:9": "Teth. Haar poorten zijn in de aarde verzonken; Hij heeft haar grendels verdorven en gebroken; haar koning en haar vorsten zijn onder de heidenen; er is geen wet; haar profeten vinden ook geen gezicht van de HEERE.", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Jer 49:4": "Wat beroemt u zich op uw dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?", "Luk 12:5": "Maar Ik zal u tonen voor wie u bang moet zijn: wees bang voor Hem, Die, nadat Hij gedood heeft, ook macht heeft om in de hel te werpen; ja, Ik zeg u, wees bang voor Hem!", "2 Kron 20:8": "Zij nu hebben daarin gewoond, en zij hebben U daarin een heiligdom gebouwd voor Uw Naam, en zeiden:", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Ps 11:6": "Hij zal op de goddelozen strikken doen regenen, vuur en zwavel; en een geweldige stormwind zal het deel van hun beker zijn.", "Jes 1:9": "Als de HEERE van de heerscharen ons niet nog een klein overblijfsel had gelaten, zouden wij als Sodom geworden zijn; wij zouden Gomorra gelijk zijn geworden.", "Ezech 13:1-23": "En het woord van de HEERE gebeurde tot mij, en zei: Mensenkind, profeteer tegen de profeten van Israël, die profeteren, en zeg tegen hen die uit hun eigen hart profeteren: Hoor het woord van de HEERE. Zo zegt de Heere HEERE: Wee over die dwaze profeten, die hun eigen geest nawandelen, en wat zij niet gezien hebben!", "1 Joh 4:1-3": "Geliefden, geloof niet elke geest, maar beproef de geesten, of zij uit God zijn; want veel valse profeten zijn uitgegaan in de wereld. Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God; en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.", "Jes 64:11": "Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Job 30:30": "Mijn huid is zwart geworden over mij, en mijn gebeente is ontstoken van dorheid.", "Matt 23:33": "Slangen, addergebroed! Hoe zou u de helse verdoemenis ontvluchten?", "Openb 18:5": "Want haar zonden zijn de een na de ander gevolgd tot aan de hemel toe, en God is haar ongerechtigheden gaan gedenken.", "Micha 3:12": "Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud.", "Ps 5:6": "De onzinnigen zullen voor Uw ogen niet bestaan; U haat alle werkers van de ongerechtigheid.", "Job 31:29": "Als ik verblijd ben geweest in de verdrukking van mijn haters, en mij opgewekt heb, als het kwaad hem vond;", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Jer 23:21": "Ik heb die profeten niet gezonden, toch hebben zij gelopen; Ik heb tot hen niet gesproken, toch hebben zij geprofeteerd.", "Hand 23:12-14": "En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben. En het waren er meer dan veertig die deze eed samen hadden afgelegd. Zij gingen naar de overpriesters en de oudsten en zeiden: Wij hebben onszelf met een vervloeking vervloekt om niets te nuttigen totdat wij Paulus gedood zullen hebben.", "Job 9:26": "Zij zijn voorbijgevaren met jachtschepen; zoals een arend naar het aas toevliegt.", "Jes 34:5-8": "Want Mijn zwaard is dronken geworden in de hemel; zie, het zal ten oordeel neerdalen op Edom, en op het volk dat Ik met de ban geslagen heb. Het zwaard van de HEERE is vol bloed, het is vet geworden van vet, van het bloed van de lammeren en de bokken, van het vet van de nieren van de rammen; want de HEERE heeft een offer in Bozra, en een grote slachting in het land van de Edomieten. En de eenhoorns zullen met hen neerdalen, en de jonge stieren met de stieren; en hun land zal doordrenkt worden van het bloed, en hun stof zal van het vet vet gemaakt worden.", "Ps 89:22": "met wie Mijn hand vast blijven zal; ook zal hem Mijn arm versterken.", "Rom 16:18": "Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.", "Jes 56:12": "Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Gen 6:13": "Daarom zei God tegen Noach: Het einde van alle vlees is voor Mijn aangezicht gekomen; want de aarde is door hen vervuld met geweld; en zie, Ik zal hen met de aarde verderven.", "Ps 91:8": "Alleen zult u het met uw ogen aanschouwen; en u zult de vergelding van de goddelozen zien.", "Rom 2:19-25": "En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn, Een onderrichter van de onwijzen, en een leermeester van de onwetenden, terwijl u de vorm van de kennis en van de waarheid in de wet hebt. Die dan een ander leert, leert u uzelf niet? Die predikt dat men niet zal stelen, steelt u?", "Joh 5:14": "Daarna vond Jezus hem in de tempel, en zei tegen hem: Zie, u bent gezond geworden; zondig niet meer, opdat u niet iets ergers overkomt.", "Lev 26:16-39": "Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten. Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand. En als u Mij ook na deze dingen niet zult horen, zal Ik nog daaraan toedoen, om u zevenvoudig over uw zonden te tuchtigen.", "2 Kron 28:19": "Want de HEERE vernederde Juda, om Achaz, de koning van Israël; want hij had Juda losgelaten van de HEERE, zodat het geheel zwaar overtrad tegen de HEERE.", "Ezech 44:10": "Maar de Levieten die ver van Mij weggegaan zijn, toen Israël ging dolen, die van Mij zijn afgedwaald, hun drekgoden  achterna, zullen wel hun ongerechtigheid dragen;", "Jer 19:9": "En Ik zal hun het vlees van hun zonen en het vlees van hun dochters doen eten, en zij zullen eten, ieder het vlees van zijn naaste, in de belegering en in de benauwing, waarmee hun vijanden, en zij die hun ziel zoeken, hen benauwen zullen.", "Ps 119:119": "U doet alle goddelozen van de aarde weg als schuim, daarom heb ik Uw getuigenissen lief.", "Micha 2:11": "Als er iemand is die met wind omgaat en vals liegt, en zegt: Ik zal u profeteren van wijn en van sterke drank! dan is dat een profeet voor dit volk.", "Lev 21:12": "En uit het heiligdom zal hij niet weggaan, opdat hij het heiligdom van zijn God niet ontheiligt, want de kroon van de zalfolie van zijn God is op hem; Ik ben de HEERE!", "Jes 8:19": "Wanneer zij dan tegen u zeggen zullen: Vraag waarzeggers en duivelskunstenaars, die daar piepen en binnensmonds mompelen; zo zeg: Zal een volk niet zijn God vragen? Zal men voor de levenden de doden vragen?", "Matt 24:26": "Als zij dan tegen u zullen zeggen: Kijk, hij is in de woestijn, ga er niet heen; Kijk, hij is in de binnenkamers, geloof het niet.", "Jes 56:10-12": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme hond
