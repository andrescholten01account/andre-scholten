beenderen, zij is verdord, zij is geworden als hout.","9":"Teth. De gevallenen door het zwaard hebben het beter dan de gevallenen door de honger; want die kwijnen weg, *als* doorstoken, omdat er geen vruchten van de velden zijn.","10":"Jod. De handen van barmhartige vrouwen hebben hun eigen kinderen gekookt; zij zijn hun tot voedsel geworden bij de ondergang van de dochter van mijn volk.","11":"Caph. De HEERE heeft Zijn grimmigheid volbracht, Hij heeft de gloed van Zijn toorn uitgestort; en Hij heeft in Sion een vuur aangestoken, dat haar fundamenten verteerd heeft.","12":"Lamed. De koningen van de aarde zouden het niet geloofd hebben, en ook geen van de bewoners van de wereld, dat de tegenstander en vijand door de poorten van Jeruzalem zou binnengaan.","13":"Mem. Het is vanwege de zonden van haar profeten, *en* de misdaden van haar priesters, die in haar midden het bloed van de rechtvaardigen vergoten hebben.","14":"Nun. Zij zwierven *als* blinden op de straten, zij waren met bloed besmet, zodat men niet kon zien *of* men hun kleren aanraakte.","15":"Samech. Zij riepen tot hen: Ga weg, *hier* *is* een onreine, ga weg, ga weg, raak niet aan! Zeker, zij zijn weggevlucht, ja, weggezworven; zij zeiden onder de heidenen: Zij zullen er niet langer wonen.","16":"Pe. Het aangezicht van de HEERE heeft hen verstrooid. Hij zal hen voortaan niet meer aanzien; zij hebben het aangezicht van de priesters niet geëerd, zij hebben de ouden geen genade bewezen.","17":"Ain. Nog steeds bezweken onze ogen, *terwijl ze uitkeken* naar onze nutteloze hulp; wij tuurden met gespannen aandacht naar een volk *dat* niet kon verlossen.","18":"Tsade. Zij hebben onze gangen nagespeurd, zodat wij op onze straten niet gaan konden; ons einde is genaderd, onze dagen zijn vervuld, ja, ons einde is gekomen.","19":"Koph. Onze vervolgers waren sneller dan de arenden van de hemel; zij hebben ons op de bergen fel vervolgd, in de woestijn hebben zij ons een hinderlaag gelegd.","20":"Resch. De adem van onze neus, de gezalfde van de HEERE, is gevangen in hun kuilen; *van* wie wij zeiden: Wij zullen onder zijn schaduw leven onder de heidenen!","21":"Schin. Wees vrolijk, en verblijd u, dochter van Edom, die in het land Uz woont! *toch* zal de beker ook naar u toe komen, u zult dronken worden, en zich ontbloten.","22":"Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; *maar* uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen."},"SV":{"1":"Aleph. Hoe is het goud *zo* verdonkerd, het goede fijne goud *zo* veranderd! *Hoe* zijn de stenen des heiligdoms vooraan op alle straten verworpen!","2":"Beth. De kostelijke kinderen Sions, tegen fijn goud geschat, hoe zijn zij *nu* gelijk gerekend aan de aarden flessen, het werk van de handen eens pottenbakkers!","3":"Gimel. Zelfs laten de zeekalveren de borsten neder, zij zogen hun welpen; *maar* de dochter mijns volks is als een wrede geworden, gelijk de struisen in de woestijn.","4":"Daleth. De tong van het zoogkind kleeft aan zijn gehemelte van dorst; de kinderkens eisen brood, er is niemand, die *het* hun mededeelt.","5":"He. Die lekkernijen aten, versmachten *nu* op de straten; die in karmozijn opgetrokken zijn, omhelzen den drek.","6":"Vau. En de ongerechtigheid der dochter mijns volks is groter dan de zonden van Sodom, dat als in een ogenblik omgekeerd werd, en geen handen hadden arbeid over haar.","7":"Zain. Haar bijzondersten waren reiner dan de sneeuw, zij waren witter dan melk; zij waren roder van lichaam dan robijnen, gladder dan een saffier.","8":"Cheth. *Maar* *nu* is hun gedaante verduisterd van zwartigheid, men kent hen niet op de straten; hun huid kleeft aan hun beenderen, zij is verdord, zij is geworden als een hout.","9":"Teth. De verslagenen van het zwaard zijn gelukkiger dan de verslagenen van den honger; want die vlieten daarhenen, *als* doorstoken zijnde, omdat er geen vruchten der velden zijn.","10":"Jod. De handen der barmhartige vrouwen hebben haar kinderen gekookt; zij zijn haar tot spijze geworden in de verbreking der dochter mijns volks.","11":"Caph. De HEERE heeft Zijn grimmigheid volbracht, Hij heeft de hittigheid Zijns toorns uitgestort; en Hij heeft te Sion een vuur aangestoken, hetwelk haar fondamenten verteerd heeft.","12":"Lamed. De koningen der aarde zouden het niet geloofd hebben, noch al de inwoners der wereld, dat de tegenpartijder en vijand tot de poorten van Jeruzalem zou ingaan.","13":"Mem. Het is vanwege de zonden harer profeten, *en* de misdaden harer priesteren, die in het midden van haar het bloed der rechtvaardigen vergoten hebben.","14":"Nun. Zij zwierven *als* blinden op de straten, zij waren met bloed besmet, zodat men niet kon zien, *of* men raakte hun klederen aan.","15":"Samech. Zij riepen tot hen: Wijkt, *hier* *is* een onreine, wijkt, wijkt, roert niet aan! Zekerlijk, zij zijn weggevlogen, ja, weggezworven; zij zeiden onder de heidenen: Zij zullen er niet langer wonen.","16":"Pe. Des HEEREN aangezicht heeft ze verdeeld. Hij zal ze voortaan niet meer aanzien; zij hebben het aangezicht der priesteren niet geëerd, zij hebben den ouden geen genade bewezen.","17":"Ain. Nog bezweken ons onze ogen, *ziende* naar onze ijdele hulp; wij gaapten met ons gapen op een volk, *dat* niet kon verlossen.","18":"Tsade. Zij hebben onze gangen nagespeurd, dat wij op onze straten niet gaan konden; ons einde is genaderd, onze dagen zijn vervuld, ja, ons einde is gekomen.","19":"Koph. Onze vervolgers zijn sneller geweest dan de arenden des hemels; zij hebben ons op de bergen hittiglijk vervolgd, in de woestijn hebben zij ons lagen gelegd.","20":"Resch. De adem onzer neuzen, de gezalfde des HEEREN, is gevangen in hun groeven; *van* welken wij zeiden: Wij zullen onder zijn schaduw leven onder de heidenen!","21":"Schin. Wees vrolijk, en verblijd u, gij dochter Edoms, die in het land Uz woont! *doch* de beker zal ook tot u komen, gij zult dronken worden, en ontbloot worden.","22":"Thau. Uw ongerechtigheid heeft een einde, o gij dochter Sions! Hij zal u niet meer gevankelijk doen wegvoeren; *maar* uw ongerechtigheid, o gij dochter Edoms! zal Hij bezoeken; Hij zal uw zonden ontdekken."},"KJV":{"1":"How is the gold become dim! *how* is the most fine gold changed! the stones of the sanctuary are poured out in the top of every street.","2":"The precious sons of Zion, comparable to fine gold, how are they esteemed as earthen pitchers, the work of the hands of the potter!","3":"Even the sea monsters draw out the breast, they give suck to their young ones: the daughter of my people *is become* cruel, like the ostriches in the wilderness.","4":"The tongue of the sucking child cleaveth to the roof of his mouth for thirst: the young children ask bread, *and* no man breaketh","5":"They that did feed delicately are desolate in the streets: they that were brought up in scarlet embrace dunghills.","6":"For the punishment of the iniquity of the daughter of my people is greater than the punishment of the sin of Sodom, that was overthrown as in a moment, and no hands stayed","7":"Her Nazarites were purer than snow, they were whiter than milk, they were more ruddy in body than rubies, their polishing *was* of sapphire:","8":"Their visage is blacker than a coal; they are not known in the streets: their skin cleaveth to their bones; it is withered, it is become like a stick.","9":"*They that be* slain with the sword are better than *they that be* slain with hunger: for these pine away, stricken through for *want of* the fruits of the field.","10":"The hands of the pitiful women have sodden their own children: they were their meat in the destruction of the daughter of my people.","11":"The LORD hath accomplished his fury; he hath poured out his fierce anger, and hath kindled a fire in Zion, and it hath devoured the foundations","12":"The kings of the earth, and all the inhabitants of the world, would not have believed that the adversary and the enemy should have entered into the gates of Jerusalem.","13":"For the sins of her prophets, *and* the iniquities of her priests, that have shed the blood of the just in the midst","14":"They have wandered *as* blind *men* in the streets, they have polluted themselves with blood, so that men could not touch their garments.","15":"They cried unto them, Depart ye; *it is* unclean; depart, depart, touch not: when they fled away and wandered, they said among the heathen, They shall no more sojourn","16":"The anger of the LORD hath divided them; he will no more regard them: they respected not the persons of the priests, they favoured not the elders.","17":"As for us, our eyes as yet failed for our vain help: in our watching we have watched for a nation *that* could not save","18":"They hunt our steps, that we cannot go in our streets: our end is near, our days are fulfilled; for our end is come.","19":"Our persecutors are swifter than the eagles of the heaven: they pursued us upon the mountains, they laid wait for us in the wilderness.","20":"The breath of our nostrils, the anointed of the LORD, was taken in their pits, of whom we said, Under his shadow we shall live among the heathen.","21":"Rejoice and be glad, O daughter of Edom, that dwellest in the land of Uz; the cup also shall pass through unto thee: thou shalt be drunken, and shalt make thyself naked.","22":"The punishment of thine iniquity is accomplished, O daughter of Zion; he will no more carry thee away into captivity: he will visit thine iniquity, O daughter of Edom; he will discover thy sins."}},"tsk":{"1":[{"kopje":"Hoe is het goud","refs":["2 Kon 25:9","2 Kon 25:10","Jes 1:21","Jes 14:12","Ezech 7:19-22"]},{"kopje":"de stenen","refs":["Klaagl 2:19","Jer 52:13","Matt 24:2","Mark 13:2","Luk 21:5","Luk 21:6"]}],"2":[{"kopje":"kinderen","refs":["Jes 51:18","Zach 9:13"]},{"kopje":"hoe","refs":["Klaagl 2:21","Klaagl 5:12","Jes 30:14","Jer 19:11","Jer 22:28","Rom 9:21-23","2 Kor 4:7","2 Tim 2:20"]}],"3":[{"kopje":"de n flessen,","tekst":"Hoe zijn zij nu zo onwaard en verachtzaam geworden, gelijk aarden vaten; vergelijk Isa 30:14 ."}],"3":[{"catchword":"zeekalveren","tekst":"Anders, zeehonden. Eenigen vertalen hier het Hebreeuwse woord draken, maar dat schijnt hier niet wel te passen, overmits er geen soort van aardse draken is, die borsten heeft. Anders betekent het Hebreeuwse woord allerlei kruipende monsterdieren, die op de aarde of in de wateren zijn. De zeekalveren zijn van zulken aard, dat zij in het water en ook op het land leven, en zij leggen hare jongen aan den oever der wateren, en zij komen tot dezelve, en geven ze de borst, dezelve zolang op het land latende liggen, totdat zij het water verdragen kunnen; zie Plin. lib.9, hoofdstuk 13. Als de profeet hier zegt dat de zeekalveren de borsten nederlaten om hunne welpen te zogen, dat is alsof hij zeide: De zeekalveren komen vrijmoediglijk aan den oever van het water en geven haar welpen de borst, die zij daar een tijdlang gerustelijk mogen laten liggen; maar de dochter mijns volks, dat is de moeders, die onder mijn volk zuigende kinderen hebben, lijden zulken hongersnood, dat zij hare kinderen niet kunnen zogen, en worden ook met haar kleine kinderen zo gehaat, verdreven en vervolgd van de ene plaats tot de andere, dat zij gene plaats noch"},{"catchword":"zeekalveren","tekst":"rust hebben om hare kinderen met vrede te zogen; maar zij is gelijk de struisen [of uilen], die van de andere vogels in de wildernissen worden gehaat, gejaagd en vervolgd. Vergelijk Job 30:29 ."},{"catchword":"als een wrede geworden,","tekst":"Hebreeuws, tot een wrede. Anders: moet onbarmhartig zijn. Anders: vanwege de wreden; te weten tirannen, vervolgers."}],"4":[{"catchword":"van dorst;","tekst":"Omdat zijner moeder borsten droog en zonder melk zijn."},{"catchword":"brood,","tekst":"Dat is, spijs, gelijk boven Lam 1:11 ."},{"catchword":"mededeelt","tekst":"Zie Isa 58:7 , van de betekenis van het Hebreeuwse woord. Hier is de zin: Niemand deelt den kinderen brood mede, doordien zij het zelf niet hebben, en derhalve moeten de kleine kinderen van honger en van dorst vergaan."}],"5":[{"catchword":"lekkernijen aten,","tekst":"Lekkere spijs, het allerlekkerste."},{"catchword":"die in","tekst":"Dat is, die op het allerkostelijkst plegen gekleed te gaan."},{"catchword":"karmozijn opgevoed zijn,","tekst":"Zie Isa 1:18 ."},{"catchword":"omhelzen den drek","tekst":"Dat is, die liggen nu en wentelen zich op de mesthopen en in de vuiligheden der straten, of zij eten drek; vergelijk 2Ki 6:25 ."}],"6":[{"catchword":"ongerechtigheid der dochter mijns volks","tekst":"Men kan door de woorden ongerechtigheid en zonde hier verstaan òf ongerechtigheid en zonde zelve, òf de straffen van die. Zie Lev 5:1 ."},{"catchword":"is groter","tekst":"Zo ten aanzien der straf zelve als ten aanzien van de duurzaamheid derzelve."},{"catchword":"in een ogenblik omgekeerd werd,","tekst":"Dat is, haastelijk, plotseling, onvoorziens, gelijk Psa 6:11 ; zie Gen 19:25 ; Eze 16:46-47 , enz."},{"catchword":"geen handen","tekst":"Dat is, mensenhanden hebben geen moeite gehad om Sodom uit te roeien, maar God heeft het gedaan zonder middel van mensen; maar met Jeruzalem is het geheel anders geweest. Anders: daar bleven geen handen aan, of in hen, dat is gene kracht; zij werden in der haast geheel vernield, daartegen in het Joodse land en in Jeruzalem zijn de legers der Chaldeën lang gebleven, het volk steeds kwellende en plagende; Sodom werd plotseling en als in een ogenblik het onderst boven gekeerd [ Gen 19] door de hand Gods, zonder dat er legers van soldaten toe zijn gebruikt geworden."}],"7":[{"catchword":"Haar","tekst":"Te weten van de dochter mijns volks."},{"catchword":"bijzondersten","tekst":"Dat is, de voortreffelijksten en aanzienlijksten, afgezondersten. Hebreeuws, nezirim, nazireën. Aldus werden die genoemd onder Joden, die een bijzondere manier van leven te onderhouden beloofd hadden, zekere spijzen niet etende, geen wijn of dronken makenden drank nuttigende, en het haar niet afscherende, Num 6:2-4 , enz. Zie Jdg 13:5 , en Jdg 16:17 ; 1Sa 1:11 ; Luk 1:15 . Maar somtijds betekent het zodanige personen, die anderen overtreffen in waardigheid en voortreffelijkheid. Aldus wordt Jozef genoemd een afgezonderde onder zijne broederen, Gen 49:26 ."},{"catchword":"waren reiner dan de sneeuw,","tekst":"Te weten eer het Joodse land in dezen ellendigen stand vervallen was."},{"catchword":"gladder dan een saffier","tekst":"Hebreeuws, hare snijding, of polijsting, of gravering, was, als des saffiers, dat is, zo zuiver, alsof zij uit een saffier gesneden waren. Of, zij waren als glad saffier."}],"8":[{"catchword":"hun gedaante verduisterd","tekst":"Dat is, hunne schoonheid."},{"catchword":"van zwartigheid,","tekst":"Spruitende uit den groten honger, de ziekte, mitsgaders andere ellenden en kwellingen, die zij geleden hebben. Vergelijk Job 30:30 . Anders: duisterder dan de zwartigheid zelve."},{"catchword":"men kent hen niet","tekst":"Hebreeuws, zij worden niet gekend, enz., zij zijn zo veranderd dat wie hen op de straat ontmoet, die kent hen niet voor die lieden, die zij tevoren waren."},{"catchword":"zij is verdord,","tekst":"Of, zij zijn verdord, zij zijn als een hout, zo dor en zo hard alsof het een stuk hout ware. Zie onder Lam 5:10 ."}],"9":[{"catchword":"gelukkiger dan","tekst":"Hebreeuws, beter."},{"catchword":"de verslagenen van den honger;","tekst":"Want die door of met het zwaard omgebracht worden, lijden zolang pijn niet als die allengs van honger sterven."},{"catchword":"die","tekst":"Te weten die van honger sterven."},{"catchword":"vlieten daarhenen,","tekst":"Dat is, zij sterven allengskens."},{"catchword":"omdat er geen vruchten der velden zijn","tekst":"Dat is, bij gebrek van het voedsel, hetwelk de aarde gewoon is den mensen te geven, zijn zij dor en zo mager geworden, dat hun de beenderen schier het vel doorsteken. Vergelijk Psa 109:24 ."}],"10":[{"catchword":"De handen der barmhartige vrouwen","tekst":"Of, de barmhartige vrouwen hebben hare kinderen met [hare] handen gekookt. Zie boven Lam 2:20 , Lam 2:22 ; Lev 26:29 ; Deu 28:53 ; 2Ki 6:29 ."},{"catchword":"tot spijze geworden","tekst":"Hebreeuws, om te eten, of te spijzen."},{"catchword":"in de verbreking","tekst":"Dat is, te dien tijde als Jeruzalem is uitgeroeid geworden."}],"11":[{"catchword":"volbracht,","tekst":"Dat is, Hij heeft niets nagelaten, hetwelk diende tot bewijs van zijn toorn over zijn volk, naar de voorzegging der profetieën."},{"catchword":"Hij heeft te Sion","tekst":"Dat is, Hij heeft een verterende vlam in Jeruzalem gezonden, die niet alleen de daken der huizen, maar ook de fondamenten zelf verteerd heeft, geen overblijfsel daarvan overig latende, noch enige hoop van wederopbouwing."}],"12":[{"catchword":"De koningen der aarde","tekst":"Toen het Joodse land en de stad Jeruzalem in hun bloei waren, werden zij zeer groot geacht en zeer gevreesd van al de omliggende koningen en natiën. ZIe Deu 28 , en Psa 48 , de beloften, en ook de dreigementen, die God het Joodse volk doende is."},{"catchword":"de tegenpartijder en vijand","tekst":"Te weten der Joden."},{"catchword":"tot de poorten van Jeruzalem zou ingaan","tekst":"Zijnde Jeruzalem niet alleen sterk van ligging en bouw, maar ook had het de Heere vele jaren krachtiglijk beschermd, tot verwondering van de ganse wereld."}],"13":[{"catchword":"Het is vanwege de zonden harer profeten,","tekst":"De zin is: De oorzaak, die God bewogen heeft aldus met Jeruzalem te handelen, was de grote zonde, die niet alleen het gemene volk begaan had, maar ook de profeten en de priesters, [versta, de valse profeten en priesters], die het volk hadden behoren te onderwijzen en in alle gerechtigheid voor te gaan. Zie Jer 5:31 , en Jer 23:21 ."},{"catchword":"die in het midden van haar","tekst":"Dat is, die tot zulke hoogte en gruwel der zonden zijn opgeklommen, dat zij door de magistraten en anderszins gedood hebben degenen, die rechtvaardiger waren dan zij; Jer 26:11 ; Mat 23:34 ."}],"14":[{"catchword":"Zij","tekst":"Te weten die boze mensen, waarvan vs.13 gesproken is."},{"catchword":"zwierven","tekst":"Of, zwierden, gingen heen en weder."},{"catchword":"als blinden op de straten,","tekst":"Die noch de waarheid hun van God geopenbaard, noch de straf die hun nakende was, zagen. Zie Isa 42:18-19 ."},{"catchword":"met bloed besmet,","tekst":"Te weten der rechtvaardigen, hetwelk zij vergoten hadden."},{"catchword":"niet kon","tekst":"Nergens kon gaan noch staan. Of, niet voorbij kon, of vermijden Kon."},{"catchword":"zijn,","tekst":"Doordien dezen, te weten, die het rechtvaardig bloed vergoten hadden, hunne medeburgers zo dikwijls, en zo velen, op de straten ontmoetten. Anderen verstaan vs.14 aldus: Zij te weten de burgers van Jeruzalem, waren vanwege de wreedheid der vijanden zo verbaasd, dat zij, als blinde mensen, niet wisten waar zij zich keren of wenden zouden. Zij besmetten zich met bloed; dewijl zij dus verbaasd waren, zo konden zij niet voorzichtiglijk gaan, maar zij traden, alsof zij blind waren, in het bloed der doden, zichzelven alzo besmettende. Zij roerden met hunne klederen aan hetgeen hun niet geoorloofd was, namelijk de dode lichamen, die niemand zonder zich te besmetten aanroeren mocht."}],"15":[{"catchword":"Zij riepen tot hen","tekst":"De zin schijnt te zijn: Zij, te weten die met bloed besmet waren, riepen tot hen; te weten tot degenen, die hen ontmoetten: Wijkt wijkt, [zie Lev 13:45 ] , aldus vanzelf, door overtuiging van hun eigen conscientie, bekennende en belijdende dat zij onrein waren; vergelijk Isa 52:11 ."},{"catchword":"Zekerlijk,","tekst":"De zin schijnt te zijn: Gelijk de gezonden de aanroering der melaatsen vermijden, alzo willen de vrome en eerbare personen bij de goddeloze mensen niet langer wonen of verkeren, maar zij vlieden hen en trekken van hen weg, zo haastelijk alsof zij wegvlogen, opdat zij de straffen, hun over het hoofd hangende, niet mede deelachtig zouden worden. Of, men kan het alzo verstaan, dat hun hier spottenderwijze wordt toegezegd de goddelijke straf hunner verstrooiing en wegzwerving."},{"catchword":"zij zeiden onder de heidenen","tekst":"Te weten de godzaligen, wonende onder de heidenen, bij wie zij hun toevlucht genomen hadden. Anders: men zeide onder de heidenen, enz.; dat is, de heidenen zelf zeiden tot elkander dat de Joden vanwege hunne goddeloosheid noch in hun eigen land noch elders zouden kunnen verblijven."},{"catchword":"Zij","tekst":"Te weten die goddeloze boeven."},{"catchword":"zullen er niet langer wonen","tekst":"Versta hierbij: Maar de aarde zal hen verslinden, dewijl zij zo lelijk met onnozel bloed bevlekt zijn."}],"16":[{"catchword":"Des HEEREN","tekst":"Dit spreekt de profeet in den persoon der heidenen."},{"catchword":"aangezicht","tekst":"Dat is, des Heeren toorn. Zie de aantekening Lev 17:10 , en Psa 21:10 ."},{"catchword":"verdeeld","tekst":"Of, verstrooid; te weten onder de vreemde en wijdgezeten heidenen en natiën."},{"catchword":"niet meer aanzien;","tekst":"Te weten met een blij gelaat, of om hen in genade aan te nemen."},{"catchword":"zij hebben het aangezicht der priesteren","tekst":"Te weten, de Joden hebben de leraars der wet, die zij hadden, niet geacht. Anders: [zij], te weten de Chaldeën, hebben de priesters niet verschoond."},{"catchword":"niet geëerd,","tekst":"Hebreeuws, niet opgenomen."},{"catchword":"den ouden","tekst":"Of, de oudsten, dat is, de overheden noch priesters."}],"17":[{"catchword":"Nog bezweken ons onze ogen,","tekst":"Dat is, niettegenstaande al onze ellenden, gaapten wij nog zeer naar zulke hulp, die ons niet bevorderlijk kon wezen. Anders: [toen wij nog waren], te weten in ons vaderland en in goeden welstand."},{"catchword":"ziende","tekst":"Of, vanwege onze ijdele hulp."},{"catchword":"naar onze ijdele hulp;","tekst":"Naar de hulp, die ons uit Egypte en van elders komen zou. Zie Jer 37:7 , Jer 37:9 ."},{"catchword":"op een volk,","tekst":"Te weten op de Egyptenaars."}],"18":[{"catchword":"Zij","tekst":"Te weten de Chaldeën."},{"catchword":"hebben onze gangen nagespeurd,","tekst":"De zin is: Zij hebben katten of hoogten opgeworpen voor onze stad, uit welke zij in onze stad zien konden, en ons uit dezelve alzo benauwen, dat wij onze straten niet vrijelijk gebruiken konden. Vergelijk 2Ki 25:4 ."},{"catchword":"ons einde is genaderd,","tekst":"Alsof hij zeide: Die bovenverhaalde zwarigheden, die ons overkomen, zijn gewisse tekenen en voorboden, dat wij haast zullen uitgeroeid worden."},{"catchword":"dagen zijn vervuld,","tekst":"Te weten de dagen onzes levens, of de dagen onzes verderfs, of de dagen onzes welstands."}],"19":[{"catchword":"Onze vervolgers","tekst":"Te weten de Chaldeën."},{"catchword":"sneller geweest","tekst":"Hebreeuws, lichter. Vergelijk Jer 4:13 ."},{"catchword":"des hemels;","tekst":"Dat is, der lucht, gelijk Mat 6 , waar staat: De vogelen des hemels; dat is, der lucht, die in de lucht of in de hoogte vliegen."},{"catchword":"zij hebben ons op de bergen hittiglijk vervolgd,","tekst":"De zin is: Of wij onze toevlucht tot de bergen namen, of dat wij ons in de bossen verbergden, zo konden onze vijanden ons overal wel vinden."}],"20":[{"catchword":"adem onzer neuzen,","tekst":"Dat is, hij door wien wij ademhalen, op welken wij ons verlieten en hoopten rust en welvaart door hem te verkrijgen."},{"catchword":"de gezalfde des HEEREN,","tekst":"Dat is, onze koning, te weten Zedekia, die van God tot onzen koning beschikt was. Sommigen verstaan het van den koning Josia, anderen van Jechonia. Van de zalving der koningen zie 1Ki 1:34 ."},{"catchword":"is gevangen in hun groeven;","tekst":"Dat is, hij is gevallen in de strikken of lagen zijner vijanden; Jer 52:8-9 . Dat hier den kwaden koning Zedekia die heerlijke titel gegeven wordt, dat moet niemand wonder geven; Saul wordt ook genoemd de gezalfde des Heeren. Dit geschiedt niet ten aanzien van hun persoon, maar ten aanzien van hun ambt, hetwelk zij bedienden."},{"catchword":"van welken wij zeiden","tekst":"Dat is, waarvan wij zulke hoop hadden, dat wij bij onszelven dachten en onszelven inbeeldden."},{"catchword":"Wij zullen onder zijn schaduw leven","tekst":"Dat is, wij zullen door hem verkwikt worden in de zware hitte der grote vervolgingen; zie deze zelfde gelijkenis Dan 4:12 ."},{"catchword":"onder de heidenen","tekst":"Te weten, ofschoon wij onder vele vreemde natiën der heidenen verstrooid worden."}],"21":[{"catchword":"Wees vrolijk,","tekst":"Dit spreekt de profeet spottenderwijze tot de vijanden der Joden, alsof hij zeide: Neemt uwe geneugte van ons, zolang als God u geweld over ons geeft."},{"catchword":"gij dochter Edoms,","tekst":"De zin is: Verblijdt u, al onze vijanden, doch inzonderheid, gij Edomieten, gij die zo wreed over ons geweest zijt. Ziet Psa 137:7 ."},{"catchword":"in het land","tekst":"Of, bij het land Uz."},{"catchword":"Uz woont","tekst":"Van het land Uz, zie Gen 10:23 , en Job 1:1 ."},{"catchword":"de beker","tekst":"Te weten de beker van den toorn Gods. De zin is: De slaande roede van des Heeren hand zal niet alleen ons treffen, maar gij zult er uw deel ook van hebben. Zie de aantekening Psa 11:6 . Zie ook Jer 25:15 ; Mic 7:8 ; Oba 1:16 ."},{"catchword":"gij zult dronken worden,","tekst":"Dat is, gij zult ook Gods straffen overvloediglijk gevoelen."},{"catchword":"ontbloot worden","tekst":"Dat is, uwe schande en oneer zal voor alle mans ogen openbaar worden. Anders: en gij zult u ontbloten gelijk de dronken mensen plegen te doen. Zie Gen 9:21 ."}],"22":[{"catchword":"Uw ongerechtigheid","tekst":"Dat is, de straf uwer ongerechtigheid. Zie boven vs.6."},{"catchword":"heeft een einde,","tekst":"Dat is, zij zal voorzeker haast een einde nemen. Zie de aantekening Isa 40:2 . De profeet schijnt hier te zien op de zeventigjarige gevangenschap der Joden, waarmede des Heeren toorn voor dat maal gestild was."},{"catchword":"Hij zal u niet meer gevankelijk doen wegvoeren;","tekst":"Te weten de Heere zal u niet geduriglijk noch altoos in deze gevangenis en ballingschap laten blijven, maar Hij zal u eindelijk daaruit verlossen en weder in uw vaderland brengen, en hierna niet wederom aldus met zulke gevangenschap of wegvoering straffen, gelijk Hij nu gedaan heeft. Doch versta hierbij, tenzij dat gijlieden mij wederom met uw gruwelijke en langdurige zonden daartoe dwingt, gelijk geschied is ten tijde als God in zijn rechtvaardigen toorn door Vespasianus en Titus de stad Jeruzalem geheel heeft laten verwoesten, den tempel verbranden, de gehele natie verdelgen, wegvoeren, verkopen en door de ganse wereld verstrooien."},{"catchword":"o gij dochter Edoms","tekst":"Gij die nu machtig en weelderig zijt."},{"catchword":"zal","tekst":"Te weten in zijn toorn."},{"catchword":"Hij","tekst":"Hebreeuws, Hij heeft bezocht, Hij heeft ontdekt. Profetischerwijze gesproken."},{"catchword":"ontdekken","tekst":"Dat is, aan den dag brengen door de straffen, waarmede Hij u straffen zal. Daarentegen wordt de Heere gezegd dien de zonden te bedekken, wien Hij ze vergeeft; Psa 32:1 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"ALEPH. How is the gold [That glorious Temple that glistered with gold, whereby it was beautified and partly covered over and overlaid within. See I Kings 6.20,21, & c. and 2 Chron.3.4,5,6.] so darkened: [In regard the Chaldeans did break down the Temple, all things became dusty and darkened. Heb. covered. This is a question with grief and admiration, as chap. 1.1.] (how) are the stones of the sanctuary [or the stones of holiness; that is, which which were at the building of the temple, which were artificially and curiously hewn and polished, I Kings 5.17,18. and 6.7. compare herewith the stones of the second temple, Mat 24:4. Luke.19.44.] cast out [Heb. poured out] in the front of all the streets! [that is, scattered in the ends and corners of the streets, as if they were of no value. Compare above chap. 2.ver. 11,12,19. and the 79. Pslam.]"}],"2":[{"catchword":null,"tekst":"BETH. The precious children of Zion [That is, the chiefest and most honourable men of the city and country. See the like similitudes, comparisons, Job 28:16, & c.] valued against fine gold, how are they (now) counted earthen bottles, the work of the hands of a potter! [how they now are become as base, vile, and contemptible as earthen vessels. Compare Isa 30:14.]"}],"3":[{"catchword":null,"tekst":"GIMEL. Even the sea-calves let down the breasts, they give suck to their whelps: (but) the daughter of my people is become as a cruel one, [Heb. a cruel one. Others, must be unmerciful. Others, because of the cruel, to wit, tyrants, persecutors] as the Ostriches in the wilderness. [For sea-calves before others read sea-hounds. Some render here the Hebrew word Dragon; but this seemeth not to suit well in this place, because there is n kind of dragons that hath breasts. Otherwise the Hebrew word signifieth all manner of creeping monsters that are on the earth, or in the waters. The Phord or sea-calves are of such a nature, that they live in the water, and also upon the land, & they lay their young ones by the bank of the waters; and come to them and give them the dug, letting them lie so long upon the land till they are able to endure the water. See Plin. lib. 9. chap.13. when the Prophet here saith, that the sea-calves let down the breasts to give suck to their whelps, it is, as if he should say, the sea-calves come boldly to the shore and give their whelps the dug, whom it may be they let lie there quietly awhile: but the daughter of my people, that is the mothers, that among my people have sucking children, endure such famine and want as that they cannot give suck to their children, and are also with their little children so hasted, driven, and persecuted from one place to another, as that they have no place nor rest to give their children suck quietly: but she is like the Ostriches (or owls) that are hasted, chased, and pursued by the other fowl in the wilderness. Compare Job 30:29.]"}],"4":[{"catchword":null,"tekst":"DALETH. The tongue of the suckling child cleaveth to his roof for thirst; [Because the breasts of their mothers are dry & without milk] the little children ask bread, [that is, meat, as above chap.1.11.] there is none to impart (it) unto them. [See of the signification of the Hebrew word, Isai.58. on ver.7. here the meaning is, none dealeth bread unto the children, because they have it not themselves, and therefore their little children must needs perish for hunger and thirst."}],"5":[{"catchword":null,"tekst":"HE. They that did eat dainties, [That is, dainry food, the daintiest of all] do faint (now) in the streets: they that were brought up in crimson, [that is, those that were wont t weare the richest and costliest garments. Of crimson see Isai. 1. on ver. 18] they embrace the dung, [that is, they now lie and wallow unon the dung-hils, and in the mire and filth of the streets; or they eat dung. Compare 2 Kings. 6.25.]"}],"6":[{"catchword":null,"tekst":"VAU. And the iniquity of the daughters of my people is greater then the sin of Sodom [Both in respect of the punishment itself, and in respect of the duration thereof: by the words iniquity and sin, may here be understood either the inquity and sin it self, or the punishments of them. See Levit.5. on ver. 1.] that was overthrown as in a moment, [that is, quickly, suddenly, unwares. As Psal.6.11. See Gen. 19.25. Ezek. 16.46,47, & c.] and no hand had labour about her. [that is, mens hands had no trouble to destroy Sodom, but God did it without the help or means of man: but it was quite otherwise with Jerusalem. Others, there remained no hands on, or in her; that is, no strength; they were son utterly destroyed: on the contrary; in the land of Juda and in Jerusalem the armies of the Chaldeans stayed a long while, vexing and plaguing the people of God continually. Sodom was suddenly and as in a moment turned upside down, (Gen.19.) by the hand of God, without the use of armed souldiers.]"}],"7":[{"catchword":null,"tekst":"ZAIN. Her [To wit, the daughter of my people] most special ones [That is, the excellent and most honourable, and most separated ones. Heb. Nezarim, Nazarites, were they called among the Jews, that had vowed to live a special kind of life, abstaining from certain means, drinking no wine nor strong drink, and not cutting off the hair, Num 6:2,3,4, c. See Judg.13. on ver.5. and 16.17. and I Sam.1.11. Luk 1:15. But it signifieth sometimes such kind of persons as exceed others in worth and excellency: thus Joseph is called a separated one among his brethren, Ge 49.26] were purer then the snow, [to wit, before the land of Juda was fallen into this miserable condition] they were whiter then milk: they were more ruddy in body then rubies, smoother then a Saphir. [Heb. their cutting, or polishing, or graving, was as of Saphir; that is, so pure, as if they were cut out of a Saphir, or they were like smooth Saphir.]"}],"8":[{"catchword":null,"tekst":"CHETH. (But now) their shape [That is, their beauty,] is darkened through grief, [issuing from great famine, sickness, and other miseries and vexations which they endured. Compare Job 30:30. others, darker than blackness it self] men know them not in the streets: [Heb. they are not known, c. they are so altered, that whosoever meeteth them in the streets, taketh them not to be the fame people that they were before] their skin cleaveth to their bones, it is withered, it is become like a stick [or they are withered, they are like stick, so withered, and so hard, as if it were a piece of wood. See below chap.5.10.]"}],"9":[{"catchword":null,"tekst":"TETH. The slain by the sword they are happier [Heb. better] then the slain by the famine: [for those that are killed by or with the sword are not so long in pain and misery as those that famish by little and little, as followeth] for those [to wit, those that die of hunger] flow away [that is, they die by little and little] as being thrust through, because there are no fruits of the field. [that is, for want of food which the earth is wont to yield unto men, they are become so withered and so lean, that their bones do almost stick through their skin. Compare Psal.109.24.]"}],"10":[{"catchword":null,"tekst":"JOD. The hands of the pittiful women have cooked their (own) children: [Or the pittiful women have cooked their (own) children with (their own) hands. See above chap.2. on ver.20, and 22. and Levit.26.29. Deut.28.53. I Kings 6.29.] they became meat unto them [Heb. for to eat, or to feed] in the breaking of the daughter of my people. [that is, at that time when Jerusalem was destroyed.]"}],"11":[{"catchword":null,"tekst":"CAPH. The LORD hath accomplished his fury, [That is, he omitted nothing that served to manifest his wrath towards his people, according to the prediction of his prophesies] he hath poured out the heat of his anger: and he hath kindled a fire at Zion which hath consumed the foundations thereof. [that is, he hath sent a consuming flame into Jerusalem. Which hath not onely consumed the tops of the houses, but also the foundations themselves, leaving no remnant, nor any hope of building it up again.]"}],"12":[{"catchword":null,"tekst":"LAMED. The Kings of the earth would not have believed it, nor all the inhabitants of the world, that the adversary and enemy [To wit, of the Jews] should enter into the gates of Jerusalem. [Because Jerusalem was not onely strong in situation and building, but because the Lord had also for many years powerfully protected it, to the administration of all the world. When the land of Juda and the city of Jerusalem were in their flourishing condition, they were very much esteemed, and greatly feared by all the Kings and nations round about. See Deut.28. and Psal.48. the promises, and likewise the threatnings which God maketh unto the people of the Jews.]"}],"13":[{"catchword":null,"tekst":"MEM. It is because of the sins of her Prophets, (and) the offences of her Priests, that have shed the blood of the just in the midst of her. [That is, that have come to such an height and abomination of sinning, that they have caused those to be put to death by the magistrate and other waies, that are more righteous then themselves, Jer 26:11. and Mat 23:34. The meaning of the verse is, the cause that moved God to deal thus with Jerusalem, was, the great sins, which not onely the common people had committed, but also the Prophets, and the Priests, (meaning thefalse Prophets and the Priests) which ought to have instructed the people, to have gone before them in all manner of righteous dealing. See Jer 5:36. and 23.21.]"}],"14":[{"catchword":null,"tekst":"NUN. They [To wit, those wicked men, whereof is spoken vers.13.] wandered [or, strayed, went to and fro] (as) blind men in the streets, [they neither saw the truth revealed to them by God, nor the punishment that was near at hand. Se Isa.42. on vers.18,19.] they were polluted with blood, [to wit, with the blood of the just, which they had shed] So that men could not be] could go or stand no where. Or, could not pass by; or, could not avoid it] (but) they touched their garments. [In regard these (to wit, that had shed righteous blood) did so often and so frequently meet their fellow citizens in the streets. Others understand this 14 verse thus: they, to wit, the citizens of Jerusalem were so amazed because of the cruelty of the enemies, that as blind men they knew not whither to turn or winde themselves. They defiled them with blood; forasmuch as they were so amazed, they could not walk circumspectly, but they did tread, as if they were blind, in the blood of the dead, so defiling themselves: they touched with their garments that which was not lawful for them to do, namely dead bodies which none, without defiling himself, might touch.]"}],"15":[{"catchword":null,"tekst":"SAMECH, they cried unto them, depart, here is one unclean, depart, depart, touch not: [The meaning seemeth to be, they, to // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;

    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

function kopieerVers(n) {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +

  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
