"richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.", "2": "Beth. De Heere heeft al de woningen van Jakob verslonden, en heeft ze niet verschoond; Hij heeft de vestingen van de dochter van Juda afgebroken in Zijn verbolgenheid, Hij heeft gemaakt dat zij de aarde raken; Hij heeft het koninkrijk en zijn vorsten ontheiligd.", "3": "Gimel. Hij heeft, in ontsteking van de toorn, de gehele hoorn van Israël afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, dat rondom verteert.", "4": "Daleth. Hij heeft Zijn boog gespannen als een vijand; Hij heeft Zich met Zijn rechterhand gesteld als een tegenstander, dat Hij doodde al de begeerlijke dingen van de ogen; Hij heeft Zijn grimmigheid in de tent van de dochter van Sion uitgestort als een vuur.", "5": "He. De Heere is geworden als een vijand; Hij heeft Israël verslonden, Hij heeft al haar paleizen verslonden. Hij heeft haar vestingen verdorven; en Hij heeft bij de dochter van Juda het klagen en kermen vermenigvuldigd.", "6": "Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.", "7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "8": "Cheth. De HEERE heeft gedacht te verderven de muur van de dochter van Sion; Hij heeft het richtsnoer daarover getrokken, Hij heeft Zijn hand niet afgewend, dat Hij ze niet zou verslinden; en Hij heeft de voormuur en de muur samen treurig gemaakt, zij zijn verzwakt.", "9": "Teth. Haar poorten zijn in de aarde verzonken; Hij heeft haar grendels verdorven en gebroken; haar koning en haar vorsten zijn onder de heidenen; er is geen wet; haar profeten vinden ook geen gezicht van de HEERE.", "10": "Jod. De oudsten van de dochter van Sion zitten op de aarde, zij zwijgen stil, zij werpen stof op hun hoofd, zij hebben zakken aangegord; de jonge dochters van Jeruzalem laten hun hoofd ter aarde hangen.", "11": "Caph. Mijn ogen zijn verteerd door tranen, mijn ingewand wordt beroerd; mijn lever is ter aarde uitgeschud, vanwege de breuk van de dochter van mijn volk; omdat het kind en de zuigeling op de straten van de stad in onmacht zinken;", "12": "Lamed. Als zij tegen hun moeders zeggen: Waar is koren en wijn, als zij op de straten van de stad in onmacht zinken, als de verslagenen; als hun ziel zich uitschudt in de schoot van hun moeders.", "13": "Mem. Wat getuigen zal ik u brengen, wat zal ik bij u vergelijken, u dochter van Jeruzalem? Wat zal ik bij u vergelijken, dat ik u zou troosten, u jonkvrouw, dochter van Sion, want uw breuk is zo groot als de zee, wie kan u helen?", "14": "Nun. Uw profeten hebben u ijdelheid en ongerijmdheid gezien, en zij hebben u uw ongerechtigheid niet geopenbaard, om uw gevangenschap af te wenden, maar zij hebben voor u gezien ijdele lasten en uitstotingen.", "15": "Samech. Allen die voorbijgaan, klappen met de handen over u, zij fluiten en schudden hun hoofd over de dochter van Jeruzalem, en zeggen: Is dit die stad, waarvan men zei, dat zij volkomen was van schoonheid, een vreugde van de hele aarde?", "16": "Pe. Al uw vijanden sperren hun mond open over u, zij fluiten en knersen met de tanden, zij zeggen: Wij hebben haar verslonden; dit is zeker de dag die wij verwacht hebben, wij hebben hem gevonden, wij hebben hem gezien.", "17": "Ain. De HEERE heeft gedaan wat Hij Zich had voorgenomen, Hij heeft Zijn woord vervuld, dat Hij bevolen had van oude dagen af; Hij heeft afgebroken en niet gespaard; en Hij heeft de vijand over u verblijd, Hij heeft de hoorn van uw tegenstanders verhoogd.", "18": "Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op!", "19": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "21": "Schin. De jongen en de ouden liggen op de aarde op de straten; mijn jonkvrouwen en mijn jongelingen zijn door het zwaard gevallen; Gij hebt ze gedood in de dag van Uw toorn, Gij hebt ze geslacht en niet verschoond.", "22": "Thau. Gij hebt mijn verschrikkingen van rondom geroepen, als tot een dag van een gezet hoogtijd; en er is niemand aan de dag van de toorn van de HEERE ontkomen of overgebleven; die ik op de handen gedragen en opgevoed heb, die heeft mijn vijand omgebracht."}, "SV": {"1": "Aleph. Hoe heeft de Heere de dochter Sions in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van den hemel *op* de aarde nedergeworpen; en Hij heeft aan de voetbank Zijner voeten niet gedacht in den dag Zijns toorns.", "2": "Beth. De Heere heeft al de woningen Jakobs verslonden, en heeft ze niet verschoond; Hij heeft de vastigheden der dochter van Juda afgebroken in Zijn verbolgenheid, Hij heeft gemaakt, dat zij de aarde raken; Hij heeft het koninkrijk en deszelfs vorsten ontheiligd.", "3": "Gimel. Hij heeft, in ontsteking des toorns, den gehelen hoorn Israëls afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, *dat* rondom verteert.", "4": "Daleth. Hij heeft Zijn boog gespannen als een vijand; Hij heeft zich *met* Zijn rechterhand gesteld als een tegenpartijder, dat Hij doodde al de begeerlijke dingen der ogen; Hij heeft Zijn grimmigheid in de tent der dochter Sions uitgestort als een vuur.", "5": "He. De Heere is geworden als een vijand; Hij heeft Israël verslonden, Hij heeft al haar paleizen verslonden. Hij heeft deszelfs vastigheden verdorven; en Hij heeft bij de dochter van Juda het klagen en kermen vermenigvuldigd.", "6": "Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten den hoogtijd en den sabbat, en Hij heeft in de gramschap Zijns toorns den koning en den priester smadelijk verworpen.", "7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren harer paleizen in des vijands hand overgegeven; zij hebben in het huis des HEEREN een stem verheven als op den dag eens gezetten hoogtijds.", "8": "Cheth. De HEERE heeft gedacht te verderven den muur der dochter Sions; Hij heeft het richtsnoer *daarover* getogen, Hij heeft Zijn hand niet afgewend, dat Hij ze niet verslonde; en Hij heeft den voormuur en den muur te zamen treurig gemaakt, zij zijn verzwakt.", "9": "Teth. Haar poorten zijn in de aarde verzonken; Hij heeft haar grendelen verdorven en gebroken; haar koning en haar vorsten zijn onder de heidenen; er is geen wet; haar profeten vinden ook geen gezicht van den HEERE.", "10": "Jod. De oudsten der dochter Sions zitten op de aarde, zij zwijgen stil, zij werpen stof op hun hoofd, zij hebben zakken aangegord; de jonge dochters van Jeruzalem laten haar hoofd ter aarde hangen.", "11": "Caph. Mijn ogen zijn verteerd door tranen, mijn ingewand wordt beroerd; mijn lever is ter aarde uitgeschud, vanwege de breuk der dochter mijns volks; omdat het kind en de zuigeling op de straten der stad in onmacht zinken;", "12": "Lamed. *Als* zij tot hun moeders zeggen: Waar is koren en wijn, als zij op de straten der stad in onmacht zinken, als de verslagenen; als zich hun ziel uitschudt in den schoot hunner moeders.", "13": "Mem. Wat getuigen zal ik u brengen , wat zal ik bij u vergelijken, gij dochter Jeruzalems? Wat zal ik bij u vergelijken, dat ik u trooste, gij jonkvrouw, dochter Sions, want uw breuk is *zo* groot als de zee, wie kan u helen?", "14": "Nun. Uw profeten hebben u ijdelheid en ongerijmdheid gezien, en zij hebben *u* uw ongerechtigheid niet geopenbaard, om uw gevangenis af te wenden, maar zij hebben voor u gezien ijdele lasten en uitstotingen.", "15": "Samech. Allen, die over weg gaan, klappen met de handen over u, zij fluiten en schudden hun hoofd over de dochter Jeruzalems, *zeggende*: Is dit die stad, waar men van zeide, dat zij volkomen van schoonheid was, een vreugde der ganse aarde?", "16": "Pe. Al uw vijanden sperren hun mond op over u, zij fluiten en knersen met de tanden, zij zeggen: Wij hebben haar verslonden; dit is immers de dag, dien wij verwacht hebben, wij hebben *hem* gevonden, wij hebben *hem* gezien.", "17": "Ain. De HEERE heeft gedaan, wat Hij gedacht had, Hij heeft Zijn woord vervuld, dat Hij bevolen had van oude dagen; Hij heeft afgebroken en niet gespaard; en Hij heeft den vijand over u verblijd, Hij heeft den hoorn uwer tegenpartijders verhoogd.", "18": "Tsade. Hun hart schreeuwde tot den Heere: O gij muur der dochter Sions, laat dag en nacht tranen afvlieten als een beek; geef uzelve geen rust, uw oogappel houde niet op!", "19": "Koph. Maak u op, maak geschrei des nachts in het begin der nachtwaken, stort uw hart uit voor het aangezicht des Heeren als water; hef uw handen tot Hem op voor de ziel uwer kinderkens, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "20": "Resch. Zie, HEERE, aanschouw toch, aan wien Gij alzo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderkens, die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom des Heeren gedood worden?", "21": "Schin. De jongen en de ouden liggen op de aarde *op* de straten; mijn jonkvrouwen en mijn jongelingen zijn door het zwaard gevallen; Gij hebt ze in den dag Uws toorns gedood, Gij hebt ze geslacht *en* niet verschoond.", "22": "Thau. Gij hebt mijn verschrikkingen van rondom geroepen, als *tot* een dag eens gezetten hoogtijds; en er is niemand aan den dag des toorns des HEEREN ontkomen of overgebleven; die ik op de handen gedragen en opgetogen heb, die heeft mijn vijand omgebracht."}, "KJV": {"1": "How hath the Lord covered the daughter of Zion with a cloud in his anger, *and* cast down from heaven unto the earth the beauty of Israel, and remembered not his footstool in the day of his anger!", "2": "The Lord hath swallowed up all the habitations of Jacob, and hath not pitied: he hath thrown down in his wrath the strong holds of the daughter of Judah; he hath brought *them* down to the ground: he hath polluted the kingdom and the princes", "3": "He hath cut off in *his* fierce anger all the horn of Israel: he hath drawn back his right hand from before the enemy, and he burned against Jacob like a flaming fire, *which* devoureth round about.", "4": "He hath bent his bow like an enemy: he stood with his right hand as an adversary, and slew all *that were* pleasant to the eye in the tabernacle of the daughter of Zion: he poured out his fury like fire.", "5": "The Lord was as an enemy: he hath swallowed up Israel, he hath swallowed up all her palaces: he hath destroyed his strong holds, and hath increased in the daughter of Judah mourning and lamentation.", "6": "And he hath violently taken away his tabernacle, as *if it were of* a garden: he hath destroyed his places of the assembly: the LORD hath caused the solemn feasts and sabbaths to be forgotten in Zion, and hath despised in the indignation of his anger the king and the priest.", "7": "The Lord hath cast off his altar, he hath abhorred his sanctuary, he hath given up into the hand of the enemy the walls of her palaces; they have made a noise in the house of the LORD, as in the day of a solemn feast.", "8": "The LORD hath purposed to destroy the wall of the daughter of Zion: he hath stretched out a line, he hath not withdrawn his hand from destroying: therefore he made the rampart and the wall to lament; they languished together.", "9": "Her gates are sunk into the ground; he hath destroyed and broken her bars: her king and her princes *are* among the Gentiles: the law *is* no *more*; her prophets also find no vision from the LORD.", "10": "The elders of the daughter of Zion sit upon the ground, *and* keep silence: they have cast up dust upon their heads; they have girded themselves with sackcloth: the virgins of Jerusalem hang down their heads to the ground.", "11": "Mine eyes do fail with tears, my bowels are troubled, my liver is poured upon the earth, for the destruction of the daughter of my people; because the children and the sucklings swoon in the streets of the city.", "12": "They say to their mothers, Where *is* corn and wine? when they swooned as the wounded in the streets of the city, when their soul was poured out into their mothers' bosom.", "13": "What thing shall I take to witness for thee? what thing shall I liken to thee, O daughter of Jerusalem? what shall I equal to thee, that I may comfort thee, O virgin daughter of Zion? for thy breach *is* great like the sea: who can heal", "14": "Thy prophets have seen vain and foolish things for thee: and they have not discovered thine iniquity, to turn away thy captivity; but have seen for thee false burdens and causes of banishment.", "15": "All that pass by clap *their* hands at thee; they hiss and wag their head at the daughter of Jerusalem, *saying, Is* this the city that *men* call The perfection of beauty, The joy of the whole earth?", "16": "All thine enemies have opened their mouth against thee: they hiss and gnash the teeth: they say, We have swallowed *her* up: certainly this *is* the day that we looked for; we have found, we have seen", "17": "The LORD hath done *that* which he had devised; he hath fulfilled his word that he had commanded in the days of old: he hath thrown down, and hath not pitied: and he hath caused *thine* enemy to rejoice over thee, he hath set up the horn of thine adversaries.", "18": "Their heart cried unto the Lord, O wall of the daughter of Zion, let tears run down like a river day and night: give thyself no rest; let not the apple of thine eye cease.", "19": "Arise, cry out in the night: in the beginning of the watches pour out thine heart like water before the face of the Lord: lift up thy hands toward him for the life of thy young children, that faint for hunger in the top o ia/14/#v1", "ref": "Zach 14:1", "svLabel": null}], "kinderen": []}]}, {"topic": "Swaddle", "href": "../../nave/s/#t-swaddle", "kinderen": [{"label": "(Wrapping, bundling)", "href": "../../nave/s/?hl=Lam.2.22#i19788", "refs": [], "kinderen": [{"label": "Of children", "href": "../../nave/s/?hl=Lam.2.22#i19789", "refs": [{"disp": "Job 38:9", "href": "../../job/38/#v9", "ref": "Job 38:9", "svLabel": null}, {"disp": "Klaagl 2:22", "href": "../../klaagliederen/2/#v22", "ref": "Klaagl 2:22", "svLabel": null}, {"disp": "Ezech 16:4", "href": "../../ezechiel/16/#v4", "ref": "Ezech 16:4", "svLabel": null}, {"disp": "Luk 2:7", "href": "../../lukas/2/#v7", "ref": "Luk 2:7", "svLabel": null}, {"disp": "Luk 2:12", "href": "../../lukas/2/#v12", "ref": "Luk 2:12", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Klaagl 1:3": "Gimel. Juda is in gevangenschap gegaan vanwege de ellende, en vanwege de veelheid van de dienstbaarheid; zij woont onder de heidenen, zij vindt geen rust; al haar vervolgers achterhalen haar tussen de engten.", "Jer 4:4": "Besnijd u voor de HEERE en doe de voorhuiden van uw hart weg, mannen van Juda en inwoners van Jeruzalem! Anders zal Mijn grimmigheid uitvaren als een vuur, en branden zodat niemand het kan blussen, vanwege de slechtheid van uw daden.", "Ezra 7:27": "Geloofd zij de HEERE, de God van onze vaderen, Die zoiets in het hart van de koning gegeven heeft, om het huis van de HEERE te versieren, dat te Jeruzalem is.", "Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "Lev 19:3": "Want ieder zal zijn moeder en zijn vader vrezen, en Mijn sabbatten houden; Ik ben de HEERE, uw God!", "Ezech 46:9": "Maar als het volk van het land voor het aangezicht van de HEERE komt, op de vastgestelde feesten, dan zal wie door de weg van de noorderpoort binnengaat om te aanbidden, door de weg van de zuiderpoort weer uitgaan; en wie door de weg van de zuiderpoort binnengaat, zal door de weg van de noorderpoort weer uitgaan; hij zal niet terugkeren door de weg van de poort waardoor hij binnengekomen is, maar recht voor zich uit naar buiten gaan.", "Ps 71:12": "O God, wees niet ver van mij; mijn God! haast U tot mijn hulp.", "Klaagl 1:1": "Aleph. Hoe zit die stad zo eenzaam, die vol volk was; zij is als een weduwe geworden, zij, die groot was onder de heidenen, een vorstin onder de landschappen, is cijnsbaar geworden.", "Jes 51:17-20": "Word wakker, word wakker, sta op, Jeruzalem! U die gedronken hebt uit de hand van de HEERE de beker van Zijn grimmigheid; de droesem van de beker van de zwijmeling hebt u gedronken, ja, uitgezogen. Er is niemand van al de kinderen, die zij gebaard heeft, die haar zachtjes leidt; en niemand van al de kinderen, die zij opgevoed heeft, die haar bij de hand grijpt. Deze twee dingen zijn u overkomen, wie heeft medelijden met u? Er is verwoesting, en verbreking, en honger, en zwaard, door wie zal Ik u troosten?", "Matt 14:30": "Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij!", "Ezech 7:8": "Nu zal Ik binnenkort Mijn grimmigheid over u uitgieten, en Mijn toorn tegen u volbrengen, en u richten naar uw wegen, en zal op u brengen al uw gruwelen.", "1 Sam 28:18": "Zoals u naar de stem van de HEERE niet geluisterd hebt, en de gloed van Zijn toorn niet uitgevoerd hebt tegen Amalek; daarom heeft de HEERE u deze zaak aangedaan op deze dag.", "Jer 51:45": "Ga uit, Mijn volk, uit haar midden, en red ieder zijn ziel, vanwege de gloed van de toorn van de HEERE.", "Klaagl 3:49": "Ain. Mijn oog vliet, en kan niet ophouden, omdat er geen rust is;", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Jer 51:50": "U die ontkomen bent aan het zwaard, ga weg, en blijf niet staan; gedenk de HEERE van verre, en laat Jeruzalem in uw hart opkomen.", "Jes 5:5": "Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.", "Jer 23:22": "Maar als zij in Mijn raad hadden gestaan, dan zouden zij Mijn volk Mijn woorden hebben laten horen, en zouden hen hebben afgekeerd van hun boze weg, en van de boosheid van hun handelingen.", "Jer 3:12": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden.", "Jer 51:37": "En Babel zal worden tot steenhopen, een woning van draken, een ontzetting en aanfluiting, zodat er geen inwoner is.", "Ex 31:13-17": "Spreek u nu tot de kinderen van Israël: U zult zeker Mijn sabbatten onderhouden; want dit is een teken tussen Mij en u, bij uw geslachten; opdat men weet, dat Ik de HEERE ben, Die u heilig maakt. Onderhoud dan de sabbat, omdat hij u heilig is! Wie hem ontheiligt, zal zeker gedood worden; want ieder die daarop enig werk doet, die ziel zal uitgeroeid worden uit het midden van haar volken. Zes dagen zal men het werk doen; maar op de zevende dag is de sabbat van de rust, een heiligheid van de HEERE! Wie op de sabbatdag arbeid doet, zal zeker gedood worden.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "Jes 14:12-15": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! hoe bent u ter aarde neergehouwen, u die de heidenvolken verzwakte! En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden. Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "2 Sam 5:20": "Toen kwam David bij Baäl-Perazim; en David sloeg hen daar, en zei: De HEERE heeft mijn vijanden voor mijn aangezicht uiteengeslagen, zoals een doorbraak van water; daarom noemde hij die plaats Baäl-Perazim.", "Jer 6:25": "Gaat niet uit in het veld, en wandelt niet op de weg; want het zwaard van de vijand is er, schrik van rondom!", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Jer 14:13-16": "Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats. En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart. Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden.", "Joh 10:5": "Maar een vreemde zullen zij nooit volgen, maar zij zullen van hem wegvluchten; omdat zij de stem van de vreemden niet kennen.", "Jer 14:13-15": "Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats. En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart. Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden.", "Jes 9:15": "Want de leiders van dit volk zijn verleiders, en die door hen geleid worden, worden ingeslokt.", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "Jer 14:19-21": "Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking. HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd. Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.", "Klaagl 1:7": "Zain. Jeruzalem is, in de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.", "1 Kon 9:7-9": "Dan zal Ik Israël uitroeien van het land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen; en Israël zal tot een spreekwoord en spotrede zijn onder alle volken. En aangaande dit huis, dat verheven zal geweest zijn, ieder die eraan voorbijgaat zal zich ontzetten en fluiten; men zal zeggen: Waarom heeft de HEERE zo gedaan aan dit land en aan dit huis? En men zal zeggen: Omdat zij de HEERE, hun God, verlaten hebben, Die hun vaderen uit het land Egypte uitgevoerd had, en zich aan andere goden gehouden hebben, en zich voor hen neergebogen, en hen gediend; daarom heeft de HEERE al dit kwaad over hen gebracht.", "1 Sam 28:6": "En Saul vroeg de HEERE, maar de HEERE antwoordde hem niet; niet door dromen, niet door de Urim, niet door de profeten.", "Ps 35:16": "Onder spotachtige tafelbroeders die huichelden, knerste men over mij met de tanden.", "Ex 32:11": "Doch Mozes smeekte de HEERE zijn God, en zei: O HEERE, waarom zou Uw toorn ontsteken tegen Uw volk, dat Gij met grote kracht en met een sterke hand uit Egypteland hebt uitgevoerd?", "2 Kron 8:16": "Zo werd al het werk van Salomo klaargemaakt, tot de dag van de grondlegging van het huis van de HEERE, en tot het voltooien ervan, zodat het huis van de HEERE volmaakt werd.", "Jer 51:22": "En door u zal Ik in stukken slaan de man en de vrouw; en door u zal Ik in stukken slaan de oude en de jonge; en door u zal Ik in stukken slaan de jongeling en de jonkvrouw.", "1 Sam 1:15": "Doch Hanna antwoordde en zei: Nee, mijn heer! Ik ben een vrouw, bezwaard van geest; ik heb geen wijn of sterke drank gedronken, maar ik heb mijn ziel uitgegoten voor het aangezicht van de HEERE.", "Jes 66:23": "En het zal gebeuren, dat van de ene nieuwe maan tot de andere, en van de ene sabbat tot de andere, alle vlees zal komen om te aanbidden voor Mijn aangezicht, zegt de HEERE.", "Joh 10:10-13": "De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben. Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen. Maar de huurling, die geen herder is, van wie de schapen niet zelf zijn, ziet de wolf komen, en verlaat de schapen, en vlucht; en de wolf grijpt ze, en verstrooit de schapen.", "2 Sam 12:22": "En hij zei: Toen het kind nog leefde, heb ik gevast en gehuild; want ik zei: Wie weet, de HEERE zou mij misschien genadig kunnen zijn, zodat het kind in leven bleef.", "1 Kor 11:18": "Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;", "1 Kron 9:32": "En uit de kinderen van de Kahathieten, uit hun broeders, waren enigen over de broden van de bereiding, om die elke sabbat te bereiden.", "Ps 88:10-15": "Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?", "Kol 2:8": "Kijk uit dat niemand u als een roof meesleept door de filosofie en loze verleiding, naar de overlevering van de mensen, naar de eerste beginselen van de wereld, en niet naar Christus;", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "Ps 102:3": "Verberg Uw aangezicht niet voor mij, neig Uw oor tot mij ten dage van mijn benauwdheid; ten dage als ik roep, verhoor mij haastig.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Jer 17:18": "Laat mijn vervolgers beschaamd worden, maar laat mij niet beschaamd worden; laat hen verschrikt worden, maar laat mij niet verschrikt worden; breng over hen de dag van het kwaad, en verbreek hen met een dubbele verbreking.", "Klaagl 1:8": "Cheth. Jeruzalem heeft zwaar gezondigd, daarom is zij als een afgezonderde vrouw geworden; allen, die haar eerden, achten haar onwaard, omdat zij haar naaktheid gezien hebben; zij zucht ook, en zij is achterwaarts gekeerd.", "Klaagl 4:5": "He. Die lekkernijen aten, komen nu om op de straten; die in karmozijn zijn grootgebracht, omhelzen de vuilnishoop.", "Jer 14:8": "O Israëls Verwachting, Zijn Verlosser in tijd van benauwdheid! Waarom zou U zijn als een vreemdeling in het land, en als een reiziger die slechts inkeert om te overnachten?", "Job 16:15": "Ik heb een zak over mijn huid genaaid; ik heb mijn hoorn in het stof gedaan.", "Jer 7:20": "Daarom zegt de Heere HEERE zo: Zie, Mijn toorn en Mijn grimmigheid zal uitgestort worden over deze plaats, over de mensen en over de dieren, en over de bomen van het veld, en over de vrucht van het aardrijk; en het zal branden, en niet uitgeblust worden.", "Luk 10:18": "En Hij zei tegen hen: Ik zag de satan als een bliksem uit de hemel vallen.", "Ps 71:9": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.", "Jer 23:1": "Wee de herders, die de schapen van Mijn weide ombrengen en verstrooien! spreekt de HEERE.", "2 Tim 2:14-18": "Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders. Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt. Maar verzet u tegen het ongoddelijk ijdel geklets; want zij zullen in meerdere goddeloosheid toenemen.", "Jer 23:11-17": "Want zowel profeten als priesters zijn huichelaars; zelfs in Mijn huis vind Ik hun boosheid, spreekt de HEERE. Daarom zal hun weg voor hen zijn als zeer gladde plaatsen in de duisternis; zij zullen voortgedreven worden en daarin vallen; want Ik zal een kwaad over hen brengen in het jaar van hun bezoeking, spreekt de HEERE. Ik heb wel dwaasheid gezien in de profeten van Samaria; zij profeteerden door Baäl, en verleidden Mijn volk Israël.", "Matt 27:46": "En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Num 7:9": "Maar aan de zonen van Kohath gaf hij niets; want de dienst van de heilige dingen die op hen rustte, moesten zij op de schouders dragen.", "2 Kon 12:10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Jer 33:3": "Roep tot Mij, en Ik zal u antwoorden, en Ik zal u grote en vaste dingen bekendmaken, die u niet weet.", "Klaagl 4:11": "Caph. De HEERE heeft Zijn grimmigheid volbracht, Hij heeft de gloed van Zijn toorn uitgestort; en Hij heeft in Sion een vuur aangestoken, dat haar fundamenten verteerd heeft.", "Mark 15:29": "En zij die voorbijkwamen, lasterden Hem, en schudden hun hoofden, en zeiden: Ha! U die de tempel afbreekt, en in drie dagen opbouwt,", "Ex 16:5": "En het zal gebeuren op de zesde dag, dat zij klaarmaken wat zij ingebracht zullen hebben; dat zal dubbel zijn boven wat zij dagelijks verzamelen.", "Jer 36:5": "En Jeremia gebood Baruch: Ik word tegengehouden, ik zal niet in het huis van de HEERE kunnen gaan.", "Ps 74:9": "Wij zien onze tekens niet; er is geen profeet meer, en er is niemand bij ons die weet hoe lang.", "Est 3:13": "De brieven nu werden gezonden door de hand van de lopers naar alle landschappen van de koning, dat men zou uitroeien, doden en ombrengen alle Joden, van jong tot oud toe, de kleine kinderen en de vrouwen, op één dag, op de dertiende van de twaalfde maand (dat is de maand Adar), en dat men hun buit zou roven.", "Hebr 4:9": "Er blijft dan een rust over voor het volk van God.", "2 Kron 20:8": "Zij nu hebben daarin gewoond, en zij hebben U daarin een heiligdom gebouwd voor Uw Naam, en zeiden:", "Klaagl 1:19": "Koph. Ik riep tot mijn liefhebbers, maar zij hebben mij bedrogen; mijn priesters en mijn oudsten hebben in de stad de geest gegeven, toen zij voedsel voor zich zochten, opdat zij hun ziel mochten verkwikken.", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Num 4:12": "Zij zullen ook al het gereedschap van de dienst nemen, waarmee zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen het met een deksel van dassenvellen bedekken; en zij zullen het op de draagboom leggen.", "Ps 106:23": "Daarom zei Hij dat Hij hen zou verdelgen, ware het niet dat Mozes, Zijn uitverkorene, in de scheur voor Zijn aangezicht gestaan had, om Zijn grimmigheid af te keren, zodat Hij hen niet verdierf.", "Luk 10:15": "En u, Kapernaüm, die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden.", "Deut 28:50": "Een volk, hard van gezicht, dat geen ontzag zal hebben voor de oude, noch genadig zal zijn voor de jonge.", "Ezech 13:1-23": "En het woord van de HEERE gebeurde tot mij, en zei: Mensenkind, profeteer tegen de profeten van Israël, die profeteren, en zeg tegen hen die uit hun eigen hart profeteren: Hoor het woord van de HEERE. Zo zegt de Heere HEERE: Wee over die dwaze profeten, die hun eigen geest nawandelen, en wat zij niet gezien hebben!", "1 Joh 4:1-3": "Geliefden, geloof niet elke geest, maar beproef de geesten, of zij uit God zijn; want veel valse profeten zijn uitgegaan in de wereld. Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God; en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.", "Jer 23:32": "Zie, Ik wil tegen hen die valse dromen profeteren, spreekt de HEERE, en ze vertellen, en Mijn volk verleiden met hun leugens en met hun lichtvaardigheid; terwijl Ik hen niet gezonden heb, en hun niets bevolen heb, en zij dit volk in het geheel geen nut doen, spreekt de HEERE.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Ps 77:3": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden.", "Jes 64:11": "Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Ezech 44:24": "En bij een rechtszaak zullen zij staan om te oordelen; naar Mijn rechten zullen zij hen oordelen; en zij zullen Mijn wetten en Mijn inzettingen op al Mijn vastgestelde hoogtijden houden, en Mijn sabbatten heiligen.", "2 Kron 36:14": "Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "Mal 2:9": "Daarom heb Ik u ook verachtelijk en onwaard gemaakt voor heel het volk, omdat u Mijn wegen niet houdt, maar partijdig bent in de wet.", "Ps 78:21": "Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "1 Kor 3:1-4": "En ik, broeders, kon tot u niet spreken als tot geestelijken, maar als tot vleselijken, als tot jonge kinderen in Christus. Ik heb u met melk gevoed, en niet met vaste spijs; want u kon toen nog niet; ja, u kunt ook nu nog niet. Want u bent nog vleselijk; want omdat er onder u nijd is, en twist, en tweedracht, bent u niet vleselijk, en wandelt u niet naar de mens?", "Luk 23:54": "En het was de dag van de voorbereiding, en de sabbat brak aan.", "Ps 60:3-5": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Jes 13:6": "Huil, want de dag van de HEERE is nabij; hij komt als een verwoesting van de Almachtige.", "Ps 89:47": "Hoe lang, o HEERE! zult Gij U steeds verbergen, zal Uw grimmigheid branden als een vuur?", "Jes 36:22": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, naar Hizkia met gescheurde kleren; en zij vertelden hem de woorden van Rabsake.", "Jer 29:8": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Laat uw profeten en uw waarzeggers, die in uw midden zijn, u niet bedriegen, en luistert niet naar uw dromers, die u laat dromen.", "Ps 31:10": "Wees mij genadig, HEERE! Want ik heb het benauwd; van verdriet is mijn oog doorknaagd, mijn ziel en mijn buik.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Jes 26:5": "Want Hij buigt de hooggezetenen neer, de verheven stad; Hij vernedert haar, Hij vernedert haar tot de aarde toe, Hij doet haar tot aan het stof reiken.", "Lev 26:29": "Want u zult het vlees van uw zonen eten, en het vlees van uw dochters zult u eten.", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "Ps 90:15": "Verblijd ons naar de dagen, waarin U ons gedrukt hebt, naar de jaren, waarin wij het kwaad gezien hebben.", "Ezech 32:8": "Alle lichtende lichten aan de hemel, die zal Ik om uwentwil zwart maken; en Ik zal een duisternis over uw land brengen, spreekt de Heere HEERE.", "Amos 5:13": "Daarom zal de verstandige in die tijd zwijgen, want het zal een slechte tijd zijn.", "Micha 3:12": "Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud.", "Jes 62:6": "O Jeruzalem! Ik heb wachters op uw muren aangesteld, die voortdurend, de hele dag en de hele nacht, niet zullen zwijgen. U die de HEERE doet gedenken, laat geen stilzwijgen bij u zijn!", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Hos 3:4": "Want de kinderen van Israël zullen veel dagen blijven zitten, zonder koning, en zonder vorst, en zonder offer, en zonder opgericht beeld, en zonder efod en terafim.", "Jer 23:21": "Ik heb die profeten niet gezonden, toch hebben zij gelopen; Ik heb tot hen niet gesproken, toch hebben zij geprofeteerd.", "Ps 74:19": "Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig.", "Jer 20:1": "Toen Pashur, de zoon van Immer, de priester (deze was aangesteld als voorganger in het huis van de HEERE), Jeremia hoorde deze woorden profeteren,", "Neh 6:9": "Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!", "Mark 2:27": "En Hij zei tegen hen: De sabbat is gemaakt om de mens, niet de mens om de sabbat.", "Ps 119:148": "Mijn ogen komen de nachtwaken voor, om Uw rede te betrachten.", "Jer 23:11-15": "Want zowel profeten als priesters zijn huichelaars; zelfs in Mijn huis vind Ik hun boosheid, spreekt de HEERE. Daarom zal hun weg voor hen zijn als zeer gladde plaatsen in de duisternis; zij zullen voortgedreven worden en daarin vallen; want Ik zal een kwaad over hen brengen in het jaar van hun bezoeking, spreekt de HEERE. Ik heb wel dwaasheid gezien in de profeten van Samaria; zij profeteerden door Baäl, en verleidden Mijn volk Israël.", "Ex 23:12": "Zes dagen zult u uw werk doen; maar op de zevende dag zult u rusten; opdat uw os en uw ezel rusten, en de zoon van uw dienstmaagd en de vreemdeling op adem komen.", "Matt 15:9": "Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Ezech 23:38": "Nog hebben zij Mij dit aangedaan: zij hebben Mijn heiligdom op diezelfde dag verontreinigd, en Mijn sabbatten ontheiligd.", "Rom 16:18": "Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.", "Openb 16:19": "En de grote stad werd in drie delen gescheurd, en de steden van de heidenvolken vielen; en aan het grote Babylon werd gedacht voor God, om haar de drinkbeker te geven van de wijn van de toorn van Zijn gramschap.", "Hand 17:2": "En Paulus ging, zoals hij gewoon was, bij hen naar binnen, en drie sabbatten lang sprak hij met hen uit de Schriften,", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Ps 35:25": "Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!", "Luk 9:46": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.", "Rom 2:19-25": "En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn, Een onderrichter van de onwijzen, en een leermeester van de onwetenden, terwijl u de vorm van de kennis en van de waarheid in de wet hebt. Die dan een ander leert, leert u uzelf niet? Die predikt dat men niet zal stelen, steelt u?", "2 Kon 12:9": "Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "2 Kon 4:23": "En hij zei: Waarom gaat u vandaag naar hem toe? Het is geen nieuwe maan, en ook geen sabbat. En zij zei: Het zal goed zijn.", "Ps 10:12-15": "Sta op, HEERE God! Hef Uw hand op, vergeet de ellendigen niet. Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken? U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Ps 37:12": "Zain. De goddeloze bedenkt listige plannen tegen de rechtvaardige, en knerst met zijn tanden over hem.", "Ps 73:17": "Totdat ik in Gods heiligdommen inging, en op hun einde lette.", "2 Petr 3:16": "Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.", "Neh 1:3": "En zij zeiden tegen mij: De overgeblevenen, die van de gevangenschap daar in het gebied zijn overgebleven, zijn in grote ellende en in smaad; en de muur van Jeruzalem is afgebroken, en haar poorten zijn met vuur verbrand.", "Jer 30:14": "Al uw minnaars hebben u vergeten, zij vragen niet naar u; want Ik heb u geslagen met de plaag van een vijand, met de kastijding van iemand wrede; om de grootheid van uw ongerechtigheid, omdat uw zonden machtig veel zijn.", "1 Sam 15:3": "Ga nu heen, en sla Amalek, en verban alles wat hij heeft, en verschoon hem niet; maar dood van de man af tot de vrouw toe, van de kinderen tot de zuigelingen, van de ossen tot de schapen, van de kamelen tot de ezels toe.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Ps 142:2": "Ik riep met mijn stem tot de HEERE; ik smeekte tot de HEERE met mijn stem.", "Luk 2:7": "En zij baarde haar eerstgeboren Zoon, en wond Hem in doeken, en legde Hem neer in de kribbe, omdat er voor hen geen plaats was in de herberg.", "Ezech 28:14-16": "U was een gezalfde, beschermende cherub; en Ik had u zo gezet; u was op de heilige berg van God; u wandelde in het midden van de vurige stenen. U was volkomen in uw wegen, vanaf de dag dat u geschapen bent, totdat er ongerechtigheid in u gevonden is. Door de veelheid van uw koophandel hebben zij het midden van u met geweld vervuld, en u hebt gezondigd; daarom zal Ik u ontheiligen van de berg van God, en zal Ik u, beschermende cherub, wegvagen uit het midden van de vurige stenen!", "Jer 19:8": "En Ik zal deze stad zetten tot een ontzetting en tot een aanfluiting; ieder die haar voorbijgaat, zal zich ontzetten en fluiten over al haar plagen.", "Ezech 44:10": "Maar de Levieten die ver van Mij weggegaan zijn, toen Israël ging dolen, die van Mij zijn afgedwaald, hun drekgoden  achterna, zullen wel hun ongerechtigheid dragen;", "Jer 19:9": "En Ik zal hun het vlees van hun zonen en het vlees van hun dochters doen eten, en zij zullen eten, ieder het vlees van zijn naaste, in de belegering en in de benauwing, waarmee hun vijanden, en zij die hun ziel zoeken, hen benauwen zullen.", "Jer 33:4": "Want zo zegt de HEERE, de God van Israël, van de huizen van deze stad, en van de huizen van de koningen van Juda, die door de wallen en door het zwaard zijn afgebroken:", "Jer 49:3": "Huil, o Hesbon! want Ai is verwoest; roep, dochters van Rabba, gord zakken aan, drijf misbaar, en loop heen en weer bij de tuinen; want Malcham zal wandelen in gevangenschap, zijn priesters en zijn vorsten samen.", "Klaagl 5:14": "De oudsten houden op met zitten in de poort, de jongemannen met hun snarenspel.", "Ps 99:5": "Verhef de HEERE, onze God, en buig u neer voor de voetbank van Zijn voeten; Hij is heilig!", "Ezech 2:10": "En Hij spreidde die voor mijn gezicht uit; en zij was beschreven vóór en achter; en daarin waren klaagliederen geschreven, en gezucht, en wee.", "Ps 74:3-8": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven. Uw tegenstanders hebben in het midden van Uw vergaderplaatsen gebruld; zij hebben hun eigen tekens tot tekens gesteld. Ieder werd erkend als iemand die de bijlen omhoog hanteert in het dichte geboomte.", "Ps 48:3": "Schoon van ligging, een vreugde van de hele aarde is de berg Sion, aan de zijden van het noorden; de stad van de grote Koning.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "1 Kon 8:36-50": "hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt. Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn; elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Micha 2:11": "Als er iemand is die met wind omgaat en vals liegt, en zegt: Ik zal u profeteren van wijn en van sterke drank! dan is dat een profeet voor dit volk.", "2 Kon 11:4": "In het zevende jaar zond Jojada, en nam de leiders van honderd met de hoofdmannen en met de lijfwacht, en hij bracht hen bij zich, in het huis van de HEERE; en hij sloot een verbond met hen en beëdigde hen in het huis van de HEERE, en hij toonde hun de zoon van de koning.", "Hand 6:14": "Want wij hebben hem horen zeggen dat deze Jezus, de Nazarener, deze plaats zal afbreken, en de gebruiken zal veranderen die Mozes ons heeft overgeleverd.", "Lev 21:12": "En uit het heiligdom zal hij niet weggaan, opdat hij het heiligdom van zijn God niet ontheiligt, want de kroon van de zalfolie van zijn God is op hem; Ik ben de HEERE!", "2 Petr 2:1-3": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen; En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden. En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "1 Kon 6:37": "In het vierde jaar werd de grond van het huis van de HEERE gelegd, in de maand Ziv;", "Luk 6:39": "En Hij vertelde hun een gelijkenis: Kan een blinde soms een blinde leiden? Zullen zij niet beiden in de kuil vallen?", "Jona 2:1": "En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis.", "Neh 9:32": "Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag.", "Ps 116:4": "Maar ik riep de Naam van de HEERE aan: Och HEERE, bevrijd mijn ziel.", "Hand 7:54": "Toen zij dit hoorden, brak dit hun harten, en zij knersten met de tanden tegen hem.", "Jer 31:18": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God!", "Zach 11:5": "Die hen bezitten doden hen, en houden het niet voor schuld; en ieder van hen die ze verkopen, zegt: Geloofd zij de HEERE, dat ik rijk geworden ben! En niemand van hen die ze weiden, ontziet ze.", "Klaagl 2:17-19": "Ain. De HEERE heeft gedaan wat Hij Zich had voorgenomen, Hij heeft Zijn woord vervuld, dat Hij bevolen had van oude dagen af; Hij heeft afgebroken en niet gespaard; en Hij heeft de vijand over u verblijd, Hij heeft de hoorn van uw tegenstanders verhoogd. Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op! Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "Jer 30:24": "De gloed van de toorn van de HEERE zal zich niet afwenden, totdat Hij het gedaan heeft, en totdat Hij tot stand gebracht heeft de gedachten van Zijn hart; in het laatste van de dagen zult u daarop letten.", "Ps 119:28": "Mijn ziel druipt weg van treurigheid; richt mij op naar Uw woord.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "Jes 58:12": "En zij die uit u voortkomen, zullen de oude verwoeste plaatsen bouwen; de fundamenten, van geslacht tot geslacht verwoest, zult u oprichten; en u zult genoemd worden: Die de bressen dichtmuurt, die de paden weer opmaakt, om te bewonen.", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Jes 8:19": "Wanneer zij dan tegen u zeggen zullen: Vraag waarzeggers en duivelskunstenaars, die daar piepen en binnensmonds mompelen; zo zeg: Zal een volk niet zijn God vragen? Zal men voor de levenden de doden vragen?", "Neh 10:31": "Ook als de volken van het land waren en alle koren op de sabbatdag ten verkoop zouden brengen, dat wij op de sabbat, of op een andere heilige dag, niets van hen zouden nemen; en dat wij het zevende jaar zouden vrij laten, alsook allerlei bezwaarnis.", "Matt 24:26": "Als zij dan tegen u zullen zeggen: Kijk, hij is in de woestijn, ga er niet heen; Kijk, hij is in de binnenkamers, geloof het niet.", "Jer 17:26": "En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Jes 1:13": "Breng niet meer een nutteloos offer; het reukwerk is Mij een gruwel; de nieuwe manen, en sabbatten, en het bijeenroepen van de samenkomsten kan Ik niet verdragen, het is ongerechtigheid, zelfs de verbodsdagen.", "Ps 31:15-19": "Maar ik vertrouw op U, o HEERE! Ik zeg: U bent mijn God. Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers. Laat Uw aangezicht over Uw knecht lichten; verlos mij door Uw goedertierenheid.", "Jer 18:21": "Daarom, geef hun zonen over aan de honger, en doe hen wegvloeien door het geweld van het zwaard, en laat hun vrouwen van kinderen beroofd en weduwe worden, en laat hun mannen door de dood omgebracht worden, en hun jongemannen met het zwaard geslagen worden in de strijd.", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Ps 74:11": "Waarom trekt U Uw hand, ja, Uw rechterhand terug? Trek haar uit het midden van Uw boezem; maak er een einde aan.", "Klaagl 1:12": "Lamed. Gaat het u niet aan, u allen, die over de weg gaat? Schouwt het aan en ziet, of er een smart is gelijk mijn smart, die mij aangedaan is, waarmee de HEERE mij bedroefd heeft ten dage van de gloed van Zijn toorn.", "Jer 5:10": "Beklim haar muren, en verwoest ze (maar maak er geen einde aan); haal haar tinnen weg, want zij zijn niet van de HEERE.", "Ezech 32:7": "En als Ik u zal uitblussen, zal Ik de hemel bedekken en zijn sterren zwart maken; Ik zal de zon met wolken bedekken, en de maan zal haar licht niet laten schijnen.", "Jes 63:18": "Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden.", "Ps 10:1": "HEERE, waarom staat U ver weg? Waarom verbergt U Zich in tijden van benauwdheid?", "Ps 119:39": "Wend mijn smaad af, die ik vrees, want Uw rechten zijn goed.", "Jer 16:2-4": "U zult zich geen vrouw nemen, en u zult geen zonen of dochters hebben in deze plaats. Want zo zegt de HEERE van de zonen en van de dochters, die in deze plaats geboren worden; en van hun moeders, die hen baren, en van hun vaders, die hen verwekken in dit land: Zij zullen pijnlijke doden sterven, zij zullen niet beklaagd en niet begraven worden, zij zullen tot mest op de aardbodem zijn, en zij zullen door het zwaard en door de honger verteerd worden, en hun dode lichamen zullen voedsel zijn voor de vogels van de hemel en voor de dieren van de aarde.", "Jes 13:18": "Maar hun bogen zullen de jongemannen verpletteren, en zij zullen zich niet ontfermen over de vrucht van de buik; hun oog zal de kinderen niet ontzien.", "Ps 62:9": "Vertrouw op Hem te allen tijde, o volk! Stort uw hart uit voor Zijn aangezicht; God is ons een Toevlucht. Sela.", "Matt 20:20-27": "Toen kwam de moeder van de zonen van Zebedeüs met haar zonen naar Hem toe, boog zich voor Hem neer, en vroeg Hem iets. En Hij zei tegen haar: Wat wilt u? Zij zei tegen Hem: Zeg dat deze twee zonen van mij mogen zitten, de een aan Uw rechterhand en de ander aan Uw linkerhand in Uw Koninkrijk. Maar Jezus antwoordde en zei: U weet niet wat u vraagt; kunt u de drinkbeker drinken die Ik drinken zal, en met de doop gedoopt worden waarmee Ik gedoopt word? Zij zeiden tegen Hem: Wij kunnen dat.", "Gal 1:6-8": "Ik verwonder mij dat u zo snel, wijkend van hem die u in de genade van Christus geroepen heeft, overgebracht wordt naar een ander evangelie; terwijl er geen ander is; maar er zijn sommigen die u in verwarring brengen, en het Evangelie van Christus willen verdraaien. Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "Jes 9:20": "Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ps 109:1-31": "Een psalm van David, voor de koorleider. O God van mijn lof! Zwijg niet. Want de mond van de goddeloze en de mond van het bedrog zijn tegen mij opengedaan; zij hebben tegen mij gesproken met een valse tong. En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak.", "Hand 7:59": "En zij stenigden Stefanus, terwijl hij aanriep en zei: Heere Jezus, ontvang mijn geest.", "Jes 56:10-12": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief. En deze honden zijn sterk van begeerte, zij kunnen niet verzadigd worden, ja, het zijn herders die niets kunnen begrijpen; zij keren zich allemaal naar hun eigen weg, ieder naar zijn eigen winst, elk uit zijn eigen hoek. Kom hier, zeggen zij: ik zal wijn halen, en wij zullen ons vol drinken met sterke drank; en de dag van morgen zal zijn als deze, ja, nog groter, veel overvloediger.", "1 Kron 22:11": "Nu, mijn zoon, de HEERE zal met u zijn, en u zult voorspoedig zijn, en u zult het huis van de HEERE, van uw God, bouwen, zoals Hij van u gesproken heeft.", "Hos 13:11": "Ik gaf u een koning in Mijn toorn en nam hem weg in Mijn woede.", "Job 27:22": "En God zal dit over hem werpen, en niet sparen; van Zijn hand zal hij snel vlieden.", "Num 28:10": "Het is het brandoffer van de sabbat op elke sabbat, boven het voortdurende brandoffer, en zijn drankoffer.", "Jer 27:16": "Ook sprak ik tot de priesters, en tot heel dit volk, en zei: Zo zegt de HEERE: Luister niet naar de woorden van uw profeten, die u profeteren en zeggen: Zie, de voorwerpen van het huis van de HEERE zullen nu spoedig uit Babel teruggebracht worden; want zij profeteren u leugens.", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "2 Sam 22:7": "Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; en Hij hoorde mijn stem uit Zijn paleis, en mijn geroep kwam in Zijn oren.", "Openb 18:19": "En zij wierpen stof op hun hoofden, en riepen, wenend en rouw bedrijvend, en zeiden: Wee, wee, de grote stad, waarin allen die schepen op de zee hadden, rijk geworden zijn van haar kostbaarheid; want zij is in één uur verwoest.", "Deut 9:18-20": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken. Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment. Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.", "Hos 9:8": "De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.", "Ps 44:15": "U stelt ons tot een spreekwoord onder de heidenvolken, tot een hoofdschudden onder de volken.", "Richt 10:7": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten.", "Jer 13:20": "Hef uw ogen op, en zie hen die daar uit het noorden komen! Waar is de kudde die u gegeven was, de schapen van uw heerlijkheid?", "Ps 80:15": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,", "1 Kon 8:10": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.", "Job 16:20": "Mijn vrienden bespotten mij; maar mijn oog druipt tot God.", "Ezech 44:8": "En u hebt de wacht van Mijn heilige dingen niet in acht genomen; maar u hebt uzelf enigen tot wachters van Mijn wacht gesteld in Mijn heiligdom.", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Ps 71:4": "Mijn God, bevrijd mij van de hand van de goddeloze, van de hand van hem die verkeerd handelt, en van de opgeblazene.", "Jer 23:20": "De toorn van de HEERE zal zich niet afwenden, totdat Hij het zal hebben gedaan, en totdat Hij de gedachten van Zijn hart tot stand zal hebben gebracht; in de laatste dagen zult u dat met verstand inzien.", "Klaagl 3:28": "Jod. Hij zit eenzaam, en zwijgt stil, omdat Hij het hem opgelegd heeft.", "Ezech 7:18": "Ook zullen zij zakken aangorden, gruwen zal hen bedekken, en over alle gezichten zal schaamte zijn, en op al hun hoofden kaalheid.", "Matt 24:20": "Bid dat uw vlucht niet gebeurt in de winter, en ook niet op een sabbat.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Ps 71:2": "Red mij door Uw gerechtigheid, en bevrijd mij; neig Uw oor tot mij, en verlos mij.", "Gen 43:14": "En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Jer 23:30-32": "Daarom, zie, Ik wil tegen de profeten, spreekt de HEERE, die Mijn woorden stelen, ieder van zijn naaste; Zie, Ik wil tegen de profeten, spreekt de HEERE, die hun tong gebruiken, en spreken: Hij heeft het gesproken; Zie, Ik wil tegen hen die valse dromen profeteren, spreekt de HEERE, en ze vertellen, en Mijn volk verleiden met hun leugens en met hun lichtvaardigheid; terwijl Ik hen niet gezonden heb, en hun niets bevolen heb, en zij dit volk in het geheel geen nut doen, spreekt de HEERE.", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Jer 52:11-27": "En hij verblindde de ogen van Zedekia, en hij bond hem met twee koperen ketenen; zo bracht de koning van Babel hem naar Babel, en stelde hem in de gevangenis, tot de dag van zijn dood toe. Daarna, in de vijfde maand, op de tiende van de maand (dit jaar was het negentiende jaar van koning Nebukadrezar, de koning van Babel), toen Nebuzaradan, de leider van de lijfwacht, die voor het aangezicht van de koning van Babel stond, in Jeruzalem gekomen was; Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur.", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Jes 26:17": "Zoals een zwangere vrouw, als zij nadert tot het baren, smarten heeft en schreeuwt in haar weeën, zo zijn wij geweest, o HEERE, vanwege Uw aangezicht.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Mal 1:4": "Ofschoon Edom zei: Wij zijn arm geworden, maar wij zullen de verwoeste plaatsen weer opbouwen; zo zegt de HEERE van de heerscharen: Zullen zij bouwen, dan zal Ik afbreken; en men zal hen noemen: Gebied van de goddeloosheid, en een volk, op wie de HEERE toornig is tot in eeuwigheid.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "Luk 4:31": "En Hij kwam af naar Kapernaüm, een stad van Galilea, en leerde hen op de sabbatdagen.", "1 Kor 3:10-16": "Naar de genade van God, die mij gegeven is, heb ik als een wijs bouwmeester het fundament gelegd; en een ander bouwt daarop. Maar ieder ziet toe hoe hij daarop bouwt. Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus. En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels;", "Ezech 6:12": "Wie ver weg is, zal door de pest sterven, en wie dichtbij is, zal door het zwaard vallen; maar wie overgebleven en belegerd is, zal door honger sterven; zo zal Ik Mijn grimmigheid tegen hen volbrengen.", "Mark 9:18": "En waar hij hem ook aangrijpt, werpt hij hem neer, en hij schuimt, en knarst met zijn tanden, en verstijft; en ik heb Uw discipelen gevraagd dat zij hem zouden uitdrijven, en zij hebben het niet gekund.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "Matt 23:4": "Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Hand 7:49": "De hemel is Mij een troon, en de aarde een voetbank voor Mijn voeten. Wat voor huis zult u Mij bouwen, zegt de Heere, of wat is de plaats van Mijn rust?", "Jes 47:1": "Daal af en ga zitten in het stof, jonkvrouw, dochter van Babel! Zit op de aarde, er is geen troon meer, dochter van de Chaldeeën! Want u zult niet meer genoemd worden de tedere, of de wellustige.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Jes 48:13": "Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Luk 1:69": "en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht;", "Lev 24:8": "Op elke sabbatdag zal men dat voortdurend in orde houden voor het aangezicht van de HEERE, vanwege de Israëlieten, tot een eeuwig verbond.", "1 Sam 1:24": "Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.", "Gen 2:3": "En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.", "Luk 6:1-10": "En het gebeurde op de tweede eerste sabbat, dat Hij door het gezaaide ging; en Zijn discipelen plukten aren en aten ze, terwijl ze die met hun handen fijnwreven. En sommigen van de Farizeeën zeiden tegen hen: Waarom doet u wat niet geoorloofd is te doen op de sabbatten? En Jezus antwoordde hun en zei: Hebt u ook dat niet gelezen, wat David deed toen hij honger had, hij en zij die met hem waren?", "Jer 52:17-23": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden al het koper daarvan naar Babel. Ook namen zij de potten, en de schoffels, en de gaffels, en de sprenkelschalen, en de rookschalen, en al de koperen vaten waarmee men de dienst deed. En de leider van de lijfwacht nam de schalen weg, en de wierookvaten, en de sprenkelschalen, en de potten, en de kandelaars, en de rookschalen, en de kroezen; wat geheel goud, en wat geheel zilver was.", "Ezech 26:4": "Die zullen de muren van Tyrus verderven, en haar torens afbreken; ja, Ik zal haar stof van haar wegvagen, en zal haar tot een gladde steenrots maken.", "Ezech 39:3": "Maar Ik zal uw boog uit uw linkerhand slaan, en Ik zal uw pijlen uit uw rechterhand doen vallen.", "Deut 18:20-22": "Maar de profeet die hoogmoedig handelt door een woord te spreken in Mijn Naam, dat Ik hem niet geboden heb te spreken, of die zal spreken in de naam van andere goden, die profeet zal sterven. Als u dan in uw hart zou zeggen: Hoe zullen wij het woord kennen dat de HEERE niet gesproken heeft? Wanneer die profeet in de Naam van de HEERE gesproken heeft, en dat woord gebeurt niet en komt niet uit, dan is dat het woord dat de HEERE niet gesproken heeft; door trots heeft die profeet dat gesproken; u hoeft niet bevreesd voor hem te zijn.", "Job 2:3": "En de HEERE zei tegen de satan: Hebt u ook acht geslagen op Mijn knecht Job? Want niemand is op de aarde zoals hij, een man, oprecht en vroom, godvrezend en wijkend van het kwaad; en hij houdt nog steeds vast aan zijn oprechtheid, hoewel u Mij tegen hem hebt opgehitst, om hem zonder reden te verslinden.", "Micha 3:7": "En de zieners zullen beschaamd, en de waarzeggers schaamrood worden; en zij zullen allen samen de bovenlip bewimpelen; want er zal geen antwoord van God zijn.", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Ps 80:13": "Waarom hebt U zijn muren doorgebroken, zodat allen die de weg voorbijgaan, hem plukken?", "Jer 27:9": "U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen.", "Ezech 30:3": "Want de dag is dichtbij, ja, de dag van de HEERE is dichtbij, een wolkige dag, het zal de tijd van de heidenvolken zijn.", "Ps 6:8": "Mijn oog is doorknaagd van verdriet, is verouderd, vanwege al mijn tegenstanders.", "Jer 27:9-18": "U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen. Want zij profeteren u leugens, om u ver uit uw land weg te brengen, en dat Ik u wegjaag, en u omkomt. Maar het volk dat zijn hals onder het juk van de koning van Babel zal brengen, en hem dienen, dat zal Ik in zijn land laten blijven, spreekt de HEERE, en het zal het bebouwen en erin wonen.", "Ezech 20:13": "Maar het huis van Israël werd opstandig tegen Mij in de woestijn; zij wandelden niet in Mijn inzettingen, en verwierpen Mijn rechten, die, als een mens ze doet, hij daardoor zal leven; en zij ontheiligden Mijn sabbatten zeer, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten in de woestijn, om hen te verdelgen.", "1 Kron 28:2": "En koning David stond op zijn voeten en zei: Hoor mij, mijn broeders en mijn volk! Ik had het in mijn hart om een huis van rust te bouwen voor de ark van het verbond van de HEERE, en voor de voetbank van de voeten van onze God, en ik heb voorbereidingen getroffen om te bouwen.", "Jer 8:11": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Terwijl er geen vrede is.", "Jer 28:5": "Toen zei de profeet Jeremia tegen de profeet Hananja, voor de ogen van de priesters en voor de ogen van het hele volk, dat in het huis van de HEERE stond;", "Ps 119:107": "Ik ben helemaal zeer verdrukt, HEERE! maak mij levend naar Uw woord.", "Job 38:9": "Toen Ik de wolk tot haar kleding stelde, en de donkerheid tot haar windeldoek;", "Matt 18:33": "had u zich dan ook niet moeten ontfermen over uw mededienstknecht, zoals ik mij over u ontfermd heb?", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Jer 52:14": "En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.", "Openb 14:10": "die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "Ps 85:2-8": "U bent Uw land gunstig geweest, HEERE! De gevangenschap van Jakob hebt U gekeerd. De misdaad van Uw volk hebt U weggenomen; U hebt al hun zonden bedekt. Sela. U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Jes 34:11": "Maar de roerdomp en de nachtuil zullen het erfelijk bezitten, en de uil en de raaf zullen daarin wonen; want Hij zal een meetsnoer van woestheid over hen trekken, en een dieplood van leegte.", "1 Kon 12:31": "Hij maakte ook een huis der hoogten; en maakte priesters van de geringste mensen van het volk, die niet uit de zonen van Levi waren.", "Ex 17:4": "Toen riep Mozes tot de HEERE en zei: Wat moet ik met dit volk doen? Het scheelt niet veel, of zij zullen mij stenigen.", "Mal 2:1-3": "En nu, priesters, dit gebod wordt tot u gezonden. Als u niet zult horen, en als u het niet ter harte zult nemen om Mijn Naam eer te geven, zegt de HEERE van de heerscharen, dan zal Ik de vloek onder u zenden, en Ik zal uw zegeningen vervloeken; ja, Ik heb ook al elk daarvan vervloekt, omdat u het niet ter harte neemt. Zie, Ik zal het zaad voor u verderven; en Ik zal drek op uw gezichten strooien, de drek van uw feesten, zodat men u daarmee wegnemen zal.", "1 Tim 2:8": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.", "Jer 14:2": "Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Jer 51:30": "Babels helden hebben opgehouden te strijden, zij zijn gebleven in de vestingen, hun kracht is bezweken, zij zijn tot vrouwen geworden; zij hebben hun woningen aangestoken, hun grendels zijn verbroken.", "2 Kon 25:9-17": "En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de aanvoerder van de lijfwacht was, brak de muren van Jeruzalem rondom af. Het overige nu van het volk, die in de stad overgelaten waren, en de afvalligen, die tot de koning van Babel gevallen waren, en het overige van de menigte, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk weg.", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "Jer 25:9": "Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden.", "Jes 9:17-20": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook. Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien. Als hij ter rechterhand snijdt, zal hij toch hongeren, en als hij ter linkerhand eet, zal hij toch niet verzadigd worden; ieder zal het vlees van zijn eigen arm eten;", "Jer 26:7": "En de priesters, en de profeten, en al het volk, hoorden Jeremia deze woorden spreken in het huis van de HEERE.", "Jes 5:13": "Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Num 10:21": "Toen trokken de Kohathieten op, dragend het heiligdom; en de anderen richtten de tabernakel op, tegen dat dezen kwamen.", "Ps 128:6": "En u zult uw kleinkinderen zien. Vrede over Israël!", "Ps 31:2-5": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid. Neig Uw oor tot mij, red mij haastig; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden. Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.", "2 Sam 8:2": "Ook sloeg hij de Moabieten, en mat hen met een snoer, en liet hen op de aarde neerliggen; en hij mat met twee snoeren om te doden, en met een vol snoer om in het leven te laten. Zo werden de Moabieten David tot knechten, en zij brachten geschenken.", "1 Sam 1:7": "En zo deed hij jaar op jaar; van toen af dat zij opging naar het huis van de HEERE, zo tergde zij haar steeds; daarom weende zij en at niet.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "2 Kon 25:9": "En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur.", "Ex 33:5": "En de HEERE had tot Mozes gezegd: Zeg tegen de Israëlieten: U bent een hardnekkig volk; in één ogenblik zou Ik in uw midden optrekken, en u vernietigen; doch nu, leg uw sieraad van u af, en Ik zal weten wat Ik u doen zal.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Ps 94:1-23": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend! Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoog
