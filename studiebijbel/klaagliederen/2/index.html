": "Zo zegt de HEERE: Wacht u voor uw zielen, en draag geen last op de sabbatdag, en breng die niet in door de poorten van Jeruzalem.", "Jes 5:20": "Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!", "Jes 26:16": "HEERE, in benauwdheid hebben zij U bezocht; zij hebben hun stil gebed uitgestort, toen Uw tuchtiging over hen was.", "Num 25:3": "Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Jer 29:18": "En Ik zal hen achtervolgen met het zwaard, met de honger en met de pest; en Ik zal hen overgeven aan een verschrikking, in al de koninkrijken van de aarde, tot een vloek, en tot een schrik, en tot een aanfluiting, en tot een smaad, onder al de volken waarheen Ik hen zal hebben verdreven;", "Hand 13:44": "En op de volgende sabbat kwam bijna de hele stad samen om het Woord van God te horen.", "Jer 38:14": "Toen zond de koning Zedekia iemand, en liet de profeet Jeremia bij zich halen, bij de derde ingang die aan het huis van de HEERE was; en de koning zei tegen Jeremia: Ik zal u iets vragen, verberg niets voor mij.", "Joh 5:43": "Ik ben gekomen in de Naam van Mijn Vader, en u neemt Mij niet aan; als een ander komt in zijn eigen naam, die zult u aannemen.", "Deut 28:43": "De vreemdeling die in uw midden is, zal steeds hoger boven u opklimmen; en u zult steeds lager neerdalen.", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "Ps 102:25": "Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht.", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "Deut 31:16": "En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb.", "Ezech 7:21": "En Ik zal het in de hand van de vreemden overgeven ten roof, en aan de goddelozen van de aarde ten buit, en zij zullen het ontheiligen.", "Num 28:9": "Maar op de sabbatdag twee volkomen eenjarige lammeren, en twee tienden meelbloem, als spijsoffer, met olie gemengd, alsook zijn drankoffer.", "2 Kon 19:21": "Dit is het woord dat de HEERE over hem gesproken heeft: De jonkvrouw, de dochter van Sion, verkleint u, zij bespot u, de dochter van Jeruzalem schudt het hoofd achter u aan.", "Ps 140:2-14": "Red mij, HEERE, van de kwade mens; behoed mij voor de man van geweld; Die veel kwaad in het hart bedenken, elke dag komen zij samen om te oorlogen. Zij scherpen hun tong als een slang; heet addervergif is onder hun lippen. Sela.", "Klaagl 3:46": "Pe. Al onze vijanden hebben hun mond tegen ons opgesperd.", "Jer 52:13": "Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur.", "Joh 9:1-34": "Toen Hij voorbijging, zag Hij een man die blind was van zijn geboorte af. En Zijn discipelen vroegen Hem: Rabbi, wie heeft er gezondigd, deze man of zijn ouders, dat hij blind geboren zou worden? Jezus antwoordde: Deze man heeft niet gezondigd, en zijn ouders ook niet, maar dit is gebeurd, opdat de werken van God in hem openbaar zouden worden.", "2 Kron 30:15": "Toen slachtten zij het pascha, op de veertiende dag van de tweede maand; en de priesters en de Levieten waren beschaamd geworden, en hadden zich geheiligd, en hadden brandoffers gebracht in het huis van de HEERE.", "Ps 17:1": "Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.", "Matt 13:42": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Ps 89:25": "En Mijn getrouwheid en Mijn goedertierenheid zullen met hem zijn; en zijn hoorn zal in Mijn Naam verhoogd worden.", "Jer 4:19": "O mijn binnenste, mijn binnenste! ik heb weeën, o wanden van mijn hart! Mijn hart maakt getier in mij, ik kan niet zwijgen; want u, mijn ziel! hoort het geluid van de bazuin en het krijgsgeschreeuw.", "Ps 120:2": "O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong.", "Jes 2:12": "Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt;", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 59:2-18": "Red mij van mijn vijanden, o mijn God! Stel mij in een hoog vertrek voor hen die tegen mij opstaan. Red mij van de werkers van de ongerechtigheid, en verlos mij van de mannen van het bloed. Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "Ezech 24:25": "En u, mensenkind! zal het niet zo zijn, op de dag dat Ik van hen wegneem hun sterkte, de vreugde van hun sieraad, de lust van hun ogen en het verlangen van hun zielen, hun zonen en hun dochters;", "Richt 19:18": "En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "Jer 15:15": "O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag.", "1 Sam 11:11": "Het gebeurde nu de volgende dag, dat Saul het volk in drie groepen indeelde, en zij kwamen midden in het leger, tijdens de morgenwake, en zij versloegen Ammon, totdat de dag heet werd; en het gebeurde dat de overgeblevenen zo verstrooid werden, dat er onder hen geen twee samen bleven.", "Kol 2:18": "Laat dan niemand u de prijs ontnemen door het eigenzinnig verlangen naar nederigheid en verering van engelen, terwijl hij zich verdiept in dingen die hij niet gezien heeft, zonder reden opgeblazen door het denken van zijn vlees;", "Ps 119:121-123": "Ain. Ik heb recht en gerechtigheid gedaan; geef mij niet over aan mijn onderdrukkers. Wees borg voor Uw knecht ten goede; laat de hoogmoedigen mij niet onderdrukken. Mijn ogen zijn bezweken van verlangen naar Uw heil, en naar de toezegging van Uw rechtvaardigheid.", "Job 16:13": "Zijn schutters hebben mij omringd; Hij heeft mijn nieren doorkliefd, en niet gespaard; Hij heeft mijn gal op de aarde uitgegoten.", "Luk 18:1": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven,", "Ps 112:10": "Resch. De goddeloze zal het zien, en hij zal boos worden; Schin. hij zal met zijn tanden knarsen en wegkwijnen. Thau. de wens van de goddelozen zal vergaan.", "Deut 29:22-28": "Dan zal het navolgende geslacht zeggen, uw kinderen, die na u opstaan zullen, en de vreemde, die uit een ver land komen zal, als zij de plagen van dit land zullen zien en de ziekten waarmee de HEERE het gekweld heeft; Dat zijn hele aarde zwavel en zout is van de verbranding; die niet bezaaid zal zijn, en geen spruit zal voortgebracht hebben, en geen kruid daarin zal opgekomen zijn; zoals de omkering van Sodom en Gomorra, Adama en Zeboïm, die de HEERE heeft omgekeerd in Zijn toorn en in Zijn grimmigheid; En alle volken zullen zeggen: Waarom heeft de HEERE dit land zo aangedaan? Wat betekent de gloed van deze grote toorn?", "Zach 10:3": "Tegen de herders was Mijn toorn ontstoken, en over de bokken heb Ik bezoeking gedaan; maar de HEERE van de heerscharen³ zal Zijn kudde bezoeken, het huis van Juda, en Hij zal hen stellen als het paard van Zijn majesteit in de strijd.", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "Klaagl 1:4": "Daleth. De wegen van Sion treuren, omdat niemand op het feest komt; al haar poorten zijn woest, haar priesters zuchten: haar jonkvrouwen zijn bedroefd, en zij zelf is in bitterheid.", "Ps 124:3": "dan zouden zij ons levend verslonden hebben, toen hun toorn tegen ons ontstak.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "2 Kron 34:15": "En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek.", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Jer 5:31": "De profeten profeteren vals, en de priesters heersen door hun eigen hand; en Mijn volk heeft het graag zo; maar wat zult u aan het einde daarvan doen?", "Joh 19:31": "De Joden dan, opdat de lichamen niet aan het kruis zouden blijven op de sabbat, omdat het de voorbereiding was (want die dag van de sabbat was een grote dag), vroegen Pilatus dat hun benen gebroken zouden worden, en zij weggenomen zouden worden.", "Klaagl 1:15": "Samech. De Heere heeft al mijn sterken in het midden van mij vertreden; Hij heeft een bijeenkomst over mij uitgeroepen, om mijn jongelingen te verbreken; de Heere heeft de wijnpers van de jonkvrouw, de dochter van Juda, aangetreden.", "2 Kon 20:8": "Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan?", "Jes 64:9-12": "HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting. Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 137:1-6": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion;", "Jer 17:24-27": "Het zal dan gebeuren, als u vlijtig naar Mij zult horen, spreekt de HEERE, dat u geen last door de poorten van deze stad op de sabbatdag inbrengt, en u de sabbatdag heiligt, dat u geen werk daarop doet; Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid. En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "2 Kron 36:17": "Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch de meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand.", "2 Kon 11:19": "En hij nam de leiders van honderd, en de hoofdmannen, en de lijfwacht, en al het volk van het land; en zij brachten de koning af uit het huis van de HEERE, en kwamen door de weg van de poort van de lijfwacht naar het huis van de koning, en hij zat op de troon der koningen.", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "Ps 16:1": "Een gouden kleinood van David. Bewaar mij, o God! Want ik vertrouw op U.", "Ezech 44:27": "En op de dag dat hij in het heilige naar binnen gaat, in het binnenste voorhof, om in het heilige te dienen, zal hij zijn zondoffer offeren, spreekt de Heere HEERE.", "Deut 9:13": "Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.", "Joël 1:8": "Kerm, als een jonkvrouw, die met een zak omgord is vanwege de man van haar jeugd.", "Ps 141:1-10": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep. Laat mijn gebed voor Uw aangezicht staan als reukwerk, het opheffen van mijn handen als het avondoffer. HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "Jes 38:14": "Zoals een kraanvogel of zwaluw, zo piepte ik; ik kirde als een duif; mijn ogen keken smachtend omhoog; o HEERE! ik word onderdrukt, wees Gij mijn Borg.", "Hos 7:14": "Zij roepen ook niet tot Mij met hun hart, wanneer zij huilen op hun bedden; om koren en most verzamelen zij zich, maar zij weerstreven Mij.", "2 Kon 25:7": "En zij slachtten de zonen van Zedekia voor zijn ogen, en men verblindde Zedekia's ogen, en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "Ps 78:63": "Het vuur verteerde hun jongelingen, en hun jonge dochters werden niet geprezen.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Jer 39:8": "En de Chaldeeën verbrandden het huis van de koning en de huizen van het volk met vuur; en zij braken de muren van Jeruzalem af.", "Deut 9:14": "Laat Mij begaan, dat Ik hen verdelg, en hun naam van onder de hemel uitwis; en Ik zal u tot een machtiger en groter volk maken dan dit is.", "Matt 24:2": "En Jezus zei tegen hen: Ziet u niet al deze dingen? Voorwaar, Ik zeg u: hier zal geen steen op de andere steen gelaten worden, die niet zal worden afgebroken.", "Ezech 9:6": "Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren.", "Ps 30:11": "Hoor, HEERE! en wees mij genadig; HEERE! wees mij een Helper."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H136\">Aleph</span>. <span class=\"wl\" data-l=\"L1\" data-code=\"H136\">Hoe</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H136\">heeft</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H136\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H136\">Heere</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H136\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1323\">dochter</span> Sion in <span class=\"wl\" data-l=\"L3\" data-code=\"H639\">Zijn</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H639\">toorn</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H5743\">bewolkt</span>? <span class=\"wl\" data-l=\"L5\" data-code=\"H8597\">Hij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8597\">heeft</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8597\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8597\">heerlijkheid</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8597\">van</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3478\">Israël</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3478\">van</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H8064\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H8064\"> kjv\" data-code=\"H8597\">beauty</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> not his <span class=\"wl wl-kjv\" data-code=\"H1916\">footstool</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of his anger!", "2": "The <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> hath swallowed <span class=\"wl wl-kjv\" data-code=\"H1104\">up</span> all the <span class=\"wl wl-kjv\" data-code=\"H4999\">habitations</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and hath not <span class=\"wl wl-kjv\" data-code=\"H2550\">pitied:</span> he hath thrown <span class=\"wl wl-kjv\" data-code=\"H2040\">down</span> in his <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath</span> the strong <span class=\"wl wl-kjv\" data-code=\"H4013\">holds</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> he hath brought them <span class=\"wl wl-kjv\" data-code=\"H5060\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground:</span> he hath <span class=\"wl wl-kjv\" data-code=\"H2490\">polluted</span> the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> and the princes", "3": "He hath cut <span class=\"wl wl-kjv\" data-code=\"H1438\">off</span> in his <span class=\"wl wl-kjv\" data-code=\"H2750\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> all the <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7725\">drawn</span> <span class=\"wl wl-kjv\" data-code=\"H268\">back</span> his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> and he <span class=\"wl wl-kjv\" data-code=\"H1197\">burned</span> against <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> like a <span class=\"wl wl-kjv\" data-code=\"H3852\">flaming</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> which <span class=\"wl wl-kjv\" data-code=\"H398\">devoureth</span> round about.", "4": "He hath <span class=\"wl wl-kjv\" data-code=\"H1869\">bent</span> his <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> like an <span class=\"wl wl-kjv\" data-code=\"H341\">enemy:</span> he <span class=\"wl wl-kjv\" data-code=\"H5324\">stood</span> with his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> as an <span class=\"wl wl-kjv\" data-code=\"H6862\">adversary,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> all that were <span class=\"wl wl-kjv\" data-code=\"H4261\">pleasant</span> to the <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion:</span> he poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> like fire.", "5": "The <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> was as an <span class=\"wl wl-kjv\" data-code=\"H341\">enemy:</span> he hath swallowed <span class=\"wl wl-kjv\" data-code=\"H1104\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> he hath swallowed <span class=\"wl wl-kjv\" data-code=\"H1104\">up</span> all her <span class=\"wl wl-kjv\" data-code=\"H759\">palaces:</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed</span> his strong <span class=\"wl wl-kjv\" data-code=\"H4013\">holds,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H7235\">increased</span> in the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H8386\">mourning</span> and lamentation.", "6": "And he hath violently taken <span class=\"wl wl-kjv\" data-code=\"H2554\">away</span> his <span class=\"wl wl-kjv\" data-code=\"H7900\">tabernacle,</span> as if it were of a <span class=\"wl wl-kjv\" data-code=\"H1588\">garden:</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed</span> his places of the <span class=\"wl wl-kjv\" data-code=\"H4150\">assembly:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath caused the solemn <span class=\"wl wl-kjv\" data-code=\"H4150\">feasts</span> and <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths</span> to be <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H5006\">despised</span> in the <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation</span> of his <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and the priest.", "7": "The <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> hath cast <span class=\"wl wl-kjv\" data-code=\"H2186\">off</span> his <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H5010\">abhorred</span> his <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary,</span> he hath given <span class=\"wl wl-kjv\" data-code=\"H5462\">up</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> of her <span class=\"wl wl-kjv\" data-code=\"H759\">palaces;</span> they have <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of a solemn feast.", "8": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H2803\">purposed</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion:</span> he hath stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H6957\">line,</span> he hath not <span class=\"wl wl-kjv\" data-code=\"H7725\">withdrawn</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> from <span class=\"wl wl-kjv\" data-code=\"H1104\">destroying:</span> therefore he made the <span class=\"wl wl-kjv\" data-code=\"H2426\">rampart</span> and the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> to <span class=\"wl wl-kjv\" data-code=\"H56\">lament;</span> they <span class=\"wl wl-kjv\" data-code=\"H535\">languished</span> together.", "9": "Her <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> are <span class=\"wl wl-kjv\" data-code=\"H2883\">sunk</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">ground;</span> he hath <span class=\"wl wl-kjv\" data-code=\"H6\">destroyed</span> and <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> her <span class=\"wl wl-kjv\" data-code=\"H1280\">bars:</span> her <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and her <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> are among the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles:</span> the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> is no more; her <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> also <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> no <span class=\"wl wl-kjv\" data-code=\"H2377\">vision</span> from the LORD.", "10": "The <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and keep <span class=\"wl wl-kjv\" data-code=\"H1826\">silence:</span> they have cast <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> upon their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads;</span> they have <span class=\"wl wl-kjv\" data-code=\"H2296\">girded</span> themselves with <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth:</span> the <span class=\"wl wl-kjv\" data-code=\"H1330\">virgins</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> hang <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> to the ground.", "11": "Mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> do <span class=\"wl wl-kjv\" data-code=\"H3615\">fail</span> with <span class=\"wl wl-kjv\" data-code=\"H1832\">tears,</span> my <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels</span> are <span class=\"wl wl-kjv\" data-code=\"H2560\">troubled,</span> my <span class=\"wl wl-kjv\" data-code=\"H3516\">liver</span> is <span class=\"wl wl-kjv\" data-code=\"H8210\">poured</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> for the <span class=\"wl wl-kjv\" data-code=\"H7667\">destruction</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> because the <span class=\"wl wl-kjv\" data-code=\"H5768\">children</span> and the <span class=\"wl wl-kjv\" data-code=\"H3243\">sucklings</span> <span class=\"wl wl-kjv\" data-code=\"H5848\">swoon</span> in the <span class=\"wl wl-kjv\" data-code=\"H7339\">streets</span> of the city.", "12": "They <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to their <span class=\"wl wl-kjv\" data-code=\"H517\">mothers,</span> Where is <span class=\"wl wl-kjv\" data-code=\"H1715\">corn</span> and <span class=\"wl wl-kjv\" data-code=\"H3196\">wine?</span> when they <span class=\"wl wl-kjv\" data-code=\"H5848\">swooned</span> as the <span class=\"wl wl-kjv\" data-code=\"H2491\">wounded</span> in the <span class=\"wl wl-kjv\" data-code=\"H7339\">streets</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> when their <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> was poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> into their <span class=\"wl wl-kjv\" data-code=\"H517\">mothers'</span> bosom.", "13": "What thing shall I take to <span class=\"wl wl-kjv\" data-code=\"H5749\">witness</span> for thee? what <span class=\"wl wl-kjv\" data-code=\"H4100\">thing</span> shall I <span class=\"wl wl-kjv\" data-code=\"H1819\">liken</span> to thee, O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem?</span> what shall I <span class=\"wl wl-kjv\" data-code=\"H7737\">equal</span> to thee, that I may <span class=\"wl wl-kjv\" data-code=\"H5162\">comfort</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H1330\">virgin</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion?</span> for thy <span class=\"wl wl-kjv\" data-code=\"H7667\">breach</span> is <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> like the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea:</span> who can heal", "14": "Thy <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> have <span class=\"wl wl-kjv\" data-code=\"H2372\">seen</span> <span class=\"wl wl-kjv\" data-code=\"H7723\">vain</span> and foolish <span class=\"wl wl-kjv\" data-code=\"H8602\">things</span> for thee: and they have not <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> thine <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> to turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity;</span> but have <span class=\"wl wl-kjv\" data-code=\"H2372\">seen</span> for thee <span class=\"wl wl-kjv\" data-code=\"H7723\">false</span> <span class=\"wl wl-kjv\" data-code=\"H4864\">burdens</span> and causes of banishment.", "15": "All that <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> by <span class=\"wl wl-kjv\" data-code=\"H5606\">clap</span> their <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> at <span class=\"wl wl-kjv\" data-code=\"H1870\">thee;</span> they <span class=\"wl wl-kjv\" data-code=\"H8319\">hiss</span> and <span class=\"wl wl-kjv\" data-code=\"H5128\">wag</span> their <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> at the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> saying, Is this the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> that men <span class=\"wl wl-kjv\" data-code=\"H559\">call</span> The <span class=\"wl wl-kjv\" data-code=\"H3632\">perfection</span> of <span class=\"wl wl-kjv\" data-code=\"H3308\">beauty,</span> The <span class=\"wl wl-kjv\" data-code=\"H4885\">joy</span> of the whole earth?", "16": "All thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> have <span class=\"wl wl-kjv\" data-code=\"H6475\">opened</span> their <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> against thee: they <span class=\"wl wl-kjv\" data-code=\"H8319\">hiss</span> and <span class=\"wl wl-kjv\" data-code=\"H2786\">gnash</span> the <span class=\"wl wl-kjv\" data-code=\"H8127\">teeth:</span> they <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> We have swallowed her <span class=\"wl wl-kjv\" data-code=\"H1104\">up:</span> <span class=\"wl wl-kjv\" data-code=\"H389\">certainly</span> this is the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that we looked <span class=\"wl wl-kjv\" data-code=\"H6960\">for;</span> we have <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> we have seen", "17": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> that which he had <span class=\"wl wl-kjv\" data-code=\"H2161\">devised;</span> he hath <span class=\"wl wl-kjv\" data-code=\"H1214\">fulfilled</span> his <span class=\"wl wl-kjv\" data-code=\"H565\">word</span> that he had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H6924\">old:</span> he hath thrown <span class=\"wl wl-kjv\" data-code=\"H2040\">down,</span> and hath not <span class=\"wl wl-kjv\" data-code=\"H2550\">pitied:</span> and he hath caused thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> to <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> over thee, he hath set <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> of thine adversaries.", "18": "Their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> let <span class=\"wl wl-kjv\" data-code=\"H1832\">tears</span> run <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> like a <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> <span class=\"wl wl-kjv\" data-code=\"H3119\">day</span> and <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thyself no <span class=\"wl wl-kjv\" data-code=\"H6314\">rest;</span> let not the <span class=\"wl wl-kjv\" data-code=\"H1323\">apple</span> of thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> cease.", "19": "<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> cry <span class=\"wl wl-kjv\" data-code=\"H7442\">out</span> in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> in the <span class=\"wl wl-kjv\" data-code=\"H7218\">beginning</span> of the <span class=\"wl wl-kjv\" data-code=\"H821\">watches</span> pour <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> like <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> <span class=\"wl wl-kjv\" data-code=\"H5227\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord:</span> lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> toward him for the <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> of thy young <span class=\"wl wl-kjv\" data-code=\"H5768\">children,</span> that <span class=\"wl wl-kjv\" data-code=\"H5848\">faint</span> for <span class=\"wl wl-kjv\" data-code=\"H7458\">hunger</span> in the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of every street.", "20": "<span class=\"wl wl-kjv\" data-code=\"H7200\">Behold,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5027\">consider</span> to whom thou hast <span class=\"wl wl-kjv\" data-code=\"H5953\">done</span> <span class=\"wl wl-kjv\" data-code=\"H3541\">this.</span> Shall the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> their <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit,</span> and <span class=\"wl wl-kjv\" data-code=\"H5768\">children</span> of a span <span class=\"wl wl-kjv\" data-code=\"H2949\">long?</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> be <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> in the <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> of the Lord?", "21": "The <span class=\"wl wl-kjv\" data-code=\"H5288\">young</span> and the <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> on the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> in the <span class=\"wl wl-kjv\" data-code=\"H2351\">streets:</span> my <span class=\"wl wl-kjv\" data-code=\"H1330\">virgins</span> and my young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> are <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> them in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of thine <span class=\"wl wl-kjv\" data-code=\"H639\">anger;</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H2873\">killed,</span> and not pitied.", "22": "Thou hast <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> as in a <span class=\"wl wl-kjv\" data-code=\"H4150\">solemn</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> my <span class=\"wl wl-kjv\" data-code=\"H4032\">terrors</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> so that in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> none <span class=\"wl wl-kjv\" data-code=\"H6412\">escaped</span> nor <span class=\"wl wl-kjv\" data-code=\"H8300\">remained:</span> those that I have <span class=\"wl wl-kjv\" data-code=\"H2946\">swaddled</span> and brought <span class=\"wl wl-kjv\" data-code=\"H7235\">up</span> hath mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> consumed."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    if (!kjvTekst && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
