deren","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.","2":"Beth. De Heere heeft al de woningen van Jakob verslonden, en heeft ze niet verschoond; Hij heeft de vestingen van de dochter van Juda afgebroken in Zijn verbolgenheid, Hij heeft gemaakt dat zij de aarde raken; Hij heeft het koninkrijk en zijn vorsten ontheiligd.","3":"Gimel. Hij heeft, in ontsteking van de toorn, de gehele hoorn van Israël afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, dat rondom verteert.","4":"Daleth. Hij heeft Zijn boog gespannen als een vijand; Hij heeft Zich met Zijn rechterhand gesteld als een tegenstander, dat Hij doodde al de begeerlijke dingen van de ogen; Hij heeft Zijn grimmigheid in de tent van de dochter van Sion uitgestort als een vuur.","5":"He. De Heere is geworden als een vijand; Hij heeft Israël verslonden, Hij heeft al haar paleizen verslonden. Hij heeft haar vestingen verdorven; en Hij heeft bij de dochter van Juda het klagen en kermen vermenigvuldigd.","6":"Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.","7":"Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.","8":"Cheth. De HEERE heeft gedacht te verderven de muur van de dochter van Sion; Hij heeft het richtsnoer daarover getrokken, Hij heeft Zijn hand niet afgewend, dat Hij ze niet zou verslinden; en Hij heeft de voormuur en de muur samen treurig gemaakt, zij zijn verzwakt.","9":"Teth. Haar poorten zijn in de aarde verzonken; Hij heeft haar grendels verdorven en gebroken; haar koning en haar vorsten zijn onder de heidenen; er is geen wet; haar profeten vinden ook geen gezicht van de HEERE.","10":"Jod. De oudsten van de dochter van Sion zitten op de aarde, zij zwijgen stil, zij werpen stof op hun hoofd, zij hebben zakken aangegord; de jonge dochters van Jeruzalem laten hun hoofd ter aarde hangen.","11":"Caph. Mijn ogen zijn verteerd door tranen, mijn ingewand wordt beroerd; mijn lever is ter aarde uitgeschud, vanwege de breuk van de dochter van mijn volk; omdat het kind en de zuigeling op de straten van de stad in onmacht zinken;","12":"Lamed. Als zij tegen hun moeders zeggen: Waar is koren en wijn, als zij op de straten van de stad in onmacht zinken, als de verslagenen; als hun ziel zich uitschudt in de schoot van hun moeders.","13":"Mem. Wat getuigen zal ik u brengen, wat zal ik bij u vergelijken, u dochter van Jeruzalem? Wat zal ik bij u vergelijken, dat ik u zou troosten, u jonkvrouw, dochter van Sion, want uw breuk is zo groot als de zee, wie kan u helen?","14":"Nun. Uw profeten hebben u ijdelheid en ongerijmdheid gezien, en zij hebben u uw ongerechtigheid niet geopenbaard, om uw gevangenschap af te wenden, maar zij hebben voor u gezien ijdele lasten en uitstotingen.","15":"Samech. Allen die voorbijgaan, klappen met de handen over u, zij fluiten en schudden hun hoofd over de dochter van Jeruzalem, en zeggen: Is dit die stad, waarvan men zei, dat zij volkomen was van schoonheid, een vreugde van de hele aarde?","16":"Pe. Al uw vijanden sperren hun mond open over u, zij fluiten en knersen met de tanden, zij zeggen: Wij hebben haar verslonden; dit is zeker de dag die wij verwacht hebben, wij hebben hem gevonden, wij hebben hem gezien.","17":"Ain. De HEERE heeft gedaan wat Hij Zich had voorgenomen, Hij heeft Zijn woord vervuld, dat Hij bevolen had van oude dagen af; Hij heeft afgebroken en niet gespaard; en Hij heeft de vijand over u verblijd, Hij heeft de hoorn van uw tegenstanders verhoogd.","18":"Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op!","19":"Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.","20":"Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?","21":"Schin. De jongen en de ouden liggen op de aarde op de straten; mijn jonkvrouwen en mijn jongelingen zijn door het zwaard gevallen; Gij hebt ze gedood in de dag van Uw toorn, Gij hebt ze geslacht en niet verschoond.","22":"Thau. Gij hebt mijn verschrikkingen van rondom geroepen, als tot een dag van een gezet hoogtijd; en er is niemand aan de dag van de toorn van de HEERE ontkomen of overgebleven; die ik op de handen gedragen en opgevoed heb, die heeft mijn vijand omgebracht."},"SV":{"1":"Aleph. Hoe heeft de Heere de dochter Sions in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van den hemel *op* de aarde nedergeworpen; en Hij heeft aan de voetbank Zijner voeten niet gedacht in den dag Zijns toorns.","2":"Beth. De Heere heeft al de woningen Jakobs verslonden, en heeft ze niet verschoond; Hij heeft de vastigheden der dochter van Juda afgebroken in Zijn verbolgenheid, Hij heeft gemaakt, dat zij de aarde raken; Hij heeft het koninkrijk en deszelfs vorsten ontheiligd.","3":"Gimel. Hij heeft, in ontsteking des toorns, den gehelen hoorn Israëls afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, *dat* rondom verteert.","4":"Daleth. Hij heeft Zijn boog gespannen als een vijand; Hij heeft zich *met* Zijn rechterhand gesteld als een tegenpartijder, dat Hij doodde al de begeerlijke dingen der ogen; Hij heeft Zijn grimmigheid in de tent der dochter Sions uitgestort als een vuur.","5":"He. De Heere is geworden als een vijand; Hij heeft Israël verslonden, Hij heeft al haar paleizen verslonden. Hij heeft deszelfs vastigheden verdorven; en Hij heeft bij de dochter van Juda het klagen en kermen vermenigvuldigd.","6":"Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten den hoogtijd en den sabbat, en Hij heeft in de gramschap Zijns toorns den koning en den priester smadelijk verworpen.","7":"Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren harer paleizen in des vijands hand overgegeven; zij hebben in het huis des HEEREN een stem verheven als op den dag eens gezetten hoogtijds.","8":"Cheth. De HEERE heeft gedacht te verderven den muur der dochter Sions; Hij heeft het richtsnoer *daarover* getogen, Hij heeft Zijn hand niet afgewend, dat Hij ze niet verslonde; en Hij heeft den voormuur en den muur te zamen treurig gemaakt, zij zijn verzwakt.","9":"Teth. Haar poorten zijn in de aarde verzonken; Hij heeft haar grendelen verdorven en gebroken; haar koning en haar vorsten zijn onder de heidenen; er is geen wet; haar profeten vinden ook geen gezicht van den HEERE.","10":"Jod. De oudsten der dochter Sions zitten op de aarde, zij zwijgen stil, zij werpen stof op hun hoofd, zij hebben zakken aangegord; de jonge dochters van Jeruzalem laten haar hoofd ter aarde hangen.","11":"Caph. Mijn ogen zijn verteerd door tranen, mijn ingewand wordt beroerd; mijn lever is ter aarde uitgeschud, vanwege de breuk der dochter mijns volks; omdat het kind en de zuigeling op de straten der stad in onmacht zinken;","12":"Lamed. *Als* zij tot hun moeders zeggen: Waar is koren en wijn, als zij op de straten der stad in onmacht zinken, als de verslagenen; als zich hun ziel uitschudt in den schoot hunner moeders.","13":"Mem. Wat getuigen zal ik u brengen , wat zal ik bij u vergelijken, gij dochter Jeruzalems? Wat zal ik bij u vergelijken, dat ik u trooste, gij jonkvrouw, dochter Sions, want uw breuk is *zo* groot als de zee, wie kan u helen?","14":"Nun. Uw profeten hebben u ijdelheid en ongerijmdheid gezien, en zij hebben *u* uw ongerechtigheid niet geopenbaard, om uw gevangenis af te wenden, maar zij hebben voor u gezien ijdele lasten en uitstotingen.","15":"Samech. Allen, die over weg gaan, klappen met de handen over u, zij fluiten en schudden hun hoofd over de dochter Jeruzalems, *zeggende*: Is dit die stad, waar men van zeide, dat zij volkomen van schoonheid was, een vreugde der ganse aarde?","16":"Pe. Al uw vijanden sperren hun mond op over u, zij fluiten en knersen met de tanden, zij zeggen: Wij hebben haar verslonden; dit is immers de dag, dien wij verwacht hebben, wij hebben *hem* gevonden, wij hebben *hem* gezien.","17":"Ain. De HEERE heeft gedaan, wat Hij gedacht had, Hij heeft Zijn woord vervuld, dat Hij bevolen had van oude dagen; Hij heeft afgebroken en niet gespaard; en Hij heeft den vijand over u verblijd, Hij heeft den hoorn uwer tegenpartijders verhoogd.","18":"Tsade. Hun hart schreeuwde tot den Heere: O gij muur der dochter Sions, laat dag en nacht tranen afvlieten als een beek; geef uzelve geen rust, uw oogappel houde niet op!","19":"Koph. Maak u op, maak geschrei des nachts in het begin der nachtwaken, stort uw hart uit voor het aangezicht des Heeren als water; hef uw handen tot Hem op voor de ziel uwer kinderkens, die in onmacht gevallen zijn van honger, vooraan op alle straten.","20":"Resch. Zie, HEERE, aanschouw toch, aan wien Gij alzo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderkens, die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom des Heeren gedood worden?","21":"Schin. De jongen en de ouden liggen op de aarde *op* de straten; mijn jonkvrouwen en mijn jongelingen zijn door het zwaard gevallen; Gij hebt ze in den dag Uws toorns gedood, Gij hebt ze geslacht *en* niet verschoond.","22":"Thau. Gij hebt mijn verschrikkingen van rondom geroepen, als *tot* een dag eens gezetten hoogtijds; en er is niemand aan den dag des toorns des HEEREN ontkomen of overgebleven; die ik op de handen gedragen en opgetogen heb, die heeft mijn vijand omgebracht."},"KJV":{"1":"How hath the Lord covered the daughter of Zion with a cloud in his anger, *and* cast down from heaven unto the earth the beauty of Israel, and remembered not his footstool in the day of his anger!","2":"The Lord hath swallowed up all the habitations of Jacob, and hath not pitied: he hath thrown down in his wrath the strong holds of the daughter of Judah; he hath brought *them* down to the ground: he hath polluted the kingdom and the princes","3":"He hath cut off in *his* fierce anger all the horn of Israel: he hath drawn back his right hand from before the enemy, and he burned against Jacob like a flaming fire, *which* devoureth round about.","4":"He hath bent his bow like an enemy: he stood with his right hand as an adversary, and slew all *that were* pleasant to the eye in the tabernacle of the daughter of Zion: he poured out his fury like fire.","5":"The Lord was as an enemy: he hath swallowed up Israel, he hath swallowed up all her palaces: he hath destroyed his strong holds, and hath increased in the daughter of Judah mourning and lamentation.","6":"And he hath violently taken away his tabernacle, as *if it were of* a garden: he hath destroyed his places of the assembly: the LORD hath caused the solemn feasts and sabbaths to be forgotten in Zion, and hath despised in the indignation of his anger the king and the priest.","7":"The Lord hath cast off his altar, he hath abhorred his sanctuary, he hath given up into the hand of the enemy the walls of her palaces; they have made a noise in the house of the LORD, as in the day of a solemn feast.","8":"The LORD hath purposed to destroy the wall of the daughter of Zion: he hath stretched out a line, he hath not withdrawn his hand from destroying: therefore he made the rampart and the wall to lament; they languished together.","9":"Her gates are sunk into the ground; he hath destroyed and broken her bars: her king and her princes *are* among the Gentiles: the law *is* no *more*; her prophets also find no vision from the LORD.","10":"The elders of the daughter of Zion sit upon the ground, *and* keep silence: they have cast up dust upon their heads; they have girded themselves with sackcloth: the virgins of Jerusalem hang down their heads to the ground.","11":"Mine eyes do fail with tears, my bowels are troubled, my liver is poured upon the earth, for the destruction of the daughter of my people; because the children and the sucklings swoon in the streets of the city.","12":"They say to their mothers, Where *is* corn and wine? when they swooned as the wounded in the streets of the city, when their soul was poured out into their mothers' bosom.","13":"What thing shall I take to witness for thee? what thing shall I liken to thee, O daughter of Jerusalem? what shall I equal to thee, that I may comfort thee, O virgin daughter of Zion? for thy breach *is* great like the sea: who can heal","14":"Thy prophets have seen vain and foolish things for thee: and they have not discovered thine iniquity, to turn away thy captivity; but have seen for thee false burdens and causes of banishment.","15":"All that pass by clap *their* hands at thee; they hiss and wag their head at the daughter of Jerusalem, *saying, Is* this the city that *men* call The perfection of beauty, The joy of the whole earth?","16":"All thine enemies have opened their mouth against thee: they hiss and gnash the teeth: they say, We have swallowed *her* up: certainly this *is* the day that we looked for; we have found, we have seen","17":"The LORD hath done *that* which he had devised; he hath fulfilled his word that he had commanded in the days of old: he hath thrown down, and hath not pitied: and he hath caused *thine* enemy to rejoice over thee, he hath set up the horn of thine adversaries.","18":"Their heart cried unto the Lord, O wall of the daughter of Zion, let tears run down like a river day and night: give thyself no rest; let not the apple of thine eye cease.","19":"Arise, cry out in the night: in the beginning of the watches pour out thine heart like water before the face of the Lord: lift up thy hands toward him for the life of thy young children, that faint for hunger in the top of every street.","20":"Behold, O LORD, and consider to whom thou hast done this. Shall the women eat their fruit, *and* children of a span long? shall the priest and the prophet be slain in the sanctuary of the Lord?","21":"The young and the old lie on the ground in the streets: my virgins and my young men are fallen by the sword; thou hast slain *them* in the day of thine anger; thou hast killed, *and* not pitied.","22":"Thou hast called as in a solemn day my terrors round about, so that in the day of the LORD'S anger none escaped nor remained: those that I have swadd 6\">Zion</span> with a <span class=\"wl wl-kjv\" data-code=\"H5743\">cloud</span> in his <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and cast <span class=\"wl wl-kjv\" data-code=\"H7993\">down</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> the <span class=\"wl wl-kjv\" data-code=\"H8597\">beauty</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> not his <span class=\"wl wl-kjv\" data-code=\"H1916\">footstool</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of his anger!","2":"The <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> hath swallowed <span class=\"wl wl-kjv\" data-code=\"H1104\">up</span> all the <span class=\"wl wl-kjv\" data-code=\"H4999\">habitations</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and hath not <span class=\"wl wl-kjv\" data-code=\"H2550\">pitied:</span> he hath thrown <span class=\"wl wl-kjv\" data-code=\"H2040\">down</span> in his <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath</span> the strong <span class=\"wl wl-kjv\" data-code=\"H4013\">holds</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> he hath brought them <span class=\"wl wl-kjv\" data-code=\"H5060\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground:</span> he hath <span class=\"wl wl-kjv\" data-code=\"H2490\">polluted</span> the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> and the princes","3":"He hath cut <span class=\"wl wl-kjv\" data-code=\"H1438\">off</span> in his <span class=\"wl wl-kjv\" data-code=\"H2750\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> all the <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7725\">drawn</span> <span class=\"wl wl-kjv\" data-code=\"H268\">back</span> his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> and he <span class=\"wl wl-kjv\" data-code=\"H1197\">burned</span> against <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> like a <span class=\"wl wl-kjv\" data-code=\"H3852\">flaming</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> which <span class=\"wl wl-kjv\" data-code=\"H398\">devoureth</span> round about.","4":"He hath <span class=\"wl wl-kjv\" data-code=\"H1869\">bent</span> his <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> like an <span class=\"wl wl-kjv\" data-code=\"H341\">enemy:</span> he <span class=\"wl wl-kjv\" data-code=\"H5324\">stood</span> with his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> as an <span class=\"wl wl-kjv\" data-code=\"H6862\">adversary,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> all that were <span class=\"wl wl-kjv\" data-code=\"H4261\">pleasant</span> to the <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion:</span> he poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> like fire.","5":"The <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> was as an <span class=\"wl wl-kjv\" data-code=\"H341\">enemy:</span> he hath swallowed <span class=\"wl wl-kjv\" data-code=\"H1104\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> he hath swallowed <span class=\"wl wl-kjv\" data-code=\"H1104\">up</span> all her <span class=\"wl wl-kjv\" data-code=\"H759\">palaces:</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed</span> his strong <span class=\"wl wl-kjv\" data-code=\"H4013\">holds,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H7235\">increased</span> in the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H8386\">mourning</span> and lamentation.","6":"And he hath violently taken <span class=\"wl wl-kjv\" data-code=\"H2554\">away</span> his <span class=\"wl wl-kjv\" data-code=\"H7900\">tabernacle,</span> as if it were of a <span class=\"wl wl-kjv\" data-code=\"H1588\">garden:</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed</span> his places of the <span class=\"wl wl-kjv\" data-code=\"H4150\">assembly:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath caused the solemn <span class=\"wl wl-kjv\" data-code=\"H4150\">feasts</span> and <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths</span> to be <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H5006\">despised</span> in the <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation</span> of his <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and the priest.","7":"The <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> hath cast <span class=\"wl wl-kjv\" data-code=\"H2186\">off</span> his <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H5010\">abhorred</span> his <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary,</span> he hath given <span class=\"wl wl-kjv\" data-code=\"H5462\">up</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> of her <span class=\"wl wl-kjv\" data-code=\"H759\">palaces;</span> they have <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of a solemn feast.","8":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H2803\">purposed</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion:</span> he hath stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H6957\">line,</span> he hath not <span class=\"wl wl-kjv\" data-code=\"H7725\">withdrawn</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> from <span class=\"wl wl-kjv\" data-code=\"H1104\">destroying:</span> therefore he made the <span class=\"wl wl-kjv\" data-code=\"H2426\">rampart</span> and the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> to <span class=\"wl wl-kjv\" data-code=\"H56\">lament;</span> they <span class=\"wl wl-kjv\" data-code=\"H535\">languished</span> together.","9":"Her <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> are <span class=\"wl wl-kjv\" data-code=\"H2883\">sunk</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">ground;</span> he hath <span class=\"wl wl-kjv\" data-code=\"H6\">destroyed</span> and <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> her <span class=\"wl wl-kjv\" data-code=\"H1280\">bars:</span> her <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and her <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> are among the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles:</span> the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> is no more; her <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> also <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> no <span class=\"wl wl-kjv\" data-code=\"H2377\">vision</span> from the LORD.","10":"The <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and keep <span class=\"wl wl-kjv\" data-code=\"H1826\">silence:</span> they have cast <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> upon their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads;</span> they have <span class=\"wl wl-kjv\" data-code=\"H2296\">girded</span> themselves with <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth:</span> the <span class=\"wl wl-kjv\" data-code=\"H1330\">virgins</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> hang <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> to the ground.","11":"Mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> do <span class=\"wl wl-kjv\" data-code=\"H3615\">fail</span> with <span class=\"wl wl-kjv\" data-code=\"H1832\">tears,</span> my <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels</span> are <span class=\"wl wl-kjv\" data-code=\"H2560\">troubled,</span> my <span class=\"wl wl-kjv\" data-code=\"H3516\">liver</span> is <span class=\"wl wl-kjv\" data-code=\"H8210\">poured</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> for the <span class=\"wl wl-kjv\" data-code=\"H7667\">destruction</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> because the <span class=\"wl wl-kjv\" data-code=\"H5768\">children</span> and the <span class=\"wl wl-kjv\" data-code=\"H3243\">sucklings</span> <span class=\"wl wl-kjv\" data-code=\"H5848\">swoon</span> in the <span class=\"wl wl-kjv\" data-code=\"H7339\">streets</span> of the city.","12":"They <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to their <span class=\"wl wl-kjv\" data-code=\"H517\">mothers,</span> Where is <span class=\"wl wl-kjv\" data-code=\"H1715\">corn</span> and <span class=\"wl wl-kjv\" data-code=\"H3196\">wine?</span> when they <span class=\"wl wl-kjv\" data-code=\"H5848\">swooned</span> as the <span class=\"wl wl-kjv\" data-code=\"H2491\">wounded</span> in the <span class=\"wl wl-kjv\" data-code=\"H7339\">streets</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> when their <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> was poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> into their <span class=\"wl wl-kjv\" data-code=\"H517\">mothers'</span> bosom.","13":"What thing shall I take to <span class=\"wl wl-kjv\" data-code=\"H5749\">witness</span> for thee? what <span class=\"wl wl-kjv\" data-code=\"H4100\">thing</span> shall I <span class=\"wl wl-kjv\" data-code=\"H1819\">liken</span> to thee, O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem?</span> what shall I <span class=\"wl wl-kjv\" data-code=\"H7737\">equal</span> to thee, that I may <span class=\"wl wl-kjv\" data-code=\"H5162\">comfort</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H1330\">virgin</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion?</span> for thy <span class=\"wl wl-kjv\" data-code=\"H7667\">breach</span> is <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> like the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea:</span> who can heal","14":"Thy <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> have <span class=\"wl wl-kjv\" data-code=\"H2372\">seen</span> <span class=\"wl wl-kjv\" data-code=\"H7723\">vain</span> and foolish <span class=\"wl wl-kjv\" data-code=\"H8602\">things</span> for thee: and they have not <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> thine <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> to turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity;</span> but have <span class=\"wl wl-kjv\" data-code=\"H2372\">seen</span> for thee <span class=\"wl wl-kjv\" data-code=\"H7723\">false</span> <span class=\"wl wl-kjv\" data-code=\"H4864\">burdens</span> and causes of banishment.","15":"All that <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> by <span class=\"wl wl-kjv\" data-code=\"H5606\">clap</span> their <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> at <span class=\"wl wl-kjv\" data-code=\"H1870\">thee;</span> they <span class=\"wl wl-kjv\" data-code=\"H8319\">hiss</span> and <span class=\"wl wl-kjv\" data-code=\"H5128\">wag</span> their <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> at the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> saying, Is this the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> that men <span class=\"wl wl-kjv\" data-code=\"H559\">call</span> The <span class=\"wl wl-kjv\" data-code=\"H3632\">perfection</span> of <span class=\"wl wl-kjv\" data-code=\"H3308\">beauty,</span> The <span class=\"wl wl-kjv\" data-code=\"H4885\">joy</span> of the whole earth?","16":"All thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> have <span class=\"wl wl-kjv\" data-code=\"H6475\">opened</span> their <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> against thee: they <span class=\"wl wl-kjv\" data-code=\"H8319\">hiss</span> and <span class=\"wl wl-kjv\" data-code=\"H2786\">gnash</span> the <span class=\"wl wl-kjv\" data-code=\"H8127\">teeth:</span> they <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> We have swallowed her <span class=\"wl wl-kjv\" data-code=\"H1104\">up:</span> <span class=\"wl wl-kjv\" data-code=\"H389\">certainly</span> this is the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that we looked <span class=\"wl wl-kjv\" data-code=\"H6960\">for;</span> we have <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> we have seen","17":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> that which he had <span class=\"wl wl-kjv\" data-code=\"H2161\">devised;</span> he hath <span class=\"wl wl-kjv\" data-code=\"H1214\">fulfilled</span> his <span class=\"wl wl-kjv\" data-code=\"H565\">word</span> that he had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H6924\">old:</span> he hath thrown <span class=\"wl wl-kjv\" data-code=\"H2040\">down,</span> and hath not <span class=\"wl wl-kjv\" data-code=\"H2550\">pitied:</span> and he hath caused thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> to <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> over thee, he hath set <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> of thine adversaries.","18":"Their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> let <span class=\"wl wl-kjv\" data-code=\"H1832\">tears</span> run <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> like a <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> <span class=\"wl wl-kjv\" data-code=\"H3119\">day</span> and <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thyself no <span class=\"wl wl-kjv\" data-code=\"H6314\">rest;</span> let not the <span class=\"wl wl-kjv\" data-code=\"H1323\">apple</span> of thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> cease.","19":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> cry <span class=\"wl wl-kjv\" data-code=\"H7442\">out</span> in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> in the <span class=\"wl wl-kjv\" data-code=\"H7218\">beginning</span> of the <span class=\"wl wl-kjv\" data-code=\"H821\">watches</span> pour <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> like <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> <span class=\"wl wl-kjv\" data-code=\"H5227\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord:</span> lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> toward him for the <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> of thy young <span class=\"wl wl-kjv\" data-code=\"H5768\">children,</span> that <span class=\"wl wl-kjv\" data-code=\"H5848\">faint</span> for <span class=\"wl wl-kjv\" data-code=\"H7458\">hunger</span> in the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of every street.","20":"<span class=\"wl wl-kjv\" data-code=\"H7200\">Behold,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5027\">consider</span> to whom thou hast <span class=\"wl wl-kjv\" data-code=\"H5953\">done</span> <span class=\"wl wl-kjv\" data-code=\"H3541\">this.</span> Shall the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> their <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit,</span> and <span class=\"wl wl-kjv\" data-code=\"H5768\">children</span> of a span <span class=\"wl wl-kjv\" data-code=\"H2949\">long?</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> be <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> in the <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> of the Lord?","21":"The <span class=\"wl wl-kjv\" data-code=\"H5288\">young</span> and the <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> on the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> in the <span class=\"wl wl-kjv\" data-code=\"H2351\">streets:</span> my <span class=\"wl wl-kjv\" data-code=\"H1330\">virgins</span> and my young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> are <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> them in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of thine <span class=\"wl wl-kjv\" data-code=\"H639\">anger;</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H2873\">killed,</span> and not pitied.","22":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> as in a <span class=\"wl wl-kjv\" data-code=\"H4150\">solemn</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> my <span class=\"wl wl-kjv\" data-code=\"H4032\">terrors</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> so that in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> none <span class=\"wl wl-kjv\" data-code=\"H6412\">escaped</span> nor <span class=\"wl wl-kjv\" data-code=\"H8300\">remained:</span> those that I have <span class=\"wl wl-kjv\" data-code=\"H2946\">swaddled</span> and brought <span class=\"wl wl-kjv\" data-code=\"H7235\">up</span> hath mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> consumed."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Hoe heeft de HEERE","tekst":"Zie boven Lam 1:1 ."},{"catchword":"de dochter Sions","tekst":"Dat is, het volk van Jeruzalem, hetwelk Gode zo lief en waard placht te zijn, als een dochter haren ouders. Zie Psa 87:2 ."},{"catchword":"in Zijn toorn","tekst":"Zijnde over haar onstoken vanwege hare zonden en menigvuldige overtredingen."},{"catchword":"bewolkt?","tekst":"Of, met ene wolk bedekt; de zin is: In de plaats, waar God de Heere eertijds zijn volk met een dikke wolk ten goede bedekt heeft, daar bedekt Hij hen nu met een dikke wolk van menigerlei ellende."},{"catchword":"heerlijkheid Israëls","tekst":"Dat is, den heerlijken staat, waarin Hij zijn volk geplant had. Of versta hier door de heerlijkheid van Israël de ark des verbonds; gelijk 1Sa 4:21-22 ."},{"catchword":"van den hemel op de aarde nedergeworpen;","tekst":"Dat is, van den hoogsten trap der voortreffelijke heerlijkheid tot den nederigsten stand der ellende; vergelijk Oba 1:4 ; Psa 102:11 ; Mat 11:23 ."},{"catchword":"aan de voetbank Zijner voeten","tekst":"Dat is, aan zijnen tempel en aan den godsdienst, dien men daarin oefende; of versta door de voetbank de ark des verbonds; zie 1Ch 28:2 ; zie ook Exo 25:18-20 ; 2Sa 6:2 ; 2Ki 19:15 ; Psa 99:5 , en Psa 132:7 ."},{"catchword":"in den dag Zijns toorns","tekst":"Te weten als Hij in zijn toorn Jeruzalem door de Chaldeën heeft laten verdelgen."}],"2":[{"catchword":"al de woningen Jakobs","tekst":"Dat is, al de schone behuizingen, waarin Hij zijn volk, te weten de nakomelingen van Jakob, geplaatst had."},{"catchword":"verslonden,","tekst":"Dat is, schielijk te schande gemaakt, zodat zij schijnen opgeslokt of verslonden te zijn."},{"catchword":"heeft de vastigheden","tekst":"Dat is, al de bolwerken, kastelen, torens, die in het Joodse land opgericht waren tot bescherming des lands; vergelijk Luk 19:44 ."},{"catchword":"der dochter van Juda","tekst":"Dat is, de nakomelingen van Jakob."},{"catchword":"in Zijn verbolgenheid,","tekst":"Ontstoken zijnde over zijn volk vanwege hun menigvuldige overtredingen."},{"catchword":"Hij heeft het koninkrijk","tekst":"Dat is, Hij heeft de ganse natie der Joden, hoge en lage stadspersonen, als onrein verworpen en overgegeven in de handen der goddeloze volken om van hen mishandeld en van alle heerlijkheid beroofd te worden; vergelijk Isa 47:6 ."}],"3":[{"catchword":"in ontsteking des toorns,","tekst":"Dat is, in zijn groten toorn, gelijk Deu 29:24 ."},{"catchword":"den gehelen hoorn","tekst":"Dat is, al de macht en heerlijkheid van het Joodse volk; zie Deu 33:17 ; 1Sa 2:1 ; Jer 48:25 ."},{"catchword":"Hij heeft Zijn rechterhand","tekst":"Dat is, Hij heeft ons zijne macht, bijstand en gunstige hulp onttrokken."},{"catchword":"toen de vijand kwam,","tekst":"Hebreeuws, van, of voor het aangezicht des vijands. De zin is dat Hij de Israëlieten niet helpen wilde toen zij voor den vijand vluchtten."},{"catchword":"tegen Jakob ontstoken","tekst":"Tegen de nakomelingen van Jakob, doch inzonderheid tegen den stam van Juda."}],"4":[{"catchword":"gespannen","tekst":"Hebreeuws, getreden; zie Psa 7:13 ."},{"catchword":"als een vijand;","tekst":"De zin is: De Heere maakt zijne wapenen nog vaardig om ons nog meer te bederven, gelijk de vijanden doen, die elkander zoeken te beschadigen."},{"catchword":"gesteld","tekst":"Te weten tegen Zion."},{"catchword":"al de begeerlijke dingen der ogen;","tekst":"Zie 1Ki 20:6 ; vergelijk Eze 24:16 , Eze 24:21 , Eze 24:25 . Versta hier door de begeerlijke dingen der ogen de jonge manschap, de bloem des volks, idem, de priesters, de vorsten, en al wat lieflijk en aangenaam was."},{"catchword":"in de tent der dochter Sions","tekst":"Dat is, in het midden van zijn volk, of in de stad Jeruzalem."},{"catchword":"uitgestort als een vuur","tekst":"Dat is, zeer overvloedig laten komen; zie de aantekening Psa 79:6 ."}],"5":[{"catchword":"De Heere is geworden als een vijand;","tekst":"Den mensen kan men enigszins tegenstand doen, maar Gode geenszins."},{"catchword":"verslonden,","tekst":"Zie vs.2."},{"catchword":"haar paleizen","tekst":"Te weten van dochter Zions, dat is Jeruzalem."},{"catchword":"deszelfs vastigheden verdorven;","tekst":"Te weten Israëls. De zin is: De Heere heeft al de sterkten en forteressen verwoest, die gebouwd waren tot bescherming der Israëlieten."},{"catchword":"het klagen en kermen vermenigvuldigd","tekst":"Of, de treuring en droefheid; gelijk Isa 29:2 ."}],"6":[{"catchword":"hut","tekst":"Of, tuin; dat is, tabernakel of tempel. Zie Psa 76:3 , en Psa 80:13 , en Psa 89:41 , enz. en Isa 5:5 ."},{"catchword":"met geweld afgerukt,","tekst":"Of, met wrevel. Het Hebreeuwse woord betekent iets met onstuimigheid wegrukken, vergelijk Psa 80:13 , en Psa 89:41 , enz. en Isa 5:5 ."},{"catchword":"Zijn vergaderplaats","tekst":"Of de plaats zijner samenkomst, waar zijn volk placht te vergaderen om den godsdienst te oefenen; te weten den tempel en de synagogen."},{"catchword":"den hoogtijd en den sabbat,","tekst":"Dat is, het houden van de gewone feesten alle jaren en den sabbat alle week."},{"catchword":"den koning en den priester","tekst":"Dat is, de regeerders van landen en steden, alsook de leraars der kerk. De zin is: Hij heeft zo den kerkelijken als den burgerlijken staat het onderst boven gekeerd."}],"7":[{"catchword":"Zijn heiligdom","tekst":"Dat is zijnen tempel."},{"catchword":"te niet gedaan,","tekst":"Anders: verfoeid; alsof het een vervloekte plaats ware geworden, waardig dat men er een afgrijzen van heeft. De zin is: Hij kan nu die plaats niet lijden of verdragen, in welke Hij voor dezen een lust en welgevallen gehad heeft; vergelijk Psa 89:40 ."},{"catchword":"harer paleizen","tekst":"Te weten van de dochter van Zion; dat is Jeruzalem."},{"catchword":"overgegeven;","tekst":"Of, besloten."},{"catchword":"zij hebben in het huis des HEEREN","tekst":"Te weten hare vijanden, en met name de Chaldeën, toen zij de stad en den tempel hadden ingenomen en verwoest, hebben met groten triomf gejuicht, geschreeuwd en geroepen, even gelijk het volk Gods placht te doen op de feestdagen, inzonderheid op de hoge feestdagen, den Heere met vreugdegezang in den tempel lovende; zie Psa 74:4 ."},{"catchword":"verheven","tekst":"Hebreeuws, gegeven."}],"8":[{"catchword":"heeft gedacht","tekst":"Dat is, Hij heeft besloten en verordineerd."},{"catchword":"den muur der dochter Sions;","tekst":"Dat is, de bescherming van Jeruzalem."},{"catchword":"het richtsnoer","tekst":"Dat is, Hij heeft ontworpen de zekerheid van den ondergang der stad Jeruzalem. Zie 2Ki 21:13 ; Isa 34:11 . Het is ene manier van spreken, genomen van de metselaars en timmerlieden."},{"catchword":"niet afgewend,","tekst":"Dat is, niet teruggetogen."},{"catchword":"dat Hij ze niet verslonde;","tekst":"Dat is, Hij heeft niet opgehouden totdat Hij hen ten enenmale verwoest heeft."},{"catchword":"den voormuur en den muur te zamen","tekst":"Of, voorschans, dwinger, bolwerk, vesting, voorburg, wal, forteres; zie Psa 122:7 ."},{"catchword":"treurig gemaakt,","tekst":"Dat is, Hij heeft zelfs den gevoellozen creaturen oorzaak van treuren gegeven."},{"catchword":"verzwakt","tekst":"Te weten, door een geweldig verderf. Anders: verwoest, geruïneerd."}],"9":[{"catchword":"in de aarde verzonken;","tekst":"Alzo dat de vijanden een vrijen pas daardoor gekregen hebben om in de stad te komen."},{"catchword":"haar grendelen","tekst":"Dat is, alle sterkten en sloten, zodat zij nu geen geweld kunnen tegenstaan."},{"catchword":"haar koning en haar vorsten","tekst":"Dat is, zij moeten nu leven en verkeren onder de volken, die den waren godsdienst vijand zijn."},{"catchword":"er is geen wet;","tekst":"Anders: de wet is niet meer; dat is, zij hebben geen gewone oefening hunner religie, door den dienst der priesters en Levieten; want van de profeten wordt straks gesproken."},{"catchword":"vinden ook geen gezicht van den HEERE","tekst":"Dat is, zij hebben ook zo overvloedige openbaringen niet als zij plachten te hebben; zie Psa 74:9 ."}],"10":[{"catchword":"De oudsten","tekst":"Dat is, de wijste en statigste onder het volk, die wel eertijds op koetswagens of schone paarden door de stad en over het land plachten te rijden en te reizen."},{"catchword":"zwijgen stil,","tekst":"Als verbaasd en versuft zijnde vanwege hun grote ellende."},{"catchword":"zij werpen stof op hun hoofd,","tekst":"Zij betonen grote tekenen van verslagenheid en van droefheid. Zie Job 2:12 ."},{"catchword":"zakken aangegord;","tekst":"Dat is, rouwklederen, gelijk Joe 1:8 , Joe 1:13 ; Jon 3:5-6 ; zie de aantekening Gen 37:34 ."},{"catchword":"de jonge dochters van Jeruzalem","tekst":"Die gemeenlijk plachten omhoog te zien [ Isa 3:16 ] , en met haar schoonheid te pronken, die zien nu nederwaarts, als zijnde beschaamd over zichzelven."}],"11":[{"catchword":"Mijn ogen","tekst":"Dat is, ik ween zoveel dat mijne ogen daardoor bijna vergaan zijn. Wij zouden zeggen: Ik schrei mij de ogen uit. Zie Psa 6:7-8 , en de aantekening aldaar."},{"catchword":"beroerd;","tekst":"Zie boven Lam 1:20 ."},{"catchword":"mijn lever","tekst":"Dat is, mijn inwendige delen zijn versmolten en zij ontvallen mij; of het bloed vliet weg uit mijn leven. Zie Job 16:13 ."},{"catchword":"de breuk der dochter mijns volks;","tekst":"Dat is, wanneer ik aanmerk de ellendigheden en verbrekingen, die de kerk Gods lijdt; zie Jer 4:6 ."},{"catchword":"in onmacht zinken;","tekst":"Of, bezwijmen, bezwijken; te weten van honger en dorst en gebrek van alle nooddruft. Zie Isa 57:16 ."}],"12":[{"catchword":"zij tot hun moeders zeggen","tekst":"Te weten de kleine kinderen."},{"catchword":"koren","tekst":"Dat is brood, noodwendig voedsel."},{"catchword":"wijn,","tekst":"Om ons in onze zwakheid te verkwikken."},{"catchword":"als zich hun ziel uitschudt","tekst":"De zin is: Als zij hun leven weder overgeven aan hunne moeders, overmits die hun geen voedsel geven om hen in het leven te behouden."}],"13":[{"catchword":"Wat getuigen","tekst":"Of, wat getuigenis; alsof hij zeide: Welk een voorbeeld zal ik u voor ogen zetten, door hetwelk ik u zou mogen troosten? Ik vind nergens een volk, dat ooit zo hard is gestraft geworden als gij gestraft wordt. Anderen nemen het in dezen zin: Wat zal ik nemen om te getuigen dat gij geen grote redenen hebt om dus te roepen en te tieren. Zie de aantekening Isa 51:19 ."},{"catchword":"bij u vergelijken,","tekst":"Te weten in deze uwe ellende."},{"catchword":"gij dochter Jeruzalems?","tekst":"Dat is, gij volk Gods."},{"catchword":"uw breuk","tekst":"Dat is, uwe ellenden zijn breed, diep, krachtig en schier onbegrijpelijk, gelijk de scheuren of inbreuken, die de zee maakt; gij zijt zulk een spiegel van Gods hevigen toorn als er nog nooit tevoren in de wereld geweest is."},{"catchword":"wie kan u helen?","tekst":"Welke middelen zijn er in de wereld te vinden om u te redden? Naar het oordeel van een ieder is uw staat hopeloos, daar is geen helpen meer aan."}],"14":[{"catchword":"profeten","tekst":"Versta dit van de valse profeten, die de boze Joden zichzelven verkoren hadden, of die zichzelven uitgaven voor leidslieden of stuurlieden en onderwijzers, maar niet van God gezonden, noch de rechte profeten zijnde; zie Jer 2:8 , en Jer 5:31 , en Jer 14:14 , en Jer 23:16 , en Jer 27:10 , en Jer 29:8-9 ; Eze 13:2 ."},{"catchword":"ijdelheid","tekst":"Dat is, zodanige dingen, die ganselijk niet strekten ten goede, noch tot godzaligheid; als bij voorbeeld: zij hebben u den vrede en aller dingen overvloed verkondigd, als God het tegendeel dreigde. Zie Jer 28:2-3 , Jer 28:15 , en Jer 29:8 ."},{"catchword":"ongerijmdheid","tekst":"Hebreeuws, onsmakelijke dingen. Zie Job 1:22 , en Jer 23:13 ."},{"catchword":"gezien,","tekst":"Dat is geprofeteerd. Want profetieën zijn goddelijke gezichten den profeten geopenbaard."},{"catchword":"zij hebben u uw ongerechtigheid niet geopenbaard,","tekst":"Dat is, zij hebben u uwe zonden en overtredingen niet oprechtelijk voorgedragen, om u in uwe conscientie te overtuigen."},{"catchword":"om uw gevangenis","tekst":"Dat is, dat zij u daardoor tot oprecht berouw en leedwezen zouden gebracht hebben, om alzo de oordelen Gods voor te komen."},{"catchword":"zij hebben voor u gezien","tekst":"Dat is, zij hebben u, als in Gods naam, geleerd dingen, die vals en nergens toe nut en oorbaarlijk waren."},{"catchword":"lasten","tekst":"Dat is, profetieën; zie Jer 13:1 ."},{"catchword":"uitstotingen","tekst":"De zin is: Naar welke te luisteren de gereedste weg was om u uit uw land te brengen. Want dwalingen te leren en te geloven is de fontein van al de zonden, om welker wil God gemeenlijk de kinderen der mensen straft."}],"15":[{"catchword":"Allen,","tekst":"Te weten van welken staat of stand zij zijn, doch versta die, welke vreemd zijn van de ware religie."},{"catchword":"klappen met de handen","tekst":"Tot uw spot. Hebreeuws, met de palmen. Zie de aantekening Job 27:23 ."},{"catchword":"zij fluiten","tekst":"Zie 1Ki 9:8 ; 2Ki 19:21 ; Job 16:9 ; Jer 18:16 ."},{"catchword":"waarvan men zeide,","tekst":"Dat is, die men noemde de volmaakte in schoonheid."},{"catchword":"vreugde der ganse aarde?","tekst":"Vergelijk Psa 48:2 , en Psa 50:2 ."}],"16":[{"catchword":"sperren","tekst":"Zie Psa 22:14 . Anders: doen hunnen mond wijd open."},{"catchword":"knersen met de tanden,","tekst":"Of, zij bijten op de tanden."},{"catchword":"Wij hebben haar verslonden;","tekst":"Dat is, wij hebben hen nu to rd":"in het begin der nachtwaken,","tekst":"Hebreeuws, aan het hoofd der [nacht] wachten ; dat is, te dien tijde als de nacht begint."},{"catchword":"stort","tekst":"Vergelijk Psa 22:15 , en Psa 42:5 , en Psa 62:9 , en Psa 102:1 ."},{"catchword":"uw hart uit","tekst":"Dat is, al de zwarigheid, die gij in uw hart hebt."},{"catchword":"handen tot Hem op","tekst":"Hebreeuws, palmen. Alzo vs.20, 22."},{"catchword":"voor de ziel uwer kinderkens,","tekst":"Dat is, voor het leven, gelijk Psa 6:5 . De zin is: Om te bidden dat God uw kleine kinderen wil verschonen."},{"catchword":"die in onmacht gevallen zijn van honger,","tekst":"Of, die versmacht zijn."},{"catchword":"vooraan op alle straten","tekst":"Hebreeuws, aan het hoofd van alle straten; dat is aan alle hoeken, wegen en stegen der stad; vergelijk Isa 51:20 , en onder Lam 4:1 ."}],"20":[{"catchword":"aan wien Gij alzo gedaan hebt;","tekst":"Te weten, niet aan de heidenen, maar aan uw eerstgeboren zoon, Exo 4:22 , aan uw uitverkoren volk van Israël; Exo 19:6 ; Deu 4:7 , en Deu 7:6 ."},{"catchword":"haar vrucht eten,","tekst":"Dat is, hare kinderen, de vrucht van haar buik. De profeet beklaagt hier de wreedheid, die onder Gods volk gebeurde; vergelijk onder Lam 4:10 ."},{"catchword":"die men op de handen draagt?","tekst":"Alzo ook onder vs.22. Anders: die aan de palm geleid worden. Men leest twee malen dat de moeders in het Joodse land hare kinderen gegeten hebben, te weten, in de belegering van Samaria, 2Ki 6:26 , en in de belegering van Jeruzalem door Vespasianus en Titus Josefus."},{"catchword":"in het heiligdom des Heeren gedood worden?","tekst":"Dat is, in den tempel, in die plaats, Heere, die Gij zelf tot een heilig gebruik verordineerd hebt."}],"21":[{"catchword":"mijn jonkvrouwen en mijn jongelingen","tekst":"Die zelfs de wrede soldaten plachten te verschonen."},{"catchword":"zijn door het zwaard gevallen;","tekst":"Zijn wredelijk omgebracht."},{"catchword":"Gij hebt ze in den dag Uws toorns gedood,","tekst":"Gi /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
