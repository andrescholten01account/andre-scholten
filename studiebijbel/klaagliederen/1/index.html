tot aan de poort van Jeruzalem.", "Pred 4:1": "Daarna richtte ik mijn aandacht en zag alle onderdrukkingen die onder de zon gebeuren; en zie, er waren de tranen van de verdrukten, en van hen die geen trooster hadden; en aan de kant van hun verdrukkers was macht, zij daarentegen hadden geen trooster.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Spr 17:22": "Een blij hart zal goed doen als een medicijn; maar een verslagen geest zal het gebeente doen verdrogen.", "Matt 23:2-33": "en zei: De Schriftgeleerden en de Farizeeën zitten op de stoel van Mozes; daarom, alles wat zij u zeggen dat u houden moet, houd dat en doe het; maar doe niet naar hun werken, want zij zeggen het, en doen het niet. Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "Mark 6:2": "En toen het sabbat geworden was, begon Hij in de synagoge te onderwijzen; en velen die Hem hoorden, waren verbaasd, en zeiden: Waar komen Deze deze dingen vandaan, en wat is dit voor wijsheid die Hem gegeven is, dat ook zulke krachten door Zijn handen gebeuren?", "Jes 28:17-22": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen. En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn.", "Num 16:15": "Toen ontstak Mozes zeer, en hij zei tegen de HEERE: Zie hun offer niet aan! Ik heb niet één ezel van hen genomen, en niemand van hen kwaad gedaan.", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Luk 13:10-17": "En Hij gaf onderwijs op de sabbat in een van de synagogen. En zie, er was een vrouw die al achttien jaar lang een geest van ziekte had, en zij was samengebogen en kon zich totaal niet oprichten. En Jezus zag haar, riep haar bij Zich en zei tegen haar: Vrouw, u bent verlost van uw ziekte.", "Joh 5:5-14": "En daar was een zeker mens, die achtendertig jaar ziek geweest was. Toen Jezus hem zag liggen en wist dat hij al lange tijd zo was, zei Hij tegen hem: Wilt u gezond worden? De zieke antwoordde Hem: Heere, ik heb geen mens om mij in het badwater te brengen, wanneer het water bewogen wordt; en terwijl ik kom, gaat een ander vóór mij naar beneden.", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "2 Kron 19:7": "Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "2 Kon 6:33": "Terwijl hij nog met hen sprak, zie, zo kwam de bode bij hem af; en hij zei: Zie, dit kwaad is van de HEERE; wat zou ik nog langer op de HEERE wachten?", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Jes 47:3": "Uw schaamte zal ontdekt worden, ook zal uw schande gezien worden; Ik zal wraak nemen, en Ik zal u niet aanvallen als een mens.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Ps 137:8": "O dochter van Babel! die verwoest zal worden, gelukkig zal hij zijn, die u uw misdaad vergelden zal, die u aan ons misdaan hebt.", "Ezech 25:15": "Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap;", "Spr 19:7": "Al de broeders van de arme haten hem; hoeveel te meer gaan zijn vrienden ver van hem weg! Hij loopt hen achterna met woorden, die niets zijn.", "Ps 6:7": "Ik ben moe van mijn zuchten; ik laat mijn bed de hele nacht zwemmen; ik doornat mijn bedstede met mijn tranen.", "Ezech 7:15": "Het zwaard is buiten, en de pest en de honger van binnen; die op het veld is, zal door het zwaard sterven, en die in de stad is, die zal de honger en de pest verteren.", "Deut 28:65": "Daarbij zult u onder die volken geen rust vinden, en uw voetzool zal geen rust hebben; want de HEERE zal u daar een bevend hart geven, en bezwijking van de ogen, en kwelling van de ziel.", "Jes 48:1": "Hoor dit, huis van Jakob, die genoemd wordt met de naam van Israël, en uit de wateren van Juda voortgekomen bent! Die daar zweert bij de Naam van de HEERE, en de God van Israël vermeldt, maar niet in waarheid, en ook niet in gerechtigheid.", "Klaagl 3:48": "Pe. Met waterbeken loopt mijn oog neer, vanwege de breuk van de dochter van mijn volk.", "Richt 9:57": "Op dezelfde manier liet God al het kwaad van de mensen van Sichem op hun hoofd terugkomen; en de vloek van Jotham, de zoon van Jerubbaäl, kwam over hen.", "Matt 12:10-12": "En kijk, er was een mens die een verschrompelde hand had, en zij vroegen Hem: Is het geoorloofd op de sabbatdagen te genezen? (om Hem te kunnen beschuldigen.) En Hij zei tegen hen: Wie onder u is er die een schaap heeft, en als dat op een sabbatdag in een greppel valt, zal hij het niet vastpakken en eruit heffen? Hoeveel gaat een mens dan een schaap te boven! Daarom is het op de sabbatdagen geoorloofd goed te doen.", "Hand 4:30": "Doordat U Uw hand uitstrekt tot genezing, en doordat er tekenen en wonderen gebeuren door de Naam van Uw heilig Kind Jezus.", "Jer 5:12": "Zij verloochenen de HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen geen zwaard en geen honger zien.", "Ps 109:15": "Laat ze voortdurend voor de HEERE zijn; en Hij roeit hun gedachtenis uit van de aarde.", "Ezech 46:3": "Ook zal het volk van het land aanbidden voor de deur van die poort, op de sabbatten en op de nieuwe manen, voor het aangezicht van de HEERE.", "Ps 147:20": "Zo heeft Hij met geen enkel volk gedaan; en Zijn rechten, die kennen zij niet. Hallelujah!", "Matt 22:18": "Maar Jezus doorzag hun boosheid, en zei: Huichelaars, waarom stelt u Mij op de proef?", "Spr 19:29": "Gerichten zijn voor de spotters bereid, en slagen voor de rug van de dwazen.", "Rom 8:20": "Want de schepping is aan de zinloosheid onderworpen, niet vrijwillig, maar om hem die haar daaraan onderworpen heeft,", "Jer 48:33": "Zodat de blijdschap en vreugde uit het vruchtbare veld, namelijk uit Moabs land, weggenomen is; want Ik heb de wijn doen ophouden uit de kuipen; men zal geen druiven treden met vreugdegeroep; het vreugdegeroep zal geen vreugdegeroep zijn.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Luk 16:13": "Geen huisknecht kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten; u kunt God niet dienen en de Mammon.", "Ps 31:18": "HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.", "Rom 9:21": "Of heeft de pottenbakker geen macht over het leem, om uit dezelfde klomp het ene vat tot eer te maken, en het andere tot oneer?", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Ruth 1:21": "Vol trok ik weg, maar leeg heeft de HEERE mij laten terugkeren; waarom zouden jullie mij Naomi noemen, terwijl de HEERE tegen mij getuigt, en de Almachtige mij kwaad heeft aangedaan?", "Deut 32:27": "Ware het niet, dat Ik de toorn van de vijand vreesde, dat hun tegenpartijen zich niet vreemd zouden houden; dat zij niet zouden zeggen: Onze hand is hoog geweest; de HEERE heeft dit alles niet gedaan.", "1 Kon 9:9": "En men zal zeggen: Omdat zij de HEERE, hun God, verlaten hebben, Die hun vaderen uit het land Egypte uitgevoerd had, en zich aan andere goden gehouden hebben, en zich voor hen neergebogen, en hen gediend; daarom heeft de HEERE al dit kwaad over hen gebracht.", "Lev 10:1-3": "En de zonen van Aäron, Nadab en Abihu, namen ieder zijn wierookvat en deden er vuur in, en legden er reukwerk op, en brachten vreemd vuur voor het aangezicht van de HEERE, wat Hij hun niet geboden had. Toen ging er een vuur uit van het aangezicht van de HEERE, en verteerde hen; en zij stierven voor het aangezicht van de HEERE. En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "Jes 10:17": "Want het Licht van Israël zal tot een vuur zijn, en zijn Heilige tot een vlam, die in brand zal steken en verteren zal zijn doornen en zijn distels, op één dag.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Jer 32:2": "(Het leger van de koning van Babel belegerde toen Jeruzalem, en de profeet Jeremia zat opgesloten in het voorhof van de bewaking, dat bij het huis van de koning van Juda is.", "Ps 1:1": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;", "Jer 21:5": "En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid.", "Ps 119:71": "Het is mij goed, dat ik verdrukt ben geweest, opdat ik Uw inzettingen leerde.", "Ex 35:3": "U zult geen vuur aansteken in enige van uw woningen op de sabbatdag.", "Ps 39:11": "Neem Uw plaag van mij weg; ik ben bezweken door de slagen van Uw hand.", "Micha 3:9-12": "Hoor nu dit, hoofden van het huis van Jakob, en leiders van het huis van Israël! die van het gericht een gruwel hebben, en alles wat recht is verdraaien; Zij bouwen Sion met bloed, en Jeruzalem met onrecht. Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Jes 45:21": "Verkondig het en treed hier toe, ja, beraadslaag samen: wie heeft dat van oudsher laten horen? Wie heeft dat van toen af verkondigd? Ben Ik het niet, de HEERE? En er is geen God meer behalve Mij, een rechtvaardig God, en een Heiland, niemand is er dan Ik.", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Luk 23:56": "En zij keerden terug en bereidden specerijen en zalven; en op de sabbat rustten zij, volgens het gebod.", "Ps 38:3-7": "Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald. Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde. Want mijn ongerechtigheden gaan over mijn hoofd; als een zware last zijn zij mij te zwaar geworden.", "Rom 3:6": "Dat zij verre, anders hoe zal God de wereld oordelen?", "Klaagl 1:9-11": "Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar einde, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot. Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden. Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "Deut 26:7": "Toen riepen wij tot de HEERE, de God van onze vaderen; en de HEERE hoorde onze stem en zag onze ellende aan, en onze arbeid, en onze onderdrukking.", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Job 6:4": "Want de pijlen van de Almachtige zijn in mij, waarvan het vurige venijn mijn geest uitdrinkt; de verschrikkingen van God rusten zich tegen mij.", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Ezech 25:4": "Daarom, zie, Ik zal u overgeven aan die van het oosten tot een bezitting, zodat zij hun burchten in u zetten, en hun woningen in u plaatsen; die zullen uw vruchten eten, en die zullen uw melk drinken.", "2 Kon 24:14-16": "En hij voerde heel Jeruzalem weg, alsook al de vorsten, en alle strijdbare helden, tienduizend gevangenen, en alle timmerlieden en smeden; niemand werd overgelaten, dan het arme volk van het land. Zo voerde hij Jojachin weg naar Babel, alsook de moeder van de koning, en de vrouwen van de koning, en zijn hovelingen; daartoe bracht hij de machtigen van het land gevangen van Jeruzalem naar Babel; En alle sterke mannen, tot zevenduizend, en timmerlieden en smeden, tot duizend, en alle helden, die geoefend waren voor de oorlog; dezen bracht de koning van Babel gevangen naar Babel.", "1 Kon 8:46": "Wanneer zij tegen U gezondigd zullen hebben (want er is geen mens die niet zondigt), en U tegen hen vertoornd zult zijn, en hen leveren zult voor het aangezicht van de vijand, zodat hun overwinnaars hen gevankelijk wegvoeren naar het land van de vijand, veraf of nabij;", "Jes 49:14": "Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten.", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Hos 8:2": "Dan zullen zij tot Mij roepen: Mijn God! Wij, Israël, kennen U.", "2 Petr 3:4": "En zeggen: Waar is de belofte van Zijn komst? Want vanaf de dag dat de vaders ontslapen zijn, blijven alle dingen zo, net zoals vanaf het begin van de schepping.", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Ps 80:7": "U hebt ons onze buren tot een twist gesteld, en onze vijanden spotten onder elkaar.", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "2 Tim 4:14": "Alexander, de kopersmid, heeft mij veel kwaad aangedaan; de Heere zal hem vergelden naar zijn werken.", "Ezech 7:26": "Ellende zal op ellende komen, en er zal gerucht op gerucht wezen; dan zullen zij het visioen van een profeet zoeken; maar de wet zal vergaan van de priester, en de raad van de oudsten.", "2 Kron 8:13": "namelijk naar de eis van elke dag, terwijl hij offerde volgens het gebod van Mozes, op de sabbatten, en op de nieuwe manen, en op de vastgestelde hoogtijden, drie keer per jaar; op het feest van de ongezuurde broden, en op het feest van de weken, en op het feest van de loofhutten.", "Job 35:14": "Dat u ook gezegd hebt: U zult Hem niet aanschouwen; er is toch een oordeel voor Zijn aangezicht, wacht u dan op Hem.", "Lev 26:15-46": "En als u Mijn inzettingen smadelijk verwerpt, en als uw ziel van Mijn rechten walgt, zodat u niet al Mijn geboden doet, om Mijn verbond te vernietigen; Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten. Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand.", "Gen 25:8": "En Abraham gaf de geest en stierf, in goede ouderdom, oud en verzadigd van het leven, en hij werd verzameld tot zijn volk.", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Ps 7:3": "Anders zou hij mijn ziel roven als een leeuw, die verscheurt, terwijl er geen redder is.", "Neh 9:14": "En U hebt Uw heilige sabbat bekendgemaakt; en U hebt hun geboden, en inzettingen en een wet bevolen, door de hand van Uw knecht Mozes.", "Jer 3:11": "Toen zei de HEERE tegen mij: Het afgekeerde Israël heeft zichzelf rechtvaardiger getoond dan de trouweloze Juda.", "Hos 10:1": "Israël is een uitgeledigde wijnstok, hij brengt weer vrucht voort voor zichzelf; maar naar de veelheid van zijn vrucht heeft hij de altaren vermeerderd; naar de goedheid van zijn land hebben zij de opgerichte beelden mooi gemaakt.", "Jer 17:22": "Ook zult u geen last uitvoeren uit uw huizen op de sabbatdag, en geen enkel werk doen; maar u zult de sabbatdag heiligen, zoals Ik uw vaderen geboden heb.", "Jer 15:13": "Ik zal uw vermogen en uw schatten als een roof geven, zonder prijs; en dat om al uw zonden, en in al uw gebieden.", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "Jes 42:25": "Daarom heeft Hij over hen uitgestort de grimmigheid van Zijn toorn en de macht van de oorlog; en Hij heeft ze rondom in vlam gezet, doch zij merken het niet; en Hij heeft ze in brand gestoken, doch zij nemen het niet ter harte.", "Num 14:27-34": "Hoelang zal Ik het bij deze slechte vergadering uithouden, die tegen Mij morren? Ik heb het gemor van de kinderen van Israël gehoord, waarmee zij tegen Mij morren. Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de HEERE, zoals u in Mijn oren gesproken hebt, zo zal Ik u doen! Uw dode lichamen zullen in deze woestijn vallen; en al uw getelden, naar uw hele aantal, van twintig jaar oud en daarboven, u die tegen Mij gemord hebt.", "2 Kon 2:24": "En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.", "Deut 8:5": "Erken dan in uw hart, dat de HEERE, uw God, u opvoedt, zoals een man zijn zoon opvoedt.", "Job 22:13": "Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen?", "Openb 18:7": "Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien.", "Ezech 20:20": "En heiligt Mijn sabbatten, en zij zullen tot een teken zijn tussen Mij en u, opdat u weet dat Ik, de HEERE, uw God ben.", "Jes 52:1": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen.", "Jes 58:13": "Als u uw voet van de sabbat afkeert, van het doen van uw eigen wil op Mijn heilige dag; en als u de sabbat een verlustiging noemt, opdat de HEERE geheiligd wordt, Die geëerd moet worden; en als u die eert, doordat u uw eigen wegen niet gaat, en uw eigen wil niet zoekt, noch een woord daarover spreekt;", "Jes 47:8": "Nu dan, hoor dit, weelderige! Die zo zeker woont, die in haar hart zegt: Ik ben het, en niemand meer dan ik: ik zal geen weduwe zitten, en de beroving van kinderen niet kennen.", "Jes 9:16": "Daarom zal de Heere Zich niet verblijden over hun jongelingen, en over hun wezen en hun weduwen zal Hij Zich niet ontfermen, want zij zijn allen samen huichelaars en boosdoeners, en elke mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Mark 7:6-8": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij. Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen; Want u laat het gebod van God los, en houdt vast aan de overleveringen van mensen, namelijk het wassen van kannen en drinkbekers; en vele andere dergelijke dingen doet u.", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Ezech 22:8": "Mijn heilige dingen hebt u veracht, en Mijn sabbatten hebt u ontheiligd.", "Luk 14:35": "Het is niet meer geschikt voor het land, en ook niet voor de mesthoop; men gooit het weg. Wie oren heeft om te horen, laat hij horen.", "Jer 18:19": "HEERE, luister naar mij, en hoor naar de stem van hen die met mij twisten.", "Neh 5:4": "Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Ps 11:5": "De HEERE beproeft de rechtvaardige; maar de goddeloze, en wie geweld liefheeft, haat Zijn ziel.", "Ps 119:84": "Hoeveel zullen de dagen van Uw knecht zijn? Wanneer zult U recht doen over mijn vervolgers?", "2 Kon 21:12-15": "Daarom, zo zegt de HEERE, de God van Israël: Zie, Ik ga een kwaad over Jeruzalem en Juda brengen, zodat ieder die het hoort, beide zijn oren zullen tuiten. En Ik zal over Jeruzalem het meetsnoer van Samaria trekken, alsook het paslood van het huis van Achab; en Ik zal Jeruzalem uitwissen, zoals men een schotel uitwist; men wist hem uit, en men keert hem om op zijn holle kant. En Ik zal het overblijfsel van Mijn erfdeel verlaten, en zal het in de hand van hun vijanden geven; en zij zullen tot een roof en plundering worden voor al hun vijanden.", "Jes 37:4": "Misschien zal de HEERE, uw God, de woorden horen van Rabsaké, aan wie zijn heer, de koning van Assyrië, gezonden heeft, om de levende God te honen en te schelden met woorden die de HEERE, uw God, gehoord heeft; hef dan een gebed op voor het overblijfsel dat nog gevonden wordt.", "Klaagl 3:34": "Lamed. Dat men al de gevangenen van de aarde onder Zijn voeten verbrijzelt;", "Gen 2:2": "Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.", "Job 33:16-30": "Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding; Opdat Hij de mens afwendt van zijn werk, en van de man de hoogmoed verbergt; Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "Jer 27:12": "Daarna sprak ik tot Zedekia, de koning van Juda, naar al deze woorden, en zei: Breng uw halzen onder het juk van de koning van Babel, en dien hem en zijn volk, dan zult u leven.", "Lev 26:17": "Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand.", "Ps 40:14": "Het behaagt U, HEERE! mij te verlossen; HEERE! haast U tot mijn hulp.", "Jes 39:8": "Maar Hizkia zei tegen Jesaja: Het woord van de HEERE dat u gesproken hebt, is goed. Ook zei hij: Er zal immers vrede en waarheid zijn in mijn dagen!", "Klaagl 2:20-22": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden? Schin. De jongen en de ouden liggen op de aarde op de straten; mijn jonkvrouwen en mijn jongelingen zijn door het zwaard gevallen; Gij hebt ze gedood in de dag van Uw toorn, Gij hebt ze geslacht en niet verschoond. Thau. Gij hebt mijn verschrikkingen van rondom geroepen, als tot een dag van een gezet hoogtijd; en er is niemand aan de dag van de toorn van de HEERE ontkomen of overgebleven; die ik op de handen gedragen en opgevoed heb, die heeft mijn vijand omgebracht.", "Ps 119:77": "Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.", "Matt 25:3": "Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Lev 26:36-39": "En wat betreft de overgeblevenen onder u, Ik zal in hun hart een angstige zwakheid laten komen in de landen van hun vijanden; zodat het geruis van een opgejaagd blad hen zal opjagen, en zij zullen vluchten, zoals men vlucht voor een zwaard, en zullen vallen, terwijl niemand hen opjaagt. En zij zullen de een over de ander vallen als voor het zwaard, terwijl niemand hen opjaagt; en u zult niet kunnen standhouden voor het aangezicht van uw vijanden. Maar u zult omkomen onder de heidenen, en het land van uw vijanden zal u verteren.", "Ezech 16:37": "daarom, zie, Ik zal al uw minnaars verzamelen, met wie u vermengd bent geweest, en allen die u liefgehad hebt, met allen die u gehaat hebt; en Ik zal hen van rondom tegen u verzamelen, en Ik zal voor hen uw naaktheid ontdekken, zodat zij uw hele naaktheid zullen zien.", "Ps 142:3": "Ik stortte mijn klacht uit voor Zijn aangezicht; ik maakte voor Zijn aangezicht mijn benauwdheid bekend.", "Ps 107:4": "Die in de woestijn dwaalden, op een weg door de wildernis, die geen stad vonden om in te wonen;", "Ezech 18:30": "Daarom zal Ik u richten, o huis van Israël, ieder naar zijn wegen, spreekt de Heere HEERE. Keer terug, en bekeer u van al uw overtredingen, zo zal de ongerechtigheid u niet tot een struikelblok worden.", "Ps 35:22": "HEERE! U hebt het gezien, zwijg niet; Heere! Wees niet ver van mij.", "Hos 8:13": "Aangaande de offers van Mijn gaven: zij offeren vlees en eten het, maar de Heere heeft in hen geen welbehagen. Nu zal Hij aan hun ongerechtigheid denken en hun zonden straffen; zij zullen terugkeren naar Egypte.", "Matt 7:5": "Huichelaar! Haal eerst de balk uit uw eigen oog, en dan zult u goed genoeg zien om de splinter uit het oog van uw broeder te halen.", "Ps 69:24": "Laat hun ogen duister worden, dat zij niet zien; en doe hun heupen voortdurend waggelen.", "Ps 106:47": "Verlos ons, HEERE, onze God! en verzamel ons uit de heidenen, opdat wij de Naam van Uw heiligheid loven, ons beroemend in Uw lof.", "1 Kor 13:1": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn.", "Ps 6:2-8": "O HEERE, straf mij niet in Uw toorn, en tuchtig mij niet in Uw grimmigheid! Wees mij genadig, HEERE, want ik ben verzwakt; genees mij, HEERE, want mijn beenderen zijn verschrikt. Ja, mijn ziel is zeer verschrikt; en U, HEERE, hoe lang nog?", "Jer 10:19": "O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!", "Openb 16:5-7": "En ik hoorde de engel van het water zeggen: U bent rechtvaardig, Heere! Die is, en Die was, en Die zijn zal, dat U dit geoordeeld hebt; Omdat zij het bloed van de heiligen en van de profeten vergoten hebben, hebt U hun ook bloed te drinken gegeven; want zij zijn het waard. En ik hoorde een ander vanaf het altaar zeggen: Ja, Heere, U almachtige God! Uw oordelen zijn waarachtig en rechtvaardig.", "Mal 3:14": "U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?", "Jak 1:22-24": "En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel; Want hij heeft zichzelf bekeken, en is weggegaan, en heeft meteen vergeten hoe hij eruitzag.", "Matt 26:44": "En Hij liet hen achter, ging opnieuw weg, en bad voor de derde keer, met dezelfde woorden.", "2 Kron 36:21": "Opdat het woord van de HEERE vervuld werd, door de mond van Jeremia, totdat het land aan zijn sabbatten een welgevallen had; het rustte al de dagen van de verwoesting, totdat de zeventig jaren vervuld waren.", "Klaagl 4:17-20": "Ain. Nog steeds bezweken onze ogen, terwijl ze uitkeken naar onze nutteloze hulp; wij tuurden met gespannen aandacht naar een volk dat niet kon verlossen. Tsade. Zij hebben onze gangen nagespeurd, zodat wij op onze straten niet gaan konden; ons einde is genaderd, onze dagen zijn vervuld, ja, ons einde is gekomen. Koph. Onze vervolgers waren sneller dan de arenden van de hemel; zij hebben ons op de bergen fel vervolgd, in de woestijn hebben zij ons een hinderlaag gelegd.", "2 Kon 24:8-16": "Jojachin was achttien jaar oud toen hij koning werd, en regeerde drie maanden in Jeruzalem; en de naam van zijn moeder was Nehusta, een dochter van Elnathan, uit Jeruzalem. En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vader gedaan had. In die tijd trokken de dienaren van Nebukadnezar, de koning van Babel, naar Jeruzalem; en de stad werd belegerd.", "Spr 14:13": "Het hart zal ook bij het lachen verdriet hebben; en het einde van die blijdschap is droefheid.", "Ex 35:2": "Zes dagen zal men het werk doen; maar op de zevende dag zal het voor u heiligheid zijn, een sabbat van rust voor de HEERE; ieder die daarop werk doet, zal gedood worden.", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Gen 18:21": "Zal Ik nu afgaan en zien of zij naar hun geroep, dat tot Mij gekomen is, het uiterste gedaan hebben, en zo niet, Ik zal het weten.", "Ex 14:11": "En zij zeiden tegen Mozes: Had u ons daarom, omdat er in Egypte helemaal geen graven waren, weggehaald, opdat wij in deze woestijn zouden sterven? Waarom heeft u ons dit aangedaan, dat u ons uit Egypte hebt weggevoerd?", "Ps 25:16-19": "Pe. Wend U tot mij, en wees mij genadig, want ik ben eenzaam en ellendig. Tsade. De benauwdheden van mijn hart hebben zich wijd uitgestrekt; voer mij uit mijn noden. Resch. Zie mijn ellende, en mijn moeite, en neem al mijn zonden weg.", "Jes 50:5": "De Heere HEERE heeft Mij het oor geopend, en Ik ben niet opstandig, Ik wijk niet terug.", "Jer 6:3": "Maar er zullen herders tot haar komen met hun kudden; zij zullen tenten rondom tegen haar opslaan; zij zullen ieder zijn ruimte afweiden.", "Joz 24:19": "Toen zei Jozua tegen het volk: U zult de HEERE niet kunnen dienen, want Hij is een heilig God; Hij is een na-ijverig God; Hij zal uw overtredingen en uw zonden niet vergeven.", "Ezech 7:24": "Daarom zal Ik de kwaadste van de heidenvolken doen komen, die hun huizen erfelijk zullen bezitten, en Ik zal de hoogmoed van de sterken doen ophouden, en die hen heiligen, zullen ontheiligd worden.", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "Dan 4:24-26": "Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal: Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil. Dat er ook gezegd is dat men de stronk met de wortels van die boom zou laten staan; uw koninkrijk zal u zeker blijven, nadat u zult hebben erkend dat de Hemel heerst.", "Jer 12:7": "Ik heb Mijn huis verlaten, Ik heb Mijn erfenis laten varen; Ik heb de beminde van Mijn ziel in de hand van haar vijanden gegeven.", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "Ezech 12:13": "Ik zal ook Mijn net over hem uitspreiden, zodat hij in Mijn jachtnet gegrepen wordt; en Ik zal hem brengen naar Babylonië, het land van de Chaldeeën; ook zal hij dat niet zien, hoewel hij daar zal sterven.", "Ps 106:6": "Wij hebben gezondigd, alsook onze vaderen, wij hebben verkeerd gedaan; wij hebben goddeloos gehandeld.", "2 Tess 1:8": "Met vlammend vuur, wraak oefenend over hen die God niet kennen, en over hen die het Evangelie van onze Heere Jezus Christus niet gehoorzaam zijn.", "Jer 7:4": "Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze!", "Ps 42:11": "Met een doodsteek in mijn beenderen honen mij mijn tegenstanders, als zij de hele dag tegen mij zeggen: Waar is uw God?", "Ps 94:12": "Gelukkig is de man, o HEERE! die Gij tuchtigt, en die Gij leert uit Uw wet,", "Matt 11:30": "Want Mijn juk is zacht, en Mijn last is licht.", "Neh 9:33": "Doch U bent rechtvaardig, in alles wat ons overkomen is; want U hebt trouw gehandeld, maar wij hebben goddeloos gehandeld.", "Jes 13:1": "De last van Babel, die Jesaja, de zoon van Amoz, gezien heeft.", "Ps 7:8": "Zo zal de vergadering van de volken U omringen; keer dan boven haar terug in de hoogte.", "Jes 3:26": "En haar poorten zullen treuren, en leed dragen, en zij zal, leeggemaakt, op de aarde zitten.", "Ezech 36:17": "Mensenkind! Het huis van Israël, toen zij in hun land woonden, verontreinigden zij dat met hun weg en met hun handelingen; hun weg was voor Mijn aangezicht als de onreinheid van een afgezonderde vrouw.", "Ps 119:136": "Waterbeken vlieten af uit mijn ogen, omdat zij Uw wet niet onderhouden.", "Dan 9:17-19": "En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf. Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn. O Heere, hoor! o Heere, vergeef! o Heere, merk op en doe het, wacht er niet mee! Om Uzelf, o mijn God! Want Uw stad, en Uw volk is naar Uw Naam genoemd.", "Klaagl 4:21": "Schin. Wees vrolijk, en verblijd u, dochter van Edom, die in het land Uz woont! toch zal de beker ook naar u toe komen, u zult dronken worden, en zich ontbloten.", "Jer 14:18": "Als ik uitga naar het veld, zie ik daar de verslagenen van het zwaard, en als ik in de stad kom, zie ik daar de zieken van honger! Ja, zowel de profeten als de priesters trekken rond in het land, en weten geen raad.", "1 Sam 30:11": "En zij vonden een Egyptische man op het veld, en zij brachten hem naar David; en zij gaven hem brood, en hij at, en zij gaven hem water te drinken.", "Lev 26:33": "Daartoe zal Ik u onder de heidenen verstrooien; en een zwaard achter u trekken; en uw land zal woest zijn, en uw steden zullen een woestijn zijn.", "Ezech 20:16": "Omdat zij Mijn rechten verwierpen, en in Mijn inzettingen niet wandelden, en Mijn sabbatten ontheiligden; want hun hart ging hun drekgoden achterna.", "Job 21:22": "Zal men God wetenschap leren, terwijl Hij hen die hoog zijn richt?", "Ezech 39:23": "En de heidenen zullen weten dat zij die van het huis van Israël zijn, gevankelijk zijn weggevoerd om hun ongerechtigheid, omdat zij tegen Mij hadden overtreden, en dat Ik Mijn aangezicht voor hen verborgen heb, en hen heb overgegeven in de hand van hun tegenstanders, zodat zij allemaal door het zwaard gevallen zijn;", "Amos 5:21-27": "Ik haat, Ik verafschuw uw feesten, en Ik kan uw verbodsdagen niet rieken. Want al offert u Mij brandoffers, alsook uw spijsoffers, Ik heb er toch geen welgevallen aan; en het dankoffer van uw vette beesten wil Ik niet aanzien. Doe het lawaai van uw liederen van Mij weg; ook wil Ik het spel van uw luiten niet horen.", "Ps 109:28": "Laat hen vloeken, maar zegen Ú; laat hen opstaan, maar laat hen beschaamd worden; maar laat Uw knecht zich verblijden.", "Ps 32:3": "Toen ik zweeg, verouderden mijn beenderen, in mijn brullen de hele dag.", "Ezech 22:24-31": "Mensenkind, zeg tegen haar: U bent een land dat niet gereinigd is, dat zijn plasregen niet gehad heeft op de dag van de gramschap. De samenzwering van haar profeten heerst in haar midden als een brullende leeuw die een prooi rooft; zij eten de zielen op, de schat en het kostbare nemen zij weg; haar weduwen vermenigvuldigen zij in haar midden. Haar priesters doen Mijn wet geweld aan, en zij ontheiligen Mijn heilige dingen; tussen het heilige en het onheilige maken zij geen onderscheid, en het verschil tussen het onreine en het reine geven zij niet te kennen; daarbij verbergen zij hun ogen voor Mijn sabbatten; ja, Ik word in hun midden ontheiligd.", "Ps 25:18": "Resch. Zie mijn ellende, en mijn moeite, en neem al mijn zonden weg.", "Neh 1:7": "Wij hebben het helemaal tegen U verdorven; en wij hebben niet gehouden de geboden, noch de inzettingen, noch de rechten, die U Uw dienaar Mozes geboden hebt.", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "Ps 55:16": "Laat de dood hen overvallen als een schuldeiser, laat hen levend in het dodenrijk neerdalen; want boosheden zijn in hun woning, in hun binnenste.", "Jer 24:9": "En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben;", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "Jer 6:20": "Waartoe zal dan de wierook voor Mij uit Scheba komen, en de beste kalmus uit ver land? Uw brandoffers zijn Mij niet behagelijk, en uw slachtoffers zijn Mij niet zoet.", "Job 27:13-18": "Dit is het deel van de goddeloze mens bij God, en de erve van de tirannen, die zij van de Almachtige ontvangen zullen. Indien zijn kinderen zich vermenigvuldigen, het is voor het zwaard; en zijn spruiten zullen van brood niet verzadigd worden. Zijn overgeblevenen zullen in de dood begraven worden, en zijn weduwen zullen niet wenen.", "Gen 3:17": "En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven.", "Jer 42:20-22": "Zeker, u hebt uzelf misleid; want u hebt mij tot de HEERE, uw God, gezonden, en gezegd: Bid voor ons tot de HEERE, onze God, en maak ons alles bekend wat de HEERE, onze God, zal zeggen, en wij zullen het doen. Nu heb ik het u heden bekendgemaakt; maar u hebt niet geluisterd naar de stem van de HEERE, van uw God, noch naar al hetgeen waarmee Hij mij tot u gezonden heeft. Zo weet nu zeker, dat u door het zwaard, door de honger en door de pestilentie zult sterven, op de plaats waar u naartoe wilde gaan om daar als vreemdelingen te wonen.", "Hand 16:30": "En hij bracht hen naar buiten en zei: Beste heren, wat moet ik doen om zalig te worden?", "Ex 5:2": "Maar Farao zei: Wie is de HEERE, Wiens stem ik gehoorzamen zou, om Israël te laten trekken? Ik ken de HEERE niet, en ik zal ook Israël niet laten trekken.", "Spr 14:8": "De wijsheid van de kloekzinnige is zijn weg te begrijpen; maar dwaasheid van de dwazen is bedrog.", "Joh 12:15": "Vrees niet, dochter van Sion, zie, uw Koning komt, zittend op het veulen van een ezelin.", "Ps 17:2": "Laat mijn recht van voor Uw aangezicht uitgaan, laat Uw ogen aanschouwen wat recht is.", "2 Petr 2:17": "Dezen zijn waterloze bronnen, wolken die door een storm worden voortgedreven; voor hen is de donkerheid van de duisternis voor eeuwig bewaard.", "Jer 51:49": "Zoals Babel geweest is tot een val van de verslagenen van Israël, zo zullen te Babel de verslagenen van het hele land vallen.", "Ezech 23:22-25": "Daarom, o Oholiba! Zo zegt de Heere HEERE: Zie, Ik zal uw minnaars, van wie uw ziel is afgekeerd, tegen u opwekken, en Ik zal hen van rondom tegen u aanbrengen. De zonen van Babel en alle Chaldeeën, Pekod, en Soa, en Koa, en alle zonen van Assur met hen; aantrekkelijke jonge mannen, die allen vorsten en machthebbers zijn, hoofdmannen en vermaarde mannen, die allen te paard rijden. Die zullen tegen u komen met karren, wagens en wielen, en met een menigte van volken, met kleine schilden, grote schilden, en helmen; zij zullen zich rondom tegen u opstellen; en Ik zal voor hun aangezicht het strafgericht neerleggen, en zij zullen u berechten naar hun rechtsregels.", "Rom 2:6": "Die ieder zal vergelden naar zijn werken:", "Neh 6:14": "Denk toch, mijn God, aan Tobia en aan Sanballat, naar deze daden van hen; en ook aan de profetes Noadja en de andere profeten, die mij bang hebben proberen te maken.", "Hos 2:6": "En zij zal haar minnaars nalopen, maar hen niet aantreffen; en zij zal hen zoeken, maar niet vinden; dan zal zij zeggen: Ik zal heengaan, en terugkeren naar mijn vorige Man, want toen ging het mij beter dan nu.", "Spr 9:12": "Als u wijs bent, bent u wijs voor uzelf; en bent u een spotter, dan zult u het alleen dragen.", "Ex 4:31": "En het volk geloofde, en zij hoorden, dat de HEERE de kinderen van Israël bezocht had, en dat Hij hun verdrukking gezien had, en zij bogen hun hoofden, en aanbaden.", "Ps 71:13": "Laat hen beschaamd worden, laat hen verteerd worden, die mijn ziel tegenstaan; laat hen met smaad en schande overdekt worden, die mijn kwaad zoeken.", "2 Kor 5:12": "Want wij prijzen onszelf bij u niet opnieuw aan, maar wij geven u aanleiding om over ons te roemen, opdat u iets zou hebben tegen hen die roemen op het uiterlijk en niet op het hart.", "Jer 10:25": "Stort Uw grimmigheid uit over de heidenen, die U niet kennen, en over de geslachten, die Uw Naam niet aanroepen; want zij hebben Jakob opgegeten, ja, zij hebben hem opgegeten, en hem verteerd, en zijn woning verwoest.", "Ps 77:6-10": "Ik overdacht de dagen van vroeger, de jaren van eeuwen her. Ik dacht aan mijn snarenspel; in de nacht overlegde ik in mijn hart, en mijn geest onderzocht: Zal de Heere dan voor eeuwig verstoten, en voortaan niet meer goedgunstig zijn?", "Deut 28:44": "Hij zal u lenen, maar u zult hem niet lenen; hij zal tot een hoofd zijn, en u zult tot een staart zijn.", "Num 16:22": "Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden?", "Klaagl 2:17-22": "Ain. De HEERE heeft gedaan wat Hij Zich had voorgenomen, Hij heeft Zijn woord vervuld, dat Hij bevolen had van oude dagen af; Hij heeft afgebroken en niet gespaard; en Hij heeft de vijand over u verblijd, Hij heeft de hoorn van uw tegenstanders verhoogd. Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op! Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Matt 16:3": "en 's morgens: Vandaag onweer; want de hemel is somber rood. Huichelaars! Het uiterlijk van de hemel weet u wel te onderscheiden, maar kunt u de tekenen van de tijden niet onderscheiden?", "Ezech 7:22": "Ook zal Ik Mijn aangezicht van hen afwenden, en zij zullen Mijn verborgen plaats ontheiligen; want inbrekers zullen daar binnenkomen en die ontheiligen.", "Ps 144:6": "Bliksem met bliksem, en verstrooi hen; zend Uw pijlen uit, en vernietig hen.", "Klaagl 3:64-66": "Thau. HEERE! geef hun de vergelding terug, naar het werk van hun handen. Thau. Geef hun een verharding van het hart; Uw vloek zij over hen! Thau. Vervolg hen met toorn, en verdelg hen van onder de hemel van de HEERE.", "Deut 28:64-67": "En de HEERE zal u verstrooien onder alle volken, van het ene einde van de aarde tot het andere einde van de aarde; en daar zult u andere goden dienen die u niet gekend hebt, noch uw vaderen, hout en steen. Daarbij zult u onder die volken geen rust vinden, en uw voetzool zal geen rust hebben; want de HEERE zal u daar een bevend hart geven, en bezwijking van de ogen, en kwelling van de ziel. En uw leven zal voor u onzeker hangen; en u zult nacht en dag angst hebben, en u zult niet zeker zijn van uw leven.", "Ezech 5:16": "Wanneer Ik de boze pijlen van de honger tegen hen uitzenden zal, die tot verderf zullen zijn, die Ik uitzenden zal om u te verderven; zo zal Ik de honger over u vermeerderen, en u de staf van het brood breken.", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "Ps 106:44": "Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde.", "Openb 14:20": "En de wijnpersbak werd buiten de stad getreden, en er is bloed uit de wijnpersbak gekomen, tot aan de tomen van de paarden, over een afstand van duizend zeshonderd stadiën.", "Ps 50:17": "Omdat u de kastijding haat, en Mijn woorden achter u weggooit.", "Num 24:9": "Hij heeft zich gekromd, hij heeft zich neergelegd, als een leeuw, en als een oude leeuw; wie zal hem doen opstaan? Wie u zegent, die zij gezegend, en vervloekt zij wie u vervloekt!", "Hos 12:1": "Die van Efraïm hebben Mij omsingeld met leugen, en het huis van Israël met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.", "Hand 13:14": "En zij trokken van Perge het land door, en kwamen te Antiochië, een stad in Pisidië; en gingen op de dag van de sabbat de synagoge in, en gingen zitten.", "Jes 1:21": "Hoe is de trouwe stad tot een hoer geworden! Zij was vol recht, gerechtigheid herbergde daarin, maar nu doodslagers.", "Ezech 5:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE (omdat u Mijn heiligdom verontreinigd hebt met al uw verfoeisels, en met al uw gruwelen), zeker zal Ik ook u daarom verminderen, en Mijn oog zal u niet verschonen, en Ik zal ook niet sparen!", "Joh 9:2": "En Zijn discipelen vroegen Hem: Rabbi, wie heeft er gezondigd, deze man of zijn ouders, dat hij blind geboren zou worden?", "Ps 98:9": "Voor het aangezicht van de HEERE, want Hij komt om de aarde te oordelen; Hij zal de wereld oordelen in gerechtigheid, en de volken in alle rechtmatigheid.", "Jer 4:31": "Want ik hoor een stem als van een vrouw, die in barensnood is, een benauwdheid als van iemand die haar eerste kind baart, de stem van de dochter van Sion; zij hijgt, zij spreidt haar handen uit, en zegt: O, wee mij nu, want mijn ziel is moe vanwege de moordenaars!", "Jes 51:19": "Deze twee dingen zijn u overkomen, wie heeft medelijden met u? Er is verwoesting, en verbreking, en honger, en zwaard, door wie zal Ik u troosten?", "2 Petr 3:3": "Dit moet u eerst weten, dat er in de laatste dagen spotters zullen komen, die naar hun eigen begeerten zullen wandelen,", "Ps 20:2": "De HEERE verhoort u in de dag van benauwdheid; de Naam van de God van Jakob zet u in een hoog vertrek.", "Ps 58:8": "Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren.", "Ps 74:2": "Denk aan Uw vergadering, die U vanouds verworven hebt; de roede van Uw erfenis, die U verlost hebt; de berg Sion, waar U gewoond hebt.", "Hos 2:2": "Anders zal Ik ze naakt uitkleden, en haar neerzetten als op de dag dat zij geboren werd; ja, Ik zal haar maken als een woestijn, en haar neerzetten als een dor land, en haar doden door dorst;", "Lev 23:27-32": "Maar op de tiende van deze zevende maand zal de verzoendag zijn, een heilige samenkomst zult u hebben; dan zult u uw zielen verootmoedigen, en zult de HEERE een vuuroffer offeren. En op diezelfde dag zult u geen werk doen; want het is de verzoendag, om over u verzoening te doen voor het aangezicht van de HEERE, uw God. Want elke ziel, die op diezelfde dag niet verootmoedigd zal zijn geweest, die zal uitgeroeid worden uit haar volk.", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Ps 33:5": "Hij heeft gerechtigheid en recht lief; de aarde is vol van de goedertierenheid van de HEERE.", "Ps 69:2-37": "Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel. Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij. Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.", "Jer 52:27-30": "En de koning van Babel sloeg hen en doodde hen te Ribla, in het land van Hamath. Zo werd Juda uit zijn land gevankelijk weggevoerd. Dit is het volk dat Nebukadrezar gevankelijk heeft weggevoerd: in het zevende jaar, drieduizend drieëntwintig Joden; In het achttiende jaar van Nebukadrezar voerde hij gevankelijk weg achthonderdtweeëndertig zielen uit Jeruzalem;", "Ps 107:17-19": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden; Hun ziel gruwde van alle voedsel, en zij waren tot aan de poorten van de dood gekomen. Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Jer 48:41": "Elke stad is gewonnen, en elke vesting is ingenomen; en het hart van Moabs helden zal op die dag zijn als het hart van een vrouw die in barensnood is.", "Jes 26:16": "HEERE, in benauwdheid hebben zij U bezocht; zij hebben hun stil gebed uitgestort, toen Uw tuchtiging over hen was.", "Ezech 33:10": "Daarom, mensenkind! Zeg tegen het huis van Israël: U spreekt zo en zegt: Omdat onze overtredingen en onze zonden op ons zijn, en wij daarin wegkwijnen, hoe zouden wij dan leven?", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "2 Kon 19:21": "Dit is het woord dat de HEERE over hem gesproken heeft: De jonkvrouw, de dochter van Sion, verkleint u, zij bespot u, de dochter van Jeruzalem schudt het hoofd achter u aan.", "Ps 12:4": "De HEERE snijdt alle vleiende lippen af, en de tong die grootspreekt;", "Klaagl 3:46": "Pe. Al onze vijanden hebben hun mond tegen ons opgesperd.", "Joh 9:1-34": "Toen Hij voorbijging, zag Hij een man die blind was van zijn geboorte af. En Zijn discipelen vroegen Hem: Rabbi, wie heeft er gezondigd, deze man of zijn ouders, dat hij blind geboren zou worden? Jezus antwoordde: Deze man heeft niet gezondigd, en zijn ouders ook niet, maar dit is gebeurd, opdat de werken van God in hem openbaar zouden worden.", "Jer 47:3": "Vanwege het geluid van het geklater van de hoeven van zijn sterke paarden, vanwege het geraas van zijn wagens, en het bulderen van zijn raderen; de vaders zien niet om naar de kinderen, vanwege de slapheid van de handen;", "Jes 65:5": "Die daar zeggen: Houd u tot uzelf, en kom niet bij mij, want ik ben heiliger dan u. Deze zijn een rook in Mijn neus, een vuur, dat de hele dag brandt.", "Ps 88:17": "Uw brandende toorn gaat over mij heen; Uw verschrikkingen doen mij vergaan.", "Klaagl 5:5": "Wij worden vervolgd, met een juk op onze nek; zijn wij moe, men laat ons geen rust.", "Ps 59:2-18": "Red mij van mijn vijanden, o mijn God! Stel mij in een hoog vertrek voor hen die tegen mij opstaan. Red mij van de werkers van de ongerechtigheid, en verlos mij van de mannen van het bloed. Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "Job 15:34": "Want de vergadering van de huichelaars wordt eenzaam, en het vuur verteert de tenten van de geschenken.", "2 Petr 2:1": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen;", "2 Sam 15:26": "Maar als Hij zo zal zeggen: Ik heb geen behagen in u; zie, hier ben ik, laat Hij met mij doen zoals het goed is in Zijn ogen.", "Klaagl 2:3": "Gimel. Hij heeft, in ontsteking van de toorn, de gehele hoorn van Israël afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, dat rondom verteert.", "Ps 38:2": "O HEERE! Straf mij niet in Uw grote toorn, en straf mij niet in Uw grimmigheid.", "Deut 29:22-28": "Dan zal het navolgende geslacht zeggen, uw kinderen, die na u opstaan zullen, en de vreemde, die uit een ver land komen zal, als zij de plagen van dit land zullen zien en de ziekten waarmee de HEERE het gekweld heeft; Dat zijn hele aarde zwavel en zout is van de verbranding; die niet bezaaid zal zijn, en geen spruit zal voortgebracht hebben, en geen kruid daarin zal opgekomen zijn; zoals de omkering van Sodom en Gomorra, Adama en Zeboïm, die de HEERE heeft omgekeerd in Zijn toorn en in Zijn grimmigheid; En alle volken zullen zeggen: Waarom heeft de HEERE dit land zo aangedaan? Wat betekent de gloed van deze grote toorn?", "2 Kron 7:13": "Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend;", "Joh 19:31": "De Joden dan, opdat de lichamen niet aan het kruis zouden blijven op de sabbat, omdat het de voorbereiding was (want die dag van de sabbat was een grote dag), vroegen Pilatus dat hun benen gebroken zouden worden, en zij weggenomen zouden worden.", "Jer 5:31": "De profeten profeteren vals, en de priesters heersen door hun eigen hand; en Mijn volk heeft het graag zo; maar wat zult u aan het einde daarvan doen?", "Jer 17:24-27": "Het zal dan gebeuren, als u vlijtig naar Mij zult horen, spreekt de HEERE, dat u geen last door de poorten van deze stad op de sabbatdag inbrengt, en u de sabbatdag heiligt, dat u geen werk daarop doet; Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid. En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Jak 1:26": "Als iemand onder u denkt dat hij godsdienstig is, en zijn tong niet in toom houdt, maar zijn hart verleidt, diens godsdienst is nutteloos.", "Deut 4:8": "En welk groot volk is er, dat zulke rechtvaardige inzettingen en rechten heeft als deze hele wet, die ik vandaag voor u leg?", "Klaagl 2:16": "Pe. Al uw vijanden sperren hun mond open over u, zij fluiten en knersen met de tanden, zij zeggen: Wij hebben haar verslonden; dit is zeker de dag die wij verwacht hebben, wij hebben hem gevonden, wij hebben hem gezien.", "Ps 141:1-10": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep. Laat mijn gebed voor Uw aangezicht staan als reukwerk, het opheffen van mijn handen als het avondoffer. HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "Ezech 39:6": "En Ik zal een vuur zenden in Magog, en onder hen die veilig op de eilanden wonen; en zij zullen weten dat Ik de HEERE ben.", "Ex 17:7": "En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?"}, "noten": {"1": "Vers 10: SV \"immers\" – hertaald als \"zeker\" (betekende in 1637: voorzeker)."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3427\">Aleph</span>. <span class=\"wl\" data-l=\"L1\" data-code=\"H3427\">Hoe</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3427\">zit</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5892\">die</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5892\">stad</span> zo <span class=\"wl\" data-l=\"L3\" data-code=\"H910\">eenzaam</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H7227\">die</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7227\">vol< vity</span> because of <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction,</span> and because of <span class=\"wl wl-kjv\" data-code=\"H7230\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5656\">servitude:</span> she <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelleth</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> she <span class=\"wl wl-kjv\" data-code=\"H4672\">findeth</span> no <span class=\"wl wl-kjv\" data-code=\"H4494\">rest:</span> all her <span class=\"wl wl-kjv\" data-code=\"H7291\">persecutors</span> <span class=\"wl wl-kjv\" data-code=\"H5381\">overtook</span> her between the straits.", "4": "The <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> do <span class=\"wl wl-kjv\" data-code=\"H57\">mourn,</span> because none <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the solemn <span class=\"wl wl-kjv\" data-code=\"H4150\">feasts:</span> all her <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> are <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate:</span> her <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H584\">sigh,</span> her <span class=\"wl wl-kjv\" data-code=\"H1330\">virgins</span> are <span class=\"wl wl-kjv\" data-code=\"H3013\">afflicted,</span> and she is in bitterness.", "5": "Her <span class=\"wl wl-kjv\" data-code=\"H6862\">adversaries</span> are the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief,</span> her <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> <span class=\"wl wl-kjv\" data-code=\"H7951\">prosper;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H3013\">afflicted</span> her for the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of her <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions:</span> her <span class=\"wl wl-kjv\" data-code=\"H5768\">children</span> are <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> into <span class=\"wl wl-kjv\" data-code=\"H7628\">captivity</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the enemy.", "6": "And from the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> all her <span class=\"wl wl-kjv\" data-code=\"H1926\">beauty</span> is <span class=\"wl wl-kjv\" data-code=\"H3318\">departed:</span> her <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> are become like <span class=\"wl wl-kjv\" data-code=\"H354\">harts</span> that <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> no <span class=\"wl wl-kjv\" data-code=\"H4829\">pasture,</span> and they are <span class=\"wl wl-kjv\" data-code=\"H3212\">gone</span> without <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the pursuer.", "7": "<span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of her <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction</span> and of her <span class=\"wl wl-kjv\" data-code=\"H4788\">miseries</span> all her pleasant <span class=\"wl wl-kjv\" data-code=\"H4262\">things</span> that she had in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H6924\">old,</span> when her <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6862\">enemy,</span> and none did <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> her: the <span class=\"wl wl-kjv\" data-code=\"H6862\">adversaries</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> her, and did <span class=\"wl wl-kjv\" data-code=\"H7832\">mock</span> at her sabbaths.", "8": "<span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> hath <span class=\"wl wl-kjv\" data-code=\"H2399\">grievously</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned;</span> therefore she is <span class=\"wl wl-kjv\" data-code=\"H5206\">removed:</span> all that <span class=\"wl wl-kjv\" data-code=\"H3513\">honoured</span> her <span class=\"wl wl-kjv\" data-code=\"H2107\">despise</span> her, because they have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> her <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness:</span> yea, she <span class=\"wl wl-kjv\" data-code=\"H584\">sigheth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">turneth</span> backward.", "9": "Her <span class=\"wl wl-kjv\" data-code=\"H2932\">filthiness</span> is in her <span class=\"wl wl-kjv\" data-code=\"H7757\">skirts;</span> she <span class=\"wl wl-kjv\" data-code=\"H2142\">remembereth</span> not her last <span class=\"wl wl-kjv\" data-code=\"H319\">end;</span> therefore she came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6382\">wonderfully:</span> she had no <span class=\"wl wl-kjv\" data-code=\"H5162\">comforter.</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> my <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction:</span> for the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> hath magnified", "10": "The <span class=\"wl wl-kjv\" data-code=\"H6862\">adversary</span> hath spread <span class=\"wl wl-kjv\" data-code=\"H6566\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon all her pleasant <span class=\"wl wl-kjv\" data-code=\"H4261\">things:</span> for she hath <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> that the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into her <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary,</span> whom thou didst <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> that they should not <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into thy congregation.", "11": "All her <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H584\">sigh,</span> they <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread;</span> they have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> their pleasant <span class=\"wl wl-kjv\" data-code=\"H4261\">things</span> for <span class=\"wl wl-kjv\" data-code=\"H400\">meat</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">relieve</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">soul:</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5027\">consider;</span> for I am become vile.", "12": "Is it nothing to you, all ye that <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">by?</span> <span class=\"wl wl-kjv\" data-code=\"H5027\">behold,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> if there <span class=\"wl wl-kjv\" data-code=\"H3426\">be</span> any <span class=\"wl wl-kjv\" data-code=\"H4341\">sorrow</span> like unto my <span class=\"wl wl-kjv\" data-code=\"H4341\">sorrow,</span> which is <span class=\"wl wl-kjv\" data-code=\"H5953\">done</span> unto me, wherewith the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H3013\">afflicted</span> me in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of his <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> anger.", "13": "From <span class=\"wl wl-kjv\" data-code=\"H4791\">above</span> hath he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> into my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones,</span> and it <span class=\"wl wl-kjv\" data-code=\"H7287\">prevaileth</span> against them: he hath <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> a <span class=\"wl wl-kjv\" data-code=\"H7568\">net</span> for my <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7725\">turned</span> me <span class=\"wl wl-kjv\" data-code=\"H268\">back:</span> he hath <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> me <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate</span> and <span class=\"wl wl-kjv\" data-code=\"H1739\">faint</span> all the day.", "14": "The <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke</span> of my <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions</span> is <span class=\"wl wl-kjv\" data-code=\"H8244\">bound</span> by his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> they are <span class=\"wl wl-kjv\" data-code=\"H8276\">wreathed,</span> and come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> upon my <span class=\"wl wl-kjv\" data-code=\"H6677\">neck:</span> he hath made my <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> to <span class=\"wl wl-kjv\" data-code=\"H3782\">fall,</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> me into their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> from whom I am not <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to rise up.", "15": "The <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> hath trodden under <span class=\"wl wl-kjv\" data-code=\"H5541\">foot</span> all my <span class=\"wl wl-kjv\" data-code=\"H47\">mighty</span> men in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of me: he hath <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> an <span class=\"wl wl-kjv\" data-code=\"H4150\">assembly</span> against me to <span class=\"wl wl-kjv\" data-code=\"H7665\">crush</span> my young <span class=\"wl wl-kjv\" data-code=\"H970\">men:</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> hath <span class=\"wl wl-kjv\" data-code=\"H1869\">trodden</span> the <span class=\"wl wl-kjv\" data-code=\"H1330\">virgin,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> as in a winepress.", "16": "For these things I <span class=\"wl wl-kjv\" data-code=\"H1058\">weep;</span> mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eye,</span> mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> runneth <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> because the <span class=\"wl wl-kjv\" data-code=\"H5162\">comforter</span> that should <span class=\"wl wl-kjv\" data-code=\"H7725\">relieve</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> is <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from me: my <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> are <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate,</span> because the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> prevailed.", "17": "<span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> spreadeth <span class=\"wl wl-kjv\" data-code=\"H6566\">forth</span> her <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and there is none to <span class=\"wl wl-kjv\" data-code=\"H5162\">comfort</span> her: the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> concerning <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> that his <span class=\"wl wl-kjv\" data-code=\"H6862\">adversaries</span> should be round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> him: <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> is as a menstruous woman", "18": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous;</span> for I have <span class=\"wl wl-kjv\" data-code=\"H4784\">rebelled</span> against his <span class=\"wl wl-kjv\" data-code=\"H6310\">commandment:</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> I pray you, all <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> my <span class=\"wl wl-kjv\" data-code=\"H4341\">sorrow:</span> my <span class=\"wl wl-kjv\" data-code=\"H1330\">virgins</span> and my young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> are <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> into captivity.", "19": "I <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for my <span class=\"wl wl-kjv\" data-code=\"H157\">lovers,</span> but they <span class=\"wl wl-kjv\" data-code=\"H7411\">deceived</span> me: my <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and mine <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> gave up the <span class=\"wl wl-kjv\" data-code=\"H1478\">ghost</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> while they <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> their <span class=\"wl wl-kjv\" data-code=\"H400\">meat</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">relieve</span> their souls.", "20": "<span class=\"wl wl-kjv\" data-code=\"H7200\">Behold,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> for I am in <span class=\"wl wl-kjv\" data-code=\"H6887\">distress:</span> my <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels</span> are <span class=\"wl wl-kjv\" data-code=\"H2560\">troubled;</span> mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">within</span> me; for I have <span class=\"wl wl-kjv\" data-code=\"H4784\">grievously</span> <span class=\"wl wl-kjv\" data-code=\"H4784\">rebelled:</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H7921\">bereaveth,</span> at <span class=\"wl wl-kjv\" data-code=\"H1004\">home</span> there is as death.", "21": "They have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that I <span class=\"wl wl-kjv\" data-code=\"H584\">sigh:</span> there is none to <span class=\"wl wl-kjv\" data-code=\"H5162\">comfort</span> me: all mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of my <span class=\"wl wl-kjv\" data-code=\"H7451\">trouble;</span> they are <span class=\"wl wl-kjv\" data-code=\"H7797\">glad</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> it: thou wilt <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> and they shall be like", "22": "Let all their <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee; and <span class=\"wl wl-kjv\" data-code=\"H5953\">do</span> unto them, as thou hast <span class=\"wl wl-kjv\" data-code=\"H5953\">done</span> unto me for all my <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions:</span> for my <span class=\"wl wl-kjv\" data-code=\"H585\">sighs</span> are <span class=\"wl wl-kjv\" data-code=\"H7227\">many,</span> and my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is faint."}};
