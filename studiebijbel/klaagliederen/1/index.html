ze ziel is veel te zat van de spot van de weldenkenden, van de verachting van de hoogmoedigen.", "1 Sam 12:14": "Als u de HEERE zult vrezen, en Hem dienen, en naar Zijn stem luisteren, en tegen het bevel van de HEERE niet opstandig bent, dan zult u, zowel u als de koning die over u regeren zal, achter de HEERE, uw God, aan blijven.", "Jer 14:15-18": "Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden. En het volk, tot wie zij profeteren, zal op de straten van Jeruzalem weggeworpen zijn vanwege de honger en het zwaard; en er zal niemand zijn die hen kan begraven, hen, hun vrouwen, en hun zonen, en hun dochters; zo zal Ik hun slechtheid over hen uitstorten. Daarom zult u dit woord tegen hen zeggen: Mijn ogen zullen van tranen neerdalen, nacht en dag, en niet ophouden; want de jonkvrouw, de dochter van Mijn volk, is gebroken met een grote breuk, een plaag die zeer smartelijk is.", "Ezech 7:20-22": "En Hij heeft de schoonheid van het sieraad tot overtreffelijkheid gezet; maar zij hebben daarin beelden van hun gruwelen en van hun verfoeiselen gemaakt; daarom heb Ik dat hun tot onreinheid gesteld. En Ik zal het in de hand van de vreemden overgeven ten roof, en aan de goddelozen van de aarde ten buit, en zij zullen het ontheiligen. Ook zal Ik Mijn aangezicht van hen afwenden, en zij zullen Mijn verborgen plaats ontheiligen; want inbrekers zullen daar binnenkomen en die ontheiligen.", "Matt 22:23": "Diezelfde dag kwamen de Sadduceeën naar Hem toe, die zeggen dat er geen opstanding is, en vroegen Hem,", "Ps 137:1": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion.", "Rom 5:3": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt;", "Ezech 25:6": "Want zo zegt de Heere HEERE: Omdat u met de hand geklapt, en met de voet gestampt hebt, en van harte verheugd bent geweest over al uw plundering, over het land van Israël;", "Zach 13:6": "En als iemand tegen hem zegt: Wat zijn deze wonden in uw handen? dan zal hij zeggen: Het zijn de wonden waarmee ik geslagen ben, in het huis van mijn liefhebbers.", "Job 14:14": "Als een man gestorven is, zal hij dan weer leven? Ik zou al de dagen van het strijd hopen, totdat mijn verandering zou komen.", "Joh 11:19": "En velen van de Joden waren gekomen naar Martha en Maria, om hen te troosten over hun broeder.", "Hos 2:10": "En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "Gen 16:5": "Toen zei Sarai tegen Abram: Het onrecht mij aangedaan komt op u neer; ik heb mijn dienstmaagd in uw schoot gegeven; nu zij ziet dat zij zwanger is geworden, ben ik veracht in haar ogen; de HEERE oordele tussen mij en tussen u!", "Jes 38:3": "En hij zei: Och HEERE, denk er toch aan dat ik voor Uw gezicht in waarheid en met een volkomen hart gewandeld heb, en dat ik gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg hard.", "Job 21:17": "Hoe vaak gebeurt het, dat de lamp van de goddelozen wordt uitgeblust, en hun ondergang over hen komt; dat God hun smarten uitdeelt in Zijn toorn!", "Obadja 1:13": "En u had niet door de poort van Mijn volk moeten gaan, op de dag van hun verderf; en u had ook niet moeten kijken naar zijn kwaad, op de dag van zijn verderf; en u had uw handen niet moeten uitstrekken naar zijn bezit, op de dag van zijn verderf;", "Ps 42:8": "De afgrond roept tot de afgrond, bij het gedruis van uw watergoten; al uw baren en uw golven zijn over mij heen gegaan.", "2 Sam 4:11": "Hoeveel te meer, wanneer goddeloze mannen een rechtvaardig man in zijn eigen huis op zijn bed hebben gedood? Zou ik dan nu zijn bloed niet van uw handen eisen, en u van de aarde wegdoen?", "Ps 69:21": "De smaad heeft mijn hart gebroken, en ik ben zeer zwak; en ik heb gewacht op medelijden, maar er is geen; en op vertroosters, maar heb ze niet gevonden.", "Hos 9:4": "Zij zullen de Heere geen drankoffers doen van wijn, en die zouden Hem ook niet aangenaam zijn; hun offers zouden voor hen zijn als treurbrood; allen die daarvan zouden eten, zouden onrein worden; want hun brood zal voor henzelf zijn, het zal niet in het huis van de Heere komen.", "1 Kon 8:32": "hoor Ú dan in de hemel, en doe, en oordeel Uw dienaren, veroordeel de onrechtvaardige door zijn weg op zijn hoofd te leggen, en verklaar de rechtvaardige rechtvaardig door hem te geven naar zijn gerechtigheid.", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Jer 51:51": "U zou kunnen zeggen: Wij zijn beschaamd geworden, want wij hebben smaad gehoord, schaamte heeft ons gezicht bedekt; omdat vreemden over de heiligdommen van het huis van de HEERE gekomen zijn;", "1 Joh 3:20": "Want als ons hart ons veroordeelt, God is meer dan ons hart, en Hij kent alle dingen.", "Ps 77:4": "Dacht ik aan God, dan maakte ik misbaar; peinsde ik, dan werd mijn ziel overstelpt. Sela.", "Ps 107:11": "Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden.", "Ps 77:8-10": "Zal de Heere dan voor eeuwig verstoten, en voortaan niet meer goedgunstig zijn? Houdt Zijn goedertierenheid voor eeuwig op? Heeft de toezegging een einde, van geslacht tot geslacht? Heeft God vergeten genadig te zijn? Heeft Hij Zijn barmhartigheden door toorn toegesloten? Sela.", "Hand 15:21": "Want Mozes heeft van oude tijden af in elke stad mensen die hem prediken, en hij wordt elke sabbat in de synagogen gelezen.", "Job 35:3": "Want u hebt gezegd: Wat zou het u baten? Wat voor meer voordeel zal ik daarmee doen, dan met mijn zonde?", "Rom 5:4": "En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop;", "Neh 13:15-22": "In diezelfde dagen zag ik in Juda mensen die persen traden op de sabbat, en die garven binnenbrachten, die zij op ezels laadden; alsook wijn, druiven en vijgen, en allerlei last, die zij op de sabbatdag naar Jeruzalem binnenbrachten; en ik waarschuwde hen op de dag dat zij eetwaren verkochten. Daar woonden ook Tyriërs binnen, die vis aanbrachten, en allerlei koopwaren, die zij op de sabbat verkochten aan de kinderen van Juda en in Jeruzalem. Zo twistte ik met de edelen van Juda, en zei tegen hen: Wat voor een slechte zaak is dit, die u doet, en waarmee u de sabbatdag ontheiligt?", "1 Joh 3:17": "Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem?", "Jer 5:17": "En het zal uw oogst en uw brood opeten, dat uw zonen en uw dochters zouden eten; het zal uw schapen en uw runderen opeten; het zal uw wijnstok en uw vijgenboom opeten; uw vaste steden, waarop u vertrouwt, zal het arm maken door het zwaard.", "Jes 10:18": "Ook zal Hij verteren de heerlijkheid van zijn woud en van zijn vruchtbare veld; van de ziel af, tot het vlees toe; en hij zal zijn, zoals wanneer een vaandeldrager versmelt.", "Ps 89:40-52": "Gij hebt het verbond van Uw knecht teniet gedaan; Gij hebt zijn kroon ontheiligd tegen de aarde. Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen. Allen die de weg voorbijgingen, hebben hem beroofd; voor zijn naburen is hij tot een smaad geweest.", "Hebr 12:9": "Verder, wij hebben de vaders van ons vlees wel als kastijders gehad, en wij hadden ontzag voor hen; zullen wij dan niet veel meer onderworpen zijn aan de Vader van de geesten, en leven?", "Matt 7:21-23": "Niet ieder die tegen Mij zegt: Heere, Heere! zal ingaan in het Koninkrijk der hemelen, maar wie de wil doet van Mijn Vader, Die in de hemelen is. Velen zullen op die dag tegen Mij zeggen: Heere, Heere! Hebben wij niet in Uw Naam geprofeteerd, en in Uw Naam demonen uitgeworpen, en in Uw Naam veel krachten gedaan? En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Job 19:7-20": "Zie, ik roep: geweld! maar word niet verhoord; ik schreeuw, maar er is geen recht. Hij heeft mijn weg toegemuurd, zodat ik niet door kan gaan, en over mijn paden heeft Hij duisternis gesteld. Mijn eer heeft Hij van mij afgetrokken, en de kroon van mijn hoofd heeft Hij weggenomen.", "Luk 19:41-44": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar, en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen. Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Ps 89:43": "Gij hebt de rechterhand van zijn wederpartijders verhoogd; Gij hebt al zijn vijanden verblijd.", "Jes 1:25-27": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen. En Ik zal u uw rechters teruggeven, als in het begin, en uw raadslieden als in het begin; daarna zult u een stad van de gerechtigheid, een trouwe stad, genoemd worden. Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Ps 83:2-19": "O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "Jer 9:17-19": "Zo zegt de HEERE van de heerscharen: Let hierop, en roept klaagvrouwen, dat zij komen; en zendt heen naar de wijze vrouwen, dat zij komen. En zich haasten, en een klaagzang over ons aanheffen, zodat onze ogen van tranen neerdalen, en onze oogleden van water druipen. Want er is een stem van weeklacht gehoord uit Sion: Hoe zijn wij verwoest! Wij zijn zeer beschaamd, omdat wij het land hebben verlaten, omdat zij onze woningen hebben omgeworpen.", "Jer 51:34": "Nebukadrezar, de koning van Babel, heeft mij opgegeten, hij heeft mij verpletterd, hij heeft mij gesteld als een leeg vat, hij heeft mij verslonden als een draak, hij heeft zijn buik gevuld met mijn lekkernijen, hij heeft mij verdreven.", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Ps 78:19-22": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn? Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden? Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Neh 9:26": "Maar zij zijn opstandig geworden, en hebben tegen U gerebelleerd, en Uw wet achter hun rug geworpen, en Uw profeten gedood die tegen hen getuigden, om hen te doen terugkeren tot U; zo hebben zij grote lasteringen gedaan.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Rom 9:6": "Maar ik zeg dit niet alsof het woord van God vervallen zou zijn; want niet allen die uit Israël zijn, zijn Israël.", "Jer 37:7-9": "Zo zegt de HEERE, de God van Israël: Zo zult u zeggen tegen de koning van Juda, die u naar Mij gestuurd heeft om Mij te raadplegen: Zie, het leger van Farao, dat u ter hulp is uitgetrokken, zal terugkeren naar zijn land, naar Egypte; En de Chaldeeën zullen terugkeren en tegen deze stad strijden; en zij zullen haar innemen en met vuur verbranden. Zo zegt de HEERE: Bedrieg uzelf niet door te zeggen: De Chaldeeën zullen zeker van ons wegtrekken; want zij zullen niet wegtrekken.", "Job 5:6": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde;", "Joh 21:19": "En dit zei Hij, om aan te duiden met wat voor dood hij God verheerlijken zou. En toen Hij dit gezegd had, zei Hij tegen hem: Volg Mij.", "Pred 12:14": "Want God zal ieder werk in het gericht brengen, met alles wat verborgen is, hetzij goed, of hetzij kwaad.", "Deut 30:1-3": "Verder zal het gebeuren, wanneer al deze dingen over u gekomen zijn, deze zegen of deze vloek, die ik u voorgesteld heb; zo zult u het weer ter harte nemen, onder alle volken, waarheen de HEERE, uw God, u gedreven heeft; En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel. En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Mark 8:15": "En Hij gebood hun: Kijk uit, wees op uw hoede voor het zuurdeeg van de Farizeeën, en voor het zuurdeeg van Herodes.", "Jes 60:14": "Ook zullen, zich buigend, tot u komen de kinderen van hen die u onderdrukt hebben, en allen die u gelasterd hebben zullen zich neerbuigen aan de zolen van uw voeten; en zij zullen u noemen: de stad van de HEERE, het Sion van de Heilige van Israël.", "Ezech 33:30": "En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt.", "Num 15:30": "Maar de ziel die iets doet met opgeheven hand, hetzij van inboorlingen of van vreemdelingen, die smaadt de HEERE; en die ziel zal uitgeroeid worden uit het midden van haar volk;", "Rom 1:32": "die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.", "Luk 12:54-56": "En Hij zei ook tegen de menigten: Wanneer u een wolk ziet opkomen vanuit het westen, zegt u meteen: Er komt regen; en zo gebeurt het. En wanneer u de zuidenwind ziet waaien, zegt u: Er zal hitte komen; en het gebeurt. Huichelaars, het aanzien van de aarde en de hemel weet u te beoordelen; hoe komt het dan dat u deze tijd niet weet te beoordelen?", "Hand 13:27": "Want zij die in Jeruzalem wonen, en hun leiders, hebben Hem niet gekend, en hebben ook de stemmen van de profeten, die elke sabbat gelezen worden, vervuld door Hem te veroordelen;", "Deut 4:25-27": "Wanneer u nu kinderen en kleinkinderen verwekt hebt, en oud geworden bent in het land, en u zich te gronde richt door gesneden beelden te maken, de gelijkenis van iets, en door te doen wat kwaad is in de ogen van de HEERE, uw God, om Hem tot toorn te verwekken; Dan roep ik vandaag de hemel en de aarde tot getuige tegen u, dat u zeker snel zult omkomen uit het land waar u de Jordaan voor oversteekt om het in bezit te nemen; u zult uw dagen daarin niet verlengen, maar helemaal uitgeroeid worden. En de HEERE zal u verstrooien onder de volken; en u zult met weinigen in getal overblijven onder de heidenvolken waarheen de HEERE u zal leiden.", "Job 14:1": "De mens, uit een vrouw geboren, leeft maar kort en is vol onrust.", "Rom 9:7": "Ook zijn zij niet allen kinderen omdat zij nageslacht van Abraham zijn; maar: In Izaak zal uw nageslacht genoemd worden.", "Jer 52:6": "In de vierde maand, op de negende van de maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had;", "1 Sam 30:12": "Zij gaven hem ook een stuk van een klomp vijgen, en twee stukken rozijnen; en hij at, en zijn geest kwam weer in hem terug; want hij had drie dagen en drie nachten geen brood gegeten, en geen water gedronken.", "Openb 17:13": "Dezen hebben één en dezelfde gezindheid, en zullen hun kracht en macht aan het beest overgeven.", "Rom 9:1-3": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest), dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is. Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "Dan 9:5-15": "Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten. En wij hebben niet geluisterd naar Uw dienstknechten, de profeten, die in Uw Naam spraken tot onze koningen, onze vorsten en onze vaders, en tot heel het volk van het land. Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Ps 64:6": "Zij sterken zichzelf in een boze zaak; zij overleggen om strikken te verbergen; zij zeggen: Wie zal ze zien?", "Gen 4:13": "En Kaïn zei tegen de HEERE: Mijn misdaad is groter dan dat die vergeven kan worden.", "Ps 77:3-5": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden. Dacht ik aan God, dan maakte ik misbaar; peinsde ik, dan werd mijn ziel overstelpt. Sela. U hield mijn ogen wakend; ik was verslagen, en sprak niet.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "Ps 119:134": "Verlos mij van de overlast van de mens, en ik zal Uw bevelen onderhouden.", "Jer 29:17-19": "Zo zegt de HEERE van de heerscharen: Ziet, Ik zal het zwaard, de honger en de pest onder hen zenden; en Ik zal hen maken als de afschuwelijke vijgen, die vanwege hun slechtheid niet gegeten kunnen worden. En Ik zal hen achtervolgen met het zwaard, met de honger en met de pest; en Ik zal hen overgeven aan een verschrikking, in al de koninkrijken van de aarde, tot een vloek, en tot een schrik, en tot een aanfluiting, en tot een smaad, onder al de volken waarheen Ik hen zal hebben verdreven; Omdat zij naar Mijn woorden niet geluisterd hebben, spreekt de HEERE, toen Ik Mijn knechten, de profeten, tot hen zond, vroeg opstaand en zendend; maar u hebt niet geluisterd, spreekt de HEERE.", "Klaagl 2:15": "Samech. Allen die voorbijgaan, klappen met de handen over u, zij fluiten en schudden hun hoofd over de dochter van Jeruzalem, en zeggen: Is dit die stad, waarvan men zei, dat zij volkomen was van schoonheid, een vreugde van de hele aarde?", "Ezra 5:12": "Maar nadat onze vaders de God van de hemel hadden vertoornd, heeft Hij hen gegeven in de hand van Nebukadnezar, de koning van Babel, de Chaldeeër; die dat huis heeft vernield en het volk naar Babel weggevoerd.", "Luk 6:46": "En waarom noemt u Mij Heere, Heere, en doet u niet wat Ik zeg?", "Openb 15:4": "Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.", "Num 20:16": "Toen riepen wij tot de HEERE, en Hij hoorde onze stem, en Hij zond een Engel, en Hij leidde ons uit Egypte; en zie, wij zijn te Kades, een stad aan de rand van uw gebied.", "Spr 1:22": "U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?", "Jer 23:14": "Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra.", "Ps 25:15-19": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren. Pe. Wend U tot mij, en wees mij genadig, want ik ben eenzaam en ellendig. Tsade. De benauwdheden van mijn hart hebben zich wijd uitgestrekt; voer mij uit mijn noden.", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Ps 79:10": "Waarom zouden de heidenen zeggen: Waar is hun God? Laat de wraak van het vergoten bloed van Uw knechten onder de heidenen voor onze ogen bekend worden.", "Ps 50:6": "En de hemelen verkondigen Zijn gerechtigheid; want God Zelf is Rechter. Sela.", "Ps 9:12": "Zingt psalmen voor de HEERE, Die te Sion woont; verkondigt onder de volken Zijn daden.", "Ps 40:16": "Laat hen verwoest worden tot loon van hun beschaming, die van mij zeggen: Ha, ha!", "Deut 28:32-41": "Uw zonen en uw dochters zullen aan een ander volk gegeven worden, terwijl uw ogen toekijken en de hele dag naar hen smachten; maar het zal niet in de macht van uw hand zijn. De vrucht van uw land en al uw arbeid zal een volk opeten dat u niet gekend hebt; en u zult alle dagen alleen maar verdrukt en gepletterd zijn. En u zult waanzinnig worden vanwege wat uw ogen te zien krijgen.", "Klaagl 4:10": "Jod. De handen van barmhartige vrouwen hebben hun eigen kinderen gekookt; zij zijn hun tot voedsel geworden bij de ondergang van de dochter van mijn volk.", "2 Tess 1:4-6": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt; Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken;", "Ps 32:4": "Want Uw hand was dag en nacht zwaar op mij; mijn sap veranderde in zomerdroogte. Sela.", "Ps 54:3-5": "O God! Verlos mij door Uw Naam, en doe mij recht door Uw macht. O God! Hoor mijn gebed; neig Uw oren tot de woorden van mijn mond. Want vreemden staan tegen mij op, en tirannen zoeken mijn ziel; zij stellen God niet voor hun ogen. Sela.", "Ps 39:10": "Ik ben verstomd, ik zal mijn mond niet opendoen, want U hebt het gedaan.", "Ps 31:10-14": "Wees mij genadig, HEERE! Want ik heb het benauwd; van verdriet is mijn oog doorknaagd, mijn ziel en mijn buik. Want mijn leven is verteerd van droefenis, en mijn jaren van zuchten; mijn kracht is vervallen door mijn ongerechtigheid, en mijn beenderen zijn doorknaagd. Vanwege al mijn wederpartijders ben ik, ook voor mijn buren, zeer tot een smaad geworden, en voor mijn bekenden tot een schrik; die mij op de straten zien, vluchten van mij weg.", "2 Kron 33:12": "En toen hij in nood verkeerde, zocht hij het aangezicht van de HEERE, zijn God, met ernst, en vernederde zich zeer voor het aangezicht van de God van zijn vaderen,", "Ezech 12:22": "Mensenkind, wat is dit voor een spreekwoord dat u hebt in het land Israël, namelijk: de dagen worden verlengd, en elk visioen vervalt?", "1 Kron 5:20": "Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden.", "Ps 38:2-23": "O HEERE! Straf mij niet in Uw grote toorn, en straf mij niet in Uw grimmigheid. Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald. Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Job 19:13-19": "Mijn broeders heeft Hij ver van mij gedaan; en die mij kennen, zeker, zij zijn van mij vervreemd. Mijn nabestaanden houden op, en mijn bekenden vergeten mij. Mijn huisgenoten en mijn dienstmaagden achten mij als een vreemde; een buitenlander ben ik in hun ogen.", "Jer 43:2": "Toen zei Azaria, de zoon van Hosaja, en Johanan, de zoon van Kareah, en alle trotse mannen, tegen Jeremia: U spreekt leugen; de HEERE, onze God, heeft u niet gezonden, om te zeggen: U zult niet naar Egypte gaan, om daar als vreemdelingen te verblijven.", "Spr 15:15": "Al de dagen van de bedrukte zijn kwaad; maar een vrolijk hart is een voortdurende maaltijd.", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "Richt 9:56": "Zo liet God het kwaad van Abimelech, dat hij aan zijn vader gedaan had door zijn zeventig broers te doden, op hem terugkomen.", "Job 33:19": "Ook wordt hij gestraft met smart op zijn leger, en de sterke menigte van zijn beenderen;", "Ps 143:3": "Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "2 Sam 15:31": "Toen liet men David weten, en zei: Achitofel is onder degenen die zich met Absalom hebben verbonden. Toen zei David: HEERE, maak toch de raad van Achitofel tot dwaasheid.", "2 Sam 16:11": "Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "Job 1:13-22": "Er was nu een dag, dat zijn zonen en zijn dochters aten en wijn dronken in het huis van hun broer, de eerstgeborene. Dat er een bode tot Job kwam en zei: De runderen waren aan het ploegen, en de ezelinnen weidden aan hun zijden. Doch de Sabeeërs deden een inval, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "Spr 22:10": "Jaag de spotter weg, en het gekijf zal weggaan, en het geschil met de schande zal ophouden.", "Matt 12:24": "Maar de Farizeeën hoorden dit en zeiden: Deze werpt de duivels niet anders uit dan door Beëlzebul, de leider van de duivels.", "Zach 8:4": "Zo zegt de HEERE van de heerscharen: Er zullen nog oude mannen en oude vrouwen zitten op de straten van Jeruzalem; ieder zal zijn stok in zijn hand hebben vanwege de hoge leeftijd.", "Jer 25:17-29": "En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had; Namelijk Jeruzalem en de steden van Juda, en haar koningen, en haar vorsten; om die te stellen tot een woestheid, tot een ontzetting, tot een aanfluiting en tot een vloek, zoals het is op deze dag; Farao, de koning van Egypte, en zijn dienstknechten, en zijn vorsten, en al zijn volk;", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Dan 3:13": "Toen zei Nebukadnezar in toorn en woede, dat men Sadrach, Mesach en Abed-nego moest voorbrengen; toen werden die mannen voor de koning gebracht.", "Ps 94:10": "Zou Hij, Die de heidenen tuchtigt, niet straffen, Hij, Die de mens wetenschap leert?", "Ps 107:12": "Daarom heeft Hij hun hart door zwarigheid vernederd; zij zijn gestruikeld, en er was geen helper.", "Jer 27:8": "En het zal gebeuren: het volk en het koninkrijk dat hem, Nebukadnezar, de koning van Babel, niet zal dienen, en dat zijn hals niet onder het juk van de koning van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.", "Ps 103:10": "Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "Ps 76:9": "U deed een oordeel horen uit de hemel; de aarde vreesde en werd stil,", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "Ps 78:20": "Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden?", "2 Kon 19:19": "Nu dan, HEERE, onze God, verlos ons toch uit zijn hand; zo zullen alle koninkrijken van de aarde weten dat U, HEERE, alleen God bent.", "Ezech 14:10": "En zij zullen hun ongerechtigheid dragen; zoals de ongerechtigheid van de vrager zal zijn, zo zal de ongerechtigheid van de profeet zijn;", "2 Kon 6:25": "En er kwam grote honger in Samaria; want zie, zij belegerden de stad, totdat een ezelskop voor tachtig zilverstukken werd verkocht, en een vierde deel van een kab duivenmest voor vijf zilverstukken.", "Hos 8:8": "Israël is verslonden; nu zijn zij onder de heidenen geworden als een vat waar niemand naar omkijkt.", "2 Tess 1:4": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Neh 9:13": "En U bent neergedaald op de berg Sinaï, en hebt met hen gesproken uit de hemel; en U hebt hun rechtmatige rechten gegeven, en getrouwe wetten, goede inzettingen en geboden.", "Ps 38:17": "Want ik zei: Laat hen zich toch over mij niet verblijden! Wanneer mijn voet zou wankelen, zouden zij zich tegen mij groot maken.", "Jer 2:31": "Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?", "Ps 119:82": "Mijn ogen zijn bezweken van verlangen naar Uw toezegging, terwijl ik zei: Wanneer zult U mij vertroosten?", "Jes 51:22": "Zo zegt de Heere, de HEERE en uw God, Die de zaak van Zijn volk twisten zal: Zie, Ik neem de beker van de zwijmeling van uw hand, de droesem van de beker van Mijn grimmigheid; u zult die voortaan niet meer drinken.", "Ps 109:7": "Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden.", "Ps 37:13": "De Heere belacht hem, want Hij ziet dat zijn dag komt.", "Ps 79:8": "Denk ons de vorige misdaden niet aan; haast U, laat Uw barmhartigheden ons tegemoetkomen; want wij zijn zeer zwak geworden.", "Klaagl 2:4": "Daleth. Hij heeft Zijn boog gespannen als een vijand; Hij heeft Zich met Zijn rechterhand gesteld als een tegenstander, dat Hij doodde al de begeerlijke dingen van de ogen; Hij heeft Zijn grimmigheid in de tent van de dochter van Sion uitgestort als een vuur.", "Micha 7:10": "En mijn vijandin zal het zien, en schaamte zal haar bedekken; zij die tegen mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen op haar neerzien; nu zal zij worden tot vertreding, als slijk van de straten.", "Luk 19:43": "Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Ps 10:13": "Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?", "Jer 17:21": "Zo zegt de HEERE: Wacht u voor uw zielen, en draag geen last op de sabbatdag, en breng die niet in door de poorten van Jeruzalem.", "Rom 2:17-29": "Zie, u wordt een Jood genoemd en rust op de wet, en roemt in God, En u kent Zijn wil, en beoordeelt wat daarvan verschilt, want u bent onderwezen uit de wet; En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn,", "Jes 42:17": "Maar wie zich op gesneden beelden verlaten, die tegen de gegoten beelden zeggen: U bent onze goden; die zullen achteruit gedreven worden, en met schaamte beschaamd worden.", "Jes 16:11": "Daarom rommelt mijn binnenste over Moab, als een harp, en mijn hart over Kir-heres.", "Deut 8:16": "Die u in de woestijn voedde met manna, dat uw vaderen niet gekend hadden; om u te verootmoedigen, en om u te beproeven, opdat Hij u uiteindelijk goeddeed;", "Num 28:9": "Maar op de sabbatdag twee volkomen eenjarige lammeren, en twee tienden meelbloem, als spijsoffer, met olie gemengd, alsook zijn drankoffer.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Jer 28:14": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Ik heb een ijzeren juk gedaan aan de hals van al deze volken, om Nebukadnezar, de koning van Babel, te dienen, en zij zullen hem dienen; ja, Ik heb hem ook het gedierte van het veld gegeven.", "Jer 52:13": "Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur.", "Dan 3:15": "Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, dan is het goed; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen?", "Job 9:22": "Dat is één ding, daarom zeg ik: De oprechte en de goddeloze verdoet Hij.", "Ps 120:2": "O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong.", "2 Kor 11:23-30": "Zijn zij dienaars van Christus? (ik spreek als een onwijze) ik ben boven hen; in arbeid overvloediger, in slagen voortreffelijker, in gevangenissen overvloediger, in doodsgevaar menigmaal. Van de Joden heb ik veertig slagen min één, vijfmaal ontvangen. Driemaal ben ik met roeden gegeseld geweest, eens ben ik gestenigd, driemaal heb ik schipbreuk geleden, een hele nacht en dag heb ik in de diepte doorgebracht.", "Hebr 2:10-18": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken. Want Hij Die heiligt, en zij die geheiligd worden, zijn allen uit één; om die reden schaamt Hij Zich niet hen broeders te noemen, En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Spr 3:11": "Mijn zoon! Verwerp de tucht van de HEERE niet, en word niet verdrietig over Zijn kastijding;", "Jer 16:6": "Zodat groten en kleinen in dit land zullen sterven, zij zullen niet begraven worden; en men zal hen niet beklagen, noch zichzelf insnijden, noch zich kaal maken om hen.", "Hand 9:6": "En hij, bevend en verbaasd, zei: Heere, wat wilt U dat ik doen zal? En de Heere zei tegen hem: Sta op, en ga de stad in, en daar zal u gezegd worden wat u doen moet.", "Ps 119:121-123": "Ain. Ik heb recht en gerechtigheid gedaan; geef mij niet over aan mijn onderdrukkers. Wees borg voor Uw knecht ten goede; laat de hoogmoedigen mij niet onderdrukken. Mijn ogen zijn bezweken van verlangen naar Uw heil, en naar de toezegging van Uw rechtvaardigheid.", "Jer 14:5": "Want ook de hinden in het veld werpen jongen, en verlaten die, omdat er geen jong gras is.", "Dan 4:27": "Daarom, o koning, laat mijn raad u behagen, en breek uw zonden af door gerechtigheid, en uw ongerechtigheden door genade te bewijzen aan de ellendigen, of er misschien verlenging van uw vrede mocht zijn.", "Luk 18:1": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven,", "Ps 11:4": "De HEERE is in het paleis van Zijn heiligheid, de troon van de HEERE is in de hemel; Zijn ogen aanschouwen, Zijn oogleden beproeven de mensenkinderen.", "Ps 58:11": "De rechtvaardige zal zich verblijden, als hij de wraak aanschouwt; hij zal zijn voeten wassen in het bloed van de goddeloze.", "Luk 5:8": "Toen Simon Petrus dat zag, viel hij neer aan de knieën van Jezus en zei: Heere, ga weg van mij, want ik ben een zondig mens.", "Hand 17:32": "Toen zij nu van de opstanding van de doden hoorden, spotten sommigen daarmee; en sommigen zeiden: Wij zullen u hierover een andere keer horen.", "Jer 52:12-24": "Daarna, in de vijfde maand, op de tiende van de maand (dit jaar was het negentiende jaar van koning Nebukadrezar, de koning van Babel), toen Nebuzaradan, de leider van de lijfwacht, die voor het aangezicht van de koning van Babel stond, in Jeruzalem gekomen was; Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.", "Ps 79:4": "Wij zijn onze buren tot smaad geworden; een spot en schimp voor hen die rondom ons zijn.", "Jer 13:18": "Zeg tegen de koning en tegen de koningin: Vernedert u, gaat zitten; want uw hele hoofdsieraad, de kroon van uw heerlijkheid, is neergedaald.", "2 Kron 6:22": "Wanneer iemand tegen zijn naaste zal gezondigd hebben, en die hem een eed van de vloek opgelegd zal hebben om zichzelf te vervloeken, en de eed van de vloek voor Uw altaar in dit huis komen zal;", "Lev 19:3": "Want ieder zal zijn moeder en zijn vader vrezen, en Mijn sabbatten houden; Ik ben de HEERE, uw God!", "Richt 10:15": "Maar de Israëlieten zeiden tegen de HEERE: Wij hebben gezondigd; doe met ons naar alles wat goed is in Uw ogen; verlos ons toch alleen op deze dag!", "1 Kon 13:21": "en hij riep tegen de man van God die uit Juda gekomen was, en zei: Zo zegt de HEERE: Omdat u opstandig bent geweest tegen de mond van de HEERE, en het gebod niet gehouden hebt dat de HEERE, uw God, u geboden had,", "Job 3:1-26": "Daarna opende Job zijn mond, en vervloekte zijn dag. Want Job antwoordde en zei: De dag verga, waarop ik geboren ben, en de nacht waarin men zei: Een knechtje is ontvangen.", "Richt 10:8": "Die verdrukten en vertrapten de Israëlieten in datzelfde jaar; achttien jaar lang onderdrukten zij alle Israëlieten die aan de overkant van de Jordaan waren, in het land van de Amorieten, dat in Gilead ligt.", "Job 34:9": "Want hij heeft gezegd: Het baat een man niet, als hij welbehagen heeft aan God.", "Ex 31:13-17": "Spreek u nu tot de kinderen van Israël: U zult zeker Mijn sabbatten onderhouden; want dit is een teken tussen Mij en u, bij uw geslachten; opdat men weet, dat Ik de HEERE ben, Die u heilig maakt. Onderhoud dan de sabbat, omdat hij u heilig is! Wie hem ontheiligt, zal zeker gedood worden; want ieder die daarop enig werk doet, die ziel zal uitgeroeid worden uit het midden van haar volken. Zes dagen zal men het werk doen; maar op de zevende dag is de sabbat van de rust, een heiligheid van de HEERE! Wie op de sabbatdag arbeid doet, zal zeker gedood worden.", "Ps 31:15-19": "Maar ik vertrouw op U, o HEERE! Ik zeg: U bent mijn God. Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers. Laat Uw aangezicht over Uw knecht lichten; verlos mij door Uw goedertierenheid.", "Ezech 14:4": "Daarom, spreek met hen en zeg tegen hen: Zo zegt de Heere HEERE: Ieder man uit het huis van Israël die de drekgoden in zijn hart opzet, en de aanstoot van zijn ongerechtigheid recht voor zijn aangezicht zet, en komt tot de profeet, Ik, de HEERE, zal hem antwoorden als hij komt, naar de veelheid van zijn drekgoden;", "Jer 2:34": "Ja, het bloed van de zielen van de onschuldige behoeftigen is in uw zomen gevonden; Ik heb dat niet door opgraven gevonden, maar aan dat alles.", "Openb 19:2": "Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft.", "Luk 21:24": "En zij zullen vallen door de scherpte van het zwaard, en gevankelijk weggevoerd worden onder alle volken; en Jeruzalem zal door de heidenen vertrapt worden, totdat de tijden van de heidenen vervuld zullen zijn.", "Hos 2:9": "En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden.", "Job 5:7": "Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen.", "Ps 102:3": "Verberg Uw aangezicht niet voor mij, neig Uw oor tot mij ten dage van mijn benauwdheid; ten dage als ik roep, verhoor mij haastig.", "Jer 17:18": "Laat mijn vervolgers beschaamd worden, maar laat mij niet beschaamd worden; laat hen verschrikt worden, maar laat mij niet verschrikt worden; breng over hen de dag van het kwaad, en verbreek hen met een dubbele verbreking.", "1 Kon 9:7": "Dan zal Ik Israël uitroeien van het land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen; en Israël zal tot een spreekwoord en spotrede zijn onder alle volken.", "Jer 14:8": "O Israëls Verwachting, Zijn Verlosser in tijd van benauwdheid! Waarom zou U zijn als een vreemdeling in het land, en als een reiziger die slechts inkeert om te overnachten?", "Pred 2:23": "Want al zijn dagen zijn smarten, en zijn bezigheid is verdriet; zelfs 's nachts vindt zijn hart geen rust. Dat is ook ijdelheid.", "Matt 27:46": "En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Klaagl 2:9": "Teth. Haar poorten zijn in de aarde verzonken; Hij heeft haar grendels verdorven en gebroken; haar koning en haar vorsten zijn onder de heidenen; er is geen wet; haar profeten vinden ook geen gezicht van de HEERE.", "Jer 50:29": "Laat u horen tegen Babel, u schutters! U allen die de boog spant! Leger u tegen haar rondom, laat niemand van hen ontkomen; vergeld haar naar haar werk, doe haar naar alles wat zij gedaan heeft; want zij heeft trots gehandeld tegen de HEERE, tegen de Heilige van Israël.", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Ex 9:27": "Toen stuurde Farao mensen, en riep Mozes en Aäron, en zei tegen hen: Ik heb ditmaal gezondigd; de HEERE is rechtvaardig; ik daarentegen en mijn volk zijn goddelozen!", "Hos 10:4": "Zij hebben woorden gesproken, vals gezworen bij het sluiten van een verbond; daarom zal het oordeel als een giftig kruid opschieten, op de voren van de velden.", "Jes 64:11": "Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "Jer 24:5": "Zo zegt de HEERE, de God van Israël: Zoals die goede vijgen, zo zal Ik de weggevoerden van Juda erkennen, die Ik uit deze plaats naar het land van de Chaldeeën heb weggestuurd, tot hun eigen goed.", "Spr 23:6-8": "Eet niet het brood van hem die boos is van oog, en wees niet belust op zijn smakelijke gerechten; Want zoals hij bedacht heeft in zijn ziel, zo is hij; hij zal tegen u zeggen: Eet en drink! maar zijn hart is niet met u. Uw hap, die u gegeten hebt, zult u uitspuwen; en u zult uw liefelijke woorden verspild hebben.", "Luk 23:54": "En het was de dag van de voorbereiding, en de sabbat brak aan.", "Hand 15:10": "Nu dan, waarom verzoekt u God, door een juk op de hals van de discipelen te leggen, dat noch onze vaders, noch wij hebben kunnen dragen?", "Ps 147:19": "Hij maakt aan Jakob Zijn woorden bekend, aan Israël Zijn inzettingen en Zijn rechten.", "Ps 90:15": "Verblijd ons naar de dagen, waarin U ons gedrukt hebt, naar de jaren, waarin wij het kwaad gezien hebben.", "Openb 18:16": "En zeggen: Wee, wee, de grote stad, die bekleed was met fijn linnen, en purper, en scharlaken, en versierd met goud, en met kostbaar gesteente, en met parels; want in één uur is zo'n grote rijkdom verwoest.", "Job 30:30": "Mijn huid is zwart geworden over mij, en mijn gebeente is ontstoken van dorheid.", "Micha 3:12": "Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud.", "Gen 43:30": "En Jozef haastte zich; want zijn hart werd bewogen om zijn broer, en hij zocht een plek om te wenen; en hij ging een kamer in, en weende daar.", "Job 34:23": "Zeker, Hij legt de mens niet te veel op, dat hij tegen God in het gericht zou mogen treden.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "1 Sam 3:18": "Toen maakte Samuël hem al die woorden bekend, en verborg ze niet voor hem. En hij zei: Hij is de HEERE; laat Hij doen wat goed is in Zijn ogen!", "Job 34:17-19": "Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen? Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen! Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "Amos 7:17": "Daarom zegt de HEERE zo: Uw vrouw zal in de stad hoereren, en uw zonen en uw dochters zullen door het zwaard vallen, en uw land zal met het meetsnoer verdeeld worden; en u zult in een onrein land sterven, en Israël zal zeker uit zijn land gevankelijk worden weggevoerd.", "Rom 16:18": "Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.", "Job 15:26": "Hij loopt tegen Hem aan met de hals, met zijn dikke, hoog verheven schilden;", "1 Kon 20:28": "En de man van God trad toe, en sprak tegen de koning van Israël, en zei: Zo zegt de HEERE: Omdat de Syriërs gezegd hebben: De HEERE is een God van de bergen, en Hij is niet een God van de laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat u weet, dat Ik de HEERE ben.", "Jer 18:21-23": "Daarom, geef hun zonen over aan de honger, en doe hen wegvloeien door het geweld van het zwaard, en laat hun vrouwen van kinderen beroofd en weduwe worden, en laat hun mannen door de dood omgebracht worden, en hun jongemannen met het zwaard geslagen worden in de strijd. Laat er een geschrei uit hun huizen gehoord worden, wanneer U snel een bende over hen brengt; omdat zij een kuil gegraven hebben om mij te vangen, en strikken verborgen hebben voor mijn voeten. Doch U, HEERE, weet al hun plannen tegen mij, om mij te doden; maak geen verzoening over hun ongerechtigheid, en delg hun zonde niet uit van voor Uw aangezicht; maar laat hen neergeveld worden voor Uw aangezicht; handel zo met hen, in de tijd van Uw toorn.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Ps 10:2": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben.", "Job 36:8-12": "En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben; En Hij opent hun oor voor de tucht, en zegt dat zij zich van de ongerechtigheid moeten bekeren.", "Ps 10:12-15": "Sta op, HEERE God! Hef Uw hand op, vergeet de ellendigen niet. Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken? U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Jer 30:14": "Al uw minnaars hebben u vergeten, zij vragen niet naar u; want Ik heb u geslagen met de plaag van een vijand, met de kastijding van iemand wrede; om de grootheid van uw ongerechtigheid, omdat uw zonden machtig veel zijn.", "Jer 9:4": "Wacht u, ieder voor zijn vriend, en vertrouw niet op enige broeder; want elke broeder doet niet dan bedriegen, en elke vriend gaat om met achterklap.", "Jes 5:1-4": "Nu zal ik voor mijn Beminde een lied van mijn Liefste zingen, over Zijn wijngaard. Mijn Beminde heeft een wijngaard op een vruchtbare heuvel. En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij goede druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht. Nu dan, u, inwoners van Jeruzalem, en u, mannen van Juda, oordeel toch tussen Mij en tussen Mijn wijngaard.", "Job 36:3": "Ik zal mijn kennis van verre ophalen, en mijn Schepper gerechtigheid toewijzen.", "Jes 4:3": "En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem;", "Ezech 11:22": "Toen tilden de cherubs hun vleugels op, en de raderen tegenover hen; en de heerlijkheid van de God van Israël was van boven over hen.", "Jer 19:9": "En Ik zal hun het vlees van hun zonen en het vlees van hun dochters doen eten, en zij zullen eten, ieder het vlees van zijn naaste, in de belegering en in de benauwing, waarmee hun vijanden, en zij die hun ziel zoeken, hen benauwen zullen.", "Job 7:2-6": "Zoals de dienstknecht hijgt naar de schaduw, en zoals de dagloner uitkijkt naar zijn werkloon; Zo zijn mij maanden van ijdelheid ten erve geworden, en nachten van moeite zijn mij voorbereid. Als ik ga liggen om te slapen, dan zeg ik: Wanneer zal ik opstaan, en heeft Hij de avond afgemeten? En ik word verzadigd van woelingen tot aan de schemertijd.", "Jak 5:11": "Zie, wij noemen hen gelukkig die volharden; u hebt van de volharding van Job gehoord, en u hebt gezien hoe de Heere het einde bracht, dat de Heere zeer barmhartig is en vol ontferming.", "Ps 48:3": "Schoon van ligging, een vreugde van de hele aarde is de berg Sion, aan de zijden van het noorden; de stad van de grote Koning.", "2 Kor 4:11": "Want wij, die leven, worden altijd om Jezus' wil in de dood overgegeven, opdat ook het leven van Jezus in ons sterfelijk vlees openbaar zou worden.", "Deut 29:18-28": "Dat onder u niet iemand is, man of vrouw, of gezin, of stam, die zijn hart heden afwendt van de HEERE, onze God, om de goden van deze volken te gaan dienen; dat onder u niet een wortel is, die gal en alsem draagt; En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen.", "Num 31:35": "En van de mensen, de zielen uit de vrouwen die geen gemeenschap met een man hadden gehad, waren alle zielen tezamen tweeëndertigduizend.", "Ps 42:7": "O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.", "Ps 48:4": "God is in haar paleizen; Hij is er bekend voor een Hoog Vertrek.", "Ps 10:1": "HEERE, waarom staat U ver weg? Waarom verbergt U Zich in tijden van benauwdheid?", "Job 22:14": "De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Hand 7:59": "En zij stenigden Stefanus, terwijl hij aanriep en zei: Heere Jezus, ontvang mijn geest.", "Ezech 23:28": "Want zo zegt de Heere HEERE: Zie, Ik zal u overgeven in de hand van hen die u haat, in de hand van hen van wie uw ziel is afgekeerd.", "Ps 109:1-31": "Een psalm van David, voor de koorleider. O God van mijn lof! Zwijg niet. Want de mond van de goddeloze en de mond van het bedrog zijn tegen mij opengedaan; zij hebben tegen mij gesproken met een valse tong. En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak.", "Spr 25:19": "Het vertrouwen op een trouweloze, op de dag van benauwdheid, is als een gebroken tand en een verstuikte voet.", "2 Kon 2:23": "En hij ging vandaar op naar Beth-el. Toen hij nu de weg opging, kwamen er kleine jongens uit de stad; die bespotten hem, en zeiden tegen hem: Kaalkop, ga op, kaalkop, ga op!", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "Ps 35:24": "Doe mij recht naar Uw gerechtigheid, HEERE, mijn God! En laat hen zich over mij niet verblijden.", "Ezech 9:7": "En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Jer 9:11": "En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner.", "Jes 28:9": "Aan wie zou Hij dan de kennis leren, en aan wie zou Hij het gehoorde te verstaan geven? Aan hen die van de melk gespeend zijn, die van de borsten weggehaald zijn?", "Klaagl 5:13": "Zij hebben de jongemannen weggenomen om te malen, en de jongens struikelden onder het hout.", "Ps 31:12": "Vanwege al mijn wederpartijders ben ik, ook voor mijn buren, zeer tot een smaad geworden, en voor mijn bekenden tot een schrik; die mij op de straten zien, vluchten van mij weg.", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Spr 3:12": "Want de HEERE kastijdt hem die Hij liefheeft, ja, zoals een vader de zoon in wie hij een welbehagen heeft.", "2 Kron 6:23": "Hoor U dan uit de hemel, en doe, en richt Uw knechten, door de goddeloze te vergelden en zijn weg op zijn hoofd te leggen, en door de rechtvaardige recht te doen en hem naar zijn gerechtigheid te geven.", "Jes 51:16": "En Ik leg Mijn woorden in uw mond, en bedek u onder de schaduw van Mijn hand; om de hemel te planten, en om de aarde te gronden, en om tegen Sion te zeggen: U bent Mijn volk.", "Jes 26:17": "Zoals een zwangere vrouw, als zij nadert tot het baren, smarten heeft en schreeuwt in haar weeën, zo zijn wij geweest, o HEERE, vanwege Uw aangezicht.", "Job 7:3": "Zo zijn mij maanden van ijdelheid ten erve geworden, en nachten van moeite zijn mij voorbereid.", "Zach 8:5": "En de straten van die stad zullen vol worden met jongens en meisjes, spelend op haar straten.", "Ezech 25:8": "Zo zegt de Heere HEERE: Omdat Moab en Seïr zeggen: Zie, het huis van Juda is gelijk aan al de heidenvolken;", "Ezech 14:11": "Opdat het huis van Israël niet meer van achter Mij afdwaalt, en zij zich niet meer verontreinigen met al hun overtredingen; dan zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn, spreekt de Heere HEERE.", "Ps 119:107": "Ik ben helemaal zeer verdrukt, HEERE! maak mij levend naar Uw woord.", "2 Kor 4:7-12": "Maar wij hebben deze schat in aarden vaten, opdat de uitnemendheid van de kracht van God zou zijn, en niet uit ons; Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig; Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven;", "Jer 48:36": "Daarom zal Mijn hart over Moab klagen als de fluiten; ook zal Mijn hart over de mensen van Kir-heres klagen als de fluiten, omdat het overschot dat hij gemaakt had, verloren is.", "Pred 7:2-4": "Het is beter te gaan in het klaaghuis, dan te gaan in het huis van het maaltijd; want daarin is het einde van alle mensen, en de levende legt het in zijn hart. Het treuren is beter dan het lachen; want door de droefheid van het aangezicht wordt het hart gebeterd. Het hart van de wijzen is in het klaaghuis; maar het hart van de dwazen in het huis van de vreugde.", "Deut 28:33": "De vrucht van uw land en al uw arbeid zal een volk opeten dat u niet gekend hebt; en u zult alle dagen alleen maar verdrukt en gepletterd zijn.", "Ps 70:4": "Laat hen terugkeren tot loon van hun beschaming, die daar zeggen: Ha, ha!", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 132:13": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei:", "2 Sam 4:12": "En David gaf zijn knechten bevel, en zij doodden hen, en hakten hun handen en hun voeten af, en hingen ze op bij de vijver te Hebron; maar het hoofd van Isboseth namen zij en begroeven het in Abners graf te Hebron.", "Ps 59:8": "Zie, zij storten overvloedig uit met hun mond; zwaarden zijn op hun lippen; want wie hoort het?", "Job 12:5": "Hij is een verachte fakkel, naar de mening van hem die gerust is; hij is gereed om met de voet te struikelen.", "Jes 5:13": "Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Ps 107:17-21": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden; Hun ziel gruwde van alle voedsel, en zij waren tot aan de poorten van de dood gekomen. Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Ps 94:7-9": "En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet. Let op, u onverstandigen onder het volk! En u dwazen! Wanneer zult u verstandig worden? Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien?", "Luk 20:46": "Wacht u voor de Schriftgeleerden, die graag rondlopen in lange gewaden, en die de begroetingen op de markten graag hebben, en de voorste plaatsen in de synagogen, en de ereplaatsen bij de maaltijden;", "Jes 47:11": "Daarom zal er over u een kwaad komen, u zult de dageraad daarvan niet weten; en een verderf zal er op u vallen, dat u niet zult kunnen verzoenen; want er zal snel een onstuimige verwoesting over u komen, zodat u het niet weten zult.", "Jes 4:4": "wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Ps 119:78": "Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Spr 26:18": "Zoals iemand die zich waanzinnig aanstelt, die vuurpijlen, pijlen en dodelijke dingen werpt;", "Ezech 30:18": "En te Tachpanhes zal de dag verduisterd worden, als Ik het juk van Egypte daar zal verbreken, en de hoogmoed van zijn sterkte in haar zal ophouden; haar zal een wolk bedekken, en haar dochters zullen in de gevangenschap gaan.", "Job 33:19-22": "Ook wordt hij gestraft met smart op zijn leger, en de sterke menigte van zijn beenderen; Zodat zijn leven het brood zelf verfoeit, en zijn ziel het begeerlijke voedsel; Dat zijn vlees verdwijnt uit het gezicht, en zijn beenderen, die niet gezien werden, uitsteken;", "Ps 119:145-149": "Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren. Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden. Ik ben de morgenschemering voorgekomen, en heb geschrei gemaakt; op Uw woord heb ik gehoopt.", "Ps 130:3": "Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "Ezech 20:24": "Omdat zij Mijn rechten niet gedaan hadden, maar Mijn inzettingen verworpen en Mijn sabbatten ontheiligd hadden, en hun ogen achter de drekgoden van hun vaderen aan gingen.", "Ps 71:19": "Ook is Uw gerechtigheid, o God, tot in de hoogte; Gij, Die grote dingen gedaan hebt; o God! wie is U gelijk?", "Hagg 2:18": "Ik sloeg u met brandkoren, met honingdauw en met hagel, al het werk van uw handen; en u keerde u niet tot Mij, spreekt de HEERE.", "Jer 5:14": "Daarom zegt de HEERE, de God van de heerscharen, zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk tot hout, en het zal hen verteren.", "Jer 50:31": "Zie, Ik wil tegen u, u trotse! spreekt de Heere, de HEERE van de heerscharen; want uw dag is gekomen, de tijd dat Ik u bezoeken zal.", "Num 15:32-36": "Toen de kinderen van Israël in de woestijn waren, vonden zij een man die hout las op de sabbatdag. En zij die hem hout zagen lezen, brachten hem tot Mozes en tot Aäron en tot de hele vergadering. En zij stelden hem in bewaring; want het was niet duidelijk gemaakt wat hem gedaan moest worden.", "Jes 38:2": "Toen keerde Hizkia zijn gezicht om naar de wand, en hij bad tot de HEERE.", "1 Joh 2:9": "Wie zegt, dat hij in het licht is, en zijn broeder haat, die is tot nu toe in de duisternis.", "Ezech 46:1": "Zo zegt de Heere HEERE: De poort van het binnenste voorhof, die naar het oosten kijkt, moet de zes werkdagen gesloten zijn; maar op de sabbatdag moet zij geopend worden; ook moet zij geopend worden op de dag van de nieuwe maan.", "Jer 16:16": "Zie, Ik zal zenden tot veel vissers, spreekt de HEERE, die zullen hen vissen; en daarna zal Ik zenden tot veel jagers, die zullen hen jagen, van elke berg, en van elke heuvel, ja, uit de kloven van de steenrotsen.", "Ps 38:19": "Want ik maak U mijn ongerechtigheid bekend, ik ben bekommerd vanwege mijn zonde.", "2 Petr 2:19": "zij beloven hun vrijheid, terwijl zijzelf slaven zijn van de verdorvenheid; want door wie iemand overwonnen is, daarvan is hij ook tot een slaaf gemaakt.", "Ps 78:31-34": "Toen Gods toorn tegen hen opging, zodat Hij van hun vetste doodde, en de uitgelezen mannen van Israël neervelde. Boven dit alles zondigden zij nog, en geloofden niet, ondanks Zijn wonderen. Daarom liet Hij hun dagen vergaan in ijdelheid, en hun jaren in verschrikking.", "Ps 53:2": "De dwaas zegt in zijn hart: Er is geen God; zij verderven het, en zij bedrijven gruwelijk onrecht; er is niemand die goed doet.", "Hos 5:14": "Want Ik zal voor Efraïm zijn als een felle leeuw, en voor het huis van Juda als een jonge leeuw; Ik, Ik zal verscheuren en heengaan; Ik zal wegvoeren, en er zal geen redder zijn.", "2 Kron 7:12-22": "En de HEERE verscheen aan Salomo 's nachts, en Hij zei tegen hem: Ik heb uw gebed verhoord, en heb Mij deze plaats uitgekozen tot een offerhuis. Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend; En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Lev 26:28": "Dan zal Ik ook in verhitte woede tegen u in gaan, en Ik zal u ook zevenvoudig over uw zonden tuchtigen.", "Jes 37:29": "Om uw woede tegen Mij, en dat uw onrust voor Mijn oren is opgekomen, zal Ik Mijn haak in uw neus leggen, en Mijn bit in uw lippen, en Ik zal u laten terugkeren langs de weg waarlangs u gekomen bent.", "Jer 52:8": "Doch het leger van de Chaldeeën joeg de koning na, en zij achterhaalden Zedekia in de vlakke velden van Jericho; en zijn hele leger werd van bij hem verstrooid.", "Ps 80:4-6": "O God! Breng ons terug, en laat Uw aanschijn lichten, zo zullen wij verlost worden. HEERE, God van de heerscharen! Hoe lang zult U roken tegen het gebed van Uw volk? U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.", "Spr 13:1": "Een wijze zoon hoort de tucht van de vader; maar een spotter hoort de bestraffing niet.", "Richt 2:21": "zo zal Ik ook niet doorgaan om voor hun aangezicht iemand uit de bezitting te verdrijven, van de heidenvolken die Jozua heeft achtergelaten toen hij stierf;", "Hand 4:29": "En nu dan, Heere, zie op hun dreigingen, en geef Uw dienstknechten met alle vrijmoedigheid Uw woord te spreken;", "Jer 14:1-6": "Het woord van de HEERE, dat tot Jeremia gekomen is, over de zaken van de grote droogte. Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op. En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.", "Ps 40:13": "Want kwaden, tot zonder getal toe, hebben mij omgeven; mijn ongerechtigheden hebben mij aangegrepen, zodat ik niet heb kunnen zien; ze zijn menigvuldiger dan de haren van mijn hoofd, en mijn hart heeft mij verlaten.", "Deut 11:9": "En opdat u de dagen verlengt in het land, dat de HEERE aan uw vaderen gezworen heeft, aan hen en aan hun nageslacht te geven; een land, vloeiend van melk en honing.", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "Klaagl 4:15": "Samech. Zij riepen tot hen: Ga weg, hier is een onreine, ga weg, ga weg, raak niet aan! Zeker, zij zijn weggevlucht, ja, weggezworven; zij zeiden onder de heidenen: Zij zullen er niet langer wonen.", "Obadja 1:12": "U had niet moeten kijken naar de dag van uw broeder, de dag van zijn vervreemding; en u had zich niet moeten verblijden over de kinderen van Juda, op de dag van hun ondergang; en u had uw mond niet groot moeten maken, op de dag van de benauwdheid;", "Spr 20:14": "Het is slecht, het is slecht! zal de koper zeggen; maar als hij weggegaan is, dan zal hij zich beroemen.", "Dan 8:25": "En door zijn sluwheid zal hij de bedrieglijkheid doen slagen in zijn hand; en hij zal zich in zijn hart verheffen; en in een tijd van schijnbare rust zal hij velen te gronde richten, en hij zal opstaan tegen de Vorst der vorsten, maar hij zal gebroken worden, zonder mensenhand.", "Ezech 26:2": "Mensenkind! Omdat Tyrus van Jeruzalem gezegd heeft: Heah! Zij is verbroken, de poort van de volken; zij is tot mij omgewend; ik zal vervuld worden, zij is verwoest!", "Ex 34:21": "Zes dagen zult u werken, maar op de zevende dag zult u rusten; in de ploegtijd en in de oogst zult u rusten.", "Matt 7:15": "Maar wacht u voor de valse profeten, die in schaapskleren naar u toe komen, maar van binnen zijn het roofzuchtige wolven.", "Jer 33:10-12": "Zo zegt de HEERE: Op deze plaats (waarvan u zegt: Zij is woest, zodat er geen mens en geen dier in is), in de steden van Juda, en op de straten van Jeruzalem, die zo verwoest zijn dat er geen mens, en geen inwoner, en geen dier in is, zal weer gehoord worden, De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE. Zo zegt de HEERE van de heerscharen: Op deze plaats, die zo woest is dat er geen mens, zelfs geen dier in is, alsook in al haar steden, zullen weer woningen zijn van herders, die de kudden laten neerliggen.", "Ps 48:12": "Laat de berg Sion blijde zijn; laat de dochters van Juda zich verheugen, om Uw oordelen wil.", "Hand 13:42": "En toen de Joden de synagoge uitgegaan waren, vroegen de heidenen of tegen de volgende sabbat dezelfde woorden tot hen gesproken zouden worden.", "Klaagl 2:18": "Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op!", "Dan 7:10": "Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.", "Job 36:15": "Hij zal de ellendige in zijn ellende bevrijden, en in de onderdrukking zal Hij voor hun oor openbaren.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "Num 24:10": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend!", "Jes 47:9": "Toch zullen deze beide dingen u in een ogenblik overkomen, op één dag, de beroving van kinderen en weduwschap; volkomen zullen zij u overkomen, vanwege de veelheid van uw toverijen, vanwege de grote menigte van uw bezweringen.", "Ps 56:2-14": "Wees mij genadig, o God! Want de mens zoekt mij op te slokken; de hele dag dringt de bestrijder mij. Mijn verspieders zoeken mij de hele dag op te slokken; want ik heb veel bestrijders, o Allerhoogste! Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "Ps 43:1-5": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht. Want U bent de God van mijn sterkte; waarom verstoot U mij dan? Waarom ga ik steeds in het zwart, vanwege de onderdrukking van de vijand? Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Gen 18:20": "Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Jes 5:18": "Wee hun die de ongerechtigheid trekken met koorden van ijdelheid, en de zonde als met dikke wagentouwen!", "Hand 16:13": "En op de dag van de sabbat gingen wij de stad uit, naar de rivier, waar men gewoonlijk bad; en wij gingen zitten en spraken tot de vrouwen die daar samengekomen waren.", "Hoogl 5:4": "Mijn Liefste trok Zijn hand door het gat van de deur; en mijn binnenste raakte ontroerd om Zijnentwil.", "Hand 7:60": "En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.", "Job 30:11": "Want Hij heeft mijn koord losgemaakt en mij bedrukt; daarom hebben zij de teugel voor mijn aangezicht afgeworpen.", "Fil 1:30": "Terwijl u dezelfde strijd hebt als die u bij mij gezien hebt, en nu bij mij hoort.", "Dan 4:25-27": "Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil. Dat er ook gezegd is dat men de stronk met de wortels van die boom zou laten staan; uw koninkrijk zal u zeker blijven, nadat u zult hebben erkend dat de Hemel heerst. Daarom, o koning, laat mijn raad u behagen, en breek uw zonden af door gerechtigheid, en uw ongerechtigheden door genade te bewijzen aan de ellendigen, of er misschien verlenging van uw vrede mocht zijn.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Ps 102:24": "Hij heeft mijn kracht op de weg neergedrukt; mijn dagen heeft Hij verkort.", "2 Kon 4:26": "Loop haar nu toch tegemoet, en zeg tegen haar: Is het goed met u? Is het goed met uw man? Is het goed met uw kind? En zij zei: Het is goed.", "Lev 26:40": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben.", "Luk 11:15": "Maar sommigen van hen zeiden: Hij drijft de demonen uit door Beëlzebul, de leider van de demonen.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "Jer 51:24": "Maar Ik zal Babel en alle inwoners van Chaldea vergelden al hun slechtheid, die zij gedaan hebben aan Sion, voor uw ogen, spreekt de HEERE.", "Mal 1:7": "U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk.", "Lev 26:34": "Dan zal het land aan zijn sabbatten een welgevallen hebben, al de dagen van de verwoesting, terwijl u in het land van uw vijanden bent; dan zal het land rusten, en aan zijn sabbatten een welgevallen hebben.", "Jona 1:14": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd.", "Ps 66:11": "U had ons in het net gebracht; U had een engs band om onze lenden gelegd;", "Jer 10:22": "Ziet, er komt een stem van het gerucht, en een groot beven uit het land van het noorden; dat men de steden van Juda zal stellen tot een verwoesting, een woning van de draken.", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Deut 5:12-15": "Onderhoud de sabbatdag, dat u die heiligt, zoals de HEERE, uw God, u geboden heeft. Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw os, noch uw ezel, noch enig van uw vee, noch de vreemdeling die in uw poorten is; opdat uw dienstknecht en uw dienstmaagd rusten, net als u.", "Matt 8:25": "En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan!", "Jer 27:13-15": "Waarom zou u sterven, u en uw volk, door het zwaard, door de honger en door de pest, zoals de HEERE gesproken heeft over het volk dat de koning van Babel niet zal dienen? Luister dan niet naar de woorden van de profeten die tegen u spreken en zeggen: U zult de koning van Babel niet dienen; want zij profeteren u leugens. Want Ik heb ze niet gezonden, spreekt de HEERE, en zij profeteren leugens in Mijn Naam; met als gevolg dat Ik u wegjaag, en u omkomt, u en de profeten die u profeteren.", "Ps 18:26": "Bij de goedertierene houdt U Zich goedertieren, bij de oprechte man houdt U Zich oprecht.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Rom 9:33": "zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.", "Jer 48:27": "Want is Israël u niet tot bespotting geweest? Was hij onder de dieven gevonden, dat u zich zo bewoog, van de tijd af dat uw woorden over hem gingen?", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Jes 18:7": "In die tijd zal de HEERE van de heerscharen een geschenk gebracht worden van het volk dat lang en glad is, en van het volk dat gevreesd is van oudsher tot nu; een volk van regel en regel, en van vertreding, welks land de rivieren beroven; naar de plaats van de Naam van de HEERE van de heerscharen, naar de berg Sion.", "Luk 18:13": "En de tollenaar, die op een afstand stond, wilde zelfs zijn ogen niet opheffen naar de hemel, maar sloeg op zijn borst en zei: O God, wees mij, zondaar, genadig!", "Jes 28:10": "Want het is gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig.", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "Ps 74:1": "Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?", "Klaagl 3:27": "Teth. Het is goed voor een man, dat hij het juk in zijn jeugd draagt.", "Ps 77:3-7": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden. Dacht ik aan God, dan maakte ik misbaar; peinsde ik, dan werd mijn ziel overstelpt. Sela. U hield mijn ogen wakend; ik was verslagen, en sprak niet.", "Jer 29:4": "Zo zegt de HEERE van de heerscharen, de God van Israël, tegen allen die gevankelijk zijn weggevoerd, die Ik gevankelijk heb laten wegvoeren van Jeruzalem naar Babel:", "Matt 21:28-32": "Maar wat denkt u? Een man had twee zonen, en hij ging naar de eerste en zei: Zoon, ga vandaag in mijn wijngaard werken. Maar hij antwoordde en zei: Ik wil niet; maar later kreeg hij berouw en ging hij toch. En hij ging naar de tweede en zei hetzelfde. En deze antwoordde en zei: Ik ga, heer! En hij ging niet.", "Ps 44:24-27": "Waak op, waarom zou U slapen, Heere! Ontwaak, verstoot niet tot in eeuwigheid. Waarom zou U Uw aangezicht verbergen, onze ellende en onze onderdrukking vergeten? Want onze ziel is in het stof neergebogen; onze buik kleeft aan de aarde.", "Jer 25:29": "Want zie, in de stad, die naar Mijn Naam genoemd is, begin Ik te plagen, en zou u dan zonder meer onschuldig gehouden worden? U zult niet onschuldig worden gehouden; want Ik roep het zwaard over alle inwoners van de aarde, spreekt de HEERE van de heerscharen.", "Spr 14:10": "Het hart kent zijn eigen bittere droefheid; en een vreemde zal zich met zijn blijdschap niet vermengen.", "Ps 3:2": "O HEERE, hoe zijn mijn tegenstanders talrijk geworden; velen staan tegen mij op.", "Deut 4:5-31": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen. Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk! Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "Ps 51:9-19": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw. Doe mij vreugde en blijdschap horen; laat de beenderen zich verheugen die U verbrijzeld hebt. Verberg Uw aangezicht van mijn zonden, en delg al mijn ongerechtigheden uit.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Jer 32:16-25": "Vervolgens, nadat ik de koopbrief aan Baruch, de zoon van Nerija, gegeven had, bad ik tot de HEERE: Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk. U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!", "Ps 31:19": "Laat de valse lippen stom worden, die hard spreken tegen de rechtvaardige, in hoogmoed en verachting.", "Luk 4:16": "En Hij kwam in Nazareth, waar Hij was opgevoed, en ging, naar Zijn gewoonte, op de dag van de sabbat naar de synagoge; en stond op om te lezen.", "Ps 76:10": "Toen God opstond ten oordeel, om alle zachtmoedigen van de aarde te verlossen. Sela.", "Hos 6:4": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat.", "2 Kon 25:1": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom.", "Ps 12:5": "Die zeggen: Wij zullen
