../amos/1/"}, {"naam": "Obadja", "href": "../../obadja/1/"}, {"naam": "Jona", "href": "../../jona/1/"}, {"naam": "Micha", "href": "../../micha/1/"}, {"naam": "Nahum", "href": "../../nahum/1/"}, {"naam": "Habakuk", "href": "../../habakuk/1/"}, {"naam": "Zefanja", "href": "../../zefanja/1/"}, {"naam": "Haggaï", "href": "../../haggai/1/"}, {"naam": "Zacharia", "href": "../../zacharia/1/"}, {"naam": "Maleachi", "href": "../../maleachi/1/"}, {"naam": "Mattheüs", "href": "../../mattheus/1/"}, {"naam": "Markus", "href": "../../markus/1/"}, {"naam": "Lukas", "href": "../../lukas/1/"}, {"naam": "Johannes", "href": "../../johannes/1/"}, {"naam": "Handelingen", "href": "../../handelingen/1/"}, {"naam": "Romeinen", "href": "../../romeinen/1/"}, {"naam": "1 Korinthe", "href": "../../1-korinthe/1/"}, {"naam": "2 Korinthe", "href": "../../2-korinthe/1/"}, {"naam": "Galaten", "href": "../../galaten/1/"}, {"naam": "Efeze", "href": "../../efeze/1/"}, {"naam": "Filippenzen", "href": "../../filippenzen/1/"}, {"naam": "Kolossenzen", "href": "../../kolossenzen/1/"}, {"naam": "1 Thessalonicenzen", "href": "../../1-thessalonicenzen/1/"}, {"naam": "2 Thessalonicenzen", "href": "../../2-thessalonicenzen/1/"}, {"naam": "1 Timotheüs", "href": "../../1-timotheus/1/"}, {"naam": "2 Timotheüs", "href": "../../2-timotheus/1/"}, {"naam": "Titus", "href": "../../titus/1/"}, {"naam": "Filemon", "href": "../../filemon/1/"}, {"naam": "Hebreeën", "href": "../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Aleph. Hoe zit die stad zo eenzaam, die vol volk was; zij is als een weduwe geworden, zij, die groot was onder de heidenen, een vorstin onder de landschappen, is cijnsbaar geworden.", "2": "Beth. Zij weent steeds 's nachts, en haar tranen lopen over haar kaken; zij heeft geen trooster onder al haar liefhebbers; al haar vrienden hebben trouweloos met haar gehandeld, zij zijn haar tot vijanden geworden.", "3": "Gimel. Juda is in gevangenschap gegaan vanwege de ellende, en vanwege de veelheid van de dienstbaarheid; zij woont onder de heidenen, zij vindt geen rust; al haar vervolgers achterhalen haar tussen de engten.", "4": "Daleth. De wegen van Sion treuren, omdat niemand op het feest komt; al haar poorten zijn woest, haar priesters zuchten: haar jonkvrouwen zijn bedroefd, en zij zelf is in bitterheid.", "5": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen *in* de gevangenschap voor het aangezicht van de tegenstander.", "6": "Vau. En van de dochter van Sion is al haar sieraad weggegaan; haar vorsten zijn als de herten, *die* geen weide vinden, en zij gaan krachteloos heen voor het aangezicht van de vervolger.", "7": "Zain. Jeruzalem is, *in* de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.", "8": "Cheth. Jeruzalem heeft zwaar gezondigd, daarom is zij als een afgezonderde *vrouw* geworden; allen, die haar eerden, achten haar onwaard, omdat zij haar naaktheid gezien hebben; zij zucht ook, en zij is achterwaarts gekeerd.", "9": "Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar einde, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot.", "10": "Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden.", "11": "Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "12": "Lamed. Gaat het u niet aan, u allen, die over de weg gaat? Schouwt het aan en ziet, of er een smart is gelijk mijn smart, die mij aangedaan is, waarmee de HEERE *mij* bedroefd heeft ten dage van de gloed van Zijn toorn.", "13": "Mem. Van de hoogte heeft Hij een vuur in mijn beenderen gezonden, waarover Hij geheerst heeft; Hij heeft voor mijn voeten een net uitgebreid, Hij heeft mij achterwaarts doen keren, Hij heeft mij woest en ziek gemaakt de hele dag.", "14": "Nun. Het juk van mijn overtredingen is aangebonden door Zijn hand, zij zijn samengevlochten, zij zijn op mijn hals geklommen; Hij heeft mijn kracht doen vervallen; de Heere heeft mij in *hun* handen gegeven, ik kan niet opstaan.", "15": "Samech. De Heere heeft al mijn sterken in het midden van mij vertreden; Hij heeft een bijeenkomst over mij uitgeroepen, om mijn jongelingen te verbreken; de Heere heeft de wijnpers van de jonkvrouw, de dochter van Juda, aangetreden.", "16": "Ain. Om deze dingen ween ik; mijn oog, mijn oog vliet af van water, omdat de trooster, die mijn ziel zou verkwikken, ver van mij is; mijn kinderen zijn verwoest, omdat de vijand de overhand heeft.", "17": "Pe. Sion breidt haar handen uit, er is geen trooster voor haar; de HEERE heeft van Jakob geboden, dat wie rondom hem zijn, zijn tegenstanders zouden zijn; Jeruzalem is als een afgezonderde *vrouw* onder hen.", "18": "Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond opstandig geweest; hoort toch, alle volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenschap gegaan.", "19": "Koph. Ik riep tot mijn liefhebbers, *maar* zij hebben mij bedrogen; mijn priesters en mijn oudsten hebben in de stad de geest gegeven, toen zij voedsel voor zich zochten, opdat zij hun ziel mochten verkwikken.", "20": "Resch. Zie, HEERE, want mij is bang; mijn ingewand is beroerd, mijn hart heeft zich omgekeerd in het binnenste van mij, want ik ben zeer opstandig geweest; van buiten heeft *mij* het zwaard van kinderen beroofd, van binnen is het als de dood.", "21": "Schin. Zij horen, dat ik zucht, *maar* ik heb geen trooster; al mijn vijanden horen mijn kwaad; *en* zij zijn vrolijk, dat Gij het gedaan hebt; *als* Gij de dag zult hebben voortgebracht, *die* Gij uitgeroepen hebt, dan zullen zij zijn, gelijk ik ben.", "22": "Thau. Laat al hun kwaad voor Uw aangezicht komen, en doe hun, zoals Gij mij gedaan hebt vanwege al mijn overtredingen; want mijn zuchtingen zijn veel, en mijn hart is mat."}, "SV": {"1": "Aleph. Hoe zit die stad *zo* eenzaam, die vol volks was, zij is als een weduwe geworden, zij, die groot was onder de heidenen, een vorstin onder de landschappen, is cijnsbaar geworden.", "2": "Beth. Zij weent steeds des nachts, en haar tranen *lopen* over haar kinnebakken; zij heeft geen trooster onder al haar liefhebbers; al haar vrienden hebben trouwelooslijk met haar gehandeld, zij zijn haar tot vijanden geworden.", "3": "Gimel. Juda is in gevangenis gegaan vanwege de ellende, en vanwege de veelheid der dienstbaarheid; zij woont onder de heidenen, zij vindt geen rust; al haar vervolgers achterhalen ze tussen de engten.", "4": "Daleth. De wegen Sions treuren, omdat niemand op het feest komt; al haar poorten zijn woest, haar priesters zuchten: haar jonkvrouwen zijn bedroefd, en zij zelve is in bitterheid.", "5": "He. Haar tegenpartijders zijn ten hoofd geworden, haar vijanden zijn gerust; omdat haar de HEERE bedroefd heeft, vanwege de veelheid harer overtredingen; haar kinderkens gaan henen *in* de gevangenis voor het aangezicht des tegenpartijders.", "6": "Vau. En van de dochter Sions is al haar sieraad weggegaan; haar vorsten zijn als de herten, *die* geen weide vinden, en zij gaan krachteloos henen voor het aangezicht des vervolgers.", "7": "Zain. Jeruzalem is, *in* de dagen harer ellende en harer veelvuldige ballingschap, indachtig aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; dewijl haar volk door de hand des tegenpartijders valt, en zij geen helper heeft; de tegenpartijders zien haar aan, zij spotten met haar rustdagen.", "8": "Cheth. Jeruzalem heeft zwaarlijk gezondigd, daarom is zij als een afgezonderde *vrouw* geworden; allen, die haar eerden, achten haar onwaard, dewijl zij haar naaktheid gezien hebben; zij zucht ook, en zij is achterwaarts gekeerd.", "9": "Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar uiterste, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot.", "10": "Jod. De tegenpartijder heeft zijn hand aan al haar gewenste dingen uitgebreid; immers heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden hadt, dat zij in Uw gemeente niet komen zouden.", "11": "Caph. Al haar volk zucht, brood zoekende, zij hebben hun gewenste dingen voor spijs gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "12": "Lamed. Gaat het ulieden niet aan, gij allen, die over weg gaat? Schouwt het aan en ziet, of er een smart zij gelijk mijn smart, die mij aangedaan is, waarmede de HEERE *mij* bedroefd heeft ten dage der hittigheid Zijns toorns.", "13": "Mem. Van de hoogte heeft Hij een vuur in mijn beenderen gezonden, waarover Hij geheerst heeft; Hij heeft voor mijn voeten een net uitgebreid, Hij heeft mij achterwaarts doen keren, Hij heeft mij woest en ziek gemaakt den gansen dag.", "14": "Nun. Het juk mijner overtredingen is aangebonden door Zijn hand, zij zijn samengevlochten, zij zijn op mijn hals geklommen; Hij heeft mijn kracht doen vervallen; de Heere heeft mij in *hun* handen gegeven, ik kan niet opstaan.", "15": "Samech. De Heere heeft al mijn sterken in het midden van mij vertreden; Hij heeft een bijeenkomst over mij uitgeroepen, om mijn jongelingen te verbreken; de Heere heeft de wijnpers der jonkvrouw, der dochter van Juda, aangetreden.", "16": "Ain. Om dezer dingen wille ween ik; mijn oog, mijn oog vliet af van water, omdat de trooster, die mijn ziel zou verkwikken, verre van mij is; mijn kinderen zijn verwoest, omdat de vijand de overhand heeft.", "17": "Pe. Sion breidt haar handen uit, daar is geen trooster voor haar; de HEERE heeft van Jakob geboden, dat die rondom hem zijn, zijn tegenpartijders zouden zijn; Jeruzalem is als een afgezonderde *vrouw* onder hen.", "18": "Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond wederspannig geweest; hoort toch, alle gij volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenis gegaan.", "19": "Koph. Ik riep tot mijn liefhebbers, *maar* zij hebben mij bedrogen; mijn priesters en mijn oudsten hebben in de stad den geest gegeven, als zij spijze voor zich zochten, opdat zij hun ziel mochten verkwikken.", "20": "Resch. Aanzie, HEERE, want mij is bange; mijn ingewand is beroerd, mijn hart heeft zich omgekeerd in het binnenste van mij, want ik ben zeer wederspannig geweest; van buiten heeft *mij* het zwaard van kinderen beroofd, van binnen is als de dood.", "21": "Schin. Zij horen, dat ik zucht, *maar* ik heb geen trooster; al mijn vijanden horen mijn kwaad; *en* zij zijn vrolijk, dat Gij het gedaan hebt; *als* Gij den dag zult voortgebracht hebben, *dien* Gij uitgeroepen hebt, zo zullen zij zijn, gelijk ik ben.", "22": "Thau. Laat al hun kwaad voor Uw aangezicht komen, en doe hun, gelijk als Gij mij gedaan hebt vanwege al mijn overtredingen; want mijn zuchtingen zijn vele, en mijn hart is mat."}, "KJV": {"1": "How doth the city sit solitary, *that was* full of people! *how* is she become as a widow! she *that was* great among the nations, *and* princess among the provinces, *how* is she become tributary!", "2": "She weepeth sore in the night, and her tears *are* on her cheeks: among all her lovers she hath none to comfort *her*: all her friends have dealt treacherously with her, they are become her enemies.", "3": "Judah is gone into captivity because of affliction, and because of great servitude: she dwelleth among the heathen, she findeth no rest: all her persecutors overtook her between the straits.", "4": "The ways of Zion do mourn, because none come to the solemn feasts: all her gates are desolate: her priests sigh, her virgins are afflicted, and she *is* in bitterness.", "5": "Her adversaries are the chief, her enemies prosper; for the LORD hath afflicted her for the multitude of her transgressions: her children are gone into captivity before the enemy.", "6": "And from the daughter of Zion all her beauty is departed: her princes are become like harts *that* find no pasture, and they are gone without strength before the pursuer.", "7": "Jerusalem remembered in the days of her affliction and of her miseries all her pleasant things that she had in the days of old, when her people fell into the hand of the enemy, and none did help her: the adversaries saw her, *and* did mock at her sabbaths.", "8": "Jerusalem hath grievously sinned; therefore she is removed: all that honoured her despise her, because they have seen her nakedness: yea, she sigheth, and turneth backward.", "9": "Her filthiness *is* in her skirts; she remembereth not her last end; therefore she came down wonderfully: she had no comforter. O LORD, behold my affliction: for the enemy hath magnified", "10": "The adversary hath spread out his hand upon all her pleasant things: for she hath seen *that* the heathen entered into her sanctuary, whom thou didst command *that* they should not enter into thy congregation.", "11": "All her people sigh, they seek bread; they have given their pleasant things for meat to relieve the soul: see, O LORD, and consider; for I am become vile.", "12": "*Is it* nothing to you, all ye that pass by? behold, and see if there be any sorrow like unto my sorrow, which is done unto me, wherewith the LORD hath afflicted *me* in the day of his fierce anger.", "13": "From above hath he sent fire into my bones, and it prevaileth against them: he hath spread a net for my feet, he hath turned me back: he hath made me desolate *and* faint all the day.", "14": "The yoke of my transgressions is bound by his hand: they are wreathed, *and* come up upon my neck: he hath made my strength to fall, the Lord hath delivered me into *their* hands, *from whom* I am not able to rise up.", "15": "The Lord hath trodden under foot all my mighty *men* in the midst of me: he hath called an assembly against me to crush my young men: the Lord hath trodden the virgin, the daughter of Judah, *as* in a winepress.", "16": "For these *things* I weep; mine eye, mine eye runneth down with water, because the comforter that should relieve my soul is far from me: my children are desolate, because the enemy prevailed.", "17": "Zion spreadeth forth her hands, *and there is* none to comfort her: the LORD hath commanded concerning Jacob, *that* his adversaries *should be* round about him: Jerusalem is as a menstruous woman", "18": "The LORD is righteous; for I have rebelled against his commandment: hear, I pray you, all people, and behold my sorrow: my virgins and my young men are gone into captivity.", "19": "I called for my lovers, *but* they deceived me: my priests and mine elders gave up the ghost in the city, while they sought their meat to relieve their souls.", "20": "Behold, O LORD; for I *am* in distress: my bowels are troubled; mine heart is turned within me; for I have grievously rebelled: abroad the sword bereaveth, at home *there is* as death.", "21": "They have heard that I sigh: *there is* none to comfort me: all mine enemies have heard of my trouble; they are glad that thou hast done *it*: thou wilt bring the day *that* thou hast called, and they shall be like", "22": "Let all their wickedness come before thee; and do unto them, as thou hast done unto me for all my transgressions: for my sighs *are* many, and my heart *is* faint."}}, "tsk": {"1": [{"kopje": "Hoe zit", "refs": ["Klaagl 2:1", "Klaagl 4:1", "Jes 14:12", "Jer 50:23", "Zef 2:15", "Openb 18:16", "Openb 18:17"]}, {"kopje": "zit", "refs": ["Klaagl 2:10", "Jes 3:26", "Jes 47:1-15", "Jes 50:5", "Jes 52:2", "Jes 52:7", "Jer 9:11", "Ezech 26:16"]}, {"kopje": "vol", "refs": ["Ps 122:4", "Jes 22:2", "Zach 8:4", "Zach 8:5"]}, {"kopje": "als een", "refs": ["Jes 47:8", "Jes 47:9", "Jes 54:4", "Openb 18:7"]}, {"kopje": "groot", "refs": ["1 Kon 4:2  HEERE aansluiten, met een eeuwig verbond, dat niet zal worden vergeten.", "Ps 71:12": "O God, wees niet ver van mij; mijn God! haast U tot mijn hulp.", "Job 6:1-30": "Maar Job antwoordde en zei: Och, of mijn verdriet grondig gewogen werd, en men mijn ellende samen in een weegschaal ophief! Want het zou nu zwaarder zijn dan het zand der zeeën; daarom worden mijn woorden opgezwolgen.", "Matt 14:30": "Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij!", "Jer 5:5": "Ik zal naar de groten gaan, en met hen spreken, want die kennen de weg van de HEERE, het recht van hun God; maar zij hadden samen het juk verbroken, en de banden verscheurd.", "Job 15:31": "Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "1 Sam 2:36": "En het zal gebeuren, dat ieder die van uw huis over is, zal komen om zich voor hem neer te buigen voor een stukje geld en een bol brood, en zal zeggen: Neem mij toch aan tot een van de priesterlijke bedieningen, dat ik een stukje brood mag eten.", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "1 Kon 3:26": "Maar de vrouw wier zoon de levende was, sprak tot de koning (want haar ingewanden ontstaken vanwege haar zoon), en zei: Och, mijn heer! Geef haar dat levende kind, en dood het geenszins; de andere zei daarentegen: Het zal noch van u noch van mij zijn, snijd het doormidden.", "Jer 14:19-21": "Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking. HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd. Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.", "Joh 6:70": "Jezus antwoordde hun: Heb Ik u niet twaalf uitgekozen? En één van u is een duivel.", "2 Kron 24:18": "Zo verlieten zij het huis van de HEERE, de God van hun vaderen, en dienden de gewijde palen en de afgoden; toen kwam er grote toorn over Juda en Jeruzalem, om deze schuld van hen.", "2 Kor 4:16": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag.", "1 Petr 1:7": "opdat de beproeving van uw geloof — die veel kostbaarder is dan goud, dat vergaat en toch door het vuur beproefd wordt — bevonden wordt te zijn tot lof, eer en heerlijkheid bij de openbaring van Jezus Christus;", "2 Kron 36:20": "En wie overgebleven was van het zwaard, voerde hij weg naar Babel, en zij werden hem en zijn zonen tot knechten, totdat het koninkrijk van Perzië ging regeren;", "1 Kron 9:32": "En uit de kinderen van de Kahathieten, uit hun broeders, waren enigen over de broden van de bereiding, om die elke sabbat te bereiden.", "Ps 88:10-15": "Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "2 Kon 9:33": "En hij zei: Gooi haar naar beneden. En zij gooiden haar naar beneden, zodat van haar bloed tegen de muur en tegen de paarden gespat werd; en hij vertrapte haar.", "Hebr 12:5-11": "En u bent de vermaning vergeten, die tot u spreekt als tot zonen: Mijn zoon, acht de kastijding van de Heere niet klein, en bezwijk niet als u door Hem bestraft wordt; Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt. Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt?", "Ezech 16:37-39": "daarom, zie, Ik zal al uw minnaars verzamelen, met wie u vermengd bent geweest, en allen die u liefgehad hebt, met allen die u gehaat hebt; en Ik zal hen van rondom tegen u verzamelen, en Ik zal voor hen uw naaktheid ontdekken, zodat zij uw hele naaktheid zullen zien. Daarbij zal Ik u berechten naar de rechten van overspeelsters en bloedvergietsters; en Ik zal u overgeven aan het bloed van de grimmigheid en van het ijver. En Ik zal u in hun hand overgeven, en zij zullen uw verhoging afbreken, en uw hoge plaatsen omverwerpen, en u uw kleren uittrekken, en uw sierlijke juwelen nemen, en u naakt en bloot achterlaten.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Ex 16:5": "En het zal gebeuren op de zesde dag, dat zij klaarmaken wat zij ingebracht zullen hebben; dat zal dubbel zijn boven wat zij dagelijks verzamelen.", "Ps 137:7": "HEERE! Gedenkt aan de kinderen van Edom, aan de dag van Jeruzalem; die zeiden: Maak het met de grond gelijk, maak het met de grond gelijk, tot aan haar fundament toe!", "Ef 6:9": "En u heren, doe hetzelfde bij hen, en laat het dreigen achterwege; als iemand die weet dat ook uw eigen Heere in de hemelen is, en dat er geen aanneming van het persoon bij Hem is.", "Hebr 4:9": "Er blijft dan een rust over voor het volk van God.", "Jer 5:3-9": "HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren. Toch zei ik: Zeker, dit zijn de armen; zij handelen dwaas, omdat zij de weg van de HEERE, het recht van hun God, niet kennen. Ik zal naar de groten gaan, en met hen spreken, want die kennen de weg van de HEERE, het recht van hun God; maar zij hadden samen het juk verbroken, en de banden verscheurd.", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Lev 26:13": "Ik ben de HEERE, uw God, Die u uit het land van de Egyptenaren uitgevoerd heeft, opdat u hun slaven niet zou zijn; en Ik heb de disselbomen van uw juk verbroken, en heb u rechtop laten staan.", "Ps 106:7": "Onze vaders in Egypte hebben niet gelet op Uw wonderen; zij zijn de veelheid van Uw goedertierenheid niet gedachtig geweest; maar zij waren opstandig aan de zee, bij de Schelfzee.", "Ezech 11:2": "En Hij zei tegen mij: Mensenkind, dit zijn de mannen die onrecht bedenken, en die slechte raad geven in deze stad.", "Dan 9:5": "Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Ps 60:3-5": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Deut 11:30": "Zijn zij niet aan de overkant van de Jordaan, achter de weg van de ondergang van de zon, in het land van de Kanaänieten, die in het vlakke veld wonen, tegenover Gilgal, bij de eikenbossen van More?", "Ps 7:9": "De HEERE zal de volken recht doen; doe mij recht, HEERE, naar mijn gerechtigheid, en naar mijn oprechtheid, die bij mij is.", "Job 36:8-10": "En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben; En Hij opent hun oor voor de tucht, en zegt dat zij zich van de ongerechtigheid moeten bekeren.", "Ps 18:5-7": "Banden van de dood hadden mij omvangen, en beken van Belial verschrikten mij. Banden van het graf omringden mij, strikken van de dood bejegenden mij. Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; Hij hoorde mijn stem uit Zijn paleis, en mijn geroep voor Zijn aangezicht kwam in Zijn oren.", "Ex 14:12": "Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "Amos 7:16": "Nu dan, hoor het woord van de HEERE: U zegt: U zult niet profeteren tegen Israël, en niets uitspreken tegen het huis van Izak.", "1 Kor 11:32": "Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.", "Ps 55:10": "Verslind hen, Heere! verdeel hun tong; want ik zie geweld en twist in de stad.", "Klaagl 2:1-7": "Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn. Beth. De Heere heeft al de woningen van Jakob verslonden, en heeft ze niet verschoond; Hij heeft de vestingen van de dochter van Juda afgebroken in Zijn verbolgenheid, Hij heeft gemaakt dat zij de aarde raken; Hij heeft het koninkrijk en zijn vorsten ontheiligd. Gimel. Hij heeft, in ontsteking van de toorn, de gehele hoorn van Israël afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, dat rondom verteert.", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Ps 74:19": "Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig.", "1 Kon 8:22": "En Salomo stond voor het altaar van de HEERE, tegenover de hele gemeente van Israël, en breidde zijn handen uit naar de hemel;", "2 Kor 6:4-10": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten, in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "Ps 55:5-9": "Mijn hart doet mij pijn in mijn binnenste, en verschrikkingen van de dood zijn op mij gevallen. Vrees en beving komen over mij, en gruwen overdekt mij; Zodat ik zeg: Och, kreeg ik maar vleugels als een duif! ik zou wegvliegen, waar ik blijven mocht.", "Jer 50:23": "Hoe is de hamer van de hele aarde zo afgehouwen en verbroken! Hoe is Babel geworden tot een ontzetting onder de heidenvolken.", "Luk 19:14": "Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Mark 2:27": "En Hij zei tegen hen: De sabbat is gemaakt om de mens, niet de mens om de sabbat.", "Ex 23:12": "Zes dagen zult u uw werk doen; maar op de zevende dag zult u rusten; opdat uw os en uw ezel rusten, en de zoon van uw dienstmaagd en de vreemdeling op adem komen.", "Ps 55:21": "Hij slaat zijn handen aan hen die vrede met Hem hadden; hij ontheiligt Zijn verbond.", "2 Kron 30:10": "Zo trokken de boodschappers van stad tot stad, door het land van Efraïm en Manasse, tot Zebulon toe; maar zij lachten hen uit, en bespotten hen.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Hand 17:2": "En Paulus ging, zoals hij gewoon was, bij hen naar binnen, en drie sabbatten lang sprak hij met hen uit de Schriften,", "2 Sam 12:23": "Maar nu is het dood, waarom zou ik nu vasten? Zal ik het nog kunnen terughalen? Ik zal wel naar hem toe gaan, maar hij zal niet naar mij terugkomen.", "Ps 35:25": "Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!", "Joh 7:19": "Heeft Mozes u niet de wet gegeven? En niemand van u doet de wet. Waarom probeert u Mij te doden?", "Klaagl 1:5-8": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander. Vau. En van de dochter van Sion is al haar sieraad weggegaan; haar vorsten zijn als de herten, die geen weide vinden, en zij gaan krachteloos heen voor het aangezicht van de vervolger. Zain. Jeruzalem is, in de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.", "Joël 1:8-13": "Kerm, als een jonkvrouw, die met een zak omgord is vanwege de man van haar jeugd. Spijsoffer en drankoffer is van het huis van de HEERE afgesneden; de priesters, dienaars van de HEERE, treuren. Het veld is verwoest, het land treurt; want het koren is verwoest, de most is verdroogd, de olie is uitgeput.", "Hand 10:34": "En Petrus opende zijn mond en zei: Ik merk in waarheid dat God niet iemand aanneemt op grond van het persoon;", "Jes 52:6": "Daarom zal Mijn volk, daarom zal het Mijn Naam op die dag kennen, dat Ik het Zelf ben, Die spreekt: Zie, hier ben Ik.", "Klaagl 2:1": "Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.", "2 Sam 22:25-27": "Zo gaf de HEERE mij weer naar mijn gerechtigheid, naar mijn reinheid, voor Zijn ogen. Bij de goedertierene houdt U Zich goedertieren; bij de oprechte held houdt U Zich oprecht. Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "Spr 13:12": "De uitgestelde hoop maakt het hart ziek; maar de begeerte die komt, is een boom des levens.", "Ezra 9:7": "Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag.", "Klaagl 3:1-36": "Aleph. Ik ben de man die ellende gezien heeft door de roede van Zijn verbolgenheid. Aleph. Hij heeft mij geleid en gevoerd in de duisternis, en niet in het licht. Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Lev 5:5": "Het zal dan gebeuren, als hij aan een van die dingen schuldig is, dat hij zal belijden waarin hij gezondigd heeft;", "Job 7:20": "Heb ik gezondigd, wat zal ik U doen, o Mensenhoeder? Waarom hebt U mij tot een mikpunt voor Uzelf gesteld, dat ik mijzelf tot een last ben?", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "Ezech 5:12": "Een derde deel van u zal door de pest sterven, en zal door honger in het midden van u omkomen; en een derde deel zal door het zwaard vallen rondom u; en een derde deel zal Ik naar alle windrichtingen verstrooien, en Ik zal het zwaard achter hen uittrekken.", "Ps 116:4": "Maar ik riep de Naam van de HEERE aan: Och HEERE, bevrijd mijn ziel.", "Ps 55:13-15": "Want het is geen vijand die mij hoont, anders zou ik het hebben gedragen; het is mijn hater niet die zich tegen mij groot maakt, anders zou ik mij voor hem verborgen hebben. Maar u bent het, o mens, als van mijn eigen stand, mijn leidsman en mijn bekende! Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Jes 28:21": "Want de HEERE zal Zich opmaken, zoals op de berg Perazim, Hij zal beroerd zijn, zoals in het dal van Gibeon, om Zijn werk te doen, Zijn werk zal vreemd zijn; en om Zijn daad te doen, Zijn daad zal vreemd zijn!", "Joz 8:34": "En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat.", "Jer 13:26": "Zo zal Ik ook uw zomen ontbloten tot boven uw gezicht, en uw schande zal gezien worden.", "Neh 10:31": "Ook als de volken van het land waren en alle koren op de sabbatdag ten verkoop zouden brengen, dat wij op de sabbat, of op een andere heilige dag, niets van hen zouden nemen; en dat wij het zevende jaar zouden vrij laten, alsook allerlei bezwaarnis.", "Ps 102:4-6": "Want mijn dagen zijn vergaan als rook, en mijn beenderen zijn uitgebrand als een haard. Mijn hart is geslagen en verdord als gras, zodat ik vergeten heb mijn brood te eten. Mijn beenderen kleven aan mijn vlees, vanwege de stem van het zuchten.", "Jes 37:23": "Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "Luk 19:44": "en zij zullen u tot de grond toe neerwerpen, en uw kinderen in u; en zij zullen in u geen steen op de andere steen laten liggen, omdat u de tijd waarin u bezocht werd niet hebt herkend.", "Hos 2:13": "Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken.", "Jes 63:18": "Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden.", "Jes 40:9": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God!", "Jer 46:1": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurd is tegen de heidenen.", "Rom 5:3-5": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt; En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop; En de hoop beschaamt niet, omdat de liefde van God in onze harten uitgestort is door de Heilige Geest, Die ons gegeven is.", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "Deut 4:24": "Want de HEERE, uw God, is een verterend vuur, een na-ijverig God.", "Num 28:10": "Het is het brandoffer van de sabbat op elke sabbat, boven het voortdurende brandoffer, en zijn drankoffer.", "Jer 28:2": "Zo spreekt de HEERE van de heerscharen, de God van Israël, en zegt: Ik heb het juk van de koning van Babel verbroken.", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Job 6:15": "Mijn broeders hebben trouweloos gehandeld als een beek; als de storting der beken gaan zij door;", "Jes 32:5": "De dwaas zal niet meer milddadig genoemd worden, en de gierige zal niet meer mild geheten worden.", "Jer 34:22": "Zie, Ik zal bevel geven, spreekt de HEERE, en zal hen weer naar deze stad terugbrengen, en zij zullen tegen haar strijden, en zullen ze innemen, en zullen ze met vuur verbranden; en Ik zal de steden van Juda stellen tot een verwoesting, zodat er niemand in woont.", "2 Kon 15:5": "En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.", "Ps 80:15": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,", "1 Kon 8:10": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.", "Zef 3:14-17": "Zing vrolijk, dochter van Sion, juich, Israël; wees blij, en spring op van vreugde met heel uw hart, dochter van Jeruzalem! De HEERE heeft uw oordelen weggenomen, Hij heeft uw vijand weggevaagd; de Koning van Israël, de HEERE, is in uw midden, u zult geen kwaad meer zien. Op die dag zal tegen Jeruzalem gezegd worden: Vrees niet, o Sion! Laat uw handen niet slap worden.", "Ps 96:13": "Voor het aangezicht van de HEERE; want Hij komt, want Hij komt, om de aarde te oordelen; Hij zal de wereld oordelen met gerechtigheid, en de volken met Zijn waarheid.", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Spr 5:22": "De goddeloze zullen zijn eigen ongerechtigheden vangen, en met de banden van zijn zonden zal hij vastgehouden worden.", "Matt 24:20": "Bid dat uw vlucht niet gebeurt in de winter, en ook niet op een sabbat.", "Jes 45:10": "Wee hem die tegen zijn vader zegt: Wat verwekt u? en tegen de vrouw: Wat baart u?", "Ezech 36:2": "Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden!", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Spr 21:27": "Het offer van de goddelozen is een gruwel; hoeveel te meer, als zij het met een schandelijk voornemen brengen!", "2 Kon 25:21": "En de koning van Babel sloeg hen, en doodde hen te Ribla, in het land van Hamath. Zo werd Juda uit zijn land gevankelijk weggevoerd.", "Jes 30:18": "En daarom zal de HEERE wachten, opdat Hij u genadig is, en daarom zal Hij verhoogd worden, opdat Hij Zich over u ontfermt, want de HEERE is een God van het gericht; gelukkig zijn zij allen die Hem verwachten.", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Ezech 20:13": "Maar het huis van Israël werd opstandig tegen Mij in de woestijn; zij wandelden niet in Mijn inzettingen, en verwierpen Mijn rechten, die, als een mens ze doet, hij daardoor zal leven; en zij ontheiligden Mijn sabbatten zeer, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten in de woestijn, om hen te verdelgen.", "Ezech 5:5-8": "Zo zegt de Heere HEERE: Dit is Jeruzalem, die Ik in het midden van de heidenvolken gezet heb, met landen rondom haar heen. Toch heeft zij Mijn rechten veranderd in goddeloosheid, erger dan de heidenvolken, en Mijn inzettingen erger dan de landen die rondom haar zijn; want zij hebben Mijn rechten verworpen, en in Mijn inzettingen hebben zij niet gewandeld. Daarom zegt de Heere HEERE zo: Omdat u meer gedaan hebt dan de heidenvolken die rondom u zijn, in Mijn inzettingen niet gewandeld hebt, en Mijn rechten niet gedaan hebt, ja zelfs naar de rechten van de heidenvolken die rondom u zijn niet gedaan hebt;", "Mark 3:22": "En de Schriftgeleerden die van Jeruzalem gekomen waren, zeiden: Hij heeft Beëlzebul, en door de leider van de duivels drijft Hij de duivels uit.", "Ps 43:1": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht.", "2 Tim 4:15": "Wees ook u voor hem op uw hoede, want hij heeft onze woorden sterk tegengestaan.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Est 4:16": "Ga, verzamel alle Joden die te Susan gevonden worden, en vast voor mij, en eet of drink niet, drie dagen lang, nacht noch dag; ik en mijn jonge dochters zullen ook zo vasten, en zo zal ik tot de koning ingaan, wat niet naar de wet is. Wanneer ik dan omkom, dan kom ik om.", "Jer 50:15": "Juich over haar rondom, zij heeft haar hand gegeven; haar fundamenten zijn gevallen, haar muren zijn afgebroken; want dat is de wraak van de HEERE, wreek u aan haar, doe haar zoals zij gedaan heeft!", "Ezech 33:30-32": "En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt. En zij komen tot u, zoals het volk gewoon is te komen, en zitten voor uw aangezicht als Mijn volk, en horen uw woorden, maar zij doen ze niet; want zij spreken lieve woorden met hun mond, maar hun hart gaat hun hebzucht na. En zie, u bent voor hen als een liefdeslied, als iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.", "Pred 2:22": "Wat heeft die mens toch van al zijn arbeid en van de kwellingen van zijn hart, waarmee hij zich aftobt onder de zon?", "Job 8:13-15": "Zo zijn de wegen van allen die God vergeten; en de verwachting van de huichelaar zal vergaan. Van wie zijn hoop walgen zal; en zijn vertrouwen zal zijn als het huis van een spin. Hij zal op zijn huis leunen, maar het zal niet bestaan; hij zal zich eraan vasthouden, maar het zal niet staande blijven.", "Job 31:33": "Als ik, net als Adam, mijn overtredingen bedekt heb, door eigenliefde mijn misdaad verbergende!", "2 Kron 26:9": "Daartoe bouwde Uzzia torens te Jeruzalem, bij de Hoekpoort en bij de Dalpoort, en bij de hoeken, en hij versterkte ze.", "Job 30:1": "Maar nu lachen zij die jonger zijn dan ik, om mij, van wie ik hun vaderen versmaad zou hebben, om ze bij de honden van mijn kudde te zetten.", "Job 39:37": "Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.", "Ezech 25:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Ps 69:25": "Stort over hen Uw gramschap uit; en de gloed van Uw toorn grijpt hen aan.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Klaagl 5:12-16": "De vorsten zijn door hun hand opgehangen; de gezichten van de oudsten zijn niet geëerd geweest. Zij hebben de jongemannen weggenomen om te malen, en de jongens struikelden onder het hout. De oudsten houden op met zitten in de poort, de jongemannen met hun snarenspel.", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Rom 2:2": "En wij weten dat het oordeel van God naar waarheid is, over hen die zulke dingen doen.", "2 Kron 30:6-10": "De boodschappers dan gingen weg met de brieven uit de hand van de koning en zijn leiders, door heel Israël en Juda, en naar het bevel van de koning, en zeiden: Kinderen van Israël, bekeer u tot de HEERE, de God van Abraham, Izak en Israël, dan zal Hij Zich keren naar wie ontkomen waren, die voor u overgebleven zijn uit de hand van de koningen van Assyrië. En wees niet als uw vaders en als uw broeders, die tegen de HEERE, de God van hun vaderen, ontrouw geweest zijn; daarom heeft Hij hen overgegeven tot verwoesting, zoals u ziet. Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "Jes 57:16-18": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb. Ik was toornig over de ongerechtigheid van zijn hebzucht, en sloeg hem; Ik verborg Mij, en was toornig; toch ging hij afkerig zijn eigen weg, de weg van zijn hart. Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.", "Ps 99:4": "En de sterkte van de Koning, die het recht liefheeft. U hebt wat recht is bevestigd, U hebt recht en gerechtigheid gedaan in Jakob.", "Jer 44:21": "Het roken dat u in de steden van Juda en in de straten van Jeruzalem gerookt hebt, u en uw vaderen, uw koningen en uw vorsten, en het volk van het land, heeft de HEERE daar niet aan gedacht, en is dat niet in Zijn hart opgekomen?", "Num 31:17": "Nu dan, dood alles wat mannelijk is onder de kinderen; en dood elke vrouw die door gemeenschap met een man, een man heeft gekend.", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Job 10:9": "Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.", "Matt 6:5": "En wanneer u bidt, wees dan niet zoals de geveinsden; want die bidden graag terwijl ze in de synagogen en op de hoeken van de straten staan, opdat zij door de mensen gezien worden. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben.", "Jer 52:7": "Toen werd de stad doorgebroken, en al de krijgslieden vluchtten, en trokken 's nachts uit de stad, door de weg van de poort tussen de twee muren, die bij de hof van de koning waren (de Chaldeeën nu waren tegen de stad rondom), en zij gingen door de weg van het vlakke veld.", "Klaagl 1:3-5": "Gimel. Juda is in gevangenschap gegaan vanwege de ellende, en vanwege de veelheid van de dienstbaarheid; zij woont onder de heidenen, zij vindt geen rust; al haar vervolgers achterhalen haar tussen de engten. Daleth. De wegen van Sion treuren, omdat niemand op het feest komt; al haar poorten zijn woest, haar priesters zuchten: haar jonkvrouwen zijn bedroefd, en zij zelf is in bitterheid. He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander.", "2 Kron 32:15-19": "Laat Jehizkia u dan nu niet bedriegen, en laat hij u op deze manier niet opruien, en geloof hem niet; want geen god van enig volk en koninkrijk heeft zijn volk kunnen redden uit mijn hand en de hand van mijn vaderen; hoeveel te minder zal uw God u kunnen redden uit mijn hand? Daarbij spraken zijn dienaren nog meer tegen God, de HEERE, en tegen Zijn dienaar Jehizkia. Ook schreef hij brieven, om de HEERE, de God van Israël, te honen en om tegen Hem te spreken, en zei: Zoals de goden van de volken van de landen hun volk niet gered hebben uit mijn hand, zo zal de God van Jehizkia Zijn volk niet redden uit mijn hand.", "Jer 12:3": "Maar U, HEERE, kent mij, U ziet mij, en proeft mijn hart, dat het met U is. Ruk hen uit als schapen ter slachting, en heilig hen tot de dag van de doding.", "Klaagl 2:19-21": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten. Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden? Schin. De jongen en de ouden liggen op de aarde op de straten; mijn jonkvrouwen en mijn jongelingen zijn door het zwaard gevallen; Gij hebt ze gedood in de dag van Uw toorn, Gij hebt ze geslacht en niet verschoond.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Jes 9:13": "Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag.", "Job 23:10": "Toch kent Hij de weg die bij mij is; Hij beproeft mij; als goud zal ik uitkomen.", "Jes 9:12": "Want dit volk keert zich niet tot Hem, Die het slaat, en de HEERE van de heerscharen zoeken zij niet.", "Jer 49:14": "Ik heb een gerucht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken, om te zeggen: Verzamel u, en kom aan tegen haar, en maak u op ten strijde.", "Ps 13:2-5": "Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen? Hoe lang zal ik plannen maken in mijn ziel, verdriet in mijn hart bij dag? Hoe lang zal mijn vijand boven mij verheven zijn? Kijk naar mij, verhoor mij, HEERE, mijn God; verlicht mijn ogen, zodat ik niet in de dood ontslaap;", "Openb 6:16": "En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "Ezech 8:17": "Toen zei Hij tegen mij: Hebt u, mensenkind, dat gezien? Is het iets gerings voor het huis van Juda om deze gruwelen te doen, die zij hier doen? Terwijl zij het land met geweld vervuld hebben, keren zij zich om, om Mij te vertoornen; want zie, zij houden de wijnrank aan hun neus.", "Gen 18:25": "Het zij verre van U, zoiets te doen, de rechtvaardige te doden met de goddeloze! zodat de rechtvaardige zou zijn als de goddeloze, verre zij het van U! zou de Rechter van de hele aarde geen recht doen?", "Ps 82:8": "Sta op, o God! Oordeel het aardrijk, want U bezit alle naties.", "Gen 32:11": "Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "Jes 1:27": "Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Dan 9:9-16": "Bij de Heere, onze God, zijn de barmhartigheden en vergevingen, hoewel wij tegen Hem gerebelleerd hebben. En wij hebben naar de stem van de HEERE, onze God, niet geluisterd, om in Zijn wetten te wandelen, die Hij ons gegeven heeft door de hand van Zijn knechten, de profeten. Maar heel Israël heeft Uw wet overtreden, door af te wijken, zodat zij Uw stem niet gehoorzaamden; daarom is over ons uitgestort die vloek en die eed, die geschreven is in de wet van Mozes, de knecht van God, omdat wij tegen Hem gezondigd hebben.", "Ezech 23:29": "Die zullen met u handelen uit haat, en al uw arbeid wegnemen, en u naakt en bloot laten liggen, zodat de schaamte van uw hoererijen ontdekt wordt, alsook uw schandelijkheid en uw hoererijen.", "Mark 12:38-40": "En Hij zei tegen hen in Zijn onderwijs: Pas op voor de Schriftgeleerden, die graag in lange kleren willen rondlopen, en gegroet willen worden op de markten; en de voorste plaatsen willen hebben in de synagogen, en de ereplaatsen bij de maaltijden; die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Deut 28:53-57": "En u zult de vrucht van uw schoot eten, het vlees van uw zonen en van uw dochters, die de HEERE, uw God, u gegeven zal hebben; in de belegering en in de benauwdheid waarmee uw vijanden u zullen benauwen. Wat betreft de man die teder onder u is, en die zeer verwend geweest is, zijn oog zal boosaardig zijn tegen zijn broeder, en tegen de vrouw van zijn schoot, en tegen zijn overige zonen die hij overgehouden zal hebben; Zodat hij aan niemand van hen iets zal geven van het vlees van zijn zonen die hij eet, omdat hij voor zichzelf niets heeft overgehouden; in de belegering en in de benauwdheid waarmee uw vijand u in al uw poorten zal benauwen.", "Jer 9:10": "Ik zal een geween en een klaagzang aanheffen over de bergen, en een klaaglied over de herdershutten van de woestijn; want zij zijn afgebrand, zodat er niemand doorgaat, en men hoort er geen stem van vee; van de vogels van de hemel tot de dieren toe zijn zij weggevlucht, weggegaan!", "Fil 3:2": "Let op de honden, let op de kwade arbeiders, let op de versnijding.", "2 Kon 19:16": "HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.", "Joël 1:19": "Tot U, HEERE, roep ik; want een vuur heeft de weiden van de woestijn verteerd, en een vlam heeft alle bomen van het veld aangestoken.", "Ezech 26:16": "En alle vorsten van de zee zullen afdalen van hun tronen, en hun mantels van zich doen, en hun gestikte klederen uittrekken; met sidderingen zullen zij bekleed worden, op de aarde zullen zij neerzitten, en elk ogenblik sidderen, en over u ontzet zijn;", "1 Petr 1:6": "Daarin verheugt u zich, ook al bent u nu, voor een korte tijd (als het nodig is), bedroefd door allerlei beproevingen,", "Job 34:17": "Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen?", "Ps 143:4": "Daarom wordt mijn geest overstelpt in mij, mijn hart is verbaasd in het midden van mij.", "Lev 26:40-42": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Job 31:13-15": "Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij; (Want wat zou ik doen, als God opstond? En als Hij bezoeking deed, wat zou ik Hem antwoorden? Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Mark 13:14": "Wanneer u dan de gruwel van de verwoesting zult zien, waarvan door de profeet Daniël gesproken is, staande waar het niet behoort (wie dit leest, laat hij daarop letten!), laten dan zij die in Judea zijn, vluchten naar de bergen.", "Ps 135:14": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.", "Ezech 22:2-15": "En u, mensenkind, zou u de bloedstad recht geven? Zou u haar recht geven? Ja, maak haar al haar gruwelen bekend. En zeg: Zo zegt de Heere HEERE: O stad, die in haar midden bloed vergiet, zodat haar tijd komt, en die drekgoden tegen zichzelf maakt om zich te verontreinigen! Door uw bloed dat u vergoten hebt, bent u schuldig geworden, en met uw drekgoden die u gemaakt hebt, hebt u zich verontreinigd, en hebt u uw dagen doen naderen en bent u tot uw jaren gekomen; daarom heb Ik u aan de heidenvolken overgegeven tot een smaad, en aan alle landen tot een spot.", "Jer 2:20": "Toen Ik van oude tijden af uw juk verbroken, en uw banden verscheurd had, zei u: Ik zal niet dienen; maar op alle hoge heuvels en onder elke groene boom loopt u om, hoererend.", "Jes 22:2": "U, die vol was van groot rumoer, u woelige stad, u, vrolijk huppelende stad, uw gesneuvelden zijn niet gesneuveld door het zwaard, en ook niet gestorven in de strijd.", "Matt 22:12": "En hij zei tegen hem: Vriend! Hoe bent u hier binnengekomen zonder een bruiloftskleed aan te hebben? En hij verstomde.", "Jes 37:17": "O HEERE, neig Uw oor en hoor; HEERE, doe Uw ogen open en zie; en hoor al de woorden van Sanherib, die gezonden heeft om de levende God te honen.", "Neh 9:34": "En onze koningen, onze vorsten, onze priesters en onze vaders hebben Uw wet niet gedaan; en zij hebben niet geluisterd naar Uw geboden, en naar Uw getuigenissen, waarmee U tegen hen getuigde.", "Ezech 4:15-17": "En Hij zei tegen mij: Zie, Ik heb u koeienmest gegeven in plaats van mensendrek, zo zult u uw brood daarmee bereiden. Daarna zei Hij tegen mij: Mensenkind, zie, Ik breek de staf van het brood in Jeruzalem, en zij zullen het brood met gewicht en met kommer eten, en het water met een bepaalde maat en met verbaasdheid drinken; Opdat zij gebrek hebben aan brood en water, en de een met de ander verbaasd worden, en in hun ongerechtigheid wegkwijnen.", "Jes 61:8": "Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.", "Ex 16:7": "En morgen zult u de heerlijkheid van de HEERE zien, omdat Hij uw gemor tegen de HEERE gehoord heeft; want wat zijn wij, dat u tegen ons mort?", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Ezech 11:23": "En de heerlijkheid van de HEERE steeg op van het midden van de stad, en bleef staan op de berg die ten oosten van de stad is.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Klaagl 2:13": "Mem. Wat getuigen zal ik u brengen, wat zal ik bij u vergelijken, u dochter van Jeruzalem? Wat zal ik bij u vergelijken, dat ik u zou troosten, u jonkvrouw, dochter van Sion, want uw breuk is zo groot als de zee, wie kan u helen?", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Ps 17:6-9": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden. Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan! Bewaar mij als het zwart van de oogappel, verberg mij onder de schaduw van Uw vleugels,", "Ps 119:137": "Tsade. HEERE! U bent rechtvaardig, en elk van Uw oordelen is recht.", "Ps 80:6": "U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.", "Ps 108:7": "Opdat Uw beminden bevrijd worden; geef heil door Uw rechterhand, en verhoor ons.", "Job 34:33": "Zal het van u zijn, hoe Hij iets vergelden zal, omdat u Hem versmaadt? Zou u dan verkiezen, en niet ik? Wat weet u dan? Spreek.", "Jes 48:2": "Ja, van de heilige stad worden zij genoemd, en zij steunen op de God van Israël; HEERE van de heerscharen is Zijn Naam.", "Kol 3:12": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld;", "Ps 38:4": "Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Ps 64:3": "Verberg mij voor de heimelijke afspraken van de boosdoeners, voor het oproer van de werkers van ongerechtigheid.", "Jer 4:19-29": "O mijn binnenste, mijn binnenste! ik heb weeën, o wanden van mijn hart! Mijn hart maakt getier in mij, ik kan niet zwijgen; want u, mijn ziel! hoort het geluid van de bazuin en het krijgsgeschreeuw. Ondergang op ondergang wordt uitgeroepen; want het hele land is verwoest; haastig zijn mijn tenten verwoest, mijn gordijnen in een ogenblik! Hoe lang zal ik de banier zien, het geluid van de bazuin horen?", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "Ps 143:2": "En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn.", "Klaagl 3:42": "Nun. Wij hebben overtreden, en wij zijn opstandig geweest, daarom hebt U niet gespaard.", "Num 23:7": "Toen begon hij zijn spreuk, en zei: Uit Syrië heeft Balak, de koning van de Moabieten, mij laten halen, van het gebergte in het oosten, en zei: Kom, vervloek Jakob voor mij, en kom, scheld Israël uit!", "Klaagl 2:19": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "Job 20:4-18": "Weet u dit niet? Van oudsher af, van toen God de mens op de wereld gezet heeft, Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken;", "Matt 3:8": "Breng dan vruchten voort die bij de bekering passen.", "Ps 118:18": "De HEERE heeft mij wel hard gekastijd; maar Hij heeft mij niet ter dood overgegeven.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "Deut 31:17": "Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is?", "Ps 61:2": "O God! hoor mijn geschrei, merk op mijn gebed.", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "2 Kon 20:19": "Maar Hizkia zei tegen Jesaja: Het woord van de HEERE, dat u gesproken hebt, is goed. Ook zei hij: Zou het niet goed zijn, als er vrede en waarheid in mijn dagen zal zijn?", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "Klaagl 2:11": "Caph. Mijn ogen zijn verteerd door tranen, mijn ingewand wordt beroerd; mijn lever is ter aarde uitgeschud, vanwege de breuk van de dochter van mijn volk; omdat het kind en de zuigeling op de straten van de stad in onmacht zinken;", "1 Joh 2:4": "Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;", "Micha 6:9": "De stem van de HEERE roept tot de stad (want Uw Naam ziet het wezen): Hoor de roede, en wie haar besteld heeft!", "Ps 140:11": "Vurige kolen moeten op hen geschud worden; Hij doet hen vallen in het vuur, in diepe kuilen, zodat zij niet meer opstaan.", "Jer 6:28": "Zij zijn allen de ergste afvalligen; zij wandelen in achterklap; zij zijn koper en ijzer; zij zijn allemaal verdervers.", "Num 31:18": "Maar laat al de kinderen van vrouwelijk geslacht, die geen gemeenschap met een man hebben gehad, voor u leven.", "Gen 3:16": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen.", "Job 15:33": "Men zal zijn onrijpe druiven afrukken, als van een wijnstok, en zijn bloeisel afwerpen, als van een olijfboom.", "Ezech 20:39": "En u, o huis van Israël, zo zegt de Heere HEERE: Gaat heen, dient ieder zijn drekgoden, ook hierna, omdat u naar Mij niet wilt horen; maar ontheiligt niet meer Mijn heilige Naam, met uw giften en met uw drekgoden.", "Gen 3:1": "De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof?", "Num 23:8": "Wat zal ik vervloeken, wie God niet vervloekt; en wat zal ik uitschelden, wie de HEERE niet uitscheldt?", "Spr 29:13": "De arme en de bedrieger ontmoeten elkaar; de HEERE verlicht hun beider ogen.", "Spr 12:25": "Bekommernis in het hart van de mens buigt het neer; maar een goed woord verblijdt het.", "Ps 119:76": "Laat toch Uw goedertierenheid zijn om mij te troosten, naar Uw toezegging aan Uw knecht.", "Jer 48:45": "Zij die voor de macht van de vijand vluchtten, bleven staan in de schaduw van Hesbon; maar een vuur is uitgegaan van Hesbon, en een vlam van tussen Sihon, en heeft de hoeken van Moab en de schedel van de kinderen van het rumoer verteerd.", "Deut 32:25": "Van buiten zal het zwaard beroven, en uit de binnenkamers de verschrikking; ook de jongeling, ook de jonge dochter, het zuigende kind met de grijze man.", "2 Kon 24:15": "Zo voerde hij Jojachin weg naar Babel, alsook de moeder van de koning, en de vrouwen van de koning, en zijn hovelingen; daartoe bracht hij de machtigen van het land gevangen van Jeruzalem naar Babel;", "Job 33:11": "Hij legt mijn voeten in de stok; Hij neemt al mijn paden waar.", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "Ps 64:2": "Hoor, o God, mijn stem in mijn geklaag; behoed mijn leven voor de schrik van de vijand.", "Spr 14:6": "De spotter zoekt wijsheid, en vindt niets; maar de kennis is voor de verstandige licht.", "Ef 3:13": "Daarom bid ik dat u niet moedeloos wordt door mijn verdrukkingen voor u, wat uw heerlijkheid is.", "Ezech 20:12": "Daarbij gaf Ik hun ook Mijn sabbatten, om een teken te zijn tussen Mij en hen, opdat zij zouden weten dat Ik de HEERE ben, Die hen heiligt.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Ezech 6:10": "En zij zullen weten dat Ik de HEERE ben; Ik heb niet zonder reden gesproken over het aandoen van dit kwaad aan hen.", "Matt 12:1-8": "In die tijd ging Jezus, op een sabbatdag, door het gezaaide land, en Zijn discipelen kregen honger, en begonnen aren te plukken en te eten. En de Farizeeën zagen dat en zeiden tegen Hem: Kijk, Uw discipelen doen wat niet geoorloofd is te doen op de sabbat. Maar Hij zei tegen hen: Hebt u niet gelezen wat David deed, toen hij honger had, en zij die bij hem waren?", "Ps 35:23": "Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.", "Ps 74:23": "Vergeet het geroep van Uw tegenstanders niet; het rumoer van hen die tegen U opstaan, klimt voortdurend op.", "Jak 1:8": "Een dubbelhartig man is onstandvastig in al zijn wegen.", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "Ps 6:11": "Al mijn vijanden zullen zeer beschaamd en verbaasd worden; zij zullen terugkeren, zij zullen in een ogenblik beschaamd worden.", "Ps 88:4-19": "Want mijn ziel is verzadigd van tegenspoed, en mijn leven raakt tot aan het graf. Ik word gerekend bij hen die in de kuil neerdalen; ik ben geworden als een man die geen kracht heeft; Afgezonderd onder de doden, zoals de verslagenen die in het graf liggen, die U niet meer gedenkt, en zij zijn afgesneden van Uw hand.", "Mal 1:6-14": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam? U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk. Want als u iets blinds aanbrengt om te offeren, is dat bij u niet kwaad; en als u iets kreupels of iets kranks aanbrengt, is dat niet kwaad! Breng dat toch aan uw vorst; zal hij welgevallen aan u hebben? of zal hij u gunstig ontvangen? zegt de HEERE van de heerscharen.", "Deut 28:65-67": "Daarbij zult u onder die volken geen rust vinden, en uw voetzool zal geen rust hebben; want de HEERE zal u daar een bevend hart geven, en bezwijking van de ogen, en kwelling van de ziel. En uw leven zal voor u onzeker hangen; en u zult nacht en dag angst hebben, en u zult niet zeker zijn van uw leven. Des morgens zult u zeggen: Was het maar avond; en des avonds zult u zeggen: Was het maar morgen; vanwege de schrik van uw hart, waarmee u geschrokken zult zijn, en vanwege wat uw ogen te zien krijgen.", "2 Sam 16:12": "Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "Jer 44:22": "Zodat de HEERE het niet meer kon verdragen, vanwege de slechtheid van uw handelingen, vanwege de gruwelen die u deed; daarom is uw land geworden tot een woestheid, en tot ontzetting, en tot een vloek, zodat er niemand in woont, zoals het is op deze dag;", "Klaagl 5:19-22": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht. Waarom zou U ons voor altijd vergeten? Waarom zou U ons zo lange tijd verlaten? HEERE, bekeer ons tot U, dan zullen wij bekeerd zijn; vernieuw onze dagen als vanouds.", "Ps 79:5": "Hoe lang, HEERE? Zult U eeuwig toornen? Zal Uw ijver als vuur branden?", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Ps 86:1-17": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig. Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt. Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Gen 35:29": "En Izak gaf de geest en stierf, en werd verzameld tot zijn volken, oud en verzadigd van dagen; en zijn zonen Ezau en Jakob begroeven hem.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "Ps 51:3-6": "Wees mij genadig, o God! naar Uw goedertierenheid; delg mijn overtreding uit, naar de grootheid van Uw barmhartigheden. Was mij goed van mijn ongerechtigheid, en reinig mij van mijn zonde. Want ik ken mijn overtredingen, en mijn zonde staat mij steeds voor ogen.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Hand 5:10": "En zij viel meteen neer voor zijn voeten, en gaf de geest. En de jongelingen kwamen binnen, vonden haar dood, en droegen haar uit, en begroeven haar bij haar man.", "Ps 96:9": "Aanbidt de HEERE in de heerlijkheid van het heiligdom; beeft voor Zijn aangezicht, heel de aarde.", "Jes 53:5": "Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "2 Kor 7:4": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking.", "Spr 21:11": "Als men de spotter straft, wordt de eenvoudige wijs; en als men de wijze onderricht, neemt hij kennis aan.", "Rom 2:1": "Daarom bent u niet te verontschuldigen, o mens, wie u ook bent die anderen oordeelt; want waarin u een ander oordeelt, veroordeelt u uzelf; want u, die anderen oordeelt, doet dezelfde dingen.", "Luk 4:23": "En Hij zei tegen hen: U zult zonder twijfel dit spreekwoord tegen Mij zeggen: Dokter, genees Uzelf; al wat wij gehoord hebben dat in Kapernaüm gebeurd is, doe dat ook hier in Uw vaderland.", "Jer 7:8-10": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Joh 18:11": "Jezus dan zei tegen Petrus: Steek uw zwaard in de schede. Zou Ik de drinkbeker die de Vader Mij gegeven heeft, niet drinken?", "Mark 2:28": "Zo is dan de Zoon des mensen ook Heere van de sabbat.", "Jer 5:2": "En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals.", "Zef 2:10": "Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "Luk 18:14": "Ik zeg u: deze ging gerechtvaardigd naar zijn huis, meer dan die ander; want ieder die zichzelf verhoogt, zal vernederd worden, en die zichzelf vernedert, zal verhoogd worden.", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "Ps 42:10": "Ik zal zeggen tot God: Mijn Steenrots! Waarom vergeet U mij? Waarom ga ik in het zwart, vanwege de onderdrukking van de vijand?", "Luk 12:2": "Er is niets bedekt, dat niet onthuld zal worden, en niets verborgen, dat niet bekend zal worden.", "Num 16:41": "Maar de volgende dag morde de hele vergadering van de kinderen van Israël tegen Mozes en tegen Aäron, en zei: U hebt het volk van de HEERE gedood!", "2 Kron 33:13": "En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.", "Jes 54:4": "Vrees niet, want u zult niet beschaamd worden, en word niet schaamrood, want u zult niet te schande worden; maar u zult de schaamte van uw jonkheid vergeten, en de smaad van het weduwschap zult u niet meer gedenken.", "Kol 2:16": "Laat dan niemand u oordelen over eten of drinken, of over een feestdag, nieuwe maan of sabbatten;", "Job 1:22": "In dit alles zondigde Job niet, en schreef God niets van het ongerijmd toe.", "Jer 9:21": "Want de dood is geklommen in onze vensters, hij is in onze paleizen gekomen, om de kinderen uit te roeien van de wijken, de jongemannen van de straten.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Lev 26:35": "Al de dagen van de verwoesting zal het rusten, omdat het niet rustte in uw sabbatten, toen u daarin woonde.", "Jes 47:1-15": "Daal af en ga zitten in het stof, jonkvrouw, dochter van Babel! Zit op de aarde, er is geen troon meer, dochter van de Chaldeeën! Want u zult niet meer genoemd worden de tedere, of de wellustige. Neem de molen en maal meel; ontdek uw vlechten, ontbloot de enkels, ontdek de schenkels, ga door de rivieren. Uw schaamte zal ontdekt worden, ook zal uw schande gezien worden; Ik zal wraak nemen, en Ik zal u niet aanvallen als een mens.", "Ps 129:5": "Laat hen beschaamd worden en achteruitgedreven, allen die Sion haten.", "Luk 13:26": "Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven.", "Ezech 32:32": "Want Ik heb ook Mijn schrik gegeven in het land van de levenden; daarom zal hij gelegd worden in het midden van de onbesnedenen bij de verslagenen van het zwaard, Farao en zijn hele menigte, spreekt de Heere HEERE.", "Num 5:5-7": "Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël: Wanneer een man of een vrouw iets van enige menselijke zonden gedaan zal hebben, door overtreding tegen de HEERE overtreden hebbend, dan is die ziel schuldig. En zij zullen hun zonde die zij gedaan hebben belijden; daarna zal hij zijn schuld weer uitkeren, naar de hoofdsom daarvan, en het vijfde deel daarvan zal hij daarboven toevoegen, en zal het geven aan degene aan wie hij zich schuldig gemaakt heeft.", "Ezech 30:17": "De jongemannen van Aven en Pibeseth zullen door het zwaard vallen, en de dochters zullen in de gevangenschap gaan.", "Jer 30:15": "Wat schreeuwt u over uw breuk, dat uw smart dodelijk is? Om de grootheid van uw ongerechtigheid, omdat uw zonden machtig veel zijn, heb Ik u deze dingen gedaan.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Mark 16:1": "En toen de sabbat voorbij was, hadden Maria Magdalena, en Maria, de moeder van Jakobus, en Salome specerijen gekocht, opdat zij zouden komen en Hem zalven.", "Ps 69:28": "Doe misdaad bij hun misdaad, en laat hen niet komen tot Uw gerechtigheid.", "Jes 9:3": "Want het juk van hun last, en de stok van hun schouders, en de staf van hem die hen dreef, hebt U verbroken, zoals op de dag van de Midianieten;", "Spr 26:23-26": "Brandende lippen en een kwaadaardig hart zijn als een potscherf overtrokken met een laagje zilverschuim. Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.", "Jes 62:11": "Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aa
