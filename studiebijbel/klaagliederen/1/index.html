l":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Aleph. Hoe zit die stad zo eenzaam, die vol volk was; zij is als een weduwe geworden, zij, die groot was onder de heidenen, een vorstin onder de landschappen, is cijnsbaar geworden.","2":"Beth. Zij weent steeds 's nachts, en haar tranen lopen over haar kaken; zij heeft geen trooster onder al haar liefhebbers; al haar vrienden hebben trouweloos met haar gehandeld, zij zijn haar tot vijanden geworden.","3":"Gimel. Juda is in gevangenschap gegaan vanwege de ellende, en vanwege de veelheid van de dienstbaarheid; zij woont onder de heidenen, zij vindt geen rust; al haar vervolgers achterhalen haar tussen de engten.","4":"Daleth. De wegen van Sion treuren, omdat niemand op het feest komt; al haar poorten zijn woest, haar priesters zuchten: haar jonkvrouwen zijn bedroefd, en zij zelf is in bitterheid.","5":"He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen *in* de gevangenschap voor het aangezicht van de tegenstander.","6":"Vau. En van de dochter van Sion is al haar sieraad weggegaan; haar vorsten zijn als de herten, *die* geen weide vinden, en zij gaan krachteloos heen voor het aangezicht van de vervolger.","7":"Zain. Jeruzalem is, *in* de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.","8":"Cheth. Jeruzalem heeft zwaar gezondigd, daarom is zij als een afgezonderde *vrouw* geworden; allen, die haar eerden, achten haar onwaard, omdat zij haar naaktheid gezien hebben; zij zucht ook, en zij is achterwaarts gekeerd.","9":"Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar einde, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot.","10":"Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden.","11":"Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.","12":"Lamed. Gaat het u niet aan, u allen, die over de weg gaat? Schouwt het aan en ziet, of er een smart is gelijk mijn smart, die mij aangedaan is, waarmee de HEERE *mij* bedroefd heeft ten dage van de gloed van Zijn toorn.","13":"Mem. Van de hoogte heeft Hij een vuur in mijn beenderen gezonden, waarover Hij geheerst heeft; Hij heeft voor mijn voeten een net uitgebreid, Hij heeft mij achterwaarts doen keren, Hij heeft mij woest en ziek gemaakt de hele dag.","14":"Nun. Het juk van mijn overtredingen is aangebonden door Zijn hand, zij zijn samengevlochten, zij zijn op mijn hals geklommen; Hij heeft mijn kracht doen vervallen; de Heere heeft mij in *hun* handen gegeven, ik kan niet opstaan.","15":"Samech. De Heere heeft al mijn sterken in het midden van mij vertreden; Hij heeft een bijeenkomst over mij uitgeroepen, om mijn jongelingen te verbreken; de Heere heeft de wijnpers van de jonkvrouw, de dochter van Juda, aangetreden.","16":"Ain. Om deze dingen ween ik; mijn oog, mijn oog vliet af van water, omdat de trooster, die mijn ziel zou verkwikken, ver van mij is; mijn kinderen zijn verwoest, omdat de vijand de overhand heeft.","17":"Pe. Sion breidt haar handen uit, er is geen trooster voor haar; de HEERE heeft van Jakob geboden, dat wie rondom hem zijn, zijn tegenstanders zouden zijn; Jeruzalem is als een afgezonderde *vrouw* onder hen.","18":"Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond opstandig geweest; hoort toch, alle volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenschap gegaan.","19":"Koph. Ik riep tot mijn liefhebbers, *maar* zij hebben mij bedrogen; mijn priesters en mijn oudsten hebben in de stad de geest gegeven, toen zij voedsel voor zich zochten, opdat zij hun ziel mochten verkwikken.","20":"Resch. Zie, HEERE, want mij is bang; mijn ingewand is beroerd, mijn hart heeft zich omgekeerd in het binnenste van mij, want ik ben zeer opstandig geweest; van buiten heeft *mij* het zwaard van kinderen beroofd, van binnen is het als de dood.","21":"Schin. Zij horen, dat ik zucht, *maar* ik heb geen trooster; al mijn vijanden horen mijn kwaad; *en* zij zijn vrolijk, dat Gij het gedaan hebt; *als* Gij de dag zult hebben voortgebracht, *die* Gij uitgeroepen hebt, dan zullen zij zijn, gelijk ik ben.","22":"Thau. Laat al hun kwaad voor Uw aangezicht komen, en doe hun, zoals Gij mij gedaan hebt vanwege al mijn overtredingen; want mijn zuchtingen zijn veel, en mijn hart is mat."},"SV":{"1":"Aleph. Hoe zit die stad *zo* eenzaam, die vol volks was, zij is als een weduwe geworden, zij, die groot was onder de heidenen, een vorstin onder de landschappen, is cijnsbaar geworden.","2":"Beth. Zij weent steeds des nachts, en haar tranen *lopen* over haar kinnebakken; zij heeft geen trooster onder al haar liefhebbers; al haar vrienden hebben trouwelooslijk met haar gehandeld, zij zijn haar tot vijanden geworden.","3":"Gimel. Juda is in gevangenis gegaan vanwege de ellende, en vanwege de veelheid der dienstbaarheid; zij woont onder de heidenen, zij vindt geen rust; al haar vervolgers achterhalen ze tussen de engten.","4":"Daleth. De wegen Sions treuren, omdat niemand op het feest komt; al haar poorten zijn woest, haar priesters zuchten: haar jonkvrouwen zijn bedroefd, en zij zelve is in bitterheid.","5":"He. Haar tegenpartijders zijn ten hoofd geworden, haar vijanden zijn gerust; omdat haar de HEERE bedroefd heeft, vanwege de veelheid harer overtredingen; haar kinderkens gaan henen *in* de gevangenis voor het aangezicht des tegenpartijders.","6":"Vau. En van de dochter Sions is al haar sieraad weggegaan; haar vorsten zijn als de herten, *die* geen weide vinden, en zij gaan krachteloos henen voor het aangezicht des vervolgers.","7":"Zain. Jeruzalem is, *in* de dagen harer ellende en harer veelvuldige ballingschap, indachtig aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; dewijl haar volk door de hand des tegenpartijders valt, en zij geen helper heeft; de tegenpartijders zien haar aan, zij spotten met haar rustdagen.","8":"Cheth. Jeruzalem heeft zwaarlijk gezondigd, daarom is zij als een afgezonderde *vrouw* geworden; allen, die haar eerden, achten haar onwaard, dewijl zij haar naaktheid gezien hebben; zij zucht ook, en zij is achterwaarts gekeerd.","9":"Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar uiterste, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot.","10":"Jod. De tegenpartijder heeft zijn hand aan al haar gewenste dingen uitgebreid; immers heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden hadt, dat zij in Uw gemeente niet komen zouden.","11":"Caph. Al haar volk zucht, brood zoekende, zij hebben hun gewenste dingen voor spijs gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.","12":"Lamed. Gaat het ulieden niet aan, gij allen, die over weg gaat? Schouwt het aan en ziet, of er een smart zij gelijk mijn smart, die mij aangedaan is, waarmede de HEERE *mij* bedroefd heeft ten dage der hittigheid Zijns toorns.","13":"Mem. Van de hoogte heeft Hij een vuur in mijn beenderen gezonden, waarover Hij geheerst heeft; Hij heeft voor mijn voeten een net uitgebreid, Hij heeft mij achterwaarts doen keren, Hij heeft mij woest en ziek gemaakt den gansen dag.","14":"Nun. Het juk mijner overtredingen is aangebonden door Zijn hand, zij zijn samengevlochten, zij zijn op mijn hals geklommen; Hij heeft mijn kracht doen vervallen; de Heere heeft mij in *hun* handen gegeven, ik kan niet opstaan.","15":"Samech. De Heere heeft al mijn sterken in het midden van mij vertreden; Hij heeft een bijeenkomst over mij uitgeroepen, om mijn jongelingen te verbreken; de Heere heeft de wijnpers der jonkvrouw, der dochter van Juda, aangetreden.","16":"Ain. Om dezer dingen wille ween ik; mijn oog, mijn oog vliet af van water, omdat de trooster, die mijn ziel zou verkwikken, verre van mij is; mijn kinderen zijn verwoest, omdat de vijand de overhand heeft.","17":"Pe. Sion breidt haar handen uit, daar is geen trooster voor haar; de HEERE heeft van Jakob geboden, dat die rondom hem zijn, zijn tegenpartijders zouden zijn; Jeruzalem is als een afgezonderde *vrouw* onder hen.","18":"Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond wederspannig geweest; hoort toch, alle gij volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenis gegaan.","19":"Koph. Ik riep tot mijn liefhebbers, *maar* zij hebben mij bedrogen; mijn priesters en mijn oudsten hebben in de stad den geest gegeven, als zij spijze voor zich zochten, opdat zij hun ziel mochten verkwikken.","20":"Resch. Aanzie, HEERE, want mij is bange; mijn ingewand is beroerd, mijn hart heeft zich omgekeerd in het binnenste van mij, want ik ben zeer wederspannig geweest; van buiten heeft *mij* het zwaard van kinderen beroofd, van binnen is als de dood.","21":"Schin. Zij horen, dat ik zucht, *maar* ik heb geen trooster; al mijn vijanden horen mijn kwaad; *en* zij zijn vrolijk, dat Gij het gedaan hebt; *als* Gij den dag zult voortgebracht hebben, *dien* Gij uitgeroepen hebt, zo zullen zij zijn, gelijk ik ben.","22":"Thau. Laat al hun kwaad voor Uw aangezicht komen, en doe hun, gelijk als Gij mij gedaan hebt vanwege al mijn overtredingen; want mijn zuchtingen zijn vele, en mijn hart is mat."},"KJV":{"1":"How doth the city sit solitary, *that was* full of people! *how* is she become as a widow! she *that was* great among the nations, *and* princess among the provinces, *how* is she become tributary!","2":"She weepeth sore in the night, and her tears *are* on her cheeks: among all her lovers she hath none to comfort *her*: all her friends have dealt treacherously with her, they are become her enemies.","3":"Judah is gone into captivity because of affliction, and because of great servitude: she dwelleth among the heathen, she findeth no rest: all her persecutors overtook her between the straits.","4":"The ways of Zion do mourn, because none come to the solemn feasts: all her gates are desolate: her priests sigh, her virgins are afflicted, and she *is* in bitterness.","5":"Her adversaries are the chief, her enemies prosper; for the LORD hath afflicted her for the multitude of her transgressions: her children are gone into captivity before the enemy.","6":"And from the daughter of Zion all her beauty is departed: her princes are become like harts *that* find no pasture, and they are gone without strength before the pursuer.","7":"Jerusalem remembered in the days of her affliction and of her miseries all her pleasant things that she had in the days of old, when her people fell into the hand of the enemy, and none did help her: the adversaries saw her, *and* did mock at her sabbaths.","8":"Jerusalem hath grievously sinned; therefore she is removed: all that honoured her despise her, because they have seen her nakedness: yea, she sigheth, and turneth backward.","9":"Her filthiness *is* in her skirts; she remembereth not her last end; therefore she came down wonderfully: she had no comforter. O LORD, behold my affliction: for the enemy hath magnified","10":"The adversary hath spread out his hand upon all her pleasant things: for she hath seen *that* the heathen entered into her sanctuary, whom thou didst command *that* they should not enter into thy congregation.","11":"All her people sigh, they seek bread; they have given their pleasant things for meat to relieve the soul: see, O LORD, and consider; for I am become vile.","12":"*Is it* nothing to you, all ye that pass by? behold, and see if there be any sorrow like unto my sorrow, which is done unto me, wherewith the LORD hath afflicted *me* in the day of his fierce anger.","13":"From above hath he sent fire into my bones, and it prevaileth against them: he hath spread a net for my feet, he hath turned me back: he hath made me desolate *and* faint all the day.","14":"The yoke of my transgressions is bound by his hand: they are wreathed, *and* come up upon my neck: he hath made my strength to fall, the Lord hath delivered me into *their* hands, *from whom* I am not able to rise up.","15":"The Lord hath trodden under foot all my mighty *men* in the midst of me: he hath called an assembly against me to crush my young men: the Lord hath trodden the virgin, the daughter of Judah, *as* in a winepress.","16":"For these *things* I weep; mine eye, mine eye runneth down with water, because the comforter that should relieve my soul is far from me: my children are desolate, because the enemy prevailed.","17":"Zion spreadeth forth her hands, *and there is* none to comfort her: the LORD hath commanded concerning Jacob, *that* his adversaries *should be* round about him: Jerusalem is as a menstruous woman","18":"The LORD is righteous; for I have rebelled against his commandment: hear, I pray you, all people, and behold my sorrow: my virgins and my young men are gone into captivity.","19":"I called for my lovers, *but* they deceived me: my priests and mine elders gave up the ghost in the city, while they sought their meat to relieve their souls.","20":"Behold, O LORD; for I *am* in distress: my bowels are troubled; mine heart is turned within me; for I have grievously rebelled: abroad the sword bereaveth, at home *there is* as death.","21":"They have heard that I sigh: *there is* none to comfort me: all mine enemies have heard of my trouble; they are glad that thou hast done *it*: thou wilt bring the day *that* thou hast called, and they shall be like","22":"Let all their wickedness come before thee; and do unto them, as thou hast done unto me for all my transgressions: for my sighs *are* many, and my heart *is* faint."}},"tsk":{"1":[{"kopje":"Hoe zit","refs":["Klaagl 2:1","Klaagl 4:1","Jes 14:12","Jer 50:23","Zef 2:15","Openb 18:16","Openb 18:17"]},{"kopje":"zit","refs":["Klaagl 2:10","Jes 3:26","Jes 47:1-15","Jes 50:5","Jes 52:2","Jes 52:7","Jer 9:11","Ezech 26:16"]},{"kopje":"vol","refs":["Ps 122:4","Jes 22:2","Zach 8:4","Zach 8:5"]},{"kopje":"als een","refs":["Jes 47:8","Jes 47:9","Jes 54:4","Openb 18:7"]},{"kopje":"groot","refs":["1 Kon 4:21","2 Kron 9:26","Ezra 4:20"]},{"kopje":"is","refs":["Klaagl 5:16","2 Kon 23:33","2 Kon 23:35","Neh 5:4","Neh 9:37"]}],"2":[{"kopje":"weent","refs":["Klaagl 1:16","Klaagl 2:11","Klaagl 2:18","Klaagl 2:19","Job 7:3","Ps 6:7","Ps 77:3-7","Jer 9:1","Jer 9:17-19","Jer 13:17"]},{"kopje":"onder","refs":["Klaagl 1:19","Jer 4:30","Jer 22:20-22","Jer 30:14","Ezech 16:37","Ezech 23:22-25","Hos 2:6","Openb 17:13","Openb 17:16"]},{"kopje":"geen","refs":["Klaagl 1:9","Klaagl 1:16","Klaagl 1:17","Klaagl 1:21","Jes 51:18","Jes 51:19"]},{"kopje":"al haar vrienden","refs":["Job 6:15","Job 19:13","Job 19:14","Ps 31:12","Spr 19:7","M "H319\">end;</span> therefore she came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6382\">wonderfully:</span> she had no <span class=\"wl wl-kjv\" data-code=\"H5162\">comforter.</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> my <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction:</span> for the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> hath magnified","10":"The <span class=\"wl wl-kjv\" data-code=\"H6862\">adversary</span> hath spread <span class=\"wl wl-kjv\" data-code=\"H6566\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon all her pleasant <span class=\"wl wl-kjv\" data-code=\"H4261\">things:</span> for she hath <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> that the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into her <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary,</span> whom thou didst <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> that they should not <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into thy congregation.","11":"All her <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H584\">sigh,</span> they <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread;</span> they have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> their pleasant <span class=\"wl wl-kjv\" data-code=\"H4261\">things</span> for <span class=\"wl wl-kjv\" data-code=\"H400\">meat</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">relieve</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">soul:</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5 , en de straten dagelijks vol van mensen waren, die deze stad uit en ingingen, komende uit verre en nabijgelegen natiën."},{"catchword":"als een weduwe geworden,","tekst":"Treurende en wenende vanwege haar bedroefden en eenzamen staat, verlaten zijnde van den Heere, haar echten en rechten bruidegom of man; hebbende daarenboven geen koning of koninkrijk."},{"catchword":"een vorstin onder de landschappen,","tekst":"Hebbende vele volken en natiën onder haar gebied, die aan haar jaarlijksen cijns en schattingen moesten betalen. Dit is inzonderheid ten tijde van David en Salomo geschied; 1Ch 18:6 ; 2Ch 8:7 ."},{"catchword":"cijnsbaar geworden","tekst":"Hebreeuws, tot tribuut geworden; dat is, hoe moet zij nu haar nek onder andere heidense natiën buigen en tot een teken van onderdanigheid schatting of tribuut aan dezelve betalen; zie 2Ki 23:24-25 ; 2Ch 36 , en Pro 12:14 ."}],"2":[{"catchword":"Zij","tekst":"Te weten de stad Jeruzalem."},{"catchword":"weent","tekst":"Te weten van hartzeer over haar verloren welstand en de ellende, waar zij in vervallen is."},{"catchword":"steeds","tekst":"Hebreeuws, zij weent wenende; dat is, steeds zonder ophouden."},{"catchword":"des nachts,","tekst":"Als andere lieden gerustelijk liggen en slapen. Zie Job 7:3 . Men kan ook door den nacht verstaan tegenspoed en ellende; zie de aantekening Job 34:25 ."},{"catchword":"onder al haar liefhebbers;","tekst":"Te weten die naburige volken, die met haar plachten te handelen. vs.16 klaagt zij dat zij ook van God verlaten is."},{"catchword":"vrienden","tekst":"De omliggende volken, die met Juda een verbond gemaakt hadden."},{"catchword":"met haar gehandeld,","tekst":"Of bij haar, of tegen haar."},{"catchword":"zij zijn haar tot vijanden geworden","tekst":"Zie vs.19."}],"3":[{"catchword":"Juda","tekst":"Dat is, de inwoners van het koninkrijk Juda."},{"catchword":"is in gevangenis gegaan","tekst":"Anders: verhuisd, zodat de zin zou zijn dat er in de algemene wegvoering van het Joodse volk naar Babylonië nog enigen bij oogluiking bij huis en hof gebleven zijn, maar dat zij van de garnizoenen en vreemde soldaten zo zijn geplaagd geweest, dat zij vanzelf hun vaderland, hun huis en hof verlaten hebben, op hoop van de ellende te ontvluchten. Anderen duiden dit op de Joden, die uit Jeruzalem en het land Juda gevlucht waren, uit vrees van de aanstaande ellende en dienstbaarheid, eer nog de Chaldeën Jeruzalem ingenomen hadden."},{"catchword":"de veelheid der dienstbaarheid;","tekst":"Of grootheid der dienstbaarheid; dat is, vanwege de grote dienstbaarheid."},{"catchword":"zij","tekst":"Te weten de Joodse natie. Het Hebreeuwse woord staat in het vrouwelijk geslacht. Alzo wordt ook vs.1 de stad Jeruzalem bij ene weduwe vergeleken."},{"catchword":"woont onder de heidenen,","tekst":"Dat is, zij is gedwongen te wonen onder de afgodische en van God vreemde volken."},{"catchword":"achterhalen ze","tekst":"Dat is, bezetten ze, tasten ze aan."},{"catchword":"tussen de engten","tekst":"Dat is, op zulke plaatsen, waar het allerengst is, waar men noch vooruit noch terug kan. Anderen verstaan dit van de angsten en benauwdheden, waarin zij vervallen waren."}],"4":[{"catchword":"De wegen Sions","tekst":"Dat is, de wegen, die naar Jeruzalem gaan, gelegen op den berg Zion."},{"catchword":"treuren,","tekst":"Dat is, zij liggen woest, zij worden niet betreden, gelijk zij plachten als de mensen bij menigten te Jeruzalem tot den godsdienst kwamen. Den ongevoellijken en onverstandigen dingen worden menselijke gewaarwordingen toegeschreven, zo in dit vs., gelijk elders meer."},{"catchword":"op het feest komt;","tekst":"Te weten op die dingen, die geordineerd waren tot de offeranden, inzonderheid op die hoge feestdagen, op welke een ieder moest verschijnen. Zie Exo 23:14 ; Deu 16:16 , en vergelijk hiermede Psa 42:5 ."},{"catchword":"haar","tekst":"Te weten van Zion, dat is Jeruzalem."},{"catchword":"poorten zijn woest,","tekst":"Dat is, daar is geen uit noch ingaan door de stadspoorten, gelijk het voor dezen placht te zijn. Of versta dit aldus: Daar wordt noch recht, noch justitie geoefend; want zulks placht in de stadspoorten te geschieden. Zie Gen 34:20 ; Rth 4:1 , Rth 4:10 ; 2Sa 15:2 , en 2Sa 18:4 , en 2Sa 19:9 ; Psa 9:14 ."},{"catchword":"zuchten","tekst":"Omdat de godsdienst vervallen en de stad dus ellendiglijk verwoest is."},{"catchword":"zij zelve is in bitterheid","tekst":"Hebreeuws, haar is bitter; dat is, zij [te weten de stad Jeruzalem] is vol grote droefenis, ja de ganse natie der Joden, van welken staat of ouderdom zij ook zijn, is vol hartzeer en jammer."}],"5":[{"catchword":"ten hoofd geworden,","tekst":"Dat is, hebben de heerschappij over haar. Vergelijk Deu 28:13 , Deu 28:44 ; Psa 18:44 , en Psa 66:12 ; Isa 9:13 , en Isa 19:15 ."},{"catchword":"zijn gerust;","tekst":"Of, leven gerustelijk, of hebben goede rust."},{"catchword":"omdat haar de HEERE bedroefd heeft,","tekst":"Of, want de Heere heeft haar [te weten de stad Jeruzalem] bedroefd, enz."},{"catchword":"de veelheid harer overtredingen;","tekst":"Of grootheid."},{"catchword":"kinderkens","tekst":"Van de betekenis van dit woord zie Psa 8:3 ."},{"catchword":"gaan henen","tekst":"Als in triomf, om tot slaven gemaakt te worden, of gelijk men ene kudde beesten, die men geroofd heeft, voor zich heen drijft. Daar wordt niemand aangezien noch verschoond, van wat ouderdom, geslacht, of staat hij zij."}],"6":[{"catchword":"van de dochter Sions","tekst":"Dat is, van het volk van Jeruzalem."},{"catchword":"al haar sieraad weggegaan;","tekst":"Of, al hare heerlijkheid, inzonderheid de tempel en godsdienst, mitsgaders al die voortreffelijke gaven en weldaden, die zij van God meermalen zeer rijkelijk ontvangen hadden."},{"catchword":"zijn als de herten,","tekst":"Dat is, zij hebben allen moed verloren, zij vluchten en lopen gelijk de herten voor de honden en jagers doen."},{"catchword":"geen weide vinden,","tekst":"Dat is, zij lopen door het land ten enenmale verarmd, ja verhongerd zijnde."},{"catchword":"zij gaan krachteloos henen","tekst":"Geen kracht noch middel hebbende, om enigen tegenstand te doen."}],"7":[{"catchword":"in de dagen harer ellende","tekst":"Te weten nu zij met kruis en tegenspoed beangstigd is."},{"catchword":"veelvuldige ballingschap,","tekst":"Anders, harer kermingen; vergelijk Lam 3:19 ."},{"catchword":"al haar gewenste dingen,","tekst":"Te weten eer en goed, mitsgaders allerlei zo geestelijke als lichamelijke gaven, die zij overvloediglijk placht te genieten."},{"catchword":"van oude dagen af","tekst":"Te weten toen zij in haar bloei was. Hebreeuws, die van oude dagen geweest zijn."},{"catchword":"zien haar aan,","tekst":"Zij gaan en gapen haar aan als een monster."},{"catchword":"met haar rustdagen","tekst":"Dit kan men verstaan van den gansen godsdienst en de ceremoniën, die de Joden hadden, naar de instelling van Gods wet; of van de verwoesting van het Joodse land, hetwelk ten tijde der Babylonische gevangenschap zijne sabbaten of vierdagen alzo hield, gelijk God gedreigd had; Lev 26:34 , Lev 26:43 ; namelijk dat het land woest en onbebouwd lag."}],"8":[{"catchword":"heeft zwaarlijk gezondigd,","tekst":"Hebreeuws, heeft ene zonde gezondigd; dat is, zwaarlijk en lang gezondigd. Anders is daar geen mens, die niet zondigt; 1Ki 8:46 . Zie gelijke manier van spreken Exo 32:30 ."},{"catchword":"als een afgezonderde vrouw","tekst":"Hebreeuws, tot een afgezonderde; dat is, als ene vrouw, die vanwege hare onreinheid van de mensen zich moet onthouden, volgens de wet; Lev 15:19 . Anders: als een omzwervende [vrouw], of, men heeft [het hoofd] over haar geschud. Zie 2Ki 19:21 ."},{"catchword":"allen,","tekst":"Dat is, allen die haar in waarde hielden, te weten toen zij den Heere vreesde en heerschappij had over andere volken en natiën."},{"catchword":"haar naaktheid gezien hebben;","tekst":"Beroofd zijnde van hare versierselen, inzonderheid van alle godzaligheid ontbloot zijnde; vergelijk Jer 13:22 , Jer 13:26 ; Eze 16:37 ; Hos 2:9 ; Nah 3:5 ."},{"catchword":"zij zucht ook,","tekst":"Te weten nu zij indachtig wordt hoe lelijk zij God verlaten heeft, hulp zoekende waar gene te vinden was."},{"catchword":"zij is achterwaarts gekeerd","tekst":"Dat is, zij is beschaamd geworden, dewijl zij van den Heere, haar rechten man, verstoten werd."}],"9":[{"catchword":"Haar onreinheid","tekst":"Dat is, haar lelijke zonden; ene manier van spreken, genomen van de onreinheid der vrouwen. Dit zijn de woorden der godzalige gemeente, belijdende de rechtvaardigheid Gods in het straffen der hardnekkige onboetvaardige zondaars."},{"catchword":"is in haar zomen,","tekst":"Dat is, merkelijk te zien; de tekenen der schandelijke zonden, die zij begaan heeft, hangen haar nog aan. Zie de aantekening Lev 18:6 , en vergelijk Jer 13:22 , Jer 13:26 ."},{"catchword":"aan haar uiterste,","tekst":"Of, aan haar einde; dat is, zij ging voort in haar goddeloos leven, niet denkende dat haar eens rekening zou afgeëischt worden van haar doen en laten, en dat zij alsdan hare straf zou te dragen hebben; zie Ecc 7:8 ."},{"catchword":"wonderbaarlijk omlaag gedaald;","tekst":"Dat is, op een schielijke en vreemde manier. Het koninkrijk van Juda is na den dood van den koning Josia in twee en twintig jaren teniet gegaan."},{"catchword":"zij heeft geen trooster","tekst":"Daar is niemand, die haar met raad of daad bijstand doet, vs.7."},{"catchword":"HEERE,","tekst":"Dit zijn de woorden der overgebleven burgers van Jeruzalem, of van het volk Gods aldaar."},{"catchword":"zie mijn ellende aan,","tekst":"Versta hierbij: en verlos mij uit dezelve. Zie Psa 31:8 ; Act 7:34 ."},{"catchword":"maakt zich groot","tekst":"Dat is, de vijand verheft zich. Zie de aantekening Psa 35:26 , en Psa 38:17 ."}],"10":[{"catchword":"De tegenpartijder","tekst":"Dit zijn wederom woorden van den profeet."},{"catchword":"haar gewenste dingen","tekst":"Hierdoor moet men inzonderheid verstaan het heilige gereedschap, of de kostelijke vaten van den tempel, welke de Chaldeën weggevoerd hebben; Jer 52:17-18 ."},{"catchword":"zij aangezien,","tekst":"Te weten de stad Jeruzalem, dat is, de burgers en inwoners van Jeruzalem."},{"catchword":"de heidenen","tekst":"De Chaldeën eigenlijk."},{"catchword":"in haar heiligdom gingen,","tekst":"Versta hier door het heiligdom niet alleen het Joodse land, hetwelk een heiligdom genoemd wordt, Exo 15:17 , maar ook den heiligen tempel, ja het heilige der heiligen, waar de heidenen ingebroken zijn."},{"catchword":"waarvan Gij geboden hadt,","tekst":"Of, van welke Gij geboden hadt."},{"catchword":"dat zij in Uw gemeente","tekst":"Dat is, dat zij onder uw volk niet zouden gerekend wordt; of dat zij geen ambt onder uw volk bedienen zouden. Zie de aantekening Deu 23:3 , en vergelijk Act 21:28 ."}],"11":[{"catchword":"Al haar volk zucht,","tekst":"Al het volk van Juda en Jeruzalem, van wat staat of rang het zij."},{"catchword":"brood zoekende,","tekst":"Het woord brood betekent dikwijls al hetgeen de mens tot onderhouding van het lichaam behoeft, inzonderheid alles wat men eet, zodat brood ook somtijds vlees betekent."},{"catchword":"om de ziel te verkwikken","tekst":"Hebreeuws, om de ziel weder te brengen, of te herstellen; dat is, om haar te verkwikken, alzo ook vs.16, 19. Vergelijk 1Sa 30:12 ; Psa 23:3 ."},{"catchword":"Zie,","tekst":"Van hier af tot het einde van het hfdst. zijn het de woorden der burgers van Jeruzalem."},{"catchword":"ik","tekst":"Dat is, een ieder onder ons."},{"catchword":"onwaard geworden ben","tekst":"Dat is, gering en verachtzaam. Zie de aantekening Psa 12:9 ; alzo ook boven vs.8."}],"12":[{"catchword":"Gaat het ulieden niet aan,","tekst":"Alsof hij zeide: Roert u mijn ellendige staat niet? Hebt gij geen medelijden met mij? Let er vrij op, en neemt het ter harte. Anders: het gaat ulieden niet aan; dat is, gij laat ulieden wel denken dat u dit niet aangaat, maar zo gij wijs zijt, neemt het ter harte, let er wel terdege op, en spiegelt u aan mij."},{"catchword":"of er een smart zij gelijk mijn smart,","tekst":"Vergelijk Eze 5:9 , en Dan 9:12 ."}],"13":[{"catchword":"Van de hoogte","tekst":"Dat is, van den hemel."},{"catchword":"Hij","tekst":"Te weten de Heere."},{"catchword":"een vuur","tekst":"Dat is, grote pijnen en smarten, die de mensen als een vuur verteren."},{"catchword":"in mijn beenderen gezonden,","tekst":"Dat is, in de sterkste delen van mijn lichaam, gelijk Psa 6:3 . Zie de aantekening Job 7:15 ."},{"catchword":"waarover","tekst":"Dat is, welke de Heere, niet enige menselijke kracht, bestiert en zulke kracht geeft, dat het mij verteert."},{"catchword":"Hij heeft voor mijn voeten een net uitgebreid,","tekst":"Dat is, Hij heeft mij zo vast in zijne strikken, dat ik er niet uit geraken kan."},{"catchword":"Hij heeft mij achterwaarts doen keren,","tekst":"Dat is, toen ik hem meende te ontvluchten, heeft Hij mij in zijn net gevangen en doen terugkeren."},{"catchword":"gemaakt den gansen dag","tekst":"Hebreeuws, gegeven; dat is, Hij heeft mij alle middelen van verlossing benomen."}],"14":[{"catchword":"Het juk","tekst":"Het zware pak mijner menigvuldige zonden is als met touwen vastgebonden, en de Heere legt mij dat op den hals, hetwelk zo zwaar om te dragen is, dat het mij mijne krachten breekt. Vergelijk Deu 28:48 . De mensen zijnde als muilen en paarden, Psa 32 , zo temt hen het juk en de banden des tegenspoeds."},{"catchword":"zij","tekst":"Te weten mijne overtredingen, die zijn al tezamen als in een bundeltje gevlochten"},{"catchword":"geklommen;","tekst":"Dat is, geleid."},{"catchword":"vervallen;","tekst":"Hebreeuws, struikelen."},{"catchword":"in hun handen gegeven,","tekst":"Dat is, in de macht der vijanden."},{"catchword":"ik kan niet opstaan","tekst":"Dat is, alle kracht en vermogen is mij ten enenmale benomen, naar het oordeel van vlees en bloed; maar wat bij de mensen onmogelijk is, dat is mogelijk bij U, o mijn God."}],"15":[{"catchword":"mijn sterken","tekst":"Dat is, mijn kloeke helden; te weten op welken ik mij het meest verliet."},{"catchword":"in het midden van mij vertreden;","tekst":"Dat is, die in mij woonden."},{"catchword":"Hij heeft een bijeenkomst","tekst":"Dat is, Hij heeft vele vijanden tegen mij doen samenkomen, om de bloem van mijn volk teniet te maken. Vergelijk Zep 1:7-8 ."},{"catchword":"over mij uitgeroepen,","tekst":"Of, tegen mij."},{"catchword":"jongelingen","tekst":"Eigenlijk keurlingen of uitgelezenen, op wie ik mij nog enigszins had mogen verlaten. Zie Hos 9:12-13 ."},{"catchword":"de Heere heeft de wijnpers der jonkvrouw,","tekst":"De Heere heeft hare inwoners door den vijand verpletterd en in stukken gebroken, gelijk de druiven in de pers verbroken worden. Vergelijk Isa 63:3 ; Rev 14:19-20 , en Rev 19:15 . Anders: De Heere heeft de dochter van Juda vertreden, [als in] een wijnpers."}],"16":[{"catchword":"Om dezer dingen wille ween ik;","tekst":"Te weten vanwege mijn grote en menigvuldige zonden, weshalve ik nu zo vele en zo grote straffen moet dragen."},{"catchword":"vliet af van water,","tekst":"Of, daar vliet water uit."},{"catchword":"de trooster,","tekst":"Dat is, de Heere zelf, de God aller vertroosting; 2Co 1:3 . Of versta door den trooster hare vrienden, die haar troosten zouden; zie vs.2, 7."},{"catchword":"verkwikken,","tekst":"Hebreeuws, wederbrengen."},{"catchword":"mijn kinderen","tekst":"Dit is de oorzaak, waarom zij zo grotelijks troost van node heeft."},{"catchword":"zijn verwoest,","tekst":"Dat is, zij zijn in een ellendigen staat."},{"catchword":"omdat de vijand","tekst":"Of, want de vijand heeft de overhand; vergelijk boven vs.5."}],"17":[{"catchword":"breidt haar handen uit,","tekst":"Zie Jer 4:31 ."},{"catchword":"HEERE heeft van Jakob","tekst":"Dat is, God heeft dengenen, die Jeruzalem haten, macht gegeven haar aan alle zijden te benauwen."},{"catchword":"geboden,","tekst":"Door heimelijke ingeving bewogen. En zulks doet Hij door zijn rechtvaardig oordeel, Hij alleen wetende het kwade wel te gebruiken."},{"catchword":"is als een afgezonderde vrouw (function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
