 al mijn volk tot bespotting geworden, hun snarenspel de hele dag.","15":"He. Hij heeft mij met bitterheden verzadigd, Hij heeft mij met alsem dronken gemaakt.","16":"Vau. Hij heeft mijn tanden met zandsteentjes verbrijzeld, Hij heeft mij in de as neergedrukt.","17":"Vau. En U hebt mijn ziel ver van de vrede verstoten, ik heb het goede vergeten.","18":"Vau. Toen zei ik: Mijn sterkte is vergaan, en mijn hoop van de HEERE.","19":"Zain. Denk aan mijn ellende en aan mijn ballingschap, aan de alsem en gal.","20":"Zain. Mijn ziel denkt er wel terdege aan, en zij buigt zich neer in mij.","21":"Zain. Dit zal ik mij ter harte nemen, daarom zal ik hopen;","22":"Cheth. Het zijn de blijken van goedertierenheid van de HEERE, dat wij niet vernietigd zijn, dat Zijn barmhartigheden geen einde hebben;","23":"Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.","24":"Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen.","25":"Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt.","26":"Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.","27":"Teth. Het is goed voor een man, dat hij het juk in zijn jeugd draagt.","28":"Jod. Hij zit eenzaam, en zwijgt stil, omdat Hij het hem opgelegd heeft.","29":"Jod. Hij stekt zijn mond in het stof, en zegt: Misschien is er verwachting.","30":"Jod. Hij geeft zijn wang aan hem die hem slaat, hij wordt zat van smaad.","31":"Caph. Want de Heere zal niet verstoten in eeuwigheid.","32":"Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid.","33":"Caph. Want Hij plaagt of bedroeft de kinderen van de mensen niet van harte.","34":"Lamed. Dat men al de gevangenen van de aarde onder Zijn voeten verbrijzelt;","35":"Lamed. Dat men het recht van een man buigt voor het aangezicht van de Allerhoogste;","36":"Lamed. Dat men een mens verongelijkt in zijn rechtszaak; zou de Heere dat niet zien?","37":"Mem. Wie zegt iets, en het gebeurt, als de Heere het niet beveelt?","38":"Mem. Gaat niet uit de mond van de Allerhoogste het kwade en het goede?","39":"Mem. Wat klaagt dan een levend mens? Ieder klaagt vanwege zijn zonden.","40":"Nun. Laat ons onze wegen onderzoeken en doorzoeken, en laat ons terugkeren tot de HEERE.","41":"Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:","42":"Nun. Wij hebben overtreden, en wij zijn opstandig geweest, daarom hebt U niet gespaard.","43":"Samech. U hebt ons met toorn bedekt, en U hebt ons vervolgd; U hebt ons gedood. U hebt niet verschoond.","44":"Samech. U hebt Uzelf met een wolk bedekt, zodat er geen gebed doorkwam.","45":"Samech. U hebt ons tot een uitvaagsel en wegwerpsel gesteld, te midden van de volken.","46":"Pe. Al onze vijanden hebben hun mond tegen ons opgesperd.","47":"Pe. De vrees en de kuil zijn over ons gekomen, de verwoesting en de verbreking.","48":"Pe. Met waterbeken loopt mijn oog neer, vanwege de breuk van de dochter van mijn volk.","49":"Ain. Mijn oog vliet, en kan niet ophouden, omdat er geen rust is;","50":"Ain. Totdat de HEERE van de hemel neerkijkt, en het ziet.","51":"Ain. Mijn oog doet mijn ziel moeite aan, vanwege al de dochters van mijn stad.","52":"Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd.","53":"Tsade. Zij hebben mijn leven in een kuil uitgeroeid, en zij hebben een steen op mij geworpen.","54":"Tsade. Het water zwom over mijn hoofd; ik zei: Ik ben afgesneden!","55":"Koph. HEERE! Ik heb Uw Naam aangeroepen uit de onderste kuil.","56":"Koph. U hebt mijn stem gehoord, verberg Uw oor niet voor mijn zuchten, voor mijn roepen.","57":"Koph. U bent tot mij genaderd op de dag dat ik U aanriep; U hebt gezegd: Vrees niet!","58":"Resch. Heere! U hebt de rechtszaken van mijn ziel bepleit, U hebt mijn leven verlost.","59":"Resch. HEERE! U hebt de verkeerdheid gezien, die men mij aangedaan heeft, oordeel mijn rechtszaak.","60":"Resch. U hebt al hun wraak gezien, al hun gedachten tegen mij.","61":"Schin. HEERE! U hebt hun smaden gehoord, en al hun gedachten tegen mij;","62":"Schin. De lippen van hen die tegen mij opstaan, en hun overdenkingen tegen mij de hele dag.","63":"Schin. Aanschouwt hun zitten en opstaan; ik ben hun snarenspel.","64":"Thau. HEERE! geef hun de vergelding terug, naar het werk van hun handen.","65":"Thau. Geef hun een verharding van het hart; Uw vloek zij over hen!","66":"Thau. Vervolg hen met toorn, en verdelg hen van onder de hemel van de HEERE."},"SV":{"1":"Aleph. Ik ben de man, *die* ellende gezien heeft door de roede Zijner verbolgenheid.","2":"Aleph. Hij heeft mij geleid en gevoerd *in* de duisternis, en niet *in* het licht.","3":"Aleph. Hij heeft Zich immers tegen mij gewend, Hij heeft Zijn hand den gansen dag veranderd.","4":"Beth. Hij heeft mijn vlees en mijn huid oud gemaakt, Hij heeft mijn beenderen gebroken.","5":"Beth. Hij heeft tegen mij gebouwd, en Hij heeft *mij* *met* galle en moeite omringd.","6":"Beth. Hij heeft mij gezet in duistere plaatsen, als degenen, die over lang dood zijn.","7":"Gimel. Hij heeft mij toegemuurd, dat ik er niet uit gaan kan; Hij heeft mijn koperen boeien verzwaard.","8":"Gimel. Ook wanneer ik roep en schreeuw, sluit Hij de *oren* *voor* mijn gebed.","9":"Gimel. Hij heeft mijn wegen toegemuurd met uitgehouwen stenen, Hij heeft mijn paden verkeerd.","10":"Daleth. Hij is mij een loerende beer, een leeuw in verborgen plaatsen.","11":"Daleth. Hij heeft mijn wegen afgewend; en Hij heeft mij in stukken gebroken; Hij heeft mij woest gemaakt.","12":"Daleth. Hij heeft Zijn boog gespannen, en Hij heeft mij den pijl als ten doel gesteld.","13":"He. Hij heeft Zijn pijlen in mijn nieren doen ingaan.","14":"He. Ik ben al mijn volk tot belaching geworden, hun snarenspel den gansen dag.","15":"He. Hij heeft mij met bitterheden verzadigd, Hij heeft mij met alsem dronken gemaakt.","16":"Vau. Hij heeft mijn tanden met zandsteentjes verbrijzeld, Hij heeft mij in de as nedergedrukt.","17":"Vau. En Gij hebt mijn ziel verre van den vrede verstoten, ik heb het goede vergeten.","18":"Vau. Toen zeide ik: Mijn sterkte is vergaan, en mijn hoop van den HEERE.","19":"Zain. Gedenk aan mijn ellende en aan mijn ballingschap, aan den alsem en galle.","20":"Zain. Mijn ziel gedenkt er wel terdege aan, en zij bukt zich neder in mij.","21":"Zain. Dit zal ik mij ter harte nemen, daarom zal ik hopen;","22":"Cheth. Het zijn de goedertierenheden des HEEREN, dat wij niet vernield zijn, dat Zijn barmhartigheden geen einde hebben;","23":"Cheth. Zij zijn allen morgen nieuw, Uw trouw is groot.","24":"Cheth. De HEERE is mijn Deel, zegt mijn ziel, daarom zal ik op Hem hopen.","25":"Teth. De HEERE is goed dengenen, die Hem verwachten, der ziele, die Hem zoekt.","26":"Teth. Het is goed, dat men hope, en stille zij op het heil des HEEREN.","27":"Teth. Het is goed voor een man, dat hij het juk in zijn jeugd draagt.","28":"Jod. Hij zitte eenzaam, en zwijge stil, omdat Hij het hem opgelegd heeft.","29":"Jod. Hij steke zijn mond in het stof, *zeggende*: Misschien is er verwachting.","30":"Jod. Hij geve zijn wang dien, die hem slaat, hij worde zat van smaad.","31":"Caph. Want de Heere zal niet verstoten in eeuwigheid.","32":"Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid Zijner goedertierenheden.","33":"Caph. Want Hij plaagt of bedroeft des mensen kinderen niet van harte.","34":"Lamed. Dat men al de gevangenen der aarde onder Zijn voeten verbrijzelt;","35":"Lamed. Dat men het recht eens mans buigt voor het aangezicht des Allerhoogsten;","36":"Lamed. Dat men een mens verongelijkt in zijn twistzaak; zou het de Heere niet zien?","37":"Mem. Wie zegt wat, hetwelk geschiedt, *zo* *het* de Heere niet beveelt?","38":"Mem. Gaat niet uit den mond des Allerhoogsten het kwade en het goede?","39":"Mem. Wat klaagt *dan* een levend mens? Een ieder *klage* vanwege zijn zonden.","40":"Nun. Laat ons onze wegen onderzoeken en doorzoeken, en laat ons wederkeren tot den HEERE.","41":"Nun. Laat ons onze harten opheffen, mitsgaders de handen, tot God in den hemel, *zeggende*:","42":"Nun. Wij hebben overtreden, en wij zijn wederspannig geweest, *daarom* hebt Gij niet gespaard.","43":"Samech. Gij hebt *ons* met toorn bedekt, en Gij hebt ons vervolgd; Gij hebt *ons* gedood. Gij hebt niet verschoond.","44":"Samech. Gij hebt U met een wolk bedekt, zodat er geen gebed doorkwam.","45":"Samech. Gij hebt ons *tot* een uitvaagsel en wegwerpsel gesteld, in het midden der volken.","46":"Pe. Al onze vijanden hebben hun mond tegen ons opgesperd.","47":"Pe. De vreze en de kuil zijn over ons gekomen, de verwoesting en de verbreking.","48":"Pe. *Met* waterbeken loopt mijn oog neder, vanwege de breuk der dochter mijns volks.","49":"Ain. Mijn oog vliet, en kan niet ophouden, omdat er geen rust is;","50":"Ain. Totdat *het* de HEERE van den hemel aanschouwe, en *het* zie.","51":"Ain. Mijn oog doet mijn ziele *moeite* aan, vanwege al de dochteren mijner stad.","52":"Tsade. Die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapperlijk gejaagd.","53":"Tsade. Zij hebben mijn leven in een kuil uitgeroeid, en zij hebben een steen op mij geworpen.","54":"Tsade. De wateren zwommen over mijn hoofd; ik zeide: Ik ben afgesneden!","55":"Koph. HEERE! Ik heb Uw Naam aangeroepen uit den ondersten kuil.","56":"Koph. Gij hebt mijn stem gehoord, verberg Uw oor niet voor mijn zuchten, voor mijn roepen.","57":"Koph. Gij hebt U genaderd ten dage, als ik U aanriep; Gij hebt gezegd: Vrees niet!","58":"Resch. Heere! Gij hebt de twistzaken mijner ziel getwist, Gij hebt mijn leven verlost.","59":"Resch. HEERE! Gij hebt gezien de verkeerdheid, die men mij aangedaan heeft, oordeel mijn rechtzaak.","60":"Resch. Gij hebt al hun wraak gezien, al hun gedachten tegen mij.","61":"Schin. HEERE! Gij hebt hun smaden gehoord, *en* al hun gedachten tegen mij;","62":"Schin. De lippen dergenen, die tegen mij opstaan, en hun dichten tegen mij den gansen dag.","63":"Schin. Aanschouw hun zitten en opstaan; ik ben hun snarenspel.","64":"Thau. HEERE! geef hun weder die vergelding, naar het werk hunner handen.","65":"Thau. Geef hun een deksel des harten; Uw vloek zij over hen!","66":"Thau. Vervolg ze met toorn, en verdelg ze van onder den hemel des HEEREN."},"KJV":{"1":"I *am* the man *that* hath seen affliction by the rod of his wrath.","2":"He hath led me, and brought *me into* darkness, but not *into* light.","3":"Surely against me is he turned; he turneth his hand *against me* all the day.","4":"My flesh and my skin hath he made old; he hath broken my bones.","5":"He hath builded against me, and compassed *me* with gall and travail.","6":"He hath set me in dark places, as *they that be* dead of old.","7":"He hath hedged me about, that I cannot get out: he hath made my chain heavy.","8":"Also when I cry and shout, he shutteth out my prayer.","9":"He hath inclosed my ways with hewn stone, he hath made my paths crooked.","10":"He *was* unto me *as* a bear lying in wait, *and as* a lion in secret places.","11":"He hath turned aside my ways, and pulled me in pieces: he hath made me desolate.","12":"He hath bent his bow, and set me as a mark for the arrow.","13":"He hath caused the arrows of his quiver to enter into my reins.","14":"I was a derision to all my people; *and* their song all the day.","15":"He hath filled me with bitterness, he hath made me drunken with wormwood.","16":"He hath also broken my teeth with gravel stones, he hath covered me with ashes.","17":"And thou hast removed my soul far off from peace: I forgat prosperity.","18":"And I said, My strength and my hope is perished from the LORD:","19":"Remembering mine affliction and my misery, the wormwood and the gall.","20":"My soul hath *them* still in remembrance, and is humbled","21":"This I recall to my mind, therefore have I hope.","22":"*It is of* the LORD'S mercies that we are not consumed, because his compassions fail","23":"*They are* new every morning: great *is* thy faithfulness.","24":"The LORD *is* my portion, saith my soul; therefore will I hope","25":"The LORD *is* good unto them that wait for him, to the soul *that* seeketh","26":"*It is* good that *a man* should both hope and quietly wait for the salvation of the LORD.","27":"*It is* good for a man that he bear the yoke in his youth.","28":"He sitteth alone and keepeth silence, because he hath borne","29":"He putteth his mouth in the dust; if so be there may be hope.","30":"He giveth *his* cheek to him that smiteth him: he is filled full with reproach.","31":"For the Lord will not cast off for ever:","32":"But though he cause grief, yet will he have compassion according to the multitude of his mercies.","33":"For he doth not afflict willingly nor grieve the children of men.","34":"To crush under his feet all the prisoners of the earth,","35":"To turn aside the right of a man before the face of the most High,","36":"To subvert a man in his cause, the Lord approveth","37":"Who *is* he *that* saith, and it cometh to pass, *when* the Lord commandeth","38":"Out of the mouth of the most High proceedeth not evil and good?","39":"Wherefore doth a living man complain, a man for the punishment of his sins?","40":"Let us search and try our ways, and turn again to the LORD.","41":"Let us lift up our heart with *our* hands unto God in the heavens.","42":"We have transgressed and have rebelled: thou hast not pardoned.","43":"Thou hast covered with anger, and persecuted us: thou hast slain, thou hast not pitied.","44":"Thou hast covered thyself with a cloud, that *our* prayer should not pass through.","45":"Thou hast made us *as* the offscouring and refuse in the midst of the people.","46":"All our enemies have opened their mouths","47":"Fear and a snare is come upon us, desolation and destruction.","48":"Mine eye runneth down with rivers of water for the destruction of the daughter of my people.","49":"Mine eye trickleth down, and ceaseth not, without any intermission,","50":"Till the LORD lo >old;</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> my bones.","5":"He hath builded <span class=\"wl wl-kjv\" data-code=\"H1129\">against</span> me, and <span class=\"wl wl-kjv\" data-code=\"H5362\">compassed</span> me with <span class=\"wl wl-kjv\" data-code=\"H7219\">gall</span> and travail.","6":"He hath <span class=\"wl wl-kjv\" data-code=\"H3427\">set</span> me in dark <span class=\"wl wl-kjv\" data-code=\"H4285\">places,</span> as they that be <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> of old.","7":"He hath <span class=\"wl wl-kjv\" data-code=\"H1443\">hedged</span> me about, that I cannot get <span class=\"wl wl-kjv\" data-code=\"H3318\">out:</span> he hath made my <span class=\"wl wl-kjv\" data-code=\"H5178\">chain</span> heavy.","8":"Also when I <span class=\"wl wl-kjv\" data-code=\"H2199\">cry</span> and <span class=\"wl wl-kjv\" data-code=\"H7768\">shout,</span> he shutteth <span class=\"wl wl-kjv\" data-code=\"H5640\">out</span> my prayer.","9":"He hath <span class=\"wl wl-kjv\" data-code=\"H1443\">inclosed</span> my <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> with hewn <span class=\"wl wl-kjv\" data-code=\"H1496\">stone,</span> he hath made my <span class=\"wl wl-kjv\" data-code=\"H5410\">paths</span> crooked.","10":"He was unto me as a <span class=\"wl wl-kjv\" data-code=\"H1677\">bear</span> lying in <span class=\"wl wl-kjv\" data-code=\"H693\">wait,</span> and as a <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> in secret places.","11":"He hath turned <span class=\"wl wl-kjv\" data-code=\"H5493\">aside</span> my <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and pulled me in <span class=\"wl wl-kjv\" data-code=\"H6582\">pieces:</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> me desolate.","12":"He hath <span class=\"wl wl-kjv\" data-code=\"H1869\">bent</span> his <span class=\"wl wl-kjv\" data-code=\"H7198\">bow,</span> and <span class=\"wl wl-kjv\" data-code=\"H5324\">set</span> me as a <span class=\"wl wl-kjv\" data-code=\"H4307\">mark</span> for the arrow.","13":"He hath caused the <span class=\"wl wl-kjv\" data-code=\"H1121\">arrows</span> of his <span class=\"wl wl-kjv\" data-code=\"H827\">quiver</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into my reins.","14":"I was a <span class=\"wl wl-kjv\" data-code=\"H7814\">derision</span> to all my <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> and their <span class=\"wl wl-kjv\" data-code=\"H5058\">song</span> all the day.","15":"He hath <span class=\"wl wl-kjv\" data-code=\"H7646\">filled</span> me with <span class=\"wl wl-kjv\" data-code=\"H4844\">bitterness,</span> he hath made me <span class=\"wl wl-kjv\" data-code=\"H7301\">drunken</span> with wormwood.","16":"He hath also <span class=\"wl wl-kjv\" data-code=\"H1638\">broken</span> my <span class=\"wl wl-kjv\" data-code=\"H8127\">teeth</span> with gravel <span class=\"wl wl-kjv\" data-code=\"H2687\">stones,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H3728\">covered</span> me with ashes.","17":"And thou hast <span class=\"wl wl-kjv\" data-code=\"H2186\">removed</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> far <span class=\"wl wl-kjv\" data-code=\"H2186\">off</span> from <span class=\"wl wl-kjv\" data-code=\"H7965\">peace:</span> I <span class=\"wl wl-kjv\" data-code=\"H5382\">forgat</span> prosperity.","18":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H5331\">strength</span> and my <span class=\"wl wl-kjv\" data-code=\"H8431\">hope</span> is <span class=\"wl wl-kjv\" data-code=\"H6\">perished</span> from the LORD:","19":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Remembering</span> mine <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction</span> and my <span class=\"wl wl-kjv\" data-code=\"H4788\">misery,</span> the <span class=\"wl wl-kjv\" data-code=\"H3939\">wormwood</span> and the gall.","20":"My <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> hath them <span class=\"wl wl-kjv\" data-code=\"H2142\">still</span> in <span class=\"wl wl-kjv\" data-code=\"H2142\">remembrance,</span> and is humbled","21":"This I <span class=\"wl wl-kjv\" data-code=\"H7725\">recall</span> to my <span class=\"wl wl-kjv\" data-code=\"H3820\">mind,</span> therefore have I hope.","22":"It is of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercies</span> that we are not <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed,</span> because his <span class=\"wl wl-kjv\" data-code=\"H7356\">compassions</span> fail","23":"They are <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> every <span class=\"wl wl-kjv\" data-code=\"H1242\">morning:</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> is thy faithfulness.","24":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is my <span class=\"wl wl-kjv\" data-code=\"H2506\">portion,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul;</span> therefore will I hope","25":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto them that <span class=\"wl wl-kjv\" data-code=\"H6960\">wait</span> for him, to the <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> that seeketh","26":"It is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> that a man should both <span class=\"wl wl-kjv\" data-code=\"H3175\">hope</span> and quietly <span class=\"wl wl-kjv\" data-code=\"H1748\">wait</span> for the <span class=\"wl wl-kjv\" data-code=\"H8668\">salvation</span> of the LORD.","27":"It is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> for a <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> that he <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> > before the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the most High,","36":"To <span class=\"wl wl-kjv\" data-code=\"H5791\">subvert</span> a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> in his <span class=\"wl wl-kjv\" data-code=\"H7379\">cause,</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> approveth","37":"Who is he that <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> and it cometh to pass, when the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> commandeth","38":"Out of the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the most <span class=\"wl wl-kjv\" data-code=\"H5945\">High</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">proceedeth</span> not <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> and good?","39":"Wherefore doth a <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H596\">complain,</span> a <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> for the punishment of his sins?","40":"Let us <span class=\"wl wl-kjv\" data-code=\"H2664\">search</span> and <span class=\"wl wl-kjv\" data-code=\"H2713\">try</span> our <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and turn <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to the LORD.","41":"Let us lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> our <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> with our <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> unto <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> in the heavens.","42":"<span class=\"wl wl-kjv\" data-code=\"H5168\">We</span> have <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressed</span> and have <span class=\"wl wl-kjv\" data-code=\"H4784\">rebelled:</span> thou hast not pardoned.","43":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H5526\">covered</span> with <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and <span class=\"wl wl-kjv\" data-code=\"H7291\">persecuted</span> us: thou hast <span class=\"wl wl-kjv\" data-code=\"H2026\">slain,</span> thou hast not pitied.","44":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H5526\">covered</span> thyself with a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud,</span> that our <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> should not pass through.","45":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> us as the <span class=\"wl wl-kjv\" data-code=\"H5501\">offscouring</span> and <span class=\"wl wl-kjv\" data-code=\"H3973\">refuse</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of the people.","46":"All our <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> have <span class=\"wl wl-kjv\" data-code=\"H6475\">opened</span> their mouths","47":"<span class=\"wl wl-kjv\" data-code=\"H6343\">Fear</span> and a <span class=\"wl wl-kjv\" data-code=\"H6354\">snare</span> is come upon us, <span class=\"wl wl-kjv\" data-code=\"H7612\">desolation</span> and destruction.","48":"Mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> runneth <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with <span class=\"wl wl-kjv\" data-code=\"H6388\">rivers</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> for the <span class=\"wl wl-kjv\" data-code=\"H7667\">destruction</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of my people.","49":"Mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> trickleth <span class=\"wl wl-kjv\" data-code=\"H5064\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"H1820\">ceaseth</span> not, without any intermission,","50":"Till the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> look <span class=\"wl wl-kjv\" data-code=\"H8259\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> from heaven.","51":"Mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> <span class=\"wl wl-kjv\" data-code=\"H5953\">affecteth</span> mine <span class=\"wl wl-kjv\" data-code=\"H5315\">heart</span> because of all the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of my city.","52":"Mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> <span class=\"wl wl-kjv\" data-code=\"H6679\">chased</span> me <span class=\"wl wl-kjv\" data-code=\"H6679\">sore,</span> like a <span class=\"wl wl-kjv\" data-code=\"H6833\">bird,</span> without cause.","53":"They have cut <span class=\"wl wl-kjv\" data-code=\"H6789\">off</span> my <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> in the <span class=\"wl wl-kjv\" data-code=\"H953\">dungeon,</span> and <span class=\"wl wl-kjv\" data-code=\"H3034\">cast</span> a stone","54":"<span class=\"wl wl-kjv\" data-code=\"H4325\">Waters</span> flowed <span class=\"wl wl-kjv\" data-code=\"H6687\">over</span> mine <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span> then I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I am cut off.","55":"I <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> out of the <span class=\"wl wl-kjv\" data-code=\"H8482\">low</span> dungeon.","56":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> my <span class=\"wl wl-kjv\" data-code=\"H6963\">voice:</span> <span class=\"wl wl-kjv\" data-code=\"H5956\">hide</span> not thine <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> at my <span class=\"wl wl-kjv\" data-code=\"H7309\">breathing,</span> at my cry.","57":"Thou drewest <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that I <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> upon thee: thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst,</span> Fear","58":"O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H7378\">pleaded</span> the <span class=\"wl wl-kjv\" data-code=\"H7379\">causes</span> of my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul;</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemed</span> my life.","59":"O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> my <span class=\"wl wl-kjv\" data-code=\"H5792\">wrong:</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> thou my cause.","60":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> all their <span class=\"wl wl-kjv\" data-code=\"H5360\">vengeance</span> and all their imaginations","61":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> their <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and all their imaginations","62":"The <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> of those that rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> against me, and their <span class=\"wl wl-kjv\" data-code=\"H1902\">device</span> against me all the day.","63":"<span class=\"wl wl-kjv\" data-code=\"H5027\">Behold</span> their sitting <span class=\"wl wl-kjv\" data-code=\"H3427\">down,</span> and their rising <span class=\"wl wl-kjv\" data-code=\"H7012\">up;</span> I am their musick.","64":"<span class=\"wl wl-kjv\" data-code=\"H7725\">Render</span> unto them a <span class=\"wl wl-kjv\" data-code=\"H1576\">recompence,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of their hands.","65":"<span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> them <span class=\"wl wl-kjv\" data-code=\"H4044\">sorrow</span> of <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> thy curse","66":"<span class=\"wl wl-kjv\" data-code=\"H7291\">Persecute</span> and <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> them in <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> from under the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> of the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Aleph","tekst":"In dit hfdst. zijn doorgaans drie verzen na elkander met dezelfde letter beginnende; zie boven Lam 1:1 ."},{"catchword":"Ik ben de man,","tekst":"De profeet spreekt hier van zichzelven alleen niet onder den naam van een man, maar van de gehele kerk, die maar een lichaam uitmaakt."},{"catchword":"Zijner verbolgenheid","tekst":"Te weten des Heeren; vergelijk Isa 10:5 ."}],"2":[{"catchword":"in de duisternis,","tekst":"Dat is, in grote ellenden en zwarigheden; zie Gen 15:12 . Alzo betekent licht hier groten welstand; zie Psa 27:1 ."}],"3":[{"catchword":"Zijn hand","tekst":"Dat is, plaag, straf. Zie Psa 32:4 ."},{"catchword":"veranderd","tekst":"Of, omgekeerd; de zin is: Nu slaat Hij mij met die hand, met welke Hij mij tevoren heeft beschut en beschermd. In een woord: Hij stelt zich geheel anders tegen mij dan Hij placht te doen; zie de aantekening Psa 77:11 ."}],"4":[{"catchword":"Hij heeft mijn vlees en mijn huid oud gemaakt,","tekst":"Dat is, de tekenen van zijn zware hand tegen mij, vanwege mijne zonden, blijken daaraan, dat mijn vlees vergaat en mijne huid verrimpelt."},{"catchword":"beenderen gebroken","tekst":"Dat is, Hij heeft mij al mijne kracht benomen. Zie ook boven Lam 1:13 , en Psa 6:3-4 , en Psa 32:3 , en Psa 51:10 , en Psa 141:7 ; Isa 38:13 ."}],"5":[{"catchword":"heeft tegen mij gebouwd,","tekst":"Dat is, Hij heeft mij rondom bezet en besloten als met bolwerken der ellenden, zodat ik zijn hand niet kan ontkomen of tegenstaan; zie Job 10:17 ."},{"catchword":"galle en moeite omringd","tekst":"De gal betekent, vanwege hare bitterheid, grote ellenden en kwaad, dat den mensen overkomt, alzo vs.19; Jer 8:14 , en Jer 9:15 , en Jer 23:15 ; zie Psa 69:22 ."}],"6":[{"catchword":"Hij heeft mij gezet","tekst":"Dat is, Hij heeft mij in grote zwarigheden gebracht; zie vs.2; Eze 37:13 . Anderen verstaan dit van de gevangenis, waarin Jeremia heeft gesloten gelegen. Anderen verstaan het van de graven."},{"catchword":"als degenen,","tekst":"Hebreeuws, als de doden der eeuwigheid; dat is gelijk degenen, die over langen tijd gestorven en nu al vergeten zijn; vergelijk Psa 88:5-7 , en Psa 143:3 , en de aantekening aldaar."}],"7":[{"catchword":"mij toegemuurd,","tekst":"Zie Job 19:8 ; zie ook boven vs.5, en onder vs.9."},{"catchword":"mijn koperen boeien verzwaard","tekst":"Of, mijn stalen boeien. Anders, mijn ijzers; dat is, Hij heeft mijne ellenden, die mij omsingelen, van tijd tot tijd meer en meer vergroot."}],"8":[{"catchword":"sluit Hij","tekst":"Of, Hij sluit mijn gebed uit; dat is, Hij neemt mijn gebed niet aan, immers gevoel ik geen verlichting; vergelijk Psa 22:2 , en Psa 77:8 , enz."}],"9":[{"catchword":"Hij heeft mij wegen toegemuurd","tekst":"Dat is, Hij heeft mij alle wegen van uitkomst afgestopt met onoverwinnelijke verhindernissen; zie Num 22:24 ; Job 19:8 , en Hos 2:5 ."},{"catchword":"uitgehouwen stenen,","tekst":"Of, gesnedene; zie 1Ch 22:2 ; zie ook Isa 9:9 ."},{"catchword":"heeft mijn paden verkeerd","tekst":"Dat is, Hij heeft al mijne aanslagen teniet gemaakt, die ik voorgenomen had tot mijne verlossing. Het is enerlei zin met vs.5, 7."}],"10":[{"catchword":"Hij is mij een loerende beer,","tekst":"Of, Hij heeft op mij geloerd als een beer, enz.; vergelijk Job 10:16 ; Isa 38:13 ; Hos 5:14 , en Hos 13:8 ; Amo 5:19 ."},{"catchword":"een leeuw in verborgen plaatsen","tekst":"Een leeuw, schuilende in zijn hol en loerende op de mensen of beesten, die voorbijgaan, om die te betrappen en te verslinden. Zie deze gelijkenis ook Hos 5:14 , en Hos 13:7 ."}],"11":[{"catchword":"Hij heeft mijn wegen afgewend;","tekst":"Dat is, Hij heeft mijne daden geheel tot een ander einde gewend dan ik gemeend had. Anders: Als mijne wegen wederspannig [of afwijkende] zijn, zo verbreekt of verscheurt Hij mij."},{"catchword":"en Hij heeft mij","tekst":"Dat is, Hij heeft zo den kerkestand als de politie verscheurd en te schande gemaakt."},{"catchword":"in stukken gebroken;","tekst":"Gelijk een schaap, dat in de klauwen der leeuwen of der beren vervalt."},{"catchword":"Hij heeft mij woest gemaakt","tekst":"Dat is, Hij heeft mij beroofd van mijne vrienden, goederen en alle behulpzame middelen, zodat ik niets behouden heb."}],"12":[{"catchword":"Hij heeft Zijn boog","tekst":"Dat is, Hij heeft zijne wapenen tegen mij bereid om gestrengelijk met mij te handelen. Gode worden hier en elders figuurlijkerwijze, stoffelijke wapenen toegeschreven. Zie Jdg 7:20 ; Job 16:12 ; Psa 21:13 ; Hab 3:9 , Hab 3:11 ; Isa 27:1 , en Isa 34:5-6 ."},{"catchword":"gespannen,","tekst":"Hebreeuws, getreden; zie Psa 7:13 , en Lam 2:4 ."},{"catchword":"Hij heeft mij den pijl","tekst":"Zie Job 16:12 , en vergelijk Job 7:20 ; zie ook Psa 64:4 ."}],"13":[{"catchword":"Zijn pijlen","tekst":"Hebreeuws, de zonen, of kinderen van zijn pijlkoker; zie Job 6:4 . Daarom worden de pijlen aldus genoemd omdat zij in den pijlkoker besloten zijn; Psa 127:4-5 , worden ook de zonen bij pijlen vergeleken."},{"catchword":"in mijn nieren doen ingaan","tekst":"Dat is, Hij heeft de pijlen zijner plagen doen gaan tot in de binnenste delen mijns lichaams en mijner ziel. Zie Job 16:13 , en Job 19:27 ; Psa 139:13 ."}],"14":[{"catchword":"al mijn volk","tekst":"Te weten al dengenen, die mijne vrienden en bekenden geweest zijn; inzonderheid dengenen, die afgevallen zijn vanwege deze zware ellenden, die Gij, Heere, ons toeschikt."},{"catchword":"tot belaching geworden,","tekst":"Dat is, een stof van belaching en bespotting."},{"catchword":"snarenspel","tekst":"Hebreeuws, snarenslaging. De zin is: Zij dichten liedjes van mij en hebben hun genoegen daarin, dat zij mij dagelijks in hunne liedjes mijne ellende verwijten en voorwerpen; zie Job 17:6 , en Job 30:9 , en Psa 69:13 , en onder vs.63; vergelijk Deu 28:37 ."}],"15":[{"catchword":"met bitterheden verzadigd,","tekst":"Of met grote bitterheid, of met gans bittere spijs; dat is met groten angst, kruis en droefheid; zie boven vs.5, en onder vs.19."},{"catchword":"Hij heeft mij met alsem dronken gemaakt","tekst":"Te weten, de Heere heeft mij, door de veelheid van droefenissen en smarten, schier van mijne zinnen en verstand beroofd."}],"16":[{"catchword":"Hij heeft mijn tanden","tekst":"Dat is, Hij heeft mij zulk brood te eten gegeven, dat vol zandstenen was, hetwelk mij de tanden gebroken heeft; zie Pro 20:17 ."},{"catchword":"Hij heeft mij in de as nedergedrukt","tekst":"Dat is, Hij heeft mij tot den allernederigsten en verachtelijksten staat gebracht."}],"17":[{"catchword":"mijn ziel","tekst":"Dat is, allen welstand en vreugde hebt Gij, o Heere, ver van mijn hart weggedaan."},{"catchword":"ik heb het goede vergeten","tekst":"Hij wil zeggen: Ik heb nu zolang in ellende geleefd, dat ik vergeten heb wat welstand en geneugte is; mij heugen geen goede dagen meer."}],"18":[{"catchword":"Mijn sterkte","tekst":"Te weten, om deze ellende langer te kunnen dragen."},{"catchword":"mijn hoop van den HEERE","tekst":"Te weten, dat ik van dezelve eenmaal zou kunnen verlost worden, gelijk ik van den Heere gehoopt had."}],"19":[{"catchword":"Gedenk aan mijn ellende","tekst":"Anders: gedenkende, of als ik gedacht."},{"catchword":"ballingschap,","tekst":"Vergelijk boven Lam 1:7 ."},{"catchword":"aan den alsem en galle","tekst":"Dat is, aan de bitterheid, die daarin was. Zie vs.5, 15."}],"20":[{"catchword":"gedenkt er wel terdege aan,","tekst":"Hebreeuws, gedenkende gedenkt er mijne ziel aan; dat is, zij overdenkt en overlegt wel ernstiglijk de ellenden, die mij zijn overkomen vanwege mijne zonden."},{"catchword":"zij bukt zich neder in mij","tekst":"Zij wordt er door vernederd en gedwee gemaakt."}],"21":[{"catchword":"Dit zal ik mij ter harte nemen,","tekst":"Alsof hij zeide: Als ik deze dingen, [te weten die straks zullen verhaald worden] wel overweg, zo zal ik daaruit besluiten dat God mij nog eindelijk zal genadig zijn."}],"22":[{"catchword":"Het zijn de goedertierenheden des HEEREN,","tekst":"Dat is, het is aan de overvloeiende genade Gods toe te schrijven."},{"catchword":"dat Zijn barmhartigheden","tekst":"Dat is, dat Hij ons nu nog zijne genade bewijst."}],"23":[{"catchword":"Zij zijn allen morgen nieuw,","tekst":"Zie Psa 73:14 . De zin is: Wij gevoelen alle dagen nieuwe bewijzen uwer goedertierenheid te onswaarts."},{"catchword":"Uw trouw is groot","tekst":"O Heere, uwe trouw is groot in het volbrengen uwer beloften; 1Co 10:13 ; 2Ti 2:13 ."}],"24":[{"catchword":"De HEERE is mijn Deel,","tekst":"De Heere is het, die mij aan ziel en aan lichaam onderhoudt, zijnde in alle manier voor mij genoegzaam, Gen 17:1 ; Psa 16:5 , en Psa 73:26 ; Jer 10:16 ."},{"catchword":"zegt mijn ziel,","tekst":"Dat is, ik ben in mijn hart daarvan genoegzaam verzekerd; zie de aantekening Psa 16:5 , en Psa 18:3 , en Psa 73:25-26 ; Rom 8:38 ."}],"25":[{"catchword":"die Hem verwachten,","tekst":"Dat is, die vastelijk zich op Hem verlaten en met waar geloof op Hem vertrouwen."},{"catchword":"der ziele,","tekst":"Dat is, den mens, die zich van ganser harte benaarstigt om God te genaken door de middelen, die Hij verordineerd heeft om tot zijne kennis te komen."}],"26":[{"catchword":"Het is goed,","tekst":"Hij is gelukkig, die zijne hoop vast op den Heere gesteld heeft en in stilheid verlossing van den Heere is verwachtende; zie Psa 37:7 ; zie ook Isa 30:7 . Anders: het is goed als men smart lijdt, dat men stil zij, enz."},{"catchword":"op het heil des HEEREN","tekst":"Dat is, op de verlossing, die de Heere bewijst dengenen, die op Hem vertrouwen."}],"27":[{"catchword":"voor een man,","tekst":"Dat is, voor een iegelijk. Anderen verstaan door man een voortreffelijken man."},{"catchword":"dat hij het juk","tekst":"Dat is, dat hij kruis en tegenspoed lijdt, en zich der tucht onderwerpt, opdat zijn boze en verdorven natuur getoomd en getemd worde; vergelijk Psa 119:71 ."},{"catchword":"in zijn jeugd draagt","tekst":"Eer de zonde te diep in zijn hart wortele en ten enemale over hem heerse."}],"28":[{"catchword":"Hij","tekst":"Te weten, die het juk in zijne jeugd heeft leren dragen. Anders: hij zal zitten, enz., of, [dat] hij zitte."},{"catchword":"zitte eenzaam,","tekst":"Hij neme het kruis in zijne enigheid stil op, zonder groot gebaar te maken, gedachtig zijnde dat het de Heere hem tot zijn best heeft opgelegd; zie Psa 39:10 ."},{"catchword":"Hij het hem opgelegd heeft","tekst":"Te weten de Heere."}],"29":[{"catchword":"Hij steke zijn mond","tekst":"Dat is, hij werpe zichzelven zeer deemoediglijk ter aarde voor het aanschijn Gods, bekennende dat Hij hem met gerechtigheid al die ellende oplegt; vergelijk 1Co 14:25 ; Job 42:6 ; Psa 22:16 , Psa 22:30 ; het tegendeel zie Psa 73:8-9 ."},{"catchword":"Misschien is er verwachting","tekst":"Alsof hij zeide: Ofschoon ik geen uitkomst zie, alle middelen mij omstaande en de hand des Heeren dus zwaar op mij zijnde, nochtans zal ik hopen, vertrouwende dat God mij toch eindelijk zijne genade zal laten smaken. Het woord misschien betekent niet altoos twijfeling of onzekerheid, maar ook dikwijls ene vertroosting of aanporring in zwaarwichtige zaken; gelijk Jos 14:12 . Zie de aantekening Joe 2:14 ."}],"30":[{"catchword":"Hij geve zijn wang dien,","tekst":"Dat is, dat hij met geduld aanneme de slagen en plagen, die hem de mensen onverdiend of zonder wettelijke oorzaak aandoen."},{"catchword":"hij worde zat van smaad","tekst":"Zie Job 7:4 . Het is hier te zeggen, met geduld allerlei kwaad verdragen."}],"31":[{"catchword":"Want de HEERE","tekst":"De zin is: Ofschoon God de Heere somtijds een tijdlang zijne goedertierenheid zijnen kinderen schijnt te onttrekken, nochtans zal zulks niet altijd duren. Zie 1Co 10:13 . Zie dergelijke spreuken Psa 30:6 , en Psa 73:24 , en Psa 126:5-6 , en Psa 130:7 , en Psa 135:14 ; Isa 27:6-8 , en Isa 54:7-8 ; Jer 10:24 , en Jer 30:11 , en Jer 46:28 ; Hab 3:2 ; 2Co 4:17 ; 1Pe 1:6 ."}],"32":[{"catchword":"naar de grootheid Zijner goedertierenheden","tekst":"Of, naar de veelheid, z.g.; dat is, zijne goedertierenheid is zonder einde."}],"33":[{"catchword":"des mensenkinderen","tekst":"Hebreeuws, des mans kinderen, mans voor mensen; zie Job 12:10 ."},{"catchword":"niet van harte","tekst":"Hebreeuws, niet uit zijn hart; dat is, Hij heeft er geen lust aan, maar de zonden der mensen zijn de oorzaken daarvan; vergelijk Isa 28:21 . En als Hij zijne kinderen kastijdt, dat doet Hij om hen van zondigen af te trekken."}],"34":[{"catchword":"Dat men al de gevangenen der aarde","tekst":"De zin is: Ofschoon de Heere dikwijls de tirannen als roeden gebruikt, zo heeft Hij nochtans daar geen welgevallen aan, dat men al degenen, die door de macht en het geweld in de gevangenis geworpen zijn, zou zonder aanzien van personen en daden te schande maken. Zie Psa 109:16 ; Zec 1:15 ; Luk 6:36 ."},{"catchword":"verbrijzelt;","tekst":"Dat is, vertreedt. Zie voorbeelden hiervan, Jos 10:24 , en vergelijk Job 5:4 ; Psa 143:3 , en Psa 44:20 ."}],"35":[{"catchword":"buigt","tekst":"Dat is, vertrekt, verwijlt, hetzij door valse getuigen of andere onbetamelijke middelen; zie een voorbeeld Luk 18:4 , en vergelijk Exo 23:6-7 ; Deu 16:19 ; 2Ch 19:6-7 ."}],"36":[{"catchword":"verongelijkt","tekst":"Hetzij door geweld, gezag of arglistigheid. Hebreeuws, verkeert."},{"catchword":"twistzaak;","tekst":"Of rechtvordering, proces."},{"catchword":"zou het","tekst":"Zou er de Heere geen acht op geven?"},{"catchword":"de HEERE niet zien?","tekst":"Die rechtvaardig is; zie Psa 11:7 , en vergelijk Psa 94:5-6 , enz."}],"37":[{"catchword":"Wie zegt wat,","tekst":"Welk creatuur in den hemel of op de aarde kan met zekerheid zeggen dat zulks zal geschieden, daar het toch niet kan geschieden, tenzij dat het den Heere belieft het te doen? De voorzienige regering Gods strekt zich over alle dingen, die er geschieden in den hemel of op de aarde."}],"38":[{"catchword":"Gaat niet uit","tekst":"Is het niet God, die alle dingen in zijn raad besluit, ordineert en in het werk stelt?"},{"catchword":"den mond des Allerhoogsten","tekst":"Dat is, besluit of bevel; zie Gen 41:40 ."},{"catchword":"het kwade en het goede?","tekst":"Hebreeuws, kwaden. De zin is: Alle tegenspoed en voorspoed, die den mens overkomt; zie Amo 3:6 ."}],"39":[{"catchword":"Wat klaagt dan een levend mens?","tekst":"De zin is: Dewijl de mens bij zichzelven genoegzaam overtuigd is waarom God zijne straffen over hem laat komen; te weten om zijner zonden wil; waarom kwelt hij zich en klaagt inplaats van raad te zoeken? Waarom ziet hij meer op zijne ellende dan op de oorzaken derzelve?"},{"catchword":"zonden","tekst":"Te weten met welke hij de slaande hand Gods op zijn hals gehaald heeft, en hij bidt die af, opdat hij daarvan verlost en bevrijd worde."}],"40":[{"catchword":"wegen onderzoeken en doorzoeken,","tekst":"Dat is, onze gedachten, woorden en werken, gedenkende wat dezelve wel verdiend hebben naar de weegschaal van Gods rechtvaardig oordeel."},{"catchword":"laat ons wederkeren tot den HEERE","tekst":"Hebreeuws eigenlijk: laat ons wederkeren tot den HEERE toe; dat is, laat ons hartelijk berouw hebben vanwege onze menigvuldige zonden en om vergiffenis van dezelve bidden, met een vast vertrouwen van het te zullen verkrijgen en met een voornemen van ons leven voortaan te beteren; vergelijk Hos 14:2 ; Joe 2:12 ; 2Co 7:9 ."}],"41":[{"catchword":"mitsgaders de handen,","tekst":"Anders: tot de wolken; zie de aantekening Job 36:32 ."},{"catchword":"tot God in den hemel,","tekst":"Die alleen kan en wil vergeven de zonden der boetvaardige zondaren."}],"42":[{"catchword":"daarom hebt Gij niet gespaard","tekst":"Versta hierbij, maar Gij hebt ons wel dapper gekastijd, te weten zolang wij volhard hebben in onze zonden en overtredingen."}],"43":[{"catchword":"Gij hebt ons met toorn bedekt,","tekst":"Eigenlijk naar de Hebreeuwse letter: Gij hebt ons met toorn, als met ene tent overdekt, of Gij hebt ons overtent, of overhut; zie Psa 5:12 ."},{"catchword":"vervolgd;","tekst":"Te weten met uw rechtvaardige oordelen, overal waar wij heengingen."},{"catchword":"Gij hebt niet verschoond","tekst":"Gij hebt geen medelijden gehad over ons noch over onze kinderen, zie boven Lam 2:2 , Lam 2:17 ."}],"44":[{"catchword":"met een wolk bedekt,","tekst":"Als met een scheidsmuur; vergelijk Isa 59:1-2 ."},{"catchword":"zodat er geen gebed doorkwam","tekst":"Zodat ons gebed voor uw aangezicht niet kon komen."}],"45":[{"catchword":"tot een uitvaagsel en wegwerpsel gesteld,","tekst":"Of, tot ene afschuring; dat is, tot zulk ene vuiligheid of onreinigheid, die men afschuurt; dat is, tot zulke mensen, waar men een afkeer of afschuw van heeft; vergelijk 1Co 4:13 ."},{"catchword":"volken","tekst":"Over wie wij eertijds geheerst hebben."}],"46":[{"catchword":"hebben hun mond tegen ons opgesperd","tekst":"Zij hebben vrijmoediglijk uitgebazuind al wat zij bedenken konden, dat het enigszins was tot onze oneer strekkende. Zie boven Lam 2:16 , en vergelijk Psa 22:14 ."}],"47":[{"catchword":"De vreze en de kuil zijn over ons gekomen,","tekst":"Vergelijk Psa 11:6 ; Isa 24:17 ; Jer 48:43 . De zin is: Wij zijn in een ellendigen staat, in groten schrik en benauwdheid, en wij zien gene uitkomst."},{"catchword":"de verwoesting en de verbreking","tekst":"Te weten zijn over ons gekomen."}],"48":[{"catchword":"Met waterbeken loopt mijn oog neder,","tekst":"Dat is, daar komt zulk een overvloed van tranen uit mijne ogen, alsof zij geheel in water versmolten waren; vergelijk Lam 1:16 ."},{"catchword":"waterbeken","tekst":"Zie Psa 1:3 ."},{"catchword":"der dochter mijns volks","tekst":"Dat is, van mijn volk, hetwelk ik bemin als mijne dochter, gelijk Lam 1:6 ; zie ook Lam 2:11 , Lam 2:13 ."}],"49":[{"catchword":"vliet,","tekst":"Te weten van tranen. Anders: wordt vlietende."},{"catchword":"geen rust is;","tekst":"De grote ellende van de dochter mijns volks houdt niet op."}],"50":[{"catchword":"Totdat het","tekst":"Dat is, totdat de HEERE metterdaad doet blijken dat Hij ons gunstig is. Zie boven vs.8; idem vs.43, 44, en Lam 2:1 ."},{"catchword":"de HEERE van den hemel aanschouwe,","tekst":"Aldus noemt ook de apostel Paulus den Heere Christus; 1Co 15:47 ."},{"catchword":"het zie","tekst":"Te weten mijne ellende."}],"51":[{"catchword":"Mijn oog","tekst":"Dat is, de ellende, die ik met mijne ogen aanschouw."},{"catchword":"doet mijn ziele moeite aan,","tekst":"Of, werkt in mijne ziel; dat is, beweegt mijne ziel, of doet mijne ziel wee. Of verteert mijne ziel."},{"catchword":"vanwege al de dochteren mijner stad","tekst":"Die namelijk van de vijanden zijn geschonden en gevankelijk weggevoerd. Zie onder Lam 5:11 . Anders: boven al de dochteren mijner stad; dat is, meer dan enige vrouwspersonen gewoon zijn te doen over hetgeen zij allermeest beminnen."}],"52":[{"catchword":"zonder oorzaak,","tekst":"Dat is, zonder dat ik hun ooit enig kwaad heb gedaan of gezocht te doen. Of zonder dat zij enig voordeel daarvan hebben te verwachten; zie Psa 35:7 , en Psa 69:5 , en Psa 109:3 , en Psa 119:161 ."},{"catchword":"als een vogeltje","tekst":"Dat is, gelijk een vogelvanger de vogeltjes zoekt te vangen; vergeljk Psa 11:1 , en Psa 102:8 , en Psa 124:7 ; Ecc 9:12 ."},{"catchword":"dapperlijk gejaagd","tekst":"Te weten om mij ten enenmale ten verderve te brengen. Hebreeuws, jagende gejaagd."}],"53":[{"catchword":"Zij hebben","tekst":"Te weten de vijanden, waarvan vs.52 gesproken is."},{"catchword":"mijn leven in een kuil uitgeroeid,","tekst":"Dat is, mij in eigen persoon. De zin is: Zij hebben mij niet alleen gevangen genomen, [hetwel waarlijk geschied is aan den persoon van Jeremia, Jer 37:16 , en Jer 38:6 ] , maar zij hebben ook grote wreedheid gebruikt, pogende mij het leven te benemen. Vergelijk Gen 37:24 ."},{"catchword":"een steen","tekst":"Het zij om den mond des grafs toe te sluiten, opdat ik er niet kon uitkomen, of om mij te versmachten en te doden."},{"catchword":"op mij geworpen","tekst":"Dat is, op het graf, waarin ik lig, of voor de deur des puts, waarin zij mij gesloten hebben. Vergelijk Jos 10:18 ; Dan 6:18 ; Mat 27:60 ."}],"54":[{"catchword":"De wateren zwommen over mijn hoofd;","tekst":"Versta hier door de wateren vele en grote ellenden; zie Psa 69:2-3 , en Psa 124:4-5 . De profeet spreekt in den persoon van Gods volk, doch alzo dat hij somtijds [als een lid van Gods volk] zijn lijden voorstelt, dat hem was overkomen, en de genade, die hem God bewezen had, zijnde een voorbeeld en vertroosting voor Gods volk."},{"catchword":"ik zeide","tekst":"Ik beeldde mijzelven in en sprak."},{"catchword":"Ik ben afgesneden","tekst":"Het is ten enenmale met mij gedaan, ik zie geen middel van verlossing, maar veel meer het tegendeel; vergelijk Psa 31:23 , met de aantekening."}],"55":[{"catchword":"uit den ondersten kuil","tekst":"Hebreeuws, uit den kuil der benedenheden; dat is, toen ik in de uiterste benauwdheid was; zie Psa 88:7 ;, en Psa 120:1 ."}],"56":[{"catchword":"Gij hebt mijn stem gehoord,","tekst":"Dat is, Gij hebt mij gegeven hetgeen waar ik U om gebeden heb."},{"catchword":"verberg Uw oor niet","tekst":"Weiger toch voortaan niet, acht te geven op mijn ijverig en hartgrondelijk gebed."},{"catchword":"voor mijn zuchten,","tekst":"Anders: opdat ik adem moge scheppen."}],"57":[{"catchword":"genaderd","tekst":"Dat is, uw gunstige hulp laten smaken, hetwelk Gij mij zo duidelijk hebt te kennen gegeven, alsof Gij met uitgedrukte woorden tot mij gezegd hadt: vrees niet; Isa 41:10 ."}],"58":[{"catchword":"Gij hebt de twistzaken mijner ziel getwist,","tekst":"Dat is, Gij hebt mij beschermd en verlost, als men mij zocht te doden. Vergelijk Jer 38 ; zie ook Psa 35:1 ."},{"catchword":"Gij hebt mijn leven verlost","tekst":"Dat is, Gij hebt mij verlost uit de handen dergenen, ody] (that) have seen misery by the road of his indignation, [to wit, the Lords indignation. Compare Isa. 10.5.]"}],"2":[{"catchword":null,"tekst":"ALEPH. He hath led me, and carried (me into) darkness, [That is, into great afflictions and troubles. See Genes. 15. On vers. 12. So the word light in the sequel, signifieth great prosperity. See Psal. 27. On vers. I.] and not (into) light."}],"3":[{"catchword":null,"tekst":"ALEPH. He hath indeed turned himself against me, he hath changed [Or turned] his hand [that is, plague, punishment. See Psal. 32.4.] against me all the day. [The meaning is, he before defended and protected me. In brief, he demeaneth himself quite otherwise towards me then he was wont to do. See Psal.7.7. the Annotat. on vers.11.]"}],"4":[{"catchword":null,"tekst":"BETH. He hath made my flesh and my skin old, [That is, the tokens of his heavy hand against me for my sins, appear herein, that my flesh decayeth, and my skin is wrinkled] he hath broken my bones. [that is, he hath taken away all my strength. [Se also above chap. I. 13. and Psal. 6.3, 4. and 32. 3. and 51. 19. and 141 . 7. Isa. 38. 13.]"}],"5":[{"catchword":null,"tekst":"BETH. He hath builded against me, [That is, he hath beset and inclosed me around about, as it were with bulwarks of afflictions, so that I am not able to escape or resist his hand. See Job 10. on vers. 17.] and he hath compassed (me with) gall and trouble. [Gall, by reason of its bitterness, signifieth great miseries and afflictions that do befall men. So vers. 19. and Jerem. 8.14. and 9.15. and 23.15. See Psal. 69. on vers. 22.]"}],"6":[{"catchword":null,"tekst":"BETH. He hath set me in dark places. [That is, he hath brought me into great troubles. See ver.2. and Ezek. 37.13. Others understand this of the prison wherein Jeremiah had been shut up. Othes understand it of the graves] as they that are dead long ago. [Heb. as the dead of eternity; that is, as those that are dead long ago, and are now quite forgotten. Compare Psal. 88. 5, 6, 7. and Psal. 143.3. and the Annotat, there.]"}],"7":[{"catchword":null,"tekst":"GIMEL. He hath waled me in [See Job 19. on vers. 8. See also above vers.5.] that I cannot go out: he hath made my copper fetters heavy. [Or, my steel fetters, c. Others, my iron fetters. That is, he hath made my afflictions, that do compass me abot from time to time, greater and greater."}],"8":[{"catchword":null,"tekst":"GIMEL. Also when I call and cry, he shutteth (the ears against) my prayer. [Or, he shutteth out my prayer; that is he accepteth not my prayers; at least I feel no ease at all. Compare Psal. 22. 1. and 77.8, & c."}],"9":[{"catchword":null,"tekst":"GIMEL. He hath walled up my wayes with hewn stones, [Or, carved stones. See I Chron. 22. on vers.2. See also Isa.9. on vers.9. and Job 19:8. Hos. 2.6. and Num 22:24. That is, he hath stopped up all wayes of escape by unavoidable, lets and hinderances] he hath perverted my paths. [That is, he hath frustrated all my designes, which I had intended for my deliverance. It is to the same sense with vers.5. and 7.]"}],"10":[{"catchword":null,"tekst":"DALETH. He is unto me a lurking bear, [Or, he lurked upon me as a bear, &c. compare Job chap.10.16. Isa. 38.13. Hos 5:14. and 13.8. Amos 5. 19.] a lion in hidden places. [A lion barking in his den. And lying in wait for men or beasts that pass b, yo catch and devour them. See thi similitude also Hos 5:14. and 13.7.]"}],"11":[{"catchword":null,"tekst":"DALETH. He hath turned aside my waies: [That is, he hath turned my actions to a clean contrary end then I intend them] and he hath broken in pieces; [as a sheep that falleth into the pawes of lions or of bears. That is, he hath rent and confounded both the Ecclesiastical and Political estate. Others, when my waies are rebellious (or, declining) then he breaketh, or teareth, me in pieces] he hath made me desolate. [That is, he hath deprived me of my friends, goods, estate, and all helpful means, so that I have nothing at all left.]"}],"12":[{"catchword":null,"tekst":"DALETH. He hath bent [Heb. troden. See Psal.7.13. and above chap.2.4.] his bowe, [that is, he hath prepared his weapons against me, to deal severely with me. Here and elsewhere in Scripture material weapons are ascribed unto God. See Judg.7.10. Job 16:12. Psal. 21.13. Habak. 3.9,11. Isa 27:1. and 34. 5,6.] and he hath set me as a biit for the arrow. [See Job 16:12. and compare Job 7:20. See also Psal. 64.4.]"}],"13":[{"catchword":null,"tekst":"HE. He hath caused his arrows [Heb, the sons, or children of his quiver. See Job 6. on vers. 4. Therefore are the arrows so called, because they are lockt up in the quiver. In Psal. 127.5. children are also compared unto arrows] to enter into my reins. [That is, he hath caused the arrows of his plagues to enter into the innermost parts of my body and foul. See Job 16. on vers. 13. and 19. on vers. 27.] Psal. 139. on vers. 13."}],"14":[{"catchword":null,"tekst":"HE. I am become a derision to all my people,] To wit, to all those that were my friends and acquaintance: especially to those that are fallen away, by reason of these sore afflictions which thou Lord hast sent among us] their musick play [that is, a matter of derision and scorn Heb. sluping, beating. The meaning is, they make songs of me, and take pleasure therein to upbraid and abuse me daily in their songs. See Job 17:6. and 30. on vers.9. and Psal.69.13. and below here vers.63. Compare Deut.28.37.] all the day."}],"15":[{"catchword":null,"tekst":"HE. He hath satisfied me with bitternesses. [Or, with great bitterness, or, with very bitter meat; that is, with great anguish, affliction, and sorrow. See above vers.5. and below vers.19.] he hath made me drunken with wormwood. [He, to wit, the Lotd, hath, by the multitude of griefs and sorrows, bereaved me of my senses and understanding.]"}],"16":[{"catchword":null,"tekst":"VAU. He hath broken my teeth to shivers with gravel-stone, [That is&acirc;&euro;&trade; he hath given me such ey are new every morning, [See Psal.73. on vers.14. the meaning is, we are daily sensible of new evidences of thy loving kindnesses towards us] thy faithfulness is great. [O Lord, thy faithfulness is great in performing thy promises.]"}],"24":[{"catchword":null,"tekst":"CHETH. The LORD is my pertion, [The Lord is he that sustaineth me both in body and soul, being every way sufficient for me, Genes.17.1. Psal.16.5. and 73.26. Jer 10:16.] saith my soul, [that is, I am thereof sufficient perswaded in mine heart. See Rom 8:32. and Psal.16. the Annotat. on vers.5. and Psal.8.3. and 73.25,26.] therefore will I hope in him. [Compare habak.2.3.]"}],"25":[{"catchword":null,"tekst":"TETH. The LORD is good unto them that want on him, [That is, that strongly rely on him, and trust in him with a true and lively faith] to the soul that seeketh him. [That is, to the man that endeavoureth with all his heart to draw near unto God by means which he himself hath ordained for to come to the knowledge of him.]"}],"26":[{"catchword":null,"tekst":"TETH. It is good for a man to hope, and to be quiet for the salvation of the LORD. [That is, upon the deliverance which the Lord sheweth to them that put their trust in him. He is happy that hath set his hope strongly upon the Lord, and in quietness looketh for deliverance from the Lord. See Psal.37. on vers.7. See also Isa 30:7. Others, it is good when a mana suffereth pain to be still, & c.]"}],"27":[{"catchword":null,"tekst":"TETH. It is good for a man [That is, for everyone. Others understand here by man an excellent man] that he bear the yoke [that is, that he suffer affliction and adversity, and submit himself unto discipline, that his wicked and corrupt nature may be bridled and tamed. Compare Psal.119.71.] in his youth. [Before sin be deeply rooted in his heart and bear full over him.]"}],"28":[{"catchword":null,"tekst":"JOD. Let him [To wit, he that hath learnt to bear the yoke in his yoke in his youth] sit solitary, [others, he shall, {"catchword":null,"tekst":"CAPH. For he doth nat plague, nor grieve the children of men [See Job 12. on vers.10.] from the heart. [Heb. from his heart. [That is, he taketh no delight in it: but the sins of men are the cause of it. Compare Isa.28. on vers.21. And when he correcteth his children, he doth it to draw them off from sinning.]"}],"34":[{"catchword":null,"tekst":"LAMED. That a man should crush under his feet all the pprisoners of the earth. [That is, trample upon them. See examples hereof, Jos.10.24. and compare Job 5:4. Psal. 143.3. and 44.20. The meaning is, though God often useth tyrants as his rods to correct his children, yet he hath no delight in it, that men should put to shame all them that by force and violence are cast into prison, without respect of persons and actions. See Psal.109.16. Zach.1.15. Luk 6:36.]"}],"35":[{"catchword":null,"tekst":"LAMED. That one should wrest the right of a man [That is, delay, put off his cause, either by false witnesses, or other undue means. See an example Luk 18:4. and compare Exo 23:6.7. Deut.10. 16,19.2 Chron.19.6,7.] before the face of the most High."}],"36":[{"catchword":null,"tekst":"LAMED. That one should wrong a man in his cause: [Or, law-bitterness, suit: whether by violence, authority, or subtility. Heb. pervert] would not the Lord [who is just. See Psal.11.7. and compare Psal.94.5,6. & c.] see it? [would not the Lord regard it?]"}],"37":[{"catchword":null,"tekst":"MEM. Who saith any thing that cometh to pass, (if) the Lord command (it) not? [What creature in heaven or on earth can certainly say, such a thing shall come to pass, unless the Lord be pleased to do it? The wise providence of God reacheth to all things that are done either in heaven or on earth.]"}],"38":[{"catchword":null,"tekst":"MEM. Doth not evil and good [Heb, evils. The meaning is. All adversity and prosperity that befalleth a man. See Amos 3.6.] proceed out of the mouth of the most High? [that is, decree, or command of God. See Genes.41. on vers.40. The meaning is, Is it not God, that in his eternal counsel decreeth, ordereth, and effecteth all things? Compare Isa. 45.7. Amos 3.6.]"}],"39":[{"catchword":null,"tekst":"MEM. Why (then) doth a living man complain? (let) every one (complain) because of his sins. [to wit, whereby he hath brought the punishing hand of God upon himself, and let him pray that he may be freed and delivered from it. The meaning is, In as- much as a man is sufficiently convinced in himself wherefore it is that God doth punish him, to wit, for his sins, why then doth he vex himself, and complain, instead of seeking for remedy? why doth he more look upon his affliction then upon the causes thereof?]"}],"40":[{"catchword":null,"tekst":"NUN. Let us search and examine our wayes, [That is, our thoughts, words, and works, remembering what the fame have duly deserved, according to the balance of Gods righteous judgement] and let us turn again to the LORD. [Heb, properly, let us turn again even unto the Lord. That is, let us have true hearty sorrow and repentance for our manifold sins, and pray for pardon of them, with a sure confidence of obtaining it, and with a firm resolution of amending our lives for time to come. Compare Hos 14:2. Joel 2. on vers.12. and 2 Cor.7.9.]"}],"41":[{"catchword":null,"tekst":"NUN. Let us lift up our heart together with (our) hands, unto God in heaven, [Who alone can and will pardon the sins of penitent sinners. Others, unto the clouds. See Job 36. the Annotat. on vers. 32.] (saying,)"}],"42":[{"catchword":null,"tekst":"NUN. We have transgressed, and we have been rebellious, (therefore) thou hast not spared. [Understand with all, but thou hast sorely chastised us; to wit, as long as we preserved in our sins and transgressions.]"}],"43":[{"catchword":null,"tekst":"SAMECH. Thou hast covered (us with) anger, [Properly according to the Hebrew letter, thou hast covered us over with anger as with a tent; thou hast over-tented or, over-hatted us. See Psal.5. ver. 12.] thou hast persecuted us; [to wit, with thy righteous judgements in all places wheresoever we went] thou hast slain (us) thou hast not pured. [thou hast had no compassion on us, nor on our little children. See above chap.2.2,17.]"}],"44":[{"catchword":null,"tekst":"SAMECH. Thou hast covered thy self with a cloud, [As with a partition-wall. Compare Isa 59:1,2.] So that no prayer passed through it. [So that our prayer could not come before thy face.]"}],"45":[{"catchword":null,"tekst":"SAMECH. Thou hast made us a sweeping away [Or, an off-scowring] and refuse [That is, such filth or uncleanness as men use to scour off; that is, as people lothed and abhorred. Compare I Cor.4.13.] in the midst of the nations. [Over whom we bare rule I former time.]"}],"46":[{"catchword":null,"tekst":"PE. All our enemies have opened their mouth against us [They have boldly belched out all that they could imagine might any wayes tend to our disgrace. See above chap.2.16. and compare Psal.22.14.]"}],"47":[{"catchword":null,"tekst":"PE. The fear and the pit are come upon us, [Compare Psal.11.6. and Isa 24:17. Jer 48:43. The meaning is, we are in a miserable condition, in great fear and distress, and we see no issue] desolation and breaking. [to wit, are come upon us]."}],"48":[{"catchword":null,"tekst":"PE. Mine eye runneth down (with) water-brooks, [That is, there cometh such plenty of tears out of mine eyes, as if they were quite dissolved into water. Compare chap.1.16. of water-brooks see Psal.1. on ver.3.] because of the breach of the daughter of my people. [that is, of my people whom I love a dearly as mine own daughter: as chap.1.6. see also chap.2.11,13.]"}],"49":[{"catchword":null,"tekst":"AIN. Mine eye floweth [To wit, with tears. Others, becometh flowing] and cannot cease, because there is no rest. [the great misery of the daughter of my people ceaseth not.]"}],"50":[{"catchword":null,"tekst":"AIN. Till the LORD [So doth the Apostle Paul also call the Lord Christ, I Cor.15.47.] behold (it) from heaven, [that is, till the LORD do make it appear indeed, that he is favourable to us. See above ver.8. also ver.43,44. and chap.2.1.] and see (it) [to wit, my misery.]"}],"51":[{"catchword":null,"tekst":"AIN. Mine eye [that is, the miseries which I behold with mine eyes] bringeth (trouble) to my soul, [or worketh in my soul; that is, moveth my soul, or paineth my soul, consumeth my soul] because of all the daughters of my city, [namely, which are defloured and carried away captive by the enemies. See below chap.5.11. Others, above all the daughters of my city. [that is, more then any women-kind are wont to be troubled about that which they most affect.]"}],"52":[{"catchword":null,"tekst":"TSADE. They that are mine enemies without cause [That is, whom I never wronged or sought to wrong: or who cannot look to take advantage by it. See Psal.35. on ver.7. and 69.5. and 109.3. and 119.161.] have chased me sorely [to wit, to bring me utterly to destruction. Heb. chasing have chased me] like a little bird. [that is, as a fowler seeketh to catch birds. Compare Psal.11.1. and 102.8. and 124.7. Ecc 9:12.]"}],"53":[{"catchword":null,"tekst":"TSADE. They [To wit, the enemies, whereof is spoken ver.52.] have cut off my life [that is, me in min own person] in a pit, [the meaning is, they have not onely taken me captive (which was truly done to the Prophet Jeremia, Jer 37:16. and chap.38.6.) but have also used great cruelty, endeavouring to take away my life. Compare Genes.37.24.] and they have cast a stone [either to shut the mouth of the grave, that I might not come forth, or to smother and kill me] upon me. [that is, upon the grave whereon I lie, at the door of the pit wherein they have shut me up. Compare Jos.10.18. Dan.6.18. Matt.27.10.]"}],"54":[{"catchword":null,"tekst":"TSADE. The waters sworn over mine head, [Understand here by the waters, many & great afflictions, See Psal.69. on ver.2,3. and Psal.124. ver.4,5. The Prophet speaketh here in the person of Gods people, yet so as that he sometimes (as a member of Gods people) setteth forth his own sufferings that befell him, and the mercy that God had shewn him, being an example and comfort unto the people of God] I said, [I imagined and spake] I am cut off. [I am utterly undone. I see no means of deliverance, but rather the contrary. Compare Psal.31.23. with the Annotat.]"}],"55":[{"catchword":null,"tekst":"KOPH. LORD, I have called upon thy name out of the lowermost pit: [Heb, out of the pit of lownesses; that is, when I was in the uttermost affliction. See Psal.88. on ver.7. and 120.1.]"}],"56":[{"catchword":null,"tekst":"KOPH. Thou hast heard my voice: [That is, thou hat granted my request [hide not thine ear at my sighing, at my crying. [refuse not henceforth, I pray thee, to give heed to my fervent and hearty prayer."}],"57":[{"catchword":null,"tekst":"KOPH. Thou drewest near in the day when I called upon thee: thou sadist, fear not. [That is, didst cause me to taste of thy gracious help, which thou didst so plainly manifest unto me. As if thou hadst said unto me in express terms, Fear not, Isa 41:10.]"}],"58":[{"catchword":null,"tekst":"RESH. Lord, thou hast pleaded the causes of my soul, [That is, thou hast protected and delivered me, when they sought to kill me. Compare Jerem. chap.38. See also Psal.35. on ver. 1.] thou hast delivered my life. [that is, thou hast delivered me out of the hands of those that sought cruelly to slay me.]"}],"59":[{"catchword":null,"tekst":"RESH. LORD, thou hast seen the perversness that was done unto me, [Heb, my perverseness; that is, that which was practiced against me. See Jerem. chap .2. on ver.2.] judge my cause, [that is, mind my cause, and judge me according to mine integrity, help me to my right. Compare Psal43.ver1.]"}],"60":[{"catchword":null,"tekst":"RESH. Thou hast seen all their [To wit, mine enemies] vengeance, [that is, how revengeful, yea also how blood-thirsty they are against me] all their thoughts against me."}],"61":[{"catchword":null,"tekst":"SCHIN. LORD, thou hast heard their reproach. [That is, their spiteful and reproachful words which they have uttered against me] (and) all their thoughts against me."}],"62":[{"catchword":null,"tekst":"SCHIN. The lips of those that rise up against me, [The words of mine enemies, wherewith they threaten me] their device [that is, the thoughts of their wicked heart] against me all the day. Understand withal, thou hast heard]"}],"63":[{"catchword":null,"tekst":"SCHIN. Behold their sitting and rising up, [See Psal.1. on ver. 1. and Psal.139. on ver.2. and compare Isa 37:28] I am their musick-play, [See above Annotations on verse 14. and Job 30. on verse 9.]"}],"64":[{"catchword":null,"tekst":"THAU. LORD, render unto them, [Whose song and play I am, as in the former verse] that recompence according to the work of their hands. [See Psa 28:4. and 94.2.]"}],"65":[{"catchword":null,"tekst":"THAU. Give them a covering of heart [That is, such giddiness and mist of heart, as may deprive them of all courage and valour, so as they may not be able to do us any harm.] let hty curse be upon them."}],"66":[{"catchword":null,"tekst":"THAU. Persecute them with wrath, and destroy them from under the heaven of the LORD. [That is, every where as far as the heaven reacheth, as Exo 17:14. and Deut.17.24. and 25.19. and 29.20. 2 Kings 14.27.]"}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const popupCache = {};

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {

  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
