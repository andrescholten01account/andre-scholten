"12":"Word zoals ik, want ook ik ben zoals u; broeders, ik smeek u; u hebt mij geen ongelijk gedaan.","13":"En u weet, dat ik u door zwakheid van het vlees het Evangelie de eerste keer verkondigd heb;","14":"en mijn beproeving¹, die in mijn vlees gebeurde, hebt u niet veracht, en ook niet verafschuwd; maar u nam mij aan als een engel van God, ja, als Christus Jezus.","15":"Waar was dan uw gelukkig prijzen²? Want ik verklaar u dat u, als het mogelijk was geweest, uw ogen zou hebben uitgegraven en aan mij gegeven.","16":"Ben ik dan uw vijand geworden, doordat ik u de waarheid vertel?","17":"Zij ijveren niet oprecht om u; maar zij willen u uitsluiten, opdat u zou ijveren om hen.","18":"Maar in het goede te allen tijde te ijveren is goed, en niet alleen wanneer ik bij u ben;","19":"mijn kinderen, voor wie ik opnieuw weeën lijd totdat Christus gestalte in u krijgt.","20":"Ik zou willen dat ik nu bij u was, en mijn stem kon veranderen; want ik weet niet wat ik met u aan moet.","21":"Zegt u mij, u die onder de wet wilt zijn, hoort u de wet niet?","22":"Want er is geschreven dat Abraham twee zonen had, één uit de dienstmaagd, en één uit de vrije.","23":"Maar hij die uit de dienstmaagd was, is naar het vlees geboren; maar hij die uit de vrije was, door de belofte;","24":"dit zijn dingen die een andere betekenis hebben; want dit zijn de twee verbonden: het ene, van de berg Sinaï, dat kinderen baart tot dienstbaarheid, dat is Hagar;","25":"want Hagar is de berg Sinaï in Arabië, en komt overeen met het huidige Jeruzalem, dat met haar kinderen in dienstbaarheid is.","26":"Maar het Jeruzalem dat boven is, is vrij, en dat is onze aller moeder.","27":"Want er is geschreven: Wees vrolijk, u onvruchtbare, die niet baart, breek uit en roep, u die geen weeën hebt, want de kinderen van de eenzame zijn veel meer dan van haar die de man heeft.","28":"Maar wij, broeders, zijn kinderen van de belofte, zoals Izak was.","29":"Maar zoals destijds hij die naar het vlees geboren was, hem vervolgde die naar de Geest geboren was, zo is het ook nu.","30":"Maar wat zegt de Schrift? Werp de dienstmaagd uit en haar zoon; want de zoon van de dienstmaagd zal geenszins erven met de zoon van de vrije.","31":"Dus, broeders, wij zijn geen kinderen van de dienstmaagd, maar van de vrije."},"SV":{"1":"Doch ik zeg, zo langen tijd als de erfgenaam een kind is, zo verschilt hij niets van een dienstknecht, hoewel hij een heer is van alles;","2":"Maar hij is onder voogden en verzorgers, tot den tijd van den vader te voren gesteld.","3":"Alzo wij ook, toen wij kinderen waren, zo waren wij dienstbaar gemaakt onder de eerste beginselen der wereld.","4":"Maar wanneer de volheid des tijds gekomen is, heeft God Zijn Zoon uitgezonden, geworden uit een vrouw, geworden onder de wet;","5":"Opdat Hij degenen, die onder de wet waren, verlossen zou, *en* opdat wij de aanneming tot kinderen verkrijgen zouden.","6":"En overmits gij kinderen zijt, zo heeft God den Geest Zijns Zoons uitgezonden in uw harten, Die roept: Abba, Vader!","7":"Zo dan, gij zijt niet meer een dienstknecht, maar een zoon; en indien gij een zoon zijt, zo zijt gij ook een erfgenaam van God door Christus.","8":"Maar toen, als gij God niet kendet, diendet gij degenen, die van nature geen goden zijn;","9":"En nu, als gij God kent, ja, veelmeer van God gekend zijt, hoe keert gij u wederom tot de zwakke en arme beginselen, welke gij wederom van voren aan wilt dienen?","10":"Gij onderhoudt dagen, en maanden, en tijden, en jaren.","11":"Ik vrees voor u, dat ik niet enigszins tevergeefs aan u gearbeid heb.","12":"Weest gij als ik, want ook ik ben als gij; broeders, ik bid u; gij hebt mij geen ongelijk gedaan.","13":"En gij weet, dat ik u door zwakheid des vleses het Evangelie de eerste maal verkondigd heb;","14":"En mijn verzoeking, die in mijn vlees *geschiedde*, hebt gij niet veracht noch verfoeid; maar gij naamt mij aan als een engel Gods, *ja*, als Christus Jezus.","15":"Welke was dan uw gelukachting? Want ik geef u getuigenis, dat gij, zo het mogelijk ware, uw ogen zoudt uitgegraven, en mij gegeven hebben.","16":"Ben ik dan uw vijand geworden, u de waarheid zeggende?","17":"Zij ijveren niet recht over u; maar zij willen ons uitsluiten, opdat gij over hen zoudt ijveren.","18":"Doch in het goede te allen tijd te ijveren is goed, en niet alleenlijk, als ik bij u tegenwoordig ben;","19":"Mijn kinderkens, die ik wederom arbeide te baren, totdat Christus een gestalte in u krijge.","20":"Doch ik wilde, dat ik nu tegenwoordig bij u ware, en mijn stem mocht veranderen; want ik ben in twijfel over u.","21":"Zegt mij, gij, die onder de wet wilt zijn, hoort gij de wet niet?","22":"Want er is geschreven, dat Abraham twee zonen had, een uit de dienstmaagd, en een uit de vrije.","23":"Maar gene, die uit de dienstmaagd was, is naar het vlees geboren geweest; doch deze, die uit de vrije was, door de beloftenis;","24":"Hetwelk dingen zijn, die andere beduiding hebben; want deze zijn de twee verbonden; het ene van den berg Sina, tot dienstbaarheid barende, hetwelk is Agar;","25":"Want dit, *namelijk* Agar, is Sina, een berg in Arabië, en komt overeen met Jeruzalem, dat nu is, en dienstbaar is is met haar kinderen.","26":"Maar Jeruzalem, dat boven is, dat is vrij, hetwelk is ons aller moeder.","27":"Want er is geschreven: Wees vrolijk, gij onvruchtbare, die niet baart, breek uit en roep, gij, die geen barensnood hebt, want de kinderen der eenzame zijn veel meer, dan dergene, die den man heeft.","28":"Maar wij, broeders, zijn kinderen der belofte, als Izak was.","29":"Doch gelijkerwijs toen, die naar het vlees geboren was, vervolgde dengene, die naar den Geest *geboren* *was*, alzo ook nu.","30":"Maar wat zegt de Schrift? Werp de dienstmaagd uit en haar zoon; want de zoon der dienstmaagd zal geenszins erven met den zoon der vrije.","31":"Zo dan, broeders, wij zijn niet kinderen der dienstmaagd, maar der vrije."},"KJV":{"1":"Now I say, *That* the heir, as long as he is a child, differeth nothing from a servant, though he be lord of all;","2":"But is under tutors and governors until the time appointed of the father.","3":"Even so we, when we were children, were in bondage under the elements of the world:","4":"But when the fulness of the time was come, God sent forth his Son, made of a woman, made under the law,","5":"To redeem them that were under the law, that we might receive the adoption of sons.","6":"And because ye are sons, God hath sent forth the Spirit of his Son into your hearts, crying, Abba, Father.","7":"Wherefore thou art no more a servant, but a son; and if a son, then an heir of God through Christ.","8":"Howbeit then, when ye knew not God, ye did service unto them which by nature are no gods.","9":"But now, after that ye have known God, or rather are known of God, how turn ye again to the weak and beggarly elements, whereunto ye desire again to be in bondage?","10":"Ye observe days, and months, and times, and years.","11":"I am afraid of you, lest I have bestowed upon you labour in vain.","12":"Brethren, I beseech you, be as I *am*; for I *am* as ye *are*: ye have not injured me at all.","13":"Ye know how through infirmity of the flesh I preached the gospel unto you at the first.","14":"And my temptation which was in my flesh ye despised not, nor rejected; but received me as an angel of God, *even* as Christ Jesus.","15":"Where is then the blessedness ye spake of? for I bear you record, that, if *it had been* possible, ye would have plucked out your own eyes, and have given them to me.","16":"Am I therefore become your enemy, because I tell you the truth?","17":"They zealously affect you, *but* not well; yea, they would exclude you, that ye might affect them.","18":"But *it is* good to be zealously affected always in *a* good *thing*, and not only when I am present with you.","19":"My little children, of whom I travail in birth again until Christ be formed in you,","20":"I desire to be present with you now, and to change my voice; for I stand in doubt of you.","21":"Tell me, ye that desire to be under the law, do ye not hear the law?","22":"For it is written, that Abraham had two sons, the one by a bondmaid, the other by a freewoman.","23":"But he *who was* of the bondwoman was born after the flesh; but he of the freewoman *was* by promise.","24":"Which things are an allegory: for these are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.","25":"For this Agar is mount Sinai in Arabia, and answereth to Jerusalem which now is, and is in bondage with her children.","26":"But Jerusalem which is above is free, which is the mother of us all.","27":"For it is written, Rejoice, *thou* barren that bearest not; break forth and cry, thou that travailest not: for the desolate hath many more children than she which hath an husband.","28":"Now we, brethren, as Isaac was, are the children of promise.","29":"But as then he that was born after the flesh persecuted him *that was born* after the Spirit, even so *it is* now.","30":"Nevertheless what saith the scripture? Cast out the bondwoman and her son: for the son of the bondwoman shall not be heir with the son of the freewoman.","31":"So then, brethren, we are not children of the bondwoman, but of the free."}},"tsk":{"1":[{"kopje":"zolang","refs":["Gal 4:23","Gal 4:29","Gen 24:2","Gen 24:3","2 Kon 10:1","2 Kon 10:2","2 Kon 11:12","2 Kon 12:2"]}],"3":[{"kopje":"toen","refs":["Gal 3:19","Gal 3:24","Gal 3:25"]},{"kopje":"onder","refs":["Gal 4:9","Gal 4:25","Gal 4:31","Gal 2:4","Gal 3:23","Gal 5:1","Matt 11:28","Joh 8:31","Hand 15:10","Rom 8:15"]},{"kopje":"beginselen","refs":["Gal 4:9","Kol 2:8","Kol 2:20","Hebr 7:16"]}],"4":[{"kopje":"de volheid","refs":["Gen 49:10","Dan 9:24-26","Mal 3:1","Mark 1:15","Hand 1:7","Ef 1:10","Hebr 9:10"]},{"kopje":"God","refs":["Jes 48:16","Zach 2:8-11","Joh 3:16","Joh 6:38","Joh 8:42","Joh 10:36","1 Joh 4:9","1 Joh 4:10","1 Joh 4:14"]},{"kopje":"uitgezonden","refs":["Jes 9:5","Jes 9:6","Micha 5:1","Zach 6: \">barren</span> that <span class=\"wl wl-kjv\" data-code=\"G5088\">bearest</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not;</span> break <span class=\"wl wl-kjv\" data-code=\"G4486\">forth</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G994\">cry,</span> thou that <span class=\"wl wl-kjv\" data-code=\"G5605\">travailest</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not:</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">for</span> the <span class=\"wl wl-kjv\" data-code=\"G2048\">desolate</span> hath many <span class=\"wl wl-kjv\" data-code=\"G4183\">more</span> <span class=\"wl wl-kjv\" data-code=\"G5043\">children</span> <span class=\"wl wl-kjv\" data-code=\"G3123\">than</span> she which <span class=\"wl wl-kjv\" data-code=\"G2192\">hath</span> an husband.","28":"<span class=\"wl wl-kjv\" data-code=\"G1161\">Now</span> <span class=\"wl wl-kjv\" data-code=\"G2249\">we,</span> <span class=\"wl wl-kjv\" data-code=\"G80\">brethren,</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">as</span> <span class=\"wl wl-kjv\" data-code=\"G2464\">Isaac</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">was,</span> <span class=\"wl wl-kjv\" data-code=\"G2070\">are</span> the <span class=\"wl wl-kjv\" data-code=\"G5043\">children</span> of promise.","29":"<span class=\"wl wl-kjv\" data-code=\"G235\">But</span> <span class=\"wl wl-kjv\" data-code=\"G5618\">as</span> <span class=\"wl wl-kjv\" data-code=\"G5119\">then</span> he that was <span class=\"wl wl-kjv\" data-code=\"G1080\">born</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">after</span> the <span class=\"wl wl-kjv\" data-code=\"G4561\">flesh</span> <span class=\"wl wl-kjv\" data-code=\"G1377\">persecuted</span> him that was born <span class=\"wl wl-kjv\" data-code=\"G2596\">after</span> the <span class=\"wl wl-kjv\" data-code=\"G4151\">Spirit,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">even</span> <span class=\"wl wl-kjv\" data-code=\"G3779\">so</span> it is now.","30":"<span class=\"wl wl-kjv\" data-code=\"G235\">Nevertheless</span> <span class=\"wl wl-kjv\" data-code=\"G5101\">what</span> <span class=\"wl wl-kjv\" data-code=\"G3004\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"G1124\">scripture?</span> Cast <span class=\"wl wl-kjv\" data-code=\"G1544\">out</span> the <span class=\"wl wl-kjv\" data-code=\"G3814\">bondwoman</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> <span class=\"wl wl-kjv\" data-code=\"G5207\">son:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> the <span class=\"wl wl-kjv\" data-code=\"G5207\">son</span> of the <span class=\"wl wl-kjv\" data-code=\"G3814\">bondwoman</span> <span class=\"wl wl-kjv\" data-code=\"G2816\">shall</span> <span class=\"wl wl-kjv\" data-code=\"G3364\">not</span> be <span class=\"wl wl-kjv\" data-code=\"G2816\">heir</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> the <span class=\"wl wl-kjv\" data-code=\"G5207\">son</span> of the freewoman.","31":"So <span class=\"wl wl-kjv\" data-code=\"G686\">then,</span> <span class=\"wl wl-kjv\" data-code=\"G80\">brethren,</span> we <span class=\"wl wl-kjv\" data-code=\"G2070\">are</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G5043\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"G3814\">bondwoman,</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> of the free."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ik zeg,","tekst":"Dat is, hetgeen ik gezegd heb, Gal 3:24-25, dat de wet onze tuchtmeester is, verklaar ik nu met een andere gelijkenis ook van menselijke zaken genomen. Zie dergelijke 1Co 5:6; 2Co 9:6."},{"catchword":"een kind is,","tekst":"Dat is, nog onmondig is en minderjarig."},{"catchword":"niets van een","tekst":"Namelijk wat aangaat het tegenwoordig gebruik van het erfgoed, hetwelk hij alzo weinig mag aantasten en gebruiken als een dienstknecht, alzo hij hierin zijn eigen meester nog niet is, maar onder anderen staat."},{"catchword":"een heer is van alles;","tekst":"De eigendom van al het goed des erfdeels hem toebehoort."}],"2":[{"catchword":"onder voogden","tekst":"Dat is, onder de macht en het opzicht dergenen, die tot regering en verzorging zijner goederen gesteld zijn. Van deze woorden, zie Mat 20:8; Luk 12:42, en Luk 16:1; 1Co 4:1."},{"catchword":"tot den tijd","tekst":"De minderjarigheid heeft zijnen tijd in rechten gesteld, welke de vaders ook door hun testament kunnen verkorten of verlangen, naardat zij zullen goedvinden."}],"3":[{"catchword":"wij ook,","tekst":"Namelijk Joden, die nu leden van de gemeente van Christus zijn."},{"catchword":"toen wij kinderen","tekst":"Namelijk ten tijde des Ouden Testaments, voor de toekomst van Christus."},{"catchword":"dienstbaar gemaakt","tekst":"Dat is, onderworpen en schuldig te onderhouden."},{"catchword":"onder de eerste","tekst":"Grieks elementen; dat is onder de ceremoniën die in uiterlijke en aardse dingen bestaan, en gelijk als de eerste aanleiding en begin waren van de zaligmakende kennis. Zie Col 2:8."}],"4":[{"catchword":"de volheid des tijds","tekst":"Dat is, de volwassene ouderdom der gemeente, om uit deze voogdij gesteld te worden. Of, als de tijd vervuld was, dien God bestemd had om Zijnen Zoon in de wereld te zenden."},{"catchword":"Zijn Zoon","tekst":"Namelijk Jezus Christus, die Gods Zoon van eeuwigheid is geweest, eer Hij mens is geworden; Psa 2:7; Pro 8:24; Mic 5:1; Act 13:33."},{"catchword":"geworden","tekst":"Anders, geboren."},{"catchword":"uit een vrouw,","tekst":"Dat is, uit het vlees en bloed der maagd Maria; Luk 1:31, en Luk 2:7."},{"catchword":"onder de wet;","tekst":"Dat is, Christus heeft Zichzelven, niet alleen aan de wet der ceremoniën onderworpen, maar ook aan de wet der zeden, die Hij volmaakt voor ons heeft onderhouden, en den vloek derzelve op zich genomen, en ons daarvan verlost; 2Co 5:21."}],"5":[{"catchword":"degenen, die","tekst":"Dat is, die onder het juk waren van de wet der ceremoniën, en ook onder den vloek en de scherpe gehoorzaamheid van de wet der zeden, waar hij in dit vierde hfdst. ook van spreekt. Zie vs.21."},{"catchword":"verlossen zou,","tekst":"Grieks uitkopen; namelijk betalende voor hen een volkomen rantsoengeld voor hunne zonden. Zie Gal 3:13."},{"catchword":"de aanneming","tekst":"Grieks stelling tot zonen. Daarom moest de Zoon Gods gezonden worden om ons te verlossen, opdat Hij het recht van zoonschap, hetwelk Hij van nature had, allen gelovigen, niet alleen zonen, maar ook dochters, 2Co 6:18, zou verkrijgen en uit genade mededelen."}],"6":[{"catchword":"gij","tekst":"Namelijk gelovige Galaten, die tevoren heidenen waart."},{"catchword":"kinderen zijt,","tekst":"Namelijk Gods, door den Zoon Gods geworden, en om Zijnentwil van God tot kinderen aangenomen, die tevoren kinderen des toorns en vijanden Gods waart. Zie Rom 5:10; Eph 2:12, en nu het recht en de vrijheid geniet van Gods kinderen, gesteld buiten de voogdij der wet, en bevrijd van haar vloek."},{"catchword":"den Geest Zijns","tekst":"Dat is, den Heiligen Geest, die als een onderpand in uwe harten u verzekert van deze genadige aanneming tot kinderen, en van de erfenis die den kinderen toekomt; 2Co 1:22, en 2Co 5:5; Eph 1:13."},{"catchword":"Die roept","tekst":"Dat is, door welken wij roepen, Rom 8:15. Dat is, die in ons werkt, dat wij vrijmoedig en met verzekering tot God roepen. Zie dergelijke wijze van spreken Rom 8:26."},{"catchword":"Abba, Vader","tekst":"Zie de verklaring hiervan op de aantekeningen Rom 8:15."}],"7":[{"catchword":"gij zijt","tekst":"Namelijk die nu in Christus gelooft."},{"catchword":"niet meer","tekst":"Namelijk gelijk tevoren."},{"catchword":"een dienstknecht,","tekst":"Namelijk staande onder de voogdij en dienstbaarheid der wet."},{"catchword":"een zoon zijt,","tekst":"Namelijk Gods, die nu tot uwe jaren gekomen zijnde uit de voorzegde voogdij gesteld zijt."},{"catchword":"een erfgenaam Gods","tekst":"Zie van dit besluit Rom 8:17."},{"catchword":"door Christus","tekst":"Namelijk die ons deze erfenis verdiend en verkregen heeft, en wiens medeërfgenamen wij zullen zijn; Rom 8:17."}],"8":[{"catchword":"als gij God","tekst":"Dat is, als gij nog in het heidendom waart en van den God geen kennis hadt."},{"catchword":"diendet gij","tekst":"Namelijk als slaven en dienstknechten der afgoden."},{"catchword":"degenen,","tekst":"Dat is, de afgoden."},{"catchword":"die van nature","tekst":"Dat is, waarlijk en wezenlijk, maar alleen naar het goeddunken door versiering der mensen; Jer 10:11."}],"9":[{"catchword":"God kent,","tekst":"Dat is, den waren God, die van nature en naar zijn wezen God is."},{"catchword":"ja, veelmeer","tekst":"Dit doet de apostel daarbij, om aan te wijzen dat zij deze kennis niet hebben uit zichzelven, door kloekheid huns verstands, maar door de genade Gods, door welke Hij hun is voorgekomen en hen tot deze kennis gebracht heeft."},{"catchword":"gekend zijt,","tekst":"Namelijk voor de Zijnen. Zie Mat 7:23; 2Ti 2:19. Dat is, die God uit enkel barmhartigheid verwaardigd heeft met Zijne kennis te verlichten. Zie ook 1Co 8:3, en 1Co 13:12."},{"catchword":"hoe keert gij u","tekst":"Dat is, wilt u niet keren."},{"catchword":"wederom","tekst":"Namelijk van de ene dienstbaarheid tot de andere; van de dienstbaarheid der afgoden tot de dienstbaarheid der ceremoniën."},{"catchword":"tot de zwakke","tekst":"Dat is, tot de ceremoniën en de leer der wet, die gene macht hebben om u daardoor te rechtvaardigen. Zie Heb 7:18-19."},{"catchword":"wederom","tekst":"Namelijk gelijk gij tevoren de afgoden diende."},{"catchword":"van voren aan","tekst":"Of, van boven af."},{"catchword":"wilt dienen?","tekst":"Dat is, tot dienstbaarheid derzelve u begeven, omdat gij namelijk de leer der valse apostelen wilt volgen."}],"10":[{"catchword":"Gij","tekst":"Hier verhaalt de apostel enige soorten van de voorzegde elementen of eerste beginselen, aangaande de onderhouding der Joodse feestdagen. Zie Rom 14:5."},{"catchword":"onderhoudt","tekst":"Namelijk naar de wijze der Joden, om daarmede God dienst te doen en daardoor gerechtvaardigd te worden."},{"catchword":"dagen, en","tekst":"Dat is, de sabbaten, alle weken eens omkomende, Exo 20:8; Col 2:16. Namelijk voorzoveel die ceremonieel en den Joden eigen waren."},{"catchword":"maanden, en","tekst":"Dat is, de feesten der nieuwe maanden; Num 28:11."},{"catchword":"tijden, en","tekst":"Dat is, de grote jaarlijkse feesten van pasen, pinksteren en loofhutten, Exo 23:15-16, enz."},{"catchword":"jaren","tekst":"Dat is, het zevende en ook het vijftigste jaar; Exo 23:10; Lev 25:4, Lev 25:6, Lev 25:10, enz."}],"11":[{"catchword":"tevergeefs aan","tekst":"Dat is, zonder vrucht; dat al mijn arbeid en moeite, die ik aangewend heb om u tot Christus te bekeren, vruchteloos zou zijn, en hun doel niet bereiken, hetwelk is uwe zaligheid, die gij niet zult kunnen verkrijgen, zo gij door de wet zoudt willen gerechtvaardigd worden."}],"12":[{"catchword":"als ik, want ook","tekst":"Namelijk die eertijds ook zeer geijverd heb voor de wet, maar daarna Christus recht kennende, al die uiterlijke ceremoniën verworpen en als schade geacht heb; Phi 3:7-8."},{"catchword":"ik ben als gij;","tekst":"Namelijk eertijds geweest, immers zozeer ijverende voor het Jodendom, als gij zoudt mogen doen, Gal 1:14. Anderen verstaan dit van de goede genegenheid, die Paulus hun toedroeg; en dat hij hen hier vermaant dat zij hem gelijke genegenheid willen toedragen."},{"catchword":"ik bid u;","tekst":"Dat is, kan ik u met bestraffen niet bewegen, zo wordt dan bewogen door mijn vriendelijk bidden, dat gij bij de waarheid des Evangelies wilt blijven."},{"catchword":"mij geen ongelijk","tekst":"Dat is, wat mijn persoon aangaat, zo hebt gij mij geen oorzaak gegeven dat ik u uit verstoordheid of weerwraak zo scherpelijk zou bestraffen. En daarmede wil hij stilzwijgend aanwijzen, dat zij in deze Christus ongelijk deden."}],"13":[{"catchword":"gij weet, dat","tekst":"Dat is, het is zoverre vandaar, dat gij mij ongelijk zoudt gedaan hebben, dat, gelijk gij weet, gij mij, als ik het Evangelie bij u predikte, de meeste eer en liefde getoond hebt, die men zou kunnen doen."},{"catchword":"door zwakheid","tekst":"Dat is, in een nederigen en slechten staat zonder uiterlijken luister. Of, met vele verdrukkingen, smaadheden, moeite, haat en gevaren uiterlijk mij overgekomen. Zie 1Co 2:3, en 2Co 11:30, en 2Co 12:9."},{"catchword":"de eerste maal","tekst":"Dat is, toen u, als gij nog heidenen waart, het Evangelie van mij eerst gepredikt is geweest. Zie Act 16:6, en Act 18:23."}],"14":[{"catchword":"mijn verzoeking,","tekst":"Of, beproeving, dat is, mijne verdrukkingen, die hij tevoren zwakheid genoemd heeft, waardoor God mijn geloof en getrouwheid heeft willen beproeven."},{"catchword":"die in mijn vlees","tekst":"Dat is, die mij uiterlijk aangedaan werd."},{"catchword":"niet veracht noch","tekst":"Grieks voor niet geacht."},{"catchword":"verfoeid; maar","tekst":"Grieks uitgespogen; dat is, daaraan hebt gij u niet gestoten, of daardoor zijt gij niet afgewend om het Evangelie niet aan te nemen, mijne leer te verachten of te verwerpen."},{"catchword":"als een engel Gods,","tekst":"Dat is, alsof ik een van de heilige engelen en dienstbare geesten ware geweest. Of, als een gezant Gods; want dat betekent ook het woord engel."},{"catchword":"ja, als Christus","tekst":"Dat is, niet als een dienaar van Christus, maar alsof ik de Heere zelf ware geweest. De apostel wil hiermede aanwijzen dat het grote schande voor de Galaten zou zijn, dat zij hem, dien zij tevoren zulk ene eer en liefde betoond hadden, zo lichtvaardiglijk zouden verlaten, en tot de valse apostelen vallen; dat zij dan in het vorige behoorden te volharden."}],"15":[{"catchword":"Welke was dan","tekst":"Dat is, hoe gelukkig achttet gij nu uzelven? Zie van dit woord Rom 4:9."},{"catchword":"zo het mogelijk","tekst":"Namelijk dat men iemand met het uitgraven en geven van zijne ogen dienst zou kunnen doen."},{"catchword":"uw ogen zoudt","tekst":"Dat is, al wat gij allerliefst en aangenaamst hebt, zoudt gij mij gegeven hebben. Zie Mat 5:29."}],"16":[{"catchword":"uw vijand geworden,","tekst":"Namelijk gelijk ik gelasterd word van de valse apostelen. Of, gelijk men zou menen dat deze scherpe bestraffing uit haat of vijandschap van mij zou gedaan zijn."},{"catchword":"u de waarheid zeggende?","tekst":"Namelijk tot uw best en zaligheid; want dit is een werk niet van vijanden, maar van vrienden. Zie Pro 27:6."}],"17":[{"catchword":"Zij ijveren","tekst":"Dat is, de valse leraars, die u zoeken te verleiden, tonen wel alsof zij groten ijver hadden om u tot de zaligheid te brengen, of grote genegenheid tot u droegen."},{"catchword":"niet recht over u;","tekst":"Dat is, met geen waren, maar met een geveinsden ijver of genegenheid."},{"catchword":"ons","tekst":"Namelijk de rechte apostelen en leraars."},{"catchword":"uitsluiten, opdat gij","tekst":"Namelijk dat gij ons niet meer zoudt horen, volgen of aanhangen. Anderen lezen: u insluiten; dat is, u gelijk als in ene gevangenis sluiten, en hun onderwerpen."},{"catchword":"over hen zoudt ijveren","tekst":"Dat is, hen met een ijver en grote genegenheid volgen en aanhangen."}],"18":[{"catchword":"in het goede","tekst":"Dat is, over een goede zaak; want daar is tweeërlei ijver, een goede ijver, die hier beschreven wordt, en een verkeerde, die geschiedt over een kwade zaak, die men meent goed te zijn, en die daarom met onverstand gemengd is. Zie Rom 10:2."},{"catchword":"te allen tijd te","tekst":"Dat is, met een ijver, die altijd standvastig blijft en niet ophoudt."},{"catchword":"als ik bij u","tekst":"Namelijk toen gij met zulk een ijver en genegenheid ontstoken waart tegen mij en mijne leer, daarin behoordet gij gebleven te hebben, hoewel ik nu bij u niet ben."}],"19":[{"catchword":"Mijn kinderkens,","tekst":"Namelijk die ik door het Evangelie gebaard heb; 1Co 4:15."},{"catchword":"die ik wederom","tekst":"Grieks van welken ik wederom in barensnood of pijn ben; dat is, die u eerst met veel moeite en arbeid bekeerd heeft uit het heidendom tot Christus, en over welken ik nu wederom groten arbeid en moeite zal moeten aanwenden, om u opnieuw van dezen uwe dwalingen te brengen."},{"catchword":"Christus","tekst":"Dat is, de zaligmakende kennis van Christus."},{"catchword":"een gestalte in u","tekst":"Dat is, gelijk een moeder haar kind zo lang draagt, totdat het een volmaakte gestalte heeft gekregen, en dan hetzelve baart; alzo zal ik niet ophouden te arbeiden, totdat gij in de rechte kennis van Christus zult bevestigd zijn."}],"20":[{"catchword":"tegenwoordig bij","tekst":"Namelijk om te beter mijne liefde tot u te betonen, en u breder van alles te kunnen onderrichten, dan wel door schrijven kan geschieden."},{"catchword":"stem mocht veranderen;","tekst":"Dat is, mijne redenen en woorden voegen naar de gelegenheid van een iegelijk, of van de zaken, nu zoeter, dan scherper, u aansprekende."},{"catchword":"in twijfel over u","tekst":"Dat is, ik weet niet hoe ik het met u heb, of ik wel of kwalijk van u zal hopen; of, hoe deze uwe afwijking zal uitvallen, of, hoe ik u van dezelve het best weder zal terechtbrengen."}],"21":[{"catchword":"Zegt mij, gij,","tekst":"Dat is, antwoord mij eens op hetgeen ik u uit de wet zelve zal voorstellen."},{"catchword":"die onder de wet","tekst":"Dat is, die door de werken der wet en de onderhouding der ceremoniën zoekt gerechtvaardigd te worden."},{"catchword":"hoort gij de wet niet?","tekst":"Dat is, wilt gij u aan de wet niet onderwerpen om aan te nemen hetgeen in de wet en boeken van Mozes geschreven staat? Namelijk dat de wet zelve van de erfenis uitsluit degenen, die dienstknechten der wet zijn, gelijk in de volgende verzen bewezen wordt. Het woord wet wordt hier in tweeërlei betekenis genomen, gelijk Rom 3:21."}],"22":[{"catchword":"Want er is geschreven,","tekst":"Namelijk in de wet van Mozes van het elfde hoofdstuk van Genesis tot het twee en twintigste hoofdstuk."},{"catchword":"een uit","tekst":"Namelijk Ismael."},{"catchword":"de dienstmaagd, en","tekst":"Of, slavin; namelijk, Agar (Hagar)."},{"catchword":"een uit","tekst":"Namelijk Izak."},{"catchword":"de vrije","tekst":"Namelijk Sara."}],"23":[{"catchword":"naar het vlees geboren","tekst":"Dat is, naar de kracht, werking en loop der natuur. Want Agar was nog jong toen zij haren zoon ontving, en Abraham nog bekwaam om kinderen te gewinnen."},{"catchword":"door de beloftenis;","tekst":"Namelijk is geboren geweest, dat is, door bovennatuurlijke werking Gods, die Abraham van God beloofd was; Gen 18:10. Want Sara was onvruchtbaar, en nu negentig jaren oud, en Abraham honderd, beiden onbekwaam naar de natuur om kinderen te winnen; Gen 17:17; Rom 4:19."}],"24":[{"catchword":"die andere beduiding","tekst":"Grieks allegoroumena; dat is, die wel een ware historie of geschiedenis zijn, maar benevens die ook wat anders beduiden, als zijnde voorbeelden of afbeeldingen van geestelijke zaken; gelijk ook de koperen slang, Joh 3:14, het huwelijk van Adam en Eva, Eph 5:32, de doorgang der Israëlieten door de Rode Zee, 1Co 10:1-2, de zondvloed, 1Pe 3:20."},{"catchword":"deze","tekst":"Namelijk twee vrouwen, Sara en Agar."},{"catchword":"zijn","tekst":"Dat is, beduiden, betekenen, afbeelden; een sacramentelijke wijze van spreken. Zie Gen 41:26-27; Mat 26:26."},{"catchword":"de twee verbonden;","tekst":"Namelijk het oude der wet, waarin beloofd wordt dat hij, die de wet volkomenlijk onderhoudt, de zaligheid daardoor verkrijgen zal, en het nieuwe des Evangelies, waarin het eeuwige leven beloofd wordt den zondaren die in Christus geloven. Zie Jer 31:31, enz.; Heb 8:8-10."},{"catchword":"het ene","tekst":"Namelijk het verbond der wet."},{"catchword":"van den berg Sinaï,","tekst":"Dat is, dat zijn oorsprong daarvan heeft, waar het van God het volk door Mozes is voorgesteld en van het volk aangenomen."},{"catchword":"tot dienstbaarheid","tekst":"Dat is, kinderen voorbrengende, die onder de dienstbaarheid zijn. Want de wet eist van de mensen een volkomen gehoorzaamheid, of bij gebrek van die verkondigt hun den vloek."},{"catchword":"hetwelk is Agar","tekst":"Dat is, hetwelk door de dienstmaagd Agari is afgebeeld, die zelve een slavin zijnde, uit het huis is gedreven, en wier kinderen met de zonen der vrije niet erven, Gen 21:10; want die van ene slaven geboren worden zijn ook slaven en geen erfgenamen."}],"25":[{"catchword":"dit, namelijk Agar,","tekst":"Dat is, dit verbond, hetwelk door Agar is afgebeeld. Of, dit woord Agar."},{"catchword":"is Sinaï,","tekst":"Dat is, wordt ook genaamd Sinaï. Want de berg, dien wij noemen Sinaï, wordt, gelijk sommigen menen, van de Arabieren genaamd Agar, en daarvan worden ook de Arabieren Agarenen genaamd, 1Ch 5:10, 1Ch 5:19; Psa 83:7. Of, is ene afbeelding van Sinaï, en van het verbond der wet, dat op den berg Sinaï gegeven is."},{"catchword":"een berg in Arabië,","tekst":"Dat is, gelegen in de woestijn van Arabië, waarheen Agar met haren zoon Ismael gevlucht is, als zij uit het huis van Abraham was gedreven, en heeft hem aldaar een Egyptische huisvrouw gegeven; Gen 21:14, Gen 21:20-21."},{"catchword":"komt overeen","tekst":"Namelijk hetzelfde verbond, dat is, heeft ééne gelijkenis en enigheid."},{"catchword":"met Jeruzalem,","tekst":"Dat is, met de Joodse synagoge of godsdienst, die binnen Jeruzalem de overhand en hare zitplaats heeft."},{"catchword":"dat nu is, en","tekst":"Namelijk na de toekomst van Christus, door wien al de ceremoniën vervuld en afgedaan zijn; en evenwel houdt, dat de onderhouding der ceremoniën nog ter zaligheid nodig is."},{"catchword":"dienstbaar is","tekst":"Of, want het is dienstbaar; dat is, het draagt nog het juk der ceremoniën, en zoekt daardoor de zaligheid."},{"catchword":"met haar kinderen","tekst":"Dat is, met al degenen die deze religie aanhangen, en door het verbond der wet hunne zaligheid zoeken. En daarom wordt het bij Agar en haren zoon met recht vergeleken; en zal ook als Agar met haren zoon van de erfenis verstoten worden."}],"26":[{"catchword":"Jeruzalem, dat boven is","tekst":"Dat is, de Christelijke Kerk en religie, die hare zaligheid zoekt, niet door het eerste verbond der wet, namelijk door de werken der wet, maar door het tweede des Evangelies, namelijk door de verdiensten van Christus met een waar geloof aangenomen; welke haren oorsprong heeft van den hemel, door de krachtige roeping des Heiligen Geestes. Zie Heb 12:22; Rev 3:12, en Rev 21:10."},{"catchword":"dat is vrij,","tekst":"Namelijk van de dienstbaarheid en vloek der wet; en wordt bij Sara en Izak, die vrije personen waren, met recht vergeleken; waarom het ook de erfenis des hemels beërven zal."},{"catchword":"ons aller","tekst":"Namelijk gelovigen, zo Joden als heidenen die hunne zaligheid in Christus alleen zoeken."},{"catchword":"moeder","tekst":"Gelijk Sara de moeder was van Izak, die de erfgenaam zijns vaders was, omdat hij uit een vrije moeder was geboren."}],"27":[{"catchword":"Want er is geschreven","tekst":"Namelijk Isa 54:1. De apostel bevestigt dit afgebeeld onderscheid der twee verbonden, volken en gemeenten, der wet en des Evangelies, met de getuigenis en voorzegging van den profeet Jesaja, opdat hij niet schijne deze toepassing buiten de Schrift versierd te hebben."},{"catchword":"gij onvruchtbare,","tekst":"Dat is, gij gemeente dergenen, die uwe zaligheid alleen in Christus zoekt, die ten tijde van Christus weinige waren, zodat het scheen alsof zij geen kinderen had; hetwelk ook betekend wordt, gelijk de profeet zegt, dat zij geen barensnood heeft en eenzaam is."},{"catchword":"de kinderen der eenzame","tekst":"Dat is, ledematen derzelve."},{"catchword":"veel meer, dan dergene,","tekst":"Daardoor wordt voorzegd de grote menigte dergenen, die uit het Jodendom en voornamelijk uit het heidendom, zich tot deze gemeente zullen begeven, hetwelk na Christus' hemelvaart geschied is."},{"catchword":"die den man heeft","tekst":"Dat is, de Joodse kerk of synagoge, die zich alleen Gods gemeente en eigendom roemde te zijn, en vele aanhangers had."}],"28":[{"catchword":"wij, broeders, zijn","tekst":"Namelijk die onze zaligheid niet door de wet, maar door het geloof in Christus zoeken."},{"catchword":"kinderen der belofte,","tekst":"Dat is, wien de erfenis des eeuwigen levens toegezegd is, en haar zullen deelachtig worden."},{"catchword":"als Izak was","tekst":"Grieks naar Izak; dat is, naar het voorbeeld van Izak, namelijk gelijk Izak uit kracht der belofte, boven de kracht der natuur, van een vrije moeder geboren zijnde, erfgenaam is geweest van zijns vaders goed; alzo zullen ook allen, die door het ware geloof de beloften des Evangelies aannemen, als vrije kinderen Gods, de hemelse erfenis deelachtig worden."}],"29":[{"catchword":"toen, die","tekst":"Namelijk ten tijde van Abraham."},{"catchword":"naar het vlees","tekst":"Namelijk Ismael. Zie vs.23."},{"catchword":"vervolgde dengene,","tekst":"Namelijk met bittere bespotting. Zie Gen 21:9."},{"catchword":"naar den Geest","tekst":"Dat is, Izak, die geboren was uit kracht der belofte Gods, van zijne ouders aangenomen met waar geloof, hetwelk de Geest Gods in hen gewrocht heeft."},{"catchword":"alzo ook nu","tekst":"Namelijk worden de gelovigen, die hunne zaligheid alleen in Christus zoeken gelijk Izak, nog vervolgd van de Joodse synagoge, die door de wet wil zalig worden, waarvan Ismael een voorbeeld was. Daarmede vermaant hij de gelovigen tot lijdzaamheid en standvastigheid."}],"30":[{"catchword":"wat zegt de Schrift?","tekst":"Dat is, let toch wel op hetgeen de Heilige Schrift in deze historie nog verder zegt."},{"catchword":"Werp de dienstmaagd","tekst":"Door deze uitwerping van Hagar en Ismael uit het huis van Abraham wordt afgebeeld, dat alzo ook allen, die door het verbond der wet zoeken zalig te worden, uit het huis Gods zullen uitgeworpen worden, en de erfenis des eeuwigen levens niet verkrijgen. Maar dat die uit het geloof van Christus zijn, daarin blijven zullen en alleen zalig worden."}],"31":[{"catchword":"wij zijn niet kinderen","tekst":"Namelijk die de zaligheid alleen in Christus en niet in de wet zoeken."},{"catchword":"der dienstmaagd, maar","tekst":"Namelijk van Agar, dat is, van het verbond der wet, waarvan Agar een voorbeeld was, die niet erven zullen, maar uitgeworpen worden."},{"catchword":"der vrije","tekst":"Namelijk Sara; dat is, van het genadeverbond des Evangelies, waarvan Sara een voorbeeld was, die de erfenis zullen verkrijgen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But I say [That is, that which I said in chap. 3.ver.24.25. that the Law is our Schoolmaster, I now explain by another similitude, taken also from humane affairs. See the like 1 Cor. 5.6. 2 Cor. 9.6.] as long as the times the heir is a child, [That is, is yet an infant and under years] he differed nothing from a servant, [Namely, as concerning the present use of the inheritance, which he may as little touch use as a servant, seeing herein he is not yet his own, but is under others] although he be Lord of all. [The propriety of all goods of the inheritance belongeth unto him.]"}],"2":[{"catchword":null,"tekst":"But he is under Tutors and Guardians, [That is, under the power and oversight of those who are appointed for the governing and taking of his goods. Of these words, see Mat. 20.8. Luk 12:42. and 16.1. 1 Cor. 4.1.] unto the tome fore-appointed of the Father. [that is, the none-aged hath its time appointed by Law, which Fathers also by their Testament may shorten or lengthen as they shall see god.]"}],"3":[{"catchword":null,"tekst":"So we also [Namely, Jews, who are now members of the church of Christ] when we were children [namely, in the times of the Old Testament, before the coming of Christ] under the first principle of the world. [Gr. Elements, i.e. under the ceremonies which consist in outward and earthily things, and were as the first introduction and beginning of saving knowledge. See Colos. 2.8.]"}],"4":[{"catchword":null,"tekst":"But when the fullness of time came [That is, the full-grown age of the Church, to be set free from his warship. Or when the time was fulfilled which God had determined to send his Son into this world] God sent forth his Son, [Namely, Jesus Christ, who was Gods Son from the everlasting, before he became man, Psa. 2.7. Prov. 8.24. Mic. 5.1. Act 13:33.] made [Otherwise born] of a woman [that is, of the flesh and blood of the virgin Mary, Luk 1:31. and 2.7.] made under the Law; [that is, Christ subjected himself not only to the ceremonial Law, which he perfectly kept for sins, and took the curse thereof upon him, and delivered us from it, 2 Cor. 5.21.]"}],"5":[{"catchword":null,"tekst":"That he might deliver [Gr. Redeem, namely, paying for them a full ransom for their sins. See Gal. 3.13.] them that were under the Law, [that is, who were under the yoke of the ceremonial Law, and also under the curse and rigorous obedience of the moral Law, whereof he also speaks in this fourth chapter, see ver. 21.] (and) that we might obtain the adoption of children. [Gr. Putting for sons. Therefore the Son of God must be sent to redeem us, that he might obtain, and graciously communicate the right of Son- ship, which he had by nature, unto all believers, not only sons but also daughters, 2 Cor. 6.18. See Eph. 1.5.]"}],"6":[{"catchword":null,"tekst":"And forasmuch as ye [Namely, believing Galatians, who before were heathen] are children [namely, of God, made by the Son of God, and for his sake adopted for children by God. Who before were children of wrath, and Enemies of God. See Rom. 5.10. Eph. 2.1,2. And enjoy the right and liberty of Gods children, being set free out of the ward-ship of the Law, and freed from the curse of the same] God hath sent the spirit of his Son [that is, the Holy Ghost, which as a pledge in your hearts, assures you of this gracious adoption for children, and of the inheritance which belongs to children, 2 Cor. 1.22. and 5.5. Eph. 1.13. etc.] Unto your hearts, which eyeth [that is, by which we cry, Rom 8:15. i.e. which worketh in us that we boldly and with assurance cry unto God. See the like phrase, Rom. 8.26.] Abba, Father. [See the exposition hereof in the annotation on Rom 8:15."}],"7":[{"catchword":null,"tekst":"So then thou [Namely, who now believeth in Christ] art no more [namely, as before] a servant, [namely, standing under the ward-ship and bondage of the Law] but a Son: and if thou art a Son [Namely, of God, who now being come to thy years, art set free of the foresaid ward-ship] thou art also an heir of God [See of this conclusion, Rom. 8. 17.] through Christ. [Namely, who hath merited and procured this inheritance for us, and whose co-heirs we shall be, Rom. 8. 17.]"}],"8":[{"catchword":null,"tekst":"But then when ye knew not God, [That is, when ye were yet in heathenism, and had no knowledge of the true God] ye served [namely, as slaves and servants of idols] them [that is, the idols] which by nature are no Gods. [That is, truly and essentially, but only according too opinion, by the feigning of men, Jerem. 10. 11.]"}],"9":[{"catchword":null,"tekst":"And now when ye know God; [That is, the true God, who is God by nature and according to his essence] ye much rather [this the Apostle adds, to show that they have not this knowledge of themselves, by the quickness of their own understanding, but by the grace of God, by which he prevented them, and brought them to this knowledge] are known of God, [namely, for his, See Mat. 7. 23. 2 Tim. 2. 19. i.e. whom God of mere mercy hath vouchsafed to enlighten with the knowledge of himself. See also 1 Cor. 8. 3. and chap. 13. v. 12.] How turn ye [that is, do not turn yourselves] again [namely, from one bondage to another: from the bondage of idols to the bondage of ceremonies] unto the weak and poor first beginnings [or rudiments, that is, unto the ceremonies and doctrine of the Law, which have no power to justify you thereby. See Heb. 7. ver. 18, 19.] which ye will serve [that is, addict yourselves to the bondage of the same, namely, because ye will follow the doctrine of the false Apostles] again [namely, even as ye served idols before] from the beginning, [or from the top]"}],"10":[{"catchword":null,"tekst":"Ye [Here the Apostle relates some kinds of the foresaid elements or first principles, concerning the observation of the Jewish feast days. See Rom. 14. 5.] Observe [namely, after the manner of the Jews, to do God service therewith, and to be justified thereby] days, [that is, Sabbaths, coming about once every week, Exod. 20. 8. Col. 2. 16. Namely so far forth as they were ceremonial and proper to the Jews] and months, [that is, feasts of new moons, Num. 28. 11.] And times, [that is, the great yearly feasts of the Passover, Pentecost and tabernacles, Exod. 23. 15, 16, & c.] and years, [that is, the seventh and also the fiftieth year, Exod. 23. 10. Lev. 25. 4. 6, 10.]"}],"11":[{"catchword":null,"tekst":"I am in fear of you, lest in any wise I should have taken pains with you in vain. [That is, without fruit: lest all my labor and trouble which I have undergone to convert you to Christ, should be fruitless, and not attain its end, which is your salvation, which ye shall not be able to obtain; if ye would be justified by the Law.]"}],"12":[{"catchword":null,"tekst":"Be ye as I, [Namely, who formerly have also been very zealous for the Law, but afterward knowing Christ aright, have cast off all those outward ceremonies and esteemed them as loss, Phil. 3. 7, 8.] for I also am as ye, [i.e. I was such in former times, being indeed as greatly zealous for Judaism ever ye could be, Gal. 1. 14, Others understand this of the good affection which Paul bare to them: and that he here exhorts them to bear him the like affection] brethren I beseech you: [that is, if I cannot prevail with you by reproof, be moved at lest by my friendly entreaty, to abide by the truth of the Gospel] ye have done me no injury, [that is, as concerning my person ye have given me no cause that I should out of passion or revenge so sharply reprove you. And thereby tacitly he would show that they did Christ wrong in this.]"}],"13":[{"catchword":null,"tekst":"And ye know [that is, ye are so far from having done me wrong, that as ye know, when I preached the Gospel among you, ye showed me the greatest honor and love that men could do] that through infirmity of the flesh, [that is, in a low and mean estate, without outward luster. Or with many persecutions, reproaches, troubles, hatred and dangers outwardly coming upon me. See 1 Cor. 2. 3. and 2 Cor. 11. 30. and chap. 12. 9.] I published the gospel was first preached unto you by me, when ye were yet Gentiles. See Acts 16. 6. and chap. 28. 23.]"}],"14":[{"catchword":null,"tekst":"And my temptation [Or trial, i.e. my tribulations, which before he called infirmity, whereby God would try my faith and fidelity] which (happened) in my flesh [that is, which was outwardly brought upon me] ye despised not [Gr. Esteemed not for naught .] nor abhorred, [Gr. Spewed-out, i.e. ye were not offended there at, or thereby ye were not turned away, from receiving the Gospel, or to despise or reject my doctrine] but ye received me as an Angel of God, [that is, as if I had been one of the Holy Angels and ministering Spirits; or as an Ambassador of God: for that the word Angel signifies also] (yea) as Christ Jesus. [That is, not as a Minister of Christ, but as if I had been the Lord himself. The Apostle would hereby show that it would be great shame for the Galatians, that they should so inconstantly forsake him, to whom before they had shown such honor and love, and fall to the false Apostles: that therefore they ought to persevere in the former.]"}],"15":[{"catchword":null,"tekst":"What was then your counting blessed? [That is, how blessed did you then esteem yourselves. See of this word, Rom. 4. 9.] For I bear you witness, that if it were possible [namely, that men could do one any service by the digging out and giving of their eyes] ye would have digged out your eyes and given them to me, [that is, whatsoever is most lovely and most acceptable unto you, ye would not given me. See Mat. 5.29.]"}],"16":[{"catchword":null,"tekst":"Am I then become your Enemy [Namely, as I am slandered by the false Apostle, or as men would think that this sharp reproof was given by me out of hatred or enmity] telling you the truth? [Namely, for your god and salvation: for this is a work, not of Enemies, but of Friends, See Prov. 27.6.]"}],"17":[{"catchword":null,"tekst":"They [That is, the false Apostles, which seek to seduce you, shew indeed as if they had great zeal to bring you to salvation: or bare great affection unto you] are not rightly zealous for you, [that is, with no true but with feigned zeal or affection] but they will exclude [namely, that you should no more hear, follow or adhere to us. Others read include you, i.e. shut you, as it were, into a prison, and subject you to them] us, [namely, the true Apostle and Teachers] that ye might be zealous for them [that is, to follow and adhere to them with a zeal and great inclination.]"}],"18":[{"catchword":null,"tekst":"But in good thing [That is, about a good matter: for there is a twofold zeal, one good, which is described here, and one perverse, which is exercised about an evil matter, which men think to be good, and therefore is mingled with ignorance. See Rom 10:2.] To be zealous always, [that is, with a zeal that always continues steadfast, ceaseth not] is good, and not only when I am present with you. [Namely, when ye were inflamed with such a zeal and affection towards me and my doctrine, ye ought to have continued therein, although I am not now with you.]"}],"19":[{"catchword":null,"tekst":"My little children, [Namely, which I have brought forth by the Gospel, 1 Cor. 4.15.] whom I labor again to bring forth, [Gr. Of whom I am again in travel, or pain, i.e. who at first with much trouble labor converted you from heathenism unto Christ, and about I shall now again be constrained to bestow great labor & trouble to bring to a new from these errors] until Christ [that is, the saving knowledge of Christ] get a form in you. [That is, even as a mother so long bears a child until it hath gotten a perfect form, and then brings forth the same; so I will not cease to labor, until ye shall be confirmed in the true knowledge of Christ.]"}],"20":[{"catchword":null,"tekst":"But I would that I were now present with you, [Namely, the batter to shew my love unto you, and to be able the more largely to inform you of all things, then can indeed be done by writing] and might change my voice [that is, suit my words and discourse according to the condition of every one, or of the matters, speaking now more mildly, then more sharply unto you] For I am in doubt about you. [that is, I know not how much I stand with you, whether I shall convince well or ill of you, or what end this your turning away will take, or how I shall best bring you to right again from the same.]"}],"21":[{"catchword":null,"tekst":"Tell me [That is, answer me once to that which I shall propound unto you out of the Law it self] ye that will be under the Law, [that is, who seek to be justified by the works of the Law, and the observation of the ceremonies] do ye not hear the Law? [That is, will ye not submit to the Law, to receive that which is written in the Law and Books of Moses? Namely, that the Law it self excludes those from inheritance, that are servants of the Law, as is proved in the following verses. The word Law is here taken in a two-fold signification, as Rom. 3.21.]"}],"22":[{"catchword":null,"tekst":"For it is written, [Namely, in the Law of Moses from the eleventh chapter of Genesis to the 22.] that Abraham had two sons, one [namely, Ishmael] by the bondmaid, [Or, she-slave, namely, Agar.] and one [namely, Isaac] by the (free-woman.) [Namely, Sara.]"}],"23":[{"catchword":null,"tekst":"But he that was the bond-maid was born after the flesh: [That is, according to the power, working and course of nature. For Agar was yet young when she conceived her son, and Abraham yet fit to begot children] but he that was of the free- (woman) by promise. [Namely, born i.e. by a supernatural operation of God, which way promised Abraham by God, Gen. 18.10. For Sara was barren and now 90 years old, and Abraham an hundred, both unfit according to nature to get children, Gen. 17.17. Rom. 4.19.]"}],"24":[{"catchword":null,"tekst":"Which are things that have another signification: [Gr. Allegoroumena, i.e. which are indeed a true history or event, but besides that, signify also somewhat else, as being type or representations of spiritual things: as also the brazen serpents, Joh 3:14. the marriage of Adam and Eve, Eph. 5.32. the Israelites passage through the Red Sea, 1 Cor. 10.1,2. the stood, 1 Pet. 3.20,21.] for these [namely, two women, Sara and Agar] are [that is, signify, betoken, represent, a Sacramental phrase. See Gen. 41.26,27. Mat. 26.26.] the two Covenants: [namely, the old, of the Law, wherein is promised that he that perfectly keeps the Law, shall thereby obtain salvation: and the new of the Gospel, wherein eternal life is promised to sinners that believe in Christ. See Jer. 31.31. etc. Heb. 8.8,9, 10.] The one [namely, the Covenant of the Law] from Mount Sinai, [that is, which hath its original from thence, where the same was by God through Moses propounded to the people, and received by the people] bringing forth unto bondage, [namely, bringing forth children which are under bondage. For the Law requires of men a perfect obedience, or for want thereof denounceth the curse unto them] which is Agar. [that is, which is represented by the bondmaid, Agar who being her self a she-slave was driven out of the house, and whose children do not inherit with the sons of the free-w // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

}
function bijbeluitlegHtml(n) {

  const MAX_CW = 60;

    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';

    let inhoud;

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);

            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {

      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
