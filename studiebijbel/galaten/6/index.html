d gezicht willen tonen naar het vlees, die dwingen u besneden te worden, alleen maar opdat zij vanwege het kruis van Christus niet vervolgd zouden worden.","13":"Want ook zij die besneden worden, houden de wet zelf niet; maar zij willen dat u besneden wordt, opdat zij in uw vlees zouden roemen.","14":"Maar laat het ver van mij zijn dat ik zou roemen, anders dan in het kruis van onze Heere Jezus Christus; door Wie de wereld mij gekruisigd is, en ik de wereld.","15":"Want in Christus Jezus heeft noch besnijdenis enige kracht, noch onbesneden zijn, maar een nieuw schepsel.","16":"En zovelen als er naar deze regel zullen wandelen, over hen zij vrede en barmhartigheid, en over het Israël van God.","17":"Verder, laat niemand mij moeite aandoen; want ik draag de littekenen van de Heere Jezus in mijn lichaam.","18":"De genade van onze Heere Jezus Christus zij met uw geest, broeders! Amen. Geschreven aan de Galaten vanuit Rome."},"SV":{"1":"Broeders, indien ook een mens vervallen ware door enige misdaad, gij, die geestelijk zijt, brengt den zodanige te recht met den geest der zachtmoedigheid; ziende op uzelven, opdat ook gij niet verzocht wordt.","2":"Draagt elkanders lasten, en vervult alzo de wet van Christus.","3":"Want zo iemand meent iets te zijn, daar hij niets is, die bedriegt zichzelven in *zijn* gemoed.","4":"Maar een iegelijk beproeve zijn eigen werk; en alsdan zal hij aan zichzelven alleen roem hebben, en niet aan een anderen.","5":"Want een iegelijk zal zijn eigen pak dragen.","6":"En die onderwezen wordt in het Woord, dele mede van alle goederen dengene, die *hem* onderwijst.","7":"Dwaalt niet; God laat Zich niet bespotten; want zo wat de mens zaait, dat zal hij ook maaien.","8":"Want die in zijn eigen vlees zaait, zal uit het vlees verderfenis maaien; maar die in den Geest zaait, zal uit den Geest het eeuwige leven maaien.","9":"Doch laat ons , goed doende, niet vertragen; want te zijner tijd zullen wij maaien, zo wij niet verslappen.","10":"Zo dan, terwijl wij tijd hebben, laat ons goed doen aan allen, maar meest aan de huisgenoten des geloofs.","11":"Ziet, hoe groten brief ik u geschreven heb met mijn hand.","12":"Al degenen, die een schoon gelaat willen tonen naar het vlees, die noodzaken u besneden te worden, alleenlijk opdat zij vanwege het kruis van Christus niet zouden vervolgd worden.","13":"Want ook zij zelven, die besneden worden, houden de wet niet; maar zij willen, dat gij besneden wordt, opdat zij in uw vlees roemen zouden.","14":"Maar het zij verre van mij, dat ik zou roemen, anders dan in het kruis van onzen Heere Jezus Christus; door Welken de wereld mij gekruisigd is, en ik der wereld.","15":"Want in Christus Jezus heeft noch besnijdenis enige kracht, noch voorhuid, maar een nieuw schepsel.","16":"En zovelen als er naar dezen regel zullen wandelen, over dezelve *zal* *zijn* vrede en barmhartigheid, en over het Israël Gods.","17":"Voorts, niemand doe mij moeite aan; want ik draag de littekenen van den Heere Jezus in mijn lichaam.","18":"De genade van onzen Heere Jezus Christus zij met uw geest, broeders! Amen. Geschreven aan de Galaten vanuit Rome."},"KJV":{"1":"Brethren, if a man be overtaken in a fault, ye which are spiritual, restore such an one in the spirit of meekness; considering thyself, lest thou also be tempted.","2":"Bear ye one another's burdens, and so fulfil the law of Christ.","3":"For if a man think himself to be something, when he is nothing, he deceiveth himself.","4":"But let every man prove his own work, and then shall he have rejoicing in himself alone, and not in another.","5":"For every man shall bear his own burden.","6":"Let him that is taught in the word communicate unto him that teacheth in all good things.","7":"Be not deceived; God is not mocked: for whatsoever a man soweth, that shall he also reap.","8":"For he that soweth to his flesh shall of the flesh reap corruption; but he that soweth to the Spirit shall of the Spirit reap life everlasting.","9":"And let us not be weary in well doing: for in due season we shall reap, if we faint not.","10":"As we have therefore opportunity, let us do good unto all *men*, especially unto them who are of the household of faith.","11":"Ye see how large a letter I have written unto you with mine own hand.","12":"As many as desire to make a fair shew in the flesh, they constrain you to be circumcised; only lest they should suffer persecution for the cross of Christ.","13":"For neither they themselves who are circumcised keep the law; but desire to have you circumcised, that they may glory in your flesh.","14":"But God forbid that I should glory, save in the cross of our Lord Jesus Christ, by whom the world is crucified unto me, and I unto the world.","15":"For in Christ Jesus neither circumcision availeth any thing, nor uncircumcision, but a new creature.","16":"And as many as walk according to this rule, peace *be* on them, and mercy, and upon the Israel of God.","17":"From henceforth let no man trouble me: for I bear in my body the marks of the Lord Jesus.","18":"Brethren, the grace of our Lord Jesus Christ *be* with your spirit. Amen."}},"tsk":{"1":[{"kopje":"vervallen","refs":["Gal 2:11-13","Gen 9:20-24","Gen 12:11-13","Num 20:10-13","2 Sam 11:2-27","Matt 26:69","Matt 26:75","Rom 14:1","Rom 15:1","Hebr 12:13","Jak 5:19"]},{"kopje":"geestelijk","refs":["Rom 8:6","Rom 15:1","1 Kor 2:15","1 Kor 3:1","1 Kor 14:37"]},{"kopje":"terechtbrengen","refs":["2 Sam 12:1-15","Job 4:3","Job 4:4","Jes 35:3","Jes 35:4","Ezech 34:16","Matt 9:13","Matt 18:12-15","Luk 15:4-7","Luk 15:22-32","Hebr 12:13","Jak 5:19","Jak 5:20","1 Joh 5:16","Judas 1:22","Judas 1:23"]},{"kopje":"met een geest","refs":["Gal 5:23","Matt 11:29","1 Kor 4:21","2 Kor 10:1","2 Tess 3:15","2 Tim 2:25","Jak 3:13","1 Petr 3:15"]},{"kopje":"let daarbij op","refs":["1 Kor 7:5","1 Kor 10:12","Hebr 13:3","Jak 3:2"]}],"2":[{"kopje":"Draag","refs":["Gal 6:5","Gal 5:13","Gal 5:14","Ex 23:5","Num 11:11","Num 11:12","Deut 1:12","Jes 58:6","Matt 8:17","Matt 11 orden."},{"catchword":"verzocht wordt","tekst":"Dat is, door verzoekingen des duivels en des vleesches tot dergelijke zonden gebracht wordt."}],"2":[{"catchword":"Draagt elkanders","tekst":"Dat is, helpt dragen, om die te verdragen, beteren, en weg te nemen met Christelijke bescheidenheid en medelijden."},{"catchword":"lasten, en","tekst":"Dat is, zwakheden en gebreken, die als een zware last op de mensen liggen."},{"catchword":"vervult alzo","tekst":"Dat is, voldoet, volbrengt, onderhoudt."},{"catchword":"de wet van Christus","tekst":"Namelijk van elkander lief te hebben, Joh 13:34-35; welke, hoewel ze ook van Mozes beschreven is, Lev 19:18, zo wordt zij Christus' wet bijzonderlijk genoemd, omdat Hij dezelve zijnen discipelen op het hoogste heeft bevolen, zo met vermanen als met Zijn voorbeeld Joh 15:12; 1Jo 3:16."}],"3":[{"catchword":"meent iets te zijn,","tekst":"Dat is, meent iets groots, heiligs of bijzonders te zijn, veel van zichzelven houdt, en acht dat hij beter is dan zijn naasten. Waaruit gemeenlijk spruit, dat men de gebreken des naasten zo hard bestraft."},{"catchword":"daar hij niets","tekst":"Dat is, daar hij uit zichzelven niets goeds heeft, en al wat hij heeft van God heeft ontvangen; 1Co 4:7; 2Co 3:5."},{"catchword":"bedriegt zichzelven","tekst":"Dat is, maakt zichzelven dwaselijk wijs, hetgeen zo niet is."}],"4":[{"catchword":"beproeve","tekst":"Dat is, onderzoeke en toetse, niet naar zijn eigen goeddunken, maar naar den regel en toetssteen van de wet Gods."},{"catchword":"zijn eigen werk;","tekst":"Dat is, zijn eigen doen en handelingen; niet zozeer het doen van anderen."},{"catchword":"alsdan zal hij","tekst":"Namelijk als hij bevindt dat zijn doen met de wet Gods overeenkomt."},{"catchword":"aan zichzelven","tekst":"Dat is, uit zijn eigen goeden wandel, en in zijn eigen conscientie."},{"catchword":"roem hebben,","tekst":"Dat is, met goede conscientie zal mogen roemen, niet van zijne waardigheid of verdiensten, Rom 3:27; 1Co 1:29, 1Co 1:31; maar dat hij oprechtelijk voor God wandelt naar Zijne wet; 1Co 9:15; 2Co 1:12."},{"catchword":"niet aan een anderen","tekst":"Dat is, niet zich met anderen vergelijkende, die hij zou menen zo goed niet te zijn, als hij, gelijk de Farizeër deed; Luk 18:11."}],"5":[{"catchword":"zijn eigen pak dragen","tekst":"Dat is, Gode rekenschap geven van zijn eigen werken, en naar zijn eigen doen geoordeeld worden."}],"6":[{"catchword":"onderwezen wordt","tekst":"Het Griekse woord catechoumenos betekent wel iemand, die in de eerste beginselen van den godsdienst wordt onderwezen, maar hier wordt het breder genomen voor allerlei toehoorders, die door de predikatie des goddelijken woords in de Christelijke religie worden onderwezen, van welken staat zij ook zijn."},{"catchword":"in het Woord,","tekst":"Namelijk Gods."},{"catchword":"dele mede","tekst":"Dat is, geve ook zijn deel tot onderhoud der leraars."},{"catchword":"van alle goederen","tekst":"Grieks in alle goederen; dat is, mildelijk, opdat de leraars des te beter, zonder verhindernis, al hunnen tijd tot het bedienen van hun ambt mogen besteden."},{"catchword":"onderwijst","tekst":"Grieks catechiseert; gelijk tevoren."}],"7":[{"catchword":"Dwaalt niet;","tekst":"Dat is, wilt uzelven niet ijdelijk inbeelden of laten wijsmaken."},{"catchword":"bespotten; want","tekst":"Grieks God wordt niet gespot; namelijk met ijdele uitvluchten, die vele gebruiken om de bevelen Gods niet te gehoorzamen; dewijl Hij die uitvluchten niet aanneemt, en ook niet zonder straf laat henengaan."},{"catchword":"zaait,","tekst":"Dat is, medegedeeld zal hebben zo aan de leraars, waarvan tevoren gesproken is, als aan de armen, waarvan hij in het volgende spreekt; ene gelijkenis, waarmede de overvloedige vrucht der mededeelzaamheid aangewezen wordt. Gelijk uit een graan dat gezaaid wordt, dikwijls honderd wederom opwassen en gemaaid worden; Gen 26:12. Zie van dezelve 2Co 9:6."}],"8":[{"catchword":"in zijn eigen vlees","tekst":"Die zijne goederen besteedt alleen om wellustiglijk daarvan te leven, of schatten voor zichzelven te vergaderen, en niet denkt op de onderhouding der kerkedienaars, noch der armen."},{"catchword":"uit het vlees","tekst":"Dat is, uit dit misbruik der goederen, die alleen tot zijn vlees besteed worden."},{"catchword":"verderfenis","tekst":"Namelijk, tijdelijk en eeuwig."},{"catchword":"maaien; maar die","tekst":"Dat is, daarvan zal hij vergelding en vrucht verkrijgen."},{"catchword":"in den Geest zaait,","tekst":"Dat is, die zijne goederen besteedt tot geestelijke zaken, om Gods eer en de zaligheid der mensen daardoor te bevorderen, en den armen goed te doen."},{"catchword":"uit den Geest","tekst":"Dat is, overmits hij zijne goederen tot geestelijke zaken besteed heeft."},{"catchword":"het eeuwige leven maaien","tekst":"Dat is, niet alleen hier in dit leven tijdelijken zegen ontvangen, maar ook hiernamaals de eeuwige gelukzaligheid, als ene vrucht der weldadigheid, niet uitverdienste, maar uit genade. Zie Mat 25:34-35, enz."}],"9":[{"catchword":"goed doende,","tekst":"Dat is, weldadigheid betonende."},{"catchword":"niet vertragen;","tekst":"Het Griekse woord betekent door enig kwaad in het goede verslappen; gelijk veeltijds geschiedt in deze zaak, omdat de menigte der armen groot is, en onder hen dikwijls vele onwaardigen vele ondankbaren zijn; en omdat de tijd van de vergelding niet terstond komt."},{"catchword":"te zijner tijd","tekst":"Dat is, hoewel de tijd van vergelding uitgesteld wordt, gelijk er tijd is tussen zaaien en maaien, zo zal evenwel dezelve zekerlijk komen."},{"catchword":"maaien, zo wij","tekst":"Zie vs.8."},{"catchword":"verslappen","tekst":"Grieks ontbonden, of, losgemaakt zijn."}],"10":[{"catchword":"terwijl wij tijd","tekst":"Namelijk om te zaaien, dat is, om den armen goed te doen; hetwelk in den tijd dezes levens moet geschieden, die kort en onzeker is."},{"catchword":"goed doen aan","tekst":"Grieks het goede werken; dat is, weldadigheid betonen."},{"catchword":"allen, maar meest","tekst":"Namelijk armen, of anderen, die onze hulp en bijstand nodig hebben. Zie Luk 10:36-37."},{"catchword":"huisgenoten des geloofs","tekst":"Dat is, de gelovige Christenen, die met ons ledematen zijn der gemeente, welke is het huis des levenden Gods, 1Ti 3:15; aan dezen zijn wij meer verbonden, en het zou onbehoorlijk zijn dat zij, die tot één huis behoren, elkander honger en gebrek zouden laten lijden."}],"11":[{"catchword":"Ziet,","tekst":"Of, gij ziet."},{"catchword":"hoe groten brief","tekst":"Of, met hoevele woorden, of schriften."},{"catchword":"met mijne hand","tekst":"Namelijk zonder dat door de hand van een ander te hebben laten schrijven, gelij hij wel heeft gedaan Rom 16:22, en alleen zijnen naam met de groetenis daar onder geschreven, 1Co 16:21; Col 4:18; daarmede toont hij dan hoezeer dat hij de Galaten acht; en heeft zulks gedaan opdat de valse apostelen niet zouden zeggen dat het Paulus' brief niet was, of een anderen brief, alsof die van hem geschreven ware, in plaats van dien zouden voortbrengen, gelijk zij wel plachten te doen, 2Th 2:2."}],"12":[{"catchword":"die een schoon","tekst":"Of, die willen wel aangezien, of aanzienlijk zijn. Hij verstaat hier de valse apostelen."},{"catchword":"naar het vlees,","tekst":"Grieks in het vlees; dat is, door het onderhouden van de uiterlijke en lichamelijke ceremoniën."},{"catchword":"vanwege het kruis","tekst":"Dat is, om de leer van Christus, die zo genoemd wordt, omdat haar somma en inhoud is, dat door het kruis van Christus het leven ons verkregen is; 1Co 2:2."},{"catchword":"niet zouden vervolgd worden","tekst":"Namelijk van de Joden, gelijk wij dagelijks van hen meest vervolgd worden, omdat wij leren dat de wet van Mozes door Christus vervuld en afgedaan is."}],"13":[{"catchword":"die besneden worden,","tekst":"Namelijk en de besnijdenis zo sterk drijven als ter zaligheid nog nodig."},{"catchword":"houden de wet niet;","tekst":"Namelijk in de andere stukken, die mede in de wet geboden worden, maar leiden een ongeregeld of geveinsd leven."},{"catchword":"in uw vlees roemen","tekst":"Dat is, zij onder u vele aanhangers mogen krijgen en daarvan ijdellijk roemen bij de Joden."}],"14":[{"catchword":"dan in het kruis van","tekst":"Dat is, in de rechtzinnige leer van Christus voor ons gekruisigd; 1Co 2:2."},{"catchword":"door Welken","tekst":"Namelijk kruis van Christus; of, Christus den gekruisigde. De zin komt overeen uit."},{"catchword":"de wereld","tekst":"Dat is, de eer, gunst en aanzienlijkheid bij de mensen."},{"catchword":"mij gekruisigd is,","tekst":"Dat is, van mij veracht en verworpen wordt."},{"catchword":"ik der wereld","tekst":"Namelijk dewijl ik om de leer van Christus van de wereld veracht, vervolgd en verstoten wordt; 1Co 4:12-13."}],"15":[{"catchword":"in Christus Jezus","tekst":"Dat is, in het rijk en de gemeente van Christus, of, naar de leer van Christus. Zie Gal 5:6."},{"catchword":"enige kracht,","tekst":"Namelijk om door de besnijdenis het eeuwige leven te verkrijgen, of door de voorhuid verhinderd te worden van hetzelve te verkrijgen."},{"catchword":"nieuw schepsel","tekst":"Of, nieuw creatuur, of, waardoor verstaan wordt de wedergeboorte en vernieuwing des mensen door den Heiligen Geest. Zie 2Co 5:17."}],"16":[{"catchword":"naar dezen regel","tekst":"Dat is, naar deze leer, die ik in dezen zendbrief van de rechtvaardigmaking des mensen voor God, van de Christelijke vrijheid, en van den Christelijken wandel heb voorgesteld en verklaard."},{"catchword":"zal zijn","tekst":"Of zij."},{"catchword":"vrede en","tekst":"Dat is, allerlei geestelijke zegeningen, en voornamelijk verzoening met God en verzekering daarvan door den Heiligen Geest in hun gemoed; Rom 5:1."},{"catchword":"barmhartigheid, en","tekst":"Namelijk van God, die de fontein is, waaruit de verzoening en zaligheid des mensen vloeit."},{"catchword":"over het Israël Gods","tekst":"Dat is, over alle ware gelovigen, die oprechte Israëlieten zijn en van God daarvoor gekend worden; hetwelk hij daarbij doet om deze van de Israëlieten naar het vlees te onderscheiden. Zie Rom 2:28-29, en Rom 9:6, enz."}],"17":[{"catchword":"niemand doe mij","tekst":"Namelijk van deze valse apostelen. Dit spreekt hij met apostolische autoriteit om hun verderen moedwil te bedwingen."},{"catchword":"de littekenen van","tekst":"Namelijk van de slagen, banden en wonden, die ik om Christus en Zijne leer ontvangen heb. Hiermede wil hij tonen dat hij gene vervolging heeft ontzien, gelijk de valse apostelen deden. Zie 2Co 11:23, enz."}],"18":[{"catchword":"De genade van","tekst":"Dat is een groet en wens, met welken de apostel zijne zendbrieven eindigt, gelijk hij zelf betuigt, 2Th 3:17. Zie ook Rom 16:24; 1Co 16:23, en 2Co 13:13."},{"catchword":"geest","tekst":"Dat is, ziel, gemoed."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Brethren if also a man were overtaken [Or prevented, surprised, namely, out of improvidence or weakness, not out of willful purpose] by [Gr. In] any mis-deed, [namely, whereby he hath offended you or others] ye that are spiritual [that is who are enlightened by God, and endued with fitness to be able to admonisheth others, See 1 Cor. 3.1.] bring such one to the right [namely, by good instruction and admonishing. The Greek word signifies properly to make whole, to perfect, to supply the want, or to restore anything, see Mat. 4.21.] with the spirit of meekness, [Gr. In the spirit] considering your selves, [that is, minding your own infirmities, how easily ye also might thereby be overtaken with the like sins that ye also be tempted. [that is, by the temptations of the Devil and the flesh be not brought to the like sins.]"}],"2":[{"catchword":null,"tekst":"Bear [That is, help to bear, bear with, amend, and remove them with Christian moderation and compassion] one another&acirc;&euro;&trade;s burden: [that is, infirmities, defects, which lie as an heavy burden upon men] and so fulfill [that is, satisfy, accomplish, observe] the law of Christ, [namely, of loving another, Joh 13:34,35. which although it be also written by Moses, Lev. 19.18. yet it is especially called the Law of Christ, because he mostly strictly enjoyed the Same to his Disciples, as well by exhortation as by his example, Joh 15:12. 1Jn 3:16.]"}],"3":[{"catchword":null,"tekst":"Foe if any one thinketh that he is any thing, [That is, thinketh that he is some great, holy, or special thing, esteemeth much of himself, and thinketh that he is better than his neighbor. From whence it commonly springs that men so severely reprove the failings of their neighbor] whereas he is nothing, [that is, whereas he hath nothing good of himself: and all that he hath, hath received of God, 1 Cor. 4.7. 2 Cor. 3.5.] he deceiveth himself in (his own) mind. [that is, foolishly makes himself believe that which is not so.]"}],"4":[{"catchword":null,"tekst":"But let every one prove [That is, examine and look to, not according to his own pleasure, but according to the rule and touch-stone of Gods Law] his own work, [that is, his own actions and dealings: not so much the action of others] and then [namely, when he finds that his actions are agreeable to the Law of God] shall he have glorying [that is, shall be able to glory with a good conscience, not of his own worthiness or merits, Rom. 3.27. 1 Cor. 1.29,31. but that he walks uprightly before God according to his Law, 1 Cor. 9.15. 2 Cor. 1.12.] in himself only, that is, in his own good walking, and in his own conscience] and not in another. [That is, not comparing himself with others, whom he thinketh not to be as good as he, as the Pharisees did, Luk 18:11.]"}],"5":[{"catchword":null,"tekst":"Foe every one shall bear his own burden, [That is, gives an account unto God of his own works and be judged according to his own actions.]"}],"6":[{"catchword":null,"tekst":"And he that is instructed [The Greek catechumens signifies indeed one that is instructed in the first principles of Religion, but here is taken more largely for all kinds of hearers, who by the preaching of Gods word are instructed in the Christian Religion, of what state so ever they be] in the word [namely, of God] let him impart [that is, let him also give his part for the maintenance of the Teachers] of all good [Gr. In all goods, i.e. liberally that the Teachers may so much the better without hindrance bestow all their time in the administration of their office] to him that instructeth (him) [Gr. Catechizeth, as before.]"}],"7":[{"catchword":null,"tekst":"Do not ere: [That is, do not vainly imagine and delude your selves, nor suffer your selves to be abused] God endures not to be mocked: [Gr. God is not mocked, namely, with vain pretences and evasions, which many use for not obeying Gods commands, seeing he doth not accepts evasions, neither let them go unpunished] for whatsoever a man soweth, [that is, hath bestowed as well upon the Teachers, wherefore is spoken before, as to the poor wherefore he speaks in that which follloweth. A similitude whereby the abundant fruit of communicativeness is set forth. As out of one grain that is, sown, oftentimes an hundred grow up and are gathered in again, Gen, 26.12. see of the same 2 Cor. 9.6.] that he shall also reap."}],"8":[{"catchword":null,"tekst":"For he that soweth in his own flesh, [that is, that bestoweth his goods only to live voluptuously thereof, or to gather treasures for himself, and doth not think of maintaining the ministers, and the poor] shall of the flesh [that is, of this abuse of his goods, which are bestowed only on his flesh] reap [that is, from thence he shall obtain recompense and fruit] corruption; [namely, temporal and eternal] but he that soweth in the Spirit [that is, he that bestoweth his goods about spiritual things, thereby to further Gods glory, and mens salvation, and to do good to the poor] shall of the spirit that is, forasmuch as he hath bestowed his goods about spiritual things] reap life everlasting. [that is, not only here in this life receive temporal blessings; but also hereafter eternal happiness, as a fruit of liberality, not of merit but of grace. See Mat. 25.v.34,35. &c.]"}],"9":[{"catchword":null,"tekst":"By doing good, [That is, shewing forth liberality] let us not grow slack, [the Greek signifieth by evil means to grow remiss in good: as many times it happens about the matter in hand; because the multitude of the poor is great, and almost among them oftentimes there are many unworthy and many unthankful persons; and because the time of recompense comes not presently] for in its due time [that is, although the time recompense be deferred, as there is time between sowing and reaping, yet nevertheless the same shall certainly come] we shall reap [see v.8.] if we grow not remis. [Gr. Be not dissolved, or loosened.]"}],"10":[{"catchword":null,"tekst":"So then, while we have time [Namely, to sow, i.e. to do good to the poor: which must be done in the time of this life which is short and uncertain] let us do good [Gr. Work good, i.e. shew forth liberality] to all [namely, poor or other who have need of our help and assistance. See Luk 10:36,37.] but most of all to those of the household of Faith. [that is, to believing Christians, who together with us are members of the Church, which is the house of the living God, 1 Tim. 3.15. To these we are more obliged, and it would be unfitting that they that belong to one house should let one another suffer hunger and want.]"}],"11":[{"catchword":null,"tekst":"See [Or ye see] how great an Epistle I have written to you [or with how many words, or writings] with mine own hand [that is, without causing it to be written by hand of another, as indeed he did, Rom. 16.22.] and only subscribed his name with salutation, 1 Cor. 16.21. Col. 4.18. Thereby he shews therefore how greatly he esteems the Galatians; and this he did that the false apostles should not say that it was not Paul&rsquo;s Epistle, and should bring forth another Epistle instead of it, as if it were written by him, as they indeed useth to do, 2 Thes. 2.2.]"}],"12":[{"catchword":null,"tekst":"All those that will make a fair shew [Or be much respected. He understands here the false Apostles] according to the flesh [Gr. In the flesh, i.e. by the observing of the outward and corporal ceremonies] they constrain you to be circumcised, only that they might not be persecuted [namely, by the Jews, as we are daily most persecuted by them, because we teach that the Law of Moses is fulfilled and abrogated by Christ] because of the cross of Christ. [that is, for the doctrine of Christ, which is so called, because the sum and contents of the same is, the life is procured for us by the cross of Christ, 1 Cor. 2.2.]"}],"13":[{"catchword":null,"tekst":"For they themselves also who are circumcised [Namely, and so strongly urge circumcision as yet necessary to salvation] keep not the Law: [namely, in the other points, which are also commanded in the Law, but lead an irregular and hypocritical life] but they will have you to be circumcised, that they might glory in your flesh. [that is, that they may get many adherents among you, and vainly thereof boast to the Jews.]"}],"14":[{"catchword":null,"tekst":"But far be it from me that I should glory otherwise then in the cross of our Lord Jesus Christ. [That is, in the orthodox doctrine of Christ crucified for us, 1 Cor. 2.2.] by which [namely, cross of Christ. Or Christ crucified: the sense comes all in one] the world [that is, honor with men] is crucified to me, [that is, despised and rejected by me] and I unto the world [namely, while I for the doctrine of Christ am despised, persecuted, and cast off by the world, 1 Cor. 4.12.13.]"}],"15":[{"catchword":null,"tekst":"For in Christ Jesus, [That is, in the Kingdome and church of Christ, or according to the doctrine of Christ. See Gal. 5.6.] neither hath circumcision any virtue, nor uncircumcision, [namely, by circumcision to obtain eternal life, or by uncurmcision to be hindred fr // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
