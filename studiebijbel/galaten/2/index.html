gliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Daarna ben ik, na veertien jaren, weer naar Jeruzalem opgegaan met Barnabas, en heb ook Titus meegenomen.","2":"En ik ging op door een openbaring, en stelde hun het Evangelie voor dat ik predik onder de heidenen; en in het bijzonder aan hen die in aanzien waren, opdat ik niet op enige manier tevergeefs zou lopen of gelopen hebben.","3":"Maar ook Titus, die bij mij was, hoewel hij een Griek was, werd niet gedwongen zich te laten besnijden.","4":"En dat vanwege de ingeslopen valse broeders, die ongemerkt waren binnengekomen om onze vrijheid te bespioneren, die wij in Christus Jezus hebben, om ons tot slavernij te brengen.","5":"Aan hen hebben wij ook geen moment onderworpen toegegeven, opdat de waarheid van het Evangelie bij u zou blijven.","6":"En van hen die in aanzien waren, wat zij ook waren — wat zij eertijds waren, verschilt mij niet; God kijkt niet naar de persoon van de mens — want zij die in aanzien waren, hebben mij niets toegevoegd.","7":"Maar integendeel, toen zij zagen dat aan mij het Evangelie voor de onbesnedenen toevertrouwd was, zoals aan Petrus dat voor de besnedenen;","8":"(Want Hij Die door Petrus krachtig werkte tot het apostelschap voor de besnedenen, Die werkte ook krachtig in mij onder de heidenen);","9":"en toen Jakobus, en Cefas, en Johannes, die geacht werden pilaren te zijn, de genade die mij gegeven was, erkenden, gaven zij mij en Barnabas de rechterhand van gemeenschap, opdat wij naar de heidenen, en zij naar de besnedenen zouden gaan;","10":"alleen dat wij de armen zouden gedenken; wat ik ook ijverig gedaan heb.","11":"En toen Petrus in Antiochië gekomen was, weerstond ik hem recht in het gezicht, omdat hij te bestraffen was.","12":"Want voordat sommigen van Jakobus gekomen waren, at hij samen met de heidenen; maar toen zij gekomen waren, trok hij zich terug en zonderde zichzelf af, uit vrees voor hen die uit de besnijdenis waren.","13":"En ook de andere Joden veinsden met hem mee; zodat ook Barnabas werd meegesleept door hun veinzerij.","14":"Maar toen ik zag dat zij niet oprecht wandelden naar de waarheid van het Evangelie, zei ik tegen Petrus, in aanwezigheid van allen: Als u, die een Jood bent, leeft naar heidense wijze en niet naar Joodse wijze, waarom dwingt u dan de heidenen naar de Joodse wijze te leven?","15":"Wij zijn van nature Joden, en geen zondaars uit de heidenen;","16":"maar omdat wij weten dat de mens niet gerechtvaardigd wordt uit de werken van de wet, maar door het geloof van Jezus Christus, hebben ook wij in Christus Jezus geloofd, opdat wij gerechtvaardigd zouden worden uit het geloof van Christus, en niet uit de werken van de wet; omdat uit de werken van de wet geen vlees zal worden gerechtvaardigd.","17":"Maar als wij, die in Christus zoeken gerechtvaardigd te worden, ook zelf zondaars blijken te zijn, is Christus dan een dienaar van de zonde? Dat zij verre.","18":"Want als ik dat wat ik afgebroken heb, weer opbouw, dan stel ik mijzelf tot een overtreder.","19":"Want ik ben door de wet voor de wet gestorven, opdat ik voor God zou leven.","20":"Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.","21":"Ik doe de genade van God niet teniet; want als de rechtvaardigheid door de wet is, dan is Christus tevergeefs gestorven."},"SV":{"1":"Daarna ben ik, na veertien jaren, wederom naar Jeruzalem opgegaan met Barnabas, ook Titus medegenomen hebbende.","2":"En ik ging op door een openbaring, en stelde hun het Evangelie voor, dat ik predik onder de heidenen; en in het bijzonder aan degenen, die in achting waren, opdat ik niet enigszins tevergeefs zou lopen of gelopen hebben.","3":"Maar ook Titus, die met mij was, een Griek zijnde, werd niet genoodzaakt zich te laten besnijden.","4":"En *dat* om der ingekropen valse broederen wil, die van bezijden ingekomen waren, om te verspieden onze vrijheid, die wij in Christus Jezus hebben, opdat zij ons zouden tot dienstbaarheid brengen.","5":"Denwelken wij ook niet, een uur hebben geweken met onderwerping, opdat de waarheid van het Evangelie bij u zou verblijven.","6":"En van degenen, die geacht waren, wat te zijn, hoedanigen zij eertijds waren, verschilt mij niet; God neemt den persoon des mensen niet aan; want die geacht waren, hebben mij niets toegebracht.","7":"Maar daarentegen, als zij zagen, dat aan mij het Evangelie der voorhuid toebetrouwd was, gelijk aan Petrus *dat* der besnijdenis;","8":"( Want Die in Petrus krachtelijk wrocht tot het apostelschap der besnijdenis, Die wrocht ook krachtelijk in mij onder de heidenen);","9":"En als Jakobus, en Cefas, en Johannes, die geacht waren pilaren te zijn, de genade, die mij gegeven was, bekenden, gaven zij mij en Barnabas de rechter *hand* der gemeenschap, opdat wij tot de heidenen, en zij tot de besnijdenis *zouden* *gaan*;","10":"Alleenlijk, dat wij den armen zouden gedenken; hetwelk zelf ik ook benaarstigd heb te doen.","11":"En toen Petrus te Antiochië gekomen was, wederstond ik hem in het aangezicht, omdat hij te bestraffen was.","12":"Want eer sommigen van Jakobus gekomen waren, at hij mede met de heidenen; maar toen zij gekomen waren, onttrok hij *zich* en scheidde zichzelven af, vrezende degenen, die uit de besnijdenis waren.","13":"En ook de andere Joden veinsden met hem; alzo dat ook Barnabas mede afgetrokken werd door hun veinzing.","14":"Maar als ik zag, dat zij niet recht wandelden naar de waarheid van het Evangelie, zeide ik tot Petrus in aller tegenwoordigheid: Indien gij, die een Jood zijt, naar heidense wijze leeft, en niet naar Joodse wijze, waarom noodzaakt gij de heidenen naar de Joodse wijze te leven?","15":"Wij zijn van nature Joden, en niet zondaars uit de heidenen;","16":"*Doch* wetende, dat de mens niet gerechtvaardigd wordt uit de werken der wet, maar door het geloof van Jezus Christus, zo hebben wij ook in Christus Jezus geloofd, opdat wij zouden gerechtvaardigd worden uit het geloof van Christus, en niet uit de werken der wet; daarom dat uit de werken der wet geen vlees zal gerechtvaardigd worden.","17":"Maar indien wij, die in Christus zoeken gerechtvaardigd te worden, ook zelven zondaars bevonden worden, is dan Christus een dienaar der zonde? Dat zij verre.","18":"Want indien ik, hetgeen ik afgebroken heb, datzelve wederom opbouw, zo stel ik mijzelven tot een overtreder.","19":"Want ik ben door de wet der wet gestorven, opdat ik Gode leven zou.","20":"Ik ben met Christus gekruist; en ik leef, *doch* niet meer ik, maar Christus leeft in mij; en hetgeen ik nu in het vlees leef, dat leef ik door het geloof des Zoons van God, Die mij liefgehad heeft, en Zichzelven voor mij overgegeven heeft.","21":"Ik doe de genade Gods niet te niet; want indien de rechtvaardigheid door de wet is, zo is dan Christus tevergeefs gestorven."},"KJV":{"1":"Then fourteen years after I went up again to Jerusalem with Barnabas, and took Titus with *me* also.","2":"And I went up by revelation, and communicated unto them that gospel which I preach among the Gentiles, but privately to them which were of reputation, lest by any means I should run, or had run, in vain.","3":"But neither Titus, who was with me, being a Greek, was compelled to be circumcised:","4":"And that because of false brethren unawares brought in, who came in privily to spy out our liberty which we have in Christ Jesus, that they might bring us into bondage:","5":"To whom we gave place by subjection, no, not for an hour; that the truth of the gospel might continue with you.","6":"But of these who seemed to be somewhat, (whatsoever they were, it maketh no matter to me: God accepteth no man's person:) for they who seemed *to be somewhat* in conference added nothing to me:","7":"But contrariwise, when they saw that the gospel of the uncircumcision was committed unto me, as *the gospel* of the circumcision *was* unto Peter;","8":"(For he that wrought effectually in Peter to the apostleship of the circumcision, the same was mighty in me toward the Gentiles:)","9":"And when James, Cephas, and John, who seemed to be pillars, perceived the grace that was given unto me, they gave to me and Barnabas the right hands of fellowship; that we *should go* unto the heathen, and they unto the circumcision.","10":"Only *they would* that we should remember the poor; the same which I also was forward to do.","11":"But when Peter was come to Antioch, I withstood him to the face, because he was to be blamed.","12":"For before that certain came from James, he did eat with the Gentiles: but when they were come, he withdrew and separated himself, fearing them which were of the circumcision.","13":"And the other Jews dissembled likewise with him; insomuch that Barnabas also was carried away with their dissimulation.","14":"But when I saw that they walked not uprightly according to the truth of the gospel, I said unto Peter before *them* all, If thou, being a Jew, livest after the manner of Gentiles, and not as do the Jews, why compellest thou the Gentiles to live as do the Jews?","15":"We *who are* Jews by nature, and not sinners of the Gentiles,","16":"Knowing that a man is not justified by the works of the law, but by the faith of Jesus Christ, even we have believed in Jesus Christ, that we might be justified by the faith of Christ, and not by the works of the law: for by the works of the law shall no flesh be justified.","17":"But if, while we seek to be justified by Christ, we ourselves also are found sinners, *is* therefore Christ the minister of sin? God forbid.","18":"For if I build again the things which I destroyed, I make myself a transgressor.","19":"For I through the law am dead to the law, that I might live unto God.","20":"I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me.","21":"I do not frustrate the grace of God: for if righteousness *come* by the law, then Christ is dead in vain."}},"tsk":{"1":[{"kopje":"veertien","refs":["Gal 1:18"]},{"kopje":"ben ik","refs":["Hand 15:2-4"]},{"kopje":"Barnabas","refs":["Gal 2:13","Hand 4:36","Hand 4:37","Hand 11:25","Hand 11:30","Hand 12:25","Hand 13:2","Hand 13:50","Hand 14:12","Hand 15:25","Hand 15:36-39","1 Kor 9:6","Kol 4:10"]},{"kopje":"Titus","refs":["Gal 2:3","2 Kor 8:16","2 Kor 8:23","Tit 1:4"]}],"2":[{"kopje":"door","refs":["Hand 16:9","Hand 16:10","Hand 18:9","Hand 23:11"]},{"kopje":"stelde hun voor","refs":["Gal 2:9","Gal 1:16","Hand 15:4","Hand 15:12","1 Kor 1:23","1 Kor 2:2"]},{"kopje":"dat","refs":["Gal 2:6","Gal 2:9","Pred 10:1","Hand 5:34","Fil 2:29"]},{"kopje":"ik niet","refs":["Matt 10:16","1 Kor 9:26","Fil 2:16","1 Tess 3:5"]}],"4":[{"kopje":"vanwege","refs":["Gal 5:10","Gal 5:12","Hand 15:1","Hand 15:24","Hand 20:30","2 Kor 11:13","2 Kor 11:17","2 Kor 11:26","1 Joh 4:1"]},{"kopje":"ongemerkt","refs":["2 Tim 3:6","2 Petr 2:1","2 Petr 2:2","Judas 1:4"]},{"kopje":"vrijheid","refs":["Gal 3:23-26","Gal 5:1","Gal 5:13","Ps 51:14","Ps 119:45","Joh 8:31-36","2 Kor 3:17","1 Petr 2:16","2 Petr 2:19"]},{"kopje":"brengen","refs":["Ga pan class=\"wl wl-kjv\" data-code=\"G1698\">me:</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">and</span> the life <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> <span class=\"wl wl-kjv\" data-code=\"G2198\">I</span> <span class=\"wl wl-kjv\" data-code=\"G3568\">now</span> <span class=\"wl wl-kjv\" data-code=\"G2198\">live</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G4561\">flesh</span> I <span class=\"wl wl-kjv\" data-code=\"G2198\">live</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">by</span> the <span class=\"wl wl-kjv\" data-code=\"G4102\">faith</span> of the <span class=\"wl wl-kjv\" data-code=\"G5207\">Son</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God,</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">who</span> <span class=\"wl wl-kjv\" data-code=\"G25\">loved</span> <span class=\"wl wl-kjv\" data-code=\"G3165\">me,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3860\">gave</span> <span class=\"wl wl-kjv\" data-code=\"G1438\">himself</span> <span class=\"wl wl-kjv\" data-code=\"G5228\">for</span> me.","21":"I <span class=\"wl wl-kjv\" data-code=\"G114\">do</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G114\">frustrate</span> the <span class=\"wl wl-kjv\" data-code=\"G5485\">grace</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> <span class=\"wl wl-kjv\" data-code=\"G1487\">if</span> <span class=\"wl wl-kjv\" data-code=\"G1343\">righteousness</span> come <span class=\"wl wl-kjv\" data-code=\"G1223\">by</span> the <span class=\"wl wl-kjv\" data-code=\"G3551\">law,</span> <span class=\"wl wl-kjv\" data-code=\"G686\">then</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> is <span class=\"wl wl-kjv\" data-code=\"G599\">dead</span> in vain."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"na veertien jaren,","tekst":"Namelijk boven de drie jaren, die hij in Arabië geweest is, Gal 1:18, zijnde zeventien jaren na zijne bekering, en het een en vijftigste jaar na Christus' geboorte."},{"catchword":"wederom naar Jeruzalem","tekst":"De apostel is na zijne bekering ettelijke malen naar Jeruzalem gegaan; eerst als hij weder uit Arabië na drie jaren gekomen was, Act 9:26; Gal 1:18; daarna brengende met Barnabas de collecte te Jeruzalem, Act 11:30 en Act 12:25, en als hij van de gemeente van Antiochië gezonden werd met Barnabas tot de synode van Jeruzalem Act 15:2, wederom Act 18:18, en eindelijk om der belofte wil, en om de collecte daar te brengen, wanneer hij daar gevangen werd, Act 21:15. Het schijnt dat de apostel hier spreekt van de reis, als hij naar de synode werd gezonden, die gehouden is in het zeventiende jaar na zijne bekering."},{"catchword":"opgegaan met","tekst":"Zo spreekt de Schrift, als men naar Jeruzalem toe reist, omdat het in de hoogte op bergen lag; gelijk daarentegen die van Jeruzalem kwamen, worden gezegd af te komen of te gaan. Zie Mar 3:22; Act 18:22."},{"catchword":"Titus medegenomen","tekst":"Zie van hem Tit 1:3. Deze schijnt hij medegenomen te hebben nog onbesneden zijnde, om alzo voor de valse broeders in hem te tonen de vrijheid van de wet der ceremoniën."}],"2":[{"catchword":"door een openbaring,","tekst":"Namelijk Gods, die door zijnen Geest en in gezichten Paulus alleszins openbaarde, waar Hij zijn dienst wilde gebruiken. Zie Act 13:2, en Act 16:7, Act 16:10, en Act 18:9, en Act 19:21, en Act 22:17, en Act 23:11."},{"catchword":"stelde","tekst":"Het Griekse woord betekent iemand enige zaak met onderlinge samenreding verhalen."},{"catchword":"hun het Evangelie","tekst":"Namelijk den apostelen en leraars, die te Jeruzalem waren. Dit geschiedde in het openbaar voor allen."},{"catchword":"in het bijzonder","tekst":"Namelijk om alzo te beter gelegenheid te hebben, om mijne leer van mij te verstaan en hunne overeenstemming met mij te betuigen."},{"catchword":"in achting waren,","tekst":"Namelijk van wege hunne gaven en aanzien in de gemeente, ouderdom, of, anderszins; en dienvolgens de bekwaamste waren om daarvan te oordelen. Deze worden genoemd vs.9."},{"catchword":"tevergeefs zou","tekst":"Dat is, zonder vrucht te doen onder de heidenen, hetwelk zou geschied zijn, indien hij de lasteringen der valse broeders hiermede niet had wederlegd en teniet gedaan."},{"catchword":"lopen of","tekst":"Dat is, den dienst des Evangelies volbrengen; ene gelijkenis van dergenen, die om strijd lopen in een loopbaan, om den prijs te winnen; 2Ti 4:7."}],"3":[{"catchword":"een Griek zijnde,","tekst":"Dat is, van heidense ouders geboren en onbesneden."},{"catchword":"genoodzaakt zich","tekst":"Namelijk door de apostelen, die te Jeruzalem waren, alzo zij ook verstonden dat de besnijdenis nu afgedaan was. Doch waarom evenwel Paulus Timotheüs heeft laten besnijden, zie Act 16:3."}],"4":[{"catchword":"En dat om","tekst":"De apostel geeft hier reden, waarom hij Titus niet wilde laten besnijden, opdat de valse broeders, die de besnijdenis nog nodig hielden ter zaligheid, Act 15:1, in hunne dwaling niet zouden gestijfd, maar met de Christelijke vrijheid te beter bekend worden."},{"catchword":"ingekropen","tekst":"Dat is, die zich met bedrog en veinzing tot de gemeente der gelovigen begeven hadden."},{"catchword":"valse broederen","tekst":"Dat is, dragende wel den naam van broeders en gelovigen, maar inderdaad zijnde vijanden van de zaligmakende leer."},{"catchword":"van bezijden","tekst":"Dat is, met geveinsde nederigheid en belijdenis bedektelijk ingeslopen in de gemeente."},{"catchword":"verspieden","tekst":"Namelijk ten kwade, om heimelijk te vernemen of zij niet enige oorzaak zouden kunnen vinden, om ons te lasteren."},{"catchword":"onze vrijheid,","tekst":"Namelijk van de wet der ceremoniën, waaronder ook de besnijdenis was, om daaruit oorzaak te nemen van ons te lasteren."},{"catchword":"in Christus Jezus","tekst":"Dat is, door Christus ons verkregen, als hetgeen door de ceremoniën afgebeeld was, in Hem en door Hem vervuld is; Col 2:17."},{"catchword":"tot dienstbaarheid","tekst":"Dat is, dat wij de Christelijke vrijheid verlatende, van het juk der ceremoniën, als ter zaligheid nodig, zouden onderwerpen."}],"5":[{"catchword":"niet een uur","tekst":"Den zwakken Joden hebben de apostelen een tijdlang toegegeven in het onderhouden der ceremoniën, om hen te gewinnen, 1Co 9:20, 1Co 9:22, en allengskens te brengen tot kennis van de Christelijke vrijheid; maar dezen valsen broeders hebben zij den minsten tijd niet willen ontwijken of toegeven, om hen in hunne dwalingen en hardnekkigheid niet te stijven."},{"catchword":"geweken","tekst":"Eene gelijkenis, genomen van kampvechters of worstelaars, die hunne partij sterkelijk wederstaan en niet wijken. Zie de waarheid van dit zeggen Act 15:1-2, enz."},{"catchword":"met onderwerping,","tekst":"Dat is, dat wij hun zouden onderdanig zijn, of ons hun onderwerpen in het onderhouden der ceremoniën."},{"catchword":"opdat de waarheid","tekst":"Dat is, dit hebben wij niet gedaan uit hardnekkigheid of twistgierigheid, maar om de zuiverheid van de leer des Evangelies tegen hen te verdedigen en staande te houden in de gemeenten, voornamelijk van Galatië."}],"6":[{"catchword":"degenen, die","tekst":"Dat is, de andere apostelen, die met rechten bij de gemeenten in grote achting zijn."},{"catchword":"hoedanigen zij","tekst":"Dat is, wat zij geweest zijn eer zij tot apostelen geroepen waren. Of, wat voordelen zij voor mij gehad hebben, eer ik tot een apostel ben geroepen geweest."},{"catchword":"verschilt mij niet;","tekst":"Dat is, daar is mij niet aan gelegen. Of, daar zie ik niet op. Of, dat verschilt niet van mijn doen en leren."},{"catchword":"God neemt den","tekst":"Van deze wijze van spreken, zie Mat 22:16; Act 10:34. Dat is, in zaken van waarheid ziet God niet op enige uiterlijke voordelen of aanzien dergenen, die de waarheid leren, maar alleen op de zaak zelve."},{"catchword":"hebben mij niets","tekst":"Namelijk aangaande de leer des Evangelies, dat ik van hen iets zou geleerd hebben, hetwelk mij de Heere Christus zelf niet zou geopenbaard hebben."}],"7":[{"catchword":"daarentegen,","tekst":"Dat is, zij hebben niet alleen in mijne leer niets berispt, maar ook daarentegen die voor goed en oprecht gekend."},{"catchword":"zij zagen, dat","tekst":"Dat is, bekenden, verstonden; gelijk vs.9."},{"catchword":"der voorhuid","tekst":"Dat is, der heidenen die onbesneden zijn, vs.8. Zie Rom 2:26, en Rom 3:30, en Rom 4:12. Namelijk om hetzelve voornamelijk onder hen te prediken."},{"catchword":"toebetrouwd was,","tekst":"Namelijk van Christus zelf en God den Vader; gelijK Gal 1:1."},{"catchword":"der besnijdenis;","tekst":"Dat is, der besneden Joden, om hetzelve onder hen te prediken. Zie Rom 3:30, en Rom 15:8."}],"8":[{"catchword":"(Want","tekst":"De apostel wijst hier aan waaruit de apostelen gezien en bekend hebben, dat hem het Evangelie was toevertrouwd, namelijk uit de krachtige werking Gods door zijne predikatie tot bekering der heidenen."},{"catchword":"Die in Petrus","tekst":"Namelijk de Heere Christus, die den dienst van Petrus vergezelschapt heeft met de krachtige werking Zijns Geestes."},{"catchword":"in mij","tekst":"Of, door mij, dat is, door mijn dienst."},{"catchword":"onder de heidenen);","tekst":"Namelijk tot hunne bekering."}],"9":[{"catchword":"Jakobus","tekst":"Zie van hem Gal 1:19."},{"catchword":"Céfas","tekst":"Dat is, Petrus. Zie van dezen naam Mat 16:18, en Joh 1:43."},{"catchword":"Johannes, die","tekst":"Namelijk de zoon van Zebedeus, een broeder van Jakobus den Grote, die van Herodes is onthalsd; Hand. 12. Zie van hem Mat 4:21, en Mat 10:2, en Mat 17:1."},{"catchword":"pilaren te zijn,","tekst":"Namelijk zo van het gezelschap der apostelen, als der gemeente, omdat zij door hun dienst de waarheid van het Evangelie standvastig voorstonden en staande hielden, en in het bijzonder in groot aanzien waren bij de gemeente, als een sieraad derzelve. Zie Jer 1:18, Rev 3:12."},{"catchword":"de genade, die","tekst":"Namelijk des apostelschaps, Rom 1:4. Of de werken en vruchten der genade. Of, de gaven, als daar waren met vreemde talen te spreken, profetie, wonderwerken en dergelijke."},{"catchword":"de rechter- hand","tekst":"Namelijk tot een teken en verzekering dat zij erkenden, dat wij met hem gemeenschap hadden, zo in den dienst van het apostelschap, als in de zuiverheid van de leer des Evangelies."},{"catchword":"wij tot de heidenen,","tekst":"Namelijk ik en Barnabas."},{"catchword":"zij tot","tekst":"Namelijk Petrus en de andere twee apostelen."},{"catchword":"de besnijdenis","tekst":"Dat is, tot de besneden Joden. Zie vs.7."}],"10":[{"catchword":"den armen zouden","tekst":"Namelijk om voor hen ene collecte onder de gemeente uit de heidenen te verzorgen."},{"catchword":"benaarstigd","tekst":"Dit blijkt doorgaans ook in zijne zendbrieven, en voornamelijk Rom 15:27; 1Co 16:1; 2Co 9:1."}],"11":[{"catchword":"Antiochië gekomen","tekst":"Zie van deze stad Act 11:19."},{"catchword":"in het aangezicht,","tekst":"Dat is, in zijne en aller tegenwoordigheid, gelijk vs.14 verklaard wordt. Zie ook 2Co 10:1."},{"catchword":"te bestraffen was","tekst":"Dat is, verdiende bestraft te worden."}],"12":[{"catchword":"van Jakobus gekomen","tekst":"Waarom Jakobus dezen naar Antiochië gezonden had, is onzeker; sommigen menen om te laten vernemen naar den staat der gemeente aldaar, of iets den apostelen, daar zijnde, te kennen te geven."},{"catchword":"at hij mede","tekst":"Namelijk allerlei spijs, ook die in het Oude Testament verboden was, volgende de Christelijke vrijheid, waarvan hij door een hemels gezicht verzekerd was, Hand. 10, zodat hij daaraan weldeed."},{"catchword":"met de heidenen;","tekst":"Namelijk die tot Christus bekeerd waren, en het juk der ceremonieële wet nooit waren onderworpen geweest."},{"catchword":"onttrok hij zich","tekst":"Dat is, wilde hij met de gelovige heidenen niet meer eten, daarmede veinzende alsof hij verstond, dat het eten van allerlei spijs den Christenen ongeoorloofd zou zijn; waaraan hij zeer kwalijk deed, gelijk in het volgende blijkt."},{"catchword":"vrezende degenen,","tekst":"Dat is, vrezende dat hij dezen Joden daarmede oorzaak zou geven om kwalijk van hem te spreken. Zie dergelijke Act 11:2."},{"catchword":"die uit de besnijdenis","tekst":"Dat is, de Joden, die tot den Christelijken godsdienst bekeerd waren, en nog het onderscheid der spijzen onderhielden, volgens de wet der ceremoniën, van de afdoening derzelve nog niet ten volle onderricht zijnde."}],"13":[{"catchword":"de andere Joden","tekst":"Namelijk die Christenen geworden waren, en die de Christelijke vrijheid enigszins geleerd en gebruikt hadden."},{"catchword":"veinsden met hem;","tekst":"De apostel noemt deze daad van Petrus tweemalen in vs.13 ene veinzing, welke is als iemand anders doet of spreekt dan hij in zijn hart of gemoed gevoelt; hetwelk nimmermeer geoorloofd is te doen. Dit deden ook deze Joden, door het voorbeeld van Petrus verleid zijnde."},{"catchword":"Bárnabas","tekst":"Van dezen, zie Act 11:22, Act 11:30, en Act 13:1-2, en Act 15:2."}],"14":[{"catchword":"niet recht wandelden","tekst":"Grieks de voeten niet recht stelden; dat is, gelijk als hinkten, niet rechtuit gingen om tot het doel en einde der Christelijke leer te komen; 1Ki 18:21; Heb 12:13."},{"catchword":"naar de waarheid","tekst":"Dat is, naar de zuiverheid; naar de ware leer des Evangelies, aangaande de Christelijke vrijheid."},{"catchword":"in aller tegenwoordigheid","tekst":"Namelijk overmits hij openlijk voor allen zondigde en ergernis gaf; 1Ti 5:20."},{"catchword":"naar heidense wijze","tekst":"Dat is, allerlei spijs vóór dezen gegeten hebt, gelijk de Christenen, uit de heidenen bekeerd, ook doen, volgende de Christelijke vrijheid, vs.12."},{"catchword":"noodzaakt gij de","tekst":"Namelijk met uw kwaad exempel, hetwelk hen noodzakelijk moet bewegen om na te volgen, of omdat gij dezelve voor geen rechte Christenen schijnt te erkennen, zo zij, gelijk gij, zich aan de wet der ceremoniën niet onderwerpen."},{"catchword":"naar de Joodse wijze","tekst":"Namelijk de wet der ceremoniën te onderhouden; hetwelk de Joden in het Oude Testament deden, en den bekeerden Joden, die de Christelijke vrijheid nog niet verstonden, voor een tijd nog toegelaten werd als een middelmatige zaak, om der stichting wil. Maar aangaande degenen, die uit de heidenen bekeerd waren, is in de synode van Jeruzalem goedgevonden, dat men hen daarmede niet zou bezwaren. Zie Act 15:10, Act 15:28."}],"15":[{"catchword":"Wij zijn","tekst":"Of, wij Joden van nature, en niet zondaars uit de heidenen, wetende, enz. Wij, namelijk, ik en ook gij, Petrus. Want de apostel verhaalt hier nog, hoe hij Petrus heeft aangesproken."},{"catchword":"van nature Joden,","tekst":"Dat is, van afkomst en geboorte, Rom 2:17, Rom 2:28, en dus geboren onder de wet der ceremoniën."},{"catchword":"niet zondaars","tekst":"Dat is, niet van heidense afkomst, welke afgodendienaars waren en grote zondaren, vreemd van het verbond Gods. Zie Eph 2:11. De apostel wil zeggen: Nademaal wij apostelen, die Joden zijn, onze rechtvaardigmaking niet zoeken in de werken der wet, maar in het geloof van Christus, zo moet men veel min de heidenen leren of noodzaken hunne rechtvaardigheid te zoeken in de onderhouding der wet; Rom 3:9."}],"16":[{"catchword":"wetende, dat","tekst":"Dat is, omdat wij het zekerlijk weten."},{"catchword":"de mens niet","tekst":"Wie, of hoe heilig hij ook zou mogen zijn."},{"catchword":"gerechtvaardigd","tekst":"Wat het zij gerechtvaardigd te worden, zie in de aantekeningen Rom 3:20."},{"catchword":"der wet,","tekst":"Namelijk Mozes, zo der zeden als der ceremoniën."},{"catchword":"maar","tekst":"Of, dan, gelijk Mat 12:4; 1Co 7:17; Gal 1:7; Rev 21:27. Dat is, alleen door het geloof, gelijk de volgende woorden dat klaarlijk medebrengen."},{"catchword":"door het geloof","tekst":"Dat is, als wij met een oprecht en levend geloof de gerechtigheid van Christus aannemen; Rom 3:24, Rom 3:28."},{"catchword":"zo hebben wij ook","tekst":"Dat is, dit is de oorzaak, waarom wij apostelen Christus met waar geloof aangenomen hebben. Want hadden wij door de wet kunnen gerechtvaardigd worden, zo zouden wij niet behoefd hebben tot Christus te gaan."},{"catchword":"daarom dat uit","tekst":"Dit bewijs is genomen uit de Schriftuur des Ouden Testaments, Psa 143:2."},{"catchword":"geen","tekst":"Grieks niet zal gerechtvaardigd worden alle vlees; dat is, geen vlees; een Hebreeuwse wijze van spreken; gelijk Psa 143:2; Rom 3:20."},{"catchword":"vlees zal gerechtvaardigd","tekst":"Dat is, mens. Zie Gen 6:12; Isa 40:6."}],"17":[{"catchword":"Maar indien wij,","tekst":"Hier spreekt de apostel nu verder de Galaten aan, en beantwoordt ene tegenwerping, die zij tegen de voorgaande leer zouden mogen voorwerpen; namelijk dat dezelve den mens zorgeloos maakt, tot zondigen aanleidt, en dat alzo Christus de mensen in het zondigen zou stijven. Van deze tegenwerping zie ook Rom 3:31, en Rom 6:1-3."},{"catchword":"zondaars bevonden","tekst":"Dat is, nog dagelijks zondigen."},{"catchword":"is dan Christus","tekst":"Dat is, en zal daaruit niet volgen dat dan Christus, enz."},{"catchword":"een dienaar der zonde?","tekst":"Dat is, dat deze leer van de rechtvaardigmaking des mensen zonder de werken der wet, alleen door het geloof van Christus, dienen zal en den mensen oorzaak zal geven om te vrijer te zondigen."},{"catchword":"Dat zij verre","tekst":"Zie de aantekeningen op Rom 6:2."}],"18":[{"catchword":"hetgeen ik afgebroken","tekst":"Namelijk door mijn ernstige en gedurige vermaningen om de zonden te vlieden."},{"catchword":"datzelve wederom","tekst":"Namelijk door ene leer, die zulke vermaningen krachteloos zou maken en de mensen tot zondigen verwekken."},{"catchword":"overtreder","tekst":"Namelijk van Gods bevel, en van de wetten der oprechtheid, die in een getrouw leraar behoort te wezen."}],"19":[{"catchword":"Want ik ben","tekst":"Dat deze leer des apostels uit zichzelve de mensen tot zondigen niet verwekt, bewijst hij met zijn eigen voorbeeld, voorbijgaande de voorbeelden van anderen, omdat het kan gebeuren, dat deze leer van sommigen wel daartoe misbruikt zou worden. Doch hetgeen hij van zichzelven zegt, is ook waar in alle ware gelovigen."},{"catchword":"door de wet","tekst":"Dat is, door den dienst der wet."},{"catchword":"der wet gestorven,","tekst":"Dat is, ik heb door de wet geleerd dat ik een groot zondaar ben, naar de wet den vloek en dood onderworpen, en dat de gerechtigheid, die de wet eist, in mij niet is, en dienvolgens dat de wet mij in den dood laat."},{"catchword":"Gode leven zou","tekst":"Dat is, een nieuw en heilig leven zou leiden, dat Gode behagelijk is, volgens zijne geboden, en overzulks niet der zonde. Zie Rom 6:11."}],"20":[{"catchword":"met Christus gekruist;","tekst":"Hoe dit te verstaan is, zie Rom 6:6, waar hetzelfde gezegd en nader verklaard wordt."},{"catchword":"ik leef, doch","tekst":"Namelijk nu waarlijk een geestelijk leven."},{"catchword":"niet meer ik,","tekst":"Namelijk zodanig als ik was vóór mijne bekering en wedergeboorte."},{"catchword":"maar Christus leeft in","tekst":"Namelijk door Zijn Heiligen Geest, door welken Hij mij geleidt in de wegen Gods en mij vruchtbaar maakt tot goede werken."},{"catchword":"in het vlees leef,","tekst":"Dat is, in dit mijn natuurlijk leven; hetwelk hij onderscheidt van het geestelijke."},{"catchword":"dat leef ik door het","tekst":"Dat is, hoewel ik mijne zwakheden in datzelfde vlees heb, zo geheel en vertrouw ik dat de Zoon Gods voor dezelve door Zijn dood voldaan heeft; die mij ook door Zijnen Geest levend maakt."},{"catchword":"overgegeven heeft","tekst":"Namelijk in den dood; Rom 4:25."}],"21":[{"catchword":"de genade Gods niet","tekst":"Namelijk die door Christus geschied is, waarvan hij in vs.20 gesproken heeft."},{"catchw /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
