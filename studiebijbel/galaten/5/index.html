t tot vrijheid geroepen, broeders, gebruik alleen de vrijheid niet als een aanleiding voor het vlees; maar dien elkaar door de liefde.","14":"Want de hele wet wordt in één woord vervuld, namelijk in dit: U zult uw naaste liefhebben als uzelf.","15":"Maar als u elkaar bijt en verslindt, kijk dan uit dat u niet door elkaar verteerd wordt.","16":"En ik zeg: Wandel door de Geest en u zult de begeerten van het vlees niet volbrengen.","17":"Want het vlees begeert tegen de Geest, en de Geest tegen het vlees; en die staan tegenover elkaar, zodat u niet doet wat u zou willen.","18":"Maar als u door de Geest geleid wordt, dan bent u niet onder de wet.","19":"De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,","20":"Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,","21":"Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.","22":"Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.","23":"Tegen zulke mensen is de wet niet.","24":"Maar wie van Christus zijn, hebben het vlees gekruisigd met zijn hartstochten en begeerten.","25":"Als wij door de Geest leven, laten wij dan ook door de Geest wandelen.","26":"Laten wij niet zoeken naar ijdele eer, elkaar tergen, elkaar benijden."},"SV":{"1":"Staat dan in de vrijheid, met welke ons Christus vrijgemaakt heeft, en wordt niet wederom met het juk der dienstbaarheid bevangen.","2":"Ziet, ik Paulus zeg u, zo gij u laat besnijden, dat Christus u niet nut zal zijn.","3":"En ik betuig wederom een iegelijk mens, die zich laat besnijden, dat hij een schuldenaar is de gehele wet te doen.","4":"Christus is u ijdel geworden, die door de wet gerechtvaardigd *wilt* worden; gij zijt van de genade vervallen.","5":"Want wij verwachten door den Geest, uit het geloof, de hoop der rechtvaardigheid.","6":"Want in Christus Jezus heeft noch besnijdenis enige kracht noch voorhuid, maar het geloof, door de liefde werkende.","7":"Gij liept wel; wie heeft u verhinderd der waarheid niet gehoorzaam te zijn?","8":"Dit gevoelen is niet uit Hem, Die u roept.","9":"Een weinig zuurdesem verzuurt het gehele deeg.","10":"Ik vertrouw van u in den Heere, dat gij niet anders zult gevoelen; maar die u ontroert, zal het oordeel dragen, wie hij ook zij.","11":"Maar ik, broeders! Indien ik nog de besnijdenis predik, waarom word ik nog vervolgd? Zo is dan de ergernis des kruises vernietigd.","12":"Och, of zij ook afgesneden werden, die u onrustig maken!","13":"Want gij zijt tot vrijheid geroepen, broeders, alleenlijk *gebruikt* de vrijheid niet tot een oorzaak voor het vlees; maar dient elkander door de liefde.","14":"Want de gehele wet wordt in een woord vervuld, *namelijk* in dit: Gij zult uw naaste liefhebben, gelijk uzelven.","15":"Maar indien gij elkander bijt en vereet, ziet toe, dat gij van elkander niet verteerd wordt.","16":"En ik zeg: Wandelt door den Geest en volbrengt de begeerlijkheden des vleses niet.","17":"Want het vlees begeert tegen den Geest, en de Geest tegen het vlees; en deze staan tegen elkander, alzo dat gij niet doet, hetgeen gij wildet.","18":"Maar indien gij door den Geest geleid wordt, zo zijt gij niet onder de wet.","19":"De werken des vleses nu zijn openbaar; welke zijn overspel, hoererij, onreinigheid, ontuchtigheid,","20":"Afgoderij, venijngeving, vijandschappen, twisten, afgunstigheden, toorn, gekijf, tweedracht, ketterijen,","21":"Nijd, moord, dronkenschappen, brasserijen, en dergelijke; van dewelke ik u te voren zeg, gelijk ik ook te voren gezegd heb, dat die zulke dingen doen, het Koninkrijk Gods niet zullen beërven.","22":"Maar de vrucht des Geestes is liefde, blijdschap, vrede, lankmoedigheid, goedertierenheid, goedheid, geloof, zachtmoedigheid, matigheid.","23":"Tegen de zodanigen is de wet niet.","24":"Maar die van Christus zijn, hebben het vlees gekruist met de bewegingen en begeerlijkheden.","25":"Indien wij door den Geest leven, zo laat ons ook door den Geest wandelen.","26":"Laat ons niet zijn zoekers van ijdele eer, elkander tergende, elkander benijdende."},"KJV":{"1":"Stand fast therefore in the liberty wherewith Christ hath made us free, and be not entangled again with the yoke of bondage.","2":"Behold, I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing.","3":"For I testify again to every man that is circumcised, that he is a debtor to do the whole law.","4":"Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace.","5":"For we through the Spirit wait for the hope of righteousness by faith.","6":"For in Jesus Christ neither circumcision availeth any thing, nor uncircumcision; but faith which worketh by love.","7":"Ye did run well; who did hinder you that ye should not obey the truth?","8":"This persuasion *cometh* not of him that calleth you.","9":"A little leaven leaveneth the whole lump.","10":"I have confidence in you through the Lord, that ye will be none otherwise minded: but he that troubleth you shall bear his judgment, whosoever he be.","11":"And I, brethren, if I yet preach circumcision, why do I yet suffer persecution? then is the offence of the cross ceased.","12":"I would they were even cut off which trouble you.","13":"For, brethren, ye have been called unto liberty; only *use* not liberty for an occasion to the flesh, but by love serve one another.","14":"For all the law is fulfilled in one word, *even* in this; Thou shalt love thy neighbour as thyself.","15":"But if ye bite and devour one another, take heed that ye be not consumed one of another.","16":"*This* I say then, Walk in the Spirit, and ye shall not fulfil the lust of the flesh.","17":"For the flesh lusteth against the Spirit, and the Spirit against the flesh: and these are contrary the one to the other: so that ye cannot do the things that ye would.","18":"But if ye be led of the Spirit, ye are not under the law.","19":"Now the works of the flesh are manifest, which are *these*; Adultery, fornication, uncleanness, lasciviousness,","20":"Idolatry, witchcraft, hatred, variance, emulations, wrath, strife, seditions, heresies,","21":"Envyings, murders, drunkenness, revellings, and such like: of the which I tell you before, as I have also told *you* in time past, that they which do such things shall not inherit the kingdom of God.","22":"But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith,","23":"Meekness, temperance: against such there is no law.","24":"And they that are Christ's have crucified the flesh with the affections and lusts.","25":"If we live in the Spirit, let us also walk in the Spirit.","26":"Let us not be desirous of vain glory, provoking one another, envying one another."}},"tsk":{"1":[{"kopje":"Sta","refs":["Spr 23:23","1 Kor 15:58","1 Kor 16:13","Ef 6:14","Fil 1:27","1 Tess 3:8","2 Tess 2:15","Hebr 3:6","Hebr 3:14","Hebr 4:14","Hebr 10:23","Hebr 10:35-39","Judas 1:3","Judas 1:20","Judas 1:21","Openb 2:25","Openb 3:3"]},{"kopje":"de vrijheid","refs":["Gal 5:13","Gal 2:4","Gal 3:25","Gal 4:26","Gal 4:31","Ps 51:14","Jes 61:1","Matt 11:28-30","Joh 8:32-36","Rom 6:14","Rom 6:18","Rom 7:3","Rom 7:6","Rom 8:2","1 Kor 7:22","2 Kor 3:17","1 Petr 2:16","2 Petr 2:19"]},{"kopje":"vangen","refs":["Gal 2:4","Gal 4:9","Matt 23:4","Hand 15:10","Kol 2:16-22","Hebr 9:8-11"]}],"2":[{"kopje":"ik, Paulus","refs":["1 Kor 16:21","2 Kor 10:1","1 Tess 2:18","Filem 1:9"]},{"kopje":"als","refs":["Gal 5:4","Gal 5:6","Gal 2:3-5","Hand 15:1","Hand 15:24","Hand 16:3","Hand 16:4","Rom 9:31","Rom 9:32","Rom 10:2","Rom 10:3","Hebr 4:2"]}],"3":[{"kopje":"verklaar","refs":["Deut 8:19","Deut 31:21","Neh 9:29","Neh 9:30","Neh 9:34","Luk 16:28","Hand 2:40","Hand 20:21","Ef 4:17","1 Tess 4:6","1 Joh 4:14"]},{"kopje":"v G5108\">such</span> there <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">no</span> law.","24":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> they that <span class=\"wl wl-kjv\" data-code=\"G3588\">are</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ's</span> have <span class=\"wl wl-kjv\" data-code=\"G4717\">crucified</span> the <span class=\"wl wl-kjv\" data-code=\"G4561\">flesh</span> <span class=\"wl wl-kjv\" data-code=\"G4862\">with</span> the <span class=\"wl wl-kjv\" data-code=\"G3804\">affections</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> lusts.","25":"<span class=\"wl wl-kjv\" data-code=\"G1487\">If</span> we <span class=\"wl wl-kjv\" data-code=\"G2198\">live</span> in the <span class=\"wl wl-kjv\" data-code=\"G4151\">Spirit,</span> let <span class=\"wl wl-kjv\" data-code=\"G4748\">us</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">also</span> <span class=\"wl wl-kjv\" data-code=\"G4748\">walk</span> in the Spirit.","26":"Let <span class=\"wl wl-kjv\" data-code=\"G1096\">us</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G1096\">be</span> desirous of vain <span class=\"wl wl-kjv\" data-code=\"G2755\">glory,</span> <span class=\"wl wl-kjv\" data-code=\"G4292\">provoking</span> one <span class=\"wl wl-kjv\" data-code=\"G240\">another,</span> <span class=\"wl wl-kjv\" data-code=\"G5354\">envying</span> one another."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dan","tekst":"Dat is, blijft volstandig zonder afwijken. Zie 1Co 16:13."},{"catchword":"in de vrijheid,","tekst":"Namelijk van de dienstbaarheid der wet, waarvan in de voorgaande hoofdstukken is gesproken."},{"catchword":"Christus vrijgemaakt","tekst":"Namelijk die ons van den vloek en dwang der wet, en al de ceremoniën der wet vervuld en afgedaan heeft. Zie Joh 8:36."},{"catchword":"wederom met","tekst":"Gelijk gij tevoren de dienstbaarheid der afgoden onderworpen zijt geweest, en daarvan verlost, neemt niet wederom een nieuwe dienstbaarheid van ceremoniën aan. Zie Gal 4:8."},{"catchword":"het juk der dienstbaarheid","tekst":"Dat is, de zware en moeilijke onderhouding der ceremoniën, welke Petrus, Act 15:10, noemt een ondragelijk juk."},{"catchword":"bevangen","tekst":"Dat is, gelijk als met zelen en strikken daaraan gebonden en vast gemaakt; ene gelijkenis, genomen van de ossen, die men het juk aan de hoornen vastbindt, om hen te dwingen."}],"2":[{"catchword":"ik Paulus zeg u,","tekst":"Namelijk die een apostel ben van Jezus Christus, niet van mensen noch door mensen, maar van God zelf daartoe geroepen. Zie Gal 1:1, Hij stelt dan zijn apostolische autoriteit tegen het aanzien van de valse apostelen."},{"catchword":"zo gij u laat besnijden,","tekst":"Grieks zo gij besneden wordt; namelijk met zulk ene mening, dat de besnijdenis nog ter zaligheid nodig is, en dat gij daardoor zult gerechtvaardigd worden."},{"catchword":"dat Christus u niet","tekst":"Dat is, dat gij dan geen deel hebt aan de gerechtigheid van Christus. Want al diegenen, die hun eigen gerechtigheid zoeken op te richten en aan de gerechtigheid Gods niet onderworpen zijn, Rom 10:3, en die de besnijdenis nog houden als noodzakelijk, die verzaken daarmede dat Christus volbracht heeft hetgeen daardoor afgebeeld was."}],"3":[{"catchword":"die zich laat besnijden,","tekst":"Grieks die besneden wordt, gelijk tevoren vs.2."},{"catchword":"een schuldenaar is","tekst":"Dat is, dat hij daarmede zichzelven verplicht en verbindt."},{"catchword":"de gehele wet te doen","tekst":"Dat is, de ganse wet in alles volkomenlijk te onderhouden om door de wet gerechtvaardigd te worden; hetwelk, dewijl niemand doet of nu doen kan, zo zijn allen, die in de wet hunne gerechtigheid zoeken, den vloek onderworpen; Deu 27:26; Jam 2:10."}],"4":[{"catchword":"ijdel geworden,","tekst":"Grieks gij zijt verijdeld of vernietigd van Christus; dat is, hoewel gij Christus' gerechtigheid wilt mengen met de wet, zo zal dat u niet mogen baten, alzo zulke vermenging onmogelijk is; en de gerechtigheid van Christus teniet gedaan wordt, zo de gerechtigheid uit de wet is; Gal 2:21."},{"catchword":"wilt worden;","tekst":"Grieks gerechtvaardigd wordt."},{"catchword":"van de genade","tekst":"Dat is, van de gunst Gods, en dienvolgens van al de weldaden Gods, die daaruit vloeien, als daar zijn de krachtige beroeping, het geloof, vergeving der zonden, rechtvaardigmaking, heiligmaking en het eeuwige leven. Want door de werken èn door de genade gerechtvaardigd te worden, kunnen tezamen niet bestaan; Rom 11:6."},{"catchword":"vervallen","tekst":"Dat is, zoudt vervallen, zo gij door de wet wilt gerechtvaardigd worden. Of dit spreekt hij niet ten aanzien van de ware gelovigen, die nimmermeer van de genade Gods ten enenmale nog eindelijk vervallen, 1Pe 1:5; 1Jo 3:9, maar ten aanzien van de huichelaars, die in de genade Gods schenen te staan, en gezegd worden van dezelve te vervallen, wanneer zij bekend en openbaar worden, dat zij in de genade Gods nimmer gestaan hebben; 1Jo 2:19."}],"5":[{"catchword":"wij","tekst":"Namelijk gelovigen uit de Joden, wien de wet gegeven was; hoeveel te meer behoort dan gij, die uit de heidenen zijt, en de wet niet gehad hebt, ook door het geloof en niet door de wet de rechtvaardigheid te zoeken; Gal 2:15-16."},{"catchword":"verwachten","tekst":"Dat is, vertrouwen dat wij de rechtvaardigheid hebben en de vrucht van die, welke wij nu hopen, zekerlijk zullen verkrijgen; Rom 8:24; Tit 2:13."},{"catchword":"door den Geest,","tekst":"Namelijk van God, van die dit vertrouwen in ons werkt."},{"catchword":"uit het geloof, de","tekst":"Namelijk in Christus, waarmede wij de verdiensten van Christus aannemen. En niet uit de werken der wet."}],"6":[{"catchword":"in Christus Jezus","tekst":"Dat is, nu in het rijk van Christus onder het Nieuwe Testament; om een Christen te zijn."},{"catchword":"besnijdenis enige","tekst":"Dat is, al de ceremoniën en voordelen, die den Joden eertijds gegeven waren."},{"catchword":"kracht noch","tekst":"Namelijk om te rechtvaardigen."},{"catchword":"voorhuid, maar","tekst":"Dat is, onbesneden te zijn, dat vordert en schaadt niet ter zaligheid. Zie Rom 3:30."},{"catchword":"het geloof,","tekst":"Namelijk heeft alleen die kracht, als zijnde een werking, waardoor wij de gerechtigheid van Christus aannemen en deelachtig worden."},{"catchword":"door de liefde","tekst":"Dat is, door betoning van de werken der liefde jegens God en de naasten. Waarmede het ware geloof onderscheiden wordt van de uiterlijke belijdenis des geloofs van de huichelaars, hetwelk een dood geloof is, en niet kan zalig maken. Zie Jam 2:14, Jam 2:20, Jam 2:26. Met deze beschrijving beantwoordt hij ook de lastering der valse leraars, die leerden dat de leer van de rechtvaardigmaking door het geloof alleen zorgeloze en goddeloze mensen maakt."},{"catchword":"werkende","tekst":"Of, werkachtig en dadig zijnde."}],"7":[{"catchword":"liept wel;","tekst":"Namelijk in de loopbanen des rechten geloofs, dat is, vasthoudende aan de rechte leer der rechtvaardigmaking en der Christelijke vrijheid; ene gelijkenis van degenen, die om strijd in de loopbaan lopen. Zie 1Co 9:24, 1Co 9:26; Phi 3:14."},{"catchword":"wie heeft u verhinderd","tekst":"Dat is, uw loop opgehouden en als afgesneden. Dit vraagt hij, als zich verwonderende over hun grote onstandvastigheid in de zuivere leer, en meteen legt hij hiervan de voornaamste schuld op de verleiders, om hun te tonen dat hij geloofde, dat zij uit zwakheid en niet uit boosheid zondigden, en om alzo hen te beter te gewinnen."},{"catchword":"der waarheid","tekst":"Namelijk van de rechtvaardigmaking der mensen uit genade, door het geloof, zonder de werken; Gal 2:5."},{"catchword":"niet gehoorzaam te zijn?","tekst":"Dat is, niet aan te nemen, niet te geloven, en niet standvastiglijk daarbij te blijven."}],"8":[{"catchword":"Dit gevoelen","tekst":"Grieks deze wijsmaking, of, overreding; namelijk der valse apostelen, die u wijsmaken en zoeken u te doen geloven dat de rechtvaardigheid ook uit de wet is, en niet alleen door Christus."},{"catchword":"Hem, Die u roept","tekst":"Namelijk God, of Christus. Zie Gal 1:6, en overzulks niet goed, noch met de waarheid overeenkomende."}],"9":[{"catchword":"Een weinig zuurdesem","tekst":"Zie van deze gelijkenis 1Co 5:6. Door dezen zuurdesem kan verstaan worden, òf de valse leer zelve, gelijk Mat 16:6, Mat 16:12, òf de mensen, die deze leer dreven, welke, hoewel zij weinigen waren, evenwel grote schade deden om de gehele gemeente mettertijd te verderven, en daarom te meer gemeden moesten worden."}],"10":[{"catchword":"niet anders zult gevoelen;","tekst":"Namelijk gelijk ik u geleerd heb, en nog in dezen zendbrief leer."},{"catchword":"die u ontroert, zal","tekst":"Dat is, met valse en vreemde leer uwe conscientiën onrustig maakt en den vrede van de gemeente verstoort."},{"catchword":"het oordeel dragen,","tekst":"Dat is, van God rechtvaardiglijk en zekerlijk gestraft geworden; ene Hebreeuwse wijze van spreken. Zie Mat 23:14."},{"catchword":"wie hij ook zij","tekst":"Dat is, die daaraan schuld heeft, van welk aanzien hij ook zou mogen wezen."}],"11":[{"catchword":"nog","tekst":"Namelijk gelijk ik gedreven heb als ik nog een Farizeër was, met zulke mening, om daardoor gerechtvaardigd te worden."},{"catchword":"de besnijdenis predik,","tekst":"Dat is, leer, dat de besnijdenis en de andere ceremoniën der wet nodig zijn om ter zaligheid onderhouden te worden, gelijk wij den valsen apostelen nageven."},{"catchword":"waarom word ik nog","tekst":"Dat is, dat zulk nageven onwaarachtig is, blijkt uit de vervolgingen, die mij de Joden dagelijks aandoen, om geen andere oorzaak, dan omdat ik leer dat de besnijdenis en andere ceremoniën van Christus afgedaan zijn."},{"catchword":"de ergernis des","tekst":"Dat is, de aanstoot, dien de Joden nemen van de Christelijke leer, waardoor geleerd wordt, dat alleen Christus door Zijne kruisiging en dood ons van den vloek verlost, en de zaligheid verkregen heeft; 1Co 1:23."},{"catchword":"vernietigd","tekst":"Dat is, zou ophouden."}],"12":[{"catchword":"afgesneden werden,","tekst":"Namelijk van de gemeente en het gezelschap der gelovigen. Dit wenst hij uit een apostolischen ijver tot de eer van God en tot de zaligheid der mensen, niet uit een wraakgierig gemoed. Daarom strijdt zulks niet tegen het gebod van Christus, Mat 5:44, noch tegen zijn eigen leer; Rom 12:14."},{"catchword":"onrustig maken","tekst":"Dat is, ontroeren, gelijk vs.10."}],"13":[{"catchword":"tot vrijheid","tekst":"Zie vs.1."},{"catchword":"geroepen, broeders,","tekst":"Namelijk van God en van Christus. Zie vs.8; Gal 1:6."},{"catchword":"gebruikt de","tekst":"Tevoren heeft hij hen vermaand om standvastig te blijven bij de Christelijke vrijheid; hier vermaant hij hen verder tot het rechte gebruik derzelve."},{"catchword":"een oorzaak voor","tekst":"Dat is, om deze vrijheid te misbruiken tot volbrenging van de begeerlijkheden des vleesches en tot een dekmantel der zonden; 1Pe 2:16."},{"catchword":"dient elkander door","tekst":"Dat is, hoewel gij vrij zijt van de dienstbaarheid der wet, zo moet gij evenwel elkander de diensten der liefde betonen. Want hoewel gij vrij zijt van de wet der ceremoniën, zo zijt gij niet vrij van de wet der liefde; Rom 13:8; 1Pe 2:17."}],"14":[{"catchword":"de gehele wet","tekst":"Grieks alle de wet; namelijk van de tweede tafel, waarin God ons voorschrijft hoe wij ons moeten gedragen jegens onze naasten. Zie Rom 13:8."},{"catchword":"een woord","tekst":"Dat is, in een gebod. Zie Deu 4:13."},{"catchword":"vervuld, namelijk","tekst":"Dat is, kortelijk en sommierlijk als in één hoofdstuk begrepen. Zie Lev 19:18; Mat 22:39; Rom 13:8."}],"15":[{"catchword":"bijt en vereet,","tekst":"Dat is, met twisten, lasteren en onenigheden over dit stuk van de Christelijke vrijheid elkander kwelt en leed aandoet."},{"catchword":"verteerd wordt","tekst":"Dat is, dat door uw twisten uw geloof niet gekrenkt, en de welstand, vrede en rust der gemeente verbroken worde."}],"16":[{"catchword":"ik zeg","tekst":"Wandelt Dat is, dit is het, dat ik wil zeggen. Zie Gal 3:17, en Gal 4:1. Hij verklaart hier nader hetgeen hij gezegd had vs.13, en wijst het middel aan, waardoor het misbruik der vrijheid vermeden wordt."},{"catchword":"door den Geest","tekst":"Wanneer geest en vlees in den mens tegen elkander gesteld worden, zo wordt door den geest verstaan het deel des mensen, dat door den Geest is wedergeboren, en door het vlees de natuurlijke verdorvenheid, die de wedergeborenen nog aankleeft. Zie Rom 8:1."},{"catchword":"en volbrengt","tekst":"Of, en gij zult niet volbrengen; aanwijzende welke vrucht daaruit zal volgen, als men naar den Geest wandelt. En zo zal dan dit het middel zijn, om het misbruik der vrijheid te verhoeden."},{"catchword":"de begeerlijkheden","tekst":"Dat is, de kwade gedachten, genegenheden, bewegingen en lusten der verdorven natuur, die den wedergeborenen nog aanhangen."}],"17":[{"catchword":"begeert tegen den Geest,","tekst":"Dat is, de kwade lusten des vleesches strijden tegen de goede lusten, die de Heilige Geest in de wedergeborenen verwekt."},{"catchword":"staan tegen elkander,","tekst":"Dat is, zijn tegenstrijdende lusten."},{"catchword":"dat gij niet doet,","tekst":"Dat is, altijd niet kunt volbrengen."},{"catchword":"gij wildet","tekst":"Namelijk naar de goede lusten en begeerten, die de Heilige Geest in u gewrocht heeft; gelijk ook daarentegen de lusten des Geestes verhinderen dat gij de lusten des vleesches volbrengt; Rom 7:19, enz."}],"18":[{"catchword":"door den Geest","tekst":"Namelijk alzo dat de Geest en de goede begeerlijkheden, die dezelve in u werkt, de overhand in u hebben, zodat gij u daardoor in de wegen Gods laat geleiden."},{"catchword":"niet onder de wet","tekst":"Dat is, niet onder den dwang der wet, die door vrees van de dreiging der wet ontstaat, noch onder den vloek deszelven, noch onder het juk der ceremoniën. Want deze Geest, die de wedergeborenen leidt, is niet een Geest der dienstbaarheid tot vrees, maar der aanneming tot kinderen en der vrijheid. Zie Rom 8:15; Gal 4:6."}],"19":[{"catchword":"des vleses nu","tekst":"Dat is, die het vlees of de verdorvenheid onzer natuur voortbrengt: en waarin des mensen verdorven aard behagen heeft."},{"catchword":"zijn openbaar;","tekst":"Dat is, zijn genoegzaam bekend, alzo men uit het licht der natuur weet dat ze kwaad, schandelijk en oneerlijk zijn. Of, kunnen niet verholen blijven, hoezeer de mensen die ook zoeken te bedekken."},{"catchword":"ontuchtigheid,","tekst":"Dat is, geilheid, dartelheid, wulpsheid."}],"20":[{"catchword":"venijngeving,","tekst":"Of, toverij."},{"catchword":"afgunstigheden,","tekst":"Of, jaloezie, wanneer men misgunt dat het zijnen naasten wel gaat, of zijn voordeel zoekt met schade zijns naasten."}],"21":[{"catchword":"brasserijen,","tekst":"Zie Rom 13:13; Rom 5:18."},{"catchword":"dergelijke;","tekst":"Dit wordt daar bij gedaan, omdat er nog veel meer zijn, en het te lang zou vallen die alle te verhalen."},{"catchword":"te voren zeg,","tekst":"Dat is, niet alleen als een leraar onderwijs, maar ook als een profeet tevoren zekerlijk verkondig, en waarschuw."},{"catchword":"te voren gezegd heb,","tekst":"Namelijk 1Co 6:9-10; Eph 5:5."},{"catchword":"die zulke dingen doen,","tekst":"Dat is, zulke en dergelijke werken des vleesches."},{"catchword":"het Koninkrijk Gods","tekst":"Namelijk het rijk der heerlijkheid: of de eeuwige zaligheid in den hemel."},{"catchword":"niet zullen","tekst":"Namelijk hetzij dat zij zich van zulke zonden van harte bekeren."},{"catchword":"beërven","tekst":"Dat is, verkrijgen en bezitten. Want dit rijk wordt niet verkregen uit verdiensten, maar uit genade, als ene erfenis. Zie Mat 19:29, en Mat 25:34; 1Co 6:10."}],"22":[{"catchword":"de vrucht des Geestes","tekst":"Dat is, de werken, die de Geest Gods in de wedergeborenen werkt; en uit welke de wedergeboorte bekend wordt."},{"catchword":"blijdschap,","tekst":"Namelijk door den Heiligen Geest, Rom 14:17; ontstaande uit de verzekering, dat wij vrede met God hebben."},{"catchword":"geloof,","tekst":"Dat is, trouw in de belofte en bediening zijns ambts."},{"catchword":"matigheid","tekst":"Of, kuisheid, onthouding van onbehoorlijk lusten."}],"23":[{"catchword":"de zodanigen","tekst":"Dat is, die deze en dergelijke deugden in hun leven beoefenen en betonen."},{"catchword":"is de wet niet","tekst":"Namelijk die hen zal verdoemen. Zie vs.18."}],"24":[{"catchword":"die van Christus zijn,","tekst":"Dat is, in Christus door het ware geloof ingelijfd, Hem toebehoren; die rechte Christenen zijn."},{"catchword":"hebben het vlees","tekst":"Dat is, zijn niet alleen schuldig hun bedorven aard te doden, en die niet te laten heersen; maar door de kracht van den Geest van Christus, die zij hebben ontvangen, doen ook zulks inderdaad."},{"catchword":"de bewegingen en","tekst":"Namelijk niet de natuurlijke, maar die tegen de wet Gods strijden, welke voortkomen uit den bedorven aard des mensen; Rom 1:24, Rom 1:26."}],"25":[{"catchword":"den Geest leven,","tekst":"Dat is, door den Heiligen Geest uit den dood der zonden tot een nieuw leven opgewekt zijn."},{"catchword":"door den Geest wandelen","tekst":"Dat is, in ons leven volgen de leidingen des Heiligen Geestes en de voorzegde vruchten derzelve voortbrengen; Rom 8:5, enz."}],"26":[{"catchword":"Laat ons niet zijn","tekst":"De apostel vermaant nu verder de Galaten om enige bijzondere zonden te vlieden en deugden te betrachten. Waarom sommigen het zesde hoofdstuk van hier beginnen."},{"catchword":"zoekers van ijdele","tekst":"Dat is, eergierig zijn, om boven anderen uit te steken, of over anderen te heersen."},{"catchword":"tergende, elkander","tekst":"Grieks beroepende, of, uitdagende, namelijk met verachting, smaadheden, schelden, of dergelijke."},{"catchword":"benijdende","tekst":"Namelijk elkanders deugden, staten, of gelegenheden, hetwelk gemeenlijk uit eergierigheid voortkomt, en met dezelve vergezelschapt is."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Stand therefore [That is, continue steadfast without turning away. See 1 Cor. 16.13.] In the liberty, [namely, from the bondage of the Law, mentioned in the former chapters] with which Christ hath made us free, [namely, who hath freed us from the curse and constraints of the Law, and hath fulfilled and abolished all the legal ceremonies. See Joh 8:36.] And be not again [as ye were subject formerly to the bondage of Idols, and are freed from it, do not again undergo a new bondage of ceremonies. See Gal. 4.] Caught [that is, bound and fastened thereto as it were with cords and snares. A similitude taken from Oxen, on whose horns men bind fast the yoke to keep them under] with the yoke of bondage. [That is, the difficult and troublesome observation of the Ceremonies, which Peter, Act 15:10. calls a yoke not to be born.]"}],"2":[{"catchword":null,"tekst":"Behold, I Paul [Namely, whom am an Apostle of Jesus Christ, called thereunto, not of men nor by men, but by God. See Gal. 1.1. Therefore he opposes his Apostolic authority, to the esteem of the false Apostles] say unto you, that if ye suffer your selves to be circumcised [Gr. If ye be circumcised? Namely, with such an opinion that circumcision is yet necessary to salvation, and ye shall be justified thereby] Christ shall not be profitable unto you. [That is, that then you have no part in the righteousness, are not subject to the righteousness of God, Rom. 10.3. And he that holds circumcision necessary still, he thereby denies that Christ hath fulfilled that which was pre-figured thereby.]"}],"3":[{"catchword":null,"tekst":"And I testify again to every men who suffers himself to be circumcised, [That is, who is circumcised, as before ver.2.] that he is a debtor [that is, that he thereby engageth and obligeth himself] to do the whole Law. [That is, to keep the Law perfectly in every thing, to be justified by the Law: seeing no man doth, or can do now, therefore all that seek their righteousness in the Law are subject to the curse, Deu. 27.26. Jam. 2.10.]"}],"4":[{"catchword":null,"tekst":"Christ is become vain unto you [Gr. Ye are made vain, or brought to naught from Christ, i.e. although you would mingle Christ&acirc;&euro;&trade;s righteousness with the Law, that can not profit you, seeing such mingling is impossible, and the righteousness of Christ is brought to naught, if righteousness be by the Law, Gal. 2.21.] who (will) be justified [Gr. Are justified] by the Law, ye are fallen [that is, ye should fall, if ye would be justified by the Law. Or he speaketh this not in respect of true believers, who never totally nor finally fall from the grace of God, 1 Pet. 1.5. 1 John. 3.9. But in respect of hypocrites, who seemed to stand in the grace of God, and are said to fall from the same, when they are made known and manifest, that they never stood in the grace of God, 1Jn 2:19.] from grace. [That is, from the savor of God, and consequently from all Gods benefits, which flow from hence, such as are effectual calling, faith, remission of sins, justification, sanctification and eternal life. For to be justified by works and by grace cannot stand together, Rom. 11.6.]"}],"5":[{"catchword":null,"tekst":"For we [Namely, believers of the Jews, to whom the Law was given: How much more then ought ye who are Gentiles, and that had not have the Law, to seek righteousness also by Faith and not by the Law, Gal. 2.15, 16.] expect [that is, are confident that we have righteousness, and shall certainly obtain the fruit thereof, which we now hope for, Rom. 8.24. Tit. 2.13.] Through the Spirit [namely, of God which works this confidence in us] by faith, [namely, in Christ: whereby we receive the merits of Christ. And not by the works of the Law] the hope of righteousness."}],"6":[{"catchword":null,"tekst":"For in Christ, [That is, now in the Kingdome of Christ under the new Testament; to be a Christian] neither hath circumcision [that is, all the ceremonies and advantages which in the former times were given to the Jews] any virtue [namely, to justify] nor forsaking: [that is, to be circumcised, that neither furthers nor hinders salvation] See Rom. 3.30.] But faith [namely, hath only that virtue, as being an instrument whereby we receive and are made Partakers of the righteousness of Christ] working or being operative and active] by love, [that is, by shewing forth the works of love towards God and our neighbor. Whereby true Faith is distinguished from the outward profession of faith of hypocrites, which is dead faith, and cannot save. See Jam. 2.14. 20, 26. By this description he also answers the calumny of the false Teachers, who taught that the doctrine of justification by faith alone made men careless and ungodly.]"}],"7":[{"catchword":null,"tekst":"Ye did run well, [Namely, in the race of true faith, i.e. adhering to the doctrine of justification and Christian liberty. A similitude taken from those who contend in the running of race. See 1 Cor. 9.24,26. Phil. 3.14.] who did hinder you [that is, stopped and as it were cut off your course, This he demands as admitting at their greatest unsteadfastness in the pure doctrine: and withal he lays the principal blame hereof on the seducers, to shew that he believed that they sinned out of weakness and not out of wickedness, and that so the better to gain them] not to be obedient [that is, not to receive, not to believe, and not to continue steadfastly therein] to the truth. [Namely, of mans justification of grace by faith, without works, Gal. 2.5.]"}],"8":[{"catchword":null,"tekst":"This opinion [Gr. This making-believe, or persuasion, namely, of the false Apostles, who pervade you and seek to make you believe, that righteousness is also by the Law, and not only by Christ] is not of him that calleth you. [Namely, God or Christ. See Gal. 1.6.] And for this course not good, nor agreeable to the truth.]"}],"9":[{"catchword":null,"tekst":"A little leaven sowreth the whole dough. [See of this similitude, 1 Cor. 5.6. By this leaven may be understood either the false doctrine it self, as Mat. 16.v.6.12. Or the men who promoted this doctrine, who although there were few, yet nevertheless did much hurt, to corrupt the whole Church in time, and therefore must the more be eschewed.]"}],"10":[{"catchword":null,"tekst":"I am confident of you in the Lord, that ye will be of other opinion: [Namely, then I have taught you, and yet in this Epistle teach you] but he that troubleth you, [that is, disquiets your consciences with false and strange doctrine, and disturbs the peace of the Church] shall bear the judgment, [that is, be justly and certainly punished by God. A Hebrew phrase, see Mat. 23.24.] whosoever he be. [That is, who is guilty thereof, of what esteem so ever he may be.]"}],"11":[{"catchword":null,"tekst":"But I brethren, if I yet [namely, as I urged it when I was yet a Pharisee, with such an opinion that I should be justified thereby] preach circumcision, [that is, teach that circumcision and the other ceremonies of the Law, are necessary to be observed to salvation, as the false Apostles backbite me] why am I yet persecuted? [that is, that this backbiting is true appears by the persecutions, the Jews daily lay upon me, for no other cause but because I teach that circumcision and other ceremonies are abolished by Christ] then is the offence of the cross [that is, the offence which the Jews take from the Christian doctrine, whereby is taught that Christ by his crucifying and death only, hath redeemed us from the curse, and procured salvation for us, 1 Cor. 1.23.] brought to naught. [That is, should cease.]"}],"12":[{"catchword":null,"tekst":"Oh! that they were even cut off, [Namely, from the church and company of the faithfull. This he wishes out of an Apolstolic zeal to the glory of God, and to the salvation of men : not out of a revengeful mind. Therefore this is not repugnant to Christ&rsquo;s command, Mat. 5.44, nor to his own doctrine, Rom. 12.14.] that disquiet you. [that is, trouble you, as verse 10.]"}],"13":[{"catchword":null,"tekst":"For ye are called [Namely, by God, and by Christ. See ver.8. And Gal. 1.6.] unto liberty [see ver.1.] brethren: only (use) not liberty [before he exhorted them to continue steadfast in Christian liberty, here he exhorts them further to the right use of the same] for an occasion to the flesh: [that is, to abuse this liberty to the fulfilling of the lusts of the flesh, and for a cloak for sin, 1 Pet. 2.16.] but serve one another through love. [that is, although ye may be free from the bondage of the Law, yet nevertheless ye must shew to one another the service of love: for although ye are free from bondage of ceremonial Law, ye are not free from the Law of love, Rom. 13.8. 1 Pet. 2.17.]"}],"14":[{"catchword":null,"tekst":"For the whole Law [Gr. All the Law, namely, of the second Table, wherein God prescribes us how we must carry ourselves towards our neighbor. See Rom. 13.8.] Is fulfilled [that is, briefly and summarily contained as one in chief point. See Lev. 19.18. Mat. 22.39. Rom. 13.8.] In one word, [that is, in one command, see Deu. 4.13.] (namely) in this, thou shalt love thy neighbor as thy self."}],"15":[{"catchword":null,"tekst":"But if ye bite and devour one another, [that is, trouble and vex one another with contentions, reproaches, and divisions about this point of Christian liberty] look to it, that ye be not consumed one of another. [That is, that through your divisions your faith be not weakened, and the walfare, peace and quiet of the church be not broken.]"}],"16":[{"catchword":null,"tekst":"And I say, [That is, this that I will say. See Gal. 3.17. and 4.1. He further declares here that which he had said, v.13. and shews that the means whereby the abuse of liberty may be avoided] walk by the spirit, [when the spirit and flesh in a man are opposed one to another; by the spirit is understood that part of the man, which is regenerated by the spirit: and by the flesh, the natural corruption, which yet cleaves to the regenerate, See Rom 8.1.] And fulfilled not [or, and ye shall not fulfill, shewing that what fruit shall follow from thence, when men walk according to the spirit. And so then this shall be the means to prevent the abuse of liberty] the concupiscence of the flesh. [That is, the evil thoughts, inclinations, motions and lusts of corrupt nature, which yet cleave to the regenerate.]"}],"17":[{"catchword":null,"tekst":"For the flesh desired against the spirit, [That is, the evil lusts of the flesh retrieve against the good desires which the Holy Ghost raiseth up in the regenerate] and the spirit against the flesh: and these withstands one another, [that is, are contrary lusts] so that ye do not [that is, cannot always fulfill] that which ye would. [namely, according to the good lusts and desires which the Holy Ghost hath wrought in you: as also on the contrary, the lusting of the spirit hinder that ye do not fulfill the lusts of the flesh, Rom. 7.19. etc.]"}],"18":[{"catchword":null,"tekst":"But if ye led by the spirit, [Namely, so that the spirit and the good desires which he works in you prevail in you, so that ye suffer your selves to be led thereby in the ways of God.] ye are not under the Law. [That is, not under the constraint of the Law, which ariseth from fear of the threatening of the Law, nor under the curse of the same, not under the yoke of the ceremonies. For the spirit which leads the regenerate, is not the spirit of bondage unto fear, but of the adoption for children, and of liberty, see Rom. 8.15. Gal. 4.6.]"}],"19":[{"catchword":null,"tekst":"The works now of the flesh [That is, which the flesh or the corruption of our nature produceth; and wherein mans corrupt nature takes pleasure] are manifest: [that is, are sufficiently known, seeing man know by the light of nature, that they are evil, shameful and // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {

}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

    data.weergaven.map(w => {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

}

  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
