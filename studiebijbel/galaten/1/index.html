zou ik geen dienstknecht van Christus zijn.","11":"Maar ik maak u bekend, broeders, dat het Evangelie dat door mij verkondigd is, niet naar de mens is.","12":"Want ik heb het ook niet van een mens ontvangen, ook niet geleerd, maar door de openbaring van Jezus Christus.","13":"Want u hebt gehoord van mijn vroegere levenswandel in het Jodendom, dat ik de Gemeente van God uitermate zwaar vervolgde, en die verwoestte;","14":"en dat ik in het Jodendom meer vorderde dan velen van mijn leeftijd in mijn volk, omdat ik overvloedig ijverig was voor mijn voorvaderlijke overleveringen.","15":"Maar toen het God behaagd heeft, Die mij van mijn moeders schoot af afgezonderd heeft, en geroepen door Zijn genade,","16":"om Zijn Zoon in mij te openbaren, opdat ik Hem door het Evangelie onder de heidenen zou verkondigen, ben ik meteen niet te rade gegaan met vlees en bloed;","17":"en ik ben ook niet naar Jeruzalem gegaan, naar hen die vóór mij apostelen waren; maar ik ging naar Arabië, en keerde weer terug naar Damaskus.","18":"Daarna, na drie jaar, ging ik naar Jeruzalem om Petrus te bezoeken, en ik bleef bij hem vijftien dagen.","19":"En ik zag geen andere van de apostelen, dan Jakobus, de broer van de Heere.","20":"Wat ik u nu schrijf, zie, ik getuig voor God, dat ik niet lieg!","21":"Daarna ben ik gekomen in de gewesten van Syrië en van Cilicië.","22":"En ik was van gezicht onbekend aan de Gemeenten in Judea, die in Christus zijn.","23":"Maar zij hadden alleen gehoord dat men zei: Hij die ons vroeger vervolgde, verkondigt nu het geloof, dat hij vroeger verwoestte.","24":"En zij verheerlijkten God om mij."},"SV":{"1":"Paulus, een apostel, *geroepen* niet van mensen, noch door een mens, maar door Jezus Christus, en God den Vader, Die Hem uit de doden opgewekt heeft),","2":"En al de broeders, die met mij zijn, aan de Gemeenten van Galatië:","3":"Genade zij u en vrede van God den Vader, en onzen Heere Jezus Christus;","4":"Die Zichzelven gegeven heeft voor onze zonden, opdat Hij ons trekken zou uit deze tegenwoordige boze wereld, naar den wil van onzen God en Vader;","5":"Denwelken zij de heerlijkheid in alle eeuwigheid. Amen.","6":"Ik verwonder mij, dat gij zo haast *wijkende* van dengene, die u in de genade van Christus geroepen heeft, overgebracht wordt tot een ander Evangelie;","7":"Daar er geen ander is; maar er zijn sommigen, die u ontroeren, en het Evangelie van Christus willen verkeren.","8":"Doch al ware het ook, dat wij, of een engel uit den hemel u een Evangelie verkondigde, buiten hetgeen wij u verkondigd hebben, die zij vervloekt.","9":"Gelijk wij te voren gezegd hebben, *zo* zeg ik ook nu wederom: Indien u iemand een Evangelie verkondigt, buiten hetgeen gij ontvangen hebt, die zij vervloekt.","10":"Want predik ik nu de mensen, of God? Of zoek ik mensen te behagen? Want indien ik nog mensen behaagde, zo ware ik geen dienstknecht van Christus.","11":"Maar ik maak u bekend, broeders, dat het Evangelie, hetwelk van mij verkondigd is, niet is naar den mens.","12":"Want ik heb ook hetzelve niet van een mens ontvangen, noch geleerd, maar door de openbaring van Jezus Christus.","13":"Want gij hebt mijn omgang gehoord, die eertijds in het Jodendom was, dat ik uitnemend zeer de Gemeente Gods vervolgde, en dezelve verwoestte;","14":"En *dat* ik in het Jodendom toenam boven velen van mijn ouderdom in mijn geslacht, zijnde overvloedig ijverig voor mijn vaderlijke inzettingen.","15":"Maar wanneer het Gode behaagd heeft, Die mij van mijner moeders lijf aan afgezonderd heeft, en geroepen door Zijn genade,","16":"Zijn Zoon in mij te openbaren, opdat ik Denzelven door het Evangelie onder de heidenen zou verkondigen, zo ben ik terstond niet te rade gegaan met vlees en bloed;","17":"En ben niet wederom gegaan naar Jeruzalem, tot degenen, die voor mij apostelen waren; maar ik ging henen naar Arabië, en keerde wederom naar Damaskus.","18":"Daarna kwam ik na drie jaren weder te Jeruzalem om Petrus te bezoeken, en ik bleef bij hem vijftien dagen.","19":"En zag geen ander van de apostelen, dan Jakobus, den broeder des Heeren.","20":"Hetgeen nu ik u schrijf, ziet, *ik* *getuig* voor God, dat ik niet lieg!","21":"Daarna ben ik gekomen in de gewesten van Syrië en van Cilicië.","22":"En ik was van aangezicht onbekend aan de Gemeenten in Judea, die in Christus zijn.","23":"Maar zij hadden alleenlijk gehoord, *dat* *men* *zeide*: Degene, die ons eertijds vervolgde, verkondigt nu het geloof, hetwelk hij eertijds verwoestte.","24":"En zij verheerlijkten God in mij."},"KJV":{"1":"Paul, an apostle, (not of men, neither by man, but by Jesus Christ, and God the Father, who raised him from the dead;)","2":"And all the brethren which are with me, unto the churches of Galatia:","3":"Grace *be* to you and peace from God the Father, and *from* our Lord Jesus Christ,","4":"Who gave himself for our sins, that he might deliver us from this present evil world, according to the will of God and our Father:","5":"To whom *be* glory for ever and ever. Amen.","6":"I marvel that ye are so soon removed from him that called you into the grace of Christ unto another gospel:","7":"Which is not another; but there be some that trouble you, and would pervert the gospel of Christ.","8":"But though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.","9":"As we said before, so say I now again, If any *man* preach any other gospel unto you than that ye have received, let him be accursed.","10":"For do I now persuade men, or God? or do I seek to please men? for if I yet pleased men, I should not be the servant of Christ.","11":"But I certify you, brethren, that the gospel which was preached of me is not after man.","12":"For I neither received it of man, neither was I taught *it*, but by the revelation of Jesus Christ.","13":"For ye have heard of my conversation in time past in the Jews' religion, how that beyond measure I persecuted the church of God, and wasted it:","14":"And profited in the Jews' religion above many my equals in mine own nation, being more exceedingly zealous of the traditions of my fathers.","15":"But when it pleased God, who separated me from my mother's womb, and called *me* by his grace,","16":"To reveal his Son in me, that I might preach him among the heathen; immediately I conferred not with flesh and blood:","17":"Neither went I up to Jerusalem to them which were apostles before me; but I went into Arabia, and returned again unto Damascus.","18":"Then after three years I went up to Jerusalem to see Peter, and abode with him fifteen days.","19":"But other of the apostles saw I none, save James the Lord's brother.","20":"Now the things which I write unto you, behold, before God, I lie not.","21":"Afterwards I came into the regions of Syria and Cilicia;","22":"And was unknown by face unto the churches of Judaea which were in Christ:","23":"But they had heard only, That he which persecuted us in times past now preacheth the faith which once he destroyed.","24":"And they glorified God in me."}},"tsk":{"1":[{"kopje":"een","refs":["Rom 1:1","1 Kor 1:1"]},{"kopje":"niet","refs":["Gal 1:11","Gal 1:12","Gal 1:17"]},{"kopje":"ook niet","refs":["Hand 1:16-26","Hand 13:2-4"]},{"kopje":"maar","refs":["Hand 9:6","Hand 9:15","Hand 9:16","Hand 22:10","Hand 22:14-21","Hand 26:16-18","Rom 1:4","Rom 1:5","2 Kor 3:1-3","Ef 3:8","1 Tim 1:11-14","2 Tim 1:1","Tit 1:3"]},{"kopje":"en","refs":["Matt 28:18-20","Joh 5:19","Joh 10:30","Joh 20:21"]},{"kopje":"opgewekt","refs":["Hand 2:24-32","Hand 3:15","Rom 4:24","Rom 4:25","Rom 10:9","Rom 14:9","Ef 1:19","Ef 1:20","Hebr 13:20","1 Petr 1:21","Openb 1:5","Openb 1:18","Openb 2:8"]}],"2":[{"kopje":"al","refs":["Fil 2:22","Fil 4:21"]},{"kopje":"Gemeenten","refs":["Hand 9:31","Hand 15:41","Hand 16:5","Hand 16:6","Hand 18:23","1 Kor 16:1"]}],"4":[{"kopje":"gegeven","refs":["Gal 2:20","Matt 20:28","Matt 26:28","Mark 10:45","Luk 22:19","Joh 10:11","Joh 10:17","Joh 10:18","Rom 4:25","Ef 5:2","1 Tim 2:6", lass=\"wl wl-kjv\" data-code=\"G191\">heard</span> <span class=\"wl wl-kjv\" data-code=\"G3440\">only,</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">That</span> he which <span class=\"wl wl-kjv\" data-code=\"G1377\">persecuted</span> <span class=\"wl wl-kjv\" data-code=\"G2248\">us</span> in times <span class=\"wl wl-kjv\" data-code=\"G4218\">past</span> <span class=\"wl wl-kjv\" data-code=\"G3568\">now</span> <span class=\"wl wl-kjv\" data-code=\"G2097\">preacheth</span> the <span class=\"wl wl-kjv\" data-code=\"G4102\">faith</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> <span class=\"wl wl-kjv\" data-code=\"G4218\">once</span> he destroyed.","24":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> they <span class=\"wl wl-kjv\" data-code=\"G1392\">glorified</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> me."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"een apostel,","tekst":"Zie van dit woord, Luk 6:13."},{"catchword":"niet van mensen,","tekst":"Namelijk die bloot mensen, of niet dan mensen zijn. Deze beschrijving doet de apostel daarbij, om zijn apostolische beroeping en gezag staande te houden tegen de lasteringen der valse apostelen, die zeiden dat hij niet wettiglijk tot het apostelschap was beroepen. Want er zijn tweeërlei wettige beroepingen tot den dienst des Woords; een die gewoon is, welke wel van God geschiedt, maar door mensen, de orde Gods daarin volgende: zodanige is de beroeping van de gewone dienaren des Woords. En er is ene beroeping, die zonder dienst der mensen van God zelf, of van den Heere Christus geschiedt; zodanig is geweest de beroeping der profeten in het Oude Testament, en der apostelen in het Nieuwe Testament. Deze beroeping is buitengewoon, en altijd vergezelschapt met de gave van niet te kunnen dwalen in het leren, 2Pe 1:21; Joh 16:13. Dat de apostel Paulus door zulke een extra-ordinaire beroeping geroepen is, wordt klaarlijk beschreven Act 9:22."},{"catchword":"Die Hem uit","tekst":"En daarmede openlijk heeft betoond dat Hij de eigen Zoon Gods was. Zie Act 13:32; Rom 1:4."}],"2":[{"catchword":"al de broeders,","tekst":"Namelijk niet alleen mijne medebroeders in den dienst, maar ook al de andere gelovigen. Dit doet de apostel daarbij, niet zozeer om zijn schrijven daarmede aanzienlijk te maken, als om door de eenstemmigheid der gemeente met hem, de gemeenten van Galatië te beter te bewegen tot aflegging hunner dwalingen."},{"catchword":"Galatië","tekst":"Galatië was een van de grootste provinciën in Klein-Azië, grenzende aan Frygië, Bithynië, Pontus, Cappadocië en Pamfilië; was alzo genaamd van een volk, dat uit Gallië, nu Frankrijk genaamd, gekomen zijnde, die provincie ingenomen en lang bewoond heeft. Zie Act 16:6; 1Co 16:1; 2Ti 4:10; 1Pe 1:1."}],"4":[{"catchword":"Zichzelven","tekst":"Namelijk vrijwillig; Phi 2:8."},{"catchword":"gegeven heeft","tekst":"Namelijk in den dood. Dit voegt de apostel in het begin daarbij, omdat dit bewijs alleen genoegzaam is, om de leer der valse apostelen te wederleggen. Want hij zou tevergeefs zulks gedaan hebben, indien de mens door de werken der wet kon gerechtvaardigd worden. Zie Gal 2:21."},{"catchword":"voor onze zonden,","tekst":"Namelijk om die te verzoenen door zijnen dood; 1Jo 1:7, en 1Jo 2:2. Zodat de verzoening en vergeving der zonden daarin alleen, en niet in de werken der wet, moet gezocht worden."},{"catchword":"wereld,","tekst":"Grieks eeuw; dat is, uit den zondigen en ellendigen staat, waarin de gehele wereld gelegen is; 1Jo 5:19."},{"catchword":"naar den wil","tekst":"Dat is, naar het eeuwig besluit en welbehagen, Act 2:23, en Act 4:28; Heb 10:7, Heb 10:10. Zo is dan de Vader met dit rantsoen Zijns Zoons tevreden."}],"5":[{"catchword":"in alle eeuwigheid","tekst":"Grieks tot eeuwen der eeuwen, of tot eeuwigheden der eeuwigheden. Hebreeuws."}],"6":[{"catchword":"Ik verwonder mij,","tekst":"Deze verwondering is ook vergezelschapt geweest met een groot mishagen en droefenis."},{"catchword":"zo haast","tekst":"Dat is, in zo korten tijd, nadat gij het Evangelie van ons ontvangen hebt; of, nadat de verleiders u anders geleerd hebben. Daarmede bestraft hij hunne lichtvaardigheid."},{"catchword":"wijkende van","tekst":"Namelijk van God, die u door onze predikatie geroepen heeft, om u door de genade van Christus, en niet door de werken der wet, zalig te maken. Of, wijkende van Christus, die u geroepen heeft in de genade."},{"catchword":"overgebracht wordt","tekst":"Namelijk van degenen, die u verleiden; welken Hij de meeste schuld geeft, omdat hij hoop had hen wederom op den rechten weg te brengen; Gal 5:10."},{"catchword":"tot een ander Evangelie;","tekst":"Dat is, tot een andere leer om zalig te worden, die de verleiders wel het Evangelie noemen, maar die het rechte Evangelie niet is, en verre verschilt van hetgeen wij u gepredikt hebben."}],"7":[{"catchword":"Daar er geen ander is;","tekst":"Grieks hetwelk geen ander is; Namelijk dan hetgeen, of dan, hetgeen wij u gepredikt hebben. Zie Act 4:12."},{"catchword":"maar er zijn sommigen,","tekst":"Namelijk die uit de secte der Farizeën zich tot den Christelijken godsdienst begeven hebbende, de wet en het Evangelie, en de rechtvaardigheid der werken met de rechtvaardigheid des geloofs zochten te vermengen. Zie Act 15:5."},{"catchword":"verkeren","tekst":"Dat is, vervalsen, ijdel of teniet maken."}],"8":[{"catchword":"wij, of","tekst":"Namelijk ik en de broeders, die bij mij zijn. Of, wij apostelen."},{"catchword":"een engel uit","tekst":"Dit is wel in zichzelve niet mogelijk, maar de apostel wil met het stellen dezer onmogelijke veronderstelling te krachtiger aanwijzen de zekerheid van den vloek, die komen zal over degenen, die een ander Evangelie prediken. Zie dergelijke Joh 8:55; 1Co 13:2."},{"catchword":"buiten hetgeen wij","tekst":"Dat is, niet alleen tegen hetzelve, maar ook die iets daarbij doen, buiten hetgeen wij gepredikt hebben; hetwelk de valse apostelen deden, lerende dat men niet alleen door het geloof, maar ook door de werken der wet gerechtvaardigd wordt."},{"catchword":"vervloekt","tekst":"Grieks Anathema; dat is, vervloeking. Zie van dit woord Rom 9:3; 1Co 16:22."}],"9":[{"catchword":"te voren gezegd","tekst":"Namelijk in vs.8."},{"catchword":"wederom","tekst":"Namelijk om te tonen dat dit van mij niet uit haastigheid is gezegd."},{"catchword":"ontvangen hebt,","tekst":"Namelijk door onze predikatie hebt gehoord en aangenomen."}],"10":[{"catchword":"predik ik nu","tekst":"Grieks raad ik nu aan de mensen of God? Namelijk te horen of geloven. Want het Griekse woord, dat de apostel hier gebruikt, alsook Act 28:23, en 2Co 5:11, betekent eigenlijk iemand met redenen bewegen of overreden, en is hier de zin: Zoek ik in mijne predikatiën u te bewegen, dat gij mij of enig mens zoudt aanhangen? Hij wil zeggen: dat doe ik geenszins."},{"catchword":"of God?","tekst":"Dat is, dat gij uw vertrouwen zoudt stellen op God in Christus; hetwelk, wil hij zeggen, ik doe in al mijne predikatiën."},{"catchword":"Of zoek ik mensen","tekst":"Dat is, zoek ik in mijne predikatiën de gunst van enige mensen? Geenszins, wil hij zeggen. En dit schijnt dat de valse apostelen den Galaten zochten wijs te maken, om de leer des apostels verdacht te maken."},{"catchword":"nog","tekst":"Namelijk nu tot Christus bekeerd zijnde, gelijk ik deed in het Jodendom, als ik, om den hogepriesters en Joden te behagen, de gemeente vervolgde."},{"catchword":"mensen","tekst":"Namelijk die van Christus vreemd zijn, of naar hunne gezindheid willen gepredikt hebben; 2Ti 4:3. Anderszins mogen en moeten ook de vrome leraars zich zo gedragen in leer en leven, dat zij den vromen en Godzaligen mensen in Christus mogen behagen; 1Co 10:33."},{"catchword":"behaagde, zo","tekst":"Dat is, alleen hunne gunst zocht in het prediken."},{"catchword":"dienstknecht van Christus","tekst":"Dat is, een waar, oprecht en getrouw dienstknecht. Want niemand kan twee heren dienen; Mat 6:24."}],"11":[{"catchword":"niet is naar den mens","tekst":"Dat is, mij is niets van mensen gegeven, of van mijzelven versierd, of steunende op gezag van enige mensen, gelijk in vs.12 verklaard wordt."}],"12":[{"catchword":"niet van een mens","tekst":"De apostel wil daarmede niet verwerpen de onderwijzing in de leer des Evangelies, die door mensen gewoonlijk geschiedt, 2Ti 3:15; maar wil zeggen dat hij als een apostel op zulke gewone wijze deze leer niet heeft ontvangen, maar door een extra-ordinaire openbaring en onderwijzing van Christus zelven. Zie Act 9:3; 1Co 15:8, en 2Co 12."}],"13":[{"catchword":"eertijds in","tekst":"Namelijk eer ik tot den Christelijken godsdienst bekeerd was."},{"catchword":"uitnemend zeer","tekst":"Deze vervolging van Paulus wordt beschreven Act 7:58, en Act 9:1, enz., en Act 22:4-5."},{"catchword":"verwoestte;","tekst":"Dat is, dezelve, zoveel in mij was, gans zocht uit te roeien en verdelgen."}],"14":[{"catchword":"van mijn ouderdom","tekst":"Dat is, jonge lieden. Zie Act 7:58. Dat drukt hij uit, opdat hij niet zou schijnen zich uit laatdunkendheid te stellen boven de oude leraars der Joden."},{"catchword":"in mijn geslacht,","tekst":"Dat is, onder de Joden."},{"catchword":"overvloedig ijverig","tekst":"Grieks overvloediglijker een ijveraar; namelijk met een ijver, die niet was met wetenschap, Rom 10:2; Phi 3:5-6; 1Ti 1:13. Hiermede bestraft hij ook den verkeerden ijver der Joden in zijn persoon."},{"catchword":"voor mijn vaderlijke","tekst":"Namelijk van welke ik meer hield, dan van de leer der profeten. Wat dit voor inzettingen waren, kan men zien Mat 5:21, enz., en Mat 15:2, en Mat 23:3, enz.; Mar 7:5, enz.; 1Pe 1:18."},{"catchword":"inzettingen","tekst":"Grieks overleveringen; namelijk niet alleen die in de Schriftuur geboden en beschreven zijn, maar ook die, welke van mensen ingesteld, en van de ouders aan de kinderen als van hand tot hand overgeleverd waren."}],"15":[{"catchword":"van mijner moeders","tekst":"Grieks uit; dat is, eer ik van mijne moeder geboren was. Zie dergelijke Jer 1:5."},{"catchword":"afgezonderd heeft,","tekst":"Dat is, voorgenomen en besloten heeft, mij af te zonderen uit den algemenen hoop van de andere mensen, om te zijner tijd tot een apostel te beroepen."},{"catchword":"door Zijn genade,","tekst":"Namelijk als de enige oorzaak, waarom Hij dat gedaan heeft, en derhalve zonder enige waardigheid of verdiensten in mij voorgezien; gelijk ook tevoren Gods welbehagen de oorzaak daarvan gesteld wordt. Zie Eph 1:5-6, Eph 1:9, Eph 1:11."}],"16":[{"catchword":"Zijn Zoon","tekst":"Namelijk Jezus Christus den waren Messias."},{"catchword":"in mij te openbaren,","tekst":"Dat is, aan mij; in mijne ziel. Of, door mij te openbaren, dat is, bekend te maken, dat ik Hem voor den Zoon Gods en den waren Messias heb erkend, en in Hem geloof; Mat 16:17."},{"catchword":"terstond niet te","tekst":"Namelijk zo haast ik tot Christus bekeerd ben geweest."},{"catchword":"rade gegaan","tekst":"Dat is, over de leer van het Evangelie met iemand gesproken en gehandeld, om in dezelve beter of breder onderwezen te worden."},{"catchword":"met vlees en","tekst":"Dat is, met enige mensen, die uit vlees en bloed bestaan. Zie dergelijke wijze van spreken Mat 16:17; Eph 6:12, ook zelfs niet met mijn eigen natuurlijk vernuft."}],"17":[{"catchword":"niet wederom gegaan","tekst":"Of, niet opgegaan; gelijk ook vs.18. Dit schijnt te strijden met hetgeen Lukas zegt, Act 9:26. Doch hetgeen Lukas daar zegt, moet verstaan worden geschied te zijn nadat Paulus drie jaren in Arabië geweest zijnde, vandaar wederom te Damaskus gekomen was. Want Lukas maakt aldaar geen gewag van Paulus' reis naar Arabië, gelijk hij ook vele andere daden en reizen van Paulus nalaat, die Paulus zelf verhaalt 2Co 11, 12."},{"catchword":"voor mij apostelen","tekst":"Namelijk iemand van de twaalven, die lang vóór mij tot het apostelschap waren beroepen."},{"catchword":"Arabië","tekst":"Een landschap, gelegen ten zuiden van het Joodse land, waarin de berg Sinai was, Gal 4:25, tussen de Rode Zee en de inham van Perzië."},{"catchword":"Damaskus","tekst":"Van deze stad zie de aantekeningen Act 9:2."}],"18":[{"catchword":"na drie jaren","tekst":"Namelijk die ik zo in Arabië, als te Damaskus geweest was."},{"catchword":"te bezoeken,","tekst":"Het Griekse woord betekent iemand te gaan zien of bezoeken, om hem te horen, en met hem te spreken en te handelen."}],"19":[{"catchword":"Jakobus,","tekst":"Daar zijn er twee geweest onder de apostelen van dezen naam. Zie van beiden Mat 10:2-3; Act 12:2, Act 12:17 en van dezen Act 12:17 en Act 15:13."},{"catchword":"den broeder","tekst":"Dat is, neef, een Hebreeuwse wijze van spreken. Zie Gen 14:14; Mat 12:46-47; 1Co 9:5; van dezen zie Mat 10:3, Mar 15:40."}],"20":[{"catchword":"Hetgeen nu","tekst":"Namelijk aangaande dat ik het Evangelie van Christus zelf heb ontvangen, zonder enige beroeping of onderwijzing van mensen."},{"catchword":"voor God,","tekst":"Eene wijze van eedzweren, met welke de apostel nodig geacht heeft dit te bevestigen, om de gewichtigheid der zaak. Zie Rom 9:1."}],"21":[{"catchword":"Syrië en van Cilicië","tekst":"Deze zijn landschappen, gelegen in Azië. Zie van dezelve Mat 4:24; Act 15:23, Act 15:41, en Act 27:5."}],"22":[{"catchword":"in Judéa,","tekst":"Namelijk al zou ik, volgens mijne beroeping, het Evangelie prediken niet onder de Joden aldaar, maar onder de heidenen. Zie vs.16."},{"catchword":"die in Christus","tekst":"Dat is, die de Christelijke leer hebben aangenomen en belijden."}],"23":[{"catchword":"Degene, die","tekst":"Namelijk Paulus. Dit zijn de woorden der voorzegde gemeenten, die Paulus herhaalt."},{"catchword":"ons eertijds vervolgde,","tekst":"Namelijk Christenen."},{"catchword":"het geloof,","tekst":"Dat is, de leer van het Evangelie, die men ter zaligheid moet geloven. Zie dergelijke wijze van spreken 1Ti 1:19, vergelijk met 2Ti 2:18."},{"catchword":"verwoestte","tekst":"Zie vs.13."}],"24":[{"catchword":"in mij","tekst":"Grieks om mijnentwil; dat is, om de genade, die mij God gedaan heeft."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"PAUL an Apostle [See of this word Luk 6:13.] (called) not of men [namely, who are mere men or nothing but men. This description the Apostle adds, to maintain his apostolic calling and authority against the slanders of the false Apostles, who said that he was not lawfully to the Apostleship. For there is a twofold lawful calling to the ministry of the word: one which is ordinary; which is indeed effected by God, but through men, therein following the order of God: And there is a calling which is effected without the ministry of men by God himself, or by the Lord Christ: such was the calling of the Prophets in the old Testament, and of the Apostles in the new Testament. This calling is extraordinary, and always accompanied with the gift of being infallible in teaching, Joh 16:13. 2 Pet. 1.21. That the Apostle Paul was called by such an extraordinary calling is clear described, Acts chap. 9. And 22.] Nor by man, but by Jesus Christ, and God the Father, who raised him from the dead,] [and thereby openly shewed, that he was the proper and true Son of God. See Act 13:33. Rom. 1.4.]"}],"2":[{"catchword":null,"tekst":"And all the brethren which are with me, [Namely, not only my fellow brethren in the ministry, but also all the rest of the faithful. This the Apostle adds, not so much to make his writing to be respected thereby, as by the agreement of the Church with him, the better to move the Churches of Galatia, to the laying aside of their errors] to the churches of Galatia: [Galatia was one of the greatest Provinces of Asia the less, bordering upon Phrygia, Pontus, Capadocia, and Pamphylia, was so called from a people, which being come out of Galatia, now called France, took in that Province and long inhabited the same. See Acts 16. 6. 1 Cor. 16.1. 2 Tim. 4.10. 1 Pet. 1.1.]"}],"3":[{"catchword":null,"tekst":"Grace be to you and peace from God the Father, and our Lord Jesus Christ:"}],"4":[{"catchword":null,"tekst":"Who gave [Namely, unto death. This the Apostle, adds, in the beginning, because this argument alone is sufficient to confute the doctrine of the false Apostles. For he should have done this in vain if a man could be justified by the works of the Law. See Gal. 2.21.] Himself [namely, willingly, Phil. 2.8.] for our sins, [namely, to expiate them by his death, 1 John1.7.] and chap. 2.2. So the expiation and remission of sins must be sought therein alone, and not in the works of the Law] that he might pluck us out of this present wicked world, [Gr. age, i.e. out of the sinful and miserable state wherein the whole world lyeth, 1Jn 5:19.] according to the will of our God and Father. [that is, according to the eternal decree and pleasure, Acts 2 23. and chap. 4.28. Heb. 10.7,10. So then the Father is satisfied with this ransom of his Son.]"}],"5":[{"catchword":null,"tekst":"To whom is glory unto eternity. [Gr. unto ages of ages, or unto eternities of eternities. Hebr.] Amen."}],"6":[{"catchword":null,"tekst":"I wonder [This wending was also accompanied with great displeasure and grief] that ye so soon [that is, in so short time, after that ye have received the Gospel from us: or since the seducers have taught you otherwise. Thereby he reproves their inconsistency] (turning) from him who called you in the grace of Christ, [namely, from God, who called you by our preaching, to save you by the grace of Christ, and not by the works of the Law. Or turning from Christ who called in grace] are brought over [namely, by those that seduce you: on whom he lays the greatest blame, because he had hope to them again into the right way, Gal. 5.ver.10.] unto another Gospel: [that is, unto another doctrine of salvation; which the seducers indeed call the Gospel, but is not the right Gospel, and differs far from that which we have preached unto you.]"}],"7":[{"catchword":null,"tekst":"Whereas there is no other: [Gr. which is not another. Namely, then that or but that which we have preached unto you. See Act 4:12.] but there are some [namely, whom from the sect of Pharisees having be taken themselves unto the Christian Religion, sought to mingle the Law with the Gospel, and the righteousness of works, with the righteousness of faith. See Act 15:5.] Who trouble you, and would pervert the Gospel of Christ. [That is, falsified it, to make it vain or of none effect.]"}],"8":[{"catchword":null,"tekst":"But although that even we, [That is, I, and the brethren that are with me. Or we Apostles] or an Angel out heaven [this is indeed impossible in its self, but the Apostle by putting this impossible condition, will more powerfully set forth the certainty of the curse, which shall come upon those who preach another Gospel. See the like, Joh 8:55. 1 Cor. 13.2.] should publish a Gospel unto you, besides that which we have published unto you, [that is, not only contrary to the same, but also that adds anything to it besides that which we have preached: which the false Apostles did, teaching that men are not justified by faith alone, but also by the works of the Law.] let him be accused. [Gr. Anathema, i.e. a cursing. See of this word, Rom. 9.3. 1 Cor. 16.22.]"}],"9":[{"catchword":null,"tekst":"As we said before, [namely in the foregoing verse [so I say now also again [namely to show that this is not spoken by me out of hastiness] if anyone publish a gospel unto you besides that which ye have received [namely have heard and embraced through our preaching] let him be accused."}],"10":[{"catchword":null,"tekst":"For do I know preach men [Gr do I know advice men or God ? namely to hear or to believe for the Greek word which the apostle useth as also Act 28:23 and 2 Corinthians 5.11signifies properly to move anyone with reason or to persuade him and here the sense is do I seek in my preaching to move ye that ye should adhere to me or any men ?he meaneth I do by no means do that]or God[ that is that ye should your trust in God in Christ which he would say I do in all my preaching or do I seek to please men ?by no means he would say and this it seems the false apostle sought to make the Galatians believe to render the apostle&acirc;&euro;&trade;s doctrine suspected ]for if I yet [namely now being converted to Christ even as I did to Judaism when to please the high priest and the Jews I persecuted the church] pleased[that is sought only their favor in preaching ]men[namely who are strangers from Christ or who will have men preaching according to their minds 2 Timothy 4.3 otherwise the upright teachers may and must also so carry themselves in doctrine and life that they may please upright and Godly men in Christ 1 Corinthians 10.33]I were not a servant of Christ [that is a true upright and faithful servant for no man can serve two masters Mat 6:24.]"}],"11":[{"catchword":null,"tekst":"But I make known unto ye brethren that gospel which was published by me is not according to men [that is was not given and taught me by men or feigned by myself and depending upon the authority of any men as is declared in the following verse.]"}],"12":[{"catchword":null,"tekst":"For neither received I nor learned the same from a man [the apostle will not hereby reject the instruction in the doctrine of the gospel which is ordinarily performed by men 2 Timothy 3.15 but meaneth that he has an apostle received not this doctrine in such an ordinary manner but through an extraordinary revelation and instruction of Christ himself see Act 9:3, 1 Corinthians 15.8 and 2 Corinthians 12] but by the revelation of Jesus Christ."}],"13":[{"catchword":null,"tekst":"For ye have heard my conversation which was formerly [namely before I was converted to the Christian Religion] in Judaism that I very exceedingly persecuted that church of God [this persecution of Paul is described Act 7:58 and chapter 9.1 &c and 22.4.5] and wasted the same [that is as much as in me lay sought wholly to root out and destroy the same.]"}],"14":[{"catchword":null,"tekst":"And that I increased in Judaism above many of my age [that is young men see Act 7:58 that he expresseth that he might hot see out of self-conceitedness to set himself above the ancient teachers of the Jews ] in my generation [that is among the Jews]being abundantly zealous [Gr more abundantly a zealot namely with a zeal which is not accompanied with knowledge Rom 10:2, Php 3:5,6, 1 Timothy 1.13 hereby he also reproves the perverse zeal of the Jews in his own person ]for the institutions [Gr tradition namely not which are commanded and set down in the scriptures but those also which were instituted by men and delivered over by the parents to the children as from hand to Hand ]of my fathers [namely of which I made more account then of the doctrine of the prophets what institutions these were may be seen Mat 5:21 c. chapter 15.2,3and chapter 23.3 &c Mark 7.5 &c1 Peter 1.18.]"}],"15":[{"catchword":null,"tekst":"But when it pleased God who separated me [that is purposed and decreed to separate me from common heap of other men to call me in due time to be an apostle ]even from my mothers womb [Gr out of that is before I was born of my mother see the like Jer 1:5]and called me by his grace [namely as the only cause why he did that and therefore without any worthiness and merits of mine foreseen in me as before also Gods good pleasure is made the cause thereof see Eph 1:5,6,9,11.]"}],"16":[{"catchword":null,"tekst":"To reveal his son [namely Jesus Christ the true Messiah] in me [that is to me in my soul or by me to reveal that is to make known that I have acknowledged him for the son of God and the true Messiah and believed in him Mat 16:17] that I should publish him by the gospel among the gentiles immediately [namely as soon as I was converted unto Christ ] I went not to consult [that is spake not nor treated with any man concerning the doctrine of the gospel to be better or largely instructed in the same ]with flesh and blood [that is with any men which consists of flesh and blood nor not with mine own natural reasons see the like phrase Mat 16:17 Eph 6:12]"}],"17":[{"catchword":null,"tekst":"And went not again [or went not up as also verse 18this seems to contradict that which Luke saith Act 9:26But that which Luke saith there must be understood to have come pass after that Paul having been three years in Arabia was again come from thence unto Damascus. For Luke makes no mention there of Paul&acirc;&euro;&trade;s journey into Arabia as he also omit divers other actions and journeys of Paul which Paul himself relates 2 Corinthians chapter 11 and 12]to Jerusalem unto them which Apostles before me [namely any one of the twelve who were called to the apostleship long before me ]but I went my way into Arabia a country lying to the south of the land of the Jews wherein mount Sinai was Galatians betwixt the red sea and the gulf of Persia ] and returned unto Damascus of this city see the annotations on Acts9.2.]"}],"18":[{"catchword":null,"tekst":"Afterward I came after three years [namely during which I had been as well in Arabia as at Damascus] again to Jerusalem to visit Peter [the Greek word signifies to go see or to visit any man to her him and to speak and treat with him] and I abhorred with him fifteen days."}],"19":[{"catchword":null,"tekst":"And saw no other of the apostles save James [there were two among the apostles of this name see of both Matthew 10 verse 2,3 Act 12:2,17and of this Act 12:17 and 15.13] the Lords brother [that is cousin An Hebrew phrase see Gen 14:14 Mat 12:46,47 1 Corinthians 9.5 of him see Mat 10:3 Mark 15.40]"}],"20":[{"catchword":null,"tekst":"Now that which I write to you [namely concerning my receiving of the gospel from Christ himself without my calling or instruction of men ]behold I testify before God [a form of taking an oath with which the apostle thought it needful to confirm this because of the weightiness of the matter see Rom 9:1] that I lye not."}],"21":[{"catchword":null,"tekst":"Afterwards I came into the quarters of Syria and Cilicia [these are countries lying in Asia see of the same Mat 4:24 Act 15:23,41 and 18.18 and 27.5.]"}],"22":[{"catchword":null,"tekst":"And I was unknown by face to the church of Judea [namely seeing I according to my calling preached the gospel not among the Jews there but amongst the Gentiles see verse 16 ]which are in Christ [that is who have received and profess the Christian doctrine.]"}],"23":[{"catchword":null,"tekst":"But they had only heard man say he that [namely Paul these are the words of the foresaid churches which Paul relates] persecuted us [namely Christians] in former times now publisheth the faith [that is the doctrine of the gospel which men must believe to salvation see the like phrase 1 Timothy 1.19 compare with 2 Timothy 2. 18] which he formerly wasted [see verse 13.]"}],"24":[{"catchword":null,"tekst":"And they glorified God in me [Gr for my sake that is for the grace which God had bestowed in me.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

function popupVerzenHtml(bron, start, eind) {

    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
