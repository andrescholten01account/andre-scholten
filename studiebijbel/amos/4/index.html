r","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Hoor dit woord, koeien van Basan, u die op de berg van Samaria bent, die de armen verdrukt, die de behoeftigen verplettert; u die tegen uw heren zegt: Breng aan, opdat wij drinken.","2":"De Heere HEERE heeft gezworen bij Zijn heiligheid, dat er, zie, dagen over u zullen komen, dat men u zal optrekken met haken, en uw nakomelingen met visangels.","3":"En u zult door de bressen naar buiten gaan, ieder voor zich heen; en u zult wat in het paleis *gebracht* is, wegwerpen, spreekt de HEERE.","4":"Kom naar Beth-el, en overtreed te Gilgal; maak veel van het overtreden, en breng uw offers 's morgens, uw tienden om de drie dagen!","5":"En laat rook opgaan van het gedesemde als een lofoffer, en roep vrijwillige offers uit, laat het horen; want zo hebt u het graag, kinderen van Israël! spreekt de Heere HEERE.","6":"Daarom heb Ik u ook reinheid van de tanden gegeven in al uw steden, en gebrek aan brood in al uw plaatsen; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.","7":"Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde.","8":"En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.","9":"Ik heb u geslagen met brandkoren en met honingdauw; de veelheid van uw hoven, en uw wijngaarden, en uw vijgenbomen, en uw olijfbomen at de rups op; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.","10":"Ik heb de pest onder u gezonden, naar de wijze van Egypte; Ik heb uw jongemannen door het zwaard gedood, en uw paarden gevankelijk laten wegvoeren; en Ik heb de stank van uw legers zelfs in uw neus laten opgaan; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.","11":"Ik heb *sommigen* onder u omgekeerd, zoals God Sodom en Gomorra omkeerde, u, die was als een stuk brandhout, dat uit de brand gered is; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.","12":"Daarom zal Ik u zo doen, Israël! Omdat Ik u dan dit doen zal, maak u dan gereed, Israël, om uw God te ontmoeten.","13":"Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam."},"SV":{"1":"Hoort dit woord, gij koeien van Basan! gij, die op den berg van Samaria zijt, die de armen verdrukt, die de nooddruftigen verplettert; gij, die tot hunlieder heren zegt: Brengt aan, opdat wij drinken.","2":"De Heere HEERE heeft gezworen bij Zijn heiligheid, dat er, ziet, dagen over ulieden zullen komen, dat men u zal optrekken met haken, en uw nakomelingen met visangelen.","3":"En gij zult *door* de bressen uitgaan, een ieder voor zich henen; en gij zult, hetgeen in het paleis *gebracht* is, wegwerpen, spreekt de HEERE.","4":"Komt te Beth-el, en overtreedt te Gilgal; maakt des overtredens veel, en brengt uw offers des morgens, uw tienden om de drie dagen!","5":"En rookt van het gedesemde een lofoffer, en roept vrijwillige offers uit, doet het horen; want alzo hebt gij het gaarne, gij kinderen Israëls! spreekt de Heere HEERE.","6":"Daarom heb Ik ulieden ook reinheid der tanden gegeven in al uw steden, en gebrek van brood in al uw plaatsen; nochtans hebt gij u niet bekeerd tot Mij, spreekt de HEERE.","7":"Daartoe heb Ik ook den regen van ulieden geweerd, als er nog drie maanden waren tot den oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk lands werd beregend, maar het *andere* stuk lands, waar het niet op regende, verdorde.","8":"En twee, drie steden togen om tot een stad, opdat zij water mochten drinken, maar werden niet verzadigd; nochtans hebt gij u niet bekeerd tot Mij, spreekt de HEERE.","9":"Ik heb ulieden geslagen met brandkoren en met honigdauw; de veelheid uwer hoven, en uwer wijngaarden, en uwer vijgebomen, en uwer olijfbomen at de rups op; nochtans hebt gij u niet bekeerd tot Mij, spreekt de HEERE.","10":"Ik heb de pestilentie onder ulieden gezonden, naar de wijze van Egypte; Ik heb uw jongelingen door het zwaard gedood, en uw paarden gevankelijk laten wegvoeren; en Ik heb den stank uwer heirlegeren zelfs in uw neus doen opgaan; nochtans hebt gij u niet bekeerd tot Mij, spreekt de HEERE.","11":"Ik heb *sommigen* onder ulieden omgekeerd, gelijk God Sodom en Gomorra omkeerde, u, die waart als een vuurbrand, dat uit den brand gered is; nochtans hebt gij u niet bekeerd tot Mij, spreekt de HEERE.","12":"Daarom zal Ik u alzo doen, o Israël! omdat Ik u *dan* dit doen zal, zo schik u, o Israël! om uw God te ontmoeten.","13":"Want zie, Die de bergen formeert, en den wind schept, en den mens bekend maakt, wat zijn gedachte zij, Die den dageraad duisternis maakt, en op de hoogten der aarde treedt, HEERE, God der heirscharen, is Zijn Naam."},"KJV":{"1":"Hear this word, ye kine of Bashan, that *are* in the mountain of Samaria, which oppress the poor, which crush the needy, which say to their masters, Bring, and let us drink.","2":"The Lord GOD hath sworn by his holiness, that, lo, the days shall come upon you, that he will take you away with hooks, and your posterity with fishhooks.","3":"And ye shall go out at the breaches, every *cow at that which is* before her; and ye shall cast *them* into the palace, saith the LORD.","4":"Come to Bethel, and transgress; at Gilgal multiply transgression; and bring your sacrifices every morning, *and* your tithes after three years:","5":"And offer a sacrifice of thanksgiving with leaven, and proclaim *and* publish the free offerings: for this liketh you, O ye children of Israel, saith the Lord GOD.","6":"And I also have given you cleanness of teeth in all your cities, and want of bread in all your places: yet have ye not returned unto me, saith the LORD.","7":"And also I have withholden the rain from you, when *there were* yet three months to the harvest: and I caused it to rain upon one city, and caused it not to rain upon another city: one piece was rained upon, and the piece whereupon it rained not withered.","8":"So two *or* three cities wandered unto one city, to drink water; but they were not satisfied: yet have ye not returned unto me, saith the LORD.","9":"I have smitten you with blasting and mildew: when your gardens and your vineyards and your fig trees and your olive trees increased, the palmerworm devoured *them*: yet have ye not returned unto me, saith the LORD.","10":"I have sent among you the pestilence after the manner of Egypt: your young men have I slain with the sword, and have taken away your horses; and I have made the stink of your camps to come up unto your nostrils: yet have ye not returned unto me, saith the LORD.","11":"I have overthrown *some* of you, as God overthrew Sodom and Gomorrah, and ye were as a firebrand plucked out of the burning: yet have ye not returned unto me, saith the LORD.","12":"Therefore thus will I do unto thee, O Israel: *and* because I will do this unto thee, prepare to meet thy God, O Israel.","13":"For, lo, he that formeth the mountains, and createth the wind, and declareth unto man what *is* his thought, that maketh the morning darkness, and treadeth upon the high places of the earth, The LORD, The God of hosts, *is* his name."}},"tsk":{"1":[{"kopje":"koeien","refs":["Deut 32:14","Deut 32:15","Ps 22:13","Jer 50:11","Jer 50:27","Ezech 39:18"]},{"kopje":"de berg","refs":["Amos 6:1","1 Kon 16:24"]},{"kopje":"verdrukt","refs":["Amos 2:6","Amos 2:7","Amos 3:9","Amos 3:10","Amos 5:11","Amos 8:4-6","Ex 22:21-25","Deut 15:9-11","Ps 12:6","Ps 140:13","Spr 22:22","Spr 22:23","Spr 23:10","Spr 23:11","Pred 4:1","Pred 5:7","Jes 1:17-24","Jes 5:8","Jes 58:6","Jer 5:26-29","Jer 6:6","Jer 7:6","Ezech 22:7","Ezech 22:12","Ezech 22:27","Ezech 22:29","Micha 2:1-3","Micha 3:1-3","Zach 7:10","Zach 7:11","Mal 3:5","Jak 5:1-6"]},{"kopje":"verplettert","refs":["Deut 28:33","Job 20:19","Jer 51:34"]},{"kopje":"Breng aan","refs":["Amos 2:8","Joël 3:3"]}],"2":[{"kopje":"heeft gezworen","refs":["Amos 6:8"]},{"kopje":"zullen komen","refs":["Jes 37:29","Jer 16:16","Ezech 39:4","Ezech 39:5","Hab 1:15","Hab 1:16"]}],"3":[{"kopje":"u zult gaan","refs":["2 Kon 25:4","Ezech 12:5","Ezech 12:12"]},{"kopje":"in het paleis gebracht is","refs":["2 Kon 7:7","2 Kon 7:8","2 Kon 7:15","Jes 2:20","Jes 31:7","Zef 1:18","Matt 16:26"]}],"4":[{"kopje":"Kom","refs":["Amos 3:14","Pred 11:9","Ezech 20:39","Joël 3:9-12","Matt 23:32","Matt 26:45","Mark 14:41"]},{"kopje":"te Gilgal","refs":["Amos 5:5","Hos 4:15","Hos 9:15","Hos 12:12"]},{"kopje":"en breng","refs":["Num 28:3","Num 28:4"]},{"kopje":"uw","refs":["Deut 14:28","Deut 14:29","Deut 26:12"]}],"5":[{"kopje":"lofoffer","refs":["Lev 7:12","Lev 7:13","Lev 23:17"]},{"kopje":"roep uit","refs":["Lev 22:18-21","Deut 12:6","Deut 12:7","Matt 6:2"]},{"kopje":"want","refs":["Ps 81:13","Matt 15:9","Matt 15:13","Matt 15:14","Matt 23:23","Rom 1:28","2 Tess 2:10-12"]},{"kopje":"hebt u het graag","refs":["Hos 9:1","Hos 9:10"  . Anders: dageraad [en] de duisternis, dat is, dag en nacht maakt."},{"catchword":"hoogten der aarde treedt,","tekst":"Dat is, die verheven is boven alle heerlijkheid en souvereiniteit, alle wereldse hoogheid als onder zijne voeten hebbende. Verg. Mic 1:3 ."},{"catchword":"heirscharen,","tekst":"Zie 2Ki 18:15 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Hear this word ye Cowes of Basan, which are upon the mountains of Samaria : [ Compare psal. 22. 13. with the annotat. As also Isa. 28. v. 1. Hos. 4. 16. and understand hereby the wicked and insolent Judges and governors, who crammed and fattened themselves with the bribes of the rich, helping them to draw the poor before the judgement seat and there to oppresse them. They are called Cowes and pastures in the countrey of Basan] who oppresse the poor, who bruise the needy: ye that say to their lords ; [i.e. to the rich creditours of the poor, who have and keep them under as their slaves and vassals] bring on, that we may drink. [i.e. bring in money or presents, that we may make merry, drink and feast with, and do ye with the poor then even what ye please yourselves. Compare Hos. 4. 18.]"}],"2":[{"catchword":null,"tekst":"The Lord LORD hath sworn by his holiness, [See Gen. 22. on verse 16.] that, behold, dayes shall come upon you, [i.e. certain appointed times of plagues and visitations. See Psal. 37. 13. and Jer. 50. 27, 31. Joel 1. 15. with the annotat. ] that one shall pull you up with hooks. [Heb. that he & c. viz the enemy, or that ye shall be pulled up or drawn away, carried away, with hooks; understand, that like as great fishes are pulled or drawn up out of the sea with hooks, so will I cause you to be pulled out of your land by your enemy, how loth and unwilling soever you are to quit it. Compare Jer. 16. 16. hab. 1. 14, 15. and Job 40. 21. Isa. 37. 29. Ezek. 19.4, 9. and 29. 4.] and your posterity, [or, your last, or, hindmost i.e. those that may have been left behind, or, keep themselves backward. See of the Heb. word Jer. 31. on verse 17.] with fishing-angles. [which being sharp and pricking as thorns, are made up in fashion of them, which the Hebrew word seems to import. See Job. 40. 21.]"}],"3":[{"catchword":null,"tekst":"And ye shall go forth, [ Ye Cowes of Basan, as verse. 1.] (through) the breaches [ viz. of the city wall, which the enemy shall have made therein, to see whether ye might make some escape thereby: or, ye shall be carried forth by the enemy into captivity. Compare Ezek. Chap. 12. 5, 12, etc.] every one [in the feminine, every one of those Cows of Basan, i.e. every one of you, that now are so voluptuous wanton and insolent] along before her:[ without regarding her companions, looking for nothing in the world, but how to make a shift and escape for themselves. Compare above chap. 2. 15, 16. Or, ye shall be led along captive one by one ] And ye shall throw away that which is being brought into the palace,[i.e. that which ye gathered in your palaces, through violence and robbery, see above chap. 3 . 10. Oth. Ye shall throw away the palaces i.e. forsake them ] saith the LORD."}],"4":[{"catchword":null,"tekst":"Come to Bethel [See Hos. 4. 15. and 12. 13. and below 5. 5.] and transgress; [ a seeming command, by way of derision for thus God mocketh at the heat and rage of the Israelites, in committing of idolatry, giving that unto the idols, which was onely to be given to God at Jerusalem, nay did yet more to them then God had commanded to be done for himself compare Jer 7:21 Eze 20:39 with the annotate ]to Gilgal, [understand come on go your way to Gilgal c.] multiply transgressions,[Heb make many, or, multiply transgressing or with transgressing]and bring your offerings of the morning your tents for the three days [that is for every three years of days that is to say three full years according to Gods precept Deut 14.28 thus are days taken for many days or years of days that is for a full year Levit 25.29Num 9:22 1Sa 27:7 see the annotate there some do understand it of their festival or joyful feasts which they celebrated with their tenths on the three solemn feasts of the Passover the Pentecost and the leaf-huts Deut 14.22 some think they made these offerings at the third day of their idols and but every third year to God .]"}],"5":[{"catchword":null,"tekst":"And make a praise offering [see Levit 2 verse 1 ,15 ]of that which is leavened [see Levit 2 on verse 11 and 7 on verse 13 but it seems that the Israelites had devised a new incense-offering of liven committing thereby several sins at once 1 giving that unto the idols which was Gods ,2.offering in other places besides Jerusalem 3.devicing extraordinary services against the law of God under a presence of zeal .] and proclaim freewill-offering cause it to be heard for thus ye love to have it [Heb do ye love or are ye enamoured as elsewhere as if God had said ye will need have it so do it then but remember how it became ye formerly and consider of the success as followeth ]ye children of Israel saith the Lord LORD."}],"6":[{"catchword":null,"tekst":"Therefore I gave ye also cleanness of teeth [that is want of sustenance or famin for where there is nothing to eat nothing adheres to the teeth compare1 Kings 17.18 Joel 1.1 c. and see further the annotate on Prov 14:4 and Isaih 3 on verse 26.] in all cities and want of bread in all places nevertheless did not convert yourselves to me [Heb even or up to me see of this manner of speaking Joel 2 on verse 12 and so in the sequel ] saith the Lord ."}],"7":[{"catchword":null,"tekst":"Besides I with held the rain from you [that rain which God used to give towards harvest time to fill and ripen the corn see Joel 2 on verse 23 ]when there were three months yet to the harvest and have caused it to rain over the othr the one piece of land was rained upon but the other piece of the land which it rained not upon withered."}],"8":[{"catchword":null,"tekst":"And two three cities went about to one city for to drink water but were not satisfied [that is they could not get enough to relieve their necessities ]nevertheless ye did not convert your selves to me saith the Lord ."}],"9":[{"catchword":null,"tekst":"I smote ye with blasted corn and mildew [of both these plagues see Deut 28 on verse 22 ]the multitude [or quantity Heb the multiplying ]of your gardens and your vineyards and your fig-trees and your olives-tree the caterpillars devoured [See Joel 1.4] nevertheless ye did not convert yourselves to me saith the Lord"}],"10":[{"catchword":null,"tekst":"I sent the pestilence among ye in the manner of Egypt [Heb in or upon or after the way of Egypt that is after the manner as Gen 31:35 in like fort as of old I sent the mortality into Egypt see Exo 9:3,6 Psa 78:50 other uon the way of Egypt that is when ye were in the way to Egypt to seek for help thence see Hosea 7 on verse 11,12] I slew your young men with the sword and let your horses to be carried away captive [Heb with captivity of your horses which the rich and haunty young men kept and used in abundance [and I did cause the strengths of your camps themselves to ascend into your nose [viz by partly such as died of the plague and partly the slain ones by the enemy ]nevertheless ye did not convert yourselves to me saith the Lord ."}],"11":[{"catchword":null,"tekst":"I overthrew some among ye [that is brought your state to the brink of utter ruin and destruction see 2Kings 13 verse 3 and chapter 14.26]as God overthrew Sodom and Gomorra [together with the other cities see Gen 19:24 Isaih 13.19 Jer 59:18 Hos 11:8 ]ye being as a firebrand that is rescued out of the burning [that is like a piece of wood half or neer wholly consumed namely when rescued and delivered ye favorable out of then present destruction and restored your state by Jeroboam the son of Joas see 2 Kings 14.25 and compare Zach 3.2 ]nevertheless ye did not convert yourselves to me saith the Lord ."}],"12":[{"catchword":null,"tekst":"Therefore will I do thus unto thee function refUrl(ref) {

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');

}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;

document.addEventListener('click', e => {

    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
