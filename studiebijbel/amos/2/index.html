antwoordde en zei tegen hem: Bent u een leraar van Israël, en weet u deze dingen niet?", "Rom 12:21": "Word niet door het kwade overwonnen, maar overwin het kwade door het goede.", "Ps 78:40": "Hoe dikwijls verbitterden zij Hem in de woestijn, deden zij Hem smart aan in de wildernis!", "Gal 4:14": "en mijn beproeving¹, die in mijn vlees gebeurde, hebt u niet veracht, en ook niet verafschuwd; maar u nam mij aan als een engel van God, ja, als Christus Jezus.", "Spr 17:8": "Het geschenk is in de ogen van wie het bezit een aangenaam gesteente; waarheen het zich ook wendt, het zal wel gedijen.", "Jer 9:9-26": "Zou Ik hen om deze dingen niet straffen? spreekt de HEERE; zou Mijn ziel zich niet wreken aan zo'n volk, als dit is? Ik zal een geween en een klaagzang aanheffen over de bergen, en een klaaglied over de herdershutten van de woestijn; want zij zijn afgebrand, zodat er niemand doorgaat, en men hoort er geen stem van vee; van de vogels van de hemel tot de dieren toe zijn zij weggevlucht, weggegaan! En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Openb 12:10": "En ik hoorde een grote stem, die zei in de hemel: Nu is de zaligheid, en de kracht, en het koninkrijk van onze God gekomen; en de macht van Zijn Christus; want de aanklager van onze broeders, die hen aanklaagde voor onze God dag en nacht, is neergeworpen.", "Joz 3:10": "Verder zei Jozua: Hieraan zult u weten dat de levende God in uw midden is, en dat Hij helemaal voor uw aangezicht zal verdrijven de Kanaänieten, en de Hethieten, en de Hevieten, en de Ferezieten, en de Girgazieten, en de Amorieten en de Jebusieten.", "Spr 15:3": "De ogen van de HEERE zijn in alle plaatsen, en zien de kwaden en de goeden.", "Ex 22:25-27": "Als u Mijn volk, dat arm is onder u, geld leent, mag u zich niet als een woekeraar tegenover hen gedragen; u mag geen rente van hen vragen. Als u de mantel van uw naaste als onderpand neemt, moet u die aan hem teruggeven voordat de zon ondergaat; want dat is zijn enige bedekking, het is zijn kleding voor zijn huid; waarin zou hij anders slapen? Het zal dan gebeuren, wanneer hij tot Mij roept, dat Ik hem zal horen; want Ik ben genadig!", "1 Petr 2:8": "En een steen des aanstoots, en een rots der ergernis; namelijk voor hen die zich aan het Woord stoten, ongehoorzaam als zij zijn, waartoe zij ook bestemd zijn.", "Neh 9:8-12": "En U hebt zijn hart getrouw gevonden voor Uw aangezicht, en hebt een verbond met hem gemaakt, dat U zou geven het land van de Kanaänieten, de Hethieten, de Amorieten, en de Ferezieten, en de Jebusieten, en de Girgasieten, dat U het aan zijn nageslacht zou geven; en U hebt Uw woorden bevestigd, omdat U rechtvaardig bent. En U hebt de ellende van onze vaderen in Egypte gezien, en U hebt hun geroep gehoord aan de Schelfzee; En U hebt tekenen en wonderen gedaan aan Farao, en aan al zijn knechten, en aan al het volk van zijn land; want U wist, dat zij trots tegen hen handelden; en U hebt U een Naam gemaakt, zoals het is op deze dag.", "Mark 13:1-13": "En toen Hij de tempel uitging, zei een van Zijn discipelen tegen Hem: Meester, kijk, wat voor stenen, en wat voor gebouwen! En Jezus antwoordde en zei tegen hem: Ziet u deze grote gebouwen? Er zal niet één steen op de andere steen gelaten worden, die niet afgebroken zal worden. En toen Hij op de Olijfberg zat, tegenover de tempel, vroegen Petrus, en Jakobus, en Johannes, en Andreas Hem apart:", "Ezech 20:10": "En Ik leidde hen uit Egypteland, en bracht hen in de woestijn.", "Jes 10:12": "Want het zal gebeuren, als de Heere een einde zal gemaakt hebben van al Zijn werk op de berg Sion en te Jeruzalem, dan zal Ik thuis zoeken de vrucht van de grootsheid van het hart van de koning van Assyrië, en de pracht van de hoogheid van zijn ogen.", "Jer 8:1-22": "In die tijd, spreekt de HEERE, zullen ze de beenderen van de koningen van Juda, en de beenderen van hun vorsten, en de beenderen van de priesters, en de beenderen van de profeten, en de beenderen van de inwoners van Jeruzalem, uit hun graven halen. En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het hele heerleger van de hemel, die zij liefgehad hebben, en die zij gediend hebben, en die zij nagevolgd hebben, en die zij gezocht hebben, en voor wie zij zich neergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op de aardbodem zullen zij zijn. En de dood zal boven het leven verkozen worden, door heel het overblijfsel van hen die overgebleven zijn uit dit boze geslacht, in al de plaatsen van de overgeblevenen, waarheen Ik hen verdreven zal hebben, spreekt de HEERE van de heerscharen.", "1 Kor 10:28-32": "Maar als iemand tegen u zegt: Dit is afgodenoffer; eet het dan niet, omwille van hem die het u heeft laten weten, en omwille van het geweten. Want de aarde is van de Heere, en al wat zij bevat. Ik bedoel niet uw eigen geweten, maar dat van de ander; want waarom zou mijn vrijheid beoordeeld worden door het geweten van een ander? En als ik door genade deel heb aan het voedsel, waarom word ik dan belasterd over iets waarvoor ik dank?", "Hos 11:2": "Maar net zoals zij hen riepen, zo gingen zij van hun aangezicht weg; zij offerden aan de Baäls, en brandden reukwerk voor de gesneden beelden.", "Openb 2:15": "Zo hebt u ook mensen die de leer van de Nikolaieten vasthouden; wat Ik haat.", "Micha 2:10": "Maak u dan op en ga heen; want dit land zal de rust niet zijn; omdat het verontreinigd is, zal het u verderven, en dat met een hevige verderving.", "Jer 38:1-3": "Toen Sefatja, de zoon van Matthan, en Gedalia, de zoon van Pashur, en Juchal, de zoon van Selemja, en Pashur, de zoon van Malchia, de woorden hoorden die Jeremia tot al het volk sprak: Zo zegt de HEERE: Wie in deze stad blijft, zal door het zwaard, door de honger of door de pestilentie sterven; maar wie naar de Chaldeeën uitgaat, die zal leven, want hij zal zijn leven als buit hebben, en zal leven. Zo zegt de HEERE: Deze stad zal zeker gegeven worden in de hand van het leger van de koning van Babel, dat zal haar innemen;", "Ezech 22:26": "Haar priesters doen Mijn wet geweld aan, en zij ontheiligen Mijn heilige dingen; tussen het heilige en het onheilige maken zij geen onderscheid, en het verschil tussen het onreine en het reine geven zij niet te kennen; daarbij verbergen zij hun ogen voor Mijn sabbatten; ja, Ik word in hun midden ontheiligd.", "Luk 21:8": "En Hij zei: Kijkt uit, dat u niet verleid wordt; want velen zullen komen onder Mijn Naam, en zeggen: Ik ben de Christus; en de tijd is nabij gekomen. Ga hen dan niet na.", "Amos 3:6": "Zal de bazuin in de stad geblazen worden, zonder dat het volk sidddert? Zal er een kwaad in de stad zijn, dat de HEERE niet doet?", "Matt 24:5": "Want velen zullen komen onder Mijn Naam en zeggen: Ik ben de Christus; en zij zullen velen misleiden.", "Ezech 23:41": "En u zat op een prachtig bed, waarvoor een tafel klaargemaakt was, en waarop u Mijn reukwerk en Mijn olie had neergezet.", "Jer 25:27": "U zult dan tot hen zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Drink, en word dronken, en spuw, en val neer, zodat u niet weer opstaat, vanwege het zwaard, dat Ik onder u zal zenden.", "Spr 17:5": "Die de arme bespot, smaadt zijn Maker; die zich verblijdt in het ongeluk van een ander, zal niet onschuldig blijven.", "Jer 48:24": "En over Kerioth, en over Bozra; ja, over alle steden van Moabs land, die ver weg en die dichtbij zijn.", "Jes 57:7": "U legt uw slaapplaats op een hoge en verheven berg; ook klimt u daarheen op om slachtoffer te offeren.", "Fil 3:2": "Let op de honden, let op de kwade arbeiders, let op de versnijding.", "Rom 14:13": "Laten wij elkaar dan niet meer oordelen; maar oordeelt dit liever, namelijk dat u de broeder geen aanstoot of ergernis geeft.", "Spr 17:18": "Een mens zonder verstand slaat de hand erop, en stelt zich borg bij zijn naaste.", "Deut 29:19-21": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "Openb 2:20-22": "Maar Ik heb enkele weinige dingen tegen u, dat u de vrouw Izébel toelaat, die zichzelf een profetes noemt, te leren en Mijn dienstknechten te verleiden, zodat zij hoereren en afgodenoffer eten. En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd. Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Hebr 12:3": "Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "2 Kon 22:16": "Zo zegt de HEERE: Zie, Ik zal onheil brengen over deze plaats, en over haar inwoners, namelijk alle woorden van het boek dat de koning van Juda gelezen heeft.", "Rom 7:5": "Want toen wij in het vlees waren, werkten de hartstochten van de zonden, die door de wet geprikkeld worden, in onze leden, om vruchten te dragen voor de dood.", "Jer 3:1-25": "Men zegt: Als een man zijn vrouw verlaat, en zij gaat van hem weg en wordt de vrouw van een andere man, zal hij dan nog naar haar terugkeren? Zou dat land niet ernstig ontheiligd worden? U hebt met veel minnaars gehoereerd, en toch zou u weer naar Mij terugkeren, spreekt de HEERE. Sla uw ogen op naar de hoge plaatsen, en zie toe: waar bent u niet beslapen? U hebt voor hen gezeten langs de wegen, als een Arabier in de woestijn; zo hebt u het land ontheiligd met uw hoererijen en met uw slechtheid. Daarom zijn de regendruppels ingehouden, en is er geen late regen geweest. Maar u hebt een hoerenvoorhoofd, u weigert schaamrood te worden.", "Micha 4:8-10": "En u, Schaapstoren, u Ofel van de dochter van Sion! Tot u zal komen, ja, daar zal komen de vorige heerschappij, het koninkrijk van de dochters van Jeruzalem. Nu, waarom zou u zo luid roepen? Is er geen koning onder u? Is uw Raadgever vergaan, dat smart u heeft aangegrepen, als van een barende vrouw? Lijd smart en doe uw uiterste best om te baren, dochter van Sion, als een barende vrouw; want nu zult u wel uit de stad heen weggaan, en op het veld wonen, en tot in Babel komen, maar daar zult u gered worden; daar zal de HEERE u verlossen uit de hand van uw vijanden.", "Openb 2:14": "Maar Ik heb enkele weinige dingen tegen u, dat u daar mensen hebt die de leer van Balaäm vasthouden, die Balak leerde de kinderen van Israël een aanstoot voor te werpen, opdat zij afgodenoffer zouden eten en hoereren.", "Matt 5:19": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen.", "1 Petr 1:6": "Daarin verheugt u zich, ook al bent u nu, voor een korte tijd (als het nodig is), bedroefd door allerlei beproevingen,", "Hand 7:51": "U hardnekkigen en onbesnedenen van hart en oren, u weerstaat altijd de Heilige Geest; zoals uw vaders deden, zo doet u ook.", "2 Kon 17:7-18": "Want het was gebeurd, omdat de kinderen van Israël gezondigd hadden tegen de HEERE, hun God, Die hen uit het land Egypte opgevoerd had, onder de hand van de farao, de koning van Egypte, vandaan; en zij hadden andere goden gevreesd; En hadden gewandeld in de inzettingen van de heidenvolken, die de HEERE voor de kinderen van Israël uit verdreven had, en in die van de koningen van Israël, die zij gemaakt hadden. En de kinderen van Israël hadden dingen die niet recht zijn tegen de HEERE, hun God, verborgen gedaan; en hadden zich hoogten gebouwd in al hun steden, van de wachttoren af tot de versterkte stad toe.", "Jer 50:6": "Mijn volk waren verloren schapen, hun herders hadden hen verleid, zij hadden hen naar de bergen gevoerd, zij gingen van berg tot heuvel, zij vergaten hun rustplaats.", "Zach 14:1-3": "Zie, de dag komt, de HEERE, dat uw roof zal uitgedeeld worden in het midden van u, o Jeruzalem! Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen worden, en de huizen zullen geplunderd worden, en de vrouwen zullen geschonden worden; en de helft van de stad zal uitgaan in de gevangenis, maar het overige van het volk zal uit de stad niet uitgeroeid worden. En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, zoals ten dage dat Hij gestreden heeft, ten dage van het strijd.", "1 Kon 15:12": "Want hij nam de schandjongens weg uit het land, en deed alle drekgoden weg, die zijn vaders gemaakt hadden.", "Matt 7:15": "Maar wacht u voor de valse profeten, die in schaapskleren naar u toe komen, maar van binnen zijn het roofzuchtige wolven.", "Jes 10:1": "Wee hun die onrechtvaardige regels bepalen, en de schrijvers die moeite voorschrijven;", "Ps 106:13": "Maar zij vergaten al snel Zijn werken, zij wachtten niet op Zijn raad.", "1 Joh 2:26": "Dit heb ik u geschreven over hen, die u verleiden.", "Spr 20:16": "Als iemand borg geworden is voor een vreemde, neem zijn kleed; en pand hem voor de onbekenden.", "1 Joh 2:18": "Kinderen, het is het laatste uur; en zoals u gehoord hebt, dat de antichrist komt, zo zijn er nu ook al veel antichristen gekomen; waaraan wij weten, dat het het laatste uur is.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "2 Kon 2:2-5": "En Elia zei tegen Elisa: Blijf toch hier, want de HEERE heeft mij naar Beth-el gezonden. Maar Elisa zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Zo gingen zij af naar Beth-el. Toen gingen de zonen van de profeten, die te Beth-el waren, naar Elisa toe, en zeiden tegen hem: Weet u dat de HEERE vandaag uw heer van boven uw hoofd wegnemen zal? En hij zei: Ik weet het ook wel, zwijgt u stil. En Elia zei tegen hem: Elisa, blijf toch hier, want de HEERE heeft mij naar Jericho gezonden. Maar hij zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Zo kwamen zij te Jericho.", "Ezech 23:22-35": "Daarom, o Oholiba! Zo zegt de Heere HEERE: Zie, Ik zal uw minnaars, van wie uw ziel is afgekeerd, tegen u opwekken, en Ik zal hen van rondom tegen u aanbrengen. De zonen van Babel en alle Chaldeeën, Pekod, en Soa, en Koa, en alle zonen van Assur met hen; aantrekkelijke jonge mannen, die allen vorsten en machthebbers zijn, hoofdmannen en vermaarde mannen, die allen te paard rijden. Die zullen tegen u komen met karren, wagens en wielen, en met een menigte van volken, met kleine schilden, grote schilden, en helmen; zij zullen zich rondom tegen u opstellen; en Ik zal voor hun aangezicht het strafgericht neerleggen, en zij zullen u berechten naar hun rechtsregels.", "1 Kor 3:21": "Niemand roemt dan op mensen; want alles is van u.", "Kol 4:17": "En zeg tegen Archippus: Let op de bediening die u hebt aangenomen in de Heere, dat u die vervult.", "Jes 28:7": "Maar ook dezen dwalen door de wijn, en zij dolen door de sterke drank; de priester en de profeet dwalen door de sterke drank; zij zijn verslonden door de wijn, zij dolen door sterke drank; zij dwalen in het zien van visioenen; zij waggelen in het rechtspreken.", "2 Kon 7:1": "Toen zei Elisa: Hoor het woord van de HEERE; zo zegt de HEERE: Morgen omtrent deze tijd zal een maat meelbloem verkocht worden voor een sikkel, en twee maten gerst voor een sikkel, in de poort van Samaria.", "Jes 30:16": "En u zegt: Nee, maar op paarden zullen wij vluchten; daarom zult u vluchten! En: Op snelle paarden zullen wij rijden; daarom zullen uw vervolgers ook snel zijn!", "Joël 1:5": "Word wakker, dronkaards! En huil, en jammer, alle wijnzuipers! Om de nieuwe wijn, omdat hij van uw mond is afgesneden.", "Spr 5:6-21": "Opdat u het pad van het leven niet zoudt overwegen, zijn haar gangen onvast, zodat u het niet merkt. Nu dan, kinderen! Hoor naar mij, en wijk niet van de woorden van mijn mond. Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;", "Matt 24:4": "En Jezus antwoordde en zei tegen hen: Kijk uit dat niemand u misleidt.", "Jes 28:9-14": "Aan wie zou Hij dan de kennis leren, en aan wie zou Hij het gehoorde te verstaan geven? Aan hen die van de melk gespeend zijn, die van de borsten weggehaald zijn? Want het is gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig. Daarom zal Hij door belachelijke lippen en door een andere tong tot dit volk spreken;", "Jer 14:14-18": "En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart. Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden. En het volk, tot wie zij profeteren, zal op de straten van Jeruzalem weggeworpen zijn vanwege de honger en het zwaard; en er zal niemand zijn die hen kan begraven, hen, hun vrouwen, en hun zonen, en hun dochters; zo zal Ik hun slechtheid over hen uitstorten.", "Spr 11:15": "Als iemand voor een vreemde borg geworden is, zal hij zeker daarvoor lijden; maar wie ervoor terugdeinst om vast toe te slaan, is zeker van zichzelf.", "Jes 43:27": "Uw eerste vader heeft gezondigd, en uw uitleggers hebben tegen Mij overtreden.", "Jer 42:14": "en zegt: Nee, maar wij zullen naar Egypteland gaan, waar wij geen oorlog zullen zien, noch het geluid van de bazuin horen, noch naar brood hongeren, en daar zullen wij blijven;", "Deut 16:19": "U zult het recht niet buigen; u zult niet partijdig zijn; ook zult u geen geschenk aannemen; want het geschenk verblindt de ogen van de wijzen, en verdraait de woorden van de rechtvaardigen.", "Hos 4:11": "Hoererij, en wijn, en jonge wijn neemt het hart weg.", "Jer 12:10": "Veel herders hebben Mijn wijngaard verdorven, zij hebben Mijn akker vertrapt; zij hebben Mijn gewenste akker gesteld tot een woeste wildernis.", "2 Kor 11:15": "Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.", "Pred 9:11": "Ik keerde mij om en zag onder de zon dat de wedloop niet is voor de snellen, en de strijd niet voor de helden, en ook het brood niet voor de wijzen, en ook de rijkdom niet voor de verstandigen, en ook de gunst niet voor de kundigen; maar dat tijd en toeval hen allen treft.", "Spr 21:17": "Wie blijdschap liefheeft, die zal gebrek lijden; wie wijn en olie liefheeft, zal niet rijk worden.", "Ps 78:10": "Zij hielden Gods verbond niet, en weigerden te wandelen in Zijn wet.", "1 Tess 4:8": "Wie dan dit verwerpt, verwerpt geen mens, maar God, Die ook Zijn Heilige Geest in ons heeft gegeven.", "Jer 1:5": "Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Amos 6:4": "Die daar liggen op ivoren bedsteden, en weelderig zijn op hun rustbanken, en de lammeren van de kudde eten, en de kalveren uit het midden van de meststal.", "Matt 24:48-51": "Maar als die slechte dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg, en zou beginnen zijn mededienstknechten te slaan, en te eten en te drinken met de dronkaards, dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Ps 95:10": "Veertig jaren heb Ik verdriet gehad aan dit geslacht, en heb gezegd: Zij zijn een volk dat dwaalt van hart, en zij kennen Mijn wegen niet.", "Jer 14:7": "Hoewel onze ongerechtigheden tegen ons getuigen, o HEERE, doe het om Uw Naams wil; want onze afdwalingen zijn talrijk, wij hebben tegen U gezondigd.", "2 Kor 11:14": "En het is geen wonder, want de satan zelf verandert zich in een engel van het licht.", "Jes 44:20": "Hij voedt zich met as, het bedrogen hart heeft hem terzijde afgeleid; zodat hij zijn ziel niet redden kan, en ook niet kan zeggen: Is er niet een leugen in mijn rechterhand?", "Ezech 16:43": "Omdat u niet gedacht hebt aan de dagen van uw jeugd, en Mij tot beroering geweest bent met dit alles, zie, zo zal Ik ook uw weg op uw hoofd geven, spreekt de Heere HEERE; en u zult die schandelijke daad niet meer doen boven al uw gruwelen.", "Zef 2:8": "Ik heb de beschimping van Moab gehoord, en de scheldwoorden van de kinderen van Ammon, waarmee zij Mijn volk beschimpt hebben, en zich groot gemaakt hebben tegen hun grondgebied.", "Ezech 16:1-63": "Verder gebeurde het woord van de HEERE tot mij, en Hij zei: Mensenkind, maak Jeruzalem haar gruwelen bekend, en zeg: Zo zegt de Heere HEERE tot Jeruzalem: Uw oorsprong en uw geboorte zijn uit het land van de Kanaänieten; uw vader was een Amoriet en uw moeder een Hethitische.", "Luk 22:3": "En de satan voer in Judas, die bijgenaamd was Iskariot, die uit het getal van de twaalf was.", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Micha 3:5-7": "Zo zegt de HEERE, tegen de profeten, die Mijn volk verleiden; die met hun tanden bijten, en vrede uitroepen; maar tegen hem die niet in hun mond geeft, tegen die heiligen zij een oorlog. Daarom zal het nacht voor u worden vanwege het visioen, en u zal duisternis zijn vanwege de waarzegging; en de zon zal over deze profeten ondergaan; en de dag zal over hen zwart worden. En de zieners zullen beschaamd, en de waarzeggers schaamrood worden; en zij zullen allen samen de bovenlip bewimpelen; want er zal geen antwoord van God zijn.", "Ps 50:16": "Maar tegen de goddeloze zegt God: Wat hebt u Mijn inzettingen te vertellen, en neemt u Mijn verbond in uw mond?", "Gal 5:10": "Ik vertrouw van u in de Heere, dat u niet anders zult denken; maar wie u in verwarring brengt, zal het oordeel dragen, wie hij ook is.", "Nahum 1:10": "Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Ezech 23:1-44": "Verder kwam het woord van de HEERE tot mij en Hij zei: Mensenkind! Er waren twee vrouwen, dochters van één moeder. Deze hoereerden in Egypte; in hun jeugd hoereerden zij. Daar werden hun borsten gedrukt, en daar werden de tepels van hun maagdelijkheid betast.", "Jes 30:11": "Wijkt af van de weg, maakt u van het pad; laat de Heilige van Israël van ons ophouden!", "Deut 23:4": "Vanwege dat zij u onderweg niet tegemoet gekomen zijn met brood en met water, toen u uit Egypte wegtrok; en omdat hij tegen u Bileam gehuurd heeft, de zoon van Beor, uit Pethor in Mesopotamië, om u te vloeken.", "2 Petr 1:20": "Weet dit eerst, dat geen enkele profetie van de Schrift een eigen uitlegging heeft;", "Jer 10:21": "Want de herders zijn redeloos geworden, en hebben de HEERE niet gezocht; daarom hebben zij niet verstandig gehandeld, en hun hele kudde is verstrooid.", "Klaagl 4:13": "Mem. Het is vanwege de zonden van haar profeten, en de misdaden van haar priesters, die in haar midden het bloed van de rechtvaardigen vergoten hebben.", "Spr 28:3": "Een arme man, die de geringen verdrukt, is een wegvagende regen, zodat er geen brood is.", "Jer 7:12-34": "Want ga nu naar Mijn plaats die te Silo was, waar Ik Mijn Naam in het begin had laten wonen; en zie wat Ik daaraan gedaan heb vanwege de slechtheid van Mijn volk Israël. En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt; daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb.", "1 Tim 1:3-7": "Zoals ik u vermaand heb dat u in Efeze zou blijven, toen ik naar Macedonië reisde, zo vermaan ik het u nog, opdat u sommigen zou bevelen geen andere leer te leren; Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is. Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.", "Spr 22:16": "Wie de arme verdrukt om zijn eigen bezit te vermeerderen, en wie aan de rijke geeft, komt zeker tot gebrek.", "Ps 78:40-43": "Hoe dikwijls verbitterden zij Hem in de woestijn, deden zij Hem smart aan in de wildernis! Want zij kwamen telkens terug, en verzochten God, en stelden de Heilige van Israël een grens. Zij dachten niet aan Zijn hand, aan de dag, toen Hij hen verloste van de tegenstander;", "Joz 11:21": "In diezelfde tijd nu kwam Jozua, en roeide de Enakieten uit, van het gebergte, van Hebron, van Debir, van Anab, en van heel het gebergte van Juda, en van heel het gebergte van Israël; Jozua trof hen met de ban, met hun steden.", "Hand 13:18": "En Hij heeft ongeveer veertig jaar lang hun gedrag verdragen in de woestijn.", "Kol 1:25-29": "waarvan ik een dienaar geworden ben, naar de bedeling van God die mij gegeven is voor u, om het Woord van God te vervullen; namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen; aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "Openb 2:18": "En schrijf aan de engel van de gemeente te Thyatire: Dit zegt de Zoon van God, Die Zijn ogen heeft als een vlam van vuur, en Zijn voeten blinkend koper gelijk zijn:", "Deut 16:18": "Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen; opdat zij het volk richten met een rechtvaardig oordeel.", "Hebr 13:9": "Laat u niet meeslepen door allerlei vreemde leringen; want het is goed dat het hart gesterkt wordt door genade, niet door spijzen, waarmee zij die daarin gewandeld hebben, geen nuttigheid hebben verkregen.", "2 Sam 12:10": "Nu dan, het zwaard zal niet van uw huis wijken tot in eeuwigheid, omdat u Mij veracht hebt, en de vrouw van Uria, de Hethiet, genomen hebt, zodat zij uw vrouw is geworden.", "Ezech 18:7": "En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;", "2 Kon 17:13": "Toen nu de HEERE tegen Israël en tegen Juda, door de dienst van alle profeten en van alle zieners, gewaarschuwd had en zei: Bekeer u van uw slechte wegen en houd Mijn geboden en Mijn inzettingen, naar de hele wet die Ik uw vaderen geboden heb, en die Ik u door de hand van Mijn knechten, de profeten, gezonden heb;", "2 Kon 22:17": "Omdat zij Mij verlaten hebben, en voor andere goden reukwerk gebrand hebben, om Mij tot toorn te verwekken met al het werk van hun handen, zal Mijn grimmigheid ontstoken worden tegen deze plaats, en niet uitgeblust worden.", "Job 24:7-10": "De naakten laten zij overnachten zonder kleding, die geen bedekking hebben tegen de koude. Van de stromen op de bergen worden zij nat, en zonder toevlucht omhelzen zij de rotsen. Zij rukken het weesje van de borst, en wat de arme toebehoort, nemen zij te pand.", "Deut 3:11": "Want Og, de koning van Bazan, was als enige van de overgeblevenen van de reuzen overgebleven; zie, zijn bed, een bed van ijzer, staat dat niet in Rabba van de kinderen van Ammon? Negen el is zijn lengte, en vier el zijn breedte, naar de elleboogsmaat van een man.", "Openb 2:20-23": "Maar Ik heb enkele weinige dingen tegen u, dat u de vrouw Izébel toelaat, die zichzelf een profetes noemt, te leren en Mijn dienstknechten te verleiden, zodat zij hoereren en afgodenoffer eten. En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd. Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Jes 7:13": "Toen zei hij: Hoor toch, u, huis van David! Is het u te weinig, dat u de mensen moe maakt, dat u ook mijn God moe maakt?", "Jes 16:14": "Maar nu spreekt de HEERE en zegt: Binnen drie jaar (zoals de jaren van het huurling), dan zal de eer van Moab veracht worden, met heel die grote menigte; en het overblijfsel zal klein, weinig, machteloos zijn.", "Jer 13:9-27": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem. Dit boosaardige volk, dat weigert Mijn woorden te horen, dat wandelt naar het goeddunken van zijn hart, en andere goden navolgt om die te dienen en zich voor die neer te buigen; dat zal worden als deze gordel, die nergens meer voor deugt. Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Jes 43:22": "Doch u hebt Mij niet aangeroepen, o Jakob! toen u zich tegen Mij vermoeid hebt, o Israël!", "Ezra 9:10": "En nu, wat zullen wij zeggen, o onze God, na dit alles? Want wij hebben Uw geboden verlaten,", "Spr 13:14": "De leer van de wijze is een springader van het leven, om af te wijken van de strikken van de dood.", "Mark 13:21": "En dan, als iemand tegen u zal zeggen: Zie, hier is de Christus; of: Zie, Hij is daar; geloof het niet.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "Jer 8:2": "En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het hele heerleger van de hemel, die zij liefgehad hebben, en die zij gediend hebben, en die zij nagevolgd hebben, en die zij gezocht hebben, en voor wie zij zich neergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op de aardbodem zullen zij zijn.", "1 Tim 4:7": "Maar wijs de ongoddelijke en oudwijfse verzinsels af; oefen uzelf in plaats daarvan in godvruchtigheid.", "Jer 25:28": "En het zal gebeuren, wanneer zij weigeren de beker van uw hand aan te nemen om te drinken, dat u tot hen zult zeggen: Zo zegt de HEERE van de heerscharen: U zult zeker drinken!", "1 Tess 3:5": "Daarom heb ik ook, omdat ik het verlangen niet langer kon verdragen, hem gezonden om uw geloof te leren kennen; of de verzoeker u misschien niet had verzocht, en onze arbeid tevergeefs zou zijn.", "Hos 8:4-6": "Zij hebben koningen aangesteld, maar niet door Mij; zij hebben vorsten aangesteld, maar Ik heb het niet erkend; van hun zilver en hun goud hebben zij voor zichzelf afgoden gemaakt, zodat zij uitgeroeid worden. Uw kalf, Samaria! heeft u verstoten; Mijn toorn is tegen hen ontstoken; hoe lang zullen zij de reinheid niet verdragen? Want ook dat komt uit Israël; een vakman heeft het gemaakt, en het is geen God, maar het zal in stukken worden gebroken, het kalf van Samaria.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Spr 19:7": "Al de broeders van de arme haten hem; hoeveel te meer gaan zijn vrienden ver van hem weg! Hij loopt hen achterna met woorden, die niets zijn.", "Joz 11:22": "Er bleef niemand van de Enakieten over in het land van de kinderen van Israël; alleen bleven zij over in Gaza, in Gath, en in Asdod.", "2 Kon 6:1": "De kinderen van de profeten zeiden tegen Elisa: Zie toch, de plaats waar wij voor uw aangezicht wonen, is voor ons te eng.", "Spr 22:7": "De rijke heerst over de armen; en wie leent, is de knecht van wie uitleent.", "Jes 29:21": "die een mens schuldig maken om een woord, en die strikken leggen voor hem die bestraft in de poort; en die de rechtvaardige verdrijven met valse argumenten.", "Lev 20:3": "En Ik zal Mijn aangezicht tegen die man richten, en zal hem uit het midden van zijn volk uitroeien; want hij heeft van zijn nageslacht aan de Molech gegeven, om Mijn heiligdom te verontreinigen en Mijn heilige Naam te ontheiligen.", "Jer 17:27": "Maar als u naar Mij niet zult horen, om de sabbatdag te heiligen, en om geen last te dragen als u op de sabbatdag door de poorten van Jeruzalem ingaat; zo zal Ik een vuur in haar poorten aansteken, dat de paleizen van Jeruzalem zal verteren, en niet uitgeblust worden.", "Hos 4:11-14": "Hoererij, en wijn, en jonge wijn neemt het hart weg. Mijn volk vraagt zijn hout om raad, en zijn stok zal het hem bekendmaken; want de geest van de hoererijen verleidt hen, zodat zij van onder hun God weghoereren. Op de toppen van de bergen offeren zij, en op de heuvels branden zij reukwerk, onder een eik, en populier, en iepenboom, omdat de schaduw daarvan goed is; daarom hoereren uw dochters, en uw bruiden plegen overspel.", "Ezech 20:30": "Daarom, zeg tegen het huis van Israël: Zo zegt de Heere HEERE: Bent u verontreinigd geraakt op de weg van uw vaderen, en pleegt u hoererij achter hun verfoeisels aan?", "Zef 1:16": "Een dag van de bazuin en van het geschal tegen de vaste steden en tegen de hoge hoeken.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "Tit 3:11": "Wetend dat zo iemand verkeerd is, en zondigt, terwijl hij zichzelf veroordeelt.", "Num 3:5-13": "En de HEERE sprak tot Mozes en zei: Laat de stam van Levi naderen, en stel hem voor het aangezicht van de priester Aäron, opdat zij hem dienen; En dat zij zijn wacht waarnemen, en de wacht van de hele vergadering, voor de tent der samenkomst, om de dienst van de tabernakel te bedienen;", "Spr 20:1": "De wijn is een spotter, de sterke drank is woelachtig; al wie daarin dwaalt, zal niet wijs zijn.", "Num 25:18": "want zij hebben vijandig tegen u gehandeld door hun listen, waarmee zij u listig bedrogen hebben in de zaak van Peor, en in de zaak van Kozbi, de dochter van de leider van de Midianieten, hun zuster, die gedood is ten dage van de plaag, om de zaak van Peor.", "Hand 21:24-31": "Neem hen mee, en heilig u samen met hen, en betaal de kosten voor hen, zodat zij hun hoofd kunnen laten scheren; en allen zullen weten dat er niets waar is van wat hun over u verteld is, maar dat u zelf ook ordelijk wandelt en de wet onderhoudt. Maar wat de heidenen betreft die geloven, hebben wij geschreven en besloten dat zij niets dergelijks hoeven te onderhouden, behalve dat zij zich onthouden van wat aan de afgoden geofferd is, en van bloed, en van het verstikte, en van hoererij. Toen nam Paulus de mannen mee, en nadat hij zich de volgende dag samen met hen geheiligd had, ging hij de tempel binnen en maakte bekend dat de dagen van de heiliging vervuld waren, totdat voor ieder van hen de offerande gebracht was.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "Ezech 22:13": "Zie dan, Ik heb Mijn hand geslagen om uw gierigheid die u bedreven hebt, en om uw bloed dat in uw midden geweest is.", "Jer 23:13-15": "Ik heb wel dwaasheid gezien in de profeten van Samaria; zij profeteerden door Baäl, en verleidden Mijn volk Israël. Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra. Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van de profeten van Jeruzalem is de huichelarij uitgegaan in het hele land.", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "Matt 21:34-38": "Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen. En de landbouwers grepen zijn dienstknechten en sloegen de een, en doodden een ander, en stenigden een derde. Weer stuurde hij andere dienstknechten, meer in aantal dan de eersten, en zij deden hun hetzelfde.", "Rom 10:15": "En hoe zullen zij prediken, als zij niet gezonden worden? Zoals geschreven is: Hoe lieflijk zijn de voeten van hen die vrede verkondigen, van hen die het goede verkondigen!", "Tit 3:10": "Verwerp iemand die een ketter is, na de eerste en tweede vermaning;", "Jak 1:12-16": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben. Niemand moet, als hij verzocht wordt, zeggen: Ik word door God verzocht; want God kan niet verzocht worden met het kwade, en Hij Zelf verzoekt niemand. Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "Jer 25:29": "Want zie, in de stad, die naar Mijn Naam genoemd is, begin Ik te plagen, en zou u dan zonder meer onschuldig gehouden worden? U zult niet onschuldig worden gehouden; want Ik roep het zwaard over alle inwoners van de aarde, spreekt de HEERE van de heerscharen.", "Ps 33:17": "Het paard schiet tekort voor de overwinning, en bevrijdt niet door zijn grote sterkte.", "Gen 36:31-39": "En dit zijn de koningen die geregeerd hebben in het land Edom, voordat er een koning regeerde over de kinderen van Israël. Bela dan, de zoon van Beor, regeerde in Edom, en de naam van zijn stad was Dinhaba. En Bela stierf, en Jobab, de zoon van Zerah, uit Bozra, regeerde in zijn plaats.", "Jes 6:8-10": "Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, hier ben ik, zend mij heen. Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op. Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Deut 13:3": "dan zult u naar de woorden van die profeet, of naar die dromen-dromer, niet horen; want de HEERE, uw God, beproeft u, om te weten of u de HEERE, uw God, liefhebt met heel uw hart en met heel uw ziel.", "Num 13:29": "De Amalekieten wonen in het land van het zuiden; maar de Hethieten, en de Jebusieten, en de Amorieten wonen op het gebergte; en de Kanaänieten wonen aan de zee, en aan de oever van de Jordaan.", "Deut 2:10": "De Emieten woonden hiervoor daarin, een groot en talrijk volk, en lang van gestalte, zoals de Enakieten.", "2 Kron 36:14-17": "Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem. En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning. Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "2 Tim 4:4": "en zij zullen hun oren van de waarheid afkeren, en zich wenden tot fabels.", "Amos 3:1": "Hoort dit woord, dat de HEERE tegen u spreekt, kinderen van Israël! Namelijk tegen het gehele geslacht, dat Ik uit Egypteland heb opgevoerd, en Hij zei:", "Hand 13:3": "Toen vastten en baden zij, en nadat zij hun de handen opgelegd hadden, lieten zij hen gaan.", "Jes 22:1-14": "De last van het dal van het gezicht. Wat is er nu met u, dat u helemaal naar de daken bent geklommen? U, die vol was van groot rumoer, u woelige stad, u, vrolijk huppelende stad, uw gesneuvelden zijn niet gesneuveld door het zwaard, en ook niet gestorven in de strijd. Al uw leiders zijn samen weggevlucht; zij zijn door de schutters gebonden, allen die in u gevonden zijn, zijn samen gebonden, zij zijn van ver gevlucht.", "Jes 30:15": "Want zo zegt de Heere HEERE, de Heilige van Israël: Door terugkering en rust zou u behouden worden, in stilte en in vertrouwen zou uw sterkte zijn; maar u hebt niet gewild.", "Hos 4:2": "Maar vloeken en liegen, en doodslaan, en stelen, en overspel plegen; zij breken door, en bloedschuld raakt aan bloedschuld.", "Jes 8:14-22": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem. En velen onder hen zullen struikelen, en vallen, en verbroken worden, en zullen verstrikt en gevangen worden. Bind de getuigenis toe; verzegel de wet onder mijn leerlingen.", "Ezech 7:19": "Zij zullen hun zilver op de straten werpen, en hun goud zal tot onreinheid zijn; hun zilver en hun goud zal hen niet kunnen uithelpen ten dage van de verbolgenheid van de HEERE; hun ziel zullen zij niet verzadigen, en hun ingewanden zullen zij niet vullen; want het zal de aanstoot van hun ongerechtigheid zijn.", "Hab 3:14": "U doorboorde met zijn eigen staven het hoofd van zijn dorpsbewoners; zij stormden aan, om mij te verstrooien; zij verheugden zich, alsof zij de ellendigen in het verborgen zouden opeten.", "2 Kron 29:8": "Daarom is er een grote toorn van de HEERE over Juda en Jeruzalem geweest; en Hij heeft hen overgegeven aan opschudding, verwoesting en aanfluiting, zoals u ziet met uw eigen ogen.", "Deut 13:1-5": "Wanneer een profeet, of iemand die dromen droomt, in uw midden opstaat, en u een teken of wonder geeft; en dat teken of dat wonder komt uit, waarover hij tot u gesproken had, en zei: Laat ons andere goden, die u niet gekend hebt, navolgen en hen dienen; dan zult u naar de woorden van die profeet, of naar die dromen-dromer, niet horen; want de HEERE, uw God, beproeft u, om te weten of u de HEERE, uw God, liefhebt met heel uw hart en met heel uw ziel.", "Luk 13:35": "Zie, uw huis wordt aan u woest achtergelaten. En voorwaar, Ik zeg u, dat u Mij niet zult zien, totdat de tijd zal zijn gekomen dat u zult zeggen: Gezegend is Hij Die komt in de Naam van de Heere!", "Jer 6:1": "Vlucht met opeenpakking, kinderen van Benjamin, uit het midden van Jeruzalem, en waai de bazuin te Thekoa, en hef een vuurteken op te Beth-cherem; want er kijkt een kwaad uit van het noorden, en een grote breuk.", "Jes 7:17-25": "Maar de HEERE zal over u, en over uw volk, en over het huis van uw vader, dagen doen komen, wat voor dagen niet gekomen zijn vanaf de dag dat Efraïm van Juda is afgeweken, door de koning van Assyrië. Want het zal op die dag gebeuren, dat de HEERE zal fluiten naar de vliegen, die aan het einde van de rivieren van Egypte zijn, en naar de bijen die in het land van Assyrië zijn. En zij zullen komen, en zij zullen allemaal neerstrijken in de woeste dalen, en in de kloven van de rotsen, en op alle doornhagen, en op alle geprezen plaatsen.", "Spr 23:21": "Want een zuiper en een vraat zullen arm worden; en de sluimering doet iemand versleten kleren dragen.", "1 Tim 5:15": "Want sommigen hebben zich al afgewend, achter de satan aan.", "Ezech 32:29": "Daar is Edom, haar koningen en al haar vorsten, die met hun macht gelegd zijn bij de verslagenen van het zwaard; die liggen met de onbesnedenen en met hen die in het kuil zijn neergedaald.", "Jer 5:13": "Ja, die profeten zullen tot wind worden, want het woord is niet bij hen; hun zelf zal zo gebeuren.", "1 Kor 5:1": "Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft.", "Jes 65:2": "Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.", "Amos 1:3": "Zo zegt de HEERE: Om drie overtredingen van Damaskus, en om vier zal Ik dat niet afwenden; omdat zij Gilead met ijzeren dorswagens hebben gedorst.", "Hebr 5:4": "En niemand neemt zichzelf die eer toe, maar hij die door God geroepen wordt, zoals Aäron.", "2 Kron 29:34": "Doch van de priesters waren er te weinig, en zij konden niet van al de brandoffers de huid aftrekken; daarom hielpen hun broeders, de Levieten, hen, totdat het werk beëindigd was, en totdat de andere priesters zich geheiligd hadden; want de Levieten waren oprechter van hart om zich te heiligen, dan de priesters.", "Ps 37:14": "Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn.", "1 Kor 9:16-19": "Want als ik het Evangelie verkondig, is het voor mij geen roem; want de noodzaak is mij opgelegd. En wee mij, als ik het Evangelie niet verkondig! Want als ik dat gewillig doe, heb ik loon, maar als onwillig, is de uitdeling mij toch toevertrouwd. Wat loon heb ik dan? Namelijk dat ik, terwijl ik het Evangelie verkondig, het Evangelie van Christus kosteloos aanbied, om mijn macht in het Evangelie niet te misbruiken.", "Jes 29:1-10": "Wee Ariël, Ariël! De stad waarin David gelegerd heeft; doe jaar bij jaar; laat ze feestoffers slachten. Toch zal Ik Ariël in het nauw brengen, en er zal treuring en droefheid zijn, en die stad zal Mij gelijk Ariël zijn. Want Ik zal een leger in het rond om u opslaan, en Ik zal u belegeren met bolwerken, en Ik zal vestingen tegen u opwerpen.", "Spr 19:27": "Laat af, mijn zoon, om, terwijl u de tucht hoort, af te dwalen van de woorden van de kennis.", "Mal 1:6": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam?", "Matt 24:14-42": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen. Wanneer u dan de gruwel van de verwoesting zal zien, waarvan gesproken is door Daniël de profeet, staande op de heilige plaats (die het leest, laat hij daarop letten!), laat dan wie in Judea zijn, vluchten naar de bergen;", "1 Joh 4:5": "Zij zijn uit de wereld; daarom spreken zij uit de wereld, en de wereld hoort hen.", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Jer 32:31": "Want tot Mijn toorn en tot Mijn grimmigheid is Mij deze stad geweest, vanaf de dag dat zij haar gebouwd hebben tot op deze dag toe; zodat Ik haar van Mijn aangezicht wegdeed;", "Jer 21:10": "Want Ik heb Mijn gezicht tegen deze stad gesteld ten kwade en niet ten goede, spreekt de HEERE; zij zal gegeven worden in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "Luk 11:46-52": "Maar Hij zei: Wee ook u, wetgeleerden! want u belast de mensen met lasten die zwaar zijn om te dragen, en zelf raakt u die lasten niet aan met één van uw vingers. Wee u, want u bouwt de graven van de profeten, en uw vaders hebben hen gedood. Zo getuigt u dus dat u instemt met de daden van uw vaderen; want zij hebben hen gedood, en u bouwt hun graven.", "Spr 22:26": "Wees niet onder hen die in de hand klappen, onder hen die borg staan voor schulden.", "Ezech 18:12": "De ellendige en de arme verdrukt, veel van het roof rooft, het pand niet teruggeeft, en zijn ogen opheft tot de drekgoden, gruwel doet;", "Luk 12:49": "Ik ben gekomen om vuur op de aarde te werpen; en wat wil Ik nog, als het al ontstoken is?", "Spr 17:23": "De goddeloze neemt het geschenk uit de schoot, om de paden van het recht te buigen.", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "2 Tim 3:6-9": "Want tot hen behoren zij die de huizen binnensluipen en de vrouwtjes gevangen nemen die met zonden beladen zijn en door allerlei begeerten gedreven worden, vrouwtjes die altijd leren, en nooit tot kennis van de waarheid kunnen komen. Zoals Jannes en Jambres Mozes tegenstonden, zo staan ook dezen de waarheid tegen; mensen, verdorven van verstand, verwerpelijk wat het geloof betreft.", "Tit 1:10-14": "Want er zijn ook veel ongeregelde mensen, mensen die zinloze praat verkondigen en misleiden, vooral zij die uit de besnijdenis zijn; hun moet men de mond snoeren, want zij brengen hele huizen in verwarring, en leren wat niet behoort, om het schandelijke gewin. Iemand uit hen, hun eigen profeet, heeft gezegd: De Kretenzers zijn altijd leugenachtig, kwade beesten, luie buiken.", "2 Kon 17:19": "Zelfs Juda hield de geboden van de HEERE, hun God, niet; maar zij wandelden in de inzettingen van Israël, die zij gemaakt hadden.", "2 Kon 22:11-17": "Het gebeurde nu, toen de koning de woorden van het wetboek hoorde, dat hij zijn kleren scheurde. En de koning gebood Hilkia, de priester, en Ahikam, de zoon van Safan, en Achbor, de zoon van Michaja, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei: Ga heen, vraag de HEERE voor mij, en voor het volk, en voor heel Juda, over de woorden van dit boek dat gevonden is; want de grimmigheid van de HEERE is groot, die tegen ons ontstoken is, omdat onze vaderen niet geluisterd hebben naar de woorden van dit boek, om te doen naar alles wat voor ons geschreven is.", "Jer 2:32": "Vergeet ook een jonkvrouw haar versiersel, of een bruid haar bindselen? Toch heeft Mijn volk Mij vergeten, dagen zonder getal.", "Ezech 31:3": "Zie, Assur was een ceder op de Libanon, mooi van takken, met schaduwrijk loof, en hoog van stam, en zijn top reikte tot tussen de dichte takken.", "Luk 10:2": "Hij zei dan tegen hen: De oogst is wel groot, maar de arbeiders zijn weinige; bid daarom de Heere van de oogst, dat Hij arbeiders in Zijn oogst uitstuurt.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "2 Sam 12:9": "Waarom hebt u dan het woord van de HEERE veracht, door te doen wat kwaad is in Zijn ogen? U hebt Uria, de Hethiet, met het zwaard verslagen, en zijn vrouw hebt u tot uw vrouw genomen; en hem hebt u met het zwaard van de kinderen van Ammon gedood.", "Jes 17:10": "Want u hebt de God van uw heil vergeten, en niet gedacht aan de Rotssteen van uw sterkte; daarom zult u wel liefelijke planten planten, en die met uitheemse ranken bezetten;", "Mal 2:8": "Maar u bent van de weg afgeweken, u hebt er velen doen struikelen in de wet, u hebt het verbond met Levi verdorven, zegt de HEERE van de heerscharen.", "Ps 26:10": "In wier handen schandelijk bedrijf is, en van wie de rechterhand vol geschenken is.", "Jes 9:13-15": "Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag. (De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.) Want de leiders van dit volk zijn verleiders, en die door hen geleid worden, worden ingeslokt.", "Zef 1:18": "Ook hun zilver, ook hun goud zal hen niet kunnen redden op de dag van de verbolgenheid van de HEERE; maar door het vuur van het ijver van Hem zal dit hele land verteerd worden; want Hij zal een voleinding maken, zeker, een haastige, met alle inwoners van dit land.", "Ezech 22:11": "Daarbij heeft de een gruwel gedaan met de vrouw van zijn naaste, en een ander heeft de vrouw van zijn zoon met schandelijkheid verontreinigd; nog een ander heeft in u zijn zuster, de dochter van zijn vader, verkracht.", "Jer 48:1-47": "Tegen Moab zegt de HEERE van de heerscharen, de God van Israël, zo: Wee over Nebo, want zij is verwoest; Kirjathaïm is beschaamd, zij is ingenomen; de stad van het hoge vertrek is beschaamd en verschrikt. Moabs roem van Hesbon is er niet meer; zij hebben kwaad tegen haar bedacht en gezegd: Komt, laten we haar uitroeien, zodat zij geen volk meer is; ook u, o Madmen! zult neergehouwen worden, het zwaard zal achter u aan gaan. Er is een stem van geroep uit Horonaïm; verwoesting en een grote breuk!", "Jes 30:9": "Want het is een opstandig volk; het zijn leugenachtige kinderen; kinderen die de wet van de HEERE niet willen horen.", "Jer 11:9-23": "Verder zei de HEERE tegen mij: Er is een samenzwering gevonden onder de mannen van Juda, en onder de inwoners van Jeruzalem. Zij zijn teruggekeerd tot de ongerechtigheden van hun voorvaders, die Mijn woorden geweigerd hebben te horen; en zij zijn andere goden nagelopen, om die te dienen; het huis van Israël en het huis van Juda hebben Mijn verbond gebroken, dat Ik met hun vaderen gemaakt heb. Daarom zegt de HEERE zo: Zie, Ik zal een kwaad over hen brengen, waaruit zij niet zullen kunnen ontkomen; als zij dan tot Mij zullen roepen, zal Ik naar hen niet horen.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "Num 21:24": "Maar Israël sloeg hem met de scherpte van het zwaard, en nam zijn land in erfelijk bezit, van de Arnon af tot de Jabbok toe, tot aan de kinderen van Ammon; want het gebied van de kinderen van Ammon was sterk.", "Hand 20:30": "En uit uzelf zullen mannen opstaan, die verkeerde dingen spreken, om de discipelen achter zich aan te trekken.", "Luk 8:14": "En wat tussen de dorens valt, dat zijn zij die gehoord hebben, en gaandeweg verstikt worden door de zorgen en rijkdom en genietingen van het leven, en geen rijpe vrucht voortbrengen.", "Hab 1:6-11": "Want zie, Ik verwek de Chaldeeën, een bitter en snel volk, dat door de breedten van de aarde trekt, om woningen die niet van hem zijn, in erfelijk bezit te nemen. Schrikkelijk en vreselijk is het; zijn recht en zijn hoogheid gaan van hemzelf uit. Want zijn paarden zijn lichter dan de luipaarden, en zij zijn scherper dan de avondwolven, en zijn ruiters verspreiden zich; ja, zijn ruiters zullen van verre komen, zij zullen vliegen als een arend, die zich haast om te eten.", "Mal 1:6-10": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam? U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk. Want als u iets blinds aanbrengt om te offeren, is dat bij u niet kwaad; en als u iets kreupels of iets kranks aanbrengt, is dat niet kwaad! Breng dat toch aan uw vorst; zal hij welgevallen aan u hebben? of zal hij u gunstig ontvangen? zegt de HEERE van de heerscharen.", "Spr 29:4": "Een koning houdt het land staande door recht; maar wie tot geschenken geneigd is, verstoort het.", "Joh 16:1": "Deze dingen heb Ik tot u gesproken, opdat u niet geërgerd wordt.", "Spr 4:14": "Kom niet op het pad van de goddelozen, en betreed niet de weg van de bozen.", "Jer 2:8": "De priesters zeiden niet: Waar is de HEERE? en die de wet hanteerden, kenden Mij niet; en de herders overtraden tegen Mij; en de profeten profeteerden door Baäl, en wandelden naar dingen die geen nut doen.", "Matt 23:13": "Maar wee u, Schriftgeleerden en Farizeeën, huichelaars! Want u sluit het Koninkrijk der hemelen voor de mensen, want u gaat er zelf niet in, en degenen die er in willen gaan, laat u niet ingaan.", "Jes 5:12-30": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst. Daarom zal het graf zichzelf wijd opensperren, en zijn mond zonder maat opendoen; zodat haar heerlijkheid, en haar menigte, met haar gedruis, en wie daarin van vreugde opspringt, erin neerdaalt.", "Spr 12:26": "De rechtvaardige is voortreffelijker dan zijn naaste; maar de weg van de goddelozen doet hen dwalen.", "Openb 12:17": "En de draak werd toornig op de vrouw, en ging heen om oorlog te voeren tegen de overigen van haar nageslacht, die de geboden van God bewaren, en de getuigenis van Jezus Christus hebben.", "Hos 14:1": "Samaria zal woest worden, want zij is opstandig geweest tegen haar God; zij zullen door het zwaard vallen, hun kinderen zullen verpletterd, en hun zwangere vrouwen zullen opengesneden worden.", "1 Kor 1:23": "Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "Num 14:31-35": "En uw kinderen, van wie u zei: Zij zullen tot roof worden! die zal Ik daarin brengen, en zij zullen dat land kennen dat u smadelijk verworpen hebt. Maar wat u betreft, uw dode lichamen zullen in deze woestijn vallen! En uw kinderen zullen als herders rondtrekken in deze woestijn, veertig jaar, en zullen uw hoererijen dragen, totdat uw dode lichamen verteerd zijn in deze woestijn.", "Spr 16:29": "Een man van geweld verlokt zijn naaste, en hij leidt hem op een weg die niet goed is.", "Jer 34:2": "Zo zegt de HEERE, de God van Israël: Ga heen en spreek tot Zedekia, de koning van Juda, en zeg tegen hem: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "Amos 1:13": "Zo zegt de HEERE: Om drie overtredingen van de kinderen van Ammon, en om vier zal Ik dat niet afwenden; omdat zij de zwangere vrouwen van Gilead hebben opengesneden, om hun grondgebied te vergroten.", "Hand 20:29": "Want dit weet ik, dat na mijn vertrek zware wolven onder u zullen komen, die de kudde niet sparen.", "Neh 9:29": "En U hebt tegen hen getuigd, om hen te doen terugkeren tot Uw wet; maar zij hebben trots gehandeld, en niet geluisterd naar Uw geboden, en tegen Uw rechten gezondigd, waardoor een mens, als hij ze doet, zal leven; en zij hebben hun schouder teruggetrokken, en hun nek verhard, en niet geluisterd.", "1 Kor 11:19": "want er moeten ook afwijkende meningen onder u zijn, opdat degenen die oprecht zijn, openbaar worden onder u.", "2 Kon 23:7": "Daartoe brak hij de huizen van de schandjongens af, die bij het huis van de HEERE waren, waar de vrouwen huisjes voor het beeld van het bos weefden.", "Openb 2:1": "Schrijf aan de engel van de gemeente van Efeze: Dit zegt Hij, Die de zeven sterren in Zijn rechterhand houdt, Die in het midden van de zeven gouden kandelaren wandelt:", "2 Kron 27:2": "En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader Uzzia gedaan had, behalve dat hij de tempel van de HEERE niet binnenging; en het volk verdierf zich nog.", "Joh 3:20": "Want ieder die kwaad doet, haat het licht en komt niet tot het licht, opdat zijn werken niet bestraft worden.", "Jer 23:29": "Is Mijn woord niet zo, als een vuur? spreekt de HEERE, en als een hamer, die een steenrots verbrijzelt?", "1 Kor 7:5": "Onttrek u niet aan elkaar, tenzij met wederzijdse instemming voor een tijd, opdat u zich aan vasten en bidden kunt wijden; en kom weer bijeen, opdat de satan u niet verzoekt, omdat u zich niet kunt onthouden.", "Richt 11:21-23": "En de HEERE, de God van Israël, gaf Sihon met al zijn volk in de hand van Israël, zodat zij hen versloegen; zo nam Israël het hele land van de Amorieten, die in dat land woonden, in erfelijk bezit. En zij namen het hele gebied van de Amorieten in erfelijk bezit, van de Arnon af tot aan de Jabbok, en van de woestijn tot aan de Jordaan. Zo heeft nu de HEERE, de God van Israël, de Amorieten voor het aangezicht van Zijn volk Israël uit hun bezit verdreven; en zou u dan hun erfgenaam zijn?", "2 Kron 32:30": "Deze Jehizkia dichtte ook de bovenste waterloop van Gihon, en leidde die recht naar beneden naar het westen van de stad van David; want Jehizkia had voorspoed in al zijn werk.", "Hos 5:1": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor.", "Neh 13:29": "Denk aan hen, mijn God, omdat zij het priesterdom hebben verontreinigd, ja, het verbond van het priesterdom en van de Levieten.", "Ezech 13:19": "En zult u Mij ontheiligen bij Mijn volk, voor handvollen gerst en voor stukken brood, om zielen te doden die niet zouden sterven, en om zielen in leven te houden die niet zouden leven, door uw liegen tegen Mijn volk, dat de leugen hoort?", "Amos 7:12": "Daarna zei Amazia tegen Amos: Gij ziener, ga weg, vlucht naar het land van Juda, en eet daar brood, en profeteer daar.", "Mark 9:33-35": "En Hij kwam in Kapernaüm, en toen Hij in huis was, vroeg Hij hun: Waarover had u het onderweg met elkaar? Maar zij zwegen; want zij hadden onderweg met elkaar getwist over wie de belangrijkste zou zijn. En Hij ging zitten, riep de twaalf, en zei tegen hen: Als iemand de eerste wil zijn, die zal de laatste van allen zijn, en de dienaar van allen.", "Ezech 17:22": "Zo zegt de Heere HEERE: Ik zal ook van de opperste tak van de hoge ceder nemen, dat Ik zal planten; van de top van zijn jonge takjes zal Ik een teer takje afplukken, dat Ik op een hoge en verheven berg planten zal;", "Joz 24:8-12": "Toen bracht Ik u in het land van de Amorieten, die aan de overkant van de Jordaan woonden, die tegen u streden; maar Ik gaf hen in uw hand, en u nam hun land in bezit, en Ik vernietigde hen voor uw aangezicht. Ook maakte Balak zich op, de zoon van Zippor, de koning van de Moabieten, en hij streed tegen Israël; en hij zond heen, en liet Bileam, de zoon van Beor, roepen, opdat hij u vervloeken zou. Maar Ik wilde niet naar Bileam luisteren; daarom zegende hij u steeds opnieuw, en Ik verloste u uit zijn hand.", "Jes 31:1-3": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken. Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken. Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Spr 2:16": "Om u te redden van de vreemde vrouw, van de onbekende, die met haar woorden vleit;", "Spr 14:27": "De vreze van de HEERE is een bron van leven, om af te wijken van de strikken van de dood.", "Jer 23:14-16": "Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra. Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van de profeten van Jeruzalem is de huichelarij uitgegaan in het hele land. Zo zegt de HEERE van de heerscharen: Hoor niet naar de woorden van de profeten, die u profeteren; zij maken u ijdel; zij spreken het visioen van hun eigen hart, niet uit de mond van de HEERE.", "Matt 15:14": "Laat hen gaan; zij zijn blinde leiders van blinden. Als nu de blinde de blinde leidt, zullen zij beiden in de gracht vallen.", "Jes 5:22": "Wee hun die helden zijn om wijn te drinken, en die dappere mannen zijn om sterke drank te mengen!", "Tit 1:3": "Namelijk Zijn Woord, door de prediking, die mij toevertrouwd is, naar het bevel van God, onze Zaligmaker;", "Spr 15:27": "Wie hebzucht najaagt, brengt zijn huis in beroering; maar wie geschenken haat, zal leven.", "Jer 9:14": "Maar hebben gewandeld naar het goeddunken van hun hart, en naar de Baäls, wat hun vaders hun geleerd hadden.", "Jer 32:21": "En U hebt Uw volk Israël uit het land Egypte uitgeleid, door tekenen en door wonderen, en door een sterke hand, en door een uitgestrekte arm, en door grote verschrikking.", "Jes 43:28": "Daarom zal Ik de leiders van het heiligdom ontheiligen, en Jakob ten ban overgeven, en Israël tot beschimpingen.", "Jer 2:24": "Zij is een woudezelin, gewend aan de woestijn, naar de lust van haar ziel schept zij de wind; wie zou haar ontmoeting kunnen afkeren? Allen die haar zoeken, zullen niet moe worden, in haar maand zullen zij haar vinden.", "Ex 22:27": "want dat is zijn enige bedekking, het is zijn kleding voor zijn huid; waarin zou hij anders slapen? Het zal dan gebeuren, wanneer hij tot Mij roept, dat Ik hem zal horen; want Ik ben genadig!", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Zach 11:16": "Want zie, Ik zal een herder verwekken in dit land; wat gereed is om afgesneden te worden, zal hij niet bezoeken; het jonge zal hij niet zoeken, en het verbrokene zal hij niet helen, en het stilstaande zal hij niet dragen; maar het vlees van het vette zal hij eten, en hun klauwen zal hij verscheuren.", "Openb 20:9": "En zij kwamen op over de breedte van de aarde, en omringden de legerplaats van de heiligen, en de geliefde stad; en er kwam vuur neer van God uit de hemel, en heeft hen verslonden.", "Jer 6:17": "Ik heb ook wachters over u gesteld, en gezegd: Luistert naar het geluid van de bazuin; maar zij zeggen: Wij zullen niet luisteren.", "1 Kor 10:7": "En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Hos 4:8-13": "Zij eten de zonde van Mijn volk, en verlangen, ieder met zijn ziel, naar hun ongerechtigheid. Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden. En zij zullen eten, maar niet verzadigd worden, zullen hoereren, maar niet toenemen in aantal; want zij hebben nagelaten de Heere in acht te nemen.", "Jer 18:15-17": "Toch heeft Mijn volk Mij vergeten, zij branden reukwerk voor de ijdelheid; want zij hebben hen doen struikelen op hun wegen, op de oude paden, om te wandelen in stegen van een weg die niet opgehoogd is; Om hun land te maken tot een verschrikking, tot eeuwige aanfluitingen; ieder die daar voorbijgaat, zal ontzet zijn, en met zijn hoofd schudden. Als een oostenwind zal Ik hen verstrooien voor het aangezicht van de vijand; Ik zal hun de nek en niet het aangezicht laten zien, op de dag van hun verderf.", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Jak 4:7": "Onderwerp u dan aan God; weerstaat de duivel, en hij zal van u wegvluchten.", "Spr 28:21": "Personen aanzien is niet goed; want een man zal om een stuk brood overtreden.", "Ezech 22:8": "Mijn heilige dingen hebt u veracht, en Mijn sabbatten hebt u ontheiligd.", "Ezech 11:7-12": "Daarom, zo zegt de Heere HEERE: Uw gedoden, die u in het midden daarvan neergelegd hebt, die zijn het vlees, en deze stad is de pot; maar u zal Ik uit het midden daarvan doen weggaan. U hebt het zwaard gevreesd; en het zwaard zal Ik over u brengen, spreekt de Heere HEERE. Ook zal Ik u uit het midden daarvan doen weggaan, en Ik zal u overgeven in de hand van vreemden; en Ik zal recht onder u doen.", "2 Kon 23:26": "Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.", "Rom 1:24": "Daarom heeft God hen ook overgegeven in de begeerten van hun harten tot onreinheid, om hun lichamen onder elkaar te onteren;", "Jes 5:3": "Nu dan, u, inwoners van Jeruzalem, en u, mannen van Juda, oordeel toch tussen Mij en tussen Mijn wijngaard.", "Neh 5:4": "Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.", "Jer 23:11": "Want zowel profeten als priesters zijn huichelaars; zelfs in Mijn huis vind Ik hun boosheid, spreekt de HEERE.", "Jes 28:8": "Want alle tafels zijn vol uitspuwsel en drek, zodat er geen schone plaats is.", "Ezech 22:12": "Zij hebben geschenken in u genomen om bloed te vergieten; woeker en overwinst hebt u genomen, en u hebt door verdrukking gierigheid gepleegd tegenover uw naaste, en Mij vergeten, spreekt de Heere HEERE.", "Richt 13:4-7": "Wacht u toch nu, en drink geen wijn of sterke drank, en eet niets van het onreine. Want zie, u zult zwanger worden en een zoon baren, op wiens hoofd geen scheermes zal komen; want dat jongetje zal een Nazireeër van God zijn, vanaf de moederschoot; en hij zal beginnen Israël te verlossen uit de hand van de Filistijnen. Toen kwam deze vrouw binnen en sprak tegen haar man en zei: Er kwam een Man van God naar mij toe, Wiens gezicht was als het gezicht van een Engel van God, zeer ontzagwekkend; en ik heb Hem niet gevraagd waar Hij vandaan was, en Zijn naam heeft Hij mij niet bekendgemaakt.", "Nahum 2:6": "De poorten van de rivieren zullen geopend worden, en het paleis zal wegsmelten.", "2 Kon 21:12-15": "Daarom, zo zegt de HEERE, de God van Israël: Zie, Ik ga een kwaad over Jeruzalem en Juda brengen, zodat ieder die het hoort, beide zijn oren zullen tuiten. En Ik zal over Jeruzalem het meetsnoer van Samaria trekken, alsook het paslood van het huis van Achab; en Ik zal Jeruzalem uitwissen, zoals men een schotel uitwist; men wist hem uit, en men keert hem om op zijn holle kant. En Ik zal het overblijfsel van Mijn erfdeel verlaten, en zal het in de hand van hun vijanden geven; en zij zullen tot een roof en plundering worden voor al hun vijanden.", "Jes 10:2": "om de armen van het recht af te wenden, en om het recht van de ellendigen van Mijn volk te roven, opdat de weduwen hun buit worden, en opdat zij de wezen mogen plunderen!", "Micha 6:5": "Mijn volk, gedenk toch wat Balak, de koning van Moab, beraamde, en wat Bileam, de zoon van Beor, hem antwoordde; en wat er gebeurd is van Sittim af tot Gilgal toe, opdat u de gerechtigheden van de HEERE kent.", "1 Kon 20:35": "Toen zei een man uit de zonen van de profeten tegen zijn naaste, door het woord van de HEERE: Sla mij toch. En de man weigerde hem te slaan.", "Amos 1:6": "Zo zegt de HEERE: Om drie overtredingen van Gaza, en om vier zal Ik dat niet afwenden; omdat zij Mijn volk als gevangenen hebben weggevoerd, met een volledige wegvoering, om aan Edom over te leveren.", "Kol 2:19": "En hij houdt het Hoofd niet vast, van waaruit het hele lichaam, door de gewrichten en banden gevoed en samengevoegd, groeit met een goddelijke groei.", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Jes 28:14-22": "Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is! Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen. Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Amos 1:14": "Daarom zal Ik een vuur aansteken in de muur van Rabba, dat zal haar paleizen verteren; met gejuich op de dag van de strijd, met een storm op de dag van de wervelwind.", "1 Kor 10:8": "En laten wij niet hoereren, zoals sommigen van hen gehoereerd hebben, en er vielen op één dag drieëntwintigduizend.", "Joh 10:1": "Voorwaar, voorwaar zeg Ik u: die niet door de deur ingaat in de schaapskooi, maar van elders inklimt, die is een dief en rover.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Job 24:3": "De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand.", "Num 13:28": "Behalve dat het een sterk volk is, dat in dat land woont, en de steden zijn vast en zeer groot; en ook hebben wij daar kinderen van Enak gezien.", "Deut 24:12-17": "Maar als hij een arme man is, zult u met zijn pand niet neerliggen. U zult hem dat pand zeker teruggeven, als de zon ondergaat, zodat hij in zijn kleed neerligt, en u zegent; en het zal u gerechtigheid zijn voor het aangezicht van de HEERE, uw God. U zult de arme en behoeftige dagloner niet verdrukken, die uit uw broeders is, of uit uw vreemdelingen die in uw land en in uw poorten zijn.", "2 Kon 20:17": "Zie, de dagen komen dat alles wat in uw huis is, en wat uw vaderen tot op deze dag opgeslagen hebben, naar Babel weggevoerd zal worden; er zal niets overblijven, zegt de HEERE.", "Jer 11:9-17": "Verder zei de HEERE tegen mij: Er is een samenzwering gevonden onder de mannen van Juda, en onder de inwoners van Jeruzalem. Zij zijn teruggekeerd tot de ongerechtigheden van hun voorvaders, die Mijn woorden geweigerd hebben te horen; en zij zijn andere goden nagelopen, om die te dienen; het huis van Israël en het huis van Juda hebben Mijn verbond gebroken, dat Ik met hun vaderen gemaakt heb. Daarom zegt de HEERE zo: Zie, Ik zal een kwaad over hen brengen, waaruit zij niet zullen kunnen ontkomen; als zij dan tot Mij zullen roepen, zal Ik naar hen niet horen.", "Neh 5:1-13": "Maar het geroep van het volk en van hun vrouwen was groot, tegen hun broeders, de Joden. Want er waren er die zeiden: Onze zonen en onze dochters, wij zijn met velen; daarom hebben wij koren opgenomen, opdat wij eten en leven. Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen.", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Luk 22:24": "En er ontstond ook twist onder hen, wie van hen scheen de meeste te zijn.", "Ex 34:11": "Onderhoud u wat Ik u heden gebied! Zie, Ik zal voor uw aangezicht uitdrijven de Amorieten, en de Kanaänieten, en de Hethieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "Deut 1:21": "Zie, de HEERE, uw God, heeft dat land aan u gegeven; trek op, bezit het erfelijk, zoals de HEERE, de God van uw vaderen, tot u gesproken heeft; wees niet bang, en wees niet ontmoedigd.", "Deut 21:20": "En zij zullen tegen de oudsten van zijn stad zeggen: Deze zoon van ons is koppig en opstandig, hij wil niet naar ons luisteren; hij is een brasser en een dronkaard.", "Jer 25:8-38": "Daarom, zo zegt de HEERE van de heerscharen: Omdat u Mijn woorden niet hebt gehoord; Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden. En Ik zal van hen doen vergaan de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid, het geluid van de molens en het licht van de lamp.", "1 Kor 8:10": "Want als iemand u, die de kennis hebt, ziet aanzitten in de tempel van de afgod, zal het geweten van hem, die zwak is, dan niet gesterkt worden om te eten de dingen die aan de afgoden geofferd zijn?", "Matt 21:34": "Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen.", "Ezech 22:13-22": "Zie dan, Ik heb Mijn hand geslagen om uw gierigheid die u bedreven hebt, en om uw bloed dat in uw midden geweest is. Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen. En Ik zal u verstrooien onder de heidenvolken, en u verspreiden in de landen, en uw onreinheid uit u wegnemen.", "Neh 9:26": "Maar zij zijn opstandig geworden, en hebben tegen U gerebelleerd, en Uw wet achter hun rug geworpen, en Uw profeten gedood die tegen hen getuigden, om hen te doen terugkeren tot U; zo hebben zij grote lasteringen gedaan.", "Joël 3:3": "En zij hebben het lot geworpen over Mijn volk, en een jongetje gegeven voor een hoer, en een meisje verkocht voor wijn, om die te drinken.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Zef 1:6": "En hen die terugkeren van achter de HEERE; en die de HEERE niet zoeken, en niet naar Hem vragen.", "Spr 2:10-12": "Als de wijsheid in uw hart gekomen zal zijn, en de wetenschap voor uw ziel liefelijk zal zijn; Zo zal de bedachtzaamheid over u de wacht houden, de verstandigheid zal u behoeden; Om u te redden van de kwade weg, van de man die verkeerdheden spreekt;", "Jer 5:1-31": "Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn. En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals. HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen
