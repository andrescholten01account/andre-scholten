<style>

  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }

  .vers:hover .kopieer { opacity: .75; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  @media (max-width: 640px) { .omslag { padding: .6rem .7rem 3rem; } header.site h1 { font-size: 1.5rem; } }

eiligen.","8":"En zij leggen zich neer bij elk altaar op de verpande klederen, en drinken de wijn van de beboeten *in* het huis van hun goden.","9":"Ik heb daarentegen de Amoriet voor hun aangezicht verdelgd, wiens hoogte was als de hoogte van de ceders, en hij was sterk als de eiken; maar Ik heb zijn vrucht van boven, en zijn wortels van beneden verdelgd.","10":"Ook heb Ik u uit Egypteland opgevoerd; en Ik heb u veertig jaren in de woestijn geleid, opdat u het land van de Amoriet erfelijk bezat.","11":"En Ik heb *sommigen* uit uw zonen tot profeten verwekt, en uit uw jongelingen tot nazireeërs; is dit niet zo, kinderen van Israël? spreekt de HEERE.","12":"Maar u hebt aan de nazireeërs wijn te drinken gegeven, en u hebt de profeten geboden en gezegd: U zult niet profeteren.","13":"Zie, Ik zal uw plaatsen drukken, zoals een wagen drukt, die vol garven is.","14":"Zodat de snelle niet zal ontvlieden, en de sterke zijn kracht niet zal versterken, en een held zijn ziel niet zal bevrijden.","15":"En die de boog hanteert, zal niet bestaan, en die licht is op zijn voeten, zal zich niet bevrijden; ook zal, die te paard rijdt, zijn ziel niet bevrijden.","16":"En de kloekhartigste onder de helden zal op die dag naakt heenvlieden, spreekt de HEERE."},"SV":{"1":"Alzo zegt de HEERE: Om drie overtredingen van Moab, en om vier zal Ik dat niet afwenden; omdat hij de beenderen des konings van Edom tot kalk verbrand heeft.","2":"Daarom zal Ik een vuur in Moab zenden, dat zal de paleizen van Kerioth verteren; en Moab zal sterven met groot gedruis, met gejuich, met geluid der bazuin.","3":"En Ik zal den rechter uit het midden van haar uitroeien; en al haar vorsten zal Ik met hem doden, zegt de HEERE.","4":"Alzo zegt de HEERE: Om drie overtredingen van Juda, en om vier zal Ik dat niet afwenden; omdat zij de wet des HEEREN verworpen, en Zijn inzettingen niet bewaard hebben; en hun leugenen hen verleid hebben, die hun vaders hebben nagewandeld.","5":"Daarom zal Ik een vuur in Juda zenden, dat zal Jeruzalems paleizen verteren.","6":"Alzo zegt de HEERE: Om drie overtredingen van Israël, en om vier zal Ik dat niet afwenden; omdat zij den rechtvaardige voor geld verkopen, en den nooddruftige om een paar schoenen.","7":"Die er naar hijgen, dat het stof der aarde op het hoofd der armen zij, en den weg der zachtmoedigen verkeren; en de man en zijn vader gaan tot een jonge dochter om Mijn heiligen Naam te ontheiligen.","8":"En zij leggen zich neder bij elk altaar op de verpande klederen, en drinken den wijn der geboeten *in* het huis van hun goden.","9":"Ik daarentegen heb den Amoriet voor hunlieder aangezicht verdelgd, wiens hoogte was als de hoogte der cederen, en hij was sterk als de eiken; maar Ik heb zijn vrucht van boven, en zijn wortelen van onderen verdelgd.","10":"Ook heb Ik ulieden uit Egypteland opgevoerd; en Ik heb u veertig jaren in de woestijn geleid, opdat gij het land van den Amoriet erfelijk bezat.","11":"En Ik heb *sommigen* uit uw zonen tot profeten verwekt, en uit uw jongelingen tot Nazireen; is dit niet alzo, gij kinderen Israëls? spreekt de HEERE.","12":"Maar gijlieden hebt aan de Nazireen wijn te drinken gegeven, en gij hebt den profeten geboden, zeggende: Gij zult niet profeteren.","13":"Ziet, Ik zal uw plaatsen drukken, gelijk als een wagen drukt, die vol garven is.","14":"Zodat de snelle niet zal ontvlieden, en de sterke zijn kracht niet verkloeken, en een held zal zijn ziel niet bevrijden.","15":"En die den boog handelt, zal niet bestaan, en die licht is op zijn voeten, zal zich niet bevrijden; ook zal, die te paard rijdt, zijn ziel niet bevrijden.","16":"En de kloekhartigste onder de helden zal te dien dage naakt heenvlieden, spreekt de HEERE."},"KJV":{"1":"Thus saith the LORD; For three transgressions of Moab, and for four, I will not turn away *the punishment* thereof; because he burned the bones of the king of Edom into lime:","2":"But I will send a fire upon Moab, and it shall devour the palaces of Kerioth: and Moab shall die lheden."}],"6":[{"catchword":"Israël,","tekst":"Der tien stammen."},{"catchword":"rechtvaardige","tekst":"Den vromen, onschuldigen, die een rechtvaardige zaak heeft, in het gericht verdrukken, en den arme, die niets heeft te geven, maar zelf behoeftig is, om een kleine gift der rijken, verdoemen en in de macht van zijn wederpartijder overleveren; zie Amo 8:6 ."}],"7":[{"catchword":"stof der aarde","tekst":"Dat is, die niet rusten voordat zij den arme, die toch bereids uitgeput is, als in het stof der aarde onder hunne voeten vertreden en in de uiterste nietigheid als langs de aarde slepen. Verg. de aantekening bij 1Ki 16:2 , en Job 16:15 , enz.; idem Amo 5:11 . Of, dat de armen, als schuldigen en misdadigers, met aarde op het hoofd, voor het gericht mogen staan treuren, den rijken [die geschenken gaven] ten gevalle."},{"catchword":"weg","tekst":"Dat is, het voornemen en doen desgenen, die gaarne in stilheid God zou gehoorzamen, ten ergste duiden, verdraaien, hem in alle manieren beletten, lastig vallen en kwellen; idem heeft hij een goede zaak voor in het gericht, die buigen en verderven zij, wendende zijn recht van hem. Sommigen nemen het alzo, dat zij met hun geweld en stoutheid zulk een schrik onder de lieden maakten, dat de vromen voor hen uit den weg moesten wijken, als niet durvende onder hunne ogen komen."},{"catchword":"zachtmoedigen","tekst":"Zie Psa 10:17 ."},{"catchword":"verkeren;","tekst":"Of, afwenden, buigen."},{"catchword":"man en zijn vader","tekst":"De zoon en de vader."},{"catchword":"Mijn heiligen Naam","tekst":"Hebr. naam mijner heiligheid; dat is, mijn heiligen naam, naar welken zij genoemd zijn."},{"catchword":"ontheiligen","tekst":"Door onbeschaamde onkuischheid te onteren en verachtelijk te maken."}],"8":[{"catchword":"leggen zich neder","tekst":"Hebr. buigen zich; dat is, zij zijn zo onbeschaamd, dat zij alle boosheid aan den nooddruftige gepleegd hebbende, dan nog in de tempels hunner afgoden durven verschijnen, om aldaar met hun onrechtvaardig gewin te pronken, en daarvan op hun afgodische feestdagen te banketteren, verzwarende hun geweld door afgoderij, en de afgoderij door hun geweld."},{"catchword":"verpande klederen,","tekst":"Die aan hen verzet zijn, die zij te pand hebben genomen. Zie Exo 22:26 ."},{"catchword":"geboeten","tekst":"Dat is, dien zij kopen voor de boeten dergenen, die zij onschuldig hebben veroordeeld."}],"9":[{"catchword":"Amoriet","tekst":"Dat is, Kanaän ietische heidense volken, alzo somtijds genoemd naar de voornaamste natie, namelijk Amorieten."},{"catchword":"wiens hoogte was","tekst":"Verbloemde manieren van spreken; zie Num 13:28 , Num 13:32-33 ."},{"catchword":"vrucht","tekst":"Manier van spreken, betekenende de uiterste verwoesting. Zie Hos 9:16 ."}],"11":[{"catchword":"Nazireën;","tekst":"Zie Num 6:2 ."},{"catchword":"is dit niet alzo,","tekst":"Alsof God zeide: Immers is dit waar, gij kunt het zelf niet ontkennen."}],"12":[{"catchword":"wijn te drinken gegeven,","tekst":"Tegen Gods uitgedrukt bevel, Num 6:3 , om hem te tergen en met alle godzaligheid te spotten."},{"catchword":"den profeten geboden","tekst":"Hebr. aan, over, of tegen de profeten geboden; dat is, hun verboden. Alzo wordt het woord gebeiden somtijds gebruikt; zie Gen 2:16 ; Lev 4:2 ; Deu 2:37 , en Deu 4:23 , met de aantekening."},{"catchword":"Gij zult niet profeteren","tekst":"Verg. Isa 30:10 ; Jer 11:21 ; Amo 7:13 ."}],"13":[{"catchword":"uw plaatsen drukken,","tekst":"Dat is, het land met de inwoners, met mijn straffende hand, door den vijand, zo persen en benauwen, gelijk een volgeladen wagen met koren drukt en perst datgene, of dengene dien hij overrijdt. Verg. Amo 6:14 ."}],"14":[{"catchword":"Zodat de snelle","tekst":"Hebr. en de toevlucht zal van den snellen, of lichten, [te weten, op de voeten, gelijk in het volgende vers] vergaan, of verloren zijn."},{"catchword":"verkloeken,","tekst":"Hij zal zijne kracht niet kunnen gebruiken, of zo hij ze aanlegt, het zal tevergeefs zijn."},{"catchword":"zi ekst":"Thus saith the LORD; for three transgressions of Juda, and for four, will I not turn away that: because they have rejected the law of the LORD, and not kept his institutions, and their lies seduced them [understand their idols, idolatries, superstitions, and all their train of vanities] which their father walked after."}],"5":[{"catchword":null,"tekst":"Therefore will I send a fire into Juda, that shall devour the Palaces in Jerusalem."}],"6":[{"catchword":null,"tekst":"Thus saith the LORD; for three transgressions of Israel [ i.e the ten tribes ] and for four, will I not turn away that; because they fell the righteous for monie, and the needy for a pair of shoes; [i.e the honest, innocent man that hath a righteous cause, they do oppresse in judgement, and condemn the poor, that hath nothing to give, but is in want himself, for a small gift of the rich, and deliver them into the power of the advesarie. See below chap. 8. 6.]"}],"7":[{"catchword":null,"tekst":"Who pant after it, that the dust of the earth may be on the head of the poor, [ i.e who are never at rest, until they have put the poor, sufficiently exhausted before, as it were quite in the dust of the earth, and trodden them under their feet, dragging and haling them along, as upon the ground, into all conceivable extremity. Compare the annot. On 1 Kings 16. 2. and Job. 16. 15., etc. as also bel. Chap. 5. 11. Or so as that the poor must stand before the Judgement-seat with dust or earth upon their heads, as guilty ones and male factors doing penance, to please the rich which gave presents] and pervet, [ or turn about, bend] the way of the meek: [ See Psal. 10. on verse 17. i.e who make the worst construction and report of the intent and practice of him that endevours quietly to obey God, and do all they can, to hinder, dis quiet and disturb him. Again, if he have never so good a cause to plead in judgment they bow and wrest it to his damage and defeat him of his right some take it so as if by their power and insolence they kept up such a terrour among people that good people must turn out of the way before and remain at a great distance from them ] and the men [that is the son] and his father go to one young daughter to prophane [that is by most impudent uncleanness to dishonor and prostitute ]my holy name Heb the name of my holiness that is my holy name by which they are called.]"}],"8":[{"catchword":null,"tekst":"And they lay themselves down by every altar,[Heb they bow down themselves that is they are so shameless that is having practiced so much baseless and malice on the poor and needy they dare presently upon it appear in the temples of their idols to brave it there yet with their unrighteous purchase and feast thereof on their idolatrous festivals aggravating thus their violence by their idolatry and their idolatry by their violence ] upon the pawned garments [which they took in pawn and pledge of the poor see Exod 22 on verse 26 ]and drink the wine of the amerced or fined ones [that is which they bought with a fine or mulct of them whom they wrongfully condemned ]in the house of their Gods ."}],"9":[{"catchword":null,"tekst":"I on the contrary destroyed the Amorites before their face [meaning the Canaanites heathen nation called thus sometimes from the principallest among them the Amorites whose top was as the top of the Cedars and he was as strong as the oak [figurative phrases see Num 13:29,33,34]but I have destroyed his fruit from above and his root from beneath [expression implying the uttermost destruction see Hosea 9 on verse 16.]"}],"10":[{"catchword":null,"tekst":"Also I carried you forth out of the land of Egypt and I have led you forty years in the wilderness hereditarily to possess the land of the Amorites."}],"11":[{"catchword":null,"tekst":"And some of your sons I have raised to be prophets and of your youths for Nazarites [see Numbers 6 on verse 2] is it not thus ye children of Israel saith the LORD? [As if he said ye cannot deny this yourselves it is a truth without exception.]"}],"12":[{"catchword":null,"tekst":"But ye have given the Nazarites wine to drink [contrary to Gods express command Num 6:3 to provoke him and make a mock of all godliness ]and ye have charged the prophets [Heb commanded the or upon or against the prophets that is forbidden them as the word commanding is taken sometimes see Genesis 2 verse 16 Levit 4.2 Deut 2.38 and chapter 4.23 with the annotate ]saying ye shall not prophesy [compare Isaih 30.10 Jer 11:21 and below chapter 7.13.]"}],"13":[{"catchword":null,"tekst":"Behold I will press your places as a wagon presseth that is full of sheaves [that is I will so press and distress the land with its inhabitants through my punishing hand by the enemy as full laden wagon with corn doth press and crush that or him the wagon is made to pass over compare below chapter 6.14.]"}],"14":[{"catchword":null,"tekst":"So that the swift shall not escape [Heb and the refugee shall perish or be lost from the swift or light one to wit him that is light and nimble on his feet as in the next verse ]and the strong shall not improve his strength [that is he shall be able to make use of his strength or though he endeavor it it shall be in vain ]and a valiant man shall not free his soul [that is shall not be able to save his life see Genesis 19 on verse 17 and so in the next verse .]"}],"15":[{"catchword":null,"tekst":"And he that handleth the bow shall not subsist [and keep his standing throughhe where never so active and undanted an archer before] and he that is light on his feet shall not free himself nor shall he that rides on a horse back free his soul."}],"16":[{"catchword":null,"tekst":"And the stoutest among the valiant man [Heb the strong of his heart or he that is strong with heart compare Psa 76:6]shall flee naked away at that day [throwing away both armour and clothes to make the quicker escape ]saith the Lord ."}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
