r","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De Heere HEERE liet mij dit zien: zie, Hij vormde sprinkhanen, in het begin van het opkomen van het nagras; en zie, het was het nagras, na het maaien van de koning.","2":"En het gebeurde, toen zij het gewas van het land helemaal zouden hebben opgegeten, dat ik zei: Heere HEERE, vergeef toch; wie zou er van Jakob blijven staan, want hij is klein!","3":"*Toen* kreeg de HEERE berouw hierover; het zal niet gebeuren, zei de HEERE.","4":"*Verder* liet de Heere HEERE mij dit zien: zie, de Heere HEERE riep, dat Hij wilde twisten met vuur; en het verteerde een grote afgrond, ook verteerde het een stuk land.","5":"Toen zei ik: Heere HEERE, houd toch op; wie zou er van Jakob blijven staan, want hij is klein!","6":"*Toen* kreeg de HEERE berouw hierover. Ook dit zal niet gebeuren, zei de Heere HEERE.","7":"*Nog* liet Hij mij dit zien: zie, de Heere stond op een muur, die met een paslood gemaakt was, en een paslood was in Zijn hand.","8":"En de HEERE zei tegen mij: Wat ziet u, Amos? En ik zei: Een paslood. Toen zei de Heere: Zie, Ik zal het paslood plaatsen in het midden van Mijn volk Israël; Ik zal het voortaan niet meer voorbijgaan.","9":"Maar de hoogten van Izak zullen verwoest worden, en de eigendommen van Israël zullen verstoord worden; en Ik zal tegen het huis van Jerobeam opstaan met het zwaard.","10":"Toen stuurde Amazia, de priester te Beth-el, iemand naar Jerobeam, de koning van Israël, en zei: Amos heeft een samenzwering tegen u gesmeed, in het midden van het huis van Israël; het land kan al zijn woorden niet verdragen.","11":"Want zo zegt Amos: Jerobeam zal door het zwaard sterven, en Israël zal zeker uit zijn land gevankelijk worden weggevoerd.","12":"Daarna zei Amazia tegen Amos: Gij ziener, ga weg, vlucht naar het land van Juda, en eet daar brood, en profeteer daar.","13":"Maar in Beth-el zult u voortaan niet meer profeteren; want dat is het heiligdom van de koning, en dat is het huis van het koninkrijk.","14":"Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.","15":"Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.","16":"Nu dan, hoor het woord van de HEERE: U zegt: U zult niet profeteren tegen Israël, en niets uitspreken tegen het huis van Izak.","17":"Daarom zegt de HEERE zo: Uw vrouw zal in de stad hoereren, en uw zonen en uw dochters zullen door het zwaard vallen, en uw land zal met het meetsnoer verdeeld worden; en u zult in een onrein land sterven, en Israël zal zeker uit zijn land gevankelijk worden weggevoerd."},"SV":{"1":"De Heere HEERE deed mij aldus zien; en ziet, Hij formeerde sprinkhanen, in het begin des opkomens van het nagras; en ziet, het was het nagras, na des konings afmaaiingen.","2":"En het geschiedde, als zij het kruid des lands geheel zouden hebben afgegeten, dat ik zeide: Heere HEERE! vergeef toch; wie zou er *van* Jakob blijven staan; want hij is klein!","3":"*Toen* berouwde zulks den HEERE; het zal niet geschieden, zeide de HEERE.","4":"*Wijders* deed mij de Heere HEERE aldus zien; en ziet, de Heere HEERE riep uit, dat Hij wilde twisten met vuur; en het verteerde een groten afgrond, ook verteerde het een stuk lands.","5":"Toen zeide ik: Heere HEERE! houd toch op; wie zou er *van* Jakob blijven staan; want hij is klein!","6":"*Toen* berouwde zulks den HEERE. Ook dit zal niet geschieden, zeide de Heere HEERE.","7":"*Nog* deed Hij mij aldus zien; en ziet, de Heere stond op een muur, die naar het paslood *gemaakt was*, en een paslood was in Zijn hand.","8":"En de HEERE zeide tot mij: Wat ziet gij, Amos? En ik zeide: Een paslood. Toen zeide de Heere: Zie, Ik zal het paslood stellen in het midden van Mijn volk Israël; Ik zal het voortaan niet meer voorbijgaan.","9":"Maar Izaks hoogten zullen verwoest, en Israëls eigendommen verstoord worden; en Ik zal tegen Jerobeams huis opstaan met het zwaard.","10":"Toen zond Amazia, de priester te Beth-el, tot Jerobeam, den koning van Israël, zeggende: Amos heeft een verbintenis tegen u gemaakt, in het midden van het huis Israëls; het land zal al zijn woorden niet kunnen verdragen.","11":"Want alzo zegt Amos: Jerobeam zal door het zwaard sterven, en Israël zal voorzeker uit zijn land gevankelijk worden weggevoerd.","12":"Daarna zeide Amazia tot Amos: Gij ziener! ga weg, vlied in het land van Juda, en eet aldaar brood, en profeteer aldaar.","13":"Maar te Beth-el zult gij voortaan niet meer profeteren; want dat is des konings heiligdom, en dat is het huis des koninkrijks.","14":"Toen antwoordde Amos, en zeide tot Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en las wilde vijgen af.","15":"Maar de HEERE nam mij van achter de kudde; en de HEERE zeide tot mij: Ga henen, profeteer tot Mijn volk Israël.","16":"Nu dan, hoor des HEEREN woord: Gij zegt: Gij zult niet profeteren tegen Israël, noch druppen tegen het huis van Izak.","17":"Daarom zegt de HEERE alzo: Uw vrouw zal in de stad hoereren, en uw zonen en uw dochteren zullen door het zwaard vallen, en uw land zal door het snoer uitgedeeld worden; en gij zult in een onrein land sterven, en Israël zal voorzeker uit zijn land gevankelijk worden weggevoerd."},"KJV":{"1":"Thus hath the Lord GOD shewed unto me; and, behold, he formed grasshoppers in the beginning of the shooting up of the latter growth; and, lo, *it was* the latter growth after the king's mowings.","2":"And it came to pass, *that* when they had made an end of eating the grass of the land, then I said, O Lord GOD, forgive, I beseech thee: by whom shall Jacob arise? for he *is* small.","3":"The LORD repented for this: It shall not be, saith the LORD.","4":"Thus hath the Lord GOD shewed unto me: and, behold, the Lord GOD called to contend by fire, and it devoured the great deep, and did eat up a part.","5":"Then said I, O Lord GOD, cease, I beseech thee: by whom shall Jacob arise? for he *is* small.","6":"The LORD repented for this: This also shall not be, saith the Lord GOD.","7":"Thus he shewed me: and, behold, the Lord stood upon a wall *made* by a plumbline, with a plumbline in his hand.","8":"And the LORD said unto me, Amos, what seest thou? And I said, A plumbline. Then said the Lord, Behold, I will set a plumbline in the midst of my people Israel: I will not again pass by","9":"And the high places of Isaac shall be desolate, and the sanctuaries of Israel shall be laid waste; and I will rise against the house of Jeroboam with the sword.","10":"Then Amaziah the priest of Bethel sent to Jeroboam king of Israel, saying, Amos hath conspired against thee in the midst of the house of Israel: the land is not able to bear all his words.","11":"For thus Amos saith, Jeroboam shall die by the sword, and Israel shall surely be led away captive out of their own land.","12":"Also Amaziah said unto Amos, O thou seer, go, flee thee away into the land of Judah, and there eat bread, and prophesy","13":"But prophesy not again any more at Bethel: for it *is* the king's chapel, and it *is* the king's court.","14":"Then answered Amos, and said to Amaziah, I *was* no prophet, neither *was* I a prophet's son; but I *was* an herdman, and a gatherer of sycomore fruit:","15":"And the LORD took me as I followed the flock, and the LORD said unto me, Go, prophesy unto my people Israel.","16":"Now therefore hear thou the word of the LORD: Thou sayest, Prophesy not against Israel, and drop not *thy word* against the house of Isaac.","17":"Therefore thus saith the LORD; Thy wife shall be an harlot in the city, and thy sons and thy daughters shall fall by the sword, and thy land shall be divided by line; and thou shalt die in a polluted land: and Israel shall surely go into captivity forth of his land."}},"tsk":{"1":[{"kopje":"liet mij dit zien","refs":["Amos 7:4","Amos 7:7","Amos 8:1","Jer 1:11-16","Jer 24:1","Ezech 11:25","Zach 1:20"]},{"kopje":"Hij","refs":["Amos 4:9","Ex 10:12-16","Jes 33:4","Joël 1:4","Joël 2:25","Nahum 3:15-17"]}],"2":[{"kopje":"toen","refs":["Ex 10:15","Openb 9:4"]},{"kopje":"Heere HEERE","refs":["Amos 7:5","Ex 32:11","Ex 32:12","Ex 34:9","Num 14:17-19","Jer 14:7","Jer 14:20","Jer 14:21","Dan 9:19","Jak 5:15","Jak 5:16"]},{"kopje":"wie zou er van Jakob blijven staan","refs":["Jes 51:19","Ezech 9:8","Ezech 11:13"]},{"kopje":"want","refs":["Ps 12:2","Ps 44:25-27","Jes 37:4","Jer 42:2","Zach 4:10"]}],"4":[{"kopje":"liet zien","refs":["Amos 7:1","Amos 7:7","Openb 4:1"]},{"kopje":"riep","refs":["Amos 1:4","Amos 1:7","Amos 4:11","Amos 5:6","Ex 9:23","Ex 9:24","Lev 10:2","Num 16:35","Jes 27:4","Jes 66:15","Jes 66:16","Jer 4:4","Jer 21:12","Joël 2:30","Micha 1:4","Nahum 1:6","Hebr 1:7"]}],"5":[{"kopje":"houd toch op","refs":["Amos 7:2","Ps 85:5","Jes 10:25"]},{"kopje":"want","refs":["Amos 7:2","Amos 7:3","Jes 1:9","Jer 30:19"]}],"7":[{"kopje":"een muur","refs":["2 Sam 8:2","2 Kon 21:13","Jes 28:17","Jes 34:11","Klaagl 2:8","Ezech 40:3","Zach 2:1","Zach 2:2","Openb 11:1","Openb 21:15"]}],"8":[{"kopje":"Amos","refs":["Jer 1:11-13","Zach 5:2"]},{"kopje":"Ik zal het paslood plaatsen","refs":["Klaagl 2:8"]},{"kopje":" H3068\">LORD:</span> Thou <span class=\"wl wl-kjv\" data-code=\"H559\">sayest,</span> <span class=\"wl wl-kjv\" data-code=\"H5012\">Prophesy</span> not against <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5197\">drop</span> not thy word against the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Isaac.","17":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Thy <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> shall be an <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2505\">divided</span> by <span class=\"wl wl-kjv\" data-code=\"H2256\">line;</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">in</span> a <span class=\"wl wl-kjv\" data-code=\"H2931\">polluted</span> <span class=\"wl wl-kjv\" data-code=\"H127\">land:</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall <span class=\"wl wl-kjv\" data-code=\"H1540\">surely</span> go into <span class=\"wl wl-kjv\" data-code=\"H1540\">captivity</span> forth of his land."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zien;","tekst":"Dat is, openbaarde mij dit volgende gezicht. Zie Jer 24:1 ."},{"catchword":"Hij formeerde","tekst":"De Heere."},{"catchword":"sprinkhanen,","tekst":"betekenende een grote aanstaanden hongersnood, vermits het verderf der landvruchten door ongedierte, gelijk Joe 1:4 , enz. of, [gelijk sommigen] den overval der Assyriërs, die alles, als wilde sprinkhanen, zouden bederven, zo God het niet verhoedde."},{"catchword":"afmaaiingen","tekst":"Dat is, nadat de koning had laten maaien, misschien tot voeder voor zijne paarden, of omdat de eerste maaiing hem mag hebben toebehoord. Hebr. scheringen; maar het Hebr. woord wordt alzo van afgemaaid gras ook gebruikt; Psa 72:6 ."}],"2":[{"catchword":"zij het kruid des lands","tekst":"Hebr. hij, te weten, de sprinkhaan, dat is, de voorzeide sprinkhanen."},{"catchword":"geheel zouden hebben afgegeten,","tekst":"Hebr. geëindigd, of volbracht zou hebben af te eten. Anders: als zij het gans afgegeten hadden."},{"catchword":"vergeef toch;","tekst":"Te weten, de zonden van het volk, en houd op van deze straf, of ga zo niet voort te plagen."},{"catchword":"Jakob","tekst":"De Israëlieten, Jakobs nakomelingen."},{"catchword":"blijven staan;","tekst":"Dat is, overblijven, in het leven kunnen blijven, wanneer het land van vruchten gans zou beroofd zijn? Anders: hoedanig [dat is, in wat staat] zou Jakob [dan] staan? Wie zou hij dan wezen? Hoe zou hij er uitzein; of, hoe zou hij kunnen opstaan, weder rijzen? Zie vs.5."},{"catchword":"klein","tekst":"Of, gering; dat is, daar is, of zijn, weinig overig."}],"3":[{"catchword":"berouwde zulks den HEERE;","tekst":"Zie Gen 6:6 ."},{"catchword":"geschieden,","tekst":"Te weten, dat zij het alles afeten."}],"4":[{"catchword":"twisten","tekst":"Of, pleiten, rechten; en vervolgens straffen. Zie Hos 4:1 , met de aantekening."},{"catchword":"vuur;","tekst":"Van krijg en oorlog, gelijk in Amo 1:4 , Amo 1:7 , Amo 1:10 . Sommigen verstaan het naar de letter van een hemelsen brand, gelijk Sodom en Gomorra overkwam, of anderen gemenen brand, of grote droogte. Zie Joe 1:19 , met de aantekening."},{"catchword":"groten afgrond,","tekst":"Dat is, diepte van wateren; waarvan Syrië verwoest door Tiglath-Pilezer, 2Ki 16:9 , en door het stuk land een gedeelte van Israël, in Gilead, over de Jordaan. Zie 2Ki 15:29 ; 1Ch 5:26 ."}],"6":[{"catchword":"geschieden,","tekst":"Dat het ganse land op ditmaal zou verteerd worden door het vuur."}],"7":[{"catchword":"die naar het paslood gemaakt was,","tekst":"Hebr. een muur des pasloods; dat is, die naar het richtsnoer wel gemaakt was. Waardoor men [met sommigen] kan verstaan de republiek van Israël, die God door zijn heilige wetten en zijn genadigen zegen wel en heerlijk gesticht en gebouwd had; en door het paslood, dat God ni in zijne hand had, zijn streng en rechtvaardig oordeel, dat Hij na langdurige verdraagzaamheid en verschoning [waarvan in het voorgaande] over Israël wilde uitvoeren; omdat zij alles omgekeerd en geschonden hadden, gelijk in Amo 6:12 , enz. Verg. Amo 8:2 ."},{"catchword":"paslood was in Zijn hand","tekst":"Het Hebr. woord wordt alleenlijk hier in deze beide verzen gevonden."}],"8":[{"catchword":"paslood","tekst":"Van mijn rechtvaardig oordeel."},{"catchword":"het","tekst":"Mijn volk."},{"catchword":"voortaan","tekst":"Hebr. Ik zal niet meer voortgaan, of voortvaren voorbij, of over te gaan."},{"catchword":"voorbijgaan","tekst":"Dat is, ongestraft laten overzien, verschonen, gelijk Ik tot nog toe gedaan heb. Verg. de manier van spreken met Pro 19:11 ; Mic 7:18 , en zie de aantekening aldaar. Alzo in Amo 8:2 ."}],"9":[{"catchword":"Izaks hoogten","tekst":"Daar zij hunne voorvaders en het voorbeeld van hunne voorvaders Izak en Jakob, als welken aldaar in voortijden den waren God altaren opgericht en geofferd hadden. Zie Gen 26:25 , en Gen 35:7 ."},{"catchword":"heiligdommen verstoord worden;","tekst":"Afgodische tempels."},{"catchword":"Jeróbeams","tekst":"Die een zoon was van Joas, zie Amo 1:1 ."},{"catchword":"huis opstaan","tekst":"Zijn zoon Zacharia [die maar zes maanden regeerde] is van Sallum in het openbaar, in tegenwoordigheid van het volk verslagen, 2Ki 15:10 ."},{"catchword":"zwaard","tekst":"Het is aanmerkelijk dat de profeet hier tegen het oordeel Gods niet meer antwoordt, gelijk hij in de twee voorgaande gezichten zijne voorbede had gedaan en was verhoord."}],"10":[{"catchword":"Toen zond Amázia,","tekst":"Als de profeet deze gezichten het volk had voorgedragen."},{"catchword":"verbintenis tegen u gemaakt,","tekst":"Ennbehoort dienvolgens [wil hij zeggen] als een samenzweerder gestraft te worden; voorts ook als een opreormaker, omdat hij in het openbaar voor al het volk tegen u profeteert."},{"catchword":"verdragen","tekst":"Het volk [wil hij zeggen] zal tot oproer tegen u door hem verwekt worden. De staat van het land en het gezag des konings vereisen dan dat hierin voorzien worde. Hebr. vatten, houden."}],"11":[{"catchword":"Jeróbeam zal door het zwaard sterven,","tekst":"Amo had gesproken van Jerobeams huis, vs.3."},{"catchword":"voorzeker","tekst":"Hebr. gevankelijk weggevoerd wordende, gevankelijk worden weggevoerd."}],"12":[{"catchword":"ziener","tekst":"Zie 1Sa 9:9 ."},{"catchword":"vlied","tekst":"Hebr. vlied u, of voor u; het woordje u, of voor u, wordt gehouden als overtollig en dienende tot sieraad der spraak, anderzins moest met het hier nemen, voor u; dat is, tot uw best, om in geen lijden te komen. Verg. Gen 12:1 ; Jer 5:5 ; Mic 1:11 , met de aantekening."},{"catchword":"Juda,","tekst":"Waar Thekoa was gelegen, het vaderland van den profeet, zie Amo 1:1 ."},{"catchword":"eet aldaar brood,","tekst":"Dat is, geneer, onderhoud u aldaar. Zie Gen 3:19 ."}],"13":[{"catchword":"voortaan","tekst":"Hebr. niets toedoen, of voortvaren meer te profeteren."},{"catchword":"niet meer profeteren;","tekst":"Verg. Amo 2:12 ."},{"catchword":"heiligdom,","tekst":"Dat is, de plaats, die de koning voor zijn heiligdom houdt, daar hij zijn plechtigen godsdienst bij het gouden kalf verricht, waartegen men hier geen profeteren mag lijden. Sommigen verstaan hierdoor den koning Melech, of Molech, den groten afgod en koning van Israël; zie Amo 5:26 ."},{"catchword":"huis des koninkrijks","tekst":"Dit kan men verstaan van een koninklijk hof, dat de koning ongetwijfeld te Bethel mede gehad heeft, als hij daar woonde, om zijn afgoderij te plegen: of van de plaats waar het opperste recht en de koniklijke rijksraad geweest zijn; of men kan het alzo verstaan, dat gans Israël hier in den afgodischen tempel [huis voor tempel ] gewoon was te komen, enz.; zulks dat het, naar zijnen zin, voor Amos niet alleen niet veilig, maar ook zulke profetieën aldaar gans onlijdelijk waren."}],"14":[{"catchword":"ossenherder,","tekst":"Het Hebr. woord komt, naar sommiger gevoelen, van een ander, dat runderen, ossen, of groot vee betekent. Verg. Amo 1:1 . Anders: maar ik zocht en las af wilde vijgen; alzo het Hebr. woord eigenlijk zoeken betekent, en in het volgende vers staat dat hij achter het kleinvee of de schapen ging."},{"catchword":"las","tekst":"Het Hebr. woord wordt alleenlijk hier gevonden. Versta, òf voor zichzelven tot spijs, òf voor de beesten tot voedsel."},{"catchword":"wilde vijgen af","tekst":"Of, vijgmoerbeziën. Zulke bomen waren er bij menigte in Kanaän. Zie 1Ki 10:27 ; Isa 9:9 ."}],"15":[{"catchword":"kudde;","tekst":"Het Hebr. woord wordt eiegelijk van kleinvee gebruikt, maar is hier breder genomen."},{"catchword":"HEERE","tekst":"Dien ik meer moet gehoorzamen dan mensen. Verg. Act 4:19 . Hieruit leiden sommigen af dat Amos niet is gevlucht. De Joden menen dat de koning Jerobeam de aanklacht van Amazia niet heeft aangenomen, maar de profeet laten begaan."}],"16":[{"catchword":"druppen tegen het huis van Izak","tekst":"Zie Deu 32:2 ; Eze 21:2 , met de aantekening."}],"17":[{"catchword":"hoereren,","tekst":"Dat is, òf zij zal zachtmoedigen tot hoererij begeven, òf als ene hoer van den vijand misbruikt worden."},{"catchword":"snoer uitgedeeld worden;","tekst":"Te weten, voor anderen. Zie Deu 3:4 , en Psa 16:5 ."},{"catchword":"onrein land sterven,","tekst":"Het afgodisch Assyrië."},{"catchword":"voorzeker","tekst":"Gelijk in vs.11."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The Lord caused me to see thus [that is revealed this ensuing vision unto me see Jeremiah 24 on verse 1] and behold he [viz the Lord ]formed grass hoppers in the beginning of the coming forth of the after-grass [signifying a great famine approaching the destruction of the fruits of the land by vermin as joel 1.4 &c. or as some the invasion of the Assyrians ready to destroy and wast all like vermin if God prevented it not and behold it was the after grass after the king mowing [that is after the kings grass was cut down first Heb shearing but the Hebrew word is used thus also of mowed grass Psa 72:6.]"}],"2":[{"catchword":null,"tekst":"And it came to pass when they [Heb he viz the grass hopper that is aforesaid swarm of grass hoppers] should have wholly eaten up the Herbs of the Land [Heb should have ended or finished to cat up &c other when they had eaten it up ]that I said Lord LORD pardon I pray who should be left standing of Jacob ? [that is o the Israelites the posterity of Jacob there would be none remain or be left or be left alive if the land should be utterly bereaved thus of all its fruits others how that is what condition would Jacob stand thus? How should he subfist?how would he look ? or how should he get up or rise again ? and on verse 5] for he is small [or mean that is there is are but a very few left .]"}],"3":[{"catchword":null,"tekst":"Then the same repented the Lord [see Gen 6:6] it shall not come to pass [viz that they shall eat up all ]said the Lord."}],"4":[{"catchword":null,"tekst":"Moreover the Lord caused me to see thus and behold the Lord proclaimed that he would contend [or plead implead and consequently punish see Hos 4:1 with the annotate ]with fire [viz that of war and are like destruction as above chapter 1.4 ,7 ,10 some do understand it according to the letter of a fire from heaven such as fell upon Sodom and Gomorra or of other common conflagrations or great drought see Joel 1.19 with the annotate ] and it devoured a great abyss [or depth of waters whereby some understand the kingdom of Assyria laid wast by Tiglath-Pileser 2Ki 16:9]also it consumeth a piece of land [by this they understand a portion of Israel in Gilead beyond the Jordan see 2Ki 15:29 2Ch 5:26,49]"}],"5":[{"catchword":null,"tekst":"Then said I the Lord cease I pray who should there remain standing of Jacob ? for he is small"}],"6":[{"catchword":null,"tekst":"Then the same repented the Lord this also shall not come to pass [viz that the whole land shall be consumed by fire at this time ]saith the Lord."}],"7":[{"catchword":null,"tekst":"(Yet) he made see thus; and behold the LORD stood upon a wall, which was made after the plummet: [Heb. a wall of plummet i.e. such a one as was squared by the plummet; whereby, with some, we may understand, the Common wealth of Israel, which God; by his holy Lawes, and gracious blessing, had well and groriously founded and builded up; and by the plummet, that God had taken in hand now his severe and righteous judgement, which after so much long suffering and forbearance, (formerly spoken of ) he stood ready to execute upon Israel; because they had perverted and abused all things, as above chap. 6. 12. & c. com bel. Cha.8. 2.] and there was a plummet [ the Hebrew word is no where extant, but in these two verses.] in his hand."}],"8":[{"catchword":null,"tekst":"And the LORD said unto me, what scest thou Amos: and said a plummet: Then the LORD said; Behold I will set the plummet [viz. of my righteous judgement] in the midst of my people of Israel; I will no more pass by it [ viz. my people] hence forth. [Heb. I will not go on, or, continue to pass it by, or over i.e. I will not let them go unpunished, nor wink at or spare their trespasses, as hitherto I have done: Compare the phrase with Pro. 19. 11. Mich. 7. 18. and see annot. There. So bellow chap. 8. 2.]"}],"9":[{"catchword":null,"tekst":"But the high places of Isaac [Where they committed their idolatry, garnishing the same with the name and example of their forefathers Isaac and Jacob, who in their times had set up several Altars, and offered sacrifices in these places, for worship of God. See Gen. 26. 25. and 35. 7.] and the sanctuaries [ understand idolatrous Temples] of Israel [ the Israelites ] shall be destroyed: and I will rise up against the house of Jerobeam, [ the son of Joas above chap. 1. 1] with the sword. [ the son of this Jerobeam zacharia (who reigned but six months) was publicly slain by Sallum in the presence of the people. 2 kin. 15. 10. and it is remarkable, that the Prophet makes no further reply against this judgement pronounced by God; as he had made his intercession in the two former visions, and was heard]"}],"10":[{"catchword":null,"tekst":"Then [ When the prophet had made these visions known unto the people] Amazia the Priest as Bethel, sent to Jerobeam, the King of Israel, saying; Amos hath made a consederacy against thee in the midst of the house of Israel; [ and therefore (would he inferre) should the punishment of a traitor and a raiser of sedition be inflicted upon him, prophecying thus against the King in public] the land shall not be able to endure all his words. [implying, the people would be stirred up to rebellion by him; so that the state of the land and kings authority had need to look to it, and prevent the mischief that might ensue. Heb. not able to hold, or, apprehend.]"}],"11":[{"catchword":null,"tekst":"For thus saith Amos; Jerobeam shall die by the sword : [ Amos had spoken of the house of Jerobeam, above verse 9.] and Israel shall assuredly be carried away captive, and being carried &c.]"}],"12":[{"catchword":null,"tekst":"After that, Amazia said to Amos; thou seer, [ See 1, Sam. 9. on verse. 9.] begon, flee into the land of Juda; [ where Thekoa lay, the prophets own country above chap. 1. 1. Heb. flee thee, or for thee. The word thee or, for thee, is held redundant, only to make the phrase sound better; otherwise it might be taken here, for thee, that is for thy own good and safety. Compare Gen. 12. 1. Jer. 5. 5. Mich. 1. 11, etc. with the annotate.] and eat bread there, [i.e. get thy lively-hood and maintenance there. See Gen. 3. on verse 19.] and Prophecy there."}],"13":[{"catchword":null,"tekst":"But at Beth-El, thou shalt prophesy no more hence-forth [ compare above chap. 2. 12. Heb. Shalt not add or continue to prophecie] for that is, the kings sanctuary, [i.e. the place, which the King accounteth his sanctuary, where he doth celebrate his solemn worship and divine service, against which no prophecying is to be suffered. Some do understand here by the King, Melech, or Molech, the great idol of the King of Israel. See above c. 5. 26] and that is the house of the kingdom [ this may be understood of a royal court, which undoubtedly the King had to Bethel also, when he came thither for to solemnize his idolatrous worship; or, of a sovereign court of Judacature, and for the councel of the kingdom; or it may be understood, that all Israel was wanted to assemble here in the idolatrous temple, ( house for temple) in which regard it would, according to Amazias meaning, not only be very safe for Amos there, but the place itself could not at all tolerate any such Prophet]"}],"14":[{"catchword":null,"tekst":"Then Amos answered and said to Amazia; I was no prophet, nor was I any prophets son, but I was an heard-man; [ the Hebrew word comes from an other that signifies, oxen, kine or, great cartel. Compare above chap. 1. 11. Oth. Read, but I sought and gathered etc. the Hebr. Word signifying properly to seek, and it being plain by the next verse, that he went after small cattle or sheep] and gathered [ Hebr. Word is found no where else but here] wild-figs. [ or Sycomore-fruit; of such trees there was great abundance in the land Canaan. See 1 kings 10. 17. Isa. 9 10. and that the fruit he might gather either for himself or for his cattel to feed on.]"}],"15":[{"catchword":null,"tekst":"But the LORD took me from after the Flock; [ The Hebrew word doth properly signify small cattel, but is taken here more generally] and the LORD said to me,[ i.e. he whom I must obey more than men. Compare Act. 4. 19. Hence some conjecture that Amos fled not; the Jewes are of opinion that king Jerobeam gave no heed to Amazias information , but left the prophet unmolested] go thy way, prophesy to my people Israel."}],"16":[{"catchword":null,"tekst":"Now then hear the word of the LORD: thou saiest; thou shalt not prophecie against Israel, nor drop [ See Deut. Chap. 32. vers. 2. Ezek. 21.2. with the annot.] against the house of Israel."}],"17":[{"catchword":null,"tekst":"Therefore thus saith the LORD, thy wife shall play the whore in the city, [ i.e. the shall either prostitute herself, or be abused by the enemy as an harlot] and thy sons and thy daughters, shall fall by the sword; and thy land shall be divided by the line, [viz. for others. See deut. 3. on vers. 4. and Psal 16. on verse 5.] and thou shalt die in an unclean land, [ viz. in idolatrous Assyria] and Israel shall assuredly be carried away captive out of his land."}]}}};

(function bouwHfdnav() {

function refUrl(ref) {

// popup positioneren bij een element
function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;

document.addEventListener('click', e => {

    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
