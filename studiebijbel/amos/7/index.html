ot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "Jer 29:27": "Nu dan, waarom hebt u Jeremia, de Anathothiet, niet bestraft, die zich bij u voor een profeet uitgeeft?", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "Luk 6:36": "Wees dan barmhartig, zoals ook uw Vader barmhartig is.", "2 Kon 14:26": "Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Micha 7:10": "En mijn vijandin zal het zien, en schaamte zal haar bedekken; zij die tegen mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen op haar neerzien; nu zal zij worden tot vertreding, als slijk van de straten.", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Mal 3:13": "Uw woorden zijn tegen Mij te sterk geworden, zegt de HEERE; maar u zegt: Wat hebben wij tegen U gesproken?", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Ps 10:13": "Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Ps 42:4": "Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Ezech 20:49": "En ik zei: Ach, Heere HEERE, zij zeggen van mij: Spreekt hij niet in gelijkenissen?", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Ps 12:4": "De HEERE snijdt alle vleiende lippen af, en de tong die grootspreekt;", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Dan 3:15": "Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, dan is het goed; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen?", "Rom 3:5": "Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.)", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "1 Sam 15:16": "Toen zei Samuël tegen Saul: Houd op, dan zal ik u vertellen wat de HEERE vannacht tot mij gesproken heeft. Hij dan zei tegen hem: Spreek.", "Job 34:7": "Wat man is er, gelijk Job? Hij drinkt de bespotting in als water;", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "2 Kon 14:24": "En hij deed wat kwaad was in de ogen van de HEERE; hij week niet af van alle zonden van Jerobeam, de zoon van Nebat, die Israël liet zondigen.", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Matt 4:18": "En Jezus liep langs de zee van Galilea en zag twee broers, namelijk Simon, genaamd Petrus, en Andreas, zijn broer, die een net in de zee wierpen (want zij waren vissers);", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "2 Petr 2:1": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen;", "2 Sam 12:13": "Toen zei David tegen Nathan: Ik heb gezondigd tegen de HEERE! En Nathan zei tegen David: De HEERE heeft ook uw zonde weggenomen, u zult niet sterven.", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "Jer 29:32": "Daarom zegt de HEERE zo: Ziet, Ik zal bezoeking doen over Semaja, de Nechlamiet, en over zijn nageslacht; hij zal niemand hebben die in het midden van dit volk woont, en zal het goede niet zien dat Ik Mijn volk doen zal, spreekt de HEERE; want hij heeft een afval gesproken tegen de HEERE.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "1 Sam 15:35": "En Samuël zag Saul niet meer tot de dag van zijn dood toe; toch droeg Samuël leed om Saul; en het berouwde de HEERE, dat Hij Saul tot koning over Israël gemaakt had.", "Hebr 8:12": "Want Ik zal hun ongerechtigheden genadig zijn, en aan hun zonden en hun overtredingen zal Ik geenszins meer denken.", "Matt 8:34": "En zie, de hele stad ging Jezus tegemoet; en toen zij Hem zagen, smeekten zij Hem dat Hij uit hun gebied zou vertrekken.", "Ex 9:24": "En er was hagel, en vuur dat zich vermengde met de hagel; het was zeer zwaar; zoiets is in heel Egypteland nooit geweest, sinds het een volk geworden is.", "Jer 28:11": "En Hananja sprak voor de ogen van het hele volk, en zei: Zo zegt de HEERE: Zo zal Ik verbreken het juk van Nebukadnezar, de koning van Babel, in nog twee volle jaren, van de hals van alle volken. En de profeet Jeremia ging zijns weegs.", "Hand 17:32": "Toen zij nu van de opstanding van de doden hoorden, spotten sommigen daarmee; en sommigen zeiden: Wij zullen u hierover een andere keer horen.", "1 Sam 15:29": "En ook liegt Hij niet, Die de Overwinning van Israël is, en het berouwt Hem niet; want Hij is geen mens, dat Hem iets berouwen zou.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Jes 45:9": "Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of zal uw werk zeggen: Hij heeft geen handen?", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "Ps 36:6": "O HEERE! Uw goedertierenheid is tot in de hemelen; Uw waarheid tot de bovenste wolken toe.", "Matt 9:9": "En toen Jezus vandaar verder ging, zag Hij een man in het tolhuis zitten, genaamd Mattheüs; en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Num 14:17-19": "Nu dan, laat toch de kracht van de Heere groot worden, zoals U gesproken hebt, toen U zei: De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht. Vergeef toch de ongerechtigheid van dit volk, naar de grootte van Uw goedertierenheid, en zoals U dit volk vergeven hebt, van Egypteland af tot hiertoe!", "Ef 1:6-8": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde; In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade, Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtigheid;", "Jer 14:21": "Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.", "Ex 17:7": "En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?", "Mal 1:10": "Wie is er ook onder u, die de deuren voor niets toesluit? En u steekt het vuur niet aan op Mijn altaar voor niets. Ik heb geen behagen in u, zegt de HEERE van de heerscharen, en het spijsoffer is Mij van uw hand niet aangenaam.", "Jer 50:24": "Ik heb u een strik gesteld, en daardoor bent u ook gevangen, o Babel! Zonder dat u het wist; u bent gevonden, en ook gegrepen, omdat u zich tegen de HEERE in strijd gemengd hebt."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H136\">De</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H136\">Heere</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3541\">HEERE</span> liet <span class=\"wl\" data-l=\"L2\" data-code=\"H3541\">mij</span> dit <span class=\"wl\" data-l=\"L3\" data-code=\"H7200\">zien</span>: zie, <span class=\"wl\" data-l=\"L5\" data-code=\"H3335\">Hij</span> vormde <span class=\"wl\" data-l=\"L6\" data-code=\"H1462\">sprinkhanen</span>, <s e=\"H1540\">surely</span> go into <span class=\"wl wl-kjv\" data-code=\"H1540\">captivity</span> forth of his land."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
</body>
