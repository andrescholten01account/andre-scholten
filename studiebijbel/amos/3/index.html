ia, en zie de grote onrust in haar midden, en de verdrukten binnen in haar.","10":"Want zij weten niet te doen wat recht is, spreekt de HEERE; zij die in hun paleizen schatten vergaren *door* geweld en verwoesting.","11":"Daarom, zo zegt de Heere HEERE: De vijand! En dat rondom het land! Die zal uw sterkte van u neerstorten, en uw paleizen zullen uitgeplunderd worden.","12":"Zo zegt de HEERE: Zoals een herder twee schenkels, of een stukje van een oor, uit de muil van de leeuw redt, zo zullen de kinderen van Israël gered worden, die daar in Samaria zitten, in de hoek van het bed, en op de sponde van de koets.","13":"Hoort en getuigt in het huis van Jakob, spreekt de Heere HEERE, de God van de heerscharen*;","14":"Dat Ik, op de dag dat Ik Israëls overtredingen over hem bezoeken zal, ook bezoeking zal doen over de altaren van Beth-el; en de hoorns van het altaar zullen worden afgehouwen, en op de aarde vallen.","15":"En Ik zal het winterhuis met het zomerhuis slaan; en de ivoren huizen zullen vergaan, en de grote huizen zullen een einde nemen, spreekt de HEERE."},"SV":{"1":"Hoort dit woord, dat de HEERE tegen ulieden spreekt, gij kinderen van Israël! namelijk tegen het ganse geslacht, dat Ik uit Egypteland heb opgevoerd, zeggende:","2":"Uit alle geslachten des aardbodems heb Ik ulieden alleen gekend; daarom zal Ik al uw ongerechtigheden over ulieden bezoeken.","3":"Zullen twee te zamen wandelen, tenzij dat zij bijeengekomen zijn?","4":"Zal een leeuw brullen in het woud, als hij geen roof heeft? Zal een jonge leeuw uit zijn hol zijn stem verheffen, tenzij dat hij *wat* gevangen hebbe?","5":"Zal een vogel in den strik op de aarde vallen, als er geen strik voor hem is? Zal men den strik van den aardbodem opnemen, als men ganselijk niet heeft gevangen?","6":"Zal de bazuin in de stad geblazen worden, dat het volk niet siddere? zal er een kwaad in de stad zijn, dat de HEERE niet doet?","7":"Gewisselijk, de Heere HEERE zal geen ding doen, tenzij Hij Zijn verborgenheid aan Zijn knechten, de profeten, geopenbaard hebbe.","8":"De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?","9":"Doet het horen in de paleizen te Asdod, en in de paleizen in Egypteland, en zegt: Verzamelt u op de bergen van Samaria, en ziet de grote beroerten in het midden van haar, en de verdrukten binnen in haar.","10":"Want zij weten niet te doen, dat recht is, spreekt de HEERE; die in hun paleizen schatten vergaderen *door* geweld en verstoring.","11":"Daarom, zo zegt de Heere HEERE: De vijand! en dat rondom het land! die zal uw sterkte van u nederstorten, en uw paleizen zullen uitgeplunderd worden.","12":"Alzo zegt de HEERE: Gelijk als een herder twee schenkelen, of een stukje van een oor uit des leeuwen muil redt, alzo zullen de kinderen Israëls gered worden, die daar zitten te Samaria, in den hoek van het bed, en op de sponde van de koets.","13":"Hoort en betuigt in het huis Jakobs, spreekt de Heere HEERE, de God der heirscharen;","14":"Dat Ik, ten dage als Ik Israëls overtredingen over hem bezoeken zal, ook bezoeking zal doen over de altaren van Beth-el; en de hoornen des altaars zullen worden afgehouwen, en ter aarde vallen.","15":"En Ik zal het winterhuis met het zomerhuis slaan; en de elpenbenen huizen zullen vergaan, en de grote huizen een einde nemen, spreekt de HEERE."},"KJV":{"1":"Hear this word that the LORD hath spoken against you, O children of Israel, against the whole family which I brought up from the land of Egypt, saying,","2":"You only have I known of all the families of the earth: therefore I will punish you for all your iniquities.","3":"Can two walk together, except they be agreed?","4":"Will a lion roar in the forest, when he hath no prey? will a young lion cry out of his den, if he have taken nothing?","5":"Can a bird fall in a snare upon the earth, where no gin *is* for him? shall *one* take up a snare from the earth, and have taken nothing at all?","6":"Shall a trumpet be blown in the city, and the people not be afraid? shall there be evil in a city, and the LORD hath not done","7":"Surely the Lord GOD will do nothing, but he revealeth his secret unto his servants the prophets.","8":"The lion hath roared, who will not fear? the Lord GOD hath spoken, who can but prophesy?","9":"Publish in the palaces at Ashdod, and in the palaces in the land of Egypt, and say, Assemble yourselves upon the mountains of Samaria, and behold the great tumults in the midst thereof, and the oppressed in the midst","10":"For they know not to do right, saith the LORD, who store up violence and robbery in their palaces.","11":"Therefore thus saith the Lord GOD; An adversary *there shall be* even round about the land; and he shall bring down thy strength from thee, and thy palaces shall be spoiled.","12":"Thus saith the LORD; As the shepherd taketh out of the mouth of the lion two legs, or a piece of an ear; so shall the children of Israel be taken out that dwell in Samaria in the corner of a bed, and in Damascus *in* a couch.","13":"Hear ye, and testify in the house of Jacob, saith the Lord GOD, the God of hosts,","14":"That in the day that I shall visit the transgressions of Israel upon him I will also visit the altars of Bethel: and the horns of the altar shall be cut off, and fall to the ground.","15":"And I will smite the winter house with the summer house; and the houses of ivory shall perish, and the great houses shall have an end, saith the LORD."}},"tsk":{"1":[{"kopje":"Hoort","refs":["2 Kron 20:15","Jes 46:3","Jes 48:12","Hos 4:1","Hos 5:1","Micha 3:1","Openb 2:29"]},{"kopje":"tegen","refs":["Jer 8:3","Jer 31:1","Jer 33:24-26","Ezech 37:16","Ezech 37:17"]},{"kopje":"dat","refs":["Amos 2:10"]}],"2":[{"kopje":"alleen","refs":["Ex 19:5","Ex 19:6","Deut 7:6","Deut 10:15","Deut 26:18","Deut 32:9","Ps 147:19","Jes 63:19"]},{"kopje":"alle","refs":["Gen 10:32","Jer 1:15","Jer 10:25","Nahum 3:4","Zach 14:17","Zach 14:18","Hand 17:26"]},{"kopje":"daarom","refs":["Ezech 9:6","Ezec a <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> be <span class=\"wl wl-kjv\" data-code=\"H8628\">blown</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> not be <span class=\"wl wl-kjv\" data-code=\"H2729\">afraid?</span> shall there be <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in a <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath not done","7":"Surely the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">nothing,</span> but he <span class=\"wl wl-kjv\" data-code=\"H1540\">revealeth</span> his <span class=\"wl wl-kjv\" data-code=\"H5475\">secret</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the prophets.","8":"The <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> hath <span class=\"wl wl-kjv\" data-code=\"H7580\">roared,</span> who will <span class=\"wl wl-kjv\" data-code=\"H3808\">not</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">fear?</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken,</span> who can but prophesy?","9":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Publish</span> in the <span class=\"wl wl-kjv\" data-code=\"H759\">palaces</span> at <span class=\"wl wl-kjv\" data-code=\"H795\">Ashdod,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H759\">palaces</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H622\">Assemble</span> yourselves upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> the <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4103\">tumults</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> thereof, and the <span class=\"wl wl-kjv\" data-code=\"H6217\">oppressed</span> in the midst","10":"For they <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> not to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H5229\">right,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> who <span class=\"wl wl-kjv\" data-code=\"H686\">store</span> up <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> and <span class=\"wl wl-kjv\" data-code=\"H7701\">robbery</span> in their palaces.","11":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD;</span> An <span class=\"wl wl-kjv\" data-code=\"H6862\">adversary</span> there shall be even round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> and he shall bring <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> thy <span class=\"wl wl-kjv\" data-code=\"H5797\">strength</span> from thee, and thy <span class=\"wl wl-kjv\" data-code=\"H759\">palaces</span> shall be spoiled.","12":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> As the <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd</span> taketh <span class=\"wl wl-kjv\" data-code=\"H5337\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3767\">legs,</span> or a <span class=\"wl wl-kjv\" data-code=\"H915\">piece</span> of an <span class=\"wl wl-kjv\" data-code=\"H241\">ear;</span> so shall the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> be taken <span class=\"wl wl-kjv\" data-code=\"H5337\">out</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> in the <span class=\"wl wl-kjv\" data-code=\"H6285\">corner</span> of a <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> and in <span class=\"wl wl-kjv\" data-code=\"H1833\">Damascus</span> in a couch.","13":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> ye, and <span class=\"wl wl-kjv\" data-code=\"H5749\">testify</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of hosts,","14":"That in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that I shall <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> the <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> upon him I will also <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> of <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel:</span> and the <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H1438\">off,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> to the ground.","15":"And I will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H2779\">winter</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> with the <span class=\"wl wl-kjv\" data-code=\"H7019\">summer</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of <span class=\"wl wl-kjv\" data-code=\"H8127\">ivory</span> shall <span class=\"wl wl-kjv\" data-code=\"H6\">perish,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> shall have an <span class=\"wl wl-kjv\" data-code=\"H5486\">end,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"gekend;","tekst":"Dat is, tot mijn volk uitverkoren en aangenoemen, bijzonderlijk liefgehad en bezorgd. Verg. Hos 13:5 , en zie Psa 1:6 ."}],"3":[{"catchword":"Zullen twee te zamen wandelen,","tekst":"God stelt hier zijn volk door verscheidene gelijkenissen voor dat de profeten recht hadden om hun straffen, dreigen en allerlei plagen te voorzeggen; en dat tot waarschuwing, om het aanstaande kwaad door bekering te ontgaan: alzo het geen ijdele dreigementen waren."},{"catchword":"tenzij dat zij bijeengekomen zijn?","tekst":"Anders: tenzij dat zij overeen gekomen zijn. Ik en mijn getrouwe dienstknechten [wil God zeggen], wij zijn het eens, [zie Hos 9:8 ; Mal 2:6 ] , en gij zult het met mij en mijne profeten moeten eens worden, zo gij wilt dat Ik uw vriend en leidsman zij, anders zal Ik u moeten verlaten."}],"4":[{"catchword":"Zal een leeuw brullen in het woud,","tekst":"God en zijne profeten straffen en dreigen niet zonder grote reden en aanstaanden nood; daarom behoorden de Israëlieten bijtijds op te waken, eer God hun den vijand tot een roof overgaf, welke hen zo zekerlijk was nakende, als het gewis is dat de leeuw iets gevangen heeft als hij brult."},{"catchword":"verheffen,","tekst":"Hebr. geven."}],"5":[{"catchword":"vogel in den strik","tekst":"De minste ongelukken en tegenspoeden worden door Gods voorzienigheid geregeerd. Daarom behoorden de Israëlieten in alle deze op God te zien, met wien zij te doen hadden, en wiens netten en strikken zij niet zouden kunnen ontgaan, zo zij zich niet bekeerden."},{"catchword":"op de aarde vallen,","tekst":"Of, strik der aarde; dat is, dat op de aarde gelegd of gesteld is."},{"catchword":"als men","tekst":"Of, als het, te weten strik."},{"catchword":"ganselijk","tekst":"Hebr. vangende niet zal gevangen hebben."}],"6":[{"catchword":"siddere?","tekst":"En gij ontzet u niet over al de dreigementen en strafpredikatiën, die Ik u laat voordragen! Anders: sidderende, of haastelijk aankome, toelope. Gelijk Hos 3:5 , en Hos 11:11 ."},{"catchword":"kwaad in de stad zijn,","tekst":"Der straf. Zie Gen 19:19 , en verg. Isa 45:7 ."}],"7":[{"catchword":"Gewisselijk,","tekst":"De twee volgende verzen dienen tot verklaring en toepassing van de voorgaande gelijkenissen."},{"catchword":"verborgenheid","tekst":"Dat is, zijn raad van bijzondere oordelen en landplagen."},{"catchword":"geopenbaard hebbe","tekst":"Om zijn volk tevoren te doen waarschuwen."}],"8":[{"catchword":"leeuw heeft gebruld,","tekst":"De Heere heeft zijn toorn te kennen gegeven, en zijnen knechten gelast daarvan te profeteren. Zie Amo 1:2 , en Hos 11:10 ."}],"9":[{"catchword":"Doet het horen in de paleizen te Asdod,","tekst":"Hier geeft de Heere te kenne dat Israëls boodheid en ondankbaarheid zo groot en schandelijk was, dat zelfs de heidense natiën, daarover als richters geroepen zijnde, die zouden verfoeien, en God in zijne straffen recht geven. Verg. Mic 1:2 , enz."},{"catchword":"bergen van Samaria,","tekst":"Die er velen, dicht bij den berg, waar Samaria op lag, in het oosten, noorden en zuiden gelegen waren; vanwaar men [om zo te spreken] alles horen en zien kon, wat er in Samaria omging."},{"catchword":"beroerten","tekst":"Of, woelingen, rumoeren, verwarring."}],"10":[{"catchword":"weten niet te doen,","tekst":"Verg. Jer 4:22 ."},{"catchword":"geweld en verstoring","tekst":"Verkregen door geweld, overlast en roverij."}],"11":[{"catchword":"vijand","tekst":"Een afgebroken rede, gelijk men ten tijde, wanneer de vijand onvoorziens en haastelijk aankomt en alles bezet, pleegt te roepen: Vijand, vijand, overal, rondom. Of, versta, daarop zal er komen, en hij zal, enz., te weten, Salmanasser, de koning van Assyrië. Zie 2Ki 17:5-6 , en verg. Hos 8:1 ."},{"catchword":"en dat rondom het land","tekst":"Zie van zulk een gebruik der Hebr. letter Vau, voor, en dat, zelfs, Jer 17:10 ; Joe 2:12 , Joe 2:32 , enz."},{"catchword":"uw sterkte","tekst":"O Samaria."}],"12":[{"catchword":"twee schenkels","tekst":"Met deze gelijkenis geeft God te verstaan dat er zeer weinigen, en dat met grote zwarigheid en gevaar, ontkomen zullen."},{"catchword":"stukje van een oor uit des leeuwen muil redt,","tekst":"Het Hebr. woord wordt hier alleen gevonden."},{"catchword":"zitten","tekst":"Dit verstaan sommigen van de wellustige en brassende Israëlieten, die zorgeloos leefden en Gods dreigementen van de aanstaande ellende in den wind sloegen. Zie Amo 6:4 . Anderen verstaan het van kranken, die te bed mochten liggen, of degenen die zich hier en daar in hoeken en verborgen plaatsen mochten versteken, waarop de vijand in het moorden en plunderen somtijds weinig acht geeft, zulks dat zij wel ontkomen."},{"catchword":"het bed,","tekst":"Of, bedstede."},{"catchword":"sponde van de koets","tekst":"Of, voet, in de zijde. Hebr. Demeschek, dat nergens meer in de Heilige Schrift gevonden wordt. Sommigen nemen het voor Dammeschek, dat is Damaskus, en zetten het over: in een koets van Damaskus, of een Damascener of Syrische prachtige koets."}],"13":[{"catchword":"Hoort","tekst":"Hier spreekt God zijne profeten en de gelovigen aan, die er nog in Israël overig waren."}],"14":[{"catchword":"altaren","tekst":"Benevens het volk, zal Ik alles wat zij tot afgoderij en bijgelovigheid verordineerd hebben, doen uitroeien; al hun afgodisch tuig en gereedschap."},{"catchword":"Bethel;","tekst":"Zie Hos 4:15 , en Hos 10:15 , met de aantekening."}],"15":[{"catchword":"winterhuis met het zomerhuis slaan;","tekst":"Alles wat zij tot plezier en pracht gebouwd en gebruikt hebben, zal Ik vernielen. Dit ziet op de gewoonte der groten, die alom in het land schone en kostelijk vertrekken en lusthuizen, idem koniklijke paleizen, gebouwd hadden, om in den zomer zonder belet van hitte, en in den winter zonder belet van koude in allerlei wellust onverhinderd door te brengen. Verg. Jdg 3:20 ; Jer 36:22 , met de aantekening."},{"catchword":"elpenbenen huizen zullen vergaan,","tekst":"Zie 1Ki 22:39 ."}]},"kanttekeningen_en":{"2":[{"catchword":"You alone have I known of all Generations of the earth:","tekst":"i.e chosen and accepted of you in an extra-ordinary manner. Compare Hos. 13. 5 and see Psal. 1. on verse 6. therefore will I visit all your unrightiousnesse&acirc;&euro;&trade;s upon you."}],"3":[{"catchword":"Shall two walk together","tekst":"Here God begins by severall similitudes to show unto the people, that the prophets had sufficient ground to reprove them, and to threaten and to foretell them all manner of judgements: and that by way of warning, that yet they might escape the approaching evils by serious repentance; in regard they were no vain threatenings"},{"catchword":"unless they be met together?","tekst":"Oth. Unless they be agreed ? and my faithful servants, (implies God) are of one mind; (see Hos. 9. 8. Mal. 2. 6.) and ye must likewise agree with me and my prophets, if ye mean to keep me your friend and guide; otherwise I must forsake you."}],"4":[{"catchword":"Will a Lion roar in the wood, when he hath no prey? Will a young Lion lift up","tekst":"Heb.give"},{"catchword":"his voice, unless he hath caught (somewhat) ?","tekst":"God and his prophets reprove and threaten not without great reason, and instant necessity; therefore the Israelites had need to awake, before God do deliver them up for a spoil to the enemy: which danger was as surely drawing on, as it is sure the Lion hath caught a prey, when once he begins to roar."}],"5":[{"catchword":"Will a bird fall into the gin upon the ground","tekst":"or, gin of the ground i.e. set or laid on the ground"},{"catchword":"when there is no gin for him?","tekst":"the least mis-fortunes are governed by Gods Providence; therefore the Israelites had great reason in all theirs to look up to God, with whom they had to do, and whose nets and gins they should not be able to escape unless they repented"},{"catchword":"will a man take up the snare from the ground having taken nothing at all?","tekst":"Heb. taking, (or, catching) shall have taken (or caught) nothing."}],"6":[{"catchword":"Shall the trumpet be blown in the city, that the people do not tremble","tekst":"Yet ye nevertheless be not troubled at all the threatnings and reproof-sermons, which I cause to be made unto you. Others, hastily or trembling run, come on,as Hose. 3. 5. and chap. 11. 11."},{"catchword":"shall there be an evil in the city unless the LORD do it","tekst":"meaning the evil of punishment. See Gen. 19 on vers. 16. and Compare Isa 45. 7."}],"7":[{"catchword":"Certainly","tekst":"The two following verses serve for explaination and application of the precedent similitudes"},{"catchword":"the LORD will do nothing unless he hath revealed his secret","tekst":"i.e. his councel and determination of extraordinary judgements, and general plague and calamities"},{"catchword":"to his servants the Prophets","tekst":"to give warning thereof unto his people beforehand."}],"8":[{"catchword":"The Lion hath roared","tekst":"i.e. the LORD hath made his anger known, and charged his servants to prophesie thereof. See above chap. 1. 2. and Hos. 11. 10. who should not be afraid? The LORD hath spoken who should not prophesie?"}],"9":[{"catchword":"Cause it to be heard in the palaces of Asdod, and in the palaces, in the land of Egypt","tekst":"Here the LORD manifests that Israels wickedness and unthankfulness was so great and heinous, that the very heathen nations being called to be judges thereof, would detest and abhor them for it, and justify God in his punishments. Compare Mich. 2, etc"},{"catchword":"gather yourselves upon the mountains of Samaria","tekst":"whereof there were many, which lying pretty close to that on which Samaria it self lay, East, North and South of it; whence one might (in a manner) over-hear and overlook what was done in Samaria"},{"catchword":"and see the great commotions","tekst":"or, stirs, tumults, disorders and confusions in the midst of her, and the oppressed within her.]"}],"10":[{"catchword":"For they know not how to do that which is right","tekst":"Compare Jer. 4. 22."},{"catchword":"Speaketh the LORD: those that gather treasures in their palaces through violence and destruction","tekst":"i.e. gotten by force oppression and robberies."}],"11":[{"catchword":"Therefore now saith the LORD: the enemy!","tekst":"An abrupt speech, as it is the manner to cry out, when the enemy unawareness and suddenly makes an inroad, and surpriseth all passages: the Enemy, the enemy, every where, round about: or understand thereupon, is coming, and he shall, etc meaning salmonasser the King of Assyria; See 2. Kings 17. 5, 6. and compare Hos. 8. 1."},{"catchword":"and that round about the land:","tekst":"See of the like use of the Hebr letter vau, for, and that or, even, Jer. 17. on verse 10. Joel 2. verse. 12. 31. etc."},{"catchword":"he shall throw down thy strength from thee","tekst":"O Samaria and thy palaces shall be despoiled."}],"12":[{"catchword":"Thus saith the LORD: like as a Shepheard rescues two legs, or a piece of an ear","tekst":"the Hebrew word here use const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
