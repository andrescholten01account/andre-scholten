j geen roof heeft? Zal een jonge leeuw uit zijn hol zijn stem verheffen, tenzij dat hij *wat* gevangen hebbe?", "5": "Zal een vogel in den strik op de aarde vallen, als er geen strik voor hem is? Zal men den strik van den aardbodem opnemen, als men ganselijk niet heeft gevangen?", "6": "Zal de bazuin in de stad geblazen worden, dat het volk niet siddere? zal er een kwaad in de stad zijn, dat de HEERE niet doet?", "7": "Gewisselijk, de Heere HEERE zal geen ding doen, tenzij Hij Zijn verborgenheid aan Zijn knechten, de profeten, geopenbaard hebbe.", "8": "De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?", "9": "Doet het horen in de paleizen te Asdod, en in de paleizen in Egypteland, en zegt: Verzamelt u op de bergen van Samaria, en ziet de grote beroerten in het midden van haar, en de verdrukten binnen in haar.", "10": "Want zij weten niet te doen, dat recht is, spreekt de HEERE; die in hun paleizen schatten vergaderen *door* geweld en verstoring.", "11": "Daarom, zo zegt de Heere HEERE: De vijand! en dat rondom het land! die zal uw sterkte van u nederstorten, en uw paleizen zullen uitgeplunderd worden.", "12": "Alzo zegt de HEERE: Gelijk als een herder twee schenkelen, of een stukje van een oor uit des leeuwen muil redt, alzo zullen de kinderen Israëls gered worden, die daar zitten te Samaria, in den hoek van het bed, en op de sponde van de koets.", "13": "Hoort en betuigt in het huis Jakobs, spreekt de Heere HEERE, de God der heirscharen;", "14": "Dat Ik, ten dage als Ik Israëls overtredingen over hem bezoeken zal, ook bezoeking zal doen over de altaren van Beth-el; en de hoornen des altaars zullen worden afgehouwen, en ter aarde vallen.", "15": "En Ik zal het winterhuis met het zomerhuis slaan; en de elpenbenen huizen zullen vergaan, en de grote huizen een einde nemen, spreekt de HEERE."}, "KJV": {"1": "Hear this word that the LORD hath spoken against you, O children of Israel, against the whole family which I brought up from the land of Egypt, saying,", "2": "You only have I known of all the families of the earth: therefore I will punish you for all your iniquities.", "3": "Can two walk together, except they be agreed?", "4": "Will a lion roar in the forest, when he hath no prey? will a young lion cry out of his den, if he have taken nothing?", "5": "Can a bird fall in a snare upon the earth, where no gin *is* for him? shall *one* take up a snare from the earth, and have taken nothing at all?", "6": "Shall a trumpet be blown in the city, and the people not be afraid? shall there be evil in a city, and the LORD hath not done", "7": "Surely the Lord GOD will do nothing, but he revealeth his secret unto his servants the prophets.", "8": "The lion hath roared, who will not fear? the Lord GOD hath spoken, who can but prophesy?", "9": "Publish in the palaces at Ashdod, and in the palaces in the land of Egypt, and say, Assemble yourselves upon the mountains of Samaria, and behold the great tumults in the midst thereof, and the oppressed in the midst", "10": "For they know not to do right, saith the LORD, who store up violence and robbery in their palaces.", "11": "Therefore thus saith the Lord GOD; An adversary *there shall be* even round about the land; and he shall bring down thy strength from thee, and thy palaces shall be spoiled.", "12": "Thus saith the LORD; As the shepherd taketh out of the mouth of the lion two legs, or a piece of an ear; so shall the children of Israel be taken out that dwell in Samaria in the corner of a bed, and in Damascus *in* a couch.", "13": "Hear ye, and testify in the house of Jacob, saith the Lord GOD, the God of hosts,", "14": "That in the day that I shall visit the transgressions of Israel upon him I will also visit the altars of Bethel: and the horns of the altar shall be cut off, and fall to the ground.", "15": "And I will smite the winter house with the summer house; and the houses of ivory shall perish, and the great houses shall have an e "label": "The ancients had houses or apartments suited to", "href": "../../torrey/s/?hl=Amos.3.15#i20459", "refs": [{"disp": "Richt 3:20", "href": "../../richteren/3/#v20", "ref": "Richt 3:20", "svLabel": null}, {"disp": "Richt 3:24", "href": "../../richteren/3/#v24", "ref": "Richt 3:24", "svLabel": null}, {"disp": "Amos 3:15", "href": "../../amos/3/#v15", "ref": "Amos 3:15", "svLabel": null}], "kinderen": []}]}, {"topic": "Winter", "href": "../../torrey/w/#t-winter", "kinderen": [{"label": "The Jews frequently had special houses for", "href": "../../torrey/w/?hl=Amos.3.15#i23386", "refs": [{"disp": "Jer 36:22", "href": "../../jeremia/36/#v22", "ref": "Jer 36:22", "svLabel": null}, {"disp": "Amos 3:15", "href": "../../amos/3/#v15", "ref": "Amos 3:15", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Spr 24:22": "Want hun verderf zal snel ontstaan; en wie weet hun beider ondergang?", "Jer 1:16": "En Ik zal Mijn oordelen tegen hen uitspreken over al hun slechtheid; dat zij Mij verlaten hebben, en voor andere goden reukwerk verbrand hebben, en zich gebogen hebben voor de werken van hun handen.", "Jes 32:7": "En het hele gereedschap van een gierigaard is kwaad; hij bedenkt schandelijke plannen, om de ellendigen te gronde te richten met valse woorden, ook als de arme spreekt wat recht is.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Hab 2:5-13": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken. Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk! Zullen niet onvoorziens opstaan die u zullen bijten, en ontwaken die u zullen doen beven, en zult u hun niet tot buit worden?", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Ps 14:4": "Hebben dan alle werkers van de ongerechtigheid geen kennis, die mijn volk opeten alsof zij brood aten? Zij roepen de HEERE niet aan.", "Gen 46:4": "Ik zal met u aftrekken naar Egypte, en Ik zal u ook weer laten optrekken; en Jozef zal zijn hand op uw ogen leggen.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Joh 15:15": "Ik noem u niet meer dienstknechten; want de dienstknecht weet niet wat zijn heer doet; maar Ik heb u vrienden genoemd; want alles wat Ik van Mijn Vader gehoord heb, dat heb Ik u bekendgemaakt.", "Ps 34:22": "Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Ps 106:7": "Onze vaders in Egypte hebben niet gelet op Uw wonderen; zij zijn de veelheid van Uw goedertierenheid niet gedachtig geweest; maar zij waren opstandig aan de zee, bij de Schelfzee.", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "Micha 1:7": "En al haar gesneden beelden zullen vermorzeld worden, en al haar hoerenbeloningen zullen met vuur verbrand worden, en al haar afgoden zal Ik stellen tot een woestheid; want zij heeft ze van hoerenloon vergaderd, en zij zullen tot hoerenloon terugkeren.", "Kol 4:4": "opdat ik die openbaar maak, zoals ik moet spreken.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Jer 33:24-26": "Hebt u niet gezien wat dit volk zegt: De twee geslachten die de HEERE verkozen had, die heeft Hij nu verworpen? Ja, zij versmaden Mijn volk, zodat het geen volk meer is voor hun aangezicht. Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, als Ik de ordeningen van de hemel en de aarde niet had vastgesteld; Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen.", "Ps 60:3-5": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Spr 11:1": "Een bedrieglijke weegschaal is de HEERE een gruwel; maar een volkomen weegsteen is Zijn welgevallen.", "Ps 94:21": "Zij rotten samen tegen de ziel van de rechtvaardige, en zij veroordelen onschuldig bloed.", "Joh 15:22": "Als Ik niet gekomen was, en tot hen gesproken had, hadden zij geen zonde; maar nu hebben zij geen voorwendsel voor hun zonde.", "Rom 2:9": "Verdrukking en benauwdheid over elke ziel van de mens die het kwade doet, eerst van de Jood, en ook van de Griek;", "Joh 13:34": "Een nieuw gebod geef Ik u, dat u elkaar liefhebt; zoals Ik u liefgehad heb, dat u ook elkaar liefhebt.", "1 Kor 11:32": "Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.", "1 Petr 3:8": "En tenslotte, wees allen eensgezind, meelevend, heb de broeders lief, wees met innerlijke barmhartigheid bewogen, vriendelijk;", "1 Joh 1:3": "Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.", "Hand 10:35": "maar in ieder volk is hij die Hem vreest en gerechtigheid doet, Hem aangenaam.", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Jes 9:11": "De Syriërs van voren, en de Filistijnen van achteren, zodat zij Israël opeten met volle mond. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ex 33:22": "En het zal gebeuren, wanneer Mijn heerlijkheid voorbijgaat, dat Ik u in een kloof van de steenrots zal zetten; en Ik zal u met Mijn hand overdekken, totdat Ik voorbijgegaan zal zijn.", "Amos 4:5": "En laat rook opgaan van het gedesemde als een lofoffer, en roep vrijwillige offers uit, laat het horen; want zo hebt u het graag, kinderen van Israël! spreekt de Heere HEERE.", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "Ef 5:11": "En heb geen gemeenschap met de onvruchtbare werken van de duisternis, maar bestraf ze veeleer.", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Jes 9:7-11": "De Heere heeft een woord gezonden in Jakob, en het is gevallen in Israël. En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden: De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Ps 89:11": "Gij hebt Rahab verbrijzeld als een verslagene; Gij hebt Uw vijanden verstrooid met de arm van Uw sterkte.", "Joh 3:8-12": "De wind waait waarheen hij wil, en u hoort zijn geluid; maar u weet niet waar hij vandaan komt en waar hij heen gaat; zo is ieder die uit de Geest geboren is. Nicodemus antwoordde en zei tegen Hem: Hoe kunnen deze dingen gebeuren? Jezus antwoordde en zei tegen hem: Bent u een leraar van Israël, en weet u deze dingen niet?", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "1 Kor 5:13": "Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.", "Ps 55:13-15": "Want het is geen vijand die mij hoont, anders zou ik het hebben gedragen; het is mijn hater niet die zich tegen mij groot maakt, anders zou ik mij voor hem verborgen hebben. Maar u bent het, o mens, als van mijn eigen stand, mijn leidsman en mijn bekende! Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "Job 19:13-22": "Mijn broeders heeft Hij ver van mij gedaan; en die mij kennen, zeker, zij zijn van mij vervreemd. Mijn nabestaanden houden op, en mijn bekenden vergeten mij. Mijn huisgenoten en mijn dienstmaagden achten mij als een vreemde; een buitenlander ben ik in hun ogen.", "Hos 9:10": "Ik vond Israël als druiven in de woestijn, Ik zag uw vaders als de eerste vrucht aan de vijgenboom in haar begintijd; maar zij gingen naar Baäl-peor, en zonderden zich af tot die schande, en werden helemaal verfoeilijk, net als datgene wat zij liefhadden.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "2 Kor 2:15": "Want wij zijn voor God een goede geur van Christus, onder hen die behouden worden, en onder hen die verloren gaan;", "Ps 7:12-14": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt. Als hij zich niet bekeert, zal Hij Zijn zwaard scherpen; Hij heeft Zijn boog gespannen, en hem gereedgemaakt. En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "2 Sam 22:27": "Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "Ezech 34:2-4": "Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet. De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Job 6:15": "Mijn broeders hebben trouweloos gehandeld als een beek; als de storting der beken gaan zij door;", "Jes 13:4": "Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger.", "2 Kon 15:5": "En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.", "Ps 18:20": "En Hij voerde mij uit in de ruimte, Hij rukte mij eruit, want Hij had lust aan mij.", "1 Kon 20:30": "En de overgeblevenen vluchtten naar Afek, de stad in, en de muur viel op zeven en twintig duizend mannen, die overgebleven waren; ook vluchtte Benhadad, en kwam in de stad van kamer in kamer.", "Ezech 7:3": "Nu is het einde over u; want Ik zal Mijn toorn tegen u zenden, en Ik zal u richten naar uw wegen, en Ik zal op u brengen al uw gruwelen.", "Dan 5:20": "Maar toen zijn hart zich verhief, en zijn geest verstijfd werd tot hoogmoed, werd hij van de troon van zijn koninkrijk afgestoten, en men nam de eer van hem weg.", "Amos 5:11": "Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken.", "Rom 14:18-21": "Want hij die Christus in deze dingen dient, is God welgevallig, en aangenaam bij de mensen. Laten wij dan najagen wat tot de vrede dient, en wat tot de opbouw van elkaar dient. Verbreek het werk van God niet om het voedsel. Alle dingen zijn wel rein; maar het is kwaad voor de mens die met aanstoot eet.", "Ezech 37:17": "Doe ze dan bij elkaar komen, het een bij het ander tot één stuk hout; en zij zullen één worden in uw hand.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Num 16:9": "Is het u te weinig, dat de God van Israël u van de vergadering van Israël heeft afgescheiden, om u tot Zich te laten naderen; om de dienst van de tabernakel van de HEERE te verrichten, en te staan voor het aangezicht van de vergadering, om hen te dienen?", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Neh 9:25": "En zij hebben vaste steden en een vet land ingenomen, en erfelijk bezeten, huizen, vol van allerlei goed, uitgehouwen waterputten, wijngaarden, olijfgaarden en fruitbomen, in overvloed; en zij hebben gegeten, en zijn verzadigd en vet geworden, en hebben in weelde geleefd, door Uw grote goedheid.", "Hebr 6:8": "maar die doornen en distels draagt, is verwerpelijk, en dicht bij de vervloeking, waarvan het einde verbranding is.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Jer 2:15": "De jonge leeuwen hebben over hem gebruld, zij hebben hun stem verheven; en zij hebben zijn land verwoest gemaakt; zijn steden zijn verbrand, zodat er niemand in woont.", "Matt 20:25-28": "En Jezus riep hen bij Zich, en zei: U weet dat de leiders van de volken heerschappij voeren over hen, en de groten macht uitoefenen over hen. Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn; en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Rom 1:21": "Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden;", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Ef 2:18": "Want door Hem hebben wij beiden de toegang door één Geest tot de Vader.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "1 Sam 17:34-37": "Toen zei David tegen Saul: Uw knecht weidde de schapen van zijn vader, en er kwam een leeuw en een beer, en nam een schaap uit de kudde weg. En ik ging hem achterna, en sloeg hem, en redde het uit zijn muil; toen hij tegen mij opstond, greep ik hem bij zijn baard, en sloeg hem, en doodde hem. Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "1 Kron 5:22": "Want er vielen veel gewonden, omdat de strijd van God was; en zij woonden in hun plaats, totdat zij gevankelijk werden weggevoerd.", "Jer 4:5": "Verkondig het in Juda, en laat het horen te Jeruzalem, en zeg het; ja, blaas de bazuin in het land; roep met volle stem en zeg: Verzamel u, en laten wij ingaan in de versterkte steden!", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Jer 5:28": "Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.", "Jes 5:4-7": "Wat is er meer te doen aan Mijn wijngaard, wat Ik daaraan niet gedaan heb? Waarom heb Ik verwacht dat hij goede druiven voortbrengen zou, terwijl hij stinkende druiven heeft voortgebracht? Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt. En Ik zal hem tot een woestenij maken; hij zal niet gesnoeid, noch omgespit worden, maar distels en doornen zullen erin opkomen; en Ik zal de wolken gebieden dat zij er geen regen op laten regenen.", "Pred 4:14": "Want de een komt uit de gevangenis om koning te worden; terwijl ook iemand die in zijn koninkrijk geboren is, verarmt.", "Ps 94:19": "Toen mijn gedachten in mij talrijk werden, hebben Uw vertroostingen mijn ziel verkwikt.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "Amos 8:6": "Zodat wij de armen voor geld mogen kopen, en de nooddruftige om een paar schoenen; en dan zullen wij het kaf van het koren verkopen.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Jes 14:24-27": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan! Dat Ik Assur in Mijn land zal verbreken, en hem op Mijn bergen vertreden; opdat zijn juk van hen afwijkt, en zijn last van hun schouder wijkt. Dit is de raadslag, die beraadslaagd is over dat hele land; en dit is de hand, die uitgestrekt is over alle volken.", "Matt 3:10": "En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Matt 23:8": "Maar u moet niet Rabbi genoemd worden; want Eén is uw Meester, namelijk Christus; en u bent allemaal broeders.", "Deut 6:11": "En huizen, vol van alle goeds, die u niet gevuld hebt, en uitgehouwen putten, die u niet uitgehouwen hebt, wijngaarden en olijfgaarden, die u niet geplant hebt, en u gegeten hebt en verzadigd bent;", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "2 Kron 24:24": "Hoewel het leger van Syrië met weinig mannen kwam, gaf de HEERE toch in hun hand een leger van zeer grote omvang, omdat zij de HEERE, de God van hun vaderen, verlaten hadden; zo voerden zij de oordelen uit tegen Joas.", "Jer 17:10": "Ik, de HEERE, doorgrond het hart, en proef de nieren; en dat, om ieder te geven naar zijn wegen, naar de vrucht van zijn handelingen.", "Jer 2:10": "Want ga over naar de eilanden van de Chittiërs, en zie toe, en zend naar Kedar, en let er goed op; en zie, of zoiets is gebeurd?", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Spr 15:18": "Een grimmige man verwekt gekijf; maar wie langzaam tot toorn is, doet de twist bedaren.", "Spr 13:2": "Ieder zal van de vrucht van de mond het goede eten; maar de ziel van de trouwelozen het geweld.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "2 Kron 32:25": "Maar Jehizkia gaf geen vergelding naar de weldaad die hem was gebeurd, omdat zijn hart hoogmoedig werd; daarom kwam er over hem, en over Juda en Jeruzalem, een grote toorn.", "2 Kor 5:11": "Wij dan, die de schrik van de Heere kennen, bewegen de mensen tot het geloof, en wij zijn openbaar geworden voor God; en ik hoop dat wij ook in uw gewetens geopenbaard zijn geworden.", "Matt 21:41": "Zij zeiden tegen hem: Hij zal die kwaden een kwade dood laten sterven, en de wijngaard verhuren aan andere landbouwers, die hem de vruchten op de juiste tijd zullen geven.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Jak 1:14": "Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "Hos 5:10": "De vorsten van Juda zijn geworden als zij die de grenzen verleggen; Ik zal Mijn verbolgenheid als water over hen uitgieten.", "Lev 19:36": "U zult een eerlijke weegschaal hebben, eerlijke gewichten, een eerlijke efa, en een eerlijke hin; Ik ben de HEERE, uw God, Die u uit Egypteland uitgevoerd heb!", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "Deut 29:29": "De verborgen dingen zijn voor de HEERE, onze God; maar de geopenbaarde dingen zijn voor ons en voor onze kinderen, tot in eeuwigheid, om al de woorden van deze wet te doen.", "Amos 7:12-17": "Daarna zei Amazia tegen Amos: Gij ziener, ga weg, vlucht naar het land van Juda, en eet daar brood, en profeteer daar. Maar in Beth-el zult u voortaan niet meer profeteren; want dat is het heiligdom van de koning, en dat is het huis van het koninkrijk. Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.", "Spr 25:15": "Een leider wordt door geduld overreed; en een zachte tong breekt het gebeente.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "2 Kron 34:7": "brak hij ook de altaren af en de gewijde bomen, en de gesneden beelden verbrijzelde hij tot poeder, en al de zonnebeelden hieuw hij af in het hele land van Israël; daarna keerde hij terug naar Jeruzalem.", "Spr 12:14": "Ieder wordt van de vrucht van de mond met goed verzadigd; en de vergelding van de handen van de mens zal Hij hem terugbrengen.", "1 Petr 3:11": "hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Amos 4:11": "Ik heb sommigen onder u omgekeerd, zoals God Sodom en Gomorra omkeerde, u, die was als een stuk brandhout, dat uit de brand gered is; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Ps 105:25": "Hij keerde hun hart om, zodat zij Zijn volk haatten, dat zij met Zijn knechten listig omgingen.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Jer 50:25": "De HEERE heeft Zijn schatkamer opengedaan, en de wapens van Zijn gramschap voortgebracht; want dat is een werk van de Heere, de HEERE van de heerscharen, in het land van de Chaldeeën.", "Jes 5:11-14": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft! En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Spr 22:24-27": "Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man; opdat u zijn paden niet leert, en een strik over uw ziel haalt. Wees niet onder hen die in de hand klappen, onder hen die borg staan voor schulden.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Spr 11:27": "Wie het goede vroeg nazoekt, zoekt welgevalligheid; maar wie het kwade natracht, hem zal het overkomen.", "Gen 6:12": "Toen zag God de aarde, en zie, zij was verdorven; want alle vlees had zijn weg verdorven op de aarde.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Kol 3:12": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld;", "Ps 38:4": "Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "1 Sam 10:19": "Maar u hebt vandaag uw God verworpen, Die u Zelf uit al uw ellenden en uw noden verlost heeft, en u hebt tegen Hem gezegd: Nee, zet een koning over ons; nu dan, stel u voor het aangezicht van de HEERE, naar uw stammen en naar uw duizenden.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Mark 6:11": "En als iemand u niet ontvangt, en niet naar u luistert, schud dan, wanneer u vandaar vertrekt, het stof van uw voeten af, hun tot een getuigenis. Voorwaar, Ik zeg u: Het zal voor Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "Jer 4:22": "Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.", "1 Sam 3:11-14": "En de HEERE zei tegen Samuël: Zie, Ik doe een ding in Israël, dat bij ieder die het horen zal, beide oren zullen tuiten. Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien.", "2 Kon 17:13": "Toen nu de HEERE tegen Israël en tegen Juda, door de dienst van alle profeten en van alle zieners, gewaarschuwd had en zei: Bekeer u van uw slechte wegen en houd Mijn geboden en Mijn inzettingen, naar de hele wet die Ik uw vaderen geboden heb, en die Ik u door de hand van Mijn knechten, de profeten, gezonden heb;", "Hos 4:7": "Zoals zij meer geworden zijn, zo hebben zij tegen Mij gezondigd; Ik zal hun eer in schande veranderen.", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "1 Petr 4:18": "En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?", "Jer 8:2": "En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het hele heerleger van de hemel, die zij liefgehad hebben, en die zij gediend hebben, en die zij nagevolgd hebben, en die zij gezocht hebben, en voor wie zij zich neergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op de aardbodem zullen zij zijn.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Ezech 16:46": "Uw grote zuster nu is Samaria, zij en haar dochters, die woont aan uw linkerhand; maar uw zuster, die kleiner is dan u, die tegen uw rechterhand woont, is Sodom en haar dochters.", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "Ps 24:5": "die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "Joël 3:20": "Maar Juda zal blijven tot in eeuwigheid, en Jeruzalem van geslacht tot geslacht.", "Ps 147:11": "De HEERE schept vreugde in hen die Hem vrezen, die op Zijn goedertierenheid hopen.", "Jak 5:1-3": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Amos 2:4": "Zo zegt de HEERE: Om drie overtredingen van Juda, en om vier zal Ik dat niet afwenden; omdat zij de wet van de HEERE verworpen, en Zijn inzettingen niet bewaard hebben; en hun leugens hen verleid hebben, die hun vaders hebben nagevolgd.", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "Luk 16:1-8": "En Hij zei ook tegen Zijn discipelen: Er was een zeker rijk mens, die een rentmeester had; en deze werd bij hem beschuldigd, dat hij zijn goederen verkwistte. En hij riep hem en zei tegen hem: Hoe hoor ik dit van u? Geef rekenschap van uw rentmeesterschap; want u zult niet meer rentmeester kunnen zijn. En de rentmeester zei bij zichzelf: Wat zal ik doen, omdat mijn heer dit rentmeesterschap van mij afneemt? Graven kan ik niet; te bedelen schaam ik mij.", "Luk 1:66": "En allen die het hoorden namen het ter harte, en zeiden: Wat zal er toch van dit kind worden? En de hand van de Heere was met hem.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Deut 32:13": "Hij deed hem rijden op de hoogten van de aarde, zodat hij at van de opbrengsten van het veld; en Hij deed hem honing zuigen uit de steenrots, en olie uit de harde rots;", "Hos 5:1-3": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor. En zij die afwijken, verdiepen zich erin om te slachten; maar Ik zal hun allen een tuchtmeester zijn. Ik ken Efraïm, en Israël is voor Mij niet verborgen; want nu, Efraïm, hoereert u, en Israël is verontreinigd.", "Deut 29:24-28": "En alle volken zullen zeggen: Waarom heeft de HEERE dit land zo aangedaan? Wat betekent de gloed van deze grote toorn? Dan zal men zeggen: Omdat zij het verbond van de HEERE, de God van hun vaderen, verlaten hebben, dat Hij met hen gemaakt had, toen Hij hen uit Egypteland uitleidde; En zij heengegaan zijn, en andere goden gediend hebben en zich daarvoor gebogen hebben; goden, die zij niet gekend hadden, en die hun niets had toebedeeld;", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Micha 6:9": "De stem van de HEERE roept tot de stad (want Uw Naam ziet het wezen): Hoor de roede, en wie haar besteld heeft!", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Spr 3:23": "Dan zult u uw weg zeker gaan, en u zult uw voet niet stoten.", "Hos 5:4-6": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "Ezech 7:19": "Zij zullen hun zilver op de straten werpen, en hun goud zal tot onreinheid zijn; hun zilver en hun goud zal hen niet kunnen uithelpen ten dage van de verbolgenheid van de HEERE; hun ziel zullen zij niet verzadigen, en hun ingewanden zullen zij niet vullen; want het zal de aanstoot van hun ongerechtigheid zijn.", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "2 Kron 26:15": "Hij maakte ook te Jeruzalem kunstige werktuigen, bedacht door kunstige werkmeesters, om op de torens en op de hoeken te staan, om met pijlen en met grote stenen te schieten; zo ging zijn naam tot ver weg uit, want hij werd wonderlijk geholpen, totdat hij sterk was.", "1 Kor 12:13": "Want ook wij allen zijn door één Geest tot één lichaam gedoopt; hetzij Joden, hetzij Grieken, hetzij dienstknechten, hetzij vrijen; en wij zijn allen tot één Geest gedrenkt.", "Ps 115:13": "Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten.", "Jes 59:18": "Naar de werken, daarnaar zal Hij vergelden: grimmigheid aan Zijn tegenstanders, vergelding aan Zijn vijanden; aan de eilanden zal Hij het loon vergelden.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Joh 5:45": "Denk niet dat Ik u zal aanklagen bij de Vader; hij die u aanklaagt, is Mozes, op wie u gehoopt hebt.", "Ef 2:19": "Zo bent u dan niet meer vreemdelingen en bijwoners, maar medeburgers van de heiligen, en huisgenoten van God;", "Ps 45:9": "Al Uw kleren zijn mirre, en aloë, en kassie; uit de ivoren paleizen, van waar zij U verblijden.", "Fil 2:2": "Maak dan mijn blijdschap volkomen, dat u eensgezind bent, dezelfde liefde hebt, één van gemoed en één van gevoelen bent.", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Jes 19:2": "Want Ik zal de Egyptenaren tegen de Egyptenaren verwarren, zodat zij zullen strijden, ieder tegen zijn broeder, en ieder tegen zijn naaste, stad tegen stad, koninkrijk tegen koninkrijk.", "Hebr 5:11": "Over hem hebben wij veel te zeggen, en het is moeilijk uit te leggen, omdat u traag geworden bent om te horen.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Amos 4:4": "Kom naar Beth-el, en overtreed te Gilgal; maak veel van het overtreden, en breng uw offers 's morgens, uw tienden om de drie dagen!", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Ef 4:1": "Ik bid u dan, ik, de gevangene in de Heere, dat u wandelt op een manier die de roeping waard is waarmee u geroepen bent;", "Hos 7:1": "Terwijl Ik Israël genees, wordt Efraïms ongerechtigheid ontdekt, alsook de boosheden van Samaria; want zij werken valsheid; en de dief gaat er in, de bende van straatschenders plundert daarbuiten.", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Luk 8:17": "Want er is niets verborgen dat niet openbaar zal worden, en niets geheim dat niet bekend zal worden en aan het licht zal komen.", "Kol 1:25-27": "waarvan ik een dienaar geworden ben, naar de bedeling van God die mij gegeven is voor u, om het Woord van God te vervullen; namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen; aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "2 Petr 1:5-7": "En span daarom ook alle inspanning in om, naast uw geloof, ook deugd te voegen, en naast de deugd kennis, En naast de kennis matigheid, en naast de matigheid volharding, en naast de volharding godsvrucht, En naast de godsvrucht broederlijke liefde, en naast de broederlijke liefde, liefde jegens allen.", "Spr 29:4": "Een koning houdt het land staande door recht; maar wie tot geschenken geneigd is, verstoort het.", "Fil 1:3": "Ik dank mijn God, zo dikwijls als ik aan u denk.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Gal 6:2": "Draag elkaars lasten, en vervul zo de wet van Christus.", "Gen 31:38-40": "Deze twintig jaar ben ik bij u geweest; uw ooien en uw geiten hebben niet misdragen, en de rammen van uw kudde heb ik niet gegeten. Het verscheurde heb ik niet naar u toe gebracht; ik heb het zelf vergoed; u eiste het van mijn hand, of het nu overdag gestolen was, of 's nachts gestolen was. Ik ben zo geweest, dat overdag de hitte mij verteerde, en 's nachts de vorst, en dat mijn slaap van mijn ogen week.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "2 Kron 15:6": "Dat volk tegen volk, en stad tegen stad in stukken gestoten werden; want God had hen met allerlei angst verschrikt.", "Ex 33:12": "En Mozes zei tegen de HEERE: Zie, U zegt tegen mij: Voer dit volk op! maar U laat mij niet weten aan wie U met mij zult zenden; terwijl U gezegd hebt: Ik ken u bij naam! en ook: U hebt genade gevonden in Mijn ogen!", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Ps 22:27": "De zachtmoedigen zullen eten en verzadigd worden; zij zullen de HEERE prijzen, die Hem zoeken; uw hart zal in eeuwigheid leven.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "1 Tess 5:14": "En wij bidden u, broeders, vermaan de ongeregelde mensen, vertroost de kleinmoedigen, ondersteun de zwakken, wees geduldig tegenover allen.", "2 Tess 3:5": "Doch de Heere richte uw harten op de liefde van God, en op de lijdzaamheid van Christus.", "Hebr 10:26-30": "Want als wij willens en wetens zondigen, nadat wij de kennis van de waarheid ontvangen hebben, blijft er geen offer meer over voor de zonden; maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;", "Hos 5:1": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor.", "Jer 7:8-10": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Spr 29:8": "Spotters brengen een stad in vuur en vlam; maar de wijzen keren de toorn af.", "Amos 2:5": "Daarom zal Ik een vuur in Juda zenden, dat zal Jeruzalems paleizen verteren.", "Jer 17:11": "Zoals een veldhoen eieren verzamelt, maar ze niet uitbroedt, zo is hij die rijkdom verzamelt, maar niet met recht; in de helft van zijn dagen zal hij die moeten verlaten, en in zijn laatste dagen een dwaas zijn.", "Hebr 11:5": "Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming had hij het getuigenis dat hij God behaagde.", "Jak 5:3": "Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Jes 5:15": "Dan zal de gewone man neergebogen worden, en de aanzienlijke man zal vernederd worden, en de ogen van de hoogmoedigen zullen vernederd worden.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "Jes 43:28": "Daarom zal Ik de leiders van het heiligdom ontheiligen, en Jakob ten ban overgeven, en Israël tot beschimpingen.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Hand 18:6": "Maar toen zij hem weerstonden en lasterden, schudde hij zijn kleren af en zei tegen hen: Uw bloed zij op uw hoofd; ik ben rein; en van nu af aan zal ik naar de heidenen gaan.", "1 Kor 1:10": "Maar ik bid u, broeders, door de Naam van onze Heere Jezus Christus, dat u allen hetzelfde spreekt, en dat er onder u geen scheuringen zijn, maar dat u samengevoegd bent tot eenzelfde zin en tot eenzelfde gevoelen.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Matt 13:38-42": "En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze; En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Ps 41:13": "Want mij aangaande, U onderhoudt mij in mijn oprechtheid, en U stelt mij voor Uw aangezicht in eeuwigheid.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Dan 2:28": "Maar er is een God in de hemel, Die geheimen openbaart, Die de koning Nebukadnezar bekendgemaakt heeft wat er gebeuren zal in het laatste der dagen; uw droom en de visioenen van uw hoofd op uw bed zijn deze:", "Jer 8:20-22": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Spr 10:22": "De zegen van de HEERE, die maakt rijk; en Hij voegt er geen smart aan toe.", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Luk 13:3": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "1 Kon 17:19": "En hij zei tegen haar: Geef mij uw zoon. En hij nam hem van haar schoot, en droeg hem naar boven, naar de opperzaal, waar hij zelf woonde, en hij legde hem neer op zijn bed.", "Zef 1:7-18": "Zwijg voor het aangezicht van de Heere HEERE; want de dag van de HEERE is nabij; want de HEERE heeft een slachtoffer bereid, Hij heeft Zijn genode geheiligd. En het zal gebeuren in de dag van het slachtoffer van de HEERE, dat Ik bezoeking zal doen over de vorsten, en over de kinderen van de koning, en over allen die zich kleden met vreemde kleding. Ook zal Ik op diezelfde dag bezoeking doen over allen die over de drempel springen; die het huis van hun heren vullen met geweld en bedrog.", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "Job 4:8": "Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.", "Spr 11:13": "Wie als een achterklapper rondgaat, openbaart het geheime; maar wie trouw is van geest, bedekt de zaak.", "Klaagl 3:3": "Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Ef 3:12": "door wie wij de vrijmoedigheid hebben, en de toegang met vertrouwen, door het geloof aan Hem.", "Ps 78:27-32": "En Hij regende op hen vlees als stof, en gevleugeld gevogelte als zand van de zeeën; En liet het vallen in het midden van zijn leger, rondom zijn woningen. Toen aten zij, en werden zeer zat; zodat Hij hun hun lust toebracht.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Jer 22:8": "Dan zullen veel heidenvolken langs deze stad gaan, en zullen zeggen, ieder tegen zijn naaste: Waarom heeft de HEERE zo gedaan aan deze grote stad?", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Luk 21:1-4": "En toen Hij omhoogkeek, zag Hij de rijken hun gaven in de schatkist werpen. En Hij zag ook een zekere arme weduwe twee kleine penningen daarin werpen. En Hij zei: Waarlijk, Ik zeg u, dat deze arme weduwe meer dan allen heeft ingeworpen.", "Job 10:14": "Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden.", "Openb 16:2-21": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden. En de tweede engel goot zijn schaal uit in de zee, en zij werd bloed als van een dode; en elke levende ziel in de zee stierf. En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed.", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Neh 9:27-37": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten. Maar toen zij rust hadden, keerden zij weer terug om kwaad te doen voor Uw aangezicht; toen verliet U hen in de hand van hun vijanden, zodat zij over hen heersten; en toen zij zich dan bekeerden, en U aanriepen, hebt U hen vanuit de hemel gehoord, en hebt hen naar Uw barmhartigheden vele malen uitgered. En U hebt tegen hen getuigd, om hen te doen terugkeren tot Uw wet; maar zij hebben trots gehandeld, en niet geluisterd naar Uw geboden, en tegen Uw rechten gezondigd, waardoor een mens, als hij ze doet, zal leven; en zij hebben hun schouder teruggetrokken, en hun nek verhard, en niet geluisterd.", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "Ezech 37:22": "En Ik zal ze maken tot één volk in het land, op de bergen van Israël; en zij zullen allen samen één Koning als koning hebben; en zij zullen niet meer twee volken zijn, en voortaan ook niet meer in twee koninkrijken verdeeld zijn.", "Deut 30:18": "zo verkondig ik u heden, dat u voorzeker zult omkomen; u zult de dagen niet verlengen op het land, waar u de Jordaan naar overtrekt om erin te komen, om het erfelijk te bezitten.", "Ps 11:7": "Want de HEERE is rechtvaardig, Hij heeft gerechtigheden lief; Zijn aangezicht aanschouwt de oprechte.", "Ezech 22:29": "Het volk van het land pleegt enkel verdrukking en bedrijft enkel roverij, ook onderdrukken zij de ellendige en de arme, en de vreemdeling verdrukken zij zonder recht.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "Klaagl 3:24": "Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen.", "Fil 2:1": "Als er dan enige vertroosting is in Christus, als er enige troost van de liefde is, als er enige gemeenschap van de Geest is, als er enige innerlijke bewegingen en ontfermingen zijn;", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Jer 8:19": "Zie, de stem van het geschrei van de dochter van mijn volk klinkt uit een zeer ver land: Is de HEERE dan niet in Sion, is haar Koning niet bij haar? Waarom hebben zij Mij vertoornd met hun gesneden beelden, met de nietige afgoden van de vreemden?", "Hand 4:33": "En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ps 132:14": "Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd.", "Rom 2:5-12": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God. Die ieder zal vergelden naar zijn werken: Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "1 Sam 26:20": "En nu, laat mijn bloed niet op de aarde vallen, ver van het aangezicht van de HEERE; want de koning van Israël is uitgegaan om een enkele vlo te zoeken, zoals men een veldhoen op de bergen najaagt.", "Jer 13:21": "Wat zult u zeggen, wanneer Hij u bezoeking laat overkomen, terwijl u hen geleerd hebt tot vorsten, tot een hoofd over u te zijn; zullen de smarten u niet aangrijpen, als een barende vrouw?", "Jes 8:4": "Want voordat dat jongetje kan roepen: Mijn vader! of: mijn moeder!, zal men de rijkdom van Damaskus en de buit van Samaria wegdragen voor de koning van Assur.", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "Ps 88:19": "U hebt vriend en metgezel ver van mij weggedaan; mijn bekenden zijn in duisternis.", "Lev 26:31-39": "En Ik zal uw steden een woestijn maken, en uw heiligdommen verwoesten; en Ik zal uw liefelijke geur niet ruiken. Ja, Ik zal dat land verwoesten; zodat uw vijanden, die daarin zullen wonen, zich daarover ontzetten zullen. Daartoe zal Ik u onder de heidenen verstrooien; en een zwaard achter u trekken; en uw land zal woest zijn, en uw steden zullen een woestijn zijn.", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Ps 12:6": "Om de verwoesting van de ellendigen, om het kermen van de behoeftigen, zal Ik nu opstaan, zegt de HEERE; Ik zal in veiligheid zetten wie ernaar snakt.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "Luk 24:17": "En Hij zei tegen hen: Wat zijn dit voor gesprekken die u onderweg met elkaar voert, en waarom kijkt u zo droevig?", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Jer 22:9": "En zij zullen zeggen: Omdat zij het verbond van de HEERE, hun God, hebben verlaten, en zich voor andere goden hebben neergebogen, en die gediend.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Job 34:11": "Want naar het werk van de mens vergeldt Hij hem, en naar ieders weg doet Hij het hem vinden.", "Ezech 21:25": "En u, o onheilige, goddeloze vorst van Israël, wiens dag komen zal, in de tijd van de uiterste ongerechtigheid;", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Deut 4:7": "Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "Micha 6:16": "Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Job 19:6": "Weet dan, dat God mij heeft omgekeerd, en mij met Zijn net omsingeld heeft.", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Matt 11:29": "Neem Mijn juk op u, en leer van Mij, dat Ik zachtmoedig ben en nederig van hart; en u zult rust vinden voor uw zielen.", "2 Kron 24:19": "Toch zond Hij profeten onder hen, om hen tot de HEERE te doen terugkeren; die waarschuwden hen, maar zij luisterden niet.", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Joh 17:11": "En Ik ben niet meer in de wereld, maar dezen zijn in de wereld, en Ik kom tot U, Heilige Vader, bewaar hen in Uw Naam, die U Mij gegeven hebt, opdat zij één zijn, zoals Wij.", "Ezech 22:27": "Haar vorsten zijn in haar midden als wolven die een prooi roven, om bloed te vergieten en om zielen te verderven, opdat zij gierigheid zouden plegen.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "1 Tim 3:16": "En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "2 Kron 12:1": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Ezech 14:1-14": "Daarna kwamen er tot mij mannen uit de oudsten van Israël, en zij gingen voor mijn aangezicht zitten. Toen kwam het woord van de HEERE tot mij en Hij zei: Mensenkind, deze mannen hebben hun drekgoden in hun hart opgezet, en hebben de aanstoot van hun ongerechtigheid recht voor hun aangezicht gezet; zou Ik dan werkelijk door hen geraadpleegd worden?", "Jes 65:3": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;", "Spr 29:2": "Als de rechtvaardigen groot worden, verblijdt het volk zich; maar als de goddeloze heerst, zucht het volk.", "Ps 55:15": "Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "2 Tim 2:24": "En een dienstknecht van de Heere moet niet twisten, maar vriendelijk zijn tegen allen, bekwaam om te leren, en in staat om kwaad te verdragen;", "Ps 49:21": "De mens, die in aanzien is, en geen verstand heeft, wordt gelijk aan de dieren, die vergaan.", "Hand 5:20": "Ga heen, en sta, en spreek in de tempel tot het volk al de woorden van dit leven.", "1 Kon 13:20": "En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;", "Ef 4:2": "Met alle nederigheid en zachtmoedigheid, met geduld, terwijl u elkaar verdraagt in liefde;", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "1 Kon 13:2-5": "En hij riep tegen het altaar, door het woord van de HEERE, en zei: Altaar, altaar, zo zegt de HEERE: Zie, er zal aan het huis van David een zoon geboren worden, wiens naam Josia zal zijn; die zal op u de priesters van de hoogten offeren, die op u roken, en men zal mensenbeenderen op u verbranden. En hij gaf op dezelfde dag een wonderteken, en zei: Dit is het wonderteken waarvan de HEERE gesproken heeft: Zie, het altaar zal vaneen scheuren, en de as die erop ligt, zal eraf gestort worden. Het gebeurde nu, toen de koning het woord van de man van God hoorde, dat hij tegen het altaar te Beth-el geroepen had, dat Jerobeam zijn hand van het altaar uitstrekte en zei: Grijpt hem! Maar zijn hand die hij tegen hem uitgestrekt had, verdorde, zodat hij ze niet meer naar zich toe kon trekken.", "2 Sam 22:20": "En Hij voerde mij uit in de ruimte, en rukte mij eruit, want Hij had lust aan mij.", "Dan 10:21": "Doch Ik zal u bekendmaken wat opgetekend is in het geschrift van de waarheid; en er is niemand die zich met Mij sterk maakt tegen dezen, dan uw vorst Michaël.", "Job 34:29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Num 23:21": "Hij ziet geen ongerechtigheid in Jakob; ook ziet Hij geen boosheid in Israël. De HEERE, zijn God, is met hem, en het geschal van de Koning is bij hem.", "Pred 5:7": "Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.", "Jak 2:12": "Spreek zo, en doe zo, als mensen die door de wet van de vrijheid geoordeeld zullen worden.", "2 Kon 2:9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "Zach 8:10": "Want vóór die dagen kwam het loon van de mens tot niets, en het loon van het vee was er niet; en de uitgaande en de inkomende hadden geen vrede vanwege de vijand, want Ik zond alle mensen, ieder tegen zijn naaste.", "Ef 1:9": "Ons bekendgemaakt hebbend het geheimenis van Zijn wil, naar Zijn welbehagen, dat Hij voorgenomen had in Zichzelf.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Richt 3:20": "En Ehud kwam bij hem binnen, terwijl hij zat in een koele bovenzaal, die hij voor zich alleen had; zo zei Ehud: Ik heb een woord van God aan u. Toen stond hij op van de stoel.", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "Hos 12:12-15": "Zeker is Gilead ongerechtigheid, zij zijn enkel ijdelheid; te Gilgal offeren zij ossen, ja, hun altaren zijn als steenhopen op de voren van de velden. Jakob vluchtte toch naar het veld van Syrië, en Israël diende om een vrouw, en hoedde de kudde om een vrouw. Maar de Heere voerde Israël op uit Egypte door een profeet, en door een profeet werd hij behoed.", "Jes 1:29-31": "Want zij zullen beschaamd worden om de eiken, die u begeerd hebt, en u zult schaamrood worden, om de hoven, die u verkozen hebt. Want u zult zijn als een eik, waarvan de bladeren afvallen, en als een hof, die geen water heeft. En de sterke zal worden tot grof vlas, en zijn werkmeester tot een vonk, en zij zullen beide samen branden, en er zal geen uitblusser zijn.", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "Ps 24:4": "Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert;", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "2 Petr 3:5": "Want willens en wetens is dit hun onbekend, dat door het woord van God de hemelen er van oudsher geweest zijn, en de aarde ontstaan is uit het water en door het water in stand blijft;", "Spr 17:26": "Het is niet goed, de rechtvaardige te straffen, laat staan dat men vorsten zou slaan om wat recht is.", "Hand 20:21": "Terwijl ik zowel Joden als Grieken heb betuigd de bekering tot God en het geloof in onze Heere Jezus Christus.", "Matt 5:5": "Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "Hos 13:1-4": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven. En nu gaan zij voort met zondigen, en hebben zich van hun zilver een gegoten beeld gemaakt, afgoden naar hun eigen inzicht, die allemaal het werk van smeden zijn; waarvan zij toch zeggen: De mensen die offeren, zullen de kalveren kussen. Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.", "Job 32:18": "Want ik ben vol woorden; de geest in mijn binnenste benauwt mij.", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Job 39:27": "Met schudding en beroering slokt het de aarde op, en gelooft niet, dat het is het geluid van de bazuin.", "Micha 6:3": "O Mijn volk! Wat heb Ik u gedaan, en waarmee heb Ik u vermoeid? Getuig tegen Mij.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Ps 115:12": "De HEERE is aan ons indachtig geweest, Hij zal zegenen; Hij zal het huis van Israël zegenen, Hij zal het huis van Aäron zegenen.", "Joh 9:41": "Jezus zei tegen hen: Als u blind was, zou u geen zonde hebben; maar nu zegt u: Wij zien; daarom blijft uw zonde.", "Pred 4:13": "Beter is een arme en wijze jongeman, dan een oude en dwaze koning, die niet meer weet zich te laten vermanen.", "Micha 6:4": "Zeker heb Ik u uit Egypteland opgevoerd, en u uit het diensthuis verlost; en Ik heb voor uw aangezicht Mozes, Aäron en Mirjam heen gezonden.", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de
