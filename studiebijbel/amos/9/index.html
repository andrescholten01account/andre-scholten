t Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.","7":"Bent u voor Mij niet als de kinderen van de Moren, o kinderen van Israël? spreekt de HEERE. Heb Ik Israël niet opgevoerd uit het land Egypte, en de Filistijnen uit Kafthor, en de Syriërs uit Kir?","8":"Zie, de ogen van de Heere HEERE zijn tegen dit zondige koninkrijk, zodat Ik het van de aardbodem verdelg; behalve dat Ik het huis van Jakob niet helemaal zal verdelgen, spreekt de HEERE.","9":"Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.","10":"Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.","11":"Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;","12":"Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.","13":"Zie, de dagen komen, spreekt de HEERE, dat de ploeger de maaier zal bereiken, en de druiventreder de zaadzaaier; en de bergen zullen van zoete wijn druipen, en alle heuvels zullen smelten.","14":"En Ik zal de gevangenschap van Mijn volk Israël omkeren, en zij zullen de verwoeste steden herbouwen en bewonen, en wijngaarden planten, en daarvan de wijn drinken; en zij zullen tuinen maken, en daarvan de vrucht eten.","15":"En Ik zal ze in hun land planten; en zij zullen niet meer worden weggerukt uit hun land, dat Ik hun gegeven heb, zegt de HEERE, uw God."},"SV":{"1":"Ik zag den Heere staan op het altaar, en Hij zeide: Sla dien knoop, dat de posten beven, en doorkloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; en vliedende zal onder hen niet ontvlieden, noch de ontkomende onder hen behouden worden.","2":"Al groeven zij *tot* in de hel, zo zal Mijn hand ze van daar halen, en al klommen zij in den hemel, zo zal Ik ze van daar doen nederdalen.","3":"En al verstaken zij zich op de hoogte van Karmel, zo zal Ik ze naspeuren en van daar halen; en al verborgen zij zich van voor Mijn ogen in den grond van de zee, zo zal Ik van daar een slang gebieden, die zal ze bijten.","4":"En al gingen zij in gevangenis voor het aangezicht hunner vijanden, zo zal Ik van daar het zwaard gebieden, dat het hen dode; en Ik zal Mijn oog tegen hen zetten ten kwade, en niet ten goede.","5":"Want de Heere HEERE der heirscharen is het, Die het land aanroert, dat het versmelte, en allen, die daarin wonen, treuren; en *dat* het geheel oprijze als een rivier, en verdronken worde als *door* de rivier van Egypte.","6":"Die Zijn opperzalen in den hemel bouwt, en Zijn benden heeft Hij op aarde gefondeerd; Die de wateren der zee roept, en giet ze uit op den aardbodem; HEERE is Zijn Naam.","7":"Zijt gijlieden Mij niet als de kinderen der Moren, o kinderen Israëls? spreekt de HEERE. Heb Ik Israël niet opgevoerd uit Egypteland, en de Filistijnen uit Kafthor, en de Syriërs uit Kir?","8":"Ziet, de ogen des Heeren HEEREN zijn tegen dit zondig koninkrijk, dat Ik het van den aardbodem verdelge; behalve dat Ik het huis Jakobs niet ganselijk zal verdelgen, spreekt de HEERE.","9":"Want ziet, Ik geef bevel, en Ik zal het huis Israëls onder al de heidenen schudden, gelijk als *zaad* geschud wordt in een zeef; en niet een steentje zal er ter aarde vallen.","10":"Alle zondaars Mijns volks zullen door het zwaard sterven; die daar zeggen: Het kwaad zal tot ons niet genaken, noch *ons* voorkomen.","11":"Te dien dage zal Ik de vervallen hut van David weder oprichten, en Ik zal haar reten vertuinen, en wat aan haar is afgebroken, weder oprichten, en zal ze bouwen, als *in* de dagen van ouds;","12":"Opdat zij erfelijk bezitten het overblijfsel van Edom, en al de heidenen, die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.","13":"Ziet, de dagen komen, spreekt de HEERE, dat de ploeger den maaier, en de druiventreder den zaadzaaier genaken zal; en de bergen zullen van zoeten wijn druipen, en al de heuvelen zullen smelten.","14":"En Ik zal de gevangenis van Mijn volk Israël wenden, en zij zullen de verwoeste steden herbouwen en bewonen, en wijngaarden planten, en derzelver wijn drinken; en zij zullen hoven maken, en derzelver vrucht eten.","15":"En Ik zal ze in hun land planten; en zij zullen niet meer worden uitgerukt uit hun land, dat Ik hunlieden gegeven heb, zegt de HEERE, uw God."},"KJV":{"1":"I saw the Lord standing upon the altar: and he said, Smite the lintel of the door, that the posts may shake: and cut them in the head, all of them; and I will slay the last of them with the sword: he that fleeth of them shall not flee away, and he that escapeth of them shall not be delivered.","2":"Though they dig into hell, thence shall mine hand take them; though they climb up to heaven, thence will I bring them down:","3":"And though they hide themselves in the top of Carmel, I will search and take them out thence; and though they be hid from my sight in the bottom of the sea, thence will I command the serpent, and he shall bite","4":"And though they go into captivity before their enemies, thence will I command the sword, and it shall slay them: and I will set mine eyes upon them for evil, and not for good.","5":"And the Lord GOD of hosts *is* he that toucheth the land, and it shall melt, and all that dwell therein shall mourn: and it shall rise up wholly like a flood; and shall be drowned, as *by* the flood of Egypt.","6":"*It is* he that buildeth his stories in the heaven, and hath founded his troop in the earth; he that calleth for the waters of the sea, and poureth them out upon the face of the earth: The LORD *is* his name.","7":"*Are* ye not as children of the Ethiopians unto me, O children of Israel? saith the LORD. Have not I brought up Israel out of the land of Egypt? and the Philistines from Caphtor, and the Syrians from Kir?","8":"Behold, the eyes of the Lord GOD *are* upon the sinful kingdom, and I will destroy it from off the face of the earth; saving that I will not utterly destroy the house of Jacob, saith the LORD.","9":"For, lo, I will command, and I will sift the house of Israel among all nations, like as *corn* is sifted in a sieve, yet shall not the least grain fall upon the earth.","10":"All the sinners of my people shall die by the sword, which say, The evil shall not overtake nor prevent","11":"In that day will I raise up the tabernacle of David that is fallen, and close up the breaches thereof; and I will raise up his ruins, and I will build it as in the days of old:","12":"That they may possess the remnant of Edom, and of all the heathen, which are called by my name, saith the LORD that doeth","13":"Behold, the days come, saith the LORD, that the plowman shall overtake the reaper, and the treader of grapes him that soweth seed; and the mountains shall drop sweet wine, and all the hills shall melt.","14":"And I will bring again the captivity of my people of Israel, and they shall build the waste cities, and inhabit *them*; and they shall plant vineyards, and drink the wine thereof; they shall also make gardens, and eat the fruit","15":"And I will plant them upon their land, and they shall no more be pulled up out of their land which I have given them, saith the LORD thy God."}},"tsk":{"1":[{"kopje":"Ik zag","refs":["2 Kron 18:18","Jes 6:1","Ezech 1:28","Joh 1:18","Joh 1:32","Hand 26:13","Openb 1:17"]},{"kopje":"op","refs":["Amos 3:14","Ezech 9:2","Ezech 10:4"]},{"kopje":"Sla","refs":["Jes 6:3","Jes 6:4","Zach 11:1","Zach 11:2"]},{"kopje":"kloof ze","refs":["Ps 68:22","Hab 3:13"]},{"kopje":"zal niet ontkomen","refs":["Amos 2:14","Amos 2:15","Jes 24:17","Jes 24:18","Jes 30:16","Jer 48:44"]}],"2":[{"kopje":"groeven","refs":["Job 26:6","Ps 139:7-10","Jes 2:19"]},{"kopje":"klommen","refs":["Job "tekst":"Of, heir, heirtocht, troep, dicht samengevoegde hoop, gelijk 2Sa 2:25 , of bundel, waardoor men bekwamelijk kan verstaan alle schepselen Gods, die Hij als in een bundel of op een troep samengebonden gereed huodt, om overal en voornamelijk op aarde zijnen wil te verrichten. Verg. Gen 2:1 ; 1Ki 18:15 , met de aantekening."},{"catchword":"op aarde gefondeerd;","tekst":"Anders: boven, verstaande door het bundeltje de elementen, waarvan de aarde als een grondvest is."},{"catchword":"roept,","tekst":"Zie Amo 5:8 ."},{"catchword":"aardbodem;","tekst":"Hebr. aangezicht der aarde."}],"7":[{"catchword":"Moren,","tekst":"Hebr. Cuschiim. God wil zeggen dat Hij Israël wel boven andere volken uir genade verheven had, [ Amo 3:2 ] , maar dat zij van zichzelven en ten aanzien hunner goddeloosheid en ondankbaarheid nu niet beter en waardiger voor hem waren dan de verachte en vervloekte nakomelingen van Cusch, den zoon van Cham; Gen 10:6 ."},{"catchword":"Heb Ik Israël niet opgevoerd uit Egypteland,","tekst":"Alsof de Heere zeide: Ik heb u [het is waar] uit de slavernij van Egypte verlost en Kanaän ingegeven, maar gij weet mij daarvoor zo weinig dank, als de Filistijnen en Syriërs, die Ik uit Kaftor en Kir heb uitgevoerd. Of, de Heere wil zeggen dat Hij de verlossing van Israël, vermits hunne ondankbaarheid nu niet meer acht, dan of Hij een hoop heidenen, gelijk Moren en Syriërs, verlost had."},{"catchword":"Kafthor,","tekst":"Zie Gen 10:14 , alwaar de Filistijnen en Kaftorim gesteld worden onder de nakomelingen van Mizraim, den zoon van Cham, Gen 10:6 , en verg. wijders Deu 2:23 , en Jer 47:4 , met de aantekening."},{"catchword":"Syriërs","tekst":"Hebr. Aram; dat is, Syrië, en voorts de Syriërs. Zie Gen 10:22 ."},{"catchword":"Kir?","tekst":"Zie 2Ki 16:9 , en Amo 1:5 , alwaar gezegd wordt dat de Syriërs naar Kir gevankelijk zouden worden weggevoerd. Hier schijnt gesproken te worden van hunne verlossing uit Kir, waarvan elders niet vermeld wordt, gelijk bij de profeten versch ord":"hare reten toemuren,","tekst":"De hut van David."},{"catchword":"wat aan haar is afgebroken,","tekst":"Hebr. hare afbrekingen, verstroringen; dat is, puin, gebroken steen, kalkscherven, gruis, enz."}],"12":[{"catchword":"zij erfelijk bezitten","tekst":"Het geestelijk Israël, mijne kerk, waarvan Christus het hoofd is."},{"catchword":"overblijfsel van Edom,","tekst":"Dat is, alle uitverkorenen uit de heidenen, zelfs uit de allervijandelijkste, afgebeeld door Edom, die door de predikatie van het Evangelie en werking van den Heiligen Geest zullen gebracht worden onder de gehoorzaamheid van Christus en tot de gemeenschap zijner kerk. Zie Isa 19:25 ."},{"catchword":"naar Mijn Naam genoemd worden,","tekst":"Hebr. over welken mijn naam is, of wordt uitgeroepen, of genoemd. Zie deze manier van spreken, Isa 4:1 , en Jer 7:10 , met de aantekening. De zin is: Welke heidenen Ik tot mijn volk en kinderen zal aannemen, en tot mijn gemeenschap beroepen, waarvan zij blijde belijdenis zullen doen; verg. Isa 44:5 ; Hos 1:10 , en Hos 2:22 ; Act 2:39 ; Rom 9:25 , enz."}],"13":[{"catchword":"zaadzaaier genaken zal;","tekst":"Hebr. trekt, of dien die het zaad trekt, of voortstrekt; dat is, al trekkende in de aarde werpt, of uit den zak trekt, haalt om te zaaien; zie Psa 126:6 . De zin is: Daar zal overvloed van alles zijn. Zie Lev 26:5 , waardoor de rijkdom en overvloed der geestelijke genade en zegeningen onder het rijk van Christus wordt afgebeeld. Verg. Hos 2:14 , Hos 2:20-21 , met de aantekening."},{"catchword":"bergen zullen van zoeten wijn druipen,","tekst":"Zie Joe 3:18 ."},{"catchword":"smelten","tekst":"Dat is, zullen schijnen te smelten, door het overvloedig uitgeven van wijn, melk, olie, enz., alsof zij daarvan vloeiden."}],"14":[{"catchword":"gevangenis van Mijn volk Israël wenden,","tekst":"Uit de geestelijke gevangenschap en macht van den satan, verlossen door den Heiland Christus."},{"catchword":"herbouwen en bewonen,","tekst":"Verg. Isa 65:21-22 , enz."}],"15":[{"catchword":"land planten;","tekst":"In mijne kerk, strijdende en triomferende, het hemels Kanaän."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"I saw the LORD [viz in a vision, wherein God showed unto the Prophet, that he would not spare his own temple, temple worship, Priests and heads of the people, but would go on and execute his judgements cap a pe, as they say, from the highest to the lowest] stand, [Heb. put, set, or standing] upon the Altar: [ understand that of the burnt-offerings (according to most opinions) whereby God intimated, that he stood upon parting or removing. Compare Ezek. 10. 4. though others hold it to be meant of the idolatrous Temples and Altars of Israel, as at Bethel, Dan, &c. If so be that the Prophet was indeed fain to fly into the land of Juda, according to what is here related above chap. 7. 12. it may well be that this vision was showed him there, towards the Temple of Solomon : others conceive, the Prophet never fled for it, from chap. 7. 15.] and he said; [viz. the LORD unto an Angel, that was to execute his judgement; or, unto the Prophet himself. Compare Eze. 9. 1, &c. & 43. 3.] Smite that Button [or, apple, pome-granate, that may have stood above on the top of the Temple, or Portal, as is otherwise usual in such magnificent structures] that the posts may shake, [or, the thresholds, to show, that God would ruin and raise all down to the ground, from the top to the bottom] and cleave them all through the head; [Oth. Wound them, which are the head of all i.e. the chief and principal ones,] and I will slay their hindmost [ hereby some understand the rest of the common people. Oth. The residue, or remnant, posterity. See Psal. 37. on vers. 37.] with the sword; [viz. of the Babylonians and Assyrians] the fleeing among them [or, with or of them] shall not flee away, nor the escaping among them be saved. [i.e. they that think to save themselves by flight, or, such as otherwise used to shift away and make their escape, they shall not be able to do it now; and so in the sequel. See above chap. 1. 14, 15, 16. and chap. 5. 19.]"}],"2":[{"catchword":null,"tekst":"Though they digged into hell [See Job 16. 6. Psal. 139. 8. with the annotate. By this and the two following verses, the LORD doth intimate, that they shall not be able to escape his punishing hand in any place whatsoever, in regard that with his being, Almighty Power and Government, he is always everywhere present] my hand shall fetch them hence: and though they mounted up into heaven, I shall cause them to come down thence."}],"3":[{"catchword":null,"tekst":"And though they should hide themselves on the top of Carmel; [See 2 Kin 19. on vers. 23. Heb.head of Carmel] I shall trace them and fetch them thence, [Heb. take them & c. See Jer. 37. on vers. 17.] and though they should hide themselves from before mine eyes [imagining I should not be able to see and find them out] in the bottom of the sea, I shall command a serpent thence, which shall bite them. [i.e. I shall so order and dispose it by my providence, that it shall do, as if it were by express charge and command. See Lev. 25. 21. and compare 2 Kin. 18. 25. with the annotate and so in the sequel, of the sword verse 4. of the calling of the waters. Vers. 6.]"}],"4":[{"catchword":null,"tekst":"And though they should go into captivity before the face of their enemies, [Meaning at least by that means, to have past the danger of perishing by the sword] I shall command the sword thence, to slay them. And I will set mine eye against them for evil and not for good. [See Jer. 24. on vers. 6. and compare Lev. 17. 10. and Jer. 44. 11, with the annotate]"}],"5":[{"catchword":null,"tekst":"For the Lord LORD of hosts [The Prophet further confirmeth this prophecie by the describing the Power and the Majesty of God the author thereof, lest they should imagine it an impossible thing for him to make it good by the aforesaid execution. Compare above cha. 4. 13. and chap. 5. 8, 9.] is he who toucheth [or, shall touch &c.] the Land, i.e. if he do but touch a sinful Land with his punishing hand or finger, etc. Compare Psal. 39. 12. with the annot.] that it melteth, and all that dwell therein mourn: and (that) it [ to wit, the Land. See above chap 8. on vers. 8.] rise up altogether like a River, and be drowned, as (by) the River of Egypt."}],"6":[{"catchword":null,"tekst":"That buildeth his upper-rooms in Heaven, [Compare Psal. 104. vers. 3. 13. with the annotate. Heb. stairs, or ascents, degrees; whereby one body goeth up into the upper-rooms, or chambers] and his Troop [or, host, Army, close joined company, as 2 Sam. 2. 25. or bundle; whereby one may not unfitly understand all the creatures of God, whom he keeps, as it were, in a bundle, or small Troop close together, to be always ready and at hand, everywhere, and especially on earth, to perform his will and pleasure. Compare gen. 2. 1. 1 Kings 18. 15. with the annotate.] the same he hath founded on earth: [Oth. Above, understanding by the word bundle the Elements whereof the earth is as the foundation] that calleth the waters of the seas, [ See above chap. 5. on vers. 8.] and poureth them forth upon the ground of the earth, [Heb. face of &c.] LORD is his Name."}],"7":[{"catchword":null,"tekst":"Are ye not unto me as the children of the Moores [ Heb. Cuschjim] O children of Israel, saith the LORD: [implying, that he had indeed exalted Israel, of his grace above other Nations, above chap. 3. 2. but that of themselves, and in regard of their wickedness and unthankfulness, they were now no better or more to be valued in his sight, then the contemptible and accursed posterity of church, the son of the Cham. See Gen. 10. 6.] Have not I brought forth Israel out of the land of Egypt, and the Philistines out of Caphtor [see Gen. 18. v. 14. where the Philistines and Caphtorim are put among the posterity of Mitzraim the son of Cham. Gen. 10. 8. and compare further, deut. 2. 23 & Jer. 47. 4. with the annot.] and the Syrians [Heb. aram that is, Syria, and consequently the Syrians. See Gen. 10, on vers. 22.] out of Kir? [see 2 Kings 16. on vers. 9. and above chap. 1. 5. where it is said that the Syrians should be carried away captive unto Kir. Here it should seem, speech is of their being delivered out of Kir; whereof there is no other mention made elsewhere; as indeed divers histories are to be hand in the prophets, which though no where else related in Scripture, were well enough known in their times. The sense of all is, as if the LORD should say, It is true indeed I did deliver you out of bondage of Egypt, and possess you of the land of Canaan, but ye are as little thankful to me for it, as the Philistines and Syrians, for my having delivered them out of Kir and Caphtor: or the LORD implies, that by reason of Israels unthankfulness, he looked no otherwise now upon their deliverance, then if he had delivered so many heathen people as Moores, Syrians & c.]"}],"8":[{"catchword":null,"tekst":"Behold the eyes of the lord LORD, [i.e. mine eyes: see above vers. 4.] are against this sinful Kingdom, [i.e. wholly given up to sin. See Psal. 1. on vers. 1. This seemeth to have regard to Israel or the ten Tribes and Juda together, both their Kingdoms being destroyed. Some take it thus; against a sinful Kingdom etc. but with Jacob I will deal more favourably then with others. See Jer. 30. 11.] to destroy it from the earth: [Heb. face of the earth] but that I will not wholly destroy,[ Heb. destroying destroy] the house of Jacob, [saving a remnant of grace, and blessing the same singularly, as followeth vers. 11, &c.] saith the LORD."}],"9":[{"catchword":null,"tekst":"For, so, I give command, [See above chap. 6. 11.] and I will shake the house of Israel among all the Heathens; even as (seed) is shaken in a sieve; [or, fanne] and [or, but, yet] not a little stone shall fall on the ground. [i.e. nothing of any weight or substance, but only the light and paltry chaff: the likeness is taken from the small stones which now and then are found among the corn. Oth. Small grains, as if he had said; I will so shake them all, that none of mine elect ( compared with the wheat) shall come to be lost.]"}],"10":[{"catchword":null,"tekst":"All sinners of my people [ see above vers. 8. and Psal. 1 vers. 1.] shall die by the sword: they that say; The evil [ viz. of punishment] Shall not come near [or about] us, nor come before (us)[ or, surprise, occur, meet us. Compare above chap. 5. 18. and 6. 3. with the annot.]."}],"11":[{"catchword":null,"tekst":"On that day [ i.e. after the foresaid destruction &c.] will I set again the decayed Tabernacle of David: [i.e. then will I restore the Kingdom of David, changing the same into a spiritual and everlasting Kingdom, under the same Messiah. See Act. 15. vers. 16, 7. whence it doth plainly appear that this and the like prophesies must be understood spiritually] and I will hedge up the gaps thereof, [viz. of the Tabernacle of David] and set up again that which is broken down of her, [Heb. its breakings down, destructions, i.e. Rubbish, broken stones, mortar, ruins,] and will build them, as (in) the days of old."}],"12":[{"catchword":null,"tekst":"That they may hereditarily possess, [They viz. the spiritual Israel, my church, whereof Christ is the head] the remnant of Edom and all the Heathen, [i.e. all the chosen Gentiles, even some of their greatest enemies typified by Edom, who should be brought under the obedience of Christ, and to the Communion of his church, by the Preaching of the Gospel and operation of the holy Ghost. See Isa. 19. 25.] which are called after my Name: [ Heb. upon whom is called. See of this phrase, Isa. 4. 1. and Jer. 7. 10. with annotat. The sense is, which heathen people I will take in to be my people and children, and call them to have Communion with me, whereof they shall make a cheerful profession. Compare Isa. 44. 5. Hos. 1. 10. and chap. 2. 22. Act. 2. 39. Rom 9. 25, & c.]] saith the LORD that doth this."}],"13":[{"catchword":null,"tekst":"Behold the days come, saith the LORD; that the plowman shall reach to the reaper, and the grape presser unto the seed-sower: [ Heb. the drawer or, him that draws, or, holds forth the seed i.e. drawing throws it into the ground; or, draws it forth out of the sack, for to sow. See Psal. 126. 6. The meaning is, there shall be plenty of all things. See Lev. 26. 5. whereby the riches and abundance of spiritual gifts and blessings in Christs kingdom are typified. Compare Hos. 2.14, 20, 21. with the annotate.] and the mountain shall drop with sweet wine, [see Joel 3 on verse 18.] and all the hills shalt melt [i.e. seem to melt, through the abundant bringing forth of wine, milk, oil &c as if they flowed with them.]"}],"14":[{"catchword":null,"tekst":"And I will turn the captivity and power of satan, by their Saviour Christ] and they shall rebuild and inhabit the desolate cities, [compare Isa. 65.21, 22, c] and plant vine yards, and drink the wine thereof: and they shall make gardens, and eat the fruit thereof."}],"15":[{"catchword":null,"tekst":"And I will plant them in their land, [i.e. in my church, both the military here and the triumphant thereafter, the Celestial Canaan] and they shall no more be pulled up out of their land, that I have given them saith the Lord thy God."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

  if (!k) return;

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
