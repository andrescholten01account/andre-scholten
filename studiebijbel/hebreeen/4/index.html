m hoort, verhard dan uw harten niet.","8":"Want als Jozua hen in de rust gebracht had, zou Hij daarna niet gesproken hebben van een andere dag.","9":"Er blijft dan een rust over voor het volk van God.","10":"Want wie in Zijn rust is ingegaan, heeft zelf ook van zijn werken gerust, zoals God van de Zijne.","11":"Laat ons ons dan beijveren om die rust in te gaan, opdat niemand in hetzelfde voorbeeld van ongehoorzaamheid valt.","12":"Want het Woord van God is levend en krachtig, en scherper dan enig tweesnijdend zwaard, en gaat door tot de verdeling van ziel en geest, en van de gewrichten en het merg, en is een beoordelaar van de gedachten en overleggingen van het hart.","13":"En er is geen schepsel onzichtbaar voor Hem; maar alle dingen zijn naakt en geopend voor de ogen van Hem, met Wie wij te maken hebben.","14":"Omdat wij dan een grote Hogepriester hebben, Die door de hemelen heen gegaan is, namelijk Jezus, de Zoon van God, laat ons deze belijdenis vasthouden.","15":"Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, *doch* zonder zonde.","16":"Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben."},"SV":{"1":"Laat ons dan vrezen, dat niet te eniger tijd, de belofte van in Zijn rust in te gaan nagelaten zijnde, iemand van u schijne achtergebleven te zijn.","2":"Want ook ons is het Evangelie verkondigd, gelijk als hun; maar het woord der prediking deed hun geen nut, dewijl het met het geloof niet gemengd was in degenen, die het gehoord hebben.","3":"Want wij, die geloofd hebben, gaan in de rust, gelijk Hij gezegd heeft: Zo heb Ik dan gezworen in Mijn toorn: Indien zij zullen ingaan in Mijn rust! hoewel *Zijn* werken van de grondlegging der wereld af al volbracht waren.","4":"Want Hij heeft ergens van den zevenden *dag* aldus gesproken: En God heeft op den zevenden dag van al Zijn werken gerust.","5":"En in deze *plaats* wederom: Indien zij in Mijn rust zullen ingaan!","6":"Dewijl dan blijft, dat sommigen in dezelve *rust* ingaan, en degenen, dien het Evangelie eerst verkondigd was, niet ingegaan zijn vanwege de ongehoorzaamheid,","7":"Zo bepaalt Hij wederom een zekeren dag, *namelijk* heden, door David zeggende, zo langen tijd daarna ( gelijkerwijs gezegd is): Heden, indien gij Zijn stem hoort, zo verhardt uw harten niet.","8":"Want indien Jozua hen in de rust gebracht heeft, zo had Hij daarna niet gesproken van een anderen dag.","9":"Er blijft dan een rust over voor het volk Gods.","10":"Want die ingegaan is in zijn rust, heeft zelf ook van zijn werken gerust, gelijk God van de Zijne.","11":"Laat ons dan ons benaarstigen, om in die rust in te gaan; opdat niet iemand in hetzelfde voorbeeld der ongelovigheid valle.","12":"Want het Woord Gods is levend en krachtig, en scherpsnijdender dan enig tweesnijdend zwaard, en gaat door tot de verdeling der ziel, en des geestes, en der samenvoegselen, en des mergs, en is een oordeler der gedachten en der overleggingen des harten.","13":"En er is geen schepsel onzichtbaar voor Hem; maar alle dingen zijn naakt en geopend voor de ogen Desgenen, met Welken wij te doen hebben.","14":"Dewijl wij dan een groten Hogepriester hebben, Die door de hemelen doorgegaan is, *namelijk* Jezus, den Zoon van God, zo laat ons deze belijdenis vasthouden.","15":"Want wij hebben geen hogepriester, die niet kan medelijden hebben met onze zwakheden, maar Die in alle dingen, gelijk als wij, is verzocht geweest , *doch* zonder zonde.","16":"Laat ons dan met vrijmoedigheid toegaan tot den troon der genade, opdat wij barmhartigheid mogen verkrijgen, en genade vinden, om geholpen te worden ter bekwamer tijd."},"KJV":{"1":"Let us therefore fear, lest, a promise being left *us* of entering into his rest, any of you should seem to come short of it.","2":"For unto us was the gospel preached, as well as unto them: but the word preached did not profit them, not being mixed with faith in them that heard","3":"For we which have believed do enter into rest, as he said, As I have sworn in my wrath, if they shall enter into my rest: although the works were finished from the foundation of the world.","4":"For he spake in a certain place of the seventh *day* on this wise, And God did rest the seventh day from all his works.","5":"And in this *place* again, If they shall enter into my rest.","6":"Seeing therefore it remaineth that some must enter therein, and they to whom it was first preached entered not in because of unbelief:","7":"Again, he limiteth a certain day, saying in David, To day, after so long a time; as it is said, To day if ye will hear his voice, harden not your hearts.","8":"For if Jesus had given them rest, then would he not afterward have spoken of another day.","9":"There remaineth therefore a rest to the people of God.","10":"For he that is entered into his rest, he also hath ceased from his own works, as God *did* from his.","11":"Let us labour therefore to enter into that rest, lest any man fall after the same example of unbelief.","12":"For the word of God *is* quick, and powerful, and sharper than any twoedged sword, piercing even to the dividing asunder of soul and spirit, and of the joints and marrow, and *is* a discerner of the thoughts and intents of the heart.","13":"Neither is there any creature that is not manifest in his sight: but all things *are* naked and opened unto the eyes of him with whom we have to do.","14":"Seeing then that we have a great high priest, that is passed into the heavens, Jesus the Son of God, let us hold fast *our* profession.","15":"For we have not an high priest which cannot be touched with the feeling of our infirmities; but was in all points tempted like as *we are, yet* without sin.","16":"Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need."}} angelies. Zie ook Joh 8:56; Act 15:10-11; Heb 11."},{"catchword":"der prediking","tekst":"Grieks des gehoors; dat is, der prediking, waardoor het gehoor des woords komt, gelijk Isa 53:1; Rom 10:16."},{"catchword":"gemengd was","tekst":"Dat is, gevoegd, vergezeld, gelijk dingen, die men mengt, bij elkander worden gevoegd."}],"3":[{"catchword":"gaan in de rust,","tekst":"Namelijk waar David Psa 95 van spreekt en de apostel hierna vs.9."},{"catchword":"gelijk Hij gezegd heeft","tekst":"Namelijk niet met klare woorden, maar door een noodwendig gevolg. Want indien God zweert, dat de ongelovigen in Gods rust niet zullen ingaan, zo belooft Hij daarentegen, dat de gelovigen daar zullen ingaan."},{"catchword":"Indien zij zullen ingaan","tekst":"Zie hiervoor Heb 3:11."},{"catchword":"hoewel Zijn werken","tekst":"Of daar nochtans; en de apostel wil daarmee bewijzen, dat elders in de Schrift wel wordt gesproken van tweeërlei rusten, namelijk van den Sabbatdag en van het land Kanaän, doch dat David in Psa 95 van geen van deze twee eigenlijk spreekt, maar van een andere rust, die door deze twee was betekend, en den gelovigen nog open stond. De reden waarmede de apostel dat bewijst, is omdat de rust Gods op den Sabbat na de schepping aller dingen zo lang, namelijk omtrent drie duizend jaren voorbij was, en dat de Israëlieten al lang, namelijk over de vierhonderd jaren, tevoren door Jozua in de rust van het land Kanaän gebracht waren, daar David hier spreekt van ene rust, waar de gelovigen nog dagelijks toe worden genood, gelijk hij uit het woord heden bewijst, en die derhalve voor hen nog werd bewaard en opengehouden, gelijk hij in vs.9 besluit."},{"catchword":"al volbracht waren","tekst":"Grieks geworden, of geschied waren. Want in zes dagen heeft God hemel en aarde geschapen en rustte daarvan op den zevenden dag."}],"4":[{"catchword":"ergens van den zevenden [dag","tekst":"] Namelijk Gen 2:2; Exo 20:11."},{"catchword":"van al Zijn werken","tekst":"Namelijk die Hij voorgenomen had te scheppen. Want van het onderhouden aller dingen en weder oprichten van hetgeen daarin vervalt, rust God nimmermeer; Psa 104:13, enz.; Joh 5:17; Act 17:25, enz."},{"catchword":"gerust","tekst":"Dat is, opgehouden van nieuwe soorten van schepselen voort te brengen. Want God wordt niet vermoeid, noch afgearbeid, Isa 40:28, daarom heeft Hij geen zulke rust daartegen van node."}],"5":[{"catchword":"in deze [plaats","tekst":"] Namelijk Psa 95, waarvan in het voorgaande is gesproken."}],"6":[{"catchword":"blijft,","tekst":"Of overblijft; namelijk door een noodwendig gevolg, gelijk op Heb 5:3 is aangetekend."},{"catchword":"eerst verkondigd was,","tekst":"Namelijk door Mozes in de woestijn, gelijk op Heb 3:2 is aangetekend."}],"7":[{"catchword":"Hij","tekst":"Namelijk God de Heilige Geest, gelijk uitgedrukt wordt Heb 3:7."},{"catchword":"door David zeggende,","tekst":"Grieks in David; dat is, in de Psalmen Davids; of door David; gelijk dit woord in ook genomen wordt Rom 9:25."},{"catchword":"tijd daarna","tekst":"Namelijk dat de Israëlieten uit Egypte verlost en in het land Kanaän gekomen zijn."}],"8":[{"catchword":"Jozua hen","tekst":"Dat is, Jozua, de zoon van Nun, die de kinderen Israëls in het land Kanaän gebracht heeft. Zie Act 7:45."},{"catchword":"in de rust gebracht heeft,","tekst":"Of, in de rust gesteld; namelijk waar het opperste geluk des mensen in gelegen is, en die David aanwijst. Want hoewel het land Kanaän ook een rustplaats was voor de Israëlieten, zo was daarin hun opperste goed niet gelegen, maar was alleen een schaduw van deze uiterste en geestelijke rust, en moesten daarom ook naarstigheid doen, om door het geloof daartoe te komen."}],"9":[{"catchword":"een rust over","tekst":"Grieks Sabbatismos; dat is, een rust, namelijk boven de rust van het land Kanaän en van den zevenden dag, welke is de geestelijke en eeuwige rust, die hierdoor wordt betekend, en die hij in vs.10 beschrijft."},{"catchword":"voor het volk Gods","tekst":"Dat is, voor de ware gelovigen, die de ware Israëlieten en kinderen der belofte zijn."}],"10":[{"catchword":"Want die ingegaan","tekst":"Door het woord die, wordt verstaan een iegelijk der gelovigen, die gezegd worden in te gaan in de rust Gods, wanneer zij hier rusten van de volbrenging der werken des vleesches, en hiernamaals ten volle zullen rusten van al hunnen arbeid, Rev 14:13, van welke rust de Sabbat hier ook als een sacramenteel teken en figuur wordt aangemerkt."}],"11":[{"catchword":"in die rust in te gaan;","tekst":"Namelijk door een standvastig geloof, gelijk de volgende woorden medebrengen."},{"catchword":"in hetzelfde voorbeeld","tekst":"Dat is, een voorbeeld van ongehoorzaamheid worde, gelijk onze vaders in de woestijn zijn geweest. Anderen nemen het woord vallen, voor verloren gaan."},{"catchword":"ongelovigheid valle","tekst":"Of, ongehoorzaamheid."}],"12":[{"catchword":"Want het Woord Gods","tekst":"Sommigen verstaan dit van Christus, die het Woord Gods, genoemd wordt, Joh 1:1; Rev 19:13, en de gehele beschrijving, die volgt, komt daarmede ook wel overeen. Doch dewijl Paulus den persoon van Christus in zijn andere Schriften met dezen naam niet noemt, zo kan het hiervoor het woord des Evangelies geschikter genomen worden, welks kracht ook elders wordt beschreven. Zie Rom 1:16; 2Co 3:8-9; 1Pe 1:23, 1Pe 1:25."},{"catchword":"levend en krachtig,","tekst":"Namelijk door de werking des Heiligen Geestes, die dit leven en kracht daardoor in onze harten openbaart."},{"catchword":"dan enig tweesnijdend zwaard,","tekst":"Grieks boven alle tweesnijdend zwaard. Het Griekse woord betekent eigenlijk een zwaard dat twee monden heeft, en van twee zijden bijt of snijdt, gelijk uit Christus' mond een scherp zwaard ook wordt gezegd te gaan, Rev 19:15. Zie ook Isa 11:4, en Eph 6:17. Waardoor bij gelijkenis te kennen gegeven wordt, dat Gods Woord op de ene zijde de harten verslaat door de overtuiging der zonden en straffen, die de mens heeft verdiend, en aan de andere zijde de harten zuivert, en de kwade begeerlijkheden doodt, om voor Christus voortaan te leven. Zie een voorbeeld Act 2:37-38."},{"catchword":"de verdeling der ziel","tekst":"Dat is, tot de binnenste bewegingen van den wil en het verstand des mensen. Zie ook 1Th 5:23."},{"catchword":"der samenvoegselen,","tekst":"Dat is, van hetgeen aldaar meest verborgen schijnt te zijn in den mens, gelijk het merg en de samenvoeging der leden zijn."},{"catchword":"een oordeler der gedachten","tekst":"Gods Woord wordt gezegd de gedachten en overlegging der harten te oordelen of te onderscheiden, omdat de mens door Gods Woord onderricht en vermaand zijnde, zichzelf onschuldigt, of beschuldigt voor Gods oordeel, en zich zelven daarover voor God vernedert, of ook moed geeft om tot den troon Zijner genade vrijmoedig te gaan. Zie 1Co 14:24-25."}],"13":[{"catchword":"voor Hem;","tekst":"Namelijk God, vs.12, met wien wij te doen hebben, gelijk in het volgende lid wordt uitgedrukt. Alzo klimt hij dan hier van het Woord Gods tot God zelf, die een kenner en richter is van allen. En het is een nieuwe reden, waarom wij op Zijn woord wel moeten acht geven, daar dit woord zulk een kracht over onze zielen heeft, van dien die alles weet en richt."},{"catchword":"geopend voor de ogen Desgenen,","tekst":"Het Griekse woord betekent den nek, of den hals, openen; om de delen of inwendige leden te mogen zien, die in de borst zijn; gelijk de priesters de dieren, die geofferd werden, van den hals af eerst de borst plachten te openen, om te zien of alle delen, daarin rein en gaaf waren."},{"catchword":"met Welken wij te doen hebben","tekst":"Of, aan wien wij moeten rekening doen; of tot wien wij spreken; namelijk in onze gebeden. Of, van wien wij het woord hebben; of spreken, namelijk in deze onze handeling."}],"14":[{"catchword":"Dewijl wij dan","tekst":"Hier besluit de apostel de handeling van het profetisch ambt van Christus, en gaat voort tot Zijn priesterlijk en koninklijk ambt, gelijk hij Hem terstond ook een troon toeschrijft en met Melchizedek vergelijkt; en noemt Hem een groten hogepriester, omdat Hij meerder is dan al de hogepriesters des Ouden Testaments, die maar schaduwen van Christus' priesterambt zijn geweest, gelijk in de vijf volgende hoofdstukken breder zal verklaard worden."},{"catchword":"door de hemelen","tekst":"Namelijk die zienlijk zijn."},{"catchword":"doorgegaan is,","tekst":"Namelijk tot in den derden hemel, die de troon Gods is, en de heerlijke woonstede der heilige engelen en geesten, welke door het heilige der heiligen werd betekend, gelijk Heb 9:24 verklaard wordt. Zie ook 2Co 5:8, en 2Co 12:2, 2Co 12:4."},{"catchword":"deze belijdenis vasthouden","tekst":"Dat is, de leer van dezen zo groten hogepriester door het ware geloof standvastig belijden, niettegenstaande alle zwarigheden en vervolgingen, die ons daardoor zouden mogen overkomen."}],"15":[{"catchword":"in alle dingen,","tekst":"Namelijk die de mens niet alleen in dit leven van nature onderworpen is, maar ook zelfs de zwarigheden en straffen, die door de zonde daarbij gekomen zijn; alleen de zonde zelf uitgenomen, die door gehoorzaamheid, heiligheid en rechtvaardigheid moest teniet gedaan worden."},{"catchword":"gelijk als wij,","tekst":"Grieks naar gelijkheid."}],"16":[{"catchword":"den troon der genade,","tekst":"Namelijk die God in Christus heeft opgericht. En de apostel schijnt hier te zien op den genadestoel, die op de ark des verbonds was, waardoor de tafelen der wet, die de uiterste gehoorzaamheid of straf in het eerste verbond vereiste, werden bedekt; gelijk Christus alzo ook genoemd wordt, Rom 3:25."},{"catchword":"om geholpen te worden","tekst":"Grieks tot tijdige hulp, of tot hulp ter bekwamer tijd."},{"catchword":"ter bekwamer tijd","tekst":"Namelijk wanneer ons zulks tot onze zaligheid bevorderlijk of nodig is."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Let us therefore fear, [That is, with carefulness observe it, See Phil. 2. 12. which is not repugnant to a firm confidence in aks not properly of either of these two, but of another rest which was signified by these two, and stood yet open to believers. The reason whereby the Apostle proves that is, because God&acirc;&euro;&trade;s rest on the Sabbath after the creation of all things was so long, namely about three thousand years past, and that the Israelites long before, namely about four hundred years, were by Joshua brought into the rest whereunto believers were yet daily invited, as he proves by the word to day, and which therefore was yet reserved and kept open of them, as he concludes in the 9. vers.] (his) works were accomplished [Gr. Were made or done. For in six days God created heaven and earth, and rested from it on the seventh day] from the foundation of the world."}],"4":[{"catchword":null,"tekst":"For he spoke somewhere [Namely, Gen. 2. 2. Exod. 20. 11.] of the seventh day God rested [that is, ceased from producing new sorts of creatures. For God is not wearied nor tired, Isa. 40. 28. therefore he needs no such rest against it] from all his works [namely, which he had purposed to create. For from the preservation of all things, and restitution of that which decayeth therein, God never resteth, Psal. 104. 13. & c. Joh. 5. 17. Acts 17. 25. & c.]"}],"5":[{"catchword":null,"tekst":"And in this (place) again, [Namely, the 95. Psalm, which is spoken of in that which goes before] if they shall enter into my rest."}],"6":[{"catchword":null,"tekst":"Seeing then it remaineth [Namely, by a necessary consequence, as is noted on the third verse,] that some do enter into that (rest) and they to whom the Gospel was first published, [namely, by Moses in the wilderness, as is noted on the second verse] entered not in by reason of disobedience:"}],"7":[{"catchword":null,"tekst":"He setteth again a certain day, [Namely, God the Holy Ghost, as is expressed, chap. 3. 7.] (namely) today, saying by David [Gr. In David: i.e. in the Psalms of David, or by David, as this word in is also taken, Rom. 9. 25.] so long time after [namely, that the Israelites were delivered out of Egypt, and come into the land of Canaan] (like as it is said) Today if ye hear his voice, harden not your hearts."}],"8":[{"catchword":null,"tekst":"For if Jesus [That is, Joshua the son of Nun, who brought the children of Israel into the land of Canaan was also a place of rest for the Israelites, yet their chief good consisted not in it, but it was only a shadow of this last and spiritual rest, and therefore they must also give diligence by faith to come thereunto] he had not afterward spoken of another day."}],"9":[{"catchword":null,"tekst":"There remaineth therefore a rest [Gr. Sabbatism, i.e. rest, namely, besides the rest of the land of Canaan, and of the Seventh day, which is Spiritual and eternal rest, which is signified hereby, and which he describes in the following verse] for the people of God: [that is, for true believers, which are the true Israelites and children of the promise.]"}],"10":[{"catchword":null,"tekst":"For he [By the word he is understood every one of the faithful, who are said to enter into God&acirc;&euro;&trade;s rest, when they here rest from the fulfilling of the works of the flesh, and hereafter shall fully rest from all their labour, Rev. 14. 13. of which rest the Sabbath is here also considered as a Sacramental sign and figure] that is entered into his rest, he himself also hath rested from his works, even as God did from his own."}],"11":[{"catchword":null,"tekst":"Let us then give diligence to enter into that rest, [Namely, by a Steadfast faith, as the following words import] lest any man fall in that same example [That is, be an example of disobedience, as our Fathers were in the wilderness. Others take the word fall for perish] of unbelief. [or disobedience.]"}],"12":[{"catchword":null,"tekst":"For the word of God [Some understand this of Christ, who is called the word of God, Joh. 1. 1. Rev. 19. 13. and the whole description which followeth also agrees well therewith. But seeing Paul in his other writings doth not call the person of Christ by this name, it may here be more fitly taken for the word of the Gospel, the power whereof is elsewhere also described. See Rom. 1. 16. 2 Cor. 3. 8, 9. 1 Pet. 1. 23, 25] is lively and powerful, [namely, by the operation of the holy Ghost, who thereby manifests this life and power in our hearts ] and sharper than any two edged sword [Gr above every two edged sword that hath two mouths and bites or cuts on two sides as sharp sword is said to go forth of Christ mouth Rev 19:15 see also Isa 11:4 and Eph 6:17 whereby by a similitude is given to understand that by Gods words on one side breaks the heart by conviction of sins and punishments which man hath deserved and on the other sides purifieth the heart and kills sinful lusts that we may live from henceforward unto Christ see the example Act 2:37,38] and goeth through unto the dividing of the soul and of the spirit [that is unto most inward motions of the will and of the understanding of man see also 1Thessalonians 5.23] and of the joints and of the marrow that is of that which seems there to be most secret in man as are the marrow and the joining together of the members ] and is a judger of thoughts and of the reasoning of the heart because men being informed and admonished by Gods words excused or accuseth himself before Gods judge and therefore humbles himself before God or else is encouraged to the throne of his grace see 1 Corinthians 14.24,25]"}],"13":[{"catchword":null,"tekst":"and there is no creature invisible before him [namely God verse 12 with whom we have to do as the same member exprest so then here he ariseth from the word of God unto God himself who is a knower and judger of all and it is a new reason why we must give good heed to his word seeing this word hath such power over our souls from him that knoweth and judgeth all things ]but all things are necked and opened [the Greek word signifieth to open the neck or (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
