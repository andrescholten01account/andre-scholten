van God van ons ontvangen had, dat aangenomen hebt niet als een woord van mensen, maar (zoals het werkelijk is) als het Woord van God, dat ook werkt in u die gelooft.", "Matt 27:50": "En Jezus riep opnieuw met luide stem en gaf de geest.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Gal 4:11": "Ik ben bang voor u, dat ik niet misschien tevergeefs onder u gearbeid heb.", "Deut 6:4": "Hoor, Israël! De HEERE, onze God, is een enig HEERE!", "1 Joh 1:6": "Als wij zeggen dat wij gemeenschap met Hem hebben, en wij in de duisternis wandelen, dan liegen wij, en doen de waarheid niet.", "Ef 2:8": "Want uit genade bent u zalig geworden door het geloof; en dat niet uit u, het is Gods gave;", "Luk 10:2": "Hij zei dan tegen hen: De oogst is wel groot, maar de arbeiders zijn weinige; bid daarom de Heere van de oogst, dat Hij arbeiders in Zijn oogst uitstuurt.", "1 Petr 2:23": "Die, toen Hij uitgescholden werd, niet terugschold, en toen Hij leed, niet dreigde; maar het overgaf aan Hem Die rechtvaardig oordeelt;", "Joh 5:19-21": "Jezus dan antwoordde en zei tegen hen: Voorwaar, voorwaar, Ik zeg u: De Zoon kan niets van Zichzelf doen, als Hij de Vader dat niet ziet doen; want al wat Die doet, dat doet ook de Zoon evenzo. Want de Vader heeft de Zoon lief, en toont Hem alles wat Hijzelf doet; en Hij zal Hem grotere werken tonen dan deze, zodat u zich verwondert. Want zoals de Vader de doden opwekt en levend maakt, zo maakt ook de Zoon levend wie Hij wil.", "1 Kor 2:7-10": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was; Welke niemand van de leiders van deze wereld gekend heeft; want als zij haar gekend hadden, zouden zij de Heere der heerlijkheid niet gekruisigd hebben. Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Ps 41:10": "Zelfs de man van mijn vrede, op wie ik vertrouwde, die mijn brood at, heeft zijn hiel tegen mij groot gemaakt.", "1 Tess 2:8": "zo hebben wij, omdat wij zeer aan u gehecht waren, u graag niet alleen het Evangelie van God willen geven, maar ook onze eigen zielen, omdat u ons lief geworden was.", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "2 Kor 4:3": "Maar als ons Evangelie ook bedekt is, dan is het bedekt bij hen die verloren gaan;", "Ps 8:7": "U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;", "Ef 6:2": "Eer uw vader en moeder (dat is het eerste gebod met een belofte),", "Rom 5:2": "Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God.", "Joh 15:10": "Als u Mijn geboden bewaart, dan zult u in Mijn liefde blijven; zoals Ik de geboden van Mijn Vader bewaard heb, en blijf in Zijn liefde.", "2 Kor 4:1-10": "Omdat wij deze bediening hebben, naar de barmhartigheid die ons is bewezen, zo worden wij niet moedeloos; Maar wij hebben de bedekselen der schande verworpen, en wandelen niet in arglistigheid, en vervalsen ook het Woord van God niet, maar door openbaring van de waarheid maken wij onszelf aangenaam bij ieder geweten van de mensen, in de tegenwoordigheid van God. Maar als ons Evangelie ook bedekt is, dan is het bedekt bij hen die verloren gaan;", "Mark 7:25-29": "Want een vrouw, van wie het dochtertje een onreine geest had, had over Hem gehoord, en kwam en viel neer aan Zijn voeten. Deze vrouw nu was een Griekse, afkomstig uit Syro-Fenicië; en zij smeekte Hem dat Hij de duivel uit haar dochter zou uitdrijven. Maar Jezus zei tegen haar: Laat eerst de kinderen verzadigd worden; want het is niet gepast om het brood van de kinderen te nemen, en het naar de hondjes te werpen.", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Rom 10:9": "namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden.", "Openb 10:7": "maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.", "Matt 4:23": "En Jezus trok rond door heel Galilea, en Hij onderwees in hun synagogen en predikte het Evangelie van het Koninkrijk, en genas alle ziekte en alle kwaal onder het volk.", "Joh 3:20": "Want ieder die kwaad doet, haat het licht en komt niet tot het licht, opdat zijn werken niet bestraft worden.", "Hebr 1:6": "En als Hij de Eerstgeborene opnieuw in de wereld inbrengt, zegt Hij: En dat alle engelen van God Hem aanbidden.", "Joz 24:20-27": "Als u de HEERE verlaat en vreemde goden dient, dan zal Hij Zich omkeren, en Hij zal u kwaad doen, en Hij zal u vernietigen, nadat Hij u goed gedaan heeft. Toen zei het volk tegen Jozua: Nee, want wij zullen de HEERE dienen. Jozua nu zei tegen het volk: U bent getuigen tegen uzelf, dat u de HEERE gekozen hebt om Hem te dienen. En zij zeiden: Wij zijn getuigen.", "Jes 44:18-20": "Zij weten niet, en begrijpen niet, want het heeft hun ogen dichtgesmeerd, zodat zij niet zien, en hun harten, zodat zij niet begrijpen. En niemand van hen brengt het in zijn hart, en er is geen kennis en geen verstand, zodat hij zou zeggen: De helft daarvan heb ik verbrand in het vuur, ja, ook op de kolen daarvan heb ik brood gebakken, ik heb vlees daarbij gebraden, en heb het gegeten; en zou ik het overblijfsel daarvan tot een gruwel maken, zou ik neerknielen voor iets dat van een boom gekomen is? Hij voedt zich met as, het bedrogen hart heeft hem terzijde afgeleid; zodat hij zijn ziel niet redden kan, en ook niet kan zeggen: Is er niet een leugen in mijn rechterhand?", "Zach 7:9": "Zo sprak de HEERE van de heerscharen: Doe een waarachtig recht, en bewijs goedertierenheid en barmhartigheid, de een aan de ander;", "Jes 52:15": "zo zal Hij veel heidenvolken besprenkelen; ja, koningen zullen hun mond over Hem dichthouden; want aan wie het niet verkondigd was, die zullen het zien, en wie het niet gehoord hebben, die zullen het begrijpen.", "Hebr 11:15": "En als zij aan dat vaderland gedacht hadden waar zij uit weggegaan waren, zouden zij de tijd gehad hebben om terug te keren;", "Matt 15:14": "Laat hen gaan; zij zijn blinde leiders van blinden. Als nu de blinde de blinde leidt, zullen zij beiden in de gracht vallen.", "2 Kor 12:19-21": "Denkt u opnieuw dat wij ons bij u verontschuldigen? Wij spreken in de tegenwoordigheid van God in Christus; en dit alles, geliefden, tot uw opbouw. Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn; opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Jes 38:3": "En hij zei: Och HEERE, denk er toch aan dat ik voor Uw gezicht in waarheid en met een volkomen hart gewandeld heb, en dat ik gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg hard.", "Joh 11:25-27": "Jezus zei tegen haar: Ik ben de Opstanding en het Leven; wie in Mij gelooft zal leven, ook al was hij gestorven; en ieder die leeft en in Mij gelooft, zal niet sterven in eeuwigheid. Gelooft u dat? Zij zei tegen Hem: Ja, Heere; ik heb geloofd dat U de Christus bent, de Zoon van God, Die in de wereld komen zou.", "1 Tess 5:11": "Daarom, vermaan elkaar en bouw de één de ander op, zoals u ook doet.", "Joh 17:7": "Nu weten zij, dat alles wat U Mij gegeven hebt, van U is.", "Ex 20:13": "U zult niet doodslaan.", "Jes 59:8": "De weg van de vrede kennen zij niet; en er is geen recht in hun gangen; hun paden maken zij krom voor zichzelf; ieder die daarop gaat, kent de vrede niet.", "Matt 26:37": "En Hij nam Petrus en de twee zonen van Zebedeüs met Zich mee, en begon droevig en zeer beangst te worden.", "Gen 18:23-32": "En Abraham trad naar voren en zei: Zult U ook de rechtvaardige met de goddeloze ombrengen? Misschien zijn er vijftig rechtvaardigen in de stad; zult U hen ook ombrengen, en de plaats niet sparen, omwille van de vijftig rechtvaardigen die daarin zijn? Het zij verre van U, zoiets te doen, de rechtvaardige te doden met de goddeloze! zodat de rechtvaardige zou zijn als de goddeloze, verre zij het van U! zou de Rechter van de hele aarde geen recht doen?", "Spr 11:30": "De vrucht van de rechtvaardige is een boom des levens; en wie zielen vangt, is wijs.", "Mark 15:36": "En er liep iemand, en vulde een spons met azijn, en stak die op een rietstok, en gaf Hem te drinken, en zei: Laat staan, laten we zien of Elia komt om Hem eraf te halen.", "Joh 16:12": "Ik heb u nog veel te zeggen, doch u kunt het nu niet dragen.", "Ps 117:1": "Loof de HEERE, alle heidenvolken; prijs Hem, alle natiën!", "Joh 11:41": "Zij namen dan de steen weg, waar de gestorvene lag. En Jezus hief de ogen omhoog, en zei: Vader, Ik dank U dat U Mij gehoord hebt.", "Ps 78:2": "Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af.", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Matt 14:33": "Zij die in het schip waren, kwamen en aanbaden Hem, en zeiden: Werkelijk, U bent Gods Zoon!", "1 Petr 1:25": "maar het Woord van de Heere blijft in eeuwigheid. En dit is het Woord dat onder u verkondigd is.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "Hebr 2:6-8": "Maar iemand heeft ergens verklaard: Wat is de mens, dat U aan hem denkt, of de zoon van de mens, dat U naar hem omziet! U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen; Alle dingen hebt U onder zijn voeten onderworpen. Want doordat Hij hem alle dingen onderworpen heeft, heeft Hij niets overgelaten dat hem niet onderworpen is; maar nu zien wij nog niet dat hem alle dingen onderworpen zijn;", "Hand 2:35": "Totdat Ik Uw vijanden tot een voetbank voor Uw voeten gezet zal hebben.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Jer 23:6": "In Zijn dagen zal Juda verlost worden, en Israël zal zeker wonen; en dit zal Zijn naam zijn, waarmee men Hem zal noemen: De Heere: ONZE GERECHTIGHEID.", "Ex 34:32": "En daarna kwamen al de kinderen van Israël dichterbij; en hij gebood hun alles wat de HEERE met hem gesproken had op de berg Sinaï.", "Hand 2:34": "Want David is niet opgevaren naar de hemel; maar hij zegt zelf: De Heere heeft gesproken tot mijn Heere: Zit aan Mijn rechterhand,", "Ef 2:3-5": "onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen; Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden),", "Jes 45:17": "Maar Israël wordt verlost door de HEERE, met een eeuwige verlossing; u zult niet beschaamd worden, ook niet tot schande worden, tot in alle eeuwigheden.", "1 Joh 3:17": "Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem?", "Mark 8:18": "Ogen hebbend, ziet u niet? En oren hebbend, hoort u niet?", "1 Kor 15:25": "Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd.", "Neh 1:4-6": "En het gebeurde, toen ik deze woorden hoorde, dat ik neerzat, en huilde, en rouw bedreef, enkele dagen; en ik vastte en bad voor het aangezicht van de God van de hemel. En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden. Laat toch Uw oor opmerkzaam, en Uw ogen open zijn, om te horen naar het gebed van Uw dienaar, dat ik vandaag voor Uw aangezicht bid, dag en nacht, voor de kinderen van Israël, Uw dienaren; en ik doe belijdenis over de zonden van de kinderen van Israël, die wij tegen U gezondigd hebben; ook ik en het huis van mijn vader, wij hebben gezondigd.", "1 Kor 10:4": "en zij hebben allen dezelfde geestelijke drank gedronken; want zij dronken uit de geestelijke steenrots die hen volgde; en die steenrots was Christus.", "Richt 2:17": "maar zij hoorden ook niet naar hun richters, maar hoereerden andere goden na, en bogen zich voor die neer; haastig weken zij af van de weg die hun vaders bewandeld hadden door de geboden van de HEERE te horen; zo deden zij niet.", "Num 15:22-29": "Verder, wanneer u afgedwaald zult zijn, en niet gedaan hebt al deze geboden die de HEERE tot Mozes gesproken heeft; Alles wat de HEERE u door de hand van Mozes geboden heeft; van de dag af dat de HEERE het geboden heeft, en vervolgens bij uw geslachten; Dan zal het gebeuren, indien iets bij dwaling gedaan is, en voor de ogen van de vergadering verborgen is, dat de hele vergadering een var, een jong rund, zal bereiden tot brandoffer, tot een liefelijke reuk voor de HEERE, met zijn spijsoffer en zijn drankoffer, naar de gebruikelijke wijze; en een geitenbok tot zondoffer.", "Joh 3:31": "Wie van boven komt, is boven allen; wie uit de aarde is voortgekomen, die is uit de aarde en spreekt uit de aarde. Wie uit de hemel komt, is boven allen.", "1 Petr 1:19": "maar met het kostbare bloed van Christus, als van een smetteloos en onbevlekt Lam;", "1 Joh 3:6": "Ieder die in Hem blijft, zondigt niet; ieder die zondigt, heeft Hem niet gezien en heeft Hem niet gekend.", "Jer 32:22": "En U hebt hun dit land gegeven, dat U hun vaderen gezworen had hun te zullen geven, een land dat overvloeit van melk en honing;", "Ps 45:18": "Ik zal van uw Naam doen gedenken van elk geslacht tot geslacht; daarom zullen de volken U loven eeuwig en altijd.", "Jes 1:25-27": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen. En Ik zal u uw rechters teruggeven, als in het begin, en uw raadslieden als in het begin; daarna zult u een stad van de gerechtigheid, een trouwe stad, genoemd worden. Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Ps 69:22": "Ja, zij hebben mij gal tot mijn spijs gegeven; en in mijn dorst hebben zij mij azijn te drinken gegeven.", "Joh 14:6": "Jezus zei tegen hem: Ik ben de Weg, en de Waarheid, en het Leven. Niemand komt tot de Vader dan door Mij.", "Jes 53:12": "Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "1 Joh 3:8": "Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.", "Jes 8:14": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem.", "Joh 6:31": "Onze vaders hebben het manna gegeten in de woestijn, zoals geschreven is: Hij gaf hun brood uit de hemel te eten.", "2 Kor 3:14": "Maar hun gedachten zijn verhard geworden; want tot op deze huidige dag blijft datzelfde deksel bij het lezen van het Oude Testament, zonder weggenomen te worden, dat door Christus teniet gedaan wordt.", "Joh 6:51": "Ik ben het levende Brood, dat uit de hemel neergedaald is; als iemand van dit Brood eet, zal hij eeuwig leven. En het Brood dat Ik geven zal, is Mijn vlees, dat Ik geven zal voor het leven van de wereld.", "Matt 17:10-13": "En Zijn discipelen vroegen Hem: Waarom zeggen de Schriftgeleerden dan dat Elia eerst moet komen? Jezus antwoordde en zei tegen hen: Elia zal inderdaad eerst komen en alles herstellen. Maar Ik zeg u dat Elia al gekomen is, en zij hebben hem niet erkend; maar zij hebben met hem gedaan wat zij wilden. Zo zal ook de Zoon des mensen door hen lijden.", "Joh 21:19": "En dit zei Hij, om aan te duiden met wat voor dood hij God verheerlijken zou. En toen Hij dit gezegd had, zei Hij tegen hem: Volg Mij.", "Hand 26:14-18": "En toen wij allen op de grond neergevallen waren, hoorde ik een stem tot mij spreken, die zei in de Hebreeuwse taal: Saul, Saul, waarom vervolgt u Mij? Het is u hard, tegen de prikkels de hielen te slaan. En ik zei: Wie bent U, Heere? En Hij zei: Ik ben Jezus, Die u vervolgt. Maar richt u op en sta op uw voeten; want hiertoe ben Ik u verschenen, om u aan te stellen tot een dienaar en getuige, zowel van de dingen die u gezien hebt als van de dingen waarin Ik u nog zal verschijnen;", "Deut 5:17": "U zult niet doodslaan.", "Deut 30:1-3": "Verder zal het gebeuren, wanneer al deze dingen over u gekomen zijn, deze zegen of deze vloek, die ik u voorgesteld heb; zo zult u het weer ter harte nemen, onder alle volken, waarheen de HEERE, uw God, u gedreven heeft; En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel. En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Mark 8:17": "En Jezus, die dit besefte, zei tegen hen: Waarom overlegt u, dat u geen brood hebt? Merkt u het nog niet, en begrijpt u het niet? Is uw hart nog verhard?", "Joh 2:17": "En Zijn discipelen herinnerden zich dat er geschreven is: De ijver voor Uw huis heeft mij verslonden.", "Rom 9:27": "En Jesaja roept over Israël: Al zou het aantal kinderen van Israël zijn als het zand van de zee, toch zal het overblijfsel behouden worden.", "Ezech 3:20": "Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Hand 13:27": "Want zij die in Jeruzalem wonen, en hun leiders, hebben Hem niet gekend, en hebben ook de stemmen van de profeten, die elke sabbat gelezen worden, vervuld door Hem te veroordelen;", "1 Kron 23:13": "De kinderen van Amram waren Aäron en Mozes. Aäron nu werd afgezonderd om de allerheiligste dingen te heiligen, hij en zijn zonen, tot in eeuwigheid, om te roken voor het aangezicht van de HEERE, om Hem te dienen en om in Zijn Naam tot in eeuwigheid te zegenen.", "2 Tim 3:15": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is.", "Rom 4:3": "Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.", "Jes 63:8": "Want Hij zei: Zij zijn zeker Mijn volk, kinderen die niet liegen zullen? Zo is Hij hun geworden tot een Heiland.", "Jer 36:27": "Toen kwam het woord van de HEERE tot Jeremia, nadat de koning de rol en de woorden die Baruch geschreven had uit de mond van Jeremia, verbrand had:", "Hebr 11:40": "omdat God iets beters voor ons had voorzien, opdat zij niet zonder ons volmaakt zouden worden.", "Ps 16:8-11": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen. Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten. Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Matt 11:13": "Want al de profeten en de wet hebben tot Johannes toe geprofeteerd.", "Matt 19:18": "Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "1 Kor 3:7-10": "Zo is dan noch hij die plant iets, noch hij die nat maakt, maar God, Die de groei geeft. En hij die plant en hij die nat maakt, zijn één; maar ieder zal zijn loon ontvangen naar zijn arbeid. Want wij zijn medearbeiders van God; akkerwerk van God, gebouw van God bent u.", "Rom 9:7": "Ook zijn zij niet allen kinderen omdat zij nageslacht van Abraham zijn; maar: In Izaak zal uw nageslacht genoemd worden.", "Rom 11:3": "Heere! Zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn leven.", "Jes 53:9": "En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij de rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, en er geen bedrog in Zijn mond geweest is.", "Ps 86:6": "HEERE! neem mijn gebed ter ore, en let op de stem van mijn smekingen.", "Joh 16:32": "Zie, de tijd komt, en is nu gekomen, dat u verstrooid zult worden, ieder naar het zijne, en u Mij alleen zult laten; en toch ben Ik niet alleen, want de Vader is met Mij.", "1 Tess 5:9": "Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus.", "Spr 2:17": "Die de leidsman van haar jeugd verlaat, en het verbond van haar God vergeet;", "Ex 20:13-17": "U zult niet doodslaan. U zult geen echtbreuk plegen. U zult niet stelen.", "Luk 10:24": "Want Ik zeg u dat veel profeten en koningen verlangd hebben te zien wat u ziet, en het niet gezien hebben; en te horen wat u hoort, en het niet gehoord hebben.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Ps 55:2": "O God! neem mijn gebed ter ore, en verberg U niet voor mijn smeking.", "Rom 9:1-3": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest), dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is. Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "Hebr 10:7-9": "Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God! Nadat Hij eerder gezegd had: Slachtoffer, en offergave, en brandoffers, en offers voor de zonde hebt U niet gewild, en zij hebben U niet behaagd (deze worden immers naar de wet geofferd); zei Hij toen: Zie, Ik kom om Uw wil te doen, o God! Hij neemt het eerste weg, om het tweede te laten gelden.", "1 Petr 3:21": "Waarvan het tegenbeeld, de doop, ons nu ook behoudt — niet als het afleggen van de vuiligheid van het lichaam, maar als de vraag van een goed geweten aan God — door de opstanding van Jezus Christus;", "Jes 8:13": "De HEERE van de heerscharen, Die zult u heiligen, en Hij zij uw vrees, en Hij zij uw verschrikking.", "Joh 18:36": "Jezus antwoordde: Mijn Koninkrijk is niet van deze wereld. Als Mijn Koninkrijk van deze wereld was, zouden Mijn dienaren gestreden hebben, zodat Ik niet aan de Joden overgeleverd zou zijn; maar nu is Mijn Koninkrijk niet van hier.", "Rom 15:11": "En opnieuw: Looft de Heere, alle heidenen, en prijst Hem, alle volken!", "Ezech 20:6": "Op diezelfde dag hief Ik Mijn hand tot hen op, om hen uit Egypteland uit te leiden, naar een land dat Ik voor hen had uitgezocht, vloeiend van melk en honing, het sieraad van alle landen.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Jak 2:8": "Als u dan de koninklijke wet vervult, naar de Schrift: U zult uw naaste liefhebben als uzelf, dan doet u goed;", "1 Kor 10:24": "Niemand zoekt zijn eigen belang, maar ieder zoekt dat van de ander.", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Hand 11:18": "En toen zij dit hoorden, waren zij tevreden, en verheerlijkten God, en zeiden: Zo heeft God dan ook aan de heidenen de bekering gegeven tot leven!", "Luk 6:34": "En als u leent aan hen van wie u hoopt terug te ontvangen, wat voor dank hebt u dan? Want ook de zondaars lenen aan zondaars, om net zoveel terug te ontvangen.", "Joh 8:28": "Jezus zei dan tegen hen: Wanneer u de Zoon des mensen verhoogd zult hebben, dan zult u weten dat Ik Die ben, en dat Ik niets uit Mijzelf doe; maar Ik spreek deze dingen zoals Mijn Vader Mij geleerd heeft.", "Jes 11:5": "Want gerechtigheid zal de gordel van Zijn lendenen zijn; ook zal de trouw de gordel van Zijn lendenen zijn.", "Matt 21:9": "En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "Gal 3:16": "Nu zijn de beloften gesproken tot Abraham en zijn nageslacht. Hij zegt niet: En aan de nageslachten, alsof het over velen ging; maar alsof het over één ging: En uw nageslacht; dat is Christus.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Jer 3:15": "En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand.", "Joh 15:25": "Maar dit gebeurt, zodat het woord vervuld wordt dat in hun wet geschreven is: Zij hebben Mij zonder oorzaak gehaat.", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "Spr 1:22": "U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?", "1 Tess 5:8-10": "Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid. Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus. Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven.", "Gal 6:10": "Zo dan, terwijl we tijd hebben, laten we goeddoen aan allen, maar vooral aan de huisgenoten van het geloof.", "Jes 64:12": "HEERE! zou U Zich hierover inhouden, zou U zwijgen, en ons zozeer bedrukken?", "Openb 2:4": "Maar Ik heb tegen u, dat u uw eerste liefde hebt verlaten.", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Mark 12:24": "En Jezus antwoordde en zei tegen hen: Dwaalt u niet daarom, omdat u de Schriften niet kent, en ook de kracht van God niet?", "1 Kor 4:10-13": "Wij zijn dwazen om Christus' wil, maar u bent wijzen in Christus; wij zijn zwakken, maar u sterken; u bent heerlijke mensen, maar wij worden veracht. Tot op dit huidige uur lijden wij honger, en lijden wij dorst, en zijn naakt, en worden met vuisten geslagen, en hebben geen vaste woonplaats; en wij zwoegen, werkend met onze eigen handen; wij worden uitgescholden, en wij zegenen; wij worden vervolgd, en wij verdragen het;", "Luk 24:49": "En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte.", "1 Kor 3:1-3": "En ik, broeders, kon tot u niet spreken als tot geestelijken, maar als tot vleselijken, als tot jonge kinderen in Christus. Ik heb u met melk gevoed, en niet met vaste spijs; want u kon toen nog niet; ja, u kunt ook nu nog niet. Want u bent nog vleselijk; want omdat er onder u nijd is, en twist, en tweedracht, bent u niet vleselijk, en wandelt u niet naar de mens?", "Rom 9:9": "Want dit is het woord van de belofte: Rond deze tijd zal Ik komen, en Sara zal een zoon hebben.", "Joh 3:7": "Verwonder u niet dat Ik u gezegd heb: U moet opnieuw geboren worden.", "Mark 12:19": "Meester, Mozes heeft ons geschreven: Als iemands broer sterft, en een vrouw achterlaat, en geen kinderen nalaat, dat zijn broer diens vrouw moet nemen en voor zijn broer nageslacht moet verwekken.", "Gen 14:18": "En Melchizedek, koning van Salem, bracht brood en wijn; en hij was een priester van de allerhoogste God.", "Ef 1:10": "Om in de bedeling van de volheid der tijden alles weer tot één te vergaderen in Christus, zowel wat in de hemel is, als wat op de aarde is;", "Hand 7:42": "En God keerde Zich af, en gaf hen over om het leger van de hemel te dienen, zoals geschreven staat in het boek van de profeten: Hebt u soms slachtoffers en offers aan Mij gebracht, veertig jaar lang in de woestijn, huis van Israël?", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "Spr 28:5": "De kwade mensen begrijpen het recht niet; maar wie de HEERE zoeken, begrijpen alles.", "Luk 2:10-14": "En de engel zei tegen hen: Wees niet bang, want zie, ik verkondig u grote blijdschap, die er voor heel het volk zijn zal; namelijk dat u heden geboren is de Zaligmaker, Die is Christus, de Heere, in de stad van David. En dit zal voor u het teken zijn: u zult het Kindje vinden in doeken gewonden, en liggend in de kribbe.", "Hebr 1:10-12": "En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen; Die zullen vergaan, maar U blijft altijd, en zij zullen allemaal verouderen als een kleed; En als een dekkleed zult U ze oprollen, en zij zullen veranderd worden; maar U bent Dezelfde, en Uw jaren zullen niet ophouden.", "Kol 2:2": "Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus;", "Ps 119:145-147": "Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren. Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden. Ik ben de morgenschemering voorgekomen, en heb geschrei gemaakt; op Uw woord heb ik gehoopt.", "Joh 7:28": "Jezus riep dan in de tempel, terwijl Hij leerde, en zei: U kent Mij, en u weet van waar Ik ben; en Ik ben niet uit Mijzelf gekomen, maar Hij die Mij gezonden heeft, is waarachtig, Hem kent u niet.", "Kol 4:7": "Al mijn zaken zal Tychikus u bekendmaken, de geliefde broeder, en trouwe dienaar, en mededienstknecht in de Heere;", "Ezech 34:23": "En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn.", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Rom 10:8-13": "Maar wat zegt zij? Dicht bij u is het Woord, in uw mond en in uw hart. Dit is het Woord van het geloof, dat wij prediken; namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden. Want met het hart gelooft men tot rechtvaardigheid, en met de mond belijdt men tot zaligheid.", "Tit 2:3": "De oude vrouwen eveneens, dat zij zich gedragen zoals bij heiligheid past, geen lasteraarsters zijn, zich niet overgeven aan veel wijn, maar leraressen zijn van het goede;", "Joh 5:40": "En u wilt niet tot Mij komen, opdat u het leven zou hebben.", "Matt 11:14": "En als u het wilt aannemen, hij is Elia, die komen zou.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "Spr 4:19": "De weg van de goddelozen is als donkerheid; zij weten niet, waarover zij zullen struikelen.", "Luk 5:32": "Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Hand 13:2": "En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb.", "Matt 11:10": "Want deze is het, van wie geschreven staat: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg bereiden zal voor U heen.", "Hand 23:5": "En Paulus zei: Ik wist niet, broeders, dat hij de hogepriester was; want er is geschreven: De leider van uw volk zult u niet vervloeken.", "Jes 32:20": "Gelukkig bent u, die aan alle wateren zaait; u, die de voet van het osse en van de ezel daarheen laat gaan!", "2 Kor 7:1-4": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God. Geef ons plaats; wij hebben niemand onrecht aangedaan, wij hebben niemand verdorven, wij hebben bij niemand ons voordeel gezocht. Ik zeg dit niet tot uw veroordeling; want ik heb al eerder gezegd dat u in ons hart bent, om samen te sterven en samen te leven.", "Deut 30:12-14": "Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Want dit woord is heel dichtbij u, in uw mond, en in uw hart, om dat te doen.", "Ex 32:6": "En zij stonden de volgende dag vroeg op, en offerden brandoffers en brachten dankoffers; en het volk zat neer om te eten en te drinken, daarna stonden zij op om te spelen.", "Rom 11:1-36": "Ik zeg dan: Heeft God Zijn volk verstoten? Dat zij verre. Want ik ben ook een Israëliet, uit het zaad van Abraham, van de stam Benjamin. God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt: Heere! Zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn leven.", "Hand 3:13": "De God van Abraham, en van Izak, en van Jakob, de God van onze vaderen, heeft Zijn Kind Jezus verheerlijkt, Die u hebt overgeleverd en verloochend voor het aangezicht van Pilatus, toen die oordeelde dat men Hem zou loslaten.", "Hebr 10:10": "Door die wil zijn wij geheiligd, door het offer van het lichaam van Jezus Christus, eens en voor altijd gebracht.", "1 Petr 1:9": "en zo het einddoel van uw geloof bereikt, namelijk de zaligheid van de zielen.", "Ef 3:8-11": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen, en allen te verlichten, zodat zij mogen verstaan wat de gemeenschap van de verborgenheid is, die vanaf alle eeuwen verborgen is geweest in God, Die alle dingen geschapen heeft door Jezus Christus; opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "1 Tim 2:4": "Die wil dat alle mensen zalig worden en tot kennis van de waarheid komen.", "Hand 4:26": "De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde.", "Mark 15:28": "En de Schrift is vervuld die zegt: En Hij is met de misdadigers gerekend.", "Jes 51:4": "Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken.", "Rom 1:12": "dat is: om samen met u vertroost te worden door het onderlinge geloof, zowel het uwe als het mijne.", "Hand 2:33": "Hij dan, door de rechterhand van God verhoogd, en de belofte van de Heilige Geest ontvangen hebbend van de Vader, heeft dit uitgestort, wat u nu ziet en hoort.", "Gal 2:16": "maar omdat wij weten dat de mens niet gerechtvaardigd wordt uit de werken van de wet, maar door het geloof van Jezus Christus, hebben ook wij in Christus Jezus geloofd, opdat wij gerechtvaardigd zouden worden uit het geloof van Christus, en niet uit de werken van de wet; omdat uit de werken van de wet geen vlees zal worden gerechtvaardigd.", "Hand 4:31": "En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.", "Joh 6:68": "Simon Petrus antwoordde Hem: Heere, naar wie zouden wij heengaan? U hebt de woorden van het eeuwige leven.", "Joh 4:42": "en zij zeiden tegen de vrouw: Wij geloven niet meer om wat u zei; want wij hebben Hem zelf gehoord, en weten dat Deze werkelijk de Christus is, de Zaligmaker van de wereld.", "Luk 10:25-37": "En zie, een wetgeleerde stond op, om Hem op de proef te stellen, en zei: Meester, wat moet ik doen om het eeuwige leven te beërven? En Hij zei tegen hem: Wat staat er in de wet geschreven? Hoe leest u het? En hij antwoordde: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw kracht, en met heel uw verstand; en uw naaste als uzelf.", "Openb 3:20": "Zie, Ik sta aan de deur, en Ik klop; als iemand Mijn stem hoort, en de deur opendoet, zal Ik bij hem binnenkomen, en Ik zal met hem avondmaal houden, en hij met Mij.", "Ps 94:7": "En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Hebr 12:5": "En u bent de vermaning vergeten, die tot u spreekt als tot zonen: Mijn zoon, acht de kastijding van de Heere niet klein, en bezwijk niet als u door Hem bestraft wordt;", "Matt 27:48": "En meteen liep een van hen toe, nam een spons, vulde die met azijn, stak ze op een rietstok, en gaf Hem te drinken.", "Mark 14:15": "En hij zal u een grote bovenzaal wijzen, ingericht en gereed; bereid het daar voor ons.", "Joh 19:29": "Daar stond dan een vat vol azijn, en zij vulden een spons met azijn, en omlegden ze met hysop, en brachten ze aan Zijn mond.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Joh 14:28": "U hebt gehoord dat Ik tot u gezegd heb: Ik ga heen, en kom weer naar u toe. Als u Mij liefhad, zou u zich verblijden, omdat Ik gezegd heb: Ik ga heen tot de Vader; want Mijn Vader is meer dan Ik.", "Rom 4:18": "Hij heeft tegen hoop op hoop geloofd, dat hij een vader van veel volken zou worden, volgens wat gezegd was: Zo zal uw nageslacht zijn.", "2 Tess 1:4": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;", "Ezech 14:10": "En zij zullen hun ongerechtigheid dragen; zoals de ongerechtigheid van de vrager zal zijn, zo zal de ongerechtigheid van de profeet zijn;", "Mark 3:11": "En de onreine geesten vielen voor Hem neer wanneer zij Hem zagen, en riepen: U bent de Zoon van God!", "Joh 10:11": "Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen.", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "Tit 1:13": "Deze getuigenis is waar. Daarom, bestraf hen scherp, opdat zij gezond mogen zijn in het geloof.", "2 Kor 10:8": "Want al zou ik nog wat overvloediger roemen over onze macht, die de Heere ons gegeven heeft tot opbouw, en niet tot uw neerwerping, dan zal ik daarover niet beschaamd worden;", "Matt 23:8-11": "Maar u moet niet Rabbi genoemd worden; want Eén is uw Meester, namelijk Christus; en u bent allemaal broeders. En u zult niemand op aarde uw vader noemen; want Eén is uw Vader, namelijk Die in de hemelen is. Ook moet u geen meesters genoemd worden; want Eén is uw Meester, namelijk Christus.", "Luk 19:10": "Want de Zoon des mensen is gekomen om te zoeken en zalig te maken wat verloren was.", "Ef 5:25": "Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven,", "2 Tim 3:14": "Maar blijft u bij wat u geleerd hebt, en waarvan u verzekerd bent, wetend van wie u het geleerd hebt;", "Hand 20:35": "Ik heb u in alles getoond, dat men, zo arbeidend, de zwakken moet opnemen, en zich de woorden van de Heere Jezus herinneren, dat Hij gezegd heeft: Het is zaliger te geven dan te ontvangen.", "Jes 50:8": "Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij.", "Matt 19:19": "Eer uw vader en moeder; en: U zult uw naaste liefhebben als uzelf.", "Jes 53:3": "Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.", "2 Kor 4:13": "Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;", "Hand 22:12-15": "En een zekere Ananias, een godvruchtig man naar de wet, die goede getuigenis had van al de Joden die daar woonden, kwam naar mij toe, en bij mij staande zei hij tegen mij: Saul, broeder, word weer ziende! En op datzelfde moment kon ik hem weer zien. En hij zei: De God van onze vaderen heeft u van tevoren bestemd om Zijn wil te kennen, en de Rechtvaardige te zien, en de stem uit Zijn mond te horen.", "Lev 16:2-34": "De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel. Hiermee zal Aäron het heilige binnengaan: met een jonge stier als zondoffer, en een ram als brandoffer. Hij zal de heilige linnen rok aandoen, en een linnen onderbroek zal om zijn lichaam zijn, en met een linnen gordel zal hij zich omgorden, en met een linnen hoofddoek zich bedekken; dit zijn heilige klederen; daarom zal hij zijn lichaam met water baden, als hij ze zal aandoen.", "2 Tess 1:10": "Wanneer Hij gekomen zal zijn om verheerlijkt te worden in Zijn heiligen, en bewonderd te worden in allen die geloven (omdat onze getuigenis onder u geloofd is) op die dag.", "Kol 3:4": "Wanneer nu Christus geopenbaard zal zijn, Die ons leven is, dan zult ook u met Hem geopenbaard worden in heerlijkheid.", "Gal 4:4": "Maar toen de volheid van de tijd gekomen was, heeft God Zijn Zoon uitgezonden, geboren uit een vrouw, geboren onder de wet;", "Ezech 18:24": "Maar als de rechtvaardige zich afkeert van zijn gerechtigheid, en onrecht doet, en handelt naar al de gruwelen die de goddeloze doet, zou die leven? Al zijn gerechtigheden, die hij gedaan heeft, zullen niet aangerekend worden; door zijn overtreding, waardoor hij overtreden heeft, en door zijn zonde, die hij gezondigd heeft, daardoor zal hij sterven.", "1 Joh 1:8": "Als wij zeggen dat wij geen zonde hebben, dan verleiden wij ons zelf, en de waarheid is niet in ons.", "2 Tess 2:7": "Want de verborgenheid van de onrechtvaardigheid werkt al; alleen, Hij die hem nu weerhoudt, zal hem blijven weerhouden, totdat hij uit het midden weggedaan wordt.", "Deut 8:16": "Die u in de woestijn voedde met manna, dat uw vaderen niet gekend hadden; om u te verootmoedigen, en om u te beproeven, opdat Hij u uiteindelijk goeddeed;", "Mark 10:6": "Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt.", "1 Sam 13:14": "Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Matt 5:38": "U hebt gehoord dat gezegd is: Oog om oog, en tand om tand.", "Lev 9:15-21": "Daarna liet hij de offerande van het volk toebrengen; en nam de bok van het zondoffer, die voor het volk was, en slachtte hem, en bereidde hem tot zondoffer, zoals de eerste. Verder liet hij het brandoffer toebrengen, en maakte dat klaar naar het recht. En hij liet het spijsoffer toebrengen, en vulde daarvan zijn hand, en stak het aan op het altaar, behalve het morgenbrandoffer.", "Hand 17:3": "En legde ze uit, en toonde aan dat de Christus moest lijden en opstaan uit de doden, en dat deze Jezus de Christus is, Die ik, zei hij, u verkondig.", "Hebr 2:10-18": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken. Want Hij Die heiligt, en zij die geheiligd worden, zijn allen uit één; om die reden schaamt Hij Zich niet hen broeders te noemen, En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Joh 1:14": "En het Woord is vlees geworden, en heeft onder ons gewoond (en wij hebben Zijn heerlijkheid aanschouwd, een heerlijkheid als van de Eniggeborene van de Vader), vol van genade en waarheid.", "Spr 3:11": "Mijn zoon! Verwerp de tucht van de HEERE niet, en word niet verdrietig over Zijn kastijding;", "Ps 68:19": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!", "Jes 27:9": "Daarom zal daardoor de ongerechtigheid van Jakob verzoend worden, en dit is de hele vrucht, dat Hij zijn zonde zal wegdoen: wanneer Hij alle stenen van het altaar maakt als verstrooide kalkstenen, zullen de bossen en de zonnebeelden niet blijven bestaan.", "1 Kor 15:17": "En als Christus niet opgewekt is, dan is uw geloof zinloos, dan bent u nog in uw zonden.", "Joh 1:34": "En ik heb gezien, en heb getuigd, dat Deze de Zoon van God is.", "1 Kor 9:16-23": "Want als ik het Evangelie verkondig, is het voor mij geen roem; want de noodzaak is mij opgelegd. En wee mij, als ik het Evangelie niet verkondig! Want als ik dat gewillig doe, heb ik loon, maar als onwillig, is de uitdeling mij toch toevertrouwd. Wat loon heb ik dan? Namelijk dat ik, terwijl ik het Evangelie verkondig, het Evangelie van Christus kosteloos aanbied, om mijn macht in het Evangelie niet te misbruiken.", "Deut 25:5": "Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen.", "Mark 1:11": "En er kwam een stem uit de hemelen: U bent Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb!", "Hebr 4:5-7": "En op deze plaats opnieuw: Zij zullen Mijn rust niet ingaan! Omdat het dan blijft gelden dat sommigen die rust ingaan, en zij aan wie het Evangelie eerst verkondigd was, niet ingegaan zijn vanwege de ongehoorzaamheid, bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.", "Matt 27:43": "Hij heeft op God vertrouwd; laat God Hem nu verlossen, als Hij Hem tenminste wil hebben; want Hij heeft gezegd: Ik ben Gods Zoon.", "Joh 17:4": "Ik heb U verheerlijkt op de aarde; Ik heb het werk voleindigd, dat U Mij gegeven hebt om te doen;", "1 Joh 2:11": "Maar wie zijn broeder haat, is in de duisternis, en wandelt in de duisternis, en weet niet, waar hij heengaat; want de duisternis heeft zijn ogen verblind.", "Gal 1:4": "Die Zichzelf gegeven heeft voor onze zonden, opdat Hij ons zou trekken uit deze tegenwoordige boze wereld, naar de wil van onze God en Vader;", "Ef 3:18": "opdat u ten volle in staat bent te begrijpen, met al de heiligen, wat de breedte, en lengte, en diepte, en hoogte is,", "Matt 9:9": "En toen Jezus vandaar verder ging, zag Hij een man in het tolhuis zitten, genaamd Mattheüs; en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Luk 10:22": "Alle dingen zijn Mij door Mijn Vader overgegeven; en niemand weet wie de Zoon is dan de Vader; en wie de Vader is dan de Zoon, en hij aan wie de Zoon het wil openbaren.", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "1 Tess 4:5": "Niet in kwade hartstocht van begeerte, zoals ook de heidenen, die God niet kennen.", "Spr 13:18": "Armoede en schande is voor hem die de tucht verwerpt; maar die de bestraffing ter harte neemt, zal geëerd worden.", "Ex 32:21-24": "En Mozes zei tegen Aäron: Wat heeft dit volk u gedaan, dat u zo'n grote zonde over hen gebracht hebt? Toen zei Aäron: De toorn van mijn heer ontsteekt niet! U kent dit volk, dat het geneigd is tot het kwade. Zij zeiden namelijk tegen mij: Maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft opgevoerd, weten wij niet wat er van hem geworden is.", "1 Petr 5:5": "Evenzo, u jongeren, wees de ouderen onderdanig; en wees allen elkaar onderdanig; bekleed u met nederigheid; want God weerstaat de hoogmoedigen, maar aan de nederigen geeft Hij genade.", "Kol 2:1": "Want ik wil dat u weet hoe zware strijd ik voor u heb, en voor hen die in Laodicea zijn, en voor allen die mijn gezicht in het vlees niet gezien hebben;", "Deut 32:43": "Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Joh 5:23": "opdat allen de Zoon eren, zoals zij de Vader eren. Wie de Zoon niet eert, eert de Vader niet, Die Hem gezonden heeft.", "2 Kor 1:19": "Want de Zoon van God, Jezus Christus, Die onder u door ons gepredikt is, namelijk door mij, en Silvanus, en Timotheüs, was niet ja en nee, maar is geweest ja in Hem.", "2 Petr 1:19": "En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten.", "Luk 22:70": "En zij zeiden allen: Bent U dan de Zoon van God? En Hij zei tegen hen: U zegt dat Ik het ben.", "Luk 20:13": "En de heer van de wijngaard zei: Wat zal ik doen? Ik zal mijn geliefde zoon sturen; misschien zullen zij hem ontzien als zij hem zien.", "Num 16:10": "Terwijl Hij u, en al uw broeders, de kinderen van Levi, met u, heeft laten naderen; zoekt u nu ook het priesterambt?", "2 Kor 8:15": "Zoals geschreven is: Wie veel verzameld had, had niet over; en wie weinig verzameld had, had niet te weinig.", "Joh 3:9-12": "Nicodemus antwoordde en zei tegen Hem: Hoe kunnen deze dingen gebeuren? Jezus antwoordde en zei tegen hem: Bent u een leraar van Israël, en weet u deze dingen niet? Voorwaar, voorwaar, Ik zeg u: Wij spreken wat Wij weten, en getuigen wat Wij gezien hebben; en u neemt Ons getuigenis niet aan.", "Luk 2:23": "(zoals geschreven is in de wet van de Heere: Al wat mannelijk is, dat de moeder opent, zal de Heere heilig genoemd worden.)", "Deut 18:18": "Een Profeet zal Ik hun doen opstaan uit hun broeders, zoals u; en Ik zal Mijn woorden in Zijn mond leggen, en Hij zal tot hen spreken alles wat Ik Hem gebieden zal.", "1 Kor 9:16": "Want als ik het Evangelie verkondig, is het voor mij geen roem; want de noodzaak is mij opgelegd. En wee mij, als ik het Evangelie niet verkondig!", "Hos 2:22": "En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!", "Ezech 33:12": "U dan, o mensenkind! Zeg tegen de kinderen van uw volk: De gerechtigheid van de rechtvaardige zal hem niet redden op de dag van zijn overtreding; en wat de goddeloosheid van de goddeloze betreft, hij zal er niet om vallen op de dag dat hij zich van zijn goddeloosheid bekeert; en de rechtvaardige zal niet kunnen leven door zijn gerechtigheid, op de dag dat hij zondigt.", "Hand 3:17": "En nu, broeders, ik weet dat u het door onwetendheid hebt gedaan, zoals ook uw leiders.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "1 Tim 5:21": "Ik roep als getuige God aan, en de Heere Jezus Christus, en de uitverkoren engelen, dat u deze dingen bewaart, zonder vooroordeel, niets doend uit partijdigheid.", "Kol 2:8": "Kijk uit dat niemand u als een roof meesleept door de filosofie en loze verleiding, naar de overlevering van de mensen, naar de eerste beginselen van de wereld, en niet naar Christus;", "Rom 15:3": "Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.", "Ps 102:3": "Verberg Uw aangezicht niet voor mij, neig Uw oor tot mij ten dage van mijn benauwdheid; ten dage als ik roep, verhoor mij haastig.", "Hebr 9:15": "En daarom is Hij de Middelaar van het nieuwe testament, opdat, nu de dood daartussen gekomen is, tot verzoening van de overtredingen die er waren onder het eerste testament, degenen die geroepen zijn de belofte van de eeuwige erfenis zouden ontvangen.", "Jes 28:13": "Zo zal het woord van de HEERE voor hen zijn: gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig; opdat zij heengaan, en achterwaarts vallen, en gebroken, en verstrikt en gevangen worden.", "Ex 28:1-14": "Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron. En u zult voor uw broeder Aäron heilige kleren maken, tot heerlijkheid en tot sieraad. U zult ook spreken tot allen die wijs van hart zijn, die Ik met de geest van wijsheid vervuld heb, dat zij voor Aäron kleren maken om hem te heiligen, zodat hij Mij het priesterambt bedient.", "Matt 27:46": "En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Kol 1:26-29": "namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen; aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid; Hem verkondigen wij, terwijl wij ieder mens vermanen en ieder mens onderwijzen in alle wijsheid, opdat wij ieder mens volmaakt zouden stellen in Christus Jezus;", "Gen 15:5": "Toen leidde Hij hem naar buiten, en zei: Zie nu op naar de hemel, en tel de sterren, als u ze tellen kunt; en Hij zei tegen hem: Zo zal uw nageslacht zijn!", "Jes 53:1": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard?", "1 Kor 15:3": "Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften;", "Ps 78:24": "En Hij regende op hen het Manna om te eten, en gaf hun hemels koren.", "Jes 1:9": "Als de HEERE van de heerscharen ons niet nog een klein overblijfsel had gelaten, zouden wij als Sodom geworden zijn; wij zouden Gomorra gelijk zijn geworden.", "Ex 3:8": "Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "Ps 85:9": "Ik zal horen wat God, de HEERE, spreken zal; want Hij zal tot Zijn volk en tot Zijn gunstgenoten van vrede spreken; maar laat hen niet weer tot dwaasheid terugkeren.", "Jona 1:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar; want hun boosheid is opgeklommen voor Mijn aangezicht.", "Joh 7:16": "Jezus antwoordde hun en zei: Mijn leer is niet van Mij, maar van Hem die Mij gezonden heeft.", "2 Petr 3:2": "Opdat u de woorden gedenkt die van tevoren gesproken zijn door de heilige profeten, en het gebod van ons, de apostelen van de Heere en Zaligmaker;", "Rom 16:26": "maar nu geopenbaard is, en door de profetische Schriften, naar het bevel van de eeuwige God, tot gehoorzaamheid aan het geloof, onder alle heidenen bekendgemaakt is;", "Gal 1:16": "om Zijn Zoon in mij te openbaren, opdat ik Hem door het Evangelie onder de heidenen zou verkondigen, ben ik meteen niet te rade gegaan met vlees en bloed;", "Matt 26:27": "En Hij nam de drinkbeker, en na de dankzegging gaf Hij die aan hen en zei: Drinkt allen daaruit;", "Jer 24:5": "Zo zegt de HEERE, de God van Israël: Zoals die goede vijgen, zo zal Ik de weggevoerden van Juda erkennen, die Ik uit deze plaats naar het land van de Chaldeeën heb weggestuurd, tot hun eigen goed.", "Rom 4:1-25": "Wat zullen wij dan zeggen, dat Abraham, onze vader, verkregen heeft naar het vlees? Want als Abraham uit de werken gerechtvaardigd is, dan heeft hij roem, maar niet bij God. Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.", "Hebr 9:9": "dat was een afbeelding voor de toenmalige tijd, waarin gaven en offers gebracht werden die degene die de dienst uitoefende niet konden volmaken naar het geweten;", "Jes 25:7": "En Hij zal op deze berg verslinden het bewindsel van het aangezicht, waarmee alle volken bewonden zijn, en het deksel, waarmee alle naties bedekt zijn.", "Mark 4:15-19": "En dezen zijn zij die langs de weg bezaaid worden, waarin het Woord gezaaid wordt; en wanneer zij het gehoord hebben, komt de satan meteen, en neemt het Woord weg, dat in hun hart gezaaid was. En dezen zijn evenzo zij die op de rotsachtige plaatsen bezaaid worden; die, wanneer zij het Woord gehoord hebben, het meteen met vreugde ontvangen. En zij hebben geen wortel in zichzelf, maar houden het voor een tijd vol; daarna, wanneer er verdrukking of vervolging komt omwille van het Woord, worden zij meteen afvallig.", "Ps 99:7": "Hij sprak tot hen in een wolkkolom; zij hebben Zijn getuigenissen onderhouden, en de inzettingen die Hij hun gegeven had.", "Ps 147:19": "Hij maakt aan Jakob Zijn woorden bekend, aan Israël Zijn inzettingen en Zijn rechten.", "Deut 4:9": "Wacht u alleen, en let goed op uzelf, dat u niet vergeet wat uw ogen gezien hebben; en dat het niet uit uw hart wijkt, al de dagen van uw leven; en u zult het aan uw kinderen en uw kleinkinderen bekendmaken.", "1 Kor 2:15": "Maar de geestelijke mens beoordeelt wel alle dingen, maar hijzelf wordt door niemand beoordeeld.", "Fil 2:19": "En ik hoop in de Heere Jezus Timotheüs spoedig naar u te zenden, opdat ik ook welgemoed mag zijn, wanneer ik uw omstandigheden zal kennen.", "Matt 26:31": "Toen zei Jezus tegen hen: U zult allen deze nacht aan Mij geërgerd worden; want er is geschreven: Ik zal de Herder slaan, en de schapen van de kudde zullen verstrooid worden.", "Jes 28:12": "tot wie Hij gezegd heeft: Dit is de rust, geef de moede rust, en dit is de verkwikking; toch hebben zij niet willen horen.", "Ex 2:14": "Hij dan zei: Wie heeft u tot een leider en rechter over ons gezet? Wilt u mij doden, zoals u de Egyptenaar gedood hebt? Toen werd Mozes bang, en zei: Zeker, deze zaak is bekend geworden!", "Deut 5:11": "U zult de Naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal hem die Zijn Naam ijdel gebruikt, niet onschuldig houden.", "1 Tim 1:12-14": "En ik dank Hem, Die mij kracht gegeven heeft, namelijk Christus Jezus, onze Heere, dat Hij mij trouw geacht heeft, doordat Hij mij in de bediening gesteld heeft; Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof. Maar de genade van onze Heere is zeer overvloedig geweest, met geloof en liefde, die er is in Christus Jezus.", "Mark 14:50": "En zij verlieten Hem, en vluchtten allen.", "1 Kon 19:19": "Zo ging hij vandaar, en vond Elisa, de zoon van Safat; die was aan het ploegen met twaalf span runderen voor zich uit, en hij zelf was bij het twaalfde; en Elia ging naar hem toe, en wierp zijn mantel op hem.", "Luk 1:67-79": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei: Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht;", "Jes 53:11": "Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen.", "Jes 40:21": "Weet u het niet? Hoort u het niet? Is het u van het begin af aan niet bekendgemaakt? Hebt u niet gelet op de grondvesten van de aarde?", "Jer 1:7": "Maar de HEERE zei tegen mij: Zeg niet: Ik ben jong; want overal waarheen Ik u zenden zal, zult u gaan, en alles wat Ik u gebieden zal, zult u spreken.", "2 Tim 2:14-16": "Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders. Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt. Maar verzet u tegen het ongoddelijk ijdel geklets; want zij zullen in meerdere goddeloosheid toenemen.", "Hand 15:11": "Maar wij geloven door de genade van de Heere Jezus Christus zalig te worden, op dezelfde wijze als ook zij.", "Luk 2:31": "die U bereid hebt voor het aangezicht van alle volken:", "Ps 69:10": "Want de ijver voor Uw huis heeft mij verteerd; en de smaad van hen die U smaden, is op mij gevallen.", "Rom 3:13": "Hun keel is een geopend graf; met hun tongen plegen zij bedrog; slangenvenijn is onder hun lippen.", "Ex 32:16": "En diezelfde tafelen waren het werk van God; het schrift was ook het schrift van God zelf, in de tafelen gegraveerd.", "Ezech 18:32": "Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "Kol 3:3": "Want u bent gestorven, en uw leven is met Christus verborgen in God.", "Luk 1:68-73": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht; zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Num 20:10-12": "En Mozes en Aäron verzamelden de gemeente voor de steenrots, en hij zei tot hen: Hoor toch, u opstandigen, zullen wij water voor u uit deze steenrots laten voortkomen? Toen hief Mozes zijn hand op, en hij sloeg de steenrots tweemaal met zijn staf; en er kwam veel water uit, zodat de vergadering dronk, en haar beesten. Daarom zei de HEERE tot Mozes en tot Aäron: Omdat u Mij niet geloofd hebt, door Mij te heiligen voor de ogen van de kinderen van Israël, daarom zult u deze gemeente niet brengen in het land, dat Ik hun gegeven heb.", "Ps 109:3": "En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak.", "Jes 4:3": "En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem;", "Ps 105:26": "Hij zond Mozes, Zijn knecht, en Aäron, die Hij verkoren had.", "2 Kor 4:11": "Want wij, die leven, worden altijd om Jezus' wil in de dood overgegeven, opdat ook het leven van Jezus in ons sterfelijk vlees openbaar zou worden.", "Joh 10:15": "Zoals de Vader Mij kent, zo ken Ik ook de Vader; en Ik geef Mijn leven voor de schapen.", "Kol 1:5": "Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie;", "Hos 4:14": "Ik zal over uw dochters geen straf² brengen, omdat zij hoereren, en over uw bruiden, omdat zij overspel plegen; want zij zelf zonderen zich af met de hoeren, en offeren met de snoodste hoeren; het volk dan, dat geen verstand heeft, zal ten onder gaan.", "Jes 56:1": "Zo zegt de HEERE: Bewaar het recht en doe gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.", "Deut 29:18-28": "Dat onder u niet iemand is, man of vrouw, of gezin, of stam, die zijn hart heden afwendt van de HEERE, onze God, om de goden van deze volken te gaan dienen; dat onder u niet een wortel is, die gal en alsem draagt; En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen.", "Kol 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, en Timotheüs, de broeder,", "Spr 25:22": "Want u zult vurige kolen op zijn hoofd hopen, en de HEERE zal het u vergelden.", "1 Kor 14:19": "Maar ik wil liever in de Gemeente vijf woorden spreken met mijn verstand, opdat ik ook anderen mag onderwijzen, dan tienduizend woorden in een vreemde taal.", "Fil 1:9": "En dit bid ik God, dat uw liefde nog meer en meer overvloedig wordt in kennis en alle inzicht;", "Joh 12:47": "En als iemand Mijn woorden gehoord heeft en niet gelooft, oordeel Ik hem niet; want Ik ben niet gekomen om de wereld te oordelen, maar om de wereld zalig te maken.", "1 Tim 3:1-15": "Dit is een betrouwbaar woord: als iemand ernaar verlangt opziener te worden, begeert hij een voortreffelijk werk. Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren; niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "Job 22:14": "De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Jer 31:31-34": "Zie, de dagen komen, spreekt de HEERE, dat Ik met het huis van Israël en met het huis van Juda een nieuw verbond zal sluiten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hun hand vastgreep om hen uit het land Egypte uit te leiden, welk verbond van Mij zij verbroken hebben, hoewel Ik hen getrouwd had, spreekt de HEERE; Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "2 Kor 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, de Vader van de barmhartigheden, en de God van alle vertroosting;", "Kol 1:15": "Die het Beeld is van de onzienlijke God, de Eerstgeborene van alle schepselen.", "Joh 10:28": "En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken.", "Matt 12:45": "Dan gaat hij weg en neemt zeven andere geesten met zich mee, slechter dan hijzelf, en zij gaan naar binnen en wonen daar; en het laatste van die mens wordt erger dan het eerste. Zo zal het ook met dit slechte geslacht gaan.", "Jes 28:9": "Aan wie zou Hij dan de kennis leren, en aan wie zou Hij het gehoorde te verstaan geven? Aan hen die van de melk gespeend zijn, die van de borsten weggehaald zijn?", "Luk 11:52": "Wee u, wetgeleerden, want u hebt de sleutel van de kennis weggenomen; u zelf bent niet naar binnen gegaan, en hen die naar binnen gingen, hebt u tegengehouden.", "Rom 1:3": "over Zijn Zoon, Die geworden is uit het geslacht van David, naar het vlees;", "Jes 7:14": "Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen.", "Spr 3:12": "Want de HEERE kastijdt hem die Hij liefheeft, ja, zoals een vader de zoon in wie hij een welbehagen heeft.", "Jes 29:18": "En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien.", "Hebr 10:26-29": "Want als wij willens en wetens zondigen, nadat wij de kennis van de waarheid ontvangen hebben, blijft er geen offer meer over voor de zonden; maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;", "Ps 14:7": "Och, dat Israëls verlossing uit Sion kwam! Als de HEERE de gevangenen van Zijn volk zal doen terugkeren, dan zal Jakob zich verheugen, Israël zal blij zijn.", "1 Tess 2:17-20": "Maar wij, broeders, van u beroofd geweest voor een korte tijd, naar het gezicht, niet naar het hart, hebben ons des te meer ingespannen om uw gezicht te zien, met grote begeerte. Daarom hebben wij tot u willen komen (zeker ik, Paulus) een keer en opnieuw, maar de satan heeft ons verhinderd. Want wat is onze hoop, of blijdschap, of kroon van het roem? Bent u dat niet, voor onze Heere Jezus Christus bij Zijn komst?", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "2 Kor 5:17": "Dus als iemand in Christus is, is hij een nieuw schepsel; het oude is voorbijgegaan, zie, het is alles nieuw geworden.", "Hand 2:16-21": "Maar dit is wat gesproken is door de profeet Joël: En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren.", "Hebr 13:10": "Wij hebben een altaar waarvan zij die de tabernakel dienen, geen macht hebben om te eten.", "Rom 1:16": "Want ik schaam mij niet voor het Evangelie van Christus; want het is een kracht van God tot zaligheid voor ieder die gelooft, eerst de Jood, en ook de Griek.", "1 Joh 4:9": "Hierin is de liefde van God jegens ons geopenbaard, dat God Zijn eniggeboren Zoon gezonden heeft in de wereld, opdat wij zouden leven door Hem.", "Rom 16:1-16": "En ik beveel u Febe aan, onze zuster, die een dienares is van de Gemeente die te Kenchreen is; opdat u haar ontvangt in de Heere, zoals het de heiligen betaamt, en haar bijstaat in welke zaak zij u ook nodig zou hebben; want zij is een voorstandster geweest van velen, ook van mijzelf. Groet Priscilla en Aquila, mijn medewerkers in Christus Jezus;", "Ezech 14:11": "Opdat het huis van Israël niet meer van achter Mij afdwaalt, en zij zich niet meer verontreinigen met al hun overtredingen; dan zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn, spreekt de Heere HEERE.", "Hand 2:39": "Want voor u is de belofte, en voor uw kinderen, en voor allen die ver weg zijn, zoveel als de Heere, onze God, ertoe roepen zal.", "Mark 10:15": "Voorwaar, Ik zeg u: Wie het Koninkrijk van God niet ontvangt als een kind, die zal er geenszins ingaan.", "Joh 1:50": "Nathanaël antwoordde en zei tegen Hem: Rabbi! U bent de Zoon van God, U bent de Koning van Israël.", "Ps 78:5": "Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken;", "Ex 32:32": "Nu dan, als Gij hun zonde wilt vergeven! Maar zo niet, delg mij dan nu uit Uw boek, dat Gij geschreven hebt.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Hos 11:7": "Want Mijn volk blijft hangen aan de afkering van Mij; zij roepen het wel tot de Allerhoogste, maar niet één verhoogt Hem.", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Hebr 12:15": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.", "Hand 13:37": "Maar Hij, Die God opgewekt heeft, heeft geen verderving gezien.", "Joh 6:33": "Want het Brood van God is Hij Die uit de hemel neerdaalt en Die aan de wereld het leven geeft.", "Ps 51:8": "Zie, U hebt lust tot waarheid in het binnenste, en in het verborgene maakt U mij wijsheid bekend.", "Jes 5:13": "Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Ps 19:5": "Hun richtsnoer gaat uit over de hele aarde, en hun redenen tot het einde van de wereld; Hij heeft daarin een tent gesteld voor de zon.", "Openb 3:21": "Wie overwint, hem zal Ik geven met Mij te zitten op Mijn troon, zoals Ik ook overwonnen heb, en Mij gezet heb met Mijn Vader op Zijn troon.", "Deut 18:15-19": "Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren, naar alles wat u van de HEERE, uw God, bij Horeb, op de dag van de samenkomst, gevraagd hebt, en zei: Ik wil de stem van de HEERE, mijn God, niet meer horen, en dit grote vuur wil ik niet meer zien, opdat ik niet sterf. Toen zei de HEERE tot mij: Het is goed, wat zij gesproken hebben.", "Jes 42:18-20": "Hoort, u doven! En kijkt toe, u blinden, om te zien. Wie is er blind als Mijn knecht, en doof, zoals Mijn bode, die Ik zend? Wie is blind, zoals de volmaakte, en blind, zoals de knecht van de HEERE? U ziet wel veel dingen, maar u bewaart ze niet; en al doet hij de oren open, toch hoort hij niet.", "Mark 12:10": "Hebt u deze Schrift niet gelezen: De steen die de bouwers verworpen hebben, die is tot een hoeksteen geworden;", "Gen 18:18": "Omdat Abraham zeker tot een groot en machtig volk zal worden, en alle volken van de aarde in hem gezegend zullen worden?", "Ps 107:17-21": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden; Hun ziel gruwde van alle voedsel, en zij waren tot aan de poorten van de dood gekomen. Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Spr 19:22": "De wens van de mens is zijn weldadigheid; maar de arme is beter dan een leugenachtig man.", "Ps 22:25": "Want Hij heeft niet veracht, noch verfoeid de verdrukking van de verdrukte, noch Zijn aangezicht voor hem verborgen; maar Hij heeft gehoord, toen hij tot Hem riep.", "Luk 4:8": "En Jezus antwoordde en zei tegen hem: Ga weg van Mij, satan, want er is geschreven: U zult de Heere, uw God, aanbidden, en Hem alleen dienen.", "Jes 4:4": "wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Jes 42:21": "De HEERE had een welbehagen aan Hem, om Zijn gerechtigheid; Hij maakte Hem groot door de wet, en Hij maakte Hem heerlijk.", "Joh 14:9-11": "Jezus zei tegen hem: Ben Ik zo lange tijd bij u, en hebt u Mij niet gekend, Filippus? Wie Mij gezien heeft, heeft de Vader gezien; en hoe zegt u dan: Toon ons de Vader? Gelooft u niet dat Ik in de Vader ben, en de Vader in Mij is? De woorden die Ik tegen u spreek, spreek Ik niet uit Mijzelf, maar de Vader, Die in Mij blijft, Die doet de werken. Geloof Mij, dat Ik in de Vader ben en de Vader in Mij is; en zo niet, geloof Mij dan om de werken zelf.", "Ex 32:8": "Zij zijn snel afgeweken van de weg die Ik hun geboden had; zij hebben zich een gegoten kalf gemaakt, zich daarvoor neergebogen, er offers aan gebracht, en gezegd: Dit zijn uw goden, Israël, die u uit Egypteland hebben opgevoerd.", "Matt 22:24": "En zeiden: Meester! Mozes heeft gezegd: Als iemand sterft zonder kinderen te hebben, zal zijn broer met zijn vrouw trouwen en voor zijn broer nakomelingen verwekken.", "2 Kor 2:1-17": "Maar ik heb dit bij mijzelf voorgenomen, dat ik niet opnieuw met droefheid tot u zou komen. Want als ik u bedroef, wie is het dan die mij vrolijk maakt, dan degene die door mij bedroefd is geworden? En dat heb ik u geschreven, opdat ik, als ik daar kom, niet de droefheid zou hebben van hen door wie ik juist verblijd zou moeten worden; en ik vertrouw van u allen dat mijn blijdschap ook de blijdschap van u allen is.", "Ef 3:8": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,", "Jes 52:12": "Want u zult niet haastig weggaan, en ook niet vluchtend heengaan; want de HEERE zal voor uw aangezicht heentrekken, en de God van Israël zal uw achterhoede zijn.", "Rom 3:2": "Veel, in alle opzichten; want dit is wel het eerste, dat hun de woorden van God zijn toevertrouwd.", "Joh 10:17": "Daarom heeft de Vader Mij lief, omdat Ik Mijn leven afleg, opdat Ik het opnieuw neem.", "2 Kor 6:16": "Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Hand 13:39": "En dat ieder die gelooft, door Hem gerechtvaardigd wordt van alles waarvan u niet gerechtvaardigd kon worden door de wet van Mozes.", "1 Tess 2:12": "en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.", "Jes 38:2": "Toen keerde Hizkia zijn gezicht om naar de wand, en hij bad tot de HEERE.", "1 Joh 2:9": "Wie zegt, dat hij in het licht is, en zijn broeder haat, die is tot nu toe in de duisternis.", "Joh 1:18": "Niemand heeft ooit God gezien; de eniggeboren Zoon, Die in de schoot van de Vader is, Die heeft Hem ons verklaard.", "Hebr 10:38": "Maar de rechtvaardige zal uit het geloof leven; en als iemand zich terugtrekt, heeft Mijn ziel in hem geen behagen.", "Joh 15:20": "Denk aan het woord dat Ik u gezegd heb: Een dienstknecht is niet meer dan zijn heer. Als zij Mij vervolgd hebben, zullen zij ook u v
