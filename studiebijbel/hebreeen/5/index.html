ester te worden, maar Die tot Hem gesproken heeft: Gij zijt Mijn Zoon, heden heb Ik U gegenereerd.", "6": "Gelijk Hij ook in een andere *plaats* zegt: Gij zijt Priester in der eeuwigheid, naar de ordening van Melchizedek.", "7": "Die in de dagen Zijns vleses, gebeden en smekingen tot Dengene, Die Hem uit den dood kon verlossen, met sterke roeping en tranen geofferd hebbende, en verhoord zijnde uit de vreze.", "8": "Hoewel Hij de Zoon was, *nochtans* gehoorzaamheid geleerd heeft, uit hetgeen Hij heeft geleden.", "9": "En geheiligd zijnde, is Hij allen, die Hem gehoorzaam zijn, een oorzaak der eeuwige zaligheid geworden;", "10": "En is van God genaamd een Hogepriester, naar de ordening van Melchizedek.", "11": "Van Denwelken wij hebben vele dingen, en zwaar om te verklaren, te zeggen, dewijl gij traag om te horen geworden zijt.", "12": "Want gij, daar gij leraars behoordet te zijn vanwege den tijd, hebt wederom van node, dat men u lere, welke de eerste beginselen zijn der woorden Gods; en gij zijt geworden, *als* die melk van node hebben, en niet vaste spijze.", "13": "Want een iegelijk, die der melk deelachtig is, die is onervaren in het woord der gerechtigheid; want hij is een kind.", "14": "Maar der volmaakten is de vaste spijze, die door de gewoonheid de zinnen geoefend hebben, tot onderscheiding beide des goeds en des kwaads."}, "KJV": {"1": "For every high priest taken from among men is ordained for men in things *pertaining* to God, that he may offer both gifts and sacrifices for sins:", "2": "Who can have compassion on the ignorant, and on them that are out of the way; for that he himself also is compassed with infirmity.", "3": "And by reason hereof he ought, as for the people, so also for himself, to offer for sins.", "4": "And no man taketh this honour unto himself, but he that is called of God, as *was* Aaron.", "5": "So also Christ glorified not himself to be made an high priest; but he that said unto him, Thou art my Son, to day have I begotten thee.", "6": "As he saith also in another *place*, Thou *art* a priest for ever after the order of Melchisedec.", "7": "Who in the days of his flesh, when he had offered up prayers and supplications with strong crying and tears unto him that was able to save him from death, and was heard in that he feared;", "8": "Though he were a Son, yet learned he obedience by the things which he suffered;", "9": "And being made perfect, he became the author of eternal salvation unto all them that obey him;", "10": "Called of God an high priest after the order of Melchisedec.", "11": "Of whom we have many things to say, and hard to be uttered, seeing ye are dull of hearing.", "12": "For when for the time ye ought to be teachers, ye have need that one teach you again which *be* the first principles of the oracles of God; and are become such as have need of milk, and not of strong meat.", "13": "For every one that useth milk *is* unskilful in the word of righteousness: for he is a babe.", "14": "But strong meat belongeth to them that are of full age, *even* those who by reason of use have their senses exercised to discern both good and evil."}}, "tsk": {"1": [{"kopje": "elke", "refs": ["Hebr 10:11", "Ex 28:1-14", "Ex 29:1-37", "Lev 8:2"]}, {"kopje": "wordt aangesteld", "refs": ["Hebr 8:3"]}, {"kopje": "voor de mensen", "refs": ["Hebr 2:17", "Num 16:46-48", "Num 18:1-3"]}, {"kopje": "opdat", "refs": ["Hebr 8:3", "Hebr 9:9", "Hebr 10:11", "Hebr 11:4", "Lev 9:7", "Lev 9:15-21"]}], "2": [{"kopje": "die", "refs": ["Hebr 2:18", "Hebr 4:15"]}, {"kopje": "onwetenden", "refs": ["Num 15:22-29", "1 Tim 1:13"]}, {"kopje": "zelf", "refs": ["Hebr 12:13", "Ex 32:8", "Richt 2:17", "Jes 30:11"]}, {"kopje": "omgeven is", "refs": ["Hebr 7:28", "Ex 32:2-5", "Ex 32:21-24", "Num 12:1-9", "Num 20:10-12", "Luk 22:32", "2 Kor 11:30", "2 Kor 12:5", "2 Kor 12:9", "2 Kor 12:10", "Gal 4:13"]}], "3": [{"kopje": "zo", "refs": ["Hebr 7:27", "Hebr 9:7", "Ex 29:12-19", "Lev 4:3-12", "Lev 8:14-21", "Lev 9:7", "Lev 16:6", "Le remia/11/#v5", "ref": "Jer 11:5", "svLabel": null}, {"disp": "Jer 32:22", "href": "../../jeremia/32/#v22", "ref": "Jer 32:22", "svLabel": null}, {"disp": "Ezech 20:6", "href": "../../ezechiel/20/#v6", "ref": "Ezech 20:6", "svLabel": null}, {"disp": "Joël 3:18", "href": "../../joel/3/#v18", "ref": "Joël 3:18", "svLabel": null}, {"disp": "1 Kor 3:2", "href": "../../1-korinthe/3/#v2", "ref": "1 Kor 3:2", "svLabel": null}, {"disp": "Hebr 5:12", "href": "../../hebreeen/5/#v12", "ref": "Hebr 5:12", "svLabel": null}, {"disp": "Hebr 5:13", "href": "../../hebreeen/5/#v13", "ref": "Hebr 5:13", "svLabel": null}, {"disp": "1 Petr 2:2", "href": "../../1-petrus/2/#v2", "ref": "1 Petr 2:2", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ef 2:15": "doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Matt 22:39": "En het tweede, hieraan gelijk, is: U zult uw naaste liefhebben als uzelf.", "Joh 14:16": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid;", "Ex 13:12": "dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn.", "Jer 5:5": "Ik zal naar de groten gaan, en met hen spreken, want die kennen de weg van de HEERE, het recht van hun God; maar zij hadden samen het juk verbroken, en de banden verscheurd.", "Hebr 7:28": "Want de wet stelt tot hogepriesters mensen aan, die zwakheid hebben; maar het woord van de eedzwering, dat na de wet gekomen is, stelt de Zoon aan, Die in eeuwigheid volmaakt gemaakt is.", "Matt 5:33": "Wederom hebt u gehoord dat tot de ouden gezegd is: U zult de eed niet breken, maar u zult aan de Heere uw eden houden.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "1 Joh 2:8": "Opnieuw schrijf ik u een nieuw gebod: wat waar is in Hem, is ook waar in u; want de duisternis gaat voorbij, en het waarachtige licht schijnt nu.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "1 Petr 4:10": "Ieder bedient, naar de gave die hij ontvangen heeft, daarmee de anderen, als goede uitdelers van de veelsoortige genade van God.", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "Rom 11:10": "Dat hun ogen verduisterd worden, om niet te zien; en verkrom hun rug alle tijd.", "Luk 7:47": "Daarom zeg Ik u: haar zonden, die vele waren, zijn haar vergeven; want zij heeft veel liefgehad; maar aan wie weinig vergeven wordt, die heeft weinig lief.", "Luk 4:11": "En dat zij U op de handen zullen dragen, opdat U uw voet niet ooit aan een steen stoot.", "Joh 20:31": "maar deze zijn geschreven, opdat u gelooft dat Jezus de Christus is, de Zoon van God; en opdat u, door te geloven, het leven hebt in Zijn Naam.", "1 Petr 1:7": "opdat de beproeving van uw geloof — die veel kostbaarder is dan goud, dat vergaat en toch door het vuur beproefd wordt — bevonden wordt te zijn tot lof, eer en heerlijkheid bij de openbaring van Jezus Christus;", "Hand 13:34": "En dat Hij Hem uit de doden heeft opgewekt, zodat Hij niet meer tot verderving zal terugkeren, heeft Hij zo gezegd: Ik zal u de weldaden van David geven, die betrouwbaar zijn;", "Rom 5:17-19": "Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus. Zo dan, zoals door één misdaad de schuld gekomen is over alle mensen tot verdoemenis; zo komt ook door één rechtvaardigheid de genade over alle mensen tot rechtvaardigmaking van het leven. Want zoals door de ongehoorzaamheid van die ene mens velen tot zondaars gesteld zijn geworden, zo zullen ook door de gehoorzaamheid van Één velen tot rechtvaardigen gesteld worden.", "Luk 19:46": "en zei tegen hen: Er is geschreven: Mijn huis is een huis van het gebed; maar u hebt er een rovershol van gemaakt.", "Lev 19:34": "De vreemdeling die als vreemdeling bij u verblijft, zal onder u zijn als een inboorling van u; u zult hem liefhebben als uzelf; want u bent vreemdeling geweest in Egypteland; Ik ben de HEERE, uw God!", "Ps 14:4": "Hebben dan alle werkers van de ongerechtigheid geen kennis, die mijn volk opeten alsof zij brood aten? Zij roepen de HEERE niet aan.", "Jer 21:8": "En tegen dit volk zult u zeggen: Zo zegt de HEERE: Zie, Ik stel voor uw gezicht de weg van het leven en de weg van de dood.", "Joh 15:15": "Ik noem u niet meer dienstknechten; want de dienstknecht weet niet wat zijn heer doet; maar Ik heb u vrienden genoemd; want alles wat Ik van Mijn Vader gehoord heb, dat heb Ik u bekendgemaakt.", "Hebr 12:5-11": "En u bent de vermaning vergeten, die tot u spreekt als tot zonen: Mijn zoon, acht de kastijding van de Heere niet klein, en bezwijk niet als u door Hem bestraft wordt; Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt. Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt?", "Hand 26:29": "En Paulus zei: Ik zou van God wensen dat, zowel bijna als geheel, niet alleen u, maar ook allen die mij vandaag horen, zulke mensen werden zoals ik ben, uitgezonderd deze boeien.", "Ef 6:22": "die ik met datzelfde doel naar u toe gezonden heb, opdat u onze zaken zou weten, en hij uw hart zou vertroosten.", "Rom 15:10": "En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk!", "Deut 26:15": "Zie neer vanuit Uw heilige woning, vanuit de hemel, en zegen Uw volk Israël, en het land dat U ons gegeven hebt, zoals U onze vaderen gezworen hebt, een land van melk en honing vloeiend.", "Luk 1:72-74": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken; en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven dat wij, verlost uit de hand van onze vijanden, Hem zonder vrees zouden dienen,", "Spr 25:21": "Als hij die u haat, honger heeft, geef hem brood te eten; en als hij dorstig is, geef hem water te drinken;", "Rom 15:15": "Maar ik heb u ten dele des te vrijmoediger geschreven, broeders, u als het ware opnieuw dit in herinnering brengend, om de genade die mij van God gegeven is;", "Hand 16:17": "Zij volgde Paulus en ons achterna en riep: Deze mensen zijn dienstknechten van God, de Allerhoogste, die ons de weg van de zaligheid verkondigen.", "Joh 10:27": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij.", "Hand 15:7-9": "En toen daarover een grote twist ontstond, stond Petrus op en zei tegen hen: Mannen broeders, u weet dat God van lang geleden onder ons mij uitgekozen heeft, dat de heidenen door mijn mond het woord van het Evangelie zouden horen, en geloven. En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons; en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.", "2 Kron 29:11": "Mijn zonen, wees nu niet traag; want de HEERE heeft u uitgekozen, om voor Zijn aangezicht te staan, om Hem te dienen, en opdat u Hem dienaars en wierokers zou zijn.", "Rom 3:18": "Er is geen vreze van God voor hun ogen.", "Kol 4:4": "opdat ik die openbaar maak, zoals ik moet spreken.", "Jes 30:12": "Daarom, zo zegt de Heilige van Israël: Omdat u dit woord verwerpt, en vertrouwt op onderdrukking en verkeerdheid, en daarop steunt:", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "2 Kor 3:9": "Want als de bediening van de verdoemenis heerlijkheid geweest is, is de bediening van de rechtvaardigheid veel meer overvloedig in heerlijkheid.", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Fil 3:7-11": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Matt 23:39": "Want Ik zeg u: U zult Mij van nu af aan niet zien, totdat u zeggen zult: Gezegend is Hij Die komt in de Naam van de Heere!", "Job 36:8-10": "En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben; En Hij opent hun oor voor de tucht, en zegt dat zij zich van de ongerechtigheid moeten bekeren.", "Hand 20:27": "Want ik heb niet nagelaten u heel de raad van God te verkondigen.", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "1 Kor 11:32": "Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.", "1 Petr 3:8": "En tenslotte, wees allen eensgezind, meelevend, heb de broeders lief, wees met innerlijke barmhartigheid bewogen, vriendelijk;", "Luk 22:27": "Want wie is meer, hij die aanzit, of hij die dient? Is het niet hij die aanzit? Maar Ik ben in uw midden, als iemand die dient.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "Joh 8:33": "Zij antwoordden Hem: Wij zijn Abrahams nageslacht, en hebben nog nooit iemand gediend; hoe kunt U dan zeggen: U zult vrij worden?", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Matt 5:42": "Geef aan hem die iets van u vraagt, en keer u niet af van hem die van u wil lenen.", "Num 18:1-3": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen. En ook zult u uw broeders, de stam van Levi, de stam van uw vader, met u laten naderen, zodat zij u worden bijgevoegd, en u dienen; maar u, en uw zonen met u, zult voor de tent der getuigenis zijn. En zij zullen uw wacht waarnemen, en de wacht van de hele tent; maar tot het gereedschap van het heiligdom en het altaar zullen zij niet naderen, opdat zij niet sterven, zij zowel als u.", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Joh 12:13": "Namen zij de takken van palmbomen, en gingen Hem tegemoet, en riepen: Hosanna! Gezegend is Hij, Die komt in de Naam van de Heere, de Koning van Israël!", "Matt 10:40": "Wie u ontvangt, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem, Die Mij gezonden heeft.", "Matt 24:12": "En omdat de ongerechtigheid zal toenemen, zal de liefde van velen verkillen.", "Ps 118:23": "Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen.", "Mark 1:14": "En nadat Johannes overgeleverd was, kwam Jezus in Galilea, en predikte het Evangelie van het Koninkrijk van God,", "Jes 52:6": "Daarom zal Mijn volk, daarom zal het Mijn Naam op die dag kennen, dat Ik het Zelf ben, Die spreekt: Zie, hier ben Ik.", "1 Kon 8:41-43": "Zelfs ook aangaande de vreemdeling, die niet van Uw volk Israël zal zijn, maar uit ver land komt om Uw Naam wil; (want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis; hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Mark 12:31": "En het tweede, hieraan gelijk, is dit: U zult uw naaste liefhebben als uzelf. Er is geen ander gebod groter dan deze.", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "Ps 119:18": "Ontdek mijn ogen, dat ik aanschouw de wonderen van Uw wet.", "Ezech 18:26": "Als de rechtvaardige zich afkeert van zijn gerechtigheid, en onrecht doet, en daarin sterft, zal hij in zijn onrecht, dat hij gedaan heeft, sterven.", "Joh 3:8-12": "De wind waait waarheen hij wil, en u hoort zijn geluid; maar u weet niet waar hij vandaan komt en waar hij heen gaat; zo is ieder die uit de Geest geboren is. Nicodemus antwoordde en zei tegen Hem: Hoe kunnen deze dingen gebeuren? Jezus antwoordde en zei tegen hem: Bent u een leraar van Israël, en weet u deze dingen niet?", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "Jak 3:1": "Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Job 33:24": "Zo zal Hij hem genadig zijn, en zeggen: Verlos hem, dat hij in het verderf niet nederdaalt, Ik heb verzoening gevonden.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "Ef 4:8-10": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven. Nu dit: Hij is opgevaren; wat betekent dit anders dan dat Hij ook eerst neergedaald is in de laagste delen van de aarde? Die neergedaald is, is Dezelfde ook, Die opgevaren is ver boven alle hemelen, opdat Hij alle dingen zou vervullen.", "Jes 59:16": "Omdat Hij zag dat er niemand was, ontzette Hij Zich, omdat er geen voorbidder was; daarom bracht Zijn arm Hem heil, en Zijn gerechtigheid ondersteunde Hem.", "1 Kor 1:17": "Want Christus heeft mij niet gezonden om te dopen, maar om het Evangelie te verkondigen; niet met wijsheid van woorden, opdat het kruis van Christus niet zinledig gemaakt wordt.", "Fil 1:7": "Zoals het bij mij recht is, dat ik dit denk van u allen, omdat ik u in mijn hart houd, en omdat u allen, zowel in mijn banden als in mijn verantwoording en bevestiging van het Evangelie, mede deelgenoot bent van mijn genade.", "Amos 5:4": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef.", "Gen 2:24": "Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.", "Openb 1:2": "die het woord van God betuigd heeft, en de getuigenis van Jezus Christus, en alles wat hij gezien heeft.", "1 Petr 1:14": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had;", "2 Sam 16:23": "In die dagen was de raad die Achitofel gaf, als had men naar het woord van God gevraagd; zo was alle raad van Achitofel, zowel bij David als bij Absalom.", "Ex 24:12": "Toen zei de HEERE tegen Mozes: Kom tot Mij op de berg, en wees daar; en Ik zal u stenen tafelen geven, en de wet, en de geboden, die Ik geschreven heb, om hen te onderwijzen.", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "Spr 9:1-6": "De opperste Wijsheid heeft haar huis gebouwd; zij heeft haar zeven pilaren gehouwen. Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt. Zij heeft haar dienstmeisjes uitgezonden; zij nodigt uit op de tinnen van de hoogten van de stad:", "Ps 2:7": "Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt.", "2 Tim 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, naar de belofte van het leven dat in Christus Jezus is,", "Gal 1:6": "Ik verwonder mij dat u zo snel, wijkend van hem die u in de genade van Christus geroepen heeft, overgebracht wordt naar een ander evangelie;", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Matt 5:7": "Zalig zijn de barmhartigen, want hun zal barmhartigheid geschieden.", "Hand 1:16": "Mannen broeders, deze Schrift moest vervuld worden, die de Heilige Geest bij monde van David voorzegd heeft over Judas, die de leidsman is geweest van hen die Jezus gevangennamen;", "Jes 1:3": "Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet.", "Ps 18:20": "En Hij voerde mij uit in de ruimte, Hij rukte mij eruit, want Hij had lust aan mij.", "Micha 4:12": "Maar zij kennen de gedachten van de HEERE niet, en begrijpen Zijn raadsbesluit niet; dat Hij hen bijeengebracht heeft als schoven op de dorsvloer.", "Matt 4:7": "Jezus zei tegen hem: Er is ook geschreven: U zult de Heere, uw God, niet beproeven.", "Joh 3:4": "Nicodemus zei tegen Hem: Hoe kan een mens geboren worden als hij al oud is? Kan hij soms voor de tweede keer in de buik van zijn moeder ingaan en geboren worden?", "Ef 1:20-22": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel; Ver boven alle overheid, en macht, en kracht, en heerschappij, en elke naam die genoemd wordt, niet alleen in deze wereld, maar ook in de toekomende; En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;", "Num 16:9": "Is het u te weinig, dat de God van Israël u van de vergadering van Israël heeft afgescheiden, om u tot Zich te laten naderen; om de dienst van de tabernakel van de HEERE te verrichten, en te staan voor het aangezicht van de vergadering, om hen te dienen?", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "Luk 5:31": "En Jezus antwoordde en zei tegen hen: Wie gezond zijn, hebben geen dokter nodig, maar wie ziek zijn.", "1 Tess 5:21": "Beproef alle dingen; behoud het goede.", "Hos 1:10": "Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.", "2 Tim 2:3": "Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus.", "1 Petr 1:22": "Nu u uw zielen gereinigd hebt door de gehoorzaamheid aan de waarheid, door de Geest, tot ongeveinsde broederlijke liefde, heb dan elkaar vurig lief uit een rein hart;", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Matt 20:25-28": "En Jezus riep hen bij Zich, en zei: U weet dat de leiders van de volken heerschappij voeren over hen, en de groten macht uitoefenen over hen. Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn; en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "Hab 1:5": "Ziet onder de heidenen, en aanschouwt, en verwonder u, verwonder u, want Ik werk een werk in uw dagen, dat u niet geloven zult, als het verteld wordt.", "Ps 116:10": "Ik heb geloofd, daarom sprak ik; ik ben zeer bedrukt geweest.", "1 Tess 5:8": "Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid.", "Ps 88:3": "Laat mijn gebed voor Uw aangezicht komen; neig Uw oor tot mijn geschrei.", "Spr 7:7-23": "En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling; Die voorbijging op de straat, naast haar hoek, en hij trad op de weg naar haar huis. In de schemering, in de avond van de dag, in de zwarte nacht en de donkerheid;", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Rom 2:26": "Als dan de voorhuid de rechten van de wet bewaart, zal zijn voorhuid dan niet tot een besnijdenis gerekend worden?", "Joh 5:36": "Maar Ik heb een getuigenis, groter dan dat van Johannes; want de werken die de Vader Mij gegeven heeft om te volbrengen, deze werken die Ik doe, getuigen van Mij dat de Vader Mij gezonden heeft.", "Luk 10:1": "En hierna wees de Heere nog tweeënzeventig anderen aan, en zond hen twee aan twee voor Zich uit, naar elke stad en plaats waar Hij komen zou.", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "Deut 6:13": "U zult de HEERE, uw God, vrezen, en Hem dienen; en u zult bij Zijn Naam zweren.", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "Joh 12:49": "Want Ik heb niet uit Mijzelf gesproken; maar de Vader, Die Mij gezonden heeft, Die heeft Mij een gebod gegeven wat Ik zeggen zal en wat Ik spreken zal.", "2 Kor 11:30": "Als men moet roemen, zal ik roemen over de dingen van mijn zwakheid.", "1 Kon 19:16": "Ook zult u Jehu, de zoon van Nimsi, zalven tot koning over Israël; en Elisa, de zoon van Safat, uit Abel-Mehola, zult u tot profeet zalven in uw plaats.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Gal 4:7": "Zo bent u dan niet meer een dienstknecht, maar een zoon; en als u een zoon bent, dan bent u ook een erfgenaam van God door Christus.", "Spr 8:1-5": "Roept de Wijsheid niet, en verheft de Verstandigheid niet Haar stem? Op de top van de hoge plaatsen, aan de weg, ter plaatse waar paden samenkomen, staat Zij; Aan de zijde van de poorten, voor aan de stad, aan de ingang van de deuren roept Zij overluid:", "Openb 22:2": "In het midden van haar straat en aan de ene en de andere zijde van de rivier was de boom des levens, die twaalf keer vrucht droeg, van maand tot maand zijn vrucht gevend; en de bladeren van de boom waren tot genezing van de heidenen.", "Hebr 9:22": "En bijna alle dingen worden door bloed gereinigd naar de wet, en zonder bloedstorting gebeurt er geen vergeving.", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "Joh 17:1": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt.", "1 Petr 4:8": "Maar heb vooral vurige liefde tot elkaar; want de liefde zal een menigte van zonden bedekken.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Joël 2:28-32": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien; Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten. En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "Gal 3:1-28": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd. Dit alleen wil ik van u leren: hebt u de Geest ontvangen uit de werken van de wet, of uit de prediking van het geloof? Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Jes 9:13": "Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag.", "Ex 25:40": "Zie er dan op toe dat u het maakt naar hun voorbeeld, dat u op de berg getoond is.", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Job 23:12": "Het gebod van Zijn lippen heb ik ook niet weggedaan; de woorden van Zijn mond heb ik meer weggelegd dan mijn bescheiden deel.", "Kol 1:28": "Hem verkondigen wij, terwijl wij ieder mens vermanen en ieder mens onderwijzen in alle wijsheid, opdat wij ieder mens volmaakt zouden stellen in Christus Jezus;", "Jes 9:12": "Want dit volk keert zich niet tot Hem, Die het slaat, en de HEERE van de heerscharen zoeken zij niet.", "1 Kor 2:16": "Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.", "Fil 3:15": "Laten wij dan, zovelen als wij volmaakt zijn, dit gevoelen; en als u ergens anders over denkt, ook dat zal God u openbaren.", "Rom 15:2": "Laat dan ieder van ons zijn naaste behagen ten goede, tot opbouw.", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "Jes 63:1": "Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen.", "Matt 13:13-16": "Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken. Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Matt 20:23": "En Hij zei tegen hen: Mijn drinkbeker zult u wel drinken, en met de doop waarmee Ik gedoopt word, zult u gedoopt worden; maar het zitten aan Mijn rechterhand en aan Mijn linkerhand, staat niet aan Mij te geven, maar het zal gegeven worden aan hen voor wie het bereid is door Mijn Vader.", "1 Sam 2:28": "En Ik heb hem uit alle stammen van Israël voor Mij tot priester verkozen, om te offeren op Mijn altaar, om het reukwerk aan te steken, om de efod voor Mijn aangezicht te dragen; en heb aan het huis van uw vader al de vuuroffers van de kinderen van Israël gegeven.", "Openb 22:6-8": "En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren. Zie, Ik kom haastig; zalig is hij die de woorden van de profetie van dit boek bewaart. En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "2 Kor 5:11": "Wij dan, die de schrik van de Heere kennen, bewegen de mensen tot het geloof, en wij zijn openbaar geworden voor God; en ik hoop dat wij ook in uw gewetens geopenbaard zijn geworden.", "Matt 13:15": "Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Hos 5:4": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet.", "Luk 11:1": "En het gebeurde, toen Hij op een zekere plaats was en bad, dat, toen Hij ophield, een van Zijn discipelen tegen Hem zei: Heere, leer ons bidden, zoals ook Johannes zijn discipelen geleerd heeft.", "Num 18:1": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.", "Joh 12:38": "Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard?", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "1 Petr 4:6": "Want daarom is ook aan de doden het Evangelie verkondigd, opdat zij weliswaar naar de mens in het vlees geoordeeld zouden worden, maar naar God zouden leven in de geest.", "Mark 11:9": "En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere!", "Deut 29:29": "De verborgen dingen zijn voor de HEERE, onze God; maar de geopenbaarde dingen zijn voor ons en voor onze kinderen, tot in eeuwigheid, om al de woorden van deze wet te doen.", "Hand 13:22": "En nadat Hij hem afgezet had, verwekte Hij hun David tot koning; aan wie Hij ook getuigenis gaf, en zei: Ik heb David gevonden, de zoon van Isaï, een man naar Mijn hart, die al Mijn wil zal doen.", "Deut 5:18": "En u zult geen overspel doen.", "2 Kor 9:9": "Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid.", "Mark 7:6": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij.", "1 Kor 15:55": "Dood, waar is uw prikkel? Graf, waar is uw overwinning?", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "1 Petr 1:6": "Daarin verheugt u zich, ook al bent u nu, voor een korte tijd (als het nodig is), bedroefd door allerlei beproevingen,", "Rom 6:17": "Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent;", "2 Tim 1:13": "Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Luk 8:12": "Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden.", "Matt 11:4-6": "En Jezus antwoordde en zei tegen hen: Ga heen en vertel Johannes weer wat u hoort en ziet: De blinden worden ziende, en de kreupelen wandelen; de melaatsen worden gereinigd, en de doven horen; de doden worden opgewekt, en de armen wordt het Evangelie verkondigd. En gelukkig is hij, die aan Mij niet geërgerd zal worden.", "Gen 17:5": "En uw naam zal niet meer Abram genoemd worden; maar uw naam zal Abraham zijn; want Ik heb u tot een vader van een menigte volken gemaakt.", "Mark 1:35": "En vroeg in de morgen, toen het nog diep in de nacht was, stond Hij op, ging naar buiten, en ging naar een eenzame plaats, en bad daar.", "Matt 22:32": "Ik ben de God van Abraham, en de God van Izak, en de God van Jakob! God is niet een God van de doden, maar van de levenden.", "Joh 4:11": "De vrouw zei tegen Hem: Heere, U hebt niets om mee te putten, en de put is diep; waar hebt U dan het levende water vandaan?", "Jes 22:13": "Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven.", "Ps 109:8": "Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "1 Kor 15:57": "Maar God zij dank, Die ons de overwinning geeft door onze Heere Jezus Christus.", "Rom 8:36": "(Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.)", "Joh 19:28": "Hierna, omdat Jezus wist dat nu alles volbracht was, zei Hij, opdat de Schrift vervuld zou worden: Ik heb dorst.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "Ezech 12:2": "Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.", "Spr 17:16": "Waarom toch zou de dwaas geld in zijn hand hebben, om wijsheid te kopen, terwijl hij geen verstand heeft?", "Jer 9:3": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Hand 2:11": "Kretenzers en Arabieren, wij horen hen in onze talen de grote werken van God spreken.", "Mark 9:7": "En er kwam een wolk die hen overschaduwde, en er kwam een stem uit de wolk: Dit is Mijn geliefde Zoon, hoor Hem!", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "2 Tim 2:1-7": "U dan, mijn zoon, word gesterkt in de genade die in Christus Jezus is; en wat u van mij gehoord hebt onder veel getuigen, vertrouw dat toe aan trouwe mensen, die bekwaam zullen zijn om ook anderen te leren. Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus.", "Num 16:46-48": "En Mozes zei tegen Aäron: Neem het wierookvat, en doe daar vuur in van het altaar, en leg reukwerk daarop, en ga haastig naar de vergadering, doe verzoening over hen; want er is grote toorn van voor het aangezicht van de HEERE uitgegaan, de plaag is begonnen. En Aäron nam het, zoals Mozes gesproken had, en liep midden in de gemeente, en zie, de plaag was al begonnen onder het volk; en hij legde reukwerk daarin, en deed verzoening over het volk. En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Hand 15:16": "Hierna zal Ik terugkeren, en de tabernakel van David, die vervallen is, weer opbouwen; en wat ervan verwoest is, zal Ik weer opbouwen, en Ik zal hem weer oprichten,", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "2 Petr 1:17": "Want Hij heeft van God de Vader eer en heerlijkheid ontvangen, toen zo'n stem van de hoogwaardige heerlijkheid tot Hem gebracht werd: Dit is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb.", "Luk 17:20": "En toen Hij door de Farizeeën gevraagd werd wanneer het Koninkrijk van God komen zou, antwoordde Hij hun en zei: Het Koninkrijk van God komt niet zichtbaar.", "Joh 15:4": "Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Jes 45:22": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.", "Ps 45:8": "U hebt gerechtigheid lief, en haat goddeloosheid; daarom heeft God, Uw God, U gezalfd met vreugdeolie, boven Uw metgezellen.", "Hand 13:32": "En wij verkondigen u de belofte, die aan de vaderen gedaan is,", "Joh 14:7": "Als u Mij gekend had, zou u ook Mijn Vader gekend hebben; en van nu af kent u Hem, en hebt Hem gezien.", "Spr 19:3": "De dwaasheid van de mens verdraait zijn weg; en zijn hart is boos op de HEERE.", "1 Petr 2:21": "Want hiertoe bent u geroepen, omdat ook Christus voor ons geleden heeft, ons een voorbeeld nalatend, opdat u Zijn voetstappen zou navolgen;", "Mark 8:21": "En Hij zei tegen hen: Hoe kan het dat u het niet begrijpt?", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Hand 4:12": "En de zaligheid is in geen Ander; want er is ook onder de hemel geen andere Naam, die onder de mensen gegeven is, waardoor wij moeten zalig worden.", "Mark 1:2": "Zoals geschreven is in de profeten: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg voor U heen bereiden zal.", "Gal 2:21": "Ik doe de genade van God niet teniet; want als de rechtvaardigheid door de wet is, dan is Christus tevergeefs gestorven.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "Kol 3:12": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld;", "1 Petr 1:16": "want er staat geschreven: Wees heilig, want Ik ben heilig.", "2 Kor 11:2": "Want ik ben ijverig over u met een ijver van God; want ik heb u toebereid om u als een reine maagd aan één man voor te stellen, namelijk aan Christus.", "Openb 2:18": "En schrijf aan de engel van de gemeente te Thyatire: Dit zegt de Zoon van God, Die Zijn ogen heeft als een vlam van vuur, en Zijn voeten blinkend koper gelijk zijn:", "Jer 4:22": "Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.", "Ex 12:46": "In één huis zal het gegeten worden; u mag van het vlees niet naar buiten, het huis uit, dragen, en u mag er geen been van breken.", "2 Kon 17:13": "Toen nu de HEERE tegen Israël en tegen Juda, door de dienst van alle profeten en van alle zieners, gewaarschuwd had en zei: Bekeer u van uw slechte wegen en houd Mijn geboden en Mijn inzettingen, naar de hele wet die Ik uw vaderen geboden heb, en die Ik u door de hand van Mijn knechten, de profeten, gezonden heb;", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Joh 6:32": "Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: Mozes heeft u niet het brood uit de hemel gegeven; maar Mijn Vader geeft u dat ware Brood uit de hemel.", "Hagg 2:8": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen.", "2 Tess 2:10": "en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "2 Kor 10:2": "Ik bid dan, dat ik, tegenwoordig zijnde, niet stout hoef te zijn met die vrijmoedigheid, waarmee ik denk stout te moeten optreden tegen sommigen, die ons zo beoordelen alsof wij naar het vlees wandelden.", "Mark 13:10": "En het Evangelie moet eerst gepredikt worden onder alle volken.", "Matt 4:15": "Het land Zebulon en het land Nafthali, aan de weg naar de zee, over de Jordaan, Galilea van de volken;", "1 Kor 2:13": "Die dingen spreken wij ook, niet met woorden die de menselijke wijsheid leert, maar met woorden die de Heilige Geest leert, terwijl wij geestelijke dingen met geestelijke vergelijken.", "Hand 7:6": "En God sprak zo, dat zijn nageslacht als vreemdeling zou wonen in een vreemd land, en dat men hen tot slaaf zou maken en slecht behandelen, vierhonderd jaar.", "Deut 31:17": "Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is?", "Luk 1:32": "Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven.", "Jona 2:4": "En ik zei: Ik ben weggestoten van voor Uw ogen; toch zal ik de tempel van Uw heiligheid weer aanschouwen.", "Ps 10:5": "Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg.", "Ps 61:2": "O God! hoor mijn geschrei, merk op mijn gebed.", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Hebr 3:7": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort,", "Joh 10:36-38": "zegt u dan tegen Mij, Die de Vader geheiligd en in de wereld gezonden heeft: U lastert God; omdat Ik gezegd heb: Ik ben Gods Zoon? Als Ik de werken van Mijn Vader niet doe, geloof Mij dan niet; maar als Ik ze doe, en u Mij niet gelooft, geloof dan de werken; opdat u mag weten en geloven dat de Vader in Mij is, en Ik in Hem.", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "Jes 53:10": "Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan.", "Hebr 3:7-10": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn; Waar uw vaders Mij beproefden; zij hebben Mij op de proef gesteld, en hebben Mijn werken gezien, veertig jaar lang.", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "Jak 3:2": "Want wij struikelen allen in veel dingen. Als iemand in woorden niet struikelt, die is een volmaakt man, in staat om ook het hele lichaam in toom te houden.", "1 Joh 2:4": "Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;", "1 Kor 1:21": "Want omdat de wereld God, in de wijsheid van God, niet door de wijsheid heeft gekend, heeft het God behaagd om door de dwaasheid van de prediking zalig te maken hen die geloven;", "Micha 6:9": "De stem van de HEERE roept tot de stad (want Uw Naam ziet het wezen): Hoor de roede, en wie haar besteld heeft!", "Dan 9:24": "Zeventig weken zijn bestemd over uw volk en over uw heilige stad, om de overtreding te sluiten, en om de zonden te verzegelen, en om de ongerechtigheid te verzoenen, en om een eeuwige gerechtigheid aan te brengen, en om het visioen en de profeet te verzegelen, en om het allerheiligst te zalven.", "Ps 89:28": "Ook zal Ik hem tot eerstgeboren zoon stellen, tot de hoogste over de koningen van de aarde.", "Gal 1:7": "terwijl er geen ander is; maar er zijn sommigen die u in verwarring brengen, en het Evangelie van Christus willen verdraaien.", "Hebr 1:2": "Die Hij gesteld heeft tot Erfgenaam van alles, door Wie Hij ook de wereld gemaakt heeft;", "Ex 30:10": "En Aäron zal eens per jaar over de hoornen ervan verzoening doen, met het bloed van het zondoffer van de verzoeningen; eens per jaar zal hij daarop verzoening doen bij uw geslachten; het is allerheiligst voor de HEERE!", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "2 Kor 6:2": "Want Hij zegt: In de aangename tijd heb Ik u verhoord, en in de dag van de zaligheid heb Ik u geholpen. Zie, nu is het de welaangename tijd, zie, nu is het de dag van de zaligheid!", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Ps 118:25": "Och HEERE, geef nu heil; och HEERE, geef nu voorspoed.", "1 Petr 2:22": "Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden;", "Matt 12:7": "Maar als u geweten had wat dit betekent: Ik wil barmhartigheid en geen offerande, dan zou u de onschuldigen niet veroordeeld hebben.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "1 Tess 3:7-10": "daarom zijn wij, broeders, over u vertroost geworden in al onze verdrukking en nood, door uw geloof; want nu leven wij, als u vast staat in de Heere. Want welke dankzegging kunnen wij aan God teruggeven voor u, vanwege al de blijdschap waarmee wij ons om u verblijden voor onze God?", "1 Kor 9:16-19": "Want als ik het Evangelie verkondig, is het voor mij geen roem; want de noodzaak is mij opgelegd. En wee mij, als ik het Evangelie niet verkondig! Want als ik dat gewillig doe, heb ik loon, maar als onwillig, is de uitdeling mij toch toevertrouwd. Wat loon heb ik dan? Namelijk dat ik, terwijl ik het Evangelie verkondig, het Evangelie van Christus kosteloos aanbied, om mijn macht in het Evangelie niet te misbruiken.", "Ex 24:8": "Toen nam Mozes dat bloed, en sprengde het op het volk; en hij zei: Zie, dit is het bloed van het verbond, dat de HEERE met u gemaakt heeft over al die woorden.", "Joh 5:45": "Denk niet dat Ik u zal aanklagen bij de Vader; hij die u aanklaagt, is Mozes, op wie u gehoopt hebt.", "Job 33:11": "Hij legt mijn voeten in de stok; Hij neemt al mijn paden waar.", "Ef 6:20": "waarvoor ik een gezant ben in een keten, opdat ik daarin vrijmoedig mag spreken, zoals het mij past te spreken.", "Ef 3:13": "Daarom bid ik dat u niet moedeloos wordt door mijn verdrukkingen voor u, wat uw heerlijkheid is.", "1 Kor 15:54": "En wanneer dit vergankelijke onvergankelijkheid zal hebben aangedaan, en dit sterfelijke onsterfelijkheid zal hebben aangedaan, dan zal het woord gebeuren dat geschreven is: De dood is verslonden tot overwinning.", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Ezech 6:10": "En zij zullen weten dat Ik de HEERE ben; Ik heb niet zonder reden gesproken over het aandoen van dit kwaad aan hen.", "Ps 35:23": "Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.", "Ef 2:9": "niet uit de werken, opdat niemand roemt.", "1 Kor 14:20": "Broeders, word geen kinderen in het verstand, maar wees kinderen in de boosheid, en word in het verstand volwassen.", "Matt 25:34-36": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "Rom 3:10-12": "zoals geschreven is: Er is niemand rechtvaardig, ook niet één; er is niemand die verstandig is, er is niemand die God zoekt. Allen zijn zij afgeweken, samen zijn zij onnut geworden; er is niemand die goed doet, er is zelfs niet één.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Matt 26:38": "Toen zei Hij tegen hen: Mijn ziel is zeer bedroefd, tot de dood toe; blijft hier en waakt met Mij.", "Matt 24:14": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen.", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "Hand 7:33": "En de Heere zei tegen hem: Doe de schoenen van uw voeten; want de plaats waarop u staat, is heilige grond.", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "Matt 22:44": "De Heere heeft gezegd tot mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb.", "Joh 3:34": "Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate.", "Joh 16:15": "Alles wat de Vader heeft, is van Mij; daarom heb Ik gezegd dat Hij het uit het Mijne zal nemen, en het u zal verkondigen.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Matt 21:42": "Jezus zei tegen hen: Hebt u nooit gelezen in de Schriften: De steen die de bouwers verworpen hebben, die is geworden tot een hoeksteen; dit is door de Heere gedaan, en het is wonderlijk in onze ogen?", "Ef 5:26": "opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord,", "Jes 53:8": "Hij is uit de angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken? Want Hij is afgesneden uit het land van de levenden; om de overtreding van Mijn volk is de plaag op Hem geweest.", "Luk 1:33": "En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.", "Luk 22:44": "En omdat Hij in zware strijd was, bad Hij des te ernstiger. En Zijn zweet werd als grote druppels bloed, die op de aarde afliepen.", "1 Kor 15:34": "Word op de juiste manier wakker, en zondig niet. Want sommigen hebben geen kennis van God. Ik zeg dit tot uw schaamte.", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Openb 21:6": "En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.", "Hand 4:8": "Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël!", "Hand 7:41": "En zij maakten een kalf in die dagen, en brachten een offer aan de afgod, en verheugden zich in de werken van hun eigen handen.", "Kol 1:25-27": "waarvan ik een dienaar geworden ben, naar de bedeling van God die mij gegeven is voor u, om het Woord van God te vervullen; namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen; aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "Deut 26:9": "En Hij heeft ons gebracht naar deze plaats; en Hij heeft ons dit land gegeven, een land vloeiend van melk en honing.", "1 Joh 5:9": "Als wij het getuigenis van mensen aannemen, het getuigenis van God is groter; want dit is het getuigenis van God, dat Hij van Zijn Zoon getuigd heeft.", "Gal 6:2": "Draag elkaars lasten, en vervul zo de wet van Christus.", "Jes 53:5": "Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Luk 11:21-26": "Wanneer een sterke, gewapende man zijn eigen woning bewaakt, dan is alles wat hij heeft in vrede. Maar als iemand die sterker is dan hij, hem overvalt en hem overwint, dan neemt die zijn hele wapenrusting weg, waarop hij vertrouwde, en deelt zijn buit uit. Wie niet met Mij is, die is tegen Mij; en wie niet met Mij verzamelt, die verstrooit.", "2 Kor 3:2": "U bent onze brief, geschreven in onze harten, gekend en gelezen door alle mensen;", "Ex 24:4": "Mozes nu beschreef al de woorden van de HEERE, en hij maakte zich 's morgens vroeg op, en hij bouwde een altaar onder aan de berg, en twaalf kolommen, naar de twaalf stammen van Israël.", "Ps 119:103": "Hoe zoet zijn Uw redenen voor mijn gehemelte geweest, meer dan honing voor mijn mond!", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Jer 17:13": "O HEERE, Israëls Verwachting! Allen die U verlaten, zullen beschaamd worden; en die van Mij afwijken, zullen in de aarde geschreven worden; want zij verlaten de HEERE, de Springader van het levende water.", "Luk 15:2": "En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen.", "Jes 2:5": "Kom, u huis van Jakob, en laat ons wandelen in het licht van de HEERE.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Joh 10:7": "Jezus dan zei opnieuw tegen hen: Voorwaar, voorwaar zeg Ik u: Ik ben de Deur van de schapen.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "1 Tess 5:14": "En wij bidden u, broeders, vermaan de ongeregelde mensen, vertroost de kleinmoedigen, ondersteun de zwakken, wees geduldig tegenover allen.", "Hebr 1:7": "En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zijn dienaars tot een vlam van het vuur.", "Matt 6:23": "maar als uw oog slecht is, zal heel uw lichaam duister zijn. Als dan het licht dat in u is duisternis is, hoe groot is dan die duisternis!", "Joh 18:11": "Jezus dan zei tegen Petrus: Steek uw zwaard in de schede. Zou Ik de drinkbeker die de Vader Mij gegeven heeft, niet drinken?", "Amos 5:25-27": "Hebt u Mij veertig jaar in de woestijn slachtoffers en spijsoffer gebracht, o huis van Israël? Ja, u droeg de tent van uw Melech, en de Kijun, uw beelden, de ster van uw god, die u zelf gemaakt had. Daarom zal Ik u gevankelijk wegvoeren, ver voorbij Damaskus, zegt de HEERE, Wiens Naam is God van de heerscharen.", "Gal 5:14": "Want de hele wet wordt in één woord vervuld, namelijk in dit: U zult uw naaste liefhebben als uzelf.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "1 Kor 3:19": "Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid;", "Zach 4:7": "Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem!", "Joh 6:52": "De Joden streden dan onder elkaar en zeiden: Hoe kan Hij ons Zijn vlees te eten geven?", "1 Kor 15:2": "door wie u ook zalig wordt, als u het vasthoudt op de manier zoals ik het u verkondigd heb; tenzij u tevergeefs geloofd hebt.", "Rom 15:29": "En ik weet dat ik, wanneer ik tot u kom, met volle zegen van het Evangelie van Christus komen zal.", "Matt 5:41": "en wie u zal dwingen één mijl te gaan, ga met hem twee mijl.", "Deut 19:15": "Eén enkele getuige zal tegen niemand opstaan in verband met enige ongerechtigheid of enige zonde, van welke zonde hij ook zou hebben gezondigd; op de verklaring van twee getuigen, of op de verklaring van drie getuigen, zal de zaak vaststaan.", "1 Kor 10:7": "En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Ps 40:7-9": "Gij hebt geen lust gehad aan slachtoffer en spijsoffer; Gij hebt mij de oren doorboord; brandoffer en zondoffer hebt Gij niet geëist. Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Luk 3:22": "en dat de Heilige Geest op Hem neerdaalde in lichamelijke gedaante, zoals een duif; en dat er een stem uit de hemel kwam, die zei: U bent Mijn geliefde Zoon, in U heb Ik Mijn welbehagen!", "Joh 6:46": "Niet dat iemand de Vader gezien heeft, behalve Hij Die van God is; Hij heeft de Vader gezien.", "Jak 2:11": "Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.", "Joh 1:23": "Hij zei: Ik ben de stem van hem die roept in de woestijn: Maak de weg van de Heere recht, zoals Jesaja, de profeet, gesproken heeft.", "1 Kor 9:18": "Wat loon heb ik dan? Namelijk dat ik, terwijl ik het Evangelie verkondig, het Evangelie van Christus kosteloos aanbied, om mijn macht in het Evangelie niet te misbruiken.", "Jes 25:6": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.", "Matt 13:51": "En Jezus zei tegen hen: Hebt u dit alles begrepen? Zij zeiden tegen Hem: Ja, Heere!", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Rom 5:8-11": "Maar God bevestigt Zijn liefde tegenover ons hierin, dat Christus voor ons gestorven is toen wij nog zondaars waren. Veelmeer dan zullen wij, nu gerechtvaardigd door Zijn bloed, door Hem behouden worden van de toorn. Want als wij, toen wij nog vijanden waren, met God verzoend zijn door de dood van Zijn Zoon, zullen wij des te meer, nu wij verzoend zijn, behouden worden door Zijn leven.", "Joh 19:37": "En weer zegt een andere Schrift: Zij zullen zien op Hem, in Wie zij gestoken hebben.", "Joh 12:28": "Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.", "1 Kor 1:24": "Maar voor hen die geroepen zijn, zowel Joden als Grieken, prediken wij Christus, de kracht van God, en de wijsheid van God.", "Ef 2:13-18": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus. Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Rom 15:1": "Maar wij, die sterk zijn, zijn schuldig de zwakheden van de onsterken te dragen, en niet onszelf te behagen.", "Matt 5:48": "Wees dan volmaakt, zoals uw Vader, Die in de hemelen is, volmaakt is.", "Jes 55:1-3": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Mark 12:29": "En Jezus antwoordde hem: Het eerste van alle geboden is: Hoor, Israël! De Heere, onze God, is een enig Heere.", "Matt 27:24-50": "Toen Pilatus nu zag dat hij niets bereikte, maar dat er juist meer oproer kwam, nam hij water en waste zijn handen voor de menigte, en zei: Ik ben onschuldig aan het bloed van deze Rechtvaardige; u moet maar toezien. En al het volk antwoordde en zei: Laat Zijn bloed komen over ons, en over onze kinderen. Toen liet hij hun Barabbas los; maar nadat hij Jezus gegeseld had, gaf hij Hem over om gekruisigd te worden.", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Hebr 4:1-10": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Luk 18:20": "U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Jes 62:11": "Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Hand 4:25": "Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht?", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Matt 23:16-24": "Wee u, blinde leidslieden, die zeggen: Wie ook zweert bij de tempel, dat is niets; maar wie zweert bij het goud van de tempel, die is verplicht zijn eed te houden. Dwazen en blinden, want wat is meer, het goud, of de tempel die het goud heiligt? En wie zweert bij het altaar, dat is niets; maar wie zweert bij de gave die daarop ligt, die is verplicht zijn eed te houden.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "1 Kor 11:3": "Maar ik wil dat u weet, dat Christus het Hoofd is van iedere man, en de man het hoofd van de vrouw, en God het Hoofd van Christus.", "Ef 3:14": "Om deze reden buig ik mijn knieën voor de Vader van onze Heere Jezus Christus,", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Luk 15:4-32": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Deut 31:19": "En nu, schrijf u dit lied, en leer het de kinderen van Israël; leg het in hun mond; opdat dit lied Mij tot getuige zij tegen de kinderen van Israël.", "2 Kor 1:14": "Zoals u ook ten dele ons erkend hebt, dat wij uw roem zijn, zoals u ook de onze bent, in de dag van de Heere Jezus.", "Matt 6:22": "De lamp van het lichaam is het oog; als dan uw oog helder is, zal heel uw lichaam verlicht zijn;", "Jer 30:2": "Zo spreekt de HEERE, de God van Israël: Schrijf u al de woorden, die Ik tot u gesproken heb, in een boek.", "1 Joh 4:3": "en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "Deut 31:22": "Zo schreef Mozes dit lied op die dag, en hij leerde het de kinderen van Israël.", "Mal 4:6": "En hij zal het hart van de vaders terugbrengen tot de kinderen, en het hart van de kinderen tot hun vaders, zodat Ik niet hoef te komen en de aarde met de ban sla.", "Ezra 7:10": "Want Ezra had zijn hart erop gericht om de wet van de HEERE te zoeken en te doen, en om in Israël de inzettingen en de rechten te leren.", "1 Tess 1:3": "Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader;", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "2 Petr 2:2": "En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Ps 107:10-14": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer; Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden. Daarom heeft Hij hun hart door zwarigheid vernederd; zij zijn gestruikeld, en er was geen helper.", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Richt 16:20": "En zij zei: De Filistijnen over u, Simson! En hij werd wakker uit zijn slaap, en zei: Ik zal ditmaal uitgaan, zoals de andere keren, en mij uitschudden; want hij wist niet, dat de HEERE van hem geweken was.", "Matt 17:5": "Terwijl hij nog sprak, zie, een lichtende wolk overschaduwde hen; en zie, een stem uit de wolk zei: Dit is Mijn geliefde Zoon, in wie Ik Mijn welbehagen heb; luister naar Hem!", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "1 Petr 4:1": "Omdat Christus dan voor ons in het vlees geleden heeft, wapent u zich ook met dezelfde gedachte, namelijk dat wie in het vlees geleden heeft, opgehouden heeft met de zonde;", "1 Kor 13:11": "Toen ik een kind was, sprak ik als een kind, was ik gezind als een kind, overlegde ik als een kind; maar toen ik een man geworden ben, heb ik wat bij een kind hoort tot niets gemaakt.", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "Ps 141:1": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep.", "Matt 4:3": "En de verzoeker kwam naar Hem toe en zei: Als U Gods Zoon bent, zeg dan dat deze stenen broden worden.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Rom 10:16": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?", "2 Kor 3:18": "En wij allen, die met ongedekt gezicht de heerlijkheid van de Heere aanschouwen als in een spiegel, worden naar datzelfde beeld veranderd van heerlijkheid tot heerlijkheid, als door de Geest van de Heere.", "Ps 68:19-21": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God! Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela. Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Ef 6:17": "En neem de helm van de zaligheid, en het zwaard van de Geest, dat is het Woord van God.", "Ps 51:10": "Doe mij vreugde en blijdschap horen; laat de beenderen zich verheugen die U verbrijzeld hebt.", "Kol 1:29": "waartoe ik ook arbeid, terwijl ik strijd naar Zijn werking, die in mij werkt met kracht.", "Gal 2:2": "En ik ging op door een openbaring, en stelde hun het Evangelie voor dat ik predik onder de heidenen; en in het bijzonder aan hen die in aanzien waren, opdat ik niet op enige manier tevergeefs zou lopen of gelopen hebben.", "Joh 1:44": "De volgende dag wilde Jezus weggaan naar Galilea, en Hij vond Filippus, en zei tegen hem: Volg Mij.", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Mark 2:14": "En terwijl Hij voorbijging, zag Hij Levi, de zoon van Alfeüs, in het tolhuis zitten, en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "1 Kron 16:35": "En zegt: Verlos ons, o God van ons heil, en verzamel ons, en red ons van de heidenen, opdat wij Uw heilige Naam loven, en opdat wij ons in Uw lof roemen.", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Deut 11:18": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen;", "Gal 3:11": "En dat niemand door de wet gerechtvaardigd wordt voor God, is duidelijk; want de rechtvaardige zal uit het geloof leven.", "Joh 5:37": "En de Vader, Die Mij gezonden heeft, Die heeft Zelf van Mij getuigd. U hebt Zijn stem nooit gehoord, en Zijn gedaante ook niet gezien.", "Matt 22:37": "En Jezus zei tegen hem: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw verstand.", "Micha 5:3": "En Hij zal staan, en zal weiden in de kracht van de HEERE, in de hoogheid van de Naam van de HEERE, Zijn God, en zij zullen wonen, want nu zal Hij groot zijn tot aan de einden van de aarde.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "2 Kron 6:24-31": "En wanneer Uw volk Israël voor het aangezicht van de vijand geslagen zal worden, omdat zij tegen U gezondigd zullen hebben, en zich bekeren, en Uw Naam belijden, en voor Uw aangezicht in dit huis bidden en smeken zullen, Hoor U dan uit de hemel, en vergeef de zonden van Uw volk Israël, en breng hen terug in het land dat U hun en hun vaders gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben, en zij in deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Ps 82:5": "Zij weten niet, en verstaan niet; zij wandelen steeds in duisternis; daardoor wankelen alle fundamenten van de aarde.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Kol 2:5": "Want hoewel ik naar het vlees van u ben, ben ik toch met de geest bij u, terwijl ik mij verblijd en uw ordening zie, en de vastheid van uw geloof in Christus.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Ef 6:3": "opdat het u goed gaat, en u lang leeft op de aarde.", "1 Tess 3:12": "En moge de Heere u doen toenemen en overvloedig maken in de liefde tot elkaar en tot allen, zoals wij ook zijn tot u,", "Kol 1:27": "aan wie God bekend heeft willen maken wat de
