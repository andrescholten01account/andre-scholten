ervolgen; als zij Mijn woord bewaard hebben, zullen zij ook het uwe bewaren.", "Joh 17:20": "En Ik bid niet alleen voor dezen, maar ook voor hen die door hun woord in Mij geloven zullen.", "Ezech 33:18": "Als de rechtvaardige afwijkt van zijn gerechtigheid en onrecht doet, zal hij daarin sterven.", "Matt 11:28-30": "Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven. Neem Mijn juk op u, en leer van Mij, dat Ik zachtmoedig ben en nederig van hart; en u zult rust vinden voor uw zielen. Want Mijn juk is zacht, en Mijn last is licht.", "Rom 10:19": "Maar ik zeg: Heeft Israël het niet begrepen? Mozes zegt eerst: Ik zal u tot jaloersheid verwekken door hen die geen volk zijn; door een onverstandig volk zal Ik u tot toorn verwekken.", "Rom 10:6-8": "Maar de rechtvaardigheid die uit het geloof is, spreekt zo: Zeg niet in uw hart: Wie zal naar de hemel opklimmen? Dat is: om Christus van boven af te brengen. Of: wie zal in de afgrond neerdalen? Dat is: om Christus uit de doden op te brengen. Maar wat zegt zij? Dicht bij u is het Woord, in uw mond en in uw hart. Dit is het Woord van het geloof, dat wij prediken;", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "2 Kor 10:4": "Want de wapens van onze strijd zijn niet vleselijk, maar krachtig door God, tot het neerwerpen van bolwerken;", "Luk 2:34": "En Simeon zegende hen, en zei tegen Maria, Zijn moeder: Zie, Deze wordt gezet tot een val en opstanding van velen in Israël, en tot een teken dat weersproken zal worden.", "Luk 3:4-6": "zoals geschreven is in het boek van de woorden van Jesaja, de profeet, die zei: De stem van iemand die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht! Elk dal zal gevuld worden, en elke berg en heuvel zal verlaagd worden, en de kromme wegen zullen tot een rechte weg worden, en de oneffen tot effen wegen. En alle vlees zal de zaligheid van God zien.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Job 34:3": "Want het oor proeft de woorden, zoals het gehemelte het voedsel smaakt.", "Rom 16:25": "Hem nu, Die machtig is u te bevestigen, naar mijn Evangelie en de prediking van Jezus Christus, naar de openbaring van het geheimenis dat sinds mensenheugenis verzwegen is geweest;", "Kol 1:3": "Wij danken de God en Vader van onze Heere Jezus Christus, terwijl wij altijd voor u bidden,", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "1 Kor 1:31": "Opdat het zij, zoals geschreven is: Wie roemt, laat hij roemen in de Heere.", "Ps 22:20": "Maar U, HEERE! Wees niet ver; mijn Sterkte! Haast U tot mijn hulp.", "Richt 2:21": "zo zal Ik ook niet doorgaan om voor hun aangezicht iemand uit de bezitting te verdrijven, van de heidenvolken die Jozua heeft achtergelaten toen hij stierf;", "Judas 1:21": "Bewaar uzelf in de liefde van God, terwijl u de barmhartigheid van onze Heere Jezus Christus verwacht, tot het eeuwige leven.", "Hebr 2:9": "maar wij zien Jezus met heerlijkheid en eer gekroond, Die een weinig minder dan de engelen geworden was, vanwege het lijden van de dood, opdat Hij door de genade van God voor allen de dood zou proeven.", "Openb 7:9": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen.", "Matt 27:9": "Toen is vervuld wat gesproken is door de profeet Jeremia, die zei: En zij hebben de dertig zilverstukken genomen, de prijs van Hem Die gewaardeerd was, op wie de kinderen van Israël een waarde gesteld hadden;", "Tit 2:4": "Opdat zij de jonge vrouwen leren bezonnen te zijn, hun mannen lief te hebben, hun kinderen lief te hebben;", "Rom 3:24-26": "en worden om niet gerechtvaardigd, uit Zijn genade, door de verlossing die in Christus Jezus is; Hem heeft God voorgesteld tot een verzoening, door het geloof in Zijn bloed, tot een betoning van Zijn gerechtigheid, door de vergeving van de zonden die eerder gebeurd zijn, tijdens de verdraagzaamheid van God; tot een betoning van Zijn gerechtigheid in deze tegenwoordige tijd; opdat Hij rechtvaardig is, en rechtvaardigend degene die uit het geloof van Jezus is.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Luk 20:42": "En David zelf zegt in het boek van de Psalmen: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand,", "1 Joh 5:20": "Maar wij weten dat de Zoon van God gekomen is, en ons het verstand gegeven heeft, opdat wij de Waarachtige kennen; en wij zijn in de Waarachtige, namelijk in Zijn Zoon Jezus Christus. Deze is de waarachtige God, en het eeuwige Leven.", "Klaagl 1:5": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander.", "Gen 49:18": "Op Uw zaligheid wacht ik, HEERE!", "Mal 1:2": "Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad,", "Luk 17:21": "En men zal niet zeggen: Zie hier, of zie daar, want zie, het Koninkrijk van God is binnen in u.", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Rom 15:7": "Daarom neemt elkaar aan, zoals ook Christus ons aangenomen heeft, tot de heerlijkheid van God.", "Rom 1:17": "Want de rechtvaardigheid van God wordt daarin geopenbaard uit geloof tot geloof; zoals geschreven is: Maar de rechtvaardige zal uit het geloof leven.", "Ex 20:12-17": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.", "Hebr 9:16": "Want waar een testament is, daar is het nodig dat de dood van hem die het testament maakte, tussenbeide komt;", "Rom 8:3": "Want wat voor de wet onmogelijk was, omdat zij door het vlees krachteloos was, dat heeft God gedaan: Hij heeft Zijn eigen Zoon gezonden in de gelijkenis van het zondige vlees, en dat voor de zonde, en Hij heeft de zonde veroordeeld in het vlees.", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "1 Petr 1:23": "u die opnieuw geboren bent, niet uit vergankelijk, maar uit onvergankelijk zaad, door het levende en eeuwig blijvende Woord van God.", "2 Tim 3:17": "opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "Kol 4:17": "En zeg tegen Archippus: Let op de bediening die u hebt aangenomen in de Heere, dat u die vervult.", "1 Kor 10:26": "want de aarde is van de Heere, en al wat zij bevat.", "Lev 26:14-42": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen; En als u Mijn inzettingen smadelijk verwerpt, en als uw ziel van Mijn rechten walgt, zodat u niet al Mijn geboden doet, om Mijn verbond te vernietigen; Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten.", "Joh 6:53-58": "Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: als u het vlees van de Zoon des mensen niet eet en Zijn bloed niet drinkt, hebt u geen leven in uzelf. Wie Mijn vlees eet en Mijn bloed drinkt, heeft het eeuwige leven; en Ik zal hem opwekken op de laatste dag. Want Mijn vlees is werkelijk voedsel, en Mijn bloed is werkelijk drank.", "Hand 5:32": "En wij zijn Zijn getuigen van deze dingen; en ook de Heilige Geest, Die God gegeven heeft hun die Hem gehoorzaam zijn.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Ef 5:14": "Daarom zegt Hij: Ontwaak, u die slaapt, en sta op uit de doden; en Christus zal over u lichten.", "Gen 46:26": "Al de zielen die met Jakob naar Egypte kwamen, uit zijn heup voortgekomen, behalve de vrouwen van de zonen van Jakob, waren allen zesenzestig zielen.", "Joël 3:18": "En het zal op die dag gebeuren dat de bergen zullen druipen van zoete wijn, en de heuvels zullen stromen van melk, en alle stromen van Juda vol water zullen gaan; en er zal een bron uit het huis van de HEERE uitgaan, en die zal het dal van Sittim bewateren.", "Ps 89:16": "Gelukkig is het volk dat het geschal kent; o HEERE! zij zullen in het licht van Uw aangezicht wandelen.", "Fil 1:30": "Terwijl u dezelfde strijd hebt als die u bij mij gezien hebt, en nu bij mij hoort.", "Rom 9:28": "Want Hij voltooit een zaak en snijdt haar af in rechtvaardigheid; want de Heere zal een afgesneden zaak doen op de aarde.", "Joh 7:37-39": "En op de laatste dag, zijnde de grote dag van het feest, stond Jezus en riep: Als iemand dorst heeft, laat hij tot Mij komen en drinken. Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien. (En dit zei Hij van de Geest, die zij die in Hem geloven zouden ontvangen; want de Heilige Geest was er nog niet, omdat Jezus nog niet verheerlijkt was.)", "Dan 4:25-27": "Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil. Dat er ook gezegd is dat men de stronk met de wortels van die boom zou laten staan; uw koninkrijk zal u zeker blijven, nadat u zult hebben erkend dat de Hemel heerst. Daarom, o koning, laat mijn raad u behagen, en breek uw zonden af door gerechtigheid, en uw ongerechtigheden door genade te bewijzen aan de ellendigen, of er misschien verlenging van uw vrede mocht zijn.", "Mark 9:19": "En Hij antwoordde hem en zei: O ongelovig geslacht, hoelang zal Ik nog bij u zijn? Hoelang zal Ik u nog verdragen? Breng hem bij Mij.", "Luk 14:16-24": "Maar Hij zei tegen hem: Een zeker mens bereidde een groot avondmaal, en nodigde er velen voor uit. En hij stuurde zijn dienstknecht op het uur van het avondmaal om tegen de genodigden te zeggen: Kom, want alles is nu klaar. En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd.", "Matt 26:53": "Of denkt u dat Ik Mijn Vader nu niet kan bidden, en Hij zal Mij meer dan twaalf legioenen engelen ter beschikking stellen?", "1 Kor 1:9": "God is getrouw, door Wie u geroepen bent tot de gemeenschap van Zijn Zoon Jezus Christus, onze Heere.", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "Mark 7:7": "Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen;", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Ef 2:14": "Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft,", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Joh 20:21": "Jezus zei dan opnieuw tegen hen: Vrede zij u; zoals de Vader Mij gezonden heeft, zend Ik ook u.", "Hand 20:22-24": "En nu, zie, ik, gebonden door de Geest, reis naar Jeruzalem, zonder te weten wat mij daar zal overkomen; Behalve dat de Heilige Geest van stad tot stad betuigt en zegt dat mij boeien en verdrukkingen te wachten staan. Maar ik geef niets om mijn leven, en houd het niet dierbaar voor mijzelf, als ik mijn loop maar met blijdschap mag volbrengen, en de dienst die ik van de Heere Jezus ontvangen heb, om het Evangelie van de genade van God te betuigen.", "Joh 6:37": "Alles wat de Vader Mij geeft, zal tot Mij komen; en wie tot Mij komt, zal Ik beslist niet buitensluiten.", "Rom 12:16": "Wees eensgezind onder elkaar. Streef niet naar de hoge dingen, maar voeg u naar het nederige. Wees niet wijs bij uzelf.", "Joh 7:29": "Maar Ik ken Hem; want Ik ben van Hem, en Hij heeft Mij gezonden.", "Jona 1:14": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd.", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "1 Tess 2:3-12": "Want onze vermaning is niet voortgekomen uit dwaling, niet uit onreinheid, en niet met bedrog; maar zoals wij door God beproefd zijn, zodat ons het Evangelie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft. Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige!", "Matt 12:17-21": "Opdat vervuld zou worden wat gesproken is door de profeet Jesaja, die zei: Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen. Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen.", "Kol 1:25-29": "waarvan ik een dienaar geworden ben, naar de bedeling van God die mij gegeven is voor u, om het Woord van God te vervullen; namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen; aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "1 Tess 1:4": "Wij weten, geliefde broeders, dat u door God uitgekozen bent;", "Hos 6:6": "Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "Rom 15:9": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.", "Kol 3:11": "waarin niet is Griek en Jood, besnijdenis en voorhuid, barbaar en Scyth, dienstknecht en vrije; maar Christus is alles en in allen.", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "Gal 3:1": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd.", "Openb 5:6": "En ik zag, en zie, in het midden van de troon, en van de vier dieren, en in het midden van de oudsten, een Lam, dat stond als geslacht, met zeven horens en zeven ogen; dat zijn de zeven Geesten van God, die uitgezonden zijn over de hele aarde.", "Joh 8:43": "Waarom begrijpt u Mijn spraak niet? Het is omdat u Mijn woord niet kunt horen.", "Kol 1:23": "als u maar blijft in het geloof, gefundeerd en vast, en niet wordt weggebracht van de hoop van het Evangelie dat u gehoord hebt, dat gepredikt is onder alle schepselen die onder de hemel zijn; waarvan ik, Paulus, een dienaar geworden ben;", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Matt 22:38": "Dit is het eerste en het grootste gebod.", "Luk 24:46": "En Hij zei tegen hen: Zo staat er geschreven, en zo moest de Christus lijden, en op de derde dag opstaan uit de doden.", "Hand 13:26": "Mannen broeders, kinderen van het geslacht van Abraham, en zij die onder u God vrezen, tot u is het woord van deze zaligheid gezonden.", "Rom 9:33": "zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.", "Joh 14:19": "Nog een korte tijd, en de wereld zal Mij niet meer zien; maar u zult Mij zien; want Ik leef, en u zult leven.", "2 Kor 3:13": "en doen niet zoals Mozes, die een sluier op zijn gezicht legde, opdat de kinderen van Israël niet strak zouden kijken naar het einde van wat teniet gedaan wordt.", "2 Tess 1:12": "Opdat de Naam van onze Heere Jezus Christus verheerlijkt wordt in u, en u in Hem, naar de genade van onze God en de Heere Jezus Christus.", "Jes 28:10": "Want het is gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig.", "1 Petr 2:2": "En verlang als pasgeboren kinderen naar de zuivere melk van het Woord, opdat u daardoor mag groeien;", "Gen 18:10": "En Hij zei: Ik zal zeker bij u terugkomen, omstreeks deze tijd volgend jaar; en zie, Sara, uw vrouw, zal een zoon hebben! En Sara hoorde het aan de deur van de tent, die achter Hem was.", "Jes 29:14": "daarom, zie, Ik zal verder wonderlijk handelen met dit volk, wonderlijk en wonderbaarlijk; want de wijsheid van zijn wijzen zal vergaan, en het verstand van zijn verstandigen zal zich verbergen.", "2 Kor 1:24": "Niet dat wij heerschappij voeren over uw geloof, maar wij zijn medewerkers van uw blijdschap; want u staat door het geloof.", "Matt 22:31": "En wat de opstanding van de doden betreft, hebt u niet gelezen wat door God tot u gesproken is, toen Hij zei:", "1 Petr 2:4-7": "Kom naar Hem toe, als naar een levende Steen, door de mensen wel verworpen, maar bij God uitverkoren en kostbaar; Dan wordt u ook zelf, als levende stenen, gebouwd tot een geestelijk huis, tot een heilig priesterschap, om geestelijke offers te brengen die God aangenaam zijn door Jezus Christus. Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Num 3:5-13": "En de HEERE sprak tot Mozes en zei: Laat de stam van Levi naderen, en stel hem voor het aangezicht van de priester Aäron, opdat zij hem dienen; En dat zij zijn wacht waarnemen, en de wacht van de hele vergadering, voor de tent der samenkomst, om de dienst van de tabernakel te bedienen;", "Matt 17:17": "Jezus antwoordde en zei: O ongelovig en verkeerd geslacht, hoe lang zal Ik nog bij u zijn, hoe lang zal Ik u nog verdragen? Breng hem hier bij Mij.", "Zach 14:8": "Ook zal het op die dag gebeuren, dat er levend water uit Jeruzalem zal vloeien, de helft daarvan naar de oostzee, en de helft daarvan naar de achterste zee toe; het zal 's zomers en 's winters zijn.", "Ef 5:2": "en wandel in de liefde, zoals ook Christus ons liefgehad heeft, en Zichzelf voor ons heeft overgegeven als een offerande en een slachtoffer, God tot een welriekende reuk.", "Luk 4:10": "Want er is geschreven dat Hij Zijn engelen bevelen zal geven over U, dat zij U bewaren zullen;", "Joh 7:37": "En op de laatste dag, zijnde de grote dag van het feest, stond Jezus en riep: Als iemand dorst heeft, laat hij tot Mij komen en drinken.", "2 Kor 5:18": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.", "2 Kor 6:3-7": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt. Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "Jes 6:8-10": "Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, hier ben ik, zend mij heen. Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op. Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Ps 130:2": "Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen.", "2 Petr 1:3": "Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd;", "Matt 7:24-27": "Ieder dan die deze woorden van Mij hoort en ze doet, hem zal Ik vergelijken met een verstandig man, die zijn huis op een steenrots gebouwd heeft; En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangevallen, en het is niet gevallen, want het was op de steenrots gegrond. En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "Matt 10:16-24": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven. Maar wees op uw hoede voor de mensen; want zij zullen u overleveren aan de raadsvergaderingen, en zij zullen u geselen in hun synagogen; En u zult ook voor stadhouders en koningen geleid worden, om Mij, tot een getuigenis voor hen en de heidenen.", "Joh 5:34": "Toch neem Ik geen getuigenis van een mens aan; maar dit zeg Ik, opdat u behouden wordt.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Rom 10:15-18": "En hoe zullen zij prediken, als zij niet gezonden worden? Zoals geschreven is: Hoe lieflijk zijn de voeten van hen die vrede verkondigen, van hen die het goede verkondigen! Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd? Zo is dan het geloof uit het gehoor, en het gehoor door het Woord van God,", "Joh 4:6": "En daar was de fontein van Jakob. Jezus dan, vermoeid van de reis, ging zo bij de fontein zitten. Het was ongeveer het zesde uur.", "Deut 27:26": "Vervloekt is hij die de woorden van deze wet niet bevestigt door ze te doen! En heel het volk zal zeggen: Amen.", "Hebr 9:19": "Want toen alle geboden, naar de wet van Mozes, aan heel het volk uitgesproken waren, nam hij het bloed van kalveren en bokken, met water, en purperen wol, en hysop, en besprenkelde zowel het boek zelf, als heel het volk,", "Hand 13:3": "Toen vastten en baden zij, en nadat zij hun de handen opgelegd hadden, lieten zij hen gaan.", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Matt 26:56": "maar dit alles is gebeurd, opdat de Schriften van de profeten vervuld zouden worden. Toen vluchtten alle discipelen en lieten Hem in de steek.", "Ex 32:1-6": "Toen het volk zag dat Mozes lang wegbleef om van de berg af te komen, verzamelde het volk zich bij Aäron, en zij zeiden tegen hem: Sta op, maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft weggeleid, weten wij niet wat er van hem geworden is. Aäron zei tegen hen: Rukt de gouden oorringen af, die in de oren van uw vrouwen, uw zonen en uw dochters zijn, en breng ze bij mij. Toen rukte heel het volk de gouden oorringen af die in hun oren waren, en zij brachten ze bij Aäron.", "Joh 1:2": "Dit was in het begin bij God.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Mark 5:7": "En met luide stem roepend, zei hij: Wat heb ik met U te maken, Jezus, Zoon van God, de Allerhoogste? Ik bezweer U bij God, dat U mij niet pijnigt!", "Luk 13:35": "Zie, uw huis wordt aan u woest achtergelaten. En voorwaar, Ik zeg u, dat u Mij niet zult zien, totdat de tijd zal zijn gekomen dat u zult zeggen: Gezegend is Hij Die komt in de Naam van de Heere!", "Fil 4:1": "Dus, mijn geliefde en zeer gewenste broeders, mijn blijdschap en kroon, sta zo vast in de Heere, geliefden!", "Jes 53:4": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.", "Ef 5:23": "want de man is het hoofd van de vrouw, zoals ook Christus het Hoofd van de Gemeente is; en Hij is de Behouder van het lichaam.", "Joh 8:26-29": "Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld. Zij begrepen niet dat Hij tot hen over de Vader sprak. Jezus zei dan tegen hen: Wanneer u de Zoon des mensen verhoogd zult hebben, dan zult u weten dat Ik Die ben, en dat Ik niets uit Mijzelf doe; maar Ik spreek deze dingen zoals Mijn Vader Mij geleerd heeft.", "Joh 14:31": "Maar opdat de wereld weet dat Ik de Vader liefheb, en zo doe zoals de Vader Mij geboden heeft. Sta op, laten wij vanhier gaan.", "Jer 5:4": "Toch zei ik: Zeker, dit zijn de armen; zij handelen dwaas, omdat zij de weg van de HEERE, het recht van hun God, niet kennen.", "Hebr 12:2": "Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God.", "Joh 14:20": "Op die dag zult u weten dat Ik in Mijn Vader ben, en u in Mij, en Ik in u.", "Matt 27:10": "en zij hebben die gegeven voor de akker van de pottenbakker, zoals de Heere mij bevolen heeft.", "Joh 6:44-46": "Niemand kan tot Mij komen, als de Vader, Die Mij gezonden heeft, hem niet trekt; en Ik zal hem opwekken op de laatste dag. Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij. Niet dat iemand de Vader gezien heeft, behalve Hij Die van God is; Hij heeft de Vader gezien.", "Mark 9:41": "Want wie u een beker water te drinken zal geven in Mijn Naam, omdat u discipelen van Christus bent, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.", "Hebr 11:8": "Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou.", "Ps 8:5-7": "Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt? En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond? U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;", "Luk 20:43": "totdat Ik Uw vijanden tot een voetbank voor Uw voeten zal gezet hebben.", "Joh 8:57": "De Joden zeiden dan tegen Hem: U bent nog geen vijftig jaar, en hebt U Abraham gezien?", "Matt 26:28-44": "want dat is Mijn bloed, het bloed van het Nieuwe Testament, dat voor velen vergoten wordt, tot vergeving van de zonden. En Ik zeg u dat Ik van nu af aan niet zal drinken van de vrucht van de wijnstok tot op die dag, wanneer Ik die met u nieuw zal drinken in het Koninkrijk van Mijn Vader. En toen zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.", "Joh 10:25": "Jezus antwoordde hun: Ik heb het u gezegd, en u gelooft het niet. De werken die Ik doe in de Naam van Mijn Vader, die getuigen van Mij.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Dan 9:16-19": "O Heere! naar al Uw gerechtigheden, laat toch Uw toorn en Uw grimmigheid afgekeerd worden van Uw stad Jeruzalem, Uw heilige berg; want om onze zonden en om de ongerechtigheden van onze vaderen zijn Jeruzalem en Uw volk tot smaad bij allen die rondom ons zijn. En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf. Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn.", "Rom 11:9": "En David zegt: Hun tafel moet worden tot een strik, en tot een val, en tot een aanstoot, en tot een vergelding voor hen.", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Jer 36:2": "Neem een rol van het boek, en schrijf daarop alle woorden die Ik tot u gesproken heb over Israël, over Juda en over alle volken, vanaf de dag dat Ik tot u gesproken heb, vanaf de dagen van Josia tot op deze dag.", "Joh 3:27": "Johannes antwoordde en zei: Een mens kan niets aannemen, als het hem niet uit de hemel gegeven is.", "1 Kor 1:30": "Maar uit Hem bent u in Christus Jezus, Die voor ons geworden is wijsheid van God, en rechtvaardigheid, en heiligmaking, en verlossing;", "Rom 15:16": "opdat ik een dienaar van Jezus Christus zou zijn onder de heidenen, het Evangelie van God bedienend, opdat het offer van de heidenen aangenaam zou worden, geheiligd door de Heilige Geest.", "Ps 55:18": "'s Avonds, en 's morgens, en 's middags zal ik klagen en getier maken; en Hij zal mijn stem horen.", "2 Kor 12:5": "Van zo iemand zal ik roemen, maar van mijzelf zal ik niet roemen, dan in mijn zwakheden.", "Ps 132:17": "Daar zal Ik David een hoorn doen uitspruiten; Ik heb voor Mijn Gezalfde een lamp klaargemaakt.", "Joh 15:5": "Ik ben de Wijnstok, en u de ranken; die in Mij blijft, en Ik in hem, die draagt veel vrucht; want zonder Mij kunt u niets doen.", "Hebr 7:21": "maar Deze met eedzwering, door Hem die tot Hem gezegd heeft: De Heere heeft gezworen, en het zal Hem niet berouwen: U bent Priester in eeuwigheid naar de ordening van Melchizedek);", "Hebr 1:1-3": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon; Die Hij gesteld heeft tot Erfgenaam van alles, door Wie Hij ook de wereld gemaakt heeft; Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Deut 4:14": "Ook gebood de HEERE mij in diezelfde tijd dat ik u inzettingen en rechten zou leren; opdat u die deed in het land waar u naar toe trekt, om het in bezit te nemen.", "Hebr 6:20": "waar de Voorloper voor ons is ingegaan, namelijk Jezus, naar de ordening van Melchizedek, Hogepriester geworden in eeuwigheid.", "Spr 1:7": "De vrees van de HEERE is het beginsel van de wetenschap; de dwazen verachten wijsheid en tucht.", "Ex 32:2-5": "Aäron zei tegen hen: Rukt de gouden oorringen af, die in de oren van uw vrouwen, uw zonen en uw dochters zijn, en breng ze bij mij. Toen rukte heel het volk de gouden oorringen af die in hun oren waren, en zij brachten ze bij Aäron. En hij nam ze uit hun hand, bewerkte het met een graveerstift, en maakte er een gegoten kalf van. Toen zeiden zij: Dit zijn uw goden, Israël, die u uit Egypteland hebben opgevoerd!", "Ezra 9:6": "En ik zei: Mijn God, ik ben beschaamd en schaamrood om mijn aangezicht tot U op te heffen, mijn God; want onze ongerechtigheden zijn vermenigvuldigd tot boven ons hoofd, en onze schuld is groot geworden tot aan de hemel.", "Ef 3:6": "namelijk dat de heidenen medeerfgenamen zijn, en van hetzelfde lichaam, en mededeelgenoten van Zijn belofte in Christus, door het Evangelie;", "Hebr 3:8": "Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn;", "Jes 34:16": "Zoek in het boek van de HEERE, en lees; niet één van deze zal ontbreken, de één noch de ander zal men missen; want Mijn mond Zelf heeft het geboden, en Zijn Geest Zelf zal ze samenbrengen.", "Jer 2:8": "De priesters zeiden niet: Waar is de HEERE? en die de wet hanteerden, kenden Mij niet; en de herders overtraden tegen Mij; en de profeten profeteerden door Baäl, en wandelden naar dingen die geen nut doen.", "1 Tess 4:1-3": "Verder dan, broeders, wij bidden en vermanen u in de Heere Jezus, zoals u van ons ontvangen hebt hoe u moet wandelen en God behagen, dat u daarin meer overvloedig wordt. Want u weet, wat bevelen wij u gegeven hebben door de Heere Jezus. Want dit is de wil van God, uw heiliging: dat u zich onthoudt van de hoererij;", "Rom 8:26": "En evenzo komt ook de Geest onze zwakheden te hulp; want wij weten niet wat wij bidden moeten zoals het behoort, maar de Geest Zelf bidt voor ons met onuitsprekelijke zuchten.", "Jes 30:13": "Daarom zal deze misdaad voor u zijn als een vallende scheur, uitwaarts gebogen in een hoge muur, waarvan de breuk snel, in een ogenblik, komen zal.", "1 Tess 5:10": "Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven.", "Matt 21:31": "Wie van deze twee heeft de wil van de vader gedaan? Zij zeiden tegen Hem: De eerste. Jezus zei tegen hen: Voorwaar, Ik zeg u, dat de tollenaars en de hoeren u voorgaan in het Koninkrijk van God.", "1 Kor 15:27": "Want Hij heeft alle dingen aan Zijn voeten onderworpen. Maar wanneer Hij zegt dat Hem alle dingen onderworpen zijn, dan is het duidelijk dat Hij Zelf wordt uitgezonderd, Die Hem alle dingen onderworpen heeft.", "2 Kor 13:9": "Want wij verblijden ons, wanneer wij zwak zijn, en u sterk bent. En dit verlangen wij ook, namelijk uw volmaaktheid.", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "Jes 32:1-4": "Zie, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht. En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land. En de ogen van hen die zien, zullen niet terugzien, en de oren van hen die horen, zullen opmerken.", "Rom 9:25": "Zoals Hij ook bij Hosea zegt: Ik zal hen die Mijn volk niet waren, Mijn volk noemen, en haar die niet bemind was, Mijn beminde.", "Rom 15:5": "Doch de God van de lijdzaamheid en van de vertroosting geeft u dat u eensgezind bent onder elkaar naar Christus Jezus,", "Hebr 10:18-20": "Waar nu vergeving daarvan is, daar is geen offer meer voor de zonde nodig. Omdat wij dan, broeders, vrijmoedigheid hebben om in te gaan in het heiligdom door het bloed van Jezus, langs een nieuwe en levende weg, die Hij voor ons heeft ingewijd door het voorhangsel heen, dat is: door Zijn vlees;", "2 Kor 3:15": "Maar tot op de huidige dag, telkens als Mozes gelezen wordt, ligt er een deksel op hun hart.", "Deut 32:28": "Want zij zijn een volk, dat door raadslagen verloren gaat, en er is geen verstand in hen.", "Hebr 10:5-9": "Daarom zegt Hij, bij Zijn komst in de wereld: Slachtoffer en offergave hebt U niet gewild, maar U hebt Mij een lichaam toebereid; Brandoffers en offers voor de zonde hebben U niet behaagd. Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Tit 1:3": "Namelijk Zijn Woord, door de prediking, die mij toevertrouwd is, naar het bevel van God, onze Zaligmaker;", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Joh 15:9": "Zoals de Vader Mij liefgehad heeft, heb Ik ook u liefgehad; blijft in deze Mijn liefde.", "Ps 40:9": "Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Hand 7:40": "en zeiden tegen Aäron: Maak ons goden, die voor ons uit gaan; want wat deze Mozes betreft, die ons uit het land van Egypte geleid heeft, wij weten niet wat er met hem gebeurd is.", "Mal 1:3": "en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn.", "Rom 10:21": "Maar tegen Israël zegt Hij: De hele dag heb Ik Mijn handen uitgestrekt naar een ongehoorzaam en tegensprekend volk.", "Luk 10:27": "En hij antwoordde: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw kracht, en met heel uw verstand; en uw naaste als uzelf.", "1 Kon 3:9": "Geef dan Uw knecht een verstandig hart om Uw volk te richten, en om onderscheid te kunnen maken tussen goed en kwaad; want wie zou dit zware volk van U kunnen richten?", "Luk 9:56": "Want de Zoon des mensen is niet gekomen om het leven van mensen te vernietigen, maar om het te behouden. En zij gingen naar een ander dorp.", "Jes 25:8": "Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Ef 2:17": "En toen Hij kwam, heeft Hij door het Evangelie vrede verkondigd aan u, die ver weg was, en aan hen die nabij waren.", "Mark 10:7": "Daarom zal een man zijn vader en zijn moeder verlaten, en zich aan zijn vrouw hechten;", "Luk 1:16": "En hij zal velen van de kinderen van Israël bekeren tot de Heere, hun God.", "Deut 18:15": "Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren,", "Hebr 13:20": "De God nu van de vrede, Die de grote Herder van de schapen, door het bloed van het eeuwige testament, uit de doden heeft teruggebracht, namelijk onze Heere Jezus Christus,", "2 Kor 12:20": "Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn;", "Matt 27:35": "Nadat zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, door het lot te werpen; opdat vervuld zou worden wat gezegd is door de profeet: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen.", "Ezech 33:13": "Als Ik tegen de rechtvaardige zeg dat hij zeker zal leven, en hij op zijn gerechtigheid vertrouwt en onrecht doet, dan zal aan al zijn gerechtigheden niet meer gedacht worden, maar in zijn onrecht, dat hij doet, daarin zal hij sterven.", "Hebr 2:14": "Omdat nu de kinderen deel hebben aan vlees en bloed, heeft Hij Zelf op dezelfde manier daaraan deelgenomen, opdat Hij door de dood hem teniet zou doen die de macht over de dood had, dat is: de duivel;", "Mark 10:8": "en die twee zullen tot één vlees zijn, zodat zij niet meer twee zijn, maar één vlees.", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Mark 15:24": "En toen zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, en wierpen het lot erover, wat ieder zou wegnemen.", "Hand 10:36": "Dit is het woord dat Hij gezonden heeft aan de kinderen van Israël, terwijl Hij vrede verkondigt door Jezus Christus; Deze is een Heere van allen.", "Hand 13:23": "Uit het nageslacht van deze heeft God, naar de belofte, voor Israël de Zaligmaker Jezus verwekt;", "Ef 5:31": "Daarom zal een mens zijn vader en moeder verlaten, en zal zich aan zijn vrouw hechten; en die twee zullen tot één vlees worden.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Ex 3:5-10": "En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land. Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien. En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "1 Joh 5:13": "Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "Spr 24:18": "Opdat de HEERE het niet ziet, en het kwaad is in Zijn ogen en Hij Zijn toorn van hem afkeert.", "Rom 10:18": "Maar ik zeg: Hebben zij het niet gehoord? Zeker wel, hun geluid is over de hele aarde uitgegaan, en hun woorden tot de einden van de wereld.", "Luk 24:47": "En in Zijn Naam moesten bekering en vergeving van de zonden gepredikt worden onder alle volken, te beginnen bij Jeruzalem.", "Luk 9:28": "En het gebeurde ongeveer acht dagen na deze woorden, dat Hij Petrus, Johannes en Jakobus meenam en de berg opklom om te bidden.", "Ex 20:11": "want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "1 Tim 2:3-6": "Want dat is goed en aangenaam voor God, onze Zaligmaker; Die wil dat alle mensen zalig worden en tot kennis van de waarheid komen. Want er is één God, er is ook één Middelaar van God en de mensen, de Mens Christus Jezus;", "Jer 17:9": "Arglistig is het hart, meer dan enig ding, ja, dodelijk is het; wie zal het kennen?", "1 Sam 3:4-10": "dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "1 Kon 8:22-30": "En Salomo stond voor het altaar van de HEERE, tegenover de hele gemeente van Israël, en breidde zijn handen uit naar de hemel; en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen; Die Uw dienaar, mijn vader David, gehouden hebt wat U tot hem gesproken had; want met Uw mond hebt U gesproken, en met Uw hand vervuld, zoals het op deze dag is.", "Matt 3:17": "En zie, een stem uit de hemelen zei: Deze is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb!", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Lev 16:6": "Daarna zal Aäron de stier van het zondoffer, die voor hemzelf zal zijn, offeren, en voor zichzelf en voor zijn huis verzoening doen.", "Joh 6:27": "Werk niet voor het voedsel dat vergaat, maar voor het voedsel dat blijft tot in het eeuwige leven, dat de Zoon des mensen u geven zal; want Hem heeft God de Vader verzegeld.", "Fil 1:23-26": "Want ik word door deze twee gedrongen: ik heb het verlangen om heen te gaan en met Christus te zijn, want dat is verreweg het beste; Maar in het vlees te blijven is nodiger vanwege u. En hiervan ben ik overtuigd en dit weet ik, dat ik zal blijven en met u allen zal verblijven, tot uw bevordering en blijdschap van het geloof;", "Jes 50:10": "Wie is er onder u, die de HEERE vreest, die naar de stem van Zijn Knecht luistert? Als hij in de duisternis wandelt, en geen licht heeft, laat hij vertrouwen op de Naam van de HEERE en steunen op zijn God.", "Job 34:26": "Hij klopt hen samen als goddelozen, in een plaats, waar van het aanschouwer zijn;", "Jer 33:15": "In die dagen, en te dien tijde zal Ik David een SPRUIT van gerechtigheid doen opkomen; en Hij zal recht en gerechtigheid doen op aarde.", "Kol 1:13": "Die ons getrokken heeft uit de macht van de duisternis, en overgezet heeft in het Koninkrijk van de Zoon van Zijn liefde;", "Joh 11:4": "En Jezus, dat horende, zei: Deze ziekte is niet tot de dood, maar tot heerlijkheid van God, opdat de Zoon van God erdoor verheerlijkt wordt.", "Gen 1:27": "En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.", "Luk 18:1-7": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven, en Hij zei: Er was een zekere rechter in een stad, die God niet vreesde en geen mens ontzag. En er was een zekere weduwe in dezelfde stad, en zij kwam naar hem toe en zei: Doe mij recht tegenover mijn tegenpartij.", "2 Tim 1:14": "Bewaar het goede pand, dat u toevertrouwd is, door de Heilige Geest, Die in ons woont.", "Joh 10:29": "Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "Lev 2:2": "En hij zal het brengen tot de zonen van Aäron, de priesters, van wie er één daarvan zijn hand vol zal grijpen uit de meelbloem, en uit de olie, met alle wierook; en de priester zal het gedenkoffer daarvan aansteken op het altaar; het is een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Ps 121:1-8": "Een lied Hammaaloth¹. Ik hef mijn ogen op naar de bergen, vanwaar mijn hulp komen zal. Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft. Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "Joh 8:49": "Jezus antwoordde: Ik heb de duivel niet; maar Ik eer Mijn Vader, en u onteert Mij.", "2 Tim 2:10": "Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid.", "Joh 4:10": "Jezus antwoordde en zei tegen haar: Als u de gave van God kende, en Wie Hij is, Die tegen u zegt: Geef Mij te drinken, dan zou u van Hem hebben gevraagd, en Hij zou u levend water gegeven hebben.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "1 Kor 3:11": "Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Jak 1:21": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken.", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "Hand 7:43": "Ja, u hebt de tent van Moloch opgenomen, en de ster van uw god Remfan, de beelden die u gemaakt hebt om die te aanbidden; en Ik zal u wegvoeren tot voorbij Babylon.", "Luk 4:12": "En Jezus antwoordde en zei tegen hem: Er is gezegd: U zult de Heere, uw God, niet verzoeken.", "Hebr 9:12": "ook niet door het bloed van bokken en kalveren, maar door Zijn eigen bloed, eenmaal ingegaan in het heiligdom, en heeft een eeuwige verlossing verworven.", "Zach 7:10": "en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.", "Hebr 3:12": "Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;", "1 Tim 6:21": "waarmee sommigen, terwijl zij die beleden, van het geloof zijn afgeweken. De genade zij met u. Amen. De eerste brief aan Timotheüs werd geschreven vanuit Laodicea, de voornaamste stad in Frygië Pacatania.", "Matt 26:64": "Jezus zei tegen hem: U hebt het gezegd. Maar Ik zeg u: van nu af aan zult u de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen op de wolken van de hemel.", "1 Tim 6:2": "En zij die gelovige heren hebben, moeten hen niet verachten, omdat zij broeders zijn; maar moeten hen des te meer dienen, omdat zij gelovig en geliefd zijn, als mensen die deze weldaad samen ontvangen. Leer en vermaan deze dingen.", "Mal 2:7": "Want de lippen van de priesters zullen de kennis bewaren, en men zal uit zijn mond de wet zoeken; want hij is een gezant van de HEERE van de heerscharen.", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Fil 2:12": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:", "Rom 1:19-22": "Omdat wat van God gekend kan worden, in hen openbaar is; want God heeft het hun geopenbaard. Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn. Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden;", "Ex 29:9": "En u zult hen met de gordel omgorden, namelijk Aäron en zijn zonen; en u zult hun de mutsen opbinden, opdat zij het priesterambt hebben tot een eeuwige inzetting. Vervolgens zult u de hand van Aäron vullen, en de hand van zijn zonen.", "Luk 9:29": "En terwijl Hij bad, veranderde het aanzien van Zijn gezicht, en Zijn kleding werd wit en schitterend.", "Matt 15:24": "Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Ps 106:8": "Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.", "Joh 7:42": "Zegt de Schrift niet dat de Christus zal komen uit het nageslacht van David, en uit het dorp Bethlehem, waar David was?", "Luk 12:57": "En waarom oordeelt u ook niet zelf wat recht is?", "Joh 4:15": "De vrouw zei tegen Hem: Heere, geef mij dat water, zodat ik geen dorst meer krijg, en hier niet meer hoef te komen om te putten.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Rom 9:12": "werd tot haar gezegd: De oudste zal de jongste dienen.", "2 Kor 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, en Timotheüs, de broeder, aan de gemeente van God, die te Korinthe is, met al de heiligen, die in heel Achaje zijn:", "Joh 15:23": "Die Mij haat, die haat ook Mijn Vader.", "Spr 14:21": "Wie zijn naaste veracht, zondigt; maar wie zich over de nederigen ontfermt, die is gelukkig.", "Joh 18:19": "De hogepriester dan vroeg Jezus naar Zijn discipelen en naar Zijn onderricht.", "Ps 10:7": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.", "Kol 1:26": "namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen;", "1 Tim 6:13": "Ik beveel u voor het aangezicht van God, Die alles levend maakt, en van Christus Jezus, Die onder Pontius Pilatus de goede belijdenis heeft afgelegd,", "Openb 3:2": "Wees waakzaam, en versterk het overige, dat dreigde te sterven; want Ik heb uw werken niet vol bevonden voor God.", "Lev 8:2": "Neem Aäron en zijn zonen met hem, en de kleren, en de zalfolie, ook de stier van het zondoffer, en de twee rammen, en de korf met de ongezuurde broden;", "Jes 42:1": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen.", "Joh 1:7": "Deze kwam tot een getuigenis, om van het Licht te getuigen, opdat zij allen door hem geloven zouden.", "Spr 18:4": "De woorden uit de mond van een man zijn diepe wateren; en de bron van wijsheid is een stromende beek.", "Rom 3:1": "Wat is dan het voordeel van de Jood? Of wat is het nut van de besnijdenis?", "2 Tim 3:16": "Heel de Schrift is door God ingegeven, en is nuttig tot lering, tot weerlegging, tot verbetering, tot onderwijzing die in de rechtvaardigheid is;", "Ps 28:1": "Een psalm van David. Tot U roep ik, HEERE! Mijn Rotssteen, houd U niet als doof van mij af; anders, als U zich stil houdt voor mij, word ik gelijk aan degenen die in de kuil neerdalen.", "Ps 107:23-31": "Die met schepen ter zee afvaren, handel drijvend op grote wateren; Die zien de werken van de HEERE, en Zijn wonderwerken in de diepte. Als Hij spreekt, doet Hij een stormwind opsteken, die haar golven omhoog verheft.", "1 Joh 1:1-5": "Wat er was van het begin af, wat wij gehoord hebben, wat wij gezien hebben met onze ogen, wat wij aanschouwd hebben, en onze handen getast hebben, van het Woord des levens; (Want het Leven is geopenbaard, en wij hebben het gezien, en wij getuigen, en verkondigen u dat eeuwige Leven, Dat bij de Vader was, en ons geopenbaard is.) Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.", "Gen 21:10": "En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.", "Joh 6:35": "En Jezus zei tegen hen: Ik ben het Brood des levens; wie tot Mij komt, zal beslist geen honger hebben, en wie in Mij gelooft, zal nooit meer dorst hebben.", "Joh 8:42": "Jezus zei dan tegen hen: Als God uw Vader was, zou u Mij liefhebben; want Ik ben van God uitgegaan, en Ik kom van Hem. Want Ik ben ook niet uit Mijzelf gekomen, maar Hij heeft Mij gezonden.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "2 Joh 1:7": "Want er zijn veel verleiders in de wereld gekomen, die niet belijden dat Jezus Christus in het vlees gekomen is. Dit is de verleider en de antichrist.", "Joh 5:33": "U hebt naar Johannes gezonden, en hij heeft van de waarheid getuigenis gegeven.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Jes 53:4-6": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt. Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen. Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.", "Matt 27:54": "En de hoofdman over honderd, en zij die met hem Jezus bewaakten, zagen de aardbeving en de dingen die gebeurd waren, en werden zeer bevreesd, en zeiden: Waarlijk, Deze was Gods Zoon!", "Rom 10:4": "Want het einde van de wet is Christus, tot rechtvaardigheid voor ieder die gelooft.", "Rom 4:7": "En zei: Gelukkig zijn zij wier ongerechtigheden vergeven zijn, en wier zonden bedekt zijn;", "Job 15:8": "Hebt u de verborgen raad van God gehoord, en hebt u de wijsheid naar u toe getrokken?", "1 Sam 2:35": "En Ik zal Mij een trouwe priester verwekken; die zal doen zoals het in Mijn hart en in Mijn ziel zal zijn; hem zal Ik een bestendig huis bouwen, en hij zal alle dagen voor het aangezicht van Mijn Gezalfde wandelen.", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Luk 13:32": "En Hij zei tegen hen: Ga en zeg tegen die vos: Zie, Ik drijf duivelen uit en maak gezond, vandaag en morgen, en op de derde dag kom Ik tot mijn einde.", "Rom 12:15": "Verblijd u met de blijden, en ween met de wenende.", "Jes 49:5": "En nu zegt de HEERE, Die Mij van moeders buik af tot een Knecht gevormd heeft, dat Ik Jakob tot Hem terugbrengen zou; maar Israël zal zich niet laten verzamelen; toch zal Ik verheerlijkt worden in de ogen van de HEERE, en Mijn God zal Mijn Sterkte zijn.", "Joh 10:11-15": "Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen. Maar de huurling, die geen herder is, van wie de schapen niet zelf zijn, ziet de wolf komen, en verlaat de schapen, en vlucht; en de wolf grijpt ze, en verstrooit de schapen. En de huurling vlucht, omdat hij een huurling is, en hij bekommert zich niet om de schapen.", "Lev 4:4-14": "En hij zal die var brengen tot de deur van de tent der samenkomst, voor het aangezicht van de HEERE; en hij zal zijn hand op het hoofd van die var leggen, en hij zal die var slachten voor het aangezicht van de HEERE. Daarna zal die gezalfde priester van het bloed van de var nemen, en hij zal dat naar de tent der samenkomst brengen. En de priester zal zijn vinger in dat bloed dopen; en van dat bloed zal hij zevenmaal sprenkelen voor het aangezicht van de HEERE, voor de voorhang van het heilige.", "Hebr 3:6": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden.", "Hebr 5:1-3": "Want elke hogepriester, die uit de mensen genomen wordt, wordt aangesteld voor de mensen in de zaken die bij God gedaan moeten worden, opdat hij gaven en slachtoffers offert voor de zonden; die behoorlijk medelijden kan hebben met de onwetenden en dwalende mensen, omdat hij ook zelf met zwakheid omgeven is; en om die zwakheid moet hij, zoals voor het volk, zo ook voor zichzelf, offers brengen voor de zonden.", "1 Kor 7:10": "Maar de getrouwden gebied ik niet, maar de Heere, dat de vrouw niet van de man scheidt.", "Rom 15:12": "En opnieuw zegt Jesaja: Er zal de wortel van Isaï zijn, en Die opstaat om over de heidenen te heersen; op Hem zullen de heidenen hopen.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "1 Kor 14:21": "In de wet is geschreven: Ik zal door lieden van andere talen, en door andere lippen tot dit volk spreken, en toch zullen zij Mij ook zo niet horen, zegt de Heere.", "Ex 13:2": "Heilig voor Mij alle eerstgeborenen; wat er ook onder de kinderen van Israël de baarmoeder opent, van mensen en van dieren, dat is Mijn eigendom.", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Klaagl 3:52": "Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd.", "Luk 7:3": "En toen hij over Jezus gehoord had, zond hij de oudsten van de Joden naar Hem toe, en vroeg Hem dringend of Hij wilde komen om zijn dienstknecht gezond te maken.", "Hebr 9:23": "Zo was het dan nodig dat wel de afbeeldingen van de dingen die in de hemelen zijn, door deze dingen gereinigd werden, maar de hemelse dingen zelf door betere offers dan deze.", "Fil 2:6": "Die, terwijl Hij in de gestalte van God was, het geen roof geacht heeft God even gelijk te zijn;", "Jer 36:28": "Neem u weer een andere rol, en schrijf daarop al de eerste woorden die op de eerste rol stonden, die Jojakim, de koning van Juda, verbrand heeft.", "Joh 10:2-5": "Maar die door de deur ingaat, is een herder van de schapen. Voor hem doet de deurwachter open, en de schapen horen zijn stem; en hij roept zijn eigen schapen bij naam, en leidt ze naar buiten. En wanneer hij zijn eigen schapen naar buiten gedreven heeft, gaat hij voor hen uit; en de schapen volgen hem, omdat zij zijn stem kennen.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Ef 3:9": "en allen te verlichten, zodat zij mogen verstaan wat de gemeenschap van de verborgenheid is, die vanaf alle eeuwen verborgen is geweest in God, Die alle dingen geschapen heeft door Jezus Christus;", "2 Kor 9:15": "Doch God zij dank voor Zijn onuitsprekelijke gave.", "1 Kor 15:45": "Zo staat er ook geschreven: De eerste mens Adam is geworden tot een levende ziel; de laatste Adam tot een levendmakende Geest.", "2 Kor 12:8": "Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Gen 15:13": "Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.", "2 Kor 1:4-6": "Die ons vertroost in al onze verdrukking, opdat wij zouden kunnen vertroosten degenen die in allerlei verdrukking zijn, door de vertroosting waarmee wij zelf door God vertroost worden. Want zoals het lijden van Christus overvloedig is in ons, zo is ook door Christus onze vertroosting overvloedig. Maar hetzij dat wij verdrukt worden, het is tot uw vertroosting en zaligheid, die gewerkt wordt in het volharden in datzelfde lijden, dat wij ook lijden; hetzij dat wij vertroost worden, het is tot uw vertroosting en zaligheid;", "Tit 2:8": "Het woord gezond en onberispelijk, opdat hij die daartegen is, beschaamd wordt, en niets kwaads heeft te zeggen van u.", "Hos 7:11": "Want Efraïm is als een domme duif, zonder verstand; zij roepen Egypte aan, zij gaan heen tot Assur.", "Luk 2:24": "En om een offer te geven, naar wat in de wet van de Heere gezegd is, een paar tortelduiven of twee jonge duiven.", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "1 Kor 8:11": "En zal de broeder, die zwak is, door uw kennis verloren gaan, om wie Christus gestorven is?", "Jes 40:27": "Waarom zegt u dan, o Jakob! en spreekt, o Israël! mijn weg is voor de HEERE verborgen, en mijn recht gaat aan mijn God voorbij?", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "2 Kor 6:11-13": "Onze mond is opengegaan tegen u, Korinthiërs, ons hart is verruimd. U bent niet nauw in ons, maar u bent nauw in uw eigen binnenste. Nu, om dezelfde vergelding te doen (ik spreek als tegen mijn kinderen): word ook u verruimd.", "Joh 16:3": "En deze dingen zullen zij u doen, omdat zij de Vader niet gekend hebben, en Mij ook niet.", "Job 21:14": "Toch zeggen zij tegen God: Ga weg van ons, want in de kennis van Uw wegen hebben wij geen behagen.", "1 Kor 2:6": "En wij spreken wijsheid onder de volwassenen in het geloof; maar een wijsheid die niet van deze wereld is, en ook niet van de leiders van deze wereld, die tot niets worden;", "Rom 3:15-17": "hun voeten zijn snel om bloed te vergieten; vernieling en ellende is op hun wegen; en de weg van de vrede hebben zij niet gekend.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Fil 1:3-5": "Ik dank mijn God, zo dikwijls als ik aan u denk. (In elk gebed van mij voor u allen doe ik dat gebed altijd met blijdschap) Vanwege uw gemeenschap aan het Evangelie, vanaf de eerste dag tot nu toe;", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Ps 112:5": "Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Hebr 7:3": "zonder vader, zonder moeder, zonder geslachtsregister, zonder begin van dagen of einde van leven, maar gelijk geworden aan de Zoon van God, blijft hij een priester voor eeuwig.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Jes 49:8": "Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Matt 15:36": "En Hij nam de zeven broden en de vissen, en nadat Hij gedankt had, brak Hij ze, en gaf ze aan Zijn discipelen; en de discipelen gaven ze aan de menigte.", "Hebr 13:7": "Denk aan uw voorgangers, die u het Woord van God gesproken hebben; en volg hun geloof na, terwijl u de uitkomst van hun wandel aanschouwt.", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Mark 14:27": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.", "2 Kor 1:5": "Want zoals het lijden van Christus overvloedig is in ons, zo is ook door Christus onze vertroosting overvloedig.", "Hebr 6:9": "Maar, geliefden, wij zijn ervan overtuigd dat het bij u beter gesteld is, en dat het met de zaligheid samengaat, ook al spreken wij zo.", "Ex 21:24": "oog voor oog, tand voor tand, hand voor hand, voet voor voet,", "Ef 2:7": "opdat Hij zou tonen in de toekomende eeuwen de uitnemende rijkdom van Zijn genade, door de goedertierenheid over ons in Christus Jezus.", "Joh 6:60": "Velen van Zijn discipelen dan zeiden, toen zij dit hoorden: Dit is een harde uitspraak; wie kan dat aanhoren?", "Ps 18:21": "De HEERE vergold mij naar mijn gerechtigheid, Hij gaf mij weer naar de reinheid van mijn handen.", "Deut 22:1-4": "U zult de os of het kleinvee van uw broeder niet zien afdwalen en u daarvoor verbergen; u zult ze zeker naar uw broeder terugbrengen. En als uw broeder niet dicht bij u woont, of u hem niet kent, zo zult u ze binnen in uw huis verzamelen, dat ze bij u blijven totdat uw broeder ze zoekt, en u ze hem teruggeeft. Zo zult u ook doen met zijn ezel, en zo zult u doen met zijn kleding, ja, zo zult u doen met alles wat uw broeder verloren heeft en wat u gevonden hebt; u mag u niet verbergen.", "Luk 1:35": "En de engel antwoordde en zei tegen haar: De Heilige Geest zal over u komen, en de kracht van de Allerhoogste zal u overschaduwen; daarom zal ook dat Heilige Dat uit u geboren zal worden, Gods Zoon genoemd worden.", "Matt 5:27": "U hebt gehoord dat gezegd is: U zult geen overspel plegen.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Matt 1:21": "en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken van hun zonden.", "Jes 5:20": "Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!", "Jer 11:5": "Opdat Ik de eed bevestig, die Ik uw vaderen gezworen heb, hun een land te geven vloeiende van melk en honing, zoals het is op deze dag. Toen antwoordde ik en zei: Amen, o HEERE!", "Joh 17:5": "En nu, verheerlijk Mij, U, Vader, bij Uzelf, met de heerlijkheid die Ik bij U had, voordat de wereld was.", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "Hand 8:32": "En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.", "2 Tim 1:4": "Zeer begerig om u te zien, als ik denk aan uw tranen, opdat ik met blijdschap vervuld mag worden;", "Joh 15:21": "Maar al deze dingen zullen zij u doen om Mijn Naam, omdat zij Hem niet kennen, Die Mij gezonden heeft.", "Amos 4:6": "Daarom heb Ik u ook reinheid van de tanden gegeven in al uw steden, en gebrek aan brood in al uw plaatsen; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "1 Tim 3:9": "mensen die de verborgenheid van het geloof vasthouden in een rein geweten.", "Ps 17:1": "Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.", "Mark 9:11-13": "En zij vroegen Hem: Waarom zeggen de Schriftgeleerden dat Elia eerst moet komen? En Hij antwoordde en zei tegen hen: Elia komt inderdaad eerst, en herstelt alles; en het zal gebeuren, zoals geschreven is van de Zoon des mensen, dat Hij veel moet lijden en veracht worden. Maar Ik zeg u, dat Elia ook gekomen is, en zij hebben hem gedaan wat zij wilden, zoals van hem geschreven is.", "Gen 3:5": "Maar God weet dat, op de dag dat u daarvan eet, uw ogen geopend zullen worden, en u als God zult zijn, kennend het goed en het kwaad.", "Hand 7:31": "Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,", "Jak 3:13": "Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid.", "Joh 13:13-17": "U noemt Mij Meester en Heere; en u zegt dat terecht, want Ik ben het. Als Ik dan, de Heere en de Meester, uw voeten gewassen heb, dan bent u ook verplicht, elkaars voeten te wassen. Want Ik heb u een voorbeeld gegeven, opdat u, zoals Ik u gedaan heb, ook zult doen.", "Joh 14:9-14": "Jezus zei tegen hem: Ben Ik zo lange tijd bij u, en hebt u Mij niet gekend, Filippus? Wie Mij gezien heeft, heeft de Vader gezien; en hoe zegt u dan: Toon ons de Vader? Gelooft u niet dat Ik in de Vader ben, en de Vader in Mij is? De woorden die Ik tegen u spreek, spreek Ik niet uit Mijzelf, maar de Vader, Die in Mij blijft, Die doet de werken. Geloof Mij, dat Ik in de Vader ben en de Vader in Mij is; en zo niet, geloof Mij dan om de werken zelf.", "Rom 3:28-30": "Wij stellen dan vast, dat de mens door het geloof gerechtvaardigd wordt, zonder de werken van de wet. Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen; omdat Hij één God is, Die de besnijdenis zal rechtvaardigen uit het geloof, en de onbesnedenen door het geloof.", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "1 Petr 1:21": "die door Hem gelooft in God, Die Hem uit de doden heeft opgewekt en Hem heerlijkheid gegeven heeft, zodat uw geloof en hoop op God gericht zouden zijn.", "Jer 36:1": "Het gebeurde in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda, dat dit woord van de HEERE tot Jeremia kwam:", "Matt 28:18-20": "En Jezus kwam bij hen en sprak tot hen: Mij is gegeven alle macht in hemel en op aarde. Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest; en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Hebr 5:5-10": "Zo heeft ook Christus Zichzelf niet verheerlijkt om Hogepriester te worden, maar Hij die tot Hem gesproken heeft: U bent Mijn Zoon, heden heb Ik U gegenereerd. Zoals Hij ook op een andere plaats zegt: U bent Priester in eeuwigheid, naar de ordening van Melchizedek. Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.", "Rom 14:15": "Maar als uw broeder om het voedsel bedroefd wordt, dan wandelt u niet meer naar liefde. Breng hem niet ten verderve met uw voedsel, voor wie Christus gestorven is.", "Hebr 8:3": "Want ieder hogepriester wordt aangesteld om gaven en offers te offeren; daarom was het noodzakelijk dat ook Deze iets had, dat Hij zou offeren.", "Luk 23:36": "En ook de soldaten kwamen naar Hem toe en bespotten Hem, en brachten Hem azijn;", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Gal 5:7": "U liep goed; wie heeft u verhinderd de waarheid niet gehoorzaam te zijn?", "Joh 8:32": "En u zult de waarheid kennen, en de waarheid zal u vrijmaken.", "Matt 2:5": "Zij zeiden tegen hem: In Bethlehem, in Judea; want zo is geschreven door de profeet:", "1 Petr 3:9": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Matt 26:36": "Toen ging Jezus met hen naar een plaats genaamd Gethsémané, en zei tegen de discipelen: Blijft hier zitten, totdat Ik weggegaan ben en daar gebeden heb.", "Fil 1:29": "Want u is uit genade gegeven in de zaak van Christus, niet alleen om in Hem te geloven, maar ook om voor Hem te lijden;", "Jes 49:11": "En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Ps 73:2-28": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "Ps 133:1-3": "Een lied Hammaäloth, van David. Zie, hoe goed en hoe fijn is het, dat broeders ook samenwonen! Het is als de kostelijke olie op het hoofd, die neerdaalt op de baard, de baard van Aäron, die neerdaalt tot op de zoom van zijn kleren. Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Jes 50:2": "Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst.", "Matt 21:16": "en zeiden tegen Hem: Hoort U wel wat dezen zeggen? En Jezus zei tegen hen: Ja; hebt u nooit gelezen: Uit de mond van de jonge kinderen en de zuigelingen hebt U Zichzelf lof toebereid?", "1 Tim 5:10": "Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd.", "Jes 6:5-8": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien. Maar een van de serafs vloog naar mij toe, en had een gloeiende kool in zijn hand, die hij met de tang van het altaar genomen had. En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Hebr 11:4": "Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is.", "Ef 3:7": "waarvan ik een dienaar geworden ben, naar de gave van de genade van God, die mij gegeven is, naar de werking van Zijn kracht.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Openb 1:1": "De openbaring van Jezus Christus, die God Hem gegeven heeft, om Zijn dienstknechten te tonen de dingen die spoedig moeten gebeuren; en die Hij door Zijn engel gezonden en aan Zijn dienstknecht Johannes bekendgemaakt heeft;", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Joh 1:9": "Dit was het waarachtige Licht, Dat ieder mens verlicht die in de wereld komt.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Matt 18:11-13": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij nie
