as geweest, dan zou er voor het tweede geen plaats gezocht zijn.","8":"Want omdat Hij hen berispt, zegt Hij tegen hen: Zie, de dagen komen, spreekt de Heere, dat Ik over het huis van Israël en over het huis van Juda een nieuw verbond zal oprichten;","9":"Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere.","10":"Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.","11":"En zij zullen niet leren, ieder zijn naaste en ieder zijn broeder, en zeggen: Ken de Heere; want zij zullen Mij allen kennen, van de kleinste onder hen tot de grootste onder hen.","12":"Want Ik zal hun ongerechtigheden genadig zijn, en aan hun zonden en hun overtredingen zal Ik geenszins meer denken.","13":"Als Hij zegt: Een nieuw verbond, dan heeft Hij het eerste oud gemaakt; en wat nu oud gemaakt is en verouderd, is dicht bij de verdwijning."},"SV":{"1":"De hoofdsom nu der dingen, waarvan wij spreken, is, *dat* wij hebben zodanigen Hogepriester, Die gezeten is aan de rechter *hand* van den troon der Majesteit in de hemelen:","2":"Een Bedienaar des heiligdoms, en des waren tabernakels, welken de Heere heeft opgericht, en geen mens.","3":"Want een iegelijk hogepriester wordt gesteld, om gaven en slachtofferen te offeren; waarom het noodzakelijk was, dat ook Deze wat had, dat Hij zou offeren.","4":"Want indien Hij op aarde ware, zo zou Hij zelfs geen Priester zijn, dewijl er priesters zijn, die naar de wet gaven offeren;","5":"Welke het voorbeeld en de schaduw der hemelse dingen dienen, gelijk Mozes door Goddelijke aanspraak vermaand was, als hij den tabernakel volmaken zou: Want zie, zegt Hij, dat gij het alles maakt naar de afbeelding, die u op den berg getoond is.","6":"En nu heeft Hij zoveel uitnemender bediening gekregen, als Hij ook eens beteren verbonds Middelaar is, hetwelk in betere beloftenissen bevestigd is.","7":"Want indien dat eerste *verbond* onberispelijk geweest ware, zo zou voor het tweede geen plaats gezocht zijn geweest.","8":"Want *hen* berispende, zegt Hij tot hen: Ziet, de dagen komen, spreekt de Heere, en Ik zal over het huis Israëls, en over het huis van Juda een nieuw verbond oprichten;","9":"Niet naar het verbond, dat Ik met hun vaderen gemaakt heb, ten dage, als Ik hen bij de hand nam, om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb op hen niet geacht, zegt de Heere.","10":"Want dit is het verbond, dat Ik met het huis Israëls maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik die inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.","11":"En zij zullen niet leren, een iegelijk zijn naaste, en een iegelijk zijn broeder, zeggende: Ken den Heere; want zij zullen Mij allen kennen van den kleine onder hen tot den grote onder hen.","12":"Want Ik zal hun ongerechtigheden genadig zijn, en hun zonden en hun overtredingen zal Ik geenszins meer gedenken.","13":"Als Hij zegt: Een nieuw *verbond*, zo heeft Hij het eerste oud gemaakt; dat nu oud gemaakt is en verouderd, is nabij de verdwijning."},"KJV":{"1":"Now of the things which we have spoken *this is* the sum: We have such an high priest, who is set on the right hand of the throne of the Majesty in the heavens;","2":"A minister of the sanctuary, and of the true tabernacle, which the Lord pitched, and not man.","3":"For every high priest is ordained to offer gifts and sacrifices: wherefore *it is* of necessity that this man have somewhat also to offer.","4":"For if he were on earth, he should not be a priest, seeing that there are priests that offer gifts according to the law:","5":"Who serve unto the example and shadow of heavenly things, as Moses was admonished of God when he was about to make the tabernacle: for, See, saith he, *that* thou make all things according to the pattern shewed to thee in the mount.","6":"But now hath he obtained a more excellent ministry, by how much also he is the mediator of a better covenant, which was established upon better promises.","7":"For if that first *covenant* had been faultless, then should no place have been sought for the second.","8":"For finding fault with them, he saith, Behold, the days come, saith the Lord, when I will make a new covenant with the house of Israel and with the house of Judah:","9":"Not according to the covenant that I made with their fathers in the day when I took them by the hand to lead them out of the land of Egypt; because they continued not in my covenant, and I regarded them not, saith the Lord.","10":"For this *is* the covenant that I will make with the house of Israel after those days, saith the Lord; I will put my laws into their mind, and write them in their hearts: and I will be to them a God, and they shall be to me a people:","11":"And they shall not teach every man his neighbour, and every man his brother, saying, Know the Lord: for all shall know me, from the least to the greatest.","12":"For I will be merciful to their unrighteousness, and their sins and their iniquities will I remember no more.","13":"In that he saith, A new *covenant*, he hath made the first old. Now that which decayeth and waxeth old *is* ready to vanish away."}},"tsk":{"1":[{"kopje":"wij hebben","refs":["Hebr 7:26-28"]},{"kopje":"Die","refs":["Hebr 1:3","Hebr 1:13","Hebr 10:12","Hebr 12:2","Ef 6:20","Kol 3:1","Openb 3:21"]},{"kopje":"de Majesteit","refs":["1 Kron 29:11","Job 37:22","Ps 21:6","Ps 45:4","Ps 45:5","Ps 104:1","Ps 145:12","Jes 24:14","Micha 5:3"]}],"2":[{"kopje":"Bedienaar","refs":["Hebr 9:8-12","Hebr 10:21","Ex 28:1","Ex 28:35","Luk 24:44","Rom 15:8"]},{"kopje":"de ware","refs":["Hebr 9:11","Hebr 9:2 9\">to</span> <span class=\"wl wl-kjv\" data-code=\"G3427\">me</span> a people:","11":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> they <span class=\"wl wl-kjv\" data-code=\"G1321\">shall</span> <span class=\"wl wl-kjv\" data-code=\"G3364\">not</span> <span class=\"wl wl-kjv\" data-code=\"G1321\">teach</span> every <span class=\"wl wl-kjv\" data-code=\"G1538\">man</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G4139\">neighbour,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> every <span class=\"wl wl-kjv\" data-code=\"G1538\">man</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G80\">brother,</span> <span class=\"wl wl-kjv\" data-code=\"G3004\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"G1097\">Know</span> the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord:</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">for</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> shall <span class=\"wl wl-kjv\" data-code=\"G1492\">know</span> <span class=\"wl wl-kjv\" data-code=\"G3165\">me,</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> the <span class=\"wl wl-kjv\" data-code=\"G3398\">least</span> <span class=\"wl wl-kjv\" data-code=\"G2193\">to</span> the <span class=\"wl wl-kjv\" data-code=\"G3173\">greatest.</span>","12":"<span class=\"wl wl-kjv\" data-code=\"G3754\">For</span> I will <span class=\"wl wl-kjv\" data-code=\"G2071\">be</span> <span class=\"wl wl-kjv\" data-code=\"G2436\">merciful</span> to <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G93\">unrighteousness,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G266\">sins</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G458\">iniquities</span> will I <span class=\"wl wl-kjv\" data-code=\"G3415\">remember</span> <span class=\"wl wl-kjv\" data-code=\"G3364\">no</span> more.","13":"<span class=\"wl wl-kjv\" data-code=\"G1722\">In</span> that he <span class=\"wl wl-kjv\" data-code=\"G3004\">saith,</span> A <span class=\"wl wl-kjv\" data-code=\"G2537\">new</span> covenant, he hath <span class=\"wl wl-kjv\" data-code=\"G3822\">made</span> the <span class=\"wl wl-kjv\" data-code=\"G4413\">first</span> <span class=\"wl wl-kjv\" data-code=\"G3822\">old.</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">Now</span> that which <span class=\"wl wl-kjv\" data-code=\"G3822\">decayeth</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> waxeth <span class=\"wl wl-kjv\" data-code=\"G1095\">old</span> is <span class=\"wl wl-kjv\" data-code=\"G1451\">ready</span> to vanish away."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"hoofdsom nu der dingen,","tekst":"Of het hoofdstuk onder, of in de dingen; d.i., het voornaamste; want beide betekent het Griekse woord kephalaion."},{"catchword":"aan de rechter[hand","tekst":"] Dat is, aan de rechterhand Gods die gezeten is op den troon zijner majesteit of heerlijkheid, in den derden of hoogsten hemel. Zie hiervoor Heb 1:3; Act 3:21."}],"2":[{"catchword":"des heiligdoms,","tekst":"Grieks der heilige; waardoor de hemel, van welken het heilige der heiligen een voorbeeld is geweest, gelijk hierna hfdst. 9:8, 12, verstaan wordt; hetwelk van het eerste deel des tabernakels hier wordt onderscheiden, waar de priesters alle dagen ingingen; maar de hogepriester ging maar eenmaal des jaars in het heiligdom of heilige der heiligen, gelijk in het begin van Heb 9 nader verklaard wordt."},{"catchword":"des waren","tekst":"Het woord waren, wordt hier gesteld tegen de schaduwen, gelijk Joh 1:17."},{"catchword":"tabernakels,","tekst":"Gelijk door het heilige der heiligen de hemel wordt afgebeeld, zo wordt door dezen tabernakel verstaan de menselijke natuur van Christus, die daarbij ook wordt vergeleken, Joh 1:14, en Joh 2:19 en Heb 9:11, en in welke de volheid der Godheid lichamelijk woont, als in zijn tempel of tabernakel, Col 2:9, die door kracht des Heiligen Geestes is ontvangen en door geen mens is opgericht, en door welker opoffering en bloed van Christus in het heilige der heiligen is ingegaan, hetwelk met vs.3 wel overeenkomt. Waarvan Christuts ook een bedienaar kan gezegd worden, omdat hij dezelve zijn menselijke natuur heeft geheiligd tot een bekwame offerande, om daarin de zonden zijns volks te verzoenen, en het werk onzer zaligheid te volbrengen. Zie Joh 17:19, en hierna Heb 9:11, waar dit zo in het brede wordt verklaard."}],"3":[{"catchword":"Want een iegelijk hogepriester","tekst":"Dit woord want, geeft reden waarom hij in vs.2 gezegd heeft, dat Christus is een bedienaar van den waren tabernakel zijns lichaams, namelijk omdat hij als een hogepriester ook wat moest hebben dat hij zou offeren."},{"catchword":"wat had,","tekst":"Namelijk zichzelf, of zijn eigen lichaam, gelijk hier voor hfdst. 7:27, en hierna hfdst. 9:14 wordt uitgedrukt."}],"4":[{"catchword":"zo zou Hij zelfs geen priester zijn,","tekst":"Namelijk omdat hij nu alles op aarde volbracht had, wat van hem, als priester, op aarde moest geschieden. Derhalve, zo zou hij uitgediend hebben; maar hij moest nog het overige deel van zijn priesterambt in den hemel in het ware heilige der heiligen volbrengen."},{"catchword":"naar de wet gaven offeren;","tekst":"Dat is, behoorlijk en wettelijk. En in deze woorden is ook een reden begrepen, waarom Christus nu geen priester op aarde zou zijn, namelijk die wettelijk en volgens de ordinantie Gods het priesterschap hier bedienen zou, omdat de wet geen priester stelt dan uit den stam van Levi, en gene offeranden dan van ceremoniëele gaven, waarvan Christus geen bedienaar was gesteld, maar een bedienaar van hetgeen hierdoor was afgebeeld, gelijk vs.5 ook medebrengt."}],"5":[{"catchword":"der hemelse dingen dienen,","tekst":"Dat is, der dingen die van Christus ook in den hemel moesten bediend en volbracht worden, en die ons tot den ingang in den hemel nodig zijn."},{"catchword":"de afbeelding,","tekst":"Of, voorschrift, voordruk, patroon, voorbeeld, waar men iets naar doet of bouwt."},{"catchword":"die u","tekst":"Namelijk in een gezicht, of, op den berg, of veeleer in den geopenden hemel, gelijk hierna, Heb 9:23 verklaard wordt; want Mozes heeft op den berg zijnde, dit voorbeeld in den hemel zelf gezien."},{"catchword":"op den berg getoond is","tekst":"Grieks in den berg; dat is, op den berg, namelijk Horeb."}],"6":[{"catchword":"Hij zoveel uitnemender bediening gekregen,","tekst":"Namelijk de Heere Jezus Christus."},{"catchword":"eens beteren verbonds Middelaar is,","tekst":"Namelijk van het verbond der wet, en der ceremoniën was."},{"catchword":"betere beloftenissen","tekst":"Namelijk die hierna, vs.10-12, worden uitgedrukt."},{"catchword":"bevestigd is","tekst":"Grieks gewettelijkt is."}],"7":[{"catchword":"onberispelijk geweest ware,","tekst":"Dat is, waar niets aan had ontbroken, of waar men niets meer in had kunnen vereisen. Want dat volmaakt is, heeft geen plaats te geven aan iets anders van gelijke gelegenheid. Want de wet van Mozes, waarvan de ceremoniën hier als een aanhangsel worden aangemerkt, was wel in zichzelf volmaakt, zo iemand die volmaakt had onderhouden; maar vanwege de onmacht der verdorvene natuur des mensen, die de wet niet kon wegnemen, kon zij niemand tot de zaligheid brengen; Rom 8:3; Gal 3:21. Daarom heeft God dit nieuwe verbond door Christus, in de plaats van het eerste, met den mens willen maken, opdat het gebrek van het eerste hierdoor zou worden verbeterd; van welk nieuw verbond de ceremoniën ook schaduwen en voorbeelden waren, Col 2:17; gelijk in Heb 9 zal worden aangewezen, en van hetwelk de oude vaders ook de beloften wel hadden ontvangen, Gal 3:17, enz.; maar de volheid daarvan is ons door Christus geopenbaard, gelijk de apostel in het vervolg uit Jer 31 bewijst."}],"8":[{"catchword":"[hen","tekst":"] Namelijk de Israëlieten; of hetzelve, namelijk verbond."},{"catchword":"berispende,","tekst":"Of het gebrek hun aanwijzende; of over hen klagende; dat is, de zwakheid, die door hun verdorvenheid in dit verbond was, aanwijzende en daarover klagende."},{"catchword":"de dagen komen,","tekst":"Namelijk ten tijde van den Messias."},{"catchword":"over het huis Israëls,","tekst":"Hieronder worden ook alle uitverkorenen uit de heidenen verstaan, gelijk doorgaans bij de profeten is te zien, die door het geloof dezen olijfboom zouden worden ingelijfd. Zie Rom 11:17, Rom 11:25-26; Gal 4:26, enz."},{"catchword":"verbond","tekst":"Of testament."},{"catchword":"oprichten;","tekst":"Grieks voleindigen. Zie de aantekeningen vs.10."}],"9":[{"catchword":"met hun vaderen gemaakt heb,","tekst":"Namelijk door Mozes in de woestijn."},{"catchword":"op hen niet geacht,","tekst":"Of Ik heb hen niet geacht. Bij den profeet staat: zou Ik met hen in het huwelijk, of als ene heer gebleven zijn? hetwelk één zin met dezen woorden heeft. Doch de apostel heeft de Griekse overzetting willen behouden, omdat in de zaak geen verschil was."}],"10":[{"catchword":"maken zal na die dagen,","tekst":"Dat is ten volle openbaren en door de gehele wereld verbreiden. Want de belofte van dit verbond was door de wet van Mozes niet teniet gedaan, Gal 3:17; maar is eerst door Christus vervuld, ten volle geopenbaard, en in zijn volkomenheid opgericht."},{"catchword":"in hun verstand geven,","tekst":"Dat is, niet alleen in stenen tafelen of perkamenten. Zie 2Co 3:3, enz."}],"11":[{"catchword":"niet leren","tekst":"Namelijk met woorden of met schriften alleen, gelijk in het verbond der wet geschiedde, maar zij zullen vooral van God [namelijk door zijn Geest] geleerd zijn, gelijk Christus spreekt Joh 6:45, Joh 6:65, die nochtans met zijn eigen mond hun ook het Evangelie predikte en tot de kennis Gods vermaande. Dit wordt dan niet volkomen of geheel ontkend, maar bij vergelijking van de manier van onderwijzing, die in het Oude Testament geschiedde, gelijk zulke wijzen van spreken meermalen voorkomen. Zie voorbeelden daarvan Joh 5:30, Joh 5:45; 1Th 4:9."},{"catchword":"allen kennen","tekst":"Namelijk die het van God zullen geleerd hebben, gelijk Christus getuigt in de voormelde plaats, Joh 6:45. Want, dat hier alleen gesproken wordt van de zaligmakende kennis, en van het waarachtig geloof, blijkt uit vs.12, dewijl de zonden in het nieuwe verbond niemand worden vergeven dan door het waarachtig geloof, Rom 3:30. Sommigen nemen dit van den stand van het toekomende leven, waar geen uitwendig onderwijs meer van node zal wezen, wanneer wij hem zullen zien van aangezicht tot aangezicht, 1Co 13:11; 1Jo 3:2. Doch uit het gehele oogmerk van den apostel blijkt dat deze beloften alle uitverkorene gelovigen des Nieuwen Testaments ook in dit leven aangaan."}],"12":[{"catchword":"geenszins meer gedenken","tekst":"Namelijk om die te straffen. Zo behoudt dan God in het nieuwe verbond geen straffen meer, wanneer Hij de zonde eens heeft vergeven, gelijk enigen drijven. Hoewel Hij de zijnen nog soms uit vaderlijke liefde kastijdt tot hun best. Zie Heb 12:6-7."}],"13":[{"catchword":"Als Hij zegt","tekst":"Dusverre zijn verhaald de woorden van den profeet: nu spreekt wederom de apostel. Grieks in het zeggen."},{"catchword":"oud gemaakt;","tekst":"Of doen verouden; dat is, verklaard oud te zijn."},{"catchword":"de verdwijning","tekst":"Dat is, wegneming, zo dat het uit het midden is geweerd, en niet meer gebruikt wordt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now the capital sum [Or the head point among, or in the things, i.e. the principal : for the Greek word kephalaion signifies both] of the things whereof we speak, is, (that) we have such an high Priest, who is set at the right (hand) of the throne of the Majesty in the heavens: [that is, at the right hand of God who is set on the throne of his Majesty, or glory, in the third or highest heaven. See before chap. 1. 3. Act. 3. 21.]"}],"2":[{"catchword":null,"tekst":"A Minister of the Sanctuary [Gr. Of the Holies: whereby the heaven is understood, whereof the holy of Holies was a type, as afterward chap. 9 ver. 8. 12. which is here distinguished from the first part of the Tabernacle, into which the Priests went every day, but the high Priest went but once a year into the Sanctuary, or holy of Holies, as is further declared in the beginning of the following chapter] and of the true [the word true is here opposed to the shadows, as Joh. 1. 17.] Tabernacle [as by the holy of Holies heaven is represented, Heb. 9. 24. so by this Tabernacle is understood the human nature of Christ, which is also compared thereunto Joh. 1. 14. and 2. 19. Heb. 9. 11. and in which the fullness of the Godhead dwelleth bodily, as in its Temple or Tabernacle, Col. 2. 9. which was conceived by the power of the Ghost, and was set up by no man, and by the offering up and blood whereof, Christ went into the holy of Holies: which well agrees with following verse. Whereof Christ may also be said to be said to be a Minister, because he sanctified the same human nature of his for a meet sacrifice, therein to expiate he sins of his people, and to accomplish the work of our salvation. See Joh. 17. 19. and hereafter chap. 9. 11. where this is thus declared at large] which the large] which the Lord set up, and no man."}],"3":[{"catchword":null,"tekst":"For every high Priest [This word for gives a reason why he said in the former verse that Christ is a Minister of the true Tabernacle of his body. Namely, because as an high Priest he also must have somewhat to offer] is appointed to offer gifts and sacrifices: wherefore it was necessary that this man also bad somewhat [namely, himself or his own body, as heretofore, chap. 7. 27. and hereafter, Chap. 9. 14. is expressed] to offer."}],"4":[{"catchword":null,"tekst":"For if he were on earth, he should not be a Priest, [Namely, because he had now fulfilled all things on earth, that were to be done by him on earth, as Priest. Therefore he should have finished his Ministry: but he must yet fulfill the true holy of Holies] while there are Priests, which offer gifts according to the Law. [That is, duly, and legally. And in these words is also a reason contained, why Christ should now be no Priest on earth, namely, who should legally and according to the ordinance of God administer the Priesthood here, because the Law maketh no Priest, but of the tribe of Levi, and no sacrifices but of ceremonial gifts, whereof Christ was made no Minister, but a Minister of that which was represented hereby, as the following verse also imports.]"}],"5":[{"catchword":null,"tekst":"Who minister to the type and the shadow of heavenly things [That is, of the things, which must also be administered and fulfilled by Christ in heaven, and which are necessary for us for an entrance into heaven] even as Moses was admonished by a divine oracle, when he was to perfect the Tabernacle. For see, saith he, that thou make all things, according to the representation [or prescript, mould, pattern, example, according to which men do or build any thing] which was showed thee [namely, in vision, either on the mount, or much rather in heaven opened, as afterward, chap. 9. 23. is declared: for Moses being in the mount saw this pattern in heaven itself] on the mount. [Or in the mount i.e. on the mount, namely, Horeb.]"}],"6":[{"catchword":null,"tekst":"And now hath he [Namely, the Lord Jesus Christ] gotten so much the more excellent Ministry, as he is also Mediator of a better Covenant [namely, then the Covenant of the Law and the ceremonies was] which was confirmed [Gr. Was legitimated] in better promises. [namely, which hereafter ver. 10. 11, 12. are expressed.]"}],"7":[{"catchword":null,"tekst":"For if that first (covenant) had been blameless, [That is, there had been nothing wanting in it, wherein nothing more could be required. For that which is perfect is not to give place to any other thing of the like condition. For the Law of Moses, whereof the ceremonies are here considered as an appendix, was indeed perfect in itself if any man had perfectly observed the same, but by reason of the impotency of the corrupt nature of man, which the Law could not take away, it could bring no man to salvation, Rom. 8. 3. Gal. 3. 21. Therefore God would make this new Covenant with man through Christ, in the room of the first, that defect of the first might hereby be amended: of which new Covenant the ceremonies were also shadows and types, Col. 2. 17. as shall be showed in the following chapter, and of which the ancient Fathers had indeed also received the promises, Gal. 3. 17. etc. but the fullness thereof was revealed unto us by Christ, as the Apostle shows in that which follows out of Jerem. 31.] there should no place have been sought for the second."}],"8":[{"catchword":null,"tekst":"For blaming [Or showing them the defect, or complaining of them, i.e. showing the weakness which through their corruption was in the covenant, and complaining of it] (them) [namely, the Israelites: or the same, namely, Covenant] he saith unto them, Behold the days come [namely, in the times of the Messiah] saith the Lord, and I will set up [Gr. Consummate. See the annotate. On ver. 10] a new covenant, [or Testament ] over the house of Israel, and over the house of Judah: [hereby are also understood all the elect of the Gentiles, as may be seen every where in the Prophets, who should by faith be ingraffed into this Olive tree. See Rom. 11. 17, 25, 26. Gal. 4. 26, etc]"}],"9":[{"catchword":null,"tekst":"Not according to the Covenant that I made with their Fathers [Namely, by Moses in the wilderness] in the day when I took them by the hand to lead them out of the land of Egypt: for they abode not in that my Covenant, and I regarded them not, [or I esteemed them not: In the Prophet it is, should I have remained in marriage with them or as a Lord? Which hath one sense with these words but the apostle would retain the Greek translation because there was no difference in matter ] saith the Lord."}],"10":[{"catchword":null,"tekst":"For this is the covenant that I will make [that is fully reveal and spread abroad throughout the whole world for the promise of this covenant was not made by void of the law of Moses Gal 3:17 but was first fulfilled fully revealed and set up in its perfection by Christ ] with the house of Israel after those days saith the Lord I will give my laws into their understanding [that is not only in tables of stones and rarchments see 2Cor.3.3 &c] and in their hearts I will inscribe them and I will be unto them for a God and they shall be to me for a people."}],"11":[{"catchword":null,"tekst":"And they shall not teach everyone his neighbor [namely by words or by writings only as was done in the legal covenant and they shall be taught of God namely by his spirit as Christ speaketh Joh 6:45,65 who not withstanding preached the gospel unto them also with his own mouth and exhorted them unto the knowledge of God this therefore is not absolutely or altogether denied but by comparison with manner in the instruction of the old testament as such phrases divers time occur see examples therefore John 5verse 30 1Thessalonians 4.9] and everyone his brother saying know the Lord for they shall all know me [namely who shall have learned of God as Christ testifies in the place fore mentioned Joh 6:45 for that here is spoken only for the saving knowledge and of true faith appears from the following verse seeing sins are forgiven to no man in the new covenant by they by true faith Rom 3:30 some understand this of the state of the life to come where they shall be no more need of outward instruction when we shall see him face to face 1corinthians 13.12 1Jn 3:2 but from the whole scope of the apostle appears that these promises concern all the elect believers of the new testament even in this life ] from the little among them unto the great among them."}],"12":[{"catchword":null,"tekst":"For I will be gracious to their iniquities and their sins and their transgressions I will in no wise remember anymore[namely to punish them therefore God in the new covenant retaineth no more punishment in when he hath once given sin as some urge although he yet sometimes out of fatherly love chastiseth his for their good see Heb 12:6,7]"}],"13":[{"catchword":null,"tekst":"When he saith [thus far the words of the prophets are rehearsed now the apostle speaketh again Gr in saying ] a new covenant he hath made the first old [or caused to wax old that is declared to be old ] now that which is made old and waxed old in nigh to vanishing [that is taking away so that it is removed and used no more.]"}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
