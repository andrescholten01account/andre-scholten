<style>

  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }

  .vers:hover .kopieer { opacity: .75; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }

 gesteld, en hebben Mijn werken gezien, veertig jaar lang.","10":"Daarom was Ik vertoornd over dat geslacht, en zei: Altijd dwalen zij met hun hart, en zij hebben Mijn wegen niet gekend.","11":"Zo heb Ik dan gezworen in Mijn toorn: Zij zullen Mijn rust niet binnengaan!","12":"Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;","13":"Maar vermaan elkaar elke dag, zolang het heden genoemd wordt, opdat niemand van u verhard wordt door de misleiding van de zonde.","14":"Want wij zijn deelgenoten van Christus geworden, als wij tenminste het begin van dit vaste vertrouwen tot het einde toe onwrikbaar vasthouden;","15":"Terwijl er gezegd wordt: Heden, als u Zijn stem hoort, verhard uw harten niet, zoals bij de verbittering gebeurd is.","16":"Want sommigen, toen zij die gehoord hadden, hebben Hem verbitterd, maar niet allen die uit Egypte door Mozes weggetrokken zijn.","17":"Over wie nu is Hij veertig jaar lang vertoornd geweest? Was het niet over hen die gezondigd hadden, van wie de lichamen gevallen zijn in de woestijn?","18":"En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?","19":"En wij zien dat zij niet konden binnengaan vanwege hun ongeloof."},"SV":{"1":"Hierom, heilige broeders, die der hemelse roeping deelachtig zijt, aanmerkt den Apostel en Hogepriester onzer belijdenis, Christus Jezus;","2":"Die getrouw is Dengene, Die Hem gesteld heeft, gelijk ook Mozes in geheel zijn huis was.","3":"Want Deze is zoveel meerder heerlijkheid waardig geacht dan Mozes, als degene, die het huis gebouwd heeft, meerder eer heeft, dan het huis.","4":"Want een ieder huis wordt van iemand gebouwd; maar Die dit alles gebouwd heeft, is God.","5":"En Mozes is wel getrouw geweest in geheel zijn huis, als een dienaar, tot getuiging der dingen, die *daarna* gesproken zouden worden;","6":"Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, indien wij maar de vrijmoedigheid en den roem der hoop tot het einde toe vast behouden.","7":"Daarom, gelijk de Heilige Geest zegt: Heden, indien gij Zijn stem hoort,","8":"Zo verhardt uw harten niet, gelijk *het* *geschied* *is* in de verbittering, ten dage der verzoeking, in de woestijn;","9":"Alwaar Mij uw vaders verzocht hebben; zij hebben Mij beproefd, en hebben Mijn werken gezien, veertig jaren lang.","10":"Daarom was Ik vertoornd over dat geslacht, en sprak: Altijd dwalen zij met het hart, en zij hebben Mijn wegen niet gekend.","11":"Zo heb Ik dan gezworen in Mijn toorn; Indien zij in Mijn rust zullen ingaan!","12":"Ziet toe, broeders, dat niet te eniger tijd in iemand van u zij een boos, ongelovig hart, om af te wijken van den levenden God;","13":"Maar vermaant elkander te allen dage, zolang als het heden genaamd wordt, opdat niet iemand uit u verhard worde door de verleiding der zonde.","14":"Want wij zijn Christus deelachtig geworden, zo wij anders het beginsel van dezen vasten grond tot het einde toe vast behouden;","15":"Terwijl er gezegd wordt: Heden, indien gij Zijn stem hoort, zo verhardt uw harten niet, gelijk in de verbittering *geschied* *is*.","16":"Want sommigen, als zij die gehoord hadden, hebben *Hem* verbitterd, doch niet allen, die uit Egypte door Mozes uitgegaan zijn.","17":"Over welke nu is Hij vertoornd geweest veertig jaren? Was het niet over degenen, die gezondigd hadden, welker lichamen gevallen zijn in de woestijn?","18":"En welken heeft Hij gezworen, dat zij in Zijn rust niet zouden ingaan, anders dan dengenen, die ongehoorzaam geweest waren?","19":"En wij zien, dat zij niet hebben kunnen ingaan vanwege *hun* ongeloof."},"KJV":{"1":"Wherefore, holy brethren, partakers of the heavenly calling, consider the Apostle and High Priest of our profession, Christ Jesus;","2":"Who was faithful to him that appointed him, as also Moses *was faithful* in all his house.","3":"For this *man* was counted worthy of more glory than Moses, inasmuch as he who hath builded the house hath more honour than the house.","4":"For every house is builded by some *man*; but he that built all things *is* God.","5":"And Moses verily *was* faithful in all his house, as a servant, for a testimony of those things which were to be spoken after;","6":"But Christ as a son over his own house; whose house are we, if we hold fast the confidence and the rejoicing of the hope firm unto the end.","7":"Wherefore (as the Holy Ghost saith, To day if ye will hear his voice,","8":"Harden not your hearts, as in the provocation, in the day of temptation in the wilderness:","9":"When your fathers tempted me, proved me, and saw my works forty years.","10":"Wherefore I was grieved with that generation, and said, They do alway err in *their* heart; and they have not known my ways.","11":"So I sware in my wrath, They shall not enter into my rest.)","12":"Take heed, brethren, lest there be in any of you an evil heart of unbelief, in departing from the living God.","13":"But exhort one another daily, while it is called To day; lest any of you be hardened through the deceitfulness of sin.","14":"For we are made partakers of Christ, if we hold the beginning of our confidence stedfast unto the end;","15":"While it is said, To day if ye will hear his voice, harden not your hearts, as in the provocation.","16":"For some, when they had heard, did provoke: howbeit not all that came out of Egypt by Moses.","17":"But with whom was he grieved forty years? *was it* not with them that had sinned, whose carcases fell in the wilderness?","18":"And to whom sware he that they should not enter into his rest, but to them that believed not?","19":"So we see that they could not enter in because of unbelief."}},"tsk":{"1":[{"kopje":"heilige","refs":["Kol 1:22","Kol 3:12","1 Tess 5:27","2 Tim 1:9","1 Petr 2:9","1 Petr 3:5","2 Petr 1:3-10","Openb 18:20"]},{"kopje":"deel hebben","refs":["Hebr 3:14","Rom 11:17","Rom 15:27","1 Kor 9:23","1 Kor 10:17","2 Kor 1:7","Ef 3:6","Kol 1:12","1 a-code=\"G5613\">as</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the provocation.","16":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> <span class=\"wl wl-kjv\" data-code=\"G5100\">some,</span> when they had <span class=\"wl wl-kjv\" data-code=\"G191\">heard,</span> did <span class=\"wl wl-kjv\" data-code=\"G3893\">provoke:</span> <span class=\"wl wl-kjv\" data-code=\"G235\">howbeit</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> that <span class=\"wl wl-kjv\" data-code=\"G1831\">came</span> out <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> <span class=\"wl wl-kjv\" data-code=\"G125\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">by</span> Moses.","17":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> with <span class=\"wl wl-kjv\" data-code=\"G5101\">whom</span> was he <span class=\"wl wl-kjv\" data-code=\"G4360\">grieved</span> <span class=\"wl wl-kjv\" data-code=\"G5062\">forty</span> <span class=\"wl wl-kjv\" data-code=\"G2094\">years?</span> was it <span class=\"wl wl-kjv\" data-code=\"G3780\">not</span> with them that had <span class=\"wl wl-kjv\" data-code=\"G264\">sinned,</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">whose</span> <span class=\"wl wl-kjv\" data-code=\"G2966\">carcases</span> <span class=\"wl wl-kjv\" data-code=\"G4098\">fell</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the wilderness?","18":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> to <span class=\"wl wl-kjv\" data-code=\"G5101\">whom</span> sware <span class=\"wl wl-kjv\" data-code=\"G3660\">he</span> that they <span class=\"wl wl-kjv\" data-code=\"G1525\">should</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G1525\">enter</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G2663\">rest,</span> <span class=\"wl wl-kjv\" data-code=\"G1508\">but</span> to them that believed not?","19":"<span class=\"wl wl-kjv\" data-code=\"G2532\">So</span> we <span class=\"wl wl-kjv\" data-code=\"G991\">see</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> they <span class=\"wl wl-kjv\" data-code=\"G1410\">could</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> enter <span class=\"wl wl-kjv\" data-code=\"G1525\">in</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">because</span> of unbelief."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"heilige broeders,","tekst":"Namelijk dewijl wij verstaan hebben, dat Christus waarachtig God is, en ééne natuur met ons deelachtig is geworden, gelijk in Heb 12 is bewezen."},{"catchword":"der hemelse roeping","tekst":"Dat is, die uit den hemel is, Phi 3:14, en ons tot hemelse dingen vermaant, 2Th 2:14. En alzo onderscheidt hij de gelovige Joden van de ongelovigen en hardnekkigen."},{"catchword":"aanmerkt den","tekst":"Namelijk zo, dat gij Hem gehoorzaam blijft. Het Griekse woord betekent ene aanmerking met grote aandacht."},{"catchword":"Apostel","tekst":"Dat is, gezant des Vaders, om ons den raad Gods van onze zaligheid te openbaren. Zie Joh 20:21."},{"catchword":"Hogepriester","tekst":"Namelijk om ons met God te verzoenen; van welk ambt hij breder zal handelen in hfdst.5 en 6."},{"catchword":"onzer belijdenis, Christus Jezus;","tekst":"Dat is, der evangelische leer, waarvan wij belijdenis doen."}],"2":[{"catchword":"Die Hem gesteld heeft,","tekst":"Grieks die hem gemaakt heeft; namelijk tot een apostel, profeet en hogepriester. Zie 1Sa 12:6; Act 2:36."},{"catchword":"zijn huis was","tekst":"Dat is, Zijne gemeente, die het huis Gods genoemd wordt, omdat Hij daarin door Zijn woord, genade en Geest woont. Zie Mat 18:20; 1Ti 3:15."}],"3":[{"catchword":"Deze is zoveel meerder","tekst":"Namelijk Christus, de apostel en hogepriester onzer belijdenis."},{"catchword":"gebouwd heeft,","tekst":"Of toegerust, toebereid."},{"catchword":"dan het huis","tekst":"Namelijk dat door Hem gebouwd is, namelijk Zijn gemeente, waarvan Mozes een lidmaat is."}],"4":[{"catchword":"Die dit alles gebouwd heeft,","tekst":"Dat is, teweeggebracht heeft, wat tot den welstand Zijner gemeente behoort."},{"catchword":"is God","tekst":"Waaruit dan noodwendig volgt dat Christus ook deze ware God is, die dit alles heeft gebouwd, zoals hij in vs.3 getuigd had."}],"5":[{"catchword":"tot getuiging der dingen,","tekst":"Of tot getuigenis. Dit zegt de apostel van de voorzeggingen en ceremoniën des Ouden Testaments, die door Mozes en de profeten zijn voorgesteld, en daarna door Christus en de apostelen nader en breder zouden verklaard worden, gelijk Mozes zelf getuigt; Deu 18:15."}],"6":[{"catchword":"als de Zoon","tekst":"Dat is, als de eigen Zoon en erfgenaam, want anders was ook Mozes een zoon Gods door het geloof."},{"catchword":"huis wij zijn,","tekst":"Dat is, gemeente, of huisgenoten; gelijk vs.2."},{"catchword":"de vrijmoedigheid","tekst":"Dat is, het geloof of vertrouwen op Christus, waardoor wij een vrijmoedigen toegang hebben tot God, als tot onzen Vader. Zie hierna Heb 10:22, en Rom 8:15, enz."},{"catchword":"de roem der hoop","tekst":"Dat is, waardoor wij van Gods gunst en toekomende heerlijkheid durven roemen; Rom 5:2-3."}],"7":[{"catchword":"de Heilige Geest zegt","tekst":"Namelijk door den mond van den profeet David, gelijk daarbij gevoegd wordt, Act 1:16. Zie ook 2Sa 23:2, en 2Pe 1:21."},{"catchword":"Zijn stem","tekst":"Namelijk Gods of des Messias' stem, waardoor God ook tot hen zou spreken; Heb 1:1."},{"catchword":"hoort,","tekst":"Of zult horen. Waarmede de profeet aanwijst, dat hij dit niet alleen verstaat van zijn stem, die toen sprak, maar nog van een andere stem, namelijk van den Messias, die daarna nog tot hen zou spreken."}],"8":[{"catchword":"verhardt uw harten niet,","tekst":"De mensen worden gezegd hun harten te verharden, wanneer zij de stem des Heeren niet ter harte nemen, of tot hun harten laten ingaan, om die te geloven en te gehoorzamen. Zie Zec 7:11, enz."},{"catchword":"in de verbittering,","tekst":"Dat is, in den tijd der verbittering, toen de Israëlieten God door hun wederspannigheid vertoornden of verbitterden, hetwelk meermalen in de woestijn is geschied in den tijd van veertig jaren, maar inzonderheid Exo 17:7; Num 20:13."},{"catchword":"ten dage der verzoeking,","tekst":"Dat is, ten tijde der verzoeking, toen zij mij in de woestijn verzochten. En de apostel stelt hun dit voorbeeld voor, omdat zij altijd op hun voorouders roemden."}],"9":[{"catchword":"verzocht hebben;","tekst":"De mens wordt gezegd God te verzoeken, wanneer hij Gods beloften of macht moedwillig in twijfel trekt, of de gewone middelen van Gods regering veracht, en buitengewone verzoekt, gelijk de Israëlieten hier deden, en de Farizeën Christus verzoeken; Mat 16:1."},{"catchword":"Mij beproefd,","tekst":"Sommigen nemen dit voor een verklaring van het voorgaande woord verzoeken, doch wordt door anderen wel zo geschikt in het goede genomen voor: genoegzame proeve of ervarenheid hebben van Gods macht en goeden wil in het verlossen van hen, en spijzigen van hen, al dien voorgaanden tijd, gelijk de volgende woorden dezen zin ook medebrengen."}],"10":[{"catchword":"dwalen zij met het hart,","tekst":"Dat is, keren zich als dwalende mensen van mij af, en van de gehoorzaamheid, die zij mij schuldig zijn."},{"catchword":"Mijn wegen","tekst":"Dat is mijn geboden, die Ik hun gegeven heb, en mijn weldaden, die Ik hun gedaan heb."},{"catchword":"niet gekend","tekst":"Dat is, niet ter harte genomen; of, in hun kennis die niet gezocht te houden, om die behoorlijk te erkennen en waar te nemen."}],"11":[{"catchword":"Indien zij","tekst":"Eene wijze van eedzweren bij de Hebreën gebruikelijk. Zie Mar 8:12. Dat is, dat zij niet zullen ingaan."},{"catchword":"in Mijn rust zullen ingaan","tekst":"Zo wordt hier genoemd het land Kanaän, omdat het geweest is een einde van de dwalingen der Israëlieten in de woestijn, en wordt alhier meteen voorgesteld als een voorbeeld van de toekomende rust na dit leven, in het eeuwige leven, gelijk Paulus in Heb 4 nader zal verklaren."}],"12":[{"catchword":"broeders,","tekst":"Alzo noemt hij hier de Hebreën, die belijdenis van Christus deden, en vermaant hen nu elk in het bijzonder toe te zien, dat zij den meerderen hoop der hardnekkige Joden niet zouden volgen, gelijk vele van hun vaders in de woestijn gedaan hadden, en daarom uit de rust van het land Kanaän waren uitgesloten."},{"catchword":"een boos,","tekst":"Grieks een boos hart des ongeloofs; dat is, dat onder den schijn van een Christen te zijn, evenwel ongelovig is, en dies lichtelijk tot afwijking van zijn belijdenis te brengen. Zie Mat 13:20-21."}],"13":[{"catchword":"elkander te allen dage,","tekst":"Namelijk tot standvastigheid en toenemen in het geloof. Het kan ook overgezet worden: vermaant uzelf; doch de volgende woorden, opdat niet iemand van u, schijnen de eerste overzetting te vereisen, gelijk dit Griekse woord heautous ook gebruikt wordt, Eph 4:32; Col 3:16; 1Th 5:13."},{"catchword":"zolang als het heden","tekst":"Dat is, zolang als de Heere u tijd en gelegenheid daartoe geeft, en u daartoe roept, welke roeping wij moeten waarnemen. Want anderszins zendt de Heere dikwijls door Zijn rechtvaardigheid een kracht der dwaling over de mensen, die het Evangelie niet gehoorzaam zijn, tot een straf voor hun ondankbaarheid. Zie 2Th 2:11-12."}],"14":[{"catchword":"Christus deelachtig geworden,","tekst":"Of Christus' medegenoten; namelijk in Zijne hemelse erve, Rom 8:17; 1Pe 1:3-4."},{"catchword":"dezen vasten grond","tekst":"Grieks hypostaseos; dat is, der zelfstandigheid; alzo noemt hij het geloof en vast vertrouwen op Christus, omdat het ons Gods beloften bevestigd en in ons doet bestaan. Dergelijke betekenis van dit woord, zie 2Co 9:4, en 2Co 11:17, en hierna Heb 11:1; hoewel hetzelfde woord hier voor, Heb 1:3, in ene andere betekenis wordt genomen."}],"15":[{"catchword":"Terwijl er gezegd wordt","tekst":"Of zo lang; namelijk ook tot u door den geest van Christus en Zijner gezanten gezegd wordt, gelijk het eertijds gezegd is door Mozes tot uwe vaders."}],"16":[{"catchword":"doch niet allen,","tekst":"Namelijk gelijk Jozua, Kaleb, vele Levieten en anderen; hetwelk de apostel daarbij voegt, om te tonen dat God altijd ook Zijn overblijfsel onder het volk heeft behouden, en derhalve onder hen ook behouden zal, niettegenstaande de verharding van velen."}],"17":[{"catchword":"die gezondigd hadden,","tekst":"Dat is, tegen God gemurmureerd hadden, en van Hem afvallig geworden waren."},{"catchword":"lichamen gevallen zijn","tekst":"Grieks leden. Niet dat allen die in de woestijn gestorven zijn noodzakelijk ook uit den hemel zijn gesloten; want ook Aäron en Mozes zijn daar gestorven; maar die zonder berouw en betering, nadat zij God verzocht hadden, daarin zijn gestorven, waarvan het uitsluiten uit het beloofde land maar een voorbeeld was."}],"19":[{"catchword":"vanwege [hun","tekst":"ongeloof] Dat is, omdat zij niet betrouwden op Gods beloften, maar tegen Hem murmureerden zonder berouw."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"For this cause [namely seeing we have understood that Christ is true God and is made partaker of one nature with us as is proved in the former chapters ]holy brethren who are partakers of the heavenly calling [that is which is from heaven Php 3:14 and exhorteth and bringeth us unto heavenly things 2Thesallonians 2.14 and so he distinguisheth the believing Jews from the unbelieving and stiff-necked ] observe[ so that ye continue obedient unto him the Greek word signifieth an offering with great attention ] the apostle [that is ambassador of the father to reveal us the counsel of God concerning our salvation see Joh 20:21] and high priest[namely to reconcile us unto God of which office he will treat more at large in the fifth and the following chapters ] of our profession [that is of the doctrine of the gospel whereof we make profession ] Christ Jesus"}],"2":[{"catchword":null,"tekst":"Who is faithful to him that appointed him [Gr that made him namely an apostle prophet and high priest see 1 Samuel 12.6 Act 2:36] even as Moses also was in his whole house [that is his church which is called the house of god because he dwells in the same by his word grace and spirit see Mat 18:20 1Timothy 3.15]"}],"3":[{"catchword":null,"tekst":"for this man [namely Christ the apostle and high priest of our profession ]was counted worthy of so much greater glory then Moses as he built [or furnished prepared ]the house hath greater honor then the house [ namely that is built by him namely his church whereof Moses was a member ]"}],"4":[{"catchword":null,"tekst":"For every house is built by some man but he hath built all this [that is accomplished what belongeth to the welfare of his church ]is God [ from whence then necessarily followeth that Christ is also the true God who built all this as he hath testifieth in the third verse ]"}],"5":[{"catchword":null,"tekst":"And Moses indeed was faithful in his whole house as a servant for testifying [or for a testimony this the apostle saith of the predictions and ceremonies of the old testament which were propounded by Moses and the prophets and afterwards by Christ and more largely expounded as Moses himself testifieth Deu 18:15] of the things which afterwards should be spoken ."}],"6":[{"catchword":null,"tekst":"But Christ as the son [that is as the proper son and heir for otherwise Moses was a son of God by faith ] over his own house whose house are[that is church or of his household as verse 2] if we do but hold hast courage [that is faith and confidence in Christ whereby we have a bold access unto God as an unto our father see afterwards chapter 10.22 and Rom 8:15 &c] and the glory of hope [that is hope whereby we dare to boast of Gods favor and our future glory Rom 5:2,3.] unto the end."}],"7":[{"catchword":null,"tekst":"Therefore as the holy ghost saith [namely by the mouth of the prophet David as is added Act 1:16 see also 2Sa 23:2 and 2Pe 1:21] today if ye hear [or will hear whereby the prophet sheweth that he doth not understand this of his voice who spoke then of yet another voice namely of the Messiah who afterwards should yet speak unto them ] his voice [namely Gods or Messiahs voice whereby God should also speak unto them Heb 1:1.]"}],"8":[{"catchword":null,"tekst":"Harden not your hearts [men are said to harden their hearts when they take not the Lords voice to heart or let it not enter into the hearts to believe and obey it see zach7.11 &c] as it came to pass in the provocation [that is in the time of provocation when the Israelites by their rebellion provoked God which was done divers times of forty years but especially Exo 17:7 Num 20:17]in the day of temptation when they tempted me in the wilderness and the apostle propounds this example unto them because they always boasted of their forefathers ] in the wilderness:"}],"9":[{"catchword":null,"tekst":"Where your fathers tempted me [man is said to tempt God when he willfully calls Gods promises or power into question or despised the ordinary means of Gods government and desired extraordinary as the Israelites here did & the Pharisees tempt Christ Mat 16:1]they proved me [ some take this for an explication of the former word tempt but is by others taken in good part for having sufficient proof or experience of Gods power and good will in delivering them and feeding them all that foregoing as the following words also imports the sense ] and saw my works for forty years ."}],"10":[{"catchword":null,"tekst":"Therefore I was wrath with that generation and said they always ere either the heart [that is turn away from me a erring men and from the obedience which they owe me] and they have not known [that is not laid to heart or not sought to hold them in their knowledge duly to acknowledge and observe them] my ways [that is my commandments which I have given them and my benefits which I have done them.]"}],"11":[{"catchword":null,"tekst":"So then I swear in my wrath if they shall enter [a form of taking an oath usual with the Hebrews see mark 8.12 that is that they shall not enter ] into my rest [so the Canaan is here called because it was an end of wanderings of the Israelites in the wilderness & is here with all propounded as a type of the rest to come after this life in eternal life as Paul in the following chapter will further declare ]"}],"12":[{"catchword":null,"tekst":"Take heed brethren [so he here calls the Hebrews who made profession of Christ and exhorts them now in particular to take heed that they did not follow the greater part of the stiff-necked Jews as many of their fathers had done in the wilderness and therefore were excluded out of the rest of the land of Canaan ] lest at any time there be in any of you a wicked unbelieving heart [Gr a wicked heart of unbelief that is that under a show of being a Christian nevertheless is unbelieving and consequently easily to be brought to apostasy from his profession see Matthew 13 verse 20,21] to turn away from the living God"}],"13":[{"catchword":null,"tekst":"But exhorts one another everyday [namely to steadfastness and increasing in faith it may also be translated exhort yourself but the following words lest any one of you seem to require the first translation as this Greek word heautous is also taken Eph 4:32 Col 3:16 1Thessalonians 5.13] whilst it is called today [that is whilst the Lord gives you time and opportunity for it and called you thereunto which calling we must take heed to for otherwise the Lord by his justice often times sends a power of error upon men who obey not the gospel for a punishment of their unthankful ness see 2Thessalonians 2.11,12] lest anyone of you of you should be hardened the seduction of sin ."}],"14":[{"catchword":null,"tekst":"For we are become partakers of Christ [or Christ&acirc;&euro;&trade;s partners namely his heavenly inheritance Rom 8:17 1Peter 1.3,4] if so he e retain from the beginning of this firm ground [Gr hypostaseous that is subsistence so he calleth faith and firm confidence in Christ because the same confirms Gods promises to us and causeth them to subsist in us the like signification of this word see 2Co 9:4 and chapter 11.17 and hereafter chapter 11 verse 1 although the same word before chapter 1.3 be taken in another sense ]even unto the end."}],"15":[{"catchword":null,"tekst":"While it is said [namely unto you also by the spirit of Christ and his messengers as in former time it was said by Moses to your fathers ] today if ye hear his voice harden not your heart as was done in the provocation"}],"16":[{"catchword":null,"tekst":"For some when they had heard the same provoked him yet not all went out of Egypt by Moses [namely as Joshua Caleb many Levites and others which the apostle adds to show that God always kept his remnant among the people and therefore will also preserve he like among them not withstanding the hardening of many.]"}],"17":[{"catchword":null,"tekst":"Now to whom he was wroth forty years was is not with those that had sinned ?[ that is had murmured against God and were become backsliders from him ] whose bodies [Gr members not that all that died in the wilderness were thereupon necessarily excluded out of heaven for Aaron and Moses died there also but they that died therein without amendment and sorrow after that they had tempted God were of exclusion out of the promised land was but a type ]fell in wilderness?"}],"18":[{"catchword":null,"tekst":"And to whom did he wear that they should not enter into the rest but to them who had been disobedient?"}],"19":[{"catchword":null,"tekst":"And we see that they were not able to enter by reason of their unbelief [that is because they trusted not in Gods promises but murmured against him without repentance.]"}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const concordCache = {};

  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);

  } catch (e) { cache[code] = null; }

}

const popupCache = {};

  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];

// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;

document.addEventListener('mouseover', e => {

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
