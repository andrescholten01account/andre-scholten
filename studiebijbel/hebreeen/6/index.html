van het einde verbranding is.","9":"Maar, geliefden, wij zijn ervan overtuigd dat het bij u beter gesteld is, en dat het met de zaligheid samengaat, ook al spreken wij zo.","10":"Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en *nog* dient.","11":"Maar wij verlangen ernaar dat ieder van u dezelfde ijver bewijst, tot de volle zekerheid van de hoop, tot het einde toe;","12":"opdat u niet traag wordt, maar navolgers bent van hen die door geloof en geduld de beloften beërven.","13":"Want toen God aan Abraham de belofte deed, zwoer Hij bij Zichzelf, omdat Hij bij niemand groter kon zweren,","14":"en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken.","15":"En zo heeft hij, nadat hij geduldig volhard had, de belofte verkregen.","16":"Want mensen zweren wel bij iemand die groter is dan zij, en de eed tot bevestiging is voor hen een einde van alle tegenspraak;","17":"waarbij God, omdat Hij aan de erfgenamen van de belofte overvloediger de onveranderlijkheid van Zijn raad wilde tonen, er een eed tussen heeft gebracht;","18":"opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;","19":"welke hoop wij hebben als een anker van de ziel, dat zeker en vast is, en dat ingaat in het binnenste van het voorhangsel;","20":"waar de Voorloper voor ons is ingegaan, namelijk Jezus, naar de ordening van Melchizedek, Hogepriester geworden in eeuwigheid."},"SV":{"1":"Daarom, nalatende het beginsel der leer van Christus, laat ons tot de volmaaktheid voortvaren; niet wederom leggende het fondament van de bekering van dode werken, en van het geloof in God,","2":"Van de leer der dopen, en van de oplegging der handen, en van de opstanding der doden, en van het eeuwig oordeel.","3":"En dit zullen wij *ook* doen, indien het God toelaat.","4":"Want het is onmogelijk, degenen, die eens verlicht geweest zijn, en de hemelse gave gesmaakt hebben, en des Heiligen Geestes deelachtig geworden zijn,","5":"En gesmaakt hebben het goede woord Gods, en de krachten der toekomende eeuw,","6":"En afvallig worden, *die*, *zeg* *ik*, wederom te vernieuwen tot bekering, als welke zichzelven den Zoon van God wederom kruisigen en openlijk te schande maken.","7":"Want de aarde, die den regen, menigmaal op haar komende, indrinkt, en bekwaam kruid voortbrengt voor degenen, door welke zij ook gebouwd wordt, die ontvangt zegen van God;","8":"Maar die doornen en distelen draagt, die is verwerpelijk, en nabij de vervloeking, welker einde is tot verbranding.","9":"Maar, geliefden! wij verzekeren ons van u betere dingen, en met de zaligheid gevoegd, hoewel wij alzo spreken.","10":"Want God is niet onrechtvaardig dat Hij uw werk zou vergeten, en den arbeid der liefde, die gij aan Zijn Naam bewezen hebt , als die de heiligen gediend hebt en *nog* dient.","11":"Maar wij begeren, dat een iegelijk van u dezelfde naarstigheid bewijze, tot de volle verzekerdheid der hoop, tot het einde toe;","12":"Opdat gij niet traag wordt, maar navolgers zijt dergenen, die door geloof en lankmoedigheid de beloftenissen beërven.","13":"Want als God aan Abraham de belofte deed, dewijl Hij bij niemand, die meerder was, had te zweren, zo zwoer Hij bij Zichzelven,","14":"Zeggende: Waarlijk, zegenende zal Ik u zegenen, en vermenigvuldigende zal Ik u vermenigvuldigen.","15":"En alzo, lankmoediglijk verwacht hebbende, heeft hij de belofte verkregen.","16":"Want de mensen zweren wel bij den meerdere *dan* *zij* *zijn*, en de eed tot bevestiging is denzelven een einde van alle tegenspreken;","17":"Waarin God, willende den erfgenamen der beloftenis overvloediger bewijzen de onveranderlijkheid van Zijn raad, met een eed daartussen is gekomen;","18":"Opdat wij, door twee onveranderlijke dingen, in welke het onmogelijk is dat God liege, een sterke vertroosting zouden hebben, *wij* *namelijk*, die de toevlucht genomen hebben, om de voorgestelde hoop vast te houden;","19":"Welke wij hebben als een anker der ziel, hetwelk zeker en vast is, en ingaat in het binnenste van het voorhangsel;","20":"Daar de Voorloper voor ons is ingegaan, *namelijk* Jezus, naar de ordening van Melchizedek, een Hogepriester geworden zijnde in der eeuwigheid."},"KJV":{"1":"Therefore leaving the principles of the doctrine of Christ, let us go on unto perfection; not laying again the foundation of repentance from dead works, and of faith toward God,","2":"Of the doctrine of baptisms, and of laying on of hands, and of resurrection of the dead, and of eternal judgment.","3":"And this will we do, if God permit.","4":"For *it is* impossible for those who were once enlightened, and have tasted of the heavenly gift, and were made partakers of the Holy Ghost,","5":"And have tasted the good word of God, and the powers of the world to come,","6":"If they shall fall away, to renew them again unto repentance; seeing they crucify to themselves the Son of God afresh, and put *him* to an open shame.","7":"For the earth which drinketh in the rain that cometh oft upon it, and bringeth forth herbs meet for them by whom it is dressed, receiveth blessing from God:","8":"But that which beareth thorns and briers *is* rejected, and *is* nigh unto cursing; whose end *is* to be burned.","9":"But, beloved, we are persuaded better things of you, and things that accompany salvation, though we thus speak.","10":"For God *is* not unrighteous to forget your work and labour of love, which ye have shewed toward his name, in that ye have ministered to the saints, and do minister.","11":"And we desire that every one of you do shew the same diligence to the full assurance of hope unto the end:","12":"That ye be not slothful, but followers of them who through faith and patience inherit the promises.","13":"For when God made promise to Abraham, because he could swear by no greater, he sware by himself,","14":"Saying, Surely blessing I will bless thee, and multiplying I will multiply thee.","15":"And so, after he had patiently endured, he obtained the promise.","16":"For men verily swear by the greater: and an oath for confirmation *is* to them an end of all strife.","17":"Wherein God, willing more abundantly to shew unto the heirs of promise the immutability of his counsel, confirmed *it* by an oath:","18":"That by two immutable things, in which *it was* impossible for God to lie, we might have a strong consolation, who have fled for refuge to lay hold upon the hope set before us:","19":"Which *hope* we have as an anchor of the soul, both sure and stedfast, and which entereth into that within the veil;","20":"Whither the forerunner is for us entered, *even* Jesus, made an high priest for ever after the order of Melchisedec."}},"tsk":{"1":[{"kopje":"achterlaten","refs":["Hebr 5:12-14"]},{"kopje":"beginsel van de leer","refs":["Mark 1:1","Joh 1:1-3","1 Tim 3:16"]},{"kopje":"laten","refs":["Hebr 7:11","Hebr 12:13","Spr 4:18","Matt 5:48","1 Kor 13:10","2 Kor 7:1","Ef 4:12","Fil 3:12-15","Kol 1:28","Kol 4:12","Jak 1:4","1 Petr 5:10","1 Joh 4:12"]},{"kopje":"leggend","refs":["Matt 7:25","Luk 6:48","1 Kor 3:10-12","1 Tim 6:19","2 Tim 2:19"]},{"kopje":"bekering","refs":["Jes 55:6","Jes 55:7","Ezech 18:30-32","Zach 12:10","Matt 3:2","Matt 4:17","Matt 21:29","Matt 21:32","Mark 6:12","Hand 2:38","Hand 3:19","Hand 11:18","Hand 17:30","Hand 20:21","Hand 26:20","2 Kor 7:10","2 Tim 2:25","2 Tim 2:26"]},{"kopje":"dode","refs":["Hebr 9:14","Gal 5:19-21","Ef 2:1","Ef 2:5"]},{"kopje":"geloof","refs":["Hebr 11:6","Joh 5:24","Joh 12:44","Joh 14:1","1 Petr 1:21","1 Joh 5:10-13"]}],"2":[{"kopje":"de leer","refs":["Hebr 9:10","Mark 7:4","Mark 7:8","Luk 11:38","Matt 3:14","Matt 20:22","Matt 20:23","Matt 28:19","Mark 16:16","Luk 3:16","Luk 12:50","Joh 1:33","Joh 3:25","Joh 3:26","Joh 4:1","Joh 4:2","Hand 2:38","Hand 2:41","Hand 8:12","Hand 8 },{"catchword":"van de opstanding der doden,","tekst":"Van welk artikel degenen, die tot de gemeenschap der kerk van Christus toegelaten werden, bijzonder rekenschap moesten geven, omdat niet alleen de heidenen daarmede spotten, Act 17:32, maar ook de Sadduceën onder de Joden, Mat 22:23, en vele ketters onder de Christenen deze loochenden; 2Ti 2:18."},{"catchword":"van het eeuwig oordeel","tekst":"Namelijk over levenden en over doden, over de ongelovigen ten eeuwigen dood, en over de gelovigen ten eeuwigen leven. Dit zijn dan de zes hoofdstukken van de beginselen of fondamenten der christelijke religie, die den aankomenden door vragen en antwoorden voorgesteld werden, die ook in onze catechismussen merendeels worden behandeld."}],"3":[{"catchword":"dit zullen wij [ook","tekst":"doen,] Namelijk het leggen van de eerste fondamenten der Christelijke religie, die Paulus nu wel voorbijgaat, omdat hij hen ook tot meer volkomen kennis van andere leerstukken wilde brengen, maar evenwel belooft bij andere gelegenheden deze te behandelen, indien het de Heere toeliet, gelijk hij ook elders in zijne zendbrieven doet. Anderen verstaan dit van de verklaring der meer volmaakte leer, die hij zal gaan voorstellen."}],"4":[{"catchword":"het is onmogelijk,","tekst":"Namelijk ten aanzien van Gods rechtvaardig oordeel over zulke ondankbare mensen, naar de verklaring die Christus zelf gedaan heeft van degenen die tegen den Heiligen Geest zondigen, Mat 12:31-32; gelijk de volgende verzen ook aantonen dat hier, gelijk ook hierna, Heb 10:26, van die zonde wordt gesproken. Waarom de apostel Johannes, 1Jo 5:16, gebiedt, dat men voor zulken niet zal bidden. Zie dergelijke wijze van spreken Joh 12:39-40."},{"catchword":"die eens verlicht geweest zijn,","tekst":"Namelijk in het verstand door de prediking des Evangelies."},{"catchword":"de hemelse gave gesmaakt hebben,","tekst":"Dat is, het geloof, hetwelk hier gezegd wordt, dat zij gesmaakt hebben, niet omdat zij het in zijn rechte wezen immer zouden ontvangen hebben, maar omdat zij een klein begin en gelijkenis of schijn daarvan gevoeld hebben, gelijk het woord smaken ook tegen innemen gesteld wordt, Mat 27:34; welk smaken Christus in de gelijkenis van den zaaier, Mat 13:20-21, noemt een ontvangen des woords met blijdschap; hetwelk nochtans geen wortel, dat is, geen recht vertrouwen op Christus heeft, en geen behoorlijke vruchten in volstandigheid geeft, dewijl het op steenachtige aarde, dat is, in een hart, dat niet behoorlijk voor God is vernederd, noch bereid, gevallen is. En dat dit hier ook de mening is, blijkt uit vs.7 en elders, waar deze vergeleken worden met aarde, die den regen niet indrinkt, en derhalve in plaats van goed kruid, doornen en distelen voortbrengt."},{"catchword":"des Heiligen Geestes deelachtig geworden zijn,","tekst":"Dat is, enige gaven des Heiligen Geestes, die God in de eerste Kerk den discipelen mededeelde. Zie hiervan 1Co 12:14."}],"5":[{"catchword":"het goede woord Gods,","tekst":"Dat is, de beloften des evangelies, waar dezen ook enigen smaak van ontvangen hebben, gelijk van het woord van Johannes den Doper in sommige Joden gezegd wordt, Joh 5:35, dat zij in zijn licht zich voor een korten tijd hebben willen verheugen."},{"catchword":"de krachten der toekomende eeuw,","tekst":"Dit kan geschikt van de krachten des eeuwigen levens verstaan worden, waarvan deze mensen ook somwijlen een kleinen smaak hebben, doordien zij dit woord met blijdschap ontvangen, en zich in de beloften van hetzelve een tijdlang verheugen, gelijk hiervoor vs.4 is aangewezen; en het woord smaken komt hiermede wel overeen."}],"6":[{"catchword":"afvallig worden,","tekst":"Of vervallen, waardoor niet allerlei zonden worden verstaan, waarin de ware gelovigen ook somwijlen vervallen, gelijk David, Petrus, enz., die daarna tot bekering komen; maar een geheel vervallen of afval van den Christelijken godsdienst, en die moedwillig geschiedt, gelijk Heb 10:26, wordt uitgedrukt, en met lastering derzelve, tegen de getuigenis des Heiligen Geestes in hun gemoed, gevoed is, gelijk Christus betuigt Mat 12:31."},{"catchword":"[die, zeg ik","tekst":"] Dit ziet op het voorgaande woord onmogelijk, vs.4. Het is dan onmogelijk die wederom te vernieuwen; welke onmogelijkheid niet alleen van de leraars te verstaan is, die tevergeefs zouden arbeiden om die te vernieuwen, of tot bekering te brengen, maar ook ten aanzien van Gods waarheid zelf, die eens dit rechtvaardig oordeel tegen hen heeft geveld, en niet veranderlijk is, en zich niet laat bespotten, Gal 6:7; ja ook ten aanzien van Christus' verdienste, die deze moedwillig verzaken en verwerpen, gelijk volgt. Waarom ook Heb 10:26, gezegd wordt dat er geen offerande voor de zonde van zodanigen meer over is."},{"catchword":"wederom te vernieuwen","tekst":"Dit woord wederom ziet op den staat waaruit zij vervallen zijn, welke staat een begin was van de vernieuwing, zo zij daarin gebleven en behoorlijk voortgegaan hadden, tot welken stand zij zelfs niet kunnen wedergebracht worden. Anderen nemen deze woorden wederom vernieuwen, bloot voor: vernieuwd worden, gelijk het Griekse woord palin, dat is, wederom, door een oneigenlijke wijze van spreken Pleonasinus genoemd, dikwijls overschiet. Zie een voorbeeld Joh 4:54, en Joh 13:12; Act 18:21, en wordt alleen daar bijgevoegd om de zaak krachtiger te betuigen."},{"catchword":"als welke zichzelven","tekst":"In deze woorden wordt nog een reden gegeven, waarom zulke afvalligen niet kunnen vernieuwd worden tot bekering, namelijk omdat zij Christus, dien de Vader tot een verzoening voor onze zonden heeft gegeven, zichzelf, dat is, zoveel in hen is, gelijk de Joden en heidenen tevoren aan Christus uiterlijk eens gedaan hadden, nieuwen smaad aandoen, en tegen hun gemoed tentoonstellen, of te schande te maken voor de gehele wereld, en tot hun verderf, hetwelk God niet ongewroken wil laten, gelijk dit Griekse woord paradeigmatizein ook betekent, Mat 1:19, voor welk woord, Mar 3:29, het woord blasphemein gebruikt wordt."}],"7":[{"catchword":"Want de aarde,","tekst":"Door deze gelijkenis toont de apostel de billijkheid van dit zwaar oordeel Gods over zulke mensen, dewijl dergelijke zelfs onder de mensen over zulke aarde placht te geschieden."},{"catchword":"ontvangt zegen van God;","tekst":"Of, wordt de zegen van God deelachtig; dat is, wordt van God meer en meer bekwaam gemaakt om meer vruchten voort te brengen."}],"8":[{"catchword":"nabij de vervloeking,","tekst":"Dat is, om geheel verlaten, en als ene vervloekte zaak tot den brand over gegeven te worden."}],"9":[{"catchword":"Maar, geliefden","tekst":"Met deze woorden verzacht de apostel het voorgaande dreigement en verklaart in het vervolg waarom hij de zware straf der afvalligen hun voorgedragen heeft, namelijk niet omdat hij hen voor zodanigen zou houden, maar om hen te waarschuwen en tot vasthouden aan de leer des evangelies en Gods beloften te vermanen."},{"catchword":"met de zaligheid gevoegd,","tekst":"Of, de zaligheid aanklevende."},{"catchword":"alzo spreken","tekst":"Dat is, zulk een zwaar oordeel uitspreken tegen de afvalligen."}],"10":[{"catchword":"onrechtvaardig,","tekst":"Dat is, ontrouw, of onstandvastig in het volbrengen van zijn beloften, gelijk Gods waarheid en standvastigheid in deze ook de rechtvaardigheid Gods doorgaans genoemd wordt; zie Psa 143:1; 1Jo 1:9."},{"catchword":"uw werk zou","tekst":"Namelijk het ware geloof, dat hij in u reeds heeft gewrocht, Phi 1:29."},{"catchword":"vergeten,","tekst":"Namelijk dat hij het, volgens zijne belofte, tot het einde toe in u niet zou volbrengen, Phi 1:6, en hier namaals niet genadig zou belonen."},{"catchword":"aan Zijn Naam bewezen hebt,","tekst":"Of, in zijnen naam, dat is, niet alleen uit enige menselijke beweging tegen de armen en verdrukten, maar omdat zij om den naam Gods, en om de belijdenis van Christus leden, hetwelk een eigenschap is des waren geloofs en der ware liefde, die Christus niet onbeloond laat; zie Mat 10:41-42, en Mat 25:40; Mar 9:41."}],"11":[{"catchword":"tot de volle verzekerdheid der hoop,","tekst":"Want gelijk de hoop der zaligheid uit het geloof voortkomt, alzo wordt deze hoop ook meer en meer gesterkt door de ware vruchten des geloofs. Zie 2Pe 1:10."},{"catchword":"tot het einde toe;","tekst":"Namelijk van uw leven, want die volstandig blijft tot het einde, die zal zalig worden; Mat 10:22."}],"12":[{"catchword":"lankmoedigheid","tekst":"Dat is, lijdzame verwachting van de volbrenging van Gods belofte, gelijk hij daarna met het voorbeeld van Abraham en van alle ware gelovigen bewijst."},{"catchword":"de beloftenissen beërven","tekst":"Dat is, de beloofde erve in den hemel nu genieten."}],"13":[{"catchword":"als God aan Abraham","tekst":"De apostel bewijst met het voorbeeld van Abraham, den vader aller gelovigen, hetgeen hij in vs.12 van al de gelovige voorvaders had betuigd."},{"catchword":"de belofte deed,","tekst":"Namelijk Gen 22:16, wanneer Abraham zijn zoon had geofferd, in welke beloften alle lichamelijke en geestelijke beloften zijn begrepen, namelijk van het beloofde zaad, en van de vermenigvuldiging van zijn zaad als van den vader van alle gelovigen, waarvan zie nadere verklaring Rom 4:16; Gal 3:14, enz."}],"14":[{"catchword":"Waarlijk,","tekst":"Dit woord staat wel in den Hebreeuwschen tekst niet, mar wordt uit de Grieksen overzetting van Paulus daarbij verhaald, daat het in den zin zelf begrepen is. Anderen houden dat het woord ki, hetwelk in den Hebreeuwsen tekst staat, somwijlen ook waarlijk betekent; Job 8:6; Pro 30:2."},{"catchword":"zegenende zal Ik u zegenen,","tekst":"Dat is, zeer overvloedig en gedurig zegenen en zeer vermenigvuldigen."}],"15":[{"catchword":"lankmoediglijk verwacht hebbende,","tekst":"Grieks lankmoedigheid geweest zijnde."},{"catchword":"de belofte verkregen","tekst":"Dat is, hetgeen God beloofd had; gelijk vs.12."}],"16":[{"catchword":"bij den meerdere","tekst":"Namelijk bij God. Want andere eden worden in Gods woord veroordeeld. Zie Deu 6:13; Jer 4:2, en Jer 5:7. De reden is, omdat God alleen de harten der mensen kent, en alle mensen, hoe groot zij zijn, kan straffen, zo zij vals zweren."},{"catchword":"eed","tekst":"Dat is, de wettelijke en behoorlijke eed van mensen, op welke niets te zeggen valt."},{"catchword":"tot bevestiging","tekst":"Namelijk van de beloften die aan iemand gedaan worden. Want alzo er tweeërlei soort van eed is, een van zaken die geschied zijn, om de waarheid daarvan te betuigen, en een van hetgeen beloofd wordt, om van de toekomende onderhouding anderen te verzekeren, spreekt Paulus hier inzonderheid van de laatste soort des eeds."}],"17":[{"catchword":"daartussen is gekomen;","tekst":"Of heeft door een eed gemiddeld; dat is, het middel van een eed gebruikt."}],"18":[{"catchword":"door twee onveranderlijke dingen,","tekst":"Dat is, zijn beloften en zijn eed, die beide onveranderlijk zijn."},{"catchword":"de voorgestelde hoop","tekst":"Dat is, de lijdzame verwachting van de vervulling der beloften door het geloof van ons aangenomen, Rom 8:24-25, zo, dat het woord hoop alhier in zijn eigen betekenis wordt genomen."}],"19":[{"catchword":"Welke wij hebben","tekst":"Namelijk hoop wij gelovigen hebben, enz."},{"catchword":"als een anker der ziel,","tekst":"Dat is, waar de ziel zich mede vasthoudt aan Gods beloften, tegen alle bewegingen en stormen der wereld; gelijk een schip met zijn anker in zee tegen alle stormen."},{"catchword":"in het binnenste van het voorhangsel;","tekst":"Dat is, den hemel, waar Christus is zittende ter rechterhand Gods en voor ons bidt; hetwelk door den ingang des hogepriesters in het heilige der heiligen beduid werd, gelijk hierna verklaard wordt, Heb 9:24."}],"20":[{"catchword":"de Voorloper voor ons is ingegaan,","tekst":"Namelijk die voor ons daarin gegaan is, om ons een plaats te bereiden, Joh 14:2-3."},{"catchword":"Melchizédek,","tekst":"Dit voegt de apostel daarbij, om alzo weder te keren tot de verklaring van het koninklijk priesterdom van Christus, hetwelk hij had afgebroken, Heb 5:11, enz.; en herneemt die weder in het Hebr. 7."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Therefore leaving the beginning of the doctrine of Christ [Gr the word of the beginning of Christ and which is as it were the catechizing of children and novices chapter 5.12] let us go forward unto perfection [that is go forward unto the perfect knowledge of the doctrine of Christ Eph 4:13 ] not lying again the foundation [or first ground whereof six articles are here rehearsed ] of repentance from dead works the end whereof is death Rom 6:23 the knowledge whereof cometh especially by the law Rom 3:20] and of faith in God [namely the father son and holy ghost sum whereof is contained in the twelve articles of the faith ]"}],"2":[{"catchword":null,"tekst":"Of doctrine of baptism and of sacraments whereby faith and repentance is strengthened in us the word baptism he put it in plural number not because there is more than one baptism Eph 4:5 but either to signify the outward and inward baptism 1Peter 3.21 or because in the primitive church those of full age who were converted to Christ and had now for a while been instructed in the Christians religion were oftentimes baptized in a considerable number together so that seemeth many baptism to be performed in one day ] and of laying on of hands [that is of the gifts of the holy ghost which in the primitive church wee wont to be imparted to believers in general by impositions of hands Act 8:16,17 and especially in the institution of ministers of the church 1Timothy 4.14] and of the resurrection of the dead [of which article they which were admitted unto the communion of the church of Christ must especially give an account not only because the gentiles scoffed at it Act 17:32 but also the seduces among the Jews Mat 22:23 and many heretic among the Christians denied the same 2Timothy 2.28] and of eternal judgment [namely of the quick and of the dead of unbelievers to eternal death and of believers of eternal life these are therefore the six chief points of the principle or foundation of the Christian religion which were propounded by questions and answers to beginners which also for the most parts are contained for the catechisms ]"}],"3":[{"catchword":null,"tekst":"And this will we also do [namely the laying of the first foundation of Christian religion which Paul now indeed passeth by because he by because he would also bring them to more perfect knowledge of other points of doctrine but nevertheless promiseth to handle the same upon other opportunities if God should permit it as he doth elsewhere also in his epistles others understand this of the declaring more perfect doctrine which he is now about to propound ]if God permit ."}],"4":[{"catchword":null,"tekst":"For it is impossible [namely in respect of Gods judgment upon such unthankful man according to the declaration which Christ himself hath made of them who sin against the holy ghost Mat 12:31,32 even as the following verse also show that here as also hereafter chapter 10 verse 26 that sin is spoken of wherefore the apostle John 1 Job 5:16 commands that one should not pay for such see the like phrase Joh 12:39,40] them which were once enlightened [namely in the understanding by the preaching of the gospel ] and have tested the heavenly gifts [that is faith which is here said that they tested not that ever they received the same it its true being but because they felt a small beginning and likeness or show thereof as the word taste is also opposed to letting down the meat Mat 27:34 which tasting Christ in the similitude of a sower Mat 13:20,21 calleth a receiving of the word with joy which not withstanding hath no root that is no true confidence in Christ neither yields any suitable fruits in perseverance seeing it fell on stony ground that is into a heart that was not duly before God nor prepared and that this also is the meaning here appears from the 7 verse following and elsewhere were these are compared to the ground that drinketh not the rain for that cause instead of good herbs bring forth thorns and thistle] and wee made partakers of the holy ghost which in the primitive church God imparted to the disciples see hereof 2Corinthians chapter 12.14]"}],"5":[{"catchword":null,"tekst":"And they have tasted the good word of God [that is the promises of the gospel whereof these had also received some taste as is said of the word of John the Baptist in some Jews Joh 5:35 that they would for short time rejoice in this light ]and the power of the age or world to come [this may fitly be understood of the power of eternal life whereof these man were also some small taste sometimes by reason that they receive this word by joy and for a while rejoice in the promise of the same as was showed before verse 4 and the word taste is agrees well herewith all]"}],"6":[{"catchword":null,"tekst":"and falling away [or falling whereby are not understood all kinds of sins whereunto true believers also sometimes fall as David ,Peter &c who afterwards come to repentance but to a total falling or apostasy from the Christian religion and done willfully as is exprest chapter 10.26 and is joined with blaspheming of the same contrary to the testimony of the holy ghost in their conscience as Christ testifieth Mat 12:31 ] them I say [this refers to the foregoing word impossible verse 4 it is impossible then to renew them again which impossibility is not only to be understood to the teachers who should labor in vain to renew them or bring them to repentance but also in respect of God truth itself who hath once passed this just judgment against them and is not mutable and will not be mocked Galatians 6.7 yea even in respect of Christ merit which these man willfully deny and reject as it followeth wherefore also chapter 10.26 it is said that there remaineth no more sacrifice for the sins of such ]to renew again to repentance [this word again hath a repentance [this word again hath a reference to the state from whence they are fallen which state was a beginning of renovation if they had continued and proceeded therein unto which very estate they can not be brought again others take these words renew again simply for the renewed as the Greek word palin that is again by an improper manner of speaking called pleonasmus is often times redundant see an example Joh 4:54 and chapter 13.12 Act 18:2 and is added only to confirm the thing the more strongly ]as who again crucify themselves the son of God and put him openly to shame [in these word is given one reason more why such apostates can be renewed unto repentance namely because they to themselves that is as much s in them lies cast new reproach on Christ whom the father hath given for a propitiation for our sins even as the Jews and Gentiles had once before outwardly done to Christ and contrary to their conscience make him a spectacle or put him to shame before all the world and their own destruction which God will not leave unrevenged as this word paradigmatizein also signifies Mat 1:19 for which word the word the word blasphemy is used Mar.3.29]"}],"7":[{"catchword":null,"tekst":"For the earth [by this similitude the apostle shows the iniquity of this heavy judgment of God upon such men seeing like used to be amongst men upon such earth ]which drinketh in the rain oftentimes coming upon it and bringeth forth fit herbs for them by whom it is also tilled that receiveth blessings from God or is partaker of the blessing from God that is by God made more and more fit to bring more fruits.]"}],"8":[{"catchword":null,"tekst":"But that which beareth thorns and thistles is to be rejected and nigh unto cursing[that is to be wholly forsaken and as a cursed thing to be given up to burning ]whose end is for burning."}],"9":[{"catchword":null,"tekst":"But beloved we assure ourselves better things of you [by this word the apostle mollifies the former threatening and declares it that which follows why he set before them the grievous punishment of the apostates namely not that he held them to be such to be such but warn them and to exhort them to hold fast to the doctrine of the gospel and Gods promises ]and joined with salvation [or cleaving to salvation ] although we thus speak [that is pronounce such heavy judgment against apostates.]"}],"10":[{"catchword":null,"tekst":"For God is not unjust [That is, unfaithful or unsteadfast in the performance of his promises: even as Gods truth and constancy in the same, is every where also called the righteousness of God. See Psal. 143. 1. 1 Joh. 1. 9.] that he should forget [that is, that he should not perfect the same in you even unto the end, according unto his promise, Phil. 1. 6. and should not graciously reward it hereafter] your work, [namely, of true faith, which he hath already wrought in you, Phil. 1. 29.] and the labour of love, which ye have showed to his name, [or in his name, i.e. not only out of any human affection towards the poor and afflicted, but because they suffered for the name of God, and for the profession of Christ, which is property of true faith and true love, which Christ leaveth not unrewarded. See Matth. 10. 41, 42. and 25. 40. Mar. 9. 41.] as who have ministered to the Saints, and (shall) do minister."}],"11":[{"catchword":null,"tekst":"But we desire that every one of you show the same diligence unto the full assurance of hope [For as hope of salvation proceeds from faith; so the same hope is also strengthened more and more by the true fruits of faith. See 2 Pet. 1. 10.] even unto the end. [namely of your life: for he that remaineth constant unto the end, he shall be saved, Mat. 10. 22.]"}],"12":[{"catchword":null,"tekst":"That ye be not slothful, but be ministers of them, who by faith and long suffering [That is, patient expectation of the fulfilling of Gods promise, as he proves afterwards by the example of Abraham and all believers] inherit the promises. [that is, now enjoy the promised inheritance in heaven // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

function kopieerVers(n) {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
