n":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Want deze Melchizedek was koning van Salem, een priester van de allerhoogste God, die Abraham tegemoet ging toen hij terugkeerde van het verslaan van de koningen, en hem zegende;","2":"aan wie Abraham ook van alles de tienden gaf; hij wordt eerst vertaald met 'koning van de gerechtigheid', en daarna was hij ook koning van Salem, dat is: koning van de vrede;","3":"zonder vader, zonder moeder, zonder geslachtsregister, zonder begin van dagen of einde van leven, maar gelijk geworden aan de Zoon van God, blijft hij een priester voor eeuwig.","4":"Merk nu op, hoe groot deze geweest is, aan wie zelfs Abraham, de patriarch, tienden gegeven heeft uit de buit.","5":"En zij die uit de kinderen van Levi het priesterschap ontvangen, hebben wel een gebod om tienden te nemen van het volk, naar de wet, dat is, van hun broeders, hoewel die uit de lenden van Abraham voortgekomen zijn.","6":"Maar hij, die zijn geslachtsregister niet uit hen heeft, heeft van Abraham tienden genomen, en hem, die de beloften had, heeft hij gezegend.","7":"Nu, zonder enige tegenspraak, wordt het mindere gezegend door het meerdere.","8":"En hier nemen wel tienden de mensen die sterven, maar daar neemt ze hij van wie getuigd wordt dat hij leeft.","9":"En, om zo te spreken, heeft ook Levi, die tienden neemt, door Abraham tienden gegeven;","10":"want hij was nog in de lenden van zijn vader, toen Melchizedek hem tegemoet ging.","11":"Als dan nu de volkomenheid door het Levitische priesterschap zou zijn (want onder dat priesterschap heeft het volk de wet ontvangen), wat nodig was het dan nog, dat een andere priester naar de ordening van Melchizedek zou opstaan, en niet naar de ordening van Aäron genoemd zou worden?","12":"Want als het priesterschap verandert, gebeurt er ook noodzakelijk verandering van de wet.","13":"Want Hij, over Wie deze dingen gezegd worden, behoort tot een andere stam, waarvan niemand zich tot het altaar begeven heeft.","14":"Want het is duidelijk, dat onze Heere uit Juda voortgekomen is; over die stam heeft Mozes niets gesproken wat het priesterschap betreft.","15":"En dit is nog veel meer duidelijk, wanneer er naar de gelijkenis van Melchizedek een andere priester opstaat:","16":"die dit niet geworden is naar de wet van het vleselijke gebod, maar naar de kracht van het onvergankelijke leven.","17":"Want Hij getuigt: U bent Priester in eeuwigheid naar de ordening van Melchizedek.","18":"Want de vernietiging van het voorgaande gebod gebeurt vanwege zijn zwakheid en nutteloosheid;","19":"want de wet heeft niets volmaakt gemaakt, maar de invoering van een betere hoop, waardoor wij tot God naderen.","20":"En voor zover het niet zonder eedzwering gebeurd is (want de anderen zijn wel zonder eedzwering priester geworden;","21":"maar Deze met eedzwering, door Hem die tot Hem gezegd heeft: De Heere heeft gezworen, en het zal Hem niet berouwen: U bent Priester in eeuwigheid naar de ordening van Melchizedek);","22":"van een zoveel beter verbond is Jezus Borg geworden.","23":"En de anderen zijn wel veel priesters geworden, omdat zij door de dood verhinderd werden altijd te blijven;","24":"maar Deze, omdat Hij in eeuwigheid blijft, heeft een onvergankelijk priesterschap.","25":"Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.","26":"Want zo'n Hogepriester paste bij ons: heilig, onschuldig, onbesmet, afgescheiden van de zondaars, en hoger geworden dan de hemelen;","27":"Hij heeft het niet elke dag nodig, zoals de hogepriesters, om eerst voor zijn eigen zonden slachtoffers te offeren, en daarna voor de zonden van het volk; want dat heeft Hij eenmaal gedaan, toen Hij Zichzelf opgeofferd heeft.","28":"Want de wet stelt tot hogepriesters mensen aan, die zwakheid hebben; maar het woord van de eedzwering, dat na de wet gekomen is, stelt de Zoon aan, Die in eeuwigheid volmaakt gemaakt is."},"SV":{"1":"Want deze Melchizedek was koning van Salem, een priester des Allerhoogsten Gods, die Abraham tegemoet ging, als hij wederkeerde van het slaan der koningen, en hem zegende;","2":"Aan welken ook Abraham van alles de tienden deelde; die vooreerst overgezet wordt, koning der gerechtigheid, en daarna ook was een koning van Salem, hetwelk is een koning des vredes;","3":"Zonder vader, zonder moeder, zonder geslachtsrekening, noch beginsel der dagen, noch einde des levens hebbende; maar den Zoon van God gelijk geworden zijnde, blijft hij een priester in eeuwigheid.","4":"Aanmerkt nu, hoe groot deze geweest zij, aan denwelken ook Abraham, de patriarch, tienden gegeven heeft uit den buit.","5":"En die uit de kinderen van Levi het priesterdom ontvangen, hebben wel bevel om tienden te nemen van het volk, naar de wet, dat is, van hun broederen, hoewel die uit de lenden van Abraham voortgekomen zijn.","6":"Maar hij, die zijn geslachtsrekening uit hen niet heeft, die heeft van Abraham tienden genomen, en hem, die de beloftenissen had, heeft hij gezegend.","7":"Nu, zonder enig tegenspreken, hetgeen minder is, wordt gezegend van hetgeen meerder is.","8":"En hier nemen wel tienden de mensen, die sterven, maar aldaar *neemt* *ze* die, van welken getuigd wordt, dat hij leeft.","9":"En, om zo te spreken, ook Levi, die tienden neemt, heeft door Abraham tienden gegeven;","10":"Want hij was nog in de lenden des vaders, als hem Melchizedek tegemoet ging.","11":"Indien dan nu de volkomenheid door het Levietische priesterschap ware ( want onder hetzelve heeft het volk de wet ontvangen), wat nood was het nog, dat een ander priester naar de ordening van Melchizedek zou opstaan, en die niet zou gezegd worden te zijn naar de ordening van Aäron?","12":"Want het priesterschap veranderd zijnde, zo geschiedt er ook noodzakelijk verandering der wet.","13":"Want Hij, op Wien deze dingen gezegd worden, behoort tot een anderen stam, van welken niemand zich tot het altaar begeven heeft.","14":"Want het is openbaar, dat onze Heere uit Juda gesproten is; op welken stam Mozes niets gesproken heeft van het priesterschap.","15":"En *dit* is nog veel meer openbaar, zo er naar de gelijkenis van Melchizedek een ander priester opstaat:","16":"Die *dit* niet naar de wet des vleselijken gebods is geworden, maar naar de kracht des onvergankelijken levens.","17":"Want Hij getuigt: Gij zijt Priester in der eeuwigheid naar de ordening van Melchizedek.","18":"Want de vernietiging van het voorgaande gebod geschiedt om deszelfs zwakheids en onprofijtelijkheids wil;","19":"Want de wet heeft geen ding volmaakt, maar de aanleiding van een betere hoop, door welke wij tot God genaken.","20":"En voor zoveel het niet zonder eedzwering *is* *geschied*, ( want genen zijn wel zonder eedzwering priesters geworden;","21":"Maar Deze met eedzwering, door Dien, Die tot Hem gezegd heeft: De Heere heeft gezworen, en het zal Hem niet berouwen: Gij zijt Priester in der eeuwigheid naar de ordening van Melchizedek).","22":"Van een zoveel beter verbond is Jezus Borg geworden.","23":"En genen zijn wel vele priesters geworden, omdat zij door den dood verhinderd werden altijd te blijven;","24":"Maar Deze, omdat Hij in der eeuwigheid blijft, heeft een onvergankelijk Priesterschap.","25":"Waarom Hij ook volkomenlijk kan zalig maken degenen, die door Hem tot God gaan, alzo Hij altijd leeft om voor hen te bidden.","26":"Want zodanig een Hogepriester betaamde ons, heilig, onnozel, onbesmet, afgescheiden van de zondaren, en hoger dan de hemelen geworden;","27":"Dien het niet allen dag nodig was, gelijk den hogepriesters, eerst voor zijn eigen zonden slachtofferen op te offeren, daarna, *voor* *de* *zonden* des volks; want dat heeft Hij eenmaal gedaan, als Hij Zichzelven opgeofferd heeft.","28":"Want de wet stelt tot hogepriesters mensen, die zwakheid hebben; maar het woord der eedzwering, die na de wet is *gevolgd*, *stelt* den Zoon, Die in der eeuwigheid geheiligd is."},"KJV":{"1":"For this Melchisedec, king of Salem, priest of the most high God, who met Abraham returning from the slaughter of the kings, and blessed him;","2":"To whom also Abraham gave a tenth part of all; first being by interpretation King of righteousness, and after that also King of Salem, which is, King of peace;","3":"Without father, without mother, without descent, having neither beginning of days, nor end of life; but made like unto the Son of God; abideth a priest continually.","4":"Now consider how great this man *was*, unto whom even the patriarch Abraham gave the tenth of the spoils.","5":"And verily they that are of the sons of Levi, who receive the office of the priesthood, have a commandment to take tithes of the people according to the law, that is, of their brethren, though they come out of the loins of Abraham:","6":"But he whose descent is not counted from them received tithes of Abraham, and blessed him that had the promises.","7":"And without all contradiction the less is blessed of the better.","8":"And here men that die receive tithes; but there he *receiveth them*, of whom it is witnessed that he liveth.","9":"And as I may so say, Levi also, who receiveth tithes, payed tithes in Abraham.","10":"For he was yet in the loins of his father, when Melchisedec met him.","11":"If therefore perfection were by the Levitical priesthood, (for under it the people received the law,) what further need *was there* that another priest should rise after the order of Melchisedec, and not be called after the order of Aaron?","12":"For the priesthood being changed, there is made of necessity a change also of the law.","13":"For he of whom these things are spoken pertaineth to another tribe, of which no man gave attendance at the altar.","14":"For *it is* evident that our Lord sprang out of Juda; of which tribe Moses spake nothing concerning priesthood.","15":"And it is yet far more evident: for that after the similitude of Melchisedec there ariseth another priest,","16":"Who is made, not after the law of a carnal commandment, but after the power of an endless life.","17":"For he testifieth, Thou *art* a priest for ever after the order of Melchisedec.","18":"For there is verily a disannulling of the commandment going before for the weakness and unprofitableness thereof.","19":"For the law made nothing perfect, but the bringing in of a better hope *did*; by the which we draw nigh unto God.","20":"And inasmuch as not without an oath","21":"(For those priests were made without an oath; but this with an oath by him that said unto him, The Lord sware and will not repent, Thou *art* a priest for ever after the order of Melchisedec:)","22":"By so much was Jesus made a surety of a better testament.","23":"And they truly were many priests, because they were not suffered to continue by reason of death:","24":"But this *man*, because he continueth ever, hath an unchangeable priesthood.","25":"Wherefore he is able also to save them to the uttermost that come unto God by him, seeing he ever liveth to make intercession for them.","26":"For such an high priest became us, *who is* holy, harmless, undefiled, separate from sinners, and made higher than the heavens;","27":"Who needeth not daily, as those high priests, to offer up sacrifice, first for his own sins, and then for the people's: for this he did once, when he offered up himself.","28":"For the law maketh men high priests which have infirmity; but the word of the oath, which was since the law, *maketh* the Son, who is consecrated for evermore."}},"tsk":{"1":[{"kopje":"deze","refs":["Hebr 6:20","Gen 14:18-20"]},{"kopje":"Salem","refs":["Ps 76:3"]},{"kopje":"de allerhoogste","refs":["Ps 57:3","Ps 78:35","Ps 78:56","Dan 4:2","Dan 5:18","Dan 5:21","Micha 6:6","Mark 5:7","Hand 16:17"]},{"kopje":"het verslaan","refs":["Gen 16:14-16","Jes 41:2","Jes 41:3"]}],"2":[{"kopje":"de tienden","refs":["Gen 28:22","Lev 27:32","Num 18:21","1 Sam 8:15","1 Sam 8:17"]},{"kopje":"koning van de gerechtigheid","refs":["2 Sam 8:15","2 Sam 23:3","1 Kon 4:24","1 Kon 4:25","1 Kron 22:9","Ps 45:5-8","Ps 72:1-3","Ps 72:7","Ps 85:11","Ps 85:12","Jes 9:5","Jes 9:6","Jes 32:1","Jes 32:2","Jes 45:22-25","Jer 23:5","Jer 23:6","Jer 33:15","Jer 33:16","Micha 5:4","Luk 2:14","Rom 3:26","Rom 5:1","Rom 5:2","Ef 2:14-18"]}],"3":[{"kopje":"geslachtsregister","refs":["Ex 6:17","Ex 6:19-26","1 Kron 6:1-3"]},{"kopje":"priester","refs":["Hebr 7:17","Hebr 7:23-28"]}],"4":[{"kopje":"de patriarch","refs":["Hand 2:29","Hand 7:8","Hand 7:9"]},{"kopje":"Abraham","refs":["Gen 12:2","Gen 17:5","Gen 17:6","Rom 4:11-13","Rom 4:17","Rom 4:18","Gal 3:28","Gal 3:29","Jak 2:23"]},{"kopje":"gegeven heeft","refs":["Gen 14:20"]}],"5":[{"kopje":"die","refs":["Hebr 5:4","Ex 28:1","Num 16:10","Num 16:11","Num 17:3-10","Num 18:7","Num 18:21-26"]},{"kopje":"te nemen","refs":["Lev 27:30-33","Num 18:26-32","2 Kron 31:4-6","Neh 13:10"]},{"kopje":"voortgekomen zijn","refs":["Hebr 7:10","Gen 35:11","Gen 46:26","Ex 1:5","1 Kon 8:19"]}],"6":[{"kopje":"geslachtsregister","refs":["Hebr 7:3"]},{"kopje":"genomen","refs":["Hebr 7:4","Gen 14:19","Gen 14:20"]},{"kopje":"had","refs":["Hebr 6:13-15","Hebr 11:13" >needeth</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">daily,</span> <span class=\"wl wl-kjv\" data-code=\"G5618\">as</span> those high <span class=\"wl wl-kjv\" data-code=\"G749\">priests,</span> to offer <span class=\"wl wl-kjv\" data-code=\"G399\">up</span> <span class=\"wl wl-kjv\" data-code=\"G2378\">sacrifice,</span> <span class=\"wl wl-kjv\" data-code=\"G4386\">first</span> <span class=\"wl wl-kjv\" data-code=\"G5228\">for</span> his <span class=\"wl wl-kjv\" data-code=\"G2398\">own</span> <span class=\"wl wl-kjv\" data-code=\"G266\">sins,</span> and <span class=\"wl wl-kjv\" data-code=\"G1899\">then</span> for the <span class=\"wl wl-kjv\" data-code=\"G2992\">people's:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> <span class=\"wl wl-kjv\" data-code=\"G5124\">this</span> he <span class=\"wl wl-kjv\" data-code=\"G4160\">did</span> <span class=\"wl wl-kjv\" data-code=\"G2178\">once,</span> when he offered <span class=\"wl wl-kjv\" data-code=\"G399\">up</span> himself.","28":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> the <span class=\"wl wl-kjv\" data-code=\"G3551\">law</span> <span class=\"wl wl-kjv\" data-code=\"G2525\">maketh</span> <span class=\"wl wl-kjv\" data-code=\"G444\">men</span> high <span class=\"wl wl-kjv\" data-code=\"G749\">priests</span> which <span class=\"wl wl-kjv\" data-code=\"G2192\">have</span> <span class=\"wl wl-kjv\" data-code=\"G769\">infirmity;</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">but</span> the <span class=\"wl wl-kjv\" data-code=\"G3056\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"G3728\">oath,</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> was <span class=\"wl wl-kjv\" data-code=\"G3326\">since</span> the <span class=\"wl wl-kjv\" data-code=\"G3551\">law,</span> maketh the <span class=\"wl wl-kjv\" data-code=\"G5207\">Son,</span> who is <span class=\"wl wl-kjv\" data-code=\"G5048\">consecrated</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">for</span> evermore."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"deze Melchizédek","tekst":"De apostel verhaalt deze geschiedenis van Melchizedek uit Gen 14:17, enz., gelijk ook hierna uit den 110n Psa- , in welke plaatsen des Ouden Testaments alleen van hem gewag gemaakt wordt. Sommigen menen, dat deze geweest is Sem, de zoon van Noach, de voorvader van Abraham, welke Sem alsdan nog heeft geleefd, gelijk uit de vergelijking van zijn ouderdom met dezen tijd, dat dit Abraham is geschied, blijkt, in wiens huisgezin zonder twijfel de rechte kennis en dienst Gods is gebleven. Doch hiertegen strijdt, dat hij hierna gezegd wordt geweest te zijn zonder vader, zonder moeder en zonder geslachtregister."},{"catchword":"van Salem,","tekst":"Meest al de oude leraars menen, dat dit Salem is geweest de stad die daarna Jeruzalem wordt genoemd; hoewel Hieronymus met enige anderen houden, dat dit Salem is geweest omtrent de Jordaan, waarvan gewag gemaakt wordt Joh 3:23, omtrent welke stad enige vlakke velden zijn geweest, waarvan gesproken wordt Gen 14:17; en Hieronymus getuigt dat in zijn tijd de overblijfselen van het paleis van Melchizedek in dit Salem aan de Jordaan nog werden getoond."},{"catchword":"des allerhoogsten Gods,","tekst":"Dat is, des waarachtigen Gods, den bezitter van hemel en aarde, gelijk Melchizedek spreekt Gen 14:19; met welken titel hij hem onderscheidt van de priesters der valse goden, waar de wereld eertijds mede vervuld was, welke ook zelfs enige voorouders van Abraham over den Eufraat gediend hebben; Jos 24:14."},{"catchword":"hem zegende;","tekst":"Namelijk als een priester des Allerhoogsten, en met priesterlijk gezag, gelijk het bewijs, dat Paulus vs.7 hieruit trekt, ook vereist."}],"2":[{"catchword":"de tienden deelde;","tekst":"Dit was ook een daad van Abraham aan Melchizedek als priester. Van andere priesterlijke handelingen spreekt Paulus hier nergens, die hier nochtans alles overweegt, waarin het priesterschap van Melchizedek het priesterschap van Levi te boven ging. Zo wordt dan kwalijk van enigen hier bijgebracht het offeren van brood en wijn, waar hier geen gewag van gemaakt wordt. Doch wordt Gen 14:18 niet van het offeren, maar van het voortbrengen van brood en wijn gesproken, als van een koninklijk geschenk, daartoe dienende, om het gezelschap van Abraham, dat uit den slag vermoeid was, met spijs en drank te verkwikken, gelijk Josefus dit ook alzo verhaalt Antiq. Judas lib.1, cap.11."},{"catchword":"die vooreerst overgezet wordt,","tekst":"Namelijk Melchizedek, als een figuur en voorbeeld van Christus, waarvan de apostel de eigenschappen, zo zijner namen als andere hoedanigheden zo aantekent, dat hij die meteen in Christus den Zoon Gods bewijst waarlijk vervuld te zijn."},{"catchword":"koning der gerechtigheid,","tekst":"Alzo wordt Christus naar het voorbeeld van Melchizedek genoemd, niet alleen omdat hij zelf rechtvaardig is, maar ook omdat hij ons de ware rechtvaardigheid voor God geworden is; 1Co 1:30; 2Co 5:21."},{"catchword":"een koning des vredes;","tekst":"Dat is, waarin hij ook was een voorbeeld van Christus, die ons den eeuwigen vrede met God heeft verworven; Rom 5:1."}],"3":[{"catchword":"Zonder vader,","tekst":"Dit volgende wordt van Melchizedek als Christus' voorbeeld gezegd, omdat in het verhaal der geschiedenis Gen 14, en Psa 110 van een van dezen gewag gemaakt wordt, maar omdat hij ingevoerd wordt als een mens [om zo te spreken] uit den hemel gevallen, en zonder begin en einde, hetwelk in Christus in der waarheid vervuld wordt. Want hij is zonder vader, ten aanzien van zijn menselijke natuur, en zonder moeder en geslachtregister, ten aanzien van zijn Goddelijke natuur; gelijk ook zonder begin en einde des levens."},{"catchword":"den Zoon van God","tekst":"Hieruit blijkt, dat Melchizedek de Zoon Gods zelf, die zich in menselijke gedaante aan Abraham zou vertoond hebben, niet is geweest, gelijk sommigen ook hebben gemeend; maar dat hij alleen een voorbeeld en gelijkenis van den Zoon Gods heeft gedragen."}],"4":[{"catchword":"Aanmerkt nu,","tekst":"Van hier af tot vs.11 verheft de apostel Melchizedek boven Abraham; en van vs.11 voorts verheft hij het priesterschap van Christus boven het priesterschap der Levieten en bewijst dat dit, als onvolmaakt, een einde moest hebben, maar Christus' Priesterschap altijd zou duren."}],"5":[{"catchword":"hebben wel bevel","tekst":"Namelijk van God. Zie de wet daarvan Num 18:24, enz."},{"catchword":"om tienden te nemen van het volk,","tekst":"Grieks om het volk te vertienen."},{"catchword":"van hun broederen,","tekst":"Dat is, de andere Israëlieten, die mede van Abraham afkomstig waren."}],"6":[{"catchword":"uit hen niet heeft,","tekst":"Namelijk uit de Levieten."},{"catchword":"van Abraham tienden genomen,","tekst":"Grieks Abraham vertiend."},{"catchword":"hem, die de beloftenissen had,","tekst":"Namelijk Abraham den voorvader, die de belofte had dat in zijn zaad alle geslachten zouden gezegend worden; Gen 12:3, en Gen 22:18."},{"catchword":"hij gezegend","tekst":"Namelijk Melchizedek, Gen 14:19."}],"7":[{"catchword":"enig tegenspreken,","tekst":"Grieks alle."},{"catchword":"van hetgeen meerder is","tekst":"Hij spreekt hier van een plechtige en priesterlijke zegening, waardoor iemand als een priester en gezant Gods een ander zegent, gelijk hier Melchizedek aan Abraham heeft gedaan. Want anders kan ook een mindere wel een meerdere zegenen, of voor hem bidden."}],"8":[{"catchword":"de mensen,","tekst":"Dat is, de priesters, die door den dood worden weggenomen en voor andere navolgers plaats maken."},{"catchword":"van welken getuigd wordt,","tekst":"Dit verstaan sommigen van Melchizedek, omdat in de geschiedenis, Gen 14, van zijn dood geen gewag wordt gemaakt, noch van iemand die in zijn priesterschap op aarde is gevolgd. Zie vs.3, 16. Doch kan dit ook uit Psa 110 genomen zijn, waar gezegd wordt: Gij zijt priester in der eeuwigheid, hetwelk van Christus verstaan wordt, die altijd leeft, en van Abraham tienden nam in den persoon van Melchizedek."}],"9":[{"catchword":"om zo te spreken,","tekst":"Of om met één woord te spreken."},{"catchword":"door Abraham tienden gegeven;","tekst":"Of in Abraham, gelijk dit Griekse woord dia soms betekent. Zie Rom 4:11, en wordt uit vs.10 deze verklaring ook versterkt."}],"10":[{"catchword":"hij was nog in de lenden des vaders,","tekst":"Namelijk Levi. Want hoewel ook Christus uit de lendenen van David, en vervolgens ook uit Abraham gesproten is, zo is dat nochtans alleen naar zijn menselijke natuur, en op een buitengewone wijze geschied, die zich daarom van deze onderwerping bevrijdde, gelijk ook van de zonde, waarmede allen in Adam gezondigd hebben; Rom 5:12."}],"11":[{"catchword":"de volkomenheid","tekst":"Of heiligmaking; namelijk niet alleen de uitwendige naar het vlees, maar ook de inwendige naar den geest, en die voor God bestaat; waaronder ook de ware verzoening met God wordt begrepen. Zie Heb 10:14."},{"catchword":"want onder hetzelve","tekst":"Of nevens; dat is, met de instelling van hetzelve priesterschap. Anderen zetten het over van over of hetzelve; namelijk Levietisch priesterschap heeft het volk Israëls de wet door Mozes ontvangen, dat is, heeft God door Mozes het volk Israëls aan de wet van het Levietisch priesterschap en zijn gehelen dienst verbonden, zo dat het volk in zijn heiligmaking den dienst en het beleid des priesterschaps alleen moest gebruiken."},{"catchword":"de wet ontvangen),","tekst":"Sommigen nemen dit alleen van de wet der priesterlijke bediening en der ceremoniën, die aan het Levietische priesterschap verbonden waren, gelijk ook hierna vs.12. Anderen nemen het breder voor de gehele wet van Mozes, zo der zeden als der ceremoniën, omdat God het priesterschap onder de Levieten heeft ingesteld, opdat zij bewaarders, uitleggers en bedienaars zouden zijn dezer wet. Zie Hag 2:12; Mal 2:6-7."},{"catchword":"een ander priester","tekst":"Namelijk gelijk God door David in den 110n Psa-met eedzwering betuigt."}],"12":[{"catchword":"verandering der wet","tekst":"Sommigen nemen dit ook alleen van de wet des priesterschaps in den stam van Levi met de ceremoniën, gelijk in vs.11 is aangetekend. Anderen nemen het voor de gehele wet, waardoor Gods ordinantie aaneen was gehecht, en de ene met de andere zo ingewikkeld, dat de ene zonder de andere niet kon veranderd worden, dewijl dit priesterschap van Levi of Aäron een groot deel van dezelfde wet omvatte, gelijk in meest al de instellingen der wet te zien is. En dezen zin schijnen vs.18,19 te bevestigen."}],"13":[{"catchword":"gezegd worden,","tekst":"Namelijk in den 110n Psa- ."},{"catchword":"behoort tot een anderen stam,","tekst":"Grieks is deelachtig geworden enen anderen stam; namelijk den stam van Juda, gelijk Jakob Gen 49:10 voorzegd had, dat de Silo, of Messias, uit den stam van Juda moest voortkomen, hetwelk in den persoon van Jezus Christus vervuld te zijn aan alle Christenen aan wie Paulus hier schrijft, bekend was, gelijk in de volgende verzen wordt verklaard."},{"catchword":"niemand zich tot het altaar begeven heeft","tekst":"Namelijk wettelijk. Want als de koning Uzzia uit den stam van Juda zulks wil bestaan, is hij daarvoor door God met melaatsheid gestraft; 2Ch 26:19."}],"14":[{"catchword":"van het priesterschap","tekst":"Dat is, van de bediening des priesterschaps. Want anderszins moesten ook de koningen zorg dragen dat de priesters hun ambt recht bedienden, gelijk in David, Salomo, Hizkia, Josia en anderen te zien is."}],"15":[{"catchword":"naar de gelijkenis van Melchizédek","tekst":"Daarmede verklaart de apostel hetgeen hij hier tevoren genoemd heeft de ordeningen van Melchizedek."}],"16":[{"catchword":"naar de wet des vleselijken gebods","tekst":"Dat is, door de wet der ceremoniëele geboden, die in uitwendige en vleselijke, of vergankelijke reinigmakingen en heiligmakingen bestonden, als daar waren van de kleding der priesters, zalving, wassing, offerande, enz., waardoor zij in hunnen dienst ingewijd werden, en die het lichaam en den uitwendigen stand des mensen alleen raakten. Doch hier valt op te merken, dat de apostel van deze ceremoniën spreekt naar het algemeen gevoelen der Joden, die in deze uitwendige dingen de heiligmaking zochten, daar zij die alleen hadden moeten aanzien als voorbeelden en schaduwen van Christus, gelijk in de volgende hoofdstukken wordt geleerd."},{"catchword":"naar de kracht","tekst":"Dat is, door de kracht Gods en zalving des Heiligen Geestes, die onvergankelijk op hem zou blijven, en hem tot een eeuwig priester stellen, die altijd zou leven om voor ons te bidden, en de kracht zijner offerande ons ook tot een onvergankelijk leven toe te eigenen. Zie hierna vs.25; Rom 6:9-10; Rev 1:18."},{"catchword":"onvergankelijken levens","tekst":"Grieks onlosmakelijken."}],"17":[{"catchword":"in der eeuwigheid","tekst":"Dat is, zonder dat het priesterdom van Christus aan enige veranderingen zou onderworpen zijn. Want hoewel ook sommige ceremoniën des Ouden Testaments worden gezegd in der eeuwigheid ingesteld te zijn, gelijk van de besnijdenis gezegd wordt, Gen 17:13; van het Pascha, Exo 12:14; van den Sabbat, Exo 31:16; van de offeranden, Num 18:19; nochtans kan dat van de ceremoniën, in zichzelf aangezien, niet verstaan worden, maar alleen te aanzien van hare betekenende zaak in Christus en tot een tijd van de komst van Christus, door wien de ceremoniën moesten teniet gedaan worden, gelijk de apostel hier en de Schrift elders alom getuigt."}],"18":[{"catchword":"de vernietiging","tekst":"Of afschaffing."},{"catchword":"onprofijtelijkheids wil;","tekst":"Namelijk om daardoor naar den geest gereinigd te worden, gelijk de Joden in het gebruik daarvan hunne heiligheid en volmaaktheid zochten; hoewel deze ceremoniën de oprechte Israëlieten dienden, om daardoor tot Christus en zijn heiligmaking gebracht te worden, hetwelk een grote nuttigheid was, maar met de komst van Christus eindigde."}],"19":[{"catchword":"de wet heeft geen ding volmaakt,","tekst":"Namelijk de ceremoniën, waarvan hij hier eigenlijk spreekt, noch ook zelfs de wet der zeden, omdat zij door het vlees daartoe onmachtig was, gelijk Paulus betuigt Rom 8:3."},{"catchword":"de aanleiding van een betere hoop,","tekst":"Of, invoering van een betere hoop; namelijk volmaakt alle dingen, waardoor de kracht van het Nieuwe Verbond en van het priesterschap van Christus wordt verstaan, welke een betere hoop genaamd wordt, omdat het de ware heiligmaking in ons krachtig teweeg brengt. Anderen zetten het over: maar was een aanleiding tot ene betere hoop; namelijk de wet zelf, die daarom ook een leidsman tot Christus genaamd wordt, Gal 3:24. Doch de eigen betekenis van het Griekse woord epelsàgoge vereist meer den eersten zin, daar het medebrengt een invoering of aanleiding van een zaak boven iets dat tevoren was."},{"catchword":"wij tot God genaken","tekst":"Want door Christus en zijn priesterschap hebben wij een open toegang tot God zelf; Rom 5:2."}],"20":[{"catchword":"[is geschied","tekst":"] Namelijk dat Christus een eeuwig Priester is geworden."},{"catchword":"genen zijn wel zonder eedzwering","tekst":"Namelijk de Levietische priesters."}],"21":[{"catchword":"Deze met eedzwering,","tekst":"Namelijk Christus."}],"22":[{"catchword":"Van een zoveel beter verbond","tekst":"Of voor zo veel is Jezus borg van een beter verbond geworden; namelijk dewijl het door een onveranderlijken eed Gods is bevestigd, en derhalve ook onveranderlijk is en krachtig om ons zalig te maken, gelijk in het volgende verklaard wordt."},{"catchword":"borg geworden","tekst":"Dat is, Middelaar, gelijk hij ook genaamd wordt, Heb 8:6, en Heb 9:15, en Heb 12:24."}],"24":[{"catchword":"onvergankelijk Priesterschap","tekst":"Het Griekse woord aparabaton betekent eigenlijk, wat tot niemand anders over gaat, gelijk het Levietisch priesterschap tot den eeuwigen priester naar de ordening van Melchizedek moest overgaan, en derhalve het eerste vergaan en dit eeuwig blijven. Of wat niet van hem overgaat tot een anderen opvolger, gelijk het Levietisch priesterschap deed."}],"25":[{"catchword":"volkomenlijk kan zalig maken","tekst":"Of ten volle, tot het volle einde toe; zo dat er niets aan ontbreekt, hetwelk het Griekse woord medebrengt. Zodat buiten hem geen deel der zaligheid òf in ons zelf, òf in iemand anders te zoeken of te vinden is."},{"catchword":"tot God gaan,","tekst":"Namelijk door een waarachtig en levend geloof. Zie Heb 10:19, enz."},{"catchword":"altijd leeft","tekst":"Namelijk in den hemel, in zijn heerlijkheid, ter rechterhand zijns Vaders, daar altijd vervullende het andere deel van zijn hogepriestersambt, de voorbidding."},{"catchword":"voor hen te bidden","tekst":"Zie de verklaring hiervan Rom 8:34, en hierna Heb 9:24."}],"26":[{"catchword":"hoger dan de hemelen geworden;","tekst":"Dat is, boven alle zichtbare hemelen, in den troon zijns Vaders, tot de hoogste heerlijkheid verheven; Eph 4:10; Rev 3:21."}],"27":[{"catchword":"allen dag nodig was,","tekst":"Dat is, dikwijls, of op alle bestemde dagen. Zie Heb 9:7."},{"catchword":"dat heeft Hij eenmaal gedaan,","tekst":"Namelijk voor de zonden des volks geofferd, want hij zelf had geen zonde om voor zichzelf te offeren, gelijk in vs.26 is betuigd."}],"28":[{"catchword":"de wet stelt","tekst":"Namelijk door Mozes gegeven."},{"catchword":"het woord der eedzwering,","tekst":"Namelijk door David, Psa 110 verklaard, nadat de wet enige honderden jaren tevoren was gegeven, hetwelk de apostel er bijvoegt, om te bewijzen dat de laatste instelling de vorige teniet doet."},{"catchword":"geheiligd is","tekst":"Of volmaakt, ingewijd; gelijk meermalen tevoren. Zie Heb 2:10."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"For this Melchizedek [The Apostle relates this history of Melchizedek out of Gen. 14. 18. & c. as afterward also out of Psal. 110. in which places only of the old Testament mention is made of him. Some think that this was Sem the son of Noah, the forefather of Abraham, which Sem then lived still, as appears by comparing his age with this time when this happened to Abraham, in whose family without doubt the true knowledge and worship of God remained. But to this is repugnant that he is afterward said to have been without Father, without Mother, and without Genealogy, ver. 3.] was King of Salem [Almost all ancient Teachers think, that this Salem was the City, which afterward was called Jerusalem : although Jerome with some others hold, that this was Salem about Jordan whereof mention is made, Joh. 3. 23. about which City there were certain plain fields, whereof is spoken Gen. 14. 17. and Hierome testifies that in his time the remainders of Melchizedeks palace were still showed in this Salem by Jordan] a Priest of the most high God, [that is, of the true God possessor of heaven and earth, as Melchizedek speaketh, Gen. 14. 19. by which title he distinguisheth him from the Priests of the false gods, wherewith the world was already filled; which even some of Abrahams Ancestors themselves served beyond Euphrates, Josh. 24. 14.] who went to meet Abraham as he returned from smiling of the Kings, and blessed him: [namely, as a Priest of the most High, and with Priestly authority, as the argument which Paul draws from hence verse. 7. also importeth.]"}],"2":[{"catchword":null,"tekst":"To whom also Abraham imparted the tithe of all: [This was also an act of Abraham to Melchizedek as a Priest. Of other Priestly actings Paul speaks not any where here, who notwithstanding here considers all things, wherein in the Priesthood of Melchizedek excelled the Priesthood of Levi. Therefore the offering of bread and wine is ill added hereunto by some, whereof here is no mention made. But Gen. 14. 18. is spoken not of offering, but of bringing forth bread and wine as of a kingly present, serving for this purpose, to refresh with meat and drink Abrahams company, who were wearied with the bat tell; as Josephus also thus relates this Antiq. Lib. 1. cap. 11.] who [namely Melchizedek as a figure and type of a Christ, of whom the Apostle so notes the properties, as well of his names, as of other qualities, that withal he shows them to be truly fulfilled in Christ the Son of God] is first interpreted King of righteousness [so Christ is called according to the type of Melchizedek, not only because he himself is righteous; but also because he is become the true righteousness before God for us, 1 Cor. 1. 30. 2 Cor. 5. 21.] and afterward also was King of Salem, which is a King of peace: [wherein he was also a type of Christ, who hath procured eternal peace with God for us, Rom. 5. 1.]"}],"3":[{"catchword":null,"tekst":"Without Father, without Mother, without genealogy, having neither beginning of days, nor end of life: [This that follow is spoken of Melchizedek as a type of Christ, because in the relation of the history, Gen. 14. and Psal. 110. no mention is made of any of these, but because he is brought in as a man (as we may say) fallen out of heaven, and without beginning and end; which is in truth fulfilled in Christ. For he is without Father in respect of his human nature, and without Mother and genealogy in respect of his divine nature: as also without beginning and end of life] but being become like unto the Son of God [from hence it appears that Melchizedek was not the Son of God himself, who showed himself to Abraham in human shape, as some have also thought; but that he only bare a type and similitude of the Son of God] abideth a Priest for ever."}],"4":[{"catchword":null,"tekst":"Consider now [From henceforth unto the 11 ver. The Apostle extols Melchixedek above Abraham, and from the 11. ver. Forwards he exalts the Priesthood of Christ above the Priesthood of the Levites, and proves that this as being imperfect must have an end, but Christ&acirc;&euro;&trade;s Priesthood should endure always] how great this (man) was to whom even Abraham the Patriarch gave tithe of the spoil."}],"5":[{"catchword":null,"tekst":"And they of the children of Levi that receive the Priesthood, have indeed command [Namely, from God. See the Law thereof Num. 18. 24. etc.] to take tithe of the people [Gr. To tithe the people] according to the Law, that is, of their brethren, [that is, the other Israelites, who were also descended from Abraham] although they come forth of the loins of Abraham."}],"6":[{"catchword":null,"tekst":"But he who hath not (his) genealogy from them, [Namely, from the Levites] he took tithe of Abraham, [Gr. Tithed Abraham] and him that had the promise, [namely, Abraham the Patriarch, who had the promise that in his seed all generations should be blessed, Gen. 12. 3. and 22. 18.] he [namely, Melchizedek, Gen. 14. 19.] blessed."}],"7":[{"catchword":null,"tekst":"Now without any [Gr. All] contradiction, the less is blessed of the greater [He speaketh here of a solemn and Priestly blessing, whereby anyone blesseth another as a Priest and Ambassador of God, as here Melchizedek did Abraham. For otherwise also one that is less, may indeed bless one that is greater, or pray for him.]"}],"8":[{"catchword":null,"tekst":"And here indeed the men who dye take tithes, [That is, the Priests who are taken away by death, and make room for other successors] but there he (taketh them) of whom it is witnessed that he liveth. [this some understand of Melchizedek, because in the history, Gen. 14. no mention is made of his death, nor of any one that followed him in his Priesthood upon earth. See ver. 3. & 16. but this may also be taken out of Psal. 110. where it is said, Thou art a Priest for ever, which is understood of Christ, who liveth always, and took tithe of Abraham in the person of Melchizedek. See ver. 16.]"}],"9":[{"catchword":null,"tekst":"And, so to speak [Or, to speak in one word] even Levi, who taketh tithes, gave tithes by Abraham: [or in Abraham, as this Greek word dia sometimes signifies. See Rom. 4. 11. and this exposition is confirmed also by the following verse.]"}],"10":[{"catchword":null,"tekst":"For he was yet in the loins of his Father [Namely, Levi. For although Christ also sprung from the loins of David, and consequently of Abraham also, notwithstanding that was only according to his human nature, and done in an extraordinary manner, which therefore freed him from this subjection, as also from sin, whereby all sinned in Adam, Rom. 5. 12.] when Melchizedek went to meet him."}],"11":[{"catchword":null,"tekst":"Now then if perfection [Or sanctification: namely, not only the outward according to the flesh, but also the inward according to the spirit, and which stands before God: under which is contained also the true reconciliation with God. See chap. 10. ver. 14.] were by the Levitical Priesthood: (for under the same [or together with, i.e. with the institution of that Priesthood. Others translate it of or concerning the same; namely Levitical Priesthood, the people of Israel received the Law by Moses, i.e. God by Moses obliged the people of Israel to the Law of the Levitical Priesthood, & its whole Ministry, so that the people in their sanctification, were to use only the Ministry and conduct of this Priesthood] the people received the Law) [some understand this only of the Law of the Priestly administration, and of the Ceremonies, which were bound to the Levitical Priesthood, as also afterward, ver. 12. Others take it more largely for whole Law of Moses, as well Moral as Ceremonial, because God instituted the Priesthood among the Levites, that they might be keepers, interpreters and Ministers of this Law. See Hagg. 2. 12. Mal. 2. 6, 7.] what need was there yet that another Priest after the order of Melchizedek should arise [as God by David in the 110. Psalm testifies with an oath] and should not be said to be after the order of Aaron?"}],"12":[{"catchword":null,"tekst":"For the Priesthood being changed, there is also of necessity a change made of the Law. [Some take this also only of the Law of the Priesthood in the tribe of Levi with the Ceremonies, as was noted in the former verse. Others take it for the whole Law of Moses, because the Levitical Priesthood and its Ministry with the whole Law, were by Gods Ordinance so joined one to another, and so involved one with the other, that the one could not be changed without the other, seeing this Priesthood of Levi, or Aaron, contained a great part of that Law, as in almost all the institutions of the Law may be seen. And this sense the 18. and 19. verses seem to confirm.]"}],"13":[{"catchword":null,"tekst":"For he of whom these things are spoken [Namely, in the 110. Psalm] belongeth to another tribe [Gr. Was partaker of another tribe. Namely, of the tribe of Judah, as Jacob had foretold, Gen. 49. 10. that the Silo or Messias must come forth out of the tribe of Judah : which that it was fulfilled in the person of Jesus Christ, was known unto all Christians, unto whom Paul here writeth, as is declared in the following verses] of which no man gave himself to the altar. [namely, lawfully. For when King Osias of the tribe of Judah would attempt this, he was by God punished with leprosy for it, 2 Chro. 26. 18.]"}],"14":[{"catchword":null,"tekst":"For it is manifest that our Lord sprung out Judah: of which tribe Moses spoke nothing concerning the Priesthood. [That is, concerning the administration of the Priesthood. For otherwise the Kings were also to take care that the Priests rightly administered their office, as may be seen in David, Solomon, Hezekiah, Josias and others.]"}],"15":[{"catchword":null,"tekst":"And (this) is yet much more manifest, if there arise another Priest after the likeness of Melchizedek, [hereby the Apostle expounds that which heretofore he called the order of Melchizedek.]"}],"16":[{"catchword":null,"tekst":"Who became not (this) after the Law of the carnal command, [That is, by the Law of the ceremonial commandments, which consisted in outward and carnal or transitory purifications, and sanctifications // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

  for (const n of nummers) {

    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];

    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {

        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
