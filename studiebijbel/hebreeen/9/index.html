":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Zo had dan het eerste verbond wel *regels* van de eredienst, en het aardse heiligdom.","2":"Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;","3":"maar achter het tweede voorhangsel was de tabernakel, genoemd het heilige der heiligen;","4":"met een gouden wierookvat, en de ark van het verbond, rondom met goud overdekt, waarin de gouden kruik was met het manna erin, en de staf van Aäron die gebloeid had, en de tafelen van het verbond.","5":"En boven over de ark waren de cherubs der heerlijkheid, die het verzoendeksel beschaduwden; van welke dingen wij nu niet stuk voor stuk zullen spreken.","6":"Deze dingen nu, zo ingericht zijnde, gingen de priesters wel voortdurend de eerste tabernakel binnen, om de erediensten te volbrengen;","7":"maar in de tweede *tabernakel* ging alleen de hogepriester, eenmaal per jaar, niet zonder bloed, dat hij offerde voor zichzelf en voor de overtredingen van het volk.","8":"Waarmee de Heilige Geest dit aanduidde, dat de weg naar het heiligdom nog niet openbaar gemaakt was, zolang de eerste tabernakel nog stand hield;","9":"dat was een afbeelding voor de toenmalige tijd, waarin gaven en offers gebracht werden die degene die de dienst uitoefende niet konden volmaken naar het geweten;","10":"het *bestond* alleen in spijzen, en dranken, en verscheidene wassingen en instellingen voor het vlees, opgelegd tot de tijd van verbetering.","11":"Maar Christus, de Hogepriester van de toekomstige goederen, gekomen zijnde, is door de grotere en volmaaktere tabernakel, niet met handen gemaakt, dat is, niet van deze schepping,","12":"ook niet door het bloed van bokken en kalveren, maar door Zijn eigen bloed, eenmaal ingegaan in het heiligdom, en heeft een eeuwige verlossing verworven.","13":"Want als het bloed van stieren en bokken, en de as van de jonge koe, besprenkeld over de onreinen, hen heiligt tot de reinheid van het vlees,","14":"hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?","15":"En daarom is Hij de Middelaar van het nieuwe testament, opdat, nu de dood *daartussen* gekomen is, tot verzoening van de overtredingen die er waren onder het eerste testament, degenen die geroepen zijn de belofte van de eeuwige erfenis zouden ontvangen.","16":"Want waar een testament is, daar is het nodig dat de dood van hem die het testament maakte, *tussenbeide* komt;","17":"want een testament is van kracht bij de doden, omdat het geen kracht heeft zolang hij die het testament maakte leeft.","18":"Daarom is ook het eerste niet zonder bloed ingewijd.","19":"Want toen alle geboden, naar de wet van Mozes, aan heel het volk uitgesproken waren, nam hij het bloed van kalveren en bokken, met water, en purperen wol, en hysop, en besprenkelde zowel het boek zelf, als heel het volk,","20":"en zei: Dit is het bloed van het testament, dat God u geboden heeft.","21":"En hij besprenkelde eveneens ook de tabernakel, en alle voorwerpen van de dienst met het bloed.","22":"En bijna alle dingen worden door bloed gereinigd naar de wet, en zonder bloedstorting gebeurt er geen vergeving.","23":"Zo was het dan nodig dat wel de afbeeldingen van de dingen die in de hemelen zijn, door deze dingen gereinigd werden, maar de hemelse dingen zelf door betere offers dan deze.","24":"Want Christus is niet ingegaan in het heiligdom dat met handen gemaakt is, dat een tegenbeeld is van het ware, maar in de hemel zelf, om nu te verschijnen voor het aangezicht van God voor ons;","25":"ook niet opdat Hij Zichzelf dikwijls zou opofferen, zoals de hogepriester elk jaar het heiligdom binnengaat met vreemd bloed;","26":"(anders had Hij dikwijls moeten lijden, vanaf de grondlegging van de wereld) maar nu is Hij eenmaal, bij de voleinding van de eeuwen, geopenbaard, om de zonde teniet te doen, door Zijn eigen offer.","27":"En zoals het de mensen beschikt is eenmaal te sterven, en daarna het oordeel;","28":"zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid."},"SV":{"1":"Zo had dan wel ook het eerste *verbond* rechten van de *gods* dienst, en het wereldlijk heiligdom.","2":"Want de tabernakel was toebereid, *namelijk* de eerste, in welken was de kandelaar, en de tafel, en de toonbroden, welke genaamd wordt het heilige;","3":"Maar achter het tweede voorhangsel was de tabernakel, genaamd het heilige der heiligen;","4":"Hebbende een gouden wierookvat, en de ark des verbonds, alom met goud overdekt, in welke was de gouden kruik, daar het Manna in was, en de staf van Aäron, die gebloeid had, en de tafelen des verbonds.","5":"En boven over deze *ark* waren de cherubijnen der heerlijkheid, die het verzoendeksel beschaduwden; van welke dingen wij nu van stuk tot stuk niet zullen zeggen.","6":"Deze dingen nu, aldus toebereid zijnde, zo gingen wel de priesters in den eersten tabernakel, te allen tijde, om de *gods* diensten te volbrengen;","7":"Maar in den tweeden *tabernakel* *ging* alleen de hogepriester, eenmaal des jaars, niet zonder bloed, hetwelk hij offerde voor zichzelven en *voor* des volks misdaden.","8":"*Waarmede* de Heilige Geest dit beduidde, dat de weg des heiligdoms nog niet openbaar gemaakt was, zolang de eerste tabernakel nog stand had;","9":"Welke was een afbeelding voor dien tegenwoordigen tijd, in welken gaven en slachtofferen geofferd werden, die dengene, die den dienst pleegde, niet konden heiligen naar het geweten;","10":"*Bestaande* alleen in spijzen, en dranken, en verscheidene wassingen en rechtvaardigmakingen des vleses, tot op den tijd der verbetering opgelegd.","11":"Maar Christus, de Hogepriester der toekomende goederen, gekomen zijnde, is door den meerderen en volmaakten tabernakel, niet met handen gemaakt, dat is, niet van dit maaksel,","12":"Noch door het bloed der bokken en kalveren, maar door Zijn eigen bloed, eenmaal ingegaan in het heiligdom, een eeuwige verlossing teweeggebracht hebbende.","13":"Want indien het bloed der stieren en bokken, en de as der jonge koe, besprengende de onreinen, *hen* heiligt tot de reinigheid des vleses;","14":"Hoeveel te meer zal het bloed van Christus, Die door den eeuwigen Geest Zichzelven Gode onstraffelijk opgeofferd heeft, uw geweten reinigen van dode werken, om den levenden God te dienen?","15":"En daarom is Hij de Middelaar des nieuwen testaments, opdat, de dood *daartussen* gekomen zijnde, tot verzoening der overtredingen, die onder het eerste testament waren, degenen, die geroepen zijn, de beloftenis der eeuwige erve ontvangen zouden.","16":"Want waar een testament is, daar is het noodzaak, dat de dood des testamentmakers *tussen* kome;","17":"Want een testament is vast in de doden, dewijl het nog geen kracht heeft, wanneer de testamentmaker leeft.","18":"Waarom ook het eerste niet zonder bloed is ingewijd.","19":"Want als al de geboden, naar de wet van Mozes, tot al het volk uitgesproken waren, nam hij het bloed der kalveren en bokken, met water, en purperen wol, en hysop, besprengde beide het boek zelf, en al het volk,","20":"Zeggende: Dit is het bloed des testaments, hetwelk God aan ulieden heeft geboden.","21":"En hij besprengde desgelijks ook den tabernakel, en al de vaten van den dienst met het bloed.","22":"En alle dingen worden bijna door bloed gereinigd naar de wet, en zonder bloedstorting geschiedt geen vergeving.","23":"Zo was het dan noodzaak, dat wel de voorbeeldingen der dingen, die in de hemelen zijn, door deze dingen gereinigd werden, maar de hemelse dingen zelve door betere offeranden dan deze.","24":"Want Christus is niet ingegaan in het heiligdom, dat met handen gemaakt is, hetwelk is een tegenbeeld van het ware, maar in den hemel zelven, om nu te verschijnen voor het aangezicht van God voor ons;","25":"Noch ook, opdat Hij Zichzelven dikwijls zou opofferen, gelijk de hogepriester alle jaar in het heiligdom ingaat met vreemd bloed;","26":"( Anders had Hij dikwijls moeten lijden van de grondlegging der wereld af) maar nu is Hij eenmaal in de voleinding der eeuwen geopenbaard, om de zonde te niet te doen, door Zijnszelfs offerande.","27":"En gelijk het den mensen gezet is, eenmaal te sterven, en daarna het oordeel;","28":"Alzo ook Christus, eenmaal geofferd zijnde, om veler zonden weg te nemen, zal ten anderen male zonder zonde gezien worden van degenen, die Hem verwachten tot zaligheid."},"KJV":{"1":"Then verily the first *covenant* had also ordinances of divine service, and a worldly sanctuary.","2":"For there was a tabernacle made; the first, wherein *was* the candlestick, and the table, and the shewbread; which is called the sanctuary.","3":"And after the second veil, the tabernacle which is called the Holiest of all;","4":"Which had the golden censer, and the ark of the covenant overlaid round about with gold, wherein *was* the golden pot that had manna, and Aaron's rod that budded, and the tables of the covenant;","5":"And over it the cherubims of glory shadowing the mercyseat; of which we cannot now speak particularly.","6":"Now when these things were thus ordained, the priests went always into the first tabernacle, accomplishing the service","7":"But into the second *went* the high priest alone once every year, not without blood, which he offered for himself, and *for* the errors of the people:","8":"The Holy Ghost this signifying, that the way into the holiest of all was not yet made manifest, while as the first tabernacle was yet standing:","9":"Which *was* a figure for the time then present, in which were offered both gifts and sacrifices, that could not make him that did the service perfect, as pertaining to the conscience;","10":"*Which stood* only in meats and drinks, and divers washings, and carnal ordinances, imposed *on them* until the time of reformation.","11":"But Christ being come an high priest of good things to come, by a greater and more perfect tabernacle, not made with hands, that is to say, not of this building;","12":"Neither by the blood of goats and calves, but by his own blood he entered in once into the holy place, having obtained eternal redemption","13":"For if the blood of bulls and of goats, and the ashes of an heifer sprinkling the unclean, sanctifieth to the purifying of the flesh:","14":"How much more shall the blood of Christ, who through the eternal Spirit offered himself without spot to God, purge your conscience from dead works to serve the living God?","15":"And for this cause he is the mediator of the new testament, that by means of death, for the redemption of the transgressions *that were* under the first testament, they which are called might receive the promise of eternal inheritance.","16":"For where a testament *is*, there must also of necessity be the death of the testator.","17":"For a testament *is* of force after men are dead: otherwise it is of no strength at all while the testator liveth.","18":"Whereupon neither the first *testament* was dedicated without blood.","19":"For when Moses had spoken every precept to all the people according to the law, he took the blood of calves and of goats, with water, and scarlet wool, and hyssop, and sprinkled both the book, and all the people,","20":"Saying, This *is* the blood of the testament which God hath enjoined unto you.","21":"Moreover he sprinkled with blood both the tabernacle, and all the vessels of the ministry.","22":"And almost all things are by the law purged with blood; and without shedding of blood is no remission.","23":"*It was* therefore necessary that the patterns of things in the heavens should be purified with these; but the heavenly things themselves with better sacrifices than these.","24":"For Christ is not entered into the holy places made with hands, *which are* the figures of the true; but into heaven itself, now to appear in the presence of God for us:","25":"Nor yet that he should offer himself often, as the high priest entereth into the holy place every year with blood of others;","26":"For then must he often have suffered since the foundation of the world: but now once in the end of the world hath he appeared to put away sin by the sacrifice of himself.","27":"And as it is appointed unto men once to die, but after this the judgment:","28":"So Christ was once offered to bear the sins of many; and unto them that look for him shall he appear the second time without sin unto salvation."}},"tsk":{"1":[{"kopje":"het eerste","refs":["Hebr 8:7","Hebr 8:13"]},{"kopje":"had","refs":["Hebr 9:10","Lev 18:3","Lev 18:4","Lev 18:30","Lev 22:9","Num 9:12","Ezech 43:11","Luk 1:6"]},{"kopje":"en","refs":["Hebr 9:10","Hebr 9:11","Hebr 8:2","Ex 25:8","Kol 2:8"]}],"2":[{"kopje":"een tabernakel","refs":["Ex 26:1-30","Ex 29:1","Ex 29:35","Ex 36:8-38","Ex 39:32-34","Ex 40:2","Ex 40:18-20"]},{"kopje":"de eerste","refs":["Ex 25:23-40","Ex 26:35","Ex 37:10-24","Ex 39:36-38","Ex 40:4","Ex 40:22-24"]}, v\" data-code=\"G266\">sins</span> of <span class=\"wl wl-kjv\" data-code=\"G4183\">many;</span> and unto them that <span class=\"wl wl-kjv\" data-code=\"G553\">look</span> for <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> shall he <span class=\"wl wl-kjv\" data-code=\"G3700\">appear</span> the second <span class=\"wl wl-kjv\" data-code=\"G1208\">time</span> <span class=\"wl wl-kjv\" data-code=\"G5565\">without</span> <span class=\"wl wl-kjv\" data-code=\"G266\">sin</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">unto</span> salvation."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het eerste [verbond","tekst":"] Vele Griekse boeken hebben den eerste tabernakel; maar uit Heb 8:13, alsook uit vs.2 blijkt, dat hier beter gelezen wordt: het eerste verbond."},{"catchword":"rechten van de [gods","tekst":"dienst,] Of rechtvaardigmakingen, of instellingen; dat is, wijzen van doen, waarnaar de godsdienst moest gericht zijn, waarin de ceremoniëele rechtvaardigmaking bestond."},{"catchword":"het wereldlijk","tekst":"Of, dat wereldlijk heiligdom; dat is, dat aards is en van vergankelijke stof gemaakt, gelijk alle dingen in de wereld zijn: waarvan zie Exo 25, Exo 26, Exo 36, Exo 37. En wordt hier gesteld tegenover de hemelse en onvergankelijke, dat hierdoor betekend wordt: gelijk de apostel hierna zal verklaren."},{"catchword":"heiligdom","tekst":"Zo wordt genoemd het gebouw, dat in het Oude Testament door Gods ordinantie tot den godsdienst was geheiligd, in welks plaats daarna de tempel Salomo's is gekomen. Doch Paulus beschrijft hier niet den tempel, maar den tabernakel, omdat die eerst door Mozes, naar het voorbeeld hem van God op den berg getoond, was gebouwd, en dat Salomo daarna den tempel naar dezen tabernakel heeft gemaakt, zo nochtans dat hij enige andere dingen daarbij heeft gevoegd."}],"2":[{"catchword":"de eerste,","tekst":"Dat is, het eerste deel des tabernakels. Want den voorhof des volks en der priesters, waarin de vergaderingen en slachtoffers geschiedden, gaat de apostel hier voorbij, en verklaart alleen de zaken, die in den gedekten tabernakel of hut waren, en de handelingen die daarin gepleegd werden; waarvan het eerste deel het heilige, het andere deel het heilige der heilige genoemd werd."},{"catchword":"de kandelaar,","tekst":"Deze kandelaar, tafel en toonbroden waren in het eerste deel van den tabernakel; Exo 25:23, enz."},{"catchword":"de toonbroden,","tekst":"Grieks de voorzetting der broden."}],"3":[{"catchword":"achter het tweede voorhangsel","tekst":"Dat was het voorhangsel, dat het heilige van het heilige der heiligen scheidde, en wordt het tweede genoemd, ten opzichte van het eerste voorhangsel, dat den ingang van het heilige in den tabernakel bedekte. Zie Exo 26:36; want in den tempel was dit met muren van de voorhoven gescheiden, waarin daarom maar één voorhangsel was, hetwelk scheurde toen Christus aan het kruis is gestorven; Luk 23:45."},{"catchword":"de tabernakel,","tekst":"Dat is, het deel van den tabernakel; want beide deze delen waren onder één dak."}],"4":[{"catchword":"wierookvat,","tekst":"Grieks thymiaterion; waardoor sommigen verstaan het reuk-altaar zelf, dat in het heilige stond, waar de priesters alle dagen ingingen om daarop te roken, gelijk vs.6 ook wordt aangewezen, en Exo 30:6 te zien is. Welk, gelijk het dicht aan het heilige der heiligen stond, zo menen zij dat hier gezegd wordt, dat het heilige der heiligen hem had. Doch deze manier van spreken zou zeer ongewoon zijn, dewijl hier uitdrukkelijk staat, dat het heilige der heiligen, hetwelk achter het tweede voorhangsel was, dit thymiaterion had, gelijk ook de ark des verbonds. Daarom wordt het bekwamer genomen voor het wierookvat, waarmede de hogepriester eenmaal des jaars in het heilige der heiligen ging, om te roken; hetwelk daarom ook in het heilige der heiligen bewaard werd, gelijk Josefus getuigt, lib.2, tegen Appion. En hoewel Mozes daarvan geen uitdrukkelijk gewag maakt, zo kan nochtans hetzelve uit Lev 16:12 ook genomen worden."},{"catchword":"in welke was","tekst":"Sommigen menen, dat deze woorden in welke, zien op het woord tabernakel, waarvan in vs.3 gesproken is, omdat 1Ki 8:9 en 2Ch 5:10, uitdrukkelijk gezegd wordt, dat in de ark des verbonds niet was besloten dan de twee tafelen der wet. Doch anderen verstaan het van de ark zelf, in of omtrent welke de gouden kruik met manna en de staf Aärons ten tijde van den tabernakel geweest zijn, gelijk te zien is Exo 16:33-34, en Num 17:10, hoewel die ten tijde toen de tempel van Salomo was gebouwd daar niet meer in of omtrent geweest zijn, of omdat zij vergaan waren, of omdat zij ergens in een ander deel des tempels zijn gebracht, gelijk ook het echte boek der wet, waarvan gewag wordt gemaakt Deu 31:26; 2Ch 34:14."}],"5":[{"catchword":"de cherubijnen der heerlijkheid,","tekst":"Deze waren twee gedaanten van engelen, met hunne hoofden naar elkander gebogen, en met hunne vleugelen elkander rakende, gelijk te zien is Exo 25:18, waartussen God aan Mozes antwoord gaf uit het opperste deel des genadestoels, gelijk betuigt wordt Num 7:89."},{"catchword":"het verzoendeksel beschaduwden;","tekst":"Of genadestoel, welk was het deksel der ark, waar de twee stenen tafelen der wet mede werden bedekt, en een voorbeeld was van Christus, die de wet bedekt, omdat hij voor ons onder de wet is geworden, en ons van den vloek der wet heeft verlost, gelijk Christus ook daarom met den naam van verzoendeksel, of verzoening wordt genoemd, Rom 3:25, en de engelen worden gezegd begerig te zijn om deze verborgenheden te aanschouwen; 1Pe 1:12."}],"6":[{"catchword":"in den eersten tabernakel,","tekst":"Dat is, in het eerste deel, namelijk tabernakel, genaamd het heilige, gelijk vs.2."},{"catchword":"te allen tijde,","tekst":"Dat is, elk in zijn dagordening, gelijk te zien is Luk 1:8-9."}],"7":[{"catchword":"in den tweeden","tekst":"Dat is, in het tweede deel, namelijk het heilige der heiligen, gelijk voren."},{"catchword":"eenmaal des jaars,","tekst":"Namelijk op den tienden dag der zevende maand van Thisri, op den plechtigen dag van de vasten en der verzoening van het ganse volk. Zie Lev 16:29, enz."},{"catchword":"niet zonder bloed,","tekst":"Namelijk van de offerande der verzoening, die buiten den tabernakel, op het grote altaar in den voorhof, was geslacht en geofferd; waarvan het bloed na de ontsteking van het reukwerk in het voorzeide wierookvat, door den priester in het heilige der heiligen voor de ark en den genadestoel gebracht werd, en werd de genadestoel daarmee tot zeven malen besprengd, nadat hij met het reukwerk, als met een wolk was overdekt; gelijk Lev 16:11, enz. te zien is. Welke schaduw en voorbeeld de apostel in vervolg van stuk tot stuk gaat verklaren."},{"catchword":"misdaden","tekst":"Grieks onwetendheden, of onbedachtzaamheden; waardoor verstaan worden, niet alleen de zonden, die eigenlijk uit onwetendheid gedaan worden, maar ook alle soorten van zonden, gelijk uit de plaats Lev 16:16, waarop Paulus hier ziet, genoeg blijkt, en hiervoor Heb 7:27, en elders meer. En worden ook de zonden zo genoemd, omdat alle zonden [de zonde tegen den Heiligen Geest uitgenomen] met enige dwaling van het verstand door de verleiding van den Satan altijd zijn gevoegd."}],"8":[{"catchword":"de Heilige Geest","tekst":"Namelijk die een insteller was van al deze godsdiensten, en derhalve een waarachtig eeuwig God met den Vader en den Zoon, en nochtans een onderscheiden persoon."},{"catchword":"de weg des heiligdoms","tekst":"Dat is, van het heilige der heiligen, of des hemels, gelijk hierna vs.12, 24 wordt verklaard."},{"catchword":"nog niet openbaar gemaakt was,","tekst":"Dat is, nog niet zo klaar en volkomen bekend was gemaakt, gelijk daarna is geschied, toen Christus de zaken, hierdoor betekend, in zijn eerste komst heeft volbracht; gelijk 1Jo 3:2 gezegd wordt, dat het nog niet geopenbaard, of openbaar gemaakt is wat wij worden zullen; namelijk na Christus' tweede komst; hoewel wij nochtans ook hier enigszins daarvan onderricht zijn, maar niet zo klaar en volkomen als het ons zal bekend worden, wanneer de zaak zelf in ons zal vervuld zijn."},{"catchword":"zolang de eerste tabernakel nog stand had;","tekst":"Dat is, zo lang de gemeente onder het Oude Testament door de ceremoniën en handelingen van den eersten tabernakel en vervolgens ook van den eersten tempel, alleen werd onderricht, zonder dat het Evangelie haar in zijn naaktheid en volle klaarheid werd voorgedragen, gelijk na de vervulling is geschied. Want dat enigen dit zo duiden als of de gelovigen in het Oude Testament geen toegang hadden tot den hemel, voordat Christus ten hemel was opgevaren, strijdt tegen het voorbeeld van Elia, 2Ki 2:11, en van Lazarus, Luk 16:22; vergeleken met Mat 8:11, en van den moordenaar aan het kruis, Luk 23:43, vergeleken met 2Co 12:2-4, en met de hoop der gelovige vaderen, Heb 11:16; en strijd ook met Christus' beloften, Mat 5:10-12; die lang voor zijne verrijzenis zijn geschied."}],"9":[{"catchword":"een afbeelding","tekst":"Grieks parabole; dat is, ene gelijkenis die wat anders beduidt."},{"catchword":"dengene, die de dienst pleegde,","tekst":"Grieks den dienenden; dat is, die den dienst was doende."},{"catchword":"niet konden heiligen naar het geweten;","tekst":"Of niet konden volmaken, namelijk in zichzelf aangemerkt, of door hun kracht; anderszins konden zij, in hun recht gebruik, dienen om de gelovige vaderen op Christus te wijzen, door wiens offerande de conscientiën zouden gereinigd worden, gelijk hierna vs.14 wordt verklaard."}],"10":[{"catchword":"wassingen","tekst":"Grieks dopingen."},{"catchword":"rechtvaardigmakingen","tekst":"Dat is, uiterlijke inzettingen, die den mens naar den uitwendigen, of lichamelijken stand, alleen rechtvaardigden of heiligden. Zie vs.13."},{"catchword":"verbetering","tekst":"Grieks rechting; dat is, waarop het te recht zal worden gebracht, namelijk tot op de tijden van het Nieuwe Testament, waar Jeremia van gesproken had, waarin de betekende zaak zou vervuld worden, deze ceremoniën geweerd, en andere kortere godsdiensten ingesteld, waardoor de Heilige Geest krachtiger zou werken, 2Co 3."},{"catchword":"opgelegd","tekst":"Namelijk als een juk, hetwelk de vaders zelf niet hebben kunnen dragen, en door Christus is afgenomen; Act 15:10-11."}],"11":[{"catchword":"der toekomende goederen,","tekst":"Dat is, al de geestelijke weldaden, die door de offerande van Christus aan het kruis, en door zijn ingang in den hemel verworven zijn; gelijk daar zijn: vergeving der zonden, wedergeboorte, den geest der aanneming tot kinderen, en de eeuwige zaligheid, die in het Oude Testament afgebeeld zijnde, in het Nieuwe door Christus zijn verworven."},{"catchword":"gekomen zijnde,","tekst":"Namelijk in het vlees, of in de wereld."},{"catchword":"den meerderen","tekst":"Hierdoor wordt verstaan de menselijke natuur van Christus, waarin de volheid der Godheid als in een tabernakel of tempel woont, Joh 1:14, en Joh 2:19; gelijk Heb 8:2 ook is aangewezen. Er wordt van Christus gezegd door dezen tabernakel zijns vleesches ingegaan te zijn in den hemel, omdat door de geestelijke kracht en waardigheid zijner offerande voor ons volbracht, hem de toegang tot den hemel is geopend, en hem een naam is gegeven boven alle namen, Phi 2:8-9; met welke verklaring overeenkomt hetgeen hij hierna zegt Heb 10:20, van den nieuwen weg, die ons geopend is, om in te gaan in het heilige, door dit voorhangsel, dat is, het vlees van Christus. Want Christus is ons voorgegaan om ons plaats te bereiden, Joh 14:2. Hij wil dan zeggen: gelijk Christus door zichzelf en door zijn eigen bloed ingegaan is in het heiligdom, dat wij ook door denzelfden weg daarin moeten komen."},{"catchword":"van dit maaksel,","tekst":"Grieks van deze schepping, of van dit schepsel."}],"12":[{"catchword":"der bokken en kalveren,","tekst":"Want beide deze soorten van dieren werden geslacht als de hogepriester in het heilige der heiligen zou ingaan, Lev 16:11, Lev 16:15, met welker beider bloed hij ook in het heilige der heiligen inging, vs.18."},{"catchword":"een eeuwige","tekst":"Dat is, altijddurend en van eeuwige kracht, gelijk Heb 10:14."},{"catchword":"verlossing teweeggebracht","tekst":"Grieks rantsoening; dat is, verlossing, die door rantsoen geschiedt, gevonden hebbende."}],"13":[{"catchword":"de as der jonge koe,","tekst":"Dit was nog een andere ceremonie, waardoor de onreinen naar de wet in het Oude Testament werden gereinigd, die ook op Christus en de besprenging van zijn bloed zag; waarvan zie Num 19:2, enz."},{"catchword":"de onreinen,","tekst":"Namelijk naar de wet, door het aanraken van enigen dode, of gebeente, of graven; Num 19:16. Grieks die gemeen gemaakt waren."},{"catchword":"tot de reinigheid","tekst":"Dat is, om uitwendig naar de wet rein te zijn en toegang te mogen hebben tot de vergaderingen en andere uitwendige godsdiensten van het Oude Testament."}],"14":[{"catchword":"door den eeuwigen Geest","tekst":"Dat is, door zijn eeuwige godheid, waardoor de kracht en waardigheid der offerande van Christus is voortgekomen, gelijk Act 20:28 ook wordt aangewezen; en gelijk de eeuwige godheid van Christus ook een Geest wordt genoemd; Rom 1:4; 1Ti 3:16; 1Pe 3:18."},{"catchword":"uw geweten","tekst":"Dat is, uwe zielen, verstand, wil en genegenheid, waarvan de conscientiën ook het gevoel hebben, om te weten hetgeen ons door God geschonken is; 1Co 2:12. Anderen lezen: onze conscientiën."},{"catchword":"dode werken,","tekst":"Dat is zonden. Zie Heb 6:1."}],"15":[{"catchword":"testaments,","tekst":"Het Hebreeuwse woord berith, dat Jeremia gebruikt Jer 31:1, betekent in het algemeen allerlei verbond of contract, hetzij het tussen twee partijen gemaakt wordt, of door één partij alleen, gelijk de testamenten plegen; waarvan voorbeelden zijn te lezen Gen 6:18, en Gen 9:9; Job 31:1. Dat nu dit Verbond een Testament is, stelt de apostel als zeker, omdat het alleen van Gods zijde komt, gelijk de plaats Jer 31:1, in het voorgaande hoofdstuk verhaald, genoeg aantoont; en omdat alle voorbeelden daarvan zulks toonden, die met bloed der gedode offeranden werden besprengd en verzegeld."},{"catchword":"tot verzoening der overtredingen,","tekst":"Grieks verrantsoening."},{"catchword":"die onder het eerste testament waren,","tekst":"Dat is, die ten tijde van het Oude Testament geschied en onverzoend gebleven waren, maar door God voorbijgegaan en vergeven waren, om de offerande en genoegdoening van Christus, die daarna geschieden zou. Zie Act 15:11; Rom 3:25-26."},{"catchword":"die geroepen zijn,","tekst":"Namelijk met een krachtige roeping tot het geloof, gelijk Abraham en zijn geestelijke zaad waren; Rom 4:16."},{"catchword":"de beloftenis","tekst":"Dat is, de beloofde eeuwige erve. Zie hierna Heb 11:8-10."}],"16":[{"catchword":"[tussen-","tekst":"kome;] Grieks gebracht worde; namelijk eer het vast is, gelijk vs.17 verklaart."}],"18":[{"catchword":"het eerste","tekst":"Namelijk verbond door Mozes gemaakt."},{"catchword":"niet zonder bloed is","tekst":"Namelijk de geslachte of gedode dieren, die op den dood van den Middelaar van het Nieuwe Testament hun oogmerk hadden. Want terwijl de overtreding der wet den dood verdiende, en God den overtreder door zijn genade naar den inhoud van het Nieuwe Testament daarvan zou vrijhouden, mits dat zijn gerechtigheid genoeg zou geschieden, zo is Christus de Middelaar hiertussen gekomen, en heeft als borg, Heb 7:22, de voldoening op zich genomen en daarna door zijn dood de schuld der overtreding betaald, en hun de eeuwige erve, die hem als den Zoon Gods toekwam, ook verworven."},{"catchword":"ingewijd","tekst":"Dat is, openlijk ingesteld, gevierd en voor vast en bondig verklaard."}],"19":[{"catchword":"Want als al de geboden,","tekst":"Dit verhaal van Paulus is genomen uit Exo 24:3, enz. alleen dat de apostel hier water, purperen, wol en hysop bijvoegt uit Lev 14:6, en Num 19:6; waar deze dingen in dergelijke besprengingen gebruikt werden."},{"catchword":"het bloed der kalveren","tekst":"Waarvan in andere plaatsen dikwijls wordt gewag gemaakt."},{"catchword":"beide het boek zelf,","tekst":"Dit wordt wel Exo 24 niet uitdrukkelijk gezegd, maar kan evenwel uit het verhaal van Mozes daar genoeg genomen worden."},{"catchword":"al het volk,","tekst":"Dat is, de twaalf pilaren, die Mozes aldaar oprichtte, om de twaalf stammen van Israël te vertegenwoordigen, en dat ten overstaan en in de tegenwoordigheid van al het volk. Zie de aantekeningen op Exo 24:8."}],"20":[{"catchword":"des testaments,","tekst":"Dat is, een teken en zegel van het verbond of testament. Want het was het bloed van kalveren en bokken, dat tot inwijding of bevestiging van dit verbond werd gebruikt. Een sacramentele wijze van spreken, gelijk Luk 22:19; 1Co 11:24-25."},{"catchword":"geboden","tekst":"Dat is, met u heeft gemaakt, naar of over al deze woorden of geboden; gelijk uitgedrukt wordt Exo 24:8."}],"21":[{"catchword":"En hij besprengde desgelijks","tekst":"Dat is genomen uit verscheidene andere plaatsen der wet, inzonderheid uit Exo 29:12; Lev 16:14, enz."}],"22":[{"catchword":"bijna door bloed gereinigd","tekst":"Dit wordt er bij gedaan, omdat enige reinigmakingen der wet alleen door water geschieden, die ook op de offerande van Christus hun oogmerk hadden, daar in zijn dood, bloed en water zijn gevloten. Zie Joh 19:34 en 1Jo 5:6."}],"23":[{"catchword":"Zo was het dan noodzaak,","tekst":"Namelijk volgens Gods onveranderlijk bevel en ordinantie. Zie hierna Heb 10:9-10."},{"catchword":"de voorbeeldingen der dingen,","tekst":"Of afbeeldingen, figuren."},{"catchword":"gereinigd werden,","tekst":"Dat is, van het algemeen gebruik afgezonderd en bekwaam gemaakt om godsdienstige gemeenschap daaraan te hebben."},{"catchword":"maar de hemelse dingen zelve","tekst":"Dat is, de ingang tot den hemel zelf en de geestelijke gaven, welke ons, om daarin te komen, nodig zijn, en die door deze uitwendige reinigmakingen zijn betekend. Zie Eph 1:3; Col 3:1-2."},{"catchword":"door betere offe 9 and 2Co 5:10 it expressly said that in the ark of the covenant nothing was contained but the two tables of the law but others understand it of the ark itself in or about which the golden pot with manna and Aaron rod were in the time of the Tabernacle as may be seen Exo 16:33,34 and Numbers 17 verse 10 although in the times when the temple of Solomon was built they were no more in or about it either because they were perished or because they were brought somewhere into another part of the Temple of the temple as also the authentic book of the Law whereof mentioned is made Deu 21:36 2Co 34:14] was the golden pot wherein was the manna and Aarons staff which had budded and the tables of the covenant ."}],"5":[{"catchword":null,"tekst":"And above all this ark were the Cherubims of glory [these were two shape angels with their heads bowed one towards the other and touching one another with their wings as may be seen Exo 25:18 from between which God gave answer unto Moses from the upper part of the mercy seat as it testified Num 7:89] which shadowed the propitiatory [or mercy seat which was the covering of the ark were with the two stone tables were covered and was a type of Christ who covered the law because he subjected himself to the law for us and delivered us from the curse of the law even as Christ is therefore called by the name of propitiation Rom 3:25 and the Angels are said to be desirous to behold these mysteries 1Peter 1.12] of which things we shall not now speak in particular."}],"6":[{"catchword":null,"tekst":"Now these things now being that prepared the priest indeed went into the first Tabernacle [that is into the first part of the Tabernacle called the holy place as verse 2] always [ that is everyone in his daily course as may be seen Luk 1:8,9] to accomplish the service of God:"}],"7":[{"catchword":null,"tekst":"But into the second Tabernacle [that is into the second part namely the holy of holies as before ] went the high priest once a year [namely on ommitted and remained unexpiated in the times of the old testament but were passed by and forgiven by God for sacrifice and satisfaction of Christ which was to be performed afterwards see Act 15:1 Rom 3:25,26] they that are called [namely with an effectual calling unto faith as Abraham and his spiritual seeds were Rom 4:16]might receive the promise of eternal inheritance [that is the promised eternal inheritance see hereafter chapter 11 verse 8,9,10.]"}],"16":[{"catchword":null,"tekst":"For whence a testament is there it is necessary that the death of the testator intervene [Gr be brought namely before it be firm as the following verse declares.]"}],"17":[{"catchword":null,"tekst":"for a testament is firm in the dead seeing it hath no force when the testator liveth."}],"18":[{"catchword":null,"tekst":"Wherefore also the first [namely covenant made by Moses ]was not consecrated ]that is publicly instituted solemnized and declared to be firm and valid ]without blood [namely of the breast that were slaughtered or killed which had their aim at the death of their mediator of the new testament for seeing the transgression of the law deserved death and God by his grace according to the tenor of the new testament would absolve the transgressor from it so that his justice should also be satisfied therefore Christ the mediator interposed and as a surety Heb 7:22 took upon him the making of the satisfaction and afterwards by his death paid the debt of our transgression and also procured for them the eternal inheritance which belonged unto him as the son of God.]"}],"19":[{"catchword":null,"tekst":"For when all the commandments [this relation of Paul is taken out of exodus 24.3 & c only that apostle adds here to water purple wool and hyssops out of Lev 14:6 and Num 19:6 were these things were used in the like sprinklings ]according to the law were uttered by Moses unto all people he took the blood of calves and goats [whereof mention is made often in other places ]with water an     `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
