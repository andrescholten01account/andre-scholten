rschuwd over de dingen die nog niet gezien werden, en bevreesd geworden, de ark gebouwd tot redding van zijn huisgezin; door dit geloof heeft hij de wereld veroordeeld, en is hij een erfgenaam geworden van de rechtvaardigheid die naar het geloof is.","8":"Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou.","9":"Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte.","10":"Want hij verwachtte de stad die fundamenten heeft, waarvan God de Ontwerper en Bouwer is.","11":"Door het geloof heeft ook Sara zelf kracht ontvangen om, ook toen de tijd van haar ouderdom voorbij was, zwanger te worden en te baren; omdat zij Hem trouw achtte, Die het beloofd had.","12":"Daarom zijn er ook uit één mens, en dat een als het ware al gestorvene, zovelen in aantal geboren als de sterren van de hemel, en als het zand aan de oever van de zee, dat niet te tellen is.","13":"Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren.","14":"Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken.","15":"En als zij aan dat vaderland gedacht hadden waar zij uit weggegaan waren, zouden zij de tijd gehad hebben om terug te keren;","16":"maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.","17":"Door het geloof heeft Abraham, toen hij beproefd werd, Izak geofferd, en hij die de beloften ontvangen had, heeft zijn enige zoon geofferd,","18":"(tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),","19":"terwijl hij overwoog dat God machtig was om hem zelfs uit de doden op te wekken; vandaar dat hij hem ook bij wijze van beeld weergekregen heeft.","20":"Door het geloof heeft Izak zijn zonen Jakob en Ezau gezegend met het oog op toekomstige dingen.","21":"Door het geloof heeft Jakob, stervend, ieder van de zonen van Jozef gezegend, en heeft hij aangebeden, leunend op het uiteinde van zijn staf.","22":"Door het geloof heeft Jozef, stervend, gesproken over het vertrek van de kinderen van Israël, en heeft hij bevel gegeven over zijn gebeente.","23":"Door het geloof werd Mozes, toen hij geboren was, drie maanden lang door zijn ouders verborgen, omdat zij zagen dat het kindje mooi was; en zij waren niet bang voor het gebod van de koning.","24":"Door het geloof heeft Mozes, toen hij groot geworden was, geweigerd een zoon van de dochter van Farao genoemd te worden;","25":"en verkoos hij liever met het volk van God slecht behandeld te worden, dan voor een tijd van de genietingen van de zonde te hebben;","26":"en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.","27":"Door het geloof heeft hij Egypte verlaten, zonder bang te zijn voor de toorn van de koning; want hij hield vol, als iemand die de Onzichtbare ziet.","28":"Door het geloof heeft hij het pascha gehouden, en de besprenging van het bloed, opdat de verderver van de eerstgeborenen hen niet zou raken.","29":"Door het geloof zijn zij door de Rode Zee getrokken, als over droog land; en toen de Egyptenaren dat ook probeerden, zijn zij verdronken.","30":"Door het geloof zijn de muren van Jericho gevallen, nadat ze zeven dagen lang omringd waren geweest.","31":"Door het geloof is Rachab, de hoer, niet omgekomen met de ongehoorzamen, omdat zij de verspieders met vrede had ontvangen.","32":"En wat zal ik nog meer zeggen? Want de tijd zou mij tekortschieten, als ik zou vertellen over Gideon, en Barak, en Simson, en Jefta, en David, en Samuël, en de profeten;","33":"die door het geloof koninkrijken hebben overwonnen, gerechtigheid gedaan, de beloften verkregen, de muilen van de leeuwen toegestopt,","34":"de kracht van het vuur hebben geblust, aan de scherpte van het zwaard zijn ontkomen, vanuit zwakheid kracht hebben gekregen, in de strijd sterk zijn geworden, legers van vreemden op de vlucht hebben gebracht;","35":"de vrouwen hebben hun doden door de opstanding weer teruggekregen; en anderen zijn gefolterd, en wilden de aangeboden verlossing niet aannemen, opdat zij een betere opstanding zouden verkrijgen.","36":"En anderen hebben bespottingen en geselingen ondervonden, en ook boeien en gevangenschap;","37":"zij zijn gestenigd, in stukken gezaagd, beproefd, met het zwaard gedood; zij hebben rondgezworven in schapenvellen en geitenvellen; berooid, verdrukt, mishandeld;","38":"(de wereld was hen niet waard) zij hebben rondgedoold in woestijnen, en op bergen, en in spelonken, en in holen van de aarde.","39":"En deze allen, hoewel zij door het geloof een goed getuigenis hadden gekregen, hebben de belofte niet verkregen;","40":"omdat God iets beters voor ons had voorzien, opdat zij niet zonder ons volmaakt zouden worden."},"SV":{"1":"Het geloof nu is een vaste grond der dingen, die men hoopt, *en* een bewijs der zaken, die men niet ziet.","2":"Want door hetzelve hebben de ouden getuigenis bekomen.","3":"Door het geloof verstaan wij, dat de wereld door het woord Gods is toebereid, alzo dat de dingen, die men ziet, niet geworden zijn uit dingen, die gezien worden.","4":"Door het geloof heeft Abel een meerdere offerande Gode geofferd dan Kaïn, door hetwelk hij getuigenis bekomen heeft, dat hij rechtvaardig was, alzo God over zijn gave getuigenis gaf; en door hetzelve *geloof* spreekt hij nog, nadat hij gestorven is.","5":"Door het geloof is Enoch weggenomen geweest, opdat hij den dood niet zou zien; en hij werd niet gevonden, daarom dat hem God weggenomen had; want voor zijn wegneming heeft hij getuigenis gehad, dat hij Gode behaagde.","6":"Maar zonder geloof is het onmogelijk *Gode* te behagen. Want die tot God komt, moet geloven, dat Hij is, en een Beloner is dergenen, die Hem zoeken.","7":"Door het geloof heeft Noach, door Goddelijke aanspraak vermaand zijnde van de dingen, die nog niet gezien werden, *en* bevreesd geworden zijnde, de ark toebereid tot behoudenis van zijn huisgezin; door welke *ark* hij de wereld heeft veroordeeld, en is geworden een erfgenaam der rechtvaardigheid, die naar het geloof is.","8":"Door het geloof is Abraham, geroepen zijnde, gehoorzaam geweest, om uit te gaan naar de plaats, die hij tot een erfdeel ontvangen zou; en hij is uitgegaan, niet wetende, waar hij komen zou.","9":"Door het geloof is hij een inwoner geweest in het land der belofte, als in een vreemd *land*, en heeft in tabernakelen gewoond met Izak en Jakob, die medeerfgenamen waren derzelfde belofte.","10":"Want hij verwachtte de stad, die fondamenten heeft, welker Kunstenaar en Bouwmeester God is.","11":"Door het geloof heeft ook Sara zelve kracht ontvangen, om zaad te geven, en boven den tijd *haars* ouderdoms heeft zij gebaard; overmits zij Hem getrouw heeft geacht, Die het beloofd had.","12":"Daarom zijn ook van een, en dat een verstorvene, *zovelen* in menigte geboren, als de sterren des hemels, en als het zand, dat aan den oever der zee is, hetwelk ontallijk is.","13":"Deze allen zijn in het geloof gestorven, de beloften niet verkregen hebbende, maar hebben dezelve van verre gezien, en geloofd, en omhelsd, en hebben beleden, dat zij gasten en vreemdelingen op de aarde waren.","14":"Want die zulke dingen zeggen, betonen klaarlijk, dat zij een vaderland zoeken.","15":"En indien zij aan dat *vaderland* gedacht hadden, van hetwelk zij uitgegaan waren, zij zouden tijd gehad hebben, om weder te keren;","16":"Maar nu zijn zij begerig naar een beter, dat is, naar het hemelse. Daarom schaamt Zich God hunner niet, om hun God genaamd te worden; want Hij had hun een stad bereid.","17":"Door het geloof heeft Abraham, als hij verzocht werd, Izak geofferd, en hij, die de beloften ontvangen had, heeft *zijn* eniggeborene geofferd,","18":"( Tot denwelken gezegd was: In Izak zal u het zaad genoemd worden) overleggende, dat God machtig was, *hem* ook uit de doden te verwekken;","19":"Waaruit hij hem ook bij gelijkenis wedergekregen heeft.","20":"Door het geloof heeft Izak *zijn* *zonen* Jakob en Ezau gezegend aangaande toekomende dingen.","21":"Door het geloof heeft Jakob, stervende, een iegelijk der zonen van Jozef gezegend, en heeft aangebeden, *leunende* op het opperste van zijn staf.","22":"Door het geloof heeft Jozef, stervende, gemeld van den uitgang der kinderen Israëls, en heeft bevel gegeven van zijn gebeente.","23":"Door het geloof werd Mozes, toen hij geboren was, drie maanden lang van zijn ouders verborgen, overmits zij zagen, dat het kindeken schoon was; en zij vreesden het gebod des konings niet.","24":"Door het geloof heeft Mozes, nu groot geworden zijnde, geweigerd een zoon van Farao’s dochter genoemd te worden;","25":"Verkiezende liever met het volk van God kwalijk gehandeld te worden, dan voor een tijd de genieting der zonde te hebben;","26":"Achtende de versmaadheid van Christus meerderen rijkdom te zijn, dan de schatten in Egypte; want hij zag op de vergelding des loons.","27":"Door het geloof heeft hij Egypte verlaten, niet vrezende den toorn des konings; want hij hield zich vast, als ziende den Onzienlijke.","28":"Door het geloof heeft hij het pascha uitgericht, en de besprenging des bloeds, opdat de verderver der eerstgeborenen hen niet raken zou.","29":"Door het geloof zijn zij de Rode zee doorgegaan, als door het droge; hetwelk de Egyptenaars, *ook* verzoekende, zijn verdronken.","30":"Door het geloof zijn de muren van Jericho gevallen, als zij tot zeven dagen toe omringd waren geweest.","31":"Door het geloof is Rachab, de hoer, niet omgekomen met de ongehoorzamen, als zij de verspieders met vrede had ontvangen.","32":"En wat zal ik nog *meer* zeggen? Want de tijd zal mij ontbreken, zou ik verhalen van Gideon, en Barak, en Samson, en Jeftha, en David, en Samuël, en de profeten;","33":"Welken door het geloof koninkrijken hebben overwonnen, gerechtigheid geoefend, de beloftenissen verkregen, de muilen der leeuwen toegestopt;","34":"De kracht des vuurs hebben uitgeblust, de scherpte des zwaards zijn ontvloden, uit zwakheid krachten hebben gekregen, in den krijg sterk geworden zijn, heirlegers der vreemden op de vlucht hebben gebracht;","35":"De vrouwen hebben hare doden uit de opstanding *weder* gekregen; en anderen zijn uitgerekt geworden, de *aangeboden* verlossing niet aannemende, opdat zij een betere opstanding verkrijgen zouden.","36":"En anderen hebben bespottingen en geselen geproefd, en ook banden en gevangenis;","37":"Zijn gestenigd geworden, in stukken gezaagd, verzocht, door het zwaard ter dood gebracht; hebben gewandeld in schaapsvellen *en* in geitenvellen; verlaten, verdrukt, kwalijk gehandeld zijnde;","38":"( Welker de wereld niet waardig was) hebben in woestijnen gedoold, en *op* bergen, en *in* spelonken, en *in* holen der aarde.","39":"En deze allen, hebbende door het geloof getuigenis gehad, hebben de belofte niet verkregen;","40":"Alzo God wat beters over ons voorzien had, opdat zij zonder ons niet zouden volmaakt worden."},"KJV":{"1":"Now faith is the substance of things hoped for, the evidence of things not seen.","2":"For by it the elders obtained a good report.","3":"Through faith we understand that the worlds were framed by the word of God, so that things which are seen were not made of things which do appear.","4":"By faith Abel offered unto God a more excellent sacrifice than Cain, by which he obtained witness that he was righteous, God testifying of his gifts: and by it he being dead yet speaketh.","5":"By faith Enoch was translated that he should not see death; and was not found, because God had translated him: for before his translation he had this testimony, that he pleased God.","6":"But without faith *it is* impossible to please *him*: for he that cometh to God must believe that he is, and *that* he is a rewarder of them that diligently seek him.","7":"By faith Noah, being warned of God of things not seen as yet, moved with fear, prepared an ark to the saving of his house; by the which he condemned the world, and became heir of the righteousness which is by faith.","8":"By faith Abraham, when he was called to go out into a place which he should after receive for an inheritance, obeyed; and he went out, not knowing whither he went.","9":"By faith he sojourned in the land of promise, as *in* a strange country, dwelling in tabernacles with Isaac and Jacob, the heirs with him of the same promise:","10":"For he looked for a city which hath foundations, whose builder and maker *is* God.","11":"Through faith also Sara herself received strength to conceive seed, and was delivered of a child when she was past age, because she judged him faithful who had promised.","12":"Therefore sprang there even of one, and him as good as dead, *so many* as the stars of the sky in multitude, and as the sand which is by the sea shore innumerable.","13":"These all died in faith, not having received the promises, but having seen them afar off, and were persuaded of *them*, and embraced *them*, and confessed that they were strangers and pilgrims on the earth.","14":"For they that say such things declare plainly that they seek a country.","15":"And truly, if they had been mindful of that *country* from whence they came out, they might have had opportunity to have returned.","16":"But now they desire a better *country*, that is, an heavenly: wherefore God is not ashamed to be called their God: for he hath prepared for them a city.","17":"By faith Abraham, when he was tried, offered up Isaac: and he that had received the promises offered up his only begotten","18":"Of whom it was said, That in Isaac shall thy seed be called:","19":"Accounting that God *was* able to raise *him* up, even from the dead; from whence also he received him in a figure.","20":"By faith Isaac blessed Jacob and Esau concerning things to come.","21":"By faith Jacob, when he was a dying, blessed both the sons of Joseph; and worshipped, *leaning* upon the top of his staff.","22":"By faith Joseph, when he died, made mention of the departing of the children of Israel; and gave commandment concerning his bones.","23":"By faith Moses, when he was born, was hid three months of his parents, because they saw *he was* a proper child; and they were not afraid of the king's commandment.","24":"By faith Moses, when he was come to years, refused to be called the son of Pharaoh's daughter;","25":"Choosing rather to suffer affliction with the people of God, than to enjoy the pleasures of sin for a season;","26":"Esteeming the reproach of Christ greater riches than the treasures in Egypt: for he had respect unto the recompence of the reward.","27":"By faith he forsook Egypt, not fearing the wrath of the king: for he endured, as seeing him who is invisible.","28":"Through faith he kept the passover, and the sprinkling of blood, lest he that destroyed the firstborn should touch them.","29":"By faith they passed through the Red sea as by dry *land*: which the Egyptians assaying to do were drowned.","30":"By faith the walls of Jericho fell down, after they were compassed about seven days.","31":"By faith the harlot Rahab perished not with them that believed not, when she had received the spies with peace.","32":"And what shall I more say? for the time would fail me to tell of Gedeon, and *of* Barak, and *of* Samson, and *of* Jephthae; *of* David also, and Samuel, and *of* the prophets:","33":"Who through faith subdued kingdoms, wrought righteousness, obtained promises, stopped the mouths of lions,","34":"Quenched the violence of fire, escaped the edge of the sword, out of weakness were made strong, waxed valiant in fight, turned to flight the armies of the aliens.","  out <span class=\"wl wl-kjv\" data-code=\"G575\">of</span> <span class=\"wl wl-kjv\" data-code=\"G769\">weakness</span> were made <span class=\"wl wl-kjv\" data-code=\"G1743\">strong,</span> <span class=\"wl wl-kjv\" data-code=\"G1096\">waxed</span> <span class=\"wl wl-kjv\" data-code=\"G2478\">valiant</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G4171\">fight,</span> turned to <span class=\"wl wl-kjv\" data-code=\"G2827\">flight</span> the <span class=\"wl wl-kjv\" data-code=\"G3925\">armies</span> of the aliens.","35":"<span class=\"wl wl-kjv\" data-code=\"G1135\">Women</span> <span class=\"wl wl-kjv\" data-code=\"G2983\">received</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G3498\">dead</span> raised to life <span class=\"wl wl-kjv\" data-code=\"G1537\">again:</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">and</span> <span class=\"wl wl-kjv\" data-code=\"G243\">others</span> were <span class=\"wl wl-kjv\" data-code=\"G5178\">tortured,</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G4327\">accepting</span> <span class=\"wl wl-kjv\" data-code=\"G629\">deliverance;</span> <span class=\"wl wl-kjv\" data-code=\"G2443\">that</span> they might <span class=\"wl wl-kjv\" data-code=\"G5177\">obtain</span> a <span class=\"wl wl-kjv\" data-code=\"G2909\">better</span> resurrection:","36":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> <span class=\"wl wl-kjv\" data-code=\"G2087\">others</span> <span class=\"wl wl-kjv\" data-code=\"G2983\">had</span> <span class=\"wl wl-kjv\" data-code=\"G3984\">trial</span> of cruel <span class=\"wl wl-kjv\" data-code=\"G1701\">mockings</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3148\">scourgings,</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">yea,</span> <span class=\"wl wl-kjv\" data-code=\"G2089\">moreover</span> of <span class=\"wl wl-kjv\" data-code=\"G1199\">bonds</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> imprisonment:","37":"They were <span class=\"wl wl-kjv\" data-code=\"G3034\">stoned,</span> they were sawn <span class=\"wl wl-kjv\" data-code=\"G4249\">asunder,</span> were <span class=\"wl wl-kjv\" data-code=\"G3985\">tempted,</span> were <span class=\"wl wl-kjv\" data-code=\"G599\">slain</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">with</span> the <span class=\"wl wl-kjv\" data-code=\"G5408\">sword:</span> they wandered <span class=\"wl wl-kjv\" data-code=\"G4022\">about</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G3374\">sheepskins</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">and</span> <span class=\"wl wl-kjv\" data-code=\"G122\">goatskins;</span> being <span class=\"wl wl-kjv\" data-code=\"G5302\">destitute,</span> <span class=\"wl wl-kjv\" data-code=\"G2346\">afflicted,</span> tormented;","38":"(Of <span class=\"wl wl-kjv\" data-code=\"G3739\">whom</span> the <span class=\"wl wl-kjv\" data-code=\"G2889\">world</span> <span class=\"wl wl-kjv\" data-code=\"G2258\">was</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G514\">worthy:)</span> they <span class=\"wl wl-kjv\" data-code=\"G4105\">wandered</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G2047\">deserts,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> in <span class=\"wl wl-kjv\" data-code=\"G3735\">mountains,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> in <span class=\"wl wl-kjv\" data-code=\"G4693\">dens</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3692\">caves</span> of the earth.","39":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3778\">these</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all,</span> having obtained a good <span class=\"wl wl-kjv\" data-code=\"G3140\">report</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">through</span> <span class=\"wl wl-kjv\" data-code=\"G4102\">faith,</span> <span class=\"wl wl-kjv\" data-code=\"G2865\">received</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> the promise:","40":"<span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> having <span class=\"wl wl-kjv\" data-code=\"G4265\">provided</span> <span class=\"wl wl-kjv\" data-code=\"G5100\">some</span> <span class=\"wl wl-kjv\" data-code=\"G2909\">better</span> <span class=\"wl wl-kjv\" data-code=\"G5100\">thing</span> <span class=\"wl wl-kjv\" data-code=\"G4012\">for</span> <span class=\"wl wl-kjv\" data-code=\"G2257\">us,</span> <span class=\"wl wl-kjv\" data-code=\"G3363\">that</span> <span class=\"wl wl-kjv\" data-code=\"G5048\">they</span> <span class=\"wl wl-kjv\" data-code=\"G5565\">without</span> <span class=\"wl wl-kjv\" data-code=\"G2257\">us</span> <span class=\"wl wl-kjv\" data-code=\"G5048\">should</span> <span class=\"wl wl-kjv\" data-code=\"G3363\">not</span> be made perfect."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"is een vaste grond","tekst":"Of een vast vertrouwen; dat is, hetgeen doet bestaan, of vast en als tegenwoordig staan de dingen die van God in Christus beloofd zijn, en die derhalve door de hoop worden verwacht, hetwelk niet alleen geschiedt door een toestemming van Gods beloften in ons verstand, maar ook door een vertrouwen op deze in onzen wil; zie Rom 4:18, enz. en hiervoor Heb 3:14. Grieks hypostasis; dat is, zelfstandigheid; van welk woord, zie ook 2Co 9:4, en 2Co 11:17."},{"catchword":"een bewijs","tekst":"Of overtuiging; want het geloof ziende op Gods openbaring en belofte, overtuigt en verzekert het hart des mensen veel sterker van de waarheid der zaak, dan enig ander bewijs uit de natuurlijke rede voortgebracht."},{"catchword":"der zaken, die men niet ziet","tekst":"Dat is, zelfs die door natuurlijke zinnen of rede door ons niet worden begrepen; of, die niet tegenwoordig zijn voor onze ogen. Want hoewel de dingen, die gezien worden ook wel geloofd worden, gelijk Christus tot Thomas spreekt, Joh 20:29; nochtans is dit eigenlijk niet het Goddelijk geloof, dat is ons door den Heiligen Geest wordt gewrocht, hetwelk alleen op Gods belofte of openbaring ziet, het zij de dingen nu verleden, tegenwoordig, of toekomende zijn, gelijk uit de voorbeelden, die Paulus voortbrengt, zal blijken."}],"2":[{"catchword":"de ouden","tekst":"Namelijk voorvaders, van wie wij afkomstig zijn, en werker voorbeelden wij moeten navolgen."},{"catchword":"getuigenis bekomen","tekst":"Namelijk dat zij Gode behaagden, gelijk vs.5 wordt uitgedrukt."}],"3":[{"catchword":"de wereld","tekst":"Grieks de eeuwen; gelijk Heb 1:2."},{"catchword":"door het woord Gods","tekst":"Dat is, door het krachtig bevel Gods. Zie Gen 1; Psa 33:6."},{"catchword":"toebereid,","tekst":"Dat is, geschapen en in zulke orde en gestalte gebracht, als wij die nu zien."},{"catchword":"niet geworden zijn uit dingen,","tekst":"Of, geworden zijn niet uit zienlijke, of geziene dingen; dat is, uit niet. Want dit is het geloof eigen, dat het uit Gods Woord gelooft dat de wereld uit niet is geschapen; waartoe geen wijsgeer door de natuurlijke rede heeft kunnen komen."}],"4":[{"catchword":"een meerdere offerande","tekst":"Sommigen nemen dit woord meerder voor van meerder prijs, omdat Abel uit zijn vetste beesten zijn offerande heeft gedaan en Kaïn maar uit enige slechte vruchten. Doch wordt hier hetzelfde woord wel zo geschikt genomen voor waardiger en Gode aangenamer, hetwelk de apostel daaruit besluit, dat God Abel en zijn offerande aanzag en van Kaïn niet, hetwelk de apostel getuigt dat door het geloof van Abel is geschied; namelijk omdat Abel in deze offerande zag op dat zaad der vrouw, dat de slang den kop zou vertreden, dat is, op Christus, die door Zijn dood den duivel zou teniet maken; Heb 2:14."},{"catchword":"door hetwelk hij","tekst":"Namelijk geloof."},{"catchword":"dat hij rechtvaardig was,","tekst":"Dit staat wel niet met zoveel woorden Gen 4:4, maar de apostel besluit dit uit hetgeen daar staat, dat God hem en zijn offerande aanzag, welken titel van rechtvaardigheid Christus daarom aan Abel ook geeft; Mat 23:35."},{"catchword":"over zijn gave getuigenis gaf;","tekst":"Namelijk door Mozes, Gen 4:4; of door een buitengewoon teken uit den hemel omtrent Zijn offerande, gelijk over Aärons offerande, Lev 9:24; over Elia, 1Ki 18:38; van David, 1Ch 21:26; van Salomo, 2Ch 7:1, door het zenden van vuur uit den hemel is geschied. Hetwelk daarom zeer gelofelijk is, omdat Kaïn, dit ziende, over zijn broeder met toorn en nijd is ontstoken."},{"catchword":"spreekt hij nog,","tekst":"Namelijk niet alleen met zijn goed exempel in Gods Woord, maar ook door zijn bloed, hetwelk na zijn dood wraak riep tot God. Zie Gen 4:10; Heb 12:24."}],"5":[{"catchword":"weggenomen geweest,","tekst":"Grieks overgezet; namelijk van de aarde in den hemel, gelijk van Elia uitgedrukt wordt, 2Ki 2:1."},{"catchword":"zien;","tekst":"Dat is, lijden of gevoelen; gelijk dit woord zien ook genomen wordt Psa 16:10; Joh 8:51. Waaruit blijkt, dat zijn lichaam in deze opneming naar den hemel de sterfelijkheid heeft afgelegd, en in een onsterfelijk en verheerlijkt lichaam is veranderd, gelijk van Elia te lezen is, Luk 9:30, en van alle gelovigen ten laatsten dage; 1Co 15:51, en 1Th 4:15."},{"catchword":"Gode behaagde","tekst":"Dit zegt wel niet de tekst Gen 5:22, maar de apostel besluit dit uit hetgeen daar staat dat hij geduriglijk voor God wandelde."}],"6":[{"catchword":"is het onmogelijk","tekst":"Of is het onmogelijk dat hij God behaagd heeft, namelijk ter eeuwige zaligheid. De reden is, omdat niemand buiten Christus God zo behagen kan, Joh 14:6; Act 4:12."},{"catchword":"die tot God komt,","tekst":"Dat is, die voor God gestadig wandelt, gelijk Mozes van Henoch spreekt, Gen 5:22, Gen 5:24. Of die God dient en Zijne gunst zoekt te genieten."},{"catchword":"dat Hij is,","tekst":"Namelijk niet alleen een wezenlijke zaak, maar ook zodanig als Hij zich in Zijn Woord heeft geopenbaard, niet alleen volgens de wet, maar ook volgens het Evangelie, waar het geloof, waarvan Paulus hier spreekt, eigenlijk op ziet; Rom 1:16-17."},{"catchword":"een Beloner is dergenen,","tekst":"Of, loongever, vergelder; dat is, volbrenger van zijn beloften in het belonen dergenen, die Hem zoeken. Want dit loon kan niet gehoopt worden dan uit vorige beloften, waar het geloof op ziet. Welke hier noodzakelijk moet zijn, niet een belofte der wet, maar van het Evangelie, daar niemand de belofte der eeuwige erve uit de wet kan deelachtig worden. Zie Gal 3:18."},{"catchword":"die Hem zoeken","tekst":"Namelijk door den weg in het Evangelie geopenbaard; Joh 17:3."}],"7":[{"catchword":"die nog niet gezien werden,","tekst":"Dat is, die nog niet tegenwoordig waren, namelijk van den zondvloed en van zijn behoudenis in de ark."},{"catchword":"bevreesd geworden zijnde,","tekst":"Namelijk met eerbied en kinderlijke vrees voor Gods dreigementen tegen de wereld en van Gods belofte jegens hem."},{"catchword":"de wereld heeft veroordeeld,","tekst":"Namelijk door zijn exempel, in de tegenwoordigheid van allen; gelijk Mat 12:41-42."},{"catchword":"een erfgenaam","tekst":"Dat is, deelgenoot of bezitter, niet alleen van zijn leven, dat ook de goddeloze Cham deelachtig was, maar ook van het eeuwige leven, dat door de rechtvaardigheid van het geloof alleen wordt verkregen; Rom 4:13, enz."}],"8":[{"catchword":"geroepen zijnde,","tekst":"Namelijk uit Ur der Chaldeën. Zie Act 7:2, enz."},{"catchword":"naar de plaats,","tekst":"Dat is naar het land Kanaän, hoewel hem in zijn eerste beroeping zulks nog niet bekend was. Zie Gen 12:1."}],"9":[{"catchword":"in tabernakelen gewoond","tekst":"Namelijk gelijk vreemdelingen en reizigers plachten, om die weder te kunnen opnemen en naar andere plaatsen te voeren; gelijk daartoe bij ons de tenten plegen gebruikt te worden."},{"catchword":"derzelfde belofte","tekst":"Namelijk van de toekomende bezitting van het land Kanaän en vervolgens ook van het eeuwige leven."}],"10":[{"catchword":"de stad,","tekst":"Dat is, den hemel, of het hemelse Jeruzalem, waarvan het land Kanaän en daarna ook Jeruzalem maar schaduwen waren."},{"catchword":"die fondamenten heeft,","tekst":"Namelijk welke vast en onbewegelijk waren. De apostel stelt die tegen de tabernakelen, die geen fundamenten hadden. Zie hierna Heb 13:14; Rev 3:12, en Rev 21:2, enz."},{"catchword":"Kunstenaar en Bouwmeester God is","tekst":"Dat is, aftekenaar of ordineerder naar de kunst, gelijk placht te geschieden eer men tot bouwen van de steden voortgaat."}],"11":[{"catchword":"om zaad te geven,","tekst":"Grieks tot nederwerping, of tot grondlegging van het zaad. Hetwelk niet alleen van Abraham verstaan wordt, uit wien Sara het zaad heeft ontvangen; maar ook van Sara zelve, die in deze ontvangenis haar eigen zaad in zulken ouderdom, door de kracht van het geloof, daarbij heeft gegeven, gelijk in alle natuurlijke ontvangenis geschiedt. Zie ook Lev 12:2."},{"catchword":"boven den tijd","tekst":"Namelijk daar zij nu negentig jaren oud was en bovendien onvruchtbaar. Zie Gen 16:1; Rom 4:19."},{"catchword":"getrouw heeft geacht,","tekst":"Want hoewel Sara daarover in het begin lachte, zo heeft zij nochtans daarna ook aan die belofte vastgehouden."}],"12":[{"catchword":"en dat een verstorvene,","tekst":"Namelijk niet alleen ten aanzien van Sara, maar ook van hemzelf, gelijk Paulus verklaart Rom 4:19. Dat Abraham dan na den dood van Sara, nog verscheidene kinderen uit Ketura heeft gekregen, moet de nieuwe jeugd toegeschreven worden, die hij door deze nieuwe belofte heeft ontvangen."},{"catchword":"oever der zee is,","tekst":"Grieks lib."}],"13":[{"catchword":"de beloften niet verkregen hebbende,","tekst":"Dat is, de zaak die hun verscheidene malen beloofd was, van den eigendom van het land Kanaän, en het zaad, waarin alle geslachten der aarde zouden gezegend worden."},{"catchword":"gasten en vreemdelingen","tekst":"Gelijk van Jakob uitdrukkelijk wordt betuigd, toen hij voor Faraö stond, Gen 47:9, en van anderen vóór en na hem; Gen 15:13, en Gen 28:4; Psa 39:13."}],"14":[{"catchword":"zulke dingen zeggen,","tekst":"Namelijk dat zij vreemdelingen en gasten zijn op aarde."},{"catchword":"een vaderland zoeken","tekst":"Namelijk dat buiten deze wereld in den hemel is, gelijk vs.16 wordt verklaard."}],"15":[{"catchword":"van hetwelk zij uitgegaan waren,","tekst":"Namelijk hier op aarde, gelijk daar was het land van Mesopotamië of Chaldea, waar Abraham met zijn geslachten uit vertrokken was."}],"16":[{"catchword":"schaamt Zich God hunner niet,","tekst":"Dat is, verontwaardigt zich niet."},{"catchword":"genaamd te worden;","tekst":"Namelijk zelfs na hun dood, gelijk hij doorgaans wordt genoemd de God van Abraham, Izak en Jakob. Zie Exo 3:6. Waaruit Christus zelf besluit, dat deze dan niet alleen kinderen Gods waren, terwijl zij op aarde leefden, maar dat hunne lichamen ook weder zouden opstaan, zo God niet is een God van doden, maar van levenden, Mat 22:31-32."},{"catchword":"een stad bereid","tekst":"Namelijk die fondamenten had in den hemel, waarin God zelf zijn heerlijkheid openbaarde, en hen als rechte burgers zou ontvangen, Phi 3:20."}],"17":[{"catchword":"als hij verzocht werd,","tekst":"Dat is, beproefd werd, of van God aangezocht werd, om vast bewijs te geven van zijn gehoorzaamheid; Gen 22."},{"catchword":"geofferd,","tekst":"Dat is, bereid geweest om te offeren, of bezig met hem te offeren."},{"catchword":"[zijn","tekst":"eniggeborene geofferd,] Alzo wordt Izak genoemd, omdat hij alleen uit de vrije was geboren, en Ismaël uit de dienstbare geen rechte erfgenaam was."}],"18":[{"catchword":"(Tot denwelke gezegd was","tekst":"Of van denwelken, gelijk dit Griekse woord pros ook hiervoor genomen kan worden; Heb 1:7-8."},{"catchword":"overleggende,","tekst":"Dat is, bij zich door het geloof, dat vast stond op Gods beloften, besluitende of bedenkende."}],"19":[{"catchword":"bij gelijkenis","tekst":"Dit doet de apostel daarbij, omdat hij hem reeds voor dood moest houden, dien God beval dat geslacht zou worden; uit welken stand, als een stand des doods, hij hem daarna weder ontving; toen hem God zulks belette."}],"20":[{"catchword":"Jakob en Ezau","tekst":"Dat is, in zijn zegen het land Kanaän en daaromtrent, alzo verdeeld, en Ezau's nakomelingen aan Jakobs nakomelingen alzo onderworpen, alsof hij de volle bezitting daarvan reeds gehad had."}],"21":[{"catchword":"stervende,","tekst":"Dat is, nabij den dood zijnde, in zijn sterfziekte."},{"catchword":"heeft aangebeden,","tekst":"Namelijk niet zijnen staf, gelijk enigen verkeerd menen, maar op zijn staf den God zijner vaderen en den engel, die hem tot dien tijd toe had bijgestaan, en van vele zwarigheden verlost; dat is, de Zoon Gods, gelijk Gen 48:3, Gen 48:15, te zien is."},{"catchword":"op het opperste van zijn staf","tekst":"De Hebreeuwse tekst Gen 47:31, zegt, aan het hoofd, of hoofdeinde van het bed. Doch de Griekse overzetters hebben voor Mittah, dat is, bed gelezen Matteh; dat is, roede of staf, welke de apostel hier heeft gevolgd, alzo beide waarachtig kan zijn. Want uit de vergelijking van Gen 47:31, met Gen 48:2 blijkt, dat Jakob, als hij de zonen van Jozef en daarna ook zijn zonen zegende, op zijn heeft gezeten, en vanwege zijn zwakheid op een staf heeft gesteund, alzo zijne benen van het bed hingen, die hij na den zegen weder ingetrokken heeft; Gen 49:33."}],"22":[{"catchword":"gemeld van den uitgang","tekst":"Dat is, betuigd dat God Zijn belofte zou volbrengen, van de verlossing der kinderen Israëls uit Egypte. Zie Gen 50:24, enz."},{"catchword":"van zijn gebeente","tekst":"Dat is, van het medenemen van zijn gebeente naar het land Kanaän, niet uit enige bijgelovigheid of om zijn gebeente daar te laten aanbidden, hetwelk nooit geschied is, maar om de gemeenschap die hij met zijne broederen aan de belofte van God had, en zijn hoop van de vervulling daarvan, ook na zijn dood, hierdoor te betuigen, en hunne nakomelingen daarin te versterken."}],"23":[{"catchword":"ouders verborgen,","tekst":"Grieks vaders dat is, ouders, namelijk Amram en Jochebed, Exo 6:19, die door de schoonheid des kinds bewogen werden, om iets bijzonders daarvan te verwachten, hetwelk de apostel hier hun geloof op Gods beloften toeschrijft. Josefus de geschiedschrijver getuigt, Antiq. lib.2, cap.5, dat de vader van Mozes door ene Goddelijke openbaring was bericht, dat deze zoon hen uit Egypte zou verlossen."},{"catchword":"zij vreesden","tekst":"Namelijk niet zo dat zij het kind naar het gebod des konings, zouden hebben gedood, hoewel dar enige zwakheid in hun geloof is gekomen, toen zij het evenwel daarna aan de rivier te vondeling hebben gelegd, doch met hoop, dat iemand het zou vinden en opbrengen, gelijk geschied is. Een geloof dan, al is het met zwakheid gemengd, wordt hier ook voor een waarachtig geloof gerekend."}],"24":[{"catchword":"groot geworden zijnde,","tekst":"Dat is, nu veertig jaren oud geworden zijnde, gelijk Stefanus getuigt, Act 7:23."},{"catchword":"een zoon van Faraö's dochter genoemd te worden;","tekst":"Want die had hem tot een zoon aangenomen, Exo 2:10; Act 7:21."}],"25":[{"catchword":"de genieting der zonde","tekst":"Dat is, de vermakingen en gemakken van het hof van Farao, die hij, zonder zich tegen God te bezondigen, niet kon genieten."}],"26":[{"catchword":"Christus meerderen rijkdom te zijn,","tekst":"Dat is, die hij om de verwachting van Christus en naar Christus' voorbeeld zou moeten lijden. Zie dergelijke 2Co 1:5; Col 1:24. Want Mozes heeft ook den dag van Christus gezien en zich daarin verheugd, gelijk van Abraham gezegd wordt, Joh 8:56."},{"catchword":"op de vergelding des loons","tekst":"Namelijk die eeuwig en onvergankelijk zou zijn in den hemel, 1Pe 1:4-6; waar de gelovigen ook op mogen zien, als op een loon, niet dat God hun schuldig zou zijn, of dat zij zouden verdienen, maar dat God hun Vader hun als Zijne kinderen uit genade belooft te zullen geven. Zie Mat 5:10-12."}],"27":[{"catchword":"Egypte verlaten,","tekst":"Namelijk met het ganse volk van Israël, niettegenstaande de dreigementen van den koning. Zie Exo 10:29."},{"catchword":"hij hield zich vast,","tekst":"Namelijk aan Gods bevel, zonder door enige vrees daarvan te wijken. Of, hij was kloekmoedig, standvastig."},{"catchword":"ziende","tekst":"Namleijk door het geloof."},{"catchword":"den Onzienlijke","tekst":"Namelijk God. Zie Psa 56:12, en Psa 118:6; Rom 8:31."}],"28":[{"catchword":"de besprenging des bloeds,","tekst":"Grieks aangieting; namelijk aan de dorpels en posten van de deuren der Israëlieten; Exo 12:21, enz."},{"catchword":"niet raken zou","tekst":"Dat is, niet beschadigen of beledigen."}],"29":[{"catchword":"zijn zij de Rode zee doorgegaan,","tekst":"Namelijk Mozes, Aäron en de andere Israëlieten. Want hoewel enigen onder hen geen waarachtig geloof hadden, gelijk de apostel hiervoor, Heb 3:18, getuigd heeft, nochtans zo zijn er ook vele ware gelovigen met hem geweest. Zie hiervoor Heb 3:16, op welke hier eigenlijk gezien wordt."}],"30":[{"catchword":"het geloof zijn de muren van Jericho gevallen,","tekst":"Namelijk van Jozua en van de andere vrome Israëlieten, gelijk in vs.29."},{"catchword":"omringd waren geweest","tekst":"Namelijk van het leger der Israëlieten met bazuingeluid; Jos 6:20."}],"31":[{"catchword":"de hoer,","tekst":"Het Hebreeuwse woord zonah betekent ook ene waardin, en de verspieders zijn in haar huis gegaan om te overnachten, Jos 2:1. Doch dewijl de apostel alhier, gelijk ook Jakobus in zijn brief, Jam 2:25, haar ene hoer noemt, zo schijnt dat zij van beide deze dingen belijdenis gedaan heeft; gelijk onder de heidenen meermalen geschiedde, dewijl ook van haren man geen gewag wordt gemaakt, Jos 2:18. Dan, daarna tot God gekeerd zijnde, is zij een exempel van geloof en vroomheid geworden en onder de Israëlieten getrouwd met Salmon, den vader van Boaz, een der voorouders van David en vervolgens ook van Christus. Zie Mat 1:5."},{"catchword":"de ongehoorzamen,","tekst":"Dat is, de andere halsstarrige en onboetvaardige mensen binnen Jericho."},{"catchword":"met vrede had ontvangen","tekst":"Dat is, beleefd en hun in alles behulpzaam zijnde."}],"32":[{"catchword":"de profeten;","tekst":"Namelijk die na Samuël en David onder het volk van Israël zijn geweest."}],"33":[{"catchword":"koninkrijken hebben overwonnen,","tekst":"Namelijk als Jozua een en dertig koningen, en David al de omliggenden rondom het land Kanaän heeft overwonnen."},{"catchword":"gerechtigheid geoefend,","tekst":"Namelijk niet alleen in het leiden van een rechtvaardig leven, maar ook in het oefenen van openlijke rechtzaken, gelijk vele godzalige rechters en koningen hebben gedaan."},{"catchword":"de beloftenissen verkregen,","tekst":"Dat is, de vervulling der beloften, die hun geschied waren, gelijk daar was de bezitting van het land Kanaän en van enige bijzonder weldaden, als aan Sara, Anna, enz., en ook in het algemeen van vergeving der zonden, aanneming tot kinderen en de erve van het eeuwige leven. Zie hiervoren vs.16; Act 15:11."},{"catchword":"de muilen der leeuwen toegestopt;","tekst":"Namelijk gelijk Simson, Jdg 14:6; David, 1Sa 17:34, en Daniël, Dan 6:23."}],"34":[{"catchword":"De kracht des vuurs hebben uitgeblust,","tekst":"Namelijk gelijk de metgezellen van Daniël; Dan 3:25."},{"catchword":"de scherpte des zwaards zijn ontvloden,","tekst":"Grieks de monden des zwaards; namelijk gelijk David het zwaard van Saul, 1Sa 20; Elia het zwaard van Achab, 1Ki 19; Elisa het zwaard der Syriërs, 2Ki 6."},{"catchword":"uit zwakheid krachten hebben gekregen,","tekst":"Namelijk gelijk Job, Job 42; David, Psa 6; Hiskia, Isa 38."},{"catchword":"in den krijg sterk geworden zijn,","tekst":"Namelijk gelijk vele rechters en koningen."},{"catchword":"heirlegers der vreemden op de vlucht hebben gebracht","tekst":"Namelijk gelijk Jonathan; 1Sa 14."}],"35":[{"catchword":"De vrouwen hebben hare doden","tekst":"Als de weduwe van Sarepta door Elia; 1Ki 17, en de Sunamietische vrouw, 2Ki 4, door Elisa."},{"catchword":"uit de opstanding [weder-","tekst":"gekregen;] Dat is, nadat zij door de profeten uit den dood opgewekt waren."},{"catchword":"uitgerekt geworden,","tekst":"Namelijk als het vel op een trommel, om daarna met stokken ter dood geslagen en gepijnigd te worden, gelijk het Griekse woord medebrengt. En hier ziet de apostel ook op het voorbeeld van Eleazarus en dergelijke pijnigingen onder den tiran Antiochus, waarvan te lezen is 2Mach.6:18, enz."},{"catchword":"de [aangeboden","tekst":"] Namelijk die door de dienaars van Antiochus was aangeboden, indien hij maar toegaf tegen Gods wet te doen, gelijk zij verzochten."},{"catchword":"een betere opstanding verkrijgen zouden","tekst":"Namelijk hiernamaals ten uitersten dage; Dan 12:2."}],"36":[{"catchword":"bespottingen en geselen geproefd,","tekst":"Namelijk gelijk Micha, 1Ki 22, Amos, Jeremia, enz."}],"37":[{"catchword":"gestenigd geworden,","tekst":"Als Zacharias de zoon van Jojada; 2Ch 24."},{"catchword":"in stukken gezaagd,","tekst":"Gelijk de oude Joodse geschiedenissen getuigen van Jesaja onder de tirannie van Manasse. Waaruit blijkt, dat de apostel niet alleen uit de Schrift, maar ook uit andere den Hebreën bekende geschiedenissen voorbeelden verhaalt; gelijk bij vs.35 ook is aangetekend."},{"catchword":"verzocht,","tekst":"Namelijk door zware dreigementen en pijnigingen."},{"catchword":"door het zwaard ter dood gebracht;","tekst":"Grieks door den dood van het zwaard; gelijk velen ten tijde van Manasse, 2Ki 21:16, en onder andere tirannen."},{"catchword":"hebben gewandeld","tekst":"Grieks hebben omgegaan; namelijk hier en daar dwalende."},{"catchword":"schaapsvellen","tekst":"Gelijk van Elia betuigd wordt, 2Ki 1:8, en gelijk der profeten dracht in het algemeen was, gelijk te zien is Zec 13:4."}],"38":[{"catchword":"niet waardig was","tekst":"De wereldse mensen hielden zulke gelovigen voor uitvaagsel der wereld, maar de apostel getuigt daarentegen, dat de wereld hun niet waardig was, en dat daarom God hen als buiten het gezelschap der wereld onderhield; gelijk David lang in de wildernissen dwaalde, 1 Sam. 22, 23, 24; Elia onder Achab, 1Ki 19, en die honderd profeten die in de spelonken verstoken waren, 1Ki 18, gelijk ook vele anderen, waarvan de geschiedenissen gewag maken."}],"39":[{"catchword":"deze allen,","tekst":"Namelijk van wie in dit hfdst. melding wordt gemaakt."},{"catchword":"hebben de belofte niet verkregen;","tekst":"Dat is, de beloofde zaak, namelijk Christus in het vlees geopenbaard, met de vervulling van al de schaduwen van het Oude Testament, en den stand der Kerk onder Hem door de gehele wereld beloofd. Zie Luk 10:23-24."}],"40":[{"catchword":"wat beters over ons voorzien had,","tekst":"Namelijk dat in onzen tijd dit alles zou volbracht worden."},{"catchword":"opdat zij","tekst":"Of zo dat zij zonder ons, enz."},{"catchword":"zonder ons niet zouden volmaakt worden","tekst":"Sommigen verstaan dit van hunne zaligheid in den hemel; doch dit zou strijden tegen hetgeen op het exempel van Henoch is aangetekend, vs.5, en tegen hetgeen van hun hoop hiervoren is gezegd, vs.16, en tegen de belofte van Christus, Mat 5:12, en andere plaatsen der Schrift, ook tegen den tijd waarin Paulus dit schreef, toen Christus lang was opgevaren ten hemel, en derhalve ook de voorvaders in den hemel, zelfs naar hun gevoelen waren gebracht. Zo wordt dan dit verstaan van de komst van Christus in het vlees, en van de volmaking van den stand der Kerk onder het Nieuwe Testament, gelijk tevoren is aangewezen. Want ware de volmaaktheid in het Oude Testament geweest, zo zou het Nieuwe niet nodig zijn geweest, en zij zouden hunnen volmaking uit een andere oorzaak hebben gehad dan wij. Zonder ons, kan dan geschikt genomen worden voor: door een andere oorzaak dan wij."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now faith is a firm ground [Or a firm confidence, i.e. that causeth to subsist, or stand firm, and as it were present, the things which are promised by God in Christ, and which therefore are expected by hope which is not done only by an assent to God&acirc;&euro;&trade;s promises in our understanding, but also by a trusting to the same in our will. See Rom. 4. 18, etc. and above chap. 3. 14. Gr. Hypostasis, i.e. subsistence, of which word, see also 2 Cor. 9. 4. and 11. 17.] of things which are hoped, (and) an argument [or conviction: For faith respecting Gods revelation and promise, convinceth and assureth the heart of man more strongly of the truth of a thing, than any other argument brought forth from natural reason] of things which are not seen. [That is, even which are not comprehended by us, by natural sense or reason; Or which are not present before our deed believed also, as Christ speaketh to Thomas, Joh. 20. 29. notwithstanding this is not properly divine faith, which is wrought in us by the Holy Ghost, which looks only at God&acirc;&euro;&trade;s promise or revelation, whether the things be now past, present or to come: as will appear by the examples which Paul produceth.]"}],"2":[{"catchword":null,"tekst":"For by the same the Ancients [Namely, Forefathers, from whom we are descended, and whose examples we must imitate] obtained testimony. [Namely, that they pleased God, as is expressed, ver. 5.]"}],"3":[{"catchword":null,"tekst":"By faith we understand that the world [Gr. The ages, as chap. 1. ver. 2.] was prepared [That is, created, and brought into such order and form, as now we see it] by the word of God, [That is, by the powerful command of God. See Gen. 1. Psalms 33. 6.] so that the things which we see, were not made of things which are seen. [or, were made not visible, or seen things, i.e. out of nothing: whereunto no Philosopher by natural reason was able to attain.]"}],"4":[{"catchword":null,"tekst":"By faith Abel offered to God a greater sacrifice then Cain, [some take this word greater for of greater price, because Abel made his offering of his fattest beasts, and Cain but of some flight fruits. But the same word is here as fitly taken for more worthy, and more acceptable to God, which the Apostle testifieth that it was done by the faith of Abel: namely, because Abel in this offering looked to that seed of the woman, which should tread upon the Serpents head, i.e. unto Christ, who by his death should destroy the Devil, Heb. 2. 14.] by which [namely, faith] he obtained witness that he was righteous. [this is not in so many words indeed, Gen. 4. 4. but the Apostle concludes the same out of that which is there expressed, that God respected him and his sacrifice, which title of righteousness Christ also therefore gives to Abel, Mat. 23. 35.] seeing God gave testimony of his gifts, [namely, by Moses, Gen. 4. 4. or by an extraordinary sign from heaven concerning his sacrifice, as was done concerning Aaron&acirc;&euro;&trade;s sacrifice, Lev. 9. 24. concerning Elias&acirc;&euro;&trade;s, 1 Kin. 18. 38. Davids, 1 Chron. 21. 26. Solomons, 2 Chron. 7. 1. by sending of fire from heaven: which is therefore probable, because Cain seeing the same, was kindled with wrath and envy towards his brother] and by the same (faith) he speaketh still, [namely, not only by his good example in Gods word, but also by his blood, which after his death cried unto God for vengeance. See Gen. 4. 10. Heb. 12. 24.] since he is dead."}],"5":[{"catchword":null,"tekst":"But faith Enoch was taken away [Gr. Translated, Namely, from earth into heaven, as is expressed concerning Elias, 2 Kin. 2. 1.] that he should not see death, [that is, suffer or feel: as this word see is also taken, Psal. 16. 10. Joh. 8. 51. From whence it appears that his body put off immortality in this taking up into heaven, and was into an immortal and glorified body, as may be read concerning Elias, Luk. 9. 30. and of all believers at the last day, 1 Cor. 15, 51. and Thes. 4. 15.] and he was not found, because that God had taken him away: for before his taking away he had testimony that he pleased God. [This indeed the Text saith not, Gen. 5. 22. but the Apostle concludes this from that which is there exprest, that he continually walked before God.]"}],"6":[{"catchword":null,"tekst":"For without faith it is impossible to please (God) [Or it is impossible that he pleased God, namely, to eternal salvation. The reason is, because no man can so please God without Christ, Joh. 14. 6. Act. 12. 4.] for he that cometh to God [that is, he that steadfastly walketh before God, as Moses speaketh of Enoch, Gen. 5. 22, 24. Or he that serveth God, and seeketh to enjoy his favour] must believe that he is, [namely, not only an essential being, but also such a one as he hath revealed himself in his word, not accordingly to the Law, but according to the Gospel, which the faith whereof Paul here speaketh properly respecteth, Rom. 1. ver. 16. 17.] and is a rewarded [ or reward-giver, recompenser, i.e. performer of his promises in rewarding of them which seek him. For this reward cannot be hoped for but by a promise going before, which faith looketh at. Which here must necessarily be, not a promise of the Law, but of the Gospel, forasmuch as no man can be partaker of the promise of the eternal inheritance by the Law. See Gal. 3. 18.] of them that seek him. [namely, by the way revealed in the Gospel, Joh. 17. 3.]"}],"7":[{"catchword":null,"tekst":"By faith Noah, being admonished by a divine oracle of the things which were not as seen, [That is, which were not yet present. Namely of the flood, and of his preservation of the Ark (and) being afraid [namely, with a reverential and filial fear of God&acirc;&euro;&trade;s threatening against the world, and of God&acirc;&euro;&trade;s promises unto him] prepared the Ark for the preservation of his household: by which (Ark) he condemned the world [namely, by his example, in the presence of all, as Matth. 12. 41, 42.] and became an heir of the righteousness which is according to faith: [that is, partaker or possessor, not only of his life whereof the ungodly Cham was also partaker, but also of eternal life, which is obtained only by the righteousness of faith, Rom. 4. 13. etc.]"}],"8":[{"catchword":null,"tekst":"By faith Abraham being called [Namely, out of Ur in Chaldea. See Act. 7. 2. & c.] was obedient, to go forth unto the place [that is, to the land of Canaan, although this was not yet made known to him at his first calling. See Gen. 12. 1.] which he should receive for inheritance: and he went forth not knowing he should come."}],"9":[{"catchword":null,"tekst":"By faith he was an inhabitant in the land of promise as in a strange land and dwells in tabernacle [namely as strangers and travelers used to do that they might be able to make them up again and carry them to other places as with us tents are wont to be used for this purpose ] with Isaac and Jacob who were co-heirs of the same promise [namely of the future possession of the land of Canaan and consequently also of eternal life .]"}],"10":[{"catchword":null,"tekst":"For the expected city [that is heaven or the heavenly Jerusalem whereby the land of Canaan afterwards Jerusalem also were but shadows ]which hath foundations [namely which are firm and unmovable and the apostle opposeth this to the tabernacle which had no foundation see hereafter chapter 13.14 Rev 3:12 and 21.2 &c] whose artificer [that is delineator or order according to art as used to be done before men proceed to build of cities ] and builder is God."}],"11":[{"catchword":null,"tekst":"By faith Sarah herself received power to give seed [Gr for casting or laying a foundation of seed which is not understood of Abraham only from whom Sarah received seed but also of Sarah herself who is in conception of the power of faith gave her own seed thereunto that as is done in all natural conception see also Levit. 12.2 ] and beyond the time of her age [namely seeing she was now ninety years old and besides that barren see Gen 161:1 Rom 4:19] she brought forth for as much as she esteemed him faithfully who had promised it [for although Sarah laughed at it in the beginning yet nevertheless afterwards she held fast to the promise.]"}],"12":[{"catchword":null,"tekst":"Therefore also from one and that one dead [namely not only in respect of Sarah ,but also of himself as Paul declares Rom 4:19 that Abraham therefore after the death of Sarah got divers children more by Ketura must be ascribed to the new youth which he received by this new promise ]were born so many in multitudes as the stars of heaven and as the sand that is on the sea shores [Gr lip] which is innumerable."}],"13":[{"catchword":null,"tekst":"These all died in faith not having obtained the promises [that is the thing that was divers time promised them of the propriety of the land of Canaan and the seed wherein all generations of the earth should be blessed ] but saw the same afar off and believed and embraced them and confessed that they were guests and strangers upon earth [ as is exprestly testified by Jacob when he stood before Pharaoh Gen. 47.9 & of others before and after him Gen 15:13 and 28.4 Psa 39:13]"}],"14":[{"catchword":null,"tekst":"For they that say such things [namely that they are strangers and guests upon earth ]show clearly that they seek a country [namely that is out of this world in heaven as is declared in verse 16.]"}],"15":[{"catchword":null,"tekst":"And if they had been mindful of that country from which they had gone forth [namely hereupon earth as was the land of Mesopotamia and Chaldea from whence Abraham and his family was gone forth they might have time to return."}],"16":[{"catchword":null,"tekst":"But now are they disastrous of a better that is of the heavenly therefore God is now ashamed of them [that is disdaineth not ]to be called their God [namely even after their death as he is everywhere called their God of Abraham Isaac and Jacob see Exo 3:6 from whence Christ himself concludes that therefore these were not children of God only while they lived upon earth but that their bodies should also rise again seeing God is not a God of the dead but of a living Mat 22:31,32] for he had prepared them a city [namely which had foundation in heaven wherein God himself revealed his glory and should receive them as true citizens Php 3:20]"}],"17":[{"catchword":null,"tekst":"By faith Abraham when he was tempted [that is was tried or was required by God to give a firm evidence of his obedience Genesis 22.] offered Isaac [that is was ready to offer him and was busied in offering him] and he that hath received the promises offered his only begotten [so Isaac was called because he only was born of free women and Ishmael of the bond women was no true heir.]"}],"18":[{"catchword":null,"tekst":"Unto whom [or of whom as the Greek word pros may also be so taken chapter 1 verse 7,8] it was said in Isaac shall the seed he called thee reasoning [ that is concluding or considering with himself by faith which stood fast on Gods promises ]that God was able to raise him even from the dead."}],"19":[{"catchword":null,"tekst":"From whence also by similitude got him again [this the apostle adds because he was already to be account him dead whom God commanded to be slain out which state as a state of death he afterwards received him again when God hindered him from this.]"}],"20":[{"catchword":null,"tekst":"By faith Isaac blessed his sons Jacob and Esau concerning things to come [that is in his blessing so divided the land of Canaan and parts adjacent and so subjected to Esau posterity as if they had already had the full possession therefore .]"}],"21":[{"catchword":null,"tekst":"By faith Jacob dying [that is being near unto death on his death bed] blessed each one of sons of Joseph and worshipped [namely of his staff as is some perversely think but on /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {

        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
