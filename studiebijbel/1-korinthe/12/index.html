:"../../genesis/1/"},{"naam":"Exodus","href":"../../exodus/1/"},{"naam":"Leviticus","href":"../../leviticus/1/"},{"naam":"Numeri","href":"../../numeri/1/"},{"naam":"Deuteronomium","href":"../../deuteronomium/1/"},{"naam":"Jozua","href":"../../jozua/1/"},{"naam":"Richteren","href":"../../richteren/1/"},{"naam":"Ruth","href":"../../ruth/1/"},{"naam":"1 Samuël","href":"../../1-samuel/1/"},{"naam":"2 Samuël","href":"../../2-samuel/1/"},{"naam":"1 Koningen","href":"../../1-koningen/1/"},{"naam":"2 Koningen","href":"../../2-koningen/1/"},{"naam":"1 Kronieken","href":"../../1-kronieken/1/"},{"naam":"2 Kronieken","href":"../../2-kronieken/1/"},{"naam":"Ezra","href":"../../ezra/1/"},{"naam":"Nehemia","href":"../../nehemia/1/"},{"naam":"Esther","href":"../../esther/1/"},{"naam":"Job","href":"../../job/1/"},{"naam":"Psalmen","href":"../../psalmen/1/"},{"naam":"Spreuken","href":"../../spreuken/1/"},{"naam":"Prediker","href":"../../prediker/1/"},{"naam":"Hooglied","href":"../../hooglied/1/"},{"naam":"Jesaja","href":"../../jesaja/1/"},{"naam":"Jeremia","href":"../../jeremia/1/"},{"naam":"Klaagliederen","href":"../../klaagliederen/1/"},{"naam":"Ezechiël","href":"../../ezechiel/1/"},{"naam":"Daniël","href":"../../daniel/1/"},{"naam":"Hosea","href":"../../hosea/1/"},{"naam":"Joël","href":"../../joel/1/"},{"naam":"Amos","href":"../../amos/1/"},{"naam":"Obadja","href":"../../obadja/1/"},{"naam":"Jona","href":"../../jona/1/"},{"naam":"Micha","href":"../../micha/1/"},{"naam":"Nahum","href":"../../nahum/1/"},{"naam":"Habakuk","href":"../../habakuk/1/"},{"naam":"Zefanja","href":"../../zefanja/1/"},{"naam":"Haggaï","href":"../../haggai/1/"},{"naam":"Zacharia","href":"../../zacharia/1/"},{"naam":"Maleachi","href":"../../maleachi/1/"},{"naam":"Mattheüs","href":"../../mattheus/1/"},{"naam":"Markus","href":"../../markus/1/"},{"naam":"Lukas","href":"../../lukas/1/"},{"naam":"Johannes","href":"../../johannes/1/"},{"naam":"Handelingen","href":"../../handelingen/1/"},{"naam":"Romeinen","href":"../../romeinen/1/"},{"naam":"1 Korinthe","href":"../../1-korinthe/1/"},{"naam":"2 Korinthe","href":"../../2-korinthe/1/"},{"naam":"Galaten","href":"../../galaten/1/"},{"naam":"Efeze","href":"../../efeze/1/"},{"naam":"Filippenzen","href":"../../filippenzen/1/"},{"naam":"Kolossenzen","href":"../../kolossenzen/1/"},{"naam":"1 Thessalonicenzen","href":"../../1-thessalonicenzen/1/"},{"naam":"2 Thessalonicenzen","href":"../../2-thessalonicenzen/1/"},{"naam":"1 Timotheüs","href":"../../1-timotheus/1/"},{"naam":"2 Timotheüs","href":"../../2-timotheus/1/"},{"naam":"Titus","href":"../../titus/1/"},{"naam":"Filemon","href":"../../filemon/1/"},{"naam":"Hebreeën","href":"../../hebreeen/1/"},{"naam":"Jakobus","href":"../../jakobus/1/"},{"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}]},"vertalingen":{"SVnu":{"1":"En over de geestelijke *gaven*, broeders, wil ik niet dat u onwetend bent.","2":"U weet dat u heidenen was, meegetrokken naar de stomme afgoden, naardat u geleid werd.","3":"Daarom maak ik u bekend, dat niemand die door de Geest van God spreekt, Jezus een vervloeking noemt; en niemand kan zeggen dat Jezus de Heere is, dan door de Heilige Geest.","4":"En er is verscheidenheid van gaven, maar het is dezelfde Geest;","5":"en er is verscheidenheid van bedieningen, en het is dezelfde Heere;","6":"en er is verscheidenheid van werkingen, maar het is dezelfde God, Die alles in allen werkt.","7":"Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is.","8":"Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest;","9":"en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.","10":"En aan een ander de werkingen van krachten; en aan een ander profetie; en aan een ander het onderscheiden van geesten; en aan een ander allerlei talen; en aan een ander uitleg van de talen.","11":"Doch al deze dingen werkt één en dezelfde Geest, Die aan ieder afzonderlijk uitdeelt zoals Hij wil.","12":"Want zoals het lichaam één is en veel leden heeft, en al de leden van dit ene lichaam, hoewel het er veel zijn, toch één lichaam zijn, zo is het ook met Christus.","13":"Want ook wij allen zijn door één Geest tot één lichaam gedoopt; hetzij Joden, hetzij Grieken, hetzij dienstknechten, hetzij vrijen; en wij zijn allen tot één Geest gedrenkt.","14":"Want ook het lichaam is niet één lid, maar veel *leden*.","15":"Als de voet zei: Omdat ik de hand niet ben, hoor ik niet bij het lichaam; hoort hij daarom niet bij het lichaam?","16":"En als het oor zei: Omdat ik het oog niet ben, hoor ik niet bij het lichaam; hoort het daarom niet bij het lichaam?","17":"Als het hele lichaam oog was, waar zou dan het gehoor zijn? Als het hele *lichaam* gehoor was, waar zou dan de reuk zijn?","18":"Maar nu heeft God de leden gezet, elk van hen in het lichaam, zoals Hij gewild heeft.","19":"En als zij allemaal maar één lid waren, waar zou dan het lichaam zijn?","20":"Maar nu zijn er wel veel leden, maar toch maar één lichaam.","21":"En het oog kan niet tegen de hand zeggen: Ik heb u niet nodig; en ook niet het hoofd tegen de voeten: Ik heb u niet nodig.","22":"Ja, veeleer zijn de leden van het lichaam die ons het zwakst lijken, juist nodig.","23":"En de leden die ons de minst eervolle van het lichaam lijken, die eren wij des te overvloediger; en onze onsierlijke leden krijgen des te overvloediger versiering.","24":"Terwijl onze sierlijke leden dat niet nodig hebben; maar God heeft het lichaam zo samengevoegd, dat Hij overvloediger eer geeft aan wat tekortkomt,","25":"opdat er geen verdeeldheid in het lichaam zou zijn, maar de leden voor elkaar dezelfde zorg zouden dragen.","26":"En hetzij dat één lid lijdt, alle leden lijden mee; hetzij dat één lid geëerd wordt, alle leden verblijden zich mee.","27":"En u bent het lichaam van Christus, en ieder afzonderlijk een lid ervan.","28":"En God heeft sommigen in de Gemeente gesteld: ten eerste apostelen, ten tweede profeten, ten derde leraars, daarna krachten, daarna gaven van gezondmaking, hulpverleningen, bestuur, allerlei talen.","29":"Zijn zij soms allemaal apostelen? Zijn zij allemaal profeten? Zijn zij allemaal leraars? Doen zij allemaal krachten?","30":"Hebben zij allemaal gaven van gezondmaking? Spreken zij allemaal met *allerlei* talen? Kunnen zij allemaal uitleggen?","31":"Streef daarom naar de beste gaven; en ik wijs u nog een weg, die voortreffelijker is."},"SV":{"1":"En van de geestelijke *gaven*, broeders, wil ik niet, dat gij onwetende zijt.","2":"Gij weet, dat gij heidenen waart, tot de stomme afgoden heengetrokken, naar dat gij geleid werdt.","3":"Daarom maak ik u bekend, dat niemand, die door den Geest Gods spreekt, Jezus een vervloeking noemt; en niemand kan zeggen, Jezus den Heere *te* *zijn*, dan door den Heiligen Geest.","4":"En er is verscheidenheid der gaven, doch het is dezelfde Geest;","5":"En er is verscheidenheid der bedieningen, en het is dezelfde Heere;","6":"En er is verscheidenheid der werkingen, doch het is dezelfde God, Die alles in allen werkt.","7":"Maar aan een iegelijk wordt de openbaring des Geestes gegeven tot hetgeen oorbaar is.","8":"Want dezen wordt door den Geest gegeven het woord der wijsheid, en een ander het woord der kennis, door denzelfden Geest;","9":"En een ander het geloof, door denzelfden Geest; en een ander de gaven der gezondmakingen, door denzelfden Geest.","10":"En een ander de werkingen der krachten; en een ander profetie; en een ander onderscheidingen der geesten; en een ander menigerlei talen; en een ander uitlegging der talen.","11":"Doch deze dingen alle werkt een en dezelfde Geest, delende aan een iegelijk in het bijzonder, gelijkerwijs Hij wil.","12":"Want gelijk het lichaam een is, en vele leden heeft, en al de leden van dit ene lichaam, vele zijnde, *maar* een lichaam zijn, alzo ook Christus.","13":"Want ook wij allen zijn door een Geest tot een lichaam gedoopt; hetzij Joden, hetzij Grieken, hetzij dienstknechten, hetzij vrijen; en wij zijn allen tot een Geest gedrenkt.","14":"Want ook het lichaam is niet een lid, maar vele *leden*.","15":"Indien de voet zeide: Dewijl ik de hand niet ben, zo ben ik van het lichaam niet; is hij daarom niet van het lichaam?","16":"En indien het oor zeide: Dewijl ik het oog niet ben, zo ben ik van het lichaam niet; is het daarom niet van het lichaam?","17":"Ware het gehele lichaam het oog, waar *zou* het gehoor *zijn*? Ware het gehele *lichaam* gehoor, waar *zou* de reuk *zijn*?","18":"Maar nu heeft God de leden gezet, een iegelijk van dezelve in het lichaam, gelijk Hij gewild heeft.","19":"Waren zij alle *maar* een lid, waar *zou* het lichaam *zijn*?","20":"Maar nu zijn er wel vele leden, doch *maar* een lichaam.","21":"En het oog kan niet zeggen tot de hand: Ik heb u niet van node; of wederom het hoofd tot de voeten: Ik heb u niet van node.","22":"Ja veeleer, de leden, die *ons* dunken de zwakste des lichaams te zijn, die zijn nodig.","23":"En die ons dunken de minst eerlijke *leden* des lichaams te zijn, denzelven doen wij overvloediger eer aan; en onze onsierlijke *leden* hebben overvloediger versiering.","24":"Doch onze sierlijke hebben het niet van node; maar God heeft het lichaam *alzo* samengevoegd, gevende overvloediger eer aan hetgeen gebrek *aan* *dezelve* heeft;","25":"Opdat geen tweedracht in het lichaam zij, maar de leden voor elkander gelijke zorg zouden dragen.","26":"En hetzij dat een lid lijdt, zo lijden al de leden mede; hetzij dat een lid verheerlijkt wordt, zo verblijden zich al de leden mede.","27":"En gijlieden zijt het lichaam van Christus, en leden in het bijzonder.","28":"En God heeft er sommigen in de Gemeente gesteld, ten eerste apostelen, ten tweede profeten, ten derde leraars, daarna krachten, daarna gaven der gezondmakingen, behulpsels, regeringen, menigerlei talen.","29":"Zijn zij allen apostelen? Zijn zij allen profeten? Zijn zij allen leraars? Zijn zij allen krachten?","30":"Hebben zij allen gaven der gezondmakingen? Spreken zij allen met *menigerlei* talen? Zijn zij allen uitleggers?","31":"Doch ijvert naar de beste gaven; en ik wijs u een weg, die nog uitnemender is."},"KJV":{"1":"Now concerning spiritual gifts, brethren, I would ➔ not have you ignorant.","2":"Ye know that ye were Gentiles, carried away unto these dumb idols, even as ye were led.","3":"Wherefore I give ➔ you to understand, that no man speaking by the Spirit of God calleth Jesus accursed: and that no man can say that Jesus is the Lord, but by the Holy Ghost.","4":"Now there are diversities of gifts, but the same Spirit.","5":"And there are differences of administrations, but the same Lord.","6":"And there are diversities of operations, but it is the same God which worketh all in all.","7":"But the manifestation of the Spirit is given to every man to profit withal.","8":"For to one is given by the Spirit the word of wisdom; to another the word of knowledge by the same Spirit;","9":"To another faith by the same Spirit; to another the gifts of healing by the same Spirit;","10":"To another the working of miracles; to another prophecy; to another discerning of spirits; to another divers kinds of tongues; to another the interpretation of tongues:","11":"But all these worketh that one and the selfsame Spirit, dividing to every man severally as he will.","12":"For as the body is one, and hath many members, and all the members of that one body, being many, are one body: so also is Christ.","13":"For by one Spirit are ➔ we all baptized into one body, whether we be Jews or Gentiles, whether we be bond or free; and have been ➔ all made to drink into one Spirit.","14":"For the body is not one member, but many.","15":"If the foot shall say, Because I am not the hand, I am not of the body; is it therefore not of the body?","16":"And if the ear shall say, Because I am not the eye, I am not of the body; is it therefore not of the body?","17":"If the whole body were an eye, where were the hearing? If the whole were hearing, where were the smelling?","18":"But now hath ➔ God set the members every one of them in the body, as it hath pleased him.","19":"And if they were all one member, where were the body?","20":"But now are they many members, yet but one body.","21":"And the eye cannot say unto the hand, I have no need of thee: nor again the head to the feet, I have no need of you.","22":"Nay, much more those members of the body, which seem to be more feeble, are necessary:","23":"And those members of the body, which we think to be less honourable, upon these we bestow more abundant honour; and our uncomely parts have more abundant comeliness.","24":"For our comely parts have no need: but God hath tempered ➔ the body together, having given more abundant honour to that part which lacked:","25":"That ➔ there should be no schism in the body; but that the members should have ➔ the same care one for another.","26":"And whether one member suffer, all the members suffer with it; or one member be honoured, all the members rejoice with it.","27":"Now ye are the body of Christ, and members in particular.","28":"And God hath set some in the church, first apostles, secondarily prophets, thirdly teachers, after that miracles, then gifts of healings, helps, governments, diversities of tongues.","29":"Are all apostles? are all prophets? are all teachers? are all workers of miracles?","30":"Have all the gifts of healing? do all speak with tongues? do all interpret?","31":"But covet earnestly the best gifts: and yet shew I unto you a more excellent way."}},"tsk":{"1":[{"kopje":"geestelijke","refs":["1 Kor 12:4-11","1 Kor 14:1-18","1 Kor 14:37","Ef 4:11"]},{"kopje":"wil ik niet","refs":["1 Kor 10:1","2 Ko el":null},{"disp":"1 Joh 5:18","href":"../../1-johannes/5/#v18","ref":"1 Joh 5:18","svLabel":null},{"disp":"1 Joh 5:21","href":"../../1-johannes/5/#v21","ref":"1 Joh 5:21","svLabel":null},{"disp":"2 Joh 1:1","href":"../../2-johannes/1/#v1","ref":"2 Joh 1:1","svLabel":null},{"disp":"3 Joh 1:1","href":"../../3-johannes/1/#v1","ref":"3 Joh 1:1","svLabel":null},{"disp":"Openb 14:4","href":"../../openbaring/14/#v4","ref":"Openb 14:4","svLabel":null},{"disp":"Openb 14:5","href":"../../openbaring/14/#v5","ref":"Openb 14:5","svLabel":null},{"disp":"Openb 18:4","href":"../../openbaring/18/#v4","ref":"Openb 18:4","svLabel":null},{"disp":"Openb 19:8","href":"../../openbaring/19/#v8","ref":"Openb 19:8","svLabel":null}],"kinderen":[]}]},{"topic":"Miracles","href":"../../nave/m/#t-miracles","kinderen":[{"label":"Miraculous Gifts Of The Holy Spirit","href":"../../nave/m/?hl=1Cor.12.31#i13975","refs":[],"kinderen":[{"label":"To be sought after","href":"../../nave/m/?hl=1Cor.12.31#i13985","refs":[{"disp":"1 Kor 12:31","href":"../../1-korinthe/12/#v31","ref":"1 Kor 12:31","svLabel":null},{"disp":"1 Kor 14:1","href":"../../1-korinthe/14/#v1","ref":"1 Kor 14:1","svLabel":null}],"kinderen":[]}]}]}],"torrey":[{"topic":"Miraculous Gifts Of The Holy Spirit","href":"../../torrey/m/#t-miraculous-gifts-of-the-holy-spirit","kinderen":[{"label":"Were to be sought after","href":"../../torrey/m/?hl=1Cor.12.31#i13188","refs":[{"disp":"1 Kor 12:31","href":"../../1-korinthe/12/#v31","ref":"1 Kor 12:31","svLabel":null},{"disp":"1 Kor 14:1","href":"../../1-korinthe/14/#v1","ref":"1 Kor 14:1","svLabel":null}],"kinderen":[]}]}]}},"extern":{"Ps 96:5":"Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemel gemaakt.","Hand 10:36-38":"Dit is het woord dat Hij gezonden heeft aan de kinderen van Israël, terwijl Hij vrede verkondigt door Jezus Christus; Deze is een Heere van allen. U weet de zaak die gebeurd is door geheel Judea, beginnend vanuit Galilea, na de doop die Johannes gepredikt heeft; namelijk dat Jezus van Nazareth, hoe God Hem gezalfd heeft met de Heilige Geest en met kracht; Die het land is doorgegaan, terwijl Hij goeddeed en allen genas die door de duivel overweldigd waren; want God was met Hem.","Ps 21:3":"U hebt hem de wens van zijn hart gegeven, en de uitspraak van zijn lippen hebt U niet geweerd. Sela.","Ef 6:16":"bovenal aangenomen hebbende het schild van het geloof, waarmee u al de vurige pijlen van de boze zult kunnen uitblussen.","1 Tess 4:3":"Want dit is de wil van God, uw heiliging: dat u zich onthoudt van de hoererij;","Joh 14:16":"En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid;","Richt 11:29":"Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.","Ex 8:9":"Doch Mozes zei tegen Farao: Heb de eer boven mij! Tegen wanneer zal ik voor u, en voor uw knechten, en voor uw volk, vurig bidden, om deze kikkers van u en van uw huizen te verdelgen, zodat zij alleen in de rivier overblijven?","1 Petr 4:10":"Ieder bedient, naar de gave die hij ontvangen heeft, daarmee de anderen, als goede uitdelers van de veelsoortige genade van God.","Num 16:29":"Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.","2 Kor 6:6":"in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,","Spr 20:12":"Een horend oor en een ziend oog heeft de HEERE gemaakt, ja, die beide.","1 Petr 1:7":"opdat de beproeving van uw geloof — die veel kostbaarder is dan goud, dat vergaat en toch door het vuur beproefd wordt — bevonden wordt te zijn tot lof, eer en heerlijkheid bij de openbaring van Jezus Christus;","Hand 2:8-11":"En hoe horen wij hen ieder in onze eigen taal, waarin wij geboren zijn? Parthen, Meden en Elamieten, en de inwoners van Mesopotamië, Judea en Cappadocië, Pontus en Asia, En Frygië en Pamfylië, Egypte en de delen van Libië bij Cyrene, en Romeinen die hier wonen, zowel Joden als Jodengenoten,","Ezech 3:16":"Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:","Luk 1:41":"En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;","Ps 94:15":"Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.","2 Sam 7:3-7":"En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?","Ex 3:14":"En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!","Jes 41:14":"Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!","Jes 33:6":"En het zal gebeuren, dat de vastheid van uw tijden, de sterkte van uw redding, wijsheid en kennis zal zijn; de vrees voor de HEERE zal Zijn schat zijn.","Job 9:34":"Laat Hij Zijn roede van op mij wegdoen, en laat Zijn verschrikking mij niet angstig maken;","Hebr 6:2":"van de leer van de dopen, en van de handoplegging, en van de opstanding van de doden, en van het eeuwige oordeel.","Hand 2:41":"Zij dan die zijn woord graag aannamen, werden gedoopt; en er werden op die dag ongeveer drieduizend zielen aan hen toegevoegd.","Ex 33:11":"En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.","Openb 13:6":"En het opende zijn mond tot lastering tegen God, om Zijn Naam te lasteren, en Zijn tabernakel, en hen die in de hemel wonen.","Hebr 4:9":"Er blijft dan een rust over voor het volk van God.","Jes 47:12-15":"Sta nu met uw bezweringen, en met de veelheid van uw toverijen, waarin u gearbeid hebt van uw jeugd af; misschien kunt u voordeel doen, misschien kunt u zich sterken. U bent moe geworden van de veelheid van uw raadslagen; laat nu opstaan die de hemel waarnemen, die naar de sterren kijken, die naar de nieuwe manen voorzeggen; en laat ze u verlossen van die dingen die over u komen zullen. Zie, zij zullen zijn als stoppels, het vuur zal ze verbranden, zij zullen zichzelf niet kunnen rukken uit de macht van de vlam; het zal geen kool zijn om bij te warmen, geen vuur om daarvoor bij neer te zitten.","1 Kor 14:13":"Daarom, wie in een vreemde taal spreekt, die bidt dat hij het mag uitleggen.","Matt 18:3":"en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan.","Num 27:16":"Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,","Deut 32:15":"Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.","Rom 6:3-23":"Of weet u niet dat allen die wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn? Wij zijn dan met Hem begraven door de doop in de dood, opdat, zoals Christus uit de doden opgewekt is tot de heerlijkheid van de Vader, zo ook wij in nieuwheid van leven zouden wandelen. Want als wij met Hem één geworden zijn in de gelijkmaking van Zijn dood, dan zullen wij het ook zijn in de gelijkmaking van Zijn opstanding;","1 Tess 5:24":"Hij, Die u roept, is getrouw, Die het ook doen zal.","Job 16:11":"God heeft mij overgegeven aan de verkeerde, en heeft mij overgeleverd in de handen van de goddelozen.","Joh 13:34":"Een nieuw gebod geef Ik u, dat u elkaar liefhebt; zoals Ik u liefgehad heb, dat u ook elkaar liefhebt.","Deut 14:2":"Want u bent een heilig volk voor de HEERE, uw God; en de HEERE heeft u uitgekozen om Hem tot een volk van het eigendom te zijn, uit alle volken die op de aardbodem zijn.","1 Petr 3:8":"En tenslotte, wees allen eensgezind, meelevend, heb de broeders lief, wees met innerlijke barmhartigheid bewogen, vriendelijk;","Ef 2:11-16":"Denk daarom eraan, dat u, die eertijds heidenen was in het vlees, en die voorhuid genoemd werd door hen die genoemd worden besnijdenis in het vlees, wat met handen gebeurt; dat u in die tijd was zonder Christus, vervreemd van het burgerschap van Israël, en vreemdelingen van de verbonden van de belofte, geen hoop hebbend, en zonder God in de wereld. Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus.","1 Tim 5:22":"Leg niemand haastig de handen op, en heb geen gemeenschap met de zonden van anderen; bewaar uzelf rein.","1 Joh 1:3":"Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.","Rom 15:13":"De God nu van de hoop vervult u met alle blijdschap en vrede in het geloven, opdat u overvloedig mag zijn in de hoop, door de kracht van de Heilige Geest.","Jes 41:26-29":"Wie heeft iets verkondigd van het begin af aan, zodat wij het weten mogen, of van tevoren, zodat wij mogen zeggen: Hij is rechtvaardig? Maar er is niemand die het verkondigt, ook niemand die iets laat horen, ook niemand die uw woorden hoort. Ik, de Eerste, zeg tegen Sion: Zie, zie ze daar! En tegen Jeruzalem: Ik zal iemand geven die een blijde boodschap brengt. Want Ik zag toe, maar er was niemand, zelfs onder hen niet; er was geen raadgever, zodat Ik hen zou kunnen vragen, en zij Mij antwoord zouden geven.","Jes 51:12":"Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?","Ezech 8:12":"Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.","Luk 3:2":"onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.","1 Joh 4:2":"Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God;","Ef 5:11":"En heb geen gemeenschap met de onvruchtbare werken van de duisternis, maar bestraf ze veeleer.","Matt 5:29":"Als dan uw rechteroog u ergert, ruk het uit en werp het van u; want het is beter voor u dat een van uw lichaamsdelen verloren gaat, en niet uw hele lichaam in de hel geworpen wordt.","Jer 17:7":"Gezegend daarentegen is de man die op de HEERE vertrouwt, en wiens vertrouwen de HEERE is!","Ezech 18:5-9":"Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet; Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert; En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;","Jes 62:12":"En zij zullen hen noemen het heilige volk, de verlosten van de HEERE; en u zult genoemd worden de gezochte, de stad, die niet verlaten is.","Ef 3:15":"uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt,","Ps 118:23":"Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen.","Jes 43:21":"Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.","2 Petr 3:8":"Maar dit ene mag u niet onbekend zijn, geliefden, dat één dag bij de Heere is als duizend jaar, en duizend jaar als één dag.","Ps 139:7-10":"Waar zou ik heengaan voor Uw Geest, en waar zou ik heenvlieden voor Uw aangezicht? Als ik opvaar naar de hemel, U bent daar; of maak ik mijn bed in het rijk van de dood, zie, U bent daar. Nam ik vleugels van de dageraad, woonde ik aan het uiterste van de zee;","Ps 36:10":"Want bij U is de fontein van het leven; in Uw licht zien wij het licht.","2 Petr 1:2-8":"Genade en vrede worden u vermeerderd door de kennis van God, en van Jezus, onze Heere; Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd; Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.","Jer 43:7":"en zij trokken naar Egypteland, want zij waren aan de stem van de HEERE niet gehoorzaam; en zij kwamen tot Tachpanhes.","Gen 9:6":"Wie het bloed van een mens vergiet, diens bloed zal door de mens vergoten worden; want God heeft de mens naar Zijn beeld gemaakt.","Hand 11:15":"En toen ik begon te spreken, viel de Heilige Geest op hen, net zoals ook op ons in het begin.","Hand 11:16":"En ik herinnerde mij het woord van de Heere, hoe Hij zei: Johannes doopte wel met water, maar u zult gedoopt worden met de Heilige Geest.","Ex 15:2":"De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!","1 Petr 1:2":"de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.","Ezech 1:3":"Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.","Jak 5:19":"Broeders, als iemand onder u van de waarheid is afgedwaald, en iemand hem bekeert,","Hand 1:5":"Want Johannes doopte wel met water, maar u zult met de Heilige Geest gedoopt worden, niet lang na deze dagen.","1 Kor 13:12":"Want wij zien nu door een spiegel in een duistere afspiegeling, maar dan zullen wij zien van aangezicht tot aangezicht; nu ken ik ten dele, maar dan zal ik kennen, zoals ik ook gekend ben.","Num 22:38":"Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.","Jes 37:23":"Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!","Zach 10:12":"En Ik zal hen sterken in de HEERE, en in Zijn Naam zullen zij wandelen, spreekt de HEERE.","1 Tim 2:15":"Toch zal zij zalig worden door het baren van kinderen, als zij blijft in het geloof, en liefde, en heiliging, met ingetogenheid.","2 Tim 2:17":"En hun woord zal voortvreten als de kanker; onder wie zijn Hymeneüs en Filetus;","Rom 5:3-5":"En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt; En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop; En de hoop beschaamt niet, omdat de liefde van God in onze harten uitgestort is door de Heilige Geest, Die ons gegeven is.","Ps 114:2":"Werd Juda tot Zijn heiligdom, Israël Zijn volkomen heerschappij.","Fil 1:1":"Paulus en Timotheüs, dienstknechten van Jezus Christus, aan alle heiligen in Christus Jezus die te Filippi zijn, met de opzieners en diakenen:","Mal 4:2":"Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.","1 Kor 2:11":"Want wie van de mensen weet wat een mens is, dan de geest van de mens die in hem is? Zo weet ook niemand wat van God is, dan de Geest van God.","Jes 66:18":"Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.","Jak 3:17":"Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.","Hand 1:16":"Mannen broeders, deze Schrift moest vervuld worden, die de Heilige Geest bij monde van David voorzegd heeft over Judas, die de leidsman is geweest van hen die Jezus gevangennamen;","Ps 138:3":"Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.","Jes 61:9-11":"En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft. Ik verheug mij zeer in de HEERE, mijn ziel verblijdt zich in mijn God, want Hij heeft mij bekleed met de klederen van het heil, de mantel van de gerechtigheid heeft Hij mij omgedaan; zoals een bruidegom zich met priesterlijk sieraad versiert, en zoals een bruid zich versiert met haar sieraden. Want zoals de aarde haar spruit voortbrengt, en zoals een tuin datgene wat erin gezaaid is, laat uitspruiten, zo zal de Heere HEERE gerechtigheid en lof laten uitspruiten voor alle volken.","Joh 20:22":"En toen Hij dit gezegd had, blies Hij over hen, en zei tegen hen: Ontvang de Heilige Geest.","1 Joh 3:17-24":"Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem? Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid. En hieraan weten wij dat wij uit de waarheid zijn, en wij zullen ons hart verzekeren voor Hem.","Rom 14:18-21":"Want hij die Christus in deze dingen dient, is God welgevallig, en aangenaam bij de mensen. Laten wij dan najagen wat tot de vrede dient, en wat tot de opbouw van elkaar dient. Verbreek het werk van God niet om het voedsel. Alle dingen zijn wel rein; maar het is kwaad voor de mens die met aanstoot eet.","Tit 3:3":"Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.","Hand 7:56":"En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.","Ezech 2:5":"En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.","Ps 132:13-16":"Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei: Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd. Ik zal haar voedsel rijkelijk zegenen, haar behoeftigen zal Ik met brood verzadigen.","Ps 55:23":"Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.","Joh 12:46":"Ik ben een Licht, in de wereld gekomen, opdat ieder die in Mij gelooft, niet in de duisternis blijft.","1 Tess 1:9":"Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;","Jes 33:20-24":"Bekijk Sion, de stad van onze samenkomsten; uw ogen zullen Jeruzalem zien, een rustige woonplaats, een tent, die niet neergehaald zal worden, waarvan de pinnen in eeuwigheid niet uitgetrokken zullen worden, en waarvan geen touwen verscheurd zullen worden. Maar de HEERE zal daar bij ons heerlijk zijn, het zal een plaats zijn van rivieren, van wijde stromen; geen roeischuit zal daar doorvaren, en geen praalschip zal daar overvaren. Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.","Fil 4:7":"En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.","Jes 44:23":"Zing met vreugde, u hemelen! Want de HEERE heeft het gedaan; juich, u onderste delen van de aarde! U bergen! Maak een groot gedreun met vreugdegezang, u bossen, en al het geboomte daarin! Want de HEERE heeft Jakob verlost, en Zich heerlijk gemaakt in Israël.","Ps 132:15":"Ik zal haar voedsel rijkelijk zegenen, haar behoeftigen zal Ik met brood verzadigen.","1 Petr 1:22":"Nu u uw zielen gereinigd hebt door de gehoorzaamheid aan de waarheid, door de Geest, tot ongeveinsde broederlijke liefde, heb dan elkaar vurig lief uit een rein hart;","Luk 17:5":"En de apostelen zeiden tegen de Heere: Vermeerder ons geloof.","Jes 45:24":"Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.","1 Kor 12:3-6":"Daarom maak ik u bekend, dat niemand die door de Geest van God spreekt, Jezus een vervloeking noemt; en niemand kan zeggen dat Jezus de Heere is, dan door de Heilige Geest. En er is verscheidenheid van gaven, maar het is dezelfde Geest; en er is verscheidenheid van bedieningen, en het is dezelfde Heere;","Ex 19:9":"En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.","1 Kon 17:1":"En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!","Luk 1:17":"En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.","2 Sam 23:2":"De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.","Matt 20:25-28":"En Jezus riep hen bij Zich, en zei: U weet dat de leiders van de volken heerschappij voeren over hen, en de groten macht uitoefenen over hen. Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn; en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.","1 Kor 7:7":"Want ik zou willen dat alle mensen waren zoals ikzelf ben; maar ieder heeft zijn eigen gave van God, de een wel zo, maar de ander zo.","Ef 2:18":"Want door Hem hebben wij beiden de toegang door één Geest tot de Vader.","Rom 3:29":"Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen;","Ps 115:7":"handen hebben zij, maar tasten niet; voeten, maar lopen niet; zij geven geen geluid door hun keel.","Tit 1:15":"Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.","Jer 31:7":"Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël.","1 Tess 5:8":"Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid.","2 Kron 24:20":"En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.","Ezech 3:17":"Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.","Ps 135:16":"Zij hebben een mond, maar spreken niet; zij hebben ogen, maar zien niet;","Luk 6:5":"En Hij zei tegen hen: De Zoon des mensen is ook Heere van de sabbat.","1 Joh 3:9":"Ieder die uit God geboren is, doet de zonde niet, want Zijn zaad blijft in hem; en hij kan niet zondigen, want hij is uit God geboren.","Luk 11:13":"Als u dan, die slecht bent, weet uw kinderen goede gaven te geven, hoeveel te meer zal de hemelse Vader de Heilige Geest geven aan hen die Hem daarom bidden?","Rom 2:18":"En u kent Zijn wil, en beoordeelt wat daarvan verschilt, want u bent onderwezen uit de wet;","2 Kon 19:22":"Wie hebt u gehoond en gelasterd? En tegen wie hebt u de stem verheven, en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!","Ef 6:18":"Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;","Hand 8:15-19":"die, toen zij aangekomen waren, voor hen baden, opdat zij de Heilige Geest zouden ontvangen. (Want Hij was nog op niemand van hen gevallen, maar zij waren alleen gedoopt in de Naam van de Heere Jezus.) Toen legden zij hun de handen op, en zij ontvingen de Heilige Geest.","Job 9:17":"Want Hij vermorzelt mij door een onweer, en vermenigvuldigt mijn wonden zonder oorzaak.","Ezra 5:1":"De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.","Mark 7:21-23":"Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden, diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid. Al deze boze dingen komen van binnenuit voort, en verontreinigen de mens.","Matt 23:8":"Maar u moet niet Rabbi genoemd worden; want Eén is uw Meester, namelijk Christus; en u bent allemaal broeders.","Job 10:9":"Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.","Openb 21:27":"En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.","Jer 10:3":"Want de inzettingen van de volken zijn ijdelheid; want het is hout, dat men uit het woud gehouwen heeft, een werk van de handen van de werkmeester met de bijl.","Joh 3:5":"Jezus antwoordde: Voorwaar, voorwaar, Ik zeg u: Als iemand niet geboren wordt uit water en Geest, kan hij het Koninkrijk van God niet binnengaan.","Ps 25:12":"Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.","Mark 11:24":"Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.","Ef 1:13":"In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;","Ps 48:12-14":"Laat de berg Sion blijde zijn; laat de dochters van Juda zich verheugen, om Uw oordelen wil. Ga rondom Sion, en omring haar; tel haar torens; Zet uw hart op haar vesting; beschouw nauwkeurig haar paleizen, opdat u het aan het volgende geslacht vertelt.","Luk 20:2":"en tegen Hem zeiden: Zeg ons, door welke macht U deze dingen doet; of wie het is die U deze macht heeft gegeven?","Rom 8:9":"Maar u bent niet in het vlees, maar in de Geest, als tenminste de Geest van God in u woont. Maar als iemand de Geest van Christus niet heeft, die komt Hem niet toe.","1 Kor 10:21":"U kunt niet de drinkbeker van de Heere drinken én de drinkbeker van de duivelen; u kunt niet deelhebben aan de tafel van de Heere én aan de tafel van de duivelen.","Jes 61:1-3":"De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.","Lev 22:32":"En u zult Mijn heilige Naam niet ontheiligen, opdat Ik in het midden van de kinderen van Israël geheiligd word; Ik ben de HEERE, Die u heiligt!","Hand 2:17":"En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen.","Luk 6:45":"De goede mens brengt het goede voort uit de goede schat van zijn hart; en de slechte mens brengt het kwade voort uit de kwade schat van zijn hart; want uit de overvloed van het hart spreekt zijn mond.","Joh 17:21-26":"Opdat zij allen één zijn, zoals U, Vader, in Mij, en Ik in U, dat ook zij in Ons één zijn; opdat de wereld gelooft dat U Mij gezonden hebt. En Ik heb hun de heerlijkheid gegeven die U Mij gegeven hebt; opdat zij één zijn, zoals Wij Eén zijn; Ik in hen, en U in Mij; opdat zij volmaakt zijn tot één, en opdat de wereld erkent dat U Mij gezonden hebt, en hen liefgehad hebt, zoals U Mij liefgehad hebt.","1 Kron 22:12":"Laat de HEERE u alleen wijsheid en verstand geven, en u bevel geven over Israël, en dat om de wet van de HEERE, van uw God, te onderhouden.","Fil 3:15":"Laten wij dan, zovelen als wij volmaakt zijn, dit gevoelen; en als u ergens anders over denkt, ook dat zal God u openbaren.","Ex 19:6":"En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.","Zach 14:20":"Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;","1 Joh 2:27":"En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.","Luk 6:14":"Namelijk Simon, die Hij ook Petrus noemde, en Andreas zijn broer, Jakobus en Johannes, Filippus en Bartholomeüs;","Jes 37:10":"Zo moet u spreken tegen Hizkia, de koning van Juda: Laat uw God u niet bedriegen, op Wie u vertrouwt, door te zeggen: Jeruzalem zal niet in de hand van de koning van Assyrië gegeven worden.","Ex 25:9":"Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.","Hand 16:5":"De gemeenten dan werden bevestigd in het geloof, en werden dagelijks talrijker in aantal.","Ps 115:4":"Hun afgoden zijn zilver en goud, het werk van mensenhanden;","Jes 1:27":"Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.","Matt 10:25":"Het is de discipel genoeg dat hij wordt als zijn meester, en de dienstknecht als zijn heer. Als zij de heer des huizes Beëlzebul genoemd hebben, hoeveel te meer dan Zijn huisgenoten!","Job 5:24":"En u zult bevinden dat uw tent in vrede is; en u zult uw woning verzorgen, en zult niet feilen.","Joh 18:37":"Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.","1 Petr 4:6":"Want daarom is ook aan de doden het Evangelie verkondigd, opdat zij weliswaar naar de mens in het vlees geoordeeld zouden worden, maar naar God zouden leven in de geest.","Jer 27:1":"In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:","Ps 125:1":"Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid.","2 Kor 9:8":"En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk.","1 Kron 28:11":"En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;","1 Petr 1:10":"Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;","Ps 25:8":"Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg.","Zach 4:1-7":"En de Engel Die met mij sprak, kwam opnieuw, en Hij wekte mij op, zoals een man die uit zijn slaap opgewekt wordt. En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie, en zie, een geheel gouden kandelaar, en een oliekruikje boven op zijn hoofd, en zijn zeven lampen daarop; die lampen hadden zeven en zeven pijpen, die boven op zijn hoofd waren; En twee olijfbomen ernaast, een aan de rechterzijde van het oliekruikje, en een aan zijn linkerzijde.","Ex 19:19":"Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.","Job 16:14":"Hij heeft mij gebroken met breuk op breuk; Hij is tegen mij aangelopen als een geweldige.","1 Petr 3:11":"hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.","Job 12:10":"In Wiens hand de ziel is van alles wat leeft, en de geest van alle vlees van de mens.","1 Kor 14:39":"Zo dan, broeders, streef ernaar te profeteren, en verhinder niet in vreemde talen te spreken.","Gal 6:15":"Want in Christus Jezus heeft noch besnijdenis enige kracht, noch onbesneden zijn, maar een nieuw schepsel.","Jer 25:3":"Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.","Matt 10:8":"Geneest de zieken; reinigt de melaatsen; wekt de doden op; drijft de duivelen uit. U hebt het voor niets ontvangen, geeft het voor niets.","Jer 7:25":"Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.","Ps 84:12":"Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.","2 Kron 26:5":"Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.","Jes 12:3":"En u zult water scheppen met vreugde uit de fonteinen van het heil;","Jes 2:3":"En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.","Ef 2:20-22":"gebouwd op het fundament van de apostelen en profeten, waarvan Jezus Christus Zelf is de uiterste Hoeksteen; op Wie het hele gebouw, bekwaam samengevoegd, opgroeit tot een heilige tempel in de Heere; op Wie ook u mede gebouwd wordt tot een woonplaats van God in de Geest.","1 Joh 4:4-21":"Kinderen, u bent uit God, en hebt hen overwonnen; want Hij die in u is, is meer dan hij die in de wereld is. Zij zijn uit de wereld; daarom spreken zij uit de wereld, en de wereld hoort hen. Wij zijn uit God. Die God kent, hoort ons; die niet uit God is, hoort ons niet. Hieraan herkennen wij de geest van de waarheid en de geest van de dwaling.","Matt 23:10":"Ook moet u geen meesters genoemd worden; want Eén is uw Meester, namelijk Christus.","1 Joh 2:29":"Als u weet, dat Hij rechtvaardig is, dan weet u, dat ieder, die de rechtvaardigheid doet, uit Hem geboren is.","Deut 4:5":"Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.","Job 9:35":"Dan zal ik spreken en Hem niet vrezen; want zo ben ik niet bij mijzelf.","Jes 44:26":"Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.","Rom 8:9-11":"Maar u bent niet in het vlees, maar in de Geest, als tenminste de Geest van God in u woont. Maar als iemand de Geest van Christus niet heeft, die komt Hem niet toe. En als Christus in u is, dan is wel het lichaam dood om de zonde, maar de geest is leven om de gerechtigheid. En als de Geest van Hem, Die Jezus uit de doden opgewekt heeft, in u woont, zal Hij, Die Christus uit de doden opgewekt heeft, ook uw sterfelijke lichamen levend maken door Zijn Geest, Die in u woont.","1 Tess 4:9":"Wat de broederlijke liefde nu betreft, hebt u niet nodig dat ik u schrijf; want u zelf bent door God geleerd om elkaar lief te hebben.","Fil 4:3":"En ik bid ook u, mijn oprechte metgezel, wees deze vrouwen behulpzaam, die met mij gestreden hebben in het Evangelie, ook met Clemens, en de andere medearbeiders van mij, van wie de namen in het boek van het leven staan.","1 Kor 1:10-12":"Maar ik bid u, broeders, door de Naam van onze Heere Jezus Christus, dat u allen hetzelfde spreekt, en dat er onder u geen scheuringen zijn, maar dat u samengevoegd bent tot eenzelfde zin en tot eenzelfde gevoelen. Want mij is over u bekendgemaakt, mijn broeders, door hen die van het huisgezin van Chloë zijn, dat er twisten onder u zijn. En dit zeg ik, dat ieder van u zegt: Ik ben van Paulus; en ik van Apollos; en ik van Cefas; en ik van Christus.","Joh 15:4":"Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.","Ps 101:4":"Het verkeerde hart zal van mij wijken; de boze zal ik niet kennen.","Joh 14:7":"Als u Mij gekend had, zou u ook Mijn Vader gekend hebben; en van nu af kent u Hem, en hebt Hem gezien.","Jes 41:17":"De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten.","Hebr 12:1":"Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is;","Joh 3:6":"Wat uit het vlees geboren is, dat is vlees; en wat uit de Geest geboren is, dat is geest.","2 Kron 2:6":"Doch wie zou de kracht hebben om voor Hem een huis te bouwen, aangezien de hemelen, ja, de hemel der hemelen, Hem niet bevatten kunnen? En wie ben ik, dat ik voor Hem een huis zou bouwen, behalve om reukwerk voor Zijn aangezicht aan te steken?","1 Kron 21:18":"Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.","Dan 4:35":"En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?","1 Tim 3:15":"maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.","Rom 6:23":"Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.","2 Kor 11:2":"Want ik ben ijverig over u met een ijver van God; want ik heb u toebereid om u als een reine maagd aan één man voor te stellen, namelijk aan Christus.","Hos 1:1":"Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.","Openb 4:5":"En van de troon gingen bliksemflitsen uit, en donderslagen, en stemmen; en zeven vurige lampen waren brandend voor de troon, welke de zeven Geesten van God zijn.","Openb 2:18":"En schrijf aan de engel van de gemeente te Thyatire: Dit zegt de Zoon van God, Die Zijn ogen heeft als een vlam van vuur, en Zijn voeten blinkend koper gelijk zijn:","Hand 2:38":"En Petrus zei tegen hen: Bekeer u, en ieder van u moet gedoopt worden in de Naam van Jezus Christus, tot vergeving van de zonden; en u zult de gave van de Heilige Geest ontvangen.","1 Kor 13:2":"En al zou het zo zijn dat ik de gave van de profetie had, en al de verborgenheden en al de wetenschap wist; en al zou het zo zijn dat ik al het geloof had, zodat ik bergen verzette, en de liefde niet had, dan zou ik niets zijn.","Jes 44:3-5":"Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen. En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken. Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.","Luk 1:74":"dat wij, verlost uit de hand van onze vijanden, Hem zonder vrees zouden dienen,","Num 11:25-29":"Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer. Maar twee mannen waren in het leger overgebleven; de naam van de één was Eldad, en de naam van de ander Medad; en de Geest rustte op hen (want zij waren onder de ingeschrevenen, hoewel zij niet naar de tent waren uitgegaan), en zij profeteerden in het leger. Toen liep een jongen heen, en berichtte het aan Mozes, en zei: Eldad en Medad profeteren in het leger.","Jes 16:12":"En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.","Ezech 20:27":"Daarom, mensenkind, spreek tot het huis van Israël, en zeg tegen hen: Zo zegt de Heere HEERE: Hiermee nog hebben uw vaderen Mij gesmaad, dat zij door overtreding tegen Mij hebben overtreden.","1 Joh 3:9-11":"Ieder die uit God geboren is, doet de zonde niet, want Zijn zaad blijft in hem; en hij kan niet zondigen, want hij is uit God geboren. Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft, want dit is de verkondiging die u vanaf het begin gehoord hebt, dat wij elkaar zouden liefhebben.","Jes 41:18":"Ik zal rivieren openen op de hoge plaatsen, en bronnen in het midden van de valleien; Ik zal de woestijn tot een waterpoel maken, en het dorre land tot waterbronnen.","Joh 15:19":"Als u van de wereld was, zou de wereld het hare liefhebben; maar omdat u van de wereld niet bent, maar Ik u uit de wereld heb uitverkoren, daarom haat de wereld u.","Ezech 40:1":"In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.","1 Kor 8:1":"Wat betreft de dingen die aan de afgoden geofferd zijn: wij weten dat wij allemaal samen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht.","Jes 29:15":"Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?","Ps 147:11":"De HEERE schept vreugde in hen die Hem vrezen, die op Zijn goedertierenheid hopen.","1 Joh 5:18":"Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.","Ef 4:3":"En u inspant om de eenheid van de Geest te bewaren door de band van de vrede.","Ezech 44:6":"En zeg tegen die opstandigen, tegen het huis van Israël: Zo zegt de Heere HEERE: Het is genoeg geweest voor u, vanwege al uw gruwelen, o huis van Israël.","Job 31:15":"Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)","1 Sam 10:10-13":"Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden. En het gebeurde, toen ieder die hem vroeger gekend had, zag dat hij, zie, profeteerde met de profeten, dat het volk zei, de een tegen de ander: Wat is dit, dat de zoon van Kis is overkomen? Is Saul ook onder de profeten? Toen antwoordde een man vandaar, en zei: Wie is toch hun vader? Daarom is het een spreekwoord geworden: Is Saul ook onder de profeten?","Hebr 3:7":"Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort,","1 Tim 6:17":"Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;","Ef 2:14-19":"Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken; en opdat Hij die beiden met God in één lichaam zou verzoenen door het kruis, nadat Hij de vijandschap daaraan gedood had.","Deut 32:6":"Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?","Mark 9:50":"Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.","Rom 2:24":"Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.","Nahum 1:7":"De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.","1 Kor 15:10":"Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.","1 Joh 2:4":"Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;","1 Kor 1:21":"Want omdat de wereld God, in de wijsheid van God, niet door de wijsheid heeft gekend, heeft het God behaagd om door de dwaasheid van de prediking zalig te maken hen die geloven;","Zach 12:1":"De last van het woord van de HEERE over Israël. De HEERE spreekt, Die de hemel uitbreidt, en de aarde grondvest, en de geest van de mens in zijn binnenste formeert.","Ezech 2:2":"Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.","Joh 17:22":"En Ik heb hun de heerlijkheid gegeven die U Mij gegeven hebt; opdat zij één zijn, zoals Wij Eén zijn;","1 Kor 7:21":"Bent u als dienstknecht geroepen, laat u dat niet bekommeren; maar als u ook vrij kunt worden, gebruik dat dan liever.","Ef 4:4":"Eén lichaam is het, en één Geest, zoals u ook geroepen bent tot één hoop van uw roeping;","Hand 15:1-31":"En sommigen, die uit Judea afgekomen waren, leerden de broeders en zeiden: Als u niet besneden wordt naar de wijze van Mozes, kunt u niet zalig worden. Toen er dan geen kleine weerstand en twist ontstond bij Paulus en Barnabas tegen hen, hebben zij afgesproken dat Paulus en Barnabas, en enigen van de anderen, naar de apostelen en oudsten in Jeruzalem zouden opgaan over deze vraag. Zij dan, door de gemeente uitgeleid, reisden door Fenicië en Samaria en vertelden over de bekering van de heidenen; en zij deden alle broeders grote blijdschap aan.","Ps 15:1-5":"Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid? Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;","Num 1:1":"Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:","Mark 9:37":"Wie een van zulke kinderen in Mijn Naam ontvangt, die ontvangt Mij; en wie Mij ontvangt, die ontvangt niet Mij, maar Hem Die Mij gezonden heeft.","Tit 3:5":"Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;","Jes 45:18":"Want zo zegt de HEERE, Die de hemelen geschapen heeft, die God, Die de aarde gevormd heeft, en Die haar gemaakt heeft; Hij heeft haar bevestigd, Hij heeft haar niet geschapen opdat zij leeg zou zijn, maar heeft haar gevormd opdat men daarin zou wonen: Ik ben de HEERE, en niemand meer.","Rom 11:34":"Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?","Jer 31:14":"En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.","Jes 28:16":"Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.","Openb 21:9":"En er kwam naar mij een van de zeven engelen, die de zeven schalen hadden, die vol geweest waren van de zeven laatste plagen, en hij sprak met mij en zei: Kom hier, ik zal u de Bruid tonen, de Vrouw van het Lam.","1 Petr 3:20":"die vroeger ongehoorzaam waren, toen de lankmoedigheid van God eenmaal wachtte, in de dagen van Noach, terwijl de ark klaargemaakt werd; waarin weinige (dat is acht) zielen behouden werden door het water.","Jes 57:19":"Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.","Job 32:7":"Ik zei: Laat de dagen spreken, en de veelheid van jaren wijsheid te kennen geven.","Job 33:11":"Hij legt mijn voeten in de stok; Hij neemt al mijn paden waar.","Ezech 11:20":"Opdat zij wandelen in Mijn inzettingen, en Mijn rechten bewaren en die doen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.","Jer 10:3-16":"Want de inzettingen van de volken zijn ijdelheid; want het is hout, dat men uit het woud gehouwen heeft, een werk van de handen van de werkmeester met de bijl. Men pronkt het op met zilver en met goud; zij hechten het met spijkers en met hamers, opdat het niet waggelt. Zij zijn gelijk een palmboom van dicht werk, maar kunnen niet spreken; zij moeten gedragen worden, want zij kunnen niet gaan; vreest niet voor hen, want zij kunnen geen kwaad doen, ook is er geen goeddoen bij hen.","Spr 11:5":"De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid.","Fil 2:2":"Maak dan mijn blijdschap volkomen, dat u eensgezind bent, dezelfde liefde hebt, één van gemoed en één van gevoelen bent.","1 Sam 19:23":"Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.","Richt 14:6":"Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.","2 Kor 3:8":"hoe zal dan niet veel meer de bediening van de Geest in heerlijkheid zijn?","Joh 12:43":"Want zij hadden de eer van mensen lief, meer dan de eer van God.","Hagg 1:13":"Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.","Rom 8:1":"Er is dan nu geen veroordeling voor hen die in Christus Jezus zijn, die niet naar het vlees wandelen, maar naar de Geest.","Hand 2:30":"Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;","Jes 29:23":"want wanneer hij zijn kinderen, het werk van Mijn handen, zal zien in zijn midden, zullen zij Mijn Naam heiligen; en zij zullen de Heilige van Jakob heiligen, en de God van Israël vrezen.","Jes 11:3":"En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.","Joh 16:14":"Hij zal Mij verheerlijken; want Hij zal het uit het Mijne nemen, en het u verkondigen.","Ef 2:1":"En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;","1 Petr 2:12":"En houd uw levenswandel eerlijk onder de heidenen; opdat, waar zij nu kwaad van u spreken als van kwaaddoeners, zij door de goede werken die zij van u zien, God mogen verheerlijken op de dag dat Hij naar hen omziet.","Matt 6:32":"Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet dat u al deze dingen nodig hebt.","Joh 3:34":"Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate.","Ps 112:7":"Mem. Hij zal voor geen kwaad gerucht bang zijn; Nun. zijn hart is vast, vertrouwend op de HEERE.","Joh 16:15":"Alles wat de Vader heeft, is van Mij; daarom heb Ik gezegd dat Hij het uit het Mijne zal nemen, en het u zal verkondigen.","Jes 41:10":"Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.","Ps 103:7":"Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.","Matt 21:42":"Jezus zei tegen hen: Hebt u nooit gelezen in de Schriften: De steen die de bouwers verworpen hebben, die is geworden tot een hoeksteen; dit is door de Heere gedaan, en het is wonderlijk in onze ogen?","Ef 5:26":"opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord,","1 Kor 15:34":"Word op de juiste manier wakker, en zondig niet. Want sommigen hebben geen kennis van God. Ik zeg dit tot uw schaamte.","1 Petr 5:1-3":"De oudsten die onder u zijn, vermaan ik, die een medeoudste en getuige van het lijden van Christus ben, en deelachtig aan de heerlijkheid die geopenbaard zal worden: Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed; ook niet als heersers over het erfdeel van de Heere, maar als voorbeelden voor de kudde.","Hand 3:6-8":"En Petrus zei: Zilver en goud heb ik niet, maar wat ik heb, dat geef ik u: in de Naam van Jezus Christus de Nazarener, sta op en loop! En hij pakte hem bij de rechterhand en richtte hem op; en meteen werden zijn voeten en enkels stevig. En hij, opspringend, stond overeind en liep, en ging met hen de tempel in, lopend en springend, en God lovend.","Hand 4:8":"Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël!","Jes 36:18":"Laat Hizkia u niet verleiden, door te zeggen: De HEERE zal ons redden; hebben de goden van de volken, ieder zijn eigen land, gered uit de hand van de koning van Assyrië?","Mark 4:20":"En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderdvoud.","Hebr 12:23":"Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;","2 Tim 4:8":"Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.","Fil 1:3":"Ik dank mijn God, zo dikwijls als ik aan u denk.","1 Tim 4:1":"De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen,","Gal 6:2":"Draag elkaars lasten, en vervul zo de wet van Christus.","1 Kor 4:19":"Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.","Ezech 16:14":"Daardoor ging van u een naam uit onder de heidenvolken vanwege uw schoonheid; want die was volmaakt door Mijn heerlijkheid, die Ik op u gelegd had, spreekt de Heere HEERE.","Openb 22:7":"Zie, Ik kom haastig; zalig is hij die de woorden van de profetie van dit boek bewaart.","Jes 59:19":"Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.","Hebr 1:1":"Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;","Hand 15:28":"Want het heeft de Heilige Geest en ons goed gedacht, u geen grotere last op te leggen dan deze noodzakelijke dingen:","Richt 6:7-10":"En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;","Matt 5:20":"Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan.","Jer 17:13":"O HEERE, Israëls Verwachting! Allen die U verlaten, zullen beschaamd worden; en die van Mij afwijken, zullen in de aarde geschreven worden; want zij verlaten de HEERE, de Springader van het levende water.","Hand 28:25":"En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,","Openb 2:7":"Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.","Ex 22:31":"U moet Mij heilige mensen zijn; daarom mag u geen vlees eten dat door wilde dieren op het veld verscheurd is, u moet het aan de honden voorwerpen.","Hand 16:6":"En toen zij Frygië en het land Galatië doorgereisd hadden, werden zij door de Heilige Geest verhinderd het Woord in Azië te spreken.","1 Tess 5:14":"En wij bidden u, broeders, vermaan de ongeregelde mensen, vertroost de kleinmoedigen, ondersteun de zwakken, wees geduldig tegenover allen.","Hab 2:19":"Wee hem die tegen het hout zegt: Word wakker! en: Ontwaak! tegen de zwijgende steen. Zou die kunnen leren? Zie, het is met goud en zilver overtrokken, en er is helemaal geen geest in het midden ervan.","1 Kor 15:38":"Maar God geeft het een lichaam zoals Hij wil, en aan ieder zaad zijn eigen lichaam.","Rom 8:27":"En Hij Die de harten doorzoekt, weet wat het verlangen van de Geest is, omdat Hij naar de wil van God voor de heiligen bidt.","Mark 2:28":"Zo is dan de Zoon des mensen ook Heere van de sabbat.","Spr 14:27":"De vreze van de HEERE is een bron van leven, om af te wijken van de strikken van de dood.","Judas 1:20":"Maar geliefden, bouw uzelf op in uw allerheiligst geloof, en bid in de Heilige Geest;","1 Kor 6:11":"En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.","Ps 45:10-17":"Dochters van koningen zijn onder Uw kostbare hofdames; de Koningin staat aan Uw rechterhand, in het fijnste goud van Ofir. Hoor, o Dochter! en zie, en neig uw oor; en vergeet uw volk en het huis van uw vader. Zo zal de Koning verlangen naar uw schoonheid; omdat Hij uw Heere is, buig u voor Hem neer.","1 Petr 4:19":"Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.","Ps 50:21":"Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.","1 Kor 2:5":"Opdat uw geloof niet zou berusten op wijsheid van mensen, maar op de kracht van God.","Fil 4:19":"Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.","Spr 12:5":"De gedachten van de rechtvaardigen zijn recht; de raadslagen van de goddelozen zijn bedrog.","Jer 18:1":"Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:","Ps 5:2":"O HEERE, neem mijn woorden ter oor; let op mijn overdenking.","Mark 5:20":"En hij ging weg, en begon in het gebied van Dekapolis te verkondigen wat grote dingen Jezus aan hem gedaan had; en zij verwonderden zich allen.","1 Kor 1:10":"Maar ik bid u, broeders, door de Naam van onze Heere Jezus Christus, dat u allen hetzelfde spreekt, en dat er onder u geen scheuringen zijn, maar dat u samengevoegd bent tot eenzelfde zin en tot eenzelfde gevoelen.","1 Petr 2:11":"Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel;","Luk 3:16":"antwoordde Johannes aan allen: Ik doop u wel met water; maar Hij komt Die sterker is dan ik, aan Wie ik niet waardig ben de riem van Zijn schoenen los te maken; Deze zal u dopen met de Heilige Geest en met vuur;","Ps 139:13":"Want U bezit mijn nieren; U hebt mij in de buik van mijn moeder bedekt.","Luk 3:22":"en dat de Heilige Geest op Hem neerdaalde in lichamelijke gedaante, zoals een duif; en dat er een stem uit de hemel kwam, die zei: U bent Mijn geliefde Zoon, in U heb Ik Mijn welbehagen!","Jes 1:17":"Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe.","Mark 3:30":"Want zij zeiden: Hij heeft een onreine geest.","Rom 12:8":"hetzij wie vermaant, in het vermanen; wie uitdeelt, in eenvoud; wie leiding geeft, met ijver; wie barmhartigheid bewijst, met blijmoedigheid.","Ef 6:8":"wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.","1 Kor 1:24":"Maar voor hen die geroepen zijn, zowel Joden als Grieken, prediken wij Christus, de kracht van God, en de wijsheid van God.","Ps 71:17":"O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen.","Jes 55:4":"Zie, Ik heb hem tot een getuige van de volken gegeven, een vorst en gebieder van de volken.","Kol 1:18":"en Hij is het Hoofd van het lichaam, namelijk van de Gemeente, Hij, Die het Begin is, de Eerstgeborene uit de doden, opdat Hij in alles de Eerste zou zijn.","Gal 3:28":"Daarin is geen Jood en geen Griek; daarin is geen slaaf en geen vrije; daarin is geen man en vrouw; want u bent allen één in Christus Jezus.","Ps 129:5":"Laat hen beschaamd worden en achteruitgedreven, allen die Sion haten.","Matt 5:48":"Wees dan volmaakt, zoals uw Vader, Die in de hemelen is, volmaakt is.","Jes 63:10":"Maar zij zijn opstandig geworden, en zij hebben Zijn Heilige Geest smarten aangedaan; daarom is Hij hun in een vijand veranderd, Hij Zelf heeft tegen hen gestreden.","Joh 6:44":"Niemand kan tot Mij komen, als de Vader, Die Mij gezonden heeft, hem niet trekt; en Ik zal hem opwekken op de laatste dag.","Jes 55:1-3":"O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.","2 Petr 1:21":"Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.","Hand 17:17":"Hij sprak dan in de synagoge met de Joden, en met hen die godsdienstig waren, en op de markt elke dag met hen die hij daar aantrof.","2 Kron 20:14":"Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;","1 Tim 6:6":"Maar de godsvrucht is, samen met tevredenheid, een grote winst.","Fil 2:3":"Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.","Hand 2:4-12":"En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken. En er waren Joden die in Jeruzalem woonden, godvruchtige mannen, uit alle volken die er onder de hemel zijn. En toen deze stem gebeurd was, kwam de menigte samen en raakte in verwarring, want ieder hoorde hen in zijn eigen taal spreken.","Ps 133:1":"Een lied Hammaäloth, van David. Zie, hoe goed en hoe fijn is het, dat broeders ook samenwonen!","Mark 10:14":"Maar Jezus zag dit, en nam het Hem zeer kwalijk, en zei tegen hen: Laat de kinderen bij Mij komen, en verhinder ze niet; want voor zulke is het Koninkrijk van God.","Spr 10:2":"Schatten van goddeloosheid geven geen voordeel; maar gerechtigheid redt van de dood.","Jes 62:11":"Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.","Hand 13:9":"Doch Saulus (die ook Paulus genoemd wordt), vervuld met de Heilige Geest, en de ogen op hem gericht houdend, zei:","Ps 52:10":"Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.","2 Kor 8:1":"Verder maken wij u bekend, broeders, de genade van God, die in de gemeenten van Macedonië gegeven is.","1 Kor 11:3":"Maar ik wil dat u weet, dat Christus het Hoofd is van iedere man, en de
