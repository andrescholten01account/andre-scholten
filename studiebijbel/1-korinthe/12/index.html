","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En over de geestelijke *gaven*, broeders, wil ik niet dat u onwetend bent.","2":"U weet dat u heidenen was, meegetrokken naar de stomme afgoden, naardat u geleid werd.","3":"Daarom maak ik u bekend, dat niemand die door de Geest van God spreekt, Jezus een vervloeking noemt; en niemand kan zeggen dat Jezus de Heere is, dan door de Heilige Geest.","4":"En er is verscheidenheid van gaven, maar het is dezelfde Geest;","5":"en er is verscheidenheid van bedieningen, en het is dezelfde Heere;","6":"en er is verscheidenheid van werkingen, maar het is dezelfde God, Die alles in allen werkt.","7":"Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is.","8":"Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest;","9":"en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.","10":"En aan een ander de werkingen van krachten; en aan een ander profetie; en aan een ander het onderscheiden van geesten; en aan een ander allerlei talen; en aan een ander uitleg van de talen.","11":"Doch al deze dingen werkt één en dezelfde Geest, Die aan ieder afzonderlijk uitdeelt zoals Hij wil.","12":"Want zoals het lichaam één is en veel leden heeft, en al de leden van dit ene lichaam, hoewel het er veel zijn, toch één lichaam zijn, zo is het ook met Christus.","13":"Want ook wij allen zijn door één Geest tot één lichaam gedoopt; hetzij Joden, hetzij Grieken, hetzij dienstknechten, hetzij vrijen; en wij zijn allen tot één Geest gedrenkt.","14":"Want ook het lichaam is niet één lid, maar veel *leden*.","15":"Als de voet zei: Omdat ik de hand niet ben, hoor ik niet bij het lichaam; hoort hij daarom niet bij het lichaam?","16":"En als het oor zei: Omdat ik het oog niet ben, hoor ik niet bij het lichaam; hoort het daarom niet bij het lichaam?","17":"Als het hele lichaam oog was, waar zou dan het gehoor zijn? Als het hele *lichaam* gehoor was, waar zou dan de reuk zijn?","18":"Maar nu heeft God de leden gezet, elk van hen in het lichaam, zoals Hij gewild heeft.","19":"En als zij allemaal maar één lid waren, waar zou dan het lichaam zijn?","20":"Maar nu zijn er wel veel leden, maar toch maar één lichaam.","21":"En het oog kan niet tegen de hand zeggen: Ik heb u niet nodig; en ook niet het hoofd tegen de voeten: Ik heb u niet nodig.","22":"Ja, veeleer zijn de leden van het lichaam die ons het zwakst lijken, juist nodig.","23":"En de leden die ons de minst eervolle van het lichaam lijken, die eren wij des te overvloediger; en onze onsierlijke leden krijgen des te overvloediger versiering.","24":"Terwijl onze sierlijke leden dat niet nodig hebben; maar God heeft het lichaam zo samengevoegd, dat Hij overvloediger eer geeft aan wat tekortkomt,","25":"opdat er geen verdeeldheid in het lichaam zou zijn, maar de leden voor elkaar dezelfde zorg zouden dragen.","26":"En hetzij dat één lid lijdt, alle leden lijden mee; hetzij dat één lid geëerd wordt, alle leden verblijden zich mee.","27":"En u bent het lichaam van Christus, en ieder afzonderlijk een lid ervan.","28":"En God heeft sommigen in de Gemeente gesteld: ten eerste apostelen, ten tweede profeten, ten derde leraars, daarna krachten, daarna gaven van gezondmaking, hulpverleningen, bestuur, allerlei talen.","29":"Zijn zij soms allemaal apostelen? Zijn zij allemaal profeten? Zijn zij allemaal leraars? Doen zij allemaal krachten?","30":"Hebben zij allemaal gaven van gezondmaking? Spreken zij allemaal met *allerlei* talen? Kunnen zij allemaal uitleggen?","31":"Streef daarom naar de beste gaven; en ik wijs u nog een weg, die voortreffelijker is."},"SV":{"1":"En van de geestelijke *gaven*, broeders, wil ik niet, dat gij onwetende zijt.","2":"Gij weet, dat gij heidenen waart, tot de stomme afgoden heengetrokken, naar dat gij geleid werdt.","3":"Daarom maak ik u bekend, dat niemand, die door den Geest Gods spreekt, Jezus een vervloeking noemt; en niemand kan zeggen, Jezus den Heere *te* *zijn*, dan door den Heiligen Geest.","4":"En er is verscheidenheid der gaven, doch het is dezelfde Geest;","5":"En er is verscheidenheid der bedieningen, en het is dezelfde Heere;","6":"En er is verscheidenheid der werkingen, doch het is dezelfde God, Die alles in allen werkt.","7":"Maar aan een iegelijk wordt de openbaring des Geestes gegeven tot hetgeen oorbaar is.","8":"Want dezen wordt door den Geest gegeven het woord der wijsheid, en een ander het woord der kennis, door denzelfden Geest;","9":"En een ander het geloof, door denzelfden Geest; en een ander de gaven der gezondmakingen, door denzelfden Geest.","10":"En een ander de werkingen der krachten; en een ander profetie; en een ander onderscheidingen der geesten; en een ander menigerlei talen; en een ander uitlegging der talen.","11":"Doch deze dingen alle werkt een en dezelfde Geest, delende aan een iegelijk in het bijzonder, gelijkerwijs Hij wil.","12":"Want gelijk het lichaam een is, en vele leden heeft, en al de leden van dit ene lichaam, vele zijnde, *maar* een lichaam zijn, alzo ook Christus.","13":"Want ook wij allen zijn door een Geest tot een lichaam gedoopt; hetzij Joden, hetzij Grieken, hetzij dienstknechten, hetzij vrijen; en wij zijn allen tot een Geest gedrenkt.","14":"Want ook het lichaam is niet een lid, maar vele *leden*.","15":"Indien de voet zeide: Dewijl ik de hand niet ben, zo ben ik van het lichaam niet; is hij daarom niet van het lichaam?","16":"En indien het oor zeide: Dewijl ik het oog niet ben, zo ben ik van het lichaam niet; is het daarom niet van het lichaam?","17":"Ware het gehele lichaam het oog, waar *zou* het gehoor *zijn*? Ware het gehele *lichaam* gehoor, waar *zou* de reuk *zijn*?","18":"Maar nu heeft God de leden gezet, een iegelijk van dezelve in het lichaam, gelijk Hij gewild heeft.","19":"Waren zij alle *maar* een lid, waar *zou* het lichaam *zijn*?","20":"Maar nu zijn er wel vele leden, doch *maar* een lichaam.","21":"En het oog kan niet zeggen tot de hand: Ik heb u niet van node; of wederom het hoofd tot de voeten: Ik heb u niet van node.","22":"Ja veeleer, de leden, die *ons* dunken de zwakste des lichaams te zijn, die zijn nodig.","23":"En die ons dunken de minst eerlijke *leden* des lichaams te zijn, denzelven doen wij overvloediger eer aan; en onze onsierlijke *leden* hebben overvloediger versiering.","24":"Doch onze sierlijke hebben het niet van node; maar God heeft het lichaam *alzo* samengevoegd, gevende overvloediger eer aan hetgeen gebrek *aan* *dezelve* heeft;","25":"Opdat geen tweedracht in het lichaam zij, maar de leden voor elkander gelijke zorg zouden dragen.","26":"En hetzij dat een lid lijdt, zo lijden al de leden mede; hetzij dat een lid verheerlijkt wordt, zo verblijden zich al de leden mede.","27":"En gijlieden zijt het lichaam van Christus, en leden in het bijzonder.","28":"En God heeft er sommigen in de Gemeente gesteld, ten eerste apostelen, ten tweede profeten, ten derde leraars, daarna krachten, daarna gaven der gezondmakingen, behulpsels, regeringen, menigerlei talen.","29":"Zijn zij allen apostelen? Zijn zij allen profeten? Zijn zij allen leraars? Zijn zij allen krachten?","30":"Hebben zij allen gaven der gezondmakingen? Spreken zij allen met *menigerlei* talen? Zijn zij allen uitleggers?","31":"Doch ijvert naar de beste gaven; en ik wijs u een weg, die nog uitnemender is."},"KJV":{"1":"Now concerning spiritual gifts, brethren, I would ➔ not have you ignorant.","2":"Ye know that ye were Gentiles, carried away unto these dumb idols, even as ye were led.","3":"Wherefore I give ➔ you to understand, that no man speaking by the Spirit of God calleth Jesus accursed: and that no man can say that Jesus is the Lord, but by the Holy Ghost.","4":"Now there are diversities of gifts, but the same Spirit.","5":"And there are differences of administrations, but the same Lord.","6":"And there are diversities of operations, but it is the same God which worketh all in all.","7":"But the manifestation of the Spirit is given to every man to profit withal.","8":"For to one is given by the Spirit the word of wisdom; to another the word of knowledge by the same Spirit;","9":"To another faith by the same Spirit; to another the gifts of healing by the same Spirit;","10":"To another the working of miracles; to another prophecy; to another discerning of spirits; to another divers kinds of tongues; to another the interpretation of tongues:","11":"But all these worketh that one and the selfsame Spirit, dividing to every man severally as he will.","12":"For as the body is one, and hath many members, and all the members of that one body, being many, are one body: so also is Christ.","13":"For by one Spirit are ➔ we all baptized into one body, whether we be Jews or Gentiles, whether we be bond or free; and have been ➔ all made to drink into one Spirit.","14":"For the body is not one member, but many.","15":"If the foot shall say, Because I am not the hand, I am not of the body; is it therefore not of the body?","16":"And if the ear shall say, Because I am not the eye, I am not of the body; is it therefore not of the body?","17":"If the whole body were an eye, where were the hearing? If the whole were hearing, where were the smelling?","18":"But now hath ➔ God set the members every one of them in the body, as it hath pleased him.","19":"And if they were all one member, where were the body?","20":"But now are they many members, yet but one body.","21":"And the eye cannot say unto the hand, I have no need of thee: nor again the head to the feet, I have no need of you.","22":"Nay, much more those members of the body, which seem to be more feeble, are necessary:","23":"And those members of the body, which we think to be less honourable, upon these we bestow more abundant honour; and our uncomely parts have more abundant comeliness.","24":"For our comely parts have no need: but God hath tempered ➔ the body together, having given more abundant honour to that part which lacked:","25":"That ➔ there should be no schism in the body; but that the members should have ➔ the same care one for another.","26":"And whether one member suffer, all the members suffer with it; or one member be honoured, all the members rejoice with it.","27":"Now ye are the body of Christ, and members in particular.","28":"And God hath set some in the church, first apostles, secondarily prophets, thirdly teachers, after that miracles, then gifts of healings, helps, governments, diversities of tongues.","29":"Are all apostles? are all prophets? are all teachers? are all workers of miracles?","30":"Have all the gifts of healing? do all speak with tongues? do all interpret?","31":"But covet earnestly the best gifts: and yet shew I unto you a more excellent way."}},"tsk":{"1":[{"kopje":"geestelijke","refs":["1 Kor 12:4-11","1 Kor 14:1-18","1 Kor 14:37","Ef 4:11"]},{"kopje":"wil ik niet","refs":["1 Kor 10:1","2 Kor 1:8","1 Tess 4:13","2 Petr 3 span class=\"wl wl-kjv\" data-code=\"G5087\">set</span> <span class=\"wl wl-kjv\" data-code=\"G3303\">some</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G1577\">church,</span> <span class=\"wl wl-kjv\" data-code=\"G4412\">first</span> <span class=\"wl wl-kjv\" data-code=\"G652\">apostles,</span> <span class=\"wl wl-kjv\" data-code=\"G1208\">secondarily</span> <span class=\"wl wl-kjv\" data-code=\"G4396\">prophets,</span> <span class=\"wl wl-kjv\" data-code=\"G5154\">thirdly</span> <span class=\"wl wl-kjv\" data-code=\"G1320\">teachers,</span> after <span class=\"wl wl-kjv\" data-code=\"G1899\">that</span> <span class=\"wl wl-kjv\" data-code=\"G1411\">miracles,</span> <span class=\"wl wl-kjv\" data-code=\"G1534\">then</span> <span class=\"wl wl-kjv\" data-code=\"G5486\">gifts</span> of <span class=\"wl wl-kjv\" data-code=\"G2386\">healings,</span> <span class=\"wl wl-kjv\" data-code=\"G484\">helps,</span> <span class=\"wl wl-kjv\" data-code=\"G2941\">governments,</span> <span class=\"wl wl-kjv\" data-code=\"G1085\">diversities</span> of <span class=\"wl wl-kjv\" data-code=\"G1100\">tongues.</span>","29":"Are <span class=\"wl wl-kjv\" data-code=\"G3361\">all</span> <span class=\"wl wl-kjv\" data-code=\"G652\">apostles?</span> are <span class=\"wl wl-kjv\" data-code=\"G3361\">all</span> <span class=\"wl wl-kjv\" data-code=\"G4396\">prophets?</span> are <span class=\"wl wl-kjv\" data-code=\"G3361\">all</span> <span class=\"wl wl-kjv\" data-code=\"G1320\">teachers?</span> are <span class=\"wl wl-kjv\" data-code=\"G3361\">all</span> workers of <span class=\"wl wl-kjv\" data-code=\"G1411\">miracles?</span>","30":"<span class=\"wl wl-kjv\" data-code=\"G3361\">Have</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> the <span class=\"wl wl-kjv\" data-code=\"G5486\">gifts</span> of <span class=\"wl wl-kjv\" data-code=\"G2386\">healing?</span> do <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">speak</span> with <span class=\"wl wl-kjv\" data-code=\"G1100\">tongues?</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">do</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G1329\">interpret?</span>","31":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> covet <span class=\"wl wl-kjv\" data-code=\"G2206\">earnestly</span> the <span class=\"wl wl-kjv\" data-code=\"G2909\">best</span> <span class=\"wl wl-kjv\" data-code=\"G5486\">gifts:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2089\">yet</span> shew <span class=\"wl wl-kjv\" data-code=\"G1166\">I</span> unto <span class=\"wl wl-kjv\" data-code=\"G5213\">you</span> a <span class=\"wl wl-kjv\" data-code=\"G2596\">more</span> <span class=\"wl wl-kjv\" data-code=\"G5236\">excellent</span> <span class=\"wl wl-kjv\" data-code=\"G3598\">way.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de geestelijke gaven,","tekst":"Hij verstaat daardoor niet zozeer de inwendige geestelijke gave des geloofs en der wedergeboorte, als de uitwendige en wonderbaarlijke gaven, die met oplegging der handen toentertijd sommigen door den Heiligen Geest gegeven werden, en hier genaamd worden gaven, vs.4, en werkingen, vs.6, en verhaald worden vs.8-10."},{"catchword":"dat gij onwetende","tekst":"Namelijk vanwaar die komen, tot welk einde die gegeven worden, en hoe zij gebruikt moeten worden."}],"2":[{"catchword":"tot de stomme","tekst":"Om die te dienen en hen van toekomende dingen te vragen, die noch leven, noch verstand, noch spraak hebben; zie Psa 115:4-7 ; Hab 2:18 ."},{"catchword":"heengetrokken,","tekst":"Namelijk als domme beesten u latende verleiden door allerlei leugens en bedriegerijen. Zie dergelijke 2Ti 2:26 ."},{"catchword":"naardat gij geleid","tekst":"Namelijk van de afgodische papen, waarzeggers en andere instrumenten des duivels, de ene tot den enen, de andere tot den anderen afgod."}],"3":[{"catchword":"door den Geest Gods","tekst":"Gr. in."},{"catchword":"een vervloeking","tekst":"Gr. Anathema; van welk woord zie Act 23:12 ; Rom 9:3 ; Gal 1:8-9 . Dit deden de heidenen en vijanden van den Christelijken godsdienst. Zie Plin. ad Trajan. lib. 10, Epist 97."},{"catchword":"den Heere te zijn","tekst":"Dat is, erkennen en belijden dat Hij is de ware Zoon Gods, de beloofde Messias en Zaligmaker der wereld."},{"catchword":"door den Heiligen Geest","tekst":"Gr. in."}],"4":[{"catchword":"verscheidenheid","tekst":"Gr. daar zijn verscheidenheden; dat is, de gaven zijn velerhande, de ene treffelijker dan de andere, en ook verscheidenlijk gedeeld, aan dezen en niet aan genen, en dat met verscheidene mate. Zie vs.8, enz."},{"catchword":"der gaven, doch","tekst":"Namelijk van profeteren, met vreemde talen spreken en dergelijke, die hierna verhaald worden."},{"catchword":"dezelfde Geest;","tekst":"Namelijk die al deze gaven werkt en uitdeelt, en daarom behoort degene, die de treffelijkste ontvangen heeft, zich daarover niet te verhovaardigen, of dengene, die mindere heeft, te verachten, alzo Hij aan denzelven immers zo treffelijke gaven had kunnen geven als aan den anderen."}],"5":[{"catchword":"der bedieningen,","tekst":"Dat is, kerkelijke diensten, die verhaald worden vs.28."},{"catchword":"dezelfde Heere;","tekst":"Namelijk Jezus Christus, die ze heeft ingesteld, en die den enen beroept tot dezen dienst, en den anderen tot een anderen, alzo het hem belieft. Zie Eph 4:11 ."}],"6":[{"catchword":"der werkingen, doch","tekst":"Dat is, der wonderbaarlijke gaven van gezondmakingen en andere mirakelen. Zie vs.9,10."},{"catchword":"dezelfde God, die","tekst":"Namelijk de Vader door zijn Zoon en Heiligen Geest, wien de werkingen dezer gaven mede toegeschreven worden; Joh 5:19 , Joh 5:21 , en hier, vs.11."}],"7":[{"catchword":"de openbaring des","tekst":"Of, betoning; dat is, de gave, waardoor betoond en bekend wordt dat de Geest zulks in hem gewrocht heeft."},{"catchword":"tot hetgeen oorbaar is","tekst":"Namelijk tot stichting der gemeente, en tot algemenen dienst van allen. En daarom moeten zij ook tot geen ander einde gebruikt worden, niet tot verhovaardiging, of tot verachting van anderen."}],"8":[{"catchword":"het woord der wijsheid,","tekst":"Dat is, de gave van uitnemend wel te verstaan de goddelijke dingen, en dezelve tot zaligheid en dienst der mensen voorzichtig te kunnen toepassen en gebruiken."},{"catchword":"het woord der kennis,","tekst":"Dat is, de gave van wel ervaren te zijn in de Heilige Schrift, en den rechten zin derzelve grondig te verstaan; welke gave sommigen wel hebben, al is het dat zij daarbij niet hebben bekwaamheid om deze kennis, òf anderen mede te delen, òf tot gebruik wel toe te passen."},{"catchword":"door denzelfden Geest;","tekst":"Of, naar denzelfden Geest."}],"9":[{"catchword":"het geloof,","tekst":"Namelijk van wonderen te doen, hetwelk is een bijzonder vertrouwen, dat God hierin ons zal geven, hetgeen wij van Hem in Christus' naam zullen bidden, te boven gaande den loop der natuur. Zie Mat 17:20 ; Act 14:8 ; 1Co 13:2 ."},{"catchword":"door denzelfde Geest","tekst":"Gr. in denzelfden Geest."},{"catchword":"der gezondmakingen","tekst":"Namelijk niet door gewone middelen van medicijnen, maar met een woord, met aanraken of anderszins bij wonder, gelijk Petrus, Act 3:6 , Paulus, Act 28:8 . Zie ook Act 14:3 , en Act 19:11-12 ; Jam 5:14-15 ."},{"catchword":"door denzelfden Geest;","tekst":"Gr. in."}],"10":[{"catchword":"de werkingen der krachten;","tekst":"Hierdoor wordt verstaan de gave om wonderen te doen, niet alleen tot hulp en dienst der mensen, maar ook tot straf der huichelaars of vijanden van Christus en van Zijne leer. Zie Act 5:5 , in Petrus, en Act 13:11 , in Paulus."},{"catchword":"profetie; en een","tekst":"Dat is om toekomende dingen zekerlijk tevoren te zeggen, welke gave gehad hebben Agabus, Act 11:27-28 , en Act 21:10 ; de vier dochters van Filippus, Act 21:9 , of ook om de profetische schriften uit te leggen, tot stichting, vermaning en vertroosting, 1Co 14:3 ; zie Rom 12:7 . Dan, hier schijnt het voor de eerste soort van profeteren genomen te worden."},{"catchword":"onderscheidingen der geesten;","tekst":"Dat is, de gave om de oprechte en valse leraars te onderkennen, en de gemeente voor de valse te waarschuwen. Zie 1Jo 4:1 ."},{"catchword":"menigerlei talen;","tekst":"Gr. soorten van tongen; namelijk die zij niet geleerd hebben, maar die zij door een bijzonder wonder en goddelijke onderwijzing en ingeven kunnen spreken. Zie Mar 16:17 , en Act 2:4 ."},{"catchword":"der talen","tekst":"Gr. der tongen; dat is, die hetgeen in een onbekende taal geschreven of gesproken was, met een bekende taal duidelijk konden uitleggen en anderen, die dezelve niet verstaan, verklaren."}],"11":[{"catchword":"een en dezelfde Geest,","tekst":"Zie vs.4."},{"catchword":"gelijkerwijs Hij wil","tekst":"Namelijk de Heilige Geest, die aan niemand gehouden of door niemands bekwaamheid bewogen zijnde, deze gaven geeft naar zijn vrij believen en welbehagen."}],"12":[{"catchword":"Want gelijk","tekst":"Deze gelijkenis gebruikt ook de apostel, Rom 12:4-5 ; Eph 4:12 , Eph 4:16 , en is zeer bekwaam om de leden van een geestelijk lichaam tot vrede en enigheid te vermanen."},{"catchword":"een is","tekst":"Dat is, niet in vele lichamen verdeeld, zo is ook de algemene Christelijke Kerk maar een geestelijk lichaam, Son 6:9 ; Rom 12:5 ; Eph 2:14 , en Eph 4:4-5 , welke enigheid niemand door twist of scheuringen moet verbreken."},{"catchword":"vele leden heeft,","tekst":"Namelijk hebbende verscheidene gaven, waardigheid en bediening."},{"catchword":"alzo ook Christus","tekst":"Namelijk heeft maar een lichaam, waarvan hij het hoofd is, en dat vele en verscheidene leden heeft. Of, alzo ook Christus, dat is het lichaam van Christus, namelijk de gemeente, die alzo van hun hoofd genaamd wordt."}],"13":[{"catchword":"wij allen","tekst":"Namelijk gelovigen, die tot dit lichaam van Christus als leden behoren."},{"catchword":"zijn door eenen Geest","tekst":"Gr. in enen Geest; dat is, door den Geest der wedergeboorte, die maar een is, en dienvolgens ons ook tot enigheid vermaant en verbindt."},{"catchword":"tot een lichaam","tekst":"Namelijk de gemeente van Christus, die wij ingelijfd worden door den doop, welke het bad der wedergeboorte is, Eph 5:26 ; Tit 3:5 , en ons ook tot enigheid verbindt."},{"catchword":"hetzij Joden,","tekst":"Dat is, van wat afkomst, staat, of rang wij zijn."},{"catchword":"tot eenen Geest","tekst":"Of, door een Geest."},{"catchword":"gedrenkt","tekst":"Dat is, ook het Avondmaal des Heeren, in hetwelk wij allen eenen drank uit eenen drinkbeker drinken, vermaant en verbindt ons dat wij, alle verdeeldheden vermijdende, naar enigheid staan om een geestelijk lichaam en eensgezind te zijn. Dergelijke rede gebruikt de apostel 1Co 10:17 , dat gelijk wij in het Avondmaal allen eens broods deelachtig zijn, wij alzo ook daardoor vermaand worden, dat wij velen een lichaam zijn."}],"14":[{"catchword":"een lid,","tekst":"Namelijk alleen, of bestaat niet uit een lid alleen, maar uit vele en verscheidene, alzo bestaat ook het lichaam der gemeente uit vele leden, die verscheidene gaven en bedieningen hebben, van welke sommigen regeren, anderen geregeerd worden, sommigen leren, anderen geleerd worden, sommigen in de gemeente spreken, en anderen toehoren."}],"15":[{"catchword":"van het lichaam niet;","tekst":"Gr. uit het lichaam niet. Bij den voet en het oor vergelijkt de apostel hier dengen, die mindere gaven of bedieningen hebben in de gemeente, en bij de hand en het oog, die meerdere en treffelijker hebben; en vermaant daarmede de eersten, dat zij den anderen hun grote gaven en bedieningen niet moeten misgunnen, maar met hun staat en toestand tevreden zijn; Deu 28:13 ."}],"17":[{"catchword":"Ware het gehele lichaam","tekst":"De apostel wijst hiermede aan, hoe nodig het is dat in de gemeente deze verscheidenheid der gaven en bedieningen is, tot welstand derzelve."}],"18":[{"catchword":"in het lichaam,","tekst":"Elk namelijk op zijne plaats, en elk tot zijn bijzonder gebruik en dienst voor het gehele lichaam; zo doet hij ook aangaande de leden der gemeente, die hij schikt elk tot zijn bijzonderen dienst, en daartoe elk zijne gaven mededeelt."},{"catchword":"gelijk Hij gewild heeft","tekst":"Zie tevoren vs.11."}],"19":[{"catchword":"Waren zij allen maar","tekst":"Dat is, hadden de leden der gemeente allen enerlei bediening en gaven."},{"catchword":"waar zou het","tekst":"Dat is, hoe zou de gemeente kunnen bestaan, en gesticht worden? Want een lid kan dat niet alleen doen."}],"20":[{"catchword":"vele leden,","tekst":"Namelijk hebbende verscheidene beroepingen, gaven en werkingen."},{"catchword":"doch maar een lichaam","tekst":"Namelijk tot wier nut en stichting elk het zijne moet besteden en toebrengen."}],"21":[{"catchword":"het oog kan niet","tekst":"Dat is, degenen, die de treffelijkste beroepingen, gaven of bedieningen hebben, gelijk mede door het hoofd verstaan worden de voorstanders en regeerders der gemeente."},{"catchword":"de hand","tekst":"Ik heb Dat is, tot degenen, die ook wel treffelijke gaven of bedieningen hebben, maar zo uitnemend niet als het oog. Zie Deu 28:13 ."}],"22":[{"catchword":"die zijn nodig","tekst":"Namelijk tot onderhouding en dienst des gehelen lichaams, want het oog kan niets krijgen of aangrijpen zonder de hand, en het hoofd niet wandelen zonder de voeten."}],"23":[{"catchword":"ons dunken de minst","tekst":"Gene ledematen, aan het lichaam van God geschapen, zijn in zichzelven onaanzienlijk; maar dat sommige daarvoor gehouden worden, dat geschiedt naar het dunken der mensen, volgens het gebruik dat zij in het lichaam hebben."},{"catchword":"doen wij overvloediger","tekst":"Gr. denzelven omzetten wij overvloediger eer; namelijk met dezelve te dekken en dezelve met eerbaarheid te noemen."},{"catchword":"onsierlijke leden","tekst":"Namelijk die mismaakt, verdraaid of verkort zijn, of enig ander gebrek hebben, of die om der eerbaarheid wille moeten gedekt worden."},{"catchword":"overvloediger versiering","tekst":"Alzo men dezelfde gebreken zoekt te dekken of met enig sieraad van kleding te verschonen. Zo behoort men ook te doen de eenvoudigen lidmaten der gemeente, die men daarom niet moet verachten, maar veel meer vereren en hunne gebreken dekken."}],"24":[{"catchword":"hebben het niet van node;","tekst":"Namelijk om meer versierd te worden, zijnde sierlijk genoeg van zichzelven."},{"catchword":"samengevoegd","tekst":"Gr. tezamen gemengd, of getemperd."},{"catchword":"gevende overvloediger eer","tekst":"Dat is, ons lerende en bevelende door de natuurlijke eerbaarheid zulke leden te eren."},{"catchword":"aan hetgeen dezelve","tekst":"Dat is, aan zulk een lid, dat deze eer van doen heeft. Hetwelk ons dan moet vermanen, dat wij hetzelve ook behoren te doen aan de onaanzienlijke lidmaten der gemeente."}],"25":[{"catchword":"geen tweedracht","tekst":"Gr. scheuring; namelijk die noodzakelijk zou ontstaan indien het ene lid het andere niet zou willen dienen naar behoren; en hetzelve zou noodzakelijk strekken tot ondergang des gehelen lichaams. Alzo ook in de gemeente."},{"catchword":"gelijke zorg zouden dragen","tekst":"Gr. dezelve."}],"26":[{"catchword":"zo lijden al de","tekst":"Dat is, tonen metterdaad, dat het hem mede aangaat, en alles toebrengen om het lijdende lid van het lijden te bevrijden. Zo moeten ook doen de leden der gemeente Heb 13:3 ."}],"27":[{"catchword":"gijlieden zijt het","tekst":"De apostel past nu de voorgaande gelijkenis op de gemeente, die het geestelijk lichaam van Christus is, waarvan elk gelovige in het bijzonder een lidmaat is, die zich derhalve tegen zijne medelidmaten alzo behoort te gedragen, gelijk in de gelijkenis aangewezen is, dat de uiterlijke lidmaten eens lichaams tegen elkander doen."},{"catchword":"in het bijzonder","tekst":"Gr. uit een deel; dat is, elk gelovige is een bijzonder lid en deel van hetzelfde lichaam, hetwelk bestaat uit alle delen en lidmaten samengevoegd; zo moet dan elk deel in zijne orde aangezien en geacht worden, en alles toebrengen tot dienst en nut van het geheel."}],"28":[{"catchword":"in de gemeente gesteld,","tekst":"Namelijk om in dezelve enige diensten te bedienen. Van welke bedieningen hij nu verder handelt, tot verklaring van vs.5."},{"catchword":"ten eerste apostelen,","tekst":"Van het woord apostelen, zie Luk 6:13 . Dezen wordt de eerste en voornaamste plaats toegeschreven onder de kerkedienaars des Nieuwen Testaments, omdat zij van Christus zelf zonder middel van mensen geroepen waren, Gal 1:1 , in het leren niet konden dwalen, door de gehele wereld gezonden werden om te prediken, en met bijzondere macht om wonderen te doen en de ongehoorzamen te straffen, voorzien waren."},{"catchword":"ten tweede profeten,","tekst":"Zie vs.10, en Rom 12:7 ; Eph 4:11 ."},{"catchword":"leraars, daarna","tekst":"Dat is, die gewoonlijk geroepen zijn om de Schrift tot stichting der gemeente uit te leggen, en de leer derzelve tegen de valse leraars voor te staan en te verdedigen. Zie Eph 4:11 ."},{"catchword":"krachten, daarna","tekst":"Dat is, die begaafd zijn met de gave om door wonderen de leer te bevestigen, en met macht om de hardnekkigen wonderbaarlijk te straffen."},{"catchword":"gaven der gezondmakingen,","tekst":"Die zulke gave hebben om door wonderen ongeneeslijke en alle andere ziekten te genezen. Zie vs.9."},{"catchword":"behulpsels,","tekst":"Dat is, die de armen en kranken bezorgen en helpen."},{"catchword":"regeringen,","tekst":"Dat is, die gesteld zijn, om de gemeente in goed orde te houden en te bestieren, welke zijn de ouderlingen; Rom 12:8 ; 1Ti 5:17 ."},{"catchword":"menigerlei talen","tekst":"Gr. soorten van tongen. Zie vs.10."}],"29":[{"catchword":"Zijn zij allen apostelen?","tekst":"Dat is, dewijl dan de dienaars der kerk niet alle enerlei, noch evenwaardige bedieningen hebben, zo behoren degenen, die de hoogste hebben, niet te verachten degenen, die een mindere hebben; noch deze behoren de anderen zulks niet te misgunnen, en alzo onder elkander te twisten, maar hun dienst, elk in het zijne, te besteden tot stichting en vrede."}],"30":[{"catchword":"uitleggers?","tekst":"Of, vertalers, namelijk van vreemde talen. Zie vs.10;"},{"catchword":"31","tekst":"Gr. de betere; dat is, hoewel de gaven verscheiden zijn, de ene treffelijker dan de andere, en dat elk met het zijne tevreden zijnde, hoe gering het ook is, hetzelve moet zien te besteden tot het meeste nut en stichting der gemeente, zo is het nochtans ook prijselijk, dat men daarna door behoorlijke middelen trachte, dat men de beste en treffelijkste moge bekomen."},{"catchword":"een weg, die nog","tekst":"Gr. een weg naar uitnemendheid; namelijk die hij in het volgende hoofdstuk 1Co 13 . aanwijst, welke is, dat wij alle twisting, hovaardigheid en verachting nalatende, uit en naar liefde al ons doen aanstellen."}],"31":[{"catchword":"de beste gaven;","tekst":"Gr. de betere; dat is, hoewel de gaven verscheiden zijn, de ene treffelijker dan de andere, en dat elk met het zijne tevreden zijnde, hoe gering het ook is, hetzelve moet zien te besteden tot het meeste nut en stichting der gemeente, zo is het nochtans ook prijselijk, dat men daarna door behoorlijke middelen trachte, dat men de beste en treffelijkste moge bekomen. een weg, die nog Gr. een weg naar uitnemendheid; namelijk die hij in het volgende hoofdstuk 1 Cor. 13. aanwijst, welke is, dat wij alle twisting, hovaardigheid en verachting nalatende, uit en naar liefde al ons doen aanstellen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"AND of spiritual (gifts) [Thereby he understands not so much the inward spiritual gifts of faith and regeneration, as the outward and miraculous gifts which at that time were given to some of the Holy Ghost by laying on of hands, and are here called gifts, v.4. administration, v.5. and operations, v.6. and are rehearsed, v.8,9,10.] brethren, I will not that ye might be ignorant. [namely, from whence they come, to what end they are given, and how they must be used.]"}],"2":[{"catchword":null,"tekst":"Ye that ye were Gentiles, drawn away [Namely, as brute beasts suffering your selves to led away by all manner of lies and deceits. See 2 Tim. 2.26.] unto dumb Idols, [namely, to serve them, and to enquire of them concerning things to come, which have neither life, nor understanding, nor speech. See Psa. 115. v. 4,5,6,7. Hab. 2.18.] according as ye were led. [namely, by the Idolatrous Priests, Sooth-sayers, and other instruments of the devil, the one to one Idol, the other to other.]"}],"3":[{"catchword":null,"tekst":"Therefore I make known unto you that no man that speaketh by [Gr. in] the spirit of God, nameth Jesus a curse: [Gr. Anathema, of which word see Act 32:12. Rom. 9.3. Gal. 1.8,9. This did the Heathen and Enemies of the Christian Religion. See Plin, ad Trajan. Lib. 10. Epist. 97.] and no man can say Jesus (to be) the Lord, [that is, acknowledge and confess that he is the true son of God, the promised Messiah, and Saviour of the world] but by [Gr. in] the Holy Ghost."}],"4":[{"catchword":null,"tekst":"And there is diversity [Gr. there are diversities, That is, the gifts are of many sorts, one more excellent then the other; and is also diversely imparted to this man and not that, and that in divers measure. See v.8. &c.] of gifts, [namely, of prophesying, speaking with strange tongues, and the like, which are hereafter rehearsed] yet it is the same spirit. [namely, which works and distributes all these gifts, and therefore he hath received the most excellent, ought not to proud thereof, or to despise him that hath less, seeing truly he was able to give to the same as excellent gifts as the other.]"}],"5":[{"catchword":null,"tekst":"And there is diversity of administration , [That is, Ecclesiastical ministries which are rehearsed. v.28.] and is the same Lord: [namely, Jesus Christ, who instituted them, and who calleth one to this ministry, and another to another, even as it pleaseth him. See Ephes. 4.11.]"}],"6":[{"catchword":null,"tekst":"And there is diversity of operations, [That is, of the miraculous gifts of healing and other miracles. See v. 9.10.] but it is the same God [namely, the Father, by his Son and the Holy Spirit, to whom the workings of these gifts are ascribed also, Joh 5:19,21. and here v.11.] who worketh all in all."}],"7":[{"catchword":null,"tekst":"But every one is the revelation of the Spirit [Or, showing forth, i.e. the gift whereby is showed and made known that the Spirit hath wrought this in him] given, for that which is profitable. [namely, for edifying of the church, and for the common service of all. And therefore also they must not be used for any other end, and not for the pride and for despising of others.]"}],"8":[{"catchword":null,"tekst":"For to this (man) is given by the spirit the word of wisdom, [That is, the gift of understanding excellently well divine things, and to be able prudently to apply and make use of the same for the salvation and service of men] and to another the word of knowledge, [that is, the gift of being very expert in the holy scripture, and of thoroughly understanding the right sense of the same: which gift some have indeed, albeit that they not fitness withal, either to import this knowledge to others, or well apply it to use] by the same Spirit. [or according to the same Spirit.]"}],"9":[{"catchword":null,"tekst":"And to another Faith [Namely, of working miracles, which is a special confidence that God will herein give us that which we shall ask of him in the name of Christ, beyond the course of nature. See Mat. 17.20. Act 14:8. 1 Cor. 13.2.] by the same Spirit: [Gr. in the same Spirit] and to another the gift of healings [namely, not by ordinary means of medicines, but with a word, by touching, or otherwise by miracle, as Peter, Act 3:6. and Paul, Act 28:8. See also Act 14:3. and chap. 19.v11,12. Jam. 5.14,15.] by [Gr. in] the same Spirit."}],"10":[{"catchword":null,"tekst":"And to another the workings of mighty (works) [ Hereby is understood the gift to work miracles, not only for the help and service of men, but also for the punishment of hypocrites or enemies of Christ and his doctrine. See Act 5:5. in Peter, and Act 23:11. in Paul] and to another Prophecy [that is, certainly to foretell things to come, which gift had Agabus, Act 11:27,28. and 21.10. the four daughters of Philip, Act 21:9. or else to expound the writings of the Prophets for edification, exhortation and consolation, 1 Cor. 14.3. See Rom. 12.7. But here it seems to be taken for the first sort of prophesying] and to another discerning of the Spirits, [that is, the gift to discern true and false teachers, and to give the church warning of the false ones. See 1Jn 4:1.] and to another many kinds of tongues, namely, which have not learned, but with they arte able to speak by a special miracle, and divine instruction and inspiration. See Mark 16.17. & Act 2:4.] and to another interpretation of languages. [Gr. of tongues, i.e. who were able plainly to interpret in a known tongue that which was spoken or written in an unknown tongue, and declare it to other who do not understand it.]"}],"11":[{"catchword":null,"tekst":"But all these things worketh one and the same spirit [See v.4,] imparting to every one in particular, even as he will. [ namely, the Holy Ghost, who being bound to no man, nor moved by any mans fitness, gives these according to his own free will and good pleasure.]"}],"12":[{"catchword":null,"tekst":"For as the body [This similitude the Apostle useth also, Rom. 12.v.4,5. Eph. 4.4,12,16. and is very fit to persuade the members of one spiritual body unto peace and unity] is one, [that is, not divided into many bodies, so is also the universal Christian church but one Spiritual body, Can. 6. 9. Rom. 12. 5. Eph. 2. 14. and 4. 4, 5. which unity none must break by strife or schism] and hath many members, [namely, having diver&acirc;&euro;&trade;s gifts, dignity and administration] and all the members of this one body, being many, are (but) one body: even so also Christ. [namely, hath but one body, whereof he is the head, and that hath many and divers members. Or even so also Christ : i.e. the body of Christ, namely the church, which is so called from its head.]"}],"13":[{"catchword":null,"tekst":"For we all [Namely, believers, who belong to this body of Christ as members] are also by one Spirit [Gr. in one Spirit, i.e. by the Spirit of regeneration, which is but one and consequently also admonisheth and obligeth us unto unity] baptized unto one body, [namely the church of Christ, into which we are ingraffed by baptism, which is the laver of regeneration, Eph. 5. 26. Tit. 3. 5. and obligeth us to unity also] whether it be Jews or Greeks, or servants, or free (men) [that is, of what decent, state or condition soever we be] and we are all made to drink [that is, the Lord&acirc;&euro;&trade;s supper also in which we all drink one drink out of one cup, admonisheth and obligeth us, that avoiding all divisions we seek after unity, to be one spiritual body and of one mind. The like reason the Apostle useth, 1 Cor. 10. 17. that as in the Lords supper we are all partakers of one bread; so we are also admonished thereby that we many are one body] unto one spirit. [or by one Spirit.]"}],"14":[{"catchword":null,"tekst":"For the body also is not one member, [Namely, only, or consists not of one member only, but of many and divers, so also the body of the church consisteth of many members, which have divers gifts and administrations, of which some govern, others are governed, some teach, others are taught, some speak in the church and others hearken] but many (members)."}],"15":[{"catchword":null,"tekst":"If the foot should say, seeing I am not the hand, I am not body: [Gr. not out of the body. To the foot and the ear the Apostle here compares those who have lesser gifts or administrations in the church, and to the hand and eye those that have greater and more excellent: and thereby admonished the first that they must not grudge the others their great gifts and administrations, but the content with their state and condition, Deu. 28. 13] is it therefore not of the body?"}],"16":[{"catchword":null,"tekst":"And if the ear should say, seeing I am not the eye, I am not of the body: is it therefore not of the body?"}],"17":[{"catchword":null,"tekst":"Were the whole body the eye, where (should) the bearing (be)? [The Apostle hereby showeth how needful it is, that this diversity of gifts and administrations should be in the church, for the welfare of the same] Were the whole (body) hearing, where (should) the smelling (be)."}],"18":[{"catchword":null,"tekst":"But now hath God set the members, every one of them in the body, [Each namely in its place, and each for its special use and service for the whole body: so doth he also concerning the members of the church, which he sits each for his particular service, and imparts to every one his gifts for this purpose] even as he should. [See before v. 11.]"}],"19":[{"catchword":null,"tekst":"Were they all (but) one member, [That is, had the members of the church all one kind of administration and gifts] where (should) the body (be?) [that is, how could the church stand and be edified, for one member alone cannot do it.]"}],"20":[{"catchword":null,"tekst":"But now indeed there are many members, [Namely, having divers callings, administrations, gifts, and operations] yet (but) one body. [namely, to whose profit and edification, each must bestow and contribute what he hath.]"}],"21":[{"catchword":null,"tekst":"And the eye [That is; they that have the most excellent callings, gifts, or administrations: as also by the head are understood the principal men and governors of the church] cannot say to the hand, [that is, to those who indeed have also excellent gifts or administrations, but not so excellent as the eye. See Deut. 28. 13.] I have no need of thee: or again the head to the feet, I have no need of you."}],"22":[{"catchword":null,"tekst":"Yea much rather, the members which seem (to us) to be the weakest of the body, they are needful. [Namely, for the sustentation and service of the whole body, for the eye can get or lay hold on nothing without the hand, and the head cannot walk without the feet.]"}],"23":[{"catchword":null,"tekst":"And they that seem to us to be the least honourable (members) of the body; [ No members by God created in the body, are dishonourable in themselves : but that some are so accounted, that happens according to the use they have in the body] on them we put more abundant honour: [Gr. we put about the same more abundant honour. Namely, by covering them, and naming them in terms] and our uncomely (members) [namely, which are misshapen, crooked, or too short, or have any other defect, or which for honours sake must be covered] have more abundant adorning. [seeing men seek to cover these defects, or to beautify them with some ornament of apparel. So ought men also to do the mean members of the Church, which men must not therefore despise, but much rather honour them, and cover their defects.]"}],"24":[{"catchword":null,"tekst":"But our comely have no need of it: [Namely, to be adorned, being comely enough of themselves] but God hath (so) joined the body together, [Gr. mingled or te percd together] giving more abundant honour [ that is teaching and commending us by natural modesty, to honour such members] to that which hath want (of it) [that is, to such a member as hath need of this honour. Which therefore must admonish us, that we also ought to do the same to the meaner members of the church.]"}],"25":[{"catchword":null,"tekst":"That there be no discord [Gr. schism, namely which would necessarily arise, if one member would not serve another as it ought: and the same would necessarily tend to the destruction of the whole body. So also in the Church ] in the body, by the members should take the like [Gr. the same] care for one another."}],"26":[{"catchword":null,"tekst":"And whether it be that one member suffereth, all the members suffer with it: [That is, really show that the same concerns them also, and contribute all to free the suffering member from its suffering. So must the members of the Church do also, Heb. 13. 3.] or that one member is glorified, all the members rejoice with it."}],"27":[{"catchword":null,"tekst":"And ye are the body of Christ, [The Apostle now applies the foregoing similitude to the Church which is the spiritual body of Christ, whereof each believer in particular is a member, who for this cause ought so carry himself towards his fellow-members, as is showed in the comparison that the outward members of one body do towards one another] and members in particular. [Gr. of a part, i.e. each believer is a particular member and part of the same body, which consists of all the parts and members joined together: therefore each part must be respected and esteemed in its own order, and contribute all to the service and benefit of the whole.]"}],"28":[{"catchword":null,"tekst":"And God hath set some in this Church, [Namely, to certain ministries in the same: of which ministries he now treats further, for the exposition of ver. 5.] first Apostles, [of the word Apostles see Luke 6. 13. To these the first and chiefest place is ascribed amongst the ministers of the Church of the new Testament, because they were called by Christ himself without means of men, Gal. 1. 1. could not err in teaching, were sent to preach throughout the whole world, and were furnished with a special power to work miracles, and punish the disobedient] secondly Prophets, [see ver. 10. and Rom. 12. 7. Eph. 4. 11.] thirdly teachers, [that is, who are ordinarily called, to interpret the Scripture for the edification of the Church, and to maintain and defend the doctrine of the same against false teachers. See Eph. 4. 11.] afterward powers [that is, they that are endued with the gift to confirm the doctrine by miracles , and with power miraculously to punish the stiff-necked] after that gifts of healings, [who have such a gift by miracle to cure incurable and all other diseases. See ver. 9. ] helps, [that is, who take care of and help the poor and sick ] governments, [that is, they that are appointed to keep the Church in good order, and to guide them, which are Elders, Rom. 12. 8. 1 Tim. 5. 17.] many kinds of tongues. [Gr. sorts of tongues. See ver. 10.]"}],"29":[{"catchword":null,"tekst":"Are they all Apostles? [That is, seeing then the ministries of the Church have not all administrations of one kind, nor of equal dignity, therefore they that have the highest ought not to despise them who have a lower, neither ought these to grudge the other this, and so to contend one amongst another, but to bestow their service each in his place for edification and peace] are they all Prophets? Are they all teachers? Are they all powers:"}],"30":[{"catchword":null,"tekst":"Have they all gifts of healings? Do they all speak with (many kinds of) tongues? Are they all interpreters? [Or, translators. Namely, or strange languages. See ver. 10.]"}],"31":[{"catchword":null,"tekst":"But be zealous after the best gifts: [Gr. the better, i.e. although the gifts are divers, the one more excellent than the other, and that each one being content with his own, how mean soever it be, must look to bestow the same, for the greatest profit and edification of the Church, yet nevertheless it is commendable also that men by convenient means seek after this, that they may get the best and most excellent] and I show you a way which is yet more excellent. [Gr. a way according to excellency, namely, which he sets forth in the following chapter, which is, that leaving all contention, pride, and despising, we order all our actions out of, and according to love.]"}]}}};

(function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
