geweten, dat zwak is, wordt hierdoor bevlekt.","8":"Het voedsel nu maakt ons bij God niet aangenaam; want of wij eten, wij hebben er geen voordeel van; en of wij niet eten, wij hebben er geen nadeel van.","9":"Maar kijk uit, dat deze macht van u niet op de een of andere manier een aanstoot wordt voor hen die zwak zijn.","10":"Want als iemand u, die de kennis hebt, ziet aanzitten in de tempel van de afgod, zal het geweten van hem, die zwak is, dan niet gesterkt worden om te eten de dingen die aan de afgoden geofferd zijn?","11":"En zal de broeder, die zwak is, door uw kennis verloren gaan, om wie Christus gestorven is?","12":"Maar u, die zo tegen de broeders zondigt en hun zwakke geweten kwetst, zondigt tegen Christus.","13":"Daarom, als het voedsel mijn broeder ergert, zal ik in eeuwigheid geen vlees eten, opdat ik mijn broeder niet erger."},"SV":{"1":"Aangaande nu de dingen, die den afgoden geofferd zijn, wij weten, dat wij allen te zamen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht.","2":"En zo iemand meent iets te weten, die heeft nog niets gekend, gelijk men behoort te kennen.","3":"Maar zo iemand God liefheeft, die is van Hem gekend.","4":"Aangaande dan het eten der dingen, die den afgoden geofferd zijn, wij weten, dat een afgod niets is in de wereld, en dat er geen ander God is dan een.","5":"Want hoewel er ook zijn, die goden genaamd worden, hetzij in den hemel, hetzij op de aarde ( gelijk er vele goden en vele heren zijn),","6":"Nochtans hebben wij *maar* een God, den Vader, uit Welken alle dingen zijn, en wij tot Hem; en *maar* een Heere, Jezus Christus, door Welken alle dingen zijn, en wij door Hem.","7":"Doch in allen is de kennis niet; maar sommigen, met een geweten des afgods tot nog toe, eten als *iets* dat den afgoden geofferd is; en hun geweten, zwak zijnde, wordt bevlekt.","8":"De spijze nu maakt ons Gode niet aangenaam; want hetzij dat wij eten, wij hebben geen overvloed; en hetzij dat wij niet eten, wij hebben geen gebrek.","9":"Maar ziet toe, dat deze uw macht niet enigerwijze een aanstoot worde dengenen, die zwak zijn.","10":"Want zo iemand u, die de kennis hebt, ziet in der afgoden tempel aanzitten, zal het geweten deszelven, die zwak is, niet gestijfd worden, om te eten de dingen, die den afgoden geofferd zijn?","11":"En zal de broeder, die zwak is, door uw kennis verloren gaan, om welken Christus gestorven is?","12":"Doch gijlieden, alzo tegen de broeders zondigende, en hun zwak geweten kwetsende, zondigt tegen Christus.","13":"Daarom, indien de spijs mijn broeder ergert, zo zal ik in eeuwigheid geen vlees eten, opdat ik mijn broeder niet ergere."},"KJV":{"1":"Now as touching things offered unto idols, we know that we all have knowledge. Knowledge puffeth up, but charity edifieth.","2":"And if any man think that he knoweth any thing, he knoweth nothing yet as he ought to know.","3":"But if any man love God, the same is known of him.","4":"As concerning therefore the eating of those things that are offered in sacrifice unto idols, we know that an idol is nothing in the world, and that there is none other God but one.","5":"For though there be that are called gods, whether in heaven or in earth, (as there be gods many, and lords many,)","6":"But to us there is but one God, the Father, of whom are all things, and we in him; and one Lord Jesus Christ, by whom are all things, and we by him.","7":"Howbeit there is not in every man that knowledge: for some with conscience of the idol unto this hour eat it as a thing offered unto an idol; and their conscience being weak is defiled.","8":"But meat commendeth us not to God: for neither, if we eat, are we the better; neither, if ➔ we eat not, are we the worse.","9":"But take heed lest by any means this liberty of yours become a stumblingblock to them that are weak.","10":"For if any man see thee which hast knowledge sit at meat in the idol's temple, shall ➔ not the conscience of him which is weak be emboldened to eat those things which are offered to idols;","11":"And through thy knowledge shall ➔ the weak brother perish, for whom Christ died?","12":"But when ye sin so against the brethren, and wound their weak conscience, ye sin against Christ.","13":"Wherefore, if meat make ➔ my brother to offend, I will eat no flesh while the world standeth, lest I make ➔ my brother to offend."}},"tsk":{"1":[{"kopje":"betreft","refs":["1 Kor 8:10","1 Kor 10:19-22","1 Kor 10:28","Num 25:2","Hand 15:10","Hand 15:19","Hand 15:20","Hand 15:29","Hand 21:25","Openb 2:14","Openb 2:20","1 Kor 8:2","1 Kor 8:4","1 Kor 8:7","1 Kor 8:11","1 Kor 1:5","1 Kor 4:10","1 Kor 13:2","1 Kor 14:20","1 Kor 15:34","Rom 14:14","Rom 14:22","Kol 2:18"]},{"kopje":"kennis","refs":["1 Kor 4:18","1 Kor 5:2","1 Kor 5:6","1 Kor 13:4","Jes 5:21","Jes 47:10","Rom 11:25","Rom 12:16","Rom 14:3","Rom 14:10"]},{"kopje":"maar","refs":["1 Kor 13:1-13","Ef 4:16"]}],"2":[{"kopje":"als","refs":["Spr 26:12","Spr 30:2-4","Rom 11:25","Gal 6:3","1 Tim 1:5-7","1 Tim 6:3","1 Tim 6:4"]}],"3":[{"kopje":"liefheeft","refs":["1 Kor 2:9","Rom 8:28","Jak 1:12","Jak 2:5","1 Petr 1:8","1 Joh 4:19","1 Joh 5:2","1 Joh 5:3"]},{"kopje":"is","refs":["Ex 33:12","Ex 33:17","Ps 1:6","Ps 17:3","Ps 139:1","Ps 139:2","Nahum 1:7","Matt 7:23","Joh 10:14","Joh 21:17","Rom 8:29","Rom 11:2","Gal 4:9","2 Tim 2:19","Openb 2:9","Openb 2:13","Openb 2:19","Openb 3:8","Openb 3:9","Openb 3:15","Openb 3:16"]}],"4":[{"kopje":"wij weten","refs":["1 Kor 10:19","1 Kor 10:20","Ps 115:4-8","Jes 41:24","Jes 44:8","Jes 44:9","Jer 10:14","Jer 51:17","Jer 51:18","Hab 2:19","Hab 2:20","Hand 19:26"]},{"kopje":"dat er","refs":["1 Kor 8:6","Deut 3:24","Deut 4:39","Deut 6:4","Deut 32:39","Jes 37:16","Jes 37:20","Jes 44:6","Jes 44:8","Jes 44:24","Jes 45:5","Jes 45:14","Jer 10:10","Mark 12:29","Ef 4:6","1 Tim 1:17","1 Tim 2:5","Judas 1:25"]}],"5":[{"kopje":"die","refs":["Deut 10:17","Jer 2:11","Jer 2:28","Jer 11:13","Dan 5:4","Joh 10:34","Joh 10:35","Gal 4:8","2 Tess 2:4"]}],"6":[{"kopje":"één God","refs":["1 Kor 8:4  wl-kjv\" data-code=\"G622\">shall</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"G770\">weak</span> <span class=\"wl wl-kjv\" data-code=\"G80\">brother</span> <span class=\"wl wl-kjv\" data-code=\"G622\">perish,</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">for</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">whom</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> <span class=\"wl wl-kjv\" data-code=\"G599\">died?</span>","12":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> when ye <span class=\"wl wl-kjv\" data-code=\"G264\">sin</span> <span class=\"wl wl-kjv\" data-code=\"G3779\">so</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">against</span> the <span class=\"wl wl-kjv\" data-code=\"G80\">brethren,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5180\">wound</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G770\">weak</span> <span class=\"wl wl-kjv\" data-code=\"G4893\">conscience,</span> ye <span class=\"wl wl-kjv\" data-code=\"G264\">sin</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">against</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ.</span>","13":"<span class=\"wl wl-kjv\" data-code=\"G1355\">Wherefore,</span> <span class=\"wl wl-kjv\" data-code=\"G1487\">if</span> <span class=\"wl wl-kjv\" data-code=\"G1033\">meat</span> <span class=\"wl wl-kjv\" data-code=\"G4624\">make</span> ➔ <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G80\">brother</span> to <span class=\"wl wl-kjv\" data-code=\"G4624\">offend,</span> I will <span class=\"wl wl-kjv\" data-code=\"G5315\">eat</span> <span class=\"wl wl-kjv\" data-code=\"G3364\">no</span> <span class=\"wl wl-kjv\" data-code=\"G2907\">flesh</span> while the world <span class=\"wl wl-kjv\" data-code=\"G1519\">standeth,</span> <span class=\"wl wl-kjv\" data-code=\"G3363\">lest</span> I <span class=\"wl wl-kjv\" data-code=\"G4624\">make</span> ➔ <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G80\">brother</span> to <span class=\"wl wl-kjv\" data-code=\"G4624\">offend.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"den afgoden","tekst":"Het Griekse woord Eidolon, hetwelk wij afgod noemen, betekent allerlei beeld of gelijkenis, en in het algemeen al wat buiten of benevens God, enige godsdienstige eer aangedaan wordt, en wordt hier genomen voor een beeld, waardoor men enigen afgod eert, of dat men goddelijke of godsdienstige eer aandoet, onder welken schijn het ook zij. Dewijl nu de heidenen een deel van de offeranden, die zij hunnen afgoden opofferden, gebruikten tot maaltijden, die zij in hun huis, of ook in de tempels der afgoden hielden, waar de Christenen ook somwijlen toe genood werden, zo is den apostel gevraagd, of het ook hun geoorloofd was, hetzij buiten, hetzij binnen de tempels der afgoden, zich tot zulke maaltijden te begeven; waarop de apostel, ten dele in dit hoofdstuk, ten dele in het tiende, antwoordt."},{"catchword":"wij allen tezamen","tekst":"Namelijk die van God en Zijne natuur, mitsgaders van de Christelijke vrijheid, behoorlijk onderricht zijn. Want Hij zondert zelf daarna de zwakken hiervan uit, vs.7; en hier schijnt de apostel de woorden te herhalen, die enige lieden onder zich gebruikten om hun doen te verschonen."},{"catchword":"opgeblazen, maar","tekst":"Dat is, eigendunkelijk en verachters des naasten, wanneer de kennis zonder liefde en rechte godvrezendheid is, gelijk de volgende woorden medebrengen."},{"catchword":"de liefde sticht","tekst":"Dat is, maakt dat de kennis gebruikt worde tot stichting van ons en onze naasten. Zie Rom 14:19 ."}],"2":[{"catchword":"meent iets","tekst":"Namelijk zonder bijvoeging van de liefde, gelijk voren."}],"3":[{"catchword":"God liefheeft,","tekst":"Namelijk en vervolgens ook zijnen naaste om Gods wil, welke twee dingen niet kunnen gescheiden zijn; 1Jo 4:20 , en 1Jo 5:1-2 ."},{"catchword":"van Hem gekend","tekst":"Dat is, voor de zijnen gekend, gelijk Joh 10:14 ; Rom 8:29 , en derhalve ook van Hem geleerd, gelijk sommigen het woord kennen nemen. Zie ook 1Co 13:12 , en Gal 4:9 ."}],"4":[{"catchword":"niets is in de","tekst":"Dat is, geen God is, noch goddelijke kracht heeft om de spijzen te bezoedelen of te heiligen; anders zijn de afgoden ook iets in de wereld, namelijk goud, zilver, stenen, zon, maan, afgestorven mensen, boze geesten en dergelijke, die de heidenen voor goden hielden, maar hebben geen goddelijke kracht, gelijk zij meenden; waarom zij ook in Gods woord ijdelheden en leugens genaamd worden."}],"5":[{"catchword":"die goden genaamd","tekst":"Namelijk van de blinde mensen, die zulke schepselen, of ook hun eigen verzinselen, voor goden hielden; Rom 1:21 , enz."},{"catchword":"(gelijk er vele goden","tekst":"Namelijk zodanige versierde goden, of ook die Gods Woord zelf goden noemt, als daar zijn de engelen en overheden; Psa 8:6 , en Psa 82:1 ."}],"6":[{"catchword":"maar een God,","tekst":"Namelijk die waarlijk en wezenlijk de eeuwige God is."},{"catchword":"uit welken alle","tekst":"Dat is, door wiens schikking en almachtige kracht. Zie dergelijke Rom 11:36 ."},{"catchword":"tot Hem; en","tekst":"Dat is, tot Zijne dienst en tot Zijne eer; Pro 16:4 , en 1Co 10:31 ."},{"catchword":"een Heere,","tekst":"Namelijk die volstrekte macht en gebied over ons en onze conscientiën heeft. Hetwelk de apostel zegt, niet om den Vader en den Heiligen Geest hiervan uit te sluiten, die ook doorgaans in de Schrift onze Heere genaamd worden, maar alleen alle schepselen en versierde goden, gelijk hij tevoren den Vader een God heeft gezegd te zijn, niet om den Zoon en de Heiligen Geest, maar alleen de schepselen en versierde goden daarvan uit te sluiten."},{"catchword":"door welken alle dingen","tekst":"Namelijk als een medewerker des Vaders in al Zijn goddelijke werken; Joh 1:3 , en Joh 5:19 ."},{"catchword":"wij door Hem","tekst":"Hierdoor verstaat hij het werk der verlossing."}],"7":[{"catchword":"is de kennis","tekst":"Namelijk dat de afgod niets is, of geen macht heeft om hetgeen geofferd is te bevlekken."},{"catchword":"met een consciëntie","tekst":"Dat is, met een conscientie, die gevoelt dat de afgod wat is en macht heeft om de spijs te bezoedelen."},{"catchword":"tot nog toe eten","tekst":"Dat is, zonder dat zij tot nu toe tot een ander gevoelen zijn kunnen gebracht worden."},{"catchword":"wordt bevlekt","tekst":"Namelijk dewijl zij evenwel eten hetgeen zij voor bevlekt houden, en dat tegen hun gemoed."}],"8":[{"catchword":"De spijze nu","tekst":"Dat is, het eenvoudig gebruik der spijs. Sommigen nemen dit voor de woorden des apostels, die de sterken hiermede zou onderwijzen, dat zij des te beter zulke spijs mogen nalaten; anderen nemen het voor de woorden dergenen zelf, die onder dit voorwendsel durfden van het afgodenoffer eten. Beide komt niet kwalijk overeen met hetgeen volgt."},{"catchword":"hebben geen overvloed;","tekst":"Namelijk in het geestelijke, of ten aanzien van de aangenaamheid voor God. Alzo ook het volgende. Zie Rom 14:17 ."}],"9":[{"catchword":"deze uw macht","tekst":"Namelijk die gij hebt, of vermeend te hebben in het gebruiken van zulke spijs."},{"catchword":"een aanstoot","tekst":"Het woord aanstoot beduidt somwijlen ene droefheid, die men heeft over hetgeen iemand onbehoorlijk doet, maar hier beduidt het ene vrijmoedigheid, die iemand neemt om te doen gelijk een ander, hoewel hij gevoelt dat de ander kwalijk doet, gelijk het volgende uitwijst."}],"10":[{"catchword":"die de kennis","tekst":"Namelijk dat de afgod niets is, gelijk voren."},{"catchword":"in der afgoden","tekst":"Of, gelijk sommigen dit verstaan, aan de tafel der afgoden; dat is in den maaltijd, die ter ere van den afgod gehouden wordt."},{"catchword":"gestijfd worden","tekst":"Gr. gesticht; hetwelk hier ten kwade wordt genomen."},{"catchword":"om te eten de","tekst":"Namelijk daar hij het evenwel daarvoor houdt dat de afgod deze dingen heeft ontreinigd, of, gelijk de afgodendienaars spraken, zichzelven toegeheiligd."}],"11":[{"catchword":"door uwe kennis","tekst":"Of, om uwe kennis; dat is, door of om het misbruik uwer kennis, dewijl gij dezelve niet gebruikt tot stichting, maar met ergernis der zwakken."},{"catchword":"verloren gaan","tekst":"Namelijk dewijl gij daarmede, zoveel in u is, dezen uw zwakken broeder met uw voorbeeld oorzaak geeft om alzo allengskens tot den afgod te vervallen, en van den Christelijken godsdienst af te vallen en alzo verloren te gaan. Zie dergelijke wijze van spreken Mat 5:28 ; Rom 14:15 ."},{"catchword":"om welken","tekst":"Namelijk zwakken broeder."},{"catchword":"Christus gestorven is?","tekst":"Namelijk om hem van het verderf te behouden, en tot dien einde ook van den afgodendienst en de vorige ijdele wandelingen te verlossen; 1Pe 1:18 . Want hoewel degenen, voor wie Christus gestorven is en die Hij door Zijn dood waarlijk verlost heeft, niet door de verleidende kracht der ergernissen kunnen verleid worden, Mat 24:24 ; Joh 10:15 , Joh 10:28 , nochtans zo doen degenen, die ergernis geven, anders niet, zoveel in hen is, dan dat zij de zwakgelovigen in het verderf zouden brengen, tenware zij door de kracht Gods en Christus' voorbidding bewaard werden; Luk 22:31-32 ; 1Pe 1:5 ."}],"12":[{"catchword":"kwetsende, zondigt","tekst":"Gr. slaande; hetwelk ene zaak is van grote onbarmhartigheid, de conscientie van zodanigen, die van zelf zwak is, met slaan of kwetsen nog zwakker maken, en gelijk als doden."},{"catchword":"tegen Christus","tekst":"Namelijk wiens leden zij zijn. Zie Act 9:4 ."}],"13":[{"catchword":"indien de spijze","tekst":"Namelijk van wat soort die ware. Hier stelt de apostel een algemenen regel, waarnaar de conscientie aller gelovigen moet geregeld worden, ten aanzien van de middelmatige dingen en van de zwakken; maar niet ten aanzien van de halsstarrigen of moedwilligen. Zie Mat 15:12 , en Gal 2:3 , enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now concerning the things which are offered to idols [The Greek word Eiodolon, which we call idol, signifies any kind of image or likeness, and generally whatsoever without, or together with God, any religious honour is given to, and is here taken for an image whereby men honour any idol, or to which men give divine or religious honour under what pretence soever it be. Now seeing the Gentiles used part of the sacrifices which they offered to their idols for feasts, which they held at their houses or else in the Temples of the idols, whereunto the Christians were also sometimes invited; therefore it was demanded of the Apostle, whether it were also lawful to them, whether it were without or within the Temples of the idols, to go to such feasts, whereunto the Apostle answers partly in the tenth] We know that we altogether [namely, who are duly informed of God and of his nature, and withal of our Christian liberty. For he himself afterwards accepts the weak out of them, v. 7. and the Apostle seems here to rehearse the words which some persons among them used to colour their doings] have knowledge. Knowledge puffeth up, [that is, makes self-conceited, and despisers of our neighbour, when knowledge is without love and the true fear of God as the following word misport] but love edifieth. [causeth our knowledge to be used for the edification of ourselves and our neighbour. See Rom. 14. 19.]"}],"2":[{"catchword":null,"tekst":"And if thinketh that he knoweth any thing, [Namely, without conjoining of love as before] he hath known nothing yet, as it ought to be known."}],"3":[{"catchword":null,"tekst":"But if any man love God, [And consequently his neighbour also of Gods sake, which two things cannot be separated, 1 John 4. 20. and chap. 5. v. 1. 2.] he is known of him. [that is, known for his, as John 10. 14. Rom. 8. 29. and for that cause also taught by him, as some take the word know. See also 1. Cor. 13. 12. and Gal, 4. 9.]"}],"4":[{"catchword":null,"tekst":"Concerning therefore the eating of things which are offered to idols; we know that an idol is nothing in the world, [That is, is no god, nor hath any divine power to pollute meats or to hallow them: otherwise idols are also something in the world, namely, gold, silver, stones, the sun, moon, deceased men, wicked spirits and the like which the Gentiles held for Gods, but have no divine power like as they thought, wherefore also they are called vanities and lies in the word of God] and that there is no other God but one."}],"5":[{"catchword":null,"tekst":"For although there be also them that are called Gods [Namely by blind men who accounted such creatures or even their own fancies for Gods, Rom. 1. 21. etc.] whether in heaven or on the earth (as there be many Gods and many Lords. [namely, such feigned Gods, or else which Gods word itself calls Gods, as are the Angels and Magistrates, Psa. 8. 6, Psa. 82. 1.]"}],"6":[{"catchword":null,"tekst":"Notwithstanding we have but one God, [Namely, who is truly and essentially the eternal God] the Father, of whom, [that is, by whose ordering and almighty power. See the like, Rom. 11. 36.] are all things, and we for him, [that is, for his service and for his glory, Prov. 16. 4. and 1 Cor. 10. 31.] and (but) one Lord, [namely, who hath absolute power and command over us and our consciences. Which the Apostle saith not to exclude the Father and Holy Ghost from it, who are also every where in the Scriptures called our Lord, but only all creatures and feigned Gods, as before he said the Father to be one God, not to exclude the son and the Holy Ghost from it, but only the creatures and feigned Gods] Jesus Christ, by whom are all things, [namely as a co-worker with his Father in all his divine works, John 1. 3. and 5. 19.] and we by him. [Hereby he understands the work of redemption]"}],"7":[{"catchword":null,"tekst":"But in all knowledge is not: [namely, that the idol is nothing, or hath no power to defile that which is offered] but some with a conscience of the idol, [that is, with a conscience that judgeth that the idol is somewhat, and hath power to pollute the meat] even until now [that is, without having been able hitherto to be brought to another opinion] eat as (ought) that is offered to an idol: and their conscience being weak is defiled. [namely, seeing they nevertheless eat that which they hold to be defiled, and that against their judgment.]"}],"8":[{"catchword":null,"tekst":"Now meat [That is, the simple use of meat. Some take this for the words of Apostle, who should hereby instruct the strong that they may so much the better leave such meat. Others take it for the words of those themselves, who under this pretext durst eat of the Idol-sacrifice. Both agree not ill with that which followeth] maketh us not acceptable to God. For whether we eat we have no abundance, [namely, in spirituals, or in respect of acceptableness before God; so also that which followeth. See Rom. 14. 17.] and whether we eat not, we have no want.]"}],"9":[{"catchword":null,"tekst":"But take heed that this your power [Namely, which ye have or think that ye have in the use of such meat] become not in any wife a stumbling-block [the word stumbling-block signifies sometimes a grief which a man hath for that which any one doth amiss, but here it signifies a boldness which any one takes to do like another although he thinketh that the other doth ill, as that which followeth shows] to them that are weak."}],"10":[{"catchword":null,"tekst":"For if any man seeth thee who hast knowledge [Namely, that an Idol is nothing, as before] sit at meat in the Idols Temple, [or as some understand this, at the Idols Table, i.e. at the feast which is kept for the honour of the Idol] Shall not the conscience of the same who is weak, be hardened [Gr. Edified, which here is taken in an ill sense] to eat the things which are offered to Idols? [namely, whereas nevertheless he reckoneth that the Idol hath defiled these things, or as the Idolaters spoke, consecrated it to himself.]"}],"11":[{"catchword":null,"tekst":"And the brother which is weak by thy knowledge [Or for thy knowledge, i.e. by or for the abuse of thy knowledge, seeing thou dost not use it for edification, but with offence of the weak] shall perish, [namely, seeing thereby as much as in thee is, thou givest occasion to this thy weak brother by thy example, so by little and little to fall to the Idol, and to fall away from the Christian Religion, and so to perish. See the like phrase, Mat. 5. 28. Rom. 14. 15. for whom [namely, weak brother] Christ died? [namely, to keep him from destruction, and for this end also to redeem him from idolatry and his former vain conversation, 1 Pet. 1. 18. For howsoever those for whom Christ died, and whom by his death he hath truly redeemed, cannot be seduced by the seducing power of offences, Mat. 24. 24. John 10. 15, 28. Yet nevertheless they that give offence do nothing else but as much as in them is, bring such as are weak in the faith to destruction, except they were kept by the power of God and the intercession of Christ, Luke 22. 31, 32. 1 Pet. 1. 5.]"}],"12":[{"catchword":null,"tekst":"But ye so sinning against the brethren, and wounding [Gr. Striking, which is a matter of great cruelty to make the conscience of such which is weak of itself, by striking or wounding yet weaker, and as it were kill it] their weak conscience, sin against Christ. [namely, whose members they are. See Acts 9. 4.]"}],"13":[{"catchword":null,"tekst":"Therefore if meat [Namely, of what sort so ever it be. And the Apostle gives here a general rule, according to which the conscience of all believers must be regulated in respect of indifferent things and of the weak: but not in respect of the obstinate or willful. See Mat. 15. 12. and Gal. 2. 3. & c] offends my brother, I will never eat any flesh, lest I should offend my brother."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +

    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
