nen/1/"},{"naam":"1 Korinthe","href":"../../1-korinthe/1/"},{"naam":"2 Korinthe","href":"../../2-korinthe/1/"},{"naam":"Galaten","href":"../../galaten/1/"},{"naam":"Efeze","href":"../../efeze/1/"},{"naam":"Filippenzen","href":"../../filippenzen/1/"},{"naam":"Kolossenzen","href":"../../kolossenzen/1/"},{"naam":"1 Thessalonicenzen","href":"../../1-thessalonicenzen/1/"},{"naam":"2 Thessalonicenzen","href":"../../2-thessalonicenzen/1/"},{"naam":"1 Timotheüs","href":"../../1-timotheus/1/"},{"naam":"2 Timotheüs","href":"../../2-timotheus/1/"},{"naam":"Titus","href":"../../titus/1/"},{"naam":"Filemon","href":"../../filemon/1/"},{"naam":"Hebreeën","href":"../../hebreeen/1/"},{"naam":"Jakobus","href":"../../jakobus/1/"},{"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}]},"vertalingen":{"SVnu":{"1":"En ik, broeders, toen ik bij u kwam, kwam niet met voortreffelijkheid van woorden of van wijsheid, terwijl ik u de getuigenis van God verkondigde.","2":"Want ik had besloten niets te weten onder u, dan Jezus Christus, en Die gekruisigd.","3":"En ik was bij u in zwakheid, en in vrees, en in veel beven.","4":"En mijn spreken en mijn prediking bestond niet uit overtuigende woorden van menselijke wijsheid, maar uit het bewijs van de Geest en van kracht,","5":"Opdat uw geloof niet zou berusten op wijsheid van mensen, maar op de kracht van God.","6":"En wij spreken wijsheid onder de volwassenen in het geloof; maar een wijsheid die niet van deze wereld is, en ook niet van de leiders van deze wereld, die tot niets worden;","7":"Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;","8":"Welke niemand van de leiders van deze wereld gekend heeft; want als zij haar gekend hadden, zouden zij de Heere der heerlijkheid niet gekruisigd hebben.","9":"Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.","10":"Maar God heeft het ons geopenbaard door Zijn Geest; want de Geest onderzoekt alle dingen, ook de diepten van God.","11":"Want wie van de mensen weet wat een mens is, dan de geest van de mens die in hem is? Zo weet ook niemand wat van God is, dan de Geest van God.","12":"Maar wij hebben niet de geest van de wereld ontvangen, maar de Geest Die uit God is, opdat wij zouden weten de dingen die ons door God geschonken zijn;","13":"Die dingen spreken wij ook, niet met woorden die de menselijke wijsheid leert, maar met woorden die de Heilige Geest leert, terwijl wij geestelijke dingen met geestelijke vergelijken.","14":"Maar de natuurlijke mens begrijpt niet de dingen die van de Geest van God zijn; want ze zijn hem dwaasheid, en hij kan ze niet verstaan, omdat ze geestelijk beoordeeld worden.","15":"Maar de geestelijke mens beoordeelt wel alle dingen, maar hijzelf wordt door niemand beoordeeld.","16":"Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus."},"SV":{"1":"En ik, broeders, als ik tot u ben gekomen, ben niet gekomen met uitnemendheid van woorden, of van wijsheid, u verkondigende de getuigenis van God.","2":"Want ik heb niet voorgenomen iets te weten onder u, dan Jezus Christus, en Dien gekruisigd.","3":"En ik was bij ulieden in zwakheid, en in vreze, en in vele beving.","4":"En mijn rede, en mijn prediking was niet in bewegelijke woorden der menselijke wijsheid, maar in betoning des geestes en der kracht;","5":"Opdat uw geloof niet zou zijn in wijsheid der mensen, maar in de kracht Gods.","6":"En wij spreken wijsheid onder de volmaakten; doch een wijsheid, niet dezer wereld, noch der oversten dezer wereld, die te niet worden;","7":"Maar wij spreken de wijsheid Gods, *bestaande* in verborgenheid, die bedekt was, welke God te voren verordineerd heeft tot heerlijkheid van ons, eer de wereld was;","8":"Welke niemand van de oversten dezer wereld gekend heeft; want indien zij ze gekend hadden, zo zouden zij den Heere der heerlijkheid niet gekruist hebben.","9":"Maar gelijk geschreven is: Hetgeen het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart des mensen niet is opgeklommen, hetgeen God bereid heeft dien, die Hem liefhebben.","10":"Doch God heeft *het* ons geopenbaard door Zijn Geest; want de Geest onderzoekt alle dingen, ook de diepten Gods.","11":"Want wie van de mensen weet, hetgeen des mensen is, dan de geest des mensen, die in hem is? Alzo weet ook niemand, hetgeen Gods is, dan de Geest Gods.","12":"Doch wij hebben niet ontvangen den geest der wereld, maar den Geest, Die uit God is, opdat wij zouden weten de dingen, die ons van God geschonken zijn;","13":"Dewelke wij ook spreken, niet met woorden, die de menselijke wijsheid leert, maar met *woorden*, die de Heilige Geest leert, geestelijke dingen met geestelijke samenvoegende.","14":"Maar de natuurlijke mens begrijpt niet de dingen, die des Geestes Gods zijn; want zij zijn hem dwaasheid, en hij kan ze niet verstaan, omdat zij geestelijk onderscheiden worden.","15":"Doch de geestelijke *mens* onderscheidt wel alle dingen, maar hij zelf wordt van niemand onderscheiden.","16":"Want wie heeft den zin des Heeren gekend, die Hem zou onderrichten? Maar wij hebben den zin van Christus."},"KJV":{"1":"And I, brethren, when I came to you, came not with excellency of speech or of wisdom, declaring unto you the testimony of God.","2":"For I determined not to know any thing among you, save Jesus Christ, and him crucified.","3":"And I was with you in weakness, and in fear, and in much trembling.","4":"And my speech and my preaching was not with enticing words of man's wisdom, but in demonstration of the Spirit and of power:","5":"That your faith should ➔ not stand in the wisdom of men, but in the power of God.","6":"Howbeit we speak wisdom among them that are perfect: yet not the wisdom of this world, nor of the princes of this world, that come to nought:","7":"But we speak the wisdom of God in a mystery, even the hidden wisdom, which God ordained before the world unto our glory:","8":"Which none of the princes of this world knew: for had they known it, they would ➔ not have crucified the Lord of glory.","9":"But as it is written, Eye hath ➔ not seen, nor ear heard, neither have entered into the heart of man, the things which God hath prepared for them that love him.","10":"But God hath revealed them unto us by his Spirit: for the Spirit searcheth all things, yea, the deep things of God.","11":"For what man knoweth the things of a man, save the spirit of man which is in him? even so the things of God knoweth no man, but the Spirit of God.","12":"Now we have received, not the spirit of the world, but the spirit which is of God; that we might know the things that are freely given to us of God.","13":"Which things also we speak, not in the words which man's wisdom teacheth, but which the Holy Ghost teacheth; comparing spiritual things with spiritual.","14":"But the natural man receiveth not the things of the Spirit of God: for they are foolishness unto him: neither can he know them, because they are spiritually discerned.","15":"But he that is spiritual judgeth all things, yet he himself is judged of no man.","16":"For who hath known the mind of the Lord, that he may instruct him? But we have the mind of Christ."}},"tsk":{"1":[{"kopje":"toen","refs":["Hand 18:1-4"]},{"kopje":"met","refs":["1 Kor 2:4","1 Kor 2:13","1 Kor 1:17","Ex 4:10","Jer 1:6","Jer 1:7","Rom 16:18","2 Kor 10:10","2 Kor 11:6"]},{"kopje":"de getuigenis","refs":["1 Kor 1:6","Jes 8:20","Hand 20:21","Hand 22:18","2 Tess 1:10","1 Tim 1:11","2 Tim -code=\"G3754\">because</span> they are <span class=\"wl wl-kjv\" data-code=\"G4153\">spiritually</span> <span class=\"wl wl-kjv\" data-code=\"G350\">discerned.</span>","15":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> he that is <span class=\"wl wl-kjv\" data-code=\"G4152\">spiritual</span> <span class=\"wl wl-kjv\" data-code=\"G3303\">judgeth</span> all <span class=\"wl wl-kjv\" data-code=\"G3956\">things,</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">yet</span> he <span class=\"wl wl-kjv\" data-code=\"G846\">himself</span> is <span class=\"wl wl-kjv\" data-code=\"G350\">judged</span> <span class=\"wl wl-kjv\" data-code=\"G5259\">of</span> no <span class=\"wl wl-kjv\" data-code=\"G3762\">man.</span>","16":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> <span class=\"wl wl-kjv\" data-code=\"G5101\">who</span> hath <span class=\"wl wl-kjv\" data-code=\"G1097\">known</span> the <span class=\"wl wl-kjv\" data-code=\"G3563\">mind</span> of the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">that</span> he may <span class=\"wl wl-kjv\" data-code=\"G4822\">instruct</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him?</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> <span class=\"wl wl-kjv\" data-code=\"G2249\">we</span> <span class=\"wl wl-kjv\" data-code=\"G2192\">have</span> the <span class=\"wl wl-kjv\" data-code=\"G3563\">mind</span> of <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"uitnemendheid","tekst":"Gr. uitnemendheid van woord; of rede; dat is, een opgepronkte manier van spreken, door welke ik boven anderen wijs zocht te schijnen, of uit te munten; of, om u te overreden. Zie 1Co 4:19 ."},{"catchword":"de getuigenis","tekst":"Dat is, het Evangelie, hetwelk ons van God is geopenbaard, en getuigt van den wil Gods tot onze zaligheid; 1Co 1:6 ."}],"2":[{"catchword":"niet voorgenomen","tekst":"Gr. geoordeeld. Want al was de apostel in vele andere zaken ervaren, zo had hij evenwel niet willen voordragen dan hetgeen tot hunne zaligheid nodig was."},{"catchword":"iets te weten","tekst":"Dat is, van enige andere wetenschap bij u te spreken."},{"catchword":"dien gekruisigd","tekst":"Dat is, die door Zijn dood en volgende opstanding ons van onze zonden verlost en de eeuwige zaligheid deelachtig heeft gemaakt; Rom 4:25 , en Rom 10:9-10 ."}],"3":[{"catchword":"in zwakheid,","tekst":"Deze dingen kunnen verstaan worden, òf van den nederigen stand, waarin zich de apostel gehouden heeft toen hij te Corinthe was, opdat niet hij, maar alleen zijne leer in aanzien zou wezen bij hen, tegen de opgeblazenheid dergenen, die deze scheuringen veroorzaakten; òf van de voorzichtigheid en beschroomdheid, die hij gebruikt heeft in het voorstellen van de leer der zaligheid, om niets menselijks daaronder te vermengen, opdat de kracht derzelve niet aan zijne wijsheid of welsprekendheid, maar alleen aan den aard der leer, die hij predikte, en aan de medewerking van den Geest Gods zou worden toegeschreven: hetwelk met het volgende best overeenkomt."}],"4":[{"catchword":"betoning des","tekst":"Dat is, betoning der geestelijke kracht, die uiterlijk door wonderen en inwendig door de werking des Heiligen Geestes bij zijn woord was gevoegd, 2Co 3:3 ."}],"5":[{"catchword":"niet zou zijn","tekst":"Dat is, zijn oorzaak of fondament niet zou hebben."},{"catchword":"in wijsheid der","tekst":"Dat is, in redenen of woorden, die de menselijke wijsheid bedenkt."},{"catchword":"in de kracht","tekst":"Dat is, in de goddelijkheid der leer, door de kracht des Geestes Gods aan onze harten betuigd; Act 16:14 ."}],"6":[{"catchword":"wijsheid onder","tekst":"Dat is, de zwaarste verborgenheden van Gods Woord, gelijk vs.7. Anderszins heeft hij ook de zwakken en tederen met melk gespijsd. Zie 1Co 3:2 ; Heb 5:12 ."},{"catchword":"de volmaakten;","tekst":"Dat is, die in de zaken des geloofs meer toegenomen zijn, en nu niet meer in de eerste beginselen behoeven onderricht te worden. Zie Rom 14:1-2 , en Rom 15:1 ; Phi 3:15 ; Heb 5:14 . Dezen worden bij vergelijking van anderen, volmaakten genoemd: anderszins is hier niemand volmaakt in kennis zolang hij leeft; 1Co 13:9 ."},{"catchword":"dezer wereld,","tekst":"Dat is, die van het menselijke vernuft bedacht en groot geacht wordt."},{"catchword":"der oversten","tekst":"Dat is, der wijzen en machtigen, gelijk vs.8."},{"catchword":"teniet worden","tekst":"Namelijk met al hunne wijsheid en macht, overmits die buiten deze wereld geen gebruik heeft."}],"7":[{"catchword":"de wijsheid Gods,","tekst":"Dat is, die God ons tot onze zaligheid heeft geopenbaard."},{"catchword":"verborgenheid,","tekst":"Zo noemt de apostel de leer des Evangelies, omdat dezelve door geen menselijke wijsheid ooit is gevonden, maar was voor haar bedekt, totdat God die door Zijne profeten en apostelen heeft geopenbaard."},{"catchword":"welke God","tekst":"Namelijk wijsheid Gods; waardoor verstaan wordt òf de persoon van Christus, die 1Co 1:24 ook de wijsheid Gods genaamd wordt; òf de verborgenheden onzer zaligheid, in Christus bij God voorgenomen, en daarna in het Evangelie geopenbaard tot onze heerlijkheid; Luk 2:32 . Beide komt met het volgende wel overeen."},{"catchword":"eer de wereld","tekst":"Gr. voor de eeuwen."}],"8":[{"catchword":"niemand van","tekst":"Namelijk uit hun natuurlijke rede of verstand, hoe groot en hoe kloek hetzelve ook was. Hoedanige Herodes, Pilatus, Kajafas en andere machtigen in deze wereld geweest zijn, alsook de wijsgeren, schriftgeleerden en dergelijken. Anderszins heeft Abraham ook door Gods Geest en openbaring zijnen dag gezien, Joh 8:56 , en David heeft zich daarin verheugd, Psa 16:9 , met anderen godzalige koningen en profeten, Luk 10:24 , en ook sommigen van de oversten der Joden, gelijk Nikodemus en Jozef van Arimathea, hebben hem gekend; dan deze waren weinigen, en hebben in Zijnen dood niet gestemd; Luk 23:51 . Zie dergelijke wijze van spreken Joh 3:32 ."},{"catchword":"den Heere der","tekst":"Namelijk die het hoofdstuk is van deze wijsheid Gods. Zo wordt Christus genaamd ten aanzien van Zijn goddelijke natuur, Psa 24:7 ; Act 7:2 , die gekruisigd is naar Zijn menselijke natuur. Zie dergelijke wijze van spreken Joh 3:13 ; Act 3:15 , en Act 20:28 ."}],"9":[{"catchword":"in het hart des","tekst":"Deze woorden voegt de apostel, tot nadere verklaring van de voorgaande profetische woorden, daartussen, om te tonen dat de verborgenheden des Evangelies, en de grootte der heerlijkheid, die God Zijnen gelovigen hiernamaals bereid heeft, zo waardig zijn, dat niet alleen geen oog en geen oor, maar zelfs geen vernuft die ooit heeft kunnen van zichzelven bedenken of ook verstaan. Zie 1Pe 1:10-12 ."}],"10":[{"catchword":"ons geopenbaard","tekst":"Namelijk die God liefhebben. Want dat de apostel niet alleen van de apostelen spreekt, maar ook van degenen, die door hun woord in Christus geloven, blijkt uit het volgende."},{"catchword":"Zijn Geest;","tekst":"Namelijk welke door het Woord en met het Woord in ons krachtig is. Zie 2Co 3:8 ; 1Jo 2:27 ."},{"catchword":"onderzoekt alle","tekst":"Dit zegt de apostel, niet omdat de Heilige Geest, die in ons woont, van enige goddelijke zaak onwetend zou zijn, die Hij zou moeten zoeken te weten, maar omdat Hem ook de allerdiepste zaken Gods, als eenzelfde God met den Vader en met den Zoon, klaarlijk bekend zijn; gelijk God wordt gezegd de harten en nieren te doorzoeken omdat zij voor Hem bloot en bekend zijn; Rom 8:27 ; Rev 2:23 ."},{"catchword":"de diepten Gods","tekst":"Dat is, den allerverborgensten raad Gods. Zie Isa 40:13 ."}],"11":[{"catchword":"de geest des","tekst":"Dat is, de redelijke ziel en het verstand des mensen weet wat in hem is. Zie 1Jo 3:20 ."},{"catchword":"niemand hetgeen","tekst":"Namelijk onder de schepselen. Want de Zoon kent den Vader, en de Vader den Zoon, Mat 11:27 , en hier ook de Heilige Geest, als een enig God met den Vader en den Zoon; Rom 8:27 ."}],"12":[{"catchword":"der wereld,","tekst":"Dat is, die wereldse dingen leert en in wereldse dingen zijn vermaak heeft, of geluk stelt."},{"catchword":"die uit God is,","tekst":"Dat is, die van God uitgaat en Zijnen kinderen beloofd en gegeven wordt; Joh 14:16 ; Rom 8:15 ."},{"catchword":"geschonken zijn;","tekst":"Namelijk tot onzen troost en onze zaligheid, dat is, Christus en Zijne weldaden; Rom 8:32 ; Col 2:9-10 ."}],"13":[{"catchword":"woorden,","tekst":"Of, redenen, bewegingen."},{"catchword":"die de Heilige Geest","tekst":"Namelijk in Zijne goddelijke ingevingen en schriften, niet opgepronkt met menselijk welsprekendheid, maar krachtig in hun geestelijke eenvoudigheid."},{"catchword":"samenvoegende","tekst":"Of, vergelijkende. Gr. tezamen oordelende; dat is, gelijk de leer geestelijk is, zo stellen wij ook die voor, niet met wereldse, maar met geestelijke woorden."}],"14":[{"catchword":"de natuurlijke mens","tekst":"Gr. de ziellijke mens; dat is, die geen andere hogere wijsheid heeft, dan die hem het licht der natuur en het menselijke vernuft leert. Zie Jud 1:19 ."},{"catchword":"begrijpt niet de","tekst":"Namelijk om dezelve aan te nemen en zichzelven tot zaligheid toe te eigenen; Rom 8:5 . Zie een voorbeeld Act 17:18 , en Act 25:19 ."},{"catchword":"dwaasheid, en hij","tekst":"Zie 1Co 1:21-23 ."},{"catchword":"kan ze niet","tekst":"Namelijk dan door de genade en kracht van Gods Geest, die het verstand verlicht en de harten opent; Act 16:14 ."},{"catchword":"onderscheiden worden","tekst":"Gr. geoordeeld; dat is van menselijke en wereldse leringen met oordeel onderscheiden."}],"15":[{"catchword":"de geestelijke mens","tekst":"Dat is, die door den Geest Gods is verlicht en wedergeboren."},{"catchword":"alle dingen, maar","tekst":"Namelijk ter zaligheid nodig. Want ook de gelovigen dwalen somtijds wel in sommige zaken, maar die ter zaligheid zo nodig niet zijn; of wanneer zij deze gave der onderscheiding niet genoeg opwekken door naarstigheid en gebeden. Zie Joh 10:4 , Joh 10:27 ; 1Th 5:21 ; 1Jo 4:1 ."},{"catchword":"niemand","tekst":"Namelijk die niet wedergeboren of geestelijk is; anderszins moet ook de geest der profeten den profeten onderworpen zijn; 1Co 14:29 , 1Co 14:32 ."},{"catchword":"onderscheiden","tekst":"Of, geoordeeld; dat is met oordeel onderscheiden; gelijk vs.14."}],"16":[{"catchword":"den zin des Heeren","tekst":"Of, den Geest des Heeren, gelijk Isa 40:13 , waar deze woorden staan, uitgedrukt wordt; dat is, den zin of de mening van den Geest des Heeren; Rom 8:27 ."},{"catchword":"den zin van Christus","tekst":"Dat is, de mening van Christus is ons bekend gemaakt door Zijn woord en door Zijnen Geest, gelijk hier voren verklaard is, vs.10, 12."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"AND I brethren when I come unto you, come not with excellency words [Gr. Excellency of word or speech i.e. a garnished manner of speaking, by which I sought to seem wise above others, or to excel: or to persuade you. See 1 Cor. 4.19.] or of wisdome, publishing unto you the testimony of God. [that is, the Gospel which is revealed to us by God, and testifies of the will of God for our salvation 1 Cor. 16.]"}],"2":[{"catchword":null,"tekst":"For I purposed not [Gr. Judged; for although the Apostle was expert in many other things, yet nevertheless he would not hold forth nothing but that which was necessary to their salvation] to know anything among you, [that is, to speak of any other knowledge with you] save Jesus Christ and crucified. [that is, who by his death, and resurrection following, redeemed us from our sins, and made us partakers of everlasting salvation, Rom. 4.25. and chap. 10.9,10.]"}],"3":[{"catchword":null,"tekst":"And I was with you in weakness [These things may be understood either of the low estate wherein the apostle kept himself when he was at Corinth, that not he, but only his doctrine might be in esteem with them, contrary to the haughtiness of those who occasioned these schisms, or of the circumspection and jealousy, which he used in propounding the doctrine of salvation; that he might mingle nothing human therewith, that the power of it might be ascribed, not to his own wisdome or eloquence, but only to the nature of the doctrine which he preached, and the cooperation of the spirit of God: which best agrees with that which follows] and in fer, and in much trembling."}],"4":[{"catchword":null,"tekst":"And my speech and my preaching was not in moving words of humane wisdome, in demonstration of the Spirit and of power. [That is, demonstration of the spiritual power which was joined with his word, outwardly by miracles, and inwardly by the operation of the Holy Ghost, 2 Cor. 3.3.]"}],"5":[{"catchword":null,"tekst":"That your faith should not be [That is, should not have its cause or foundation] in the wisdome of men [that is, in speeches or words which humane wisdome inventeth] but in the power of God. [that is, in the divinity of the doctrine, witnessed to our hearts by the power of the Spirit of God, Act 16:14.]"}],"6":[{"catchword":null,"tekst":"And we speak wisdome [That is, the difficulties and profoundest mysteries of Gods word: as ver.7. Otherwise he fed the weak and tender with milk. See 1 Cor. 3.2 Heb. 5.12.] amongst the perfect: [that is, those that have made more progress in the matters of faith, and now need no more to be instructed in the first principles. See Rom. 14.1,2. and 15.1. Phil. 3.15. Heb. 5.14. These are called perfect in comparison of others: otherwise no man is here perfect in knowledge as long as he liveth, 1 Cor 13.9.] yet a wisdome not of this world, [that is, which is invented and greatly esteemed by humane reason] nor of the Rulers of this world [that is, of the wise and mighty as ver. 8.] which come naught: [namely, with all their wisdome and might, forasmuch as it is of no use out of this world.]"}],"7":[{"catchword":null,"tekst":"But we speak the wisdome of God [that is, which God hath revealed to us for our salvation] (consisting) in a mystery, [ so the Apostle calls the doctrine of the Gospel, because the same was never found out by any humane wisdome, but was hidden from them, until God revealed it by his Prophets and Apostles] which was covered, which [namely, wisdome of God: whereby is understood the person of Christ, who 1 Cor. 1 24. is also called the wisdome of God: or the mysteries of our salvation purposed by God in Christ, and afterwards revealed in the Gospel unto our glory, Luk 2:32. Both well agree with that which follows] God ordained unto our glory, before the world was. [Gr. Before the ages.]"}],"8":[{"catchword":null,"tekst":"Which no man of the Princes of this world knew, [Namely, by their ion natural reason or understanding, how great and how acute soever it was. Such as were Herod, Pilat, Cajaphas, and other mighty ones in this world, as also of the Philosophers, Scribes, and such like. Otherwise Abraham also by Gods Spirit and revelation saw this day, Joh 8:56. and David rejoiced therein, Psa 16:9. with other holy Kings and Prophets Luk 10:24. and also some of the Rulers of the Jews, as Nicodemus and Joseph of Arimathea knew him; but these were few, and consented not unto his death, Luk 23:51. See the like phrase, Joh 3:32.] For if they had known them they would not have crucified the Lord of glory. [namely, who is the chief point of this wisdome of God. So Christ is called in respect of his divine nature, Psa 24:7. Acts7.2. who was crucified according to his humane nature. See the like phrase Joh 3:13. Act 3:15. and 20.28.]"}],"9":[{"catchword":null,"tekst":"But as it is written, that which the eye hath not seen, and arte not heard, and is not ascended into the hearts of men, [These words the Apostle interposeth for further explication of the former words of the Prophet, to that the mysteries of the Gospel, and the greatness of the glory which God hath prepared for his faithful ones hereafter, are so excellent, that not only no eye nor no ear, but even no understanding was able of it self to think of them, or to understand them. See 1 Pet. 1.ver.10,11,12.] that which God hath prepared for them that love him."}],"10":[{"catchword":null,"tekst":"But god hath revealed (it) to us [Namely, who love God. For that the Apostle speaks not only of the Apostle, but also of them that believe in Christ through their word, appears from what follows] by his spirit [namely, which by word, and with the word is powerful in us. See 2 Cor. 3.8. 1 john 2.27.] for the spirit seachedth all things, [this the Apostle saith, not as if the Holy Ghost which dwelleth in us, were ignorant of any divine thing; which he must seek to know, but because the deepest things of God are clearly known to him, as being the same God with Father and with the Son: as God is said to search and reins, because there are naked and known before him, Rom. 8.27.] Revel. 2.23.] even the depths of God. [that is, the most secret counsel of God. See Isa. 40.13.]"}],"11":[{"catchword":null,"tekst":"For who of men knoweth that which is of man, save the Spirit of man which is of him? [That is, the reasonable soul and understanding of man knoweth what is in them. See 1Jn 3:20.] even so also no man [namely, among the creatures. For the Son knoweth the Father, and the Father the Son, Mat. 11.27. and here also the Holy Ghost, as one only God with the Father and the Son, Rom. 8.27.] knoweth that which is of God, save the Spirit of God."}],"12":[{"catchword":null,"tekst":"But we have not received the Spirit of the world [That is, which teacheth worldly things, and hath delight, or placeth its happiness in worldly things] but the Spirit which is of God: [that is, which proceeds from God, and is promised and given to his children, Joh 14:16. Rom. 8.15.] that we might know the things which are freely given to us of God. [namely, for our comfort and salvation, i.e. Christ and his benefits, Rom. 8.32. Col. 2.9,10.]"}],"13":[{"catchword":null,"tekst":"Which we also speak, not with words which humane wisdom teacheth, but with (words) [Or, reasons, motives] which the Holy Ghost teacheth, [namely, in his divine inspiration and writings, not decked up with humane eloquence, but powerfully in its spiritual simplicity] conjoining [or, comparing Gr. judging together, i.e. as the doctrine is spiritual, so we propound it also, not with worldly, but with spiritual words] spiritual things with spiritual."}],"14":[{"catchword":null,"tekst":"But the natural man [Gr. The animal man i.e. he that hath no other or higher wisdom, then which the light of nature and humane reason teacheth him. See Hud. Ver.19.] comprehendeth not the things which are of the Spirit of God. [namely, to receive the same, and to apply them to himself for salvation, Rom. 8.5. See an example, Act 17:18. and chap.25.ver.19.] For they are foolishness unto him, [See 1 Cor. 1.ver.21.22,23.] and he cannot understand them, [namely, but by the grace and power of Gods Spirit, which enlightens the understanding and opens the heart, Act 16:14.] because they are spiritually distinguished. [Gr. Judged, i.e. with judgment distinguished from humane and worldly doctrines.]"}],"15":[{"catchword":null,"tekst":"But the spiritual (man) [That is, he that is enlightened and regenerated by the Spirit of God] distinguished indeed all things, [namely, necessary to salvation. For even believers sometimes err indeed in some things, but which are not needful to humane salvation: or when they do not sufficiently stir up this gift of discerning by diligence and prayer. See Joh 10:4.27. 1 Thes. 5.21. 1Jn 4:1.] but he himself is distinguished [or, judged, i.e. with judgment discerned as ver. 14.] of no man. [namely, who is not regenerate or spiritual: otherwise the Spirit of Prophets must also be subject to the Prophets, 1 Cor. 14.29, 32.]"}],"16":[{"catchword":null,"tekst":"For who hath known the mind of the Lord [Or, the spirit of the Lord, as Isa. 40.13. where these words are, is expressed, i.e. the sense or the meaning of the Spirit of the Lord, Rom. 8.27.] who should instruct him? But we have the mind of Christ. [that is, the meaning of Christ is made known to us by his word and by his Spirit, as is declared before ver. 10,12.]"}]}}};

  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
