am":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Wat betreft de dingen waarover u mij geschreven hebt: het is goed voor een mens geen vrouw aan te raken.","2":"Maar om de hoererijen te vermijden zal ieder man zijn eigen vrouw hebben, en iedere vrouw zal haar eigen man hebben.","3":"De man zal aan de vrouw geven wat hij haar schuldig is aan genegenheid; en net zo ook de vrouw aan de man.","4":"De vrouw heeft niet de macht over haar eigen lichaam, maar de man; en net zo heeft ook de man niet de macht over zijn eigen lichaam, maar de vrouw.","5":"Onttrek u niet aan elkaar, tenzij met wederzijdse instemming voor een tijd, opdat u zich aan vasten en bidden kunt wijden; en kom weer bijeen, opdat de satan u niet verzoekt, omdat u zich niet kunt onthouden.","6":"Maar dit zeg ik als toegeving, niet als bevel.","7":"Want ik zou willen dat alle mensen waren zoals ikzelf ben; maar ieder heeft zijn eigen gave van God, de een wel zo, maar de ander zo.","8":"Maar ik zeg de ongetrouwden en de weduwen: het is goed voor hen als zij blijven zoals ik.","9":"Maar als zij zich niet kunnen onthouden, laten zij trouwen; want het is beter te trouwen dan van begeerte te branden.","10":"Maar de getrouwden gebied ik niet, maar de Heere, dat de vrouw niet van de man scheidt.","11":"En als zij toch scheidt, laat zij dan ongetrouwd blijven, of zich verzoenen met de man; en dat de man de vrouw niet verlaat.","12":"Maar tegen de anderen zeg ik, niet de Heere: als een broeder een ongelovige vrouw heeft, en zij ermee tevreden is bij hem te wonen, laat hij haar niet verlaten;","13":"en een vrouw die een ongelovige man heeft, en hij ermee tevreden is bij haar te wonen, laat zij hem niet verlaten.","14":"Want de ongelovige man is geheiligd door de vrouw, en de ongelovige vrouw is geheiligd door de man; want anders waren uw kinderen onrein, maar nu zijn zij heilig.","15":"Maar als de ongelovige weggaat, laat hij weggaan. De broeder of de zuster is in zulke gevallen niet gebonden; maar God heeft ons tot vrede geroepen.","16":"Want wat weet u, vrouw, of u de man zult redden? Of wat weet u, man, of u de vrouw zult redden?","17":"Verder, zoals God aan ieder heeft toebedeeld, zoals de Heere ieder geroepen heeft, zo moet hij wandelen; en zo verordent ik het in alle gemeenten.","18":"Is iemand besneden geroepen, laat hij zich geen voorhuid aantrekken; is iemand in onbesneden staat geroepen, laat hij zich niet besnijden.","19":"De besnijdenis is niets, en de voorhuid is niets, maar het onderhouden van de geboden van God.","20":"Ieder moet blijven in de roeping waarin hij geroepen is.","21":"Bent u als dienstknecht geroepen, laat u dat niet bekommeren; maar als u ook vrij kunt worden, gebruik dat dan liever.","22":"Want wie in de Heere geroepen is als dienstknecht, is een vrijgelatene van de Heere; net zo ook, wie vrij zijnde geroepen is, is een dienstknecht van Christus.","23":"U bent duur gekocht, word geen dienstknechten van mensen.","24":"Ieder, broeders, moet blijven bij God in de staat waarin hij geroepen is.","25":"Wat betreft de maagden nu, heb ik geen bevel van de Heere; maar ik geef mijn mening, als iemand die barmhartigheid van de Heere gekregen heeft om betrouwbaar te zijn.","26":"Ik houd het er dan voor dat dit goed is vanwege de aanstaande nood, dat het, zeg ik, voor de mens goed is om zo te zijn.","27":"Bent u aan een vrouw verbonden, zoek geen ontbinding; bent u ongebonden van een vrouw, zoek geen vrouw.","28":"Maar als u toch trouwt, zondigt u niet; en als een maagd trouwt, zondigt zij niet. Toch zullen zulke mensen verdrukking hebben in het vlees; en ik spaar u daarvoor.","29":"Maar dit zeg ik, broeders: dat de tijd voortaan kort is; opdat ook zij die vrouwen hebben, zouden zijn alsof zij ze niet hadden;","30":"en zij die wenen, alsof zij niet weenden; en zij die blij zijn, alsof zij niet blij waren; en zij die kopen, alsof zij niet bezaten;","31":"en zij die deze wereld gebruiken, alsof zij die niet misbruikten; want de gedaante van deze wereld gaat voorbij.","32":"En ik wil dat u zonder zorgen bent. De ongetrouwde bekommert zich met de dingen van de Heere, hoe hij de Heere zal behagen;","33":"maar wie getrouwd is, bekommert zich met de dingen van de wereld, hoe hij de vrouw zal behagen.","34":"Een vrouw en een maagd zijn verschillend. De ongetrouwde bekommert zich met de dingen van de Heere, opdat zij heilig is, zowel naar lichaam als naar geest; maar wie getrouwd is, bekommert zich met de dingen van de wereld, hoe zij de man zal behagen.","35":"En dit zeg ik tot uw eigen voordeel; niet opdat ik een strik over u zou werpen, maar om u te leiden tot wat behoorlijk is, en geschikt om de Heere zonder afleiding aan te hangen.","36":"Maar als iemand meent dat hij zich ongepast gedraagt tegenover zijn maagd, als zij de bloeitijd voorbij is, en het zo moet gebeuren; laat hij doen wat hij wil, hij zondigt niet; laat hen trouwen.","37":"Maar wie vast staat in zijn hart, geen noodzaak hebbende, maar macht heeft over zijn eigen wil, en dit in zijn hart besloten heeft, dat hij zijn maagd zal bewaren, die doet goed.","38":"Dus, wie haar ten huwelijk uitgeeft, doet goed; en wie haar niet ten huwelijk uitgeeft, doet beter.","39":"Een vrouw is door de wet gebonden, zolang haar man leeft; maar als haar man ontslapen is, is zij vrij om te trouwen met wie zij wil, alleen in de Heere.","40":"Maar zij is gelukkiger als zij zo blijft, naar mijn mening. En ik denk dat ik ook de Geest van God heb."},"SV":{"1":"Aangaande nu de dingen, waarvan gij mij geschreven hebt; het is een mens goed geen vrouw aan te raken.","2":"Maar om der hoererijen wil zal een iegelijk *man* zijn eigen vrouw hebben, en een iegelijke *vrouw* zal haar eigen man hebben.","3":"De man zal aan de vrouw de schuldige goedwilligheid betalen; en desgelijks ook de vrouw aan den man.","4":"De vrouw heeft de macht niet over haar eigen lichaam, maar de man; en desgelijks ook de man heeft de macht niet over zijn eigen lichaam, maar de vrouw.","5":"Onttrekt u elkander niet, tenzij dan met *beider* toestemming voor een tijd, opdat gij u tot vasten en bidden moogt verledigen; en komt wederom bijeen, opdat u de satan niet verzoeke, omdat gij u niet kunt onthouden.","6":"Doch dit zeg ik uit toelating, niet uit bevel.","7":"Want ik wilde, dat alle mensen waren, gelijk als ikzelf *ben*; maar een iegelijk heeft zijn eigen gave van God, de een wel aldus, maar de andere alzo.","8":"Doch ik zeg den ongetrouwden, en den weduwen: Het is hun goed, indien zij blijven, gelijk als ik.","9":"Maar indien zij zich niet kunnen onthouden, dat zij trouwen; want het is beter te trouwen dan te branden.","10":"Doch den getrouwden gebiede niet ik, maar de Heere, dat de vrouw van den man niet scheide.","11":"En indien zij ook scheidt, dat zij ongetrouwd blijve, of met den man verzoene; en dat de man de vrouw niet verlate.","12":"Maar den anderen zeg ik, niet de Heere: Indien enig broeder een ongelovige vrouw heeft, en dezelve tevreden is bij hem te wonen, dat hij ze niet verlate;","13":"En een vrouw, die een ongelovigen man heeft, en hij tevreden is bij haar te wonen, dat zij hem niet verlate.","14":"Want de ongelovige man is geheiligd door de vrouw, en de ongelovige vrouw is geheiligd door den man; want anders waren uw kinderen onrein, maar nu zijn zij heilig.","15":"Maar indien de ongelovige scheidt, dat hij scheide. De broeder of de zuster wordt in zodanige *gevallen* niet dienstbaar gemaakt; maar God heeft ons tot vrede geroepen.","16":"Want wat weet gij, vrouw, of gij den man zult zalig maken? Of wat weet gij, man, of gij de vrouw zult zalig maken?","17":"Doch gelijk God aan een iegelijk heeft uitgedeeld, gelijk de Heere een iegelijk geroepen heeft, dat hij alzo wandele; en alzo verordene ik in al de Gemeenten.","18":"Is iemand, besneden zijnde, geroepen, die late zich geen *voorhuid* aantrekken; is iemand, in de voorhuid zijnde, geroepen, die late zich niet besnijden.","19":"De besnijdenis is niets, en de voorhuid is niets, maar de onderhouding der geboden Gods.","20":"Een iegelijk blijve in die beroeping, daar hij in geroepen is.","21":"Zijt gij, een dienstknecht zijnde, geroepen, laat u *dat* niet bekommeren; maar indien gij ook kunt vrij worden, gebruik *dat* liever.","22":"Want die in den Heere geroepen is, een dienstknecht zijnde, die is een vrijgelatene des Heeren; desgelijks ook, die vrij zijnde geroepen is, die is een dienstknecht van Christus.","23":"Gij zijt duur gekocht, wordt geen dienstknechten der mensen.","24":"Een iegelijk, waarin hij geroepen is, broeders, die blijve in hetzelve bij God.","25":"Aangaande de maagden nu, heb ik geen bevel des Heeren; maar ik zeg *mijn* gevoelen, als die barmhartigheid van den Heere gekregen heb, om getrouw te zijn.","26":"Ik houde dan dit goed te zijn, om den aanstaanden nood, dat het, *zeg* *ik*, den mens goed is alzo te zijn.","27":"Zijt gij aan een vrouw verbonden, zoek geen ontbinding; zijt gij ongebonden van een vrouw, zoek geen vrouw.","28":"Maar indien gij ook trouwt, gij zondigt niet; en indien een maagd trouwt, zij zondigt niet. Doch dezulken zullen verdrukking hebben in het vlees; en ik spare ulieden.","29":"Maar dit zeg ik, broeders, dat de tijd voorts kort is; opdat ook die vrouwen hebben, zouden zijn als niet hebbende;","30":"En die wenen, als niet wenende; en die blijde zijn, als niet blijde zijnde; en die kopen, als niet bezittende;","31":"En die deze wereld gebruiken, als niet misbruikende; want de gedaante dezer wereld gaat voorbij.","32":"En ik wil, dat gij zonder bekommernis zijt. De ongetrouwde bekommert zich met de dingen des Heeren, hoe hij den Heere zal behagen;","33":"Maar die getrouwd is, bekommert zich met de dingen der wereld, hoe hij de vrouw zal behagen.","34":"Een vrouw en een maagd zijn onderscheiden. De ongetrouwde bekommert zich met de dingen des Heeren, opdat zij heilig zij, beide aan lichaam en aan geest; maar die getrouwd is, bekommert zich met de dingen der wereld, hoe zij den man zal behagen.","35":"En dit zeg ik tot uw eigen voordeel; niet opdat ik een strik over u zou werpen, maar *om* *u* *te* *leiden* tot hetgeen wel voegt , en bekwaam is, om den Heere wel aan te hangen, zonder herwaarts en derwaarts getrokken te worden.","36":"Maar zo iemand acht, dat hij ongevoegelijk handelt met zijn maagd, indien zij over den jeugdigen tijd gaat, en het alzo moet geschieden; die doe wat hij wil, hij zondigt niet; dat zij trouwen.","37":"Doch die vast staat in *zijn* hart, geen noodzaak hebbende, maar macht heeft over zijn eigen wil, en dit in zijn hart besloten heeft, dat hij zijn maagd zal bewaren, die doet wel.","38":"Alzo dan, die *haar* ten huwelijk uitgeeft, die doet wel; en die *ze* ten huwelijk niet uitgeeft, die doet beter.","39":"Een vrouw is door de wet verbonden, zo langen tijd haar man leeft; maar indien haar man ontslapen is, zo is zij vrij, om te trouwen, dien zij wil, alleenlijk in den Heere.","40":"Maar zij is gelukkiger, indien zij alzo blijft, naar mijn gevoelen. En ik meen ook den Geest Gods te hebben."},"KJV":{"1":"Now concerning the things whereof ye wrote unto me: It is good for a man not to touch a woman.","2":"Nevertheless, to avoid fornication, let ➔ every man have his own wife, and let ➔ every woman have her own husband.","3":"Let ➔ the husband render unto the wife due benevolence: and likewise also the wife unto the husband.","4":"The wife hath ➔ not power of her own body, but the husband: and likewise also the husband hath ➔ not power of his own body, but the wife.","5":"Defraud ye not one the other, except it be with consent for a time, that ye may give yourselves to fasting and prayer; and come together again, that ➔ Satan tempt you not for your incontinency.","6":"But I speak this by permission, and not of commandment.","7":"For I would that all men were even as I myself. But every man hath his proper gift of God, one after this manner, and another after that.","8":"I say therefore to the unmarried and widows, It is good for them if they abide even ➔ as I.","9":"But if they ➔ cannot contain, let them marry: for it is better to marry than to burn.","10":"And unto the married I command, yet not I, but the Lord, Let ➔ not the wife depart from her husband:","11":"But and if she depart, let her remain unmarried, or be reconciled to her husband: and let ➔ not the husband put away his wife.","12":"But to the rest speak I, not the Lord: If any brother hath a wife that believeth not, and she be pleased to dwell with him, let him ➔ not put ➔ her away.","13":"And the woman which hath an husband that believeth not, and if he be pleased to dwell with her, let her ➔ not leave him.","14":"For the unbelieving husband is sanctified by the wife, and the unbelieving wife is sanctified by the husband: else were your children unclean; but now are they holy.","15":"But if the unbelieving depart, let him depart. A brother or a sister is ➔ not under bondage in such cases: but God hath called us to peace.","16":"For what knowest thou, O wife, whether thou shalt save thy husband? or how knowest thou, O man, whether thou shalt save thy wife?","17":"But as God hath distributed to every man, as the Lord hath called every one, so let him walk. And so ordain I in all churches.","18":"Is ➔ any man called being circumcised? let him ➔ not become uncircumcised. Is ➔ any called in uncircumcision? let him ➔ not be circumcised.","19":"Circumcision is nothing, and uncircumcision is nothing, but the keeping of the commandments of God.","20":"Let ➔ every man abide in the same calling wherein he was called.","21":"Art thou called being a servant? care ➔ not for it: but if thou mayest be made free, use it rather.","22":"For he that is called in the Lord, being a servant, is the Lord's freeman: likewise also he that is called, being free, is Christ's servant.","23":"Ye are bought with a price; be ➔ not ye the servants of men.","24":"Brethren, let ➔ every man, wherein he is called, therein abide with God.","25":"Now concerning virgins I have no commandment of the Lord: yet I give my judgment, as one that hath obtained mercy of the Lord to be faithful.","26":"I suppose therefore that this is good for the present distress, I say, that it is good for a man so to be.","27":"Art thou bound unto a wife? seek not to be loosed. Art thou loosed from a wife? seek not a wife.","28":"But and if thou marry, thou hast ➔ not sinned; and if a virgin marry, she hath ➔ not sinned. Nevertheless such shall have trouble in the flesh: but I spare you.","29":"But this I say, brethren, the time is short: it remaineth, that both they that have wives be as though they had none;","30":"And they that weep, as though they wept not; and they that rejoice, as though they rejoiced not; and they that buy, as though they possessed not;","31":"And they that use this world, as not abusing it: for the fashion of this world passeth away.","32":"But I would have you without carefulness. He that is unmarried careth for the things that belong to the Lord, how he may please the Lord:","33":"But he that is married careth for the things that are of the world, how he may please his wife.","34":"There is difference also between a wife and a virgin. The unmarried woman careth for the things of the Lord, that she may be holy both in body and in spirit: but she that is married careth for the things of the world, how she may please her husband.","35":"And this I speak for your own profit; not that I may cast a snare upon you, but for that which is comely, and that ye may attend upon the Lord without distraction.","36":"But if any man think that he behaveth himself uncomely toward his virgin, if she pass the flower of her age, and need so require, let him do what he will, he sinneth not: let them marry.","37":"Nevertheless he that standeth stedfast in his heart, having no necessity, but hath power over his own will, and hath ➔ so decreed in his heart that he will keep his virgin, doeth well.","38":"So then he that giveth her in marriage doeth well; but he that giveth her ➔ not in marriage doeth better.","39":"The wife is bound by the law as long as her husband liveth; but if her husband be dead, she is at liberty to be married to whom she will; only in the Lord.","40":"But she is happier if she ➔ so abide, after my judgment: and I think also that I have the Spirit of God."}},"tsk":{"1":[{"kopje":"goed","refs":["1 Kor 7:8","1 Kor 7:26","1 Kor 7:27","1 Kor 7:37","1 Kor 7:38","Matt 19:10","Matt 19:11"]},{"kopje":"aan te raken","refs":["Gen 20:6","Ruth 2:9","Spr 6:29"]}],"2":[{"kopje":"te vermijden","refs":["1 Kor 7:9","1 Kor 6:18","Spr 5:18","Spr 5:19","1 Tim 4:3"]},{"kopje":"zal","refs":["Spr 18:22","Spr 19:14","Mal 2:14","Ef 5:28","Ef 5:33"]}],"5":[{"kopje":"tenzij","refs":["Ex 19:15","1 Sam 21:4","1 Sam 21:5","Joël 2:16","Zach 7:3","Zach 12:12-14"]},{"kopje":"opdat de satan","refs":["Matt 19:11","1 Tess 3:5"]}],"6":[{"kopje":"als","refs":["1 Kor 7:12","1 Kor 7:25","2 Kor 8:8","2 Kor 11:17"]}],"7":[{"kopje":"zou willen","refs":["1 Kor 7:26","1 Kor 9:5","1 Kor 9 en getrouwde huisvrouw, en niet vele."}],"3":[{"catchword":"de schuldige","tekst":"Hoewel dit verstaan kan worden in het algemeen van alle schuldige plichten tussen man en vrouw, Eph 5:22 , zo wordt het nochtans hier voornamelijk verstaan van die plichten, die het huwelijk eigen zijn, gelijk uit vs.4 blijkt."}],"4":[{"catchword":"de macht","tekst":"Namelijk om den man in deze schuldige goedwilligheid zonder reden haar lichaam te onttrekken, gelijk vs.5 verklaart."}],"5":[{"catchword":"bidden moogt","tekst":"Hij spreekt hier niet van gewoon bidden, waartoe alle Christenen ten allen tijde moeten bereid zijn, maar van buitengewone noden van bidden, hetzij die noden den getrouwden in het bijzonder, of de gemeente van Christus in het algemeen aangaan, gelijk uit het bijvoegen van vasten blijkt, hetwelk niet in alle gelegenheden, maar in het bidden in bijzondere noden vereist wordt. Zie Exo 19:15 ; Joe 2:16 ; Mat 17:21 ; Act 13:2 ."},{"catchword":"niet verzoeke,","tekst":"Dat is, bij deze gelegenheid niet verwekke tot onbehoorlijke lusten of andere onkuischheid."}],"6":[{"catchword":"Doch dit","tekst":"Dit wordt niet verstaan van hetgeen de apostel gezegd heeft op het 2e vs. alzo dengenen, die de gave der onthouding niet hebben, niet alleen wordt toegelaten te trouwen, maar ook bevolen; gelijk ook in het 9e vs.; maar van hetgeen terstond tevoren van het onthouden voor een tijd, en dan weder bijeen te komen, gezegd is, hetwelk hij in de vrijheid der getrouwden wil laten, nadat zij zichzelven daarin sterk of zwak bevinden, en naar dat hun nood en beroep zal verdragen."}],"7":[{"catchword":"ik wilde","tekst":"De apostel verklaart, om de redenen die daar zullen verhaald worden, dat hij liever had dat zij allen de gave der onthouding hadden. Doch evenwel dat een iegelijk moet letten op de gaven, die hij van God daartoe ontvangen heeft; de een namelijk om zich te onthouden, de ander om het huwelijk in eer en matigheid te gebruiken."}],"8":[{"catchword":"den ongetrouwden","tekst":"Namelijk die zichzelven zijn, gelijk het Griekse woord mede brengt. Want van de maagden, die onder eens anderen macht staan, zal hij hierna in vs.9 beginnen te behandelen."},{"catchword":"goed indien","tekst":"Dat is, raadzaam, dienstig en onbekommerlijker. Zie vs.26."}],"9":[{"catchword":"dan te branden","tekst":"Dat is, het is goed te trouwen, om niet door de begeerten des vleesches tot kwade lusten te worden ontstoken en in gevaar te blijven van tot onkuischheid te vervallen, hetwelk altijd kwaad is."}],"10":[{"catchword":"niet ik,","tekst":"Namelijk als de eerste voorsteller van dit gebod, maar als een verhaler van hetgeen Christus de Heere tevoren uitdrukkelijk verboden heeft. Zie Mat 19:3 , enz."}],"11":[{"catchword":"indien zij","tekst":"Namelijk anders dan vanwege des mans overspel. Zie Mat 5:32 , en Mat 19:9 ."},{"catchword":"dat zij","tekst":"Dat is, dat zij tot geen ander huwelijk in de gemeente worde toegelaten, zo zij met den man niet kan verzoend worden."}],"12":[{"catchword":"den anderen zeg","tekst":"Namelijk gelovigen, die met ongelovigen getrouwd zijn."},{"catchword":"ik,","tekst":"Namelijk als een apostel van Christus, door Zijnen Geest onderricht en gedreven."},{"catchword":"niet de Heere","tekst":"Namelijk door een uitgedrukt bevel, gelijk het voorgaande was, vs.10. De reden hiervan schijnt te zijn dat Christus het Evangelie alleen onder de Joden, die in Gods verbond nog waren, en niet onder de heidenen, daar dit onderscheid toenmaals voorviel, heeft gepredikt, hetwelk Hij hierom ter Zijner tijd door Zijne apostelen heeft laten voorstellen en gebieden."},{"catchword":"ongelovige","tekst":"Dat is, vreemd van de Christelijke religie, gelijk de heidenen waren."},{"catchword":"bij hem te","tekst":"Namelijk gelijk de getrouwden plegen, en gelijk hun betaamt."}],"14":[{"catchword":"is geheiligd door de vrouw,","tekst":"Gr. geheiligd in de vrouw, als ook daarna in den man; namelijk ten aanzien, dat de gelovigen zijn erfgenamen des verbonds Gods met hunne kinderen, Gen 17:7 ; Act 2:39 , welk voordeel de ongelovige wederhelft niet kan beletten door zijne ongelovigheid, omdat Gods genade in het heiligen van zulk huwelijk krachtiger is dan het geloof van de andere wederhelft, om het te ontheiligen."},{"catchword":"waren uw kinderen","tekst":"Dat is, vreemd van Gods verbond, gelijk van de ongelovigen en hun zaad wordt betuigd; Eph 2:12 ."},{"catchword":"zijn zij heilig","tekst":"Dat is, zijn in het uiterlijk verbond Gods begrepen, en hebben toegang tot de tekenen en zegelen van Gods genade, zowel als degenen, die van beide gelovige ouders zijn geboren."}],"15":[{"catchword":"scheidt","tekst":"Dat is, de gelovige verlaat, of van zich jaagt, en den band des huwelijks hardnekkig van zijne zijde tenietdoet; gelijk toen bij de heidenen gewoonlijk was, en nu ook bij de Turken."},{"catchword":"in zodanige","tekst":"Namelijk wanneer die alzo den band des huwelijks van hunne zijde breken, uit haat alleen van het geloof."},{"catchword":"dienstbaar gemaakt;","tekst":"Dat is, niet gehouden van hunne zijde den band des huwelijks verder te houden, of ongetrouwd te blijven, gelijk hij den getrouwden, vs.11, in het algemeen had bevolen; van welk gebod die ook uitgenomen worden."},{"catchword":"tot vrede geroepen","tekst":"Gr. in vrede; dat is, om in vrede en met een geruste conscientie, hetzij in het huwelijk of buiten hetzelve te leven."}],"16":[{"catchword":"gij, vrouw, of gij","tekst":"Namelijk die gelovig zijt en bij den ongelovigen man in vrede leeft."},{"catchword":"zult zalig maken?","tekst":"Namelijk door uw vreedzamen en Christelijken wandel voor Christus gewinnen zal. Zie 1Ti 4:16 ; Jam 5:20 ; 1Pe 3:1-2 ."}],"17":[{"catchword":"Doch gelijk","tekst":"Dat is, een iegelijk zij tevreden en schikke zich naar de gaven en het beroep, dat hij van den Heere verkregen heeft, hetzij in den huwelijken staat of daarbuiten; hetwelk hij daarna ook tot andere beroepen der mensen uitstrekt, opdat door de Christenen, onder den naam van den Christelijken godsdienst, de staat der maatschappij niet worde beroerd of de gemeente worde hatelijk gemaakt."}],"18":[{"catchword":"geen voorhuid","tekst":"Gelijk door de kunst van heelkunde geschieden kan. Zie 1 MacHab 1:16 ; JoZEf. Antiq.lib.12,cap6. Namelijk als menende dat hij Gode daardoor te aangenamer zou zijn."},{"catchword":"in de voorhuid","tekst":"Dat is, onbesneden."}],"19":[{"catchword":"is niets","tekst":"Dat is, van gene kracht tot de godzaligheid. Hetwelk de apostel verstaat, voornamelijk van de tijden des Nieuwen Testaments, wanneer de belijdenis geen sacrament meer is. Zie Gal 5:6 ."}],"20":[{"catchword":"blijve in die","tekst":"Dat is, zij gerust en late zich genoegen."}],"21":[{"catchword":"laat u dat","tekst":"Namelijk alsof gij Gode daarom te min zoudt behagen, zo gij maar een oprecht Christen zijt. Zie 1Co 12:13 ; Gal 3:28 ."},{"catchword":"kunt vrij worden,","tekst":"Namelijk door wettelijke en behoorlijke wegen, gelijk onder de heidenen, waar de slavernij in zwang was, verscheidene wegen waren, waardoor de slaven tot hunne vrijheid konden komen."}],"22":[{"catchword":"geroepen is,","tekst":"Dat is, tot het geloof in Christus bekeerd is, nog een dienstknecht of slaaf zijnde."},{"catchword":"een vrijgelatene","tekst":"Dat is, door den Heere van de dienstbaarheid der zonde en des duivels bevrijd. Zie Joh 8:34-36 ."},{"catchword":"vrij zijnde geroepen","tekst":"Namelijk naar den burgerlijken of uitwendigen stand."},{"catchword":"een dienstknecht van","tekst":"Dat is, Zijne macht en geboden onderworpen, gelijk een dienstknecht aan zijnen heer."}],"23":[{"catchword":"duur gekocht;","tekst":"Gr. door prijs. Zie 1Co 6:20 ."},{"catchword":"geen dienstknechten","tekst":"Namelijk om iets te doen tot dienst of gehoorzaamheid van mensen, hetgeen zou strijden tegen de geboden en den dienst Gods. Of, laat u in geesteijke zaken van geen mensen dienstbaar maken, om niet vrijelijk te gebruiken hetgeen ons de Heere vrijgesteld heeft. Zie Gal 5:1 ; Col 2:20 ."}],"24":[{"catchword":"bij God","tekst":"Dat is, als in Gods tegenwoordigheid; of om zich in zulk beroep behoorlijk te kwijten."}],"25":[{"catchword":"geen bevel des","tekst":"Of, ordinantie; dat is, geen uitgedrukt bevel Gods of van Christus; namelijk dat iemand zou moeten maagd blijven. Waaruit blijkt dat de woorden van Christus, Mat 19:12 , die dit vatten kan, vatte het, geen gebod, maar alleen ene toelating is."},{"catchword":"zeg mijn","tekst":"Gr. geve."},{"catchword":"getrouw te zijn","tekst":"Namelijk in mijne leer en bediening, en derhalve ook in hetgeen ik hier verklaar. Zie vs.40, en 1Co 4:1-2 . Of, geloofwaardig te zijn."}],"26":[{"catchword":"goed te zijn","tekst":"Dat is, oorbaar en dienstig, gelijk vs.1, 8."},{"catchword":"aanstaanden nood,","tekst":"Of, tegenwoordigen nood; namelijk der gemeente van Christus, die nu in gedurige vervolging, zwarigheid en ballingschap is. Zie dergelijke wijze van spreken 2Co 6:4 , en 1Th 3:7 , welke noden beter en lichter kunnen uitgestaan worden van de ongetrouwden dan van de getrouwden, die met huisgezin en kinderen belast zijn."},{"catchword":"alzo te zijn","tekst":"Dat is, ongetrouwd. Waarbij ook altijd verstaan wordt de voorwaarde hiervoren in vs.8,9 gesteld, gelijk ook hierna in vs.35,36 van de gave der onthouding."}],"27":[{"catchword":"zoek geen","tekst":"Namelijk zelfs niet om den aanstaanden nood, gelijk iemand zijn vorige woorden had kunnen misduiden."}],"28":[{"catchword":"verdrukking hebben","tekst":"Dat is, zwarigheden, ongenoegen en vele zorgen."},{"catchword":"in het vlees;","tekst":"Dat is, naar den uitwendigen mens, of naar het tegenwoordig leven. En dit zegt hij voor degenen, die zichzelven niet dan gemak en vermaak in het huwelijk inbeelden."},{"catchword":"en ik spaar","tekst":"Dat is, ik wilde wel dat gij van zulke bekommernissen en zwarigheden, als het huwelijk medebrengt, vrij waart, gelijk hierna vs.32, en vervolgens nader wordt verklaard, namelijk om den Heere te vrijer te kunnen dienen."}],"29":[{"catchword":"de tijd voorts","tekst":"Gr. de tijd is tezamen, of ingetrokken. Dit kan verstaan worden, òf van den tijd des levens van een iegelijk mens, alzo de eeuwen dagelijks verzwakken, en daarom de mens te meer op het geestelijke moet denken, hetwelk eeuwigdurend is; òf van den tijd, dat de wereld nog zal staan, welke ook kort gezegd wordt te zijn, ten aanzien van den voorgaanden tijd, en daarom de laatste ure genaamd wordt, opdat wij ons te zorgvuldiger zouden bereiden, om Christus onzen rechter haast uit den hemel te verwachten. Zie 1Pe 4:7 ; 2Pe 3:8 . Anderen lezen: De tijd is kort; zo is overig, dat ook die vrouwen hebben, enz."},{"catchword":"als niet hebbende;","tekst":"Dit zegt Paulus niet om het gebruik des huwelijks den getrouwden te verbieden, want zulks zou strijden met hetgeen tevoren, vs.3-5, gezegd is; maar om hen tot maat en nadenken in dat gebruik te vermanen, opdat de geestelijke plichten derzelve daardoor niet worden verhinderd, gelijk ook in hetgeen volgt."}],"30":[{"catchword":"die wenen,","tekst":"Dat is, die in droefheid zijn, voornamelijk over de ongevallen, die het huwelijk medebrengt, door het afsterven van man, vrouw, kinderen, of dergelijke zwarigheden en tegenspoeden, die in het huwelijk voorvallen."},{"catchword":"die blijde zijn,","tekst":"Namelijk over de oorzaken, die de huwelijke staat ook somwijlen hiertoe geeft, in het krijgen van kinderen, uit huwelijken, of andere gemakken en vermakingen."},{"catchword":"als niet bezittende;","tekst":"Dat is, hun hart daarop niet stellende, alzo dat zij door het gebruik derzelve van het voornaamste goed zouden afgekeerd worden. Zie Mat 6:19 , Mat 6:33 , gelijk ook de volgende woorden verklaren."}],"31":[{"catchword":"de gedaante dezer","tekst":"Dat is, de dingen, die de wereld als een groot goed en geluk acht, maar die niets anders dan een schijn daarvan zijn, gelijk enige vertoningen in de schouwspelen plegen, waarvan het Griekse woord schema genomen is; zie Ecc 1:2 ; 1Jo 2:16-17 ."}],"32":[{"catchword":"ik wil dat gij","tekst":"Dat is, ik zou wel willen, of wensen."},{"catchword":"bekommert zich","tekst":"Dat is, behoort zich te bekommeren; en kan dat vrijelijker doen, omdat hij door de zorg van het huishouden niet wordt verhinderd."}],"33":[{"catchword":"bekommert zich met","tekst":"Dat is, pleegt zulks gewoonlijk te doen, en is vanwege de zorg van het huishouden en om zijne wederhelft te behagen, meer daaraan gebonden."},{"catchword":"der wereld, hoe","tekst":"Het woord wereld wordt hier niet genomen voor de wereldse begeerlijkheden, die ongeoorloofd zijn en alom in Gods Woord verboden, maar voor zulke dingen, waardoor het huisgezin in deze wereld wordt onderhouden, als spijs, drank, kleding, woning, nering, en dergelijke, die in zichzelven niet ongeoorloofd zijn, 1Ti 3:4 , en 1Ti 5:8 , maar evenwel den mens bekommeren, om op het geestelijke niet altijd zo ernstig en gedurig te denken, en waarin de ongetrouwden min verhindering hebben dan de getrouwden, wanneer de gaven en beroep zulks toelaten. Zie een voorbeeld hiervan in Maria en Martha; Luk 10:39 ."},{"catchword":"vrouw zal behagen","tekst":"Niet om iets te doen tegen Gods wil. Want alzo mogen wij geen mensen behagen, Luk 14:26 ; Gal 1:10 , maar om in liefde en vrede met hen te leven, Eph 5:25 ; hetwelk ook alzo moet verstaan worden van de bekommering der vrouw jegens den man in vs.35."}],"35":[{"catchword":"tot uw eigen","tekst":"Dat is, gemak en oorbaar. En alzo verklaart hij in dit vers hetgeen hij tevoren goed of niet goed genaamd heeft."},{"catchword":"een strik over u","tekst":"Namelijk om u tot het ongetrouwde leven stipt te verbinden."},{"catchword":"herwaarts en derwaarts","tekst":"Of, onaftrekkelijk; namelijk met de zorgen en bekommernissen dezer wereld."}],"36":[{"catchword":"acht dat hij","tekst":"Dat is, uit alle tekenen, dat hij daarvan bespeurt, gewaar wordt of oordeelt. Hij spreekt hier eigenlijk van ouders of voogden, waar de maagden onder staan."},{"catchword":"ongevoegelijk","tekst":"Dat is, niet wel betamelijk, of wel bedachtelijk, zo hij zijne maagd tegen hare natuur of genegenheid zou beletten te trouwen; of ook wel tegen den eis van de gelegenheid zijner familie."},{"catchword":"alzo moet geschieden;","tekst":"Namelijk om meerdere zwarigheden zo ten aanzien van haar als van zijne familie, voor te komen."}],"37":[{"catchword":"geen noodzaak hebbende,","tekst":"Namelijk òf voor zichzelven tot behoudenis van zijne familie en andere gelegenheden, die de ouders dikwijls noodzaken hunne kinderen uit te huwelijken; of vanwege de broosheid der kinderen, waarvan in vs.37 is gesproken."},{"catchword":"zal bewaren, die","tekst":"Namelijk ongetrouwd."}],"38":[{"catchword":"die doet beter","tekst":"Dat is, die doet wat dienstig of oorbaarder is tot de rust van zijne maagd, gelijk vs.1, 8, 26, en gelijk verklaard wordt vs.35, 40."}],"39":[{"catchword":"de wet verbonden","tekst":"Namelijk des huwelijks. Zie Rom 7:2 ."},{"catchword":"haar man leeft;","tekst":"Namelijk tenzij uit oorzaak van overspel, Mat 19:9 , of van het scheiden der ongelovige wederhelft, hiervoren vs.15."},{"catchword":"in den Heere","tekst":"Dat is, alleenlijk dat zulks geschiede in de vreze des Heeren, waartoe ook zonderling dient, dat zij, nu vrij zijnde, geen juk aantrekke met de ongelovigen; 2Co 6:14 ."}],"40":[{"catchword":"gelukkiger, indien","tekst":"Namelijk zo ten aanzien van de bekommeringen, die het huwelijk medebrengt, als van de vrijheid, die zij heeft om den Heere onbekommerlijker te dienen, gelijk hiervoren van den apostel is verklaard. Doch dit moet ook altijd verstaan worden met de vorige voorwaarden, zo zij de gave der onthouding heeft, en haar beroep zulks toelaat, gelijk hij dit bepaald heeft, vs.7, 17."},{"catchword":"ik meen ook den","tekst":"Dit zegt de apostel niet alsof hij daaraan twijfelde, maar om beleefd van zichzelven te spreken, tegen den valsen waan, welken sommigen onder hen van zichzelven hadden. Zie hiervoren vs.25."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now concerning the thing whereof ye wrote unto me, it is good [ By this word good here, is understood not that which is honest, virtues, or holy; for the Apostle testifieth that the married estate is honourable. Heb. 13. 4. as also the Holy Scripture throughout; but for that which hath less trouble, incumbency and inconvenience as the Apostle expounds the same hereafter ver. 26.] for a man (homo) [that is, (vir) ] not to touch [that is, to marry, or to know, as this word is also taken thus, Gen. 20. 6. ] a wife."}],"2":[{"catchword":null,"tekst":"But because of fornications [He speaks in the plural number, thereby to express all manner of uncleanness and wantonness] every (man) shall have his own wife [Gr. A wife of his own i.e. one married wife, and not many] and every (wife) shall have her own husband."}],"3":[{"catchword":null,"tekst":"The husband shall pay to the wife the due benevolence: [Although this may be understood in general of all duties between man and wife Eph. 5. 22. yet nevertheless it is here principally understood of those duties which are peculiar to marriage, as appears by the following verse] and likewise also the wise to the husband."}],"4":[{"catchword":null,"tekst":"The wife hath not the power over her own body, [Namely, to withhold her body from the husband without reason in this due benevolence, as the following verse declares] but the husband; and like wise also the husband hath not the power over his own body, but the wife."}],"5":[{"catchword":null,"tekst":"Withhold not your selves from one another except it be with consent (of both) for a time, that you may be at leisure for fasting and prayer: [He speaks not here of ordinary prayer whereunto all Christians must be ready at all times, but of extraordinary necessities of prayer whether those necessities concerned those married persons in particular, or the Church of Christ in general, as by the joining of fasting appears, which is not required in all occasions, but in prayers in especial necessities. See Exod. 19. 15. Joel. 2. 16. Mat. 17. 21. Acts 13. 2.] and come together again, that Satan tempt you not [that is, by this occasion stir you not up to unfitting lusts or other uncleanness] because ye cannot contain your selves."}],"6":[{"catchword":null,"tekst":"But this I say by permission, not by command, [ This is not to be understood of that which the Apostle said in the second verse, seeing they that have not the gift of continence are not only permitted to marry, but also commanded, as also in the ninth verse: but of that which was spoken immediately before, of abstaining for a time and then coming together again, which he will leave to the liberty of the married according as they find themselves strong or weak therein, and according as their necessity and calling will bear.]"}],"7":[{"catchword":null,"tekst":"For I would that all men were even as my self (am) [The Apostle declares, for reasons which shall be rehearsed, that he had rather that they all had a gift of continence. Yet nevertheless that every one must take notice of the gifts which he hath received from God for this purpose: namely, the one to contain himself, the other to make use of marriage in honour and moderation,] but every one hath his proper gift of God, the one indeed on this, but the other in that."}],"8":[{"catchword":null,"tekst":"But I say to the unmarried, [Namely, who are in their own as the Greek word imports. For of the virgins which are under the power of another, he will begin to treat hereafter in the 25. verse] and to the windows, it is good for them, [that is, advisable, useful and less troublesome. See v. 26.] if they remain even as I."}],"9":[{"catchword":null,"tekst":"But they cannot contain themselves let them marry: for it is better to marry than to burn. [That is, it is good to marry, that we may not be inflamed with sinful lusts through desires of the flesh, and remain in danger to fall into uncleanness; which is always evil.]"}],"10":[{"catchword":null,"tekst":"But to the married command not I [Namely, as the first proposer of this command, but as a relater of that which the Lord Christ hath expressly commanded before. See Mat. 19. 3. etc] but the Lord that the wife depart not from her husband."}],"11":[{"catchword":null,"tekst":"And if she also depart [Namely, otherwise then because of the husband&acirc;&euro;&trade;s adultery. See Mat. 5. 32. and chap. 19. v. 9. ] let her remain unmarried, [that is, let her not be permitted any other marriage in the church, if she cannot be reconciled to her husband] or be reconciled to the husband; and let not the husband forsake the wife."}],"12":[{"catchword":null,"tekst":"But to the others [ Namely, believers which are married to unbelievers ] Say I, [Namely, as an Apostle of Christ, informed and moved by his Spirit] not the Lord, [namely, by an express command as the former was, v. 10. The reason hereof seemeth to be, that Christ preached the Gospel only among the Jews who were yet in Gods covenant, and not amongst the Gentiles, where this difference fell out at that time, which therefore he caused to be propounded and commanded in its season by his Apostles] If any brother hath an unbelieving wife, [that is, a stranger from the Christian Religion, as the Gentiles were] and the same be content to dwell with him [namely, as those that are married use to do, and as it becometh her] let him not forsake her."}],"13":[{"catchword":null,"tekst":"And a wife that hath an unbelieving husband, and he be content to dwell with her, let her not forsake him."}],"14":[{"catchword":null,"tekst":"For the unbelieving husband is sanctified by the wife, [Gr. Sanctified in the wife, as also afterward in the husband. Namely, in regard those believers are heirs of Gods covenant, with their children, Gen. 17. 7. Acts 2. 39. which advantage the unbelieving party cannot hinder by his unbelief, because the grace of God in sanctifying such a marriage, is more powerful than the unbelief of the other party to unhallow the same] and the unbelieving wife is sanctified by the husband. For otherwise your children were unclean, [that is, strangers from God&acirc;&euro;&trade;s covenant, as is testified of the unbelieving Gentiles and their seed, Eph. 2. 12.] but now are they holy. [that is, are comprehended in the outward covenant of God, and have access to the signs and seals of God&acirc;&euro;&trade;s grace, as well as they that are born of both believing parents.]"}],"15":[{"catchword":null,"tekst":"But if the unbeliever depart [That is, forsake the believer, or drives him from her, and obstinately on his side makes void the bond of marriage, as was then usual with the Gentiles, and now also with the Turks] let him depart. A brother or a filter is not embondaged [That is, not bound on their side to hold the bond of marriage any further, or to remain unmarried, as he had commanded the married in general, v. 11. from which command they are also excepted] in such (cases:) [namely, when they on their side thus break the bond of marriage, only, out of hatred to the faith] but God hath called us to peace. [Gr. In peace, i.e. to live in peace and with a quiet conscience, whether it be in marriage or out of the same.]"}],"16":[{"catchword":null,"tekst":"For what knowest thou O wife [Namely, who art a believer, and livest in peace with an unbelieving husband] whether thou shalt save thy husband? [namely, by thy peaceable and Christian walking shalt win him to Christ. See 1 Tim. 4. 16. Sam. 5. 20. 1 Pet. 3. 1, 2.] Or what knowest thou husband that thou shalt save thy wife?"}],"17":[{"catchword":null,"tekst":"But as God hath distributed to every one, as the Lord hath called every one, so let him walk: [That is, let every one be content and frame himself according to the gifts and the calling which he hath obtained of the Lord, whether it be in a married estate or out of it: which afterwards he extends also to other callings of men, that by Christians under the name of Christian Religion, the State of the commonwealth might not be distributed, or the church be made hateful] and so ordain I in all the churches."}],"18":[{"catchword":null,"tekst":"Is any man called being circumcised? Let him not cause (the foreskin) to be drawn on. [As may be done by the art Chirurgery. See 1 Mat. 1. 16. Joseph. An. Lib. 12. cap. 6. Namely, as thinking that he should be the more acceptable to God thereby] Is any man called being in the foreskin [that is, uncircumcised] let him not be circumcised."}],"19":[{"catchword":null,"tekst":"Circumcision is nothing, [That is, of no force unto godliness. Which the Apostle understands chiefly of the times of the New Testament, when circumcision is no more a sacrament. See Gal. 5. 6.] and uncircumcision is nothing , but keeping of the commandments of God."}],"20":[{"catchword":null,"tekst":"Let every one abide in that calling [That is, be quiet and satisfy himself] wherein he is called."}],"21":[{"catchword":null,"tekst":"Art thou called being a servant ? let not (that) trouble thee; [Namely, as if thou be but a sincere Christian. See 1 Cor. 12. v. 13. and Gal. 3. 28.] but if thou canst also become free [namely, by lawful and fit ways, as amongst the Gentiles where slavery was in use, there were divers ways whereby the slaves might come to their freedom] use (that) rather."}],"22":[{"catchword":null,"tekst":"For he that is called in the Lord being a servant, [That is, is converted to faith in Christ being yet a servant or slave] he is a free-man of the Lord: [that is, by the Lord freed from the bondage of sin and of the Devil. See John 8. v. 34, 35, 36.] Likewise also he that is called being free, [namely, according to the civil or outward state] he is a servant of Christ. [that is, subject to his power and commands, as a servant to his Lord.]"}],"23":[{"catchword":null,"tekst":"Ye are dearly brought [Gr. By price. See the last verse of the former chapter] Be not the servants of men. [namely, to do anything for the service or obedience of which should be repugnant to the commands of the service of God. Or suffer not your selves in spiritual things to be brought in bondage by any men, that you should not freely use that which the Lord hath made free to us. See Gal. 5.1. Col. 2.20.]"}],"24":[{"catchword":null,"tekst":"Every one wherein is called, brethren, let him abide in the same with God. [That is, as in the presence of God: or, duly to acquit himself in such a calling.]"}],"25":[{"catchword":null,"tekst":"Now concerning Virgins I have no command of the Lord: [Or, no ordinance, i.e. no express command of God or Christ: namely, that any one ought to remain a virgin. Whereby it appears that the words of Christ, Mat. 19.12. He that comprehend this, let him comprehend it, are not command but only a permission] but I speak [Gr. Give] (my) opinion, as who have obtained mercy of the Lord, to be faithful. [namely, in my doctrine and ministry, and in that respect also in that which I declare. See ver.40. and 1 Cor. 4.1.2 Or, to be worthy of credit.]"}],"26":[{"catchword":null,"tekst":"I hold this therefore to be good [That is, profitable and useful as ver. 1.8.] for the instant necessity, [Or, present need. Namely, of the Church which is now in continual trouble, persecution and banishment. See the like phrase, 2 Cor. 6.4. and 1. The. 3.7. which necessity may better and easier be endured by the unmarried then by the married, who are burdened with a family and children] that (I say) it is good for a man to be even so. [that is, unmarried, wherewith also is always to be understood the condition set down before in the 9. ver. As hereafter in the 3.5. and 36. verse, of the gift of continence.]"}],"27":[{"catchword":null,"tekst":"Art thou bound to a wife? Seek no dissolution: [Namely, no not that the instant necessity, as some might have misinterpreted his former words] art thou loosed from a wife? Seek not a wife."}],"28":[{"catchword":null,"tekst":"But // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

}
document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +

  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
