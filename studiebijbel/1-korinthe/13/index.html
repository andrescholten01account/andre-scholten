","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn.","2":"En al zou het zo zijn dat ik de *gave* van de profetie had, en al de verborgenheden en al de wetenschap wist; en al zou het zo zijn dat ik al het geloof had, zodat ik bergen verzette, en de liefde niet had, dan zou ik niets zijn.","3":"En al zou het zo zijn dat ik al mijn goederen uitdeelde tot onderhoud *van de armen*, en al zou het zo zijn dat ik mijn lichaam overgaf om verbrand te worden, en de liefde niet had, dan zou het mij niets baten.","4":"De liefde is geduldig, zij is vriendelijk; de liefde is niet afgunstig; de liefde handelt niet lichtvaardig, zij is niet opgeblazen;","5":"Zij handelt niet ongeschikt, zij zoekt zichzelf niet, zij wordt niet verbitterd, zij denkt geen kwaad;","6":"Zij verblijdt zich niet in de ongerechtigheid, maar zij verblijdt zich in de waarheid;","7":"Zij bedekt alle dingen, zij gelooft alle dingen, zij hoopt alle dingen, zij verdraagt alle dingen.","8":"De liefde vergaat nooit meer; maar profetieën, die zullen tot niets gemaakt worden; talen, die zullen ophouden; kennis, die zal tot niets gemaakt worden.","9":"Want wij kennen ten dele, en wij profeteren ten dele;","10":"Maar wanneer het volmaakte gekomen zal zijn, dan zal wat ten dele is, tot niets gemaakt worden.","11":"Toen ik een kind was, sprak ik als een kind, was ik gezind als een kind, overlegde ik als een kind; maar toen ik een man geworden ben, heb ik wat bij een kind hoort tot niets gemaakt.","12":"Want wij zien nu door een spiegel in een duistere afspiegeling, maar dan zullen wij zien van aangezicht tot aangezicht; nu ken ik ten dele, maar dan zal ik kennen, zoals ik ook gekend ben.","13":"En nu blijven geloof, hoop *en* liefde, deze drie; maar de meeste van deze is de liefde."},"SV":{"1":"Al ware het, dat ik de talen der mensen en der engelen sprak, en de liefde niet had, zo ware ik een klinkend metaal, of luidende schel geworden.","2":"En al ware het dat ik de *gave* der profetie had, en wist al de verborgenheden en al de wetenschap; en al ware het, dat ik al het geloof had, zodat ik bergen verzette, en de liefde niet had, zo ware ik niets.","3":"En al ware het, dat ik al mijn goederen tot onderhoud *der* *armen* uitdeelde, en al ware het, dat ik mijn lichaam overgaf, opdat ik verbrand zou worden, en had de liefde niet, zo zou het mij geen nuttigheid geven.","4":"De liefde is lankmoedig, zij is goedertieren; de liefde is niet afgunstig; de liefde handelt niet lichtvaardiglijk, zij is niet opgeblazen;","5":"Zij handelt niet ongeschiktelijk, zij zoekt zichzelve niet, zij wordt niet verbitterd, zij denkt geen kwaad;","6":"Zij verblijdt zich niet in de ongerechtigheid, maar zij verblijdt zich in de waarheid;","7":"Zij bedekt alle dingen, zij gelooft alle dingen, zij hoopt alle dingen, zij verdraagt alle dingen.","8":"De liefde vergaat nimmermeer; maar hetzij profetieën, zij zullen te niet gedaan worden; hetzij talen, zij zullen ophouden; hetzij kennis, zij zal te niet gedaan worden.","9":"Want wij kennen ten dele, en wij profeteren ten dele;","10":"Doch wanneer het volmaakte zal gekomen zijn, dan zal hetgeen ten dele is, te niet gedaan worden.","11":"Toen ik een kind was, sprak ik als een kind, was ik gezind als een kind, overlegde ik als een kind; maar wanneer ik een man geworden ben, zo heb ik te niet gedaan hetgeen eens kinds was.","12":"Want wij zien nu door een spiegel in een duistere rede, maar alsdan *zullen* *wij* *zien* aangezicht tot aangezicht; nu ken ik ten dele, maar alsdan zal ik kennen, gelijk ook ik gekend ben.","13":"En nu blijft geloof, hoop *en* liefde, deze drie; doch de meeste van deze is de liefde."},"KJV":{"1":"Though I speak with the tongues of men and of angels, and have not charity, I am become as sounding brass, or a tinkling cymbal.","2":"And though I have the gift of prophecy, and understand all mysteries, and all knowledge; and though I have all faith, so that I could remove mountains, and have not charity, I am nothing.","3":"And though I bestow ➔ all my goods to feed the poor, and though I give my body to be burned, and have not charity, it profiteth me nothing.","4":"Charity suffereth long, and is kind; charity envieth not; charity vaunteth ➔ not itself, is ➔ not puffed up,","5":"Doth ➔ not behave itself unseemly, seeketh not her own, is ➔ not easily provoked, thinketh no evil;","6":"Rejoiceth not in iniquity, but rejoiceth in the truth;","7":"Beareth all things, believeth all things, hopeth all things, endureth all things.","8":"Charity never faileth: but whether there be prophecies, they shall fail; whether there be tongues, they shall cease; whether there be knowledge, it shall vanish away.","9":"For we know in part, and we prophesy in part.","10":"But when that which is perfect is come, then that which is in part shall be done away.","11":"When I was a child, I spake as a child, I understood as a child, I thought as a child: but when I became a man, I put away childish things.","12":"For now we see through a glass, darkly; but then face to face: now I know in part; but then shall I know even as also I am known.","13":"And now abideth faith, hope, charity, these three; but the greatest of these is charity."}},"tsk":{"1":[{"kopje":"sprak","refs":["1 Kor 13:2","1 Kor 13:3","1 Kor 12:8","1 Kor 12:16","1 Kor 12:29","1 Kor 12:30","1 Kor 14:6","2 Kor 12:4","2 Petr 2:18"]},{"kopje":"niet had","refs":["1 Kor 8:1","Matt 25:45","Rom 14:15","Gal 5:6","Gal 5:22","1 Tim 1:5","1 Petr 4:8"]},{"kopje":"of","refs":["1 Kor 14:7","1 Kor 14:8"]}],"2":[{"kopje":"al zou het zo zijn dat ik de gave","refs":["1 Kor 12:8-10","1 Kor 12:28","1 Kor 14:1","1 Kor 14:6-9","Num 24:15-24","Matt 7:22","Matt 7:23"]},{"kopje":"wist","refs":["1 Kor 4:1","Matt 13:11","Rom 11:25","Rom 16:25","Ef 3:4","Ef 6:19","Kol 1:26","1 Tim 3:16"]},{"kopje":"en al zou het zo zijn dat ik al het geloof had","refs":["1 Kor 12:9","Matt 17:20","Matt 21:21","Mark 11:22","Mark 11:23","Luk 17:5","Luk 17:6"]},{"kopje":"had","refs":["1 Kor 13:1","1 Kor 13:3","1 Kor 16:22","Gal 5:16","Gal 5:22","1 Joh 4:8","1 Joh 4:20","1 Joh 4:21"]},{"kopje":"zou ik zijn","refs":["1 Kor 13:3","1 Kor 7:19","1 Kor 8:4","Matt 21:19","2 Kor 12:11","Gal 6:3"]}],"3":[{"kopje":"al zou ik uitdeelde","refs":["Matt 6:1-4","Matt 23:5","Luk 18:22","Luk 18:28","Luk 19:8","Luk 21:3","Luk 21:4","Joh 12:43","Gal 5:26","Fil 1:15-18"]},{"kopje":"al zou ik overgaf","refs":["Dan 3:16-28","Matt 7:22","Matt 7:23","Joh 13:37","Joh 15:13","Hand 21:13","Fil 1:20","Fil 1:21","Fil 2:3"]},{"kopje":"baten","refs":["Jes 57:12","Jer 7:8","Joh 6:63","1 Tim 4:8","Hebr 13:9","Jak 2:14-17"]}],"4":[{"kopje":"is geduldig","refs":["Spr 10:12","2 Kor 6:6","Gal 5:22","Ef 4:2","Kol 1:11","Kol 3:12","2 Tim 2:25","2 Tim 3:10","2 Tim 4:2","Jak 3:17","1 Petr 4:8"]},{"kopje":"is vriendelijk","refs":["Neh 9:17","Spr 19:22","S tekst":"Zie 1Co 12:10 ."},{"catchword":"zullen teniet gedaan","tekst":"Namelijk zo in dit leven als die gave zal ophouden, gelijk na de tijden der apostelen geschied is; als in het toekomende, in hetwelk de voorzegging van toekomende dingen niet nodig zal zijn."},{"catchword":"talen, zij","tekst":"Gr. tongen. Zie 1Co 12:10 ."},{"catchword":"zullen ophouden;","tekst":"Namelijk gelijk de profetieën."},{"catchword":"kennis, zij zal","tekst":"Namelijk die onvolmaakte kennis, die wij nu verkrijgen door den dienst des Woords in dit leven, gelijk verklaard wordt in de volgende verzen."}],"9":[{"catchword":"wij kennen","tekst":"Namelijk nu in dit leven."},{"catchword":"ten dele, en","tekst":"Niet dat wij nu zouden weten al wat ons tot de zaligheid nodig is, Joh 16:13 ; 1Co 1:5 ; 2Ti 3:15 , maar de apostel spreekt alzo ten aanzien en in vergelijking van de kennis, die wij van goddelijke zaken zullen hebben in het toekomende leven, bij welke deze onze kennis, die wij nu hebben, maar een klein deel is te rekenen."}],"10":[{"catchword":"het volmaakte","tekst":"Dat is, de volmaakte kennis van goddelijke zaken, zoveel een bloot mens zal kunnen vatten, en ons tot volmaakte vreugde en zaligheid zal nodig zijn."},{"catchword":"zal gekomen zijn,","tekst":"Hetwelk eerst wezen zal in het toekomende leven."},{"catchword":"ten dele is,","tekst":"Dat is, deze onvolmaakte kennis. Zie vs.8."}],"11":[{"catchword":"Toen ik een kind was,","tekst":"De apostel vergelijkt de kennis, die wij nu in dit leven hebben, bij de kennis die de kleine kinderen hebben; en de kennis, die wij in het toekomende leven zullen hebben, bij de kennis van volwassen mannen. Zulk een onderscheid is er tussen beide, en nog veel groter."},{"catchword":"was ik gezind als een kind,","tekst":"Of, bevroedde ik, dacht ik."},{"catchword":"overlegde ik als een kind;","tekst":"Namelijk met mijn verstand de dingen overwegende."},{"catchword":"hetgeen eens kinds was","tekst":"Dat is, die kleine, slechte en kinderlijke kennis, die  volmaakt zijn. Zie vs.8."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Although it were that I spoke the languages [Gr. with tongues ] of men [that is, which any men in the world were able to speak] and of Angels, [the Angels, which are spirits, Heb. 1. 14. have properly no tongues, as we have, but this must be understood of the excellency, and multitude of languages which even the Angels might be able to speak when they are with men] and had not love, I were become a sounding [or, resounding] brass, [that is, brazen instrument, wherewith men make a great noise without pleasantness or understanding] or a ringing cymbal ."}],"2":[{"catchword":null,"tekst":"And although I had the (gifts) of prophecy, [See of his gift, Rom. 12. 7. and Cor. 12. 10.] and knew all mysteries and all knowledge: [See also of this gift, 1 Cor. 12. v. 8, 10.] and although I had all faith, [namely, to work all kind of miracles. See 1. Cor. 12. 9, 10] So that should transpose mountains, [that is, should do one of the greatest miracles, such as it would be to transfer a mountain from one place unto another] and had not love, I were nothing, [that is, the gift were not profitable nor serviceable to me for salvation.]"}],"3":[{"catchword":null,"tekst":"And though I should distribute all my goods for the maintenance ( of the poor), [The Greek word signifies to cut bread in pieces or morsels to feed any one] and though I should give up my body that I might be burned, [namely, for Christ&acirc;&euro;&trade;s name and truth: which is the greatest work of the Christian fortitude] and had no love [that is, did not that out of love of Gods glory, and to edify the church thereby, and confirm it in the truth, but out of ambition, or other necessities and respects] it would yield me no profit. [Or profit me nothing]"}],"4":[{"catchword":null,"tekst":"Love [That is, a man that hath true love] is long-suffering, [that is, by the grace of the Holy Ghost endures the reproaches and injuries offered unto it, and restrains wrath and desire of revenge] it is bountiful: [that is, inclined and ready to do good to every one, even to enemies] love is not envious: love dealeth not wantonly, [or pervesly, male pertly, vainly, namely, in words or in deeds] it is not puffed up. [that is, proud, ambitious, highly conceited of itself, and despising others.]"}],"5":[{"catchword":null,"tekst":"It dealeth not unfitly [Or unseemly] it seeketh not itself, [Gr. the things which are its own; or the things which concern its own advantage, but the welfare of its neighbour and of many] it is not embittered, [namely, to wrath, passion, and desire for revenge] it thinketh no evil. [that is, plotteth not in its mind, how it shall do its neighbour any evil in the actions of its neighbour, out of mistrust or evil-suspicion; or imputes not evil]"}],"6":[{"catchword":null,"tekst":"It rejoiceth not in unrighteousness, [Or for unrighteousness, namely, when any one doth that which is unjust, or else when injustice is done to any man] but it rejoiceth in the truth: [or with the truth, i.e. when any one doth, or there is done to any one, that which is just and fit.]"}],"7":[{"catchword":null,"tekst":"It covereth all things, [Or, beareth, for the Greek word signifieth both. But forasmuch afterward in the same verse is spoken of forbearance; therefore the word cover is better used here; seeing this is a proper work of love, Prov. 10.12. 1 Pet. 4.8. Or it taketh all things in good part and to the best] it believeth all things, [namely, which are any way credible and not manifestly false. Namely, concerning the actions of his neighbhour, construing them always to the best as long as the contrary appears not] it hopeth all things, [namely, of God, that he will deliver and assist him, Job. 13.15. and of men, that they have not meant, spoken or done so evil, or that being fallen they will rise again] it beareth all things. [that is, suffers all injuries done to it for peace sake, without revenging it self.]"}],"8":[{"catchword":null,"tekst":"Love never [That is, it neither ceaseth in this life to bring forth these fruits: neither shall it cease in that to come, but always abide and be perfect, although not always employed in one kind of operations] perisheth: [Gr. never falleth out, or off, as Rom. 9.6.] but whether it be prophecies, [see 1 Cor. 12.10.] they shall be abolished [namely, as well in this life, when that gift shall cease, as it came to pass after the Apostle times, as in that to come, in which the foretelling of things future shall not be necessary] be it languages, [Gr. tongues. See 1 Cor. 12.1.] they shall cease, [namely, the imperfect knowledge which we now obtain by the ministry of the word in this life, as is declared in the following verse it shall be abolished."}],"9":[{"catchword":null,"tekst":"For we know [Namely, now in this life] in part, [not that we do not know all that is necessary for us to salvation, John 16. v. 13. 1 Cor. 1.5. 2 Tim. 3.15. but the Apostle speaks thus in respect and comparison of the knowledge we which we shall have of divine things in the life to come: unto which, this is our knowledge which we now have, is to be accounted but a little part] and we prophecy in part."}],"10":[{"catchword":null,"tekst":"But when the perfect [That is, the perfect knowledge of divine things, as much as mere man shall be able to comprehend, and shall be needful for us to perfect joy and salvation] shall be come, [which shall be first in the life to come] then shall that which is in part, [that is, the imperfect knowledge. See v.8.] be done away."}],"11":[{"catchword":null,"tekst":"When I was a child, [The Apostle compares the knowledge which we have now in this life, to the knowledge which little children have: and the knowledge which shall have in the life to come to the knowledge of men grown. Such a difference there is betwixt both, and yet much greater] I spoke as a child, I was minded as a child, [or, I considered, I though] I reasoned as a child; [that is, weighing things with mine understanding] but when I became a man, I did away that which was a child&acirc;&euro;&trade;s. [that is, that small, mean, and childish knowledge which was in me.]"}],"12":[{"catchword":null,"tekst":"For we see now [Namely, as long as we are in this life] by a glass: [that is, betwixt our present knowledge, that which we shall have after this life, is such a difference, as there is when one seeth the image of another&acirc;&euro;&trade;s face in the glass, when he beholds the face itself] in a dark sentence. [Gr. in a riddle. i.e. there is also such a difference, as one propounds any thing darkly, in the manner of a riddle, and when he doth the same with plain, proper and express words] but when [namely, in the life to come] (shall we see) [that is, know, namely, God and all divine things] face to face: [that is, clearly and perfectly. See 1Jn 3:2.] now [namely, in this life] know I in part, [that is, even I myself although I am an Apostle, and was taken up in the third heaven, and there heard unutterable word, 2 Cor. 12.4.] but then [namely, in this life to come] I shall know even also I am known. [namely, acknowledgeth me for this, and through this his love shall give me the same knowledge.]"}],"13":[{"catchword":null,"tekst":"And now [See v.12.] abideth faith, hope (and) love, these three: [that is, we have need that all these three virtues be and bide in us. For without faith we cannot be justified, and it is impossible to please God: and without hope faith cannot stand, and by love faith must be operative] but the greatest [Gr. greater, namely, because faith and hope shall cease in this life to come, because when we shall actually enjoy and posses the good things which we now believe and hope for: but love shall abide forever, and be perfect. See v.8.] of this is love."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
