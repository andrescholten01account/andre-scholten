arbeiders van God; akkerwerk van God, gebouw van God bent u.","10":"Naar de genade van God, die mij gegeven is, heb ik als een wijs bouwmeester het fundament gelegd; en een ander bouwt daarop. Maar ieder ziet toe hoe hij daarop bouwt.","11":"Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus.","12":"En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels;","13":"Ieders werk zal openbaar worden; want de dag zal het aan het licht brengen, omdat het door vuur ontdekt wordt; en hoedanig ieders werk is, zal het vuur beproeven.","14":"Als iemands werk blijft, dat hij daarop gebouwd heeft, die zal loon ontvangen.","15":"Als iemands werk verbrand wordt, die zal schade lijden; maar zelf zal hij behouden worden, doch zo als door vuur.","16":"Weet u niet, dat u de tempel van God bent, en dat de Geest van God in u woont?","17":"Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.","18":"Niemand bedriegt zichzelf. Als iemand onder u denkt dat hij wijs is in deze wereld, die moet dwaas worden, opdat hij wijs mag worden.","19":"Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid;","20":"En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.","21":"Niemand roemt dan op mensen; want alles is van u.","22":"Hetzij Paulus, hetzij Apollos, hetzij Cefas, hetzij de wereld, hetzij leven, hetzij dood, hetzij tegenwoordige, hetzij toekomende dingen, ze zijn allemaal van u.","23":"Doch u bent van Christus, en Christus is van God."},"SV":{"1":"En ik, broeders, kon tot u niet spreken als tot geestelijken, maar als tot vleselijken, als tot jonge kinderen in Christus.","2":"Ik heb u met melk gevoed, en niet met *vaste* spijs; want gij vermocht *toen* nog niet; ja, gij vermoogt ook nu nog niet.","3":"Want gij zijt nog vleselijk; want dewijl onder u nijd is, en twist, en tweedracht, zijt gij niet vleselijk, en wandelt *gij* *niet* naar den mens?","4":"Want als de een zegt: Ik ben van Paulus; en een ander: Ik *ben* van Apollos; zijt gij niet vleselijk?","5":"Wie is dan Paulus, en wie is Apollos, anders dan dienaars, door welke gij geloofd hebt, en *dat*, gelijk de Heere aan een iegelijk gegeven heeft?","6":"Ik heb geplant, Apollos heeft nat gemaakt; maar God heeft den wasdom gegeven.","7":"Zo is dan noch hij, die plant, iets, noch hij, die nat maakt, maar God, Die den wasdom geeft.","8":"En die plant, en die nat maakt, zijn een; maar een iegelijk zal zijn loon ontvangen naar zijn arbeid.","9":"Want wij zijn Gods medearbeiders; Gods akkerwerk, Gods gebouw zijt gij.","10":"Naar de genade Gods, die mij gegeven is, heb ik als een wijs bouwmeester het fondament gelegd; en een ander bouwt daarop. Maar een iegelijk zie toe, hoe hij daarop bouwe.","11":"Want niemand kan een ander fondament leggen, dan hetgeen gelegd is, hetwelk is Jezus Christus.","12":"En indien iemand op dit fondament bouwt: goud, zilver, kostelijke stenen, hout, hooi, stoppelen;","13":"Eens iegelijks werk zal openbaar worden; want de dag zal het verklaren, dewijl het door vuur ontdekt wordt; en hoedanig eens iegelijks werk is, zal het vuur beproeven.","14":"Zo iemands werk blijft , dat hij daarop gebouwd heeft, die zal loon ontvangen.","15":"Zo iemands werk zal verbrand worden, die zal schade lijden; maar zelf zal hij behouden worden, doch alzo als door vuur.","16":"Weet gij niet, dat gij Gods tempel zijt, en de Geest Gods in ulieden woont?","17":"Zo iemand den tempel Gods schendt, dien zal God schenden; want de tempel Gods is heilig, welke gij zijt.","18":"Niemand bedriege zichzelven. Zo iemand onder u dunkt, dat hij wijs is in deze wereld, die worde dwaas, opdat hij wijs moge worden.","19":"Want de wijsheid dezer wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun arglistigheid;","20":"En wederom: De Heere kent de overleggingen der wijzen, dat zij ijdel zijn.","21":"Niemand dan roeme op mensen; want alles is uwe.","22":"Hetzij Paulus, hetzij Apollos, hetzij Cefas, hetzij de wereld, hetzij leven, hetzij dood, hetzij tegenwoordige, hetzij toekomende dingen, zij zijn alle uwe.","23":"Doch gij zijt van Christus, en Christus is Gods."},"KJV":{"1":"And I, brethren, could not speak unto you as unto spiritual, but as unto carnal, even as unto babes in Christ.","2":"I have fed you with milk, and not with meat: for hitherto ➔ ye were ➔ not able to bear it, neither yet now are ye able.","3":"For ye are yet carnal: for whereas there is among you envying, and strife, and divisions, are ye not carnal, and walk as men?","4":"For while one saith, I am of Paul; and another, I am of Apollos; are ye not carnal?","5":"Who then is Paul, and who is Apollos, but ministers by whom ye believed, even as the Lord gave to every man?","6":"I have planted, Apollos watered; but God gave the increase.","7":"So then neither is he that planteth any thing, neither he that watereth; but God that giveth the increase.","8":"Now he that planteth and he that watereth are one: and every man shall receive his own reward according to his own labour.","9":"For we are labourers together with God: ye are God's husbandry, ye are God's building.","10":"According to the grace of God which is given unto me, as a wise masterbuilder, I have laid the foundation, and another buildeth thereon. But let ➔ every man take heed how he buildeth thereupon.","11":"For other foundation can no man lay than that is laid, which is Jesus Christ.","12":"Now if any man build upon this foundation gold, silver, precious stones, wood, hay, stubble;","13":"Every man's work shall be made manifest: for the day shall declare it, because it shall be revealed by fire; and the fire shall try every man's work of what sort it is.","14":"If any man's work abide which he hath built thereupon, he shall receive a reward.","15":"If any man's work shall be burned, he shall suffer loss: but he himself shall be saved; yet so as by fire.","16":"Know ye not that ye are the temple of God, and that the Spirit of God dwelleth in you?","17":"If any man defile the temple of God, him shall ➔ God destroy; for the temple of God is holy, which temple ye are.","18":"Let ➔ no man deceive himself. If any man among you seemeth to be wise in this world, let him become a fool, that he may be wise.","19":"For the wisdom of this world is foolishness with God. For it is written, He taketh the wise in their own craftiness.","20":"And again, The Lord knoweth the thoughts of the wise, that they are vain.","21":"Therefore let ➔ no man glory in men. For all things are yours;","22":"Whether Paul, or Apollos, or Cephas, or the world, or life, or death, or things present, or things to come; all are yours;","23":"And ye are Christ's; and Christ is God's."}},"tsk":{"1":[{"kopje":"als tot geestelijken","refs":["1 Kor 2:6","1 Kor 2:15","Gal 6:1"]},{"kopje":"als tot vleselijken","refs":["1 Kor 3:3","1 Kor 3:4","1 Kor 2:14","Matt 16:23","Rom 7:14"]},{"kopje":"jonge kinderen","refs":["1 Kor 14:20","Ef 4:13","Ef 4:14","1 Joh 2:12"]}],"2":[{"kopje":"gevoed","refs":["Hebr 5:12-14","1 Petr 2:2"]},{"kopje":"want","refs":["Joh 16:12","Hebr 5:11","Hebr 5:12"]}],"3":[{"kopje":"want omdat","refs":["1 Kor 1:11","1 Kor 6:1-8","1 Kor 11:18","2 Kor 12:20","Gal 5:15","Gal 5:19-21","Jak 3:16","Jak 4:1","Jak 4:2"]},{"kopje":"en wandelt","refs":["Hos 6:7","Mark 7:21","Mark 7:22","Ef 2:2","Ef 2:3","Ef 4:22-24","Tit 3:3","1 Petr 4:2"]}],"5":[{"kopje":"dienaars","refs":["1 Kor 3:7","1 Kor 4:1","1 Kor 4:2","Luk 1:2","Rom 10:14","Rom 10:15","2 Kor 3:6","2 Kor 4:5","2 Kor 4:7","2 Kor 6:1","2 Kor 6:4","2 Kor 11:23"]},{"kopje":"zoals","refs":["1 Kor 3:10","1 Kor 9:17","1 Kor 12:4-11","1 Kor 12:28","Matt 25:15","Joh 3:27","Rom 12:3-6","1 Petr 4:10"]}],"6":[{"kopje":"Ik","refs":["1 Kor 3:9","1 Kor 3:10","1 Kor 4:14","1 Kor 4:15","1 Kor 9:1","1 Kor 9:7-11","1 Kor 15:1-11","Hand 18:4-11","2 Kor 10:14","2 Kor 10:15"]},{"kopje":"Ap  class=\"wl wl-kjv\" data-code=\"G1125\">written,</span> He <span class=\"wl wl-kjv\" data-code=\"G1405\">taketh</span> the <span class=\"wl wl-kjv\" data-code=\"G4680\">wise</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> their <span class=\"wl wl-kjv\" data-code=\"G846\">own</span> <span class=\"wl wl-kjv\" data-code=\"G3834\">craftiness.</span>","20":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3825\">again,</span> The <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G1097\">knoweth</span> the <span class=\"wl wl-kjv\" data-code=\"G1261\">thoughts</span> of the <span class=\"wl wl-kjv\" data-code=\"G4680\">wise,</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> they <span class=\"wl wl-kjv\" data-code=\"G1526\">are</span> <span class=\"wl wl-kjv\" data-code=\"G3152\">vain.</span>","21":"<span class=\"wl wl-kjv\" data-code=\"G5620\">Therefore</span> <span class=\"wl wl-kjv\" data-code=\"G2744\">let</span> ➔ no <span class=\"wl wl-kjv\" data-code=\"G3367\">man</span> <span class=\"wl wl-kjv\" data-code=\"G2744\">glory</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G444\">men.</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> all <span class=\"wl wl-kjv\" data-code=\"G3956\">things</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">are</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">yours;</span>","22":"<span class=\"wl wl-kjv\" data-code=\"G1535\">Whether</span> <span class=\"wl wl-kjv\" data-code=\"G3972\">Paul,</span> <span class=\"wl wl-kjv\" data-code=\"G1535\">or</span> <span class=\"wl wl-kjv\" data-code=\"G625\">Apollos,</span> <span class=\"wl wl-kjv\" data-code=\"G1535\">or</span> <span class=\"wl wl-kjv\" data-code=\"G2786\">Cephas,</span> <span class=\"wl wl-kjv\" data-code=\"G1535\">or</span> the <span class=\"wl wl-kjv\" data-code=\"G2889\">world,</span> <span class=\"wl wl-kjv\" data-code=\"G1535\">or</span> <span class=\"wl wl-kjv\" data-code=\"G2222\">life,</span> <span class=\"wl wl-kjv\" data-code=\"G1535\">or</span> <span class=\"wl wl-kjv\" data-code=\"G2288\">death,</span> <span class=\"wl wl-kjv\" data-code=\"G1535\">or</span> things <span class=\"wl wl-kjv\" data-code=\"G1764\">present,</span> <span class=\"wl wl-kjv\" data-code=\"G1535\">or</span> things to <span class=\"wl wl-kjv\" data-code=\"G3195\">come;</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">are</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">yours;</span>","23":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> <span class=\"wl wl-kjv\" data-code=\"G5210\">ye</span> are <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ's;</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> is <span class=\"wl wl-kjv\" data-code=\"G2316\">God's.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"als tot geestelijken,","tekst":"Dat is, als tot zodanigen die door Gods Geest uitnemend verlicht zijn en in de kennis zeer toegenomen. Zie Gal 6:1 ."},{"catchword":"als tot vleselijken,","tekst":"Dat is, als tot zodanigen, in welken het vlees, of menselijke genegenheden zich nog te veel openbaren, gelijk in de kinderen pleegt te geschieden, die de genegenheden meer volgen dan de rede."},{"catchword":"jonge kinderen","tekst":"Dat is, die nog zeer teder en onwetend zijn in de leer van Christus; en hiermede verklaart Hij het woord vleselijke, opdat het niet zou genomen worden voor mensen, die geheel vreemd zijn van den Geest van Christus, gelijk het dikmaals in de Heilige Schrift gebruikt wordt. Zie Rom 8:8 ."}],"2":[{"catchword":"melk gevoed,","tekst":"Dat is, met de eerste verklaringen der fondamenten der Christelijke leer, die met eenvoudige en naakte woorden voorgesteld worden. Gr. met melk gedrenkt."},{"catchword":"vaste spijs;","tekst":"Dat is, de hogere verklaringen der Christelijke leer, die met hogere woorden en diepzinniger redenen worden voorgesteld. Zie breder Heb 5:12 , enz."}],"3":[{"catchword":"naar den mens?","tekst":"Dat is, gelijk de natuurlijk mensen plegen, hetwelk voor u onbetamelijk is."}],"4":[{"catchword":"vleselijk?","tekst":"Dat is, nog door vleselijke of kinderlijke genegenheden gedreven in het onderscheiden van uwe leraars."}],"5":[{"catchword":"door welken gij","tekst":"Dat is, door wier dienst en prediking; Rom 10:17 ."},{"catchword":"een iegelijk","tekst":"Namelijk Zijner dienaren, wien Hij Zijne gaven verscheidenlijk uitdeelt. Zie 1Co 12:4 , enz."}],"6":[{"catchword":"Ik heb geplant,","tekst":"Dat is, den eersten grond der gemeente door mijne predikatie gelegd, gelijk hierna verklaard wordt, vs.10."},{"catchword":"nat gemaakt;","tekst":"Dat is, hetgeen ik begonnen had, heeft Hij door Zijne leer bevorderd en versterkt."},{"catchword":"den wasdom","tekst":"Dat is, het Woord, dat uitwendig van ons was gepredikt, in de harten der toehoorders krachtig gemaakt tot hunne bekering. Zie Joh 6:44 , Joh 6:4465 ; Act 11:21 , en Act 16:14 , enz."}],"7":[{"catchword":"iets, noch","tekst":"Te achten of te roemen; hetwelk alzo niet is te verstaan, alsof Paulus de dienaars wilde geacht hebben [want 1Co 4:1 zal hij het tegendeel zeggen]; maar omdat niemand zich op de gaven der dienaren, wie zij ook zijn, alzo moet vergapen, dat hij hun de eer zou geven, die den oppersten auteur van dit werk toekomt; alzo het God is die hen stelt, die hun bekwame gaven geeft, en door hun arbeid krachtig is in de harten der mensen; vs.5, en 1Co 12:6 ; Gal 3:5 ."}],"8":[{"catchword":"zijn een;","tekst":"Dat is, arbeiden in een zelfde zaak, en tot een zelfde einde, namelijk om een zelfde leer des Evangelies te verbreiden en de gemeente van Christus te stichten, hoewel met verscheidene gaven. Want hij spreekt hier nog van het ambt der trouwe leraars, gelijk hij en Apollos waren."},{"catchword":"naar zijnen arbeid","tekst":"Dat is, nadat hij zich in dit zijn ambt wel zal hebben gekweten en benaarstigd; Mat 25:20 , enz."}],"9":[{"catchword":"wij zijn","tekst":"Namelijk die dienaars van Gods Woord zijn."},{"catchword":"Gods medearbeiders","tekst":"Namelijk die onder God aan den bouw der gemeente medearbeiden als werktuigen, die God heeft geliefd daartoe te gebruiken, hoewel het voornaamste werk van Hem komt en de bekwaamheid dezer werktuigen ook zelfs van Hem komt; 2Co 3:5-6 ."},{"catchword":"Gods akkerwerk,","tekst":"Dat is, gij als leden der gemeente Gods zijt degenen aan wie deze arbeid besteed wordt als aan een groot akkerwerk."},{"catchword":"Gods gebouw","tekst":"Een andere gelijkenis, genomen van een groot gesticht, waar een groot meester het beleid van heeft, en waar hij zijne dienaars bezig aan houdt, welke gelijkenis hij daarna breder uitlegt en toeëigent."}],"10":[{"catchword":"Naar de genade","tekst":"Namelijk door welke ik tot een apostel van Christus ben geroepen, en met welke Hij mij tot nu toe in mijne bediening heeft bijgestaan en vergezelschapt. Waarmede hij alles, wat hij is en doet, niet in zichzelven, maar God toeschrijft."},{"catchword":"als een wijs","tekst":"Dat is, gelijk een recht, voorzichtig, en getrouw bouwmeester betaamt."},{"catchword":"het fondament","tekst":"Namelijk benevens de andere apostelen in het eerste oprichten van de gemeente van Christus door de gehele wereld, en ik als de eerste die uwe gemeente heb opgericht; Rom 15:20 ; Eph 2:20 ; Rev 21:14 ."},{"catchword":"een ander bouwt daarop","tekst":"Dit zegt hij van de gewone dienaren, die na de apostelen in de opgerichte gemeenten zijn geroepen en gesteld, en op der apostelen werk voortgingen; Rom 15:20 ."},{"catchword":"hoe hij daarop bouwe","tekst":"Sommigen verstaan dit van de personen, die door de leraars op het fondament gebouwd worden, gelijk het woord werk alzo genoemd wordt; 1Co 9:1 . Doch alzo de apostel hier zegt een iegelijk zie toe, hoe hij daarop bouwt, en niet, wien hij daarop bouwt, zo wordt dit gemeenlijk en bekwamelijker verstaan, dat de apostel hier de leraars wil vermanen, dat zij toezien welke leer zij op het fondament, dat de apostelen gelegd hebben, voorstellen tot versterking en vermeerdering der opgerichte gemeenten."}],"11":[{"catchword":"dan hetgeen","tekst":"Of, behalve hetgeen; namelijk van mij en de andere apostelen."},{"catchword":"hetwelk is","tekst":"Christus wordt het fondament der gemeente genoemd, òf ten aanzien van hem zelven, waar de zaligheid der gemeente op steunt, omdat Hij als waarachtig God en mens ons de zaligheid heeft verworven, en dezelve door Zijnen Geest toeëigent; Mat 16:18 ; 1Pe 2:6 , òf ten aanzien van de leer, waardoor wij tot Hem als den enigen Zaligmaker worden gewezen en gebracht, en door het geloof in Hem ontvangen gerechtigheid, heiligheid en het eeuwige leven. Op deze leer ziet de apostel hier, en verklaart dat wij in de leer des Evangelies tot niemand anders mogen worden gewezen om zaligheid te vinden, dan tot zijn persoon en verdiensten. Zie Joh 14:6 ; Act 4:12 ; Eph 2:20 ."}],"12":[{"catchword":"op dit fondament","tekst":"Dat is, op deze leer van de zaligheid in Christus Jezus alleen te zoeken."},{"catchword":"goud, zilver,","tekst":"Dat is, stichtelijke leringen, niet getrokken uit menselijke wijsheid, maar uit de rechte gronden van Gods Woord; 2Ti 1:13 ."},{"catchword":"hout, hooi,","tekst":"Hierdoor worden verstaan, niet enige ketterijen of valse leringen, die het fondament omstoten, waardoor de gemeente van Christus verleid of gescheurd wordt, want zulke veroordeelt Gods woord als werken des vleesches, die de mensen van de zaligheid beroven, Act 20:30 ; Gal 5:20 ; 1Ti 4:1-3 ; maar enige leringen, dwalingen, of inzettingen van minder gewicht, uit menselijk vernuft voortgebracht, die het fondament niet omstoten, of enige zonderlinge en onnodige geschillen, die niet stichten, en opgepronkte wijzen van spreken buiten Gods Woord, welke de apostel in deze eerste vier hoofdstukken doorgaans bestraft."}],"13":[{"catchword":"iegelijks","tekst":"Namelijk leraars. Want van die en hun werk spreekt hier de apostel alleen."},{"catchword":"werk zal","tekst":"Dat is, leer, die Hij voorstelt."},{"catchword":"de dag zal het","tekst":"Dat is, de tijd; of het licht der waarheid; Rom 13:12-13 ; Eph 5:13 ; 2Pe 1:19 ."},{"catchword":"verklaren, dewijl","tekst":"Namelijk of het hout, hooi, stro en stoppelen, dan of het goud, zilver en kostelijke stenen zijn."},{"catchword":"vuur ontdekt","tekst":"Door dit vuur kan hier niet verstaan worden een vagevuur, waardoor de mensen na dit leven van hunne zonden zouden gevaagd of gereinigd worden, overmits door dit vuur, waar Paulus hier van spreekt, niet alleen het werk, dat vergaat of verbrand wordt, maar ook dat blijft en beloond wordt, zal beproefd worden; maar wordt verstaan òf van het vuur des Heiligen Geestes, die door het licht van Gods Woord den vasten arbeid en trouwe leringen der leraren mettertijd ontdekt in de gemeente Gods, en die de onnodige of zonderlinge leer onderscheidt en doet verdwijnen; niet anders dan het goud door het vuur van zijne onreinheden wordt gezuiverd; Psa 12:7 ; Jer 23:29 . Of, het vuur van vervolging, zwarigheid en verzoeking, waardoor de oprechte leer gelijk als beproefd wordt, omdat zij alsdan ons een vasten troost geeft, hetwelk de andere niet doen kan; Jam 1:2 ; 1Pe 1:6-7 ."}],"14":[{"catchword":"blijft, dat hij","tekst":"Dat is, leer door Gods Woord vast en bondig geoordeeld wordt; 1Th 5:21 ."},{"catchword":"loon ontvangen","tekst":"Namelijk ten uitersten dage, uit genade, ook in het bijzonder over dit zijn werk; Dan 12:3 ; 1Co 15:41-42 ."}],"15":[{"catchword":"verbrand worden,","tekst":"Dat is, zo iemands lering na gedane beproeving uit Gods Woord zal verdwijnen en ijdel geacht worden."},{"catchword":"schade lijden;","tekst":"Namelijk van dezen zijnen arbeid."},{"catchword":"behouden worden,","tekst":"Namelijk omdat hij in zijne leer het fondament nog vast heeft behouden."},{"catchword":"als door vuur","tekst":"Dat is, bezwaarlijk, gelijk iemand zichzelven uit den brand behoudt, daarin alles latende wat hij heeft; Jud 1:23 ."}],"16":[{"catchword":"gij Gods","tekst":"Namelijk die in Christus gelooft; 1Pe 2:5 . Zie Eph 2:21 ."}],"17":[{"catchword":"Zo iemand den","tekst":"Dat is, zo iemand de gemeente Gods door leringen der menselijke wijsheid, of door bijzonder aanhangen aan dezen of genen leraar, verdeelt of scheurt."},{"catchword":"schenden; want","tekst":"Gr. verderven; dat is te schande maken."}],"18":[{"catchword":"bedriege","tekst":"Of, verleide."},{"catchword":"wijs is in","tekst":"Dat is, begaafd met menselijke wijsheid."},{"catchword":"die worde dwaas,","tekst":"Namelijk naar het oordeel van de wereldwijzen, wanneer hij de kennis van Christus' kruis en de nederigheid voor zijn hoogste wijsheid houdt, die de wereld houdt voor dwaasheid. Zie 1Co 1:21-24 ."},{"catchword":"wijs moge worden","tekst":"Namelijk in God en in de zaken zijner zaligheid."}],"19":[{"catchword":"vat de wijzen","tekst":"Dat is, Hij verwart hun wereldse en listige raadslagen tegen God en de vromen, alzo, dat zij zelf daardoor vergaan."}],"20":[{"catchword":"der wijzen,","tekst":"Dat is, wereldwijzen, gelijk voren. De tekst Psa 94:11 , heeft mensen, namelijk die op hunne wijsheid steunen."},{"catchword":"dat zij ijdel","tekst":"Dat is, hunne wijsheid tevergeefs in het werk stellen tegen Gods wijsheid."}],"21":[{"catchword":"roeme op mensen,","tekst":"Dat is, vergape zich niet en vertrouwe op geen menselijke wijsheid."},{"catchword":"uwe","tekst":"Dat is, van God tot den dienst van uwe zaligheid geschikt en verordineerd; zelfs de voornaamsten onder de leraars zijn niet voor zichzelven, maar voor de gemeente. En daarom moeten zij alles richten niet tot hun eigen eer, maar tot de eer van Christus en uwe zaligheid."}],"23":[{"catchword":"zijt van Christus,","tekst":"Namelijk lichaam of bruid, als van uw hoofd."},{"catchword":"is Gods","tekst":"Namelijk des Vaders welgeliefde Zoon en Gezant, om ons tot de eeuwige erve met Hem te brengen. Zie 1Co 11:3 , en 1Co 15:27-28 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"AND I brethren could not speak unto you as into spiritual [That is, as such who are extraordinarily enlightened by the Spirit of God; and have made great progress in knowledge, see Gal. 6.1.] but as to carnal, [that is, as to such in whom the flesh or humane inclinations do yet too much manifest themselves, as useth to come to pass in children, who follow their inclinations more then reason] as unto young children in Christ, [that is, who are yet very tender and ignorant in the doctrine of Christ: and hereby he expound the word carnal, that it might not taken for persons who are wholly strangers from the spirit of Christ, as it is often used in the holy Scripture, See Rom. 8.8.]"}],"2":[{"catchword":null,"tekst":"I have fed you with milk [That is, with the first principles and foundations of Christian doctrine, which are set forth with example and naked words. Gr. Given you milk to drink] and not with (firm) meat: [that is, the higher declarations of Christian doctrine, which are set forth with higher words, and profounder reasons, see more at large Heb. 5.12. etc.] For ye are not able for it (then) yea neither are ye now able for it."}],"3":[{"catchword":null,"tekst":"For ye are yet carnal. For seeing there is envy and strife and division among you, are ye not yet carnal? And do (ye not) walk according to man? [that is, as natural men used to do, which is unseemingly for you.]"}],"4":[{"catchword":null,"tekst":"For while one saith I am of Paul, and another I (am) of Apollo, are ye not carnal? [that is, yet driven by carnal or childish inclinations in distinguishing your teachers.]"}],"5":[{"catchword":null,"tekst":"Who therefore is Paul, and who is Apollo, other then Ministers by whom [That is, by whose ministry and teaching Rom. 10.17] ye believed, and (that) even as the Lord gave to every one? [namely, of his ministers, to whom he diversely distributes his gifts. See 1 Cor. 12.4. etc.]"}],"6":[{"catchword":null,"tekst":"I have planted, [That is, the first foundation of the Church by my preaching, as is declared hereafter ver 10.] Apollo hath watered: [that is, that which I had begun, he by his teaching hath furthered & strengthened] but God gave the increase. [that is, made the word which was outwardly preached by us, effectually in the hearts of the hearers, for their conversion. See Joh 6:44,65. Act 11:21. and 16.14. etc.]"}],"7":[{"catchword":null,"tekst":"Therefore neither is he that planteth anything, [Namely, to be esteemed, or to glory: which is not to be understood, as if Paul would have ministers to be despised (for 1 Cor. 4.1. he will say the contrary) but because no man must so gaze upon the gifts of the ministers, whosoever they be, as to give them the honour, which belongs to the supreme author of this work: seeing it is God who appoint them, which gives them fitting gifts, and by their labour is powerfull in the hearts of men, 1 Cor. 3.5. and 12.6. Gal. 3.5.] nor he that moisteneth them: but God which giveth the increase."}],"8":[{"catchword":null,"tekst":"And he that planteth, and he that moisteneth are one: [That is, labour in one and the same thing, and for one and the same end, namely to spread abroad one and the same doctrine of the Gospel, and to edify the Church of Christ, although with divers&acirc;&euro;&trade; gifts. For he speaks here yet, of the office of faithful teachers, such as he and Apollos were] but ever one shall receive his own reward, according to his labour. [namely, according as he shall well have acquitted himself, and been diligent in this his office. Mat. 25.20. etc.]"}],"9":[{"catchword":null,"tekst":"For we [Namely, who are ministers of Gods word] are Gods fellow-labours: [namely, who under God, labour together on the building of the Church, as instrument which it hath pleased God to make use of for // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
