nt wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had?","8":"Al bent u verzadigd, al bent u rijk geworden, zonder ons hebt u geheerst; en och, was het maar zo dat u heerste, opdat ook wij met u heersen mochten!","9":"Want ik denk dat God ons, de laatste apostelen, ten toon heeft gesteld als tot de dood veroordeeld; want wij zijn een schouwspel geworden voor de wereld, en voor de engelen, en voor de mensen.","10":"Wij zijn dwazen om Christus' wil, maar u bent wijzen in Christus; wij zijn zwakken, maar u sterken; u bent heerlijke mensen, maar wij worden veracht.","11":"Tot op dit huidige uur lijden wij honger, en lijden wij dorst, en zijn naakt, en worden met vuisten geslagen, en hebben geen vaste woonplaats;","12":"en wij zwoegen, werkend met onze eigen handen; wij worden uitgescholden, en wij zegenen; wij worden vervolgd, en wij verdragen het;","13":"wij worden belasterd, en wij smeken; wij zijn geworden als het uitvaagsel van de wereld, en het afschraapsel van alles, tot nu toe.","14":"Ik schrijf deze dingen niet om u te beschamen, maar om u te vermanen als mijn lieve kinderen.","15":"Want al had u tienduizend leermeesters in Christus, dan hebt u toch niet veel vaders; want in Christus Jezus heb ik u door het Evangelie voortgebracht.","16":"Daarom vermaan ik u: wees mijn navolgers.","17":"Daarom heb ik Timotheüs naar u toe gezonden, die mijn lieve en getrouwe zoon is in de Heere, die u mijn wegen in herinnering zal brengen, die in Christus zijn, zoals ik overal in elke gemeente leer.","18":"Maar sommigen zijn opgeblazen, alsof ik niet naar u toe zou komen.","19":"Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.","20":"Want het Koninkrijk van God bestaat niet in woorden, maar in kracht.","21":"Wat wilt u? Zal ik met de roede naar u toe komen, of in liefde en in de geest van zachtmoedigheid?"},"SV":{"1":"Alzo houde ons een *ieder* mens, als dienaars van Christus, en uitdelers der verborgenheden Gods.","2":"En voorts wordt in de uitdelers vereist, dat elk getrouw bevonden worde.","3":"Doch mij is voor het minste, dat ik van ulieden geoordeeld worde, of van een menselijk oordeel; ja, ik oordeel ook mijzelven niet.","4":"Want ik ben mijzelven van geen ding bewust; doch ik ben daardoor niet gerechtvaardigd; maar Die mij oordeelt, is de Heere.","5":"Zo dan oordeelt niets voor den tijd, totdat de Heere zal gekomen zijn, Welke ook in het licht zal brengen, hetgeen in de duisternis verborgen is, en openbaren de raadslagen der harten; en als dan zal een iegelijk lof hebben van God.","6":"En deze dingen, broeders, heb ik op mijzelven en Apollos bij gelijkenis toegepast, om uwentwil; opdat gij aan ons zoudt leren, niet te gevoelen boven hetgeen geschreven is, dat gij niet, de een om eens anders wil, opgeblazen wordt tegen den ander.","7":"Want wie onderscheidt u? En wat hebt gij, dat gij niet hebt ontvangen? En zo gij het ook ontvangen hebt, wat roemt gij, alsof gij het niet ontvangen hadt?","8":"Alrede zijt gij verzadigd, alrede zijt gij rijk geworden, zonder ons hebt gij geheerst; en och, of gij heerstet, opdat ook wij met u heersen mochten!","9":"Want ik acht, dat God ons, die de laatste apostelen zijn, ten toon heeft gesteld als tot den dood verwezen; want wij zijn een schouwspel geworden der wereld, en den engelen, en den mensen.","10":"Wij *zijn* dwazen om Christus’ wil, maar gij zijt wijzen in Christus; wij zijn zwakken, maar gij sterken; gij zijt heerlijken, maar wij verachten.","11":"Tot op deze tegenwoordige ure, lijden wij honger, en lijden wij dorst, en zijn naakt, en worden met vuisten geslagen, en hebben geen vaste woonplaats;","12":"En arbeiden, werkende met onze eigen handen; wij worden gescholden, en wij zegenen; wij worden vervolgd, en wij verdragen;","13":"Wij worden gelasterd, en wij bidden; wij zijn geworden als uitvaagsels der wereld *en* aller afschrapsel tot nu toe.","14":"Ik schrijf deze dingen niet om u te beschamen, maar als mijn lieve kinderen vermaan ik *u*.","15":"Want al hadt gij tien duizend leermeesters in Christus, zo *hebt* *gij* toch niet vele vaders; want in Christus Jezus heb ik u door het Evangelie geteeld.","16":"Zo vermaan ik u dan: zijt mijn navolgers.","17":"Daarom heb ik Timotheüs tot u gezonden, die mijn lieve en getrouwe zoon is in den Heere, welke u zal indachtig maken mijn wegen, die in Christus zijn, gelijkerwijs ik alom in alle Gemeenten leer.","18":"Doch sommigen zijn opgeblazen, alsof ik tot ulieden niet komen zou.","19":"Maar ik zal haast tot u komen, zo de Heere wil, en ik zal *dan* verstaan, niet de woorden dergenen, die opgeblazen zijn, maar de kracht.","20":"Want het Koninkrijk Gods is niet *gelegen* in woorden, maar in kracht.","21":"Wat wilt gij? Zal ik met de roede tot u komen, of in liefde en *in* den geest der zachtmoedigheid?"},"KJV":{"1":"Let ➔ a man so account of us, as of the ministers of Christ, and stewards of the mysteries of God.","2":"Moreover it is required in stewards, that a man be found faithful.","3":"But with me it is a very small thing that I should be judged of you, or of man's judgment: yea, I judge not mine own self.","4":"For I know nothing by myself; yet am I ➔ not hereby justified: but he that judgeth me is the Lord.","5":"Therefore judge nothing before the time, until the Lord come, who both will bring to light the hidden things of darkness, and will make manifest the counsels of the hearts: and then shall every man have praise of God.","6":"And these things, brethren, I have in a figure transferred to myself and to Apollos for your sakes; that ye might learn in us not to think of men above that which is written, that no one of you be puffed up for one against another.","7":"For who maketh ➔ thee to differ from another? and what hast thou that thou didst ➔ not receive? now if thou didst receive it, why dost thou glory, as if thou hadst ➔ not received it?","8":"Now ye are full, now ye are rich, ye have reigned as kings without us: and I would to God ye did reign, that we also might reign with you.","9":"For I think that God hath set forth us the apostles last, as it were appointed to death: for we are made a spectacle unto the world, and to angels, and to men.","10":"We are fools for ➔ Christ's sake, but ye are wise in Christ; we are weak, but ye are strong; ye are honourable, but we are despised.","11":"Even unto this present hour we ➔ both hunger, and thirst, and are naked, and are buffeted, and have no certain dwellingplace;","12":"And labour, working with our own hands: being reviled, we bless; being persecuted, we suffer it:","13":"Being defamed, we intreat: we are made as the filth of the world, and are the offscouring of all things unto this day.","14":"I write not these things to shame you, but as my beloved sons I warn you.","15":"For though ye have ten thousand instructors in Christ, yet have ye not many fathers: for in Christ Jesus I have begotten you through the gospel.","16":"Wherefore I beseech you, be ye followers of me.","17":"For ➔ this cause have I sent unto you Timotheus, who is my beloved son, and faithful in the Lord, who shall bring ➔ you into remembrance of my ways which be in Christ, as I teach every where in every church.","18":"Now some are puffed up, as though I would ➔ not come to you.","19":"But I will come to you shortly, if the Lord will, and will know, not the speech of them which are puffed up, but the power.","20":"For the kingdom of God is not in word, but in power.","21":"What will ye? shall I come unto you with a rod, or in love, and in the spirit of meekness?"}},"tsk":{"1":[{"kopje":"houdt men","refs":["1 Kor 4:13","2 Kor 12:6"]},{"kopje":"dienaars","refs":["1 Kor 3:5","1 Kor 9:16-18","Matt 24:45","2 Kor 4:5","2 Kor 6:4","2 Kor 11:23","Kol 1:25","1 Tim 3:6"]},{"kopje":"en uitdelers","refs":["Luk 12:42","Luk 16:1-3","Tit 1:7","1 Petr ":"oordeel ook mijzelven","tekst":"Dit wordt verstaan, niet van een oordeel der beproeving van onszelven, of wij in het geloof zijn en hoe wij met God staan, 1Co 11:28 , en 2Co 13:5 , maar van een oordeel, waardoor iemand zichzelven boven een ander verheft en prijst in zijn dienst; of beneden een ander stelt of misprijst, gelijk dit hier in sommigen bestraft wordt, dat de een Paulus boven Petrus, enz. verhief, en de ander wederom Petrus of Apollos, enz. boven hen zette. Dit is het, dat hij aan Gods oordeel hier onderwerpt, dewijl de mensen hierin menigmaal uit genegenheden oordelen, gelijk het volgende ook uitwijst."}],"4":[{"catchword":"geen ding bewust;","tekst":"Namelijk wat aangaat het trouwelijk bedienen mijns apostelschaps; daarin heb ik een goede conscientie; want hiervan alleen spreekt de apostel."},{"catchword":"daardoor niet","tekst":"Namelijk voor God, of in Gods gericht; gelijk David ook spreekt Psa 143:2 , en Paulus Gal 2:16 . Want iets anders is het, een goede conscientie te hebben in zijn doen voor God, tot zijn eigen troost, 1Jo 3:21 , en iets anders door zijn doen voor God rechtvaardig te zijn. Het eerste toont de naarstigheid en oprechtheid van zijn doen, die David ook dikmaals in zijne psalmen betuigt; het andere ene volmaaktheid zonder gebreken, die Paulus, gelijk ook David, in zichzelven niet vond; Psa 19:13 ; Phi 3:12-13 , enz."},{"catchword":"die mij oordeelt","tekst":"Namelijk als opperste rechter, niet alleen in de uitwendige zaak mijner bediening, maar ook mijner conscientie, waarvan de Heere Christus alleen de rechter is, die daarvan metterdaad ten uitersten dage zal richten, gelijk het volgende vers vs.5 verklaart."}],"5":[{"catchword":"vóór den tijd,","tekst":"Namelijk des oordeels, in welken Christus ook de verborgen zaken der conscientie zal aan den dag brengen; Rom 2:16 ."},{"catchword":"hetgeen in de","tekst":"Gr. de verborgen dingen der duisternis."},{"catchword":"de raadslagen der","tekst":"Dat is, met welke oprechtheid, en tot welk einde elk zijn doen in zijn dienst zal gericht hebben. Waardoor hij schijnt te bestraffen degenen, die het Evangelie wel prediken, maar meer tot hun eigen eer of om gunst van mensen, dan tot Gods eer, en uit begeerte van de zaligheid der mensen."},{"catchword":"lof hebben van God","tekst":"Dat is, niet alleen een openbare getuigenis van zijn weldoen, maar ook beloning; Rom 2:6 ; 2Co 5:10 ."}],"6":[{"catchword":"deze dingen,","tekst":"Sommigen verstaan daardoor hetgeen de apostel van de gebreken en opgeblazenheid van enige leraars hiervoren gezegd heeft, en dat hij dezelve in zijn en Apollos' persoon zou bestraft hebben, zonder hunne namen uit te drukken, om hen te sparen; maar alzo hiervoren vele dingen in den persoon van Paulus, Cefas en Apollos gezegd zijn, die op zulke leraars niet kunnen passen, en ook Paulus niet gewoon is der zodaniger gebreken op zich te nemen, om die te sparen, maar veel meer zijn voorbeeld tegen zodanigen te stellen om de gemeente voor hen te waarschuwen; zo wordt dit wel zo gevoegelijk verstaan van de gebreken der gemeente zelve, die zodanig onderscheid onder de getrouwe leraars en apostelen maakten, waardoor deze verdeeldheden werden veroorzaakt, zonder dat al de leraars daarvan de schuld hadden; en verklaart dat hij in zijner en Apollos' persoon hun had getoond waarvoor zij de leraars, wie zij ook waren, moesten houden, namelijk alleen als dienaars van Christus, die hen tot Christus wezen, en tot de rechte enigheid in Christus, en niet tot zichzelven, om een bijzonderen aanhang te maken."},{"catchword":"om uwentwil;","tekst":"Dat is, om u recht te onderwijzen, hoe gij u ten aanzien van uw leraars moet gedragen, en in welke achting gij hen moet hebben."},{"catchword":"niet te gevoelen","tekst":"Namelijk nog van uwe leraars, noch van uzelven, die door hen onderwezen zijt."},{"catchword":"boven hetgeen","tekst":"Namelijk doorgaans in het Woord Gods, dat ons alom de nederigheid en enigheid aanprijst; of boven hetgeen hiervoren van ons aan u is geschreven."},{"catchword":"de een om eens","tekst":"Dat is, de ene lidmaat der gemeente tegen den ander, omdat hij door dezen of door dien leraar tot Christus is gebracht, en door zijn dienst zulke of zulke gaven tot stichting van Christus' gemeente is deelachtig geworden."}],"7":[{"catchword":"wie onderscheidt u?","tekst":"Namelijk hetzij dat gij een leraar zijt, die in gaven anderen teboven gaat, hetzij een lidmaat der gemeente, die door dezen of dien leraar tot het geloof in Christus en andere geestelijke gaven gebracht zijt. Het is dan God in Christus [wil hij zeggen], die door Zijne genade u onderscheidt van anderen niet de leraar, niet gij uzelven. Want hoewel Paulus plant, Apollos natmaakt, het is God alleen die den wasdom geeft; 1Co 3:6 ."}],"8":[{"catchword":"Alrede zijt","tekst":"Dat is, gij beeldt uzelven in dat gij nu gans gelukkig zijt, en dat u in geestelijke gaven niet meer ontbreekt, maar dat gij de volmaaktheid in alles hebt verkregen en boven alle anderen uitmunt, gelijk een koning in zijn rijk. Hetwelk de apostel verwijtenswijze zegt, om hen daarna door zijn voorbeelden de aanmerking van zijn ellendigen staat tot nederigheid te vermanen. Zie dergelijke Rev 3:17 ."},{"catchword":"zonder ons hebt","tekst":"Dat is, zonder dat wij aan uwe heerschappij of inbeelding van heerschappij, rust en welstand, deel gehad hebben."},{"catchword":"och, of gij","tekst":"Namelijk inderdaad en waarheid."},{"catchword":"wij met u","tekst":"Dit zegt hij, omdat iemand, die een ander bemint, daarover vrolijk is als het hem welgaat en als hij in alles voorspoedig is, en het geluk van den zodanige als zijn eigen acht."}],"9":[{"catchword":"Want ik acht","tekst":"Hier begint hij, tot ene waarschuwing, zijn voorbeeld en dat van de andere apostelen voor te stellen, om hen tot nadenken en een nederig gevoelen van zichzelven en van hun staat te brengen, en hen veel meer tot lijden dan tot roem te vermanen."},{"catchword":"die de laatste","tekst":"Dat is, die het laatst geroepen zijn na Christus' hemelvaart, als Paulus, Barnabas, Silas, Apollos, Timotheus en dergelijken, welke daarom van sommigen ook uit kleinachting laatste apostelen werden genaamd. Zie van dezen naam Rom 16:7 ; 2Co 8:23 ."},{"catchword":"ten toon heeft","tekst":"Of, tevoorschijn gebracht. Paulus ziet hier op de gewoonte der heidenen, die de misdadigers in de openbare schouwplaatsen tevoorschijn brachten, om hen tot vermaak van anderen den wilden beesten voor te werpen, of hen tegen deze beesten tot den dood toe te doen vechten. Hetwelk ook aan de Christenen bij hen dikwijls is geschied; 1Co 15:32 ."},{"catchword":"der wereld, en","tekst":"Dat is, de redelijke creaturen in de wereld, die hij verdeelt in engelen en mensen, waarvan de goede engelen en goede mensen getuigen waren van hun lijden en met hen medelijden hadden; en de kwade engelen en mensen daar ook een vermaak in hadden, gelijk in de schouwplaatsen allerlei volk en oordelen werden bevonden."}],"10":[{"catchword":"Wij zijn","tekst":"Dat is, voor dwazen geacht van de wereld."},{"catchword":"gij zijt wijzen","tekst":"Namelijk naar uwe mening en inbeelding."}],"12":[{"catchword":"werkende met onze","tekst":"Zie hiervan een voorbeeld in Paulus; Act 18:3 , en 1Co 9:6 ."}],"13":[{"catchword":"uitvaagsels der","tekst":"Dat is, waar wij komen, de wereldse mensen zoeken ons kwijt te raken, en werpen ons uit als vuiligheid en afschrapsel, of ook als vervloekte mensen, gelijk het Griekse woord katharma ook somwijlen wordt genomen. Zie Lam 3:45 ."},{"catchword":"tot nu toe","tekst":"Dat is, niet eens of twee maal, maar geduriglijk tot nu toe."}],"14":[{"catchword":"vermaan ik u","tekst":"Namelijk om u tot nadenken en betering van deze gebreken te brengen."}],"15":[{"catchword":"leermeesters in","tekst":"Gr. Paidagogous; dat is, leermeesters of tuchtmeesters; namelijk die u in de zaken van Christus verder onderwijzen, nadat gij van mij door het Evangelie van Christus zijt gewonnen. En dit zegt de apostel, omdat een vader met meerder beweging en oprechter liefde zijn kinderen onderricht dan wel een tuchtmeester; zie 2Co 11:20 ."},{"catchword":"geteeld","tekst":"Of, gewonnen, gegenereerd; dat is, eerst tot het geloof gebracht. Want de predikatie des Evangelies is het middel, waardoor wij van Gods Geest wedergeboren worden; Phm 1:10 ; 1Pe 1:23 ."}],"16":[{"catchword":"navolgers","tekst":"Namelijk in nederigheid, vreedzaamheid, lijdzaamheid, eenvoudigheid, enz."}],"17":[{"catchword":"mijn lieve en","tekst":"Namelijk niet alleen omdat ik hem voor Christus door het Evangelie heb gewonnen, maar ook omdat hij mijne voetstappen, als een oprecht zoon in alles navolgt; 1Ti 1:2 , en 1Ti 4:6 ."},{"catchword":"mijne wegen","tekst":"Dat is, mijn wandel in mijn leven, Psa 1:1 , Psa 1:6 , en mijne wijze van doen in het Evangelie van Christus, met alle oprechtheid en eenvoudigheid voor te stellen, gelijk hij terstond daarbij voegt."}],"18":[{"catchword":"sommigen zijn","tekst":"Dit zegt hij niet alleen van sommige leraars, die zich vanwege enige uiterlijke welsprekendheid veel lieten voorstaan, en Paulus' eenvoudigheid verachtten; maar ook van dezelven onderwezen zijnde, zichzelven, hoewel hun nog veel ontbrak, voor grote meester hielden, en anderen nevens hen verachten, gelijk in de volgende verzen verklaard wordt."},{"catchword":"niet komen zou","tekst":"Namelijk om zulke gebreken te beteren en naar behoren te straffen."}],"19":[{"catchword":"niet de woorden","tekst":"Dat is, den roem van welsprekendheid, of van kennis in geestelijke zaken."},{"catchword":"maar de kracht","tekst":"Namelijk die zij metterdaad bewijzen in geloof, liefde, en andere Christelijke deugden of gaven, die Gods Geest krachtig werkt; 1Jo 3:18 ."}],"20":[{"catchword":"het koninkrijk Gods","tekst":"Dat is, de staat van een Christenmens, of kind Gods, in hetwelk God Zijn rijk opricht; Rom 14:17 ."}],"21":[{"catchword":"met de roede","tekst":"Dat is, met oefening van straf en tuchtiging; 2Co 10:6 ."},{"catchword":"in liefde en","tekst":"Dat is, vriendelijkheid en toegenegenheid. Want anderszins komt ook de straf van een vader uit liefde; Heb 12:6 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Let (every) man so account of us as Ministers of Christ, and distributors [Gr. Oiconomous, i.e. providers for the house, or dispensers of Gods house, namely, in distributing and administering of his Word and Sacraments, 1 Cor. 2. 7. See of this word Luke 16. 1.] of the mysteries of God."}],"2":[{"catchword":null,"tekst":"And further it is required in distributors that each be found faithful, [Namely, go not beyond his charge herein, or come short of it, Heb. 3. 5.]"}],"3":[{"catchword":null,"tekst":"But it is to me the least that I should be judged of you, or of a human judgment, [Gr. A human day: a phrase taken from ordinary judgments, in which count is kept on certain set days to judge that which falls out. Not that one Prophet also might not judge of another, for he commands the contrary, 1Cor. 14. 29. but he speaks of such a judgment as shall be noted in the following words. And Paul hath here respect especially to the last day, when all things shall be judged according as they ought, Mat. 25. 14. & c. Luke 19. 12. ] yea, neither do I judge myself. [that is, not to be understood of a judgment of trying of ourselves whether we be in the faith, and in what terms we stand with God, 1Cor. 11. 28. and 2 Cor. 13. 5. but of a judgment whereby any one lifts up and praiseth himself above another in his ministry, or puts himself below another, and dispraiseth himself; as this is here reproved in some, that one exalted Paul above Peter, & c. and the other again set Peter or Apollo, & c. above him. This is it which he here submits to Gods judgment, seeing men oftentimes herein judge out of affections, as that which follows also sets forth.]"}],"4":[{"catchword":null,"tekst":"For I am conscious of nothing [Namely, as concerning the faithful administration of mine Apostleship: therein I have a good conscience, for hereof only the Apostle speaks] to my self: yet am I not thereby justified: [namely, before God, or in Gods judgment, as David also speaks, Psa. 143. 2. and Paul , Gal. 2. 16. For it is one thing to have a good conscience in ones actions before God, for his own comfort, 1 John 3. 21. and another thing by his actions to be justified before God. The first shows diligence and sincerity of his actions, which David also testifies often times in his Psalms, the other a perfection without defects, which Paul, even as David also, found yet in himself, Psa. 19. 13. Phil. 3. 12, 13. & c.] but he that judgeth me [namely, as a supreme judge, not only in the outward matter of my ministry, but also of my conscience, whereof the Lord Christ only is the judge, who shall indeed judge thereof at the last day, as the following verse declares] is the Lord."}],"5":[{"catchword":null,"tekst":"Therefore judge nothing before the time [Namely, of judgment, in which Christ shall also bring to light the secret matters of conscience, Rom. 2. 16.] until the Lord shall be come, who shall also bring to light that which is hidden in darkness, [Gr. The hidden things of darkness] and make manifest the counsels of the hearts. [that is, with what uprightness and to what end every one shall have performed his actions in his ministry. Whereby he seems to reprove those who indeed preach the Gospel, but more for their own honour or for favour of men, than for Gods glory, and out of a desire of men&acirc;&euro;&trade;s salvation ] and then shall every one have praise of God. [that is, not only a public testimony of his well-doing, but also a reward, Rom. 2. 6. 2Cor. 5. 10.]"}],"6":[{"catchword":null,"tekst":"And these things [Some understand hereby that which the Apostle said before of the faults and pride of some teachers, and that he reproved them in his own and Apollo&acirc;&euro;&trade;s person, without expressing their names, to spare them: but seeing many things are spoken heretofore in the person of Paul, Cephas and Apollo, which cannot be applied to such teachers , and also that Paul is not want to take the faults of such upon him to spare them, but much rather to oppose his example unto such, to give the church warning of them; therefore this may altogether as conveniently be understood of the faults of the church itself, who made such difference among the faithful teachers and Apostles, whereby these divisions were occasioned, without all the teachers being guilty thereof: and declares that in his own and Apollo&acirc;&euro;&trade;s person he had showed them what esteem they ought to have of their teachers whosoever they be, namely, only as ministers of Christ, who directed them to Christ, and to the true unity in Christ, and not to themselves to make a particular faction] Brethren, I have applied by similitude to myself and Apollo, for your sakes: [that is, lightly to instruct you how you must carry yourselves in respect of your teachers, and in what esteem you must have them] that you might learn in us, not to think [namely, neither of your teachers, nor of yourselves who are instructed by them] above that which is written,[ namely, throughout in the word of God, which every where commends humility and unity to us. Or above that which was written unto you by us heretofore] that ye be not the one for another&acirc;&euro;&trade;s sake puffed up against the other.[ that is, one member of the Church against another, because he was brought to Christ by this or that teacher and by his ministry was made partaker of such or such gifts for the edification of the church of Christ.]"}],"7":[{"catchword":null,"tekst":"For who differenceth thee? [Namely, whether thou be a teacher which excellest others in gifts, or whether thou be a member of the Church, who by this or that teacher, art brought to faith in Christ and other spiritual gifts. It is therefore God in Christ (he would say) who by his grace differenceth thee from another, not the teacher, not ye yourselves. For although Paul plants, Apollo moistneth, yet it is God alone which giveth the increase, 1Cor. 3. 6. ] And what hast thou that thou hast not received ? and if thou hast also received it, why dost thou boast as if thou hadst received it?"}],"8":[{"catchword":null,"tekst":"Ye are satisfied already [That is, you imagine to yourselves that you are now altogether happy, and that you have now no more want in spiritual gifts, but that you have obtained to perfection in all things, and excel all others as a King in his kingdom, which the Apostle speaks by way of upbraiding, to exhort them afterwards by his example, and the consideration of his miserable estate, unto humility. See the like Revel. 3. 17.] ye are already become rich: ye have reigned without us , [ that is, without our having had any part, in your dominion, or imagination of dominion, rest, and prosperity] and oh that ye did reign, [namely indeed and in truth] that we might reign with you. [this he saith because anyone that loveth another, is glad of it when it goeth well with him, and when he prospers in all things, and esteems such a ones happiness as his own.]"}],"9":[{"catchword":null,"tekst":"For I think [Here he begins for a warning to propound his and the other Apostles example, to bring them to a suspicion, and a lowly esteem of themselves & of their condition, and to exhort them much rather to suffering , than boasting] that God hath set us who are the last Apostles [That is, who are last called since Christ&acirc;&euro;&trade;s ascension, as Paul, Barnabas, Silas, Apollo, Timotheus, and the like, who were therefore through dis-esteem by some called the last Apostles. See of this name Rom. 16. 7. 2Cor. 8. 23.] for a spectacle [or, brought us forth. Paul here alludes to the custom of the heathen, who brought forth malefactors into the public Theaters, to cast them before the wild beasts for the recreation for the others, or to cause them to fight against those beasts even unto death : which was also oftentimes done by them to the Christians. See 1Cor. 15. 32.] as it were condemned to death, so we are become a spectacle to the world,[ that is, to the reasonable creatures in the world , which he divides into Angels and men; whereof the good Angels and good men were witnesses of their suffering, and had compassion on them; and the evil Angels and men took also a delight in it, as in the Theaters were found all manner of people and judgements] and to the Angels, and to men."}],"10":[{"catchword":null,"tekst":"We (are) foolish for Christ&acirc;&euro;&trade;s sake, [that is, esteemed fools by the world] but ye are wise in Christ, [namely, according to your thinking and imagination] we are weak but ye (are) strong: ye are glorious, but we despised."}],"11":[{"catchword":null,"tekst":"Even unto this present hour we suffer hunger, and we suffer thirst, and are naked, and are buffeted, and have no fixed dwelling place."}],"12":[{"catchword":null,"tekst":"And labour, working with our own hands, [See an example hereof in Paul, Acts 18. 3. 1Cor. 9 6. ] we reviled, and we bless: we are persecuted and we bear it."}],"13":[{"catchword":null,"tekst":"We are reproached and we intreat, we are become as the cleansings-out of the world, [That is, where we come, worldly men seek to be rid of us, and cast us out as filth and scrapings-off, or else as accursed men; as the Greek word Katharma is also taken. See Lam. 3. ver. 45.] (and) the scraping-off of all things even until now. [that is, not once or twice but continually even until now.]"}],"14":[{"catchword":null,"tekst":"I write not these things to shame you, but as my beloved children I admonish (you) [ Namely, to bring you to consideration and reformation of these faults.]"}],"15":[{"catchword":null,"tekst":"For although ye had ten thousand schoolmasters in Christ, [Gr. Paidagogous, i.e. Schoolmasters or tutors: namely, who further instruct you in the things of Christ, after that ye are begotten by me by the gospel of Christ. And this the Apostle saith because a Father instructs his children with greater affection and truer love then a tutor doth. See 2cor. 11. 20. ] yet (ye have) not many Fathers. For in Christ Jesus I have begotten you [or, gotten, engendered, i.e. first brought to the faith: for the preaching of the Gospel is the means, whereby we are regenerated by the spirit of God, Philem. Ver. 10. 1Pet. 1. 23.] through the Gospel."}],"16":[{"catchword":null,"tekst":"I exhort you therefore be imitators of me. [Namely, in humility, peaceableness, patience, simplicity, etc.]"}],"17":[{"catchword":null,"tekst":"Therefore I have sent Timothy unto you, who is my dear and faithful son in the Lord, [Namely, not only because I have begotten him to Christ by the Gospel, but also because as a true Son he follows my footsteps in all things, 1 Tim. 1. 2. and chap. 4. 6.] who shall put you in remembrance of my ways which are in Christ, [that is, of my walking in my life, Psalm 1, 1, 6. and of my manner of doing, in setting forth the Gospel of Christ with all uprightness and simplicity, as he presently subjoyness] like as I teach every where in all churches."}],"18":[{"catchword":null,"tekst":"But some are puffed up [This he saith, not only of some teachers, who by reason of some outward eloquence had a very high conceit of themselves, and despised Pauls simplicity: but also of some members, who being instructed by them, accounted themselves great masters, although they wanted much as yet, and despised others in comparison of themselves, as is declared in the following verses] as if I would not come unto you. [namely, to reform such faults, and to punish them according as they deserve.]"}],"19":[{"catchword":null,"tekst":"But I will come unto you speedily if the Lord will; and I will (then) understand, not the words [That is boasting of the eloquence, or of knowledge in spiritual things] of them that are puffed up, but the power. [namely, which they indeed show forth in faith, love and other Christian virtues or gifts, which God&acirc;&euro;&trade;s Spirit powerfully works, 1 John 3. 18.]"}],"20":[{"catchword":null,"tekst":"For the Kingdom of God [That is, the State of a Christian-man or child of God, in whom God sets up his kingdom, Rom. 14. 17.] (consisteth) not in words but in power."}],"21":[{"catchword":null,"tekst":"What will ye? Shall I come unto you with the rod?[That is, with the exercise of punishment and discipline, 2 Cor. 10. 6.] or in love [that is, in kindness and affectionateness: otherwise punishment also comes from a Father out of love, Heb. 12. 6.] and (in) the spirit of meekness."}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const _vertParam = new URLSearchParams(location.search).get('vert');
if (_vertParam && D.vertalingen[_vertParam]) vertaling = _vertParam;

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +

// popup positioneren bij een element

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;

document.addEventListener('click', e => {

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
