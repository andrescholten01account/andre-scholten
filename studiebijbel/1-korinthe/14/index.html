../romeinen/1/"},{"naam":"1 Korinthe","href":"../../1-korinthe/1/"},{"naam":"2 Korinthe","href":"../../2-korinthe/1/"},{"naam":"Galaten","href":"../../galaten/1/"},{"naam":"Efeze","href":"../../efeze/1/"},{"naam":"Filippenzen","href":"../../filippenzen/1/"},{"naam":"Kolossenzen","href":"../../kolossenzen/1/"},{"naam":"1 Thessalonicenzen","href":"../../1-thessalonicenzen/1/"},{"naam":"2 Thessalonicenzen","href":"../../2-thessalonicenzen/1/"},{"naam":"1 Timotheüs","href":"../../1-timotheus/1/"},{"naam":"2 Timotheüs","href":"../../2-timotheus/1/"},{"naam":"Titus","href":"../../titus/1/"},{"naam":"Filemon","href":"../../filemon/1/"},{"naam":"Hebreeën","href":"../../hebreeen/1/"},{"naam":"Jakobus","href":"../../jakobus/1/"},{"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}]},"vertalingen":{"SVnu":{"1":"Jaag de liefde na, en streef ernaar de geestelijke *gaven* te ontvangen, maar het meest, dat u mag profeteren.","2":"Want wie een *vreemde* taal spreekt, spreekt niet tot de mensen, maar tot God; want niemand verstaat *het*, doch met de geest spreekt hij verborgenheden.","3":"Maar wie profeteert, spreekt tot de mensen stichting, en vermaning en vertroosting.","4":"Wie een *vreemde* taal spreekt, sticht zichzelf; maar wie profeteert sticht de Gemeente.","5":"En ik wil *wel* dat u allen in *vreemde* talen spreekt, maar meer, dat u profeteert; want wie profeteert, is meer dan wie *vreemde* talen spreekt, tenzij hij het uitlegt, opdat de Gemeente stichting mag ontvangen.","6":"En nu, broeders, als ik tot u kwam en *vreemde* talen sprak, wat nut zou ik u dan doen, als ik tot u niet sprak in openbaring, of in kennis, of in profetie, of in lering?","7":"Zelfs ook de levenloze dingen die geluid geven, hetzij fluit, hetzij citer, als zij geen onderscheid met hun klank geven, hoe zal bekend worden wat op de fluit of op de citer gespeeld wordt?","8":"Want ook als de bazuin een onzeker geluid geeft, wie zal zich dan voorbereiden op de strijd?","9":"Zo ook u: als u niet door de taal een duidelijk woord spreekt, hoe zal verstaan worden wat gesproken wordt? Want u zult zijn *als* iemand die in de lucht spreekt.","10":"Er zijn, naar het voorvalt, zoveel soorten van stemmen in de wereld, en geen daarvan is zonder betekenis.","11":"Als ik dan de betekenis van de stem niet ken, zal ik voor hem die spreekt een vreemdeling[1] zijn; en hij die spreekt, zal voor mij een vreemdeling zijn.","12":"Zo ook u: omdat u ijverig bent naar geestelijke gaven, zoek dan dat u overvloedig mag zijn tot stichting van de Gemeente.","13":"Daarom, wie in een *vreemde* taal spreekt, die bidt dat hij het mag uitleggen.","14":"Want als ik in een *vreemde* taal bid, bidt mijn geest *wel*, maar mijn verstand is vruchteloos.","15":"Wat is het dan? Ik zal *wel* met de geest bidden, maar ik zal ook met het verstand bidden; ik zal *wel* met de geest zingen, maar ik zal ook met het verstand zingen.","16":"Anders, als u dankzegt met de geest, hoe zal degene die de plaats van een ongeleerde inneemt, amen zeggen op uw dankzegging, omdat hij niet weet wat u zegt?","17":"Want u dankt wel behoorlijk, maar de ander wordt niet gesticht.","18":"Ik dank mijn God, dat ik meer *vreemde* talen spreek dan u allen;","19":"Maar ik wil *liever* in de Gemeente vijf woorden spreken met mijn verstand, opdat ik ook anderen mag onderwijzen, dan tienduizend woorden in een *vreemde* taal.","20":"Broeders, word geen kinderen in het verstand, maar wees kinderen in de boosheid, en word in het verstand volwassen.","21":"In de wet is geschreven: Ik zal door lieden van andere talen, en door andere lippen tot dit volk spreken, en toch zullen zij Mij ook zo niet horen, zegt de Heere.","22":"Zo dan, de *vreemde* talen zijn tot een teken niet voor hun die geloven, maar voor de ongelovigen; en de profetie niet voor de ongelovigen, maar voor hun die geloven.","23":"Als dan de hele Gemeente bijeengebracht is, en zij allen in *vreemde* talen spraken, en er *enige* ongeleerden of ongelovigen binnenkwamen, zouden zij dan niet zeggen dat u buiten zinnen bent?","24":"Maar als zij allen profeteerden, en er een ongelovige of ongeleerde binnenkwam, dan wordt hij door allen overtuigd, *en* hij wordt door allen beoordeeld.","25":"En zo worden de verborgen dingen van zijn hart openbaar; en zo, vallend op *zijn* gezicht, zal hij God aanbidden, en verkondigen dat God werkelijk onder u is.","26":"Wat is het dan, broeders? Wanneer u samenkomt, heeft ieder van u een psalm, heeft een leer, heeft een *vreemde* taal, heeft een openbaring, heeft een uitleg; laat alle dingen gebeuren tot stichting;","27":"En als iemand een *vreemde* taal spreekt, laat het door twee, of ten hoogste drie gebeuren, en om beurten; en laat één het uitleggen.","28":"Maar als er geen uitlegger is, laat hij dan zwijgen in de Gemeente; doch laat hij tot zichzelf spreken, en tot God.","29":"En laat twee of drie profeten spreken, en laat de anderen oordelen.","30":"Doch als aan een ander die er zit iets geopenbaard is, laat dan de eerste zwijgen.","31":"Want u kunt allen, de een na de ander, profeteren, opdat zij allen leren, en allen getroost worden.","32":"En de geesten der profeten zijn aan de profeten onderworpen.","33":"Want God is geen *God* van verwarring, maar van vrede, zoals in al de Gemeenten der heiligen.","34":"Laat uw vrouwen in de Gemeenten zwijgen; want het is haar niet toegestaan te spreken, maar *bevolen* onderworpen te zijn, zoals ook de wet zegt.","35":"En als zij iets willen leren, laat hen thuis hun eigen mannen vragen; want het staat lelijk voor de vrouwen dat zij in de Gemeente spreken.","36":"Is het Woord van God van u uitgegaan? Of is het tot u alleen gekomen?","37":"Als iemand meent een profeet te zijn, of geestelijke, die erkent dat hetgeen ik u schrijf, geboden van de Heere zijn.","38":"Maar als iemand onwetend is, laat hij dan onwetend blijven.","39":"Zo dan, broeders, streef ernaar te profeteren, en verhinder niet in *vreemde* talen te spreken.","40":"Laat alle dingen eerlijk en met orde gebeuren."},"SV":{"1":"Jaagt de liefde na, en ijvert om de geestelijke *gaven*, maar meest, dat gij moogt profeteren.","2":"Want die een *vreemde* taal spreekt, spreekt niet den mensen, maar Gode; want niemand verstaat *het*, doch met den geest spreekt hij verborgenheden.","3":"Maar die profeteert, spreekt den mensen stichting, en vermaning en vertroosting.","4":"Die een *vreemde* taal spreekt, die sticht zichzelven; maar die profeteert die sticht de Gemeente.","5":"En ik wil *wel*, dat gij allen in *vreemde* talen spreekt, maar meer, dat gij profeteert; want die profeteert, is meerder dan die *vreemde* talen spreekt, tenzij dan, dat hij het uitlegge, opdat de Gemeente stichting moge ontvangen.","6":"En nu, broeders, indien ik tot u kwam, en sprak *vreemde* talen, wat nuttigheid zou ik u doen, zo ik tot u niet sprak, of in openbaring, of in kennis, of in profetie of in lering?","7":"Zelfs ook de levenloze dingen, die geluid geven, hetzij fluit, hetzij citer, zo zij geen onderscheid met *hun* klank geven, hoe zal bekend worden, hetgeen op de fluit of op de citer gespeeld wordt?","8":"Want ook indien de bazuin een onzeker geluid geeft, wie zal zich tot den krijg bereiden?","9":"Alzo ook gijlieden, indien gij niet door de taal een duidelijke rede geeft, hoe zal verstaan worden hetgeen gesproken wordt? Want gij zult zijn *als* die in de lucht spreekt.","10":"Er zijn, naar het voorvalt, zo vele soorten van stemmen in de wereld, en geen derzelve is zonder stem.","11":"Indien ik dan de kracht der stem niet weet, zo zal ik hem, die spreekt, barbaars zijn; en hij, die spreekt, zal bij mij barbaars zijn.","12":"Alzo ook gij, dewijl gij ijverig zijt naar geestelijke gaven, zo zoekt dat gij moogt overvloedig zijn tot stichting der Gemeente.","13":"Daarom, die in een *vreemde* taal spreekt, die bidde, dat hij het moge uitleggen.","14":"Want indien ik in een *vreemde* taal bid, mijn geest bidt *wel*, maar mijn verstand is vruchteloos.","15":"Wat is het dan? Ik zal *wel* met den geest bidden, maar ik zal ook met het verstand bidden; ik zal *wel* met den geest zingen, maar ik zal ook met het verstand zingen.","16":"Anderszins, indien gij dankzegt met den geest, hoe zal degene, die de plaats eens ongeleerden vervult, amen zeggen op uw dankzegging, dewijl hij niet weet, wat gij zegt?","17":"Want gij dankzegt wel behoorlijk, maar de ander wordt niet gesticht.","18":"Ik dank mijn God, dat ik meer *vreemde* talen spreek, dan gij allen;","19":"Maar ik wil *liever* in de Gemeente vijf woorden spreken met mijn verstand, opdat ik ook anderen moge onderwijzen, dan tien duizend woorden in een *vreemde* taal.","20":"Broeders, wordt geen kinderen in het verstand, maar zijt kinderen in de boosheid, en wordt in het verstand volwassen.","21":"In de wet is geschreven: Ik zal door lieden van andere talen, en door andere lippen tot dit volk spreken, en ook alzo zullen zij Mij niet horen, zegt de Heere.","22":"Zo dan, de *vreemde* talen zijn tot een teken niet dengenen, die geloven, maar den ongelovigen; en de profetie niet den ongelovigen, maar dengenen, die geloven.","23":"Indien dan de gehele Gemeente bijeenvergaderd ware, en zij allen in *vreemde* talen spraken, en *enige* ongeleerden of ongelovigen inkwamen, zouden zij niet zeggen, dat gij uitzinnig waart?","24":"Maar indien zij allen profeteerden, en een ongelovige of ongeleerde inkwame, die wordt van allen overtuigd, *en* hij wordt van allen geoordeeld.","25":"En alzo worden de verborgene dingen zijns harten openbaar; en alzo, vallende op *zijn* aangezicht, zal hij God aanbidden, en verkondigen, dat God waarlijk onder u is.","26":"Wat is het dan, broeders? Wanneer gij samenkomt, een iegelijk van u, heeft hij een psalm, heeft hij een leer, heeft hij een *vreemde* taal, heeft hij een openbaring, heeft hij een uitlegging; laat alle dingen geschieden tot stichting;","27":"En zo iemand een *vreemde* taal spreekt, *dat* het door twee, of ten meeste drie *geschiede*, en bij beurte; en dat een het uitlegge.","28":"Maar indien er geen uitlegger is, dat hij zwijge in de Gemeente; doch dat hij tot zichzelven spreke, en tot God.","29":"En dat twee of drie profeten spreken, en dat de anderen oordelen.","30":"Doch indien een ander, die er zit, *iets* geopenbaard is, dat de eerste zwijge.","31":"Want gij kunt allen, de een na den ander profeteren, opdat zij allen leren, en allen getroost worden.","32":"En de geesten der profeten zijn den profeten onderworpen.","33":"Want God is geen *God* van verwarring, maar van vrede, gelijk in al de Gemeenten der heiligen.","34":"Dat uw vrouwen in de Gemeenten zwijgen; want het is haar niet toegelaten te spreken, maar *bevolen* onderworpen te zijn, gelijk ook de wet zegt.","35":"En zo zij iets willen leren, laat haar te huis haar eigen mannen vragen; want het staat lelijk voor de vrouwen, dat zij in de Gemeente spreken.","36":"Is het Woord Gods van u uitgegaan? Of is het tot u alleen gekomen?","37":"Indien iemand meent een profeet te zijn, of geestelijke, die erkenne, dat, hetgeen ik u schrijf, des Heeren geboden zijn.","38":"Maar zo iemand onwetend is, die zij onwetend.","39":"Zo dan, broeders, ijvert om te profeteren, en verhindert niet in *vreemde* talen te spreken.","40":"Laat alle dingen eerlijk en met orde geschieden."},"KJV":{"1":"Follow after charity, and desire spiritual gifts, but rather that ye may prophesy.","2":"For he that speaketh in an unknown tongue speaketh not unto men, but unto God: for no man understandeth him; howbeit in the spirit he speaketh mysteries.","3":"But he that prophesieth speaketh unto men to edification, and exhortation, and comfort.","4":"He that speaketh in an unknown tongue edifieth himself; but he that prophesieth edifieth the church.","5":"I would that ye all spake with tongues, but rather that ye prophesied: for greater is he that prophesieth than he that speaketh with tongues, except he interpret, that the church may receive edifying.","6":"Now, brethren, if I come unto you speaking with tongues, what shall I profit you, except I shall speak to you either by revelation, or by knowledge, or by prophesying, or by doctrine?","7":"And even things without life giving sound, whether pipe or harp, except they give a distinction in the sounds, how shall it be known what is piped or harped?","8":"For if the trumpet give an uncertain sound, who shall prepare himself to the battle?","9":"So likewise ye, except ye utter by the tongue words easy to be understood, how shall it be known what is spoken? for ye shall speak into the air.","10":"There are, it may be, so many kinds of voices in the world, and none of them is without signification.","11":"Therefore if ➔ I know not the meaning of the voice, I shall be unto him that speaketh a barbarian, and he that speaketh shall be a barbarian unto me.","12":"Even so ye, forasmuch as ye are zealous of spiritual gifts, seek that ye may excel to the edifying of the church.","13":"Wherefore let him that speaketh in an unknown tongue pray that he may interpret.","14":"For if I pray in an unknown tongue, my spirit prayeth, but my understanding is unfruitful.","15":"What is it then? I will pray with the spirit, and I will pray with the understanding also: I will sing with the spirit, and I will sing with the understanding also.","16":"Else when thou shalt bless with the spirit, how shall he that occupieth the room of the unlearned say Amen at thy giving of thanks, seeing he understandeth not what thou sayest?","17":"For thou verily givest thanks well, but the other is ➔ not edified.","18":"I thank my God, I speak with tongues more than ye all:","19":"Yet in the church I had rather speak five words with my understanding, that by my voice I might teach others also, than ten thousand words in an unknown tongue.","20":"Brethren, be not children in understanding: howbeit in malice be ye children, but in understanding be men.","21":"In the law it is written, With men of other tongues and other lips will I speak unto this people; and yet for all that will they ➔ not hear me, saith the Lord.","22":"Wherefore tongues are for a sign, not to them that believe, but to them that believe not: but prophesying serveth not for them that believe not, but for them which believe.","23":"If therefore the whole church be come together into one place, and all speak with tongues, and there come in those that are unlearned, or unbelievers, will they ➔ not say that ye are mad?","24":"But if all prophesy, and there come in one that believeth not, or one unlearned, he is convinced of all, he is judged of all:","25":"And thus are ➔ the secrets of his heart made manifest; and so falling down on his face he will worship God, and report that God is in you of a truth.","26":"How is it then, brethren? when ye come together, every one of you hath a psalm, hath a doctrine, hath a tongue, hath a revelation, hath an interpretation. Let ➔ all things be done unto edifying.","27":"If any man speak in an unknown tongue, let it be by two, or at the most by three, and that by course; and let ➔ one interpret.","28":"But if ➔ there be no interpreter, let him keep silence in the church; and let him speak to himself, and to God.","29":"Let ➔ the prophets speak two or three, and let ➔ the other judge.","30":"If any thing be revealed to another that sitteth by, let ➔ the first hold his peace.","31":"For ye may all prophesy one by one, that all may learn, and all may be comforted.","32":"And the spirits of the prophets are subject to the prophets.","33":"For God is not the author of confusion, but of peace, as in all churches of the saints.","34":"Let ➔ your women keep silence in the churches: for it is ➔ not permitted unto them to speak; but they are commanded to be under obedi  is, tracht evenwel daarnaar, dat de een den anderen daarin moge overtreffen."},{"catchword":"om de geestelijke","tekst":"Om de buitengewone gaven te verkrijgen, die de Heilige Geest toen in velen wrocht. Zie 1Co 12:1 , 1Co 12:8-10 . Hoewel men ook moet ijveren om de gewone gaven."},{"catchword":"profeteren","tekst":"Wat dit is, zie Rom 12:7 ; 1Co 12:10 , en vs.3."}],"2":[{"catchword":"een vreemde taal","tekst":"Gr. met een tong; gelijk ook in het volgende."},{"catchword":"den mensen, maar","tekst":"Dat is, dat hij hen daarmede zou bekendmaken de gedachten zijns harten, hetwelk het doel is der spraak, waartoe zij gebruikt wordt."},{"catchword":"Gode;","tekst":"Dat is, dat het wel verstaan wordt door God, maar niet door de mensen. Hetwelk niet genoeg is."},{"catchword":"verstaat het,","tekst":"Gr. hoort het; namelijk met verstand. Zie Gen 11:7 ."},{"catchword":"met den geest","tekst":"Dat is, met de gave, die de Heilige Geest in hem gewrocht heeft. Of, zijn gemoed."},{"catchword":"verborgenheden","tekst":"Dit kan verstaan worden, òf van de verborgenheden van het koninkrijk der hemelen, Mat 13:11 ; 1Co 4:1 , en 1Co 13:2 , die te treffelijk zijn, dan dat zij zonder vrucht en aandacht in onbekende taal zouden voorgesteld worden; òf dat die in onbekende taal spreekt, niet anders doet dan of hij enige verborgen dingen voorstelde, die niemand verstaan kan."}],"3":[{"catchword":"die profeteert,","tekst":"Dat is, die profetische schriften in een bekende taal uitlegt. Zie vs.1."},{"catchword":"spreekt den mensen","tekst":"Dat is, spreekt alzo, dat de mensen het kunnen verstaan en daaruit vrucht scheppen."},{"catchword":"stichting en vermaning","tekst":"Dat is, hetgeen dienen kan tot stichting of onderwijzing der onwetenden, vermaning der ongeregelden en vertroosting der bedroefden. Tot deze drie nuttigheden moeten alle uitleggingen van Gods Woord gepast worden; Rom 15:4 ; 2Ti 3:16 . En hierom is de gave van profeteren beter dan van vreemde talen, omdat daardoor deze nuttigheden niet worden bekomen."}],"5":[{"catchword":"ik wil wel","tekst":"Dat is, ik wilde of wenste wel; zover is het vandaar, dat ik de gave van vreemde talen hiermede zou willen veracht hebben."},{"catchword":"is meer dan die","tekst":"Dat is, heeft treffelijker gave en dienstiger tot stichting der gemeente."},{"catchword":"tenzij dan, dat hij het uitlegge","tekst":"Of, overzette; namelijk in een andere bekende taal, alzo dat de gemeente het verstaan kan."}],"6":[{"catchword":"wat nuttigheid","tekst":"Namelijk tot uwe stichting."},{"catchword":"niet sprak of","tekst":"Of, niet sprak of door openbaring, enz.; dat is, in bekende taal u niet predikte, zodat gij zoudt kunnen verstaan wat ik u voorstelde, òf enige openbaring van verborgenheden, òf enige wetenschap hoe men in twijfelachtige zaken zich moet gedragen, òf enige verklaring der profetische schriften, òf enige bevestiging van enig artikel des geloofs."}],"7":[{"catchword":"de levenloze dingen,","tekst":"Gr. zielloze; dat is, muziekinstrumenten."},{"catchword":"geluid","tekst":"Gr. stem."},{"catchword":"onderscheid met hun klank","tekst":"Dat is, verscheidenheid van tonen, maar altijd enerlei toon, hetwelk zeer onaangenaam en verdrietig is om te horen."},{"catchword":"hetgeen","tekst":"Dat is, welk gezang of lied."}],"8":[{"catchword":"bazuin","tekst":"Of trompet, waardoor de krijgslieden ten strijde worden vermaand en opgewekt."},{"catchword":"een onzeker geluid","tekst":"Of, onbekend; namelijk uit welke men niet kan verstaan, dat men daardoor vermaand en opgewekt wordt om zich tot den strijd te bereiden. Want daartoe placht een zekere soort van trompetten gebruikt te worden welke classicum genaamd werd."}],"9":[{"catchword":"door de taal een","tekst":"Of, door de tong."},{"catchword":"duidelijke rede geeft,","tekst":"Dat is, woorden spreekt, die men verstaan kan, wat gij daarmede wilt zeggen."},{"catchword":"verstaan worden","tekst":"Namelijk van de toehoorders, die de talen niet verstaan."},{"catchword":"in de lucht spreekt","tekst":"Dat is, enig geluid maakt en uitwerpt in de lucht, dat daar verdwijnt zonder enig nut. Zie 1Co 9:26 ."}],"10":[{"catchword":"naar het voorvalt,","tekst":"Dat is, gelijk het naar gelegenheid der tijden en plaatsen gebeurt."},{"catchword":"vele soorten","tekst":"Namelijk niet alleen onder de mensen, die hun verscheidene spraken hebben, maar ook onder allerlei soorten van dieren en vogels."},{"catchword":"zonder stem","tekst":"Dat is, zonder zodanig een geluid, dat de mensen van enerlei taal daardoor elkander kunnen verstaan, en dat men uit het geluid van de dieren en vogels elke soort van dezelve kan onderkennen, zodat zij nog enige betekenis hebben, hetwelk in vreemde onbekende talen niet is."}],"11":[{"catchword":"de kracht der stem","tekst":"Dat is, de beduidenis van hetgeen gesproken wordt niet versta."},{"catchword":"barbaars zijn;","tekst":"Dat is, een mens van onbekende taal. De Grieken en Romeinen noemden alle andere natiën, die hunne taal niet spraken of verstonden, Barbaren. Zie Act 28:2 , Act 28:4 ; Rom 1:14 ; Col 3:11 ."},{"catchword":"bij mij barbaars zijn","tekst":"Gr. in mij."}],"12":[{"catchword":"ijverig zijt naar","tekst":"Gr. ijveraars zijt van geestelijke gaven; dat is, om strijd daarnaar poogt, dat gij de beste geestelijke gaven moogt hebben, hetwelk een prijslijke ijver en strijd is."},{"catchword":"geestelijke gaven,","tekst":"Gr. geesten."},{"catchword":"overvloedig zijn","tekst":"Gr. Of uitnemende."},{"catchword":"tot stichting der gemeente","tekst":"Dat is, dat gij zodanige gaven moogt hebben en gebruiken, waardoor de gemeente meest kan gesticht worden."}],"13":[{"catchword":"spreekt","tekst":"Dat is, spreken kan en wil in de gemeente."},{"catchword":"bidde dat hij het moge uitleggen","tekst":"Dat is, dat God hem, benevens de gave van vreemde talen, ook wil verlenen de gave van hetzelve in bekende taal duidelijk over te zetten en uit te leggen. Want dit was ook een bijzondere gave des Geestes. Zie 1Co 12:10 , 1Co 12:30 , en vs.26,27; en hoewel zij zelf wel verstonden wat zij zeiden, zo hadden zij evenwel niet altijd daarbij de gave van het duidelijk te kunnen vertalen. Of, dat hij alzo bidde, namelijk in de gemeente, dat hij het gebed, in onbekende taal gedaan, ook in een bekende taal uitlegge."}],"14":[{"catchword":"bid,","tekst":"Dat is, een gebed doe openlijk in de gemeente."},{"catchword":"mijn geest bidt wel,","tekst":"Dat is, ik doe in mijn gemoed wel een gebed door de gave des Heiligen Geestes, dat goed is."},{"catchword":"mijn verstand is","tekst":"Namelijk hetwelk ik heb van die taal, zie vs.4, of de mening mijns gebeds."},{"catchword":"vruchteloos","tekst":"Namelijk bij de toehoorders, die zulk een gebed niet verstaan."}],"15":[{"catchword":"Wat is het dan?","tekst":"Dat is, wat zal men dan moeten doen, om deze gave recht te gebruiken."},{"catchword":"Ik zal wel met den geest bidden,","tekst":"Dat is, ik zal wel deze gave des Heiligen Geestes gebruiken, om het gebed te doen in de gemeente in vreemde taal."},{"catchword":"met het verstand bidden;","tekst":"Dat is, ik zal daarbij voegen een duidelijke uitlegging, dat de toehoorders het zullen kunnen verstaan."},{"catchword":"zingen, maar","tekst":"Namelijk psalmen en geestelijke liedekens, in de vergadering der gemeente."}],"16":[{"catchword":"dankzegt met den geest,","tekst":"Of zegent, dat is met deze gave des Heiligen Geestes begaafd zijnde, openbare dankzegging doet in de gemeente."},{"catchword":"de plaats eens","tekst":"Dat is, die onder de gemene lieden of toehoorders zit. Want het schijnt dat de leraars in een bijzondere en verhevene plaats hebben gezeten in de vergaderingen."},{"catchword":"ongeleerden vervult,","tekst":"Gr. idiotes; dat is, die de vreemde talen niet verstaat, en die geen openbare bediening of buitengewone gaven heeft, om in de gemeente te leren, het gebed of dankzegging te doen."},{"catchword":"Amen zeggen","tekst":"Dit woord Amen komt van een Hebreeuws woord, betekenende waarheid, zekerheid, vastigheid, en wordt gebruikt tot besluit des gebeds, Rom 15:33 ; 2Ti 4:22 , om daarmede te verklaren dat men toestemt hetgeen gebeden is en wenst dat het mag geschieden. Zie Deu 27:15 , enz; Neh 5:13 ; Jer 11:5 ; Luk 24:53 ; Rom 1:25 , en Rom 9:5 ; Rev 22:20-21 ."}],"17":[{"catchword":"dankzegt wel behoorlijk,","tekst":"Dat is, gij doet wel een goede dankzegging, die u kan stichten, omdat gij de taal verstaat."},{"catchword":"de ander wordt","tekst":"Namelijk die uwe dankzegging hoort en de taal niet verstaat, waarin gij dankzegt."}],"18":[{"catchword":"Ik dank mijnen God","tekst":"Of, dat ik vreemde talen spreek meer dan gij allen. De apostel stelt zijn eigen voorbeeld den Corinthiërs voor, hetwelk zij billijk behoorden na te volgen. Hij dankt God voor de gave der vreemde talen, die hij overvloediger ontvangen had dan iemand van henlieden, die daarmede in de vergaderingen pronkten, om te tonen dat hij deze gave niet veracht, maar alleen het misbruik derzelve bestraft."}],"19":[{"catchword":"in de gemeente","tekst":"Dat is, in de vergadering der gelovigen, waar ook vele ongeleerden tegenwoordig zijn."},{"catchword":"vijf woorden spreken","tekst":"Dat is, enige weinige."},{"catchword":"met","tekst":"Of, door."},{"catchword":"mijn verstand,","tekst":"Dat is, alzo dat ik mijn verstand of de gedachten mijns gemoeds uitdruk met klare, bekende en duidelijke woorden, die een iegelijk verstaan kan."},{"catchword":"tien duizend woorden in een","tekst":"Dat is, een grote en lange rede; zie 1Co 4:15 . Waaruit klaarlijk blijkt dat diegenen regelrecht tegen de leer des apostels doen, die den godsdienst en hunne gebeden tot God doen in een vreemde taal, die zij zelf of hunne toehoorders niet verstaan, en die dezelfde gebeden met vijftigen en honderden God als toetellen."}],"20":[{"catchword":"wordt gene kinderen","tekst":"Dat is, toont dat gij beter verstand hebt dan de kinderen, alzo het gans kinderlijk is, dat men in de vergadering wil pronken met vreemde talen zonder enige stichting. Of, blijft niet altijd in de kinderlijke en geringe kennis van geestelijke zaken. Zie Heb 5:12 , en Heb 6:1 ."},{"catchword":"in de boosheid,","tekst":"Dat is, volgt de kinderen na, niet in hun onverstand, maar in hunne eenvoudigheid, omdat de kinderen, hoewel zij geboren worden met een verdorven natuur, nochtans die nog zo metterdaad niet tonen als de volwassenen."},{"catchword":"in het verstand","tekst":"Namelijk van geestelijke zaken ter zaligheid nodig."},{"catchword":"volwassen","tekst":"Gr. volmaakt; dat is, neemt dagelijks in dit verstand in zulker voege toe, dat tussen het verstand, dat gij nu hebt van geestelijke zaken, en dat gij nog zult verkrijgen, zulk een onderscheid is, als er is tussen het verstand van een kind en van een volwassen man. Want dat wij in dit leven tot de gans volmaakte kennis der geestelijke dingen niet zullen komen, heeft de apostel in het voorgaande hoofdstuk geleerd, 1Co 13:9-12 ."}],"21":[{"catchword":"In de wet is geschreven","tekst":"Dat is, in de Schriften des Ouden Testaments. Zie Joh 10:34 ."},{"catchword":"van andere talen,","tekst":"Dat is, van onbekende talen, die zij niet verstaan zullen."},{"catchword":"andere lippen","tekst":"Dat is, onbekende spraak."},{"catchword":"tot dit volk spreken,","tekst":"Namelijk om hetzelve daarmede te straffen. Dewijl dan God de onbekende talen en spraken als een straf gebruikt, zo behoort men dezelve in de gemeente zonder verklaring niet te gebruiken, overmits zulks zou strekken meer tot straf dan tot stichting derzelve. Zie verdere verklaring Isa 28:11 ."},{"catchword":"niet horen, zegt de","tekst":"Dat is, niet verstaan."}],"22":[{"catchword":"tot een teken","tekst":"Namelijk van Gods toorn."},{"catchword":"den ongelovigen; en","tekst":"Dat is, die hardnekkig het Woord Gods verwerpen, dien zendt God tot ene straf wat tot hen gesproken wordt in een onbekende taal."},{"catchword":"de profetie","tekst":"Zie vs.3, 4."},{"catchword":"niet den ongelovigen, maar","tekst":"Want hoewel de profetie ook kan dienen om een ongelovige te bekeren, nochtans alzo de ongelovigen in de vergadering niet veel komen, zo wordt zij voornamelijk aangesteld om de gelovigen te vermanen, vertroosten en versterken."}],"23":[{"catchword":"ongelovigen inkwamen,","tekst":"Namelijk die nog tot den Christelijken godsdienst niet bekeerd zijn."},{"catchword":"dat gij uitzinnig waart?","tekst":"Namelijk als gij voor het volk spreekt hetgeen zij niet verstaan, hetwelk gen wijze maar uitzinnige lieden doen. Waardoor dan een ongelovige meer en meer van den Christelijken godsdienst vervreemd wordt, als die hem schijnen zou de mensen uitzinnig te maken."}],"24":[{"catchword":"allen profeteerden, en een","tekst":"Namelijk die de gaven der profetie hebben, de een na den ander. Zie vs.28-30."},{"catchword":"van allen","tekst":"Namelijk die de gave van profetie in de gemeente recht gebruiken."},{"catchword":"overtuigd, en hij wordt","tekst":"Of, bestraft; dat is, overwonnen in zijne conscientie dat de Christelijke religie de rechte en ware religie is."},{"catchword":"geoordeeld","tekst":"Dat is, veroordeeld, namelijk over zijn voorgaande zonden, en indien hij hetgeen door het profeteren uit Gods Woord voorgesteld wordt niet met waar geloof wil aannemen, zo wordt hij buiten alle onschuld gesteld. Zie Act 24:25 ."}],"25":[{"catchword":"de verborgen dingen zijns harten","tekst":"Dat is, als door profeteren Gods Woord uitgelegd wordt, blijkt hoe een mens in zijn hart gesteld is, namelijk of hij in zijn ongelovigheid hardnekkig wil blijven, of het Evangelie geloven. Zie 2Co 2:15-16 ."},{"catchword":"vallende op zijn","tekst":"Namelijk degene, die door het profeteren in zijn hart overtuigd is van de waarheid van den Christelijken godsdienst, die zal zich terstond met allen eerbied begeven om den waren God te dienen en den Christelijke godsdienst voor den waren te belijden."},{"catchword":"dat God waarlijk","tekst":"Dat is, dat in uwe gemeente de ware religie recht geleerd en geoefend wordt."},{"catchword":"onder u is","tekst":"Gr. in u."}],"26":[{"catchword":"Wat is het dan,","tekst":"Dat is, dewijl hetgeen tevoren gezegd is, alzo inderdaad is, wat zal men dan verder doen? Hier begint de apostel enige regelen voor te schrijven, die men in de gemeente moet onderhouden in het gebruiken der gaven."},{"catchword":"een psalm,","tekst":"Of, lofzang; namelijk door ingeven des Heiligen Geestes van hem gemaakt tot Gods eer en stichting der gemeente."},{"catchword":"ene leer","tekst":"Dat is, een bijzondere onderwijzing, vermaning of vertroosting, door den Heiligen Geest hem bijzonder ingegeven."},{"catchword":"ene openbaring","tekst":"Namelijk des Heiligen Geestes van enige onbekende of toekomende dingen. Zie Rev 1:1 ."},{"catchword":"ene uitlegging;","tekst":"Dat is, de gave van vreemde talen in bekende spraken te vertalen; of ook van enige duistere plaatsen der Heilige Schrift wel en duidelijk te verklaren."}],"27":[{"catchword":"door twee, of ten meeste drie","tekst":"Dat is, dat niet velen daarmede den tijd doorbrengen; doch zo men immers vreemde talen wil spreken, dat zulks van zo weinigen geschiede, als het doenlijk is."},{"catchword":"bij beurten;","tekst":"Dat is, niet tevens op een tijd overhoop, maar de een na den ander."},{"catchword":"een het uitlegge.","tekst":"Namelijk opdat de gemeenten daardoor mogen verstaan wat het is, dat in onbekende taal gesproken is geweest."}],"28":[{"catchword":"geen uitlegger is,","tekst":"Namelijk òf hij zelf, die vreemde talen spreekt, òf een ander, die de gave heeft om deze vreemde talen over te zetten in bekende te vertalen."},{"catchword":"zwijge in de gemeente;","tekst":"Namelijk die met vreemde talen spreekt."},{"catchword":"tot zichzelven","tekst":"Of, bij zichzelven, in het bijzonder, niet openlijk in de gemeente."},{"catchword":"tot God","tekst":"Namelijk inwendig God, die de gedachten des harten weet en alle talen verstaat, aanroepende en dankende."}],"29":[{"catchword":"twee of drie","tekst":"Namelijk om den tijd met profeteren alleen niet door te brengen."},{"catchword":"profeten","tekst":"Zie vs.3,4."},{"catchword":"spreken, en dat","tekst":"Namelijk in de gemeente, en dat bij beurte, vs.27."},{"catchword":"de anderen","tekst":"Namelijk die dezelfde gaven van profeteren hebben, of de gave van de geesten te onderscheiden."},{"catchword":"oordelen","tekst":"Namelijk of die profetie overeenkomt met Gods Woord, aan welke alle leringen en openbaringen moeten getoetst worden. Zie Isa 8:20 ; Joh 5:39 ."}],"30":[{"catchword":"een ander,","tekst":"Namelijk die mede de gave van profeteren heeft."},{"catchword":"die daar zit,","tekst":"Dat is, die nog geen beurt heeft gehad om op te staan en te spreken."},{"catchword":"iets geopenbaard is,","tekst":"Namelijk dat den anderen, die daar spreekt, òf niet, òf niet zo klaarlijk is geopenbaard, als aan hem."},{"catchword":"dat de eerste zwijge","tekst":"Namelijk om plaats te geven aan dien tweede, om te spreken."}],"31":[{"catchword":"zij allen leren","tekst":"Dat is, zo de profeten als de algemene toehoorders onderwezen worden."},{"catchword":"getroost worden","tekst":"Of, vermaand."}],"32":[{"catchword":"de geesten der","tekst":"Dat is, de leringen, die de profeten door de gave en ingeving des Heiligen Geestes voorstellen."},{"catchword":"zijn den profeten","tekst":"Dat is, staan onder het oordeel van de andere profeten, die hen horen, aan welk oordeel zij ook zich gaarne onderwerpen. Want hoewel deze profetering van den Heiligen Geest, die niet dwalen kan, werd ingegeven, zo werd nochtans niet altijd aan een alles geopenbaard, en hetgeen den een geopenbaard werd, dat werd ook dikwijls meer anderen mee geopenbaard. Daar zou ook van enige profeten iets van het hunne daarbij gemengd kunnen worden. Zo moet dan beproefd en geoordeeld worden van de anderen of de profetering ook geschiedt door ingeving des Heiligen Geestes en naar de mate des geloofs. Zie Isa 8:20 ; Rom 12:7 ."}],"33":[{"catchword":"geen God van","tekst":"Of, geen auteur, of liefhebber."},{"catchword":"verwarring, maar van vrede,","tekst":"Of, beroerte."},{"catchword":"gelijk in al de","tekst":"Namelijk van mij geleerd wordt. Of, nodig is."}],"34":[{"catchword":"zwijgen; want het is","tekst":"Dat is, openlijk niet spreken tot de gemeente, al zijn zij ook met goede kennis begaafd. Zie 1Co 11:5 ."},{"catchword":"te spreken, maar","tekst":"Namelijk openlijk in de gemeente iets te leren of voor te stellen. Zie 1Ti 2:12 ."},{"catchword":"onderworpen te zijn,","tekst":"Namelijk den mannen, om van hen onderwijzing te ontvangen. Want die een ander in openbare vergaderingen onderwijst, heeft daardoor enig gezag over of boven dengene, die onderwezen wordt."},{"catchword":"de wet zegt","tekst":"Namelijk Gen 3:16 ."}],"35":[{"catchword":"leren, laat haar","tekst":"Dat is, van enige leerstukken breder onderwezen worden."},{"catchword":"haar eigen mannen","tekst":"Namelijk zo die bekwaam zijn om haar te onderwijzen; anderszins zo mogen zij ook wel in het bijzonder de leraars der gemeente of enige andere eerlijke en beschaafde mannen ondervragen."},{"catchword":"lelijk voor de vrouwen","tekst":"Dat is, onbetamelijk, kwalijk passende, omdat daarmede de orde omgekeerd wordt, die God gesteld heeft tussen man en vrouw, en dat zulks ook strijd tegen de eerbare schaamte, die bij de vrouwen behoort te zijn."}],"36":[{"catchword":"van u uitgegaan,","tekst":"Dat is, van u, Corinthische leraars, die op uwe gaven zo hoogmoedig zijt, en niet veel meer van ons apostelen, die het Woord Gods u eerst gepredikt hebben."},{"catchword":"u alleen gekomen?","tekst":"Dat is, gij gedraagt u zo hoogmoedig, alsof gij alleen alle wijsheid hadt. Een ernstige bestraffing van die hoogmoedige geesten, waarmede ook meteen getoond wordt dat zij geen reden hebben om zich zo te verheffen."}],"37":[{"catchword":"meent een profeet te zijn,","tekst":"Dat is, met de gave van profeteren begaafd is inderdaad, of zulks zich laat voorstaan, en voor zodanig zich uitgeeft."},{"catchword":"geestelijk","tekst":"Dat is, begaafd met enige buitengewone gave des Heiligen Geestes. Of, overvloedig in de Christelijke leer geoefend; 1Co 2:15 , en 1Co 3:1 ; Gal 6:1 ."},{"catchword":"erkenne","tekst":"Dat is, die zal moeten of behoren te erkennen; namelijk indien hij zodanig is als hij zich uitgeeft."},{"catchword":"des Heeren geboden zijn","tekst":"Namelijk Jezus Christus, die als onze Heere macht heeft om ons te gebieden, en wij, Zijne dienstknechten, schuldig zijn te gehoorzamen."}],"38":[{"catchword":"onwetend is,","tekst":"Dat is, moedwillig hetzelve niet wil weten of erkennen."},{"catchword":"die zij onwetend","tekst":"Dat is, alzo hij moedwillig in zijne onwetendheid wil blijven, en zich door mijn schrijven niet laat onderrichten, die mag zulks doen op zijn eigen gevaar; ik wil mij met dezulken niet bemoeien, alzo ik het mijne gedaan heb om hen uit die onwetendheid te brengen. Zie dergelijke manier van spreken Rev 22:11 ."}],"39":[{"catchword":"verhindert niet","tekst":"Dat is, hoewel ik acht dat het profeteren meer stichting voortbrengt in de gemeente dan met vreemde talen te spreken, zo wil ik daarmede het gebruik van vreemde talen niet ten enenmale verworpen of verhinderd hebben, als het maar behoorlijk geschiedt en met uitlegging."}],"40":[{"catchword":"alle dingen","tekst":"Die te doen zijn in de vergaderingen der gemeente, als daar zijn profeteren, of het Woord Gods prediken, de algemene gebeden en dankzeggingen doen, de sacramenten bedienen en dergelijke."},{"catchword":"eerlijk en","tekst":"Of geschikt; zodat het een goede gedaante hebbe, die betamelijk is aan de Christelijke eerbaarheid en eenvoudigheid."},{"catchword":"met orde geschieden","tekst":"Dat is, zonder verwarring, elk op zijn behoorlijken tijd, beurt, plaats, enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Follow after love [Gr. pursue love. This is the conclusion of the former chapter] and be zealous [that is, labour nevertheless for this, that each may excel other therein] for spiritual (gifts) [to obtain extraordinary gifts, which the Holy Ghost then wrought in many. See 1 Cor. 12.ver.1,8.9.10. Although men must be zealous for the ordinary gifts, also] but most that ye may prophecy. [what that is, see Rom. 12.ver.7.10. 1 Cor. 12.10. and the third following.]"}],"2":[{"catchword":null,"tekst":"For he that speaketh a (strange) language, [Gr. with a tongue, as also in the following] speaketh not to men, [that is, he might thereby known to them the thoughts his heart, which is the end whereof speech is used,] but to God, [that is, that God well understandeth it but not men, which is not enough] for no men understandeth (it) [Gr. heareth it; namely, with understanding See Gen. 11.7.] yet with the spirit [that is, with the gift which the holy Ghost hath wrought in him. Or his mind] he speaketh mysteries. [this may be understood either of the mysteries of the Kingdome of heaven, Mat. 13.11. 1 Cor. 4.1. and 13.2. which are more excellent then that they should be held forth without fruit and attention in an unknown tongue. Or that he that speaketh in an unknown tongue doth not otherwise then if he propounded some hidden things, which no man can understand.]"}],"3":[{"catchword":null,"tekst":"But he that prophecieth [that is, he that interprets the writings of the Prophets in an unknown tongue. See ver.1.] speaketh unto men, [that is, speaketh so that men can understand it, and receive benefit by it] edification, and exhortation. [that is, that which may serve for edification or instruction of the ignorant, exhortation of the disorderly and consultation of the sad. Unto these three advantages must all interpretations of Gods word be fitted, Rom. 15.4. 2 Tim. 3.16. And for this course is the gift of prophesying better then that of strange tongues, because that these benefits are not obtained."}],"4":[{"catchword":null,"tekst":"He that speaketh a (strange) tongue he edifieth himself, but he that prophecieth edifieth the Church."}],"5":[{"catchword":null,"tekst":"And I will (indeed) [That is, I would or wished indeed: so far it is from me to have the gift of strange tongues hereby despised] that ye all speak in (strange) tongues, but rather that you should prophecy. For he that prophecyieth is greater [that is, hath a more excellent gift, and more serviceable to the edification of the Church.] then that speaketh (strange) tongues, except that he interprets it, [or, translate it, Namely, into another known tongue, for that the Church can understand it] that the Church may receive edifying."}],"6":[{"catchword":null,"tekst":"And now brethren, if I should come unto you, and should speak (strange) tongues, what should I bring you [Namely, for your edification] if I speak not unto you, either in revelation, or in knowledge, or in prophecy, or in doctrine? [or, spoke not, either by revelation etc. i.e. preached not in you in a known tongue, so that you should be able to understand that I held forth unto you either some revelation of my mysteries, or some knowledge how a man must carry himself in doubtful matters, or some exposition of the writings of the Prophets, or some confirmation of some article of faith.]"}],"7":[{"catchword":null,"tekst":"Even the very liveless things [Gr. soul-less i.e. the instrument of music] which give sound [Gr. voice] whether it be pipe, or harp, if they give no difference with (their) sound, [that is, diversity of tones, but always one kind of tone: which is very unacceptable, and irksome to hear] how shall that be known which is piped [that is, that song or ditty] or played on the harp?"}],"8":[{"catchword":null,"tekst":"For if the Cornet [Or, Trumpet whereby solders are warned or stirred up to battle] give an uncertain sound, [or, unknown, Namely, by which men cannot understand that they are being warned and stirred up to prepare themselves for battle . For there was a certain manner of trumpeting wont be for this purpose which was called classium] who shall prepare himself to the war?"}],"9":[{"catchword":null,"tekst":"Even so ye also, if ye by the language [or, by the tongue] give not a significant speech, [or speak words which men can understand what ye mean thereby] how shall that be understood [namely, by the hearers who understand not the language] which is spoken? For ye shall be as they that speak into the air. [that is, make some noise and cast it out into the air. Which vanisheth there without any profit. See 9.26.]"}],"10":[{"catchword":null,"tekst":"There are, as it falleth out [That is, as according to the condition of times and places in happeneth] so many sorts of voices in the world, [namely, not only among them, who have their several speeches, but also among all sorts of beasts and souls] and none of them is without voice. [that is, without such a sound, that men of one kind of language may thereby understand one another, and that by the noise of the beasts and souls each sort of them may be discerned: so that they have yet some signification, which is not in strange unknown languages.]"}],"11":[{"catchword":null,"tekst":"If therefore I know not the force of the voice, [That is, understand not the meaning of that which is spoken] I shall be barbarious [that is, as a man of an unknown language. The Greeks and Romans called all other nations which did not speak or understand their languages Barbarians. See Acts 28. 2.4. Rom. 1.14. Col. 3.11.] to him that speaketh: and he that speaketh shall be barbarious with me. [Gr. in me.]"}],"12":[{"catchword":null,"tekst":"Even so ye also, seeing ye are zealous [Gr. are zealots of spiritual gifts, i.e. strive for endeavour after this, that ye may have the best spiritual gifts: which is a commendable zeal and strife] after spiritual gifts, [Gr. spirits] seek that ye may be abundant [or, excellent] for edifying of the Church. [that is, that ye may have and use such gifts, whereby the Church must be most edified.]"}],"13":[{"catchword":null,"tekst":"Therefore he that speaketh [That is, can (function bouwHfdnav() {

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
