el","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Wees mijn navolgers, zoals ik ook navolger ben van Christus.","2":"En ik prijs u, broeders, dat u in alles aan mij denkt, en de inzettingen behoudt, zoals ik die u overgegeven heb.","3":"Maar ik wil dat u weet, dat Christus het Hoofd is van iedere man, en de man het hoofd van de vrouw, en God het Hoofd van Christus.","4":"Iedere man die bidt of profeteert met iets op het hoofd, onteert zijn eigen hoofd;","5":"maar iedere vrouw die bidt of profeteert met ongedekt hoofd, onteert haar eigen hoofd; want het is een en hetzelfde, alsof haar het haar afgesneden was.","6":"Want als een vrouw niet gedekt is, laat zij zich dan ook scheren; maar als het lelijk is voor een vrouw om geschoren te zijn, of het haar afgesneden te hebben, laat zij zich dekken.","7":"Want de man moet het hoofd niet dekken, omdat hij het beeld en de heerlijkheid van God is; maar de vrouw is de heerlijkheid van de man.","8":"Want de man is niet uit de vrouw, maar de vrouw is uit de man.","9":"Want de man is ook niet geschapen om de vrouw, maar de vrouw om de man.","10":"Daarom moet de vrouw een macht op het hoofd hebben, omwille van de engelen.","11":"Toch is de man niet zonder de vrouw, en de vrouw niet zonder de man, in de Heere.","12":"Want zoals de vrouw uit de man is, zo is ook de man door de vrouw; maar alle dingen zijn uit God.","13":"Oordeel bij uzelf: is het gepast dat de vrouw ongedekt tot God bidt?","14":"Of leert de natuur zelf u niet, dat als een man lang haar draagt, het hem een oneer is?","15":"Maar als een vrouw lang haar draagt, dat het haar een eer is? Omdat het lange haar haar tot een deksel is gegeven.","16":"Maar als iemand meent twistgierig te moeten zijn: wij hebben zulke gewoonten niet, en de Gemeenten van God ook niet.","17":"Dit nu, wat ik u aanzeg, prijs ik niet, namelijk dat u niet tot beter, maar tot erger samenkomt.","18":"Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;","19":"want er moeten ook afwijkende meningen onder u zijn, opdat degenen die oprecht zijn, openbaar worden onder u.","20":"Als u dan bijeen samenkomt, is dat niet het avondmaal van de Heere eten.","21":"Want bij het eten neemt ieder van tevoren zijn eigen avondmaal; en de een is hongerig, en de ander is dronken.","22":"Hebt u dan geen huizen om te eten en te drinken? Of veracht u de Gemeente van God, en beschaamt u degenen die niets hebben? Wat zal ik u zeggen? Zal ik u prijzen? Hierin prijs ik u niet.","23":"Want ik heb van de Heere ontvangen, wat ik ook u overgegeven heb, dat de Heere Jezus in de nacht waarin Hij verraden werd, het brood nam;","24":"en toen Hij gedankt had, brak Hij het, en zei: Neemt, eet, dit is Mijn lichaam, dat voor u gebroken wordt; doe dat tot Mijn gedachtenis.","25":"Op dezelfde manier nam Hij ook de drinkbeker, na het eten van het avondmaal, en zei: Deze drinkbeker is het Nieuwe Testament in Mijn bloed. Doe dat, zo dikwijls als u die zult drinken, tot Mijn gedachtenis.","26":"Want zo dikwijls als u dit brood eet, en deze drinkbeker drinkt, verkondigt u de dood van de Heere, totdat Hij komt.","27":"Zo dan, wie onwaardig dit brood eet, of de drinkbeker van de Heere drinkt, die zal schuldig zijn aan het lichaam en bloed van de Heere.","28":"Maar laat de mens zichzelf beproeven, en laat hij zo van het brood eten, en van de drinkbeker drinken.","29":"Want wie onwaardig eet en drinkt, die eet en drinkt zichzelf een oordeel, omdat hij het lichaam van de Heere niet onderscheidt.","30":"Daarom zijn er onder u velen zwak en ziek, en velen slapen.","31":"Want als wij onszelf zouden oordelen, zouden wij niet geoordeeld worden.","32":"Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.","33":"Zo dan, mijn broeders, als u samenkomt om te eten, wacht op elkaar.","34":"Maar als iemand honger heeft, laat hij thuis eten, opdat u niet tot een oordeel samenkomt. De overige dingen nu zal ik regelen, wanneer ik gekomen zal zijn."},"SV":{"1":"Weest mijn navolgers, gelijkerwijs ook ik van Christus.","2":"En ik prijs u, broeders, dat gij in alles mijner gedachtig zijt, en de inzettingen behoudt, gelijk ik *die* u overgegeven heb.","3":"Doch ik wil, dat gij weet, dat Christus het Hoofd is eens iegelijken mans, en de man het hoofd der vrouw, en God het Hoofd van Christus.","4":"Een iegelijk man, die bidt of profeteert, hebbende *iets* op het hoofd, die onteert zijn eigen hoofd;","5":"Maar een iegelijke vrouw, die bidt of profeteert met ongedekten hoofde, onteert haar eigen hoofd; want het is een en hetzelfde, alsof *haar* het haar afgesneden ware.","6":"Want indien een vrouw niet gedekt is, dat zij ook geschoren worde; maar indien het lelijk is voor een vrouw geschoren te zijn, of het haar afgesneden te hebben, dat zij zich dekke.","7":"Want de man moet het hoofd niet dekken, overmits hij het beeld en de heerlijkheid Gods is; maar de vrouw is de heerlijkheid des mans.","8":"Want de man is uit de vrouw niet, maar de vrouw is uit den man.","9":"Want ook is de man niet geschapen om de vrouw, maar de vrouw om den man.","10":"Daarom moet de vrouw een macht op het hoofd hebben, om der engelen wil.","11":"Nochtans is noch de man zonder de vrouw, noch de vrouw zonder den man, in den Heere.","12":"Want gelijkerwijs de vrouw uit den man is, alzo is ook de man door de vrouw; doch alle dingen *zijn* uit God.","13":"Oordeelt gij onder uzelven: is het betamelijk, dat de vrouw ongedekt God bidde?","14":"Of leert u ook de natuur zelve niet, dat zo een man lang haar draagt, het hem een oneer is?","15":"Maar zo een vrouw lang haar draagt, dat het haar een eer is; omdat het lange haar voor een deksel haar is gegeven?","16":"Doch indien iemand schijnt twistgierig te zijn, wij hebben zulke gewoonten niet, noch de Gemeenten Gods.","17":"Dit nu, *hetgeen* ik *u* aanzegge, prijs ik niet, *namelijk* dat gij niet tot beter, maar tot erger samenkomt.","18":"Want eerstelijk, als gij samenkomt in de Gemeente, zo hoor ik, dat er scheuringen zijn onder u; en ik geloof het ten dele;","19":"Want er moeten ook ketterijen onder u zijn, opdat degenen, die oprecht zijn, openbaar mogen worden onder u.","20":"Als gij dan bijeen samenkomt, *dat* is niet des Heeren avondmaal eten.","21":"Want in het eten neemt een iegelijk te voren zijn eigen avondmaal; en deze is hongerig, en de andere is dronken.","22":"Hebt gij dan geen huizen, om er te eten en te drinken? Of veracht gij de Gemeente Gods, en beschaamt gij degenen, die niet hebben? Wat zal ik u zeggen? Zal ik u prijzen? In dezen prijs ik *u* niet.","23":"Want ik heb van den Heere ontvangen, hetgeen ik ook u overgegeven heb, dat de Heere Jezus in den nacht, in welken Hij verraden werd, het brood nam;","24":"En als Hij gedankt had, brak Hij het, en zeide: Neemt, eet, dat is Mijn lichaam, dat voor u gebroken wordt; doet dat tot Mijn gedachtenis.","25":"Desgelijks *nam* Hij ook den drinkbeker, na het eten des avondmaals, en zeide: Deze drinkbeker is het Nieuwe Testament in Mijn bloed. Doet dat, zo dikwijls als gij *dien* zult drinken, tot Mijn gedachtenis.","26":"Want zo dikwijls als gij dit brood zult eten, en dezen drinkbeker zult drinken, zo verkondigt den dood des Heeren, totdat Hij komt.","27":"Zo dan, wie onwaardiglijk dit brood eet, of den drinkbeker des Heeren drinkt, die zal schuldig zijn aan het lichaam en bloed des Heeren.","28":"Maar de mens beproeve zichzelven, en ete alzo van het brood, en drinke van den drinkbeker.","29":"Want die onwaardiglijk eet en drinkt, die eet en drinkt zichzelven een oordeel, niet onderscheidende het lichaam des Heeren.","30":"Daarom zijn onder u vele zwakken en kranken, en velen slapen.","31":"Want indien wij onszelven oordeelden, zo zouden wij niet geoordeeld worden.","32":"Maar als wij geoordeeld worden, zo worden wij van den Heere getuchtigd, opdat wij met de wereld niet zouden veroordeeld worden.","33":"Zo dan, mijn broeders, als gij samenkomt om te eten, verwacht elkander.","34":"Doch zo iemand hongert, dat hij te huis ete, opdat gij niet tot een oordeel samenkomt. De overige dingen nu zal ik verordenen, als ik zal gekomen zijn."},"KJV":{"1":"Be ye followers of me, even as I also am of Christ.","2":"Now I praise you, brethren, that ye remember me in all things, and keep the ordinances, as I delivered them to you.","3":"But I would have you know, that the head of every man is Christ; and the head of the woman is the man; and the head of Christ is God.","4":"Every man praying or prophesying, having his head covered, dishonoureth his head.","5":"But every woman that prayeth or prophesieth with her head uncovered dishonoureth her head: for that is even all one as if she were shaven.","6":"For if the woman be ➔ not covered, let her ➔ also be shorn: but if it be a shame for a woman to be shorn or shaven, let her be covered.","7":"For a man indeed ought not to cover his head, forasmuch as he is the image and glory of God: but the woman is the glory of the man.","8":"For the man is not of the woman; but the woman of the man.","9":"Neither was ➔ the man created for the woman; but the woman for the man.","10":"For this cause ought the woman to have power on her head because of the angels.","11":"Nevertheless neither is the man without the woman, neither the woman without the man, in the Lord.","12":"For as the woman is of the man, even so is the man also by the woman; but all things of God.","13":"Judge in yourselves: is it comely that a woman pray unto God uncovered?","14":"Doth not even nature itself teach you, that, if a man have long hair, it is a shame unto him?","15":"But if a woman have long hair, it is a glory to her: for her hair is given her for a covering.","16":"But if any man seem to be contentious, we have no such custom, neither the churches of God.","17":"Now in this that I declare unto you I praise you not, that ye come together not for the better, but for the worse.","18":"For first of all, when ye come together in the church, I hear that there be divisions among you; and I partly believe it.","19":"For there must be also heresies among you, that they which are approved may be made manifest among you.","20":"When ye come together therefore into one place, this is not to eat the Lord's supper.","21":"For in eating every one taketh before other his own supper: and one is hungry, and another is drunken.","22":"What? have ye not houses to eat and to drink in? or despise ye the church of God, and shame them that have not? What shall I say to you? shall I praise you in this? I praise you not.","23":"For I have received of the Lord that which also I delivered unto you, That the Lord Jesus the same night in which he was betrayed took bread:","24":"And when he had given thanks, he brake it, and said, Take, eat: this is my body, which is broken for you: this do in remembrance of me.","25":"After the same manner also he took the cup, when he had supped, saying, This cup is the new testament in my blood: this do ye, as oft as ye drink it, in remembrance of me.","26":"For as often as ye eat this bread, and drink this cup, ye do shew the Lord's death till he come.","27":"Wherefore whosoever shall eat this bread, and drink this cup of the Lord, unworthily, shall be guilty of the body and blood of the Lord.","28":"But let ➔ a man examine himself, and so let him eat of that bread, and drink of that cup.","29":"For he that eateth and drinketh unworthily, eateth and drinketh damnation to himself, not discerning the Lord's body.","30":"For ➔ this cause many are weak and sickly among you, and many sleep.","31":"For if we would judge ourselves, we should not be judged.","32":"But when we are judged, we are chastened of the Lord, that ➔ we should ➔ not be condemned with the world.","33":"Wherefore, my brethren, when ye come together to eat, tarry one for another.","34":"And if any man hunger, let him eat at home; that ➔ ye come ➔ not together unto condemnation. And the rest will I set in order when I come."}},"tsk":{"1":[{"kopje":"Wees","refs":["1 Kor 4:16","1 Kor 10:33","Fil 3:17","1 Tess 1:6","2 Tess 3:9","Hebr 6:12"]},{"kopje":"ook","refs":["Rom 15:2","Rom 15:3","Ef 5:1","Ef 5:2","Fil 2:4","Fil 2:5"]}],"2":[{"kopje":"prijs","refs":["1 Kor 11:17","1 Kor 11:22","Spr 31:28-31"]},{"kopje":"dat","refs":["1 Kor 4:17","1 Kor 15:2"]},{"kopje":"behoudt","refs":["1 Kor 7:17","Luk 1:6","1 Tess 4:1","1 Tess 4:2","2 Tess 2:15","2 Tess 3:6"]}],"3":[{"kopje":"het Hoofd van iedere","refs":["Ef 1:22","Ef 1:23","Ef 4:15","Ef 5:23","Fil 2:10","Fil 2:11","Kol 1:18","Kol 2:10","Kol 2:19"]},{"kopje":"en de man het hoofd van de vrouw","refs":["Gen 3:16","Ef 5:22","Ef 5:24","Kol 3:18","1 Tim 2:11","1 Tim 2:12","1 Petr 3:1","1 Petr 3:5","1 Petr 3:6"]},{"kopje":"en God het Hoofd van Christus","refs":["1 Kor 3:23","1 Kor 15:27","1 Kor 15:28","Jes 49:3-6","Jes 52:13","Jes 55:4","Jes 61:1-4","Matt 28:18","Joh 3:34-36","Joh 5:20-30","Joh 14:28","Joh 17:2-5","Ef 1:20-22","Fil an>","33":"<span class=\"wl wl-kjv\" data-code=\"G5620\">Wherefore,</span> <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G80\">brethren,</span> when ye come <span class=\"wl wl-kjv\" data-code=\"G4905\">together</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">to</span> <span class=\"wl wl-kjv\" data-code=\"G5315\">eat,</span> <span class=\"wl wl-kjv\" data-code=\"G1551\">tarry</span> one for <span class=\"wl wl-kjv\" data-code=\"G240\">another.</span>","34":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> if any <span class=\"wl wl-kjv\" data-code=\"G1536\">man</span> <span class=\"wl wl-kjv\" data-code=\"G3983\">hunger,</span> let him <span class=\"wl wl-kjv\" data-code=\"G2068\">eat</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">at</span> <span class=\"wl wl-kjv\" data-code=\"G3624\">home;</span> <span class=\"wl wl-kjv\" data-code=\"G3363\">that</span> ➔ ye <span class=\"wl wl-kjv\" data-code=\"G4905\">come</span> ➔ <span class=\"wl wl-kjv\" data-code=\"G3363\">not</span> <span class=\"wl wl-kjv\" data-code=\"G4905\">together</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">unto</span> <span class=\"wl wl-kjv\" data-code=\"G2917\">condemnation.</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G3062\">rest</span> will I set in <span class=\"wl wl-kjv\" data-code=\"G1299\">order</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">when</span> I <span class=\"wl wl-kjv\" data-code=\"G2064\">come.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Christus","tekst":"Namelijk navolger ben; namelijk die het volmaaktste voorbeeld is van alle deugden, zodat men de leraars wel moet navolgen, maar zo ver als zij Christus navolgen."}],"2":[{"catchword":"in alles mijner","tekst":"Of, dat gij al mijne dingen, dat is, leringen en vermaningen, gedenkt."},{"catchword":"de inzettingen,","tekst":"Gr. overgevingen, of overleveringen, waardoor dan verstaan worden, gelijk hij zelf daarna verklaart, enige zijner ordinantiën niet die artikelen des geloofs zijn, maar die aangingen de uiterlijke wijze, die in de vergaderingen en het plegen van den godsdienst behoorden gehouden te worden."}],"3":[{"catchword":"dat gij weet","tekst":"Dat is, dat gij let op de orde van onderwerping, die God onder de mensen in Zijn geestelijk lichaam gesteld heeft, opdat gij niet doet wat daartegen strijdt."},{"catchword":"het hoofd is","tekst":"Dat is, over Hem gesteld, heerschappij over Hem hebbende, gelijk het hoofd doet boven en over de andere leden."},{"catchword":"eens iegelijken mans,","tekst":"Namelijk behorende tot Zijn geestelijk lichaam, want van dat wordt hier eigenlijk gehandeld. Niet dat Hij ook niet zou zijn het hoofd der vrouw, want Hij is het hoofd van Zijn gehele lichaam; Eph 5:23 ."},{"catchword":"God het hoofd van","tekst":"Namelijk God de Vader, onder wien de Zoon Gods Jezus Christus staat, niet ten aanzien van Zijn goddelijke natuur, naar welke Hij den Vader in waardigheid en hoogheid even gelijk is, Joh 10:30 ; Phi 2:6 , maar naar Zijn Middelaarsambt, naar hetwelk Hij om onzentwil zichzelven den Vader heeft onderworpen en minder is dan de Vader, Joh 14:28 ; gelijk een gezant onder de mensen als zodanig minder is dan degene die hem zendt, hoewel zij van nature evengelijk zijn."}],"4":[{"catchword":"die bidt of","tekst":"Dat is, het algemeen gebed in de vergaderingen òf voorzegt, òf aanhoort en mede bidt."},{"catchword":"profeteert,","tekst":"Of de Schriften der profeten in de vergaderingen voorleest en uitlegt, 1Co 14:3 , 1Co 14:29 , enz. of enige toekomende dingen voorzegt uit goddelijke openbaring. Want die gave werd toen sommigen van God gegeven tot troost van de gemeente, 1Co 14:26 ; Eph 4:11 ; of die zodanige uitleggingen in de vergaderingen aanhoort."},{"catchword":"iets op het","tekst":"Namelijk enig deksel, als daar is het lang haar, vs.14, of een hoed, sluier, of dergelijke, vs.7, gelijk de heidenen hunne afgoden met gedekte hoofden plachten te dienen. Zie Vergil. Aen. 3, Sueton. in Vitell."},{"catchword":"die onteert","tekst":"Namelijk overmits de ontdekking van het hoofd toen een teken was van macht en heerschappij, gelijk nu hedendaags daarentegen degenen, die macht over anderen hebben, hunne hoofden zullen gedekt houden, en die onder anderen staan voor hen hunne hoofden zullen ontdekken. Doch in dezen allen moet men altijd zien op het gebruik van verscheidene tijden en landen, en wat daarin eerlijk en stichtelijk is; 1Co 14:40 ; Phi 4:8 ."}],"5":[{"catchword":"vrouw, die","tekst":"Namelijk die getrouwd is en onder de macht staat van haren man. Zie vs.3. Hoewel de anderen hier niet uitgesloten worden."},{"catchword":"bidt of","tekst":"Dat is, die in de vergadering de algemene gebeden, of de uitlegging der profetische schriften aanhoort; want dat ene vrouw openlijk in de vergadering de gebeden zou doen, of de Schrift uitleggen, wordt haar verboden; 1Co 14:34-35 ; 1Ti 2:12 , of die met buitengewone gave van bidden of toekomende dingen te voorzeggen, begaafd zijnde, dezelve in de vergadering zal willen voorstellen, daartoe door een goddelijk ingeven gedreven zijnde. Zie Joe 2:28 ; Luk 2:36 ; Act 21:9 ."},{"catchword":"onteert haar","tekst":"Of, beschaamt haar hoofd, doet haar hoofd schande aan; namelijk omdat zij door dat teken schijnt te willen ontkennen, dat zij onder den man staat; en ook enigszins dat Christus niet zou zijn het hoofd Zijner gemeente. Zie vs.4."},{"catchword":"een en hetzelfde","tekst":"Dat is, van enerlei onbetamelijkheid, namelijk als zij het deksel aflegt, dat gemaakt wordt, dat is, zoveel als zij het natuurlijke deksel aflegde."}],"6":[{"catchword":"dat zij ook geschoren","tekst":"Dat is, het is evenveel en even schandelijk, alsof zij geschoren ware."},{"catchword":"geschoren te zijn","tekst":"Namelijk met de schaar."},{"catchword":"afgesneden te","tekst":"Namelijk met het scheermes."}],"7":[{"catchword":"het beeld en","tekst":"Namelijk ten aanzien van zijne macht en heerschappij, die hij heeft over de vrouw. Want anderszins, ten aanzien van de heiligheid en gerechtigheid, is de vrouw zoveel naar het beeld van God geschapen als de man; Gen 1:26-27 ."},{"catchword":"heerlijkheid Gods","tekst":"Namelijk omdat God in des mans heerschappij over de vrouw, de heerlijkheid en het gebied doet blijken, dat Hij heeft over Zijne schepselen."},{"catchword":"de heerlijkheid des mans","tekst":"Namelijk omdat de onderdanigheid der vrouw onder den man een bewijs is van de macht, het gezag en de uitnemendheid des mans boven de vrouw."}],"8":[{"catchword":"uit de vrouw niet,","tekst":"Namelijk eerstmaal van God geschapen. Zie Gen 2:21-22 . Anderszins worden de mannen nu naar den loop der natuur van vrouwen geboren; Job 14:1 . Zie ook vs.12."}],"9":[{"catchword":"om de vrouw,","tekst":"Namelijk om haar onderworpen te zijn en alzo te dienen."},{"catchword":"om den man","tekst":"Namelijk om hem tot zijn dienst onderworpen te zijn, en ene hulp te wezen, die bij hem zou zijn; Gen 2:18 ."}],"10":[{"catchword":"ene macht op het","tekst":"Dat is, een deksel, tot een teken dat zij staat onder de macht en het gebied van den man. Zie Gen 24:65 ; een wijze van spreken, waardoor het teken toegeschreven wordt de naam van de betekende zaak, hetwelk in de sacramenten ook zeer gebruikelijk is."},{"catchword":"om der engelen wil","tekst":"Dit verstaan sommigen van de leraars der gemeente, die in de Schrift ook engelen, dat is, boden of gezanten Gods genaamd worden, Mal 2:7 ; Rev 1:20 . Doch kan bekwamelijker verstaan worden van de dienstbare geesten, die vanwege hun ambt eigenlijk engelen doorgaans genaamd worden. Want dewijl dezelve in de vergaderingen der gelovigen tegenwoordig zijn, Psa 34:8 , en Mat 18:10 , en door onordelijkheid of ongeschiktheid, die daar zou mogen gepleegd worden, bedroefd worden, zo vermaant de apostel de vrouwen, dat zij deze heilige geesten ook behoren te ontzien, om hen hierin niet te bedroeven."}],"11":[{"catchword":"Nochtans is noch","tekst":"Dit doet de apostel daarbij, opdat om dezer heerschappij wil noch de mannen zich verhovaardigen, noch de vrouwen zich bedroeven zouden."},{"catchword":"in den Heere","tekst":"Namelijk Jezus Christus, aan wien, ten aanzien van Zijne genade en verdiensten, de vrouwen zowel gemeenschap hebben als de mannen. Zie Gal 3:28 ."}],"12":[{"catchword":"uit den man is,","tekst":"Zie vs.8."},{"catchword":"door de vrouw;","tekst":"Namelijk overmits hij van ene vrouw ontvangen en geboren wordt, naar de natuurlijke geboorte. Waarom hij de vrouw ook niet behoort te verachten, maar in ere te houden en lief te hebben, hoewel hij over haar heerschappij heeft."},{"catchword":"alle dingen zijn","tekst":"Dat is, zowel de vrouw als de man, zijn beiden van God geschapen; en zowel de onderdanigheid der vrouw, als de heerschappij des mans zijn beide van God geordineerd. Anderszins is het ook in het algemeen waar, dat alle schepselen van God zijn. Zie Rom 11:36 ; 1Co 8:6 ."}],"13":[{"catchword":"Oordeelt gij onder","tekst":"Of, oordeelt bij uzelven. Gr. in uzelven. De apostel wil tonen dat deze zaak, die hij hier drijft, zo klaar en bekend is dat hij de Corinthiërs zelf tot rechters daarvan wel wil stellen; gelijk 1Co 10:15 ."}],"14":[{"catchword":"de natuur zelve","tekst":"Namelijk die onder anderen het vrouwelijk geslacht van het mannelijke daarmede ook onderscheiden heeft, dat de vrouwen het haar van het hoofd langer en dichter wast dan den mannen, en dat het haar dient tot een sieraard en deksel."},{"catchword":"hem een oneer is?","tekst":"Namelijk omdat dit lange haar op zijn hoofd als een deksel is, en een teken van onderdanigheid, daar hij het hoofd is der vrouw, en daarom zulk een teken niet behoort te dragen, waarmede hij zijne heerschappij schijnt te verzaken. Daar benevens, omdat hij zich alzo gelijk als herschept in ene vrouw, dragende een sieraad, dat de vrouwen eigen is, en alzo gelijk als zijn geslacht verzaakt, hetwelk God in de wet verbiedt; Deu 22:5 ."}],"15":[{"catchword":"een deksel haar is","tekst":"Gr. een omwerpsel; namelijk om haar te dienen tot een deksel, en volgens dien ook tot een teken van onderdanigheid, hetwelk dan eer voor haar is, dat zij dezelve hare onderdanigheid, volgens de ordinantie Gods, daarmede bekent."}],"16":[{"catchword":"twistgierig te zijn,","tekst":"Of, twist lief te hebben; dat is, die tegen deze zaak en redenen nog veel zou willen twisten, met hem willen wij niet verder twisten."},{"catchword":"zulke gewoonte niet,","tekst":"Namelijk om te twisten over zaken, die zo klaar en bekend zijn."},{"catchword":"De gemeenten Gods","tekst":"Welker voorbeeld of gebruik in zulke zaken men heilig behoort te volgen."}],"17":[{"catchword":"Dit nu, hetgeen","tekst":"Namelijk hetgeen volgt."},{"catchword":"aanzeg, prijs","tekst":"Of, verhaal, vermeld, verkondig."},{"catchword":"tot beter, maar","tekst":"Dat is, niet tot verbetering, maar tot verergering. Want de vergaderingen worden daartoe aangesteld, opdat de gelovigen in dezelve gesticht en gebeterd worden; hetwelk niet geschiedt, wanneer in dezelve ongeschiktheden worden gepleegd."}],"18":[{"catchword":"in de gemeente,","tekst":"Dat is, in de vergadering der gelovigen, die toen nog niet werden gehouden in kerken, alzo de Christenen toen nog geen kerken hadden gelijk nu, maar in huizen en andere gelegen plaatsen."},{"catchword":"zo hoor ik dat","tekst":"Van wien hij het gehoord had, verklaart hij 1Co 1:11 ."},{"catchword":"scheuringen zijn onder","tekst":"Scheuring is, wanneer onder de lidmaten van ene gemeente, in het stuk der leer en in de gronden derzelve eens zijnde, om andere misverstanden, onenigheid en verdeeldheid ontstaat, elke partij zijn hoofd en leidsman volgende, waardoor de enigheid des lichaams van Christus gescheurd en verbroken wordt; hetwelk onder de werken des vleesches mede geteld wordt; Gal 5:20 . Zie breder hiervan 1Co 1:12 ."},{"catchword":"ik geloof het ten","tekst":"Namelijk dewijl ik sommiger, die onder u zijn, opgeblazenheid en twistgierigheid ken."}],"19":[{"catchword":"moeten ook","tekst":"Namelijk overmits de oorzaken van ketterijen daar altijd zullen zijn, als opgeblazenheid, vermetelheid, eergierigheid en stoutheid van sommige mensen, die daardoor aangedreven worden om ketterijen te verwekken en aan te hangen. Zolang er zulke mensen zullen zijn, zo moeten er ook ketterijen wezen. Zie dergelijke wijze van spreken en nadere verklaring daarvan Mat 18:7 ."},{"catchword":"ketterijen","tekst":"Ketterij is een twist, ontstaande over de leer, wanneer sommigen enige dwalingen hardnekkiglijk drijven of aannemen, strijdende tegen de grondstukken der zaligmakende leer. Zodat ketterij erger en schadelijker is dan scheuring. En hiermede geeft de apostel reden, waarom hij gelooft dat er onder hen scheuringen zijn, omdat er ook nog erger kwaad onder hen gevonden werd, namelijk ketterij, die hij daarna beschrijft en wederlegt; 1Co 15 ."},{"catchword":"onder u zijn,","tekst":"Dat is, in het midden van de gemeente. Zie Act 20:30 ; 1Jo 2:19 ."},{"catchword":"die oprecht zijn,","tekst":"Gr. die beproefd zijn; dat is, die in de beproeving door scheuringen en ketterijen standvastig blijven bij de enigheid der gemeente en bij de gezonde leer, en alzo oprecht bevonden worden; ene gelijkenis, genomen van goud, dat in de proef door het vuur bestaat; 1Pe 1:7 ."},{"catchword":"openbaar mogen","tekst":"Dat is, bekend dat zij oprecht zijn. Wanneer de gemeente in vrede is, zonder scheuring of ketterij, zo worden allen, die den godsdienst belijden, voor oprecht gehouden; maar als er scheuring en ketterij ontstaat, zo wordt het openbaar en bekend, wie bij de enigheid der kerk en bij de gezondheid der leer standvastig blijven of niet, gelijk het kaf van het koren door den wan gescheiden wordt; Mat 3:12 ."}],"20":[{"catchword":"dat","tekst":"Namelijk hetgeen gij doet."},{"catchword":"is niet des","tekst":"Namelijk overmits het onwettelijk eten is als niet eten. Of, overmits zulks niet is des Heeren, maar zijn eigen Avondmaal eten, gelijk in vs.21."}],"21":[{"catchword":"in het eten neemt","tekst":"Dit wordt verstaan van het eten van enige spijs, die de rijken medebrachten als men het Avondmaal des Heeren zou houden, om daarna met de armen een maaltijd te houden; welke maaltijden in het Grieks genaamd worden Agapai; dat is maaltijden van liefde. Zie hiervan Jud 1:12 ."},{"catchword":"een iegelijk","tekst":"Namelijk van de rijken, zonder de armen te verwachten. Of, een iegelijk met degenen, die het met hen hielden."},{"catchword":"te voren","tekst":"Namelijk eer de armen daarbij zijn gekomen. Of, eer het Avondmaal des Heeren gehouden wordt."},{"catchword":"zijn eigen Avondmaal;","tekst":"Dat is, een Avondmaal, dat niet in het algemeen van de gehele gemeente gehouden wordt, gelijk des Heeren Avondmaal gehouden moet worden, maar dan van enigen alleen met uitsluiting van anderen in het bijzonder wordt gehouden."},{"catchword":"deze is hongerig","tekst":"Dat is, de armen zijn hongerig, omdat men hen niet wil verwachten, en de rijken zijn dronken, omdat zij bij elkander op die maaltijden dikwijls tevoren zo toefden, dat zij beschonken werden."}],"22":[{"catchword":"geen huizen,","tekst":"In welke gij tevoren kunt eten en uwen honger stillen, zonder dat gij zulks openlijk in de plaatsen der vergaderingen doet. Zie vs.34."},{"catchword":"veracht gij de","tekst":"Dat is, past gij niet op de ergernissen, die daardoor in de gemeente ontstaan?"},{"catchword":"beschaamt gij","tekst":"Dat is, de armen, die tot zulke maaltijden niet konden toebrengen, die gij òf niet wilt toelaten tot dezelve, òf niet wilt verwachten, en alzo openlijk betoont hen te verachten."},{"catchword":"In dezen prijs ik","tekst":"Dat is, in deze misbruiken des Avondmaals kan ik u geen gelijk geven; of prijzen als wel gedaan."}],"23":[{"catchword":"Want ik heb","tekst":"De apostel, om deze misbruiken te beteren, houdt hun voor de instelling des Heilig Avondmaals, zoals hetzelve van Christus eerst is ingesteld; hetwelk de beste en zekerste wijze is om misbruiken te beteren en weg te nemen, alzo alles naar de instelling Gods en Christus in den godsdienst moet gericht worden."},{"catchword":"van den Heere","tekst":"Namelijk en niet van mensen; Gal 1:12 . Dit is geschied door openbaringen, die de Heere Christus zelf aan Paulus dikwijls gedaan heeft."},{"catchword":"overgegeven heb,","tekst":"Of, overgeleverd; dat is, getrouwelijk heb geleerd, niet als mijne leer, maar des Heeren Christus zelven."},{"catchword":"dat de Heere Jezus","tekst":"De verklaring van deze volgende instelling des Avondmaals, zie Mat 26:26 , enz."}],"25":[{"catchword":"Testament in mijn","tekst":"Of, verbond, Exo 24:8 . Dat is, een teken en zegel des Nieuwen Testaments of verbonds. Want de beker is het verbond zelf niet, maar een teken en zegel daarvan."}],"26":[{"catchword":"dit brood zult","tekst":"Het is dan brood, dat in het Avondmaal gegeten wordt."},{"catchword":"drinkbeker zult","tekst":"Dat is, den wijn die in den drinkbeker is: een oneigenlijke wijze van spreken."},{"catchword":"zo verkondigt den","tekst":"De dood des Heeren moet in het Avondmaal verkondigd worden, zo van de dienaars des Woords, die bij de bediening het volk moeten onderwijzen, dat dit gebroken brood en deze wijn een teken en verzegeling is van den bitteren dood van Christus aan het kruis, en van de weldaden daardoor voor ons verkregen, alsook van degenen, die het genieten, die in hun hart moeten overdenken, geloven en met dankzegging belijden, dat de Heere Christus voor hen is gestorven om hen van den eeuwigen dood te verlossen en zalig te maken, hetwelk alles door de woorden: Doet dit tot mijne gedachtenis, vs.25, te kennen gegeven is."},{"catchword":"totdat Hij komt","tekst":"Namelijk om te oordelen des levenden en de doden; want gelijk de sacramenten des Ouden Testaments duurden tot op de eerste toekomst van Christus in het vlees, zo zullen de sacramenten des Nieuwen Testaments duren tot zijn tweede komst in heerlijkheid."}],"27":[{"catchword":"onwaardiglijk dit brood","tekst":"Dat geschiedt wanneer de personen niet recht gesteld zijn, die ten Avondmaal gaan, zijnde òf openbare ergerlijke mensen, die ook daarvan moeten geweerd zijn, òf bedekte huichelaars, en in twist staande met hunnen naaste, en met haat, nijd, gierigheid en ongerechtigheid beladen, òf ook wanneer de gelovigen zelf zich daartoe niet behoorlijk hebben bereid, òf met behoorlijke aandacht het niet nuttigen."},{"catchword":"zal schuldig zijn aan","tekst":"Namelijk omdat hij het teken des lichaams en bloeds van Christus door zulke misbruiken smaadheid aandoet. Want de smaadheid, die men des konings zegel aandoet, wordt gehouden alsof zij den koning zelf aangedaan ware."}],"28":[{"catchword":"beproeve zichzelven,","tekst":"Dat is, onderzoeke zijn gemoed en conscientie, of hij ook in zijn hart gevoelt een recht leedwezen en droefheid over zijne zonden, alsook een vast geloof en vertrouwen op de verdiensten van Jezus Christus, en daarenboven een ongeveinsd voornemen om de zonden meer en meer af te sterven, en in een nieuw godzalig leven voor God te wandelen. Zie Gen 17:1 ; 2Co 13:5 ."},{"catchword":"ete alzo","tekst":"Namelijk nadat hij zichzelven terecht zal beproefd en alzo bevonden hebben."},{"catchword":"van het brood","tekst":"Gr. uit."},{"catchword":"van den drinkbeker","tekst":"Gr. uit."}],"29":[{"catchword":"een oordeel,","tekst":"Dat is, ene schuld of straf. Zie Mat 23:14 ; Luk 23:40 ; Rom 2:3 , en Rom 5:16 , en Rom 13:2 ; Jam 3:1 . Hetwelk verstaan wordt, òf van de eeuwige straffen ten aanzien van de huichelaars; òf van de tijdelijke kastijdingen ten aanzien van de gelovigen, het Avondmaal niet waardiglijk gebruikende, gelijk hierna verklaard wordt vs.30."},{"catchword":"niet onderscheidende het","tekst":"Dat is, dewijl hij geen onderscheid maakt tussen het brood des Avondmaals, hetwelk een heilig teken is van des Heeren lichaam, en tussen algemene spijs; en alzo zonder beproeving en eerbiedigheid hetzelve eet, gelijk ander algemeen brood."}],"30":[{"catchword":"Daarom zijn onder","tekst":"Dat is, om dit misbruik des heiligen Avondmaals."},{"catchword":"slapen","tekst":"Dat is, zijn alrede gestorven. Zie Mat 9:24 , en Mat 27:52 ; Joh 11:11 ; 1Co 7:39 , en 1Co 15:6 , 1Co 15:18 ; 1Th 4:13 ."}],"31":[{"catchword":"oordeelden, zo zouden","tekst":"Of, onderscheiden; dat is, na een goede en ernstige beproeving van onszelven, recht oordeelden hoe het met ons gesteld is, of wij waardiglijk aan de tafel des Heeren mogen gaan of niet; en zo wij ons bevinden onwaardig, dat wij ons onthouden van die heilige spijs, totdat wij ons leven zullen gebeterd hebben."},{"catchword":"geoordeeld worden","tekst":"Dat is, gestraft of gekastijd van den Heere met zodanige plagen, als tevoren verhaald zijn vs.30."}],"32":[{"catchword":"Maar als wij","tekst":"Deze troost doet de apostel daarbij, opdat de gelovigen door de hardheid van de voorgaande bestraffingen niet te zeer zouden verslagen worden. De troost bestaat in twee delen: Eerstelijk, dat zulke plagen geen straffen eigenlijk zijn, maar vaderlijke kastijdingen of tuchtigingen; ten tweede, dat zij tot een goed einde van God toegezonden worden, namelijk tot onze zaligheid, opdat wij daardoor tot ware bekering gebracht worden en met de goddelozen niet verdoemd worden."}],"33":[{"catchword":"om te eten,","tekst":"Namelijk het Avondmaal des Heeren, of ook om daarna te houden de maaltijden der liefde, in welke de rijken de armen niet verwachtten, uit verachting derzelven."},{"catchword":"verwacht elkander","tekst":"Namelijk totdat gij alle bijeengekomen zijt; of dat de ene wacht totdat de ander aan de tafel zal geweest zijn, om niet ongeschikt elkander te verdringen."}],"34":[{"catchword":"dat hij tehuis ete,","tekst":"Dat is, zo iemand zolang niet kan vasten, totdat het Avondmaal des Heeren is gehouden, dat hij liever in zijn huis zich ontnuchtere, eer hij in de vergadering komt en aan de tafel des Heeren gaat."},{"catchword":"tot een oordeel","tekst":"Dat is, met onordelijkheid en ongeschiktheid u ene straf op den hals haalt. Zie vs.29."},{"catchword":"De overige dingen","tekst":"Namelijk aangaande de goede orde, die in het plegen van den uiterlijken godsdienst in uwe vergaderingen moet onderhouden worden; want daarvan spreekt hij hier, en niet van zaken die de leer of zeden aangaan, gelijk het woord ordineren, hetwelk hij hier gebruikt, ook medebrengt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Be imitators of me, even as I also of Christ. [Namely, am an imitator, namely, who is the most perfect pattern of all virtues; so that men indeed must imitate their teachers, but so far forth as they imitate Christ,]"}],"2":[{"catchword":null,"tekst":"And I praise you brethren that ye are mindful of me in all things, [Or that ye remember all my things, i.e. doctrines and exhortations] and keep the institutions [Gr. Traditions, or delivering-over, whereby then are understood as he himself afterward declares, some ordinances of his, not which are articles of faith, but which concerned the outward form which ought to be observed in the assemblies, and exercises of God&acirc;&euro;&trade;s worship] as I delivered (them) over unto you."}],"3":[{"catchword":null,"tekst":"But I will that ye should know, [That is, that ye mark the order of subjection which God hath appointed amongst men, in his spiritual body, that ye may do nothing repugnant to the same] that Christ is the head [that is, set over him, having dominion over him, as the head is above and over the members] of every man: [namely, belonging to his spiritual body: for of those he properly treats here. Not that he is not also the head of the woman, for he is the head of the whole body, Eph. 5. 23.] and the man the head of the woman: and God the head of Christ. [namely, God the Father, under whom the Son of God Jesus Christ stands, not in respect of his divine nature, according to which is equal to the Father in dignity and highness, John 10. 30. Phil. 2. 6. but in respect of his mediator-ship, according to which he hath subjected himself to the Father for our sakes, and is less than the Father, John 14. 28. as an Ambassador amongst men, as such, is less than him that sends him: although by nature they are equal.]"}],"4":[{"catchword":null,"tekst":"Every man that prayeth [That is, that either makes the public prayer in the assemblies, or heareth and joins in prayer] or prophecyeth [ or readeth and expoundeth the writings of the Prophets in the assemblies, 1. Cor. 14. v. 3, 29. & c. or foretells some future things by divine revelation. For that gift was then given by God to some for the comfort of the church, 1 Cor. 14. 26. Eph. 4. 11. Or he that heareth such expositions in the congregations] having (ought) on his head [namely, any covering, as is long hair, v. 14. or a hat, veil or the like, v. 7. as the Gentiles used to worship their Idols with covered heads. See Virgil. Aneid. 3. Sueton. In Vitell.] he dishonours his head. [namely, forasmuch as the uncovering of the head was then a sign of power and dominion, as on the contrary now at this day those that have power over others, will keep their heads covered, and they that are under others will uncover their heads before them. But in all these things, we must always have respect to the use of divers times and countries and what is honourable and edifying therein, 1 Cor. 14. 40. Phil. 4. 8.]"}],"5":[{"catchword":null,"tekst":"But every woman, [Namely, which is married and is subject to the power of her husband. See v. 3. although the rest are not here excluded] which prayeth or prophecyeth [that is, which in the assembly heareth the public prayers, or the exposition of the writings of the Prophets: For that a woman should make prayers openly in the assembly, or expound the Scripture is forbidden her, 1 Cor. 14. v, 34, 35, 1 Tim. 2. 12. Or who being endued with extraordinary gifts of prayer or foretelling things future, will propound them in the congregation, being moved thereunto by divine inspiration. See Joel 2. 28. Luke 2. 36. Acts 21. 9.] with an uncovered head, dishonoureth her head; [or shameth her head, causeth shame to her head, namely, because by that sign it seemeth she would deny that she is subject to her husband: and also in some sort that Christ is not the head of his church. See v. 4.] for it is one and the same [namely, of all one unseemliness, namely, if she lay aside the artificial covering, it is as much as if they should lay aside the natural covering] as if (her) hair were cut off."}],"6":[{"catchword":null,"tekst":"For if a woman be not covered, let her also be shorn: [That is, it is even as much, and even as shameful as if she were shorn] but if it be ugly for a woman to be shorn [namely, with sheers] or to have her hair cut off, [namely, with a razor] let her cover herself."}],"7":[{"catchword":null,"tekst":"For the man must not cover his head, forasmuch as he is the image, [Namely, in respect of his power and dominion which he hath over the woman. For otherwise in respect of holiness and righteousness the woman was created after the image of God as well as the man; Gen. 1. 26, 27.] and glory of God: [namely, because in the mans dominion over the woman, God makes appear the glory and command that he hath over his creatures] but the woman is the glory of the man. [namely, because the womans subjection under man is an argument of the power, authority and excellency of man above the woman.]"}],"8":[{"catchword":null,"tekst":"For the man is not of the woman, [Namely, at first created by God. See Gen. 2.21,22. Otherwise now according to the course of nature, are born of women, Job. 14.1. See also the 12 verse] but the woman of the man."}],"9":[{"catchword":null,"tekst":"For neither was the man created for the woman, [Namely, to be subject to her and serve to her] but the woman of the man. [namely, to be subject to him for his service, and to be a help which should be with him, Gen. 2 18.]"}],"10":[{"catchword":null,"tekst":"Therefore must the woman have a power on her head [That is, a covering, for a sign that she is subject to the power and command of the man. See Gen. 24.65. A phrase whereby the name of the thing signified is ascribed to the sign, which is also very usual in the Sacraments] because of the Angels. [this some understood of the teachers of the church, which in the Scripture are also called Angels, i.e. messengers, or Ambassadors of God, Mal. 2.7. Rev. 1.20. But many more fitly be understood of the ministering spirits, who by reason of their office are very where properly called Angels. For seeing they are present in the assembles of the faithful, Psalm. 34.8 and Mat. 18.10. and are grieved by all disorderliness or indecency which might be practiced there, therefore the apostle admonisheth the women that they ought also to reverence these holy spirits, that they may not grieve them herein.]"}],"11":[{"catchword":null,"tekst":"Nevertheless either is the man without the woman, nor woman without the man [This Apostle adds, that because of this dominion, neither the men might wax proud, or the women be grieved] in the Lord. [namely, Jesus Christ with who in respect of his grace and merits, the women have communion as well as the men. See Gal. 3.28.]"}],"12":[{"catchword":null,"tekst":"For as woman is of the man, [See v.8.] so also is the man by the woman, [namely, for as much as he conceived and born of a woman according to the natural birth. Wherefore also he ought not to despise the woman, but to have her in honour, and love her, although he have dominion over her] but all things (are) of God. [that is, as the women as the men are both created by God: and as well the subject of the wife as the wife as the dominion of the man, are both ordained of God. Otherwise it is true also in general, that all creatures are of God. See Rom. 11.v.36. 1 Cor. 8.6.]"}],"13":[{"catchword":null,"tekst":"judge ye among your selves: Or judge ye with your selves. Gr. In your selves. The Apostle will show that this thing which he here presseth is so clear and known, that he will even make the Corinthians themselves judge thereof, as 1 Cor. 10.15.] is it comely that a woman pray to God uncovered?"}],"14":[{"catchword":null,"tekst":"Or doth not even nature itself teach you, [Namely, which amongst other things hath also thereby, distinguished the female sex from male, that the hair of women grows longer and closer then men, and that the same serves her for an ornament and covering] that if a man wear a long hair, it is a dishonour to him? [namely, because this long hair on his head is a covering, and a sign of subjection, whereas he is the head of the woman; and therefore ought not to wear such a sign, whereby he seemeth to deny his dominion. Withal all because so he doth as it were transfer himself into a woman, wearing an ornament which is proper to women, and so as it were denies his sex, which God forbade in the law, Deu. 22.5.]"}],"15":[{"catchword":null,"tekst":"But if a woman wear long hair that it is an dishonour to her? Because the long hair is given her for covering. [Gr. A thing to cast about. Namely, to serve her for covering, and consequently also for a sign of subjection, which therefore is an honour for her, that she thereby acknowledgeth that her subjection is according to the ordinance of God.]"}],"16":[{"catchword":null,"tekst":"But if any man seems to be desirous of contention, [or to love the strive i.e. who would yet dispute much against this thing and reasons, we will not contend any further with him] we have not such a custom [namely, to contend about things which are so clear and notorious] nor the churches of God. [whose example of custom in such things ought in equity to be followed.]"}],"17":[{"catchword":null,"tekst":"Now is [Namely, that which followeth] (that which) I say unto you) [or, relate, mention, declare] I praise not, (namely) that ye come together, not for the better, but for the worse. [that is, not for bettering, but for making you worse. For assembles appointed for this purpose, that believers may therein be edified and bettered: which is not don when things unseemingly are practiced in them.]"}],"18":[{"catchword":null,"tekst":"For first when ye come together in the Church [That is, in the assembles of the faithful, which then were not yet kept in the Churches, as they have now, but in house and other convenient places] I hear [of whom he had heard it declareth, 1 Cor. 1.11.] that they are schisms among you: [schism is, when amongst the members of one Church, being one in point of doctrine, and in the grounds of the same, disunion and division ariseth because of other misunderstandings, each party following his head and leader, whereby the unity of Christ&acirc;&euro;&trade;s body is rent and broken: which is also numbered amongst the works of the flesh, Gal. 5.20. see more largely hereafter, 1 Cor. 1.10.] and I believe in part. [namely, seeing I know the pride and contentiousness of some among you.]"}],"19":[{"catchword":null,"tekst":"For there must also [Namely, forasmuch as there shall always be the course of heresies, as pride, arrogance, ambition and boldness of some men, who are thereby carried on to raise up and adhere to heresies. So long as there shall be such men, there must be heresies. See the like phrase, and further exposition thereof, Mat. 18.7.] be heresies, [herein, is a contention arising about doctrine, when any stifneckedly urge and embrace any errors, repugnant to the fundamentals of saving the doctrine. So that heresies is worse and more harmful then schism. And thereby the Apostle gives the reason why he believes that there are schisms among them, because there was also yet evil found amongst them, namely, heresy, which he after describes and confutes, 1 Cor. 15.] among. [that is, in the midst of the Church. See Act 20:30. 1Jn 2:19.] that those that are sincere [Gr. They that are approved, i.e. they that are in the trial by schisms and heresies, continue in the unity of the Church, and in sound doctrine, and so are found to be sincere: a similitude taken from gold that in the trial by fire abides, 1 Pet. 1.ver.7.] may be made manifest among you. [that is, known to be upright. When the Church is in peace without schism or heresy, all the profess Religion are accounted upright: but when there ariseth schism and heresy, then it is manifest and notorious who abide steadfast in the unity of the Church, and in the soundness of the doctrine or not: as the chaffer is separated from the corn by the fan, Mat 3:12.]"}],"20":[{"catchword":null,"tekst":"When therefore ye come together in one, (that) [Namely, that which ye do] is not to eat the Lords Supper. [namely, forasmuch as unlawful eating, is as not eating. Or, forasmuch as this is not to eat the Lords; but our own supper, as in the following verse.]"}],"21":[{"catchword":null,"tekst":"For in eating [This is to be understood of eating of some meat which the rich brought with them when the Lords supper was to be held, to keep a feast therewith afterwards with the poor, which feasts in the Greek were called Agapai, i.e. love-feast. See hereof, Jud. Ver.12.] every one [namely, of the rich without of the poor. Or every one with those that held with them] taketh before [namely, before the poor are come to them. Or before the Lords supper is held] his own supper. [that is, a supper which is not held in common of the whole Church; as the Lords supper must be held, but which is held privately by some alone, with excluding of others] and this man is hungry, because they will not wait for them, and the rich are drunk, because they oftentimes so entertained one another before at those feasts, that they were drunk.]"}],"22":[{"catchword":null,"tekst":"Have ye therefore no house [In ye can eat before; and assuage your hunger, without doing this openly in the places of assembles. See ver. 34] to eat and drink there? Or despise ye the Church of God [that is, do ye not care of the offences which thereby arise in the Church?] and do ye shame them who have not? [that is, the poor who could bring nothing to such feasts, which either ye will not admit to the same, or will not for them, or so openly show that ye despise them] what shall I say to you? In this I praise (you) not. [that is, in these abuses of the Lords supper I cannot justify you, or praise you as having done well."}],"23":[{"catchword":null,"tekst":"For I have [The Apostle to amend these abuses, sets them the institution of the holy supper, as the same was the first instituted by Christ: which is the best and surest way to reform and remove abuses, seeing all things in Gods worship must be ordered according to Gods and Christ&acirc;&euro;&trade;s institution] received of the Lord [namely, and not of the men, Gal. 1.12. This was done by relations, which the Lord Christ himself often made to Paul] that which I also gave over unto you, [or, delivered over. That is, faithfully taught, not as my doctrine but as the Lord Christ&acirc;&euro;&trade;s himself] that the Lord Jesus in the night in which he was betrayed took bread: [the exposition of this following institution of the Lords Supper. See Mat. 26.26. etc.]"}],"24":[{"catchword":null,"tekst":"And when he had given thanks, he brake it, and said, take ye, that is my body, which is broken for you: do that for remembrance of me."}],"25":[{"catchword":null,"tekst":"In like manner he (took) also the cup, after the eating of supper, and said, this cup is the New Testament [Or, Covenant, Exod. 24.8. i.e. a sign and seal of the New Testament or Covenant. For the cup is not the covenant it self, but a sign and seal thereof] in my blood. Do that as often as ye shall drink (it) for remembrance of me."}],"26":[{"catchword":null,"tekst":"For as often as you shall eat this bread, [It is bread then which is eaten in the Lords supper] and shall drink this cup, [that is, the wine which is in the cup, an improper phrase] ye declare the death of the Lord, [the death of the Lord must be declared in the Lords Supper, as well by the ministers of the word, who by the administration must instruct the people, that this broken bread, and this wine, is a sign and sealing of the bitter death of Christ on the cross, and of the benefits procured for us thereby; as also by those that receive the same, who in their hearts must consider, believe, and with thanksgiving confess, that the Lord Christ died for them, to redeem them from eternal death, and save them; all which is given to understand by the words do this for remembrance of me, ver, 25.] until he come. [namely, to judge the quick and the dead: for as the Sacraments of the old Testament endured until the first coming of Christ in the flesh, so shall the Sacraments of the Testament endure until his second coming in glory.]"}],"27":[{"catchword":null,"tekst":"So then whose unworthily eateth this bread, or drinketh the cup of the Lord, [That comes to pass when the persons are not rightly disposed who go to the Lords Supper, being either publicly scandalous persons, which must also be kept from it, or close hypocrites, and standing in the strife with their neighbours, and laden with hatred, envy, covetousness, and unrighteousness: or else when the faithful themselves have not duly prepared themselves thereunto, or do not receive the same with due consideration] he shall be guilty of the body and blood of the Lord. [namely, because by such abuses he offers contempt to the sign of the body and blood of Christ. For the contempt which is offered to the Kings seal, is accounted as if were done to the King himself.]"}],"28":[{"catchword":null,"tekst":"But let a man proves himself, [that is, search his mind and conscience, whether he feel in his heart a true sorrow and grief for sins, as also a firm faith and confidence in the merits of Jesus Christ, and moreover an unstained purpose to dye in sins more and more. And to walk before God in new godly life. See Gen. 17.1. 2 Cor. 13.5.] and so let him eat [namely, after that he shall duly have proved, and so found himself of [Gr. Out of] the bread, and drink of [Gr. Out of ] the cup."}],"29":[{"catchword":null,"tekst":"For he that eateth and drinketh unworthily, he eateth and drinketh judgement [that is, guilt or punishment. See Mat. 23.14. Luk 23:40. Rom. 2.3. and 5.16. and 13.2. Jam. 3.1. which is to be understood either of eternal punishments in respect of hypocrites: or temporal chastisements in the respect of believers, who do not worthily use the Lords Supper, as is declared hereafter v.30.] to himself, not discerning Lord body. [that is, seeing he maketh no difference between the bread of the Lords Supper, which is a holy sign of the Lords body, and betwixt ordinary meat: and so without proving and reverence eats the same as other common bread.]"}],"30":[{"catchword":null,"tekst":"Therefore [That is, for this abuse of the holy Supper] many are weak and sick among you, and many sleep. [that is, are already dead. See Mat. 9.24. and 27.52. Joh 11:11. 1 cor. 7.39. and 15.v.6.18. 1 Thes. 4.13.]"}],"31":[{"catchword":null,"tekst":"For if we judge our selves [Or discerned, i.e. after a good and diligent proving of our selves judged rightly how it stands with us, whether we may go worthily to the lords table or not: and if we find our selves unworthy abstain from that sacred meat until we shall have amended our lives] we should not be judged. [that is, punished or chastened of the Lord which such plagues as are related before, v.30.]"}],"32":[{"catchword":null,"tekst":"But when we judged, [This comfort the Apostle adds, that the faithful should not be too much dejected by the harshness of the former punishments. The comfort consists of two parts: first that such plagues are properly no punishments , but fatherly chastisements are or corrections: secondly, that they are sent to us by God for a good end, namely, for our salvation, that thereby we may brought to true repent (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;

  const n = k.dataset.n;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
