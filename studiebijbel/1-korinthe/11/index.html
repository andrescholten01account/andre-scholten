../romeinen/1/"},{"naam":"1 Korinthe","href":"../../1-korinthe/1/"},{"naam":"2 Korinthe","href":"../../2-korinthe/1/"},{"naam":"Galaten","href":"../../galaten/1/"},{"naam":"Efeze","href":"../../efeze/1/"},{"naam":"Filippenzen","href":"../../filippenzen/1/"},{"naam":"Kolossenzen","href":"../../kolossenzen/1/"},{"naam":"1 Thessalonicenzen","href":"../../1-thessalonicenzen/1/"},{"naam":"2 Thessalonicenzen","href":"../../2-thessalonicenzen/1/"},{"naam":"1 Timotheüs","href":"../../1-timotheus/1/"},{"naam":"2 Timotheüs","href":"../../2-timotheus/1/"},{"naam":"Titus","href":"../../titus/1/"},{"naam":"Filemon","href":"../../filemon/1/"},{"naam":"Hebreeën","href":"../../hebreeen/1/"},{"naam":"Jakobus","href":"../../jakobus/1/"},{"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}]},"vertalingen":{"SVnu":{"1":"Wees mijn navolgers, zoals ik ook navolger ben van Christus.","2":"En ik prijs u, broeders, dat u in alles aan mij denkt, en de inzettingen behoudt, zoals ik die u overgegeven heb.","3":"Maar ik wil dat u weet, dat Christus het Hoofd is van iedere man, en de man het hoofd van de vrouw, en God het Hoofd van Christus.","4":"Iedere man die bidt of profeteert met iets op het hoofd, onteert zijn eigen hoofd;","5":"maar iedere vrouw die bidt of profeteert met ongedekt hoofd, onteert haar eigen hoofd; want het is een en hetzelfde, alsof haar het haar afgesneden was.","6":"Want als een vrouw niet gedekt is, laat zij zich dan ook scheren; maar als het lelijk is voor een vrouw om geschoren te zijn, of het haar afgesneden te hebben, laat zij zich dekken.","7":"Want de man moet het hoofd niet dekken, omdat hij het beeld en de heerlijkheid van God is; maar de vrouw is de heerlijkheid van de man.","8":"Want de man is niet uit de vrouw, maar de vrouw is uit de man.","9":"Want de man is ook niet geschapen om de vrouw, maar de vrouw om de man.","10":"Daarom moet de vrouw een macht op het hoofd hebben, omwille van de engelen.","11":"Toch is de man niet zonder de vrouw, en de vrouw niet zonder de man, in de Heere.","12":"Want zoals de vrouw uit de man is, zo is ook de man door de vrouw; maar alle dingen zijn uit God.","13":"Oordeel bij uzelf: is het gepast dat de vrouw ongedekt tot God bidt?","14":"Of leert de natuur zelf u niet, dat als een man lang haar draagt, het hem een oneer is?","15":"Maar als een vrouw lang haar draagt, dat het haar een eer is? Omdat het lange haar haar tot een deksel is gegeven.","16":"Maar als iemand meent twistgierig te moeten zijn: wij hebben zulke gewoonten niet, en de Gemeenten van God ook niet.","17":"Dit nu, wat ik u aanzeg, prijs ik niet, namelijk dat u niet tot beter, maar tot erger samenkomt.","18":"Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;","19":"want er moeten ook afwijkende meningen onder u zijn, opdat degenen die oprecht zijn, openbaar worden onder u.","20":"Als u dan bijeen samenkomt, is dat niet het avondmaal van de Heere eten.","21":"Want bij het eten neemt ieder van tevoren zijn eigen avondmaal; en de een is hongerig, en de ander is dronken.","22":"Hebt u dan geen huizen om te eten en te drinken? Of veracht u de Gemeente van God, en beschaamt u degenen die niets hebben? Wat zal ik u zeggen? Zal ik u prijzen? Hierin prijs ik u niet.","23":"Want ik heb van de Heere ontvangen, wat ik ook u overgegeven heb, dat de Heere Jezus in de nacht waarin Hij verraden werd, het brood nam;","24":"en toen Hij gedankt had, brak Hij het, en zei: Neemt, eet, dit is Mijn lichaam, dat voor u gebroken wordt; doe dat tot Mijn gedachtenis.","25":"Op dezelfde manier nam Hij ook de drinkbeker, na het eten van het avondmaal, en zei: Deze drinkbeker is het Nieuwe Testament in Mijn bloed. Doe dat, zo dikwijls als u die zult drinken, tot Mijn gedachtenis.","26":"Want zo dikwijls als u dit brood eet, en deze drinkbeker drinkt, verkondigt u de dood van de Heere, totdat Hij komt.","27":"Zo dan, wie onwaardig dit brood eet, of de drinkbeker van de Heere drinkt, die zal schuldig zijn aan het lichaam en bloed van de Heere.","28":"Maar laat de mens zichzelf beproeven, en laat hij zo van het brood eten, en van de drinkbeker drinken.","29":"Want wie onwaardig eet en drinkt, die eet en drinkt zichzelf een oordeel, omdat hij het lichaam van de Heere niet onderscheidt.","30":"Daarom zijn er onder u velen zwak en ziek, en velen slapen.","31":"Want als wij onszelf zouden oordelen, zouden wij niet geoordeeld worden.","32":"Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.","33":"Zo dan, mijn broeders, als u samenkomt om te eten, wacht op elkaar.","34":"Maar als iemand honger heeft, laat hij thuis eten, opdat u niet tot een oordeel samenkomt. De overige dingen nu zal ik regelen, wanneer ik gekomen zal zijn."},"SV":{"1":"Weest mijn navolgers, gelijkerwijs ook ik van Christus.","2":"En ik prijs u, broeders, dat gij in alles mijner gedachtig zijt, en de inzettingen behoudt, gelijk ik *die* u overgegeven heb.","3":"Doch ik wil, dat gij weet, dat Christus het Hoofd is eens iegelijken mans, en de man het hoofd der vrouw, en God het Hoofd van Christus.","4":"Een iegelijk man, die bidt of profeteert, hebbende *iets* op het hoofd, die onteert zijn eigen hoofd;","5":"Maar een iegelijke vrouw, die bidt of profeteert met ongedekten hoofde, onteert haar eigen hoofd; want het is een en hetzelfde, alsof *haar* het haar afgesneden ware.","6":"Want indien een vrouw niet gedekt is, dat zij ook geschoren worde; maar indien het lelijk is voor een vrouw geschoren te zijn, of het haar afgesneden te hebben, dat zij zich dekke.","7":"Want de man moet het hoofd niet dekken, overmits hij het beeld en de heerlijkheid Gods is; maar de vrouw is de heerlijkheid des mans.","8":"Want de man is uit de vrouw niet, maar de vrouw is uit den man.","9":"Want ook is de man niet geschapen om de vrouw, maar de vrouw om den man.","10":"Daarom moet de vrouw een macht op het hoofd hebben, om der engelen wil.","11":"Nochtans is noch de man zonder de vrouw, noch de vrouw zonder den man, in den Heere.","12":"Want gelijkerwijs de vrouw uit den man is, alzo is ook de man door de vrouw; doch alle dingen *zijn* uit God.","13":"Oordeelt gij onder uzelven: is het betamelijk, dat de vrouw ongedekt God bidde?","14":"Of leert u ook de natuur zelve niet, dat zo een man lang haar draagt, het hem een oneer is?","15":"Maar zo een vrouw lang haar draagt, dat het haar een eer is; omdat het lange haar voor een deksel haar is gegeven?","16":"Doch indien iemand schijnt twistgierig te zijn, wij hebben zulke gewoonten niet, noch de Gemeenten Gods.","17":"Dit nu, *hetgeen* ik *u* aanzegge, prijs ik niet, *namelijk* dat gij niet tot beter, maar tot erger samenkomt.","18":"Want eerstelijk, als gij samenkomt in de Gemeente, zo hoor ik, dat er scheuringen zijn onder u; en ik geloof het ten dele;","19":"Want er moeten ook ketterijen onder u zijn, opdat degenen, die oprecht zijn, openbaar mogen worden onder u.","20":"Als gij dan bijeen samenkomt, *dat* is niet des Heeren avondmaal eten.","21":"Want in het eten neemt een iegelijk te voren zijn eigen avondmaal; en deze is hongerig, en de andere is dronken.","22":"Hebt gij dan geen huizen, om er te eten en te drinken? Of veracht gij de Gemeente Gods, en beschaamt gij degenen, die niet hebben? Wat zal ik u zeggen? Zal ik u prijzen? In dezen prijs ik *u* niet.","23":"Want ik heb van den Heere ontvangen, hetgeen ik ook u overgegeven heb, dat de Heere Jezus in den nacht, in welken Hij verraden werd, het brood nam;","24":"En als Hij gedankt had, brak Hij het, en zeide: Neemt, eet, dat is Mijn lichaam, dat voor u gebroken wordt; doet dat tot Mijn gedachtenis.","25":"Desgelijks *nam* Hij ook den drinkbeker, na het eten des avondmaals, en zeide: Deze drinkbeker is het Nieuwe Testament in Mijn bloed. Doet dat, zo dikwijls als gij *dien* zult drinken, tot Mijn gedachtenis.","26":"Want zo dikwijls als gij dit brood zult eten, en dezen drinkbeker zult drinken, zo verkondigt den dood des Heeren, totdat Hij komt.","27":"Zo dan, wie onwaardiglijk dit brood eet, of den drinkbeker des Heeren drinkt, die zal schuldig zijn aan het lichaam en bloed des Heeren.","28":"Maar de mens beproeve zichzelven, en ete alzo van het brood, en drinke van den drinkbeker.","29":"Want die onwaardiglijk eet en drinkt, die eet en drinkt zichzelven een oordeel, niet onderscheidende het lichaam des Heeren.","30":"Daarom zijn onder u vele zwakken en kranken, en velen slapen.","31":"Want indien wij onszelven oordeelden, zo zouden wij niet geoordeeld worden.","32":"Maar als wij geoordeeld worden, zo worden wij van den Heere getuchtigd, opdat wij met de wereld niet zouden veroordeeld worden.","33":"Zo dan, mijn broeders, als gij samenkomt om te eten, verwacht elkander.","34":"Doch zo iemand hongert, dat hij te huis ete, opdat gij niet tot een oordeel samenkomt. De overige dingen nu zal ik verordenen, als ik zal gekomen zijn."},"KJV":{"1":"Be ye followers of me, even as I also am of Christ.","2":"Now I praise you, brethren, that ye remember me in all things, and keep the ordinances, as I delivered them to you.","3":"But I would have you know, that the head of every man is Christ; and the head of the woman is the man; and the head of Christ is God.","4":"Every man praying or prophesying, having his head covered, dishonoureth his head.","5":"But every woman that prayeth or prophesieth with her head uncovered dishonoureth her head: for that is even all one as if she were shaven.","6":"For if the woman be ➔ not covered, let her ➔ also be shorn: but if it be a shame for a woman to be shorn or shaven, let her be covered.","7":"For a man indeed ought not to cover his head, forasmuch as he is the image and glory of God: but the woman is the glory of the man.","8":"For the man is not of the woman; but the woman of the man.","9":"Neither was ➔ the man created for the woman; but the woman for the man.","10":"For this cause ought the woman to have power on her head because of the angels.","11":"Nevertheless neither is the man without the woman, neither the woman without the man, in the Lord.","12":"For as the woman is of the man, even so is the man also by the woman; but all things of God.","13":"Judge in yourselves: is it comely that a woman pray unto God uncovered?","14":"Doth not even nature itself teach you, that, if a man have long hair, it is a shame unto him?","15":"But if a woman have long hair, it is a glory to her: for her hair is given her for a covering.","16":"But if any man seem to be contentious, we have no such custom, neither the churches of God.","17":"Now in this that I declare unto you I praise you not, that ye come together not for the better, but for the worse.","18":"For first of all, when ye come together in the church, I hear that there be divisions among you; and I partly believe it.","19":"For there must be also heresies among you, that they which are approved may be made manifest among you.","20":"When ye come together therefore into one place, this is not to eat the Lord's supper.","21":"For in eating every one taketh before other his own supper: and one is hungry, and another is drunken.","22":"What? have ye not houses to eat and to drink in? or despise ye the church of God, and shame them that have not? What shall I say to you? shall I praise you in this? I praise you not.","23":"For I have received of the Lord that which also I delivered unto you, That the Lord Jesus the same night in which he was betrayed took bread:","24":"And when he had given thanks, he brake it, and said, Take, eat: this is my body, which is broken for you: this do in remembrance of me.","25":"After the same manner also he took the cup, when he had supped, saying, This cup is the new testament in my blood: this do ye, as oft as ye drink it, in remembrance of me.","26":"For as often as ye eat this bread, and drink this cup, ye do shew the Lord's death till he come.","27":"Wherefore whosoever shall eat this bread, and drink this cup of the Lord, unworthily, shall be guilty of the body and blood of the Lord.","28":"But let ➔ a man examine himself, and so let him eat of that bread, and drink of that cup.","29":"For he that eateth and drinketh unworthily, eateth and drinketh damnation to himself, not discerning the Lord's body.","30":"For ➔ this cause many are weak and sickly among you, and many sleep.","31":"For if we would judge ourselves, we should not be judged.","32":"But when we are judged, we are chastened of the Lord, that ➔ we should ➔ not be condemned with the world.","33":"Wherefore, my brethren, when ye come together to eat, tarry one for another.","34":"And if any man hunger, let him eat at home; that ➔ ye come ➔ not together unto condemnation. And the rest will I set in order when I come."}},"tsk":{"1":[{"kopje":"Wees","refs":["1 Kor 4:16","1 Kor 10:33","Fil 3:17","1 Tess 1:6","2 Tess 3:9","Hebr 6:12"]},{"kopje":"ook","refs":["Rom 15:2","Rom 15:3","Ef 5:1","Ef 5:2","Fil 2:4","Fil 2:5"]}],"2":[{"kopje":"prijs","refs":["1 Kor 11:17","1 Kor 11:22","Spr 31:28-31"]},{"kopje":"dat","refs":["1 Kor 4:17","1 Kor 15:2"]},{"kopje":"behoudt","refs":["1 Kor 7:17","Luk 1:6","1 Tess 4:1","1 Tess 4:2","2 Tess 2:15","2 Tess 3:6"]}],"3":[{"kopje":"het Hoofd van iedere","refs":["Ef 1:22","Ef 1:23","Ef 4:15","Ef 5:23","Fil 2:10","Fil 2:11","Kol 1:18","Kol 2:10","Kol 2:19"]},{"kopje":"en de man het hoofd van de vrouw","refs":["Gen 3:16","Ef 5:22","Ef 5:24","Kol 3:18","1 Tim 2:11","1 Tim 2:12","1 Petr 3:1","1 Petr 3:5","1 Petr 3:6"]},{"kopje":"en God het Hoofd van Christus","refs":["1 Kor 3:23","1 Kor 15:27","1 Kor 15:28","Jes 49:3-6","Jes 52:13","Jes 55:4","Jes 61:1-4","Matt 28:18","Joh 3:34-36","Joh 5:20-30","Joh 14:28","Jo ull},{"disp":"Judas 1:1","href":"../../judas/1/#v1","ref":"Judas 1:1","svLabel":null}],"kinderen":[]}]}],"torrey":[{"topic":"Discipline Of The Church","href":"../../torrey/d/#t-discipline-of-the-church","kinderen":[{"label":"Consists In","href":"../../torrey/d/?hl=1Cor.11.34#i4907","refs":[],"kinderen":[{"label":"Ordering its affairs","href":"../../torrey/d/?hl=1Cor.11.34#i4909","refs":[{"disp":"1 Kor 11:34","href":"../../1-korinthe/11/#v34","ref":"1 Kor 11:34","svLabel":null},{"disp":"Tit 1:5","href":"../../titus/1/#v5","ref":"Tit 1:5","svLabel":null}],"kinderen":[]}]}]}]}},"extern":{"Jes 55:11":"Zo zal Mijn woord, dat uit Mijn mond uitgaat, ook zijn, het zal niet leeg naar Mij terugkeren; maar het zal doen wat Mij behaagt, en het zal voorspoedig zijn in wat, waartoe Ik het zend.","Ps 96:5":"Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemel gemaakt.","Num 17:4":"En u zult ze wegleggen in de tent van de samenkomst, voor de getuigenis, waar Ik met u samenkomen zal.","1 Joh 2:8":"Opnieuw schrijf ik u een nieuw gebod: wat waar is in Hem, is ook waar in u; want de duisternis gaat voorbij, en het waarachtige licht schijnt nu.","Joz 4:7":"Zo zult u tegen hen zeggen: Omdat de wateren van de Jordaan zijn afgesneden geweest voor de ark van het verbond van de HEERE; toen zij door de Jordaan trok, werden de wateren van de Jordaan afgesneden; zo zullen deze stenen de kinderen van Israël tot een gedachtenis zijn tot in eeuwigheid.","Joh 10:5":"Maar een vreemde zullen zij nooit volgen, maar zij zullen van hem wegvluchten; omdat zij de stem van de vreemden niet kennen.","Openb 1:6":"En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.","Fil 3:3":"Want wij zijn de besnijding, wij, die God in de Geest dienen, en in Christus Jezus roemen, en niet vertrouwen op het vlees.","Joh 20:31":"maar deze zijn geschreven, opdat u gelooft dat Jezus de Christus is, de Zoon van God; en opdat u, door te geloven, het leven hebt in Zijn Naam.","1 Petr 1:7":"opdat de beproeving van uw geloof — die veel kostbaarder is dan goud, dat vergaat en toch door het vuur beproefd wordt — bevonden wordt te zijn tot lof, eer en heerlijkheid bij de openbaring van Jezus Christus;","Ps 26:6-8":"Ik was mijn handen in onschuld, en ik ga rondom Uw altaar, o HEERE! Om te laten horen de stem van de lof, en om te vertellen al Uw wonderen. HEERE! Ik heb lief de woning van Uw huis, en de plaats van de tabernakel van Uw eer.","Joh 10:10-13":"De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben. Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen. Maar de huurling, die geen herder is, van wie de schapen niet zelf zijn, ziet de wolf komen, en verlaat de schapen, en vlucht; en de wolf grijpt ze, en verstrooit de schapen.","2 Kor 2:12-17":"Verder, toen ik in Troas kwam om het Evangelie van Christus te prediken, en mij daar een deur geopend was in de Heere, had ik geen rust voor mijn geest, omdat ik mijn broeder Titus niet vond; maar ik nam afscheid van hen en vertrok naar Macedonië. En God zij dank, Die ons altijd doet triomferen in Christus, en de geur van Zijn kennis door ons openbaar maakt op elke plaats.","Ps 119:165":"Die Uw wet beminnen, hebben grote vrede, en zij hebben geen aanstoot.","1 Kor 1:11":"Want mij is over u bekendgemaakt, mijn broeders, door hen die van het huisgezin van Chloë zijn, dat er twisten onder u zijn.","Ps 119:61":"De goddeloze hopen hebben mij beroofd; nochtans heb ik Uw wet niet vergeten.","Joh 15:15":"Ik noem u niet meer dienstknechten; want de dienstknecht weet niet wat zijn heer doet; maar Ik heb u vrienden genoemd; want alles wat Ik van Mijn Vader gehoord heb, dat heb Ik u bekendgemaakt.","Hebr 12:5-11":"En u bent de vermaning vergeten, die tot u spreekt als tot zonen: Mijn zoon, acht de kastijding van de Heere niet klein, en bezwijk niet als u door Hem bestraft wordt; Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt. Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt?","Ps 78:1":"Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond.","Est 1:20-22":"Wanneer het bevel van de koning, dat hij zal geven in zijn hele koninkrijk (want het is groot), bekend wordt gemaakt, dan zullen alle vrouwen aan hun mannen eer geven, van de grootste tot de kleinste toe. Dit woord nu vond de koning en de vorsten goed; en de koning deed naar het woord van Memuchan. En hij zond brieven aan alle landschappen van de koning, aan ieder landschap in zijn eigen schrift, en aan elk volk in zijn eigen taal, dat elke man heerser in zijn eigen huis zou zijn, en zou spreken in de taal van zijn volk.","Hand 16:17":"Zij volgde Paulus en ons achterna en riep: Deze mensen zijn dienstknechten van God, de Allerhoogste, die ons de weg van de zaligheid verkondigen.","2 Tim 2:16-18":"Maar verzet u tegen het ongoddelijk ijdel geklets; want zij zullen in meerdere goddeloosheid toenemen. En hun woord zal voortvreten als de kanker; onder wie zijn Hymeneüs en Filetus; die van de waarheid zijn afgeweken, en zeggen dat de opstanding al gebeurd is, en het geloof van sommigen omverwerpen.","Hos 2:18":"En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.","Ex 22:16":"Wanneer iemand een maagd verleidt die nog niet ondertrouwd is, en hij slaapt met haar, dan moet hij zonder uitstel een bruidsprijs voor haar betalen, zodat zij zijn vrouw wordt.","1 Kor 3:1-4":"En ik, broeders, kon tot u niet spreken als tot geestelijken, maar als tot vleselijken, als tot jonge kinderen in Christus. Ik heb u met melk gevoed, en niet met vaste spijs; want u kon toen nog niet; ja, u kunt ook nu nog niet. Want u bent nog vleselijk; want omdat er onder u nijd is, en twist, en tweedracht, bent u niet vleselijk, en wandelt u niet naar de mens?","Deut 8:3":"En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.","Matt 23:39":"Want Ik zeg u: U zult Mij van nu af aan niet zien, totdat u zeggen zult: Gezegend is Hij Die komt in de Naam van de Heere!","Joz 22:5":"Neem alleen nauwgezet in acht om te doen het gebod en de wet, die Mozes, de dienaar van de HEERE, u geboden heeft: dat u de HEERE, uw God, liefhebt, en dat u wandelt in al Zijn wegen, en Zijn geboden houdt, en Hem aanhangt, en dat u Hem dient met uw hele hart en met uw hele ziel.","Job 36:8-10":"En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben; En Hij opent hun oor voor de tucht, en zegt dat zij zich van de ongerechtigheid moeten bekeren.","Jer 13:15":"Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.","1 Tim 4:3-5":"die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen. Want alles wat God geschapen heeft, is goed, en niets is verwerpelijk als het met dankzegging aangenomen wordt; want het wordt geheiligd door het Woord van God en door het gebed.","2 Kor 3:12":"Omdat wij dan zo'n hoop hebben, gebruiken wij veel vrijmoedigheid in het spreken;","Num 5:18":"Daarna zal de priester de vrouw voor het aangezicht van de HEERE stellen, en zal het hoofd van de vrouw ontbloten, en zal het spijsoffer van de gedachtenis op haar handen leggen, dat het spijsoffer van de ijveringen is; en in de hand van de priester zal dat bittere water zijn, dat de vloek meebrengt.","Ps 119:81-83":"Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt. Mijn ogen zijn bezweken van verlangen naar Uw toezegging, terwijl ik zei: Wanneer zult U mij vertroosten? Want ik ben geworden als een lederen zak in de rook; doch Uw inzettingen heb ik niet vergeten.","Ps 55:10":"Verslind hen, Heere! verdeel hun tong; want ik zie geweld en twist in de stad.","1 Tim 5:22":"Leg niemand haastig de handen op, en heb geen gemeenschap met de zonden van anderen; bewaar uzelf rein.","Ps 89:32-35":"als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden; dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen. Maar Mijn goedertierenheid zal Ik van hem niet wegnemen, en in Mijn getrouwheid niet feilen.","1 Sam 2:7":"De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.","Openb 14:6":"En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;","Matt 15:9":"Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.","1 Tim 4:16":"Let op uzelf en op de leer; volhard daarin; want als u dat doet, zult u zowel uzelf behouden als hen die u horen.","Hand 17:2":"En Paulus ging, zoals hij gewoon was, bij hen naar binnen, en drie sabbatten lang sprak hij met hen uit de Schriften,","Spr 3:20":"Door Zijn kennis zijn de afgronden gekloofd, en de wolken druipen dauw.","Rom 13:13":"Laten wij, als bij daglicht, eerbaar wandelen; niet in bras­partijen en dronkenschappen, niet in ontucht en losbandigheid, niet in twist en jaloezie;","Deut 27:2":"Het zal dan gebeuren, op de dag dat u de Jordaan overgestoken bent naar het land dat de HEERE, uw God, u geven zal, dat u grote stenen zult oprichten en ze met kalk bestrijken;","Ps 118:23":"Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen.","Ps 103:1-4":"Een psalm van David. Loof de HEERE, mijn ziel, en al wat binnen in mij is, Zijn heilige Naam. Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;","Luk 12:46":"dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.","Jes 52:6":"Daarom zal Mijn volk, daarom zal het Mijn Naam op die dag kennen, dat Ik het Zelf ben, Die spreekt: Zie, hier ben Ik.","1 Joh 1:4":"En deze dingen schrijven wij u, opdat uw blijdschap vervuld is.","Joh 9:4":"Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.","Ps 78:30":"Zij waren nog niet vervreemd van hun lust; hun spijs was nog in hun mond,","Matt 25:31-46":"En wanneer de Zoon des mensen komen zal in Zijn heerlijkheid, en alle heilige engelen met Hem, dan zal Hij zitten op de troon van Zijn heerlijkheid. En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt. En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.","Gen 9:6":"Wie het bloed van een mens vergiet, diens bloed zal door de mens vergoten worden; want God heeft de mens naar Zijn beeld gemaakt.","Jona 1:9":"En hij zei tegen hen: Ik ben een Hebreeër; en ik vrees de HEERE, de God van de hemel, Die de zee en het droge gemaakt heeft.","Jak 3:1":"Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.","Ps 124:8":"Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.","Openb 14:7":"en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.","Ex 15:2":"De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!","Zach 11:5":"Die hen bezitten doden hen, en houden het niet voor schuld; en ieder van hen die ze verkopen, zegt: Geloofd zij de HEERE, dat ik rijk geworden ben! En niemand van hen die ze weiden, ontziet ze.","Spr 19:13":"Een dwaze zoon is voor zijn vader een grote ellende; en de kijvingen van een vrouw zijn als een aanhoudend druppelen.","1 Petr 1:2":"de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.","1 Kor 1:17":"Want Christus heeft mij niet gezonden om te dopen, maar om het Evangelie te verkondigen; niet met wijsheid van woorden, opdat het kruis van Christus niet zinledig gemaakt wordt.","Gen 2:24":"Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.","Openb 1:2":"die het woord van God betuigd heeft, en de getuigenis van Jezus Christus, en alles wat hij gezien heeft.","1 Kon 8:25":"En nu, HEERE, God van Israël, houd Uw dienaar, mijn vader David, wat U tot hem gesproken hebt, en zei: Er zal u geen man van voor Mijn aangezicht afgesneden worden, die op de troon van Israël zit; alleen als uw zonen hun weg bewaren, om te wandelen voor Mijn aangezicht, zoals u gewandeld hebt voor Mijn aangezicht.","Ps 100:1-4":"Een lofzang. Heel de aarde, juich voor de HEERE! Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang. Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.","Ps 106:43":"Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.","Fil 1:1":"Paulus en Timotheüs, dienstknechten van Jezus Christus, aan alle heiligen in Christus Jezus die te Filippi zijn, met de opzieners en diakenen:","Ps 136:5-9":"Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de grote lichten heeft gemaakt; want Zijn goedertierenheid is voor eeuwig.","Ps 8:4":"Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt;","1 Kor 7:16":"Want wat weet u, vrouw, of u de man zult redden? Of wat weet u, man, of u de vrouw zult redden?","Est 1:22":"En hij zond brieven aan alle landschappen van de koning, aan ieder landschap in zijn eigen schrift, en aan elk volk in zijn eigen taal, dat elke man heerser in zijn eigen huis zou zijn, en zou spreken in de taal van zijn volk.","Hos 9:8":"De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.","Ps 89:8":"God is zeer geducht in de raad van de heiligen, en te vrezen boven allen die rondom Hem zijn.","Ps 119:93":"Ik zal Uw bevelen in de eeuwigheid niet vergeten, want daardoor hebt U mij levend gemaakt.","Mal 2:13-16":"Dit tweede doet u ook: dat u het altaar van de HEERE bedekt met tranen, met wenen en met zuchten, zodat Hij niet meer naar het spijsoffer wil omzien, en het ook niet met welgevallen uit uw hand wil ontvangen. U zegt nu: Waarom? Omdat de HEERE een Getuige geweest is tussen u en de vrouw van uw jeugd, met wie u trouweloos handelt; terwijl zij toch uw metgezellin is, en de vrouw van uw verbond. Heeft Hij niet maar één gemaakt, hoewel Hij van de Geest overvloed had? En waarom die ene? Hij zocht een zaad van God. Daarom, wees op uw hoede met uw geest, en laat niemand trouweloos handelen tegen de vrouw van zijn jeugd.","Jer 13:20":"Hef uw ogen op, en zie hen die daar uit het noorden komen! Waar is de kudde die u gegeven was, de schapen van uw heerlijkheid?","2 Kon 15:5":"En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.","Ezech 3:3":"En Hij zei tot mij: Mensenkind, geef uw buik te eten, en vul uw ingewand met deze rol, die Ik u geef. Toen at ik, en het was in mijn mond als honing, vanwege de zoetheid.","Amos 9:6":"Die Zijn bovenzalen in de hemel bouwt, en Zijn gewelf heeft Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.","Gen 1:31":"En God zag al wat Hij gemaakt had, en zie, het was zeer goed. Toen was het avond geweest en het was morgen geweest: de zesde dag.","Ps 119:9":"Beth. Waarmee zal de jongeling zijn pad zuiver houden? Als hij dat houdt naar Uw woord.","Ps 119:140-144":"Uw woord is zeer gelouterd, en Uw knecht heeft het lief. Ik ben klein en veracht, doch Uw bevelen vergeet ik niet. Uw gerechtigheid is gerechtigheid in eeuwigheid, en Uw wet is de waarheid.","Ef 1:20-22":"Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel; Ver boven alle overheid, en macht, en kracht, en heerschappij, en elke naam die genoemd wordt, niet alleen in deze wereld, maar ook in de toekomende; En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;","1 Kor 3:10-16":"Naar de genade van God, die mij gegeven is, heb ik als een wijs bouwmeester het fundament gelegd; en een ander bouwt daarop. Maar ieder ziet toe hoe hij daarop bouwt. Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus. En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels;","Rom 11:36":"Want uit Hem, en door Hem, en tot Hem zijn alle dingen. Hem zij de heerlijkheid tot in eeuwigheid. Amen.","Hand 26:5":"Zij die mij van lang geleden af kennen (als zij het wilden getuigen), dat ik naar de strengste richting van onze godsdienst als een Farizeeër geleefd heb.","Matt 23:4":"Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.","Jes 48:13":"Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.","Lev 21:1":"Daarna zei de HEERE tegen Mozes: Spreek tot de priesters, de zonen van Aäron, en zeg tegen hen: Over een dode zal een priester zich niet verontreinigen onder zijn volken.","1 Tess 5:21":"Beproef alle dingen; behoud het goede.","1 Tim 5:1-16":"Bestraf een oudere man niet hard, maar vermaan hem als een vader; de jongeren als broeders; De oudere vrouwen als moeders; de jongeren als zusters, in alle reinheid. Eer de weduwen, die echt weduwen zijn.","Ex 19:9":"En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.","Jer 27:9-18":"U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen. Want zij profeteren u leugens, om u ver uit uw land weg te brengen, en dat Ik u wegjaag, en u omkomt. Maar het volk dat zijn hals onder het juk van de koning van Babel zal brengen, en hem dienen, dat zal Ik in zijn land laten blijven, spreekt de HEERE, en het zal het bebouwen en erin wonen.","1 Kor 7:7":"Want ik zou willen dat alle mensen waren zoals ikzelf ben; maar ieder heeft zijn eigen gave van God, de een wel zo, maar de ander zo.","Spr 8:26-29":"Hij had de aarde nog niet gemaakt, noch de velden, noch het begin van de stofjes van de wereld. Toen Hij de hemelen bereidde, was Ik daar; toen Hij een cirkel over het vlakke van de afgrond beschreef; Toen Hij de opperwolken van boven vestigde; toen Hij de fonteinen van de afgrond vastmaakte;","2 Petr 3:17":"U dan, geliefden, omdat u dit van tevoren weet, wees op uw hoede, dat u niet mede weggesleept wordt door de dwaling van de verdorven mensen, en afvalt van uw eigen standvastigheid;","Deut 17:18":"Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt;","1 Tim 2:8":"Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.","Luk 6:5":"En Hij zei tegen hen: De Zoon des mensen is ook Heere van de sabbat.","1 Kon 13:21-24":"en hij riep tegen de man van God die uit Juda gekomen was, en zei: Zo zegt de HEERE: Omdat u opstandig bent geweest tegen de mond van de HEERE, en het gebod niet gehouden hebt dat de HEERE, uw God, u geboden had, maar bent teruggekeerd en hebt brood gegeten en water gedronken op de plaats waarvan Hij tegen u gezegd had: U zult geen brood eten en geen water drinken; zo zal uw dode lichaam niet in het graf van uw vader komen. En het gebeurde, nadat hij brood gegeten had en nadat hij gedronken had, dat hij hem de ezel zadelde, te weten voor de profeet die hij had laten terugkeren.","Jes 8:16":"Bind de getuigenis toe; verzegel de wet onder mijn leerlingen.","Hand 26:22":"Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;","Openb 22:20":"Die deze dingen getuigt, zegt: Ja, Ik kom haastig. Amen. Ja, kom, Heere Jezus!","1 Tess 5:13":"En acht hen zeer veel in liefde, om hun werk. Wees vreedzaam onder elkaar.","Gen 1:1-28":"In het begin schiep God de hemel en de aarde. De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren. En God zei: Laat er licht zijn! En er was licht.","Ef 6:18":"Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;","Joh 12:49":"Want Ik heb niet uit Mijzelf gesproken; maar de Vader, Die Mij gezonden heeft, Die heeft Mij een gebod gegeven wat Ik zeggen zal en wat Ik spreken zal.","Ps 119:23-25":"Als zelfs de vorsten zittend tegen mij gesproken hebben, heeft Uw knecht Uw inzettingen betracht. Ook zijn Uw getuigenissen mijn vermakingen, en mijn raadslieden. Daleth. Mijn ziel kleeft aan het stof; maak mij levend naar Uw woord.","Matt 23:8":"Maar u moet niet Rabbi genoemd worden; want Eén is uw Meester, namelijk Christus; en u bent allemaal broeders.","Joz 8:32-35":"Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël. En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen. En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat.","1 Petr 3:6":"zoals Sara Abraham gehoorzaam is geweest, hem heer noemend, van wie u dochters geworden bent, als u goed doet en voor geen enkele verschrikking bang bent.","Mark 13:32-37":"Maar van die dag en dat uur weet niemand, ook de engelen in de hemel niet, en ook de Zoon niet, maar alleen de Vader. Let op, waak en bid; want u weet niet wanneer de tijd is. Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken;","1 Joh 2:21":"Ik heb u niet geschreven, omdat u de waarheid niet weet, maar omdat u die weet, en omdat geen leugen uit de waarheid is.","Num 20:24":"Aäron zal tot zijn volken verzameld worden; want hij zal niet komen in het land, dat Ik aan de kinderen van Israël gegeven heb, omdat u tegen Mijn mond opstandig geweest bent bij de wateren van Meriba.","Jer 51:19":"Jakobs deel is niet gelijk aan hen; want Hij is de Formeerder van alles, en Israël is de stam van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.","2 Tim 4:1":"Ik roep u dus dringend op, voor het aangezicht van God en de Heere Jezus Christus, Die de levenden en doden zal oordelen bij Zijn verschijning en in Zijn Koninkrijk:","Jes 30:10":"Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.","Ps 119:91":"Naar Uw verordeningen blijven zij nog heden staan, want zij allen zijn Uw knechten.","1 Tess 4:1":"Verder dan, broeders, wij bidden en vermanen u in de Heere Jezus, zoals u van ons ontvangen hebt hoe u moet wandelen en God behagen, dat u daarin meer overvloedig wordt.","Mark 10:35-37":"En Jakobus en Johannes, de zonen van Zebedeüs, kwamen naar Hem toe, en zeiden: Meester, wij zouden graag willen dat U voor ons deed wat wij ook zullen vragen. En Hij zei tegen hen: Wat wilt u dat Ik voor u doe? En zij zeiden tegen Hem: Geef ons dat wij mogen zitten, de één aan Uw rechterhand, en de ander aan Uw linkerhand, in Uw heerlijkheid.","Ef 1:13":"In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;","Zach 7:5-7":"Spreek tot heel het volk van dit land, en tot de priesters: Toen u vastte en rouwklaagde, in de vijfde en in de zevende maand, namelijk nu zeventig jaren, hebt u dan voor Mij, voor Mij, werkelijk gevast? Of als u at, en als u dronk, was dat niet voor uzelf, u die daar at, en u die daar dronk? Zijn dit niet de woorden die de HEERE uitriep door de dienst van de vorige profeten, toen Jeruzalem bewoond en welvarend was, en haar steden rondom haar; en toen het zuiden en de laagte bewoond waren?","Spr 15:18":"Een grimmige man verwekt gekijf; maar wie langzaam tot toorn is, doet de twist bedaren.","Ps 119:115":"Wijkt van mij, u boosdoeners! dat ik de geboden van mijn God moge bewaren.","1 Kor 10:21":"U kunt niet de drinkbeker van de Heere drinken én de drinkbeker van de duivelen; u kunt niet deelhebben aan de tafel van de Heere én aan de tafel van de duivelen.","Hand 27:35":"En toen hij dit gezegd had en brood genomen had, dankte hij God in aanwezigheid van allen; en nadat hij het gebroken had, begon hij te eten.","1 Kor 3:5-7":"Wie is dan Paulus, en wie is Apollos, anders dan dienaars, door wie u geloofd hebt, en dat, zoals de Heere aan ieder gegeven heeft? Ik heb geplant, Apollos heeft nat gemaakt; maar God heeft de groei gegeven. Zo is dan noch hij die plant iets, noch hij die nat maakt, maar God, Die de groei geeft.","Jes 9:13":"Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag.","Job 23:12":"Het gebod van Zijn lippen heb ik ook niet weggedaan; de woorden van Zijn mond heb ik meer weggelegd dan mijn bescheiden deel.","Kol 1:28":"Hem verkondigen wij, terwijl wij ieder mens vermanen en ieder mens onderwijzen in alle wijsheid, opdat wij ieder mens volmaakt zouden stellen in Christus Jezus;","Jes 9:12":"Want dit volk keert zich niet tot Hem, Die het slaat, en de HEERE van de heerscharen zoeken zij niet.","Hand 2:17":"En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen.","Rom 15:2":"Laat dan ieder van ons zijn naaste behagen ten goede, tot opbouw.","Job 33:18-30":"Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga. Ook wordt hij gestraft met smart op zijn leger, en de sterke menigte van zijn beenderen; Zodat zijn leven het brood zelf verfoeit, en zijn ziel het begeerlijke voedsel;","Matt 28:20":"en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.","Matt 20:23":"En Hij zei tegen hen: Mijn drinkbeker zult u wel drinken, en met de doop waarmee Ik gedoopt word, zult u gedoopt worden; maar het zitten aan Mijn rechterhand en aan Mijn linkerhand, staat niet aan Mij te geven, maar het zal gegeven worden aan hen voor wie het bereid is door Mijn Vader.","2 Kor 5:11":"Wij dan, die de schrik van de Heere kennen, bewegen de mensen tot het geloof, en wij zijn openbaar geworden voor God; en ik hoop dat wij ook in uw gewetens geopenbaard zijn geworden.","Hand 16:5":"De gemeenten dan werden bevestigd in het geloof, en werden dagelijks talrijker in aantal.","Luk 11:1":"En het gebeurde, toen Hij op een zekere plaats was en bad, dat, toen Hij ophield, een van Zijn discipelen tegen Hem zei: Heere, leer ons bidden, zoals ook Johannes zijn discipelen geleerd heeft.","Hoogl 1:4":"Trek mij, wij zullen u nalopen! De koning heeft mij gebracht in zijn binnenkamers; wij zullen ons verheugen en in u verblijden; wij zullen uw uitnemende liefde vermelden, meer dan de wijn; de oprechten hebben u lief.","Matt 22:29":"Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.","Matt 24:5":"Want velen zullen komen onder Mijn Naam en zeggen: Ik ben de Christus; en zij zullen velen misleiden.","Deut 29:29":"De verborgen dingen zijn voor de HEERE, onze God; maar de geopenbaarde dingen zijn voor ons en voor onze kinderen, tot in eeuwigheid, om al de woorden van deze wet te doen.","2 Kor 7:2":"Geef ons plaats; wij hebben niemand onrecht aangedaan, wij hebben niemand verdorven, wij hebben bij niemand ons voordeel gezocht.","Lev 19:17":"U zult uw broeder in uw hart niet haten; u zult uw naaste zeker berispen, en zult de zonde in hem niet laten voortbestaan.","Spr 17:5":"Die de arme bespot, smaadt zijn Maker; die zich verblijdt in het ongeluk van een ander, zal niet onschuldig blijven.","Fil 3:2":"Let op de honden, let op de kwade arbeiders, let op de versnijding.","Ps 104:6":"U had haar met de afgrond als een kleed overdekt; de wateren stonden boven de bergen.","Dan 8:26":"Het gezicht nu van de avond en de morgen, dat verteld is, is waar; en u, houd dit gezicht geheim, want er zijn nog veel dagen tot die tijd.","Matt 5:19":"Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen.","1 Petr 1:6":"Daarin verheugt u zich, ook al bent u nu, voor een korte tijd (als het nodig is), bedroefd door allerlei beproevingen,","2 Tim 1:13":"Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.","Rom 6:17":"Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent;","Deut 1:38":"Jozua, de zoon van Nun, die voor u staat, die zal daar ingaan; sterk hem, want hij zal het aan Israël doen erven.","Mark 1:35":"En vroeg in de morgen, toen het nog diep in de nacht was, stond Hij op, ging naar buiten, en ging naar een eenzame plaats, en bad daar.","2 Tim 3:10":"Maar u bent mijn leer nauwgezet gevolgd, mijn wijze van doen, voornemen, geloof, geduld, liefde, volharding,","Openb 20:11":"En ik zag een grote witte troon, en Hem Die daarop zat, van Wiens aangezicht de aarde en de hemel wegvloden, en er werd geen plaats voor hen gevonden.","Jes 28:7":"Maar ook dezen dwalen door de wijn, en zij dolen door de sterke drank; de priester en de profeet dwalen door de sterke drank; zij zijn verslonden door de wijn, zij dolen door sterke drank; zij dwalen in het zien van visioenen; zij waggelen in het rechtspreken.","Jes 2:3":"En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.","Matt 24:4":"En Jezus antwoordde en zei tegen hen: Kijk uit dat niemand u misleidt.","Jer 29:6":"Neemt vrouwen, en verwekt zonen en dochters, en neemt vrouwen voor uw zonen, en geeft uw dochters aan mannen, zodat zij zonen en dochters baren; en wordt daar talrijker, en wordt niet minder.","Ef 2:20-22":"gebouwd op het fundament van de apostelen en profeten, waarvan Jezus Christus Zelf is de uiterste Hoeksteen; op Wie het hele gebouw, bekwaam samengevoegd, opgroeit tot een heilige tempel in de Heere; op Wie ook u mede gebouwd wordt tot een woonplaats van God in de Geest.","Matt 23:10":"Ook moet u geen meesters genoemd worden; want Eén is uw Meester, namelijk Christus.","Deut 4:5":"Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.","Mark 14:22-24":"En terwijl zij aten, nam Jezus brood, en nadat Hij gezegend had, brak Hij het, en gaf het hun, en zei: Neem, eet, dat is Mijn lichaam. En Hij nam de drinkbeker, en nadat Hij gedankt had, gaf Hij hun die; en zij dronken allen daaruit. En Hij zei tegen hen: Dat is Mijn bloed, het bloed van het nieuwe testament, dat voor velen vergoten wordt.","Openb 16:15":"Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.","Num 9:10-13":"Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden. In de tweede maand, op de veertiende dag, tussen de twee avonden, zullen zij dat houden; met ongezuurde broden en bittere kruiden zullen zij dat eten. Zij zullen daarvan niets overlaten tot de morgen, en zullen daaraan geen been breken; naar alle inzetting van het pascha zullen zij dat houden.","Deut 12:13":"Wacht u ervoor dat u uw brandoffers niet offert op elke plaats die u zien zult.","Joh 15:2":"Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.","2 Petr 1:17":"Want Hij heeft van God de Vader eer en heerlijkheid ontvangen, toen zo'n stem van de hoogwaardige heerlijkheid tot Hem gebracht werd: Dit is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb.","1 Kor 1:10-12":"Maar ik bid u, broeders, door de Naam van onze Heere Jezus Christus, dat u allen hetzelfde spreekt, en dat er onder u geen scheuringen zijn, maar dat u samengevoegd bent tot eenzelfde zin en tot eenzelfde gevoelen. Want mij is over u bekendgemaakt, mijn broeders, door hen die van het huisgezin van Chloë zijn, dat er twisten onder u zijn. En dit zeg ik, dat ieder van u zegt: Ik ben van Paulus; en ik van Apollos; en ik van Cefas; en ik van Christus.","2 Sam 15:30":"En David ging op door de opgang van de olijven, terwijl hij opging en weende, en zijn hoofd was bedekt; en hij zelf ging blootsvoets; ook had heel het volk dat bij hem was, ieder zijn hoofd bedekt, en zij gingen op, terwijl zij opgingen en weenden.","Ps 119:14-16":"Ik ben vrolijker in de weg van Uw getuigenissen, dan over alle rijkdom. Ik zal Uw bevelen overdenken, en op Uw paden letten. Ik zal mijzelf vermaken in Uw inzettingen; Uw woord zal ik niet vergeten.","Zef 3:18":"De bedroefden, om de bijeenkomst, zal Ik verzamelen, zij zijn uit u; de smaad is een last op haar.","Joh 14:7":"Als u Mij gekend had, zou u ook Mijn Vader gekend hebben; en van nu af kent u Hem, en hebt Hem gezien.","Micha 3:5-7":"Zo zegt de HEERE, tegen de profeten, die Mijn volk verleiden; die met hun tanden bijten, en vrede uitroepen; maar tegen hem die niet in hun mond geeft, tegen die heiligen zij een oorlog. Daarom zal het nacht voor u worden vanwege het visioen, en u zal duisternis zijn vanwege de waarzegging; en de zon zal over deze profeten ondergaan; en de dag zal over hen zwart worden. En de zieners zullen beschaamd, en de waarzeggers schaamrood worden; en zij zullen allen samen de bovenlip bewimpelen; want er zal geen antwoord van God zijn.","1 Kor 7:32-34":"En ik wil dat u zonder zorgen bent. De ongetrouwde bekommert zich met de dingen van de Heere, hoe hij de Heere zal behagen; maar wie getrouwd is, bekommert zich met de dingen van de wereld, hoe hij de vrouw zal behagen. Een vrouw en een maagd zijn verschillend. De ongetrouwde bekommert zich met de dingen van de Heere, opdat zij heilig is, zowel naar lichaam als naar geest; maar wie getrouwd is, bekommert zich met de dingen van de wereld, hoe zij de man zal behagen.","Ps 22:30":"Alle vetten op aarde zullen eten, en aanbidden; allen die in het stof neerdalen, zullen voor Zijn aangezicht neerbukken; en die zijn ziel bij het leven niet kan houden.","1 Kor 11:16-19":"Maar als iemand meent twistgierig te moeten zijn: wij hebben zulke gewoonten niet, en de Gemeenten van God ook niet. Dit nu, wat ik u aanzeg, prijs ik niet, namelijk dat u niet tot beter, maar tot erger samenkomt. Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;","Luk 11:17":"Maar Hij, die hun gedachten kende, zei tegen hen: Elk koninkrijk dat tegen zichzelf verdeeld is, wordt verwoest; en een huis dat tegen zichzelf verdeeld is, valt.","1 Tim 1:3-7":"Zoals ik u vermaand heb dat u in Efeze zou blijven, toen ik naar Macedonië reisde, zo vermaan ik het u nog, opdat u sommigen zou bevelen geen andere leer te leren; Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is. Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.","1 Kor 15:23":"Maar ieder in zijn eigen orde: de eersteling Christus, daarna zij die van Christus zijn, bij Zijn komst.","1 Kor 7:29-31":"Maar dit zeg ik, broeders: dat de tijd voortaan kort is; opdat ook zij die vrouwen hebben, zouden zijn alsof zij ze niet hadden; en zij die wenen, alsof zij niet weenden; en zij die blij zijn, alsof zij niet blij waren; en zij die kopen, alsof zij niet bezaten; en zij die deze wereld gebruiken, alsof zij die niet misbruikten; want de gedaante van deze wereld gaat voorbij.","1 Tim 3:15":"maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.","2 Tim 2:15":"Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt.","Ps 38:4":"Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.","Ps 51:21":"Dan zult U lust hebben aan de offeranden van de gerechtigheid, aan brandoffer en een offer dat helemaal verteerd wordt; dan zullen zij jonge stieren offeren op Uw altaar.","Openb 2:18":"En schrijf aan de engel van de gemeente te Thyatire: Dit zegt de Zoon van God, Die Zijn ogen heeft als een vlam van vuur, en Zijn voeten blinkend koper gelijk zijn:","Nahum 2:1":"De verstrooier trekt tegen uw aangezicht op; bewaar de vesting; bezie de weg; sterk de lenden, versterk de kracht zeer.","Hand 9:20-29":"En hij predikte meteen Christus in de synagogen, dat Hij de Zoon van God is. En allen die het hoorden, waren verbaasd en zeiden: Is dit niet degene die in Jeruzalem verwoestte wie deze Naam aanriepen, en die daarom hierheen gekomen is, opdat hij hen gebonden zou brengen naar de overpriesters? Maar Saulus werd steeds sterker, en bracht de Joden die in Damaskus woonden in verwarring, doordat hij bewees dat Deze de Christus is.","Hebr 12:6":"Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.","Joh 6:32":"Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: Mozes heeft u niet het brood uit de hemel gegeven; maar Mijn Vader geeft u dat ware Brood uit de hemel.","Openb 2:20-23":"Maar Ik heb enkele weinige dingen tegen u, dat u de vrouw Izébel toelaat, die zichzelf een profetes noemt, te leren en Mijn dienstknechten te verleiden, zodat zij hoereren en afgodenoffer eten. En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd. Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.","1 Tess 4:2":"Want u weet, wat bevelen wij u gegeven hebben door de Heere Jezus.","1 Kor 12:10":"En aan een ander de werkingen van krachten; en aan een ander profetie; en aan een ander het onderscheiden van geesten; en aan een ander allerlei talen; en aan een ander uitleg van de talen.","Mark 8:38":"Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.","Ps 118:18":"De HEERE heeft mij wel hard gekastijd; maar Hij heeft mij niet ter dood overgegeven.","1 Kor 2:13":"Die dingen spreken wij ook, niet met woorden die de menselijke wijsheid leert, maar met woorden die de Heilige Geest leert, terwijl wij geestelijke dingen met geestelijke vergelijken.","2 Kron 5:14":"En de priesters konden, vanwege die wolk, niet staan om te dienen; want de heerlijkheid van de HEERE had het huis van God vervuld.","Deut 31:26":"Neem dit wetboek, en leg het aan de zijde van de ark van het verbond van de HEERE, uw God, opdat het daar tot getuige zij tegen u.","Ps 119:89":"Lamed. O HEERE! Uw woord bestaat in de eeuwigheid in de hemelen.","Deut 31:17":"Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is?","1 Joh 5:18":"Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.","Hebr 10:28":"Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;","Spr 17:19":"Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt zijn ondergang.","Joh 10:36-38":"zegt u dan tegen Mij, Die de Vader geheiligd en in de wereld gezonden heeft: U lastert God; omdat Ik gezegd heb: Ik ben Gods Zoon? Als Ik de werken van Mijn Vader niet doe, geloof Mij dan niet; maar als Ik ze doe, en u Mij niet gelooft, geloof dan de werken; opdat u mag weten en geloven dat de Vader in Mij is, en Ik in Hem.","2 Petr 3:1":"Deze tweede brief, geliefden, schrijf ik nu aan u; in beide brieven wek ik door herinnering uw oprechte gemoed op;","1 Tess 4:14":"Want als wij geloven dat Jezus gestorven is en opgestaan, zo zal God ook hen die in Jezus ontslapen zijn, met Hem terug brengen.","Tit 3:10":"Verwerp iemand die een ketter is, na de eerste en tweede vermaning;","Spr 30:21-23":"Om drie dingen beeft de aarde, ja, om vier, die zij niet kan dragen: Om een knecht, als hij regeert; en een dwaas, als hij verzadigd is met brood; Om een hatelijke vrouw, als zij getrouwd wordt; en een dienstmaagd, als zij erfgenaam wordt van haar vrouw.","Zach 12:1":"De last van het woord van de HEERE over Israël. De HEERE spreekt, Die de hemel uitbreidt, en de aarde grondvest, en de geest van de mens in zijn binnenste formeert.","Micha 6:9":"De stem van de HEERE roept tot de stad (want Uw Naam ziet het wezen): Hoor de roede, en wie haar besteld heeft!","Hand 15:1-31":"En sommigen, die uit Judea afgekomen waren, leerden de broeders en zeiden: Als u niet besneden wordt naar de wijze van Mozes, kunt u niet zalig worden. Toen er dan geen kleine weerstand en twist ontstond bij Paulus en Barnabas tegen hen, hebben zij afgesproken dat Paulus en Barnabas, en enigen van de anderen, naar de apostelen en oudsten in Jeruzalem zouden opgaan over deze vraag. Zij dan, door de gemeente uitgeleid, reisden door Fenicië en Samaria en vertelden over de bekering van de heidenen; en zij deden alle broeders grote blijdschap aan.","Gen 3:16":"Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen.","Hebr 1:2":"Die Hij gesteld heeft tot Erfgenaam van alles, door Wie Hij ook de wereld gemaakt heeft;","Gen 45:24":"En hij zond zijn broers heen; en zij vertrokken; en hij zei tegen hen: Maak geen ruzie op de weg.","Openb 1:3":"Zalig is hij die leest, en zij die horen de woorden van deze profetie, en die bewaren wat daarin geschreven is; want de tijd is nabij.","Ef 1:12":"Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.","Amos 5:8":"Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.","1 Kon 2:4":"opdat de HEERE Zijn woord bevestigt, dat Hij over mij gesproken heeft, toen Hij zei: Als uw zonen hun weg bewaren, om voor Mijn aangezicht trouw, met hun hele hart en met hun hele ziel te wandelen, dan zal het u nooit ontbreken, zei Hij, aan een man op de troon van Israël.","Hebr 12:28":"Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.","Jes 45:18":"Want zo zegt de HEERE, Die de hemelen geschapen heeft, die God, Die de aarde gevormd heeft, en Die haar gemaakt heeft; Hij heeft haar bevestigd, Hij heeft haar niet geschapen opdat zij leeg zou zijn, maar heeft haar gevormd opdat men daarin zou wonen: Ik ben de HEERE, en niemand meer.","1 Tim 4:5":"want het wordt geheiligd door het Woord van God en door het gebed.","2 Kor 11:19":"Want u verdraagt de onwijzen graag, omdat u zelf wijs bent.","Ef 6:20":"waarvoor ik een gezant ben in een keten, opdat ik daarin vrijmoedig mag spreken, zoals het mij past te spreken.","Joh 5:45":"Denk niet dat Ik u zal aanklagen bij de Vader; hij die u aanklaagt, is Mozes, op wie u gehoopt hebt.","Spr 19:27":"Laat af, mijn zoon, om, terwijl u de tucht hoort, af te dwalen van de woorden van de kennis.","Job 33:11":"Hij legt mijn voeten in de stok; Hij neemt al mijn paden waar.","Ezech 6:10":"En zij zullen weten dat Ik de HEERE ben; Ik heb niet zonder reden gesproken over het aandoen van dit kwaad aan hen.","Luk 11:46-52":"Maar Hij zei: Wee ook u, wetgeleerden! want u belast de mensen met lasten die zwaar zijn om te dragen, en zelf raakt u die lasten niet aan met één van uw vingers. Wee u, want u bouwt de graven van de profeten, en uw vaders hebben hen gedood. Zo getuigt u dus dat u instemt met de daden van uw vaderen; want zij hebben hen gedood, en u bouwt hun graven.","Joh 6:64":"Maar er zijn sommigen onder u die niet geloven. Want Jezus wist vanaf het begin wie het waren die niet geloofden, en wie het was die Hem zou verraden.","2 Tim 2:9":"waarvoor ik verdrukkingen lijd tot aan boeien toe, als een misdadiger; maar het Woord van God is niet gebonden.","Ps 89:48":"Gedenk wat voor eeuw ik ben; waarom zou Gij alle mensenkinderen tevergeefs geschapen hebben?","Fil 4:11":"Niet dat ik dit zeg vanwege gebrek; want ik heb geleerd tevreden te zijn in de omstandigheden waarin ik ben.","Joh 3:34":"Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate.","Joh 16:15":"Alles wat de Vader heeft, is van Mij; daarom heb Ik gezegd dat Hij het uit het Mijne zal nemen, en het u zal verkondigen.","Ef 5:24":"Daarom, zoals de Gemeente aan Christus onderdanig is, zo ook de vrouwen aan hun eigen mannen in alles.","1 Kor 10:12":"Wie dan meent te staan, laat hij toezien dat hij niet valt.","2 Kron 7:14":"En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.","Matt 21:42":"Jezus zei tegen hen: Hebt u nooit gelezen in de Schriften: De steen die de bouwers verworpen hebben, die is geworden tot een hoeksteen; dit is door de Heere gedaan, en het is wonderlijk in onze ogen?","Ef 5:26":"opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord,","Fil 4:5":"Uw vriendelijkheid moet bij alle mensen bekend zijn. De Heere is nabij.","1 Petr 5:1-3":"De oudsten die onder u zijn, vermaan ik, die een medeoudste en getuige van het lijden van Christus ben, en deelachtig aan de heerlijkheid die geopenbaard zal worden: Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed; ook niet als heersers over het erfdeel van de Heere, maar als voorbeelden voor de kudde.","Mark 4:20":"En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderdvoud.","2 Tim 4:8":"Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.","1 Tim 4:1":"De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen,","1 Kor 4:19":"Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.","Matt 23:13":"Maar wee u, Schriftgeleerden en Farizeeën, huichelaars! Want u sluit het Koninkrijk der hemelen voor de mensen, want u gaat er zelf niet in, en degenen die er in willen gaan, laat u niet ingaan.","E oofd hebt.","Hand 24:5":"Want wij hebben deze man bevonden een pest te zijn, en iemand die oproer verwekt onder alle Joden, door de hele wereld, en een leidend voorstander van de sekte der Nazarenen.","Jes 43:28":"Daarom zal Ik de leiders van het heiligdom ontheiligen, en Jakob ten ban overgeven, en Israël tot beschimpingen.","Job 9:8":"Die alleen de hemelen uitbreidt, en treedt op de hoogten van de zee;","Luk 12:59":"Ik zeg u: u zult daar geenszins uitgaan, totdat u ook de laatste penning betaald hebt.","Zach 11:16":"Want zie, Ik zal een herder verwekken in dit land; wat gereed is om afgesneden te worden, zal hij niet bezoeken; het jonge zal hij niet zoeken, en het verbrokene zal hij niet helen, en het stilstaande zal hij niet dragen; maar het vlees van het vette zal hij eten, en hun klauwen zal hij verscheuren.","1 Kor 1:10":"Maar ik bid u, broeders, door de Naam van onze Heere Jezus Christus, dat u allen hetzelfde spreekt, en dat er onder u geen scheuringen zijn, maar dat u samengevoegd bent tot eenzelfde zin en tot eenzelfde gevoelen.","Ps 63:3":"Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien;","Jes 25:6":"En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.","Matt 25:19":"En na lange tijd kwam de heer van die dienstknechten, en hield afrekening met hen.","Hebr 2:1":"Daarom moeten wij ons des te meer houden aan wat wij gehoord hebben, opdat wij het niet op enig moment laten wegglijden.","Ps 128:4":"Zie, zo zal die man zeker gezegend worden, die de HEERE vreest.","Ps 35:18":"Zo zal ik U loven in de grote gemeente; onder machtig veel volk zal ik U prijzen.","Joh 12:28":"Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.","Ex 24:3":"Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen.","Jes 55:4":"Zie, Ik heb hem tot een getuige van de volken gegeven, een vorst en gebieder van de volken.","Kol 1:18":"en Hij is het Hoofd van het lichaam, namelijk van de Gemeente, Hij, Die het Begin is, de Eerstgeborene uit de doden, opdat Hij in alles de Eerste zou zijn.","Luk 13:26":"Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven.","Spr 22:21":"om u de zekerheid van de woorden van de waarheid bekend te maken, opdat u de woorden van de waarheid kunt beantwoorden aan hen die u zenden?","Ps 126:1-3":"Een lied Hammaäloth. Toen de HEERE de gevangenen van Sion terugbracht, waren wij als mensen die dromen. Toen was onze mond vol lachen, en onze tong vol gejuich; toen zei men onder de heidenvolken: De HEERE heeft grote dingen aan hen gedaan. De HEERE heeft grote dingen bij ons gedaan; daarom zijn wij verblijd.","1 Kor 11:20-22":"Als u dan bijeen samenkomt, is dat niet het avondmaal van de Heere eten. Want bij het eten neemt ieder van tevoren zijn eigen avondmaal; en de een is hongerig, en de ander is dronken. Hebt u dan geen huizen om te eten en te drinken? Of veracht u de Gemeente van God, en beschaamt u degenen die niets hebben? Wat zal ik u zeggen? Zal ik u prijzen? Hierin prijs ik u niet.","Jes 55:1-3":"O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.","Hand 20:33":"Ik heb niemands zilver, of goud, of kleding begeerd.","Hand 17:17":"Hij sprak dan in de synagoge met de Joden, en met hen die godsdienstig waren, en op de markt elke dag met hen die hij daar aantrof.","Ps 26:2-7":"Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart. Want Uw goedertierenheid is voor mijn ogen, en ik wandel in Uw waarheid. Ik zit niet bij nietswaardige mensen, en met huichelaars ga ik niet om.","Fil 2:3":"Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.","1 Tim 6:3-5":"Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.","Hebr 1:3":"Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;","Hebr 5:7":"Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.","Hand 19:21":"En toen deze dingen volbracht waren, nam Paulus zich in de Geest voor om, na Macedonië en Achaje doorgereisd te hebben, naar Jeruzalem te reizen, en zei: Nadat ik daar geweest zal zijn, moet ik ook Rome zien.","Ps 27:4":"Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.","1 Kor 14:23":"Als dan de hele Gemeente bijeengebracht is, en zij allen in vreemde
