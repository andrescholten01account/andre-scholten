nder hen, wie van hen scheen de meeste te zijn.","Spr 8:34":"Gelukkig is de mens die naar Mij hoort, dagelijks wakend aan Mijn poorten, wachtend bij de posten van Mijn deuren.","Jes 1:25-27":"En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen. En Ik zal u uw rechters teruggeven, als in het begin, en uw raadslieden als in het begin; daarna zult u een stad van de gerechtigheid, een trouwe stad, genoemd worden. Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.","Jes 30:29":"Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.","Rom 9:6":"Maar ik zeg dit niet alsof het woord van God vervallen zou zijn; want niet allen die uit Israël zijn, zijn Israël.","2 Kor 3:14":"Maar hun gedachten zijn verhard geworden; want tot op deze huidige dag blijft datzelfde deksel bij het lezen van het Oude Testament, zonder weggenomen te worden, dat door Christus teniet gedaan wordt.","Openb 3:7":"En schrijf aan de engel van de gemeente die in Filadelfia is: Dit zegt de Heilige, de Waarachtige, Die de sleutel van David heeft; Die opent, en niemand sluit, en Hij sluit, en niemand opent:","Joh 6:51":"Ik ben het levende Brood, dat uit de hemel neergedaald is; als iemand van dit Brood eet, zal hij eeuwig leven. En het Brood dat Ik geven zal, is Mijn vlees, dat Ik geven zal voor het leven van de wereld.","Job 5:6":"Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde;","Matt 5:32":"Maar Ik zeg u, dat ieder die zijn vrouw verlaat, anders dan vanwege hoererij, maakt dat zij overspel doet; en wie haar die verlaten is trouwt, doet overspel.","Hand 28:30":"En Paulus bleef twee volle jaren in zijn eigen gehuurde woning; en ontving allen die naar hem toe kwamen;","Joh 21:19":"En dit zei Hij, om aan te duiden met wat voor dood hij God verheerlijken zou. En toen Hij dit gezegd had, zei Hij tegen hem: Volg Mij.","Deut 31:7":"En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven.","1 Kor 7:2-6":"Maar om de hoererijen te vermijden zal ieder man zijn eigen vrouw hebben, en iedere vrouw zal haar eigen man hebben. De man zal aan de vrouw geven wat hij haar schuldig is aan genegenheid; en net zo ook de vrouw aan de man. De vrouw heeft niet de macht over haar eigen lichaam, maar de man; en net zo heeft ook de man niet de macht over zijn eigen lichaam, maar de vrouw.","2 Petr 1:4":"Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.","Deut 4:2":"U mag aan dit woord, dat ik u gebied, niets toevoegen, en er ook niets van afdoen; opdat u de geboden bewaart van de HEERE, uw God, die ik u gebied.","Spr 28:25":"Wie hoogmoedig van hart is, verwekt ruzie; maar wie op de HEERE vertrouwt, zal welvarend worden.","Deut 30:1-3":"Verder zal het gebeuren, wanneer al deze dingen over u gekomen zijn, deze zegen of deze vloek, die ik u voorgesteld heb; zo zult u het weer ter harte nemen, onder alle volken, waarheen de HEERE, uw God, u gedreven heeft; En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel. En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had.","1 Petr 5:10":"En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.","Spr 27:5":"Openbare bestraffing is beter dan verborgen liefde.","Jes 1:14":"Uw nieuwe manen en uw vastgestelde hoogtijden haat Mijn ziel, zij zijn Mij tot een last; Ik ben moe geworden, ze te dragen.","Ps 84:2-5":"Hoe lieflijk zijn Uw woningen, o HEERE van de heerscharen! Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God. Zelfs vindt de mus een huis, en de zwaluw een nest voor zich, waar zij haar jongen legt, bij Uw altaren, HEERE van de heerscharen, mijn Koning, en mijn God!","1 Kor 11:20-34":"Als u dan bijeen samenkomt, is dat niet het avondmaal van de Heere eten. Want bij het eten neemt ieder van tevoren zijn eigen avondmaal; en de een is hongerig, en de ander is dronken. Hebt u dan geen huizen om te eten en te drinken? Of veracht u de Gemeente van God, en beschaamt u degenen die niets hebben? Wat zal ik u zeggen? Zal ik u prijzen? Hierin prijs ik u niet.","Hand 15:30-36":"Zij dan, hun afscheid ontvangen hebbend, kwamen in Antiochië; en nadat zij de menigte hadden samengeroepen, gaven zij de brief af. En toen zij die gelezen hadden, verblijdden zij zich over de bemoediging. Judas nu en Silas, die zelf ook profeten waren, bemoedigden de broeders met veel woorden, en versterkten hen.","1 Tess 4:16":"Want de Heere Zelf zal met een geroep, met de stem van de aartsengel, en met de bazuin van God neerdalen van de hemel; en zij die in Christus gestorven zijn, zullen eerst opstaan;","1 Kor 3:3":"Want u bent nog vleselijk; want omdat er onder u nijd is, en twist, en tweedracht, bent u niet vleselijk, en wandelt u niet naar de mens?","Spr 16:17":"De weg van de oprechten is van het kwaad af te wijken; hij bewaart zijn ziel, die zijn weg bewaakt.","Matt 11:13":"Want al de profeten en de wet hebben tot Johannes toe geprofeteerd.","1 Kor 9:10":"Of zegt Hij dat helemaal om onzentwil? Want om onzentwil is dat geschreven; omdat wie ploegt, moet ploegen op hoop, en wie op hoop dorst, moet ook zijn hoop deelachtig worden.","Hand 17:25":"En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft;","Pred 5:1":"Wees niet te snel met uw mond, en laat uw hart niet haasten om een woord voort te brengen voor Gods aangezicht; want God is in de hemel, en u bent op de aarde; daarom laat uw woorden weinig zijn.","Joh 16:32":"Zie, de tijd komt, en is nu gekomen, dat u verstrooid zult worden, ieder naar het zijne, en u Mij alleen zult laten; en toch ben Ik niet alleen, want de Vader is met Mij.","1 Tim 1:5-7":"Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof. Van wie sommigen afgeweken zijn en zich gewend hebben tot ijdel gepraat; Zij willen leraars van de wet zijn, maar begrijpen niet wat zij zeggen, en ook niet waarover zij zo stellig spreken.","1 Tim 6:4":"is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens,","Rom 9:1-3":"Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest), dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is. Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;","Joz 3:9":"Toen zei Jozua tegen de kinderen van Israël: Kom hier, en hoor de woorden van de HEERE, uw God.","Pred 9:9":"Geniet het leven met de vrouw die u liefhebt, al de dagen van uw vergankelijke leven, dat God u gegeven heeft onder de zon, al uw vergankelijke dagen; want dit is uw deel in dit leven en van uw arbeid, die u verricht onder de zon.","Luk 22:20":"Net zo ook de drinkbeker na de maaltijd, en zei: Deze drinkbeker is het nieuwe testament in Mijn bloed, dat voor u vergoten wordt.","1 Petr 5:4":"En als de opperste Herder verschenen zal zijn, zult u de onverwelkbare kroon van de heerlijkheid ontvangen.","Jes 55:10":"Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter;","Jer 23:25-39":"Ik heb gehoord wat de profeten zeggen, die in Mijn Naam leugen profeteren, en zeggen: Ik heb gedroomd, ik heb gedroomd. Hoe lang? Is er dan een droom in het hart van de profeten, die de leugen profeteren? Ja, het zijn profeten van de bedriegerij van hun eigen hart. Die daar denken om Mijn volk Mijn Naam te doen vergeten, door hun dromen, die zij, ieder aan zijn naaste, vertellen; net zoals hun vaders Mijn Naam vergeten hebben door Baäl.","Joh 19:34":"Maar een van de soldaten doorstak Zijn zijde met een speer, en meteen kwam er bloed en water uit.","Ps 104:2":"Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn.","Rom 3:25":"Hem heeft God voorgesteld tot een verzoening, door het geloof in Zijn bloed, tot een betoning van Zijn gerechtigheid, door de vergeving van de zonden die eerder gebeurd zijn, tijdens de verdraagzaamheid van God;","Joh 8:28":"Jezus zei dan tegen hen: Wanneer u de Zoon des mensen verhoogd zult hebben, dan zult u weten dat Ik Die ben, en dat Ik niets uit Mijzelf doe; maar Ik spreek deze dingen zoals Mijn Vader Mij geleerd heeft.","Openb 15:4":"Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.","Num 36:8":"Verder zal elke dochter die een erfenis erft, van de stammen van de kinderen van Israël, de vrouw worden van iemand uit het geslacht van de stam van haar vader; opdat de kinderen van Israël erfelijk bezitten, ieder de erfenis van zijn vaderen.","1 Tim 1:4":"Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is.","Jak 1:21-25":"Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken. En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel;","Hos 6:9":"Zoals de benden van straatrovers op iemand wachten, zo is het gezelschap van de priesters; zij moorden op de weg naar Sichem, waarlijk, zij doen schandelijke daden.","Mark 14:23":"En Hij nam de drinkbeker, en nadat Hij gedankt had, gaf Hij hun die; en zij dronken allen daaruit.","Mark 12:24":"En Jezus antwoordde en zei tegen hen: Dwaalt u niet daarom, omdat u de Schriften niet kent, en ook de kracht van God niet?","Ef 1:22":"En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;","2 Tim 4:3":"Want er zal een tijd komen dat zij de gezonde leer niet zullen verdragen, maar doordat hun oren jeuken, zullen zij zich naar hun eigen begeerten leraars in menigte bijeenzoeken;","Ps 95:6":"Komt, laat ons aanbidden en neerbukken; laat ons knielen voor de HEERE, Die ons gemaakt heeft.","Matt 26:13":"Voorwaar, Ik zeg u: waar dit Evangelie ook gepredikt zal worden in de hele wereld, daar zal ook, tot haar gedachtenis, verteld worden wat zij gedaan heeft.","Ef 1:10":"Om in de bedeling van de volheid der tijden alles weer tot één te vergaderen in Christus, zowel wat in de hemel is, als wat op de aarde is;","Deut 27:8":"En u zult op deze stenen alle woorden van deze wet schrijven, die goed uitdrukkend.","2 Kor 11:1-31":"Och, of u mij een weinig verdroeg in de onwijsheid; ja, verdraag mij ook! Want ik ben ijverig over u met een ijver van God; want ik heb u toebereid om u als een reine maagd aan één man voor te stellen, namelijk aan Christus. Doch ik vrees dat, zoals de slang Eva door haar arglistigheid bedrogen heeft, zo ook uw gedachten op enigerlei wijze bedorven worden, om af te wijken van de eenvoudigheid die in Christus is.","1 Kor 4:6":"En deze dingen, broeders, heb ik op mijzelf en Apollos bij wijze van voorbeeld toegepast, om uwentwil; opdat u van ons zou leren niet te denken boven wat geschreven is, opdat u niet, de een om de ander, opgeblazen wordt tegen elkaar.","Joh 7:28":"Jezus riep dan in de tempel, terwijl Hij leerde, en zei: U kent Mij, en u weet van waar Ik ben; en Ik ben niet uit Mijzelf gekomen, maar Hij die Mij gezonden heeft, is waarachtig, Hem kent u niet.","Gen 20:16":"En tegen Sara zei hij: Zie, ik heb uw broeder duizend zilverlingen gegeven; zie, dat moet voor u een bedekking van de ogen zijn, voor allen die bij u zijn, ja, tegenover allen, en wees terechtgewezen.","Lev 10:3":"En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.","1 Tim 2:9-15":"Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding; maar (wat past bij vrouwen die de godsvrucht belijden) door goede werken. Een vrouw moet zich laten leren in stilte, in alle onderdanigheid.","Matt 16:28":"Voorwaar, Ik zeg u: Er zijn sommigen van hen die hier staan, die de dood niet zullen smaken, totdat zij de Zoon des mensen zullen hebben zien komen in Zijn Koninkrijk.","Jes 51:7":"Hoor naar Mij, u die de gerechtigheid kent, u volk, in wiens hart Mijn wet is! Vrees niet de smaad van de mens, en voor hun smaadredenen hoeft u niet ontzet te zijn.","Spr 28:26":"Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.","Jes 58:1-4":"Roep uit de keel, houd niet in, verhef uw stem als een bazuin, en verkondig Mijn volk hun overtreding, en het huis van Jakob hun zonden. Hoewel zij Mij dagelijks zoeken en een lust hebben aan de kennis van Mijn wegen, als een volk dat gerechtigheid doet en het recht van zijn God niet verlaat, vragen zij Mij naar de rechten van de gerechtigheid; zij hebben een lust om tot God te naderen; En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid.","2 Kor 5:14":"Want de liefde van Christus dringt ons;","1 Tess 5:23":"En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.","Ps 17:4":"Wat de handelingen van de mensen betreft, ik heb mij, naar het woord van Uw lippen, gewacht voor de paden van de inbreker;","Luk 16:29":"Abraham zei tegen hem: Zij hebben Mozes en de profeten, laat zij die horen.","Jer 22:29":"O land, land, land! hoor het woord van de HEERE!","Ps 94:13":"Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.","Ex 12:14":"En deze dag zal voor u een gedachtenis zijn, en u zult hem als een feest voor de HEERE vieren; u zult hem vieren onder uw geslachten, als een eeuwige inzetting.","Ex 22:17":"Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.","Ps 149:1":"Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten.","Ps 132:7":"Wij zullen in Zijn woningen ingaan, wij zullen ons neerbuigen voor de voetbank van Zijn voeten.","Hand 2:33":"Hij dan, door de rechterhand van God verhoogd, en de belofte van de Heilige Geest ontvangen hebbend van de Vader, heeft dit uitgestort, wat u nu ziet en hoort.","Spr 22:10":"Jaag de spotter weg, en het gekijf zal weggaan, en het geschil met de schande zal ophouden.","Mark 13:9-23":"Maar let u zelf op; want zij zullen u overleveren aan de raadsvergaderingen, en aan de synagogen; u zult geslagen worden, en u zult voor stadhouders en koningen gebracht worden, omwille van Mij, hun tot een getuigenis. En het Evangelie moet eerst gepredikt worden onder alle volken. Maar wanneer zij u zullen wegleiden om u over te leveren, maak u dan niet vooraf bezorgd over wat u zult spreken, en bedenk het niet van tevoren; maar wat u in dat uur gegeven zal worden, spreek dat; want u bent het niet die spreekt, maar de Heilige Geest.","Jer 6:14":"En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Doch daar is geen vrede.","Ef 4:15":"Maar dat wij, terwijl wij de waarheid betrachten in liefde, in alle dingen zouden opgroeien in Hem, Die het Hoofd is, namelijk Christus;","1 Kor 14:34":"Laat uw vrouwen in de Gemeenten zwijgen; want het is haar niet toegestaan te spreken, maar bevolen onderworpen te zijn, zoals ook de wet zegt.","Openb 2:12":"En schrijf aan de engel van de gemeente die in Pergamus is: Dit zegt Hij, Die het tweesnijdend scherpe zwaard heeft:","2 Petr 1:19-21":"En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten. Weet dit eerst, dat geen enkele profetie van de Schrift een eigen uitlegging heeft; Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.","Zach 13:2-5":"En het zal op die dag gebeuren, spreekt de HEERE van de heerscharen, dat Ik de namen van de afgoden uit het land zal uitroeien, zodat er niet meer aan gedacht wordt; en ook de profeten en de onreine geest zal Ik uit het land wegdoen. En het zal gebeuren, wanneer iemand nog profeteert, dat zijn vader en zijn moeder, die hem verwekt hebben, tegen hem zullen zeggen: U zult niet leven, omdat u leugens gesproken hebt in de Naam van de HEERE; en zijn vader en zijn moeder, die hem verwekt hebben, zullen hem doorsteken, wanneer hij profeteert. En het zal op die dag gebeuren, dat die profeten beschaamd zullen worden, ieder vanwege zijn visioen, wanneer hij profeteert; en zij zullen geen haren mantel aandoen om te liegen.","Joh 14:28":"U hebt gehoord dat Ik tot u gezegd heb: Ik ga heen, en kom weer naar u toe. Als u Mij liefhad, zou u zich verblijden, omdat Ik gezegd heb: Ik ga heen tot de Vader; want Mijn Vader is meer dan Ik.","Ef 5:22-24":"Vrouwen, wees uw eigen mannen onderdanig, zoals aan de Heere; want de man is het hoofd van de vrouw, zoals ook Christus het Hoofd van de Gemeente is; en Hij is de Behouder van het lichaam. Daarom, zoals de Gemeente aan Christus onderdanig is, zo ook de vrouwen aan hun eigen mannen in alles.","1 Kor 5:1-5":"Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft. En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden? Want ik, hoewel met het lichaam afwezig, maar aanwezig met de geest, heb al besloten, alsof ik aanwezig was, over hem die dit zo gedaan heeft:","Hebr 13:24":"Groet al uw voorgangers, en alle heiligen. Zij die uit Italië zijn, groeten u.","Ezech 14:10":"En zij zullen hun ongerechtigheid dragen; zoals de ongerechtigheid van de vrager zal zijn, zo zal de ongerechtigheid van de profeet zijn;","2 Tess 1:4":"Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;","Ps 119:74":"Die U vrezen, zullen mij aanzien, en zich verblijden, omdat ik op Uw woord gehoopt heb.","Hand 20:32":"En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.","Rom 10:17":"Zo is dan het geloof uit het gehoor, en het gehoor door het Woord van God,","Hand 20:35":"Ik heb u in alles getoond, dat men, zo arbeidend, de zwakken moet opnemen, en zich de woorden van de Heere Jezus herinneren, dat Hij gezegd heeft: Het is zaliger te geven dan te ontvangen.","1 Tess 4:15-17":"Want dit zeggen wij u door het Woord van de Heere, dat wij, die levend overblijven tot de komst van de Heere, hen die ontslapen zijn niet zullen voorgaan. Want de Heere Zelf zal met een geroep, met de stem van de aartsengel, en met de bazuin van God neerdalen van de hemel; en zij die in Christus gestorven zijn, zullen eerst opstaan; Daarna zullen wij, die levend overgebleven zijn, samen met hen opgenomen worden in de wolken, de Heere tegemoet, in de lucht; en zo zullen wij altijd bij de Heere zijn.","Hagg 1:7":"Zo zegt de HEERE van de heerscharen: Let goed op uw wegen.","Gen 2:1-25":"Zo zijn de hemel en de aarde voltooid, en heel hun leger. Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had. En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.","1 Kor 16:13":"Waakt, staat vast in het geloof, houdt u mannelijk, weest sterk.","Spr 4:25":"Laat uw ogen recht vooruit zien, en uw oogleden zich recht voor u heen richten.","2 Tess 1:10":"Wanneer Hij gekomen zal zijn om verheerlijkt te worden in Zijn heiligen, en bewonderd te worden in allen die geloven (omdat onze getuigenis onder u geloofd is) op die dag.","Kol 3:4":"Wanneer nu Christus geopenbaard zal zijn, Die ons leven is, dan zult ook u met Hem geopenbaard worden in heerlijkheid.","1 Tim 4:14":"Verwaarloos de gave niet die in u is, die u gegeven is door de profetie, met oplegging van de handen van het ouderlingschap.","Deut 22:13-21":"Wanneer een man een vrouw genomen heeft, en tot haar ingegaan is, en haar dan haat, En haar oorzaak geeft tot naspraak, en een kwade naam over haar verspreidt, en zegt: Deze vrouw heb ik genomen, en toen ik tot haar naderde, heb ik haar maagdelijkheid niet gevonden; Dan zullen de vader van deze jonge dochter en haar moeder haar meenemen, en naar de oudsten van de stad brengen, bij de poort, met het bewijs van de maagdelijkheid van deze jonge vrouw.","Hand 19:8-10":"En hij ging de synagoge in, en sprak vrijmoedig, drie maanden lang met hen sprekend, en hen aanradend om de zaken van het Koninkrijk van God aan te nemen. Maar toen sommigen verhard werden en ongehoorzaam waren, en kwaadspraken van de weg des Heeren voor de menigte, ging hij bij hen weg, en zonderde de discipelen af, dagelijks sprekend in de school van een zekere Tyrannus. En dit gebeurde twee jaar lang, zodat allen die in Azië woonden het Woord van de Heere Jezus hoorden, zowel Joden als Grieken.","Joh 5:43":"Ik ben gekomen in de Naam van Mijn Vader, en u neemt Mij niet aan; als een ander komt in zijn eigen naam, die zult u aannemen.","Deut 8:16":"Die u in de woestijn voedde met manna, dat uw vaderen niet gekend hadden; om u te verootmoedigen, en om u te beproeven, opdat Hij u uiteindelijk goeddeed;","Mark 10:6":"Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt.","Num 5:11-31":"Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tot hen: Wanneer de vrouw van iemand afgeweken zal zijn, en door overtreding tegen hem overtreden zal hebben, Doordat een man gemeenschap met haar gehad heeft, en het voor de ogen van haar man verborgen zal zijn, en zij zich verheeld zal hebben, terwijl zij toch onrein geworden is; en er geen getuige tegen haar is, en zij niet op heterdaad betrapt is;","Job 9:22":"Dat is één ding, daarom zeg ik: De oprechte en de goddeloze verdoet Hij.","Hand 17:3":"En legde ze uit, en toonde aan dat de Christus moest lijden en opstaan uit de doden, en dat deze Jezus de Christus is, Die ik, zei hij, u verkondig.","Hebr 2:10-18":"Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken. Want Hij Die heiligt, en zij die geheiligd worden, zijn allen uit één; om die reden schaamt Hij Zich niet hen broeders te noemen, En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.","Spr 3:11":"Mijn zoon! Verwerp de tucht van de HEERE niet, en word niet verdrietig over Zijn kastijding;","Joh 1:14":"En het Woord is vlees geworden, en heeft onder ons gewoond (en wij hebben Zijn heerlijkheid aanschouwd, een heerlijkheid als van de Eniggeborene van de Vader), vol van genade en waarheid.","1 Petr 5:8":"Wees nuchter en waakzaam; want uw tegenstander, de duivel, gaat rond als een brullende leeuw, op zoek naar wie hij zou kunnen verslinden.","Hand 13:5":"En toen zij in Salamis gekomen waren, verkondigden zij het woord van God in de synagogen van de Joden; en zij hadden ook Johannes als dienaar.","Gen 13:8":"En Abram zei tegen Lot: Laat er toch geen twist zijn tussen mij en u, en tussen mijn herders en uw herders; want wij zijn broeders.","Ef 5:22-33":"Vrouwen, wees uw eigen mannen onderdanig, zoals aan de Heere; want de man is het hoofd van de vrouw, zoals ook Christus het Hoofd van de Gemeente is; en Hij is de Behouder van het lichaam. Daarom, zoals de Gemeente aan Christus onderdanig is, zo ook de vrouwen aan hun eigen mannen in alles.","Deut 27:9":"Vervolgens sprak Mozes, samen met de Levitische priesters, tot heel Israël: Luister toe en hoor, o Israël! Op deze dag bent u het volk van de HEERE, uw God, geworden.","Ps 119:133":"Maak mijn voetstappen vast in Uw Woord, en laat geen ongerechtigheid over mij heersen.","Kol 2:1":"Want ik wil dat u weet hoe zware strijd ik voor u heb, en voor hen die in Laodicea zijn, en voor allen die mijn gezicht in het vlees niet gezien hebben;","Fil 2:14":"Doe alle dingen zonder murmureren en tegenspreken;","2 Kor 13:6-9":"Maar ik hoop dat u zult begrijpen, dat wij niet verwerpelijk zijn. En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn. Want wij vermogen niets tegen de waarheid, maar wel voor de waarheid.","2 Petr 1:19":"En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten.","Judas 1:12":"Deze mensen zijn vlekken in uw liefdemaaltijden, en als zij met u aan de maaltijd zijn, weiden zij zichzelf zonder vrees; zij zijn wolken zonder water, die door de winden rondgedreven worden; zij zijn als bomen aan het einde van de herfst, zonder vrucht, tweemaal gestorven, en ontworteld;","1 Kor 11:3-15":"Maar ik wil dat u weet, dat Christus het Hoofd is van iedere man, en de man het hoofd van de vrouw, en God het Hoofd van Christus. Iedere man die bidt of profeteert met iets op het hoofd, onteert zijn eigen hoofd; maar iedere vrouw die bidt of profeteert met ongedekt hoofd, onteert haar eigen hoofd; want het is een en hetzelfde, alsof haar het haar afgesneden was.","1 Kor 14:35":"En als zij iets willen leren, laat hen thuis hun eigen mannen vragen; want het staat lelijk voor de vrouwen dat zij in de Gemeente spreken.","Jes 12:5":"Zingt psalmen voor de HEERE, want Hij heeft heerlijke dingen gedaan; laat dat bekend zijn op de hele aardbodem.","1 Kor 10:17":"Want er is één brood, en zo zijn wij, hoewel velen, één lichaam, omdat wij allen deel hebben aan dat ene brood.","Lev 18:6-18":"Niemand zal tot enige nabestaande van het eigen vlees naderen, om de schaamte te ontdekken; Ik ben de HEERE! U zult de schaamte van uw vader en de schaamte van uw moeder niet ontdekken; zij is uw moeder; u zult haar schaamte niet ontdekken. U zult de schaamte van de vrouw van uw vader niet ontdekken; het is de schaamte van uw vader.","Spr 11:22":"Een mooie vrouw die geen verstand heeft, is een gouden ring in een varkenssnuit.","1 Kor 1:11-13":"Want mij is over u bekendgemaakt, mijn broeders, door hen die van het huisgezin van Chloë zijn, dat er twisten onder u zijn. En dit zeg ik, dat ieder van u zegt: Ik ben van Paulus; en ik van Apollos; en ik van Cefas; en ik van Christus. Is Christus gedeeld? Is Paulus voor u gekruisigd? Of bent u in de naam van Paulus gedoopt?","Ef 5:23-32":"want de man is het hoofd van de vrouw, zoals ook Christus het Hoofd van de Gemeente is; en Hij is de Behouder van het lichaam. Daarom, zoals de Gemeente aan Christus onderdanig is, zo ook de vrouwen aan hun eigen mannen in alles. Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven,","Ex 29:43":"En daar zal Ik komen tot de kinderen van Israël; opdat zij geheiligd worden door Mijn heerlijkheid.","Kol 2:8":"Kijk uit dat niemand u als een roof meesleept door de filosofie en loze verleiding, naar de overlevering van de mensen, naar de eerste beginselen van de wereld, en niet naar Christus;","Rom 15:3":"Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.","1 Joh 1:5":"En dit is de verkondiging die wij van Hem gehoord hebben, en wij verkondigen u, dat God een Licht is, en dat er in Hem helemaal geen duisternis is.","2 Petr 3:10":"Maar de dag van de Heere zal komen als een dief in de nacht; op die dag zullen de hemelen met een enorm gedruis voorbijgaan, en de elementen zullen brandend vergaan, en de aarde en de werken die daarop zijn, zullen verbranden.","Jes 28:13":"Zo zal het woord van de HEERE voor hen zijn: gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig; opdat zij heengaan, en achterwaarts vallen, en gebroken, en verstrikt en gevangen worden.","Joh 6:23":"(maar er kwamen andere scheepjes van Tiberias, dicht bij de plaats waar zij het brood gegeten hadden nadat de Heere gedankt had) —","Openb 1:7":"Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.","Ps 48:10":"O God! wij gedenken Uw weldadigheid, in het midden van Uw tempel.","2 Tim 2:14-18":"Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders. Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt. Maar verzet u tegen het ongoddelijk ijdel geklets; want zij zullen in meerdere goddeloosheid toenemen.","2 Tess 2:1-3":"En wij vragen u dringend, broeders, met het oog op de komst van onze Heere Jezus Christus, en onze samenkomst met Hem, dat u niet snel aan het wankelen wordt gebracht in uw denken, of verschrikt raakt, niet door een geest, niet door een woord, niet door een brief, alsof die van ons zou zijn, alsof de dag van Christus voor de deur staat. Laat niemand u op enige manier verleiden; want die dag komt niet, tenzij eerst de afval gekomen is, en de mens van de zonde geopenbaard wordt, de zoon van het verderf;","Matt 27:46":"En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?","1 Kor 15:3":"Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften;","Rom 10:1":"Broeders, de toegenegenheid van mijn hart en het gebed dat ik tot God doe voor Israël, is tot hun zaligheid.","Ezech 13:1-23":"En het woord van de HEERE gebeurde tot mij, en zei: Mensenkind, profeteer tegen de profeten van Israël, die profeteren, en zeg tegen hen die uit hun eigen hart profeteren: Hoor het woord van de HEERE. Zo zegt de Heere HEERE: Wee over die dwaze profeten, die hun eigen geest nawandelen, en wat zij niet gezien hebben!","1 Joh 4:1-3":"Geliefden, geloof niet elke geest, maar beproef de geesten, of zij uit God zijn; want veel valse profeten zijn uitgegaan in de wereld. Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God; en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.","Ps 85:9":"Ik zal horen wat God, de HEERE, spreken zal; want Hij zal tot Zijn volk en tot Zijn gunstgenoten van vrede spreken; maar laat hen niet weer tot dwaasheid terugkeren.","2 Petr 3:2":"Opdat u de woorden gedenkt die van tevoren gesproken zijn door de heilige profeten, en het gebod van ons, de apostelen van de Heere en Zaligmaker;","Joh 7:16":"Jezus antwoordde hun en zei: Mijn leer is niet van Mij, maar van Hem die Mij gezonden heeft.","Fil 1:18":"Wat dan? Toch wordt Christus op allerlei wijze, hetzij uit schijnmotief, hetzij in waarheid, verkondigd; en daarin verblijd ik mij, ja, ik zal mij ook verblijden.","Ps 119:72":"De wet van Uw mond is mij beter, dan duizenden van goud of zilver.","Hand 28:31":"Hij predikte het Koninkrijk van God, en onderwees over de Heere Jezus Christus, met alle vrijmoedigheid, zonder dat iemand hem daarin hinderde.","Rom 16:26":"maar nu geopenbaard is, en door de profetische Schriften, naar het bevel van de eeuwige God, tot gehoorzaamheid aan het geloof, onder alle heidenen bekendgemaakt is;","Gal 1:16":"om Zijn Zoon in mij te openbaren, opdat ik Hem door het Evangelie onder de heidenen zou verkondigen, ben ik meteen niet te rade gegaan met vlees en bloed;","Matt 26:27":"En Hij nam de drinkbeker, en na de dankzegging gaf Hij die aan hen en zei: Drinkt allen daaruit;","Jer 24:5":"Zo zegt de HEERE, de God van Israël: Zoals die goede vijgen, zo zal Ik de weggevoerden van Juda erkennen, die Ik uit deze plaats naar het land van de Chaldeeën heb weggestuurd, tot hun eigen goed.","Jes 40:26":"Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist.","Ps 147:19":"Hij maakt aan Jakob Zijn woorden bekend, aan Israël Zijn inzettingen en Zijn rechten.","Ps 90:15":"Verblijd ons naar de dagen, waarin U ons gedrukt hebt, naar de jaren, waarin wij het kwaad gezien hebben.","Deut 4:9":"Wacht u alleen, en let goed op uzelf, dat u niet vergeet wat uw ogen gezien hebben; en dat het niet uit uw hart wijkt, al de dagen van uw leven; en u zult het aan uw kinderen en uw kleinkinderen bekendmaken.","Jer 23:21":"Ik heb die profeten niet gezonden, toch hebben zij gelopen; Ik heb tot hen niet gesproken, toch hebben zij geprofeteerd.","Hebr 11:3":"Door het geloof begrijpen wij dat de wereld door het woord van God gemaakt is, zodat de dingen die men ziet niet ontstaan zijn uit dingen die zichtbaar zijn.","1 Tim 5:14":"Ik wil dan dat de jonge weduwen trouwen, kinderen krijgen, het huis besturen, en geen aanleiding tot smaad geven aan de tegenpartij.","Rom 16:18":"Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.","1 Kor 7:14":"Want de ongelovige man is geheiligd door de vrouw, en de ongelovige vrouw is geheiligd door de man; want anders waren uw kinderen onrein, maar nu zijn zij heilig.","Rom 2:19-25":"En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn, Een onderrichter van de onwijzen, en een leermeester van de onwetenden, terwijl u de vorm van de kennis en van de waarheid in de wet hebt. Die dan een ander leert, leert u uzelf niet? Die predikt dat men niet zal stelen, steelt u?","1 Kor 10:30":"En als ik door genade deel heb aan het voedsel, waarom word ik dan belasterd over iets waarvoor ik dank?","Matt 26:40":"En Hij kwam bij de discipelen en vond hen slapend, en zei tegen Petrus: Kunt u dan niet één uur met Mij waken?","1 Kor 10:33":"Zoals ik ook in alles allen probeer te behagen, niet mijn eigen voordeel zoekend, maar dat van velen, opdat zij behouden worden.","Kol 4:10":"U groet Aristarchus, mijn medegevangene; en Markus, de neef van Barnabas, over wie u opdrachten hebt ontvangen: als hij bij u komt, ontvang hem;","Ezech 44:10":"Maar de Levieten die ver van Mij weggegaan zijn, toen Israël ging dolen, die van Mij zijn afgedwaald, hun drekgoden  achterna, zullen wel hun ongerechtigheid dragen;","Jes 4:3":"En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem;","1 Tim 2:11":"Een vrouw moet zich laten leren in stilte, in alle onderdanigheid.","Ps 119:119":"U doet alle goddelozen van de aarde weg als schuim, daarom heb ik Uw getuigenissen lief.","1 Kor 14:40":"Laat alle dingen eerlijk en met orde gebeuren.","2 Kor 4:11":"Want wij, die leven, worden altijd om Jezus' wil in de dood overgegeven, opdat ook het leven van Jezus in ons sterfelijk vlees openbaar zou worden.","Joh 10:15":"Zoals de Vader Mij kent, zo ken Ik ook de Vader; en Ik geef Mijn leven voor de schapen.","Kol 1:5":"Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie;","Micha 2:11":"Als er iemand is die met wind omgaat en vals liegt, en zegt: Ik zal u profeteren van wijn en van sterke drank! dan is dat een profeet voor dit volk.","Deut 4:10":"Denk aan de dag dat u voor de HEERE, uw God, bij Horeb stond, toen de HEERE tegen mij zei: Verzamel dit volk voor Mij, en Ik zal hun Mijn woorden laten horen, die zij zullen leren, om Mij te vrezen al de dagen dat zij op de aardbodem leven, en zij zullen ze hun kinderen leren;","Luk 22:19":"En Hij nam brood, en toen Hij gedankt had, brak Hij het en gaf het hun, en zei: Dat is Mijn lichaam, dat voor u gegeven wordt; doe dat tot Mijn gedachtenis.","1 Kor 14:19":"Maar ik wil liever in de Gemeente vijf woorden spreken met mijn verstand, opdat ik ook anderen mag onderwijzen, dan tienduizend woorden in een vreemde taal.","Ezra 3:10-13":"Toen nu de bouwers de grond van de tempel van de HEERE legden, stelden zij de priesters op, gekleed in hun ambtskleding, met trompetten, en de Levieten, de zonen van Asaf, met cimbalen, om de HEERE te loven, naar de instelling van David, de koning van Israël. En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE. Maar velen van de priesters en de Levieten en hoofden van de families, die oud waren en het eerste huis gezien hadden, weenden met luide stem toen dit huis in hun grondlegging voor hun ogen was; maar velen verhieven de stem met gejuich en met vreugde.","Jes 8:19":"Wanneer zij dan tegen u zeggen zullen: Vraag waarzeggers en duivelskunstenaars, die daar piepen en binnensmonds mompelen; zo zeg: Zal een volk niet zijn God vragen? Zal men voor de levenden de doden vragen?","Hebr 10:7":"Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!","Matt 24:26":"Als zij dan tegen u zullen zeggen: Kijk, hij is in de woestijn, ga er niet heen; Kijk, hij is in de binnenkamers, geloof het niet.","Jes 40:28":"Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.","1 Petr 2:3":"Als u tenminste geproefd hebt dat de Heere goedertieren is.","Ps 24:2":"Want Hij heeft haar gegrond op de zeeën, en heeft haar gevestigd op de rivieren.","Fil 4:9":"Wat u ook geleerd, en ontvangen, en gehoord, en in mij gezien hebt, doe dat; en de God van de vrede zal met u zijn.","Jes 56:10-12":"Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig,
