rgt God soms voor de ossen?","10":"Of zegt Hij dat helemaal om onzentwil? Want om onzentwil is dat geschreven; omdat wie ploegt, moet ploegen op hoop, en wie op hoop dorst, moet ook zijn hoop deelachtig worden.","11":"Als wij u het geestelijke gezaaid hebben, is het dan een grote zaak, als wij het uwe, dat lichamelijk is, maaien?","12":"Als anderen deze macht over u deelachtig zijn, waarom wij dan niet veel meer? Toch hebben wij deze macht niet gebruikt, maar wij verdragen alles, opdat wij geen enkele verhindering geven aan het Evangelie van Christus.","13":"Weet u niet, dat wie de heilige dingen bedienen, van het heilige eten? En wie steeds bij het altaar zijn, met het altaar meedelen?","14":"Zo heeft ook de Heere geordend voor hen die het Evangelie verkondigen, dat zij van het Evangelie leven.","15":"Maar ik heb geen van deze dingen gebruikt. En ik heb dit niet geschreven, opdat het zo bij mij zou gebeuren; want het zou beter voor mij zijn te sterven, dan dat iemand deze mijn roem zou ijdel maken.","16":"Want als ik het Evangelie verkondig, is het voor mij geen roem; want de noodzaak is mij opgelegd. En wee mij, als ik het Evangelie niet verkondig!","17":"Want als ik dat gewillig doe, heb ik loon, maar als onwillig, is de uitdeling mij toch toevertrouwd.","18":"Wat loon heb ik dan? Namelijk dat ik, terwijl ik het Evangelie verkondig, het Evangelie van Christus kosteloos aanbied, om mijn macht in het Evangelie niet te misbruiken.","19":"Want daar ik van allen vrij was, heb ik mijzelf allen dienstbaar gemaakt, opdat ik er meer zou winnen.","20":"En ik ben voor de Joden geworden als een Jood, opdat ik de Joden zou winnen; voor hen die onder de wet zijn, ben ik geworden als onder de wet zijnde, opdat ik hen die onder de wet zijn, zou winnen.","21":"Voor hen die zonder de wet zijn, ben ik geworden als zonder de wet zijnde (voor God nochtans niet zonder de wet zijnde, maar voor Christus onder de wet), opdat ik hen die zonder de wet zijn, zou winnen.","22":"Ik ben voor de zwakken geworden als een zwakke, opdat ik de zwakken zou winnen; allen ben ik alles geworden, opdat ik in elk geval enigen zou behouden.","23":"En dit doe ik om het Evangelie, opdat ik daar mede deelachtig aan zou worden.","24":"Weet u niet, dat zij die in de loopbaan lopen, allen wel lopen, maar dat één de prijs ontvangt? Loop zo, dat u die mag verkrijgen.","25":"En ieder die om de prijs strijdt, onthoudt zich in alles. Zij doen dit wel, opdat zij een vergankelijke krans zouden ontvangen, maar wij een onvergankelijke.","26":"Ik loop dan zo, niet als op het onzekere; ik strijd zo, niet als iemand die de lucht slaat;","27":"Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word."},"SV":{"1":"Ben ik niet een apostel? Ben ik niet vrij? Heb ik niet Jezus Christus, onzen Heere, gezien? Zijt gijlieden niet mijn werk in den Heere?","2":"Zo ik anderen geen apostel ben, nochtans ben ik het ulieden; want het zegel mijns apostelschaps zijt gijlieden in den Heere.","3":"Mijn verantwoording aan degenen, die onderzoek over mij doen, is deze.","4":"Hebben wij niet macht, om te eten en te drinken?","5":"Hebben wij niet macht, om een vrouw, een zuster zijnde, *met* *ons* om te leiden, gelijk ook de andere apostelen, en de broeders des Heeren, en Cefas?","6":"Of hebben alleen ik en Barnabas geen macht van niet te werken?","7":"Wie dient ooit in den krijg op eigen bezoldiging? Wie plant een wijngaard, en eet niet van zijn vrucht? Of wie weidt een kudde, en eet niet van de melk der kudde?","8":"Spreek ik dit naar den mens, of zegt ook de wet hetzelfde niet?","9":"Want in de wet van Mozes is geschreven: Gij zult een dorsenden os niet muilbanden. Zorgt ook God voor de ossen?","10":"Of zegt Hij *dat* ganselijk om onzentwil? Want om onzentwil is *dat* geschreven; overmits die ploegt, op hoop moet ploegen, en die op hoop dorst, *moet* zijn hoop deelachtig worden.","11":"Indien wij ulieden het geestelijke gezaaid hebben, is het een grote *zaak*, zo wij het uwe, dat lichamelijk is, maaien?","12":"Indien anderen deze macht over u deelachtig zijn, *waarom* niet veel meer wij? Doch wij hebben deze macht niet gebruikt, maar wij verdragen het al, opdat wij niet enige verhindering geven aan het Evangelie van Christus.","13":"Weet gij niet, dat degenen, die de heilige dingen bedienen, van het heilige eten? *en* die steeds bij het altaar zijn, met het altaar delen?","14":"Alzo heeft ook de Heere geordineerd dengenen, die het Evangelie verkondigen, dat zij van het Evangelie leven.","15":"Maar ik heb geen van deze dingen gebruikt. En ik heb dit niet geschreven, opdat het alzo aan mij geschieden zou; want het ware mij beter te sterven, dan dat iemand dezen mijn roem zou ijdel maken.","16":"Want indien ik het Evangelie verkondige, het is mij geen roem; want de nood is mij opgelegd. En wee mij, indien ik het Evangelie niet verkondig!","17":"Want indien ik dat gewillig doe, zo heb ik loon, maar indien onwillig, de uitdeling is mij *evenwel* toebetrouwd.","18":"Wat loon heb ik dan? *Namelijk* dat ik, het Evangelie verkondigende, het Evangelie van Christus kosteloos stelle, om mijn macht in het Evangelie niet te misbruiken.","19":"Want daar ik van allen vrij was, heb ik mijzelven allen dienstbaar gemaakt, opdat ik er meer zou winnen.","20":"En ik ben den Joden geworden als een Jood, opdat ik de Joden winnen zou; dengenen, die onder de wet zijn, *ben* *ik* *geworden* als onder de wet zijnde, opdat ik degenen, die onder de wet zijn, winnen zou.","21":"Degenen, die zonder de wet zijn, *ben* *ik* *geworden* als zonder de wet zijnde ( Gode *nochtans* zijnde niet zonder de wet, maar voor Christus onder de wet), opdat ik degenen, die zonder de wet zijn, winnen zou.","22":"Ik ben den zwakken geworden als een zwakke, opdat ik de zwakken winnen zou; allen ben ik alles geworden, opdat ik immers enigen behouden zou.","23":"En dit doe ik om des Evangelies wil, opdat ik hetzelve mede deelachtig zou worden.","24":"Weet gijlieden niet, dat die in de loopbaan lopen, allen wel lopen, maar *dat* een den prijs ontvangt? Loopt alzo, dat gij *dien* moogt verkrijgen.","25":"En een iegelijk, die *om* *prijs* strijdt, onthoudt zich in alles. Dezen dan *doen* wel *dit*, opdat zij een verderfelijke kroon zouden ontvangen, maar wij een onverderfelijke.","26":"Ik loop dan alzo, niet als op het onzekere; ik kamp alzo, niet als de lucht slaande;","27":"Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet enigszins, daar ik anderen gepredikt heb, zelf verwerpelijk worde."},"KJV":{"1":"Am I not an apostle? am I not free? have I not seen Jesus Christ our Lord? are not ye my work in the Lord?","2":"If I be not an apostle unto others, yet doubtless I am to you: for the seal of mine apostleship are ye in the Lord.","3":"Mine answer to them that do examine me is this,","4":"Have we not power to eat and to drink?","5":"Have we not power to lead about a sister, a wife, as well as other apostles, and as the brethren of the Lord, and Cephas?","6":"Or I only and Barnabas, have ➔ not we power to forbear working?","7":"Who goeth a warfare any time at his own charges? who planteth a vineyard, and eateth not of the fruit thereof? or who feedeth a flock, and eateth not of the milk of the flock?","8":"Say I these things as a man? or saith not the law the same also?","9":"For it is written in the law of Moses, Thou shalt ➔ not muzzle the mouth of the ox that treadeth out the corn. Doth ➔ God take care for oxen?","10":"Or saith he it altogether for ➔ our sakes? For ➔ our sakes, no doubt, this is written: that he that ploweth should plow in hope; and that he that thresheth in hope should be partaker of his hope.","11":"If we have sown unto you spiritual things, is it a great thing if we shall reap your carnal things?","12":"If others be partakers of this power over you, are not we rather? Nevertheless we have ➔ not used this power; but suffer all things, lest we should hinder the gospel of Christ.","13":"Do ye ➔ not know that they which minister about holy things live of the things of the temple? and they which wait at the altar are partakers with the altar?","14":"Even so hath ➔ the Lord ordained that they which preach the gospel should live of the gospel.","15":"But I have used none of these things: neither have I written these things, that it should be ➔ so done unto me: for it were better for me to die, than that any man should make ➔ my glorying void.","16":"For though I preach the gospel, I have nothing to glory of: for necessity is laid upon me; yea, woe is unto me, if ➔ I preach ➔ not the gospel!","17":"For if I do this thing willingly, I have a reward: but if against my will, a dispensation of the gospel is committed unto me.","18":"What is my reward then? Verily that, when I preach the gospel, I may make the gospel of Christ without charge, that I abuse not my power in the gospel.","19":"For though I be free from all men, yet have I made ➔ myself servant unto all, that I might gain the more.","20":"And unto the Jews I became as a Jew, that I might gain the Jews; to them that are under the law, as under the law, that I might gain them that are under the law;","21":"To them that are without law, as without law, (being not without law to God, but under the law to Christ,) that I might gain them that are without law.","22":"To the weak became I as weak, that I might gain the weak: I am made all things to all men, that I might ➔ by all means save some.","23":"And this I do for ➔ the gospel's sake, that I might be partaker ➔ thereof with you.","24":"Know ye not that they which run in a race run all, but one receiveth the prize? So run, that ye may obtain.","25":"And every man that striveth for the mastery is temperate in all things. Now they do it to obtain a corruptible crown; but we an incorruptible.","26":"I therefore so run, not as uncertainly; so fight I, not as one that beateth the air:","27":"But I keep under my body, and bring it into subjection: lest that by any means, when I have preached to others, I myself should be a castaway."}},"tsk":{"1":[{"kopje":"Ben ik niet een","refs":["1 Kor 9:2","1 Kor 9:3","1 Kor 1:1","1 Kor 15:8","1 Kor 15:9","Hand 9:15","Hand 13:2","Hand 14:4","Hand 22:14","Hand 22:15","Hand 16:17","Hand 16:18","Rom 1:1","Rom 1:5","Rom 11:13","2 Kor 11:5","2 Kor 12:11","2 Kor 12:12","Gal 1:1","Gal 1:15-17","Gal 2:7","Gal 2:8","1 Tim 2:7","2 Tim 1:11","Tit 1:1-3"]},{"kopje":"Ben ik niet vrij","refs":["1 Kor 9:19","Gal 5:1"]},{"kopje":"Heb ik","refs":["1 Kor 15:8","Hand 9:3","Hand 9:5","Hand 9:17","Hand 18:9","Hand 22:6-8","Hand 22:14-21","Hand 23:11","Hand 26:16-18"]},{"kopje":"bent","refs":["1 Kor 3:6","1 Kor 4:14","1 Kor 4:15","Hand 18:8-11","2 Kor 6:1"]}],"2":[{"kopje":"voor","refs":["Joh 6:27","2 Kor 3:1-3","2 Kor 12:12"]}],"3":[{"kopje":"verantwoording","refs":["Hand 22:1","Hand 25:16","Fil 1:7","Fil 1:17","2 Tim 4:16"]},{"kopje":"hen","refs":["1 Kor 14:37","2 Kor 10:7","2 Kor 10:8","2 Kor 12:16-19","2 Kor 13:3","2 Kor 13:5","2 Kor 13:10"]}],"4":[{"kopje":"wij","refs":["1 Kor 9:7-14","Matt 10:10","Luk 10:7","Gal 6:6","1 Tess 2:6","2 Tess 3:8","2 Tess 3:9","1 Tim 5:17","1 Tim 5:18"]}],"5":[{"kopje":"mee te nemen","refs":["1 Tim 3:2","1 Tim 4:3","Tit 1:6","Hebr 13:4"]},{"kopje":"een zuster","refs":["1 Kor 7:15","1 Kor 7:39","Hoogl 4:9","Hoogl 4:10","Hoogl 4:12","Hoogl 5:1","Hoogl 5:2","Rom 16:1","1 Tim 5:2"]},{"kopje":"de broeders","refs":["Matt 12:46-50","Matt 13:55","Mark 6:3","Luk 6:15","Joh 2:12","Hand 1:14","Gal 1:19"]},{"kopje":"Cefas","refs":["1 Kor 1:12","Matt 8:14","Mark 1:30","Joh 1:43"]}],"6":[{"kopje":"Barnabas","refs":["Hand 4:36","Hand 11:22","Hand 13:1","Hand 13:2","Hand 13:50","Hand 14:12","Hand 15:36","Hand 15:37"]},{"kopje":"hebben","refs":["1 Kor 4:11","1 Kor 4:12","Hand 18:3","Hand 20:34","Hand 20:35","1 Tess 2:9","2 Tess 3:7-9"]}],"7":[{"kopje":"dient","refs":["2 Kor 10:4","2 Kor 10:5","1 Tim 1:18","1 Tim 6:12","2 Tim 2:3","2 Tim 2:4","2 Tim 4:7"]}, pan class=\"wl wl-kjv\" data-code=\"G3956\">all,</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">but</span> <span class=\"wl wl-kjv\" data-code=\"G1520\">one</span> <span class=\"wl wl-kjv\" data-code=\"G2983\">receiveth</span> the <span class=\"wl wl-kjv\" data-code=\"G1017\">prize?</span> <span class=\"wl wl-kjv\" data-code=\"G3779\">So</span> <span class=\"wl wl-kjv\" data-code=\"G5143\">run,</span> <span class=\"wl wl-kjv\" data-code=\"G2443\">that</span> ye may <span class=\"wl wl-kjv\" data-code=\"G2638\">obtain.</span>","25":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> every <span class=\"wl wl-kjv\" data-code=\"G3956\">man</span> that striveth for the <span class=\"wl wl-kjv\" data-code=\"G75\">mastery</span> is <span class=\"wl wl-kjv\" data-code=\"G1467\">temperate</span> in all <span class=\"wl wl-kjv\" data-code=\"G3956\">things.</span> <span class=\"wl wl-kjv\" data-code=\"G3767\">Now</span> <span class=\"wl wl-kjv\" data-code=\"G1565\">they</span> do it <span class=\"wl wl-kjv\" data-code=\"G2443\">to</span> <span class=\"wl wl-kjv\" data-code=\"G2983\">obtain</span> a <span class=\"wl wl-kjv\" data-code=\"G5349\">corruptible</span> <span class=\"wl wl-kjv\" data-code=\"G4735\">crown;</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">but</span> <span class=\"wl wl-kjv\" data-code=\"G2249\">we</span> an <span class=\"wl wl-kjv\" data-code=\"G862\">incorruptible.</span>","26":"<span class=\"wl wl-kjv\" data-code=\"G1473\">I</span> <span class=\"wl wl-kjv\" data-code=\"G5106\">therefore</span> <span class=\"wl wl-kjv\" data-code=\"G3779\">so</span> <span class=\"wl wl-kjv\" data-code=\"G5143\">run,</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> <span class=\"wl wl-kjv\" data-code=\"G84\">uncertainly;</span> <span class=\"wl wl-kjv\" data-code=\"G3779\">so</span> fight <span class=\"wl wl-kjv\" data-code=\"G4438\">I,</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> one that <span class=\"wl wl-kjv\" data-code=\"G1194\">beateth</span> the <span class=\"wl wl-kjv\" data-code=\"G109\">air:</span>","27":"<span class=\"wl wl-kjv\" data-code=\"G235\">But</span> I keep <span class=\"wl wl-kjv\" data-code=\"G5299\">under</span> <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G4983\">body,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> bring it into <span class=\"wl wl-kjv\" data-code=\"G1396\">subjection:</span> lest that by any <span class=\"wl wl-kjv\" data-code=\"G3381\">means,</span> when I have <span class=\"wl wl-kjv\" data-code=\"G2784\">preached</span> to <span class=\"wl wl-kjv\" data-code=\"G243\">others,</span> I <span class=\"wl wl-kjv\" data-code=\"G846\">myself</span> should <span class=\"wl wl-kjv\" data-code=\"G1096\">be</span> a <span class=\"wl wl-kjv\" data-code=\"G96\">castaway.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"vrij?","tekst":"Namelijk van de ceremoniën der wet, en derhalve om allerlei spijs te eten, die mij voorgesteld zou mogen worden, zowel als iemand van de andere apostelen. Zie een tegenovergesteld voorbeeld Dan 1:8 , en Act 10:14 , Act 10:28 ."},{"catchword":"gezien?","tekst":"Namelijk zowel als de andere apostelen, toen ik van Hem tot het apostelschap ben geroepen, en daarna in gezicht, vertrekking van zinnen en opgetrokken zijnde in den hemel; zie Act 9:17 ; 2Co 12:2 ."},{"catchword":"mijn werk in den","tekst":"Dat is, die door mijn dienst tot den Heere bekeerd zijn."}],"2":[{"catchword":"ben ik het ulieden","tekst":"Dat is, gijlieden hebt nochtans geen reden om daaraan te twijfelen."},{"catchword":"het zegel mijns","tekst":"Dat is, de bevestiging, dat ik waarlijk een apostel ben, overmits gij door mijn dienst bekeerd zijt, en God mijne beroeping onder u door vele krachten en tekenen heeft bevestigd; 2Co 12:12 ."}],"3":[{"catchword":"die onderzoek over","tekst":"Of, die mij ondervragen, of veroordelen; dat is, die zich als rechters durven aanstellen om mij te oordelen."}],"4":[{"catchword":"om te eten","tekst":"Namelijk tot last en kosten van de gemeente."}],"5":[{"catchword":"een vrouw,","tekst":"Gr. ene zuster, ene vrouw, of ene huisvrouw. Sommigen menen hieruit dat de apostel ene huisvrouw gehad heeft, maar dat hij haar niet alom met zich heeft geleid, om de gemeente niet te bezwaren. Doch dit schijnt te strijden met hetgeen hij van zichzelven zegt 1Co 7:7 . Anderen menen dat hierdoor verstaan worden enige vrouwen, die de apostelen volgden, om hen te dienen en van hare middelen te verzorgen, gelijk de vrouwen die Christus volgden; Luk 8:3 . Doch bovendien dat dit nergens wordt gelezen, zo is het ook niet waarschijnlijk. Want hierdoor zouden de apostelen hun dienst verdacht gemaakt hebben, en de gemeenten zouden hierdoor verlicht zijn geworden, daar de apostel dit merkelijk invoert om te tonen dat hij de gemeenten hiermede niet wilde bezwaren. Zodat dit dan te verstaan is van ene huisvrouw, niet die hij had, maar die hij zou hebben kunnen nemen, en vervolgens ook met zich leiden, gelijk sommige andere apostelen deden."},{"catchword":"met ons","tekst":"Namelijk van de ene plaats naar de andere, waar wij gaan prediken, ten koste van de gemeente."},{"catchword":"de broeders des","tekst":"Dat is, neven. Hebr. want Johannes en Jakobus, en ook Judas en Simon, waren Christus' neven, of moeders zusters zonen. Zie Gen 13:8 , en Gen 29:15 ; Mat 12:46 , en Mat 13:55 ."},{"catchword":"Cefas?","tekst":"Dat is, Petrus, van wiens huisvrouw men leest Mat 8:14 ."}],"6":[{"catchword":"van niet te","tekst":"Namelijk, met onze handen tot onze onderhouding. Zie Act 18:3 , en Act 20:34 ."}],"8":[{"catchword":"naar den mens?","tekst":"Dat is, bewijs ik dit alleen met redenen, die genomen zijn uit het doen der mensen?"},{"catchword":"de wet hetzelve","tekst":"Namelijk beschreven door Mozes."}],"9":[{"catchword":"een dorsenden os","tekst":"In die landen, gelijk ook in andere, slaat men het koren uit de aren niet met vlegels, gelijk men hier doet, maar men doet er de beesten, inzonderheid de ossen, over gaan, en hetzelve alzo betreden met zijne aren los trappen, of den dorswagen daarvoor trekken. Zie Deu 25:4 ; Isa 28:27 ."},{"catchword":"Zorgt ook God","tekst":"Namelijk voornamelijk, of meer dan voor de mensen, als Hij deze wet gesteld heeft. Want anderszins is er zelfs niet een musje vergeten voor den Heere; zie Mat 10:29 . Zodat dit te verstaan is bij vergelijking, dat God deze wet gesteld heeft, meer om de mensen dan om ossen, om te kennen te geven, indien God wil dat men den arbeidenden os zijn voedsel niet zal onthouden, dat men het veel weiniger den mensen, die arbeiden, onthouden moet."}],"10":[{"catchword":"op hoop moet ploegen;","tekst":"Namelijk van de vruchten zijns arbeids daarna te genieten."}],"11":[{"catchword":"wij ulieden het","tekst":"Namelijk ik en Barnabas, die u het Woord Gods verkondigd hebben. Zie Rom 15:27 ."},{"catchword":"dat lichamelijk is,","tekst":"Gr. vleselijk; dat is de goederen, die dienen tot onderhouding onzer lichamen."}],"12":[{"catchword":"anderen deze","tekst":"Namelijk gewone leraars, die wij daar hebben gelaten, om het begonnen werk na ons te volvoeren."},{"catchword":"enige verhindering","tekst":"Namelijk eensdeels voor de ongelovigen, die uit vrees van de onkosten het Woord hadden mogen vlieden; eensdeels voor enige valse apostelen, die Paulus zouden hebben mogen lasteren, alsof hij het Evangelie om des onderhouds wille predikte, daar zij hetzelve voor niet wilden schijnen te doen, om de gemeenten alzo aan zich te trekken; zie 2Co 11:12 ."}],"13":[{"catchword":"die de heilige","tekst":"Gelijk er waren als de Levieten in het Oude Testament, die daarom de tienden ontvingen en hun deel hadden in hetgeen geofferd werd. Zie Num 18 ;; Deu 18 ."},{"catchword":"het altaar zijn,","tekst":"Gr. bij het altaar gestadiglijk zitten. Gelijk er waren de priesters, de nakomelingen van Aärons, die ook de tienden van de tienden der Levieten ontvingen, en een bijzonder deel hadden in alle offeranden, uitgenomen die geheel voor den Heere moesten verbrand worden; Num 18:26 , enz."},{"catchword":"delen met het altaar?","tekst":"Dewijl op het altaar een deel werd verbrand en van het vuur verteerd, en een ander deel voor de priesters werd bewaard."}],"14":[{"catchword":"de Heere","tekst":"Hij ziet hier op de ordinantie van Christus, Mat 10:10 ; Luk 10:7 ."},{"catchword":"van het Evangelie","tekst":"Dat is, van den arbeid, dien zij doen in het prediken des Evangelies en het regeren der gemeente."}],"15":[{"catchword":"geen van deze","tekst":"Namelijk onder u, hoewel hij van andere gemeenten somwijlen enige milddadigheid heeft ontvangen; 2Co 11:8 ."},{"catchword":"beter te","tekst":"Gr. goed liever te sterven; dat is, raadzamer, of oorbaarder."},{"catchword":"sterven, dan dat","tekst":"Namelijk van gebrek."},{"catchword":"dezen mijn roem","tekst":"Namelijk van het Evangelie zonder aanstoot en zonder uwe kosten onder u gepredikt te hebben. De reden hiervan, zie tevoren vs.12."}],"16":[{"catchword":"het is mij","tekst":"Dat is, ik doe niet dan wat ik schuldig ben te doen; Luk 17:10 ."},{"catchword":"de nood is mij","tekst":"Of, de nood ligt op mij, namelijk door mijn beroep en Christus' bevel; Rom 1:14 ."},{"catchword":"wee mij, indien","tekst":"Gr. wee is mij; dat is, de straf is mij bereid, die Christus den ontrouwen dienstknecht heeft gedreigd; Mat 24:8 , enz. Niet dat de apostel twijfelde of hij getrouw in zijn dienst zou blijven, maar dit zegt hij om zichzelven en anderen door zulke sporen tot naarstigheid en voorzichtigheid in hun dienst meer en meer te verwekken."}],"17":[{"catchword":"gewillig doe,","tekst":"Dat is, gene, en met behoorlijke vlijt en naarstigheid, zonder op menselijke oordelen te zien; Rom 12:8 , Rom 12:11 ."},{"catchword":"loon","tekst":"Namelijk de kroon der heerlijkheid, die den getrouwen en naarstigen dienstknechten van den Heere uit genade is beloofd, Mat 24:46-47 ; 2Ti 4:7-8 , en den roem van getrouwheid in dit leven, tegen de valse apostelen."},{"catchword":"onwillig, de uitdeling","tekst":"Dat is, alleen uit vrees van straf, of om eer en voordeel te hebben bij de mensen; gelijk de huurlingen en slaven plegen hunne heren te dienen."},{"catchword":"toebetrouwd","tekst":"Namelijk om daarvan hiernamaals rekenschap te geven."}],"18":[{"catchword":"Wat loon heb","tekst":"Dat is, ik heb dan eerst loon te verwachten van den Heere, zo ik het met vlijt en getrouwheid doe, alleen ziende op de ere Gods en de meeste stichting der gemeente, zonder hoop van menselijke loon. En alzo ik merkte dat het ontvangen van menselijk loon aanstoot zou geven en de stichting en den loop des Evangelies verhinderen, zo heb ik dat niet willen ontvangen; en daarover mag ik bij u roemen, maar niet bij God. Zie Rom 4:2 ; 2Co 11:10 ."},{"catchword":"mijn macht in","tekst":"Namelijk die ik heb om onbehoorlijk onderhoud te nemen."},{"catchword":"misbruiken","tekst":"Dat is, met aanstoot te gebruiken, en met opspraak der valse apostelen, vs.15."}],"19":[{"catchword":"van allen vrij was,","tekst":"Namelijk lasten en jukken, waarvan de Christelijke en apostolische vrijheid ons vrijmaakt. De apostel gaat dan voort van dit stuk, waarin hij zijne vrijheid om der stichting wil niet heeft gebruikt, tot meer andere stukken, waarin hij ook dezelve niet heeft gebruikt, om de Corinthiërs te meer te overtuigen, dat zij naar zijn voorbeeld desgelijks behoren te doen, en hunne vrijheid niet gebruiken tot aanstoot en verachtering van den loop des Evangelies."},{"catchword":"allen dienstbaar","tekst":"Dat is, ik heb mij gevoegd naar eens ieders zwakheid, of gelijk een dienstknecht zich altijd voegen moet naar de gelegenheid en genegenheid desgenen, dien hij dient. Doch dit moet altijd verstaan worden in middelmatige zaken. Alzo ook vs.22."},{"catchword":"winnen","tekst":"Dat is, tot het geloof in Christus brengen. Zie dergelijke wijze van spreken 1Pe 3:1 ."}],"20":[{"catchword":"den Joden geworden","tekst":"Namelijk in zaken die middelmatig waren, gelijk toen nog was de onderhouding der ceremoniën des Ouden Testaments bij de zwakke Joden, gelijk hij om hunnentwil Timotheus heeft doen besnijden, te Cenchreën door belofte zijn hoofd heeft laten bescheren, en te Jeruzalem in den tempel zichzelven heeft geheiligd."},{"catchword":"de wet zijn, ben ik geworden","tekst":"Namelijk der ceremoniën, die alstoen wel door Christus' lijden teniet gedaan was, zoveel aangaat hetgeen daarin godsdienstig was, maar voor een tijd als een middelmatige zaak nog werd gedragen, om de zwakke Joden niet te vervreemden. Zie Act 21:20 ."}],"21":[{"catchword":"die zonder de wet zijn,","tekst":"Dat is, den heidenen, die de wet der ceremoniën niet hadden, en ook niet gehouden waren te gebruiken, volgens het besluit der apostelen; Act 15:28 , en Act 21:25 ."},{"catchword":"Christus onder de wet),","tekst":"Dit voegt hij daarbij, opdat niemand zou misduiden, hetgeen hij tevoren gezegd had, dat hij geweest was als zonder wet, dewijl hij in alles wat hij deed de wet en geboden van Christus in het duiden der zwakken en in het vlieden van ergernissen altijd voor ogen had; Gal 6:2 ."}],"22":[{"catchword":"den zwakken geworden","tekst":"Namelijk Christenen, of gelovigen, die het fondament van het Christengeloof we aannamen, maar hetgeen de Christelijke vrijheid aangaat nog in alles niet wel konden begrijpen; Rom 14:1 ; Gal 6:2 ."},{"catchword":"enigen behouden zou","tekst":"Hiermede verklaart hij hetgeen hij tevoren genaamd heeft winnen. Zie 1Ti 4:16 ."}],"23":[{"catchword":"opdat ik hetzelve","tekst":"Dat is, opdat niet alleen anderen door mijne predikatie zouden zalig worden, maar opdat ik ook zelf deze zaligheid moge deelachtig worden, hetwelk niet zou geschieden, indien ik zelf niet deed wat ik anderen leer."}],"24":[{"catchword":"Weet gijlieden","tekst":"Van hier voorts leert de apostel, dat het zover vandaar is, dat zij om spijs en drank, of maaltijden van afgodendienaars zeer moeten bekommerd zijn, dat zij veel meer zich moeten bekommeren om in alle soberheid, matigheid en verdraagzaamheid zichzelven te oefenen, hetwelk hij met de voorbeelden dergenen, die om prijs strijden, en ook met zijn eigen voorbeeld bewijst."},{"catchword":"lopen, allen wel lopen,","tekst":"Namelijk om prijs."},{"catchword":"een den prijs","tekst":"Namelijk die niet alleen met anderen wel begint, maar voor anderen wel voleindt."},{"catchword":"alzo dat gij","tekst":"Dat is, zo naarstig en standvastig tot den einde toe."},{"catchword":"verkrijgen","tekst":"Of, grijpen; namelijk den voorgestelden prijs der heerlijkheid Gods; Phi 3:12-14 ."}],"25":[{"catchword":"die om prijs","tekst":"Namelijk met lopen, worstelen, of vechten, gelijk onder de ouden zulke soorten van strijden om prijs waren."},{"catchword":"onthoudt zich","tekst":"Of, matigt zich; namelijk van veel spijs, drank, slaap, en andere dingen, die hem traag of onnut maken in dezen strijd."},{"catchword":"een verderflijke kroon","tekst":"Namelijk van laurieren, olijftakken, eikenbladeren en dergelijke, of ten hoogste van zilver of goud, gelijk dengenen, die om prijs streden, voorgesteld worden."},{"catchword":"een onverderflijke","tekst":"Dat is, onvergankelijke, of eeuwigdurende; 1Pe 1:4 ."}],"26":[{"catchword":"niet als op","tekst":"Namelijk gelijk deze kampers of lopers om prijs doen, die niet weten of zij den prijs zullen bekomen of niet; 2Ti 4:7-8 ."},{"catchword":"als de lucht slaande","tekst":"Namelijk gelijk die doen, die uit geen ernst kampen of strijden, maar alleen spiegelvechten, en zich tegen de lucht oefenen, waaruit gene overwinning van partijen valt, hetwelk wij tegen de zonde en den duivel met ernst moeten doen; Eph 6:11 ."}],"27":[{"catchword":"bedwing mijn","tekst":"Het Griekse woord betekent onder de ogen slaan, iet met slagen temmen of onder zijne gehoorzaamheid brengen. Zie van dit woord ook Luk 18:5 ."},{"catchword":" nd drink? [Namely, as the cost and charge of the Church.]"}],"5":[{"catchword":null,"tekst":"Have we not power to lead about (with us) [Namely, from one place to another where we go to preach, at the costs of the Church] a wife being a sister, [Gr. A sister a woman or a wife. Some think from hence that the Apostle had a wife, but that he did not lead her all about with him, that he might not burden the Churches. But this seems to be repugnant to that which he saith of himself. 1 Cor. 7. 7. Others think that hereby are understood certain women which followed the Apostle to serve them, and to provide for them of their means, as the women who followed Christ, Luke 8. 3. But besides this that we read this no where, so neither is it likely to be true. For hereby the Apostle should have rendered their ministry suspected, and the Churches should have been eased hereby, whereas the Apostle evidently brings in this to show that he would not burden the Churches herewith. So that this therefore is to be understood of a wife, not which he had, but which he might have taken, and consequently also have led with him, as some other Apostles did] as also the other Apostles, and the brothers of the lord, [that is, cousins Hebr. For John and James, and also Judas and Simon were Christ&acirc;&euro;&trade;s cousin-Germans or mother&acirc;&euro;&trade;s sisters sons. See Gen. 13. 8. and 29. 15. Mat. 12. 46. and 13. 55.] and Cephas? [that is, Peter, of whose wife we read Mat. 8. 14.]"}],"6":[{"catchword":null,"tekst":"Or have not I and Barnabas only, power of not working? [Namely, with our hands for our maintenance. See Acts 18. 3. and 20. 34.]"}],"7":[{"catchword":null,"tekst":"Who ever serve in the war at his own charges? Who planteth a vineyard, and eateth not of its fruit? Or who feedeth a flock, and eateth not of the milk of the flock?"}],"8":[{"catchword":null,"tekst":"Speak I this according to man? [That is, do I prove this only with reasons which are taken from the doings of men?] or saith not the Law [namely, written by Moses] the same also?"}],"9":[{"catchword":null,"tekst":"For it is written in the Law of Moses, Thou shalt not muzzle a threshing Ox. [In those countries as also in others, men beat not the corn out of the ears with flails as they do here, but they cause beasts, especially oxen to go over it, and so tread the same, and trample it loose out of its ears, and draw the threshing wagon over it. See Deut. 25. 4. Isa. 28. 27, 28.] Doth God also take care for Oxen? [namely, chiefly, or more than for men, when he made this Law. For otherwise there is not so much as a Sparrow forgotten before the Lord. See Mat. 10. 29. So that this is to be understood comparatively, that God made this Law more for men than for oxen, to give us to understand, that if God will not have men to withhold his food from the labouring ox, that much less ought we to withhold the same from men which labour.]"}],"10":[{"catchword":null,"tekst":"Or saith be (it) altogether for our sake? For our sakes (that) is written: for as much as he that plougheth must plough in hope: [Namely, of enjoying the fruit of his labour afterwards] and he that thresheth in hope, (must) be partaker of his hope."}],"11":[{"catchword":null,"tekst":"If we have sown unto you that which is spiritual, [Namely, I and Barnabas have published unto the word of God. See Rom. 15.27.] it is a great (matter) if we reap yours is that corporal? [Gr. Carnal, i.e. the good things which serve for the sustention of our bodies."}],"12":[{"catchword":null,"tekst":"If others [Namely, ordinary teachers, which we have left there to finish after us the work that is begun] be partakers of this power over you (why) not we much rather? Yet we have not used this power: but we bear all, that we may not give hindrance to the Gospel of Christ. [Namely, partly because of the unbelievers, who for fear of the changes might have shunned the word: partly because of certain false Apostles, which might have slandered Paul as if he preached the Gospel for maintainance sake, whereas they would seem to do the same for nothing, that so they might draw the Churches to them. See 2 Cor. 11. ver.13.]"}],"13":[{"catchword":null,"tekst":"Know ye not that they that administer the holy things [Such as we ill the Levites in the Old Testament, who therefore receives the tenths, and had their part in that which was offered, See Numb. 18. Deut. 18.] eat of that which is holy (and) they that are continually by the alter, [Gr. Sit continually by the alter. As were the Priests the posterity of Aaron, which received the tithes also of the tithes of the Levites, and had a special part in all sacrifices, except those which must be wholly burnt before the Lord. Num. 18. ver.26. etc.] partake with the alter. [seeing one part was burnt upon the alter and consumed by them, and another was kept for the Priests.]"}],"14":[{"catchword":null,"tekst":"So also the Lord ordained, [He hath respect here to Christ ordinance, Mat. 10.10. Luke. 10.7.] that they which publish the Gospel should live of the Gospel. That is, of the labour which they take in preaching of the Gospel, and governing of the Church.]"}],"15":[{"catchword":null,"tekst":"But I have used none of these things: [Namely, among you, although the other Churches he sometimes received the liberality, 2 Cor. 11.8.] and I have not written this, that it should be done unto me: for it were beer for me [Gr. Good rather to dye, i.e. more advised or epidient] to dye, [namely, for want] then that any one would make this my glorying vain. [namely, namely of having preached the Gospel among you without offence, and without your costs. The reason hereof see before ver.12.]"}],"16":[{"catchword":null,"tekst":"If I publish the Gospel, it is no glorying to me: [that is, I do nothing but I ought to do, Luke 1 10.] for necessity is laid upon me. [or, necessity lies upon me. Namely, by my calling and Christs command, vm. 1.14.] and woe to me [Gr. Woe is me, i.e. the punishment is ready for me which Christ had threaten to the unfaithful servant, Mat. 24.48. etc. Not the Apostle doubted whether he should continue faithful in his ministry, but this he said, by such spurs more and more to stir up both himself and others, diligence and prudence in their ministry] if I preach in the Gospel."}],"17":[{"catchword":null,"tekst":"F if I do that willingly [That is, gladly, and with due care and diligence, without regarding the judgment of Men, Rom. 12. ver.11.] I have reward: [namely, the crown of glory which is of grace, promised by the Lord to the faithful and diligence servants, Mat. 24.46. 2 Tim. 4.ver.7, 8. and the glory of faithfulness in this life against the false Apostles] but if willingly [this, only for fear of punishment, or to have honour and profit with men: as hirelings and slaves use to for their masters] the dispensation is (nevertheless) inbred into me. [namely, to give account thereof hereafter.]"}],"18":[{"catchword":null,"tekst":"What reward have I then? [I have first reward to expect from the Lord, if I do it with diligence and faithfulness, respecting only the glory of God, and the greatest edification of the Church, without hope of reward of men. And seeing I have observed that the receiving of reward from men would give offence, and hinder edification and course of the Gospel, therefore I would not receive it: and for that I may glory unto you, but not unto God. See Rom 3:27. and 4.2. 2 Cor.11.10.] (namely) that I publishing the Gospel, might make the Gospel of Christ (to be) without cost, not to abuse [that is, to use with offence, and with approach of the false Apostles, v.15,] my power [namely, which I have taken to the fitting maintenance] in the Gospel."}],"19":[{"catchword":null,"tekst":"For when I was free from ad; [Namely, burdens and yokes, from whence the Christian and Apostolic liberty makes us free. The Apostle therefore proceeds from this point, wherein for edification sake he did not use his liberty, unto more other points, wherein he likewise did not use the same, the more to convince the Corinthians, that according to his example they ought to do the like, and not use they liberty to the scandal and hindrance of the course of the Gospel] I have made myself bondman of all, [that is, I have condescend to every ones weakness, or as a servant must always carry himself according to the condition and inclination of him who serves. But this must always be understood in indifferent things. So also ver.22.] that I might gain [that is, bring to faith in Christ. See the like phrase, 1 Pet. 3.1.] the more."}],"20":[{"catchword":null,"tekst":"And to the Jews I became as a Jew, [Namely, in things which were indifferent, as then the observation of the ceremonies of the Old Testament with weak Jews yet was: as for their sake he caused Timothy to be circumcised; caused his head to be shorn at Cennchrea by a vow, and at Jerusalem purified himself in the Temple] that I might the Jews: to them that are under the Law [namely, of the ceremonies which was then abolished by Christ&acirc;&euro;&trade;s suffering, as much as concerned that which was religious therein: but was yet born for a time as a thing indifferent, not to estrange the weak Jews. See Act 21:20.] (I became) as being under the Law, that I might gain them that are under the Law."}],"21":[{"catchword":null,"tekst":"To them that are without the Law, [That is, the Gentiles, who had not the ceremonial Law, neither were bound to use it, according to the decree of the Apostles, Act 16:28. and 21.25.] I became as being without the Law, (nevertheless) not being without the Law, to God, but under the Law to Christ, [this he adds that no man might misconstrue that which he had said before, that he had been as without the Law, seeing in all that he did, he had always before his eyes the Law and commands of Christ in bearing of the weak, in shunning of the offences, Gal 6:2.] that I might gain them that are without the Law."}],"22":[{"catchword":null,"tekst":"I became to the weak [Namely, Christians or believers, who indeed embraced the foundation of the Christian faith, but as for that which concerns Christian liberty, could not yet in all things comprehend it, Rom. 14.1. Gal. 6.2.] as weak, that I might gain the weak: I became all things to all, that I might surely save some. [hereby he expounds that which before he called to gain. See 1 Tim. 4.16.]"}],"23":[{"catchword":null,"tekst":"And this I do for the Gospels sake, that I might also be partaker of the same. [That is, that not only others might be saved by my preaching, but that I my self might be co-partner of this salvation: which would not be, if I do not myself that which I teach others."}],"24":[{"catchword":null,"tekst":"Know ye not [From henceforward the Apostle teacheth, that they should be so farre from being very much troubled by meat and drink, or feast of Idolaters, that they must much rather be careful to exercise themselves in all soberness, temperance and forbearance, which he proves by the examples of those that strives for a prize, and also by his own example] that they that run in the race [namely, for a prize] run all indeed, but (that) one receiveth the prize? [namely, who do not without others begin well, but before others ends well] So run [that is, so diligently and constantly even unto the end] that ye may obtain (it.) [or apprehend, namely, the proposed prize of God, Phil.3.v.12,13,14.]"}],"25":[{"catchword":null,"tekst":"And every one that striveth (for a prize,) [Namely, by wrestling, running or fighting, as among the ancients there were such sorts of striving for the prize] containeth himself in all things. [or, moderates himself, namely, from much meat, drink or other things, which make him slow or unapt in this strife] These then (do these) indeed, that they might receive a corruptible crown, [namely, of laurels, olive-branches, oaken-leaves, and the like, or at the highest of silver or gold, such as were propounded to those that strove for a prize]but we an incorruptible. [that is, unperishing, or everlasting, 1 Pet. 1.4.]"}],"26":[{"catchword":null,"tekst":"I run so therefore, not as at an uncertainty, [Namely, like as these fighters or runners for a prize do, who do not know whether they shall get the prize or no, 2 Tim. 4.7, 8.] so fight I, not as beating the air. [namely, as they do, who do not know to fight or strive in good earnest, but only fight with a shadow, and exercise themselves against the air, from whence happens no victory over the adversary: which we must do in earnest against sin and the Devil, Eph. 6.11.]"}],"27":[{"catchword":null,"tekst":"But I constrain my body, [The Greek signifies to strike under the eyes of the eyes by blows, to tame or bring under his obedience. See of this word also, Luk 18:5.] and bring it into bondage, [namely, to subdue the same to the spirit, and not to oppress the spirit by too much or by too great delicacy] left by any means when I have preached to others, [namely, to bring them to salvation] I my self should be refuseable. [that is, make my self unfit or incapable of the prize whereunto I incite and stir up others: whereby the Apostle meaneth that he is uncertain of his election, and of obtaining the prize, for the contrary appears clearly, Rom. 8.v.38. 2 Tim. 4.v.7, 8. but this is a similitude taken from the same striving for the prize, wherein the slow or lazy, who had too much fed themselves, were rejected, and disallowed as unfit for it.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
