voor ons geslacht, namelijk Christus.","8":"Laten we dan feest houden, niet met de oude zuurdesem, ook niet met de zuurdesem van kwaadheid en boosheid, maar met de ongezuurde broden van oprechtheid en waarheid.","9":"Ik heb u in de brief geschreven dat u zich niet moet inlaten met de hoereerders;","10":"Maar niet geheel met de hoereerders van deze wereld, of met de gierigaards, of met de rovers, of met de afgodendienaars; want dan zou u wel uit de wereld moeten gaan.","11":"Maar nu heb ik u geschreven dat u zich niet moet inlaten *namelijk* met iemand die een broeder genoemd wordt, en toch een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; met zo iemand moet u zelfs niet eten.","12":"Want wat heb ik ermee te maken hen die buiten zijn te oordelen? Oordeelt u niet over hen die binnen zijn?","13":"Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg."},"SV":{"1":"Men hoort ganselijk, *dat* *er* hoererij onder u *is*, en zodanige hoererij, die ook onder de heidenen niet genoemd wordt, alzo dat er een zijns vaders huisvrouw heeft.","2":"En zijt gij *nog* opgeblazen, en hebt niet veel meer leed gedragen, opdat hij uit het midden van u weggedaan worde, die deze daad begaan heeft?","3":"Doch ik, als wel met het lichaam afwezend, maar tegenwoordig zijnde met den geest, heb alrede, als *of* *ik* tegenwoordig *ware*, dengene, die dat alzo bedreven heeft, besloten,","4":"In den Naam van onzen Heere Jezus Christus, als gijlieden en mijn geest *samen* vergaderd zullen zijn, met de kracht van onzen Heere Jezus Christus,","5":"Denzulken over te geven aan den satan, tot verderf des vleses, opdat de geest behouden moge worden in den dag van den Heere Jezus.","6":"Uw roem is niet goed. Weet gij niet, dat een weinig zuurdesem het gehele deeg zuur maakt?","7":"Zuivert dan den ouden zuurdesem uit, opdat gij een nieuw deeg zijn moogt, gelijk gij ongezuurd zijt. Want ook ons Pascha is voor ons geslacht, *namelijk* Christus.","8":"Zo dan laat ons feest houden, niet in den ouden zuurdesem, noch in den zuurdesem der kwaadheid en der boosheid, maar in de ongezuurde *broden* der oprechtheid en der waarheid.","9":"Ik heb u geschreven in den brief, dat gij u niet zoudt vermengen met de hoereerders;","10":"Doch niet geheellijk met de hoereerders dezer wereld, of met de gierigaards, of met de rovers, of met de afgodendienaars; want anders zoudt gij moeten uit de wereld gaan.","11":"Maar nu heb ik u geschreven, dat gij u niet zult vermengen, *namelijk* indien iemand, een broeder genaamd zijnde, een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; dat gij met zodanig een ook niet zult eten.","12":"Want wat heb ik ook die buiten zijn te oordelen? Oordeelt gijlieden niet die binnen zijn?","13":"Maar die buiten zijn oordeelt God. En doet gij dezen boze uit ulieden weg."},"KJV":{"1":"It is reported commonly that there is fornication among you, and such fornication as is ➔ not so much as named among the Gentiles, that one should have his father's wife.","2":"And ye are puffed up, and have ➔ not rather mourned, that he that hath done this deed might be taken away from among you.","3":"For I verily, as absent in body, but present in spirit, have judged already, as though I were present, concerning him that hath ➔ so done this deed,","4":"In the name of our Lord Jesus Christ, when ye are gathered together, and my spirit, with the power of our Lord Jesus Christ,","5":"To deliver such an one unto Satan for the destruction of the flesh, that the spirit may be saved in the day of the Lord Jesus.","6":"Your glorying is not good. Know ye not that a little leaven leaveneth the whole lump?","7":"Purge out therefore the old leaven, that ye may be a new lump, as ye are unleavened. For even Christ our passover is sacrificed for us:","8":"Therefore let us keep the feast, not with old leaven, neither with the leaven of malice and wickedness; but with the unleavened bread of sincerity and truth.","9":"I wrote unto you in an epistle not to company with fornicators:","10":"Yet not altogether with the fornicators of this world, or with the covetous, or extortioners, or with idolaters; for then must ye needs go out of the world.","11":"But now I have written unto you not to keep company, if any man that is called a brother be a fornicator, or covetous, or an idolater, or a railer, or a drunkard, or an extortioner; with such an one no not to eat.","12":"For what have I to do to judge them also that are without? do ➔ not ye judge them that are within?","13":"But them that are without God judgeth. Therefore put away from among yourselves that wicked person."}},"tsk":{"1":[{"kopje":"men hoort","refs":["1 Kor 1:11","Gen 37:2","1 Sam 2:24"]},{"kopje":"hoererij","refs":["1 Kor 5:11","1 Kor 6:9","1 Kor 6:13","1 Kor 6:18","Hand 15:20","Hand 15:29","2 Kor 12:21","Gal 5:19","Ef 5:3","Kol 3:5","1 Tess 4:7","Openb 2:21","Openb 21:8"]},{"kopje":"en","refs":["Jer 2:33","Ezech 16:47","Ezech 16:51","Ezech 16:52"]},{"kopje":"dat iemand","refs":["Gen 35:22","Gen 49:4","Lev 18:8","Lev 20:11","Deut 22:30","Deut 27:20","2 Sam 16:22","2 Sam 20:3","1 Kron 5:1","Ezech 22:10","Amos 2:7","2 Kor 7:12"]}],"2":[{"kopje":"u bent","refs":["1 Kor 5:6","1 Kor 4:6-8","1 Kor 4:18"]},{"kopje":"verdriet gehad","refs":["Num 25:6","2 Kon 22:19","Ezra 9:2-6","Ezra 10:1-6","Ps 119:136","Jer 13:17","Ezech 9:4","Ezech 9:6","2 Kor 7:7","2 Kor 7:9-11","2 Kor 12:21"]},{"kopje":"zou","refs":["1 Kor 5:5","1 Kor 5:7","1 Kor 5:13","Openb 2:20-22"]}],"3":[{"kopje":"met het lichaam afwezig","refs":["2 Kor 10:1","2 Kor 10:11","2 Kor 13:2","Kol 2:5","1 Tess 2:17"]}],"4":[{"kopje":"de Naam","refs":["Hand 3:6","Hand 4:7-12","Hand 4:30","Hand 16:18","Ef 5:20","Kol 3:17"]},{"kopje":"wanneer","refs":["Matt 16:19","Matt 18:16-18","Matt 18:20","Matt 28:18","Matt 28:20","Joh 20:23","2 Kor 2:9","2 Kor 2:10","2 Kor 13:3","2 Kor 13:10"]}],"5":[{"kopje":"Hem over te geven" estraft."},{"catchword":"uit het midden","tekst":"Dat is, door den Christelijken ban uit uwe vergadering geworpen, gelijk hierna vs.7, 11 verklaard wordt."}],"3":[{"catchword":"met den geest,","tekst":"Dat is, met mijne gedachten, wil en kracht des geestes. Zie dergelijke 2Ki 5:26 ; Col 2:5 ."}],"4":[{"catchword":"In den naam","tekst":"Dat is, volgens het bevel en last van Christus, en met aanroeping van Zijnen naam; Mat 18:15 ."},{"catchword":"met de kracht","tekst":"Dat is, de krachtige werking van Christus in de harten dergenen, onder wie en tegen wie deze straf wettelijk wordt gebruikt. Zie Mat 18:18-20 ."}],"5":[{"catchword":"over te geven","tekst":"Dat is, uit uwe gemeenschap te bannen, of, gelijk Christus spreekt Mat 18:17 , te houden als een heiden en tollenaar. Want buiten de gemeente van Christus heeft de Satan zijn rijk. Zie 2Ti 2:25-26 ."},{"catchword":"tot verderf des","tekst":"Dat is, tot doding en vernietiging van den ouden mens, dat is der verdorven natuur, die doorgaans vlees wordt genaamd. Zie Rom 8:13 ; Gal 5:24 ."},{"catchword":"de geest behouden","tekst":"Dat is de nieuwe mens, die door deze vleselijke begeerten en zonden als dood en begraven scheen, wederom verwekt worde en de overhand verkrijge, totdat hij in den dag der toekomst van Christus in ons geheel en alleen zal heersen."}],"6":[{"catchword":"Uw roem is niet","tekst":"Namelijk waarmede gij roemt alsof gij en uwe gemeente geheel volmaakt ware."},{"catchword":"een weinig","tekst":"Gr. een kleine zuurdesem. Met deze gelijkenis verklaart de apostel dat een ergerlijk mens als hij niet gestraft wordt in de gemeente, anderen lichtelijk tot navolging trekt."}],"7":[{"catchword":"Zuivert dan den","tekst":"Dit kan òf in het bijzonder verstaan worden van de uitzuivering of uitwerping van dezen ergerlijken mens, opdat de gehele gemeente mocht zijn buiten opspraak en gevaar van verdere besmetting, alzo zij alrede door den Geest Gods van den zuurdesem der natuurlijke verdorvenheid grotendeels waren bevrijd; òf, in het algemeen voor ene algemene vermaning uit aanleiding van de voorgaande gelijkenis, dat namelijk elk in het bijzonder den ouden zuurdesem der zonde uit zich meer en meer zou uitzuiveren, gelijk zij alrede van de heerschappij derzelve verlost waren. Zie Eph 4:22 ; Col 3:5 , Col 3:9-10 ."},{"catchword":"ons pascha","tekst":"Of, ons pascha is voor ons geofferd; dat is, het pascha, dat voor ons tot verzoening onzer zonden is geofferd. Christus wordt hier genaamd het pascha, door een oneigenlijke manier van spreken, die van de sacramenten dikwijls gebruikt wordt [gelijk het brood in het Avondmaal genaamd wordt het lichaam van Christus en de gemeenschap des lichaams van Christus ], omdat het paaslam een teken en figuur van Christus en zijne offerande was. Zie Joh 19:36 ."}],"8":[{"catchword":"Zo dan laat","tekst":"Hetgeen de Israelieten na het slachten van het uiterlijke pascha, in het voorbeeld moesten doen op de voorbereiding van pascha met het uitzuiveren van allen zuurdesem, en met zeven dagen lang zich van gezuurde broden te onthouden, volgens Gods bevel, Exo 12:15 , dat gebiedt de apostel den Christenen in de betekende zaak al hun leven lang te doen; namelijk heilig en rechtvaardig te wandelen voor God en de mensen, en derhalve ook alle ergernissen uit hen te werpen, nadat zij door de offerande en besprenging van het bloed van Christus met God verzoend zijn."},{"catchword":"in den ouden","tekst":"Dat is, in de besmetting van de aangeboren natuurlijke verborgenheid."},{"catchword":"in den zuurdesem","tekst":"Dat is, nog in andere moedwillige zonden en boosheden, die de natuurlijke mensen nog dagelijks daarbij hopen."},{"catchword":"in de ongezuurde","tekst":"Dat is, in een zuiveren en onbesmetten wandel."}],"9":[{"catchword":"in den brief","tekst":"Dit verstaan sommigen van een anderen brief, dien de apostel voor dezen aan de gemeente van Corinthe zou geschreven hebben, omdat de woorden, die volgen, met zovele letters hiervoren niet uitgedrukt staan; doch alzo de zin van deze woorden hiervoren in vs.2, 7 verhaald is, zo kan dit bekwamelijk van dezen zelfden brief van Paulus verstaan worden."},{"catchword":"vermengen met","tekst":"Dat is, tot de gemeenschap uwer gemeente toelaten, en met hen als broeders gemeenzaam verkeren. Zie vs.11."}],"10":[{"catchword":"Doch niet","tekst":"Dat is, dit versta ik niet in het algemeen van al zulke ergerlijke mensen, die onder u, of bij u wonen."},{"catchword":"uit de wereld","tekst":"Namelijk alzo de wereld vol is van zulke mensen, waar gij dagelijks mede te doen hebt, welker voetstappen gij niet moet volgen, maar die gij moet zoeken voor Christus te winnen; Mat 5:16 ; Eph 5:11 . En hoewel dit op alle eeuwen past, zo paste het nochtans allermeest op die eeuw, in welke het heidendom de overhand had, die allen afgodendienaars waren, daar deze andere zonden gemeenlijk op volgen."}],"11":[{"catchword":"Maar nu heb","tekst":"Dat is, heb nodig geacht u te schrijven, opdat gij mij wel verstaat."},{"catchword":"een broeder","tekst":"Dat is, voor een lidmaat der gemeente gehouden en gekend wordt, gelijk de Christenen doorgaans in de Handelingen der apostelen, en de brieven, broeders genaamd worden, gelijk ook Christus van deze kerketucht alzo spreekt; Mat 18:15 ."},{"catchword":"een afgodendienaar,","tekst":"Dat de Christenen alsdan zich ook somwijlen in afgoderij verliepen, blijkt 1Co 10:20 ; Rev 2:14 , Rev 2:20 ."},{"catchword":"zult eten","tekst":"Dat is, zult geen gemeenzame en openbare onderlinge vriendschap met zulken onderhouden, opdat zij zich mogen schamen. Zie 2Th 3:14 ; 2Jo 1:10 . Anderszins verbiedt de apostel niet, dat van man en vrouw, ouders en kinderen en dergelijke, de burgerlijke gemeenschap [waar de wet der natuur en zeden de mensen aan verbindt] zelfs met zodanigen onderhouden worde; alzo de kerkelijke tucht dezulken maar ontbloot van de gemeenschap die Christenen als Christenen, zo in het geestelijke als in het wereldlijke, eigen hebben; niet waarmede zij als mensen of burgers in het algemeen aan elkander verbonden zijn."}],"12":[{"catchword":"die buiten zijn","tekst":"Dat is, nog vreemd van de gemeente van Christus, en van het geloof; Eph 2:12 ."},{"catchword":"die binnen zijn?","tekst":"Dat is, die voor leden van de gemeente gehouden worden, die hij vs.11 broeders noemt."}],"13":[{"catchword":"oordeelt God","tekst":"Dat is, behoudt die tot zijn eigen oordeel, om die te straffen of te bekeren. Waarmede hij toont dat al is het dat zulke buiten de tucht van de kerk zijn, dat zij daarom van Gods oordeel niet vrij zijn. Zie dergelijke wijze van spreken 1Co 11:32 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"It is wholly reported [That is, not as an uncertain report, but as a certain thing] (that there is) fornication among you, and such fornication as is not named even among the Gentiles; [namely, without detestation or abomination. For howsoever here and there in the Greek, Roman, and other histories such examples are found, yet not withstanding they are always condemned by them as unfitting and unlawful] so that one hath his Fathers wise.[that is, his mother in Law, as she is also called in Gods word, Levit. 18.8.]"}],"2":[{"catchword":null,"tekst":"And are ye (yet) puffed up, and have not much rather mourned? [Namely, as men do when there is cause of common sorrow: for although such are sins of particular persons, yet nevertheless they concern the whole Church, because Gods name is blasphemed for it, and his wrath kindled thereby against the whole congregation, if they be not duly punished] that they may take away out of the midst of you, [that is, by Christian excommunication cast out of your congregation, as hereafter ver. 7.11. is declared] that hath done this indeed."}],"3":[{"catchword":null,"tekst":"But I, as being indeed absent in body, but present in Spirit, [That is, with my thoughts, will, and the power of the Spirit. See the like, 2 Kings 5.26. Col. 2.5.] have decreed already as (if I were) present, him that hath so committed that (thing.)"}],"4":[{"catchword":null,"tekst":"In the name of the Lord Jesus Christ [That is, according to the command and charge of Christ, and with calling upon his name, Mat. 18.ver.15.] when ye and my Spirit shall be gathered (together,) with the power of the Lord Jesus Christ, [that is, the powerfull working of Christ in the hearts of those amongst whom, and against whom this punishment is lawfully used. See Mat. 18.ver.18.19,20.]"}],"5":[{"catchword":null,"tekst":"To deliver over such a one unto Satan, [That is, to banish him out of your communion, or as Christ speaks Mat. 18.ver.17. to account him as a heathen and a Publican. For without the Church of Christ Satan hath his Kingdome. See 2 Tim 2.ver.25,26.] for the destruction of flesh, that is, for the mortifying and abolishing of the old man, i.e. of the corrupt nature, which is everywhere called flesh, See Rom. 8.13. Gal. 5.24.] that the Spirit may be saved [that is, the new man, which by the fleshly desires and sins seemed as it were dead and buried, may be raised up again, and to obtain the conquest, until that in the day of Christ coming, it shall wholly and only reign in us] in the day of the Lord Jesus."}],"6":[{"catchword":null,"tekst":"Your glorying [Namely, whereby you glory is as if you and your Church were altogether perfect] is not good. Know ye not that the little leaven [Gr. A small leaven. By this similitude the Apostle declares, that a scandalous person if he be not punished in the Church, easily draws others to imitate him] makes the whole dough sowre?"}],"7":[{"catchword":null,"tekst":"Purge out therefore the old leaven [This may either particularly be understood of the purging out, or casting out of this scandalous person, that the whole Church might be without infamy and danger of further infection, seeing that they were already by the spirit of God in a great part freed from the leaven of natural corruption. Or in general for a universal exhortation by occasion of the foregoing similitude, namely that each one in particulars should more and more purge out of himself the old leaven of sin, as they were already delivered from the dominion thereof. See Eph. 4.22. Col. 3.5,9,10.] that ye may be a new dough, even as ye are unsowred. For even our Passover is slain for us, (namely) Christ. [Or, our Passover is offered for us, i.e. the Passover which is offered for us for the expiation of our sins. Christ is here called the Passover, which is often used of the Sacraments ( as the bread in the Lords Supper is called the body of Christ, and the communion of the body of Christ) because the Paschall lamb was a sign and figure of Christ and his sacrifice. See Joh 19:36.]"}],"8":[{"catchword":null,"tekst":"So then let us feast, [That is, in that which the Israelites were to do in the type, after the killing of the outward Passover, on the preparation of the Passover, by the purging out of all leaven, and by obtaining of from leaven bread for seven days, according to Gods command, Exod. 12.ver.15. that the Apostle commands the Christians to do in the signified all their life long: namely to walk holily and righteously before God and men, and for this cause also to take away all offences from among them, since they are reconciled unto God by the sacrifice and sprinkling of the blood of Christ] not in the old leaven, [that is, in the defilement of natural corruption in which we are born] nor in leaven of evil and wickedness, which natural men yet daily heap thereunto] but in the unleavened (bread) [that is, in a pure and undefiled walking] of uprightness and truth."}],"9":[{"catchword":null,"tekst":"I wrote to you in the Epistle [This some understand of another Epistle which the Apostle should have written to the Church of Corinth before this, because the words which follow are not before expressed in so many letters: but seeing the sense of these words is related before in the second and seventh verses, therefore this may fitly be understood of the same Epistle of Paul] that you should not mingle your selves with fornicators. [that is, not admit them unto the communion of your congregation and converse ordinarily with them as brethren. See ver.11.]"}],"10":[{"catchword":null,"tekst":"But not altogether [That is, this I understand not in general of all such scandalous persons, which dwell among you or with you] with the fornicators of this world, or with covetous, or with extortioners, or with idolaters: for otherwise ye must go out of the world. [namely, seeing the world is full of such men, with whom ye daily have to do, whose footsteps ye must not follow, but whom you must seek to win to Christ, Mat. 5.16. Eph. 5.11. And although this agrees to all ages, yet not withstanding it agrees most of all to that age, in which Gentilism prevailed, who were all idolaters, whereupon these other sins commonly follow.]"}],"11":[{"catchword":null,"tekst":"But now I have written unto you [that is, I thought it needful to write unto you, that ye may well understand me] that ye should not mingle your selves, (namely) if any one being a brother [namely, beheld, and acknowledged for a member of the Church ; as Christians every where in the Acts of the Apostles, and the Epistle of the same, are called brethren; as Christ also speaks thus of this Ecliasticall discipline, Mat. 18.15.] be a fornicator, or a covetous person, or an idolater [that Christ at that time sometimes also themselves into idolatry appears, 1 Cor. 10.20. Rev. 2.14.20.] or a rattler, or a drunkard, or an extortioner: that with such a one ye shall not so much as eat. [that is, shall keep no similar and public mutual friendship with such, that they may be ashamed. See 2 The. 3.14. 2 Joh. V.10. Otherwise the Apostle forbids not that by man and wise, parents and children, and the like, even civil communion it self ( whereunto the law of nature and manners of men oblige us) discipline doth but deprive such of the communion which is proper to Christians, as well in the spiritual as temporals: not (that) whereby there are obliged one to another as men or citizens in general.]"}],"12":[{"catchword":null,"tekst":"For what have I also to do to judge them that are without? [Namely, yet strangers from the Church of Christ and from the faith, Eph. 2.12.] do ye not judge them? [that is, them that are account members of the church, whom ver. 11. he calls brethren.] But them that are without God judgeth. [That is, receives them to his own judgment, to punish or convert them. Whereby he shews that albeit such are without the discipline of the church, yet they are not therefore free from the judgment of God. See the like phrase, 1 Cor. 11.32.] And put ye away this wicked person out of you."}],"13":[{"catchword":null,"tekst":"But them that are without God judges. [That is, receives them to his own judgement, to punsih or convert them. Whereby he shews that albeit such are without the discipline of the church, yet they are not therefore free from the judgement of God. See the like phrase, 1 Cor. 11.32.] And put ye away this wicked person out of you."}]}}};

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
