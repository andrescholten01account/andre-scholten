 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Wat de verzameling betreft, die voor de heiligen gebeurt: zoals ik aan de Gemeenten in Galatië verordend heb, doet u ook zo.","2":"Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.","3":"En wanneer ik daar gekomen zal zijn, zal ik hen die u bekwaam zult achten door brieven zenden, om uw gave naar Jeruzalem over te dragen.","4":"En als het de moeite waard mocht zijn dat ik ook zelf zou reizen, zullen zij met mij reizen.","5":"Ik zal echter tot u komen, wanneer ik Macedonië doorgegaan zal zijn (want ik zal door Macedonië gaan);","6":"en ik zal misschien bij u blijven, of ook overwinteren, opdat u mij op weg kunt helpen, waar ik ook heen zal reizen.","7":"Want ik wil u nu niet zien terwijl ik onderweg ben, maar ik hoop enige tijd bij u te blijven, als de Heere het zal toelaten.","8":"Maar ik zal in Efeze blijven tot de Pinksterdag.","9":"Want mij is een grote en krachtige deur geopend, en er zijn veel tegenstanders.","10":"Als Timotheüs nu komt, ziet erop dat hij zonder vrees bij u is; want hij doet het werk van de Heere, zoals ik ook.","11":"Laat hem dan niemand verachten, maar helpt hem op weg in vrede, opdat hij tot mij komt; want ik verwacht hem met de broeders.","12":"En wat Apollos betreft, de broeder: ik heb hem zeer gevraagd om met de broeders naar u te komen; maar het was zijn wil helemaal niet om nu te komen; hij zal echter komen wanneer het hem goed gelegen zal zijn.","13":"Waakt, staat vast in het geloof, houdt u mannelijk, weest sterk.","14":"Laat al uw dingen in de liefde gebeuren.","15":"En ik bid u, broeders, u kent het huis van Stefanas, dat het de eersteling van Achaje is, en dat zij zichzelf ten dienst van de heiligen hebben geschikt;","16":"dat u zich ook aan zulke mensen onderwerpt, en aan ieder die meewerkt en arbeidt.","17":"En ik verblijd mij over de komst van Stefanas, en Fortunatus, en Achaïkus, want dezen hebben vervuld wat u ontbrak;","18":"want zij hebben mijn geest verkwikt, en ook de uwe. Erkent dan zulke mensen.","19":"U groeten de Gemeenten van Azië. U groeten zeer in de Heere Aquila en Priscilla, met de Gemeente die in hun huis is.","20":"U groeten al de broeders. Groet elkaar met een heilige kus.","21":"De groet met mijn hand, van Paulus.","22":"Als iemand de Heere Jezus Christus niet liefheeft, laat die een vervloeking zijn; Maran-atha!","23":"De genade van de Heere Jezus Christus zij met u.","24":"Mijn liefde zij met u allen in Christus Jezus. Amen. *De* eerste brief aan de Korinthiërs werd geschreven vanuit Filippi door Stefanas, en Fortunatus, en Achaïkus, en Timotheüs."},"SV":{"1":"Aangaande nu de verzameling, die voor de heiligen *geschiedt*, gelijk als ik aan de Gemeenten in Galatië verordend heb, doet ook gij alzo.","2":"Op elken eersten *dag* der week, legge een iegelijk van u *iets* bij zichzelven weg, vergaderende een schat, naar dat hij welvaren verkregen heeft; opdat de verzamelingen alsdan niet *eerst* geschieden, wanneer ik gekomen zal zijn.","3":"En wanneer ik daar zal gekomen zijn, zal ik hen, die gij zult bekwaam achten door brieven, zenden, om uw gave naar Jeruzalem over te dragen.","4":"En indien het *der* *moeite* waardig mocht zijn, dat ik ook *zelf* reizen zou, zo zullen zij met mij reizen.","5":"Doch ik zal tot u komen, wanneer ik Macedonië zal doorgegaan zijn, ( want ik zal door Macedonië gaan)","6":"En ik zal mogelijk bij u blijven, of ook overwinteren, opdat gij mij moogt geleiden, waar ik zal henenreizen.","7":"Want ik wil u nu niet zien in het voorbijgaan, maar ik hoop enigen tijd bij u te blijven, indien het de Heere zal toelaten.","8":"Maar ik zal te Efeze blijven tot den pinkster *dag*.","9":"Want mij is een grote en krachtige deur geopend, en er zijn vele tegenstanders.","10":"Zo nu Timotheüs komt, ziet, dat hij buiten vreze bij u zij; want hij werkt het werk des Heeren, gelijk als ik.","11":"Dat hem dan niemand verachte; maar geleidt hem in vrede, opdat hij tot mij kome; want ik verwacht hem met de broederen.","12":"En wat aangaat Apollos, den broeder, ik heb hem zeer gebeden, dat hij met de broederen tot u komen zou; maar het was ganselijk *zijn* wil niet, dat hij nu zou komen; doch hij zal komen, wanneer het hem wel gelegen zal zijn.","13":"Waakt, staat in het geloof, houdt u mannelijk, zijt sterk.","14":"Dat al uw dingen in de liefde geschieden.","15":"En ik bid u, broeders, gij kent het huis van Stefanas, dat het is de eersteling van Achaje, en *dat* zij zichzelven den heiligen ten dienst hebben geschikt;","16":"Dat gij ook u aan de zodanigen onderwerpt, en aan een iegelijk, die medewerkt en arbeidt.","17":"En ik verblijde mij over de aankomst van Stefanas, en Fortunatus, en Achaïkus, want dezen hebben vervuld hetgeen *mij* aan u ontbrak;","18":"Want zij hebben mijn geest verkwikt, en *ook* den uwen. Erkent dan de zodanigen.","19":"U groeten de Gemeenten van Azië. U groeten zeer in den Heere Aquila en Priscilla, met de Gemeente, die te hunnen huize is.","20":"U groeten al de broeders. Groet elkander met een heiligen kus.","21":"De groetenis met mijn hand van Paulus.","22":"Indien iemand den Heere Jezus Christus niet liefheeft, die zij een vervloeking; Maran-atha!","23":"De genade van den Heere Jezus Christus zij met u.","24":"Mijn liefde zij met u allen in Christus Jezus. Amen. *De* eerste brief aan de Korinthiërs werd geschreven vanuit Filippi door Stefanas en Fortunatus en Achaicus en Timotheüs."},"KJV":{"1":"Now concerning the collection for the saints, as I have given order to the churches of Galatia, even so do ye.","2":"Upon the first day of the week let ➔ every one of you lay by him in store, as God hath prospered him, that ➔ there be no gatherings when I come.","3":"And when I come, whomsoever ye shall approve by your letters, them will I send to bring your liberality unto Jerusalem.","4":"And if it be meet that I go also, they shall go with me.","5":"Now I will come unto you, when I shall pass through Macedonia: for I do pass through Macedonia.","6":"And it may be that I will abide, yea, and winter with you, that ye may bring ➔ me on my journey whithersoever I go.","7":"For I will not see you now by the way; but I trust to tarry a while with you, if the Lord permit.","8":"But I will tarry at Ephesus until Pentecost.","9":"For a great door and effectual is opened unto me, and there are many adversaries.","10":"Now if Timotheus come, see that he may be with you without fear: for he worketh the work of the Lord, as I also do.","11":"Let ➔ no man therefore despise him: but conduct ➔ him forth in peace, that he may come unto me: for I look for him with the brethren.","12":"As touching our brother Apollos, I ➔ greatly desired him to come unto you with the brethren: but his will was not at all to come at this time; but he will come when he shall have convenient time.","13":"Watch ye, stand fast in the faith, quit you like men, be strong.","14":"Let ➔ all ➔ your things be done with charity.","15":"I beseech you, brethren, (ye know the house of Stephanas, that it is the firstfruits of Achaia, and that they have addicted themselves to the ministry of the saints,)","16":"That ye submit yourselves unto such, and to every one that helpeth with us, and laboureth.","17":"I am glad of the coming of Stephanas and Fortunatus and Achaicus: for that which was lacking on your part they have supplied.","18":"For they have refreshed my spirit and yours: therefore acknowledge ye them that are such.","19":"The churches of Asia salute you. Aquila and Priscilla salute you much in the Lord, with the church that is in their house.","20":"All the brethren greet you. Greet ye one another with an holy kiss.","21":"The salutation of me Paul with mine own hand.","22":"If any man love not the Lord Jesus Christ, let him be Anathema Maranatha.","23":"The grace of our Lord Jesus Christ be with you.","24":"My love be with you all in Christ Jesus. Amen.[fn]"}},"tsk":{"1":[{"kopje":"betreft","refs":["Hand 11:28","Hand 11:30","Hand 24:17","Rom 15:25","Rom 15:26","2 Kor 8:1","2 Kor 9:15","Gal 2:10"]},{"kopje":"de heiligen","refs":["Hand 9:41","Rom 12:13","2 Kor 9:12-15","Filem 1:5","Filem 1:7","Hebr 6:10","1 Joh 3:17"]},{"kopje":"de Gemeenten","refs":["Hand 16:6","Hand 18:23","Gal 1:2"]}],"2":[{"kopje":"eerste","refs":["Luk 24:1","Joh 20:19","Joh 20:26","Hand 20:7","Openb 1:10"]},{"kopje":"welvaren","refs":["Gen 26:12","Gen 30:27","Gen 30:30","Gen 32:10","Gen 33:11","Deut 8:18","Deut 15:11-14","2 Kron 31:10","Hagg 2:17-20","Mal 3:9","Mal 3:10","Mark 12:41-44","Mark 14:8","Luk 16:10","2 Kor 8:1-3","2 Kor 8:12-15"]},{"kopje":"niet","refs":["2 Kor 8:11","2 Kor 9:3-5"]}],"3":[{"kopje":"wanneer","refs":["1 Kor 4:19-21","1 Kor 11:34"]},{"kopje":"die","refs":["Hand 6:1-6","2 Kor 8:19-24"]},{"kopje":"gave","refs":["2 Kor 8:4","2 Kor 8:6","2 Kor 8:19"]}],"5":[{"kopje":" {"1":[{"catchword":"de verzameling","tekst":"Namelijk der penningen, die vergaderd worden uit de gemeente."},{"catchword":"die voor de heiligen","tekst":"Dat is, voor de arme gelovigen te Jeruzalem zijnde, onder wie groot gebrek was, zo vanwege den duren tijd, van Agabus voorzegd, Act 11:28 , alsook om de harde vervolging tegen deze gemeente, die daardoor genoodzaakt was bijstand te verzoeken bij de Griekse gemeenten, die toen bloeiden. Van deze inzameling, zie ook Rom 15:25-26 ; 2Co 8:1 ; Gal 2:10 ."},{"catchword":"aan de gemeente","tekst":"Zie van deze gemeenten Gal 1:2 ."},{"catchword":"verordineerd heb,","tekst":"Namens op welke wijze en tijd deze inzameling bekwamelijk kan aangesteld en gedaan worden."},{"catchword":"doet ook gij alzo","tekst":"Dat is, volgt haar voorbeeld na, zo in het mildelijk geven, Rom 12:13 , als in het onderhouden van de orde in het inzamelen, die in vs.2 beschreven wordt."}],"2":[{"catchword":"eersten dag","tekst":"Gr. enen. Hebr. Zie dergelijke wijze van spreken Gen 1:5 ; Dan 9:1 . Zie ook Mat 28:1 ; Mar 16:9 ; Luk 24:1 ."},{"catchword":"der week, legge","tekst":"Gr. der sabbaten, waardoor de gehele week dikwijls wordt genoemd. Zie Mar 16:9 ; Joh 20:1 . Deze eerste dag wordt van Johannes genaamd des Heeren dag, Rev 1:10 , omdat de Heere Christus op dien dag van de doden is opgestaan. Op dezen dag plegen de apostelen hunne vergaderingen te houden; Joh 20:19 , Joh 20:26 ; Act 20:7 ."},{"catchword":"een iegelijk van u","tekst":"Namelijk lidmaat uwer gemeente, die enige middelen heeft."},{"catchword":"iets bij zichzelven","tekst":"Namelijk om tot de nooddruft der armen gegeven te worden. Want altemet wat weg te leggen, bezwaart zozeer niet, en veel kleine maken een grote."},{"catchword":"vergaderende een schat,","tekst":"Dat is, alzo mettertijd gelijk een schat bijeenbrengende. Of, verzekerd zijnde dat gij u daarmede een schat zult vergaderen in den hemel; Mat 6:20 ."},{"catchword":"welvaren verkregen","tekst":"Het Griekse woord betekent eigenlijk een goeden weg of reis hebben, gelijk Rom 1:10 , en wordt bij gelijkenis voor allerlei voorspoed genomen. Elkeen moet dan geven naar dat hem de Heere gezegend heeft; 2Co 8:12 ."},{"catchword":"alsdan niet eerst","tekst":"Namelijk hetwelk alsdan inderhaast zo bekwamelijk en vruchtbaar voor de armen niet zal kunnen geschieden."}],"3":[{"catchword":"die gij zult bekwaam","tekst":"Namelijk om de vergaderde aalmoezen getrouw over te brengen."},{"catchword":"door brieven","tekst":"Dit door brieven kan gevoegd worden bij het voorgaande woord bekwaam acht, in dezen zin: die gij door brieven aan mijzelven zult noemen en te kennen geven, dat gij die daartoe bekwaam en getrouw acht. Of, met het volgende woord zal ik zenden, namelijk met mijne brieven van aanbeveling aan de gemeente van Jeruzalem."},{"catchword":"gave naar Jeruzalem","tekst":"Gr. uwe genade; dat is, uw aalmoes, die gij hun zult geven uit enkele goedheid en barmhartigheid, door de genade Gods. Zie 2Co 8:1 ."}],"4":[{"catchword":"waardig mocht zijn,","tekst":"Of, nodig is."},{"catchword":"dat ik ook zelf","tekst":"De apostel biedt zijn dienst aan om die moeite gaarne te nemen, zo het nodig geacht werd; hetwelk hij ook gedaan heeft, gelijk blijkt Act 24:17 , en Rom 15:25 ."}],"5":[{"catchword":"wanneer ik Macedónië","tekst":"Zo was dan de apostel toen, als hij dezen brief schreef, nog niet in Macedonië gekomen, maar het blijkt uit vs.8, 19, dat hij toen nog te Efeze was. Waaruit volgt dat het niet zeker gaat, hetgeen onder dezen brief gesteld wordt, dat dezelve zou geschreven zijn te Filippi, welke ene stad was in Macedonië gelegen Act 16:12 ."}],"6":[{"catchword":"mogelijk bij u","tekst":"Dat is, indien het de Heere zal toelaten. Zie vs.7; Jam 4:15 ."},{"catchword":"overwinteren,","tekst":"Dat is, den gansen winter over bij u blijven, opdat gij mijn dienst genoegzaam moogt gebruiken."},{"catchword":"gij mij moogt geleiden","tekst":"Dat is, enigen uit uwe gemeente, die gij daartoe bestemmen zult."},{"catchword":"waar ik zal heenreizen","tekst":"Namelijk hetzij naar Jeruzalem, zo het nodig gevonden wordt, dat ik dezen dienst zelf zal doen, of ergens elders zal reizen om het Evangelie te verbreiden."}],"7":[{"catchword":"in het voorbijgaan,","tekst":"Of, als doorreizende, zonder bij u te blijven."},{"catchword":"indien het de","tekst":"Dewijl Hij bijzonder door Zijn Geest onze reizen bestuurt, waar Hij ons wil heenzenden, en door denzelven ook somtijds verhindert, dat wij niet mogen gaan waar wij voorgenomen hadden. Zie daarvan een voorbeeld Act 16:7 . Zie ook Jer 10:23 ; Rom 1:10 ; Jam 4:15 ."}],"8":[{"catchword":"te Éfeze","tekst":"Waar hij al twee jaren geweest was; Act 19:10 ."},{"catchword":"den pinkster- dag.","tekst":"Zie van dit woord de aantekeningen Act 2:1 , en Act 20:16 ."}],"9":[{"catchword":"krachtige","tekst":"Ten aanzien van den krachtigen zegen, dien de Heere geeft tot verbreiding des Evangelies en veler bekering."},{"catchword":"deur geopend,","tekst":"Dat is, goede gelegenheid wordt mij hier gegeven, om het Evangelie te verbreiden. Zie Act 14:27 ; 2Co 2:12 ; Rev 3:8 ."},{"catchword":"vele tegenstanders","tekst":"Namelijk die den loop des Evangelies zoeken te verhinderen; waarom mijne tegenwoordigheid hier nog nodig is, om dezelve tegen te staan en de gemeente tegen dezelve te sterken."}],"10":[{"catchword":"Timótheüs","tekst":"Zie van hem Act 16:1 ; 1Ti 1:2 . Dezen had Paulus gezonden om met Erastus de gemeenten te bezoeken; Act 19:22 ."},{"catchword":"buiten vrees","tekst":"Namelijk van de vijanden des Evangelies, zo der heidenen als der valse broeders, die den vromen leraars des Evangelies veel verdriet aandeden en in gevaar brachten."},{"catchword":"het werk des","tekst":"Namelijk van de predikatie des Evangelies; 1Ti 3:1 ."},{"catchword":"gelijk als ik","tekst":"Die met gelijke naarstigheid en trouw het Evangelie verkondigd, en den dienst des Woords bedient als ik, Phi 2:20 , hoewel hij geen apostel was, maar een evangelist; 2Ti 4:5 ."}],"11":[{"catchword":"verachte","tekst":"Namelijk om zijner jonkheid wil; 1Ti 4:12 ."},{"catchword":"in vrede, opdat","tekst":"Dat is, dat hij zeker en voorspoedig zonder zwarigheid en gevaar tot mij mag komen."}],"12":[{"catchword":"Apollos,","tekst":"Zie van dezen Apollos Act 18:24 , enz., en Act 19:1 ; 1Co 1:12 , en 1Co 3:6 , 1Co 3:22 ."},{"catchword":"zeer","tekst":"Gr. veel."},{"catchword":"gebeden dat hij","tekst":"Of, vermaand."},{"catchword":"ganselijk zijn","tekst":"Daarvan heeft hij zonder twijfel gewichtige redenen gehad; enigen menen om met zijne tegenwoordigheid niet te stijven de partij, die zeide: ik ben van Apollos; 1Co 1:12 ."}],"13":[{"catchword":"Waakt,","tekst":"Namelijk tegen de listen en lagen des satans; 1Pe 5:8 ."},{"catchword":"staat in het geloof,","tekst":"Dat is, blijft standvastig; 1Co 15:58 ."},{"catchword":"houdt u mannelijk,","tekst":"Namelijk in alle zwarigheden en gevaren, dat gij kloekmoedig dezelve overwint."},{"catchword":"zijt sterk","tekst":"Namelijk naar de ziel met een geestelijke sterkte aangedaan, om daardoor alle verzoekingen tegen te staan en te overwinnen."}],"14":[{"catchword":"Dat al uwe","tekst":"Deze vermaning heeft de apostel tevoren in het brede voorgesteld, 1Co 13 , en hij verhaalt dezelve hier wederom in het besluit van den brief, overmits zij zeer nodig is om alle tweespalt en scheuring weg te nemen, die gemeenlijk ontstaan uit gebrek aan liefde."}],"15":[{"catchword":"het huis van","tekst":"Dat is, het huisgezin."},{"catchword":"Stefanas,","tekst":"Zie van dezen 1Co 1:16 . Het schijnt dat hij diaken geweest is van de gemeente te Corinthe en een man van aanzien."},{"catchword":"de eersteling van","tekst":"Dat is, dat hetzelve onder de eerste in Achaje geweest is, die het Evangelie heeft aangenomen en tot Christus bekeerd is, en van mijzelven gedoopt; 1Co 1:16 . Epenetus wordt ook alzo genaamd, Rom 16:5 , omdat hij mede een van de eersten geweest is; die daarom te meer te prijzen en in achting te houden zijn."},{"catchword":"den heiligen ten","tekst":"Om de arme gelovigen te dienen met vergaderen en uitdelen der aalmoezen, en anderen handreiking te bewijzen; Act 6:1 ; Rom 15:25 ."},{"catchword":"geschikt;","tekst":"Gr. verordineerd; dat is, hebben zichzelven vrijwillig en geheel tot dien dienst begeven, welverstaande als zij daartoe wettig zijn beroepen geweest; Act 6:3 , Act 6:5 ."}],"16":[{"catchword":"onderwerpt,","tekst":"Namelijk niet alleen door gehoorzaamheid in de zaken hunnen dienst aangaande, maar ook door eerbieding om huns diensten wil; Eph 5:21 ."},{"catchword":"medewerkt en","tekst":"Namelijk met hen, in denzelfden of gelijken dienst, die men alle, om hunnen dienst in ere moet houden; 1Th 5:13 ."}],"17":[{"catchword":"over de aankomst","tekst":"Deze drie waren van Corinthe naar Paulus gereisd, om hem den staat van de gemeente aldaar bekend te maken, die hij, om hen van alle kwaad nadenken te bevrijden, prijst, en verklaart hunne komst hem aangenaam geweest te zijn."},{"catchword":"hetgeen mij","tekst":"Namelijk uw afwezen; dat is, ik ben door hunne komst zo vermaakt geweest, alsof ik in deze weinigen alle andere lidmaten der gemeente van Corinthe bij mij gehad had."}],"18":[{"catchword":"mijn geest","tekst":"Dat is, mijne ziel, mijn hart."},{"catchword":"verkwikt, en","tekst":"Of, rust gegeven; namelijk door hunne samensprekingen en onderrichtingen van de gelegenheid uwer kerk."},{"catchword":"ook den uwen","tekst":"Namelijk omdat ik verzekerd ben, als gij zult verstaan dat mijne ziel verkwikt is, dat ook de uwe daarmede verkwikt zal worden."},{"catchword":"Erkent dan de","tekst":"Dat is, houdt hen in goede achting, waarde en liefde."}],"19":[{"catchword":"van Azië","tekst":"Zo is dan de apostel toen in Azië geweest en niet in Macedonië. Zie vs.5, 8."},{"catchword":"Aquila","tekst":"Zie van deze Rom 16:3 . Deze waren met Paulus van Corinthe naar Efeze vertrokken; Act 18:2 ."},{"catchword":"de gemeente,","tekst":"Zie ook Rom 16:5 ."}],"20":[{"catchword":"met een heiligen kus","tekst":"Zie de aantekeningen Rom 16:16 ."}],"21":[{"catchword":"met mijne hand,","tekst":"Namelijk met welke ik dezen brief heb ondertekend. Het schijnt dat de apostel een bijzondere wijze gehad heeft om zijne hand te tekenen, die de gemeente bekend was; met mijne hand Paulus. Zie Col 4:18 ; 2Th 3:17 , opdat zijne brieven te beter van andere zouden onderkend worden; en dat hij den volgenden apostolischen wens, vs.23, ook met zijn eigen hand onder al de zendbrieven placht te stellen."}],"22":[{"catchword":"een vervloeking;","tekst":"Gr. Anathema; van welk woord, zie Rom 9:3 ; Gal 1:8 ."},{"catchword":"Maranatha","tekst":"Dit is een Chaldeeuws of Syrisch woord, hetwelk toen gebruikelijk schijnt geweest te zijn, om een zeer grote vervloeking, die bij de Hebreën Cherem genaamd wordt, uit te drukken; en betekent, gelijk sommigen menen, de Heere komt, of onze Heere komt. Dezen vloek spreekt de apostel uit over de onbekeerlijke mensen, niet uit een kwade beweging des gemoeds, maar uit een apostolischen geest en heiligen ijver. Zie Jud 1:14-15 ."}],"23":[{"catchword":"De genade van den","tekst":"Dit is het gewone besluit van al de zendbrieven des apostels."}],"24":[{"catchword":"Mijne liefde","tekst":"Dewijl de apostel sommigen dingen in dezen brief wat hard voorstelt, zo verklaart hij hier dat zulks niet uit kwaadwilligheid, maar uit liefde tot hen geschied is."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now concerning the collection [Namely, of money which was collected of the Church] which (is made) for the Saints [that is, for the poor believers being at Jerusalem, amongst whom there was great want, as well by reason of the death foretold by Agabus, Acts 11. 28. as also because of the hard persecution against that church, which was thereby necessitated to request relief of the churches of Greece which then flourished. Of this collection see also, Rom. 15. 25, 26. 2 Cor. 8. 1. Gal. 2. 10.] even as I have ordained [namely, in what manner and time this collection may fitly be ordered and made] to the churches Galatia, [See of these churches, Gal. 1. 2.] do ye so also. [that is, imitate their example, as well in liberal giving, Rom. 12. 13. as in observing the order in collecting, which is described in the following verse.]"}],"2":[{"catchword":null,"tekst":"On every first (day) [Gr, one. Hebr. See the like phrase, Gen. 1. 5. Dan. 1. 9. See also Mat. 28. 1. Mark 16. 9. Luke 24. 1.] of the week, [ Gr. of the Sabbaths&acirc;&euro;&trade;, whereby the whole week is often denominated. See Mark 16. 9. John 20. 1. The first day is by John called the Lords day, Rev. 1. 10. because the Lord Christ rose from the dead that day. On this day the Apostles used to hold their assemblies, John 20. 19, 26. Acts 20. 7.] let every one of you [namely, member of your church, who hath any means] lay away (somewhat) [namely to be given for the necessary supply of the poor: for to lay away somewhat now and then doth not burden so much, and many littles make a great] by himself, gathering a treasure, [that is, so in time, bringing as it were treasure together. Or being assured that thereby you shall gather yourselves a treasure in heaven, Mat. 6. 20.] according as he hath obtained welfare, [the Greek word properly signifies to have a good way or journey, as Rom. 1. 10. and is by a similitude taken for all manner of prosperity. Every one must give then according as God hath blessed him, 2 Cor. 8. 12.] that the gatherings may not then (first) be made when I shall be come. [namely, which then in hast cannot be made so conveniently and beneficial for the poor.]"}],"3":[{"catchword":null,"tekst":"And when I shall be come, whom ye shall judge fit [Namely, faithfully to carry over the gathered alms] by letters, [this by letters may be joined with the foregoing word judge fit, in this sense, whom you your selves by letters unto me shall name and give notice of, that ye judge them fit and faithful for this purpose. Or with the following word I will send, namely with my letters of recommendation to the Church of Jerusalem] the same will I send to carry over your gift [Gr. your grace, i.e. your alms which ye shall give them of mere goodness and mercy, by the grace of God. See 2 Cor. 8. 1.] unto Jerusalem."}],"4":[{"catchword":null,"tekst":"And if it may be worth (the trouble) [Or be needful] that I my(self) should go also, [the Apostle offers his service willingly to take that pains if it should be thought needful: which he also did, as appears Acts 24. 17. & Rom. 15. 25.] they shall go with me."}],"5":[{"catchword":null,"tekst":"But I will come unto you when I shall have gone through Macedonia, [So then the Apostle when he wrote this Epistle was yet not come into Macedonia, but it appears from ver. 8. and 19. that then he was yet at Ephesus. From whence it followeth that is not certain which is subscribed unto this Epistle, that it should be written at Phillipi, which was a City lying in Macedonia, Acts 16. 12.] (For I shall go through Macedonia.)"}],"6":[{"catchword":null,"tekst":"And it may be [That is, if God permit it. See ver. 7. Jam. 4. 15.] I shall tarry with you, or also winter (with you) [that is, abide with you the whole winter through, that you may sufficiently make use of my service] that ye [that is, some of your Church, whom you shall appoint thereunto] may conduct me, whither soever I shall travel. [namely, whether it be to Jerusalem, if it be found needful that I my self shall do this service, or shall travel any where else to spread abroad the Gospel.]"}],"7":[{"catchword":null,"tekst":"For I will not see now in passing by, [Or, as traveling through, without tarrying with you] but I hope to stay some time with you, if the Lord shall permit it. [seeing he by his sprit especially guides our journeys wither so ever he will send us: and by the same also hinders us, that we may not go wither we purposed. See example thereof Acts 16. 7. See also Jer. 10.23. Rom. 1.10. Jam. 4.15.]"}],"8":[{"catchword":null,"tekst":"But I will tarry at Ephesus [Where he had been two years, Acts 19.ver.10.] until the (day of) Pentecost. [see of this word the annotate. On Act 2:1. and 20.16.]"}],"9":[{"catchword":null,"tekst":"For a great and powerful [In respect of the powerful blessing which the Lord giveth for the propagating of the gospel, and the conversion of many] door [that is, here is good opportunity given me to spread abroad the Gospel. See Act 14:27. 2 Cor. 2.12 Revel. 3.8.] is opened to me, and there are many adversaries. [namely, which seek to hinder the course of the Gospel: wherefore my presence here is yet necessary to withstand the same, and to strengthen the Church against them.]"}],"10":[{"catchword":null,"tekst":"Now if Timothy come, [See of him, Act 16:1. and 1 Tim. 1.2. Him Paul had sent with Eraftus to visit the Churches, Act 19:22.] see that he may be with you without fear; [namely, of the enemies of the Gospel as well of the Gentiles, as of the false brethren, who procured much trouble to the upright teachers of the Gospel and brought them into danger] for he worketh the work of the Lord, [namely, of the preaching of the Gospel , 1 Tim. 3.1.] even as I, [who publisheth the Gospel, and executes the ministry of the word with like diligence and faithfulness as I, Phil. 2.20. although he was no Apostle but an Evangelist, 2 Tim. 4.5.]"}],"11":[{"catchword":null,"tekst":"Therefore let no man despise him, [Namely, because of his youth, 1 Tim.4.12.] but conduct him in peace [that is, that he may come unto me certainly and prosperously without trouble and danger] that he may come unto me: for I expect him with the brethren."}],"12":[{"catchword":null,"tekst":"And as concerning Apollo [See of this Apollo Acts 18 ver.24. etc. and 19.1. 1 Cor. 1.12.] and chap. 3. ver.6.22.] the brother, I greatly [Gr. much] entreated him [or, exhorted him] that he would come unto you with the brethren: but it was altogether not (his) will, [thereof without doubt he had weighty reasons: some think that by his presence he might not harden the party which said I am of Apollo, 1 Cor. 1.12.] that he should come now: but he come when it shall be convenient for him."}],"13":[{"catchword":null,"tekst":"Watch, [Namely, against the wiles and snares of Satan, 1 Pet. 5.8.] stand in the faith, [that is, continue steadfast, 1 Cor. 15.58.] carry yourselves like men, [namely, in all troubles and dangers, that you may courageously overcome the same] be strong [namely, in soul, endured with a spiritual strength, thereby to withstand and overcome all temptations.]"}],"14":[{"catchword":null,"tekst":"Let all your things be done in love. [This exhortation the Apostle propounded before at large chap. 13. and he researcheth the same here in the conclusion of the Epistle, forasmuch as it is very necessary to take away all divisions and schism, which commonly arise for want of love.]"}],"15":[{"catchword":null,"tekst":"And I beseech you brethren, ye know the house [That is, the household] of Stephanas, [see of him 1 Cor. 1.16.] It seemeth that he was a deacon of the Church of Corinth, and a man of worth] that it the first fruits of Achaia, [that the same was among the first in Achaia who received the Gospel and were converted unto Christ, and baptized by myself, 1 Cor. 16. Epenetus is also called, Rom. 16.5. because lealo was one of the first: who are therefore the mote to be commended and to be held in esteem] and (that) they have fitted themselves [Gr. ordained, i.e. have freely and wholly given themselves to that service; to wit when they were lawfully called thereunto, Acts 6.ver.3.5.] to the service of the Saints. [that is, to serve poor believers by gathering and distributing of alms, and affording them other relief, Act 6:1. Rom. 15.ver.25.]"}],"16":[{"catchword":null,"tekst":"That you also submit your selves [Namely, not only by obedience in the things concerning their ministry, but also by reverence for their ministry sake, Eph. 5.21.] to such, and every one that worketh together [namely, with them, in the same or the like ministry, all which must be held in honour for the ministry sake, 1 Thes. 5.13.] and laboureth."}],"17":[{"catchword":null,"tekst":"And I rejoice for the coming of Stephanas, and Fortunatus, and Achaicus, [These three had traveled from Corinth to Paul, to make known to him the state of the Church there, whom he, to free them from all evil suspicion commendeth, and declared that their coming was acceptable to him] for these had fulfilled that which (I) lacked in you. [namely, your absence, i.e. I was delighted with their coming, as if in these few I had had all rest of the members of the Church of Corinth with me.]"}],"18":[{"catchword":null,"tekst":"For they have refreshed [Or given rest, namely by their conferences and informations of the condition of your Church] my spirit, [that is, my soul, my heart] and yours (also) [namely, because I am assured that ye shall understand that my soul is refreshed, yours also will be refreshed therewith] acknowledge [that is, hold in good esteem, repute and love] therefore them that are such."}],"19":[{"catchword":null,"tekst":"The Churches of Asia [Therefore the Apostle was then in Asia, and not in Macedonia. See ver.5.8.] Salute you. Aquila and Priscilla [see of these Rom. 16.3.] These were departed with Paul from Corinth to Ephesus, Act 18:2.] Salute you very much in the Lord, with the Church which is at their house. [See also Rom. 16.5.]"}],"20":[{"catchword":null,"tekst":"All the brethren salute you. Salute one another with a holy kiss. [See the annotate. On Rom. 16.16.]"}],"21":[{"catchword":null,"tekst":"The salutation of Paul with my own hand [Namely, with which I have subsigned this Epistle. It seemeth that the Apostle had special manner to subscribe his hand which was known in the Churches, with mine own hand, of Paul. See Col. 4.18. and 2 Thes. 3.17. that his Epistle might be better be discerned from others, and that he used also to set the following Apostolical with ver. 23. under all his Epistles with his own hand.]"}],"22":[{"catchword":null,"tekst":"If any man love not the Lord Jesus Christ, let him be a curse, [Gr. Anathema, of which word see Rom. 9.3. Gal. 1.8.] Maranatha. [this is a Chalde or Syriack word, which seems to have been usual then, to express a very great curse, which by the Hebrews is called Cherem. And signifieth as some think the Lord cometh or our Lord cometh. This curse the Apostle pronounced upon impenitent persons, not out of the evil motion of the mind, but out of an Apostolic spirit, and holy zeal. See Jud. Ver.14.15.]"}],"23":[{"catchword":null,"tekst":"The grace of the Lord Jesus Christ be with you. [This is the ordinary conclusion of all the Epistles of the Apostle.]"}],"24":[{"catchword":null,"tekst":"My love [Seeing the Apostle propounds some in the Epistle some what hard; therefore he here declares that the same is done not out of ill will, but out of love to them] be with you all in Christ Jesus. Amen. *The first Epistle to the Corinthians, was written from Philipi, [That this is not very credible see the exposition on ver. 5 .8.19. And from hence it appears, as also from some other, that those words which are set after the conclusion of the Epistle of the Apostles, not always firm, and were added thereunto only by the judgment of some men] and (sent) by Stephanas, and Fortunatus, and Achaicus, and Timotheus."}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
// vanuit een rechtsklik-vertaalmenu (elders) kan de link ?vert=SV meegeven om
// meteen die vertaling te tonen, i.p.v. altijd terug te vallen op SVnu.
const _vertParam = new URLSearchParams(location.search).get('vert');
if (_vertParam && D.vertalingen[_vertParam]) vertaling = _vertParam;
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
