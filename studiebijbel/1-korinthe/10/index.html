ag drieëntwintigduizend.","9":"En laten wij Christus niet beproeven, zoals ook sommigen van hen Hem beproefd hebben, en werden door de slangen omgebracht.","10":"En mopper niet, zoals ook sommigen van hen gemopperd hebben, en werden omgebracht door de verderver.","11":"En al deze dingen zijn hun overkomen tot voorbeelden; en ze zijn beschreven tot waarschuwing voor ons, over wie het einde van de eeuwen gekomen is.","12":"Wie dan meent te staan, laat hij toezien dat hij niet valt.","13":"U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.","14":"Daarom, mijn geliefden, vlucht van de afgodendienst.","15":"Ik spreek als tegen verstandige mensen; oordeel u zelf wat ik zeg.","16":"De drinkbeker der dankzegging, die wij zegenen met dankzegging, is die niet een gemeenschap met het bloed van Christus? Het brood dat wij breken, is dat niet een gemeenschap met het lichaam van Christus?","17":"Want er is één brood, en zo zijn wij, hoewel velen, één lichaam, omdat wij allen deel hebben aan dat ene brood.","18":"Kijk naar Israël, dat naar het vlees is; hebben zij die de offers eten geen gemeenschap met het altaar?","19":"Wat zeg ik dan? Dat een afgod iets is, of dat een afgodenoffer iets is?","20":"Nee, maar ik zeg dat wat de heidenen offeren, zij dat aan de duivelen offeren en niet aan God; en ik wil niet dat u gemeenschap hebt met de duivelen.","21":"U kunt niet de drinkbeker van de Heere drinken én de drinkbeker van de duivelen; u kunt niet deelhebben aan de tafel van de Heere én aan de tafel van de duivelen.","22":"Of willen wij de Heere tot jaloersheid tergen? Zijn wij soms sterker dan Hij?","23":"Alle dingen zijn mij geoorloofd, maar niet alle dingen zijn nuttig; alle dingen zijn mij geoorloofd, maar niet alle dingen bouwen op.","24":"Niemand zoekt zijn eigen belang, maar ieder zoekt dat van de ander.","25":"Eet alles wat in de vleeshal verkocht wordt, zonder daarover vragen te stellen, omwille van het geweten;","26":"want de aarde is van de Heere, en al wat zij bevat.","27":"En als iemand van de ongelovigen u uitnodigt, en u besluit te gaan, eet dan alles wat u wordt voorgezet, zonder daarover vragen te stellen, omwille van het geweten.","28":"Maar als iemand tegen u zegt: Dit is afgodenoffer; eet het dan niet, omwille van hem die het u heeft laten weten, en omwille van het geweten. Want de aarde is van de Heere, en al wat zij bevat.","29":"Ik bedoel niet uw eigen geweten, maar dat van de ander; want waarom zou mijn vrijheid beoordeeld worden door het geweten van een ander?","30":"En als ik door genade deel heb aan het voedsel, waarom word ik dan belasterd over iets waarvoor ik dank?","31":"Of u dus eet, of drinkt, of iets anders doet, doe alles tot eer van God.","32":"Wees zonder aanstoot te geven, zowel voor de Joden als voor de Grieken als voor de gemeente van God.","33":"Zoals ik ook in alles allen probeer te behagen, niet mijn eigen voordeel zoekend, maar dat van velen, opdat zij behouden worden."},"SV":{"1":"En ik wil niet, broeders, dat gij onwetende zijt, dat onze vaders allen onder de wolk waren, en allen door de zee doorgegaan zijn;","2":"En allen in Mozes gedoopt zijn in de wolk en in de zee;","3":"En allen dezelfde geestelijke spijs gegeten hebben;","4":"En allen denzelfden geestelijken drank gedronken hebben; want zij dronken uit de geestelijke steenrots, die volgde; en de steenrots was Christus.","5":"Maar in het meerder *deel* van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn ter nedergeslagen.","6":"En deze dingen zijn geschied ons tot voorbeelden, opdat wij geen lust tot het kwaad zouden hebben, gelijkerwijs als zij lust gehad hebben.","7":"En wordt geen afgodendienaars, gelijkerwijs als sommigen van hen, gelijk geschreven staat: Het volk zat neder om te eten, en om te drinken, en zij stonden op om te spelen.","8":"En laat ons niet hoereren, gelijk sommigen van hen gehoereerd hebben, en er vielen op een dag drie en twintig duizend.","9":"En laat ons Christus niet verzoeken, gelijk ook sommigen van hen verzocht hebben, en werden van de slangen vernield.","10":"En murmureert niet, gelijk ook sommigen van hen gemurmureerd hebben, en werden vernield van den verderver.","11":"En deze dingen alle zijn hunlieden overkomen tot voorbeelden; en zijn beschreven tot waarschuwing van ons, op dewelke de einden der eeuwen gekomen zijn.","12":"Zo dan, die meent te staan, zie toe, dat hij niet valle.","13":"Ulieden heeft geen verzoeking bevangen dan menselijke; doch God is getrouw, Die u niet zal laten verzocht worden boven hetgeen gij vermoogt; maar Hij zal met de verzoeking ook de uitkomst geven, opdat gij ze kunt verdragen.","14":"Daarom, mijn geliefden, vliedt van den afgodendienst.","15":"Als tot verstandigen spreek ik; oordeelt gij, hetgeen ik zeg.","16":"De drinkbeker der dankzegging, dien wij *dankzeggende* zegenen, is die niet een gemeenschap des bloeds van Christus? Het brood, dat wij breken, is dat niet een gemeenschap des lichaams van Christus?","17":"Want een brood *is* *het*, *zo* zijn wij velen een lichaam, dewijl wij allen eens broods deelachtig zijn.","18":"Ziet Israël, dat naar het vlees is; hebben niet degenen, die de offeranden eten, gemeenschap met het altaar?","19":"Wat zeg ik dan? Dat een afgod iets is, of dat het afgodenoffer iets is?","20":"Ja, *ik* *zeg*, dat hetgeen de heidenen offeren, zij den duivelen offeren, en niet Gode; en ik wil niet, dat gij met de duivelen gemeenschap hebt.","21":"Gij kunt den drinkbeker des Heeren niet drinken, en den drinkbeker der duivelen; gij kunt niet deelachtig zijn aan de tafel des Heeren, en aan de tafel der duivelen.","22":"Of tergen wij den Heere? Zijn wij sterker dan Hij?","23":"Alle dingen zijn mij geoorloofd, maar alle dingen zijn niet oorbaar; alle dingen zijn mij geoorloofd, maar alle dingen stichten niet.","24":"Niemand zoeke dat zijns zelfs is; maar een iegelijk *zoeke* dat des anderen is.","25":"Eet al wat in het vleeshuis verkocht wordt, niets ondervragende, om des gewetens wil;","26":"Want de aarde is des Heeren, en de volheid derzelve.","27":"En indien u iemand van de ongelovigen noodt, en gij *daar* gaan wilt, eet al wat ulieden voorgesteld wordt, niets ondervragende, om des gewetens wil.","28":"Maar zo iemand tot ulieden zegt: Dat is afgodenoffer; eet *het* niet, om desgenen wil, die *u* *dat* te kennen gegeven heeft, en *om* des gewetens wil. Want de aarde is des Heeren, en de volheid derzelve.","29":"Doch ik zeg: *om* het geweten, niet van uzelven, maar des anderen; want waarom wordt mijn vrijheid geoordeeld van een ander geweten?","30":"En indien ik door genade *der* *spijze* deelachtig ben, waarom word ik gelasterd over hetgeen, waarvoor ik dankzeg?","31":"Hetzij dan dat gijlieden eet, hetzij dat gij drinkt, hetzij dat gij iets *anders* doet, doet het al ter ere Gods.","32":"Weest zonder aanstoot te geven, en den Joden, en den Grieken, en der Gemeente Gods.","33":"Gelijkerwijs ik ook in alles allen behaag, niet zoekende mijn eigen voordeel, maar het *voordeel* van velen, opdat zij mochten behouden worden."},"KJV":{"1":"Moreover, brethren, I would not that ye should be ignorant, how that all our fathers were under the cloud, and all passed through the sea;","2":"And were ➔ all baptized unto Moses in the cloud and in the sea;","3":"And did ➔ all eat the same spiritual meat;","4":"And did ➔ all drink the same spiritual drink: for they drank of that spiritual Rock that followed them: and that Rock was Christ.","5":"But with many of them God was ➔ not well pleased: for they were overthrown in the wilderness.","6":"Now these things were our examples, to the intent we should not lust after evil things, as they also lusted.","7":"Neither be ye idolaters, as were some of them; as it is written, The people sat down to eat and drink, and rose up to play.","8":"Neither let us commit fornication, as some of them committed, and fell in one day three and twenty thousand.","9":"Neither let us tempt Christ, as some of them also tempted, and were destroyed of serpents.","10":"Neither murmur ye, as some of them also murmured, and were destroyed of the destroyer.","11":"Now all these things happened unto them for ensamples: and they are written for our admonition, upon whom the ends of the world are come.","12":"Wherefore let ➔ him that thinketh he standeth take heed lest he fall.","13":"There hath ➔ no temptation taken you but such as is common to man: but God is faithful, who will ➔ not suffer you to be tempted above that ye are able; but will ➔ with the temptation also make a way to escape, that ye may be able to bear it.","14":"Wherefore, my dearly beloved, flee from idolatry.","15":"I speak as to wise men; judge ye what I say.","16":"The cup of blessing which we bless, is it not the communion of the blood of Christ? The bread which we break, is it not the communion of the body of Christ?","17":"For we ➔ being many are one bread, and one body: for we are ➔ all partakers of that one bread.","18":"Behold Israel after the flesh: are ➔ not they which eat of the sacrifices partakers of the altar?","19":"What say I then? that the idol is any thing, or that which is offered in sacrifice to idols is any thing?","20":"But I say, that the things which the Gentiles sacrifice, they sacrifice to devils, and not to God: and I would not that ye should have fellowship with devils.","21":"Ye cannot drink the cup of the Lord, and the cup of devils: ye cannot be partakers of the Lord's table, and of the table of devils.","22":"Do we provoke ➔ the Lord to jealousy? are we stronger than he?","23":"All things are lawful for me, but all things are ➔ not expedient: all things are lawful for me, but all things edify not.","24":"Let ➔ no man seek his own, but every man another's wealth.","25":"Whatsoever is sold in the shambles, that eat, asking ➔ no question for ➔ conscience sake:","26":"For the earth is the Lord's, and the fulness thereof.","27":"If any of them that believe not bid you to a feast, and ye be disposed to go; whatsoever is set before you, eat, asking ➔ no question for ➔ conscience sake.","28":"But if any man say unto you, This is offered in sacrifice unto idols, eat not for his sake that shewed it, and for conscience sake: for the earth is the Lord's, and the fulness thereof:","29":"Conscience, I say, not thine own, but of the other: for why is ➔ my liberty judged of another man's conscience?","30":"For if I by grace be a partaker, why am I evil spoken of for that for which I give thanks?","31":"Whether therefore ye eat, or drink, or whatsoever ye do, do all to the glory of God.","32":"Give none offence, neither to the Jews, nor to the Gentiles, nor to the church of God:","33":"Even as I please all men in all things, not seeking mine own profit, but the profit of many, that they may be saved."}},"tsk":{"1":[{"kopje":"Ik wil","refs":["1 Kor 12:1","1 Kor 14:38","Rom 11:21"]},{"kopje":"onze","refs":["Joh 4:20","Rom 4:11","Gal 3:29"]},{"kopje":"waren","refs":["Ex 13:21","Ex 13:22","Ex 14:19","Ex 14:20","Ex 40:34","Num 9:15-22","Num 14:14","Deut 1:33","Neh 9:12","Neh 9:19","Ps 78:14","Ps 105:39"]},{"kopje":"en gingen allen","refs":["Ex 14:19-22","Ex 14:29","Num 33:8","Joz 4:23","Neh 9:11","Ps 66:6","Ps 77:17-21","Ps 78:13","Ps 78:53","Ps 106:7-11","Ps 114:3-5","Ps 136:13-15","Jes 58:11-13","Hebr 11:29","Openb 15:2","Openb 15:3"]}],"4":[{"kopje":"dronken","refs":["Ex 17:6","Num 20:11","Ps 78:15","Ps 78:20","Ps 105:41","Jes 43:20","Jes 48:21","Joh 4:10","Joh 4:14","Joh 7:37","Openb 22:17"]},{"kopje":"die hen volgde","refs":["Deut 9:21"]},{"kopje":"die steenrots","refs":["1 Kor 11:24","1 Kor 11:25","Gen 40:12","Gen 41:26","Ezech 5:4","Ezech 5:5","Dan 2:38","Dan 7:17","Matt 13:38","Matt 13:39","Matt 26:26-28","Gal 4:25","Kol 2:17","Hebr 10:1"]}],"6":[{"kopje":"deze","refs":["1 Kor 10:11","Zef 3:6","Zef 3:7","Hebr 4:11","2 Petr 2:6","Judas 1: gde,","tekst":"Namelijk den Israelieten, met de stromen of beken die uit haar vloten, nadat zij van Mozes was geslagen; Num 20:8 ; Psa 105:41 ."},{"catchword":"was Christus","tekst":"Dat is, was een teken en voorbeeld van Christus, die van den Vader ter dood om onzentwil geslagen zijnde, ons de stromen des levenden waters zou uitgeven; Joh 7:38 . En dit is ene wijze van spreken, gebruikelijk in de sacramenten, gelijk het brood en den wijn in het Avondmaal het lichaam en bloed van Christus worden genaamd, omdat zij daarvan een teken en zegel zijn. Dat sommigen willen zeggen, dat de zin zou zijn: Christus was de steenrots, strijdt niet alleen met de orde der woorden van den tekst, maar ook met de zaak zelve, overmits al de Israelieten niet kunnen gezegd worden uit Christus gedronken te hebben, alzo velen van hen niet geloofden, en God in hen geen welgevallen gehad heeft, vs.5, en Heb 4:2 ."}],"5":[{"catchword":"terneder geslagen","tekst":"Namelijk om huns ongeloofs wil, gelijk Paulus verklaart Heb 3:17-19 ."}],"6":[{"catchword":"tot voorbeelden,","tekst":"Dat is, tot voorbeelden en waarschuwingen, namelijk dat wij, zo wij dergelijke zonden navolgen, niettegenstaande wij deze heilige tekenen ook zullen deelachtig geweest zijn, delzefde straf, die hun daarom overkomen is, ook niet zullen ontgaan. Zie van dit woord vs.11; Phi 3:17 ; 1Ti 4:12 ; Tit 2:7 ."},{"catchword":"geen lust","tekst":"Gr. geen begeerders zijn van kwade dingen; namelijk van afgoderij, hoererij en dergelijke, welke hierna verhaald worden."}],"7":[{"catchword":"sommigen van","tekst":"Dat is, een groot deel van hen, namelijk die met het gegoten kalf afgoderij bedreven."},{"catchword":"om te spelen","tekst":"Dat is, om te dansen, lachen en reien, gelijk de afgodendienaars, en hun afgodische maaltijden, gemeenlijk plachten te doen; Exo 32:6 ."}],"8":[{"catchword":"gehoereerd hebben,","tekst":"Namelijk in het land der Midianieten, door den raad van Bileam tot afgoderij en hoererij verlokt zijnde; Num 25 ."},{"catchword":"drie en twintig","tekst":"Num 25:9 wordt gezegd vier en twintig duizend. Doch het kan zijn dat er tussen de drie en vier en twintig duizend gebleven zijn, waarvan de apostel het minder getal heeft gehouden. Anderen menen dat er drie en twintig duizend met het zwaard zouden gedood zijn, naar het voorbeeld van den ijver van Pinehas, en dat de andere duizend van de voornaamsten daarna zouden gehangen zijn door het bevel van Mozes."}],"9":[{"catchword":"verzoeken,","tekst":"Dat is, tergen, of zijne macht in het straffen der ondankbaren in twijfel trekken, gelijk de Israelieten, Num 21:5 , als zij met het manna niet tevreden waren, noch met de wateren, die hun de Heere wonderbaarlijk verleende; en gelijk de Corinthiërs, die de maaltijden der afgodendienaren, die vol aanstoot en gevaar waren, liever volgden dan den eenvoudigen kost, dien de Heere hun tehuis verleende."},{"catchword":"verzocht hebben,","tekst":"Namelijk Christus, dien hij terstond genoemd had. Want het was de engel des verbonds, de eeuwige Zoon Gods, die hen in de woestijn geleidde, en dien zij tergden. Zie Exo 14:19 , en Exo 23:20 , en Isa 63:9 ."}],"10":[{"catchword":"gemurmureerd hebben,","tekst":"De Israelieten hebben in de woestijn menigmaal tegen God gemurmureerd, wanneer hun iets ontbrak, of wanneer zij niet tevreden waren met de weldaden, die God hun deed; maar hier wordt inzonderheid gezien op de geschiedenissen, Num 11:4 , Num 11:33 , wanneer zij vlees begeerden en daarover van God door verscheidene plagen vernield werden; en Num 16:1-2 , wanneer Korach met zijnen hoop tegen Mozes en Aäron murmureerden en sommigen zijn verbrand, sommigen verzonken in de aarde."},{"catchword":"van den verderver","tekst":"Deze naam wordt wel in deze geschiedenis niet gevonden, maar wordt van Paulus daarbij gevoegd, òf om de strengheid van God zelf in deze straffen hierdoor te verstaan, òf een engel, dien God tot deze vernieling heeft gebruikt, gelijk Hij gedaan heeft Exo 12:23 , en Isa 37:36 ."}],"11":[{"catchword":"tot voorbeelden","tekst":"Dat is, voorbeelden der straffen over de zodanigen. Zie vs.6."},{"catchword":"de einden der","tekst":"Dat is, de laatste tijden, in welke de genade Gods krachtiger is en de boosheid meerder; waarom wij ons door de genade Gods te meer moeten wachten; 1Ti 4:1 ; 2Pe 3:3 ."},{"catchword":"gekomen zijn","tekst":"Gr. ontmoeten, of ontmoet zijn."}],"12":[{"catchword":"die meent te staan,","tekst":"Dat is, die zich laat dunken zo vast te zijn in het geloof, dat hij in zulke zonden niet zou vervallen."},{"catchword":"zie toe","tekst":"Dat is, zij zorgvuldig dat hij daar door niet worde ten val gebracht, om die zonden en ergernissen te begaan, waarover God de Israelieten gestraft heeft. Waaruit blijkt dat de apostel de gelovigen niet vermaant tot vertwijfeling aan hunne zaligheid, tegen zijn eigen leer, Rom 5:1 , en Rom 8:31 , maar dat hij de eigendunkelijken alleen waarschuwt, om op zichzelven niet te steunen en de oorzaken te vlieden, waardoor zij ten val mochten gebracht worden. Want de ware gelovigen, wanneer zij uit zwakheid zouden mogen vallen, hebben de belofte van wederoprichting. Zie Psa 37:24 , en het volgende vs. alhier."}],"13":[{"catchword":"geen verzoeking","tekst":"Namelijk waardoor gij gebracht zijt tot de gemeenschap der afgodendienaars en van hunne maaltijden."},{"catchword":"dan menselijke;","tekst":"Dat is, die uit uw menselijke zwakheid en uit vrees van de ongenade der afgodendienaars, welken u daartoe verzocht hebben, gesproten is. Hij troost hen hiermede, en vermaant hen in het toekomende tot meerdere standvastigheid, dewijl God ons deze belofte doet, dat Hij de Zijnen niet zal laten verzoeken boven hun vermogen."},{"catchword":"boven hetgeen","tekst":"Dat is, boven de kracht, die gij door Gods Geest alrede hebt ontvangen. Want uit onszelven vermogen wij niets; Joh 15:5 ; 2Co 3:5 ; Phi 4:13 ."},{"catchword":"met de verzoeking","tekst":"Namelijk die Hij over u zal laten komen, alwaar zij vrij meerder dan tot nog toe geschied is; Joh 16:33 ."},{"catchword":"geven, opdat","tekst":"Gr. maken."}],"14":[{"catchword":"Daarom, mijn","tekst":"Dat is, dewijl wij dan deze voorbeelden van Gods straf aan de ene zijde en van Gods trouwe belofte aan de andere zijde hebben."},{"catchword":"den afgodendienst","tekst":"Namelijk niet alleen die inderdaad zodanig is, maar ook die daartoe aanleiding of vermoeden zouden geven, of die tekenen daarvan zijn; van welke hij tot nog toe gesproken heeft."}],"15":[{"catchword":"verstandigen spreek ik,","tekst":"Dat is, als tot degenen, die in de verborgenheden onzes geloofs ervaren en onderricht zijn."}],"16":[{"catchword":"De drinkbeker der","tekst":"Of, de drinkbeker der zegening. Want het Griekse woord Eulogia betekent beide, dankzegging en zegening. Doch alzo de apostel hierna, 1Co 11:24 , het woord dankzeggen, of danken gebruikt, gelijk ook de Evangelisten, Mat 26:27 ; Mar 14:23 ; Luk 22:17 , zo wordt daarom dit woord dankzegging hier ook in den tekst behouden."},{"catchword":"dankzeggende zegenen,","tekst":"Gr. Eulogoumen; welk woord beide zegenen en dankzeggen betekent. Doch moet hier zegenen en niet dankzeggen overgezet worden, overmits niet gezegd kan worden dan wij den drinkbeker dankzeggen, gelijk Griekse samenvoeging der woorden, of constructie, zou vereisen; maar wel den drinkbeker zegenen. En wordt door dit zegenen verstaan, niet door kracht van enige woorden den wijn veranderen in het wezenlijke bloed van Christus maar met gebeden, dankzegging en verhaal van de instelling en het doel des Heiligen Avondmaals heiligen, of van anderen algemenen drank afzonderen en tot dit heilige gebruik toeeigenen, gelijk het woord zegenen ook gebruik wordt Gen 2:3 ; Exo 20:11 , waar God gezegd wordt den zevenden dag gezegend en geheiligd te ehbben, omdat Hij dien van andere gemene dagen heeft afgezonderd en tot een heilig gebruik toegeëigend. Zie hiervan de verklaring in de aantekening Mat 26:26 ."},{"catchword":"een gemeenschap des bloeds","tekst":"Dat is, een teken en onderpand van de geestelijke gemeenschap, die wij met Christus' bloed en lichaam hebben, gelijk vs.20, dat degenen, die afgodenoffer aten, gemeenschap hadden met de duivelen; ene wijze van spreken in de sacramenten gebruikelijk. Zie vs.4, en 1Co 11:24-25 ."}],"17":[{"catchword":"een brood is het, zo","tekst":"Namelijk dat gebroken wordt en waaraan wij gemeenschap hebben. Of, want wij velen zijn een brood en een lichaam."},{"catchword":"een lichaam,","tekst":"Dat is, een geestelijk lichaam, waarvan Christus het hoofd is. Zie Rom 12:5 ; 1Co 6:15 , en 1Co 12:12 , enz."}],"18":[{"catchword":"dat naar het vlees is;","tekst":"Dat is, het Joodse volk, afkomstig naar het vlees van Israel, die toen ter tijd hun tempel en godsdienst nog hadden, hoewel de kracht daarvan door Christus' komst was teniet gedaan."},{"catchword":"gemeenschap met het","tekst":"Dat is, met den godsdienst, die op het altaar en daarbij van hen werd gepleegd, en dien zij betuigden daarmede nog voor goed te houden."}],"20":[{"catchword":"den duivelen offeren,","tekst":"Want vele van de heidense afgoden, die zij door hunne beelden eerden, waren boze geesten. Zie Lev 17:7 , en Deu 32:17 . En hoewel zij somwijlen enige gestorvene mensen en andere creaturen daardoor wilden eren, of ook zelfs den Schepper des hemels en der aarde, gelijk Act 17:23 ; Rom 1:21 te zien is, zo worden zij nochtans gezegd den duivelen die eer aan te doen, omdat de duivel van zulken beeldendienst een ingever en insteller was, waardoor God niet geëerd maar onteerd werd; Isa 40:18 , en Isa 42:8 ."}],"21":[{"catchword":"Gij kunt den drinkbeker","tekst":"Namelijk met recht en behoorlijkheid, alzo dat gij, zulks doende, ook Gode zoudt kunnen behagen. Zie dergelijke wijze van spreken Mat 6:24 ; 2Co 6:14 ."},{"catchword":"tafel des Heeren","tekst":"Dat is, der spijs en des dranks van de tafel des Heeren, die tot een teken van de gemeenschap met Christus van de Christenen wordt genoten."},{"catchword":"der tafel der duivelen","tekst":"Dat is, der spijs en des dranks van de maaltijden, die tot een teken van de gemeenschap met de duivelen wordt genoten."}],"22":[{"catchword":"tergen wij den","tekst":"Dat is, willen wij hem tot toorn verwekken door ons doen, en dienvolgens zijne straf ons over den hals halen; Deu 32:21 . Het Griekse woord betekent eigenlijk tot jaloersheid verwekken."},{"catchword":"Zijn wij sterker","tekst":"Namelijk om zijn straffende hand van ons te weren, wanneer die ons zal treffen."}],"23":[{"catchword":"Alle dingen zijn mij","tekst":"Namelijk die middelmatig zijn, in zichzelven van God niet geboden in het Nieuwe Testament, gelijk onder anderen was het eten van allerlei spijs, als het zonder ergernis kon geschieden. De apostel handelt nu voorts van twee andere gevallen, die hij onder zekere bepalingen in het vervolg toelaat."},{"catchword":"niet oorbaar;","tekst":"Namelijk voor mijzelven."},{"catchword":"stichten niet","tekst":"Namelijk voor mijnen naaste."}],"24":[{"catchword":"dat zijns zelfs is,","tekst":"Namelijk alleen, of met nadeel en ontstichting zijns naasten; Rom 15:2 ."},{"catchword":"dat des anderen is","tekst":"Dat is, zoeke ook dat des anderen is, want wij moeten onzen naasten liefhebben als onszelven; wij mogen dan onszelven ook wel liefhebben, maar niet tegen de liefde onzes naasten."}],"25":[{"catchword":"al wat in het","tekst":"Dat is, allerlei. Hier laat dan de apostel vooreerst toe dát alles, wat ter markt komt, van ons mag worden gebruikt tot spijs, hoewel het nochtans menigmaal geschiedde, dat een deel van hetgeen den afgoden geofferd was, daar ook werd verkocht, wanneer het in maaltijden of offeranden niet werd gebezigd. Doch wanneer het ter markt of in de vleeshuizen werd gebracht, zo werd de afgod daar niet meer mede geëerd, maar werd het voor gemene spijs gehouden."},{"catchword":"niets ondervragende","tekst":"Of, geen onderscheid makende; namelijk of het tevoren geofferd was of niet, want beide betekent het Griekse woord."}],"26":[{"catchword":"de aarde is des Heeren","tekst":"Dat is, al is het dat het tevoren van de afgodendienaars was misbruikt, nochtans houdt het niet op te blijven een schepsel des Heeren, die het geschapen heeft om met dankzegging te gebruiken; 1Ti 4:4 ."}],"27":[{"catchword":"van de ongelovigen","tekst":"Namelijk te zijnen huize, zonder dat de maaltijd ter ere van den afgod is toegericht, gelijk de heidenen het overschot van al zulke geofferde beesten of spijzen tot bijzondere en burgerlijke maaltijden dikmaals gebruikten."},{"catchword":"daar gaan wilt","tekst":"Dat is, oorbaar acht te gaan om burgerlijke gemeenschap of gebuurschap te onderhouden. Waardoor de apostel te kennen geeft dat men ook, eer men daar gaat, wel moet overwegen waartoe men daar genood wordt."},{"catchword":"al wat ulieden","tekst":"Dat is, van alles."},{"catchword":"niets ondervragende,","tekst":"Of, geen onderscheid makende."}],"28":[{"catchword":"zo iemand tot","tekst":"Namelijk van den zwakgelovigen, die daardoor aanstoot zou mogen lijden; of ook van den ongelovige, die met u aanzit, en daardoor u zou mogen aanzien voor een mens, die zonder godsdienst of van hun heidense religie zou zijn, zo gij, vermaand zijnde, evenwel daarvan zoudt eten."},{"catchword":"de aarde is des Heeren,","tekst":"Deze zelfde plaats, genomen uit den 24sten Psalm, brengt de apostel hier wederom voort, om te bewijzen dat men zulke spijs wel kan laten, dewijl er meer spijzen zijn, die God op de aarde geschapen heeft tot ons gebruik."}],"29":[{"catchword":"des anderen;","tekst":"Namelijk die u zulks vermaant, en daardoor aanstoot lijdt, om de reden tevoren verhaald."},{"catchword":"mijn vrijheid","tekst":"Dat is, waarom zal ik met het ergerlijk gebruik van vrijheid oorzaak geven, dat eens anders conscientie mijn doen veroordele of het lastere. Of, dewijl ik weet uit Gods Woord, dat mij dit nu vrijstaat, waarom zal ik het oordeel van mijne conscientie het oordeel van eens anders conscientie, die nog zwak is, onderwerpen, of mij van zulke laten lasteren; het is mij genoeg, dat ik het eten van zulke spijs voor dien tijd om hunnentwil nalaat, en evenwel in mijn gemoed de vrijheid behoud om op een anderen tijd zonder aanstoot zulks te doen en God daarvoor te danken."}],"30":[{"catchword":"door genade","tekst":"Namelijk des Evangelies, in hetwelk ons Christus van het juk der ceremoniën en het onderscheid der spijzen heeft vrijgesteld."}],"32":[{"catchword":"en den Joden, en den","tekst":"Onder deze drie soorten begrijpt de apostel alle mensen, die òf Joden waren, òf heidenen, òf Christenen, van wie gene voor ons moeten geërgerd worden door het gebruik van onze vrijheid; wel verstaande, indien het zodanige personen zijn, waar men hoop van heeft dat zij daardoor van ons kunnen gewonnen worden."}],"33":[{"catchword":"in alles","tekst":"Dat is, zoekt te behagen. Dit moet verstaan worden gelijk het volgende, namelijk ten aanzien van het gebruik of nalaten der Christelijke vrijheid, niet ten aanzien van de leer of andere zaken, die van God geboden of verboden zijn. Zie Gal 1:8 , Gal 1:10 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"AND I will not brethren that ye be ignorant that our Fathers [Namely, who came out of Egypt with Moses ] were all under the cloud, [namely, which interposed it self betwixt the army of the Egyptians and of the Israelites, and which bedewed and descended the Israelites, when they went through the red sea, Exod. 14.19. etc. Psa 105:39. Which Paul here testifieth to have been antitype of our baptism, like as Peter speaks of deliverance of Noah in the Ark, out of the midst of the flood, 1 Pet. 21.] and all passed through the sea:"}],"2":[{"catchword":null,"tekst":"And were all baptized into Moses [That is, by Moses, or by the ministry of Moses; or in the doctrine of Moses, as is said in Act 19:3. that some were baptized in the baptism of John, i.e. in the doctrine of John, which was confirmed by his baptism] in the cloud, and in the sea."}],"3":[{"catchword":null,"tekst":"And did all eat the same [Namely, in the signs, which signified one and the same thing: and that not only with another, but also with us: which appears from thence that Paul here useth the name Baptism, and afterwards saith that the Rock was Christ: and for that otherwise Paul&acirc;&euro;&trade;s conclusion should not be firm, except they had one kind of meat with us in respect of the signification] spiritual meat: [namely, the Manna, which is called a spiritual meat, because it served the Israelites, not only for corporal food, but also to be for an extraordinary sign of the flesh of Christ, and in that respect had a spiritual relation unto Christ, as Christ at large declares, John 6. and as afterwards for the same reason the rock is called spiritual.]"}],"4":[{"catchword":null,"tekst":"And did all drink the same spiritual drink. For they drank of the spiritual rock which [Namely, rock] followed; [i.e. by the streams or brook flowed from thence, after that it was stricken by Moses, Numb. 20.8,11. Psa 105:41.] and the rock was Christ. [that is, was a sign and a type of Christ, who being by the Father smitten to death for our sake, should yield forth unto us the streams of the living water, Joh 7:38. And this is a phrase usual in the Sacrament as the bread and wine of the Lords Supper are called the body and blood of Christ, because they are a sign and seal thereof. What some would say, that the sense should be Christ was the rock, is repugnant not only to the words of the text, but also unto the thing its self, forasmuch as all the Israelites to have drunk of Christ, seeing many of them believed not, and God as not well-pleased with them, ver.5. and Heb. 4.2.]"}],"5":[{"catchword":null,"tekst":"But in the greater things (part) of them God took no pleasure, for they were smitten in the witness. [Namely, because of their unbelief, as Paul clares Heb. 3.ver.17,18,19.]"}],"6":[{"catchword":null,"tekst":"And these things happened for types of us, [That is, for examples, and warnings. Namely that if we follow after such like sins, notwithstanding we shall also have been partakers of these holy signs, either shall we escape the same punishment, which can upon them for the same. See of this word ver.11 Phil. 3.17. 1 Tim. 2.7.] that we should have no lust unto evil. [Gr. Should be no desires of evil things. Namely, of idolatry, fornication, and such ill which are related afterwards] like as they had lust."}],"7":[{"catchword":null,"tekst":"And be no idolaters, like as some of them That is, a great part of them, namely, those that committed idolatry with the molten calf] as it is written, people set down to eat and drink, and they rose up to pl. [that is, to dance, laugh, and caper, as the idolats after their Idolatrous feasts, commonly used to do Exod. 32.6.]"}],"8":[{"catchword":null,"tekst":"And let us not commit fornication, as some of them committed fornication, [Namely, in the air of the Midianites, by the counsel of Balaam being enticed unto Idolatry and fornication, Numb. 25.] d fell in one day three and twenty thousand. [Numb. 25.9. it is said four and twenty thousand. But it may be that there were killed betwixt three and four and twenty thousand, of which the Apostle kept the lesser number. Others think that there were three and twenty thousand slain with the sword, after the example of the zeal of Phineas, and that the other thousand of the chiefest were afterwards by the command of Moses.]"}],"9":[{"catchword":null,"tekst":"And let us not tempt Christ, [That is, provoke him, or call in question his power to punish the unthankfull, as the Israelites, Numb. 21.5. when they were not content with the Manna, nor with the waters, which the Lord miraculously afforded them: and like as the Corinthians, who rather followed the feasts of Idolaters which were full of offence and danger, then a simple food which the Lord afforded them at home] as some of them also attempted, [namely, Christ, whom he had named immediately before. // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
