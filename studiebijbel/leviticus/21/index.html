jn nageslacht onder zijn volken niet ontheiligen; want Ik ben de HEERE, die hem heiligt!", "16": "Verder sprak de HEERE tot Mozes en zei:", "17": "Spreek tot Aäron en zeg: Niemand uit uw nageslacht, naar hun geslachten, aan wie een gebrek is, zal naderen om het voedsel van zijn God te offeren.", "18": "Want geen man, aan wie een gebrek is, zal naderen, hij zij een blinde man, of kreupele, of iemand met een misvormde neus, of met een misvormd lichaamsdeel;", "19": "Of een man, aan wie een breuk van de voet, of een breuk van de hand is;", "20": "Of die een bochel heeft, of een dwerg is, of een vlies op zijn oog heeft, of droge schurftheid, of etterige schurftheid, of die gebroken is aan zijn geslachtsdeel.", "21": "Geen man, uit het nageslacht van Aäron, de priester, aan wie een gebrek is, zal toetreden om de vuuroffers van de HEERE te offeren; een gebrek is in hem, hij zal niet toetreden om het voedsel van zijn God te offeren.", "22": "Het voedsel van zijn God, van de allerheiligste dingen, en van de heilige dingen, zal hij mogen eten;", "23": "Doch tot het voorhangsel zal hij niet komen, en tot het altaar niet toetreden, omdat een gebrek in hem is; opdat hij Mijn heiligdommen niet ontheiligt; want Ik ben de HEERE, die hen heiligt!", "24": "En Mozes sprak dit tot Aäron en tot zijn zonen, en tot alle kinderen van Israël."}, "SV": {"1": "Daarna zeide de HEERE tot Mozes: Spreek tot de priesters, de zonen van Aäron, en zeg tot hen: Over een dode zal *een* *priester* zich niet verontreinigen onder zijn volken.", "2": "Behalve over zijn bloedvriend, die hem ten naaste bestaat, over zijn moeder en over zijn vader, en over zijn zoon, en over zijn dochter, en over zijn broeder.", "3": "En over zijn zuster, die maagd is, hem nabestaande, die nog geen man toebehoord heeft; over die zal hij zich verontreinigen.", "4": "Hij zal zich niet verontreinigen *over* een overste onder zijn volken, om zich te ontheiligen.", "5": "Zij zullen op hun hoofd geen kaalheid maken, en zullen den hoek van hun baard niet afscheren, en in hun vlees zullen zij geen sneden snijden.", "6": "Zij zullen hun God heilig zijn, en den Naam huns Gods zullen zij niet ontheiligen; want zij offeren de vuurofferen des HEEREN, de spijze huns Gods; daarom zullen zij heilig zijn.", "7": "Zij zullen geen vrouw nemen, die een hoer of ontheiligde is, noch een vrouw nemen, die van haar man verstoten is; want hij is zijn God heilig.", "8": "Daarom zult gij hem heiligen, omdat hij de spijze uws Gods offert; hij zal u heilig zijn, want Ik ben heilig; Ik ben de HEERE, die u heilige!", "9": "Als nu de dochter van enigen priester zal beginnen te hoereren, zij ontheiligt haar vader; met vuur zal zij verbrand worden.", "10": "En hij, die de hogepriester onder zijn broederen is, op wiens hoofd de zalfolie gegoten is, en wiens hand men gevuld heeft, om die klederen aan te trekken, zal zijn hoofd niet ontbloten, noch zijn klederen scheuren.", "11": "Hij zal ook bij geen dode lichamen komen; *zelfs* over zijn vader en over zijn moeder zal hij zich niet verontreinigen.", "12": "En uit het heiligdom zal hij niet uitgaan, dat hij het heiligdom zijns Gods niet ontheilige, want de kroon der zalfolie zijns Gods is op hem; Ik ben de HEERE!", "13": "Hij zal ook een vrouw in haar maagdom nemen.", "14": "Een weduwe, of verstotene, of ontheiligde hoer, dezulke zal hij niet nemen; maar een maagd uit zijn volken zal hij tot een vrouw nemen.", "15": "En hij zal zijn zaad onder zijn volken niet ontheiligen; want Ik ben de HEERE, die hem heilige!", "16": "Wijders sprak de HEERE tot Mozes, zeggende:", "17": "Spreek tot Aäron, zeggende: Niemand uit uw zaad, naar hun geslachten, in wien een gebrek zal zijn, zal naderen, om de spijze zijns Gods te offeren.", "18": "Want geen man, in wien een gebrek zal zijn, zal naderen, hij zij een blind man, of kreupel, of te kort, of te lang in leden;", "19": "Of een man, in wien een breuk des voets, of een breuk der hand zal zijn;", "20": "Of die bultachtig, of dwergachtig zal zijn, of een vel op zijn oog zal hebben, of droge schurftheid, of etterige schurftheid, of die gebroken zal zijn aan zijn gemacht.", "21": "Geen man, uit het zaad van Aäron, den priester, in wien een gebrek is, zal toetreden om de vuurofferen des HEEREN te offeren; een gebrek is in hem, hij zal niet toetreden, om de spijs zijns Gods te offeren.", "22": "De spijs zijns Gods, van de allerheiligste dingen, en van de heilige dingen, zal hij mogen eten;", "23": "Doch tot den voorhang zal hij niet komen, en tot het altaar niet toetreden, omdat een gebrek in hem is; opdat hij Mijn heiligdommen niet ontheilige; want Ik ben de HEERE, die hen heilige!", "24": "En Mozes sprak *zulks* tot Aäron en tot zijn zonen, en tot al de kinderen Israëls."}, "KJV": {"1": "And the LORD said unto Moses, Speak unto the priests the sons of Aaron, and say unto them, There shall none be defiled for the dead among his people:", "2": "But for his kin, that is near unto him, *that is*, for his mother, and for his father, and for his son, and for his daughter, and for his brother,", "3": "And for his sister a virgin, that is nigh unto him, which hath had no husband; for her may he be defiled.", "4": "*But* he shall not defile himself, *being* a chief man among his people, to profane", "5": "They shall not make baldness upon their head, neither shall they shave off the corner of their beard, nor make any cuttings in their flesh.", "6": "They shall be holy unto their God, and not profane the name of their God: for the offerings of the LORD made by fire, *and* the bread of their God, they do offer: therefore they shall be holy.", "7": "They shall not take a wife *that is* a whore, or profane; neither shall they take a woman put away from her husband: for he *is* holy unto his God.", "8": "Thou shalt sanctify him therefore; for he offereth the bread of thy God: he shall be holy unto thee: for I the LORD, which sanctify you, *am* holy.", "9": "And the daughter of any priest, if she profane herself by playing the whore, she profaneth her father: she shall be burnt with fire.", "10": "And *he that is* the high priest among his brethren, upon whose head the anointing oil was poured, and that is consecrated to put on the garments, shall not uncover his head, nor rend his clothes;", "11": "Neither shall he go in to any dead body, nor defile himself for his father, or for his mother;", "12": "Neither shall he go out of the sanctuary, nor profane the sanctuary of his God; for the crown of the anointing oil of his God *is* upon him: I *am* the LORD.", "13": "And he shall take a wife in her virginity.", "14": "A widow, or a divorced woman, or profane, *or* an harlot, these shall he not take: but he shall take a virgin of his own people to wife.", "15": "Neither shall he profane his seed among his people: for I the LORD do sanctify", "16": "And the LORD spake unto Moses, saying,", "17": "Speak unto Aaron, saying, Whosoever *he be* of thy seed in their generations that hath *any* blemish, let him not approach to offer the bread of his God.", "18": "For whatsoever man *he be* that hath a blemish, he shall not approach: a blind man, or a lame, or he that hath a flat nose, or any thing superfluous,", "19": "Or a man that is brokenfooted, or brokenhanded,", "20": "Or crookbackt, or a dwarf, or that hath a blemish in his eye, or be scurvy, or scabbed, or hath his stones broken;", "21": "No man that hath a blemish of the seed of Aaron the priest shall come nigh to offer the offerings of the LORD made by fire: he hath a blemish; he shall not come nigh to offer the bread of his God.", "22": "He shall eat the bread of his God, *both* of the most holy, and of the holy.", "23": "Only he shall not go in unto the vail, nor come nigh unto the altar, because he hath a blemish; that he profane not my sanctuaries: for I the LORD do sanctify", "24": "And Moses told *it* unto Aaron, and to his sons, and unto all the children of Israel."}}, "tsk": {"1": [{"kopje": "Spreek", "refs": ["Hos 5:1" 1:8", "href": "../../leviticus/21/#v8", "ref": "Lev 21:8", "svLabel": null}, {"disp": "Lev 21:17", "href": "../../leviticus/21/#v17", "ref": "Lev 21:17", "svLabel": null}, {"disp": "Lev 21:21", "href": "../../leviticus/21/#v21", "ref": "Lev 21:21", "svLabel": null}, {"disp": "Lev 21:22", "href": "../../leviticus/21/#v22", "ref": "Lev 21:22", "svLabel": null}, {"disp": "Lev 22:25", "href": "../../leviticus/22/#v25", "ref": "Lev 22:25", "svLabel": null}, {"disp": "1 Sam 2:36", "href": "../../1-samuel/2/#v36", "ref": "1 Sam 2:36", "svLabel": null}, {"disp": "2 Kon 23:9", "href": "../../2-koningen/23/#v9", "ref": "2 Kon 23:9", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Hebr 9:14": "hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "Ef 4:7": "Maar aan ieder van ons is de genade gegeven, naar de maat van de gave van Christus.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Matt 12:46-50": "En terwijl Hij nog tegen de menigten sprak, zie, Zijn moeder en broeders stonden buiten, en wilden Hem spreken. En iemand zei tegen Hem: Kijk, Uw moeder en Uw broeders staan daar buiten, en willen U spreken. Maar Hij antwoordde en zei tegen hem die Hem dat zei: Wie is Mijn moeder, en wie zijn Mijn broeders?", "1 Tess 4:3": "Want dit is de wil van God, uw heiliging: dat u zich onthoudt van de hoererij;", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Deut 27:23": "Vervloekt is hij die bij zijn schoonmoeder ligt! En heel het volk zal zeggen: Amen.", "Num 16:10": "Terwijl Hij u, en al uw broeders, de kinderen van Levi, met u, heeft laten naderen; zoekt u nu ook het priesterambt?", "Ezech 36:22": "Daarom, zeg tot het huis van Israël: Zo zegt de Heere HEERE: Ik doe het niet om u, huis van Israël! Maar om Mijn heilige Naam, die u ontheiligd hebt onder de heidenen waarheen u gekomen bent.", "Lev 21:7-15": "Zij zullen geen vrouw nemen, die een hoer of ontheiligde is, en ook geen vrouw nemen, die van haar man verstoten is; want hij is zijn God heilig. Daarom zult u hem heiligen, omdat hij het voedsel van uw God offert; hij zal u heilig zijn, want Ik ben heilig; Ik ben de HEERE, die u heiligt! Als nu de dochter van een priester zal beginnen te hoereren, ontheiligt zij haar vader; met vuur zal zij verbrand worden.", "Jer 29:22": "En van hen zal een vloek genomen worden bij al de gevankelijk weggevoerden van Juda die in Babel zijn, zodat men zegt: De HEERE stelt u als Zedekia en als Achab, die de koning van Babel aan het vuur heeft geroosterd;", "1 Sam 2:36": "En het zal gebeuren, dat ieder die van uw huis over is, zal komen om zich voor hem neer te buigen voor een stukje geld en een bol brood, en zal zeggen: Neem mij toch aan tot een van de priesterlijke bedieningen, dat ik een stukje brood mag eten.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "1 Petr 4:10": "Ieder bedient, naar de gave die hij ontvangen heeft, daarmee de anderen, als goede uitdelers van de veelsoortige genade van God.", "Num 18:19": "Alle hefoffers van de heilige dingen, die de kinderen van Israël de HEERE zullen offeren, heb Ik aan u gegeven, en aan uw zonen, en aan uw dochters met u, tot een eeuwige inzetting; het zal een eeuwig zoutverbond zijn, voor het aangezicht van de HEERE, voor u en voor uw nageslacht met u.", "Lev 18:6-18": "Niemand zal tot enige nabestaande van het eigen vlees naderen, om de schaamte te ontdekken; Ik ben de HEERE! U zult de schaamte van uw vader en de schaamte van uw moeder niet ontdekken; zij is uw moeder; u zult haar schaamte niet ontdekken. U zult de schaamte van de vrouw van uw vader niet ontdekken; het is de schaamte van uw vader.", "Ps 48:11": "Zoals Uw Naam is, o God! zo is Uw roem tot aan de einden van de aarde; Uw rechterhand is vol van gerechtigheid.", "Ef 3:19": "en de liefde van Christus kent, die de kennis te boven gaat, opdat u vervuld wordt tot al de volheid van God.", "Ps 61:6": "Want U, o God! hebt gehoord naar mijn geloften; U hebt mij gegeven de erfenis van hen die Uw Naam vrezen.", "Ex 29:43": "En daar zal Ik komen tot de kinderen van Israël; opdat zij geheiligd worden door Mijn heerlijkheid.", "1 Tim 5:21": "Ik roep als getuige God aan, en de Heere Jezus Christus, en de uitverkoren engelen, dat u deze dingen bewaart, zonder vooroordeel, niets doend uit partijdigheid.", "2 Kron 3:8": "Verder maakte hij het huis van het heilige der heiligen, waarvan de lengte, overeenkomstig de breedte van het huis, twintig ellen was, en de breedte daarvan twintig ellen; en hij overtrok dat met goed goud, tot zeshonderd talenten.", "1 Joh 1:5": "En dit is de verkondiging die wij van Hem gehoord hebben, en wij verkondigen u, dat God een Licht is, en dat er in Hem helemaal geen duisternis is.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Jes 33:6": "En het zal gebeuren, dat de vastheid van uw tijden, de sterkte van uw redding, wijsheid en kennis zal zijn; de vrees voor de HEERE zal Zijn schat zijn.", "2 Tim 2:2": "en wat u van mij gehoord hebt onder veel getuigen, vertrouw dat toe aan trouwe mensen, die bekwaam zullen zijn om ook anderen te leren.", "Ex 29:1": "Dit nu is de zaak die u met hen doen zult, om hen te heiligen, zodat zij Mij het priesterambt bedienen: neem een jonge stier, het jong van een rund, en twee volkomen rammen;", "Lev 20:19-21": "Verder zult u de schaamte van de zuster van uw moeder, en van de zuster van uw vader niet ontdekken; omdat hij zijn naaste bloedverwant ontbloot heeft, zullen zij hun ongerechtigheid dragen. Als ook een man gemeenschap heeft met de vrouw van zijn oom, heeft hij de schaamte van zijn oom ontdekt; zij zullen hun zonde dragen; zonder kinderen zullen zij sterven. En wanneer een man de vrouw van zijn broer neemt, is het onreinheid; hij heeft de schaamte van zijn broer ontdekt; zij zullen zonder kinderen zijn.", "Lev 22:10-13": "Ook zal geen vreemde het heilige eten; een bijwoner van de priester, en een dagloner, zullen het heilige niet eten. Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten. Maar als de dochter van de priester aan een vreemde man zal toebehoren, zal zij van het hefoffer van de heilige dingen niet eten.", "2 Kor 1:22": "Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Matt 8:14": "En toen Jezus in het huis van Petrus gekomen was, zag Hij de moeder van diens vrouw met koorts te bed liggen.", "Num 7:9": "Maar aan de zonen van Kohath gaf hij niets; want de dienst van de heilige dingen die op hen rustte, moesten zij op de schouders dragen.", "Ps 30:5": "Zingt psalmen voor de HEERE, u, Zijn gunstgenoten! en looft ter gedachtenis aan Zijn heiligheid.", "Rom 1:23": "en hebben de heerlijkheid van de onvergankelijke God veranderd in de gelijkenis van het beeld van een vergankelijk mens, en van vogels, en van viervoetige en kruipende dieren.", "Gen 26:11": "En Abimelech gebood het hele volk: Wie deze man of zijn vrouw aanraakt, zal zeker gedood worden!", "Hebr 13:17": "Wees uw voorgangers gehoorzaam en wees hun onderdanig; want zij waken over uw zielen, als degenen die rekenschap moeten geven, opdat zij dit met vreugde mogen doen en niet al zuchtend; want dat is voor u niet nuttig.", "1 Sam 2:4": "De boog van de sterken is gebroken; en zij die struikelden, zijn met sterkte omgord.", "Ex 40:27": "En hij stak daarop reukwerk aan van welriekende specerijen, zoals de HEERE aan Mozes geboden had.", "Lev 21:1-15": "Daarna zei de HEERE tegen Mozes: Spreek tot de priesters, de zonen van Aäron, en zeg tegen hen: Over een dode zal een priester zich niet verontreinigen onder zijn volken. Behalve over zijn bloedverwant, die hem het naast is, over zijn moeder en over zijn vader, en over zijn zoon, en over zijn dochter, en over zijn broer. En over zijn zuster, die maagd is, hem nabestaande, die nog geen man toebehoord heeft; over die zal hij zich verontreinigen.", "2 Kron 20:8": "Zij nu hebben daarin gewoond, en zij hebben U daarin een heiligdom gebouwd voor Uw Naam, en zeiden:", "Lev 20:26": "En u zult Mij heilig zijn, want Ik, de HEERE, ben heilig; en Ik heb u van de volken afgezonderd, opdat u van Mij zou zijn.", "Num 4:12": "Zij zullen ook al het gereedschap van de dienst nemen, waarmee zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen het met een deksel van dassenvellen bedekken; en zij zullen het op de draagboom leggen.", "Matt 24:45": "Wie is dan de trouwe en verstandige dienstknecht, aan wie zijn heer het gezag over zijn huisbedienden gegeven heeft, om hun op de juiste tijd voedsel te geven?", "2 Kron 29:11": "Mijn zonen, wees nu niet traag; want de HEERE heeft u uitgekozen, om voor Zijn aangezicht te staan, om Hem te dienen, en opdat u Hem dienaars en wierokers zou zijn.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Jes 64:11": "Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Lev 22:9": "Zij zullen dan Mijn bevel onderhouden, opdat zij daarover geen zonde dragen en daarin sterven, als zij dat ontheiligd zouden hebben; Ik ben de HEERE, Die hen heiligt!", "Hos 2:18": "En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.", "Ex 22:16": "Wanneer iemand een maagd verleidt die nog niet ondertrouwd is, en hij slaapt met haar, dan moet hij zonder uitstel een bruidsprijs voor haar betalen, zodat zij zijn vrouw wordt.", "Jes 49:7": "Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft.", "2 Kor 3:6-10": "die ons ook bekwaam gemaakt heeft om dienaars te zijn van het Nieuwe Testament, niet van de letter, maar van de Geest; want de letter doodt, maar de Geest maakt levend. En als de bediening van de dood, die met letters in stenen gegraveerd was, in heerlijkheid is geweest, zodat de kinderen van Israël niet strak konden kijken naar het gezicht van Mozes vanwege de heerlijkheid van zijn gezicht, die teniet gedaan zou worden, hoe zal dan niet veel meer de bediening van de Geest in heerlijkheid zijn?", "Lev 2:10": "En wat overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is allerheiligst van de vuuroffers van de HEERE.", "Ps 18:2": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte!", "Lev 8:11": "En hij sprenkelde daarvan op het altaar zevenmaal; en hij zalfde het altaar, en al zijn gereedschap, alsook het wasvat en zijn voetstuk, om die te heiligen.", "1 Tess 5:24": "Hij, Die u roept, is getrouw, Die het ook doen zal.", "Joh 17:19": "En Ik heilig Mijzelf voor hen, opdat ook zij geheiligd mogen zijn in waarheid.", "Luk 22:27": "Want wie is meer, hij die aanzit, of hij die dient? Is het niet hij die aanzit? Maar Ik ben in uw midden, als iemand die dient.", "Deut 5:11": "U zult de Naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal hem die Zijn Naam ijdel gebruikt, niet onschuldig houden.", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Spr 30:9": "Opdat ik, als ik verzadigd ben, U dan niet verloochent, en zeg: Wie is de HEERE? of dat ik, als ik arm geworden ben, dan niet steel, en de Naam van mijn God aantast.", "1 Tim 5:14": "Ik wil dan dat de jonge weduwen trouwen, kinderen krijgen, het huis besturen, en geen aanleiding tot smaad geven aan de tegenpartij.", "1 Sam 3:14": "Daarom heb Ik het huis van Eli gezworen: Nooit zal het ongerecht van het huis van Eli tot in eeuwigheid verzoend worden door slachtoffer of door spijsoffer!", "Hos 6:3": "Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "1 Kor 7:14": "Want de ongelovige man is geheiligd door de vrouw, en de ongelovige vrouw is geheiligd door de man; want anders waren uw kinderen onrein, maar nu zijn zij heilig.", "Dan 3:19-23": "Toen werd Nebukadnezar vervuld van woede, en de uitdrukking van zijn gezicht veranderde tegen Sadrach, Mesach en Abed-nego; hij antwoordde en zei, dat men de oven zeven keer heter moest maken dan men die gewoonlijk heet maakte. En tegen de sterkste mannen van zijn leger zei hij dat zij Sadrach, Mesach en Abed-nego moesten binden, om hen te werpen in de brandende vuuroven. Toen werden die mannen gebonden in hun mantels, hun broeken, hun hoeden, en hun andere kleren, en zij wierpen hen in het midden van de brandende vuuroven.", "Jer 1:7": "Maar de HEERE zei tegen mij: Zeg niet: Ik ben jong; want overal waarheen Ik u zenden zal, zult u gaan, en alles wat Ik u gebieden zal, zult u spreken.", "2 Tim 2:14-16": "Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders. Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt. Maar verzet u tegen het ongoddelijk ijdel geklets; want zij zullen in meerdere goddeloosheid toenemen.", "Luk 12:42-44": "En de Heere zei: Wie is dan de trouwe en verstandige huisbeheerder, die de heer over zijn dienstpersoneel zal aanstellen, om hun op de juiste tijd het bepaalde deel voedsel te geven? Zalig is die dienstknecht, die zijn heer, als hij komt, zo bezig zal vinden. Werkelijk, Ik zeg u, dat hij hem over al zijn bezittingen zal aanstellen.", "Gen 2:23": "Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne noemen, omdat zij uit de man genomen is.", "Jes 40:29": "Hij geeft de moede kracht, en Hij vermeerdert de sterkte van wie geen krachten heeft.", "Ps 73:17": "Totdat ik in Gods heiligdommen inging, en op hun einde lette.", "Joh 1:16": "En uit Zijn volheid hebben wij allen ontvangen, ook genade voor genade.", "Jes 29:19": "En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.", "1 Sam 2:17": "Zo was de zonde van deze jongens zeer groot voor het aangezicht van de HEERE; want de mensen verachtten het spijsoffer van de HEERE.", "Hand 6:3": "Zie daarom om, broeders, naar zeven mannen uit uw midden, die een goede naam hebben, vol van de Heilige Geest en van wijsheid, die wij mogen aanstellen over deze taak.", "Mal 3:2": "Maar wie zal de dag van Zijn komst verdragen, en wie zal standhouden als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep van de blekers.", "Jes 15:2": "Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden.", "Jes 4:3": "En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem;", "Ps 18:31": "Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Ex 29:44": "En Ik zal de tent van de samenkomst heiligen, alsook het altaar; Ik zal ook Aäron en zijn zonen heiligen, opdat zij Mij het priesterambt bedienen.", "Ps 99:5": "Verhef de HEERE, onze God, en buig u neer voor de voetbank van Zijn voeten; Hij is heilig!", "Ef 4:12": "Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus;", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "Lev 21:1-6": "Daarna zei de HEERE tegen Mozes: Spreek tot de priesters, de zonen van Aäron, en zeg tegen hen: Over een dode zal een priester zich niet verontreinigen onder zijn volken. Behalve over zijn bloedverwant, die hem het naast is, over zijn moeder en over zijn vader, en over zijn zoon, en over zijn dochter, en over zijn broer. En over zijn zuster, die maagd is, hem nabestaande, die nog geen man toebehoord heeft; over die zal hij zich verontreinigen.", "2 Kor 10:1": "Verder, ik Paulus zelf bid u, door de zachtmoedigheid en goedertierenheid van Christus, die – tegenwoordig zijnde – wel gering ben onder u, maar afwezig stout ben tegen u;", "Job 25:5": "Zie, zelfs de maan geeft geen schijnsel, en de sterren zijn niet zuiver in Zijn ogen.", "Tit 1:14": "En zich niet bezighouden met Joodse fabels, en geboden van mensen, die hen van de waarheid afkeren.", "Luk 6:39": "En Hij vertelde hun een gelijkenis: Kan een blinde soms een blinde leiden? Zullen zij niet beiden in de kuil vallen?", "Jak 3:1": "Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.", "Mal 2:3": "Zie, Ik zal het zaad voor u verderven; en Ik zal drek op uw gezichten strooien, de drek van uw feesten, zodat men u daarmee wegnemen zal.", "Ps 119:142": "Uw gerechtigheid is gerechtigheid in eeuwigheid, en Uw wet is de waarheid.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "Openb 16:9": "En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.", "Gen 2:24": "Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.", "1 Kor 13:12": "Want wij zien nu door een spiegel in een duistere afspiegeling, maar dan zullen wij zien van aangezicht tot aangezicht; nu ken ik ten dele, maar dan zal ik kennen, zoals ik ook gekend ben.", "Lev 6:29": "Al wie mannelijk is onder de priesters, zal daarvan eten; het is allerheiligst.", "Matt 13:52": "En Hij zei tegen hen: Daarom is iedere Schriftgeleerde die onderwezen is in het Koninkrijk der hemelen, gelijk aan een heer des huizes, die uit zijn schat nieuwe en oude dingen tevoorschijn haalt.", "1 Tim 3:1-15": "Dit is een betrouwbaar woord: als iemand ernaar verlangt opziener te worden, begeert hij een voortreffelijk werk. Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren; niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "Zach 10:12": "En Ik zal hen sterken in de HEERE, en in Zijn Naam zullen zij wandelen, spreekt de HEERE.", "Joz 7:25": "En Jozua zei: Hoe hebt u ons in het ongeluk gestort? De HEERE zal u op deze dag in het ongeluk storten! En heel Israël stenigde hem met stenen, en zij verbrandden hen met vuur, en overwierpen hen met stenen.", "Deut 24:1-4": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis. En als zij dan uit zijn huis is uitgegaan, zal zij heengaan en een andere man tot vrouw worden, en deze laatste man haar haat, en haar een scheidbrief schrijft, en die in haar hand geeft, en haar uit zijn huis laat gaan; of als deze laatste man, die haar voor zich tot vrouw genomen heeft, sterft;", "Jes 63:18": "Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden.", "Ex 40:26": "En hij zette het gouden altaar in de tent der samenkomst, vóór het voorhangsel.", "Ps 99:3": "Laat men Uw grote en ontzagwekkende Naam loven, die heilig is;", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "Jes 45:8": "Drupt, hemelen! van boven af, en laat de wolken vloeien van gerechtigheid; en laat de aarde zich openen, en laat allerlei heil uitwassen, en gerechtigheid samen uitspruiten; Ik, de HEERE, heb ze geschapen.", "Lev 8:9-12": "En hij zette de hoed op zijn hoofd; en aan de hoed, boven zijn gezicht, zette hij de gouden plaat, de kroon van de heiligheid, zoals de HEERE Mozes geboden had. Toen nam Mozes de zalfolie, en zalfde de tabernakel, en alles wat daarin was, en heiligde ze. En hij sprenkelde daarvan op het altaar zevenmaal; en hij zalfde het altaar, en al zijn gereedschap, alsook het wasvat en zijn voetstuk, om die te heiligen.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Jes 6:7": "En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Kol 1:12": "terwijl u de Vader dankt, Die ons bekwaam gemaakt heeft om deel te hebben aan de erfenis van de heiligen in het licht;", "Matt 23:16": "Wee u, blinde leidslieden, die zeggen: Wie ook zweert bij de tempel, dat is niets; maar wie zweert bij het goud van de tempel, die is verplicht zijn eed te houden.", "Mal 2:13-16": "Dit tweede doet u ook: dat u het altaar van de HEERE bedekt met tranen, met wenen en met zuchten, zodat Hij niet meer naar het spijsoffer wil omzien, en het ook niet met welgevallen uit uw hand wil ontvangen. U zegt nu: Waarom? Omdat de HEERE een Getuige geweest is tussen u en de vrouw van uw jeugd, met wie u trouweloos handelt; terwijl zij toch uw metgezellin is, en de vrouw van uw verbond. Heeft Hij niet maar één gemaakt, hoewel Hij van de Geest overvloed had? En waarom die ene? Hij zocht een zaad van God. Daarom, wees op uw hoede met uw geest, en laat niemand trouweloos handelen tegen de vrouw van zijn jeugd.", "Tit 3:9": "Maar weersta de dwaze vragen en geslachtsrekeningen, en twistingen, en strijd over de wet; want die zijn nutteloos en zinloos.", "Ps 138:3": "Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.", "Joz 5:15": "Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Num 31:19": "En u, legert u buiten het leger, zeven dagen; ieder die een mens gedood heeft, en ieder die een gesneuvelde heeft aangeraakt, moet zich op de derde dag en op de zevende dag ontzondigen, u en uw gevangenen.", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Tit 2:7": "Laat uzelf in alles zien als een voorbeeld van goede werken, in de leer onvervalstheid, deftigheid, oprechtheid;", "Num 16:9": "Is het u te weinig, dat de God van Israël u van de vergadering van Israël heeft afgescheiden, om u tot Zich te laten naderen; om de dienst van de tabernakel van de HEERE te verrichten, en te staan voor het aangezicht van de vergadering, om hen te dienen?", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "Jer 2:5": "Zo zegt de HEERE: Wat voor onrecht hebben uw vaders aan Mij gevonden, dat zij ver van Mij zijn geweken, en de ijdelheid hebben nagewandeld, en zelf ijdel zijn geworden?", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "1 Tim 6:11": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "Fil 4:7": "En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.", "Ezech 23:45": "Rechtvaardige mannen dan, die zullen hen berechten naar het recht van overspeelsters, en naar het recht van vrouwen die bloed vergieten; want zij zijn overspeelsters, en bloed is aan hun handen.", "Lev 24:8": "Op elke sabbatdag zal men dat voortdurend in orde houden voor het aangezicht van de HEERE, vanwege de Israëlieten, tot een eeuwig verbond.", "Luk 14:26": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn.", "Ps 132:15": "Ik zal haar voedsel rijkelijk zegenen, haar behoeftigen zal Ik met brood verzadigen.", "Ef 4:13": "Totdat wij allen komen tot de eenheid van het geloof en van de kennis van de Zoon van God, tot een volwassen man, tot de maat van de grootte van de volheid van Christus;", "Ef 4:16": "Uit Wie het hele lichaam bekwaam samengevoegd en samen vastgemaakt wordt, door alle gewrichten die het voeden, naar de werking van ieder deel in zijn maat, groei van het lichaam bereikt, tot opbouw van zichzelf in de liefde.", "Jes 45:24": "Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.", "1 Tim 3:7": "En hij moet ook een goede naam hebben bij hen die buiten zijn, opdat hij niet in smaad valt en in de strik van de duivel.", "Matt 20:25-28": "En Jezus riep hen bij Zich, en zei: U weet dat de leiders van de volken heerschappij voeren over hen, en de groten macht uitoefenen over hen. Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn; en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "Num 19:16": "En ieder die in het open veld iemand die met het zwaard gedood is, of een dode, of het gebeente van een mens, of een graf aangeraakt heeft, zal zeven dagen onrein zijn.", "1 Joh 4:4": "Kinderen, u bent uit God, en hebt hen overwonnen; want Hij die in u is, is meer dan hij die in de wereld is.", "Openb 4:8": "En de vier dieren hadden ieder voor zichzelf zes vleugels rondom, en waren van binnen vol ogen; en zij hebben geen rust, dag en nacht, en zeggen: Heilig, heilig, heilig is de Heere God, de Almachtige, Die was, en Die is, en Die komen zal.", "Ps 37:24": "Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand.", "Deut 14:1": "U bent kinderen van de HEERE, uw God. U zult uzelf niet snijden, en geen kaalheid maken tussen uw ogen, over een dode.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Amos 8:10": "En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Spr 21:9": "Het is beter te wonen op een hoek van het dak, dan met een kijfachtige vrouw, en dat in een huis van gezelschap.", "Matt 8:22": "Maar Jezus zei tegen hem: Volg Mij, en laat de doden hun doden begraven.", "Ps 68:12": "De Heere gaf te spreken; van de boodschappers van goede tijdingen was een grote heerschaar.", "Ezech 16:41": "Zij zullen ook uw huizen met vuur verbranden, en oordelen tegen u uitvoeren voor de ogen van veel vrouwen; en Ik zal u doen ophouden een hoer te zijn, en u zult ook geen hoerenloon meer geven.", "Lev 21:10-15": "En hij, die de hogepriester onder zijn broeders is, op wiens hoofd de zalfolie gegoten is, en wiens hand men gevuld heeft om die klederen aan te trekken, zal zijn hoofd niet ontbloten, en ook zijn klederen niet scheuren. Hij zal ook bij geen dode lichamen komen; zelfs over zijn vader en over zijn moeder zal hij zich niet verontreinigen. En uit het heiligdom zal hij niet weggaan, opdat hij het heiligdom van zijn God niet ontheiligt, want de kroon van de zalfolie van zijn God is op hem; Ik ben de HEERE!", "Lev 21:17-23": "Spreek tot Aäron en zeg: Niemand uit uw nageslacht, naar hun geslachten, aan wie een gebrek is, zal naderen om het voedsel van zijn God te offeren. Want geen man, aan wie een gebrek is, zal naderen, hij zij een blinde man, of kreupele, of iemand met een misvormde neus, of met een misvormd lichaamsdeel; Of een man, aan wie een breuk van de voet, of een breuk van de hand is;", "Num 10:21": "Toen trokken de Kohathieten op, dragend het heiligdom; en de anderen richtten de tabernakel op, tegen dat dezen kwamen.", "Num 5:11-29": "Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tot hen: Wanneer de vrouw van iemand afgeweken zal zijn, en door overtreding tegen hem overtreden zal hebben, Doordat een man gemeenschap met haar gehad heeft, en het voor de ogen van haar man verborgen zal zijn, en zij zich verheeld zal hebben, terwijl zij toch onrein geworden is; en er geen getuige tegen haar is, en zij niet op heterdaad betrapt is;", "Rom 7:1-3": "Weet u niet, broeders! (want ik spreek tot hen die de wet kennen) dat de wet heerst over de mens, zo lang als hij leeft? Want een vrouw die onder de man staat, is aan de levende man verbonden door de wet; maar als de man gestorven is, dan is zij vrijgemaakt van de wet van de man. Daarom dan, als zij bij een andere man gaat wonen terwijl de man leeft, zal zij een overspeelster genoemd worden; maar als de man gestorven is, dan is zij vrij van de wet, zodat zij geen overspeelster is als zij bij een andere man gaat wonen.", "Ps 36:7": "Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten.", "Jes 5:16": "Doch de HEERE van de heerscharen zal verhoogd worden door het recht; en God, die Heilige, zal geheiligd worden door gerechtigheid.", "Openb 18:9": "En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien;", "Kol 1:11": "bekrachtigd met alle kracht, naar de sterkte van Zijn heerlijkheid, tot alle lijdzaamheid en geduld, met blijdschap;", "Jes 4:4": "wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Num 3:32": "De aanvoerder nu van de aanvoerders van Levi zal zijn Eleazar, de zoon van Aäron, de priester; zijn opzicht zal zijn over degenen, die de wacht van het heiligdom waarnemen.", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Jes 43:15": "Ik ben de HEERE, uw Heilige; de Schepper van Israël, uw Koning.", "2 Petr 1:2-4": "Genade en vrede worden u vermeerderd door de kennis van God, en van Jezus, onze Heere; Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd; Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Ps 37:17": "Want de armen van de goddelozen zullen verbroken worden; maar de HEERE ondersteunt de rechtvaardigen.", "1 Tim 3:3": "niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "Jes 28:6": "en tot een Geest van het oordeel voor hem die te oordelen zit, en tot een sterkte voor hen die de strijd terugdrijven tot aan de poort toe.", "1 Sam 6:20": "Toen zeiden de mensen van Beth-Semes: Wie zou kunnen bestaan voor het aangezicht van de HEERE, deze heilige God? En naar wie zal Hij van ons wegtrekken?", "Deut 21:10-14": "Wanneer u uittrekt ten strijde tegen uw vijanden, en de HEERE, uw God, hen in uw hand gegeven heeft, zodat u hun gevangenen gevankelijk wegvoert; En u onder de gevangenen een vrouw ziet die mooi is van uiterlijk, en u naar haar verlangt, zodat u haar tot vrouw wilt nemen; Dan zult u haar in uw huis brengen; en zij zal haar hoofd scheren en haar nagels knippen.", "1 Tim 3:4": "iemand die zijn eigen huis goed bestuurt en zijn kinderen in onderdanigheid houdt, met alle waardigheid;", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Mal 1:12": "Maar u ontheiligt die, als u zegt: De tafel van de HEERE is verontreinigd, en haar inkomst, haar voedsel, is verachtelijk.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "2 Kron 30:8": "Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "Tit 1:10": "Want er zijn ook veel ongeregelde mensen, mensen die zinloze praat verkondigen en misleiden, vooral zij die uit de besnijdenis zijn;", "Dan 4:8": "Totdat ten laatste Daniël bij mij binnenkwam, wiens naam Beltsazar is, naar de naam van mijn god, in wie ook de geest van de heilige goden is; en ik vertelde de droom aan hem en zei:", "Mal 1:11": "Maar van de opgang van de zon tot haar ondergang, zal Mijn Naam groot zijn onder de heidenen; en op elke plaats zal aan Mijn Naam reukwerk gebracht worden, en een rein spijsoffer; want Mijn Naam zal groot zijn onder de heidenen, zegt de HEERE van de heerscharen.", "Lev 21:1-12": "Daarna zei de HEERE tegen Mozes: Spreek tot de priesters, de zonen van Aäron, en zeg tegen hen: Over een dode zal een priester zich niet verontreinigen onder zijn volken. Behalve over zijn bloedverwant, die hem het naast is, over zijn moeder en over zijn vader, en over zijn zoon, en over zijn dochter, en over zijn broer. En over zijn zuster, die maagd is, hem nabestaande, die nog geen man toebehoord heeft; over die zal hij zich verontreinigen.", "1 Kor 6:16": "Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden.", "Num 18:9": "Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn.", "Matt 8:21": "En een ander van Zijn discipelen zei tegen Hem: Heere, laat mij toe dat ik eerst heenga en mijn vader kan begraven.", "Hand 10:38": "namelijk dat Jezus van Nazareth, hoe God Hem gezalfd heeft met de Heilige Geest en met kracht; Die het land is doorgegaan, terwijl Hij goeddeed en allen genas die door de duivel overweldigd waren; want God was met Hem.", "Joh 15:20": "Denk aan het woord dat Ik u gezegd heb: Een dienstknecht is niet meer dan zijn heer. Als zij Mij vervolgd hebben, zullen zij ook u vervolgen; als zij Mijn woord bewaard hebben, zullen zij ook het uwe bewaren.", "Joh 17:20": "En Ik bid niet alleen voor dezen, maar ook voor hen die door hun woord in Mij geloven zullen.", "Lev 10:6": "En Mozes zei tegen Aäron, en tegen Eleazar en tegen Ithamar, zijn zonen: U mag uw hoofden niet ontbloten, en uw kleren niet scheuren, zodat u niet sterft, en er grote toorn over de hele gemeenschap komt; maar laat uw broeders, het hele huis van Israël, deze brand bewenen, die de HEERE aangestoken heeft.", "Job 36:23": "Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?", "Hab 3:19": "De HEERE Heere is mijn Sterkte; en Hij zal mijn voeten maken als die van de hinden, en Hij zal mij doen treden op mijn hoogten. Voor de koorleider, op mijn Neginoth.", "Num 18:10": "Aan het allerheiligste zult u dat eten; ieder die mannelijk is zal dat eten; het zal u een heilig ding zijn.", "Ezech 44:7": "Omdat u vreemden hebt binnengebracht, onbesnedenen van hart en onbesnedenen van vlees, om in Mijn heiligdom te zijn, om dat te ontheiligen, namelijk Mijn huis; toen u Mijn brood, het vette en het bloed offerde, en zij Mijn verbond verbraken, naast al uw gruwelen.", "Lev 7:20": "Maar als een ziel het vlees van het dankoffer, dat van de HEERE is, gegeten zal hebben terwijl haar onreinheid op haar is, dan zal die ziel uit haar volk uitgeroeid worden.", "Lev 21:1-11": "Daarna zei de HEERE tegen Mozes: Spreek tot de priesters, de zonen van Aäron, en zeg tegen hen: Over een dode zal een priester zich niet verontreinigen onder zijn volken. Behalve over zijn bloedverwant, die hem het naast is, over zijn moeder en over zijn vader, en over zijn zoon, en over zijn dochter, en over zijn broer. En over zijn zuster, die maagd is, hem nabestaande, die nog geen man toebehoord heeft; over die zal hij zich verontreinigen.", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "Lev 22:32": "En u zult Mijn heilige Naam niet ontheiligen, opdat Ik in het midden van de kinderen van Israël geheiligd word; Ik ben de HEERE, Die u heiligt!", "Ezech 44:9-14": "Zo zegt de Heere HEERE: Geen vreemde, onbesneden van hart en onbesneden van vlees, zal in Mijn heiligdom naar binnen gaan, van enige vreemde die te midden van de kinderen van Israël is. Maar de Levieten die ver van Mij weggegaan zijn, toen Israël ging dolen, die van Mij zijn afgedwaald, hun drekgoden  achterna, zullen wel hun ongerechtigheid dragen; Toch zullen zij in Mijn heiligdom bedienaars zijn, in de ambten aan de poorten van het huis, en zij zullen het huis bedienen; zij zullen het brandoffer en het slachtoffer voor het volk slachten, en zullen voor hun aangezicht staan om hen te dienen;", "2 Kor 10:4": "Want de wapens van onze strijd zijn niet vleselijk, maar krachtig door God, tot het neerwerpen van bolwerken;", "Ex 30:26-29": "En daarmee moet u zalven: de tent van de samenkomst en de ark van de getuigenis, En de tafel met al zijn gereedschap, en de kandelaar met zijn gereedschap, en het reukaltaar; En het altaar van het brandoffer, met al zijn gereedschap, en het wasvat met zijn voet.", "Lev 22:2-8": "Spreek tot Aäron en tot zijn zonen, dat zij zich afzonderen van de heilige dingen van de kinderen van Israël, die zij Mij heiligen, opdat zij de Naam van Mijn heiligheid niet ontheiligen; Ik ben de HEERE! Zeg tegen hen: Elke man onder uw geslachten, uit uw hele nageslacht, die tot de heilige dingen zal naderen die de kinderen van Israël de HEERE heiligen, terwijl zijn onreinheid op hem is; die mens zal van voor Mijn aangezicht uitgeroeid worden; Ik ben de HEERE! Niemand van het nageslacht van Aäron die melaats is, of een vloed heeft, zal van die heilige dingen eten, totdat hij rein is; alsook wie iets aanraakt dat onrein is door een dood lichaam, of een man aan wie het zaad van de gemeenschap ontgaat.", "Lev 11:45": "Want Ik ben de HEERE, Die u uit het land Egypte doet optrekken, opdat Ik u tot een God zij, en opdat u heilig bent, omdat Ik heilig ben.", "Mal 2:1": "En nu, priesters, dit gebod wordt tot u gezonden.", "Jer 1:8": "Vrees niet voor hun aangezicht, want Ik ben met u, om u te redden, spreekt de HEERE.", "Ex 28:2-4": "En u zult voor uw broeder Aäron heilige kleren maken, tot heerlijkheid en tot sieraad. U zult ook spreken tot allen die wijs van hart zijn, die Ik met de geest van wijsheid vervuld heb, dat zij voor Aäron kleren maken om hem te heiligen, zodat hij Mij het priesterambt bedient. Dit nu zijn de kleren die zij maken zullen: een borstlap, en een efod, en een mantel, en een rok vol oogjes, een hoed en een gordel; zij zullen dan voor uw broeder Aäron heilige kleren maken, en voor zijn zonen, om Mij het priesterambt te bedienen.", "2 Kor 5:11": "Wij dan, die de schrik van de Heere kennen, bewegen de mensen tot het geloof, en wij zijn openbaar geworden voor God; en ik hoop dat wij ook in uw gewetens geopenbaard zijn geworden.", "Mal 3:3": "En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "Ezech 39:7": "En Ik zal Mijn heilige Naam bekendmaken te midden van Mijn volk Israël, en Ik zal Mijn heilige Naam niet meer laten ontheiligen; en de heidenen zullen weten dat Ik de HEERE ben, de Heilige in Israël.", "Job 34:10": "Daarom, u, lieden van verstand, hoor naar mij: Ver zij God van goddeloosheid, en de Almachtige van onrecht!", "Lev 8:7-9": "Daar deed hij hem het onderkleed aan, en gordde hem met de gordel, en trok hem de mantel aan; en deed hij hem de efod aan, en gordde die met de kunstige band van de efod, en bond hem daarmee vast. Vervolgens deed hij hem de borstlap aan, en voegde aan de borstlap de Urim en de Tummim toe. En hij zette de hoed op zijn hoofd; en aan de hoed, boven zijn gezicht, zette hij de gouden plaat, de kroon van de heiligheid, zoals de HEERE Mozes geboden had.", "Num 35:25": "En de vergadering zal de doodslager redden uit de hand van de bloedwreker, en de vergadering zal hem laten terugkeren naar zijn vrijstad, waarheen hij gevlucht was; en hij zal daarin blijven tot de dood van de hogepriester, die met de heilige olie gezalfd is.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Num 18:1": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.", "Luk 18:19": "En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Een, namelijk God.", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Lev 3:11": "En de priester zal dat aansteken op het altaar; het is een spijs van het vuuroffer voor de HEERE.", "Hos 2:19": "En Ik zal u aan Mij verloven in geloof; en u zult de Heere kennen.", "Ezra 2:62": "Dezen zochten hun register, onder hen die in het geslachtsregister opgenomen waren, maar zij werden niet gevonden; daarom werden zij als onreinen van het priesterschap geweerd.", "Lev 19:27": "U zult de hoeken van het hoofd niet rond afscheren; ook zult u de hoeken van het baard niet aantasten.", "Matt 5:31": "Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.", "Lev 5:3": "Of als hij de onreinheid van een mens zal hebben aangeraakt, wat voor onreinheid het ook is waardoor hij onrein wordt; en het is voor hem verborgen geweest, maar hij komt erachter, dan is hij schuldig.", "Ps 18:29": "Want U doet mijn lamp lichten; de HEERE, mijn God, doet mijn duisternis opklaren.", "2 Kor 9:8": "En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk.", "Kol 2:11": "In Wie u ook besneden bent met een besnijdenis die niet met handen gedaan wordt, in het uittrekken van het lichaam van de zonden van het vlees, door de besnijdenis van Christus;", "2 Kron 29:21": "En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij die op het altaar van de HEERE zouden offeren.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Num 8:19": "En Ik heb de Levieten aan Aäron en aan zijn zonen als gift gegeven, uit het midden van de kinderen van Israël, om de dienst van de kinderen van Israël in de tent van de samenkomst te verrichten, en om voor de kinderen van Israël verzoening te doen, zodat er geen plaag onder de kinderen van Israël komt, als de kinderen van Israël tot het heiligdom zouden naderen.", "Lev 15:31": "Zo zult u de kinderen van Israël afzonderen van hun onreinheid; opdat zij in hun onreinheid niet sterven, wanneer zij Mijn tabernakel, die in hun midden is, zouden verontreinigen.", "2 Tim 1:13": "Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.", "1 Tim 6:14": "dat u dit gebod houdt, onbevlekt en onberispelijk, tot de verschijning van onze Heere Jezus Christus;", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "1 Kor 2:2": "Want ik had besloten niets te weten onder u, dan Jezus Christus, en Die gekruisigd.", "1 Tim 3:2": "Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren;", "Ezech 23:48": "Zo zal Ik de schandelijkheid uit het land doen ophouden, opdat alle vrouwen onderwezen worden zodat zij niet naar uw schandelijkheid handelen.", "2 Tim 3:17": "opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "Kol 4:17": "En zeg tegen Archippus: Let op de bediening die u hebt aangenomen in de Heere, dat u die vervult.", "Hebr 10:14": "Want met één offer heeft Hij voor eeuwig volmaakt gemaakt hen die geheiligd worden.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "Jer 29:6": "Neemt vrouwen, en verwekt zonen en dochters, en neemt vrouwen voor uw zonen, en geeft uw dochters aan mannen, zodat zij zonen en dochters baren; en wordt daar talrijker, en wordt niet minder.", "Ps 144:1": "Een psalm van David. Geprezen zij de HEERE, mijn Rotssteen, Die mijn handen leert voor de strijd, mijn vingers voor de oorlog;", "Num 16:5": "En hij sprak tot Korach en tot zijn hele vergadering, en zei: Morgenvroeg zal de HEERE bekendmaken wie van Hem is, en wie de heilige is, die Hij tot Zich zal laten naderen; en wie Hij verkoren zal hebben, die zal Hij tot Zich laten naderen.", "Ezech 48:8": "Aan de grens nu van Juda, van de oostkant tot de westkant toe, zal het hefoffer zijn, dat u zult offeren, vijfentwintigduizend meetrieten in breedte, en de lengte, als van een van de andere delen, van de oostkant tot de westkant toe; en het heiligdom zal in het midden daarvan zijn.", "Jer 48:37": "Want alle hoofden zijn kaal, en alle baarden afgeknipt; op alle handen zijn insnijdingen, en op de lenden is een rouwkleed.", "Jer 1:5": "Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld.", "2 Tim 2:1-7": "U dan, mijn zoon, word gesterkt in de genade die in Christus Jezus is; en wat u van mij gehoord hebt onder veel getuigen, vertrouw dat toe aan trouwe mensen, die bekwaam zullen zijn om ook anderen te leren. Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Lev 6:16": "En wat daarvan overblijft, zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden, in de heilige plaats; in de voorhof van de tent der samenkomst zullen zij dat eten.", "Tit 3:2": "Dat zij niemand belasteren, geen ruziezoekers zijn, maar vriendelijk zijn, en alle zachtmoedigheid bewijzen tegenover alle mensen.", "Lev 13:2": "Een mens, als er in het vel van zijn vlees een gezwel, of gezweer, of witte blaar zal zijn, welke in het vel van zijn vlees tot een plaag van de melaatsheid zou worden, hij zal dan naar de priester Aäron, of naar een van zijn zonen, de priesters, gebracht worden.", "Ex 19:14": "Toen ging Mozes van de berg af naar het volk, en hij heiligde het volk; en zij wasten hun kleren.", "2 Sam 15:30": "En David ging op door de opgang van de olijven, terwijl hij opging en weende, en zijn hoofd was bedekt; en hij zelf ging blootsvoets; ook had heel het volk dat bij hem was, ieder zijn hoofd bedekt, en zij gingen op, terwijl zij opgingen en weenden.", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Jes 6:6": "Maar een van de serafs vloog naar mij toe, en had een gloeiende kool in zijn hand, die hij met de tang van het altaar genomen had.", "Ezech 23:39": "Want toen zij hun kinderen voor hun drekgoden geslacht hadden, kwamen zij op diezelfde dag in Mijn heiligdom, om dat te ontheiligen; en zie, zo hebben zij gedaan in het midden van Mijn huis.", "Ps 72:6": "Hij zal neerdalen als een regen op het nagras, als de druppels, die de aarde bevochtigen.", "Jes 41:17": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten.", "Spr 18:22": "Wie een vrouw gevonden heeft, heeft iets goeds gevonden, en hij heeft welgevallen verkregen van de HEERE.", "Job 1:20": "Toen stond Job op, en scheurde zijn mantel, en schoor zijn hoofd, en viel op de aarde, en boog zich neer;", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Num 19:20": "Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden van de gemeenschap uitgeroeid worden; want hij heeft het heiligdom van de HEERE verontreinigd, het water van de afzondering is niet op hem gesprenkeld, hij is onrein.", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "2 Tim 2:20-26": "Maar in een groot huis zijn niet alleen gouden en zilveren voorwerpen, maar ook houten en aarden voorwerpen; en sommige tot eer, maar sommige tot oneer. Als iemand zichzelf dan van deze dingen reinigt, zal hij een voorwerp zijn tot eer, geheiligd en bruikbaar voor de Heere, toebereid tot alle goed werk. Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Hand 20:22-24": "En nu, zie, ik, gebonden door de Geest, reis naar Jeruzalem, zonder te weten wat mij daar zal overkomen; Behalve dat de Heilige Geest van stad tot stad betuigt en zegt dat mij boeien en verdrukkingen te wachten staan. Maar ik geef niets om mijn leven, en houd het niet dierbaar voor mijzelf, als ik mijn loop maar met blijdschap mag volbrengen, en de dienst die ik van de Heere Jezus ontvangen heb, om het Evangelie van de genade van God te betuigen.", "2 Tim 2:11": "Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven;", "Tit 1:7": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "Lev 21:1-23": "Daarna zei de HEERE tegen Mozes: Spreek tot de priesters, de zonen van Aäron, en zeg tegen hen: Over een dode zal een priester zich niet verontreinigen onder zijn volken. Behalve over zijn bloedverwant, die hem het naast is, over zijn moeder en over zijn vader, en over zijn zoon, en over zijn dochter, en over zijn broer. En over zijn zuster, die maagd is, hem nabestaande, die nog geen man toebehoord heeft; over die zal hij zich verontreinigen.", "Jes 33:5": "De HEERE is verheven, want Hij woont in de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.", "Mal 1:7": "U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk.", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "Mal 2:5": "Mijn verbond met hem was het leven en de vrede; en Ik gaf hem die tot een vrees, en hij vreesde Mij, en hij werd om Mijn Naam bevreesd.", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "1 Tess 2:3-12": "Want onze vermaning is niet voortgekomen uit dwaling, niet uit onreinheid, en niet met bedrog; maar zoals wij door God beproefd zijn, zodat ons het Evangelie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft. Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige!", "Klaagl 3:38": "Mem. Gaat niet uit de mond van de Allerhoogste het kwade en het goede?", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "1 Petr 1:16": "want er staat geschreven: Wees heilig, want Ik ben heilig.", "2 Kor 11:2": "Want ik ben ijverig over u met een ijver van God; want ik heb u toebereid om u als een reine maagd aan één man voor te stellen, namelijk aan Christus.", "Hebr 13:9": "Laat u niet meeslepen door allerlei vreemde leringen; want het is goed dat het hart gesterkt wordt door genade, niet door spijzen, waarmee zij die daarin gewandeld hebben, geen nuttigheid hebben verkregen.", "Ex 3:5": "En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land.", "Tit 3:8": "Dit is een betrouwbaar woord, en ik wil dat u deze dingen met ernst bevestigt, opdat zij die aan God geloven, er zorg voor dragen goede werken voor te staan; deze dingen zijn goed en nuttig voor de mensen.", "Ex 25:8": "En zij zullen Mij een heiligdom maken, dat Ik in hun midden woon.", "Lev 19:20-22": "En wanneer een man, door gemeenschap van het zaad, bij een vrouw zal hebben gelegen, die een dienstmaagd is, aan een man verloofd, en geenszins losgekocht is, en haar geen vrijheid is gegeven; die zullen gegeseld worden; zij zullen niet gedood worden; want zij was niet vrijgemaakt. En hij zal zijn schuldoffer de HEERE aan de deur van de tent van de samenkomst brengen, een ram ten schuldoffer. En de priester zal met de ram van het schuldoffer, voor hem over zijn zonde die hij gezondigd heeft, voor het aangezicht van de HEERE verzoening doen; en hem zal vergeving gebeuren van zijn zonde die hij gezondigd heeft.", "Lev 6:17": "Het zal niet met desem gebakken worden; het is hun deel, dat Ik hun gegeven heb van Mijn vuuroffers; het is allerheiligst, evenals het zondoffer en evenals het schuldoffer.", "Jer 31:12": "Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn.", "Ps 108:8": "God heeft gesproken in Zijn heiligdom, daarom zal ik van vreugde opspringen; ik zal Sichem delen, en het dal van Sukkoth zal ik afmeten.", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Lev 13:6-8": "En de priester zal hem opnieuw op de zevende dag bekijken; indien, zie, de plaag ingetrokken is, en de plaag in het vel niet uitgespreid is, zal de priester hem rein verklaren; het was een verzwering; en hij zal zijn kleren wassen, zo is hij rein. Maar als de verzwering in het vel helemaal uitgespreid is, nadat hij aan de priester tot zijn reiniging vertoond is, zal hij opnieuw aan de priester vertoond worden. Indien de priester zal merken, dat, zie, de verzwering in het vel uitgespreid is, zal de priester hem onrein verklaren; het is melaatsheid.", "Hand 1:8": "maar u zult de kracht van de Heilige Geest ontvangen, Die over u komen zal; en u zult Mijn getuigen zijn, zowel in Jeruzalem als in heel Judea en Samaria, en tot aan het uiterste van de aarde.", "Jes 16:12": "En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.", "Gal 6:14": "Maar laat het ver van mij zijn dat ik zou roemen, anders dan in het kruis van onze Heere Jezus Christus; door Wie de wereld mij gekruisigd is, en ik de wereld.", "Ps 84:6": "Gelukkig is de mens, wiens sterkte in U is, in wier hart de gebaande wegen zijn.", "1 Tim 4:3": "die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen.", "2 Kron 26:18": "En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Ps 74:7": "Zij hebben Uw heiligdommen in het vuur gezet; tot op de grond hebben zij de woning van Uw Naam ontheiligd.", "Matt 11:26": "Ja, Vader! Want zo is het welbehagen geweest voor U.", "Mal 2:4": "Dan zult u weten dat Ik dit gebod tot u gezonden heb, opdat Mijn verbond met Levi blijft bestaan, zegt de HEERE van de heerscharen.", "Jes 41:18": "Ik zal rivieren openen op de hoge plaatsen, en bronnen in het midden van de valleien; Ik zal de woestijn tot een waterpoel maken, en het dorre land tot waterbronnen.", "2 Kor 10:2": "Ik bid dan, dat ik, tegenwoordig zijnde, niet stout hoef te zijn met die vrijmoedigheid, waarmee ik denk stout te moeten optreden tegen sommigen, die ons zo beoordelen alsof wij naar het vlees wandelden.", "1 Sam 12:7": "En nu, ga hier staan, zodat ik met u in het gericht ga, voor het aangezicht van de HEERE, over al de rechtvaardige daden van de HEERE, die Hij aan u en aan uw vaderen gedaan heeft.", "Zach 12:8": "Op die dag zal de HEERE de inwoners van Jeruzalem beschutten; en wie onder hen struikelen zou, zal op die dag zijn als David; en het huis van David zal zijn als goden, als de Engel van de HEERE voor hun aangezicht.", "1 Kor 13:10": "Maar wanneer het volmaakte gekomen zal zijn, dan zal wat ten dele is, tot niets gemaakt worden.", "1 Tim 3:12": "Laat de diakenen mannen van één vrouw zijn, die hun kinderen en hun eigen huizen goed besturen.", "1 Kor 11:11": "Toch is de man niet zonder de vrouw, en de vrouw niet zonder de man, in de Heere.", "Lev 20:3": "En Ik zal Mijn aangezicht tegen die man richten, en zal hem uit het midden van zijn volk uitroeien; want hij heeft van zijn nageslacht aan de Molech gegeven, om Mijn heiligdom te verontreinigen en Mijn heilige Naam te ontheiligen.", "Klaagl 4:1": "Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "Jak 1:18": "Naar Zijn wil heeft Hij ons gebaard door het Woord van de waarheid, opdat wij zouden zijn als eerstelingen van Zijn schepselen.", "2 Kor 1:21": "Maar Die ons met u bevestigt in Christus, en Die ons gezalfd heeft, is God;", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Lev 21:13-15": "Hij zal ook een vrouw in haar maagdelijkheid nemen. Een weduwe, of verstotene, of ontheiligde hoer, zo iemand zal hij niet nemen; maar een maagd uit zijn volken zal hij tot een vrouw nemen. En hij zal zijn nageslacht onder zijn volken niet ontheiligen; want Ik ben de HEERE, die hem heiligt!", "Spr 9:10": "De vreze van de HEERE is het beginsel van de wijsheid, en de kennis van de Heilige is verstand.", "Hebr 13:21": "Hij volmaakt u in alle goed werk, opdat u Zijn wil mag doen; terwijl Hij in u werkt wat voor Hem welgevallig is, door Jezus Christus; aan Wie de heerlijkheid is, tot in alle eeuwigheid. Amen.", "Ex 33:16": "Want waaraan zou nu bekend worden dat ik genade gevonden heb in Uw ogen, ik en Uw volk? Is het niet daaraan, dat U met ons meegaat? Zo zullen wij afgezonderd worden, ik en Uw volk, van alle volk dat op de aardbodem is.", "Ps 30:8": "Want, HEERE! U had mijn berg door Uw goedgunstigheid vast doen staan; maar toen U Uw aangezicht verborg, werd ik verschrikt.", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "1 Tess 4:4": "Dat ieder van u weet zijn eigen lichaam te bezitten in heiliging en eer;", "Spr 16:6": "Door goedertierenheid en trouw wordt de misdaad verzoend; en door de vreze van de HEERE wijkt men af van het kwade.", "Tit 1:5-7": "Om die reden heb ik u op Kreta gelaten, opdat u, wat nog ontbrak, verder zou regelen, en dat u van stad tot stad oudsten zou aanstellen, zoals ik u bevolen heb: Als iemand onberispelijk is, de man van één vrouw, gelovige kinderen heeft, die niet te beschuldigen zijn van overdaad, of ongehoorzaam zijn. Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "Ezech 39:25": "Daarom zegt de Heere HEERE zo: Nu zal Ik de gevangenen van Jakob terugbrengen, en Ik zal Mij ontfermen over heel het huis van Israël, en Ik zal ijveren voor Mijn heilige Naam;", "2 Kor 6:3-7": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt. Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "Ps 33:4": "Want het woord van de HEERE is recht, en al Zijn werk is trouw.", "Matt 10:16-24": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven. Maar wees op uw hoede voor de mensen; want zij zullen u overleveren aan de raadsvergaderingen, en zij zullen u geselen in hun synagogen; En u zult ook voor stadhouders en koningen geleid worden, om Mij, tot een getuigenis voor hen en de heidenen.", "Gal 2:8": "(Want Hij Die door Petrus krachtig werkte tot het apostelschap voor de besnedenen, Die werkte ook krachtig in mij onder de heidenen);", "1 Kor 9:5": "Hebben wij geen macht om een vrouw, een zuster zijnde, met ons mee te nemen, zoals ook de andere apostelen, en de broeders van de Heere, en Cefas?", "1 Kor 1:2": "Aan de Gemeente van God, die te Korinthe is, de geheiligden in Christus Jezus, de geroepen heiligen, met allen die de Naam van onze Heere Jezus Christus aanroepen in elke plaats, zowel hun als onze Heere;", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "Ezech 44:25": "Ook zal niemand van hen tot een dode mens naar binnen gaan, zodat hij onrein wordt; maar om een vader, of om een moeder, of om een zoon, of om een dochter, om een broer of om een zuster die geen man gehad heeft, mogen zij zich verontreinigen.", "Ps 31:25": "Wees sterk, en Hij zal uw hart versterken, allen u, die op de HEERE hoopt!", "Mark 6:18": "Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben.", "1 Petr 1:15": "maar word, zoals Hij Die u geroepen heeft heilig is, ook zelf heilig in heel uw levenswandel;", "Lev 8:30": "Mozes nam ook van de zalfolie, en van het bloed dat op het altaar was, en sprenkelde het op Aäron, op zijn kleren, en op zijn zonen, en op de kleren van zijn zonen met hem; en hij heiligde Aäron, zijn kleren, en zijn zonen, en de kleren van zijn zonen met hem.", "Matt 11:20-24": "Toen begon Hij de steden te verwijten waarin Zijn krachten meest gebeurd waren, omdat zij zich niet bekeerd hadden. Wee u, Chorazin! Wee u, Bethsaïda! Want als in Tyrus en Sidon de krachten gebeurd waren die in u gebeurd zijn, zouden zij zich lang geleden in zak en as bekeerd hebben. Maar Ik zeg u: het zal Tyrus en Sidon draaglijker zijn op de dag van het oordeel, dan u.", "Matt 19:17": "En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden.", "Ex 29:30": "Zeven dagen zal hij ze aantrekken, hij die uit zijn zonen in zijn plaats priester zal worden, die in de tent van de samenkomst gaan zal, om in het heilige te dienen.", "Jer 31:14": "En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "Ezech 23:25": "En Ik zal Mijn na-ijver tegen u inzetten, zodat zij in grimmigheid met u zullen handelen; zij zullen uw neus en uw oren afsnijden, en wat er van u overblijft zal door het zwaard vallen; zij zullen uw zonen en uw dochters wegnemen, en wat er van u overblijft zal door het vuur verteerd worden.", "Neh 10:39": "Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.", "Jes 47:4": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël.", "Ps 150:1": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte!", "Lev 24:9": "En het zal voor Aäron en zijn zonen zijn, die het op de heilige plaats zullen eten; want het is voor hem allerheiligst uit de vuuroffers van de HEERE, een eeuwige inzetting.", "1 Tess 2:10": "U bent getuigen, en God ook, hoe heilig, en rechtvaardig, en onberispelijk wij ons onder u, die gelooft, gedragen hebben.", "Hand 26:17": "En zal u verlossen van dit volk en van de heidenen, tot wie Ik u nu zend;", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "2 Kor 2:15-17": "Want wij zijn voor God een goede geur van Christus, onder hen die behouden worden, en onder hen die verloren gaan; voor de laatsten een geur van dood tot dood, maar voor de eersten een geur van leven tot leven. En wie is hiertoe bekwaam? Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "Matt 23:17": "Dwazen en blinden, want wat is meer, het goud, of de tempel die het goud heiligt?", "Num 3:28": "In getal van al wat mannelijk was, van een maand oud en daarboven, waren achtduizend zeshonderd, die de wacht van het heiligdom waarnamen.", "2 Sam 12:10-12": "Nu dan, het zwaard zal niet van uw huis wijken tot in eeuwigheid, omdat u Mij veracht hebt, en de vrouw van Uria, de Hethiet, genomen hebt, zodat zij uw vrouw is geworden. Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw eigen huis, en Ik zal uw vrouwen nemen voor uw ogen, en zal ze aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen van deze zon. Want u hebt het in het verborgene gedaan, maar Ik zal deze zaak doen voor heel Israël, en voor de zon.", "Lev 16:13": "En hij zal dat reukwerk op het vuur leggen, voor het aangezicht van de HEERE, opdat de wolk van het reukwerk het verzoendeksel dat op de getuigenis is bedekt, en dat hij niet sterft.", "Lev 5:2": "Of wanneer een mens iets onreins zal hebben aangeraakt, hetzij het dode aas van een wild onrein dier, of het dode aas van onrein vee, of het dode aas van onrein kruipend gedierte; ook al is het voor hem verborgen geweest, toch is hij onrein en schuldig.", "Lev 8:12": "Daarna goot hij van de zalfolie op het hoofd van Aäron, en hij zalfde hem, om hem te heiligen.", "Ps 105:3": "Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "2 Tim 1:6-8": "Om deze reden herinner ik u eraan, dat u de gave van God opwekt, die in u is door de oplegging van mijn handen. Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid. Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "Tit 2:15": "Spreek dit, en vermaan, en bestraf met alle ernst. Laat niemand u minachten.", "Mal 1:6": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam?", "Lev 20:17": "En als een man zijn zuster, de dochter van zijn vader, of de dochter van zijn moeder, neemt, en hij haar schaamte ziet, en zij zijn schaamte ziet, is het een schandvlek; daarom zullen zij voor de ogen van de kinderen van hun volk uitgeroeid worden; hij heeft de schaamte van zijn zuster ontdekt, hij zal zijn ongerechtigheid dragen.", "Jes 1:25": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen.", "Hab 1:13": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zo
