e daarop gieten, en wierook daarop leggen.", "2": "En hij zal het brengen tot de zonen van Aäron, de priesters, van wie er één daarvan zijn hand vol zal grijpen uit de meelbloem, en uit de olie, met alle wierook; en de priester zal het gedenkoffer daarvan aansteken op het altaar; het is een vuuroffer, tot een liefelijke reuk voor de HEERE.", "3": "Wat nu overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is allerheiligst van de vuuroffers van de HEERE.", "4": "En als u een offer van spijsoffer zult brengen, een gebak uit de oven; het zullen ongezuurde koeken van meelbloem zijn, met olie gemengd, en ongezuurde vladen, met olie bestreken.", "5": "En indien uw offer een spijsoffer is, in de pan gebakken, zal het van ongezuurde meelbloem zijn, met olie gemengd.", "6": "Breek het in stukken, en giet olie daarop; het is een spijsoffer.", "7": "En als uw offer een spijsoffer uit de pan is, zal het van meelbloem met olie gemaakt worden.", "8": "Dan zult u dat spijsoffer, dat daarvan gemaakt zal worden, aan de HEERE brengen; en men zal het tot de priester laten naderen, die het naar het altaar zal dragen.", "9": "En de priester zal van dat spijsoffer het gedenkoffer daarvan opnemen, en op het altaar aansteken; het is een vuuroffer, tot een liefelijke reuk voor de HEERE.", "10": "En wat overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is allerheiligst van de vuuroffers van de HEERE.", "11": "Geen spijsoffer, dat u de HEERE zult brengen, zal met desem gemaakt worden; want van geen zuurdesem, en van geen honing zult u de HEERE een vuuroffer aansteken.", "12": "De offers van de eerstelingen zult u de HEERE brengen; maar op het altaar zullen zij niet komen tot een liefelijke reuk.", "13": "En elk offer van uw spijsoffer zult u met zout zouten, en het zout van het verbond van uw God mag u niet laten ontbreken bij uw spijsoffer; met heel uw offer zult u zout offeren.", "14": "En als u de HEERE een spijsoffer van de eerste vruchten offert, zult u voor het spijsoffer van uw eerste vruchten groene aren, bij het vuur gedord, offeren, dat is, het klein gebroken graan van volle groene aren.", "15": "En u zult olie daarop doen, en wierook daarop leggen; het is een spijsoffer.", "16": "Zo zal de priester het gedenkoffer daarvan aansteken van het klein gebroken graan en van de olie, met alle wierook; het is een vuuroffer voor de HEERE."}, "SV": {"1": "Als nu een ziel een offerande van spijsoffer den HEERE zal offeren, zijn offerande zal van meelbloem zijn; en hij zal olie daarop gieten, en wierook daarop leggen.", "2": "En hij zal het brengen tot de zonen van Aäron, de priesters, *een* van welke daarvan zijn hand vol grijpen zal uit deszelfs meelbloem, en uit deszelfs olie, met al deszelfs wierook; en de priester zal deszelfs gedenkoffer aansteken op het altaar; het is een vuuroffer, tot een liefelijken reuk den HEERE.", "3": "Wat nu overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is een heiligheid der heiligheden van de vuurofferen des HEEREN.", "4": "En als gij offeren zult een offerande van spijsoffer, een gebak des ovens; het zullen zijn ongezuurde koeken van meelbloem, met olie gemengd, en ongezuurde vladen, met olie bestreken.", "5": "En indien uw offerande spijsoffer is, in de pan *gekookt*, zij zal zijn van ongezuurde meelbloem, met olie gemengd.", "6": "Breekt ze in stukken, en giet olie daarop; het is een spijsoffer.", "7": "En zo uw offerande een spijsoffer des ketels is, het zal van meelbloem met olie gemaakt worden.", "8": "Dan zult gij dat spijsoffer, hetwelk daarvan zal gemaakt worden, den HEERE toebrengen; en men zal het tot den priester doen naderen, die het tot het altaar dragen zal.", "9": "En de priester zal van dat spijsoffer deszelfs gedenkoffer opnemen, en op het altaar aansteken, het is een vuuroffer, tot een liefelijken reuk den HEERE.", "10": "En wat overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is een heiligheid der heiligheden van de vuurofferen des HEEREN.", "11": "Geen spijsoffer, dat gij den HEERE zult offeren, zal met desem gemaakt worden; want van geen zuurdesem, en van geen honig zult gijlieden den HEERE vuuroffer aansteken.", "12": "De offeranden der eerstelingen zult gij den HEERE offeren; maar op het altaar zullen zij niet komen tot een liefelijken reuk.", "13": "En alle offerande uws spijsoffers zult gij met zout zouten, en het zout des verbonds van uw God van uw spijsoffer niet laten afblijven; met al uw offerande zult gij zout offeren.", "14": "En zo gij den HEERE een spijsoffer der eerste vruchten offert, zult gij het spijsoffer uwer eerste vruchten van groene aren, bij het vuur gedord, dat is, het klein gebroken graan van volle groene aren, offeren.", "15": "En gij zult olie daarop doen, en wierook daarop leggen; het is een spijsoffer.", "16": "Zo zal de priester deszelfs gedenkoffer aansteken van zijn klein gebroken graan en van zijn olie, met al den wierook; het is een vuuroffer den HEERE."}, "KJV": {"1": "And when any will offer a meat offering unto the LORD, his offering shall be *of* fine flour; and he shall pour oil upon it, and put frankincense", "2": "And he shall bring it to Aaron's sons the priests: and he shall take thereout his handful of the flour thereof, and of the oil thereof, with all the frankincense thereof; and the priest shall burn the memorial of it upon the altar, *to be* an offering made by fire, of a sweet savour unto the LORD:", "3": "And the remnant of the meat offering *shall be* Aaron's and his sons': *it is* a thing most holy of the offerings of the LORD made by fire.", "4": "And if thou bring an oblation of a meat offering baken in the oven, *it shall be* unleavened cakes of fine flour mingled with oil, or unleavened wafers anointed with oil.", "5": "And if thy oblation *be* a meat offering *baken* in a pan, it shall be *of* fine flour unleavened, mingled with oil.", "6": "Thou shalt part it in pieces, and pour oil thereon: it *is* a meat offering.", "7": "And if thy oblation *be* a meat offering *baken* in the fryingpan, it shall be made *of* fine flour with oil.", "8": "And thou shalt bring the meat offering that is made of these things unto the LORD: and when it is presented unto the priest, he shall bring it unto the altar.", "9": "And the priest shall take from the meat offering a memorial thereof, and shall burn *it* upon the altar: *it is* an offering made by fire, of a sweet savour unto the LORD.", "10": "And that which is left of the meat offering *shall be* Aaron's and his sons': *it is* a thing most holy of the offerings of the LORD made by fire.", "11": "No meat offering, which ye shall bring unto the LORD, shall be made with leaven: for ye shall burn no leaven, nor any honey, in any offering of the LORD made by fire.", "12": "As for the oblation of the firstfruits, ye shall offer them unto the LORD: but they shall not be burnt on the altar for a sweet savour.", "13": "And every oblation of thy meat offering shalt thou season with salt; neither shalt thou suffer the salt of the covenant of thy God to be lacking from thy meat offering: with all thine offerings thou shalt offer salt.", "14": "And if thou offer a meat offering of thy firstfruits unto the LORD, thou shalt offer for the meat offering of thy firstfruits green ears of corn dried by the fire, *even* corn beaten out of full ears.", "15": "And thou shalt put oil upon it, and lay frankincense thereon: it *is* a meat offering.", "16": "And the priest shall burn the memorial of it, *part* of the beaten corn thereof, and *part* of the oil thereof, with all the frankincense thereof: *it is* an offering made by fire unto the LORD."}}, "tsk": {"1": [{"kopje": "spijsoffer", "refs": ["Lev 6:14-18", "Lev 6:20-23", "Lev 9:17", "Num 15:4-21", "Jes 66:20", "Joh 6:35"]}, {"kopje": "meelbloem", "refs": ["Ex 29:2", "Num 7:13", "Num 7:19", "Joël 1:9", "Joël 2:14"]}, {"kopje": "olie daarop gieten", "refs": ["Lev 2:4-8", "Lev 2:15", "Lev 2:16", "Lev 7:10-12", "1 Joh orrey/i/?hl=Lev.2.16#i9896", "refs": [{"disp": "Lev 2:1", "href": "../../leviticus/2/#v1", "ref": "Lev 2:1", "svLabel": null}, {"disp": "Lev 2:2", "href": "../../leviticus/2/#v2", "ref": "Lev 2:2", "svLabel": null}, {"disp": "Lev 2:15", "href": "../../leviticus/2/#v15", "ref": "Lev 2:15", "svLabel": null}, {"disp": "Lev 2:16", "href": "../../leviticus/2/#v16", "ref": "Lev 2:16", "svLabel": null}, {"disp": "Lev 6:15", "href": "../../leviticus/6/#v15", "ref": "Lev 6:15", "svLabel": null}], "kinderen": []}]}, {"topic": "Meat-offerings", "href": "../../torrey/m/#t-meat-offerings", "kinderen": [{"label": "A small part of, was consumed on the altar for a memorial", "href": "../../torrey/m/?hl=Lev.2.16#i12645", "refs": [{"disp": "Lev 2:2", "href": "../../leviticus/2/#v2", "ref": "Lev 2:2", "svLabel": null}, {"disp": "Lev 2:9", "href": "../../leviticus/2/#v9", "ref": "Lev 2:9", "svLabel": null}, {"disp": "Lev 2:16", "href": "../../leviticus/2/#v16", "ref": "Lev 2:16", "svLabel": null}, {"disp": "Lev 6:15", "href": "../../leviticus/6/#v15", "ref": "Lev 6:15", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Num 31:22-24": "Alleen het goud en het zilver, het koper, het ijzer, het tin en het lood; Alles wat tegen het vuur bestand is, moet u door het vuur laten gaan, zodat het rein wordt; toch zal het ook met het water der afzondering ontzondigd moeten worden; maar alles wat niet tegen het vuur bestand is, moet u door het water laten gaan. U moet ook uw kleren op de zevende dag wassen, zodat u rein wordt; en daarna zult u in het leger komen.", "Luk 1:10": "En heel de menigte van het volk was buiten aan het bidden, op het uur van het reukoffer.", "Ex 12:19": "Zeven dagen lang mag er geen zuurdeeg in uw huizen gevonden worden, want wie het gedesemde eet, die ziel zal uit de vergadering van Israël uitgeroeid worden, of hij nu een vreemdeling is of een ingeborene van het land.", "1 Petr 4:2": "om niet meer naar de begeerten van de mensen, maar naar de wil van God de tijd te leven die nog over is in het vlees.", "Jes 42:1": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen.", "Ezech 43:24": "En u zult ze offeren voor het aangezicht van de HEERE; en de priesters zullen zout daarop werpen, en zullen ze offeren tot brandoffer aan de HEERE.", "1 Sam 2:14": "En sloeg die in de teil, of in de ketel, of in de pan, of in de pot; al wat de vork optrok, dat nam de priester voor zich. Zo deden zij aan alle Israëlieten die in Silo kwamen.", "Lev 7:6-10": "Al wie mannelijk is onder de priesters mag dat eten; op de heilige plaats zal het gegeten worden; het is allerheiligst. Zoals het zondoffer is, zo zal ook het schuldoffer zijn; er zal één wet voor beide zijn; het zal voor de priester zijn die daarmee verzoening gedaan heeft. Ook de priester die iemands brandoffer offert, die priester zal de huid van het brandoffer hebben dat hij geofferd heeft.", "Lev 5:16": "Zo zal hij vergoeden wat hij, onwetend, tekortgedaan heeft aan de heilige dingen, en zal daarbij een vijfde deel toevoegen, dat hij aan de priester geven zal; zo zal de priester met de ram van het schuldoffer voor hem verzoening doen, en het zal hem vergeven worden.", "Gal 5:9": "Een beetje zuurdesem verzuurt het hele deeg.", "Neh 13:22": "Vervolgens zei ik tegen de Levieten dat zij zich zouden reinigen, en de poorten komen bewaken, om de sabbatdag te heiligen. Denk ook hierin aan mij, mijn God! en spaar mij naar de overvloed van Uw goedertierenheid.", "Ex 34:25": "U zult het bloed van Mijn slachtoffer niet offeren met gedesemd brood; het slachtoffer van het paasfeest zal ook niet overnachten tot de morgen.", "Num 31:20": "Ook moet u alle kleding, en alle voorwerpen van vellen, en alle werk van geitenhaar, en voorwerpen van hout, ontzondigen.", "Matt 16:12": "Toen begrepen zij dat Hij niet gezegd had dat zij zich moesten wachten voor de zuurdesem van het brood, maar voor de leer van de Farizeeën en Sadduceeën.", "Lev 5:13": "Zo zal de priester voor hem verzoening doen over zijn zonde die hij gezondigd heeft in een van die gevallen, en het zal hem vergeven worden; en het overige zal voor de priester zijn, zoals bij het spijsoffer.", "Num 18:19": "Alle hefoffers van de heilige dingen, die de kinderen van Israël de HEERE zullen offeren, heb Ik aan u gegeven, en aan uw zonen, en aan uw dochters met u, tot een eeuwige inzetting; het zal een eeuwig zoutverbond zijn, voor het aangezicht van de HEERE, voor u en voor uw nageslacht met u.", "Ezra 7:22": "tot honderd talenten van het zilver toe, en tot honderd kor tarwe, en tot honderd bath wijn, en tot honderd bath olie, en zout zonder voorschrift.", "Joh 6:35": "En Jezus zei tegen hen: Ik ben het Brood des levens; wie tot Mij komt, zal beslist geen honger hebben, en wie in Mij gelooft, zal nooit meer dorst hebben.", "1 Kor 5:6-8": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt? Zuiver dan de oude zuurdesem weg, opdat u een nieuw deeg mag zijn, zoals u ongezuurd bent. Want ook ons Pascha is voor ons geslacht, namelijk Christus. Laten we dan feest houden, niet met de oude zuurdesem, ook niet met de zuurdesem van kwaadheid en boosheid, maar met de ongezuurde broden van oprechtheid en waarheid.", "Ex 29:37": "Zeven dagen zult u verzoening doen voor het altaar, en zult het heiligen; dan zal dat altaar allerheiligst zijn; al wat het altaar aanraakt, zal heilig zijn.", "Lev 2:4-8": "En als u een offer van spijsoffer zult brengen, een gebak uit de oven; het zullen ongezuurde koeken van meelbloem zijn, met olie gemengd, en ongezuurde vladen, met olie bestreken. En indien uw offer een spijsoffer is, in de pan gebakken, zal het van ongezuurde meelbloem zijn, met olie gemengd. Breek het in stukken, en giet olie daarop; het is een spijsoffer.", "Matt 26:38": "Toen zei Hij tegen hen: Mijn ziel is zeer bedroefd, tot de dood toe; blijft hier en waakt met Mij.", "Mal 1:11": "Maar van de opgang van de zon tot haar ondergang, zal Mijn Naam groot zijn onder de heidenen; en op elke plaats zal aan Mijn Naam reukwerk gebracht worden, en een rein spijsoffer; want Mijn Naam zal groot zijn onder de heidenen, zegt de HEERE van de heerscharen.", "2 Kon 4:42": "En er kwam een man van Baäl-Salisa, en bracht de man Gods brood van de eerstelingen, twintig gerstebroden, en groene aren in hun schillen; en hij zei: Geef aan het volk, zodat zij eten.", "Num 18:9": "Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Lev 1:4-17": "En hij zal zijn hand op het hoofd van het brandoffer leggen, opdat het voor hem aangenaam is, om hem te verzoenen. Daarna zal hij het jonge rund slachten voor het aangezicht van de HEERE; en de zonen van Aäron, de priesters, zullen het bloed offeren, en het bloed sprengen rondom dat altaar, dat voor de deur van de tent van de samenkomst is. Dan zal hij het brandoffer de huid aftrekken, en het in zijn stukken delen.", "Ezech 45:1-4": "Wanneer u dan het land door het lot laat toevallen als erfenis, zult u een hefoffer aan de HEERE brengen, als een heilige plaats, van het land; de lengte zal zijn de lengte van vijfentwintigduizend meetrieten, en de breedte tienduizend; dat zal in zijn hele omtrek rondom heilig zijn. Hiervan zal voor het heiligdom zijn vijfhonderd bij vijfhonderd, vierkant rondom; en het zal vijftig el hebben als buitenruimte rondom. Zo zult u met deze maat meten: de lengte van vijfentwintigduizend, en de breedte van tienduizend, en daarin zal het heiligdom zijn, met het heilige der heiligen.", "Joh 3:34": "Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate.", "Rom 15:16": "opdat ik een dienaar van Jezus Christus zou zijn onder de heidenen, het Evangelie van God bedienend, opdat het offer van de heidenen aangenaam zou worden, geheiligd door de Heilige Geest.", "Hos 2:4": "Want hun moeder hoereert, zij die hen ontvangen heeft, handelt schandelijk; want zij zegt: Ik zal mijn minnaars nagaan, die mij mijn brood en mijn water, mijn wol en mijn vlas, mijn olie en mijn drank geven.", "1 Kron 16:40": "Om de HEERE de brandoffers voortdurend te offeren op het brandofferaltaar, 's morgens en 's avonds; en dat naar alles wat er geschreven staat in de wet van de HEERE, die Hij Israël geboden had.", "1 Kor 15:20": "Maar nu, Christus is opgewekt uit de doden, en is de Eersteling geworden van hen die ontslapen zijn.", "Lev 13:34": "Daarna zal de priester die schurftheid op de zevende dag bekijken; indien, zie, de schurftheid in het vel niet uitgespreid is, en haar aanzien niet dieper is dan het vel, zal de priester hem rein verklaren; en hij zal zijn kleren wassen, en rein zijn.", "Lev 6:15-18": "En hij zal daarvan zijn hand vol opnemen, uit de meelbloem van het spijsoffer, en van de olie daarvan, en al de wierook die op het spijsoffer is; dan zal hij het aansteken op het altaar; het is een liefelijke reuk, tot gedachtenis daarvan, voor de HEERE. En wat daarvan overblijft, zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden, in de heilige plaats; in de voorhof van de tent der samenkomst zullen zij dat eten. Het zal niet met desem gebakken worden; het is hun deel, dat Ik hun gegeven heb van Mijn vuuroffers; het is allerheiligst, evenals het zondoffer en evenals het schuldoffer.", "Lev 7:31-34": "En de priester zal dat vet op het altaar aansteken; maar de borst zal voor Aäron en zijn zonen zijn. U zult ook de rechterschouder als hefoffer aan de priester geven, uit uw dankoffers. Wie uit de zonen van Aäron het bloed van het dankoffer en het vet offert, die zal de rechterschouder als deel toekomen.", "Lev 23:14-17": "En u zult geen brood, noch geroosterd koren, noch groene aren eten, tot op diezelfde dag, dat u de offerande van uw God zult gebracht hebben; het is een eeuwige inzetting voor uw geslachten, in al uw woningen. Daarna zult u voor uzelf tellen vanaf de dag na de sabbat, vanaf de dag dat u de schoof van het beweegoffer zult gebracht hebben; het zullen zeven volle sabbatten zijn; tot de dag na de zevende sabbat zult u vijftig dagen tellen, dan zult u een nieuw spijsoffer aan de HEERE offeren.", "Lev 11:24-40": "En hierdoor zult u onrein worden: wie hun kadaver aangeraakt zal hebben, zal onrein zijn tot de avond. Wie van hun kadaver gedragen zal hebben, zal zijn kleren wassen, en onrein zijn tot de avond. Elk dier dat de klauw verdeelt, maar de klauwen niet in tweeën gespleten heeft, en niet herkauwt, zal voor u onrein zijn; wie het aangeraakt zal hebben, zal onrein zijn.", "Luk 21:34": "En let op uzelf, dat uw harten niet op enig moment bezwaard worden met brasserij en dronkenschap, en zorgen van dit leven, en dat die dag u niet onvoorzien overkomt.", "Lev 9:17": "En hij liet het spijsoffer toebrengen, en vulde daarvan zijn hand, en stak het aan op het altaar, behalve het morgenbrandoffer.", "Ex 29:27-34": "En u zult de borst van het beweegoffer heiligen, en de schouder van het hefoffer, die bewogen wordt, en die opgeheven zal zijn van de ram van het vuloffer, van hetgeen dat van Aäron is, en van hetgeen dat van zijn zonen is. En het zal voor Aäron en zijn zonen zijn tot een eeuwige inzetting vanwege de kinderen van Israël; want het is een hefoffer; en het hefoffer vanwege de kinderen van Israël zal zijn van hun dankoffers; hun hefoffer zal voor de HEERE zijn. De heilige kleren nu, die van Aäron zullen geweest zijn, zullen van zijn zonen na hem zijn, opdat men hen daarin zalft, en dat men hun hand daarin vult.", "Openb 8:3": "En er kwam een andere engel, en hij stond aan het altaar met een gouden wierookvat; en hem werd veel van het reukwerk gegeven, opdat hij dat met de gebeden van alle heiligen zou leggen op het gouden altaar dat voor de troon is.", "Num 6:20": "En de priester zal die bewegen als beweegoffer, voor het aangezicht van de HEERE; het is een heilig deel voor de priester, met de borst van het beweegoffer en met de schouder van het hefoffer; en daarna zal die Nazireeër wijn drinken.", "Num 6:15": "En een korf ongezuurde koeken, koeken van meelbloem, met olie gemengd, en ongezuurde vladen, met olie bestreken, alsook hun spijsoffer en hun drankoffers;", "Gen 23:11": "Nee, mijn heer! Hoor mij; de akker geef ik u; ook de spelonk die daarin is, die geef ik u; voor de ogen van de zonen van mijn volk geef ik u die; begraaf uw dode.", "Ezech 16:13": "Zo was u versierd met goud en zilver, en uw kleding was fijn linnen, en zijde, en geborduurd werk; u at meelbloem, en honing, en olie, en u was buitengewoon mooi, en u had voorspoed, zodat u een koninkrijk werd.", "Ezra 6:9": "En wat nodig is, jonge runderen, en rammen, en lammeren, tot brandoffers aan de God van de hemel, tarwe, zout, wijn en olie, naar het zeggen van de priesters die te Jeruzalem zijn, dat het hun dag bij dag gegeven wordt, zodat er geen tekort ontstaat;", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "Lev 2:1-16": "Als iemand de HEERE een offer van spijsoffer zal brengen, zal zijn offer van meelbloem zijn; en hij zal olie daarop gieten, en wierook daarop leggen. En hij zal het brengen tot de zonen van Aäron, de priesters, van wie er één daarvan zijn hand vol zal grijpen uit de meelbloem, en uit de olie, met alle wierook; en de priester zal het gedenkoffer daarvan aansteken op het altaar; het is een vuuroffer, tot een liefelijke reuk voor de HEERE. Wat nu overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is allerheiligst van de vuuroffers van de HEERE.", "Lev 4:26": "Hij zal ook al zijn vet op het altaar in rook laten opgaan, zoals het vet van het dankoffer; zo zal de priester voor hem verzoening doen van zijn zonde, en het zal hem vergeven worden.", "Spr 25:16": "Hebt u honig gevonden, eet zoveel als u genoeg is; opdat u er misschien niet zat van wordt, en het uitspuwt.", "Matt 16:11": "Hoe komt het dat u niet begrijpt dat Ik u niet over brood gesproken heb, toen Ik zei dat u zich moest wachten voor de zuurdesem van de Farizeeën en Sadduceeën?", "Lev 24:7": "En op elke rij zult u zuivere wierook leggen, die het brood tot een gedenkoffer zal zijn; het is een vuuroffer voor de HEERE.", "1 Sam 2:28": "En Ik heb hem uit alle stammen van Israël voor Mij tot priester verkozen, om te offeren op Mijn altaar, om het reukwerk aan te steken, om de efod voor Mijn aangezicht te dragen; en heb aan het huis van uw vader al de vuuroffers van de kinderen van Israël gegeven.", "Jes 66:3": "Wie een os slacht, slaat een man; wie een lam offert, breekt een hond de hals; wie spijsoffer offert, is als die zwijnenbloed offert; wie wierook brandt tot een gedenkoffer, is als die een afgod zegent. Dezen kiezen ook hun eigen wegen, en hun ziel heeft plezier in hun verfoeisels.", "Gen 4:3": "En het gebeurde na verloop van enige dagen, dat Kaïn van de vrucht van het land de HEERE een offer bracht.", "Neh 13:14": "Denk aan mij, mijn God, in dit opzicht; en delg mijn weldaden niet uit, die ik aan het huis van mijn God en aan Zijn wachten gedaan heb.", "Neh 10:37": "En dat wij de eerstelingen van ons deeg, en onze hefoffers, en de vrucht van alle bomen, most en olie, zouden brengen tot de priesters, in de kamers van het huis van onze God, en de tienden van ons land tot de Levieten; en dat diezelfde Levieten de tienden zouden hebben in alle steden van onze landbouw;", "Lev 4:17": "En de priester zal zijn vinger indopen, nadat hij van dat bloed genomen heeft; en hij zal zevenmaal sprenkelen voor het aangezicht van de HEERE, voor de voorhang.", "Lev 21:22": "Het voedsel van zijn God, van de allerheiligste dingen, en van de heilige dingen, zal hij mogen eten;", "Num 7:19": "Hij bracht zijn offergave: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "Joël 1:9": "Spijsoffer en drankoffer is van het huis van de HEERE afgesneden; de priesters, dienaars van de HEERE, treuren.", "Lev 3:11": "En de priester zal dat aansteken op het altaar; het is een spijs van het vuuroffer voor de HEERE.", "Ps 22:15": "Ik ben uitgestort als water, en al mijn beenderen hebben zich vaneen gescheiden; mijn hart is als was, het is gesmolten in het midden van mijn ingewand.", "Jes 66:20": "En zij zullen al uw broeders uit alle heidenen naar de HEERE brengen als spijsoffer, op paarden, en op wagens, en op draagstoelen, en op muildieren, en op snelle lopers, naar Mijn heilige berg toe, naar Jeruzalem, zegt de HEERE, zoals de kinderen van Israël het spijsoffer in een rein vat brengen naar het huis van de HEERE.", "Lev 14:34-48": "Als u gekomen zult zijn in het land Kanaän, dat Ik u tot bezitting geven zal, en Ik de plaag van de melaatsheid aan een huis van dat land van uw bezitting gegeven zal hebben, zal hij, van wie dat huis is, komen, en het de priester te kennen geven en zeggen: Het schijnt mij, alsof er een plaag in het huis is. En de priester zal gebieden dat zij dat huis ruimen, voordat de priester komt om die plaag te bezien, zodat niet alles wat in dat huis is onrein wordt; en daarna zal de priester komen om dat huis te bezien.", "Lev 14:13": "Daarna zal hij dat lam slachten op de plaats waar men het zondoffer en het brandoffer slacht, in de heilige plaats; want het schuldoffer, evenals het zondoffer, is voor de priester; het is allerheiligst.", "Rom 12:1": "Ik smeek u dan, broeders, door de ontfermingen van God, dat u uw lichamen stelt tot een levend, heilig en Gode welbehaaglijk offer, dat is uw redelijke godsdienst.", "Ex 29:2": "En ongezuurd brood, en ongezuurde koeken, met olie gemengd, en ongezuurde vladen, met olie bestreken; van tarwemeelbloem zult u ze maken.", "Ex 30:16": "U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.", "Ex 12:8": "En zij zullen het vlees eten in dezelfde nacht, gebraden aan het vuur, met ongezuurde broden; met bittere kruiden zullen zij het eten.", "Ex 29:18": "Zo zult u de hele ram in rook laten opgaan op het altaar; het is een brandoffer voor de HEERE, tot een liefelijke reuk, het is een vuuroffer voor de HEERE.", "Ezra 6:20": "Want de priesters en de Levieten hadden zich gereinigd als één man; zij waren allen rein; en zij slachtten het pascha voor alle kinderen van de wegvoering, en voor hun broeders, de priesters, en voor zichzelf.", "Num 18:8-19": "Verder sprak de HEERE tot Aäron: En Ik, zie, Ik heb u gegeven de wacht van Mijn hefoffers, met alle heilige dingen van de kinderen van Israël heb Ik ze u gegeven, vanwege de zalving, en aan uw zonen, tot een eeuwige inzetting. Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn. Aan het allerheiligste zult u dat eten; ieder die mannelijk is zal dat eten; het zal u een heilig ding zijn.", "Lev 10:13": "Daarom moet u dat eten in de heilige plaats, omdat het uw bescheiden deel en het bescheiden deel van uw zonen uit de vuuroffers van de HEERE is; want zo is mij geboden.", "Num 18:12": "Al het beste van de olie, en al het beste van de most, en van koren, hun eerstelingen, die zij de HEERE zullen geven, heb Ik u gegeven.", "Num 5:18": "Daarna zal de priester de vrouw voor het aangezicht van de HEERE stellen, en zal het hoofd van de vrouw ontbloten, en zal het spijsoffer van de gedachtenis op haar handen leggen, dat het spijsoffer van de ijveringen is; en in de hand van de priester zal dat bittere water zijn, dat de vloek meebrengt.", "Num 7:13": "En zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "Lev 14:12": "En de priester zal dat ene lam nemen, en het offeren als schuldoffer met de log olie; en zal die als beweegoffer voor het aangezicht van de HEERE bewegen.", "Judas 1:20": "Maar geliefden, bouw uzelf op in uw allerheiligst geloof, en bid in de Heilige Geest;", "Num 28:2": "Gebied de kinderen van Israël, en zeg tegen hen: Mijn offerande, Mijn voedsel voor Mijn vuuroffers, Mijn liefelijke reuk, zult u in acht nemen, om Mij te offeren op zijn vastgestelde tijd.", "1 Kor 9:13": "Weet u niet, dat wie de heilige dingen bedienen, van het heilige eten? En wie steeds bij het altaar zijn, met het altaar meedelen?", "Joh 12:27": "Nu is Mijn ziel ontroerd; en wat zal Ik zeggen? Vader, verlos Mij uit dit uur! Maar hierom ben Ik tot dit uur gekomen.", "Ex 22:29": "Met het brengen van de opbrengst van uw oogst en van uw perskuip mag u niet talmen; de eerstgeborene van uw zonen moet u aan Mij geven.", "Ps 22:14": "Zij hebben hun mond tegen mij opgesperd, als een verscheurende en brullende leeuw.", "Num 15:4-21": "Zo zal hij, die zijn offerande de HEERE offert, een spijsoffer offeren van een tiende meelbloem, gemengd met een vierendeel van een hin olie. En wijn ten drankoffer, een vierendeel van een hin, zult u bereiden tot een brandoffer of tot een slachtoffer, voor één lam. Of voor een ram zult u een spijsoffer bereiden, van twee tienden meelbloem, gemengd met olie, een derde deel van een hin.", "Lev 6:15": "En hij zal daarvan zijn hand vol opnemen, uit de meelbloem van het spijsoffer, en van de olie daarvan, en al de wierook die op het spijsoffer is; dan zal hij het aansteken op het altaar; het is een liefelijke reuk, tot gedachtenis daarvan, voor de HEERE.", "Lev 23:10": "Spreek tot de kinderen van Israël, en zeg tegen hen: Als u in het land zult gekomen zijn, dat Ik u geven zal, en u uw oogst zult inoogsten, dan zult u een schoof van de eerstelingen van uw oogst tot de priester brengen.", "Lev 3:5": "En de zonen van Aäron zullen dat aansteken op het altaar, op het brandoffer, dat op het hout zal zijn, dat op het vuur is; het is een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Num 6:19": "Daarna zal de priester een gekookte schouder nemen van de ram, en een ongezuurde koek uit de korf, en een ongezuurde vlade; en hij zal ze op de handen van de Nazireeër leggen, nadat hij zijn Nazireeërschap afgeschoren heeft.", "2 Kron 31:5": "Toen dat bevel nu bekend werd, brachten de kinderen van Israël veel eerstelingen van koren, most, en olie, en honing, en van alle opbrengsten van het veld; ook brachten zij de tienden van alles in met overvloed.", "Ex 12:20": "U moet niets eten dat gedesemd is; in al uw woningen moet u ongezuurde broden eten.", "Ex 8:3": "Zodat de rivier van kikkers zal krioelen; die zullen opkomen en in uw huis komen, en in uw slaapkamer, ja, op uw bed; ook in de huizen van uw knechten, en op uw volk, en in uw bakovens, en in uw baktroggen.", "Matt 16:6": "En Jezus zei tegen hen: Kijk uit, en wacht u voor de zuurdesem van de Farizeeën en Sadduceeën.", "Gen 23:17": "Zo werd de akker van Efron, die in Machpela was, tegenover Mamre lag, de akker en de spelonk die daarin was, en al het geboomte dat op de akker stond, dat rondom in zijn hele gebied lag, aan Abraham toegewezen,", "1 Sam 2:13": "Want de gewoonte van deze priesters met het volk was, dat wanneer iemand een offer offerde, de jongen van de priester kwam, terwijl het vlees kookte, met een drietandige vork in zijn hand;", "Joël 2:14": "Wie weet, Hij mocht Zich wenden en berouw hebben; en Hij mocht een zegen achter Zich overlaten tot spijsoffer en drankoffer voor de HEERE, uw God.", "Lev 7:12": "Als hij dat als een lofoffer offert, zal hij naast het lofoffer ongezuurde koeken met olie gemengd, en ongezuurde vladen met olie bestreken, offeren; en die koeken met olie gemengd zullen van geroosterde meelbloem zijn.", "Ezech 46:20": "En hij zei tegen mij: Dit is de plaats waar de priesters het schuldoffer en het zondoffer zullen koken, en waar zij het spijsoffer zullen bakken, zodat zij het niet naar buiten hoeven te brengen naar het buitenste voorhof, om het volk te heiligen.", "Jes 53:2-10": "Want Hij is als een jonge loot voor Zijn aangezicht opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante en geen heerlijkheid; als wij Hem aanzagen, was er geen gestalte dat wij Hem begeerd zouden hebben. Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht. Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.", "Lev 4:25": "Daarna zal de priester van het bloed van het zondoffer met zijn vinger nemen, en dat op de hoornen van het altaar van het brandoffer doen; dan zal hij zijn bloed aan de voet van het altaar van het brandoffer uitgieten.", "2 Kron 35:11-14": "Daarna slachtte men het pascha, en de priesters sprengden het bloed uit hun handen, en de Levieten trokken de huiden af. En zij namen het brandoffer daar af, opdat zij het naar de verdelingen van de vaderlijke huizen, aan het volk geven mochten, om de HEERE te offeren, zoals geschreven is in het boek van Mozes; en zo ook met de runderen. En zij kookten het pascha bij het vuur, naar het recht; maar de andere heilige dingen kookten zij in potten, en in ketels, en in pannen; en zij deelden het haastig onder heel het volk.", "Deut 18:3-5": "Dit nu zal het recht van de priesters zijn van het volk, van hen die een offerande offeren, hetzij een os of klein vee: dat hij de priester de schouder zal geven, en beide kaken, en de pens. De eerstelingen van uw koren, van uw most en van uw olie, en de eerstelingen van de wol van uw schapen zult u hem geven; want de HEERE, uw God, heeft hem uit al uw stammen verkozen, dat hij staat om te dienen in de Naam van de HEERE, hij en zijn zonen, alle dagen.", "1 Kon 17:12-16": "Maar zij zei: Zo waarachtig als de HEERE, uw God, leeft, ik heb geen koek, alleen een hand vol van het meel in de kruik, en een beetje olie in de fles! En zie, ik heb een paar stukken hout gesprokkeld, en ik ga naar binnen, en zal het voor mij en voor mijn zoon bereiden, zodat wij het eten, en sterven. En Elia zei tegen haar: Vrees niet, ga naar binnen, doe naar uw woord; maar maak mij eerst een kleine koek daarvan, en breng die mij hier naar buiten; maar voor u en uw zoon zult u daarna iets maken. Want zo zegt de HEERE, de God van Israël: Het meel van de kruik zal niet verteerd worden, en de olie van de fles zal niet ontbreken, tot op de dag dat de HEERE regen op de aardbodem geven zal.", "1 Kron 23:29": "Te weten voor het brood van de bereiding, en voor de meelbloem ten spijsoffer, en voor de ongezuurde vladen, en voor de pannen, en voor het geroosterde, en voor alle mate en afmeting;", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "Spr 21:17": "Wie blijdschap liefheeft, die zal gebrek lijden; wie wijn en olie liefheeft, zal niet rijk worden.", "Spr 24:13": "Eet honing, mijn zoon! want hij is goed, en honingzeem is zoet voor uw gehemelte.", "Lev 6:16": "En wat daarvan overblijft, zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden, in de heilige plaats; in de voorhof van de tent der samenkomst zullen zij dat eten.", "Neh 10:35": "Dat wij ook de eerstelingen van ons land en de eerstelingen van alle vrucht van al het geboomte, jaar op jaar, zouden brengen naar het huis van de HEERE;", "Num 6:17": "Hij zal ook de ram als dankoffer voor de HEERE bereiden, met de korf ongezuurde koeken; en de priester zal zijn spijsoffer en zijn drankoffer bereiden.", "1 Kron 23:28": "Omdat hun standplaats was aan de hand van de zonen van Aäron in de dienst van het huis van de HEERE, over de voorhoven, en over de kamers, en over de reiniging van alle heilige dingen, en het werk van de dienst van het huis van God;", "Lev 6:20-23": "Dit is de offerande van Aäron en van zijn zonen, die zij de HEERE offeren zullen op de dag dat hij gezalfd wordt: het tiende deel van een efa meelbloem, een voortdurend spijsoffer; de helft daarvan op de morgen, en de helft daarvan op de avond. Het zal in een pan met olie gemaakt worden; geroosterd zult u het brengen; en de gebakken stukken van het spijsoffer zult u offeren, tot een liefelijke reuk voor de HEERE. Ook zal de priester die uit zijn zonen in zijn plaats gezalfd wordt, hetzelfde doen; het is een eeuwige inzetting; het zal voor de HEERE geheel aangestoken worden.", "Lev 14:8": "Die nu te reinigen is, zal zijn kleren wassen, en al zijn haar afscheren, en zich in het water afwassen, dan zal hij rein zijn; daarna zal hij in het leger komen, maar zal buiten zijn tent zeven dagen blijven.", "Num 15:4": "Zo zal hij, die zijn offerande de HEERE offert, een spijsoffer offeren van een tiende meelbloem, gemengd met een vierendeel van een hin olie.", "Rom 11:16": "En als de eerstelingen heilig zijn, dan is ook het deeg heilig, en als de wortel heilig is, dan zijn ook de takken heilig.", "Ex 16:31": "En het huis van Israël noemde het Man; en het was als korianderzaad, wit, en de smaak ervan was als honingkoeken.", "Lev 11:35": "En alles waarop iets van hun kadaver zal vallen, zal onrein zijn; de oven en de aarden pan zal stukgebroken worden; ze zijn onrein, daarom zullen ze voor u onrein zijn.", "Hebr 7:26": "Want zo'n Hogepriester paste bij ons: heilig, onschuldig, onbesmet, afgescheiden van de zondaars, en hoger geworden dan de hemelen;", "Matt 5:13": "U bent het zout der aarde; maar als het zout smakeloos wordt, waarmee zal het gezouten worden? Het deugt nergens meer toe dan om buiten geworpen en door de mensen vertrapt te worden.", "Hand 10:4": "En hij hield de ogen op hem gericht, en werd zeer bevreesd, en zei: Wat is er, Heere? En Hij zei tegen hem: Uw gebeden en uw aalmoezen zijn als gedachtenis opgekomen voor God.", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "Lev 6:14-18": "Dit is nu de wet van het spijsoffer: een van de zonen van Aäron zal dat voor het aangezicht van de HEERE offeren, voor het altaar. En hij zal daarvan zijn hand vol opnemen, uit de meelbloem van het spijsoffer, en van de olie daarvan, en al de wierook die op het spijsoffer is; dan zal hij het aansteken op het altaar; het is een liefelijke reuk, tot gedachtenis daarvan, voor de HEERE. En wat daarvan overblijft, zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden, in de heilige plaats; in de voorhof van de tent der samenkomst zullen zij dat eten.", "Gen 4:4": "En Abel bracht ook van de eerstgeborenen van zijn schapen, en van hun vet. En de HEERE zag Abel en zijn offer met welgevallen aan;", "Lev 14:10": "En op de achtste dag zal hij twee volkomen lammeren, en een eenjarig volkomen schaap nemen, alsook drie tienden meelbloem als spijsoffer, met olie gemengd, en een log olie.", "Lev 23:20": "Dan zal de priester die met het brood van de eerstelingen tot beweegoffer, voor het aangezicht van de HEERE, met de twee lammeren bewegen; zij zullen voor de HEERE een heilig ding zijn, voor de priester.", "2 Sam 13:6-9": "Amnon legde zich toen neer, en deed alsof hij ziek was. Toen nu de koning kwam om hem te zien, zei Amnon tegen de koning: Laat toch mijn zuster Thamar komen, dat zij twee koekjes voor mijn ogen klaarmaakt, en ik ze uit haar hand eet. Toen zond David iemand naar Thamar in het huis, en zei: Ga toch naar het huis van uw broer Amnon, en maak voor hem voedsel klaar. En Thamar ging naar het huis van haar broer Amnon (hij lag namelijk neer), en zij nam deeg, en kneedde het, en maakte er voor zijn ogen koekjes van, en bakte de koekjes.", "Num 15:20": "De eerstelingen van uw deeg, een koek, zult u tot een hefoffer offeren; zoals het hefoffer van de dorsvloer, zo zult u het offeren.", "Fil 2:17": "Ja, ook al word ik tot een drankoffer geofferd over de offerande en bediening van uw geloof, dan verblijd ik mij, en verblijd ik mij met u allen.", "Lev 10:12-14": "En Mozes sprak tegen Aäron, en tegen Eleazar en tegen Ithamar, zijn overgebleven zonen: Neem het spijsoffer dat over is van de vuuroffers van de HEERE, en eet dat ongezuurd bij het altaar; want het is allerheiligst. Daarom moet u dat eten in de heilige plaats, omdat het uw bescheiden deel en het bescheiden deel van uw zonen uit de vuuroffers van de HEERE is; want zo is mij geboden. Ook de beweegborst en de hefschouder moet u eten in een reine plaats, u, en uw zonen, en uw dochters met u; want als uw bescheiden deel, en het bescheiden deel van uw zonen, zijn zij uit de dankoffers van de kinderen van Israël gegeven.", "Lev 15:2-13": "Spreek tot de kinderen van Israël, en zeg tegen hen: Iedere man, als hij een vloed heeft uit zijn vlees, zal om zijn vloed onrein zijn. Dit nu zal zijn onreinheid zijn om zijn vloed: of zijn vlees zijn vloed laat druppelen, of zijn vlees van zijn vloed zich verstopt, dat is zijn onreinheid. Elk bed waarop hij, die de vloed heeft, zal liggen, zal onrein zijn, en al het voorwerp waarop hij zal zitten, zal onrein zijn.", "Lev 14:9": "En op de zevende dag zal gebeuren dat hij al zijn haar afscheert, zijn hoofd, en zijn baard, en de wenkbrauwen van zijn ogen; ja, al zijn haar zal hij afscheren, en al zijn kleren wassen, en zijn lichaam met water baden, dan zal hij rein zijn.", "Jes 44:3-5": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen. En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken. Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Lev 6:17": "Het zal niet met desem gebakken worden; het is hun deel, dat Ik hun gegeven heb van Mijn vuuroffers; het is allerheiligst, evenals het zondoffer en evenals het schuldoffer.", "Kol 4:6": "Laat uw woord altijd aangenaam zijn, met zout besprengd, opdat u weet hoe u ieder moet antwoorden.", "Lev 3:16": "En de priester zal die aansteken op het altaar; het is een spijs van het vuuroffer, tot een liefelijke reuk; al het vet zal van de HEERE zijn.", "Lev 13:6": "En de priester zal hem opnieuw op de zevende dag bekijken; indien, zie, de plaag ingetrokken is, en de plaag in het vel niet uitgespreid is, zal de priester hem rein verklaren; het was een verzwering; en hij zal zijn kleren wassen, zo is hij rein.", "Lev 3:13": "En hij zal zijn hand op haar hoofd leggen, en hij zal haar slachten voor de tent der samenkomst; en de zonen van Aäron zullen haar bloed op het altaar sprengen rondom.", "2 Kron 13:5": "Weet u niet dat de HEERE, de God van Israël, het koninkrijk over Israël voor eeuwig aan David gegeven heeft, aan hem en zijn zonen, met een zoutverbond?", "Num 31:19": "En u, legert u buiten het leger, zeven dagen; ieder die een mens gedood heeft, en ieder die een gesneuvelde heeft aangeraakt, moet zich op de derde dag en op de zevende dag ontzondigen, u en uw gevangenen.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "Lev 13:47-59": "Verder, als er op een kleed de plaag van de melaatsheid zal zijn, op een wollen kleed, of op een linnen kleed, Of op de scheerdraad, of op de inslag van linnen, of van wol, of op vel, of op enig vellenwerk; En die plaag op het kleed, of op het vel, of op de scheerdraad, of op de inslag, of op enig vellentuig, groenachtig of roodachtig is; het is de plaag van de melaatsheid; daarom zal het aan de priester vertoond worden.", "Lev 15:16-28": "Verder, een man bij wie het zaad van het bijliggen zal zijn uitgegaan, die zal zijn hele vlees met water baden, en onrein zijn tot aan de avond. Ook elk kledingstuk, en elk vel, waaraan het zaad van het bijliggen zal zijn, dat zal met water gewassen worden, en onrein zijn tot aan de avond. Alsook de vrouw, als een man met het zaad van het bijliggen bij haar gelegen zal hebben; daarom zullen zij zich beiden met water baden, en onrein zijn tot aan de avond.", "Ezech 44:28-31": "Dit nu zal hun tot erfenis zijn: Ik ben hun Erfenis; daarom zult u hun geen bezitting geven in Israël; Ik ben hun Bezitting. Het spijsoffer, en het zondoffer, en het schuldoffer, die zullen zij eten; ook zal al het verbannene  in Israël het hunne zijn. En de eerstelingen van alle eerste vruchten van alles, en elk hefoffer van alles, van al uw hefoffers, zullen voor de priesters zijn; ook zult u de eerstelingen van uw deeg de priester geven, om de zegen op uw huis te doen rusten.", "Luk 12:1": "Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.", "Mark 9:49": "Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.", "1 Joh 2:20": "Maar u hebt de zalving van de Heilige, en u weet alle dingen.", "Lev 10:12": "En Mozes sprak tegen Aäron, en tegen Eleazar en tegen Ithamar, zijn overgebleven zonen: Neem het spijsoffer dat over is van de vuuroffers van de HEERE, en eet dat ongezuurd bij het altaar; want het is allerheiligst.", "Mark 8:15": "En Hij gebood hun: Kijk uit, wees op uw hoede voor het zuurdeeg van de Farizeeën, en voor het zuurdeeg van Herodes.", "Lev 6:26": "De priester die het voor de zonde offert, zal het eten; in de heilige plaats zal het gegeten worden, in de voorhof van de tent der samenkomst.", "Lev 1:11": "En hij zal dat slachten aan de zijde van het altaar noordwaarts, voor het aangezicht van de HEERE; en de zonen van Aäron, de priesters, zullen zijn bloed rondom op het altaar sprengen.", "Spr 25:27": "Veel honig eten is niet goed; maar het onderzoeken van de eigen eer is geen eer.", "Ex 23:18": "U zult het bloed van Mijn offer niet offeren met gedesemde broden; ook zal het vet van Mijn feest niet tot de morgen overblijven.", "Lev 7:19": "En het vlees dat iets onreins aangeraakt heeft, zal niet gegeten worden; met vuur zal het verbrand worden; maar wat het andere vlees betreft, dat vlees mag ieder die rein is, eten.", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Fil 4:18": "Maar ik heb alles ontvangen, en ik heb overvloed; ik ben vervuld geworden, nu ik van Epafroditus ontvangen heb wat door u gestuurd was, als een welriekende geur, een aangenaam offer, God welgevallig.", "Ef 5:2": "en wandel in de liefde, zoals ook Christus ons liefgehad heeft, en Zichzelf voor ons heeft overgegeven als een offerande en een slachtoffer, God tot een welriekende reuk.", "Ex 23:19": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE uw God brengen. U zult een bokje niet koken in de melk van zijn moeder.", "Jes 53:10": "Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan.", "Lev 26:26": "Als Ik u de staf van het brood zal hebben gebroken, dan zullen tien vrouwen uw brood in één oven bakken, en zullen uw brood bij het gewicht teruggeven; en u zult eten, maar niet verzadigd worden.", "Deut 18:4": "De eerstelingen van uw koren, van uw most en van uw olie, en de eerstelingen van de wol van uw schapen zult u hem geven;", "Lev 7:10-12": "Ook elk spijsoffer dat met olie gemengd is, of droog, zal voor alle zonen van Aäron zijn, voor de een evenveel als voor de ander. Dit is nu de wet van het dankoffer, dat men de HEERE zal offeren. Als hij dat als een lofoffer offert, zal hij naast het lofoffer ongezuurde koeken met olie gemengd, en ongezuurde vladen met olie bestreken, offeren; en die koeken met olie gemengd zullen van geroosterde meelbloem zijn.", "Hebr 10:11": "En iedere priester stond wel elke dag te dienen, en offerde dikwijls dezelfde offers, die de zonden nooit kunnen wegnemen;", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Lev 14:54-57": "Dit is de wet voor elke plaag van de melaatsheid, en voor schurftheid; en voor melaatsheid van de kleren, en van de huizen; alsook voor gezwel, en voor gezweer, en voor blaren;", "Lev 5:12": "En hij zal het naar de priester brengen, en de priester zal daarvan een handvol nemen, als gedenkdeel daarvan, en dat op het altaar aansteken, boven op de vuuroffers van de HEERE; het is een zondoffer.", "Ex 23:11": "Maar in het zevende jaar zult u het laten rusten en braak laten liggen, zodat de armen van uw volk kunnen eten, en wat overblijft, de dieren van het veld kunnen eten. Zo zult u ook doen met uw wijngaard en met uw olijfbomen.", "Deut 12:17": "U zult in uw poorten niet mogen eten de tienden van uw koren, en van uw most, en van uw olie, noch de eerstgeboorte van uw runderen en van uw schapen, noch enige van uw geloften die u zult hebben beloofd, noch uw vrijwillige offers, noch het hefoffer van uw hand.", "Gen 23:10": "Efron nu zat in het midden van de zonen van Heth; en Efron de Hethiet antwoordde Abraham, ten aanhoren van de zonen van Heth, van allen die door de poort van zijn stad naar binnen gingen, en zei:", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Deut 26:2": "dan zult u van de eerstelingen van alle vrucht van het land nemen, die u opbrengt van uw land dat de HEERE, uw God, u geeft, en zult ze in een korf leggen; en u zult gaan naar de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen;", "1 Kor 5:8": "Laten we dan feest houden, niet met de oude zuurdesem, ook niet met de zuurdesem van kwaadheid en boosheid, maar met de ongezuurde broden van oprechtheid en waarheid.", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "Luk 1:9": "dat hem naar de gewoonte van de priesterlijke dienst door het lot te beurt viel om de tempel van de Heere in te gaan en reukoffers te brengen.", "Lev 14:21": "Maar als hij arm is, en zijn hand dat niet bereikt, zal hij een lam als schuldoffer, ter beweging, nemen, om voor hem verzoening te doen; daartoe een tiende meelbloem, met olie gemengd, als spijsoffer, en een log olie;", "Lev 4:5-12": "Daarna zal die gezalfde priester van het bloed van de var nemen, en hij zal dat naar de tent der samenkomst brengen. En de priester zal zijn vinger in dat bloed dopen; en van dat bloed zal hij zevenmaal sprenkelen voor het aangezicht van de HEERE, voor de voorhang van het heilige. Ook zal de priester van dat bloed doen op de hoornen van het reukaltaar van de welriekende specerijen, voor het aangezicht van de HEERE, dat in de tent der samenkomst is; dan zal hij al het bloed van de var uitgieten aan de voet van het altaar van het brandoffer, dat bij de deur van de tent der samenkomst is.", "Lev 4:30-35": "Daarna zal de priester van haar bloed met zijn vinger nemen, en doen op de hoornen van het altaar van het brandoffer; dan zal hij al het bloed daarvan aan de voet van dat altaar uitgieten. En al haar vet zal hij wegnemen, zoals het vet van het dankoffer weggenomen wordt, en de priester zal het in rook laten opgaan op het altaar, tot een liefelijke reuk voor de HEERE; en de priester zal voor hem verzoening doen, en het zal hem vergeven worden. Maar als hij een lam als zijn offerande ten zondoffer brengt, zal het een volkomen wijfje zijn, dat hij brengt.", "Lev 2:12-16": "De offers van de eerstelingen zult u de HEERE brengen; maar op het altaar zullen zij niet komen tot een liefelijke reuk. En elk offer van uw spijsoffer zult u met zout zouten, en het zout van het verbond van uw God mag u niet laten ontbreken bij uw spijsoffer; met heel uw offer zult u zout offeren. En als u de HEERE een spijsoffer van de eerste vruchten offert, zult u voor het spijsoffer van uw eerste vruchten groene aren, bij het vuur gedord, offeren, dat is, het klein gebroken graan van volle groene aren.", "Lev 22:29": "En als u een lofoffer aan de HEERE zult slachten, zult u het naar uw wil slachten.", "Neh 10:39": "Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.", "1 Petr 2:22": "Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden;", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Hos 7:4": "Zij plegen allemaal samen overspel, zij zijn als een bakoven, die heet gemaakt is door de bakker; die ophoudt met opstoken nadat hij het deeg heeft gekneed, totdat het doorgezuurd is.", "Ex 23:10": "U zult ook zes jaar uw land bezaaien, en de opbrengst ervan verzamelen;", "Lev 7:9": "Verder zal al het spijsoffer dat in de oven gebakken wordt, met al wat in de ketel en in de pan bereid wordt, voor de priester zijn die dat offert.", "Deut 26:10": "En nu, zie, ik heb de eerstelingen van de vrucht van dit land gebracht, dat U, HEERE, mij gegeven hebt! Dan zult u ze neerzetten voor het aangezicht van de HEERE, uw God, en u buigen voor het aangezicht van de HEERE, uw God;", "Hand 14:22": "en versterkten de harten van de discipelen, en vermaanden hen om te blijven in het geloof, en dat wij door veel verdrukkingen het Koninkrijk van God moeten binnengaan.", "2 Kron 29:34": "Doch van de priesters waren er te weinig, en zij konden niet van al de brandoffers de huid aftrekken; daarom hielpen hun broeders, de Levieten, hen, totdat het werk beëindigd was, en totdat de andere priesters zich geheiligd hadden; want de Levieten waren oprechter van hart om zich te heiligen, dan de priesters.", "1 Kor 5:7": "Zuiver dan de oude zuurdesem weg, opdat u een nieuw deeg mag zijn, zoals u ongezuurd bent. Want ook ons Pascha is voor ons geslacht, namelijk Christus.", "Spr 3:9": "Vereer de HEERE met uw goed, en met de eerstelingen van al uw inkomsten;"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H5315\">Als</span> iemand <span class=\"wl\" data-l=\"L3\" data-code=\"H7126\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7126\">HEERE</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7126\">een</span> offer <span class=\" /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [

    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
