it de oven; het zullen ongezuurde koeken van meelbloem zijn, met olie gemengd, en ongezuurde vladen, met olie bestreken.","5":"En indien uw offer een spijsoffer is, in de pan gebakken, zal het van ongezuurde meelbloem zijn, met olie gemengd.","6":"Breek het in stukken, en giet olie daarop; het is een spijsoffer.","7":"En als uw offer een spijsoffer uit de pan is, zal het van meelbloem met olie gemaakt worden.","8":"Dan zult u dat spijsoffer, dat daarvan gemaakt zal worden, aan de HEERE brengen; en men zal het tot de priester laten naderen, die het naar het altaar zal dragen.","9":"En de priester zal van dat spijsoffer het gedenkoffer daarvan opnemen, en op het altaar aansteken; het is een vuuroffer, tot een liefelijke reuk voor de HEERE.","10":"En wat overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is allerheiligst van de vuuroffers van de HEERE.","11":"Geen spijsoffer, dat u de HEERE zult brengen, zal met desem gemaakt worden; want van geen zuurdesem, en van geen honing zult u de HEERE een vuuroffer aansteken.","12":"De offers van de eerstelingen zult u de HEERE brengen; maar op het altaar zullen zij niet komen tot een liefelijke reuk.","13":"En elk offer van uw spijsoffer zult u met zout zouten, en het zout van het verbond van uw God mag u niet laten ontbreken bij uw spijsoffer; met heel uw offer zult u zout offeren.","14":"En als u de HEERE een spijsoffer van de eerste vruchten offert, zult u voor het spijsoffer van uw eerste vruchten groene aren, bij het vuur gedord, offeren, dat is, het klein gebroken graan van volle groene aren.","15":"En u zult olie daarop doen, en wierook daarop leggen; het is een spijsoffer.","16":"Zo zal de priester het gedenkoffer daarvan aansteken van het klein gebroken graan en van de olie, met alle wierook; het is een vuuroffer voor de HEERE."},"SV":{"1":"Als nu een ziel een offerande van spijsoffer den HEERE zal offeren, zijn offerande zal van meelbloem zijn; en hij zal olie daarop gieten, en wierook daarop leggen.","2":"En hij zal het brengen tot de zonen van Aäron, de priesters, *een* van welke daarvan zijn hand vol grijpen zal uit deszelfs meelbloem, en uit deszelfs olie, met al deszelfs wierook; en de priester zal deszelfs gedenkoffer aansteken op het altaar; het is een vuuroffer, tot een liefelijken reuk den HEERE.","3":"Wat nu overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is een heiligheid der heiligheden van de vuurofferen des HEEREN.","4":"En als gij offeren zult een offerande van spijsoffer, een gebak des ovens; het zullen zijn ongezuurde koeken van meelbloem, met olie gemengd, en ongezuurde vladen, met olie bestreken.","5":"En indien uw offerande spijsoffer is, in de pan *gekookt*, zij zal zijn van ongezuurde meelbloem, met olie gemengd.","6":"Breekt ze in stukken, en giet olie daarop; het is een spijsoffer.","7":"En zo uw offerande een spijsoffer des ketels is, het zal van meelbloem met olie gemaakt worden.","8":"Dan zult gij dat spijsoffer, hetwelk daarvan zal gemaakt worden, den HEERE toebrengen; en men zal het tot den priester doen naderen, die het tot het altaar dragen zal.","9":"En de priester zal van dat spijsoffer deszelfs gedenkoffer opnemen, en op het altaar aansteken, het is een vuuroffer, tot een liefelijken reuk den HEERE.","10":"En wat overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is een heiligheid der heiligheden van de vuurofferen des HEEREN.","11":"Geen spijsoffer, dat gij den HEERE zult offeren, zal met desem gemaakt worden; want van geen zuurdesem, en van geen honig zult gijlieden den HEERE vuuroffer aansteken.","12":"De offeranden der eerstelingen zult gij den HEERE offeren; maar op het altaar zullen zij niet komen tot een liefelijken reuk.","13":"En alle offerande uws spijsoffers zult gij met zout zouten, en het zout des verbonds van uw God van uw spijsoffer niet laten afblijven; met al uw offerande zult gij zout offeren.","14":"En zo gij den HEERE een spijsoffer der eerste vruchten offert, zult gij het spijsoffer uwer eerste vruchten van groene aren, bij het vuur gedord, dat is, het klein gebroken graan van volle groene aren, offeren.","15":"En gij zult olie daarop doen, en wierook daarop leggen; het is een spijsoffer.","16":"Zo zal de priester deszelfs gedenkoffer aansteken van zijn klein gebroken graan en van zijn olie, met al den wierook; het is een vuuroffer den HEERE."},"KJV":{"1":"And when any will offer a meat offering unto the LORD, his offering shall be *of* fine flour; and he shall pour oil upon it, and put frankincense","2":"And he shall bring it to Aaron's sons the priests: and he shall take thereout his handful of the flour thereof, and of the oil thereof, with all the frankincense thereof; and the priest shall burn the memorial of it upon the altar, *to be* an offering made by fire, of a sweet savour unto the LORD:","3":"And the remnant of the meat offering *shall be* Aaron's and his sons': *it is* a thing most holy of the offerings of the LORD made by fire.","4":"And if thou bring an oblation of a meat offering baken in the oven, *it shall be* unleavened cakes of fine flour mingled with oil, or unleavened wafers anointed with oil.","5":"And if thy oblation *be* a meat offering *baken* in a pan, it shall be *of* fine flour unleavened, mingled with oil.","6":"Thou shalt part it in pieces, and pour oil thereon: it *is* a meat offering.","7":"And if thy oblation *be* a meat offering *baken* in the fryingpan, it shall be made *of* fine flour with oil.","8":"And thou shalt bring the meat offering that is made of these things unto the LORD: and when it is presented unto the priest, he shall bring it unto the altar.","9":"And the priest shall take from the meat offering a memorial thereof, and shall burn *it* upon the altar: *it is* an offering made by fire, of a sweet savour unto the LORD.","10":"And that which is left of the meat offering *shall be* Aaron's and his sons': *it is* a thing most holy of the offerings of the LORD made by fire.","11":"No meat offering, which ye shall bring unto the LORD, shall be made with leaven: for ye shall burn no leaven, nor any honey, in any offering of the LORD made by fire.","12":"As for the oblation of the firstfruits, ye shall offer them unto the LORD: but they shall not be burnt on the altar for a sweet savour.","13":"And every oblation of thy meat offering shalt thou season with salt; neither shalt thou suffer the salt of the covenant of thy God to be lacking from thy meat offering: with all thine offerings thou shalt offer salt.","14":"And if thou offer a meat offering of thy firstfruits unto the LORD, thou shalt offer for the meat offering of thy firstfruits green ears of corn dried by the fire, *even* corn beaten out of full ears.","15":"And thou shalt put oil upon it, and lay frankincense thereon: it *is* a meat offering.","16":"And the priest shall burn the memorial of it, *part* of the beaten corn thereof, and *part* of the oil thereof, with all the frankincense thereof: *it is* an offering made by fire unto the LORD."}},"tsk":{"1":[{"kopje":"spijsoffer","refs":["Lev 6:14-18","Lev 6:20-23","Lev 9:17","Num 15:4-21","Jes 66:20","Joh 6:35"]},{"kopje":"meelbloem","refs":["Ex 29:2","Num 7:13","Num 7:19","Joël 1:9","Joël 2:14"]},{"kopje":"olie daarop gieten","refs":["Lev 2:4-8","Lev 2:15","Lev 2:16","Lev 7:10-12","1 Joh 2:20","1 Joh 2:27","Judas 1:20"]},{"kopje":"wierook","refs":["Mal 1:11","Luk 1:9","Luk 1:10","Openb 8:3"]}],"2":[{"kopje":"het gedenkoffer","refs":["Lev 2:9","Lev 5:12","Lev 6:15","Lev 24:7","Ex 30:16","Num 5:18","Neh 13:14","Neh 13:22","Jes 66:3","Hand 10:4"]}],"3":[{"kopje":"overblijft","refs":["Lev 6:16","Lev 6:17","Lev 6:26","Lev 7:9","Lev 10:12","Lev 10:13","Lev 21:22","Num 18:9","1 Sam 2:28"]},{"kopje":"allerheiligst","refs":["Lev 6:17","Lev 10:12","Lev 21:22","Ex 29:37","Num 18:9"]}],"4":[{"kopje":"spijsoffer","refs":["1 Kron 23:28","1 Kron 23:29","Ps 22:15","Ezech 46:20","Matt 26:38","Joh 12:27"]},{"kopje":"de oven","refs":["Lev 1:11","Lev 6:17 ,","tekst":"Te weten, spijsoffer."},{"catchword":"hand vol grijpen zal","tekst":"Hebreeuws, de volheid zijner vuist vuisten. Alzo onder, Lev 5:12."},{"catchword":"deszelfs meelbloem,","tekst":"Versta, des spijsoffers meelbloem. Dat is, meelbloem tot het spijsoffer behorende."},{"catchword":"met al deszelfs wierook;","tekst":"Of, boven. Alzo onder, Lev 3:4, Lev 3:10, en Lev 4:9, enz. Dat is, samen met al den wierook des spijsoffers."},{"catchword":"deszelfs gedenkoffer aansteken op het altaar;","tekst":"Een reukwerk, zo genoemd, omdat het God indachtig maakte [menselijker wijze gesproken] de beloften, die Hij den vromen Israëlieten gegeven had, en de gebeden, die zij tot hem deden; welke bij een reukwerk dat opklimt vergeleken worden; Psa 141:2; Act 10:4; Rev 8:3-4."}],"3":[{"catchword":"een heiligheid der heiligheden","tekst":"Dat is, een zeer heilig ding, of van zeer grote en voortreffelijke heiligheid. Alzo Exo 30:36, en onder, vs.10, en Lev 24:9, enz. Het is een manier van spreken, betekenende de vergroting en de verheffing desgenen, van wien gesproken wordt. Alzo wordt God genoemd de God der Goden, en de Heere der heren; Psa 136:2-3. Het lied van Salomo, het lied der liederen, Son 1:1. Vergelijk de aantekeningen Gen 9:25."}],"4":[{"catchword":"ongezuurde koeken van meelbloem,","tekst":"Hebreeuws, koeken der ongezuurdheden; en alzo in het volgende."},{"catchword":"en ongezuurde","tekst":"Anders, of."},{"catchword":"vladen,","tekst":"Of, pannekoeken, of taarten."}],"7":[{"catchword":"des ketels is,","tekst":"Anders, pan; dat is van hetgeen wat in den ketel gezoden of in de pan gebakken is."}],"9":[{"catchword":"deszelfs gedenkoffer opnemen,","tekst":"Zie boven, vs.2."},{"catchword":"tot een liefelijken reuk den HEERE","tekst":"Zie Gen 8:21, en boven, Lev 1:9."}],"10":[{"catchword":"heiligheid der heiligheden","tekst":"Zie boven, vs.3."}],"11":[{"catchword":"zuurdesem,","tekst":"Versta dit van de vrijwillige offeranden. Want in de dankoffers geldt deze wet niet, onder Lev 7:13, noch in de offeranden der eerstelingen, onder, Lev 23:17, en hier in het volgende vs."},{"catchword":"honig","tekst":"De honig werd met den zuurdesem verboden, omdat hij niettegenstaande zijne zoetigheid, den aard heeft het deeg, waarmede hij vermengd is, te verzuren en te doen rijzen."}],"12":[{"catchword":"De offeranden der eerstelingen","tekst":"Zie onder, Lev 23:17."},{"catchword":"offeren;","tekst":"Te weten, gedesemd of met honig vermengd."}],"13":[{"catchword":"het zout des verbonds","tekst":"Dat is, dat u vermane van mijn verbond, waardoor gij verplicht zijt naar een onbesmettelijk en onverderfelijk leven te trachten; Mar 9:49."},{"catchword":"afblijven;","tekst":"Hebreeuws, doen ophouden."}],"14":[{"catchword":"gedord,","tekst":"Of, gezengd, geschroeid."}],"16":[{"catchword":"gedenkoffer","tekst":"Zie boven, vs.2."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now when a soul [i.e. any man, or person, (homo) as the word man is used, above chap. 1. 2. See Gen. 12. On verse 5.] will offer a sacrifice of meat-offering [i.e. such a one as consisted of meat, or meal-flower, appertaining in part to the Priest, and the rest being burnt with frankincense; See the following verses] unto the LORD, his offering shall be meal-flower: [i.e. searched or sifted meal, or the finest flower of it] and he shall pour oil upon it, and lay frankincense upon it."}],"2":[{"catchword":null,"tekst":"And he shall bring the same [viz. meat-offering ] unto the sons of Aaron the Priests (one) of whom shall take up a handful [Heb. The fullness of his fist, or fists] out of the same meal-flower belonging to the meat-offering] and out of the same oil, with all the frankincense thereof: [or, above all, etc. as also below, chap. 3. Verse 4. 10. And chap. 4. 9, & c. i.e. together with all the frankincense of the meat-offering [an incense so called, as putting God in mind (to speak after the manner of men) of the promises made unto the godly Israelites, and of the prayers which they put up to him, which are compared to an incense mounting up, Psalm 141. 2. Acts 10. 4. Rev. 8. 3, 4.] upon the altar: it is a fire-offering, (for) a pleasant smell to the LORD."}],"3":[{"catchword":null,"tekst":"That now which remaineth over of the meat-offering, shall be Aarons and his sons: it is a Holiness of Holinesses [i.e. a most holy thing, or of singular and extraordinary holiness. So also Exod. 30. 36. And below chap. 10. 17. And 24. 9. & c. it is kind of expression, showing the eminency or excellency of the thing or person spoken of; Thus God is called the God of Gods, and the Lord of Lords, Psalm 136. 2, 3. The Canticles, or Song of Solomon is called the Song of Songs, Cant. 1. Compare the Annotations on Gen. 9. Verse 25] of the fire-offering of the LORD."}],"4":[{"catchword":null,"tekst":"And when thou wilt offer a sacrifice of meat-offering, a batch of the oven; they shall be unleavened cakes [Heb. Cakes of unleavened nesses, and so in the sequel] of flower mixt with oil, and [oth. Or] unleavened wafers, [or, pancakes, or tarts] stroked over (or anointed) with oil."}],"5":[{"catchword":null,"tekst":"And if thy meat-offering be (dressed) in the pan, it shall be of unleavened flour mixed with oil."}],"6":[{"catchword":null,"tekst":"Break it in pieces, and pour oil upon it: it is a meat-offering."}],"7":[{"catchword":null,"tekst":"And if thy sacrifice be a meat-offering of the Kettle [Oth. Pan; i.e. such as is either boiled in the kettle, or fried in the pan] it shall be made of meal-flower with oil."}],"8":[{"catchword":null,"tekst":"Then thou shalt bring near unto the LORD that meat-offering, which shall be made thereof: and they shall make it come near unto the Priest, that shall carry it to the altar."}],"9":[{"catchword":null,"tekst":"And the Priest shall take up of that meat-meat, the remembrance-offering of the same, [See above on verse 2.] and kindle (it) upon the altar: it is a fire offering (for) a pleasant smell unto the Lord. [See Gen. 8. 21. And above 1. On verse 9.]"}],"10":[{"catchword":null,"tekst":"And the remainder of the meat-offering, shall be Aarons and his sons: it is a Holiness of Holinesses [See above on verse 3.] of the fire-offerings of the LORD."}],"11":[{"catchword":null,"tekst":"No meat-offering that thou shalt offer to the LORD shall be made with leaven: for no leaven, and of no honey shall ye kindle (a) fire-offering to the LORD. [Understand this of the free-will-offerings or sacrifices; for in the thank-offerings this was not observed: below chap. 7. 13. Nor in the oblations of the first fruits, or firstlings; below chap. 23. 17. And here in the next verse. The Honey is likewise forbidden here as well as the leaven, because that notwithstanding the sweetness thereof, it hath that quality, that it will make the dough or paste it is mixed with, to become sowre, and to rise, or be puffy.]"}],"12":[{"catchword":null,"tekst":"The sacrifice of the firstlings, [See below chap. 23. 17.] them ye shall offer to the LORD; [viz. leavened and mixt honey] but they shall not come upon the altar, for a pleasant smell."}],"14":[{"catchword":null,"tekst":"And if thou offer to the LORD a meat-offering of the first-fruits, thou shalt offer the meat-offering of thy first-fruits, of green ears dried [or, singed, scorched] by the fire, that is, the small broken grain of full green ears."}],"15":[{"catchword":null,"tekst":"And thou shall put oil upon it, and lay frankincense thereon: it is a meat-offering."}],"16":[{"catchword":null,"tekst":"Then shall the Priest kindle the remembrance-of-offering of it, [See above on verse 2.] of its small broken grain, and of its oil with all the frankincense: it is a fire-offering to the LORD."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
