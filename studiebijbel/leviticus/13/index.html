ohannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Verder sprak de HEERE tot Mozes en tot Aäron, en Hij zei:","2":"Een mens, als er in het vel van zijn vlees een gezwel, of gezweer, of witte blaar zal zijn, welke in het vel van zijn vlees tot een plaag van de melaatsheid zou worden, hij zal dan naar de priester Aäron, of naar een van zijn zonen, de priesters, gebracht worden.","3":"En de priester zal de plaag in het vel van het vlees bekijken; als het haar in die plaag *in* wit veranderd is, en het aanzien van de plaag dieper is dan het vel van zijn vlees, is het de plaag van de melaatsheid; als de priester hem bekeken zal hebben, zal hij hem onrein verklaren.","4":"Maar als de blaar in het vel van zijn vlees wit is, en haar aanzien niet dieper is dan het vel, en het haar niet *in* wit veranderd is, zal de priester hem, die de plaag heeft, zeven dagen opsluiten.","5":"Daarna zal de priester op de zevende dag hem bekijken; indien, zie, de plaag, voor zover hij kan zien, gelijk gebleven is, *en* de plaag in het vel niet uitgespreid is, zal de priester hem zeven andere dagen opsluiten.","6":"En de priester zal hem opnieuw op de zevende dag bekijken; indien, zie, de plaag ingetrokken is, en de plaag in het vel niet uitgespreid is, zal de priester hem rein verklaren; het was een verzwering; en hij zal zijn kleren wassen, zo is hij rein.","7":"Maar als de verzwering in het vel helemaal uitgespreid is, nadat hij aan de priester tot zijn reiniging vertoond is, zal hij opnieuw aan de priester vertoond worden.","8":"Indien de priester zal merken, dat, zie, de verzwering in het vel uitgespreid is, zal de priester hem onrein verklaren; het is melaatsheid.","9":"Wanneer de plaag van de melaatsheid in een mens zal zijn, zal hij naar de priester gebracht worden.","10":"Indien de priester zal merken, dat, zie, een wit gezwel in het vel is, dat het haar in wit veranderd heeft, en gezond, levend vlees in dat gezwel is;","11":"Dat is een verouderde melaatsheid in het vel van zijn vlees; daarom zal de priester hem onrein verklaren; hij zal hem niet laten opsluiten, want hij is onrein.","12":"En als de melaatsheid in het vel helemaal uitbot, en de melaatsheid het hele vel van hem die de plaag heeft, van zijn hoofd tot zijn voeten, bedekt heeft, overal waar de priester kijkt;","13":"En de priester zal merken, dat, zie, de melaatsheid zijn hele vlees bedekt heeft, zal hij hem, die de plaag heeft, rein verklaren; het is geheel in wit veranderd; hij is rein.","14":"Maar op de dag dat levend vlees daarin gezien zal worden, zal hij onrein zijn.","15":"Als dan de priester dat levende vlees gezien zal hebben, zal hij hem onrein verklaren; dat levende vlees is onrein; het is melaatsheid.","16":"Of als dat levende vlees weer verandert, en in wit veranderd zal worden, zal hij naar de priester komen.","17":"Als de priester hem bekeken zal hebben, dat, zie, de plaag in wit veranderd is, zal de priester hem, die de plaag heeft, rein verklaren; hij is rein.","18":"Het vlees ook, als er in zijn vel een zweer geweest is, en die genezen is;","19":"En op de plaats van die zweer een wit gezwel, of een witte, roodachtige blaar worden zal, zal het aan de priester vertoond worden.","20":"Indien de priester zal merken, dat, zie, het aanzien lager is dan het vel, en het haar ervan in wit veranderd is, zal de priester hem onrein verklaren; het is de plaag van de melaatsheid, zij is door de zweer uitgebot.","21":"Wanneer nu de priester die bekeken zal hebben, dat, zie, er geen wit haar op is, en het niet lager is dan het vel, maar ingetrokken is, zal de priester hem zeven dagen opsluiten.","22":"Als zij daarna helemaal in het vel uitgespreid zal zijn, zal de priester hem onrein verklaren; het is de plaag.","23":"Maar indien de blaar op haar plaats blijft staan, niet uitgespreid is, is het de roof van die zweer, en zal de priester hem rein verklaren.","24":"Of wanneer er in het vel van het vlees een vurige brand geweest zal zijn, en het gezonde deel van die brand een witte, roodachtige of witte blaar is;","25":"En de priester die gezien zal hebben, dat, zie, het haar op de blaar in wit veranderd is, en haar aanzien dieper is dan het vel; is het melaatsheid, door de brand is zij uitgebot; daarom zal de priester hem onrein verklaren; het is de plaag van de melaatsheid.","26":"Maar indien de priester zal merken, dat, zie, op de blaar geen wit haar is, en het niet lager is dan het vel, maar ingetrokken is, zal de priester hem zeven dagen opsluiten.","27":"Daarna zal de priester hem op de zevende dag bekijken; indien zij helemaal uitgespreid is in het vel, zal de priester hem onrein verklaren; het is de plaag van de melaatsheid.","28":"Maar indien de blaar op haar plaats blijft staan, niet in het vel uitgespreid, maar ingetrokken zal zijn, is het een gezwel van de brand; daarom zal de priester hem rein verklaren, want het is de roof van de brand.","29":"Verder, als er in een man of vrouw een plaag zal zijn in het hoofd, of in de baard;","30":"En de priester de plaag bekeken zal hebben, dat, zie, haar aanzien dieper is dan het vel, en geelachtig, dun haar erop is, zal de priester hem onrein verklaren; het is schurftheid, het is melaatsheid van het hoofd of van de baard.","31":"Maar als de priester de plaag van de schurftheid bekeken zal hebben, dat, zie, haar aanzien niet dieper is dan het vel, en er geen zwart haar op is, zal de priester hem, die de plaag van de schurftheid heeft, zeven dagen laten opsluiten.","32":"Daarna zal de priester die plaag op de zevende dag bekijken; indien, zie, de schurftheid niet uitgespreid is, en er geen geelachtig haar op is, en het aanzien van de schurftheid niet dieper is dan het vel;","33":"Zal hij zich laten scheren; maar de schurftheid zal hij niet scheren; en de priester zal hem, die de schurftheid heeft, opnieuw zeven dagen laten opsluiten.","34":"Daarna zal de priester die schurftheid op de zevende dag bekijken; indien, zie, de schurftheid in het vel niet uitgespreid is, en haar aanzien niet dieper is dan het vel, zal de priester hem rein verklaren; en hij zal zijn kleren wassen, en rein zijn.","35":"Maar indien de schurftheid in het vel helemaal uitgespreid is, na zijn reiniging;","36":"En de priester hem bekeken zal hebben, dat, zie, de schurftheid in het vel uitgespreid is, zal de priester niet naar het geelachtige haar zoeken; hij is onrein.","37":"Maar indien die schurftheid, voor zover hij kan zien, gelijk gebleven is, en zwart haar erop gegroeid is, is die schurftheid genezen, is hij rein; daarom zal de priester hem rein verklaren.","38":"Verder, als een man, of vrouw, op het vel van hun vlees blaren zullen hebben, witte blaren;","39":"En de priester gemerkt zal hebben, dat, zie, ingetrokken witte blaren in het vel van hun vlees zijn; het is een witte puist die in het vel is uitgebot, hij is rein.","40":"En als een man zijn hoofdhaar uitgevallen zal zijn, is hij kaal, hij is rein.","41":"En als aan de zijkant van zijn gezicht het haar van zijn hoofd uitgevallen zal zijn, is hij bles, hij is rein.","42":"Maar als er in de kaalheid, of in de blesse, een witte, roodachtige plaag is, is dat melaatsheid, uitbottend in zijn kaalheid, of in zijn blesse.","43":"Als de priester hem bekeken zal hebben, dat, zie, het gezwel van die plaag in zijn kaalheid, of blesse, wit-roodachtig is, gelijk het aanzien van de melaatsheid van het vel van het vlees;","44":"Is die man melaats, hij is onrein; de priester zal hem helemaal onrein verklaren, zijn plaag is op zijn hoofd.","45":"Verder zullen de kleren van de melaatse, in wie die plaag is, gescheurd zijn, en zijn hoofd zal onbedekt zijn, en hij zal zijn bovenlip bedekken; daarbij zal hij roepen: Onrein, onrein!","46":"Al de dagen waarin deze plaag in hem zal zijn, zal hij onrein zijn; onrein is hij, hij zal alleen wonen; buiten het leger zal zijn woning zijn.","47":"Verder, als er op een kleed de plaag van de melaatsheid zal zijn, op een wollen kleed, of op een linnen kleed,","48":"Of op de scheerdraad, of op de inslag van linnen, of van wol, of op vel, of op enig vellenwerk;","49":"En die plaag op het kleed, of op het vel, of op de scheerdraad, of op de inslag, of op enig vellentuig, groenachtig of roodachtig is; het is de plaag van de melaatsheid; daarom zal het aan de priester vertoond worden.","50":"En de priester zal de plaag bekijken; en hij zal wat de plaag heeft, zeven dagen laten opsluiten.","51":"Daarna zal hij op de zevende dag de plaag bekijken; als de plaag uitgespreid is op het kleed, of op de scheerdraad, of op de inslag, of op het vel, tot welk werk dat vel ook gemaakt mocht zijn, is die plaag een knagende melaatsheid, het is onrein.","52":"Daarom zal hij dat kleed, of die scheerdraad, of die inslag van wol, of van linnen, of alle vellentuig, waarin die plaag zal zijn, verbranden; want het is een knagende melaatsheid; het zal met vuur verbrand worden.","53":"Doch indien de priester zal zien, dat, zie, de plaag op het kleed, of op de scheerdraad, of op de inslag, of op enig vellentuig niet uitgespreid is;","54":"Zal de priester gebieden, dat men wast wat de plaag erop heeft, en hij zal het opnieuw zeven dagen laten opsluiten.","55":"Als de priester, nadat het gewassen is, de plaag bekeken zal hebben, dat, zie, de plaag haar kleur niet veranderd heeft, en de plaag niet uitgespreid is, is het onrein, u zult het met vuur verbranden; het is een ingevreten plek aan de achterkant of aan de voorkant.","56":"Indien nu de priester zal merken, dat, zie, die plaag, nadat zij gewassen zal zijn, ingetrokken is; dan zal hij ze van het kleed, of van het vel, of van de scheerdraad, of van de inslag afscheuren.","57":"Maar als zij nog op het kleed, of op de scheerdraad, of op de inslag, of op enig vellentuig gezien wordt, is het uitbottende *melaatsheid*; u zult hetgeen waarop de plaag is, met vuur verbranden.","58":"Maar het kleed, of de scheerdraad, of de inslag, of alle vellentuig, dat u gewassen zult hebben, als de plaag daarvan geweken zal zijn, zal opnieuw gewassen worden, en het zal rein zijn.","59":"Dit is de wet van de plaag van de melaatsheid, van een wollen of linnen kleed, of een scheerdraad, of een inslag, of alle vellentuig, om dat rein te verklaren, of onrein te verklaren."},"SV":{"1":"Verder sprak de HEERE tot Mozes en tot Aäron, zeggende:","2":"Een mens, als in het vel zijns vleses een gezwel, of gezweer, of witte blaar zal zijn, welke in het vel zijns vleses tot een plaag der melaatsheid zou worden, hij zal dan tot den priester Aäron, of tot een uit zijn zonen, de priesteren, gebracht worden.","3":"En de priester zal de plaag in het vel des vleses bezien; zo het haar in die plaag *in* wit veranderd is, en het aanzien der plaag dieper is dan het vel zijns vleses, het is de plaag der melaatsheid; als de priester hem bezien zal hebben, dan zal hij hem onrein verklaren.","4":"Maar zo de blaar in het vel zijn vleses wit is, en haar aanzien niet dieper is dan het vel, en het haar niet *in* wit veranderd is, zo zal de priester hem, die de plaag heeft, zeven dagen opsluiten.","5":"Daarna zal de priester op den zevenden dag hem bezien; indien, ziet, de plaag, naar dat hij zien kan, is staande gebleven, *en* de plaag in het vel niet uitgespreid is, zo zal de priester hem zeven andere dagen opsluiten.","6":"En de priester zal hem andermaal op den zevenden dag bezien; indien, ziet, de plaag ingetrokken, en de plaag in het vel niet uitgespreid is, zo zal de priester hem rein verklaren; het was een verzwering; en hij zal zijn klederen wassen, zo is hij rein.","7":"Maar zo de verzwering in het vel ganselijk uitgespreid is, nadat hij aan den priester tot zijn reiniging zal vertoond zijn, zo zal hij andermaal aan den priester vertoond worden.","8":"Indien de priester merken zal, dat, ziet, de verzwering in het vel uitgespreid is, zo zal de priester hem onrein verklaren; het is melaatsheid.","9":"Wanneer de plaag der melaatsheid in een mens zal zijn, zo zal hij tot den priester gebracht worden.","10":"Indien de priester merken zal, dat, ziet, een wit gezwel in het vel is, hetwelk het haar in wit veranderd heeft, en gezondheid van levend vlees in dat gezwel is;","11":"Dat is een verouderde melaatsheid in het vel zijns vleses; daarom zal hem de priester onrein verklaren; hij zal hem niet doen opsluiten, want hij is onrein.","12":"En zo de melaatsheid in het vel ganselijk uitbot, en de melaatsheid het gehele vel desgenen, die de plaag heeft, van zijn hoofd tot zijn voeten, bedekt heeft, naar al het gezicht van de ogen des priesters;","13":"En de priester merken zal, dat, ziet, de melaatsheid zijn gehele vlees bedekt heeft, zo zal hij hem, die de plaag heeft, rein verklaren; zij is geheel in wit veranderd; hij is rein.","14":"Maar ten welken dage levend vlees daarin gezien zal worden, zal hij onrein zijn.","15":"Als dan de priester dat levende vlees gezien zal hebben, zal hij hem onrein verklaren; dat levende vlees is onrein; het is melaatsheid.","16":"Of als dat levende vlees verkeert, en in wit veranderd zal worden, zo zal hij tot den priester komen.","17":"Als de priester hem bezien zal hebben, dat, ziet, de plaag in wit veranderd is, zo zal de priester hem, die de plaag heeft, rein verklaren; hij is rein.","18":"Het vlees ook, als in deszelfs vel een zweer zal geweest zijn, zo het genezen is;","19":"En in de plaats van die zweer een wit gezwel, of een witte roodachtige blaar worden zal, zo zal het aan den priester vertoond worden.","20":"Indien de priester merken zal, dat, ziet, haar aanzien lager is dan het vel, en derzelver haar in wit veranderd is, zo zal de priester hem onrein verklaren; het is de plaag der melaatsheid, zij is door de zweer uitgebot.","21":"Wanneer nu de priester die bezien zal hebben, dat, ziet, geen wit haar daaraan is, en die niet lager dan het vel, maar ingetrokken is, zo zal de priester hem zeven dagen opsluiten.","22":"Zo zij daarna gans in het vel uitgespreid zal zijn, zo zal de priester hem onrein verklaren; het is de plaag.","23":"Maar indien de blaar in haar plaats zal staande blijven, niet uitgespreid zijnde, het is de roof van die zweer, zo zal de priester hem rein verklaren;","24":"Of wanneer in het vel des vleses een vurige brand zal geweest zijn, en het gezonde van dien brand een witte roodachtige of witte blaar is;","25":"En de priester die gezien zal hebben, dat, ziet, het haar op de blaar in wit veranderd is, en haar aanzien dieper is dan het vel; het is melaatsheid, door den brand is zij uitgebot; daarom zal hem de priester onrein verklaren; het is de plaag der melaatsheid.","26":"Maar indien de priester die merken zal, dat, ziet, op de blaar geen wit haar is, en zij niet lager dan het vel, maar ingetrokken is, zo zal de priester hem zeven dagen opsluiten.","27":"Daarna zal de priester hem op den zevenden dag bezien; indien zij gans uitgespreid is in het vel, zo zal de priester hem onrein verklaren; het is de plaag der melaatsheid.","28":"Maar indien de blaar in haar plaats staande zal blijven, noch in het vel uitgespreid, maar ingetrokken zal zijn, het is een gezwel van den brand; daarom zal de priester hem rein verklaren, want het is de roof van den brand.","29":"Verder, als in een man of vrouw een plaag zal zijn in het hoofd, of in den baard;","30":"En de priester de plaag zal bezien hebben, dat, ziet, haar aanzien dieper is dan het vel, en geelachtig dun haar daarop is, zo zal de priester hem onrein verklaren; het is schurftheid, het is melaatsheid van het hoofd of van den baard.","31":"Maar als de priester de plaag der schurftheid zal bezien hebben, dat, ziet, haar aanzien niet dieper is dan het vel, en geen zwart haar daarop is, zo zal de priester hem, die de plaag der schurftheid heeft, zeven dagen doen opsluiten.","32":"Daarna zal de priester die plaag op den zevenden dag bezien; indien, ziet, de schurftheid niet uitgespreid, en daarop geen geelachtig haar is, noch het aanzien der schurftheid dieper dan het vel is;","33":"Zo zal hij zich scheren laten; maar de schurftheid zal hij niet scheren; en de priester zal hem, die de schurftheid heeft, andermaal zeven dagen doen opsluiten.","34":"Daarna zal de priester die schurftheid op den zevenden dag bezien; indien, ziet, de schurftheid in het vel niet uitgespreid is, en haar aanzien niet dieper is dan het vel, zo zal de priester hem rein verklaren; en hij zal zijn klederen wassen, en rein zijn.","35":"Maar indien de schurftheid in het vel gans uitgespreid is, na zijn reiniging;","36":"En de priester hem zal bezien hebben, dat, ziet, de schurftheid in het vel uitgespreid is, de priester zal naar het geelachtig haar niet zoeken; hij is onrein.","37":"Maar indien die schurftheid, naar dat hij zien kan, is staande gebleven, en zwart haar daarop gewassen is, die schurftheid is genezen, hij is rein; daarom zal de priester hem rein verklaren.","38":"Verder als een man, of vrouw, aan het vel van hun vlees blaren zullen hebben, witte blaren;","39":"En de priester zal gemerkt hebben, dat, ziet, ingetrokken witte blaren in het vel van hun vlees zijn; het is een witte puist in het vel uitgebot, hij is rein.","40":"En als een man zijn hoofdhaar zal uitgevallen zijn, hij is kaal, hij is rein.","41":"En zo van de zijde zijns aangezichts het haar van zijn hoofd zal uitgevallen zijn, hij is bles, hij is rein.","42":"Maar zo in de kaalheid, of in de blesse, een witte roodachtige plaag is, dat is melaatsheid, uitbottende in zijn kaalheid, of in zijn blesse.","43":"Als de priester hem zal bezien hebben, dat, ziet, het gezwel van die plaag in zijn kaalheid, of blesse, wit roodachtig is, gelijk het aanzien der melaatsheid van het vel des vleses;","44":"Die man is melaats, hij is onrein; de priester zal hem ganselijk onrein verklaren, zijn plaag is op zijn hoofd.","45":"Voorts zullen de klederen des melaatsen, in wien die plaag is, gescheurd zijn, en zijn hoofd zal ontbloot zijn, en hij zal de bovenste lip bewimpelen; daartoe zal hij roepen: Onrein, onrein!","46":"Al de dagen, in welke deze plaag aan hem zal zijn, zal hij onrein zijn; onrein is hij, hij zal alleen wonen; buiten het leger zal zijn woning wezen.","47":"Verder als aan een kleed de plaag der melaatsheid zal zijn, aan een wollen kleed, of aan een linnen kleed,","48":"Of aan den scheerdraad, of aan den inslag van linnen, of van wol, of aan vel, of aan enig vellenwerk;","49":"En die plaag aan het kleed, of aan het vel, of aan den scheerdraad, of aan den inslag, of aan enig vellentuig, groenachtig of roodachtig is; het is de plaag der melaatsheid; daarom zal zij den priester vertoond worden.","50":"En de priester zal de plaag bezien; en hij zal hetgeen de plaag heeft, zeven dagen doen opsluiten.","51":"Daarna zal hij op den zevenden dag de plaag bezien; zo de plaag uitgespreid is aan het kleed, of aan den scheerdraad, of aan den inslag, of aan het vel, tot wat werk dat vel zou mogen gemaakt zijn, die plaag is een knagende melaatsheid, het is onrein.","52":"Daarom zal hij dat kleed, of die werpte, of dien inslag van wol, of van linnen, of alle vellentuig, waarin die plaag zal zijn, verbranden; want het is een knagende melaatsheid; het zal met vuur verbrand worden.","53":"Doch indien de priester zal zien, dat, ziet, de plaag aan het kleed, of aan den scheerdraad, of aan den inslag, of aan enig vellentuig niet uitgespreid is;","54":"Zo zal de priester gebieden, dat men hetgeen, waaraan die plaag is, wasse, en hij zal dat andermaal zeven dagen doen opsluiten.","55":"Als de priester, nadat het gewassen is, de plaag zal bezien hebben, dat, ziet, de plaag haar gedaante niet veranderd heeft, en de plaag niet uitgespreid is, het is onrein, gij zult het met vuur verbranden; het is een ingraving aan zijn achterste of aan zijn voorste zijde.","56":"Indien nu de priester merken zal, dat, ziet, die plaag, nadat zij zal gewassen zijn, ingetrokken is; dan zal hij ze van het kleed, of van het vel, of van den scheerdraad, of van den inslag afscheuren.","57":"Maar zo zij nog aan het kleed, of aan den scheerdraad, of aan den inslag, of aan enig vellentuig, gezien wordt, het is uitbottende *melaatsheid*; gij zult hetgeen, waaraan de plaag is, met vuur verbranden.","58":"Maar het kleed, of de werpte, of de inslag, of alle vellentuig, dat gij gewassen zult hebben, als de plaag daarvan geweken zal zijn, dat zal andermaal gewassen worden, en het zal rein zijn.","59":"Dit is de wet van de plaag der melaatsheid, van een wollen of linnen kleed, of een werpte, of een inslag, of alle vellentuig, om dat rein te verklaren, of onrein te verklaren."},"KJV":{"1":"And the LORD spake unto Moses and Aaron, saying,","2":"When a man shall have in the skin of his flesh a rising, a scab, or bright spot, and it be in the skin of his flesh *like* the plague of leprosy; then he shall be brought unto Aaron the priest, or unto one of his sons the priests:","3":"And the priest shall look on the plague in the skin of the flesh: and *when* the hair in the plague is turned white, and the plague in sight *be* deeper than the skin of his flesh, it *is* a plague of leprosy: and the priest shall look on him, and pronounce him unclean.","4":"If the bright spot *be* white in the skin of his flesh, and in sight *be* not deeper than the skin, and the hair thereof be not turned white; then the priest shall shut up *him that hath* the plague seven days:","5":"And the priest shall look on him the seventh day: and, behold, *if* the plague in his sight be at a stay, *and* the plague spread not in the skin; then the priest shall shut him up seven days more:","6":"And the priest shall look on him again the seventh day: and, behold, *if* the plague *be* somewhat dark, *and* the plague spread not in the skin, the priest shall pronounce him clean: it *is but* a scab: and he shall wash his clothes, and be clean.","7":"But if the scab spread much abroad in the skin, after that he hath been seen of the priest for his cleansing, he shall be seen of the priest again:","8":"And *if* the priest see that, behold, the scab spreadeth in the skin, then the priest shall pronounce him unclean: it *is* a leprosy.","9":"When the plague of leprosy is in a man, then he shall be brought unto the priest;","10":"And the priest shall see *him*: and, behold, *if* the rising *be* white in the skin, and it have turned the hair white, and *there be* quick raw flesh in the rising;","11":"It *is* an old leprosy in the skin of his flesh, and the priest shall pronounce him unclean, and shall not shut him up: for he *is* unclean.","12":"And if a leprosy break out abroad in the skin, and the leprosy cover all the skin of *him that hath* the plague from his head even to his foot, wheresoever the priest looketh;","13":"Then the priest shall consider: and, behold, *if* the leprosy have covered all his flesh, he shall pronounce *him* clean *that hath* the plague: it is all turned white: he *is* clean.","14":"But when raw flesh appeareth in him, he shall be unclean.","15":"And the priest shall see the raw flesh, and pronounce him to be unclean: *for* the raw flesh *is* unclean: it *is* a leprosy.","16":"Or if the raw flesh turn again, and be changed unto white, he shall come unto the priest;","17":"And the priest shall see him: and, behold, *if* the plague be turned into white; then the priest shall pronounce *him* clean *that hath* the plague: he *is* clean.","18":"The flesh also, in which, *even* in the skin thereof, was a boil, and is healed,","19":"And in the place of the boil there be a white rising, or a bright spot, white, and somewhat reddish, and it be shewed to the priest;","20":"And if, when the priest seeth it, behold, it *be* in sight lower than the skin, and the hair thereof be turned white; the priest shall pronounce him unclean: it *is* a plague of leprosy broken out of the boil.","21":"But if the priest look on it, and, behold, *there be* no white hairs therein, and *if* it *be* not lower than the skin, but *be* somewhat dark; then the priest shall shut him up seven days:","22":"And if it spread much abroad in the skin, then the priest shall pronounce him unclean: it *is* a plague.","23":"But if the bright spot stay in his place, *and* spread not, it *is* a burning boil; and the priest shall pronounce him clean.","24":"Or if there be *any* flesh, in the skin whereof *there is* a hot burning, and the quick *flesh* that burneth have a white bright spot, somewhat reddish, or white;","25":"Then the priest shall look upon it: and, behold, *if* the hair in the bright spot be turned white, and it *be in* sight deeper than the skin; it *is* a leprosy broken out of the burning: wherefore the priest shall pronounce him unclean: it *is* the plague of leprosy.","26":"But if the priest look on it, and, behold, *there be* no white hair in the bright spot, and it *be* no lower than the *other* skin, but *be* somewhat dark; then the priest shall shut him up seven days:","27":"And the priest shall look upon him the seventh day: *and* if it be spread much abroad in the skin, then the priest shall pronounce him unclean: it *is* the plague of leprosy.","28":"And if the bright spot stay in his place, *and* spread not in the skin, but it *be* somewhat dark; it *is* a rising of the burning, and the priest shall pronounce him clean: for it *is* an inflammation of the burning.","29":"If a man or woman have a plague upon the head or the beard;","30":"Then the priest shall see the plague: and, behold, if it *be* in sight deeper than the skin; *and there be* in it a yellow thin hair; then the priest shall pronounce him unclean: it *is* a dry scall, *even* a leprosy upon the head or beard.","31":"And if the priest look on the plague of the scall, and, behold, it *be* not in sight deeper than the skin, and *that there is* no black hair in it; then the priest shall shut up *him that hath* the plague of the scall seven days:","32":"And in the seventh day the priest shall look on the plague: and, behold, *if* the scall spread not, and there be in it no yellow hair, and the scall *be* not in sight deeper than the skin;","33":"He shall be shaven, but the scall shall he not shave; and the priest shall shut up *him that hath* the scall seven days more:","34":"And in the seventh day the priest shall look on the scall: and, behold, *if* the scall be not spread in the skin, nor *be* in sight deeper than the skin; then the priest shall pronounce him clean: and he shall wash his clothes, and be clean.","35":"But if the scall spread much in the skin after his cleansing;","36":"Then the priest shall look on him: and, behold, if the scall be spread in the skin, the priest shall not seek for yellow hair; he *is* unclean.","37":"But if the scall be in his sight at a stay, and *that* there is black hair grown up therein; the scall is healed, he *is* clean: and the priest shall pronounce him clean.","38":"If a man also or a woman have in the skin of their flesh bright spots, *even* white bright spots;","39":"Then the priest shall look: and, behold, *if* the bright spots in the skin of their flesh *be* darkish white; it *is* a freckled spot *that* groweth in the skin; he *is* clean.","40":"And the man whose hair is fallen off his head, he *is* bald; *yet is* he clean.","41":"And he that hath his hair fallen off from the part of his head toward his face, he *is* forehead bald: *yet is* he clean.","42":"And if there be in the bald head, or bald forehead, a white reddish sore; it *is* a leprosy sprung up in his bald head, or his bald forehead.","43":"Then the priest shall look upon it: and, behold, *if* the rising of the sore *be* white reddish in his bald head, or in his bald forehead, as the leprosy appeareth in the skin of the flesh;","44":"He is a leprous man, he *is* unclean: the priest shall pronounce him utterly unclean; his plague *is* in his head.","45":"And the leper in whom the plague *is*, his clothes shall be rent, and his head bare, and he shall put a covering upon his upper lip, and shall cry, Unclean, unclean.","46":"All the days wherein the plague *shall be* in him he shall be defiled; he *is* unclean: he shall dwell alone; without the camp *shall* his habitation","47":"The garment also that the plague of leprosy is in, *whether it be* a woollen garment, or a linen garment;","48":"Whether *it be* in the warp, or woof; of linen, or of woollen; whether in a skin, or in any thing made of skin;","49":"And if the plague be greenish or reddish in the garment, or in the skin, either in the warp, or in the woof, or in any thing of skin; it *is* a plague of leprosy, and shall be shewed unto the priest:","50":"And the priest shall look upon the plague, and shut up *it that hath* the plague seven days:","51":"And he shall look on the plague on the seventh day: if the plague be spread in the garment, either in the warp, or in the woof, or in a skin, *or* in any work that is made of skin; the plague *is* a fretting leprosy; it *is* unclean.","52":"He shall therefore burn that garment, whether warp or woof, in woollen or in linen, or any thing of skin, wherein the plague is: for it *is* a fretting leprosy; it shall be burnt in the fire.","53":"And if the priest shall look, and, behold, the plague be not spread in the garment, either in the warp, or in the woof, or in any thing of skin;","54":"Then the priest shall command that they wash *the thing* wherein the plague *is*, and he shall shut it up seven days more:","55":"And the priest shall look on the plague, after that it is washed: and, behold, *if* the plague have not changed his colour, and the plague be not spread; it *is* unclean; thou shalt burn it in the fire; it *is* fret inward, *whether* it *be* bare within or without.","56":"And if the priest look, and, behold, the plague *be* somewhat dark after the washing of it; then he shall rend it out of the garment, or out of the skin, or out of the warp, or out of the woof:","57":"And if it appear still in the garment, either in the warp, or in the woof, or in any thing of skin; it *is* a spreading *plague*: thou shalt burn that wherein the plague *is* with fire.","58":"And the garment, either warp, or woof, or whatsoever thing of skin *it be*, which thou shalt wash, if the plague be departed from them, then it shall be washed the second time, and shall be clean.","59":"This *is* the law of the plague of leprosy in a garment of woollen or linen, either in the warp, or woof, or any thing of skins, to pronounce it clean, or to pronounce it unclean."}},"tsk":{"2":[{"kopje":"gezweer","refs":["Lev 14:56","Deut 28:27","Jes 3:17"]},{"kopje":"een plaag van de melaatsheid","refs":["Lev 14:3","Lev 14:35","Ex 4:6","Ex 4:7","Num 12:10","Num 12:12","2 Sam 3:29","2 Kon 5:1","2 Kon 5:27","2 Kron 26:19-21","Jes 1:6"]},{"kopje":"hij zal","refs":["Deut 17:8","Deut 17:9","Deut 24:8","Mal 2:7 ata-code=\"H6883\">leprosy:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> on him, and pronounce him unclean.","4":"If the bright <span class=\"wl wl-kjv\" data-code=\"H934\">spot</span> be <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> of his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and in <span class=\"wl wl-kjv\" data-code=\"H4758\">sight</span> be not <span class=\"wl wl-kjv\" data-code=\"H6013\">deeper</span> than the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> thereof be not <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> <span class=\"wl wl-kjv\" data-code=\"H3836\">white;</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> up him that hath the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> days:","5":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> on him the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> in his <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> be at a <span class=\"wl wl-kjv\" data-code=\"H5975\">stay,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> <span class=\"wl wl-kjv\" data-code=\"H6581\">spread</span> not in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin;</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> him up <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> more:","6":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> on him <span class=\"wl wl-kjv\" data-code=\"H8145\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> be somewhat <span class=\"wl wl-kjv\" data-code=\"H3544\">dark,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> <span class=\"wl wl-kjv\" data-code=\"H6581\">spread</span> not in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2891\">clean:</span> it is but a <span class=\"wl wl-kjv\" data-code=\"H4556\">scab:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and be clean.","7":"But if the <span class=\"wl wl-kjv\" data-code=\"H4556\">scab</span> spread <span class=\"wl wl-kjv\" data-code=\"H6581\">much</span> <span class=\"wl wl-kjv\" data-code=\"H6581\">abroad</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that he hath been <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> for his <span class=\"wl wl-kjv\" data-code=\"H2893\">cleansing,</span> he shall be <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> again:","8":"And if the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> that, behold, the <span class=\"wl wl-kjv\" data-code=\"H4556\">scab</span> <span class=\"wl wl-kjv\" data-code=\"H6581\">spreadeth</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> it is a leprosy.","9":"When the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> is in a <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> then he shall be <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> unto the priest;","10":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> him: and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H7613\">rising</span> be <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> and it have <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> the <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> <span class=\"wl wl-kjv\" data-code=\"H3836\">white,</span> and there be <span class=\"wl wl-kjv\" data-code=\"H4241\">quick</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">raw</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> in the rising;","11":"It is an <span class=\"wl wl-kjv\" data-code=\"H3462\">old</span> <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> of his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean,</span> and shall not <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> him up: for he is unclean.","12":"And if a <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> break <span class=\"wl wl-kjv\" data-code=\"H6524\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6524\">abroad</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> all the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> of him that hath the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> from his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> even to his <span class=\"wl wl-kjv\" data-code=\"H7272\">foot,</span> wheresoever the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H4758\">looketh;</span>","13":"Then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">consider:</span> and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> have <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> all his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> he shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2891\">clean</span> that hath the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague:</span> it is all <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> <span class=\"wl wl-kjv\" data-code=\"H3836\">white:</span> he is clean.","14":"But <span class=\"wl wl-kjv\" data-code=\"H3117\">when</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">raw</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeareth</span> in him, he shall be unclean.","15":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H2416\">raw</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and pronounce him to be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> for the <span class=\"wl wl-kjv\" data-code=\"H2416\">raw</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> is <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean:</span> it is a leprosy.","16":"Or if the <span class=\"wl wl-kjv\" data-code=\"H2416\">raw</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> turn <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2015\">changed</span> unto <span class=\"wl wl-kjv\" data-code=\"H3836\">white,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto the priest;","17":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> him: and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> be <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> into <span class=\"wl wl-kjv\" data-code=\"H3836\">white;</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2891\">clean</span> that hath the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague:</span> he is clean.","18":"The <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> also, in <span class=\"wl wl-kjv\" data-code=\"H3588\">which,</span> even in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> thereof, was a <span class=\"wl wl-kjv\" data-code=\"H7822\">boil,</span> and is healed,","19":"And in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of the <span class=\"wl wl-kjv\" data-code=\"H7822\">boil</span> there be a <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> <span class=\"wl wl-kjv\" data-code=\"H7613\">rising,</span> or a bright <span class=\"wl wl-kjv\" data-code=\"H934\">spot,</span> <span class=\"wl wl-kjv\" data-code=\"H3836\">white,</span> and somewhat <span class=\"wl wl-kjv\" data-code=\"H125\">reddish,</span> and it be <span class=\"wl wl-kjv\" data-code=\"H7200\">shewed</span> to the priest;","20":"And if, when the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> it, behold, it be in <span class=\"wl wl-kjv\" data-code=\"H4758\">sight</span> <span class=\"wl wl-kjv\" data-code=\"H8217\">lower</span> than the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> thereof be <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> <span class=\"wl wl-kjv\" data-code=\"H3836\">white;</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> it is a <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> <span class=\"wl wl-kjv\" data-code=\"H6524\">broken</span> out of the boil.","21":"But if the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> on it, and, behold, there be no <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> <span class=\"wl wl-kjv\" data-code=\"H8181\">hairs</span> therein, and if it be not <span class=\"wl wl-kjv\" data-code=\"H8217\">lower</span> than the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> but be somewhat <span class=\"wl wl-kjv\" data-code=\"H3544\">dark;</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> him up <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> days:","22":"And if it spread <span class=\"wl wl-kjv\" data-code=\"H6581\">much</span> <span class=\"wl wl-kjv\" data-code=\"H6581\">abroad</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> it is a plague.","23":"But if the bright <span class=\"wl wl-kjv\" data-code=\"H934\">spot</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stay</span> in his place, and <span class=\"wl wl-kjv\" data-code=\"H6581\">spread</span> not, it is a <span class=\"wl wl-kjv\" data-code=\"H6867\">burning</span> <span class=\"wl wl-kjv\" data-code=\"H7822\">boil;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him clean.","24":"Or if there be any <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> whereof there is a <span class=\"wl wl-kjv\" data-code=\"H784\">hot</span> <span class=\"wl wl-kjv\" data-code=\"H4348\">burning,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4241\">quick</span> flesh that <span class=\"wl wl-kjv\" data-code=\"H4348\">burneth</span> have a <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> bright <span class=\"wl wl-kjv\" data-code=\"H934\">spot,</span> somewhat <span class=\"wl wl-kjv\" data-code=\"H125\">reddish,</span> or white;","25":"Then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> upon it: and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> in the bright <span class=\"wl wl-kjv\" data-code=\"H934\">spot</span> be <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> <span class=\"wl wl-kjv\" data-code=\"H3836\">white,</span> and it be in <span class=\"wl wl-kjv\" data-code=\"H4758\">sight</span> <span class=\"wl wl-kjv\" data-code=\"H6013\">deeper</span> than the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin;</span> it is a <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> <span class=\"wl wl-kjv\" data-code=\"H6524\">broken</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4348\">burning:</span> wherefore the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> it is the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of leprosy.","26":"But if the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> on it, and, behold, there be no <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> in the bright <span class=\"wl wl-kjv\" data-code=\"H934\">spot,</span> and it be no <span class=\"wl wl-kjv\" data-code=\"H8217\">lower</span> than the other <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> but be somewhat <span class=\"wl wl-kjv\" data-code=\"H3544\">dark;</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> him up <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> days:","27":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> upon him the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> and if it be spread <span class=\"wl wl-kjv\" data-code=\"H6581\">much</span> <span class=\"wl wl-kjv\" data-code=\"H6581\">abroad</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> it is the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of leprosy.","28":"And if the <span class=\"wl wl-kjv\" data-code=\"H934\">bright</span> <span class=\"wl wl-kjv\" data-code=\"H934\">spot</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stay</span> in his place, and <span class=\"wl wl-kjv\" data-code=\"H6581\">spread</span> not in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> but it be somewhat <span class=\"wl wl-kjv\" data-code=\"H3544\">dark;</span> it is a <span class=\"wl wl-kjv\" data-code=\"H7613\">rising</span> of the <span class=\"wl wl-kjv\" data-code=\"H4348\">burning,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2891\">clean:</span> for it is an <span class=\"wl wl-kjv\" data-code=\"H6867\">inflammation</span> of the burning.","29":"If a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> or <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> have a <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> or the beard;","30":"Then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague:</span> and, behold, if it be in <span class=\"wl wl-kjv\" data-code=\"H4758\">sight</span> <span class=\"wl wl-kjv\" data-code=\"H6013\">deeper</span> than the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin;</span> and there be in it a <span class=\"wl wl-kjv\" data-code=\"H6669\">yellow</span> <span class=\"wl wl-kjv\" data-code=\"H1851\">thin</span> <span class=\"wl wl-kjv\" data-code=\"H8181\">hair;</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> it is a dry <span class=\"wl wl-kjv\" data-code=\"H5424\">scall,</span> even a <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> or beard.","31":"And if the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> on the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of the <span class=\"wl wl-kjv\" data-code=\"H5424\">scall,</span> and, behold, it be not in <span class=\"wl wl-kjv\" data-code=\"H4758\">sight</span> <span class=\"wl wl-kjv\" data-code=\"H6013\">deeper</span> than the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> and that there is no <span class=\"wl wl-kjv\" data-code=\"H7838\">black</span> <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> in it; then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> up him that hath the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of the <span class=\"wl wl-kjv\" data-code=\"H5424\">scall</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> days:","32":"And in the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> on the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague:</span> and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H5424\">scall</span> <span class=\"wl wl-kjv\" data-code=\"H6581\">spread</span> not, and there be in it no <span class=\"wl wl-kjv\" data-code=\"H6669\">yellow</span> <span class=\"wl wl-kjv\" data-code=\"H8181\">hair,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5424\">scall</span> be not in <span class=\"wl wl-kjv\" data-code=\"H4758\">sight</span> <span class=\"wl wl-kjv\" data-code=\"H6013\">deeper</span> than the skin;","33":"He shall be <span class=\"wl wl-kjv\" data-code=\"H1548\">shaven,</span> but the <span class=\"wl wl-kjv\" data-code=\"H5424\">scall</span> shall he not <span class=\"wl wl-kjv\" data-code=\"H1548\">shave;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> up him that hath the <span class=\"wl wl-kjv\" data-code=\"H5424\">scall</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> more:","34":"And in the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> on the <span class=\"wl wl-kjv\" data-code=\"H5424\">scall:</span> and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H5424\">scall</span> be not <span class=\"wl wl-kjv\" data-code=\"H6581\">spread</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> nor be in <span class=\"wl wl-kjv\" data-code=\"H4758\">sight</span> <span class=\"wl wl-kjv\" data-code=\"H6013\">deeper</span> than the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin;</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2891\">clean:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and be clean.","35":"But if the <span class=\"wl wl-kjv\" data-code=\"H5424\">scall</span> <span class=\"wl wl-kjv\" data-code=\"H6581\">spread</span> <span class=\"wl wl-kjv\" data-code=\"H6581\">much</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> his cleansing;","36":"Then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> on him: and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H5424\">scall</span> be <span class=\"wl wl-kjv\" data-code=\"H6581\">spread</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall not <span class=\"wl wl-kjv\" data-code=\"H1239\">seek</span> for <span class=\"wl wl-kjv\" data-code=\"H6669\">yellow</span> <span class=\"wl wl-kjv\" data-code=\"H8181\">hair;</span> he is unclean.","37":"But if the <span class=\"wl wl-kjv\" data-code=\"H5424\">scall</span> be in his <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> at a <span class=\"wl wl-kjv\" data-code=\"H5975\">stay,</span> and that there is <span class=\"wl wl-kjv\" data-code=\"H7838\">black</span> <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> <span class=\"wl wl-kjv\" data-code=\"H6779\">grown</span> up therein; the <span class=\"wl wl-kjv\" data-code=\"H5424\">scall</span> is <span class=\"wl wl-kjv\" data-code=\"H7495\">healed,</span> he is <span class=\"wl wl-kjv\" data-code=\"H2889\">clean:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him clean.","38":"If a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> also or a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> have in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> of their <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> bright <span class=\"wl wl-kjv\" data-code=\"H934\">spots,</span> even <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> bright spots;","39":"Then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look:</span> and, behold, if the bright <span class=\"wl wl-kjv\" data-code=\"H934\">spots</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> of their <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> be <span class=\"wl wl-kjv\" data-code=\"H3544\">darkish</span> <span class=\"wl wl-kjv\" data-code=\"H3836\">white;</span> it is a freckled <span class=\"wl wl-kjv\" data-code=\"H933\">spot</span> that <span class=\"wl wl-kjv\" data-code=\"H6524\">groweth</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin;</span> he is clean.","40":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> whose hair is <span class=\"wl wl-kjv\" data-code=\"H4803\">fallen</span> off his <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> he is <span class=\"wl wl-kjv\" data-code=\"H7142\">bald;</span> yet is he clean.","41":"And he that hath his hair <span class=\"wl wl-kjv\" data-code=\"H4803\">fallen</span> off from the <span class=\"wl wl-kjv\" data-code=\"H6285\">part</span> of his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> toward his <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> he is forehead <span class=\"wl wl-kjv\" data-code=\"H1371\">bald:</span> yet is he clean.","42":"And if there be in the bald <span class=\"wl wl-kjv\" data-code=\"H7146\">head,</span> or bald <span class=\"wl wl-kjv\" data-code=\"H1372\">forehead,</span> a <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> <span class=\"wl wl-kjv\" data-code=\"H125\">reddish</span> <span class=\"wl wl-kjv\" data-code=\"H5061\">sore;</span> it is a <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> <span class=\"wl wl-kjv\" data-code=\"H6524\">sprung</span> up in his bald <span class=\"wl wl-kjv\" data-code=\"H7146\">head,</span> or his bald forehead.","43":"Then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> upon it: and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H7613\">rising</span> of the <span class=\"wl wl-kjv\" data-code=\"H5061\">sore</span> be <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> <span class=\"wl wl-kjv\" data-code=\"H125\">reddish</span> in his bald <span class=\"wl wl-kjv\" data-code=\"H7146\">head,</span> or in his bald <span class=\"wl wl-kjv\" data-code=\"H1372\">forehead,</span> as the <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> <span class=\"wl wl-kjv\" data-code=\"H4758\">appeareth</span> in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> of the flesh;","44":"He is a <span class=\"wl wl-kjv\" data-code=\"H6879\">leprous</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> he is <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean:</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2930\">utterly</span> <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean;</span> his <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> is in his head.","45":"And the <span class=\"wl wl-kjv\" data-code=\"H6879\">leper</span> in whom the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> is, his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6533\">rent,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> <span class=\"wl wl-kjv\" data-code=\"H6544\">bare,</span> and he shall put a <span class=\"wl wl-kjv\" data-code=\"H5844\">covering</span> upon his upper <span class=\"wl wl-kjv\" data-code=\"H8222\">lip,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7121\">cry,</span> <span class=\"wl wl-kjv\" data-code=\"H2931\">Unclean,</span> unclean.","46":"All the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> wherein the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> shall be in him he shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled;</span> he is <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean:</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H910\">alone;</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> shall his habitation","47":"The <span class=\"wl wl-kjv\" data-code=\"H899\">garment</span> also that the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> is in, whether it be a <span class=\"wl wl-kjv\" data-code=\"H6785\">woollen</span> <span class=\"wl wl-kjv\" data-code=\"H899\">garment,</span> or a <span class=\"wl wl-kjv\" data-code=\"H6593\">linen</span> garment;","48":"Whether it be in the <span class=\"wl wl-kjv\" data-code=\"H8359\">warp,</span> or <span class=\"wl wl-kjv\" data-code=\"H6154\">woof;</span> of <span class=\"wl wl-kjv\" data-code=\"H6593\">linen,</span> or of <span class=\"wl wl-kjv\" data-code=\"H6785\">woollen;</span> whether in a <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> or in any thing <span class=\"wl wl-kjv\" data-code=\"H4399\">made</span> of skin;","49":"And if the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> be <span class=\"wl wl-kjv\" data-code=\"H3422\">greenish</span> or <span class=\"wl wl-kjv\" data-code=\"H125\">reddish</span> in the <span class=\"wl wl-kjv\" data-code=\"H899\">garment,</span> or in the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> <span class=\"wl wl-kjv\" data-code=\"H176\">either</span> in the <span class=\"wl wl-kjv\" data-code=\"H8359\">warp,</span> or in the <span class=\"wl wl-kjv\" data-code=\"H6154\">woof,</span> or in any <span class=\"wl wl-kjv\" data-code=\"H3627\">thing</span> of <span class=\"wl wl-kjv\" data-code=\"H5785\">skin;</span> it is a <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy,</span> and shall be <span class=\"wl wl-kjv\" data-code=\"H7200\">shewed</span> unto the priest:","50":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> upon the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague,</span> and <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> up it that hath the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> days:","51":"And he shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> on the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> on the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> if the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> be <span class=\"wl wl-kjv\" data-code=\"H6581\">spread</span> in the <span class=\"wl wl-kjv\" data-code=\"H899\">garment,</span> either in the <span class=\"wl wl-kjv\" data-code=\"H8359\">warp,</span> or in the <span class=\"wl wl-kjv\" data-code=\"H6154\">woof,</span> or in a <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> or in any <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> that is <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> of <span class=\"wl wl-kjv\" data-code=\"H5785\">skin;</span> the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> is a <span class=\"wl wl-kjv\" data-code=\"H3992\">fretting</span> <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy;</span> it is unclean.","52":"He shall therefore <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> that <span class=\"wl wl-kjv\" data-code=\"H899\">garment,</span> whether <span class=\"wl wl-kjv\" data-code=\"H8359\">warp</span> or <span class=\"wl wl-kjv\" data-code=\"H6154\">woof,</span> in <span class=\"wl wl-kjv\" data-code=\"H6785\">woollen</span> or in <span class=\"wl wl-kjv\" data-code=\"H6593\">linen,</span> or any <span class=\"wl wl-kjv\" data-code=\"H3627\">thing</span> of <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> wherein the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> is: for it is a <span class=\"wl wl-kjv\" data-code=\"H3992\">fretting</span> <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy;</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> in the fire.","53":"And if the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look,</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> be not <span class=\"wl wl-kjv\" data-code=\"H6581\">spread</span> in the <span class=\"wl wl-kjv\" data-code=\"H899\">garment,</span> <span class=\"wl wl-kjv\" data-code=\"H176\">either</span> in the <span class=\"wl wl-kjv\" data-code=\"H8359\">warp,</span> <span class=\"wl wl-kjv\" data-code=\"H176\">or</span> in the <span class=\"wl wl-kjv\" data-code=\"H6154\">woof,</span> <span class=\"wl wl-kjv\" data-code=\"H176\">or</span> in any <span class=\"wl wl-kjv\" data-code=\"H3627\">thing</span> of skin;","54":"Then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> that they <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> the thing wherein the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> is, and he shall <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> it up <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> more:","55":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> on the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that it is <span class=\"wl wl-kjv\" data-code=\"H3526\">washed:</span> and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> have not <span class=\"wl wl-kjv\" data-code=\"H2015\">changed</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">colour,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> be not <span class=\"wl wl-kjv\" data-code=\"H6581\">spread;</span> it is <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean;</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> it in the <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> it is <span class=\"wl wl-kjv\" data-code=\"H6356\">fret</span> inward, whether it be bare <span class=\"wl wl-kjv\" data-code=\"H7146\">within</span> or without.","56":"And if the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">look,</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> be somewhat <span class=\"wl wl-kjv\" data-code=\"H3544\">dark</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H3526\">washing</span> of it; then he shall <span class=\"wl wl-kjv\" data-code=\"H7167\">rend</span> it out of the <span class=\"wl wl-kjv\" data-code=\"H899\">garment,</span> or out of the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> or out of the <span class=\"wl wl-kjv\" data-code=\"H8359\">warp,</span> or out of the woof:","57":"And if it <span class=\"wl wl-kjv\" data-code=\"H7200\">appear</span> <span class=\"wl wl-kjv\" data-code=\"H5750\">still</span> in the <span class=\"wl wl-kjv\" data-code=\"H899\">garment,</span> either in the <span class=\"wl wl-kjv\" data-code=\"H8359\">warp,</span> or in the <span class=\"wl wl-kjv\" data-code=\"H6154\">woof,</span> or in any <span class=\"wl wl-kjv\" data-code=\"H3627\">thing</span> of <span class=\"wl wl-kjv\" data-code=\"H5785\">skin;</span> it is a <span class=\"wl wl-kjv\" data-code=\"H6524\">spreading</span> plague: thou shalt <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> that wherein the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> is with fire.","58":"And the <span class=\"wl wl-kjv\" data-code=\"H899\">garment,</span> either <span class=\"wl wl-kjv\" data-code=\"H8359\">warp,</span> or <span class=\"wl wl-kjv\" data-code=\"H6154\">woof,</span> or whatsoever <span class=\"wl wl-kjv\" data-code=\"H3627\">thing</span> of <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> it be, which thou shalt <span class=\"wl wl-kjv\" data-code=\"H3526\">wash,</span> if the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> be <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> from them, then it shall be <span class=\"wl wl-kjv\" data-code=\"H3526\">washed</span> the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> time, and shall be clean.","59":"This is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> in a <span class=\"wl wl-kjv\" data-code=\"H899\">garment</span> of <span class=\"wl wl-kjv\" data-code=\"H6785\">woollen</span> or <span class=\"wl wl-kjv\" data-code=\"H6593\">linen,</span> either in the <span class=\"wl wl-kjv\" data-code=\"H8359\">warp,</span> or <span class=\"wl wl-kjv\" data-code=\"H6154\">woof,</span> or any <span class=\"wl wl-kjv\" data-code=\"H3627\">thing</span> of <span class=\"wl wl-kjv\" data-code=\"H5785\">skins,</span> to pronounce it <span class=\"wl wl-kjv\" data-code=\"H2891\">clean,</span> or to pronounce it unclean."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"gezwel, of gezweer,","tekst":"Hebreeuws, verheffing."},{"catchword":"plaag der melaatsheid zou worden,","tekst":"Of, een teken van de plaag der melaatsheid, die wel terecht ene plaag genoemd wordt, niet alleen in dit hfdst., maar ook onder, Lev 14:3; Deu 24:8, enz.; want deze melaatsheid was een soort van kwade schurftheid, zeer besmettelijk en bij de mensen ongeneeslijk geacht, onderscheiden van de ziekte, die wij in deze landen lazerij of melaatsheid noemen, als veel zwaarder dan deze zijnde."}],"3":[{"catchword":"in wit veranderd is,","tekst":"Het woordje in wordt hier, gelijk in enige volgende verzen ingevoegd uit onder, vs.16,17, waar het uitgedrukt staat."},{"catchword":"het aanzien der plaag","tekst":"Dat is, het uitwijzen der plaag, naardat zij zich in het gezicht en oordeel des priesters vertoont."},{"catchword":"onrein verklaren","tekst":"Hebreeuws, ontreinigen, of onrein maken; dat is, onrein verklaren en uitspreken. Alzo onder, vs.11, 15, enz.; alzo is reinigen en rein maken zoveel als rein verklaren en uitspreken; onder, vs.6, 13, enz."}],"4":[{"catchword":"zijn vleses wit is,","tekst":"Te weten, desgenen, die de plaag heeft."},{"catchword":"hem,","tekst":"Hebreeuws, die plaag; dat is, de persoon, die de plaag heeft, of met de plaag bevangen is. Alzo onder, vs.12,13, 17, 31, enz."}],"5":[{"catchword":"naar dat hij zien kan,","tekst":"Hebreeuws, in zijne ogen; dat is, naardat hij met zijne ogen zien en met zijn verstand beoordelen kan. Alzo onder, vs.37."}],"6":[{"catchword":"ingetrokken,","tekst":"Of, ingekrompen, of verduisterd."},{"catchword":"rein verklaren;","tekst":"Hebreeuws, reinigen, of rein maken; dat is, rein verklaren, uitspreken. Zie boven, vs.3."},{"catchword":"rein","tekst":"Te weten, van de plaag der melaatsheid, gelijk af te nemen is uit vs.8."}],"7":[{"catchword":"ganselijk uitgespreid is,","tekst":"Hebreeuws, uitspreidende uitgespreid; dat is, ganselijk of zeer uitgespreid. Zo ook onder, vs.22, 27, 35."}],"9":[{"catchword":"de plaag der melaatsheid","tekst":"Zie boven, vs.2."}],"10":[{"catchword":"gezondheid","tekst":"Hebreeuws, levendigheid."},{"catchword":"levend vlees","tekst":"Versta, wat nog zijn gevoel heeft. Want door de melaatsheid wordt het als verstorven, zodat het ongevoelig wordt. En bemerkt hier, alsook onder, vs.14, een algemeen teken om wel over deze melaatsheid te oordelen: namelijk, waar levend of gezond vlees met het ongezonde van verscheidene kleuren vermengd was, bleek dat zulks de rechte melaatsheid was; daarentegen, waar enerlei kleur gezien werd, dat zulks een andere zweer of gebrek was."}],"12":[{"catchword":"melaatsheid","tekst":"Dat is, gezwel, dat melaats schijnt te wezen, of het teken der melaatsheid. Alzo in vs.13."},{"catchword":"ganselijk uitbot,","tekst":"Hebreeuws, uitbottende uitbot."},{"catchword":"het gehele vel","tekst":"Hebreeuws, het gehele vel der plaag; dat is, van dengene die de plaag heeft. Zie boven, vs.4 en het volgende."},{"catchword":"gezicht van de ogen des priesters;","tekst":"Dat is, het aanschouwen en beoordelen van den priester."}],"13":[{"catchword":"hem,","tekst":"Hebreeuws, de plaag rein verklaren; dat is, hem die die plaag heeft; alzo onder, vs.17, enz."},{"catchword":"zij is geheel in wit veranderd;","tekst":"Te weten, de plaag."},{"catchword":"hij is rein","tekst":"Dat is, hij die de plaag der melaatsheid scheen te hebben, is vrij van dezelve."}],"14":[{"catchword":"levend vlees","tekst":"Te weten, vermengd met het vlees, dat wit geworden was, zijnde de verscheidenheid der kleuren een teken der melaatsheid, maar de gelijkvormigheid een teken der gezondheid of van enige andere verzwering. Zie boven, vs.10."}],"17":[{"catchword":"hem,","tekst":"Zie boven, vs.13."},{"catchword":"rein verklaren;","tekst":"Hebreeuws, reinigen. Zie boven, vs.6."}],"19":[{"catchword":"zal het aan den priester vertoond worden","tekst":"Te weten, het vlees, waaraan dat wit gezwel, enz. gekomen is."}],"20":[{"catchword":"haar aanzien lager is dan het vel,","tekst":"Te weten, der blaar of van het gezwel. Dit bijvoegsel is onder, vs.25, uitgedrukt."}],"22":[{"catchword":"het is de plaag","tekst":"Te weten, der melaatsheid. Zie boven, vs.20."}],"23":[{"catchword":"de roof van die zweer,","tekst":"Dat is, een litteken van den brand. Anders, ene verbranding. Alzo onder, vs.28."}],"24":[{"catchword":"het gezonde","tekst":"Hebreeuws, de levendigheid, of de gezondheid van den brand. Versta, het deel des vleesches, dat van den brand genezen en weder gezond geworden is."},{"catchword":"witte blaar is;","tekst":"Versta, alleen wit."}],"27":[{"catchword":"gans uitgespreid is in het vel,","tekst":"Hebreeuws, uitspreidende uitgespreid is."}],"28":[{"catchword":"roof van den brand","tekst":"Vergelijk boven de aantekeningen op vs.23."}],"31":[{"catchword":"zwart haar daarop is,","tekst":"Hetwelk een teken was van reinheid en gezondheid, onder, vs.37, gelijk de geelachtigheid een teken van onreinheid en ongezondheid; boven, vs.30."}],"33":[{"catchword":"zal hij zich scheren laten;","tekst":"Hebreeuws, hij zal zich scheren; dat is, zich laten scheren."}],"34":[{"catchword":"rein verklaren;","tekst":"Te weten, van de plaag der melaatsheid; alzo boven, vs.6, 13, en onder, vs.37, 39-41."}],"36":[{"catchword":"niet zoeken;","tekst":"Dat is, daarop niet meer letten of achtgeven."}],"37":[{"catchword":"naar dat hij zien kan,","tekst":"Hebreeuws, in zijne ogen. Zie boven, vs.5."}],"39":[{"catchword":"puist in het vel uitgebot,","tekst":"Of, witte plek."},{"catchword":"hij is rein","tekst":"Te weten, van de plaag der melaatsheid. Zie boven, vs.34, alzo in vs.40,41."}],"41":[{"catchword":"de zijde zijns aangezichts","tekst":"Dat is, van de kruin tot aan het voorhoofd, en den slag van het hoofd; welke kaalheid een bles genaamd wordt, en die ze heeft bles."}],"42":[{"catchword":"kaalheid,","tekst":"Hieruit blijkt dat hier wordt gesproken van de kaalheid of bles, niet die uit ouderdom of enig ander ongeval, maar uit melaatsheid voortkomt, en dat deze en niet die, onrein verklaard wordt."}],"43":[{"catchword":"gelijk het aanzien der melaatsheid","tekst":"Dat is, hebbende de gedaante, die der melaatsheid, zich vertonende in het vel des vleesches, gelijk is."}],"44":[{"catchword":"ganselijk onrein verklaren,","tekst":"Hebreeuws, onrein verklarende, zal hij onrein verklaren."}],"45":[{"catchword":"melaatsen,","tekst":"Die voor zodanig door den priester verklaard was. Aan dezulken wordt opgelegd:&lt;i&gt;I.&lt;/i&gt; verscheurende klederen te dragen;&lt;i&gt;II.&lt;/i&gt; het hoofd ontbloot te hebben;&lt;i&gt;III.&lt;/i&gt; zijn bovenste lip te bewinden, en zo zijn baard te bedekken;&lt;i&gt;IV.&lt;/i&gt; uit te roepen, wanneer hij iemand zag, dat hij onrein was;&lt;i&gt;V.&lt;/i&gt; buiten het gezelschap der mensen te wonen; en dit alles, eensdeels voor hemzelven tot een teken van droefheid en rouw, anderdeels voor anderen, opdat zij hem mijden zouden en van hem neit besmet worden."},{"catchword":"gescheurd zijn,","tekst":"Vergelijk de aantekeningen op Gen 37:29."},{"catchword":"bovenste lip bewimpelen;","tekst":"Anders, knevelbaard; vergelijk Eze 24:17, en Mic 3:7."}],"46":[{"catchword":"hij zal alleen wonen;","tekst":"Zie Num 5:2, en Num 12:14; 2Ki 15:5; 2Ch 26:21; Luk 17:12."}],"48":[{"catchword":"scheerdraad,","tekst":"Anders genaamd schering, werpte of keten."},{"catchword":"vellenwerk;","tekst":"Of, bontwerk."}],"50":[{"catchword":"hetgeen de plaag heeft,","tekst":"Hebreeuws, de plaag zeven dagen opsluiten; dat is, dat de plaag heeft, of, waaraan de plaag is. Vergelijk boven, de aantekeningen op vs.4."}],"51":[{"catchword":"knagende melaatsheid,","tekst":"Anders, stekende, of, wee doende; dat is, die smart en schade den mens, die dat kleed gebruikt, veroorzaken zal."},{"catchword":"het is onrein","tekst":"Te weten, de stof, het ding of goed, waaraan de plaag is; alzo in het einde van vs.52."}],"55":[{"catchword":"gedaante niet veranderd heeft,","tekst":"Hebreeuws, ogen."},{"catchword":"ingraving","tekst":"Of, ineting, inbijting."},{"catchword":"aan zijn achterste of aan zijn voorste zijde","tekst":"Hebreeuws, in zijne kaalheid, of, in zijne bles. Versta, door de kaalheid de achterste of binnenste zijde van een kleed, genaamd de averechtse zijde, die in het dragen het naast aan het lichaam is; en door de bles de voorste of buitenste zijde, die in het dragen voor ogen is, genaamd de rechter zijde. Anderen verstaan door de kaalheid een kleed, dat door oudheid zijn wol en haar verloren heeft en melaats geworden is, maar door de bles, wanneer enige melaatsheid het kleed van zijn wol beroofd heeft."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Moreover the LORD spoke unto Moseh, and unto Aaron saying:"}],"2":[{"catchword":null,"tekst":"If a man, when there shall be in the skin of his flesh of swelling, [Heb. a rising, or, raising] or sore, (boil) or white blister, which would become a plague of Leprosy, which migh function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {

        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);

function bouwRijen() {

    rij.className = 'vers'; rij.id = 'v' + n;

      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

document.addEventListener('click', e => {
