En als het op de derde dag toch gegeten wordt, is het een afschuwelijk ding, het zal niet aangenaam zijn.","8":"En wie het eet, zal zijn ongerechtigheid dragen, omdat hij het heilige van de HEERE ontheiligd heeft; daarom zal die ziel uit haar volken uitgeroeid worden.","9":"Als u ook de oogst van uw land inoogst, zult u de hoek van uw veld niet helemaal afoogsten, en wat van uw oogst is blijven liggen, niet opzamelen.","10":"Evenzo zult u uw wijngaard niet nalezen, en de afgevallen bessen van uw wijngaard niet opzamelen; de arme en de vreemdeling zult u die overlaten; Ik ben de HEERE, uw God!","11":"U zult niet stelen, en u zult niet liegen, noch bedrieglijk handelen, ieder tegen zijn naaste.","12":"U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.","13":"U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.","14":"U zult de dove niet vloeken, en voor het aangezicht van de blinde geen struikelblok zetten; maar u zult voor uw God vrezen; Ik ben de HEERE!","15":"U zult geen onrecht doen in het gericht; u zult het aangezicht van de geringe niet aannemen, noch het aangezicht van de grote voortrekken; in gerechtigheid zult u uw naaste rechtspreken.","16":"U zult niet rondgaan als een kwaadspreker onder uw volken; u zult niet opstaan tegen het bloed van uw naaste; Ik ben de HEERE!","17":"U zult uw broeder in uw hart niet haten; u zult uw naaste zeker berispen, en zult de zonde in hem niet laten voortbestaan.","18":"U zult niet wreken, noch *toorn* koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!","19":"U zult Mijn inzettingen houden; u zult uw vee niet van twee verschillende soorten met elkaar laten paren; uw akker zult u niet met tweeërlei *zaad* bezaaien, en een kleed van twee soorten stof, dooreen vermengd, zal u niet aandoen.","20":"En wanneer een man, door gemeenschap van het zaad, bij een vrouw zal hebben gelegen, die een dienstmaagd is, aan een man verloofd, en geenszins losgekocht is, en haar geen vrijheid is gegeven; die zullen gegeseld worden; zij zullen niet gedood worden; want zij was niet vrijgemaakt.","21":"En hij zal zijn schuldoffer de HEERE aan de deur van de tent van de samenkomst brengen, een ram ten schuldoffer.","22":"En de priester zal met de ram van het schuldoffer, voor hem over zijn zonde die hij gezondigd heeft, voor het aangezicht van de HEERE verzoening doen; en hem zal vergeving gebeuren van zijn zonde die hij gezondigd heeft.","23":"Als u ook in dat land gekomen zult zijn, en alle geboomte tot voedsel geplant zult hebben, dan zult u de voorhuid daarvan, de vrucht ervan, wegsnijden; drie jaren zal het u onbesneden zijn, daarvan zal niet gegeten worden.","24":"Maar in het vierde jaar zal al zijn vrucht een heilig ding zijn, tot lofzegging voor de HEERE.","25":"En in het vijfde jaar zult u de vrucht ervan eten, om de opbrengst daarvan voor u te vermeerderen; Ik ben de HEERE, uw God!","26":"U zult niets met het bloed eten. U zult op geen vogelgeschrei letten, noch waarzeggerij plegen.","27":"U zult de hoeken van het hoofd niet rond afscheren; ook zult u de hoeken van het baard niet aantasten.","28":"U zult om een dood lichaam geen snijding in uw vlees maken, noch een schrift van een ingedrukt teken op u maken; Ik ben de HEERE!","29":"U zult uw dochter niet ontheiligen door haar tot hoererij te brengen; opdat het land niet hoereert, en het land met schandelijke daden vervuld wordt.","30":"U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!","31":"U zult zich niet keren tot de waarzeggers, en tot de duivelskunstenaars; zoek hen niet, en verontreinig u niet met hen; Ik ben de HEERE, uw God!","32":"Voor het grauwe haar zult u opstaan, en het aangezicht van de oude vereren; en u zult vrezen voor uw God; Ik ben de HEERE!","33":"En wanneer een vreemdeling bij u in uw land als vreemdeling verblijft, zult u hem niet verdrukken.","34":"De vreemdeling die als vreemdeling bij u verblijft, zal onder u zijn als een inboorling van u; u zult hem liefhebben als uzelf; want u bent vreemdeling geweest in Egypteland; Ik ben de HEERE, uw God!","35":"U zult geen onrecht doen in het gericht, met de el, met het gewicht, of met de maat.","36":"U zult een eerlijke weegschaal hebben, eerlijke gewichten, een eerlijke efa, en een eerlijke hin; Ik ben de HEERE, uw God, Die u uit Egypteland uitgevoerd heb!","37":"Daarom zult u al Mijn inzettingen en al Mijn rechten onderhouden, en zult ze doen; Ik ben de HEERE!"},"SV":{"1":"Verder sprak de HEERE tot Mozes, zeggende:","2":"Spreek tot de ganse vergadering der kinderen Israëls, en zeg tot hen: Gij zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!","3":"Want ieder zal zijn moeder en zijn vader vrezen, en Mijn sabbatten houden; Ik ben de HEERE, uw God!","4":"Gij zult u tot de afgoden niet keren, en u geen gegoten goden maken; Ik ben de HEERE, uw God!","5":"En wanneer gij een dankoffer den HEERE offeren zult, naar uw welgevallen zult gij dat offeren.","6":"Op den dag van uw offeren, en des anderen daags, zal het gegeten worden; maar wat tot op den derden dag overblijft zal met vuur verbrand worden.","7":"En zo het op den derden dag enigszins gegeten wordt, het is een afgrijselijk ding, het zal niet aangenaam zijn.","8":"En zo wie dat eet, zal zijn ongerechtigheid dragen, omdat hij het heilige des HEEREN ontheiligd heeft; daarom zal dezelve ziel, uit haar volken uitgeroeid worden.","9":"Als gij ook den oogst uws lands inoogsten zult, gij zult den hoek uws velds niet ganselijk afoogsten, en dat van uw oogst op te zamelen is, niet opzamelen.","10":"Insgelijks zult gij uw wijngaard niet nalezen, en de afgevallen bezien van uw wijngaard niet opzamelen; den arme en den vreemdeling zult gij die overlaten; Ik ben de HEERE, uw God!","11":"Gij zult niet stelen, en gij zult niet liegen, noch valselijk handelen, een iegelijk tegen zijn naaste.","12":"Gij zult niet valselijk bij Mijn Naam zweren; want gij zoudt den Naam uws Gods ontheiligen; Ik ben de HEERE.","13":"Gij zult uw naaste niet bedriegelijk verdrukken, noch beroven; des dagloners arbeidsloon zal bij u niet vernachten tot aan den morgen.","14":"Gij zult den dove niet vloeken, en voor het aangezicht des blinden geen aanstoot zetten; maar gij zult voor uw God vrezen; Ik ben de HEERE!","15":"Gij zult geen onrecht doen in het gericht; gij zult het aangezicht des geringen niet aannemen, noch het aangezicht des groten voortrekken; in gerechtigheid zult gij uw naaste richten.","16":"Gij zult niet wandelen *als* een achterklapper onder uw volken; gij zult niet staan tegen het bloed van uw naaste; Ik ben de HEERE!","17":"Gij zult uw broeder in uw hart niet haten; gij zult uw naaste naarstiglijk berispen, en zult de zonde in hem niet verdragen.","18":"Gij zult niet wreken, noch *toorn* behouden tegen de kinderen uws volks; maar gij zult uw naaste liefhebben als uzelven; Ik ben de HEERE!","19":"Gij zult Mijn inzettingen houden; gij zult geen tweeërlei aard uwer beesten laten samen te doen hebben; uwen akker zult gij niet met tweeërlei *zaad* bezaaien, en een kleed van tweeërlei stof, dooreen vermengd, zal aan u niet komen.","20":"En wanneer een man, door bijligging des zaads, bij een vrouw zal gelegen hebben, die een dienstmaagd is, bij den man versmaad, en geenszins gelost is, en haar geen vrijheid is gegeven; die zullen gegeseld worden; zij zullen niet gedood worden; want zij was niet vrij gemaakt.","21":"En hij zal zijn schuldoffer den HEERE aan de deur van de tent der samenkomst brengen, een ram ten schuldoffer.","22":"En de priester zal met den ram des schuldoffers, voor hem over zijn zonde, die hij gezondigd heeft, voor het aangezicht des HEEREN verzoening doen; en hem zal vergeving geschieden van zijn zonde, die hij gezondigd heeft.","23":"Als gij ook in dat land gekomen zult zijn, en alle geboomte ter spijze geplant zult hebben, zo zult gij de voorhuid daarvan, deszelfs vrucht, besnijden; drie jaren zal het u onbesneden zijn, daarvan zal niet gegeten worden.","24":"Maar in het vierde jaar zal al zijn vrucht een heilig ding zijn, ter lofzegging voor den HEERE.","25":"En in het vijfde jaar zult gij deszelfs vrucht eten, om het inkomen daarvan voor u te vermeerderen; Ik ben de HEERE, uw God!","26":"Gij zult niets met het bloed eten. Gij zult op geen vogelgeschrei acht geven, noch guichelarij plegen.","27":"Gij zult de hoeken uws hoofds niet rond afscheren; ook zult gij de hoeken uws baards niet verderven.","28":"Gij zult om een dood lichaam geen snijding in uw vlees maken, noch schrift van een ingedrukt teken in u maken; Ik ben de HEERE!","29":"Gij zult uw dochter niet ontheiligen, haar ter hoererij houdende; opdat het land niet hoerere, en het land met schandelijke daden vervuld worde.","30":"Gij zult Mijn sabbatten houden, en Mijn heiligdom zult gij vrezen; Ik ben de HEERE!","31":"Gij zult u niet keren tot de waarzeggers, en tot de duivelskunstenaars; zoekt hen niet, u met hen verontreinigende; Ik ben de HEERE, uw God!","32":"Voor het grauwe haar zult gij opstaan, en zult het aangezicht des ouden vereren; en gij zult vrezen voor uw God; Ik ben de HEERE!","33":"En wanneer een vreemdeling bij u in uw land als vreemdeling verkeren zal, gij zult hem niet verdrukken.","34":"De vreemdeling, die als vreemdeling bij u verkeert, zal onder u zijn als een inboorling van ulieden; gij zult hem liefhebben als uzelven; want gij zijt vreemdeling geweest in Egypteland; Ik ben de HEERE, uw God!","35":"Gij zult geen onrecht doen in het gericht, met de el, met het gewicht, of met de maat.","36":"Gij zult een rechte wage hebben, rechte weegstenen, een rechte efa, en een rechte hin; Ik ben de HEERE, uw God, die u uit Egypteland uitgevoerd heb!","37":"Daarom zult gij al Mijn inzettingen en al Mijn rechten onderhouden, en zult ze doen; Ik ben de HEERE!"},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Speak unto all the congregation of the children of Israel, and say unto them, Ye shall be holy: for I the LORD your God *am* holy.","3":"Ye shall fear every man his mother, and his father, and keep my sabbaths: I *am* the LORD your God.","4":"Turn ye not unto idols, nor make to yourselves molten gods: I *am* the LORD your God.","5":"And if ye offer a sacrifice of peace offerings unto the LORD, ye shall offer it at your own will.","6":"It shall be eaten the same day ye offer it, and on the morrow: and if ought remain until the third day, it shall be burnt in the fire.","7":"And if it be eaten at all on the third day, it *is* abominable; it shall not be accepted.","8":"Therefore *every one* that eateth it shall bear his iniquity, because he hath profaned the hallowed thing of the LORD: and that soul shall be cut off from among his people.","9":"And when ye reap the harvest of your land, thou shalt not wholly reap the corners of thy field, neither shalt thou gather the gleanings of thy harvest.","10":"And thou shalt not glean thy vineyard, neither shalt thou gather *every* grape of thy vineyard; thou shalt leave them for the poor and stranger: I *am* the LORD your God.","11":"Ye shall not steal, neither deal falsely, neither lie one to another.","12":"And ye shall not swear by my name falsely, neither shalt thou profane the name of thy God: I *am* the LORD.","13":"Thou shalt not defraud thy neighbour, neither rob *him*: the wages of him that is hired shall not abide with thee all night until the morning.","14":"Thou shalt not curse the deaf, nor put a stumblingblock before the blind, but shalt fear thy God: I *am* the LORD.","15":"Ye shall do no unrighteousness in judgment: thou shalt not respect the person of the poor, nor honour the person of the mighty: *but* in righteousness shalt thou judge thy neighbour.","16":"Thou shalt not go up and down *as* a talebearer among thy people: neither shalt thou stand against the blood of thy neighbour: I *am* the LORD.","17":"Thou shalt not hate thy brother in thine heart: thou shalt in any wise rebuke thy neighbour, and not suffer sin","18":"Thou shalt not avenge, nor bear any grudge against the children of thy people, but thou shalt love thy neighbour as thyself: I *am* the LORD.","19":"Ye shall keep my statutes. Thou shalt not let thy cattle gender with a diverse kind: thou shalt not sow thy field with mingled seed: neither shall a garment mingled of linen and woollen come","20":"And whosoever lieth carnally with a woman, that *is* a bondmaid, betrothed to an husband, and not at all redeemed, nor freedom given her; she shall be scourged; they shall not be put to death, because she was not free.","21":"And he shall bring his trespass offering unto the LORD, unto the door of the tabernacle of the congregation, *even* a ram for a trespass offering.","22":"And the priest shall make an atonement for him with the ram of the trespass offering before the LORD for his sin which he hath done: and the sin which he hath done shall be forgiven","23":"And when ye shall come into the land, and shall have planted all manner of trees for food, then ye shall count the fruit thereof as uncircumcised: three years shall it be as uncircumcised unto you: it shall not be eaten","24":"But in the fourth year all the fruit thereof shall be holy to praise the LORD","25":"And in the fifth year shall ye eat of the fruit thereof, that it may yield unto you the increase thereof: I *am* the LORD your God.","26":"Ye shall not eat *any thing* with the blood: neither shall ye use enchantment, nor observe times.","27":"Ye shall not round the corners of your heads, neither shalt thou mar the corners of thy beard.","28":"Ye shall not make any cuttings in your flesh for the dead, nor print any marks upon you: I *am* the LORD.","29":"Do not prostitute thy daughter, to cause her to be a whore; lest the land fall to whoredom, and the land become full of wickedness.","30":"Ye shall keep my sabbaths, and reverence my sanctuary: I *am* the LORD.","31":"Reg a-code=\"H6213\">doen</span>; Ik ben de HEERE!"},"koppeling_kjv":{"1":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","2":"<span class=\"wl wl-kjv\" data-code=\"H1696\">Speak</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Ye shall be <span class=\"wl wl-kjv\" data-code=\"H6918\">holy:</span> for I the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> am holy.","3":"Ye shall <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths:</span> I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","4":"<span class=\"wl wl-kjv\" data-code=\"H6437\">Turn</span> ye not unto <span class=\"wl wl-kjv\" data-code=\"H457\">idols,</span> nor <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> to yourselves <span class=\"wl wl-kjv\" data-code=\"H4541\">molten</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods:</span> I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","5":"And if ye <span class=\"wl wl-kjv\" data-code=\"H2076\">offer</span> a <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H2076\">offer</span> it at your own will.","6":"It shall be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> ye <span class=\"wl wl-kjv\" data-code=\"H2077\">offer</span> it, and on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow:</span> and if ought <span class=\"wl wl-kjv\" data-code=\"H3498\">remain</span> until the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> in the fire.","7":"And if it be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> at <span class=\"wl wl-kjv\" data-code=\"H398\">all</span> on the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> it is <span class=\"wl wl-kjv\" data-code=\"H6292\">abominable;</span> it shall not be accepted.","8":"Therefore every one that <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> it shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> his <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> because he hath <span class=\"wl wl-kjv\" data-code=\"H2490\">profaned</span> the hallowed <span class=\"wl wl-kjv\" data-code=\"H6944\">thing</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and that <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from among his people.","9":"And when ye <span class=\"wl wl-kjv\" data-code=\"H7114\">reap</span> the <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> of your <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> thou shalt not wholly <span class=\"wl wl-kjv\" data-code=\"H3615\">reap</span> the <span class=\"wl wl-kjv\" data-code=\"H6285\">corners</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> neither shalt thou <span class=\"wl wl-kjv\" data-code=\"H3950\">gather</span> the <span class=\"wl wl-kjv\" data-code=\"H3951\">gleanings</span> of thy harvest.","10":"And thou shalt not <span class=\"wl wl-kjv\" data-code=\"H5953\">glean</span> thy <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard,</span> neither shalt thou <span class=\"wl wl-kjv\" data-code=\"H3950\">gather</span> every <span class=\"wl wl-kjv\" data-code=\"H6528\">grape</span> of thy <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard;</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> them for the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> and <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger:</span> I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","11":"Ye shall not <span class=\"wl wl-kjv\" data-code=\"H1589\">steal,</span> neither deal <span class=\"wl wl-kjv\" data-code=\"H3584\">falsely,</span> neither <span class=\"wl wl-kjv\" data-code=\"H8266\">lie</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to another.","12":"And ye shall not <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> by my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H8267\">falsely,</span> neither shalt thou <span class=\"wl wl-kjv\" data-code=\"H2490\">profane</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of thy <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> I am the LORD.","13":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H6231\">defraud</span> thy <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> neither <span class=\"wl wl-kjv\" data-code=\"H1497\">rob</span> him: the <span class=\"wl wl-kjv\" data-code=\"H6468\">wages</span> of him that is <span class=\"wl wl-kjv\" data-code=\"H7916\">hired</span> shall not <span class=\"wl wl-kjv\" data-code=\"H3885\">abide</span> with thee all night until the morning.","14":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H7043\">curse</span> the <span class=\"wl wl-kjv\" data-code=\"H2795\">deaf,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H4383\">stumblingblock</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H5787\">blind,</span> but shalt <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> I am the LORD.","15":"Ye shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> no <span class=\"wl wl-kjv\" data-code=\"H5766\">unrighteousness</span> in <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment:</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H5375\">respect</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">person</span> of the <span class=\"wl wl-kjv\" data-code=\"H1800\">poor,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1921\">honour</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">person</span> of the <span class=\"wl wl-kjv\" data-code=\"H1419\">mighty:</span> but in <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> thy neighbour.","16":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> up and down as a <span class=\"wl wl-kjv\" data-code=\"H7400\">talebearer</span> among thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> neither shalt thou <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> against the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour:</span> I am the LORD.","17":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart:</span> thou shalt in any <span class=\"wl wl-kjv\" data-code=\"H3198\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H3198\">rebuke</span> thy <span class=\"wl wl-kjv\" data-code=\"H5997\">neighbour,</span> and not <span class=\"wl wl-kjv\" data-code=\"H5375\">suffer</span> sin","18":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H5358\">avenge,</span> nor bear any <span class=\"wl wl-kjv\" data-code=\"H5201\">grudge</span> against the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> but thou shalt <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> thy <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour</span> as <span class=\"wl wl-kjv\" data-code=\"H3644\">thyself:</span> I am the LORD.","19":"Ye shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes.</span> Thou shalt not let thy <span class=\"wl wl-kjv\" data-code=\"H929\">cattle</span> <span class=\"wl wl-kjv\" data-code=\"H7250\">gender</span> with a diverse <span class=\"wl wl-kjv\" data-code=\"H3610\">kind:</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H2232\">sow</span> thy <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> with mingled <span class=\"wl wl-kjv\" data-code=\"H3610\">seed:</span> neither shall a <span class=\"wl wl-kjv\" data-code=\"H899\">garment</span> <span class=\"wl wl-kjv\" data-code=\"H3610\">mingled</span> of linen and <span class=\"wl wl-kjv\" data-code=\"H8162\">woollen</span> come","20":"And <span class=\"wl wl-kjv\" data-code=\"H376\">whosoever</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lieth</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">carnally</span> with a <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> that is a <span class=\"wl wl-kjv\" data-code=\"H8198\">bondmaid,</span> <span class=\"wl wl-kjv\" data-code=\"H2778\">betrothed</span> to an <span class=\"wl wl-kjv\" data-code=\"H376\">husband,</span> and not at <span class=\"wl wl-kjv\" data-code=\"H6299\">all</span> <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed,</span> nor <span class=\"wl wl-kjv\" data-code=\"H2668\">freedom</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> her; she shall be <span class=\"wl wl-kjv\" data-code=\"H1244\">scourged;</span> they shall not be put to <span class=\"wl wl-kjv\" data-code=\"H4191\">death,</span> because she was not free.","21":"And he shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> his trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> even a <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> for a trespass offering.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for him with the <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> of the trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for his <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> which he hath <span class=\"wl wl-kjv\" data-code=\"H2398\">done:</span> and the <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> which he hath <span class=\"wl wl-kjv\" data-code=\"H2398\">done</span> shall be forgiven","23":"And when ye shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and shall have <span class=\"wl wl-kjv\" data-code=\"H5193\">planted</span> all manner of <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> for <span class=\"wl wl-kjv\" data-code=\"H3978\">food,</span> then ye shall <span class=\"wl wl-kjv\" data-code=\"H6188\">count</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> thereof as <span class=\"wl wl-kjv\" data-code=\"H6188\">uncircumcised:</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> shall it be as <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> unto you: it shall not be eaten","24":"But in the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> all the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> to <span class=\"wl wl-kjv\" data-code=\"H1974\">praise</span> the LORD","25":"And in the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> thereof, that it may <span class=\"wl wl-kjv\" data-code=\"H3254\">yield</span> unto you the <span class=\"wl wl-kjv\" data-code=\"H8393\">increase</span> thereof: I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","26":"Ye shall not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> any thing with the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood:</span> neither shall ye use <span class=\"wl wl-kjv\" data-code=\"H5172\">enchantment,</span> nor observe times.","27":"Ye shall not <span class=\"wl wl-kjv\" data-code=\"H5362\">round</span> the <span class=\"wl wl-kjv\" data-code=\"H6285\">corners</span> of your <span class=\"wl wl-kjv\" data-code=\"H7218\">heads,</span> neither shalt thou <span class=\"wl wl-kjv\" data-code=\"H7843\">mar</span> the <span class=\"wl wl-kjv\" data-code=\"H6285\">corners</span> of thy beard.","28":"Ye shall not <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> <span class=\"wl wl-kjv\" data-code=\"H3793\">any</span> <span class=\"wl wl-kjv\" data-code=\"H8296\">cuttings</span> in your <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> for the <span class=\"wl wl-kjv\" data-code=\"H5315\">dead,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5414\">print</span> any <span class=\"wl wl-kjv\" data-code=\"H7085\">marks</span> upon you: I am the LORD.","29":"Do not <span class=\"wl wl-kjv\" data-code=\"H2490\">prostitute</span> thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> to cause her to be a <span class=\"wl wl-kjv\" data-code=\"H2181\">whore;</span> lest the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> fall to <span class=\"wl wl-kjv\" data-code=\"H2181\">whoredom,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> become <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of wickedness.","30":"Ye shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths,</span> and <span class=\"wl wl-kjv\" data-code=\"H3372\">reverence</span> my <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary:</span> I am the LORD.","31":"<span class=\"wl wl-kjv\" data-code=\"H6437\">Regard</span> not them that have familiar <span class=\"wl wl-kjv\" data-code=\"H178\">spirits,</span> neither <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> after <span class=\"wl wl-kjv\" data-code=\"H3049\">wizards,</span> to be <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> by them: I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","32":"Thou shalt rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the hoary <span class=\"wl wl-kjv\" data-code=\"H7872\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H1921\">honour</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the old <span class=\"wl wl-kjv\" data-code=\"H2205\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> I am the LORD.","33":"And if a <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn</span> with thee in your <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> ye shall not vex","34":"But the <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> that <span class=\"wl wl-kjv\" data-code=\"H1481\">dwelleth</span> with you shall be unto you as one <span class=\"wl wl-kjv\" data-code=\"H249\">born</span> among you, and thou shalt <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> him as thyself; for ye were <span class=\"wl wl-kjv\" data-code=\"H1616\">strangers</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","35":"Ye shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> no <span class=\"wl wl-kjv\" data-code=\"H5766\">unrighteousness</span> in <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> in <span class=\"wl wl-kjv\" data-code=\"H4060\">meteyard,</span> in <span class=\"wl wl-kjv\" data-code=\"H4948\">weight,</span> or in measure.","36":"<span class=\"wl wl-kjv\" data-code=\"H6664\">Just</span> <span class=\"wl wl-kjv\" data-code=\"H3976\">balances,</span> <span class=\"wl wl-kjv\" data-code=\"H6664\">just</span> <span class=\"wl wl-kjv\" data-code=\"H68\">weights,</span> a <span class=\"wl wl-kjv\" data-code=\"H6664\">just</span> <span class=\"wl wl-kjv\" data-code=\"H374\">ephah,</span> and a <span class=\"wl wl-kjv\" data-code=\"H6664\">just</span> <span class=\"wl wl-kjv\" data-code=\"H1969\">hin,</span> shall ye have: I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which brought you <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","37":"Therefore shall ye <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> all my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> and all my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them: I am the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"heilig zijn,","tekst":"Dat is, leven naar al mijne wetten en geboden, rakende de zeden, ceremoniën en burgerlijke rechten, van welke alleen enige in dit hfdst. verhaald worden."},{"catchword":"heilig!","tekst":"Niet alleen in gedachten, woorden en werken, maar ook in het wezen de heiligheid zelve."}],"3":[{"catchword":"moeder en zijn vader vrezen,","tekst":"De moeder wordt hier voor den vader genoemd, omdat de kinderen in hunne jonkheid meest hunne moeder behoeven, en sommigen in haar ouderdom die meest plegen te verachten."},{"catchword":"Ik ben de HEERE, uw God!","tekst":"Zie boven, Lev 18:2. Alzo onder, vs.4, 10, 12, 14, enz."}],"4":[{"catchword":"afgoden niet keren,","tekst":"Het Hebreeuwse woord betekent eigenlijk nietige dingen, of, wat niet is. Waarom de apostel zeer wel zegt dat de afgod in de wereld niets is, 1Co 8:4, want het is een ijdel versiersel van des mensen ijdel hart; 1Sa 12:21."}],"5":[{"catchword":"een dankoffer den HEERE offeren zult,","tekst":"Zie boven, Lev 3:1."},{"catchword":"naar uw welgevallen zult gij dat offeren","tekst":"Dat is, met uw goede genegenheid en vrijwillig en onbedwongen voornemen; want deze dankoffers waren wel geboden, doch niet met een precies voorschrift, zodat ieder vrij was daarin te doen naardat hij zich in zijn hart geroerd bevond. Zie boven, Lev 7:16, en vergelijk dit met het vrijwillig brandoffer, boven, Lev 1:3."}],"7":[{"catchword":"enigszins gegeten wordt,","tekst":"Hebreeuws, etende gegeten wordt."},{"catchword":"het is een afgrijselijk ding,","tekst":"Zie boven, Lev 7:18."}],"8":[{"catchword":"ongerechtigheid dragen,","tekst":"Zie boven, Lev 5:1."},{"catchword":"het heilige des HEEREN ontheiligd heeft;","tekst":"Zie boven, Lev 5:15."},{"catchword":"zal dezelve ziel,","tekst":"Zie Gen 17:14."}],"9":[{"catchword":"van uw oogst op te zamelen is,","tekst":"Dat is het overblijfsel der aren, die nog op te rapen zijn."}],"10":[{"catchword":"niet nalezen,","tekst":"Te weten, nadat de beste druiven afgesneden zijn, en de aflezing des wijnbergs eens gedaan is."}],"11":[{"catchword":"niet liegen,","tekst":"Of, niet loochenen, dat gij iets van iemand in bewaring genomen hebt."}],"12":[{"catchword":"want gij zoudt","tekst":"Anders, en gij zult den naam uws Gods niet, enz."},{"catchword":"den Naam uws Gods ontheiligen;","tekst":"Zie boven, Lev 18:21."}],"13":[{"catchword":"arbeidsloon","tekst":"Hebreeuws, werk, of, arbeid. Zie Job 7:2; Jer 22:13, enz."}],"14":[{"catchword":"aanstoot zetten;","tekst":"Hetwelk hem zou mogen kwetsen, of doen vallen."}],"15":[{"catchword":"aangezicht des geringen niet aannemen,","tekst":"Dat is, niet achtnemen in het oordelen en vonnissen op de hoedanigheid der personen, maar op den eis en de gerechtigheid der zaak. Deze manier van spreken is ook Deu 10:17, en Psa 82:2. Vergelijk Deu 1:17, en Pro 24:23."},{"catchword":"het aangezicht des groten voortrekken;","tekst":"Dat is, hem gunstig zijn en voorstaan in zijn onrecht. Zie deze manier van spreken ook Exo 23:3."}],"16":[{"catchword":"zult niet wandelen","tekst":"Dat is, herwaarts en derwaarts te wandelen om kwade geruchten van zijn naasten te strooien, en nog andere te vernemen, om die weder uit te breiden. Zie deze manier van spreken ook Pro 11:13, en Pro 20:19; Jer 6:28, en Jer 9:4."},{"catchword":"achterklapper onder uw volken;","tekst":"Het Hebreeuwse woord betekent eigenlijk een, die over en weer wat overdraagt, naar de wijze van kramers, die van den een kopen en aan den ander verkopen. Alzo is het met den achterklapper, die van den een wat hoort en den ander dat aanzegt, tot zijn eigen profijt en zijns naasten schade."},{"catchword":"zult niet staan","tekst":"Dat is, gij zult uwen naaste niet alleen niet ombrengen, maar ook geen oorzaak zijn dat hij door valse getuigenis omgebracht worde."}],"17":[{"catchword":"broeder in uw hart niet haten;","tekst":"Dat is, uwen naaste. Zie Gen 19:7, en Gen 29:4, of, uw landsman. Zie Exo 2:11; 1Sa 30:23; Act 22:1, alwaar het woord broeder voor landslieden genomen wordt."},{"catchword":"naarstiglijk berispen,","tekst":"Hebreeuws, bestraffende bestraffen."},{"catchword":"de zonde in hem niet verdragen","tekst":"Anders, opdat gij de zonde voor hem, of, om zijnentwil niet draagt; dat is, de straf, die hij verdiend had, met hem niet draagt."}],"19":[{"catchword":"met tweeërlei zaad bezaaien,","tekst":"Alzo Deu 22:9."},{"catchword":"tweeërlei stof,","tekst":"Als van wol en linnen. Zie Deu 22:11."}],"20":[{"catchword":"bijligging des zaads,","tekst":"Vergelijk boven, Lev 18:22."},{"catchword":"man","tekst":"Versta, door hem, met wien zij ondertrouwd of getrouwd is geweest, en daarna door hem versmaad. Anders, bij een ieder versmaad; dat is, zo veracht, dat zij niet vrijgemaakt wordt maar in slavernij blijft."},{"catchword":"versmaad,","tekst":"Anders, aan een man ondertrouwd."},{"catchword":"geenszins gelost is,","tekst":"Hebreeuws, niet lossende gelost."},{"catchword":"die zullen gegeseld worden;","tekst":"Hebreeuws, geseling, of, slaan zal geschieden. Zie van deze straf Deu 25:2-3."},{"catchword":"vrij gemaakt","tekst":"Want indien zij vrij ware geweest, zou zij hebben moeten gedood worden; Deu 22:24."}],"23":[{"catchword":"zo zult gij de voorhuid daarvan,","tekst":"Dat is, gij zult de eerste vruchten voor onrein houden, als een voorhuid, en niet gebruiken, maar wegwerpen."},{"catchword":"onbesneden zijn,","tekst":"Dat is, onrein en dienvolgens niet bekwaam om genoten te worden."}],"24":[{"catchword":"een heilig ding zijn,","tekst":"Dat is, zij moest den Heere toegeheiligd zijn, om Hem te loven voor de onvruchtbaarheid der bomen, en hierom moest zij den priester gegeven worden, die de spijs huns Gods aten. Hebreeuws, heiligheid."}],"25":[{"catchword":"om het inkomen daarvan","tekst":"Dat is, opdat de Heere het inkomen daarvan voor ulieden vermeerdere."}],"26":[{"catchword":"vogelgeschrei acht geven,","tekst":"Het Hebreeuwse woordje betekent niet alleen uit de vogels, maar ook uit andere dingen iets opmerken en waarnemen, om door ijdele kunst iets, dat verborgen is, te openbaren of te voorzeggen. Alzo is dit woord ook gebruikt 2Ki 21:6; 2Ch 33:6."},{"catchword":"guichelarij plegen","tekst":"Het Hebreeuwse woord betekent met verbinding der ogen toveren, waardoor men meent te zien wat niet is; gelijk het door enigen genomen wordt Deu 18:10; 2Ki 21:6; 2Ch 33:6; Isa 2:6, en Isa 57:3; Jer 27:9. Anderen verstaan het van de dagverkiezing of waarzeggerij, uit het aanschouwen van de wolken en de gestaltenis des hemels, hetgeen sterrenkijkerij genoemd wordt."}],"28":[{"catchword":"dood lichaam","tekst":"Hebreeuws, ziel; dat is, om het dode lichaam eens mensen. Alzo onder, Lev 21:1, Lev 21:11, en Lev 22:4; Num 9:6; Psa 16:10."}],"30":[{"catchword":"vrezen;","tekst":"Of, In ere houden, mits na te volgen de wetten en ordinantiën, die daarin moeten onderhouden worden, en daarin niet te verschijnen, onbekwaam zijnde door afgoderij of enige andere zonde en onreinheid. Zie onder, Lev 26:2."}],"31":[{"catchword":"waarzeggers,","tekst":"Of, tot de waarzeggende geesten; want het woord betekent zowel de geesten, die over onbekende en verborgen dingen ondervraagd zijnde, antwoord gaven, zoals de waarzeggers, zo mannen als vrouwen die de geesten vraagden om antwoord te verkrijgen. Zij worden wel naar het algemene gebruik waarzeggers genoemd, maar zijn dezen naam inderdaad onwaardig, omdat zij menigmaal valsheid antwoorden, en de waarheid niet dan om te bedriegen en schade te doen. Zie van deze ook onder, Lev 20:27; Deu 18:11; 1Sa 28:3, 1Sa 28:9, 2Ki 21:6; 1Ch 10:13; Act 16:16."},{"catchword":"duivelskunstenaars;","tekst":"Het Hebreeuwse woord komt van weten, omdat deze lieden zich beroemden en uitgaven veel te weten, namelijk niet alleen wat geschied en anderen onbekend was, maar ook wat nog geschieden zou, en hiertoe ijdele en duivelse kunsten gebruikten. Zie van deze ook onder, Lev 20:6, Lev 20:27; 1Sa 28:3, 1Sa 28:9; Isa 8:19."}],"33":[{"catchword":"verdrukken","tekst":"Het woord betekent iemand òf door onwetendheid, òf wetens en willens, ja ook met geweld in het zijne verkorten en ongelijk doen."}],"35":[{"catchword":"de el,","tekst":"Versta, allen regel van handmaat of voetmaat, of enig instrument waarmede men de lengte of breedte van enige dingen, die vast aan elkander zijn, meet."},{"catchword":"maat","tekst":"Dat is, waarmede men enige natte waren of ook droge, die niet vast aaneen zijn, meet."}],"36":[{"catchword":"weegstenen,","tekst":"Dat is, gewicht; want het was gebruikelijk, dat zij op de waag of schaal stenen inplaats van gewicht legden. Zie ook Deu 25:13, Deu 25:15; Pro 16:11; Mic 6:11."},{"catchword":"efa,","tekst":"Zie boven, Lev 5:11."},{"catchword":"hin;","tekst":"Dit was een maat van natte waren, houdende zoveel als twee en zeventig gewone hoendereieren. Zie van dezelve Exo 29:40, en onder, Lev 23:13; Num 15:4, Num 15:9."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Moreover the LORD spoke unto Moseh, saying:"}],"2":[{"catchword":null,"tekst":"Speak to all the Congregation of the children of Israel, and say to them; ye shall be holy: [i.e. live according to all my Laws and Commandments, in all matters Moral, Ceremonial, and Civil; of all which, some are rehearsed in this Chapter] for I the LORD your God, am holy. [not only thoughts, words and deeds, but also in my being , and essence, holiness itself]"}],"4":[{"catchword":null,"tekst":"Ye shall not turn your selves to the idols, [The Hebrew word doth properly signify things of nothing, or, that are not; wherefore the Apostle saith well, that the idol is nothing in the world, 1 Cor. 8. 4. for it is but a vain Ceremony of the vain heart of man, 1 Sam. 12. 21.] and make you no molten gods: I am the LORD your God."}],"5":[{"catchword":null,"tekst":"And when ye shall offer a Thank-offering [See above chap. 3. on verse 1.] unto the LORD, ye shall offer the same according to your well pleasing; [ i.e. of your own accord, free, willingly, and cheerfully, without any constraint. For these thank-offerings were enjoined indeed, yet not precisely limited; so that every one might dispose therein, according as he found his heart disposed. See above chap. 7. verse 16. and compare this with the free-will-burnt-offering, above chap. 1. verse 3.]"}],"6":[{"catchword":null,"tekst":"It shall be eaten on the day of your offering, and the second day : but that which remaineth over on the third day, shall be burnt with fire."}],"7":[{"catchword":null,"tekst":"And if on the third day it be eaten at all, [Heb. eating, eaten] it is an abominable thing, [see above chap. 7. on verse 18.] it shall not be acceptable."}],"8":[{"catchword":null,"tekst":"And whoso eateth that, he shall bear his iniquity, [see above chap. 5. on verse 1.] for having prophaned (unhallowed) the holy (thing) of the LORD; [see above chap. 5. on verse 15.] therefore shall that soul be extirpated out of her people. [See Gen. 17. on verse 14.]"}],"9":[{"catchword":null,"tekst":"Likewise when ye shall Harvest in the Harvest of your Land, thou shalt not wholly Harvest off the corner of thy field; and not gather up that which is to be gathered of thy Harvest. [i.e. the residue or remainder of the scattered ears, that are to be gathered up yet.]"}],"10":[{"catchword":null,"tekst":"In like manner shalt thou not glean thy Vineyard, [viz. after that the principal grapes shall be cut off, and the gathering of the Vintage is done, the Vineyard being once over with gathering] and gather up the grapes fallen off from thy Vineyard: thou shall let them remain for the poor and the stranger; I am the LORD thy God."}],"11":[{"catchword":null,"tekst":"Ye shall not steal: and ye shall not lie [Or, not deny, what ye have taken in custody to keep for others] nor deal falsely every one against his neighbor."}],"12":[{"catchword":null,"tekst":"And ye shall not swear falsely by my Name: for ye would [Oth. and ye shall not] prophane the Name of your God: [See above chap. 18. on verse 21.] I am the LORD."}],"13":[{"catchword":null,"tekst":"Thou shalt not oppress nor rob thy neighbor deceitfully: the wages (or hire) [Heb. work, or labour. See Job 7. on verse 1. Jer. 22. on verse 13, etc.] of the day-labourer shall not lodge with thee till the morning."}],"14":[{"catchword":null,"tekst":"Thou shalt not curse the deaf nor set any offence (stumbling-block) before the face of the blind: fear before thy God; I am the LORD."}],"15":[{"catchword":null,"tekst":"Ye shall do no wrong in judgement; Thou shalt not receive the face of the poor, [i.e. in judging and sentencing, not regard the qualification or condition of men&acirc;&euro;&trade;s persons, but judge and pronounce according to the merit and justice of the cause. See the same phrase, Deut. 10. 17. and Psalm 82. 2. Compare Deut. 1. 17. and Prov. 24. 23. ] nor prefer the face of the great: [i.e. not favour nor further him in his wrongful cause. See the like phrase, Exod. 23. 3.] in righteousness shalt thou judge thy neighbor."}],"16":[{"catchword":null,"tekst":"Thou shalt not walk (as) a Tale-bearer, among thy people; [i.e. thou shalt not go up and down, or here and there, so spread ill rumours of thy neighbor, and to catch up others every where for to spread them. See the like phrase Prov. 11. 13. and 20. 19. Jer. 6. 28. and 9. 4. The Hebrew word here rendered Tale-bearer, doth properly signify one, that carrieth things about after the manner of Pedlers, buying something of one body, and by and by selling it again to another. For thus it is with such Tale-bearers, hearing somewhat of one, and by and by telling it another, for some paultry profit, to the abuse of his neighbor.] Thou shalt not stand against the blood of thy neighbor: [i.e. thou shalt not only not kill thy neighbor, but likewise not be instrumental, that through false witness, he may be put to death] I am the LORD."}],"17":[{"catchword":null,"tekst":"Thou shalt not hate thy brother, [i.e. thy neighbor: see Gen. 19. on verse 7. and 29. 4. or, thy country-man. See Exod. 2. 11. 1 Sam. 30. 23. Rev. 22. 1. where the brother is taken for Country-men] in thy heart: thou shalt carefully reprove [Heb. rebuking, rebuke] thy neighbor, and shall not suffer the sin in him. [Oth. that thou do not bear the sin for him, or, for his sake: meaning the punishment he deserved, being made to bear the same with him.]"}],"18":[{"catchword":null,"tekst":"Thou shalt not avenge, nor keep (anger) against the children of thy people; but thou shalt love thy neighbour as thy self: I am the LORD."}],"19":[{"catchword":null,"tekst":"Ye shall keep my Institutions; Thou shalt not suffer any two kind of thy beasts to have to do together: Thou shalt not sow thy field with two sorts (of seed) [So Deut. 22. verse 9.] and a garment of two sorts-stuff, intermingled, [ as of woolen and linen. See Deut. 22. 11.] shall not come upon thee."}],"20":[{"catchword":null,"tekst":"And when a man shall have lain with a woman, by copulation of seed, [Compare above chap. 18. 22.] that is a maid-servant, despised by the man, [understand him, to whom she was betrothed, or married, and afterwards despised and abandoned by him. Oth. by every one despised, i.e. so much despised, that she was not made free, but left in slavery or bondage. Oth. betrothed to a man] and is not redeemed at all, [Heb. not redeeming, redeemed] nor any freedom is given her: they shall scourged; [Heb. scourging, or, beating, shall be (made) See of this punishment, Deut. 25. 2, 3.] they shall not be put to death; for she was not made free. [If she had been made free, she must have been put to death, Deut 22. 24.]"}],"21":[{"catchword":null,"tekst":"And he shall bring his guilt-offering to the LORD, at the door of the Tent of the Congregation, a Ram for a guilt-offering."}],"22":[{"catchword":null,"tekst":"And the Priest shall make expiation for him, with the Ram of the guilt-offering, over his sin, which he hath sinned, before the face of the LORD; and forgiveness shall he made him for the sin, he sinned."}],"23":[{"catchword":null,"tekst":"Also when ye shall be come into the Land, and have planted every Tree for food, ye shall circumcise the foreskin therefore, its fruit: [i.e. ye shall hold the first-fruits thereof unclean, like the foreskin, and not use but throw away the same] three years it shall be uncircumcised to you, [i.e. unclean, and consequently unfit for use] there shall be nothing eaten of it."}],"24":[{"catchword":null,"tekst":"But in the fourth year all his fruit shall be a holy thing, [They were to be consecrated to the LORD, to praise him for the fruitfulness of the Trees: and therefore they were to be given to the Priests, who did eat the food prepared for, and dedicated unto God. Heb. holiness] for praise-giving to the LORD."}],"25":[{"catchword":null,"tekst":"And in the fifth year ye shall eat the fruit thereof, for to multiply the revenue thereof for you] I am the LORD thy God."}],"26":[{"catchword":null,"tekst":"Ye shall eat nothing with the blood: ye shall give heed to no bird&acirc;&euro;&trade;s noise (or Augury) [The Hebrew phrase signifieth to make observations, and take notice both of birds and other things, through vain arts, thereby to reveal, or prognosticate and foretell future and hidden matters. Thus this word is likewise used, 1 Kings 21. 6. 2 Chron. 33. 6.] nor use juggling. [The Hebrew word seem to see, what they see not; as by some it is t (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
