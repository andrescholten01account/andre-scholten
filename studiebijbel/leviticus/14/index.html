ohannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Daarna sprak de HEERE tot Mozes en zei:","2":"Dit zal de wet zijn voor de melaatse, op de dag van zijn reiniging: dat hij naar de priester wordt gebracht.","3":"En de priester zal het leger uit gaan; als de priester merkt dat, zie, die plaag van de melaatsheid van de melaatse genezen is,","4":"zal de priester gebieden dat men voor hem die te reinigen is twee levende reine vogels neemt, alsook cederhout, en scharlaken, en hysop.","5":"De priester zal ook gebieden dat men de ene vogel slacht, in een aarden vat, over levend water.","6":"Die levende vogel zal hij nemen, en het cederhout, en het scharlaken, en de hysop; en zal die, en de levende vogel, dopen in het bloed van de vogel die boven het levende water geslacht is.","7":"En hij zal over hem die van de melaatsheid te reinigen is, zevenmaal sprengen; daarna zal hij hem rein verklaren, en de levende vogel in het open veld laten vliegen.","8":"Die nu te reinigen is, zal zijn kleren wassen, en al zijn haar afscheren, en zich in het water afwassen, dan zal hij rein zijn; daarna zal hij in het leger komen, maar zal buiten zijn tent zeven dagen blijven.","9":"En op de zevende dag zal gebeuren dat hij al zijn haar afscheert, zijn hoofd, en zijn baard, en de wenkbrauwen van zijn ogen; ja, al zijn haar zal hij afscheren, en al zijn kleren wassen, en zijn lichaam met water baden, dan zal hij rein zijn.","10":"En op de achtste dag zal hij twee volkomen lammeren, en een eenjarig volkomen schaap nemen, alsook drie tienden meelbloem als spijsoffer, met olie gemengd, en een log olie.","11":"De priester nu, die de reiniging doet, zal de man die te reinigen is, en die dingen, stellen voor het aangezicht van de HEERE, aan de deur van de tent der samenkomst.","12":"En de priester zal dat ene lam nemen, en het offeren als schuldoffer met de log olie; en zal die als beweegoffer voor het aangezicht van de HEERE bewegen.","13":"Daarna zal hij dat lam slachten op de plaats waar men het zondoffer en het brandoffer slacht, in de heilige plaats; want het schuldoffer, evenals het zondoffer, is voor de priester; het is allerheiligst.","14":"En de priester zal van het bloed van het schuldoffer nemen, dat de priester doen zal op het lapje van het rechteroor van hem die te reinigen is, en op de duim van zijn rechterhand, en op de grote teen van zijn rechtervoet.","15":"De priester zal ook uit de log olie nemen, en zal ze op de linkerhand van de priester gieten.","16":"Dan zal de priester zijn rechtervinger indopen, *nemende* van die olie die in zijn linkerhand is, en zal met zijn vinger van die olie zevenmaal sprengen, voor het aangezicht van de HEERE.","17":"En van de rest van die olie die in zijn hand zal zijn, zal de priester doen op het lapje van het rechteroor van hem die te reinigen is, en op de duim van zijn rechterhand, en op de grote teen van zijn rechtervoet, boven op het bloed van het schuldoffer.","18":"Wat nog over is van die olie, die in de hand van de priester geweest is, zal hij doen op het hoofd van hem die te reinigen is; zo zal de priester over hem verzoening doen voor het aangezicht van de HEERE.","19":"De priester zal ook het zondoffer bereiden, en voor hem die van zijn onreinheid te reinigen is verzoening doen; en daarna zal hij het brandoffer slachten.","20":"En de priester zal dat brandoffer en dat spijsoffer op het altaar offeren; zo zal de priester de verzoening voor hem doen, en hij zal rein zijn.","21":"Maar als hij arm is, en zijn hand *dat* niet bereikt, zal hij een lam als schuldoffer, ter beweging, nemen, om voor hem verzoening te doen; daartoe een tiende meelbloem, met olie gemengd, als spijsoffer, en een log olie;","22":"alsook twee tortelduiven, of twee jonge duiven, die zijn hand bereiken kan, waarvan de ene als zondoffer, en de andere als brandoffer zal zijn.","23":"En hij zal die, op de achtste dag van zijn reiniging, naar de priester brengen, aan de deur van de tent der samenkomst, voor het aangezicht van de HEERE.","24":"En de priester zal het lam van het schuldoffer, en de log olie nemen; en de priester zal die als beweegoffer voor het aangezicht van de HEERE bewegen.","25":"Daarna zal hij het lam van het schuldoffer slachten, en de priester zal van het bloed van het schuldoffer nemen, en doen op het rechteroorlapje van hem die te reinigen is, en op de duim van zijn rechterhand, en op de grote teen van zijn rechtervoet.","26":"Ook zal de priester van die olie op de linkerhand van de priester gieten.","27":"Daarna zal de priester met zijn rechtervinger van die olie, die op zijn linkerhand is, sprengen, zevenmaal, voor het aangezicht van de HEERE.","28":"En de priester zal van de olie die op zijn hand is, doen aan het lapje van het rechteroor van hem die te reinigen is, en aan de duim van zijn rechterhand, en aan de grote teen van zijn rechtervoet, op de plaats van het bloed van het schuldoffer.","29":"En wat over is van de olie, die in de hand van de priester is, zal hij doen op het hoofd van hem die te reinigen is, om de verzoening voor hem te doen, voor het aangezicht van de HEERE.","30":"Daarna zal hij de ene van de tortelduiven, of van de jonge duiven, bereiden, van wat zijn hand bereiken kan.","31":"Van wat zijn hand bereiken kan, zal de ene als zondoffer, en de andere als brandoffer zijn, naast het spijsoffer; zo zal de priester voor hem die te reinigen is, verzoening doen voor het aangezicht van de HEERE.","32":"Dit is de wet van hem in wie de plaag van de melaatsheid is, wiens hand voor zijn reiniging *dat* niet bereiken kan.","33":"Verder sprak de HEERE tot Mozes en tot Aäron en zei:","34":"Als u gekomen zult zijn in het land Kanaän, dat Ik u tot bezitting geven zal, en Ik de plaag van de melaatsheid aan een huis van dat land van uw bezitting gegeven zal hebben,","35":"zal hij, van wie dat huis is, komen, en het de priester te kennen geven en zeggen: Het schijnt mij, alsof er een plaag in het huis is.","36":"En de priester zal gebieden dat zij dat huis ruimen, voordat de priester komt om die plaag te bezien, zodat niet alles wat in dat huis is onrein wordt; en daarna zal de priester komen om dat huis te bezien.","37":"Als hij die plaag bezien zal, en zie, die plaag is aan de wanden van dat huis in groenachtige of roodachtige kuiltjes, en hun aanzien lager is dan die wand,","38":"zal de priester uit dat huis gaan, naar de deur van het huis, en hij zal dat huis zeven dagen laten toesluiten.","39":"Daarna zal de priester op de zevende dag terugkeren; als hij merkt dat, zie, die plaag aan de wanden van dat huis uitgespreid is,","40":"zal de priester gebieden dat zij de stenen waarin die plaag is, uitbreken, en die tot buiten de stad werpen, op een onreine plaats;","41":"en dat huis zal hij rondom van binnen laten schrapen, en zij zullen het stof dat zij afgeschraapt hebben, tot buiten de stad op een onreine plaats uitstorten.","42":"Daarna zullen zij andere stenen nemen, en in de plaats van die stenen brengen; en men zal ander leem nemen, en dat huis bestrijken.","43":"Maar als die plaag terugkeert, en in dat huis uitbot, nadat men de stenen uitgebroken heeft, en na het afschrapen van het huis, en nadat het bestreken zal zijn,","44":"zal de priester komen; als hij nu merkt dat, zie, die plaag aan dat huis uitgespreid is, is het een knagende melaatsheid in dat huis, het is onrein.","45":"Daarom zal men dat huis, zijn stenen, en zijn hout helemaal afbreken, alsook al het leem van het huis, en men zal het tot buiten de stad uitvoeren, op een onreine plaats.","46":"En wie in dat huis gaat op enige dag dat men het toegesloten heeft, zal onrein zijn tot aan de avond.","47":"Wie ook in dat huis ligt te slapen, zal zijn kleren wassen; evenzo, wie in dat huis eet, zal zijn kleren wassen.","48":"Maar als de priester weer ingegaan zal zijn, en merkt dat, zie, die plaag aan dat huis niet uitgespreid is, nadat het huis bestreken zal zijn, zal de priester dat huis rein verklaren, omdat die plaag genezen is.","49":"Daarna zal hij, om dat huis te ontzondigen, twee vogeltjes nemen, alsook cederhout, en scharlaken, en hysop.","50":"En hij zal de ene vogel slachten in een aarden vat, over levend water.","51":"Dan zal hij dat cederhout, en die hysop, en het scharlaken, en de levende vogel nemen, en zal die in het bloed van de geslachte vogel en in het levende water dopen; en hij zal dat huis zevenmaal besprengen.","52":"Zo zal hij dat huis ontzondigen met het bloed van de vogel, en met dat levende water, en met de levende vogel, en met dat cederhout, en met de hysop, en met het scharlaken.","53":"De levende vogel nu zal hij tot buiten de stad, in het open veld, laten vliegen; zo zal hij over het huis verzoening doen, en het zal rein zijn.","54":"Dit is de wet voor elke plaag van de melaatsheid, en voor schurftheid;","55":"en voor melaatsheid van de kleren, en van de huizen;","56":"alsook voor gezwel, en voor gezweer, en voor blaren;","57":"om te leren op welke dag iets onrein, en op welke dag iets rein is. Dit is de wet van de melaatsheid."},"SV":{"1":"Daarna sprak de HEERE tot Mozes, zeggende:","2":"Dit zal de wet des melaatsen zijn, ten dage zijner reiniging: dat hij tot den priester zal gebracht worden.","3":"En de priester zal buiten het leger gaan; als de priester merken zal, dat, ziet, die plaag der melaatsheid van den melaatse genezen is;","4":"Zo zal de priester gebieden, dat men voor hem, die te reinigen zal zijn, twee levende reine vogelen neme, mitsgaders cederenhout, en scharlaken, en hysop.","5":"De priester zal ook gebieden, dat men den ene vogel slachte, in een aarden vat, over levend water.","6":"Dien levenden vogel zal hij nemen, en het cederhout, en het scharlaken, en den hysop; en zal die, en den levenden vogel dopen in het bloed des vogels, die boven het levende water geslacht is.","7":"En hij zal over hem, die van de melaatsheid te reinigen is, zevenmaal sprengen; daarna zal hij hem rein verklaren, en den levenden vogel in het open veld vliegen laten.","8":"Die nu te reinigen is, zal zijn klederen wassen, en al zijn haar afscheren, en zich in het water afwassen, zo zal hij rein zijn; daarna zal hij in het leger komen, maar zal buiten zijn tent zeven dagen blijven.","9":"En op den zevenden dag zal het geschieden, dat hij al zijn haar zal afscheren, zijn hoofd, en zijn baard, en de wenkbrauwen zijner ogen; ja, al zijn haar zal hij afscheren, en al zijn klederen wassen, en zijn vlees met water baden, zo zal hij rein zijn.","10":"En op den achtsten dag zal hij twee volkomen lammeren, en een eenjarig volkomen schaap nemen, mitsgaders drie tienden meelbloem ten spijsoffer, met olie gemengd, en een log olie.","11":"De priester nu, die de reiniging doet, zal den man, die te reinigen is, en die dingen, stellen voor het aangezicht des HEEREN, aan de deur van de tent der samenkomst.","12":"En de priester zal dat ene lam nemen, en hetzelve offeren tot een schuldoffer met den log olie; en zal die ten beweegoffer voor het aangezicht des HEEREN bewegen.","13":"Daarna zal hij dat lam slachten in de plaats, waar men het zondoffer en het brandoffer slacht, in de heilige plaats; want het schuldoffer, gelijk het zondoffer, is voor den priester; het is een heiligheid der heiligheden.","14":"En de priester zal van het bloed des schuldoffers nemen, hetwelk de priester doen zal op het lapje van het rechteroor desgenen, die te reinigen is, en op den duim zijner rechterhand, en op den groten teen zijns rechtervoets.","15":"De priester zal ook uit den log der olie nemen, en zal ze op des priesters linkerhand gieten.","16":"Dan zal de priester zijn rechtervinger indopen, *nemende* van die olie, die in zijn linkerhand is, en zal met zijn vinger van die olie zevenmaal sprengen, voor het aangezicht des HEEREN.","17":"En van het overige van die olie, die in zijn hand zal zijn, zal de priester doen op het lapje van het rechteroor desgenen, die te reinigen is, en op den duim zijner rechterhand, en op den groten teen zijns rechtervoets, boven op het bloed des schuldoffers.","18":"Dat nog overgebleven zal zijn van die olie, die in de hand des priesters geweest is, zal hij doen op het hoofd desgenen, die te reinigen is; zo zal de priester over hem verzoening doen voor het aangezicht des HEEREN.","19":"De priester zal ook het zondoffer bereiden, en voor hem, die van zijn onreinigheid te reinigen is, verzoening doen; en daarna zal hij het brandoffer slachten.","20":"En de priester zal dat brandoffer en dat spijsoffer op het altaar offeren; zo zal de priester de verzoening voor hem doen, en hij zal rein zijn.","21":"Maar indien hij arm is, en zijn hand *dat* niet bereikt, zo zal hij een lam ten schuldoffer, ter beweging nemen, om voor hem verzoening te doen; daartoe een tiende meelbloem, met olie gemengd, ten spijsoffer, en een log olie;","22":"Mitsgaders twee tortelduiven, of twee jonge duiven, die zijn hand bereiken zal, welker ene ten zondoffer, en een ten brandoffer zijn zal.","23":"En hij zal die, op den achtsten dag zijner reiniging, tot den priester brengen, aan de deur van de tent der samenkomst, voor het aangezicht des HEEREN.","24":"En de priester zal het lam des schuldoffers, en den log der olie nemen; en de priester zal die ten beweegoffer voor het aangezicht des HEEREN bewegen.","25":"Daarna zal hij het lam des schuldoffers slachten, en de priester zal van het bloed des schuldoffers nemen, en doen op het rechteroorlapje desgenen, die te reinigen is, en op den duim zijner rechterhand, en op den groten teen zijns rechtervoets.","26":"Ook zal de priester van die olie op des priesters linkerhand gieten.","27":"Daarna zal de priester met zijn rechtervinger van die olie, die op zijn linkerhand is, sprengen, zevenmaal, voor het aangezicht des HEEREN.","28":"En de priester zal van de olie, die op zijn hand is, doen aan het lapje van het rechteroor desgenen, die te reinigen is, en aan den duim zijner rechterhand, en aan den groten teen zijns rechtervoets, op de plaats van het bloed des schuldoffers.","29":"En het overgeblevene van de olie, die in de hand des priesters is, zal hij doen op het hoofd desgenen, die te reinigen is, om de verzoening voor hem te doen, voor het aangezicht des HEEREN.","30":"Daarna zal hij de ene van de tortelduiven, of van de jonge duiven bereiden, van hetgeen zijn hand bereikt zal hebben.","31":"Van hetgeen zijn hand bereikt zal hebben, zal het een ten zondoffer, en het een ten brandoffer zijn, boven het spijsoffer; zo zal de priester voor hem, die te reinigen is, verzoening doen voor het aangezicht des HEEREN.","32":"Dit is de wet *desgenen*, in wien de plaag der melaatsheid zal zijn, wiens hand in zijn reiniging *dat* niet bereikt zal hebben.","33":"Verder sprak de HEERE tot Mozes en tot Aäron, zeggende:","34":"Als gij zult gekomen zijn in het land van Kanaän, hetwelk Ik u tot bezitting geven zal, en Ik de plaag der melaatsheid aan een huis van dat land uwer bezitting zal gegeven hebben;","35":"Zo zal hij, van wien dat huis is, komen, en den priester te kennen geven, zeggende: Het schijnt mij, alsof er een plaag in het huis ware.","36":"En de priester zal gebieden, dat zij dat huis ruimen, aleer de priester komt, om die plaag te bezien, opdat niet al wat in dat huis is, onrein worde; en daarna zal de priester komen, om dat huis te bezien.","37":"Als hij die plaag bezien zal, dat, ziet, die plaag aan de wanden van dat huis zijn groenachtige of roodachtige kuiltjes, en hun aanzien lager is dan die wand;","38":"De priester zal uit dat huis uitgaan, aan de deur van het huis, en hij zal dat huis zeven dagen doen toesluiten.","39":"Daarna zal de priester op den zevenden dag wederkeren; indien hij merken zal, dat, ziet, die plaag aan de wanden van dat huis uitgespreid is;","40":"Zo zal de priester gebieden, dat zij de stenen, in welke die plaag is, uitbreken, en dezelve tot buiten de stad werpen, aan een onreine plaats;","41":"En dat huis zal hij rondom van binnen doen schrabben, en zij zullen het stof, dat zij afgeschrabd hebben, tot buiten de stad aan een onreine plaats uitstorten.","42":"Daarna zullen zij andere stenen nemen, en in de plaats van gene stenen brengen; en men zal ander leem nemen, en dat huis bestrijken.","43":"Maar indien die plaag wederkeert, en in dat huis uitbot, nadat men de stenen uitgebroken heeft, en na het afschrabben van het huis, en nadat het zal bestreken zijn;","44":"Zo zal de priester komen; als hij nu zal merken, dat, ziet, die plaag aan dat huis uitgespreid is, het is een knagende melaatsheid in dat huis, het is onrein.","45":"Daarom zal men dat huis, zijn stenen, en zijn hout even afbreken, mitsgaders al het leem van het huis, en men zal het tot buiten de stad uitvoeren, aan een onreine plaats.","46":"En die in dat huis gaat te enigen dage, als men hetzelve zal toegesloten hebben, zal onrein zijn tot aan den avond.","47":"Die ook in dat huis te slapen ligt, zal zijn klederen wassen; insgelijks, die in dat huis eet, zal zijn klederen wassen.","48":"Maar als de priester zal weder ingegaan zijn, en zal merken, dat, ziet, die plaag aan dat huis niet uitgespreid is, nadat het huis zal bestreken zijn; zo zal de priester dat huis rein verklaren, dewijl die plaag genezen is.","49":"Daarna zal hij, om dat huis te ontzondigen, twee vogeltjes nemen, mitsgaders cederenhout, en scharlaken, en hysop.","50":"En hij zal den enen vogel slachten in een aarden vat, over levend water.","51":"Dan zal hij dat cederenhout, en dien hysop, en het scharlaken, en den levenden vogel nemen, en zal die in het bloed des geslachten vogels en in het levende water dopen; en hij zal dat huis zevenmaal besprengen.","52":"Zo zal hij dat huis ontzondigen met het bloed des vogels, en met dat levend water, en met den levenden vogel, en met dat cederenhout, en met den hysop, en met het scharlaken.","53":"Den levenden vogel nu zal hij tot buiten de stad, in het open veld, laten vliegen; zo zal hij over het huis verzoening doen, en het zal rein zijn.","54":"Dit is de wet voor alle plage der melaatsheid, en voor schurftheid;","55":"En voor melaatsheid der klederen, en der huizen;","56":"Mitsgaders voor gezwel, en voor gezweer, en voor blaren;","57":"Om te leren, op welken dag iets onrein, en op welken dag iets rein is. Dit is de wet der melaatsheid."},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"This shall be the law of the leper in the day of his cleansing: He shall be brought unto the priest:","3":"And the priest shall go forth out of the camp; and the priest shall look, and, behold, *if* the plague of leprosy be healed in the leper;","4":"Then shall the priest command to take for him that is to be cleansed two birds alive *and* clean, and cedar wood, and scarlet, and hyssop:","5":"And the priest shall command that one of the birds be killed in an earthen vessel over running water:","6":"As for the living bird, he shall take it, and the cedar wood, and the scarlet, and the hyssop, and shall dip them and the living bird in the blood of the bird *that was* killed over the running water:","7":"And he shall sprinkle upon him that is to be cleansed from the leprosy seven times, and shall pronounce him clean, and shall let the living bird loose into the open field.","8":"And he that is to be cleansed shall wash his clothes, and shave off all his hair, and wash himself in water, that he may be clean: and after that he shall come into the camp, and shall tarry abroad out of his tent seven days.","9":"But it shall be on the seventh day, that he shall shave all his hair off his head and his beard and his eyebrows, even all his hair he shall shave off: and he shall wash his clothes, also he shall wash his flesh in water, and he shall be clean.","10":"And on the eighth day he shall take two he lambs without blemish, and one ewe lamb of the first year without blemish, and three tenth deals of fine flour *for* a meat offering, mingled with oil, and one log of oil.","11":"And the priest that maketh *him* clean shall present the man that is to be made clean, and those things, before the LORD, *at* the door of the tabernacle of the congregation:","12":"And the priest shall take one he lamb, and offer him for a trespass offering, and the log of oil, and wave them *for* a wave offering before the LORD:","13":"And he shall slay the lamb in the place where he shall kill the sin offering and the burnt offering, in the holy place: for as the sin offering *is* the priest's, *so is* the trespass offering: it *is* most holy:","14":"And the priest shall take *some* of the blood of the trespass offering, and the priest shall put *it* upon the tip of the right ear of him that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot:","15":"And the priest shall take *some* of the log of oil, and pour *it* into the palm of his own left hand:","16":"And the priest shall dip his right finger in the oil that *is* in his left hand, and shall sprinkle of the oil with his finger seven times before the LORD:","17":"And of the rest of the oil that *is* in his hand shall the priest put upon the tip of the right ear of him that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot, upon the blood of the trespass offering:","18":"And the remnant of the oil that *is* in the priest's hand he shall pour upon the head of him that is to be cleansed: and the priest shall make an atonement for him before the LORD.","19":"And the priest shall offer the sin offering, and make an atonement for him that is to be cleansed from his uncleanness; and afterward he shall kill the burnt offering:","20":"And the priest shall offer the burnt offering and the meat offering upon the altar: and the priest shall make an atonement for him, and he shall be clean.","21":"And if he *be* poor, and cannot get so much; then he shall take one lamb *for* a trespass offering to be waved, to make an atonement for him, and one tenth deal of fine flour mingled with oil for a meat offering, and a log of oil;","22":"And two turtledoves, or two young pigeons, such as he is able to get; and the one shall be a sin offering, and the other a burnt offering.","23":"And he shall bring them on the eighth day for his cleansing unto the priest, unto the door of the tabernacle of the congregation, before the LORD.","24":"And the priest shall take the lamb of the trespass offering, and the log of oil, and the priest shall wave them *for* a wave offering before the LORD:","25":"And he shall kill the lamb of the trespass offering, and the priest shall take *some* of the blood of the trespass offering, and put *it* upon the tip of the right ear of him that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot:","26":"And the priest shall pour of the oil into the palm of his own left hand:","27":"And the priest shall sprinkle with his right finger *some* of the oil that *is* in his left hand seven times before the LORD:","28":"And the priest shall put of the oil that *is* in his hand upon the tip of the right ear of him that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot, upon the place of the blood of the trespass offering:","29":"And the rest of the oil that *is* in the priest's hand he shall put upon the head of him that is to be cleansed, to make an atonement for him before the LORD.","30":"And he shall offer the one of the turtledoves, or of the young pigeons, such as he can get;","31":"*Even* such as he is able to get, the one *for* a sin offering, and the other *for* a burnt offering, with the meat offering: and the priest shall make an atonement for him that is to be cleansed before the LORD.","32":"This *is* the law *of him* in whom *is* the plague of leprosy, whose hand is not able to get *that which pertaineth* to his cleansing.","33":"And the LORD spake unto Moses and unto Aaron, saying,","34":"When ye be come into the land of Canaan, which I give to you for a possession, and I put the plague of leprosy in a house of the land of your possession;","35":"And he that owneth the house shall come and tell the priest, saying, It seemeth to me *there is* as it were a plague in the house:","36":"Then the priest shall command that they empty the house, before the priest go *into it* to see the plague, that all that *is* in the house be not made unclean: and afterward the priest shall go in to see the house:","37":"And he shall look on the plague, and, behold, *if* the plague *be* in the walls of the house with hollow strakes, greenish or reddish, which in sight *are* lower than the wall;","38":"Then the priest shall go out of the house to the door of the house, and shut up the house seven days:","39":"And the priest shall come again the seventh day, and shall look: and, behold, *if* the plague be spread in the walls of the house;","40":"Then the priest shall command that they take away the stones in which the plague *is*, and they shall cast them into an unclean place without the city:","41":"And he shall cause the house to be scraped within round about, and they shall pour out the dust that they scrape off without the city into an unclean place:","42":"And they shall take other stones, and put *them* in the place of those stones; and he shall take other morter, and shall plaister the house.","43":"And if the plague come again, and break out in the house, after that he hath taken away the stones, and after he hath scraped the house, and after it is plaistered;","44":"Then the priest shall come and look, and, behold, *if* the plague be spread in the house, it *is* a fretting leprosy in the house: it *is* unclean.","45":"And he shall break down the house, the stones of it, and the timber thereof, and all the morter of the house; and he shall carry *them* forth out of the city into an unclean place.","46":"Moreover he that goeth into the house all the while that it is shut up shall be unclean until the even.","47":"And he that lieth in the house shall wash his clothes; and he that eateth in the house shall wash his clothes.","48":"And if the priest shall come in, and look *upon it*, and, behold, the plague hath not spread in the house, after the house was plaistered: then the priest shall pronounce the house clean, because the plague is healed.","49":"And he shall take to cleanse the house two birds, and cedar wood, and scarlet, and hyssop:","50":"And he shall kill the one of the birds in an earthen vessel over running water:","51":"And he shall take the cedar wood, and the hyssop, and the scarlet, and the living bird, and dip them in the blood of the slain bird, and in the running water, and sprinkle the house seven times:","52":"And he shall cleanse the house with the blood of the l wl-kjv\" data-code=\"H2416\">running</span> water:","6":"As for the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H6833\">bird,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> it, and the <span class=\"wl wl-kjv\" data-code=\"H730\">cedar</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8144\">scarlet,</span> and the <span class=\"wl wl-kjv\" data-code=\"H231\">hyssop,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H2881\">dip</span> them and the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H6833\">bird</span> in the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the <span class=\"wl wl-kjv\" data-code=\"H6833\">bird</span> that was <span class=\"wl wl-kjv\" data-code=\"H7819\">killed</span> over the <span class=\"wl wl-kjv\" data-code=\"H2416\">running</span> water:","7":"And he shall <span class=\"wl wl-kjv\" data-code=\"H5137\">sprinkle</span> upon him that is to be <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed</span> from the <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times,</span> and shall pronounce him <span class=\"wl wl-kjv\" data-code=\"H2891\">clean,</span> and shall let the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H6833\">bird</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">loose</span> into the <span class=\"wl wl-kjv\" data-code=\"H6440\">open</span> field.","8":"And he that is to be <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed</span> shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H1548\">shave</span> off all his <span class=\"wl wl-kjv\" data-code=\"H8181\">hair,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> that he may be <span class=\"wl wl-kjv\" data-code=\"H2891\">clean:</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that he shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3427\">tarry</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad</span> out of his <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> days.","9":"But it shall be on the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that he shall <span class=\"wl wl-kjv\" data-code=\"H1548\">shave</span> all his <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> off his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> and his <span class=\"wl wl-kjv\" data-code=\"H2206\">beard</span> and his <span class=\"wl wl-kjv\" data-code=\"H1354\">eyebrows,</span> even all his <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> he shall <span class=\"wl wl-kjv\" data-code=\"H1548\">shave</span> off: and he shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> also he shall <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and he shall be clean.","10":"And on the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> he <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs</span> without <span class=\"wl wl-kjv\" data-code=\"H8549\">blemish,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> ewe <span class=\"wl wl-kjv\" data-code=\"H3535\">lamb</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">first</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> without <span class=\"wl wl-kjv\" data-code=\"H8549\">blemish,</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> tenth <span class=\"wl wl-kjv\" data-code=\"H6241\">deals</span> of fine <span class=\"wl wl-kjv\" data-code=\"H5560\">flour</span> for a meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering,</span> <span class=\"wl wl-kjv\" data-code=\"H1101\">mingled</span> with <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3849\">log</span> of oil.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> that maketh him <span class=\"wl wl-kjv\" data-code=\"H2891\">clean</span> shall <span class=\"wl wl-kjv\" data-code=\"H5975\">present</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that is to be made <span class=\"wl wl-kjv\" data-code=\"H2891\">clean,</span> and those things, <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation:","12":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> he <span class=\"wl wl-kjv\" data-code=\"H3532\">lamb,</span> and <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> him for a trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3849\">log</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H5130\">wave</span> them for a wave <span class=\"wl wl-kjv\" data-code=\"H8573\">offering</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD:","13":"And he shall <span class=\"wl wl-kjv\" data-code=\"H7819\">slay</span> the <span class=\"wl wl-kjv\" data-code=\"H3532\">lamb</span> in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where he shall <span class=\"wl wl-kjv\" data-code=\"H7819\">kill</span> the sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering</span> and the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> in the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place:</span> for as the sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering</span> is the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest's,</span> so is the trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering:</span> it is <span class=\"wl wl-kjv\" data-code=\"H6944\">most</span> holy:","14":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> some of the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> it upon the <span class=\"wl wl-kjv\" data-code=\"H8571\">tip</span> of the <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> of him that is to be <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H931\">thumb</span> of his <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and upon the great <span class=\"wl wl-kjv\" data-code=\"H931\">toe</span> of his <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> foot:","15":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> some of the <span class=\"wl wl-kjv\" data-code=\"H3849\">log</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H3332\">pour</span> it into the <span class=\"wl wl-kjv\" data-code=\"H3709\">palm</span> of his <span class=\"wl wl-kjv\" data-code=\"H3548\">own</span> left hand:","16":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H2881\">dip</span> his <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> <span class=\"wl wl-kjv\" data-code=\"H676\">finger</span> in the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> that is in his <span class=\"wl wl-kjv\" data-code=\"H8042\">left</span> <span class=\"wl wl-kjv\" data-code=\"H3709\">hand,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5137\">sprinkle</span> of the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> with his <span class=\"wl wl-kjv\" data-code=\"H676\">finger</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD:","17":"And of the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> that is in his <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> upon the <span class=\"wl wl-kjv\" data-code=\"H8571\">tip</span> of the <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> of him that is to be <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H931\">thumb</span> of his <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and upon the great <span class=\"wl wl-kjv\" data-code=\"H931\">toe</span> of his <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">foot,</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the trespass offering:","18":"And the <span class=\"wl wl-kjv\" data-code=\"H3498\">remnant</span> of the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest's</span> <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">pour</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of him that is to be <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for him <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD.","19":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">offer</span> the sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for him that is to be <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed</span> from his <span class=\"wl wl-kjv\" data-code=\"H2932\">uncleanness;</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7819\">kill</span> the burnt offering:","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> and the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for him, and he shall be clean.","21":"And if he be <span class=\"wl wl-kjv\" data-code=\"H1800\">poor,</span> and cannot <span class=\"wl wl-kjv\" data-code=\"H3027\">get</span> so much; then he shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3532\">lamb</span> for a trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering</span> to be <span class=\"wl wl-kjv\" data-code=\"H8573\">waved,</span> to make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for him, and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> tenth <span class=\"wl wl-kjv\" data-code=\"H6241\">deal</span> of fine <span class=\"wl wl-kjv\" data-code=\"H5560\">flour</span> <span class=\"wl wl-kjv\" data-code=\"H1101\">mingled</span> with <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> for a meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3849\">log</span> of oil;","22":"And <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8449\">turtledoves,</span> or <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H3123\">pigeons,</span> such as he is able to <span class=\"wl wl-kjv\" data-code=\"H3027\">get;</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> shall be a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> a burnt offering.","23":"And he shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> them on the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> for his <span class=\"wl wl-kjv\" data-code=\"H2893\">cleansing</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD.","24":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H3532\">lamb</span> of the trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3849\">log</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5130\">wave</span> them for a wave <span class=\"wl wl-kjv\" data-code=\"H8573\">offering</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD:","25":"And he shall <span class=\"wl wl-kjv\" data-code=\"H7819\">kill</span> the <span class=\"wl wl-kjv\" data-code=\"H3532\">lamb</span> of the trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> some of the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> it upon the <span class=\"wl wl-kjv\" data-code=\"H8571\">tip</span> of the <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> of him that is to be <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H931\">thumb</span> of his <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and upon the great <span class=\"wl wl-kjv\" data-code=\"H931\">toe</span> of his <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> foot:","26":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H3332\">pour</span> of the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> into the <span class=\"wl wl-kjv\" data-code=\"H3709\">palm</span> of his <span class=\"wl wl-kjv\" data-code=\"H3548\">own</span> left hand:","27":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5137\">sprinkle</span> with his <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> <span class=\"wl wl-kjv\" data-code=\"H676\">finger</span> some of the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> that is in his <span class=\"wl wl-kjv\" data-code=\"H8042\">left</span> <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD:","28":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> of the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> that is in his <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> upon the <span class=\"wl wl-kjv\" data-code=\"H8571\">tip</span> of the <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> of him that is to be <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H931\">thumb</span> of his <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and upon the great <span class=\"wl wl-kjv\" data-code=\"H931\">toe</span> of his <span class=\"wl wl-kjv\" data-code=\"H3233\">right</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">foot,</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the trespass offering:","29":"And the <span class=\"wl wl-kjv\" data-code=\"H3498\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest's</span> <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of him that is to be <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed,</span> to make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for him <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD.","30":"And he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">offer</span> the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H8449\">turtledoves,</span> or of the <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H3123\">pigeons,</span> such <span class=\"wl wl-kjv\" data-code=\"H834\">as</span> he can <span class=\"wl wl-kjv\" data-code=\"H3027\">get;</span>","31":"Even such as <span class=\"wl wl-kjv\" data-code=\"H3027\">he</span> is able to <span class=\"wl wl-kjv\" data-code=\"H5381\">get,</span> the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> with the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for him that is to be <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD.","32":"This is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of him in whom is the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy,</span> whose <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> is not able to <span class=\"wl wl-kjv\" data-code=\"H5381\">get</span> that which pertaineth to his cleansing.","33":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> saying,","34":"When ye be <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> which I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to you for a <span class=\"wl wl-kjv\" data-code=\"H272\">possession,</span> and I <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> in a <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of your possession;","35":"And he that owneth the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> It <span class=\"wl wl-kjv\" data-code=\"H7200\">seemeth</span> to me there is as it were a <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> in the house:","36":"Then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> that they <span class=\"wl wl-kjv\" data-code=\"H6437\">empty</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> before the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into it to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague,</span> that all that is in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> be not made <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> in to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the house:","37":"And he shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> on the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague,</span> and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> be in the <span class=\"wl wl-kjv\" data-code=\"H7023\">walls</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> with hollow <span class=\"wl wl-kjv\" data-code=\"H8258\">strakes,</span> <span class=\"wl wl-kjv\" data-code=\"H3422\">greenish</span> or <span class=\"wl wl-kjv\" data-code=\"H125\">reddish,</span> which in <span class=\"wl wl-kjv\" data-code=\"H4758\">sight</span> are <span class=\"wl wl-kjv\" data-code=\"H8217\">lower</span> <span class=\"wl wl-kjv\" data-code=\"H4480\">than</span> the wall;","38":"Then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H3318\">go</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> up the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> days:","39":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall come <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7200\">look:</span> and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> be <span class=\"wl wl-kjv\" data-code=\"H6581\">spread</span> in the <span class=\"wl wl-kjv\" data-code=\"H7023\">walls</span> of the house;","40":"Then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> that they <span class=\"wl wl-kjv\" data-code=\"H2502\">take</span> away the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> in <span class=\"wl wl-kjv\" data-code=\"H2004\">which</span> the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> is, and they shall <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> them into an <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the city:","41":"And he shall cause the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to be <span class=\"wl wl-kjv\" data-code=\"H7106\">scraped</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">within</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H8210\">pour</span> out the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> that they <span class=\"wl wl-kjv\" data-code=\"H7096\">scrape</span> off <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> into an <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> place:","42":"And they shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">put</span> them in the <span class=\"wl wl-kjv\" data-code=\"H8478\">place</span> of those <span class=\"wl wl-kjv\" data-code=\"H68\">stones;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H6083\">morter,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H2902\">plaister</span> the house.","43":"And if the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> come <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H6524\">break</span> out in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H2502\">taken</span> away the <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> he hath <span class=\"wl wl-kjv\" data-code=\"H7096\">scraped</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> it is plaistered;","44":"Then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">look,</span> and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> be <span class=\"wl wl-kjv\" data-code=\"H6581\">spread</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> it is a <span class=\"wl wl-kjv\" data-code=\"H3992\">fretting</span> <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> it is unclean.","45":"And he shall break <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> of it, and the <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> thereof, and all the <span class=\"wl wl-kjv\" data-code=\"H6083\">morter</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and he shall carry them <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> into an <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> place.","46":"Moreover he that <span class=\"wl wl-kjv\" data-code=\"H935\">goeth</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">while</span> that it is <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> up shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","47":"And he that <span class=\"wl wl-kjv\" data-code=\"H7901\">lieth</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes;</span> and he that <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his clothes.","48":"And if the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall come <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> upon it, and, behold, the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> hath not <span class=\"wl wl-kjv\" data-code=\"H6581\">spread</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> was <span class=\"wl wl-kjv\" data-code=\"H2902\">plaistered:</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall pronounce the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H2891\">clean,</span> because the <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> is healed.","49":"And he shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> to <span class=\"wl wl-kjv\" data-code=\"H2398\">cleanse</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H6833\">birds,</span> and <span class=\"wl wl-kjv\" data-code=\"H730\">cedar</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> and <span class=\"wl wl-kjv\" data-code=\"H8144\">scarlet,</span> and hyssop:","50":"And he shall <span class=\"wl wl-kjv\" data-code=\"H7819\">kill</span> the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H6833\">birds</span> in an <span class=\"wl wl-kjv\" data-code=\"H2789\">earthen</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> over <span class=\"wl wl-kjv\" data-code=\"H2416\">running</span> water:","51":"And he shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H730\">cedar</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> and the <span class=\"wl wl-kjv\" data-code=\"H231\">hyssop,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8144\">scarlet,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H6833\">bird,</span> and <span class=\"wl wl-kjv\" data-code=\"H2881\">dip</span> them in the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the <span class=\"wl wl-kjv\" data-code=\"H7819\">slain</span> <span class=\"wl wl-kjv\" data-code=\"H6833\">bird,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H2416\">running</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and <span class=\"wl wl-kjv\" data-code=\"H5137\">sprinkle</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> times:","52":"And he shall <span class=\"wl wl-kjv\" data-code=\"H2398\">cleanse</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> with the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the <span class=\"wl wl-kjv\" data-code=\"H6833\">bird,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H2416\">running</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H6833\">bird,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H730\">cedar</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H231\">hyssop,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H8144\">scarlet:</span>","53":"But he shall let <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H6833\">bird</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> into the <span class=\"wl wl-kjv\" data-code=\"H6440\">open</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">fields,</span> and make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and it shall be clean.","54":"This is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> for all manner of <span class=\"wl wl-kjv\" data-code=\"H5061\">plague</span> of <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy,</span> and scall,","55":"And for the <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> of a <span class=\"wl wl-kjv\" data-code=\"H899\">garment,</span> and of a house,","56":"And for a <span class=\"wl wl-kjv\" data-code=\"H7613\">rising,</span> and for a <span class=\"wl wl-kjv\" data-code=\"H5597\">scab,</span> and for a bright spot:","57":"To <span class=\"wl wl-kjv\" data-code=\"H3384\">teach</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">when</span> it is <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean,</span> and <span class=\"wl wl-kjv\" data-code=\"H3117\">when</span> it is <span class=\"wl wl-kjv\" data-code=\"H2889\">clean:</span> this is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of leprosy."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"ten dage zijner reiniging","tekst":"Dat is, wanneer de priester hem rein zal verklaren."},{"catchword":"tot den priester","tekst":"Te weten, wat nader tot hem, opdat hij niet zeer ver buiten het leger behoefde uit te gaan."}],"3":[{"catchword":"merken zal,","tekst":"Deze bezichtiging en de verklaring, die er op volgde, moest door den p ekst":"Dat is, het afgeschrabde leem, kalk, enz."}],"44":[{"catchword":"knagende melaatsheid","tekst":"Vergelijk boven, Lev 13:51."}],"47":[{"catchword":"te slapen ligt,","tekst":"Of, slaapt. Zie Gen 19:4."}],"48":[{"catchword":"weder ingegaan zijn,","tekst":"Hebreeuws, ingaande ingegaan; dat is, weder of meermalen ingegaan."}],"49":[{"catchword":"ontzondigen,","tekst":"Dat is, door offerande te reinigen, en tot een eerlijk of rein gebruik te eigenen. Vergelijk boven, Lev 8:15, en de aantekeningen daarbij; idem onder, vs.52,53."},{"catchword":"scharlaken, en hysop","tekst":"Zie boven, vs.4."}],"50":[{"catchword":"over levend water","tekst":"Zie boven, vs.5."}],"53":[{"catchword":"in het open veld,","tekst":"Hebreeuws, over het aangezicht des velds. Alzo boven, vs.7."},{"catchword":"over het huis verzoening doen,","tekst":"Dat is, het huis ontzondigen, vs.49; zie daarop de aantekeningen en deze manier van spreken, Exo 29:37; onder, Lev 16:16, Lev 16:33; Eze 45:20."}],"57":[{"catchword":"Om te leren,","tekst":"Te weten, den priester, en door den priester het volk."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"After that the LORD spoke unto Moseh, saying:"}],"2":[{"catchword":null,"tekst":"This shall be the Law of the Leper (or leprous person) in the day of his cleansing: [i.e. then when the Priest shall publish and declare him clean] that he shall be brought to the Priest. [to wit, somewhat nearer to him, that he should not need to go far forth out of the Camp.]"}],"3":[{"catchword":null,"tekst":"And the Priest shall go forth without the Camp: when the Priest shall observe, that loe, the plague of the Leprosy of the Leper, is healed, (or recovered) [This viewing, and the Declaration ensuing, was to be performed by the Priest, according to the Laws prescribed in the former Chapter.]"}],"4":[{"catchword":null,"tekst":"Then the Priest shall command to take for him that is to be cleansed, two living clean birds: [The Hebrew word doth signify a bird in general, Deut. 4. 17. Psalm 8. 9.and in particular a small bird, and among them more especially, a sparrow, as it is taken by many, Psalm 84. 4. and 102. 8.] together with Cedar wood and Scarlet, [Understand some kind of stuff, of wool, or the like, twice dipped in Scarlet colour. See Gen. 38. on verse 28. and Exod. 25. 4.] and hyssop. [see Exodus 12. 22.]"}],"5":[{"catchword":null,"tekst":"The Priest shall likewise command, to slay the one bird, in an carthen Vessel, [Into which the blood of the slain bird was to drop or run out, and to be mixed with the water] over living water. [Understand such as come forth out of a springing fountain, or running river; being called living water, because of its stirring in the flowing or running, resembling life thereby; compare Gen. 26. 19. and the Annot thereupon.]"}],"6":[{"catchword":null,"tekst":"That living bird he shall take, and the Cedar-wood and the Scarlet, and the hyssop, and shall dip the same, and the living bird into the blood of bird that was slain over the living water."}],"7":[{"catchword":null,"tekst":"And he shall sprinkle over him that is to be cleansed from his Leprosy, seven times: after that he shall declare him clean and let the living bird fly into the open field. [Heb. send forth, or, dismiss, or, let loose over the face of the field.]"}],"8":[{"catchword":null,"tekst":"He now that is to be cleansed, shall wash his clothes, and shave off all of his hair, and wash himself in the water, so he shall be clean, after that he shall come into the Camp; but shall remain without his Tent seven days [Compare above chap. 13. on verse 46. and Numb. 12. on verse 24. and 31. on verse 19.]"}],"9":[{"catchword":null,"tekst":"And it shall come to pass on the seventh day, that he shall shave all his hair off his head, and his beard, and the brows of his eyes; ye all his hair he shall shave off, and shall wash his clothes, and bath his flesh with water, so he shall be clean."}],"11":[{"catchword":null,"tekst":"Now the Priest shall take that one Lamb, and offer the same for a guilt-offering, with the Log of oil: and shall wave the same for a wave-offering [see above chapter 7. on verse 30.] before the face of the LORD."}],"12":[{"catchword":null,"tekst":"And the priest shall take that one lamb, and offer the same for a guilt-offering, wich the log of oil; and shall wave the same for a wave-offering [see above chapter 7 and verse 30.] before the face of the LORD."}],"13":[{"catchword":null,"tekst":"After that, he shall slay that Lamb in the place, where they slay the sin-offering and the burnt-offering, in the holy place. [Heb. place of holiness, which was in the Court by the Altar of the burnt-offering: see Exod. 29. 11. and above 4. 4. and chap. 6. on ver. 16. and 26.] for the guilt-offering, like to the sin-offering is, for the Priest; it is a Holiness of Holinesses. [See above chap. 2. on verse 3.]"}],"14":[{"catchword":null,"tekst":"And the Priest shall take of the blood of the guilt-offering, which the Priest shall do upon the tip of the right ear of him that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot."}],"15":[{"catchword":null,"tekst":"The Priest shall likewise take out of the Log of oil: and shall pour it upon the Priests left hand. [thus also below verse 26. i.e. upon his own hand; and consequently not on his that is cleansed.]"}],"16":[{"catchword":null,"tekst":"Then the Priest shall dip in his right finger, (taking) [This word is put in here, according to the sense of the Hebrew idiom, whereof see Gen. 12. on verse 15.] of this oil, that is in his left hand, and shall with his finger sprinkle seven times before the face of the LORD."}],"17":[{"catchword":null,"tekst":"And of the residue of the same oil, that shall be in his hand, the Priest shall do upon the tip of the right car of him that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot, above upon the blood of the guilt-offering. [i.e. upon the place , where that was put before; see above verse 14. and below verse 28.]"}],"18":[{"catchword":null,"tekst":"That which shall yet have remained over of the oil, that was in the hand of she Priest, he shall do upon the head of him that is to cleansed: so the Priest shall make expiation over him, before the face of the LORD."}],"19":[{"catchword":null,"tekst":"Priest shall likewise prepare the sin-offering, and make expiation for him that is to be cleansed from his uncleanness: and after that he shall slay the burnt-offering. [See above on verse 10.]"}],"20":[{"catchword":null,"tekst":"And the Priest shall offer [Heb. make ascend] that burnt-offering, and that meat-offering: upon the Altar: thus shall the Priest make the expiation for him, and he shall be clean."}],"21":[{"catchword":null,"tekst":"But if he be poor, and his hand do not compass (that), [i.e. if through poverty he be not able to do so much, see above chap. 5. on verse 7. and below chap. 22. verse 30, 31, 32, & c.] then he shall take one Lamb for (a) guilt-offering to be waved, for to make expiation for him; besides a tenth of a meal-flower mixed with oil for (a) meat-offering, and a Log of oil."}],"22":[{"catchword":null,"tekst":"Together with two Turtle-doves, or two young Pigeons, [Heb. sons of a Dove; so below verse 30.] which his hand shall reach unto; whereof one shall be for a sin-offering, and one for a burnt-offering."}],"23":[{"catchword":null,"tekst":"And he shall bring the same to the Priest, on the eight day of his cleansing, [Or, for his cleansing] at the door of the Tent of the Congregation, before the face of the LORD."}],"24":[{"catchword":null,"tekst":"And the Priest shall take the Lamb of the guilt-offering, and the Log of oil; and the Priest shall wave the same for a wave-offering, before the face of LORD."}],"25":[{"catchword":null,"tekst":"After that shall he slay the Lamb of the guilt-offering; and the Priest shall take of the blood of the guilt-offering, and do upon the right ear tip of him that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot."}],"26":[{"catchword":null,"tekst":"Also the Priest shall pour of that oil, upon the Priests [i.e. his own; see above on verse 15.] left hand."}],"27":[{"catchword":null,"tekst":"After that shall the Priest with his right finger sprinkle of that oil, which is upon his left hand, seven times before the face of the LORD."}],"28":[{"catchword":null,"tekst":"And the Priest shall of that oil which is upon his hand, do upon the tip of the right ear of him, that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot, upon the place of the blood of the guilt-offering."}],"29":[{"catchword":null,"tekst":"And the residue of the oil, that is in the Priests hand, he shall do upon the head of him, that is to be cleansed, to make Expiation for him, before the face of the LORD."}],"30":[{"catchword":null,"tekst":"After that, he shall prepare the one of the Turtle-doves, or of the young Pigeons, of that his hands shall have compassed."}],"31":[{"catchword":null,"tekst":"Of that which his hand shall have compassed, the one shall be for a sin-offering, and the other shall be for a burnt-offering, above the meat-offering: thus the Priest shall make Expiation for him that is to be cleansed, before the face of the LORD."}],"32":[{"catchword":null,"tekst":"This is the Law (of him) in whom the plague of the Leprosy shall be, whose hand in his cleansing, shall not have compassed (that). [viz. which was required for the cleansing of Leprosy at first, above verse 10.]"}],"33":[{"catchword":null,"tekst":"Moreover the LORD spoke unto Moseh, and unto Aaron, saying:"}],"34":[{"catchword":null,"tekst":"When ye shall be come into the land of Canaan, which I shall give you for a possession, [Heb. am giving; i.e. shall give assuredly. Compare above chap. 9. the Annotations on verse 4.] and I shall have given the plague of Leprosy in a house of the land of your possession."}],"35":[{"catchword":null,"tekst":"Then he, whose that house is, shall come, and make it known to the Priest, saying; it seemeth unto me, as if there were a plague in the house. [i.e. by what I am able to discern and conjecture, the house doth seem thus conditioned unto me, as if it were tainted with that infection]"}],"36":[{"catchword":null,"tekst":"And the Priest shall command, that they [viz. all the inhabitants and retainers of the house ] shall void that house, [to wit, taking forth likewise and removing the household-stuff of it. The Hebrew word doth properly signify to remove something out of ones sight] before the Priest come, for to view the plague, left all that is in the house become unclean: and after that, the Priest shall come for to view that house."}],"37":[{"catchword":null,"tekst":"When he shall view that plague, that loe, that plague at the walls of that house, are greenish, or ruddy, hollow places, and their aspect is lower (or, deeper) than the wall;"}],"38":[{"catchword":null,"tekst":"The Priest shall go forth out of that house, at the door of the same house: and he shall cause that house to be shut up seven days."}],"40":[{"catchword":null,"tekst":"Thus the Priest shall command, that they break out the stones, wherein that plague is, and throw the same without the City, in an unclean place."}],"41":[{"catchword":null,"tekst":"And he shall cause that house to be scraped within round about, and the dust [i.e. scraped clay, morter, rubbish, & c.] which they have scraped off, they shall throw forth without the City, in an unclean place."}],"42":[{"catchword":null,"tekst":"After that they shall take other stones, and bring (them) in the place of these stones, and they shall take other clay, (or, morter) and strike that house."}],"43":[{"catchword":null,"tekst":"But if that plague return and bud forth in that house, after that they have broken out the stones: and after the scraping of the house, and after that it shall be plaistred:"}],"44":[{"catchword":null,"tekst":"Then the Priest shall come: when now he shall observe, that, loe, that plague is spread forth on that house; it is a gnawing Leprosy, [Compare above chap. 13. verse 51.] in that house, it is unclean."}],"45":[{"catchword":null,"tekst":"Therefore they shall quite break down that house, its stones, and its wood, together with all the clay (or, morter) of the same house: and they shall carry it forth the City to an unclean place."}],"46":[{"catchword":null,"tekst":"And who so goeth into that house at any day, whiles it shall be shut up, shall be unclean until the Evening."}],"47":[{"catchword":null,"tekst":"He also that lieth to sleep, [Or, sleepeth: see Gen. 19. on verse 4.] shall wash his clothes: likewise he that eateth in that house, shall wash his clothes."}],"48":[{"catchword":null,"tekst":"But when the Priest shall be gone in again [Heb. going in, gone in; i.e. again, or, reiteratedly gone in] and shall observe, that loe, the same plague is not spread abroad on that house, after that the house shall be plaistered: then the Priest shall declare that house clean, because that plague is recovered."}],"49":[{"catchword":null,"tekst":"After that, for to purify (or, un-sin) that house, [i.e. to purify the same, and to fit it again for an orderly and clean use. Compare above chap. 8. 15. and the Annot. thereupon. Item, below verse 52, and 53.] he shall take two (small) birds; together with Cedarwood, and Scarlet, [see above on verse 4.] and hyssop."}],"50":[{"catchword":null,"tekst":"And he shall slay the one bird in an earthen Vessel, over living water. [See above verse 5.]"}],"51":[{"catchword":null,"tekst":"Then shall he take that Cedar-wood, and that hyssop, and the Scarlet, and the living bird, and shall dip the same into the blood of the slain bird, and into the living water: and he shall sprinkle that house seven times."}],"52":[{"catchword":null,"tekst":"So he shall un-sin (or, expiate) that house with the blood of the bird, and with that living water; and with that living bird, and with that Cedar-wood, and with the hyssop, and with the scarlet."}],"53":[{"catchword":null,"tekst":"The living bird now he shall let fly without the City into the open field [Heb. over the face of the field, and so above verse 7.] thus shall he Expiation over the house, [i.e. purify or un-sin the house, verse 49. See the Annot. there; and this phrase, Exodus 29. 37. Leviticus 16. 16. and 33. Ezek. 45. 20.] and it shall be clean."}],"54":[{"catchword":null,"tekst":"This is the Law for every plague of Leprosy, and for scall. (or, scabbiness)"}],"55":[{"catchword":null,"tekst":"And for Leprosy of garments, and of houses."}],"56":[{"catchword":null,"tekst":"As likewise for swelling, and for (the) sore, and for blisters."}],"57":[{"catchword":null,"tekst":"for to teach [To wit, the Priest, and by him the people also] in what day ought is clean, and in what day ought is unclean. This is the Law of the Leprosy."}]}}};
