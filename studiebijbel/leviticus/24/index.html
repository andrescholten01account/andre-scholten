ohannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En de HEERE sprak tot Mozes en zei:","2":"Gebied de Israëlieten dat zij zuivere, gestoten olijfolie naar u toe brengen, voor de lamp, om de lampen voortdurend te laten branden.","3":"Aäron zal die voortdurend in orde houden voor het aangezicht van de HEERE, van de avond tot de morgen, buiten het voorhangsel van de getuigenis, in de tent van de samenkomst; het is een eeuwige inzetting voor uw geslachten.","4":"Hij zal op de zuivere kandelaar de lampen voortdurend in orde houden voor het aangezicht van de HEERE.","5":"U zult ook meelbloem nemen en er twaalf koeken van bakken; van twee tienden zal één koek zijn.","6":"En u zult ze in twee rijen leggen, zes in een rij, op de reine tafel, voor het aangezicht van de HEERE.","7":"En op elke rij zult u zuivere wierook leggen, die het brood tot een gedenkoffer zal zijn; het is een vuuroffer voor de HEERE.","8":"Op elke sabbatdag zal men dat voortdurend in orde houden voor het aangezicht van de HEERE, vanwege de Israëlieten, tot een eeuwig verbond.","9":"En het zal voor Aäron en zijn zonen zijn, die het op de heilige plaats zullen eten; want het is voor hem allerheiligst uit de vuuroffers van de HEERE, een eeuwige inzetting.","10":"En de zoon van een Israëlitische vrouw ging naar buiten – hij was, te midden van de Israëlieten, de zoon van een Egyptische man – en de zoon van deze Israëlitische vrouw en een Israëlitische man kregen ruzie in het kamp.","11":"Toen lasterde de zoon van de Israëlitische vrouw uitdrukkelijk de NAAM, en vloekte; daarom brachten zij hem tot Mozes; de naam van zijn moeder nu was Selomith, de dochter van Dibri, van de stam Dan.","12":"En zij zetten hem in bewaring, totdat hun, naar de mond van de HEERE, uitspraak gedaan zou worden.","13":"En de HEERE sprak tot Mozes en zei:","14":"Breng de vloeker naar buiten, tot buiten het kamp, en laat allen die het gehoord hebben hun handen op zijn hoofd leggen; daarna zal de hele gemeenschap hem stenigen.","15":"En tegen de Israëlieten zult u spreken en zeggen: Ieder die zijn God vloekt, zal zijn zonde dragen.","16":"En wie de Naam van de HEERE lastert, zal zeker gedood worden; de hele gemeenschap zal hem zeker stenigen; zo zal het gaan met de vreemdeling als met de geboren Israëliet: als hij de NAAM lastert, zal hij gedood worden.","17":"En als iemand enig mens doodslaat, zal hij zeker gedood worden.","18":"Maar wie het leven van enig vee doodt, zal het vergoeden, leven voor leven.","19":"Als ook iemand zijn naaste een blijvend letsel toebrengt: zoals hij gedaan heeft, zo zal ook aan hem gedaan worden:","20":"breuk voor breuk, oog voor oog, tand voor tand; zoals hij een letsel aan een mens toegebracht heeft, zo zal ook aan hem toegebracht worden.","21":"Wie dan enig vee doodt, die zal het vergoeden; maar wie een mens doodt, die zal gedood worden.","22":"Eén recht zult u hebben; zo zal het gelden voor de vreemdeling als voor de geboren Israëliet; want Ik ben de HEERE, uw God!","23":"En Mozes zei tegen de Israëlieten dat zij de vloeker naar buiten, tot buiten het kamp, zouden brengen, en hem met stenen zouden stenigen. En de Israëlieten deden zoals de HEERE Mozes geboden had."},"SV":{"1":"En de HEERE sprak tot Mozes, zeggende:","2":"Gebied den kinderen Israëls, dat zij tot u brengen zuivere gestoten olijfolie, voor den luchter, om de lampen gedurig aan te steken.","3":"Aäron zal die voor het aangezicht des HEEREN gedurig toerichten, van den avond tot den morgen, buiten den voorhang van de getuigenis, in de tent der samenkomst; het is een eeuwige inzetting voor uw geslachten.","4":"Hij zal op den louteren kandelaar die lampen voor het aangezicht des HEEREN gedurig toerichten.","5":"Gij zult ook meelbloem nemen, en twaalf koeken daarvan bakken; van twee tienden zal een koek zijn.","6":"En gij zult ze in twee rijen leggen, zes in een rij, op de reine tafel, voor het aangezicht des HEEREN.","7":"En op elke rij zult gij zuiveren wierook leggen, welke het brood ten gedenkoffer zal zijn; het is een vuuroffer den HEERE.","8":"Op elken sabbatdag gedurig zal men dat voor het aangezicht des HEEREN toerichten, vanwege de kinderen Israëls, tot een eeuwig verbond.","9":"En het zal voor Aäron en zijn zonen zijn, die dat in de heilige plaats zullen eten; want het is voor hem een heiligheid der heiligheden uit de vuurofferen des HEEREN, een eeuwige inzetting.","10":"En er ging de zoon ener Israëlietische vrouw uit, die, in het midden der kinderen Israëls, de zoon van een Egyptische man was; en de zoon van deze Israëlietische en een Israëlietisch man twistten in het leger.","11":"Toen lasterde de zoon der Israëlietische vrouw uitdrukkelijk den NAAM, en vloekte; daarom brachten zij hem tot Mozes; de naam nu zijner moeder was Selomith, de dochter van Dibri, van den stam Dan.","12":"En zij leidden hem in de gevangenis, opdat hem, naar den mond des HEEREN, verklaring geschieden zou.","13":"En de HEERE sprak tot Mozes, zeggende:","14":"Breng den vloeker uit tot buiten het leger, en allen, die het gehoord hebben, zullen hun handen op zijn hoofd leggen; daarna zal hem de gehele vergadering stenigen.","15":"En tot de kinderen Israëls zult gij spreken, zeggende: Een ieder, als hij zijn God gevloekt zal hebben, zo zal hij zijn zonde dragen.","16":"En wie den Naam des HEEREN gelasterd zal hebben, zal zekerlijk gedood worden; de ganse vergadering zal hem zekerlijk stenigen; alzo zal de vreemdeling zijn, gelijk de inboorling, als hij den NAAM zal gelasterd hebben, hij zal gedood worden.","17":"En als iemand enige ziel des mensen zal verslagen hebben, hij zal zekerlijk gedood worden.","18":"Maar wie de ziel van enig vee zal verslagen hebben, hij zal het wedergeven, ziel voor ziel.","19":"Als ook iemand aan zijn naaste een gebrek zal aangebracht hebben; gelijk als hij gedaan heeft, zo zal ook aan hem gedaan worden:","20":"Breuk voor breuk, oog voor oog, tand voor tand; gelijk als hij een gebrek een mens zal aangebracht hebben, zo zal ook hem aangebracht worden.","21":"Wie dan enig vee verslaat, die zal het wedergeven; maar wie een mens verslaat, die zal gedood worden.","22":"Enerlei recht zult gij hebben; zo zal de vreemdeling zijn, als de inboorling; want Ik ben de HEERE, uw God!","23":"En Mozes zeide tot de kinderen Israëls, dat zij den vloeker tot buiten het leger uitbrengen, en hem met stenen stenigen zouden. En de kinderen Israëls deden, gelijk als de HEERE Mozes geboden had."},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Command the children of Israel, that they bring unto thee pure oil olive beaten for the light, to cause the lamps to burn continually.","3":"Without the vail of the testimony, in the tabernacle of the congregation, shall Aaron order it from the evening unto the morning before the LORD continually: *it shall be* a statute for ever in your generations.","4":"He shall order the lamps upon the pure candlestick before the LORD continually.","5":"And thou shalt take fine flour, and bake twelve cakes thereof: two tenth deals shall be in one cake.","6":"And thou shalt set them in two rows, six on a row, upon the pure table before the LORD.","7":"And thou shalt put pure frankincense upon *each* row, that it may be on the bread for a memorial, *even* an offering made by fire unto the LORD.","8":"Every sabbath he shall set it in order before the LORD continually, *being taken* from the children of Israel by an everlasting covenant.","9":"And it shall be Aaron's and his sons'; and they shall eat it in the holy place: for it *is* most holy unto him of the offerings of the LORD made by fire by a perpetual statute.","10":"And the son of an Israelitish woman, whose father *was* an Egyptian, went out among the children of Israel: and this son of the Israelitish *woman* and a man of Israel strove together in the camp;","11":"And the Israelitish woman's son blasphemed the name *of the LORD*, and cursed. And they brought him unto Moses: (and his mother's name *was* Shelomith, the daughter of Dibri, of the tribe of Dan:)","12":"And they put him in ward, that the mind of the LORD might be shewed","13":"And the LORD spake unto Moses, saying,","14":"Bring forth him that hath cursed without the camp; and let all that heard *him* lay their hands upon his head, and let all the congregation stone","15":"And thou shalt speak unto the children of Israel, saying, Whosoever curseth his God shall bear his sin.","16":"And he that blasphemeth the name of the LORD, he shall surely be put to death, *and* all the congregation shall certainly stone him: as well the stranger, as he that is born in the land, when he blasphemeth the name *of the LORD*, shall be put to death.","17":"And he that killeth any man shall surely be put to death.","18":"And he that killeth a beast shall make it good; beast for beast.","19":"And if a man cause a blemish in his neighbour; as he hath done, so shall it be done","20":"Breach for breach, eye for eye, tooth for tooth: as he hath caused a blemish in a man, so shall it be done","21":"And he that killeth a beast, he shall restore it: and he that killeth a man, he shall be put to death.","22":"Ye shall have one manner of law, as well for the stranger, as for one of your own country: for I *am* the LORD your God.","23":"And Moses spake to the children of Israel, that they should bring forth him that had cursed out of the camp, and stone him with stones. And the children of Israel did as the LORD commanded Moses."}},"tsk":{"2":[{"kopje":"dat zij","refs":["Ex 27:20","Ex 27:21","Ex 39:37","Ex 40:24","Num 8:2-4","1 Sam 3:3","1 Sam 3:4"]},{"kopje":"de lampen","refs":["2 Kron 13:11","Ps 119:105","Ps 119:130","Spr 6:23","Jes 8:20","Jes 11:2","Matt 4:16","Matt 5:16","Matt 25:1-8","Luk 1:79","Luk 12:35","Joh 1:4","Joh 1:9","Joh 5:35","Joh 8:12","Hand 26:18","2 Kor 4:6","Ef 1:17","Ef 1:18","Ef 5:8-14","Fil 2:15","Fil 2:16"]}],"4":[{"kopje":"de zuivere","refs":["Ex 25:31-39","Ex 31:8","Ex 37:17-24","Ex 39:37","Num 3:31","Num 4:9","1 Kon 7:49","1 Kron 28:15","Jer 52:19","Zach 4:2","Zach 4:3","Zach 4:11-14","Hebr 9:2","Openb 1:20","Openb 2:1","Openb 2:5","Openb 11:4"]}],"6":[{"kopje":"in twee rijen","refs":["1 Kor 14:40"]},{"kopje":"reine","refs":["Ex 25:23","Ex 25:24","Ex 37:10-16","Ex 39:36","Ex 40:22","Ex 40:23","1 Kon 7:48","2 Kron 4:19","2 Kron 13:11","Hebr 9:2"]}],"7":[{"kopje":"zuivere","refs":["Lev 2:2","Ef 1:6","Hebr 7:25","Openb 8:3","Openb 8:4"]},{"kopje":"het brood","refs":["Joh 6:35","Joh 6:51"]},{"kopje":"een gedenkoffer","refs":["Gen 9:16","Ex 12:14","Ex 13:9","Ex 17:14","Hand 10:4","Hand 10:31","1 Kor 11:23-25"]}],"9":[{"kopje":"Aäron","refs":["Lev 8:31","1 Sam 21:6","Mal 1:12","Matt 12:4","Mark 2:26","Luk 6:4"]},{"kopje":"zullen eten","ref l wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and this <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of the <span class=\"wl wl-kjv\" data-code=\"H3482\">Israelitish</span> woman and a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> strove <span class=\"wl wl-kjv\" data-code=\"H5327\">together</span> in the camp;","11":"And the <span class=\"wl wl-kjv\" data-code=\"H3482\">Israelitish</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H5344\">blasphemed</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the LORD, and <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed.</span> And they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses:</span> (and his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H8019\">Shelomith,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H1704\">Dibri,</span> of the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe</span> of Dan:)","12":"And they <span class=\"wl wl-kjv\" data-code=\"H3240\">put</span> him in <span class=\"wl wl-kjv\" data-code=\"H4929\">ward,</span> that the <span class=\"wl wl-kjv\" data-code=\"H6310\">mind</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> might be shewed","13":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","14":"Bring <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> him that hath <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp;</span> and let all that <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> him <span class=\"wl wl-kjv\" data-code=\"H5564\">lay</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and let all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> stone","15":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H376\">Whosoever</span> <span class=\"wl wl-kjv\" data-code=\"H3588\">curseth</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> his sin.","16":"And he that <span class=\"wl wl-kjv\" data-code=\"H5344\">blasphemeth</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> be put to <span class=\"wl wl-kjv\" data-code=\"H4191\">death,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> shall <span class=\"wl wl-kjv\" data-code=\"H7275\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H7275\">stone</span> him: as well the <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger,</span> as he that is born in the <span class=\"wl wl-kjv\" data-code=\"H249\">land,</span> when he <span class=\"wl wl-kjv\" data-code=\"H5344\">blasphemeth</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the LORD, shall be put to death.","17":"And <span class=\"wl wl-kjv\" data-code=\"H376\">he</span> that <span class=\"wl wl-kjv\" data-code=\"H5221\">killeth</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">any</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> be put to death.","18":"And he that <span class=\"wl wl-kjv\" data-code=\"H5221\">killeth</span> a <span class=\"wl wl-kjv\" data-code=\"H5315\">beast</span> shall make it <span class=\"wl wl-kjv\" data-code=\"H7999\">good;</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">beast</span> for beast.","19":"And if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">cause</span> a <span class=\"wl wl-kjv\" data-code=\"H3971\">blemish</span> in his <span class=\"wl wl-kjv\" data-code=\"H5997\">neighbour;</span> as he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> so shall it be done","20":"<span class=\"wl wl-kjv\" data-code=\"H7667\">Breach</span> for <span class=\"wl wl-kjv\" data-code=\"H7667\">breach,</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> for <span class=\"wl wl-kjv\" data-code=\"H5869\">eye,</span> <span class=\"wl wl-kjv\" data-code=\"H8127\">tooth</span> for <span class=\"wl wl-kjv\" data-code=\"H8127\">tooth:</span> as he hath <span class=\"wl wl-kjv\" data-code=\"H5414\">caused</span> a <span class=\"wl wl-kjv\" data-code=\"H3971\">blemish</span> in a <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> so shall it be done","21":"And he that <span class=\"wl wl-kjv\" data-code=\"H5221\">killeth</span> a <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7999\">restore</span> it: and he that <span class=\"wl wl-kjv\" data-code=\"H5221\">killeth</span> a <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> he shall be put to death.","22":"Ye shall have <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> manner of <span class=\"wl wl-kjv\" data-code=\"H4941\">law,</span> as well for the <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger,</span> as for one of your own <span class=\"wl wl-kjv\" data-code=\"H249\">country:</span> for I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","23":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that they should bring <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> him that had <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> and <span class=\"wl wl-kjv\" data-code=\"H7275\">stone</span> him with <span class=\"wl wl-kjv\" data-code=\"H68\">stones.</span> And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"brengen","tekst":"Hebreeuws, nemen; dat is, nemen en brengen. Zie Gen 12:15."},{"catchword":"gestoten olijfolie,","tekst":"Zie hiervan ook het gebod Exo 27:20."},{"catchword":"lampen","tekst":"Welke waren in getal zegen; Exo 25:37."},{"catchword":"gedurig aan te steken","tekst":"Te weten, in elken avondstond."}],"3":[{"catchword":"Aäron","tekst":"Of, zijne zonen door zijn gebod, gelijk te zien is Exo 27:21."},{"catchword":"voorhang van de getuigenis,","tekst":"Die het heilige van het heilige der heiligen afscheidt. Zie boven, Lev 4:6. Deze luchter nu of kandelaar stond in het heilige aan de zuidzijde, gelijk de gouden tafel aan de noordzijde; Exo 26:35."}],"4":[{"catchword":"louteren kandelaar","tekst":"Dat is, die van louter en fijn goud gemaakt was, Exo 25:31, gelijk hij ook hierna vs.6 de reine tafel noemt, waar de toonbroden op gelegd worden, omdat die met zuiver, fijn en gelouterd goud overtrokken was; van welke men ook lezen kan Exo 25:24."}],"5":[{"catchword":"twee tienden","tekst":"Dat is, van twee gomer, welke was het tiende deel van een efa. Zie Exo 16:36."}],"7":[{"catchword":"ten gedenkoffer zal zijn;","tekst":"Zie boven, Lev 2:2."}],"8":[{"catchword":"elken sabbatdag","tekst":"Hebreeuws, in den dag des sabbats, in den dag des sabbats. Zie van deze manier van spreken Gen 7:2."},{"catchword":"toerichten,","tekst":"Hetwelk de priesters alleen doen moesten."},{"catchword":"kinderen Israëls,","tekst":"Die de meelbloem geofferd hadden, waarvan de priesters de broden of koeken maken moesten."}],"9":[{"catchword":"zal voor Aäron en zijn zonen","tekst":"Versta, in het eind van de week, wanneer men op den sabbat daaraanvolgende die toonbroden van de tafel nam, om verse in hun plaats te leggen."},{"catchword":"vuurofferen","tekst":"Dit wordt onder de vuurofferanden ook geteld, omdat de wierook, die er op lag, dan aangestoken en den Heere verbrand werd."}],"10":[{"catchword":"de zoon van een Egyptische man was;","tekst":"Het is waarschijnlijk dat deze Egyptenaar het Israëlietisch geloof aangenomen had, gelijk velen menen, of anders moest hij, als een vreemdeling, onder de Israëlieten gewoond hebben."},{"catchword":"Israëlietisch man","tekst":"Ten aanzien van beide zijn ouders."}],"11":[{"catchword":"lasterde de zoon der Israëlietische vrouw","tekst":"Het Hebreeuwse woor wat hier uitdrukkelijk lasteren overgezet is, betekent eigenlijk doorsteken, doorboren, doorwonden; waarmede de afgrijselijkheid dezer daad te kennen gegeven wordt, omdat hij God met zijn snode tong als doorstoken had."},{"catchword":"NAAM,","tekst":"Versta, den naam des Heeren, of, JHWH, gelijk zulks verklaard wordt vs.16, en Deu 28:58. Zie van dezen naam Gen 2:4."},{"catchword":"brachten zij hem tot Mozes;","tekst":"Versta, dat de rechters hem tot Mozes gebracht hebben, om hem raad te vragen hoe zij dezen gruwelijken lasteraar straffen zouden."}],"12":[{"catchword":"den mond des HEEREN,","tekst":"Dat is, het bevel des Heeren. Zie Gen 41:40, en Exo 17:1."}],"14":[{"catchword":"gehoord hebben,","tekst":"Namelijk, hoe hij gevloekt en den naam van God gelasterd heeft. En dezen, als getuigen, moesten hunne hand op zijn hoofd leggen, om daarmede te getuigen dat zij hem met waarheid van deze zonde der godslastering beschuldigden, en dat hij alzo er aan schuldig zijnde, deze straf verdiend had."}],"15":[{"catchword":"zonde dragen","tekst":"Dat is, de straf zijner zonde, gelijk hij dat verklaart in vs.16. Zie boven, Lev 5:1."}],"16":[{"catchword":"gelasterd zal hebben,","tekst":"Hebreeuws, doorstoken hebben; gelijk boven, vs.11. Zie aldaar."},{"catchword":"zal zekerlijk gedood worden;","tekst":"Hebreeuws, stervende gedood worden; dat is, men zal niet nalaten hem te doden zonder enige verschoning te gebruiken. Alzo in het volgende."},{"catchword":"zekerlijk stenigen;","tekst":"Hebreeuws, stenigende stenigen."}],"17":[{"catchword":"ziel des mensen","tekst":"Dat is, een mens. Zie Gen 12:5, en Exo 21:12."},{"catchword":"zal verslagen hebben,","tekst":"Dat is, wie een mens met wonden en slaan het leven beneemt. Vergelijk Gen 37:21."}],"18":[{"catchword":"ziel voor ziel","tekst":"Te weten, een levend stuk vee, voor hetgeen hij doodgeslagen zal hebben."}],"19":[{"catchword":"zo zal ook aan hem gedaan worden","tekst":"Te weten, naar wettelijke orde, verklaard in de volgende aantekening."}],"20":[{"catchword":"Breuk voor breuk,","tekst":"Dit was de wet der vergelding, welke niet door particuliere personen, maar door de overheid met kennis van zaken moest uitgevoerd worden. De Farizeën hebben haar misduid en kwalijk uitgelegd, waarover zij van onzen Zaligmaker, Mat 5:38-39, bestraft worden."},{"catchword":"aangebracht hebben,","tekst":"Hebreeuws, gegeven."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the LORD spoke to Moseh, saying:"}],"2":[{"catchword":null,"tekst":"Command the children of Israel to bring unto thee: [Heb. take, i.e. take and bring, See Gen. 12. on v. 15.] pure beaten Olive-oil; [See likewise the command hereof, Gen. 27. 20.] for the Candlestick; for to kindle the lamps, [of whom there were seven in all, Exodus 25. 37.] continually. [viz. each Even.]"}],"3":[{"catchword":null,"tekst":"Aaron [or his Sons, by his order, as appeareth, Exod. 27. 21.] shall continually prepare them, before the face of the LORD, from the Even to the Morning, without the vail of the Testimony, [which made the Partition of the Holy-place, and the most Holy. See above chap. 4. on verse 6. This Candlestick stood in the Holy-place on the South-side, as the guided Table stood on the North-side, Exod. 26. 31.] in the tent of the Congregation; it is an everlasting institution for your Generations."}],"5":[{"catchword":null,"tekst":"Thou shalt likewise take meal-flower, and bake twelve Cakes thereof: one cake shall be of two tenths. [i.e. of two Gomers, one whereof was the tenth part of an Epha, see Exod. 16. 36."}],"6":[{"catchword":null,"tekst":"And thou shalt lay them in two rows, six in row, upon the pure Table, before the face of the LORD."}],"7":[{"catchword":null,"tekst":"And upon each row, thou shalt lay pure frankincense: which shall be for bread for a memorial offering. [see ab. ch. 22.] it is a fire-offering to the LORD."}],"8":[{"catchword":null,"tekst":"On every Sabbath-continually [Heb. in the day of the Sabbath, in the day of the Sabbath. See of this manner speaking, Gen. 7. on v. 2.] shall they prepare the same before the face of the LORD, [which none might do but the Priests alone] on behalf of the children of Israel, [those which had offered the meal-flower, whereof the Priests were to make the bread-loves or cakes] for an everlasting covenant."}],"9":[{"catchword":null,"tekst":"And it shall be Aarons and his Sons: [Understand at the end of the week, when on the Sabbath following they were taken off from the Table, and new bread laid on, instead of the former] who shall eat the same in the holy place: for it is to him a Holiness of Holinesses, out of the fire-offerings of the LORD; [this is likewise counted among the fire-offerings, or sacrifices, because the frankincense, which lay upon the same, was kindled then, and consumed with fire to the LORD.] an everlasting institution."}],"10":[{"catchword":null,"tekst":"And there went forth the Son of an Israelitish woman, who in the midst of the children of Israel was an Egyptian man&acirc;&euro;&trade;s son; [Its is probable that this Egyptian had embraced the Israelites Religion, as some do hold; or else, he may only have sojourned among the Israelites as a stranger] and the Son of this Israelitish (woman) and an Israelitish man [viz. by both Father and Mother] were contending together in the camp."}],"11":[{"catchword":null,"tekst":"Then the Israelitish woman expressly blasphemed [The Hebrew word here rendered, expressly blasphemed, doth properly signify, to pierce, or bore, or wound thorough, whereby the hainousness of this Act is represented, he having as it were pierced God through with his blaspheming tongue.] the NAME, [understand the Name of the LORD, or JEHOVAH, as the same is declared verse 16. and Deut. 28. 58. See of this name Gen. 2. on ver. 4.] and cursed; therefore they brought him to Moseh; [Understand this of the Judges, who brought him to Moseh to know how they should punish such an abominable blasphemer.] the name now of his Mother was Schelomith, the Daughter of Dibri, of the Tribe of Dan."}],"12":[{"catchword":null,"tekst":"And they led him into prison, that Declaration might be made unto them, according to the mouth of the LORD. [i.e. according to his decision and command: See Gen. 41. on v. 40. and Exodus 17. 1.]"}],"13":[{"catchword":null,"tekst":"And the LORD spoke to Moseh, saying:"}],"14":[{"catchword":null,"tekst":"Bring forth the Curser without the Camp, and all that heard it, [viz. How he did curse and blaspheme the name of God:] shall lay their hands upon his head, [as so many witnesses, thereby to testify, that they had laid this sin of blasphemy truly to his charge, and that he being really guilty thereof, he was deservedly to be punished thus] after that the whole Congregation shall stone him."}],"15":[{"catchword":null,"tekst":"And to the children of Israel ye shall speak, saying; every one, when he shall have cursed his God, then shall he bear his sin. [i.e. the punishment of his sin; as he explaineth it himself in the next verse. See ab. ch. 5. on v. 1.]"}],"16":[{"catchword":null,"tekst":"And who so shall have blasphemed, [Heb. pierced through, or stabbed, as above v. 11. See the note there] the Name of the LORD, shall surely be put to death; [Heb. dying be put to death, i.e. he shall be put to death without fail, without any favour or mercy; and so in the sequel.] all the Congregation shall assuredly stone him: [Heb. stoning stone] the stranger shall be as the inborn; when he shall have blasphemed the NAME, he shall be put to death."}],"17":[{"catchword":null,"tekst":"And when any one shall smitten [i.e. smitting and wounding killed. Compare Gen. 37. 21.] any soul of man: [i.e. any man, any person of mankind; see Gen. 12. on v. 5. and Exod. 21. 12.] he shall surely be put to death."}],"18":[{"catchword":null,"tekst":"But who so shall have smitten the soul of a Cattle, he shall restore it soul for soul. [i.e. a living Beast or Cattle, for that he shall have killed.]"}],"19":[{"catchword":null,"tekst":"Also when any one shall have brought a defect on his neighbour; as he did so (it) shall be done to him. [viz. according to the course of the Law, declared in the next note.]"}],"20":[{"catchword":null,"tekst":"Breach for breach, eye for eye, tooth for tooth: [This was the Law of requital (Jus Talionis) which was not to be executed by the particular person&acirc;&euro;&trade;s hurt, and injured, but by the Magistrate, upon due process. The Pharisee did mis-interpret, and ill expound this Law, for which they are reproved by our Saviour, Mat. 5. 38, 39.] even as he shall have brought it [Heb. on a man, so shall it be brought on him."}],"21":[{"catchword":null,"tekst":"He then that smitteth a Cattle, shall restore it; but he that smitteth a man, shall be put to death."}],"22":[{"catchword":null,"tekst":"Ye shall have one manner of Right; the stranger shall be as the inborn: for I am the LORD your God."}],"23":[{"catchword":null,"tekst":"And Moseh said to the children of Israel, that they should bring the curser forth without the camp, and stone him with stones, and the children of Israel did, according as the LORD had commanded Moseh."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
