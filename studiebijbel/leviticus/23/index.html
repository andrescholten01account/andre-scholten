ohannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Daarna sprak de HEERE tot Mozes en zei:","2":"Spreek tot de kinderen van Israël, en zeg tegen hen: De vaste feesttijden van de HEERE, die u uitroepen zult, zullen heilige samenkomsten zijn; deze zijn Mijn vaste feesttijden.","3":"Zes dagen zal men het werk doen, maar op de zevende dag is de sabbat van de rust, een heilige samenkomst; geen werk zult u doen; het is de sabbat van de HEERE, in al uw woningen.","4":"Deze zijn de vaste feesttijden van de HEERE, de heilige samenkomsten, die u uitroepen zult op hun vastgestelde tijd.","5":"In de eerste maand, op de veertiende van de maand, tussen twee avonden is het pascha van de HEERE.","6":"En op de vijftiende dag van diezelfde maand is het feest van de ongezuurde *broden* van de HEERE; zeven dagen zult u ongezuurde *broden* eten.","7":"Op de eerste dag zult u een heilige samenkomst hebben; geen dienstwerk zult u doen.","8":"Maar u zult zeven dagen vuuroffer aan de HEERE offeren; en op de zevende dag zal een heilige samenkomst zijn; geen dienstwerk zult u doen.","9":"En de HEERE sprak tot Mozes en zei:","10":"Spreek tot de kinderen van Israël, en zeg tegen hen: Als u in het land zult gekomen zijn, dat Ik u geven zal, en u uw oogst zult inoogsten, dan zult u een schoof van de eerstelingen van uw oogst tot de priester brengen.","11":"En hij zal die schoof voor het aangezicht van de HEERE bewegen, opdat het voor u aangenaam zij; de dag na de sabbat zal de priester die bewegen.","12":"U zult ook op de dag, als u die schoof bewegen zult, een volkomen lam bereiden, dat eenjarig is, tot een brandoffer voor de HEERE;","13":"en zijn spijsoffer twee tienden meelbloem, met olie gemengd, tot een vuuroffer, voor de HEERE tot een liefelijke reuk; en zijn drankoffer van wijn, het vierde deel van een hin[1].","14":"En u zult geen brood, noch geroosterd koren, noch groene aren eten, tot op diezelfde dag, dat u de offerande van uw God zult gebracht hebben; het is een eeuwige inzetting voor uw geslachten, in al uw woningen.","15":"Daarna zult u voor uzelf tellen vanaf de dag na de sabbat, vanaf de dag dat u de schoof van het beweegoffer zult gebracht hebben; het zullen zeven volle sabbatten zijn;","16":"tot de dag na de zevende sabbat zult u vijftig dagen tellen, dan zult u een nieuw spijsoffer aan de HEERE offeren.","17":"U zult uit uw woningen twee beweegbroden brengen, zij zullen van twee tienden meelbloem zijn, gedesemd zullen zij gebakken worden; het zijn de eerstelingen voor de HEERE.","18":"U zult ook met het brood zeven volkomen eenjarige lammeren, en een var, het jong van een rund, en twee rammen offeren; zij zullen voor de HEERE een brandoffer zijn, met hun spijsoffer en hun drankoffers, een vuuroffer, tot een liefelijke reuk voor de HEERE.","19":"Ook zult u een geitenbok tot zondoffer, en twee eenjarige lammeren tot dankoffer bereiden.","20":"Dan zal de priester die met het brood van de eerstelingen *tot* beweegoffer, voor het aangezicht van de HEERE, met de twee lammeren bewegen; zij zullen voor de HEERE een heilig ding zijn, voor de priester.","21":"En u zult op diezelfde dag uitroepen, *dat* u een heilige samenkomst zult hebben; geen dienstwerk zult u doen; het is een eeuwige inzetting in al uw woningen voor uw geslachten.","22":"Als u nu de oogst van uw land zult inoogsten, zult u, bij uw inoogsten, de hoek van het veld niet helemaal afmaaien, en de opzameling van uw oogst niet opzamelen; voor de arme en voor de vreemdeling zult u ze laten liggen; Ik ben de HEERE, uw God!","23":"En de HEERE sprak tot Mozes en zei:","24":"Spreek tot de kinderen van Israël, en zeg: In de zevende maand, op de eerste van de maand, zult u een rust hebben, een gedachtenis van het geschal, een heilige samenkomst.","25":"Geen dienstwerk zult u doen; maar u zult de HEERE vuuroffer offeren.","26":"Verder sprak de HEERE tot Mozes en zei:","27":"Maar op de tiende van deze zevende maand zal de verzoendag zijn, een heilige samenkomst zult u hebben; dan zult u uw zielen verootmoedigen, en zult de HEERE een vuuroffer offeren.","28":"En op diezelfde dag zult u geen werk doen; want het is de verzoendag, om over u verzoening te doen voor het aangezicht van de HEERE, uw God.","29":"Want elke ziel, die op diezelfde dag niet verootmoedigd zal zijn geweest, die zal uitgeroeid worden uit haar volk.","30":"Ook elke ziel, die enig werk op diezelfde dag gedaan zal hebben, die ziel zal Ik uit het midden van haar volk verdelgen.","31":"U zult geen werk doen; het is een eeuwige inzetting voor uw geslachten, in al uw woningen.","32":"Het zal u een sabbat van de rust zijn; dan zult u uw zielen verootmoedigen; op de negende van de maand in de avond, van de avond tot de avond, zult u uw sabbat rusten.","33":"En de HEERE sprak tot Mozes en zei:","34":"Spreek tot de kinderen van Israël, en zeg: Op de vijftiende dag van deze zevende maand zal het feest van de loofhutten zeven dagen voor de HEERE zijn.","35":"Op de eerste dag zal een heilige samenkomst zijn; geen dienstwerk zult u doen.","36":"Zeven dagen zult u de HEERE vuuroffers offeren; op de achtste dag zult u een heilige samenkomst hebben, en zult de HEERE vuuroffer offeren; het is een verbodsdag; u zult geen dienstwerk doen.","37":"Dit zijn de vaste feesttijden van de HEERE, die u zult uitroepen *tot* heilige samenkomsten, om de HEERE vuuroffer, brandoffer en spijsoffer, slachtoffer en drankoffers, elk op zijn eigen dag, te offeren;","38":"behalve de sabbatten van de HEERE, en behalve uw gaven, en behalve al uw geloften, en behalve al uw vrijwillige offeren, die u de HEERE geven zult.","39":"Maar op de vijftiende dag van de zevende maand, als u de opbrengst van het land zult ingezameld hebben, zult u het feest van de HEERE zeven dagen vieren; op de eerste dag zal er rust zijn, en op de achtste dag zal er rust zijn.","40":"En op de eerste dag zult u voor uzelf nemen takken van schoon geboomte, palmtakken, en takken van dichte bomen, met beekwilgen; en u zult voor het aangezicht van de HEERE, uw God, zeven dagen vrolijk zijn.","41":"En u zult dat feest voor de HEERE zeven dagen in het jaar vieren; het is een eeuwige inzetting voor uw geslachten; in de zevende maand zult u het vieren.","42":"Zeven dagen zult u in de loofhutten wonen; alle geboren Israëlieten zullen in loofhutten wonen;","43":"opdat uw geslachten weten, dat Ik de kinderen van Israël in loofhutten heb doen wonen, toen Ik hen uit het land Egypte uitgeleid heb; Ik ben de HEERE, uw God!","44":"Zo heeft Mozes de vaste feesttijden van de HEERE aan de kinderen van Israël bekendgemaakt."},"SV":{"1":"Daarna sprak de HEERE tot Mozes, zeggende:","2":"Spreek tot de kinderen Israëls, en zeg tot hen: De gezette hoogtijden des HEEREN, welke gijlieden uitroepen zult, zullen heilige samenroepingen zijn; deze zijn Mijn gezette hoogtijden.","3":"Zes dagen zal men het werk doen, maar op den zevenden dag is de sabbat der rust, een heilige samenroeping; geen werk zult gij doen; het is des HEEREN sabbat, in al uw woningen.","4":"Deze zijn de gezette hoogtijden des HEEREN, de heilige samenroepingen, welke gij uitroepen zult op hun gezetten tijd.","5":"In de eerste maand, op den veertienden der maand, tussen twee avonden is des HEEREN pascha.","6":"En op den vijftienden dag der derzelver maand is het feest van de ongezuurde *broden* des HEEREN; zeven dagen zult gij ongezuurde *broden* eten.","7":"Op den eersten dag zult gij een heilige samenroeping hebben; geen dienstwerk zult gij doen.","8":"Maar gij zult zeven dagen vuuroffer den HEERE offeren; en op den zevenden dag zal een heilige samenroeping wezen; geen dienstwerk zult gij doen.","9":"En de HEERE sprak tot Mozes, zeggende:","10":"Spreek tot de kinderen Israëls, en zeg tot hen: Als gij in het land zult gekomen zijn, hetwelk Ik u geven zal, en gij zijn oogst zult inoogsten, dan zult gij een garf der eerstelingen van uw oogst tot den priester brengen.","11":"En hij zal die garf voor het aangezicht des HEEREN bewegen, opdat het voor u aangenaam zij; des anderen daags na den sabbat zal de priester die bewegen.","12":"Gij zult ook op den dag, als gij die garf bewegen zult, bereiden een volkomen lam, dat eenjarig is, ten brandoffer den HEERE;","13":"En zijn spijsoffer twee tienden meelbloem, met olie gemengd, ten vuuroffer, den HEERE tot een liefelijken reuk; en zijn drankoffer van wijn, het vierde deel van een hin.","14":"En gij zult geen brood, noch geroost koren, noch groene aren eten, tot op dienzelven dag, dat gij de offerande uws Gods zult gebracht hebben; het is een eeuwige inzetting voor uw geslachten, in al uw woningen.","15":"Daarna zult gij u tellen van den anderen dag na den sabbat, van den dag, dat gij de garf des beweegoffers zult gebracht hebben; het zullen zeven volkomen sabbatten zijn;","16":"Tot den anderen dag, na den zevenden sabbat, zult gij vijftig dagen tellen, dan zult gij een nieuw spijsoffer den HEERE offeren.","17":"Gijlieden zult uit uw woningen twee beweegbroden brengen, zij zullen van twee tienden meelbloem zijn, gedesemd zullen zij gebakken worden; het zijn de eerstelingen den HEERE.","18":"Gij zult ook met het brood zeven volkomen eenjarige lammeren, en een var, het jong van een rund, en twee rammen offeren; zij zullen den HEERE een brandoffer zijn, met hun spijsoffer en hun drankofferen, een vuuroffer, tot een liefelijken reuk den HEERE.","19":"Ook zult gij een geitenbok ten zondoffer, en twee eenjarige lammeren ten dankoffer bereiden.","20":"Dan zal de priester dezelve met het brood der eerstelingen *ten* beweegoffer, voor het aangezicht des HEEREN, met de twee lammeren bewegen; zij zullen den HEERE een heilig ding zijn, voor den priester.","21":"En gij zult op dienzelfden dag uitroepen, *dat* gij een heilige samenroeping zult hebben; geen dienstwerk zult gij doen; het is een eeuwige inzetting in al uw woningen voor uw geslachten.","22":"Als gij nu den oogst uws lands zult inoogsten, gij zult, in uw inoogsten, den hoek des velds niet ganselijk afmaaien, en de opzameling van uw oogst niet opzamelen; voor den arme en voor den vreemdeling zult gij ze laten; Ik ben de HEERE, uw God!","23":"En de HEERE sprak tot Mozes, zeggende:","24":"Spreek tot de kinderen Israëls, zeggende: In de zevende maand, op den eersten der maand, zult gij een rust hebben, een gedachtenis des geklanks, een heilige samenroeping.","25":"Geen dienstwerk zult gij doen; maar gij zult den HEERE vuuroffer offeren.","26":"Verder sprak de HEERE tot Mozes, zeggende:","27":"Doch op den tienden dezer zevende maand zal de verzoendag zijn, een heilige samenroeping zult gij hebben; dan zult gij uw zielen verootmoedigen, en zult den HEERE een vuuroffer offeren.","28":"En op dienzelven dag zult gij geen werk doen; want het is de verzoendag, om over u verzoening te doen voor het aangezicht des HEEREN uws Gods.","29":"Want alle ziel, welken op dienzelven dag niet zal verootmoedigd zijn geweest, die zal uitgeroeid worden uit haar volken.","30":"Ook alle ziel, die enig werk op dienzelven dag gedaan zal hebben, die ziel zal Ik uit het midden haars volks verderven.","31":"Gij zult geen werk doen; het is een eeuwige inzetting voor uw geslachten, in al uw woningen.","32":"Het zal u een sabbat der rust zijn; dan zult gij uw zielen verootmoedigen; op den negenden der maand in den avond, van den avond tot den avond, zult gij uw sabbat rusten.","33":"En de HEERE sprak tot Mozes, zeggende:","34":"Spreek tot de kinderen Israëls, zeggende: Op den vijftienden dag van deze zevende maand zal het feest der loofhutten zeven dagen den HEERE zijn.","35":"Op den eersten dag zal een heilige samenroeping zijn; geen dienstwerk zult gij doen.","36":"Zeven dagen zult gij den HEERE vuurofferen offeren; op den achtsten dag zult gij een heilige samenroeping hebben, en zult den HEERE vuuroffer offeren; het is een verbodsdag; gij zult geen dienstwerk doen.","37":"Dit zijn de gezette hoogtijden des HEEREN, welke gij zult uitroepen *tot* heilige samenroepingen, om den HEERE vuuroffer, brandoffer en spijsoffer, slachtoffer en drankofferen, elk dagelijks op zijn dag, te offeren;","38":"Behalve de sabbatten des HEEREN, en behalve uw gaven, en behalve al uw geloften, en behalve al uw vrijwillige offeren, welke gij den HEERE geven zult.","39":"Doch op den vijftienden dag der zevende maand, als gij het inkomen des lands zult ingegaderd hebben, zult gij des HEEREN feest zeven dagen vieren; op den eersten dag zal er rust zijn, en op den achtsten dag zal er rust zijn.","40":"En op den eersten dag zult gij u nemen takken van schoon geboomte, palmtakken, en meien van dichte bomen, met beekwilgen; en gij zult voor het aangezicht des HEEREN, uws Gods, zeven dagen vrolijk zijn.","41":"En gij zult dat feest den HEERE zeven dagen in het jaar vieren; het is een eeuwige inzetting voor uw geslachten; in de zevende maand zult gij het vieren.","42":"Zeven dagen zult gij in de loofhutten wonen; alle inboorlingen in Israël zullen in loofhutten wonen;","43":"Opdat uw geslachten weten, dat Ik de kinderen Israëls in loofhutten heb doen wonen, als Ik hen uit Egypteland uitgevoerd heb; Ik ben de HEERE, uw God!","44":"Alzo heeft Mozes de gezette hoogtijden des HEEREN tot de kinderen Israëls uitgesproken."},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Speak unto the children of Israel, and say unto them, *Concerning* the feasts of the LORD, which ye shall proclaim *to be* holy convocations, *even* these *are* my feasts.","3":"Six days shall work be done: but the seventh day *is* the sabbath of rest, an holy convocation; ye shall do no work *therein*: it *is* the sabbath of the LORD in all your dwellings.","4":"These *are* the feasts of the LORD, *even* holy convocations, which ye shall proclaim in their seasons.","5":"In the fourteenth *day* of the first month at even *is* the LORD'S passover.","6":"And on the fifteenth day of the same month *is* the feast of unleavened bread unto the LORD: seven days ye must eat unleavened bread.","7":"In the first day ye shall have an holy convocation: ye shall do no servile work","8":"But ye shall offer an offering made by fire unto the LORD seven days: in the seventh day *is* an holy convocation: ye shall do no servile work","9":"And the LORD spake unto Moses, saying,","10":"Speak unto the children of Israel, and say unto them, When ye be come into the land which I give unto you, and shall reap the harvest thereof, then ye shall bring a sheaf of the firstfruits of your harvest unto the priest:","11":"And he shall wave the sheaf before the LORD, to be accepted for you: on the morrow after the sabbath the priest shall wave","12":"And ye shall offer that day when ye wave the sheaf an he lamb without blemish of the first year for a burnt offering unto the LORD.","13":"And the meat offering thereof *shall be* two tenth deals of fine flour mingled with oil, an offering made by fire unto the LORD *for* a sweet savour: and the drink offering thereof *shall be* of wine, the fourth *part* of an hin.","14":"And ye shall eat neither bread, nor parched corn, nor green ears, until the selfsame day that ye have brought an offering unto your God: *it shall be* a statute for ever throughout your generations in all your dwellings.","15":"And ye shall count unto you from the morrow after the sabbath, from the day that ye brought the sheaf of the wave offering; seven sabbaths shall be complete:","16":"Even unto the morrow after the seventh sabbath shall ye number fifty days; and ye shall offer a new meat offering unto the LORD.","17":"Ye shall bring out of your habitations two wave loaves of two tenth deals: they shall be of fine flour; they shall be baken with leaven; *they are* the firstfruits unto the LORD.","18":"And ye shall offer with the bread seven lambs without blemish of the first year, and one young bullock, and two rams: they shall be *for* a burnt offering unto the LORD, with their meat offering, and their drink offerings, *even* an offering made by fire, of sweet savour unto the LORD.","19":"Then ye shall sacrifice one kid of the goats for a sin offering, and two lambs of the first year for a sacrifice of peace offerings.","20":"And the priest shall wave them with the bread of the firstfruits *for* a wave offering before the LORD, with the two lambs: they shall be holy to the LORD for the priest.","21":"And ye shall proclaim on the selfsame day, *that* it may be an holy convocation unto you: ye shall do no servile work *therein: it shall be* a statute for ever in all your dwellings throughout your generations.","22":"And when ye reap the harvest of your land, thou shalt not make clean riddance of the corners of thy field when thou reapest, neither shalt thou gather any gleaning of thy harvest: thou shalt leave them unto the poor, and to the stranger: I *am* the LORD your God.","23":"And the LORD spake unto Moses, saying,","24":"Speak unto the children of Israel, saying, In the seventh month, in the first *day* of the month, shall ye have a sabbath, a memorial of blowing of trumpets, an holy convocation.","25":"Ye shall do no servile work *therein*: but ye shall offer an offering made by fire unto the LORD.","26":"And the LORD spake unto Moses, saying,","27":"Also on the tenth *day* of this seventh month *there shall be* a day of atonement: it shall be an holy convocation unto you; and ye shall afflict your souls, and offer an offering made by fire unto the LORD.","28":"And ye shall do no work in that same day: for it *is* a day of atonement, to make an atonement for you before the LORD your God.","29":"For whatsoever soul *it be* that shall not be afflicted in that same day, he shall be cut off from among his people.","30":"And whatsoever soul *it be* that doeth any work in that same day, the same soul will I destroy from among his people.","31":"Ye shall do no manner of work: *it shall be* a statute for ever throughout your generations in all your dwellings.","32":"It *shall be* unto you a sabbath of rest, and ye shall afflict your souls: in the ninth *day* of the month at even, from even unto even, shall ye celebrate your sabbath.","33":"And the LORD spake unto Moses, saying,","34":"Speak unto the children of Israel, saying, The fifteenth day of this seventh month *shall be* the feast of tabernacles *for* seven days unto the LORD.","35":"On the first day *shall be* an holy convocation: ye shall do no servile work","36":"Seven days ye shall offer an offering made by fire unto the LORD: on the eighth day shall be an holy convocation unto you; and ye shall offer an offering made by fire unto the LORD: it *is* a solemn assembly; *and* ye shall do no servile work","37":"These *are* the feasts of the LORD, which ye shall proclaim *to be* holy convocations, to offer an offering made by fire unto the LORD, a burnt offering, and a meat offering, a sacrifice, and drink offerings, every thing upon his day:","38":"Beside the sabbaths of the LORD, and beside your gifts, and beside all your vows, and beside all your freewill offerings, which ye give unto the LORD.","39":"Also in the fifteenth day of the seventh month, when ye have gathered in the fruit of the land, ye shall keep a feast unto the LORD seven days: on the first day *shall be* a sabbath, and on the eighth day *shall be* a sabbath.","40":"And ye shall take you on the first day the boughs of goodly trees, branches of palm trees, and the boughs of thick trees, and willows of the brook; and ye shall rejoice before the LORD your God seven days.","41":"And ye shall keep it a feast unto the LORD seven days in the year. *It shall be* a statute for ever in your generations: ye shall celebrate it in the seventh month.","42":"Ye shall dwell in booths seven days; all that are Israelites born shall dwell in booths:","43":"That your generations may know that I made the children of Israel to dwell in booths, when I brought them out of the land of Egypt: I *am* the LORD your God.","44":"And Moses declared unto the children of Israel the feasts of the LORD."}},"tsk":{"2":[{"kopje":"de vaste feesttijden","refs":["Ex 34:22","Lev 23:24","Lev 23:25","Joh 10:22","Lev 23:4","Lev 23:37","Ex 23:14-17","Jes 1:13","Jes 1:14","Jes 33:20","Klaagl 1:4","Hos 2:10","Nahum 1:15","Joh 5:1","Kol 2:1"]},{"kopje":"uitroepen","refs":["Ex 32:5","Num 10:2","Num 10:3","Num 10:10","2 Kon 10:20","2 Kron 30:5","Ps 81:4","Joël 1:14","Joël 2:15","Jona 3:5-9"]}],"10":[{"kopje":"Als","refs":["Lev 14:34"]},{"kopje":"dan zult u","refs":["Lev 2:12-16","Ex 22:29","Ex 23:16","Ex 23:19","Ex 34:22","Ex 34:26","Num 15:2","Num 15:18-21","Num 28:26","Deut 16:9","Joz 3:15"]},{"kopje":"schoof","refs":["Spr 3:9","Spr 3:10","Ezech 44:30","Rom 11:16","1 Kor 15:20-23","Jak 1:18","Openb 14:4"]}],"13":[{"kopje":"zijn spijsoffer","refs":["Lev 2:14-16","Lev \" data-code=\"H5656\">servile</span> work","8":"But ye shall <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> an offering made by <span class=\"wl wl-kjv\" data-code=\"H801\">fire</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> in the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> is an <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H4744\">convocation:</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> no <span class=\"wl wl-kjv\" data-code=\"H5656\">servile</span> work","9":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","10":"<span class=\"wl wl-kjv\" data-code=\"H1696\">Speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, When ye be <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto you, and shall <span class=\"wl wl-kjv\" data-code=\"H7114\">reap</span> the <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> thereof, then ye shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> a <span class=\"wl wl-kjv\" data-code=\"H6016\">sheaf</span> of the <span class=\"wl wl-kjv\" data-code=\"H7225\">firstfruits</span> of your <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> unto the priest:","11":"And he shall <span class=\"wl wl-kjv\" data-code=\"H5130\">wave</span> the <span class=\"wl wl-kjv\" data-code=\"H6016\">sheaf</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to be <span class=\"wl wl-kjv\" data-code=\"H7522\">accepted</span> for you: on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow</span> after the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall wave","12":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H6213\">offer</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when ye <span class=\"wl wl-kjv\" data-code=\"H5130\">wave</span> the <span class=\"wl wl-kjv\" data-code=\"H6016\">sheaf</span> an he <span class=\"wl wl-kjv\" data-code=\"H3532\">lamb</span> without <span class=\"wl wl-kjv\" data-code=\"H8549\">blemish</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">first</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> unto the LORD.","13":"And the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> tenth <span class=\"wl wl-kjv\" data-code=\"H6241\">deals</span> of fine <span class=\"wl wl-kjv\" data-code=\"H5560\">flour</span> <span class=\"wl wl-kjv\" data-code=\"H1101\">mingled</span> with <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> an offering made by <span class=\"wl wl-kjv\" data-code=\"H801\">fire</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for a <span class=\"wl wl-kjv\" data-code=\"H5207\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H7381\">savour:</span> and the drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offering</span> thereof shall be of <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> part of an hin.","14":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> neither <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> nor parched <span class=\"wl wl-kjv\" data-code=\"H7039\">corn,</span> nor green <span class=\"wl wl-kjv\" data-code=\"H3759\">ears,</span> until the <span class=\"wl wl-kjv\" data-code=\"H6106\">selfsame</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">that</span> ye have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> an <span class=\"wl wl-kjv\" data-code=\"H7133\">offering</span> unto your <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> it shall be a <span class=\"wl wl-kjv\" data-code=\"H2708\">statute</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> throughout your <span class=\"wl wl-kjv\" data-code=\"H1755\">generations</span> in all your dwellings.","15":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H5608\">count</span> unto you from the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow</span> after the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath,</span> from the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that ye <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H6016\">sheaf</span> of the wave <span class=\"wl wl-kjv\" data-code=\"H8573\">offering;</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths</span> shall <span class=\"wl wl-kjv\" data-code=\"H1961\">be</span> complete:","16":"Even <span class=\"wl wl-kjv\" data-code=\"H5704\">unto</span> the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow</span> after the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H5608\">number</span> <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> a <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> unto the LORD.","17":"Ye shall bring <span class=\"wl wl-kjv\" data-code=\"H935\">out</span> of your <span class=\"wl wl-kjv\" data-code=\"H4186\">habitations</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8573\">wave</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">loaves</span> of <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> tenth <span class=\"wl wl-kjv\" data-code=\"H6241\">deals:</span> they shall be of fine <span class=\"wl wl-kjv\" data-code=\"H5560\">flour;</span> they shall be <span class=\"wl wl-kjv\" data-code=\"H644\">baken</span> with <span class=\"wl wl-kjv\" data-code=\"H2557\">leaven;</span> they are the <span class=\"wl wl-kjv\" data-code=\"H1061\">firstfruits</span> unto the LORD.","18":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> with the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs</span> without <span class=\"wl wl-kjv\" data-code=\"H8549\">blemish</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">first</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1241\">young</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H352\">rams:</span> they shall be for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> with their meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering,</span> and their drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offerings,</span> even an offering made by <span class=\"wl wl-kjv\" data-code=\"H801\">fire,</span> of <span class=\"wl wl-kjv\" data-code=\"H5207\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H7381\">savour</span> unto the LORD.","19":"Then ye shall <span class=\"wl wl-kjv\" data-code=\"H6213\">sacrifice</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8163\">kid</span> of the <span class=\"wl wl-kjv\" data-code=\"H5795\">goats</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">first</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> for a <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of peace offerings.","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H5130\">wave</span> them with the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of the <span class=\"wl wl-kjv\" data-code=\"H1061\">firstfruits</span> for a wave <span class=\"wl wl-kjv\" data-code=\"H8573\">offering</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> with the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs:</span> they shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for the priest.","21":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaim</span> on the <span class=\"wl wl-kjv\" data-code=\"H6106\">selfsame</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that it may be an <span class=\"wl wl-kjv\" data-code= led Nisan and Abih, beginning with the Vernal Equinox, (or, Springs day like night) agreeing mostly with our March. See Exod. 13. on verse 4. and Numb. 9. on verse 1.] on the fourteenth of the month, betwixt two Evens, [See of this phrase, Exod. 12. on verse 6.] is the LORD&acirc;&euro;&trade;s Pascha (or, Passover). [Heb. Pesach, i.e. Passing over, or passing by. Thus the Feast is called by a Sacramental kind of speaking; when as it was but a memorial of the Angels passing by in Egypt. Compare herewith, Exod. 12. 11. and Gen. 17. 10. with the note]"}],"6":[{"catchword":null,"tekst":"And on the fifteenth day of the same month, is the Feast of the unleavened (bread-loaves) of the LORD: seven days shall ye eat unleavened (bread)."}],"7":[{"catchword":null,"tekst":"On the first day, [i.e. on this same fifteenth day of the month, and on the seventh after, as followeth, verse 8. shall ye exercise yourselves in work of God&acirc;&euro;&trade;s worship, and refrain from daily labour] ye shall do no servile work. [i.e. such as may let you, to perform the service ye owe to God this day, and which may weary you."}],"8":[{"catchword":null,"tekst":"But ye shall offer fire-offerings to the LORD, [See above chap. 1. 9.] seven days: on the seventh there shall be an holy convocation: ye shall do no servile work."}],"9":[{"catchword":null,"tekst":"And the LORD spoke to Moseh, saying:"}],"10":[{"catchword":null,"tekst":"Speak unto the children of Israel, and say to them: When ye shall be come into the Land, which I shall give unto you, and ye shall Harvest, then shall ye bring a sheaf [The Hebrew word doth signify the tenth part of a Epha, Exod. 16. 36. and a sheaf seemeth to have its denomination thence, because that usually they could or did thrash an Epha-measure, out of a sheaf] of the firstlings of your Harvest unto the Priest."}],"11":[{"catchword":null,"tekst":"And he shall wave that sheaf before the face of the LORD, that it may be acceptable for you: [Heb. for your acceptableness, or well-pleasing] on the second day after the Sabbath [i.e. on the sixteenth day of the month; the first day after the Passover, and the second day of the unleavened bread-loaves] shall the Priest wave the same."}],"12":[{"catchword":null,"tekst":"Ye shall likewise on that day when ye shall bring that sheaf, prepare a perfect Lamb, of one year, [Heb. the son of one year, i.e. a year old. So Numb. 7. 17, 21, 33, etc.] for a burnt-offering to the LORD."}],"13":[{"catchword":null,"tekst":"And his meat-offering, two tenths of meal-flower mixed with oil for a fire-offering, for a pleasant smell to the LORD; [See Gen. 8. on verse 21.] and his drink-offering of wine, [Understand such sacrifices, wherein liquid matters, as wine and oil, were offered: so below verse 18. and 37. see Gen. 35. on verse 15. and compare Exod. 29. 40.] the South part of a Hin. [of this measure, see above chap. 19. on verse 36.]"}],"14":[{"catchword":null,"tekst":"and ye shall eat no bread, nor parched corn, nor green ears, until that same day, that ye shall have brought the sacrifice of your God: [The meaning is, that they might not taste or use the least of any of their new fruits, without having first offered the firstling thereof to God, which must be done the day before mentioned, verse 11.] it is an everlasting institution, for your generations in all your dwellings."}],"15":[{"catchword":null,"tekst":"After that, ye shall number to your selves, from the second day after the Sabbath, from the day, that ye shall have brought the sheaf of the wave-offering, [See of the wave-offering, above chap. 7. on verse 30.] they shall be seven perfect Sabbaths, [or, weeks]"}],"16":[{"catchword":null,"tekst":"Until the second day after the seventh Sabbath, shall ye number fifty days: then ye shall offer a new meat-offering to the LORD. [Compare Numb. 28. 26. and understand this of the offering which was to be made of new corn or fruits, dinstict from the free-will-meat-offerings, whereof ye may see above chap. 2. 12.]"}],"17":[{"catchword":null,"tekst":"Ye shall bring two wave-bread-(loaves) out of your dwellings; they shall be of two Tenths [viz. of an Epha, of which measure, see further, Exod. 16. on verse 36. and above chap. 5. on verse 11.] of meal-flower, leavened, they shall be baken; [this was permitted in these sacrifices of the first fruits, but not in the free will meat-offerings, above ch. 2. 11. 6.] they are the firstlings to the LORD. [Compare above chap. 2. 12.]"}],"18":[{"catchword":null,"tekst":"Ye shall likewise with the bread offer seven perfect Lambs, of one year [Heb. sons of one year, and so in the sequel] and one bullock, the young of a bullock [Heb. the son of a Bull, i.e. a young one.] and two Rams: they shall be a burnt-offering to the LORD, with their meat-offering, and their drink-offerings, a fire-offering (for) a pleasant smell to the LORD."}],"19":[{"catchword":null,"tekst":"Also you shall prepare on he-goat for a sin-offering, and two lambs of a year, for a thank-offering."}],"20":[{"catchword":null,"tekst":"Then shall the Priest wave the same, with the bread of the firstlings, (for a) wave-offering before the face of the LORD, with the two lambs: [Or, after the bread of the firstling, after which he shall prepare both the Lambs] they shall be an holy thing to the LORD, for the Priest."}],"21":[{"catchword":null,"tekst":"And ye shall proclaim [Ye, viz. the Priests] (that) ye shall have an holy Convocation: no servile work shall ye do; it is an everlasting Institution in all your dwellings for your generations."}],"22":[{"catchword":null,"tekst":"Now when ye shall reap in the Harvest of your land, thou shalt not in thy reaping, wholly reap off [Heb. accomplish, (finish), reaping, i.e. not utterly r wholly cut down and gather in] the corner of the field, [i.e. the ears or stalks, which stand somewhat out at the corners or ends of the field, and are not heeded so much, or otherwise neglected to be cut off by the Reapers] nor gather up the gleaning of thy harvest: [i.e. the residue, or remainder, to be gathered up afterwards by other hands] thou shalt leave them for the poor, and for the stranger: I am the LORD thy God."}],"23":[{"catchword":null,"tekst":"And the LORD spoke to Moseh, saying:"}],"24":[{"catchword":null,"tekst":"Speak unto the children of Israel, saying; in the seventh month [Called Ethanim, 1 Kings 8. 2. beginning in our September, when the Sun entereth into Libra, and maketh the latter day-like-night or Equinox] on the first of the month, ye shall have a rest, a rememberance of the sounding, [or, a memorial feast of soundings: or, according to some, a sounding of Remembrance; which was made by the Priests, by the blowing of a Trumpet, 1. To give warning and notice unto the people, That now the Civil year had its beginning, according to which all civil affairs, contracts, dealings, & c. were to be ordered, and transacted, and determined. 2. To exhort the people for to give God thanks for all his Benefits; which they enjoyed all the year past. 3. To prepare themselves, by acknowledging of their sins, and sorrow for them, against the day of Expiation, which fell on the tenth day of that month: see below verse 27.] an holy Convocation."}],"25":[{"catchword":null,"tekst":"Ye shall do no servile work: but ye shall offer fire-offerings to the LORD."}],"26":[{"catchword":null,"tekst":"Moreover the LORD spoke unto Moseh, saying:"}],"27":[{"catchword":null,"tekst":"Yet [Or, however] on the tenth of his seventh month, (there) shall be the Expiation-day; [Understand such a Feast of the Israelites, wherein they atoned themselves with the LORD, by making expiation for their sins, with humiliation, fasting, and prayer] ye shall have an holy convocation: then ye shall humble your souls; [see above chap. 16. on verse 29.] and shall offer a fire-offering to the LORD."}],"28":[{"catchword":null,"tekst":"And on that same day ye shall do no work: for it is the Expiation-day, for to make Expiation over you, before the face of the LORD your God."}],"29":[{"catchword":null,"tekst":"For every soul [i.e. all persons; understand not only all the Israelites, but all the Israelitish Proselytes likewise, that shall have been received among them, out of other Nations, and embraced the Israelites Religion, and so in the next verse] that shall not have humbled himself on that same day, the same shall be extirpated out of her people. [See Gen. 17. verse 14.]"}],"30":[{"catchword":null,"tekst":"Every soul likewise that shall have done any work on that same day; that same soul I will destroy out of the midst of her people."}],"31":[{"catchword":null,"tekst":"Ye shall do no work: it is an everlasting institution for your generations, in all your dwellings."}],"32":[{"catchword":null,"tekst":"It shall be a Sabbath of rest unto you; then ye shall humble your souls; on the ninth of the month in the evening, [viz. when the ninth day was now past, and the even come, which gave beginning to the next (tenth) day, as in the Creation, the evening was before the morning; and this manner of accounting days was in use among the Jews. Compare Gen. 1. 5.] from the even to the even, [i.e. from the going down of the Sun, such a day, to the going down of it the next day] shall ye rest that Sabbath."}],"33":[{"catchword":null,"tekst":"And the LORD spoke to Moseh, saying:"}],"34":[{"catchword":null,"tekst":"Speak to the children of Israel, saying; On the fifteenth day of this seventh month, shall the Feast of Leave-huts, (or, Tabernacles) be unto the LORD seven days: [These huts were not made up of boards, or plank skins, woolen, or linen stuff, but only of green boughs, according as is showed below verse 40. An example hereof is to be seen, Nehem. 8. 16.]"}],"35":[{"catchword":null,"tekst":"On the first day there shall be an holy Convocation; ye shall do no servile work."}],"36":[{"catchword":null,"tekst":"Seven days shall ye offer fire-offerings to the LORD: on the eight day ye shall have an holy Convocation, and shall offer fire-offering to the LORD: it is a Prohibition-day, [Heb. inhibition, or forbidding, or keeping up. It being forbidden on this day to do any servile work, and the people being kept up, to remain together for the performing of the public worship, see also Numb. 29. 35. Deut. 16. 8. 2 Kings 10. 20. Nehem. 8. 18. Joel 1. 14. Amos 5. 21. Oth. Solemn assembly, holy day, oth. shutting, or closing-day, i.e. the last and chiefest day, wherewith the Feast was concluded: see Deut. 16. 8. John 7. 37.] ye shall do no servile work."}],"37":[{"catchword":null,"tekst":"These are the set high-times of the LORD, which ye shall proclaim (for) holy Convocations, for to offer unto the LORD fire-offering, burnt-offering, and meat-offering, slay-offering, and drink-offerings, each daily upon its day."}],"38":[{"catchword":null,"tekst":"Besides the Sabbaths of the LORD, and besides your gifts, and besides all your vows, and besides all your free-will-offerings, which ye shall give unto the LORD."}],"39":[{"catchword":null,"tekst":"But upon the fifteenth day of the seventh month, when ye shall have gathered in the income of the Land, ye shall celebrate the LORD&acirc;&euro;&trade;s Feast seven days: on the first day there shall be rest, and on the eight day there shall be rest."}],"40":[{"catchword":null,"tekst":"And on the first day ye shall take boughs [Although the Hebrew word do properly signify fruits, yet 2 Kings 19. 30. it is likewise taken for anything that shooteth and growth from the root. And that here the boughs are to be understood, appeareth sufficiently, by the sequel here, and out of Nehem. 8. 16. where more sorts of boughs and branches are specified; and of these they made their Leave-huts] of goodly trees, [as Olives, Myrtles, Palms, see Nehem. 8. 16.] palm boughs, [Heb. hands of palms] and bushes of tight trees, with brook-willows, [wherewith the fore-mentioned boughs and bushes, were to be fastened and held together, and some do conceive] and shall be cheerful seven days, before the face of the LORD your God."}],"41":[{"catchword":null,"tekst":"And ye shall celebrate that Feast to the LORD seven days in the year: it is an everlasting institution for your generations: in the seventh month shall ye celebrate the same."}],"42":[{"catchword":null,"tekst":"Seven days shall ye dwell in the Leave-huts: all in born in Israel, shall dwell in leave-huts:"}],"43":[{"catchword":null,"tekst":"That your Generations may know, that I made the children of Israel to dwell in Leave-huts, [viz. for the space of forty years, while they wandered in the wilderness, implying. That he had wonderfully kept and maintained them all that while, without houses, to inhabit, and without the fruits of the earth to feed them] when I led them forth out of the Land of Egypt. I am the LORD your God."}],"44":[{"catchword":null,"tekst":"Thus Moseh pronounced the set high-times of the LORD, unto the children of Israel."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
