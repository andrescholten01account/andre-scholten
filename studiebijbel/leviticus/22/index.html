annes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Daarna sprak de HEERE tot Mozes en zei:","2":"Spreek tot Aäron en tot zijn zonen, dat zij zich afzonderen van de heilige dingen van de kinderen van Israël, die zij Mij heiligen, opdat zij de Naam van Mijn heiligheid niet ontheiligen; Ik ben de HEERE!","3":"Zeg tegen hen: Elke man onder uw geslachten, uit uw hele nageslacht, die tot de heilige dingen zal naderen die de kinderen van Israël de HEERE heiligen, terwijl zijn onreinheid op hem is; die mens zal van voor Mijn aangezicht uitgeroeid worden; Ik ben de HEERE!","4":"Niemand van het nageslacht van Aäron die melaats is, of een vloed heeft, zal van die heilige dingen eten, totdat hij rein is; alsook wie iets aanraakt dat onrein is door een dood lichaam, of een man aan wie het zaad van de gemeenschap ontgaat.","5":"Of wie ook maar enig kruipend gedierte zal hebben aangeraakt waardoor hij onrein wordt, of een mens waardoor hij onrein wordt, naar al zijn onreinheid;","6":"De mens die dat zal hebben aangeraakt, zal onrein zijn tot aan de avond, en hij zal van die heilige dingen niet eten, maar zal zijn lichaam met water baden.","7":"Als de zon ondergegaan zal zijn, dan zal hij rein zijn; en daarna zal hij van die heilige dingen eten, want dat is zijn voedsel.","8":"Het dode aas en het verscheurde zal hij niet eten, om daarmee onrein te worden; Ik ben de HEERE!","9":"Zij zullen dan Mijn bevel onderhouden, opdat zij daarover geen zonde dragen en daarin sterven, als zij dat ontheiligd zouden hebben; Ik ben de HEERE, Die hen heiligt!","10":"Ook zal geen vreemde het heilige eten; een bijwoner van de priester, en een dagloner, zullen het heilige niet eten.","11":"Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten.","12":"Maar als de dochter van de priester aan een vreemde man zal toebehoren, zal zij van het hefoffer van de heilige dingen niet eten.","13":"Maar als de dochter van de priester een weduwe of een verstotene zal zijn, en geen nageslacht heeft, en naar het huis van haar vader zal zijn teruggekeerd zoals in haar jeugd, dan zal zij van het voedsel van haar vader eten; maar geen vreemde zal daarvan eten.","14":"En wanneer iemand het heilige per ongeluk zal hebben gegeten, dan zal hij een vijfde deel daarboven toevoegen, en zal het aan de priester met het heilige teruggeven.","15":"Zo zullen zij de heilige dingen van de kinderen van Israël, die zij de HEERE zullen hebben gegeven, niet ontheiligen;","16":"En hen de ongerechtigheid van de schuld doen dragen, als zij hun heilige dingen zouden eten; want Ik ben de HEERE, Die hen heiligt!","17":"Verder sprak de HEERE tot Mozes en zei:","18":"Spreek tot Aäron, en tot zijn zonen, en tot al de kinderen van Israël, en zeg tegen hen: Wie ook maar uit het huis van Israël, en uit de vreemdelingen in Israël is, die zijn offergave zal offeren voor al hun geloften, en voor al hun vrijwillige offers, die zij de HEERE als brandoffer zullen offeren;","19":"Het zal naar uw welgevallen zijn: een volkomen mannetje, van de runderen, van de lammeren, of van de geiten.","20":"U zult niets offeren waarin een gebrek is; want het zou niet aangenaam zijn voor u.","21":"En als iemand een dankoffer aan de HEERE zal offeren, om een gelofte van de runderen of van de schapen na te komen, of een vrijwillig offer, dan zal het volkomen zijn, opdat het aangenaam is; geen gebrek zal daarin zijn.","22":"Het blinde, of gebrokene, of verlamde, of dat een wrat heeft, of droge schurftheid, of etterige schurftheid, deze zult u de HEERE niet offeren, en daarvan zult u de HEERE geen vuuroffer op het altaar geven.","23":"Doch een os, of klein vee, dat te lang of te kort van leden is, dat zult u voor een vrijwillig offer bereiden; maar voor een gelofte zou het niet aangenaam zijn.","24":"Het geplette, of gekneusde, of gescheurde, of gesnedene, zult u de HEERE niet offeren; dat zult u in uw land niet doen.","25":"U zult ook uit de hand van de vreemde van al deze dingen geen voedsel van uw God offeren; want hun verdorvenheid is in hen, in hen is gebrek, zij zouden niet aangenaam zijn voor u.","26":"Verder sprak de HEERE tot Mozes en zei:","27":"Wanneer een os, of lam, of geit geboren zal zijn, dan zal die zeven dagen onder zijn moeder zijn; daarna, vanaf de achtste dag en verder, zal hij aangenaam zijn als offergave van het vuuroffer voor de HEERE.","28":"U zult ook een os, of klein vee, hem en zijn jong, niet op één dag slachten.","29":"En als u een lofoffer aan de HEERE zult slachten, zult u het naar uw wil slachten.","30":"Het zal op dezelfde dag gegeten worden; u zult daarvan niets overlaten tot de morgen; Ik ben de HEERE!","31":"Daarom zult u Mijn geboden houden, en die doen; Ik ben de HEERE!","32":"En u zult Mijn heilige Naam niet ontheiligen, opdat Ik in het midden van de kinderen van Israël geheiligd word; Ik ben de HEERE, Die u heiligt!","33":"Die u uit het land Egypte heb uitgevoerd, opdat Ik u tot een God zou zijn; Ik ben de HEERE!"},"SV":{"1":"Daarna sprak de HEERE tot Mozes, zeggende:","2":"Spreek tot Aäron en tot zijn zonen, dat zij zich van de heilige dingen der kinderen Israëls, die zij Mij heiligen, afzonderen, opdat zij de Naam Mijner heiligheid niet ontheiligen; Ik ben de HEERE!","3":"Zeg tot hen: Alle man onder uw geslachten, die uit uw ganse zaad tot de heilige dingen, die de kinderen Israëls den HEERE heiligen, naderen zal, als zijn onreinigheid op hem is; diezelve mens zal van voor Mijn aangezicht uitgeroeid worden; Ik ben de HEERE!","4":"Niemand van het zaad van Aäron, die melaats is, of een vloed heeft, zal van die heilige dingen eten, totdat hij rein is; mitsgaders die iets aanroert, dat onrein is van een dood lichaam, of iemand, wien het zaad der bijligging ontgaat.","5":"Of zo wie aangeroerd zal hebben enig kruipend gedierte, waarvan hij onrein is, of een mens, waarvan hij onrein is, naar al zijn onreinigheid;","6":"De mens, die dat aangeroerd zal hebben, zal onrein zijn tot aan den avond, en hij zal van die heilige dingen niet eten, maar zal zijn vlees met water baden.","7":"Als de zon zal ondergegaan zijn, dan zal hij rein zijn; en daarna zal hij van die heilige dingen eten; want dat is zijn spijze.","8":"Het dode aas, en het verscheurde zal hij niet eten, om daarmede onrein te worden; Ik ben de HEERE!","9":"Zij zullen dan Mijn bevel onderhouden, opdat zij geen zonde daarover dragen en daarin sterven, als zij die ontheiligd zouden hebben; Ik ben de HEERE, die hen heilige!","10":"Ook zal geen vreemde het heilige eten; een bijwoner des priesters, en een dagloner, zullen het heilige niet eten.","11":"Wanneer dan nog de priester een ziel met zijn geld zal gekocht hebben, die zal daarvan eten; en de ingeborene van zijn huis, die zullen van zijn spijze eten.","12":"Maar als des priesters dochter een vreemden man zal toebehoren, zij zal van het hefoffer der heilige dingen niet eten.","13":"Doch als des priesters dochter een weduwe of een verstotene zal zijn, en geen zaad hebben, en tot haars vaders huis, als in haar jonkheid, zal wedergekeerd zijn, zo zal zij van de spijze haars vaders eten; maar geen vreemde zal daarvan eten.","14":"En wanneer iemand het heilige door dwaling zal gegeten hebben, zo zal hij deszelfs vijfde deel daarboven toedoen, en zal het den priester met het heilige wedergeven.","15":"Zo zullen zij niet ontheiligen de heilige dingen der kinderen Israëls, die zij den HEERE zullen gegeven hebben;","16":"En hen doen dragen de ongerechtigheid der schuld, als zij hun heilige dingen zouden eten; want Ik ben de HEERE, Die hen heilige!","17":"Verder sprak de HEERE tot Mozes, zeggende:","18":"Spreek tot Aäron, en tot zijn zonen, en tot al de kinderen Israëls, en zeg tot hen: Zo wie uit het huis van Israël, en uit de vreemdelingen in Israël is, die zijn offerande zal offeren naar al hun geloften, en naar al hun vrijwillige offeren, die zij den HEERE ten brandoffer zullen offeren;","19":"Het zal naar uw welgevallen zijn, een volkomen mannetje, van de runderen, van de lammeren, of van de geiten.","20":"Gij zult niet offeren iets, waarin een gebrek is; want het zou niet aangenaam zijn voor u.","21":"En als iemand een dankoffer den HEERE zal offeren, uitzonderende van de runderen of van de schapen een gelofte, of vrijwillig offer, het zal volkomen zijn, opdat het aangenaam zij; geen gebrek zal daarin zijn.","22":"Het blinde, of gebrokene, of verlamde, of wratte, of droge schurftheid, of etterige schurftheid hebbende, deze zult gij den HEERE niet offeren, en daarvan zult gij den HEERE geen vuuroffer op het altaar geven.","23":"Doch een os, of klein vee, te lang of te verkrompen in leden, die zult gij tot een vrijwillig offer bereiden; doch tot een gelofte zou het niet aangenaam zijn.","24":"Het gedrukte, of gestotene, of gescheurde, of gesnedene, zult gij den HEERE niet offeren; dat zult gij in uw land niet doen.","25":"Gij zult ook uit de hand des vreemden van al deze dingen uw God geen spijs offeren; want hun verdorvenheid is in hen, in dezelve is gebrek, zij zouden niet aangenaam zijn voor u.","26":"Wijders sprak de HEERE tot Mozes, zeggende:","27":"Wanneer een os, of lam, of geit zal geboren zijn, zo zal die zeven dagen onder zijn moeder zijn; daarna, van den achtsten dag en daarover, zal hij aangenaam zijn tot offerande des vuuroffers den HEERE.","28":"Gij zult ook een os, of klein vee, hem en zijn jong, op een dag niet slachten.","29":"En als gij een lofoffer den HEERE zult slachten, naar uw wil zult gij het slachten.","30":"Het zal op denzelfden dag gegeten worden; gij zult daarvan niet overlaten tot op den morgen; Ik ben de HEERE!","31":"Daarom zult gij Mijn geboden houden, en dezelve doen; Ik ben de HEERE!","32":"En gij zult Mijn heiligen Naam niet ontheiligen, opdat Ik in het midden der kinderen Israëls geheiligd worde; Ik ben de HEERE, die u heilige!","33":"Die u uit Egypteland uitgevoerd heb, opdat Ik u tot een God zij; Ik ben de HEERE!"},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Speak unto Aaron and to his sons, that they separate themselves from the holy things of the children of Israel, and that they profane not my holy name *in those things* which they hallow unto me: I *am* the LORD.","3":"Say unto them, Whosoever *he be* of all your seed among your generations, that goeth unto the holy things, which the children of Israel hallow unto the LORD, having his uncleanness upon him, that soul shall be cut off from my presence: I *am* the LORD.","4":"What man soever of the seed of Aaron *is* a leper, or hath a running issue; he shall not eat of the holy things, until he be clean. And whoso toucheth any thing *that is* unclean *by* the dead, or a man whose seed goeth","5":"Or whosoever toucheth any creeping thing, whereby he may be made unclean, or a man of whom he may take uncleanness, whatsoever uncleanness","6":"The soul which hath touched any such shall be unclean until even, and shall not eat of the holy things, unless he wash his flesh with water.","7":"And when the sun is down, he shall be clean, and shall afterward eat of the holy things; because it *is* his food.","8":"That which dieth of itself, or is torn *with beasts*, he shall not eat to defile himself therewith: I *am* the LORD.","9":"They shall therefore keep mine ordinance, lest they bear sin for it, and die therefore, if they profane it: I the LORD do sanctify","10":"There shall no stranger eat *of* the holy thing: a sojourner of the priest, or an hired servant, shall not eat *of* the holy thing.","11":"But if the priest buy *any* soul with his money, he shall eat of it, and he that is born in his house: they shall eat of his meat.","12":"If the priest's daughter also be *married* unto a stranger, she may not eat of an offering of the holy things.","13":"But if the priest's daughter be a widow, or divorced, and have no child, and is returned unto her father's house, as in her youth, she shall eat of her father's meat: but there shall no stranger eat","14":"And if a man eat *of* the holy thing unwittingly, then he shall put the fifth *part* thereof unto it, and shall give *it* unto the priest with the holy thing.","15":"And they shall not profane the holy things of the children of Israel, which they offer unto the LORD;","16":"Or suffer them to bear the iniquity of trespass, when they eat their holy things: for I the LORD do sanctify","17":"And the LORD spake unto Moses, saying,","18":"Speak unto Aaron, and to his sons, and unto all the children of Israel, and say unto them, Whatsoever *he be* of the house of Israel, or of the strangers in Israel, that will offer his oblation for all his vows, and for all his freewill offerings, which they will offer unto the LORD for a burnt offering;","19":"*Ye shall offer* at your own will a male without blemish, of the beeves, of the sheep, or of the goats.","20":"*But* whatsoever hath a blemish, *that* shall ye not offer: for it shall not be acceptable","21":"And whosoever offereth a sacrifice of peace offerings unto the LORD to accomplish *his* vow, or a freewill offering in beeves or sheep, it shall be perfect to be accepted; there shall be no blemish","22":"Blind, or broken, or maimed, or having a wen, or scurvy, or scabbed, ye shall not offer these unto the LORD, nor make an offering by fire of them upon the altar unto the LORD.","23":"Either a bullock or a lamb that hath any thing superfluous or lacking in his parts, that mayest thou offer *for* a freewill offering; but for a vow it shall not be accepted.","24":"Ye shall not offer unto the LORD that which is bruised, or crushed, or broken, or cut; neither shall ye make *any offering thereof* in your land.","25":"Neither from a stranger's hand shall ye offer the bread of your God of any of these; because their corruption *is* in them, *and* blemishes *be* in them: they shall not be accepted","26":"And the LORD spake unto Moses, saying,","27":"When a bullock, or a sheep, or a goat, is brought forth, then it shall be seven days under the dam; and from the eighth day and thenceforth it shall be accepted for an offering made by fire unto the LORD.","28":"And *whether it be* cow or ewe, ye shall not kill it and her young both in one day.","29":"And when ye will offer a sacrifice of thanksgiving unto the LORD, offer *it* at your own will.","30":"On the same day it shall be eaten up; ye shall leave none of it until the morrow: I *am* the LORD.","31":"Therefore shall ye keep my commandments, and do them: I *am* the LORD.","32":"Neither shall ye profane my holy name; but I will be hallowed among the children of Israel: I *am* the LORD which hallow","33":"That brought you out of the land of Egypt, to be your Go s=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> that they <span class=\"wl wl-kjv\" data-code=\"H5144\">separate</span> themselves from the holy <span class=\"wl wl-kjv\" data-code=\"H6944\">things</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and that they <span class=\"wl wl-kjv\" data-code=\"H2490\">profane</span> not my <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> in those things which they <span class=\"wl wl-kjv\" data-code=\"H6942\">hallow</span> unto me: I am the LORD.","3":"<span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H376\">Whosoever</span> he be of all your <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> among your <span class=\"wl wl-kjv\" data-code=\"H1755\">generations,</span> that <span class=\"wl wl-kjv\" data-code=\"H7126\">goeth</span> unto the holy <span class=\"wl wl-kjv\" data-code=\"H6944\">things,</span> which the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">hallow</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> having his <span class=\"wl wl-kjv\" data-code=\"H2932\">uncleanness</span> upon him, that <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from my <span class=\"wl wl-kjv\" data-code=\"H6440\">presence:</span> I am the LORD.","4":"What man <span class=\"wl wl-kjv\" data-code=\"H376\">soever</span> of the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> is a <span class=\"wl wl-kjv\" data-code=\"H6879\">leper,</span> or hath a running <span class=\"wl wl-kjv\" data-code=\"H2100\">issue;</span> he shall not < function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);

  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;

}

}

function kopieerVers(n) {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
