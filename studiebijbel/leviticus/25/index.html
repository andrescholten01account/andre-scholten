ohannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Verder sprak de HEERE tot Mozes, bij de berg Sinaï, en zei:","2":"Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer u in het land gekomen zult zijn, dat Ik u geef, dan zal dat land rusten, een sabbat voor de HEERE.","3":"Zes jaar zult u uw akker bezaaien, en zes jaar uw wijngaard snoeien, en de opbrengst daarvan inzamelen.","4":"Maar in het zevende jaar zal voor het land een sabbat van rust zijn, een sabbat voor de HEERE; uw akker zult u niet bezaaien en uw wijngaard niet snoeien.","5":"Wat vanzelf van uw oogst zal gegroeid zijn, zult u niet inoogsten, en de druiven van uw ongesnoeide wijnstok zult u niet afsnijden; het zal een jaar van rust voor het land zijn.","6":"En de *opbrengst* *van* de sabbat van het land zal voor u tot voedsel zijn, voor u, en voor uw knecht, en voor uw dienstmaagd, en voor uw dagloner, en voor uw bijwoner, die als vreemdelingen bij u verblijven;","7":"Alsook voor het vee, en voor het gedierte, dat in uw land is, zal al de opbrengst daarvan tot voedsel zijn.","8":"U zult u ook zeven jaarweken tellen, zevenmaal zeven jaar; zodat de dagen van de zeven jaarweken u negenenveertig jaar zullen zijn.","9":"Daarna zult u in de zevende maand, op de tiende van de maand, de bazuin van het geschal laten doorgaan; op de verzoendag zult u de bazuin laten doorgaan in uw hele land.","10":"En u zult dat vijftigste jaar heiligen, en vrijheid uitroepen in het land, voor al zijn inwoners; het zal u een jubeljaar zijn; en u zult terugkeren, ieder tot zijn bezittingen, en u zult terugkeren, ieder tot zijn geslacht.","11":"Dit jubeljaar zal u het vijftigste jaar zijn; u zult niet zaaien, noch inoogsten wat vanzelf daarin zal gegroeid zijn, noch ook *de* *druiven* van de ongesnoeide wijnstokken erin afsnijden.","12":"Want dat is het jubeljaar; het zal u heilig zijn; u zult uit het veld de opbrengst daarvan eten.","13":"In dat jubeljaar zult u ieder terugkeren tot zijn bezitting.","14":"Daarom, wanneer u aan uw naaste iets te koop verkoopt, of uit de hand van uw naaste iets kopen zult, dan mag niemand de een de ander verdrukken.","15":"Naar het getal van de jaren, vanaf het jubeljaar, zult u van uw naaste kopen, en naar het getal van de jaren van de opbrengsten zal hij het aan u verkopen.","16":"Naar de veelheid van de jaren zult u zijn koopprijs vermeerderen, en naar de geringheid van de jaren zult u zijn koopprijs verminderen; want hij verkoopt aan u het getal van de opbrengsten.","17":"Dat dan niemand zijn naaste verdrukt; maar vrees voor uw God; want Ik ben de HEERE, uw God!","18":"En doe Mijn inzettingen, en houd Mijn rechten, en doe die; dan zult u zeker wonen in het land.","19":"En het land zal zijn vrucht geven, en u zult eten tot verzadiging toe; en u zult zeker daarin wonen.","20":"En als u zou zeggen: Wat zullen wij eten in het zevende jaar! Zie, wij zullen niet zaaien, en onze opbrengst niet inzamelen;","21":"Dan zal Ik Mijn zegen gebieden over u in het zesde jaar, dat het de opbrengst voor drie jaar zal voortbrengen.","22":"Het achtste jaar nu zult u zaaien, en zult van de oude opbrengst eten, tot het negende jaar toe; totdat zijn opbrengst binnengekomen is, zult u het oude eten.","23":"Het land ook zal niet voor altijd verkocht worden; want het land is van Mij, omdat u vreemdelingen en bijwoners bij Mij bent.","24":"Daarom zult u, in het hele land van uw bezitting, teruggave voor het land toelaten.","25":"Wanneer uw broeder verarmd zal zijn, en iets van zijn bezitting verkocht zal hebben, dan zal zijn losser, die hem het naast bestaat, komen, en zal het verkochte van zijn broeder lossen.","26":"En wanneer iemand geen losser zal hebben, maar zijn hand het bekomen heeft en hij gevonden zal hebben, zoveel als genoeg is tot zijn lossing;","27":"Dan zal hij de jaren van zijn verkoop berekenen, en het overschot zal hij uitkeren aan de man aan wie hij het verkocht had; en hij zal terugkeren tot zijn bezitting.","28":"Maar als zijn hand niet gevonden heeft wat genoeg is, om aan hem terug uit te keren, dan zal zijn verkochte goed blijven in de hand van diegene die het gekocht heeft, tot het jubeljaar toe; maar in het jubeljaar zal het uitgaan, en hij zal terugkeren tot zijn bezitting.","29":"Evenzo, wanneer iemand een woonhuis *in* een ommuurde stad verkocht zal hebben, dan zal zijn lossing gelden, totdat het jaar van zijn verkoop volledig zal zijn; binnen een vol jaar zal zijn lossing gelden.","30":"Maar als het niet gelost wordt, voordat het volledige jaar voor hem zal vervuld zijn, dan zal dat huis, dat in die stad is, die een muur heeft, voor altijd blijven aan hem die het gekocht heeft, onder zijn geslachten; het zal in het jubeljaar niet uitgaan.","31":"Maar de huizen van de dorpen, die rondom geen muur hebben, zullen gerekend worden als het veld van het land; daarvoor zal lossing gelden, en zij zullen in het jubeljaar uitgaan.","32":"Wat aangaat de steden van de Levieten, *en* de huizen van de steden van hun bezitting; de Levieten zullen een eeuwige lossing hebben.","33":"En als men onder de Levieten lossing gedaan zal hebben, dan zal de koop van het huis en van de stad van zijn bezitting in het jubeljaar uitgaan; want de huizen van de steden van de Levieten zijn hun bezitting te midden van de kinderen van Israël.","34":"Maar het veld van de weidegrond van hun steden zal niet verkocht worden; want het is een eeuwige bezitting voor hen.","35":"En als uw broeder verarmd zal zijn, en zijn hand bij u wankelt, dan zult u hem vasthouden, *ook al is hij* een vreemdeling en bijwoner, opdat hij bij u leeft.","36":"U zult geen rente noch overwinst van hem nemen; maar u zult vrezen voor uw God, opdat uw broeder bij u leeft.","37":"Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.","38":"Ik ben de HEERE, uw God, Die u uit het land Egypte geleid heb, om u het land Kanaän te geven, opdat Ik u tot een God ben.","39":"Evenzo, wanneer uw broeder bij u verarmd zal zijn, en zich aan u verkocht zal hebben, dan zult u hem niet laten dienen als een slaaf;","40":"Als een dagloner, als een bijwoner zal hij bij u zijn; tot het jubeljaar zal hij bij u dienen.","41":"Dan zal hij van u weggaan, hij en zijn kinderen met hem, en hij zal terugkeren tot zijn geslacht, en tot de bezitting van zijn vaderen terugkeren.","42":"Want zij zijn Mijn dienstknechten, die Ik uit het land Egypte geleid heb; zij zullen niet verkocht worden, zoals men een slaaf verkoopt.","43":"U zult geen heerschappij over hem hebben met wreedheid; maar u zult vrezen voor uw God.","44":"Wat aangaat uw slaaf of uw slavin, die u zult hebben, die zullen zijn van de volken die rondom u zijn; van hen zult u een slaaf of een slavin kopen.","45":"U zult ze ook kopen van de kinderen van de bijwoners, die als vreemdelingen bij u verblijven, uit hen en uit hun geslachten, die bij u zullen zijn, die zij in uw land verwekt zullen hebben; en zij zullen u tot een bezitting zijn.","46":"En u zult u tot bezitters over hen stellen voor uw kinderen na u, opdat zij de bezitting erven; u zult hen voor eeuwig laten dienen; maar over uw broeders, de kinderen van Israël, ieder over zijn broeder, zult u geen heerschappij hebben met wreedheid.","47":"En wanneer de hand van een vreemdeling en bijwoner, die bij u is, *iets* verkregen zal hebben, en uw broeder, die bij hem is, verarmd zal zijn, zodat hij zich aan de vreemdeling, de bijwoner die bij u is, of aan de stam van het geslacht van de vreemdeling verkocht zal hebben;","48":"Nadat hij zich verkocht zal hebben, zal er lossing voor hem gelden; een van zijn broeders zal hem lossen;","49":"Of zijn oom, of de zoon van zijn oom, zal hem lossen, of wie uit de naaste verwanten van zijn vlees uit zijn geslacht is, zal hem lossen; of heeft zijn hand iets verkregen, dan kan hij zichzelf lossen.","50":"En hij zal met zijn koper rekenen vanaf het jaar dat hij zich aan hem verkocht heeft tot het jubeljaar toe; zodat het geld van zijn verkoop zal zijn naar het getal van de jaren; naar de dagen van een dagloner zal het met hem zijn.","51":"Als er nog veel van die jaren zijn, zal hij naar verhouding daarvan tot zijn lossing van het geld waarvoor hij gekocht is, teruggeven.","52":"En als er nog weinig van die jaren zijn overgebleven, tot aan het jubeljaar, dan zal hij met hem rekenen; naar zijn jaren zal hij zijn lossing teruggeven.","53":"Als een dagloner zal hij van jaar tot jaar bij hem zijn; men zal over hem geen heerschappij hebben met wreedheid voor uw ogen.","54":"En als het is dat hij hierdoor niet gelost wordt, dan zal hij in het jubeljaar uitgaan, hij en zijn kinderen met hem.","55":"Want de kinderen van Israël zijn voor Mij dienstknechten; Mijn dienstknechten zijn zij, die Ik uit het land Egypte geleid heb; Ik ben de HEERE, uw God!"},"SV":{"1":"Verder sprak de HEERE tot Mozes, aan den berg Sinaï, zeggende:","2":"Spreek tot de kinderen Israëls, en zeg tot hen: Wanneer gij zult gekomen zijn in dat land, dat Ik u geve, dan zal dat land rusten, een sabbat den HEERE.","3":"Zes jaren zult gij uw akker bezaaien, en zes jaren uw wijngaard besnijden, en de inkomst daarvan inzamelen.","4":"Doch in het zevende jaar zal voor het land een sabbat der rust zijn, een sabbat den HEERE; uw akker zult gij niet bezaaien en uw wijngaard niet besnijden.","5":"Wat van zelf van uw oogst zal gewassen zijn, zult gij niet inoogsten, en de druiven uwer afzondering zult gij niet afsnijden; het zal een jaar der ruste voor het land zijn.","6":"En de *inkomst* *van* den sabbat des lands zal voor u tot spijze zijn, voor u, en voor uw knecht, en voor uw dienstmaagd, en voor uw dagloner, en voor uw bijwoner, die bij u als vreemdelingen verkeren;","7":"Mitsgaders voor het vee, en voor het gedierte, dat in uw land is, zal al de inkomst daarvan tot spijze zijn.","8":"Gij zult u ook tellen zeven jaarweken, zevenmaal zeven jaren; zodat de dagen der zeven jaarweken u negen en veertig jaren zullen zijn.","9":"Daarna zult gij in de zevende maand, op den tienden der maand, de bazuin des geklanks doen doorgaan; op den verzoendag zult gij de bazuin doen doorgaan in uw ganse land.","10":"En gij zult dat vijftigste jaar heiligen, en vrijheid uitroepen in het land, voor al zijn inwoners; het zal u een jubeljaar zijn; en gij zult wederkeren een ieder tot zijn bezittingen, en zult wederkeren een ieder tot zijn geslacht.","11":"Dit jubeljaar zal u het vijftigste jaar zijn; gij zult niet zaaien, noch inoogsten wat van zelf daarin zal gewassen zijn, noch ook *de* *druiven* der afzonderingen in hetzelve afsnijden.","12":"Want dat is het jubeljaar; het zal u heilig zijn; gij zult uit het veld de inkomst daarvan eten.","13":"Op dat jubeljaar zult gij ieder wederkeren tot zijn bezitting.","14":"Daarom, wanneer gij aan uw naaste wat veilbaars verkopen, of uit de hand uws naasten kopen zult, dat niemand de een den ander verdrukke.","15":"Naar het getal der jaren, van het jubeljaar af, zult gij van uw naaste kopen, en naar het getal van de jaren der inkomsten zal hij het aan u verkopen.","16":"Naar de veelheid der jaren zult gij zijn koop vermeerderen, en naar de weinigheid der jaren zult gij zijn koop verminderen; want hij verkoopt aan u het getal der inkomsten.","17":"Dat dan niemand zijn naaste verdrukke; maar vreest voor uw God; want Ik ben de HEERE, uw God!","18":"En doet Mijn inzettingen, en houdt Mijn rechten, en doet dezelve; zo zult gij zeker wonen in het land.","19":"En het land zal zijn vrucht geven, en gij zult eten tot verzadiging toe; en gij zult zeker daarin wonen.","20":"En als gij zoudt zeggen: Wat zullen wij eten in het zevende jaar! Ziet, wij zullen niet zaaien, en onze inkomst niet inzamelen;","21":"Zo zal Ik Mijn zegen gebieden over u in het zesde jaar, dat het de inkomst voor drie jaren zal voortbrengen.","22":"Het achtste jaar nu zult gij zaaien, en zult van de oude inkomst eten, tot het negende jaar toe; totdat zijn inkomst ingekomen is, zult gij het oude eten.","23":"Het land ook zal niet voor altoos verkocht worden; want het land is het Mijne, dewijl gij vreemdelingen en bijwoners bij Mij zijt.","24":"Daarom zult gij, in het ganse land uwer bezitting, lossing voor het land toelaten.","25":"Wanneer uw broeder zal verarmd zijn, en iets van zijn bezitting verkocht zal hebben, zo zal zijn losser, die hem nabestaande is, komen, en zal het verkochte zijns broeders lossen.","26":"En wanneer iemand geen losser zal hebben, maar zijn hand bekomen en hij gevonden zal hebben, zoveel genoeg is tot zijn lossing;","27":"Dan zal hij de jaren zijner verkoping rekenen, en het overschot zal hij den man, wien hij het verkocht had, weder uitkeren; en hij zal weder tot zijn bezitting komen.","28":"Maar indien zijn hand niet gevonden heeft, wat genoeg is, om aan hem weder uit te keren, zo zal zijn verkochte goed zijn in de hand van deszelfs koper tot het jubeljaar toe; maar in het jubeljaar zal het uitgaan, en hij zal tot zijn bezitting wederkeren.","29":"Insgelijks, wanneer iemand een woonhuis *in* een bemuurde stad zal verkocht hebben, zo zal zijn lossing zijn, totdat het jaar zijner verkoping volkomen zal zijn; in een vol jaar zal zijn lossing wezen.","30":"Maar is het, dat het niet gelost wordt, tegen dat hem het gehele jaar zal vervuld zijn, zo zal dat huis, hetwelk in die stad is, die een muur heeft, voor altoos blijven aan hem, die dat gekocht heeft, onder zijn geslachten; het zal in het jubeljaar niet uitgaan.","31":"Doch de huizen der dorpen, die rondom geen muur hebben, zullen als het veld des lands gerekend worden; daarvoor zal lossing zijn, en zij zullen in het jubeljaar uitgaan.","32":"Aangaande de steden der Levieten, *en* de huizen der steden hunner bezitting; de Levieten zullen een eeuwige lossing hebben.","33":"En als men onder de Levieten lossing zal gedaan hebben, zo zal de koop van het huis en van de stad zijner bezitting in het jubeljaar uitgaan; want de huizen van de steden der Levieten zijn hun bezitting in het midden van de kinderen Israëls.","34":"Doch het veld van de voorstad hunner steden zal niet verkocht worden; want het is een eeuwige bezitting voor hen.","35":"En als uw broeder zal verarmd zijn, en zijn hand bij u wankelen zal, zo zult gij hem vasthouden, *zelfs* een vreemdeling en bijwoner, opdat hij bij u leve.","36":"Gij zult geen woeker noch overwinst van hem nemen; maar gij zult vrezen voor uw God, opdat uw broeder bij u leve.","37":"Uw geld zult gij hem niet op woeker geven, en gij zult uw spijze niet op overwinst geven.","38":"Ik ben de HEERE, uw God, Die u uit Egypteland gevoerd heb, om u het land Kanaän te geven, opdat Ik u tot een God zij.","39":"Desgelijks, wanneer uw broeder bij u zal verarmd zijn, en zich aan u verkocht zal hebben, gij zult hem niet doen dienen den dienst van een slaaf;","40":"Als een dagloner, als een bijwoner zal hij bij u zijn; tot het jubeljaar zal hij bij u dienen.","41":"Dan zal hij van u uitgaan, hij en zijn kinderen met hem, en hij zal tot zijn geslacht wederkeren, en tot de bezitting zijner vaderen wederkeren.","42":"Want zij zijn Mijn dienstknechten, die Ik uit Egypteland uitgevoerd heb; zij zullen niet verkocht worden, gelijk men een slaaf verkoopt.","43":"Gij zult geen heerschappij over hem hebben met wreedheid; maar gij zult vrezen voor uw God.","44":"Aangaande uw slaaf of uw slavin, die gij zult hebben, die zullen van de volken zijn, die rondom u zijn; van die zult gij een slaaf of een slavin kopen.","45":"Gij zult ze ook kopen van de kinderen der bijwoners, die bij u als vreemdelingen verkeren, uit hen en uit hun geslachten, die bij u zullen zijn, die zij in uw land zullen gewonnen hebben; en zij zullen u tot een bezitting zijn.","46":"En gij zult u tot bezitters over hen stellen voor uw kinderen na u, opdat zij de bezitting erven; gij zult hen in eeuwigheid doen dienen; maar over uw broeders, de kinderen Israëls, een iegelijk over zijn broeder, gij zult over hem geen heerschappij hebben met wreedheid.","47":"En wanneer de hand eens vreemdelings en bijwoners, die bij u is, *wat* bekomen zal hebben, en uw broeder, die bij hem is, verarmd zal zijn, dat hij zich aan den vreemdeling, den bijwoner, die bij u is, of aan den stam van het geslacht des vreemdelings zal verkocht hebben;","48":"Nadat hij zich zal verkocht hebben, zal er lossing voor hem zijn; een van zijn broeders zal hem lossen;","49":"Of zijn oom, of de zoon zijns ooms, zal hem lossen, of die uit de naasten zijns vleses van zijn geslacht is, zal hem lossen; of heeft zijn hand wat bekomen, dat hij zichzelven losse.","50":"En hij zal met zijn koper rekenen van dat jaar af, dat hij zich aan hem verkocht heeft tot het jubeljaar toe; alzo dat het geld zijner verkoping zal zijn naar het getal van de jaren, naar de dagen eens dagloners zal het met hem zijn.","51":"Indien nog vele van die jaren zijn, naar die zal hij tot zijn lossing van het geld, waarover hij gekocht is, wedergeven.","52":"En indien er nog weinige van die jaren overgebleven zijn, tot aan het jubeljaar, zo zal hij met hem rekenen; naar zijn jaren zal hij zijn lossing wedergeven.","53":"Als een dagloner zal hij van jaar tot jaar bij hem zijn; men zal over hem geen heerschappij hebben met wreedheid voor uw ogen.","54":"En is het, dat hij hierdoor niet gelost wordt, zo zal hij in het jubeljaar uitgaan, hij en zijn kinderen met hem.","55":"Want de kinderen Israëls zijn Mij tot dienstknechten; Mijn dienstknechten zijn zij, die Ik uit Egypteland uitgevoerd heb; Ik ben de HEERE, uw God!"},"KJV":{"1":"And the LORD spake unto Moses in mount Sinai, saying,","2":"Speak unto the children of Israel, and say unto them, When ye come into the land which I give you, then shall the land keep a sabbath unto the LORD.","3":"Six years thou shalt sow thy field, and six years thou shalt prune thy vineyard, and gather in the fruit","4":"But in the seventh year shall be a sabbath of rest unto the land, a sabbath for the LORD: thou shalt neither sow thy field, nor prune thy vineyard.","5":"That which groweth of its own accord of thy harvest thou shalt not reap, neither gather the grapes of thy vine undressed: *for* it is a year of rest unto the land.","6":"And the sabbath of the land shall be meat for you; for thee, and for thy servant, and for thy maid, and for thy hired servant, and for thy stranger that sojourneth","7":"And for thy cattle, and for the beast that *are* in thy land, shall all the increase thereof be meat.","8":"And thou shalt number seven sabbaths of years unto thee, seven times seven years; and the space of the seven sabbaths of years shall be unto thee forty and nine years.","9":"Then shalt thou cause the trumpet of the jubile to sound on the tenth *day* of the seventh month, in the day of atonement shall ye make the trumpet sound throughout all your land.","10":"And ye shall hallow the fiftieth year, and proclaim liberty throughout *all* the land unto all the inhabitants thereof: it shall be a jubile unto you; and ye shall return every man unto his possession, and ye shall return every man unto his family.","11":"A jubile shall that fiftieth year be unto you: ye shall not sow, neither reap that which groweth of itself in it, nor gather *the grapes* in it of thy vine undressed.","12":"For it *is* the jubile; it shall be holy unto you: ye shall eat the increase thereof out of the field.","13":"In the year of this jubile ye shall return every man unto his possession.","14":"And if thou sell ought unto thy neighbour, or buyest *ought* of thy neighbour's hand, ye shall not oppress one another:","15":"According to the number of years after the jubile thou shalt buy of thy neighbour, *and* according unto the number of years of the fruits he shall sell","16":"According to the multitude of years thou shalt increase the price thereof, and according to the fewness of years thou shalt diminish the price of it: for *according* to the number *of the years* of the fruits doth he sell","17":"Ye shall not therefore oppress one another; but thou shalt fear thy God: for I *am* the LORD your God.","18":"Wherefore ye shall do my statutes, and keep my judgments, and do them; and ye shall dwell in the land in safety.","19":"And the land shall yield her fruit, and ye shall eat your fill, and dwell therein in safety.","20":"And if ye shall say, What shall we eat the seventh year? behold, we shall not sow, nor gather in our increase:","21":"Then I will command my blessing upon you in the sixth year, and it shall bring forth fruit for three years.","22":"And ye shall sow the eighth year, and eat *yet* of old fruit until the ninth year; until her fruits come in ye shall eat *of* the old","23":"The land shall not be sold for ever: for the land *is* mine; for ye *are* strangers and sojourners","24":"And in all the land of your possession ye shall grant a redemption for the land.","25":"If thy brother be waxen poor, and hath sold away *some* of his possession, and if any of his kin come to redeem it, then shall he redeem that which his brother sold.","26":"And if the man have none to redeem it, and himself be able to redeem","27":"Then let him count the years of the sale thereof, and restore the overplus unto the man to whom he sold it; that he may return unto his possession.","28":"But if he be not able to restore *it* to him, then that which is sold shall remain in the hand of him that hath bought it until the year of jubile: and in the jubile it shall go out, and he shall return unto his possession.","29":"And if a man sell a dwelling house in a walled city, then he may redeem it within a whole year after it is sold; *within* a full year may he redeem","30":"And if it be not redeemed within the space of a full year, then the house that *is* in the walled city shall be established for ever to him that bought it throughout his generations: it shall not go out in the jubile.","31":"But the houses of the villages which have no wall round about them shall be counted as the fields of the country: they may be redeemed, and they shall go out in the jubile.","32":"Notwithstanding the cities of the Levites, *and* the houses of the cities of their possession, may the Levites redeem at any time.","33":"And if a man purchase of the Levites, then the house that was sold, and the city of his possession, shall go out in *the year of* jubile: for the houses of the cities of the Levites *are* their possession among the children of Israel.","34":"But the field of the suburbs of their cities may not be sold; for it *is* their perpetual possession.","35":"And if thy brother be waxen poor, and fallen in decay with thee; then thou shalt relieve him: *yea, though he be* a stranger, or a sojourner; that he may live","36":"Take thou no usury of him, or increase: but fear thy God; that thy brother may live","37":"Thou shalt not give him thy money upon usury, nor lend him thy victuals for increase.","38":"I *am* the LORD your God, which brought you forth out of the land of Egypt, to give you the land of Canaan, *and* to be your God.","39":"And if thy brother *that dwelleth* by thee be waxen poor, and be sold unto thee; thou shalt not compel him to serve as a bondservant:","40":"*But* as an hired servant, *and* as a sojourner, he shall be with thee, *and* shall serve thee unto the year of jubile:","41":"And *then* shall he depart from thee, *both* he and his children with him, and shall return unto his own family, and unto the possession of his fathers shall he return.","42":"For they *are* my servants, which I brought forth out of the land of Egypt: they shall not be sold as bondmen.","43":"Thou shalt not rule over him with rigour; but shalt fear thy God.","44":"Both thy bondmen, and thy bondmaids, which thou shalt have, *shall be* of the heathen that are round about you; of them shall ye buy bondmen and bondmaids.","45":"Moreover of the children of the strangers that do sojourn among you, of them shall ye buy, and of their families that *are* with you, which they begat in your land: and they shall be your possession.","46":"And ye shall take them as an inheritance for your children after you, to inherit *them for* a possession; they shall be your bondmen for ever: but over your brethren the children of Israel, ye shall not rule one over another with rigour.","47":"And if a sojourner or stranger wax rich by thee, and thy brother *that dwelleth* by him wax poor, and sell himself unto the stranger *or* sojourner by thee, or to the stock of the stranger's family:","48":"After that he is sold he may be redeemed again; one of his brethren may redeem","49":"Either his uncle, or his uncle's son, may redeem him, or *any* that is nigh of kin unto him of his family may redeem him; or if he be able, he may redeem himself.","50":"And he shall reckon with him that bought him from the year that he was sold to him unto the year of jubile: and the price of his sale shall be according unto the number of years, according to the time of an hired servant","51":"If *there be* yet many years *behind*, according unto them he shall give again the price of his redemption out of the money that he was bought","52":"And if there remain but few years unto the year of jubile, then he shall count with him, *and* according unto his years shall he give him again the price of his redemption.","53":"*And* as a yearly hired servant shall he be with him: *and the other* shall not rule with rigour over him in thy sight.","54":"And if he be not redeemed in these *years*, then he shall go out in the year of jubile, *both* he, and his children","55":"For unto me the children of Israel *are* servants; they *are* my servants whom I brought forth out of the land of Egypt: I *am* the LORD your God."}},"tsk":{"2":[{"kopje":"Wanneer u","refs":["Lev 14:34","Deut 32:8","Deut 32:49","Deut 34:4","Ps 24:1","Ps 24:2","Ps 115:16","Jes 8:8","Jer 27:5"]},{"kopje":"rusten","refs":["Lev 23:32"]},{"kopje":"een sabbat","refs":["Lev 26:34","Lev 26:35","Ex 23:10","2 Kron 36:21"]}],"5":[{"kopje":"zal gegroeid zijn","refs":["2 Kon 19:29","Jes 37:30"]}],"9":[{"kopje":"het geschal","refs":["Lev 25:10-12","Lev 27:17","Lev 27:24","Num 36:4"]},{"kopje":"de bazuin van het geschal laten doorgaan","refs":["Num 10:10","Ps 89:16","Hand 13:38","Hand 13:39","Rom 10:18","Rom 15:19","2 Kor 5:19-21","1 Tess 1:8"]},{"kopje":"de verzoendag","refs":["Lev 16:20","Lev 16:30","Lev 23:24","Lev 23:27"]}],"10":[{"kopje":"uitroepen","refs":["Ex 20:2","Ezra 1:3","Ps 146:7","Jes 49:9","Jes 49:24","Jes 49:25","Jes 61:1-3","Jes 63:4","Jer 34:8","Jer 34:13-17","Zach 9:11","Zach 9:12","Luk 1:74","Luk 4:16-21","Joh 8:32-36","Rom 6:17","Rom 6:18","2 Kor 3:17","Gal 4:25-31","Gal 5:1","Gal 5:13","1 Petr 2:16","2 Petr 2:19","2 Petr 2:20"]},{"kopje":"ieder","refs":["Lev 25:13","Lev 25:26-28","Lev 25:33","Lev 25:34","Lev 27:1 hen ye <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you, then shall the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H7673\">keep</span> a <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> unto the LORD.","3":"<span class=\"wl wl-kjv\" data-code=\"H8337\">Six</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H2232\">sow</span> thy <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H2168\">prune</span> thy <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard,</span> and <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> in the fruit","4":"But in the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> of <span class=\"wl wl-kjv\" data-code=\"H7677\">rest</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> a <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> thou shalt neither <span class=\"wl wl-kjv\" data-code=\"H2232\">sow</span> thy <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> nor <span class=\"wl wl-kjv\" data-code=\"H2168\">prune</span> thy vineyard.","5":"That which groweth of its own <span class=\"wl wl-kjv\" data-code=\"H5599\">accord</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H7114\">reap,</span> neither <span class=\"wl wl-kjv\" data-code=\"H1219\">gather</span> the <span class=\"wl wl-kjv\" data-code=\"H6025\">grapes</span> of thy vine <span class=\"wl wl-kjv\" data-code=\"H5139\">undressed:</span> for it is a <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H7677\">rest</span> unto the land.","6":"And the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall be <span class=\"wl wl-kjv\" data-code=\"H402\">meat</span> for you; for thee, and for thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and for thy <span class=\"wl wl-kjv\" data-code=\"H519\">maid,</span> and for thy hired <span class=\"wl wl-kjv\" data-code=\"H7916\">servant,</span> and for thy <span class=\"wl wl-kjv\" data-code=\"H8453\">stranger</span> that sojourneth","7":"And for thy <span class=\"wl wl-kjv\" data-code=\"H929\">cattle,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> that are in thy <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> shall all the <span class=\"wl wl-kjv\" data-code=\"H8393\">increase</span> thereof be meat.","8":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5608\">number</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths</span> of <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> unto thee, <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3117\">space</span> of the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths</span> of <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> shall be unto thee <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> and <span class=\"wl wl-kjv\" data-code=\"H8672\">nine</span> years.","9":"Then shalt thou cause the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> of the <span class=\"wl wl-kjv\" data-code=\"H8643\">jubile</span> to <span class=\"wl wl-kjv\" data-code=\"H5674\">sound</span> on the <span class=\"wl wl-kjv\" data-code=\"H6218\">tenth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H3725\">atonement</span> shall ye make the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">sound</span> throughout all your land.","10":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H6942\">hallow</span> the <span class=\"wl wl-kjv\" data-code=\"H2572\">fiftieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaim</span> <span class=\"wl wl-kjv\" data-code=\"H1865\">liberty</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> thereof: it shall be a <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile</span> unto you; and ye shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> unto his <span class=\"wl wl-kjv\" data-code=\"H272\">possession,</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> unto his family.","11":"A <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile</span> shall that <span class=\"wl wl-kjv\" data-code=\"H2572\">fiftieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> be unto you: ye shall not <span class=\"wl wl-kjv\" data-code=\"H2232\">sow,</span> neither <span class=\"wl wl-kjv\" data-code=\"H7114\">reap</span> that which <span class=\"wl wl-kjv\" data-code=\"H5599\">groweth</span> of itself in it, nor <span class=\"wl wl-kjv\" data-code=\"H1219\">gather</span> the grapes in it of thy vine undressed.","12":"For it is the <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile;</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> unto you: ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H8393\">increase</span> thereof out of the field.","13":"In the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of this <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> unto his possession.","14":"And if thou <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> <span class=\"wl wl-kjv\" data-code=\"H4465\">ought</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5997\">neighbour,</span> or <span class=\"wl wl-kjv\" data-code=\"H7069\">buyest</span> ought of thy <span class=\"wl wl-kjv\" data-code=\"H5997\">neighbour's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> ye shall not <span class=\"wl wl-kjv\" data-code=\"H3238\">oppress</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> another:","15":"According to the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7069\">buy</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5997\">neighbour,</span> and according unto the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of the <span class=\"wl wl-kjv\" data-code=\"H8393\">fruits</span> he shall sell","16":"<span class=\"wl wl-kjv\" data-code=\"H6310\">According</span> to the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7235\">increase</span> the <span class=\"wl wl-kjv\" data-code=\"H4736\">price</span> thereof, and <span class=\"wl wl-kjv\" data-code=\"H6310\">according</span> to the <span class=\"wl wl-kjv\" data-code=\"H4591\">fewness</span> of <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H4591\">diminish</span> the <span class=\"wl wl-kjv\" data-code=\"H4736\">price</span> of it: for according to the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of the years of the <span class=\"wl wl-kjv\" data-code=\"H8393\">fruits</span> doth he sell","17":"Ye shall not therefore <span class=\"wl wl-kjv\" data-code=\"H3238\">oppress</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> <span class=\"wl wl-kjv\" data-code=\"H5997\">another;</span> but thou shalt <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> for I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","18":"Wherefore ye shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them; and ye shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> in safety.","19":"And the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">yield</span> her <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit,</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> your <span class=\"wl wl-kjv\" data-code=\"H7648\">fill,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein in safety.","20":"And if ye shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> What shall we <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year?</span> behold, we shall not <span class=\"wl wl-kjv\" data-code=\"H2232\">sow,</span> nor <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> in our increase:","21":"Then I will <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> my <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> upon you in the <span class=\"wl wl-kjv\" data-code=\"H8345\">sixth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> and it shall bring <span class=\"wl wl-kjv\" data-code=\"H6213\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H8393\">fruit</span> for <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> years.","22":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H2232\">sow</span> the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> yet of <span class=\"wl wl-kjv\" data-code=\"H3465\">old</span> <span class=\"wl wl-kjv\" data-code=\"H8393\">fruit</span> until the <span class=\"wl wl-kjv\" data-code=\"H8671\">ninth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year;</span> until her <span class=\"wl wl-kjv\" data-code=\"H8393\">fruits</span> come <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of the old","23":"The <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> for <span class=\"wl wl-kjv\" data-code=\"H6783\">ever:</span> for the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is mine; for ye are <span class=\"wl wl-kjv\" data-code=\"H1616\">strangers</span> and sojourners","24":"And in all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of your <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H5414\">grant</span> a <span class=\"wl wl-kjv\" data-code=\"H1353\">redemption</span> for the land.","25":"If thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> be waxen <span class=\"wl wl-kjv\" data-code=\"H4134\">poor,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> away some of his <span class=\"wl wl-kjv\" data-code=\"H272\">possession,</span> and if any of his <span class=\"wl wl-kjv\" data-code=\"H7138\">kin</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it, then shall he <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> that which his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> sold.","26":"And if the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> have none to <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it, and <span class=\"wl wl-kjv\" data-code=\"H3027\">himself</span> be <span class=\"wl wl-kjv\" data-code=\"H1767\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H4672\">redeem</span>","27":"Then let him <span class=\"wl wl-kjv\" data-code=\"H2803\">count</span> the <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of the <span class=\"wl wl-kjv\" data-code=\"H4465\">sale</span> thereof, and <span class=\"wl wl-kjv\" data-code=\"H7725\">restore</span> the <span class=\"wl wl-kjv\" data-code=\"H5736\">overplus</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to whom he <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> it; that he may <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto his possession.","28":"But if <span class=\"wl wl-kjv\" data-code=\"H3027\">he</span> be not <span class=\"wl wl-kjv\" data-code=\"H1767\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H4672\">restore</span> it to him, then that which is <span class=\"wl wl-kjv\" data-code=\"H4465\">sold</span> shall remain in the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of him that hath <span class=\"wl wl-kjv\" data-code=\"H7069\">bought</span> it until the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile:</span> and in the <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile</span> it shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto his possession.","29":"And if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> a <span class=\"wl wl-kjv\" data-code=\"H4186\">dwelling</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> in a <span class=\"wl wl-kjv\" data-code=\"H2346\">walled</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> then he may <span class=\"wl wl-kjv\" data-code=\"H1353\">redeem</span> it within a <span class=\"wl wl-kjv\" data-code=\"H8552\">whole</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> after it is <span class=\"wl wl-kjv\" data-code=\"H4465\">sold;</span> within a full <span class=\"wl wl-kjv\" data-code=\"H3117\">year</span> may he redeem","30":"And if it be not <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemed</span> within the <span class=\"wl wl-kjv\" data-code=\"H4390\">space</span> of a <span class=\"wl wl-kjv\" data-code=\"H8549\">full</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> then the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H2346\">walled</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6965\">established</span> for <span class=\"wl wl-kjv\" data-code=\"H6783\">ever</span> to him that <span class=\"wl wl-kjv\" data-code=\"H7069\">bought</span> it throughout his <span class=\"wl wl-kjv\" data-code=\"H1755\">generations:</span> it shall not go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> in the jubile.","31":"But the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of the <span class=\"wl wl-kjv\" data-code=\"H2691\">villages</span> which have no <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> them shall be <span class=\"wl wl-kjv\" data-code=\"H2803\">counted</span> as the <span class=\"wl wl-kjv\" data-code=\"H7704\">fields</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">country:</span> they may be <span class=\"wl wl-kjv\" data-code=\"H1353\">redeemed,</span> and they shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> in the jubile.","32":"Notwithstanding the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of their <span class=\"wl wl-kjv\" data-code=\"H272\">possession,</span> may the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> <span class=\"wl wl-kjv\" data-code=\"H1353\">redeem</span> at any time.","33":"And if a man <span class=\"wl wl-kjv\" data-code=\"H1350\">purchase</span> of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> then the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> that was <span class=\"wl wl-kjv\" data-code=\"H4465\">sold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of his <span class=\"wl wl-kjv\" data-code=\"H272\">possession,</span> shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> in the year of <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> are their <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","34":"But the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of the <span class=\"wl wl-kjv\" data-code=\"H4054\">suburbs</span> of their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> may not be <span class=\"wl wl-kjv\" data-code=\"H4376\">sold;</span> for it is their <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> possession.","35":"And if thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> be waxen <span class=\"wl wl-kjv\" data-code=\"H4134\">poor,</span> and fallen in <span class=\"wl wl-kjv\" data-code=\"H4131\">decay</span> with <span class=\"wl wl-kjv\" data-code=\"H3027\">thee;</span> then thou shalt <span class=\"wl wl-kjv\" data-code=\"H2388\">relieve</span> him: yea, though he be a <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger,</span> or a <span class=\"wl wl-kjv\" data-code=\"H8453\">sojourner;</span> that he may live","36":"<span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> thou no <span class=\"wl wl-kjv\" data-code=\"H5392\">usury</span> of him, or <span class=\"wl wl-kjv\" data-code=\"H8636\">increase:</span> but <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> that thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> may live","37":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> him thy <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> upon <span class=\"wl wl-kjv\" data-code=\"H5392\">usury,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5414\">lend</span> him thy <span class=\"wl wl-kjv\" data-code=\"H400\">victuals</span> for increase.","38":"I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which brought you <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> and to be your God.","39":"And if thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> that dwelleth by thee be waxen <span class=\"wl wl-kjv\" data-code=\"H4134\">poor,</span> and be <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> unto thee; thou shalt not <span class=\"wl wl-kjv\" data-code=\"H5647\">compel</span> him to <span class=\"wl wl-kjv\" data-code=\"H5656\">serve</span> as a bondservant:","40":"But as an hired <span class=\"wl wl-kjv\" data-code=\"H7916\">servant,</span> and as a <span class=\"wl wl-kjv\" data-code=\"H8453\">sojourner,</span> he shall be with thee, and shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> thee unto the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of jubile:","41":"And then shall he <span class=\"wl wl-kjv\" data-code=\"H3318\">depart</span> from thee, both he and his <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> with him, and shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto his own <span class=\"wl wl-kjv\" data-code=\"H4940\">family,</span> and unto the <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> shall he return.","42":"For they are my <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> which I brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> they shall not be <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> <span class=\"wl wl-kjv\" data-code=\"H4466\">as</span> bondmen.","43":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H7287\">rule</span> over him with <span class=\"wl wl-kjv\" data-code=\"H6531\">rigour;</span> but shalt <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> thy God.","44":"Both thy <span class=\"wl wl-kjv\" data-code=\"H5650\">bondmen,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H519\">bondmaids,</span> which thou shalt have, shall be of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> that are round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> you; of them shall ye <span class=\"wl wl-kjv\" data-code=\"H7069\">buy</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">bondmen</span> and bondmaids.","45":"Moreover of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H8453\">strangers</span> that do <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn</span> among you, of them shall ye <span class=\"wl wl-kjv\" data-code=\"H7069\">buy,</span> and of their <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> that are with you, which they <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> in your <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> and they shall be your possession.","46":"And ye shall take them as an <span class=\"wl wl-kjv\" data-code=\"H5157\">inheritance</span> for your <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> you, to <span class=\"wl wl-kjv\" data-code=\"H3423\">inherit</span> them for a <span class=\"wl wl-kjv\" data-code=\"H272\">possession;</span> they shall be your <span class=\"wl wl-kjv\" data-code=\"H5647\">bondmen</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> but over your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> ye shall not <span class=\"wl wl-kjv\" data-code=\"H7287\">rule</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> over <span class=\"wl wl-kjv\" data-code=\"H251\">another</span> with rigour.","47":"And if a <span class=\"wl wl-kjv\" data-code=\"H1616\">sojourner</span> or <span class=\"wl wl-kjv\" data-code=\"H8453\">stranger</span> wax <span class=\"wl wl-kjv\" data-code=\"H5381\">rich</span> by <span class=\"wl wl-kjv\" data-code=\"H3027\">thee,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> that dwelleth by him wax <span class=\"wl wl-kjv\" data-code=\"H4134\">poor,</span> and <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> himself unto the <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> or <span class=\"wl wl-kjv\" data-code=\"H8453\">sojourner</span> by thee, or to the <span class=\"wl wl-kjv\" data-code=\"H6133\">stock</span> of the <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger's</span> family:","48":"<span class=\"wl wl-kjv\" data-code=\"H310\">After</span> that he is <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> he may be redeemed <span class=\"wl wl-kjv\" data-code=\"H1353\">again;</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> may redeem","49":"Either his <span class=\"wl wl-kjv\" data-code=\"H1730\">uncle,</span> or his <span class=\"wl wl-kjv\" data-code=\"H1730\">uncle's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> may <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> him, or any that is <span class=\"wl wl-kjv\" data-code=\"H7607\">nigh</span> of <span class=\"wl wl-kjv\" data-code=\"H1320\">kin</span> unto him of his <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> may <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> him; or if he be <span class=\"wl wl-kjv\" data-code=\"H5381\">able,</span> he may <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> himself.","50":"And he shall <span class=\"wl wl-kjv\" data-code=\"H2803\">reckon</span> with him that <span class=\"wl wl-kjv\" data-code=\"H7069\">bought</span> him from the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> that he was <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> to him unto the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3701\">price</span> of his <span class=\"wl wl-kjv\" data-code=\"H4465\">sale</span> shall be according unto the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> of an hired servant","51":"If there be yet <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> behind, <span class=\"wl wl-kjv\" data-code=\"H6310\">according</span> unto them he shall give <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the price of his <span class=\"wl wl-kjv\" data-code=\"H1353\">redemption</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that he was bought","52":"And if there <span class=\"wl wl-kjv\" data-code=\"H7604\">remain</span> but <span class=\"wl wl-kjv\" data-code=\"H4592\">few</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile,</span> then he shall <span class=\"wl wl-kjv\" data-code=\"H2803\">count</span> with him, and <span class=\"wl wl-kjv\" data-code=\"H6310\">according</span> unto his <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> shall he give him <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> the price of his redemption.","53":"And as a <span class=\"wl wl-kjv\" data-code=\"H8141\">yearly</span> hired <span class=\"wl wl-kjv\" data-code=\"H7916\">servant</span> shall he be with him: and the other shall not <span class=\"wl wl-kjv\" data-code=\"H7287\">rule</span> with <span class=\"wl wl-kjv\" data-code=\"H6531\">rigour</span> over him in thy sight.","54":"And if he be not <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemed</span> in these years, then he shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> in the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile,</span> both he, and his children","55":"For unto me the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> are <span class=\"wl wl-kjv\" data-code=\"H5650\">servants;</span> they are my <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> whom I brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"aan den berg Sinaï,","tekst":"Te weten, uit de tent der samenkomst, die nu aan den berg opgericht was, Exo. 40, en uit welke God aan Mozes deze wetten heeft gegeven, Lev 1:1, toen zij opgericht was bij den berg Sinaï. Vergelijk onder, Lev 26:46, en Lev 27:34."}],"2":[{"catchword":"zal dat land","tekst":"Anders, het land zal rusten, het zal een sabbat den HEERE zijn"},{"catchword":"rusten,","tekst":"Te weten, van bebouwd te worden."},{"catchword":"sabbat","tekst":"Het woord sabbat betekent rust en ophouding van enige werken. De uitwendige sabbat is in het Oude Testament geweest:&lt;i&gt;I.&lt;/i&gt; van dagen, als van den zevenden dag en de vierdagen, Exo 20:8, boven, Lev 23:39, enz.;&lt;i&gt;II.&lt;/i&gt; van maanden, als van de nieuwe maanden, boven, Lev 23:24; Num 28:11;&lt;i&gt;III.&lt;/i&gt; van jaren, als hier en onder, Lev 26:35, enz."},{"catchword":"den HEERE","tekst":"Dat is, naar zijn bevel en Hem ter ere."}],"5":[{"catchword":"afzondering","tekst":"Anders, wat gij niet besneden hebt, of, waarvan gij u onthouden hebt. Versta, den wijngaard van iederen Israëliet, waarvan hij zich naar deze wet afzondere, om het bebouwen, het snoeien daarvan en het aflezen zijner druiven na te laten. Zo wordt hij ook genoemd onder, vs.11."}],"6":[{"catchword":"inkomst van","tekst":"Dat is, de vruchten, die in dat zevende jaar op het ongebouwde land vanzelf, door den zegen des Heeren voortkomen zullen, en door den eigenaar niet, als naar gewoonte, in de schuren en kelders moesten ingezameld zijn."}],"8":[{"catchword":"zeven jaarweken, zevenmaal zeven jaren;","tekst":"Hebreeuws, sabbatjaren. Het woord sabbat betekent hier een week, gelijk boven, Lev 23:15; gelijk nu een week der dagen zeven dagen had, alzo had een week der jaren zeven jaren."}],"9":[{"catchword":"zevende maand,","tekst":"Zie van deze maand boven, Lev 23:24."},{"catchword":"doen doorgaan;","tekst":"Dat is, doen omdragen door het gehele land, om overal geblazen te worden tot verkondiging van het jubeljaar."},{"catchword":"verzoendag","tekst":"Zie boven, Lev 23:27."}],"10":[{"catchword":"dat vijftigste jaar","tekst":"Hebreeuws, het jaar van vijftig jaar"},{"catchword":"heiligen,","tekst":"Dat is, verkondigen dat het den Heere tot een bijzonder en heilig gebruik toegeëigend en afgezonderd is. Zie van het woord heiligen, in dezen zin genomen, boven, Lev 8:10."},{"catchword":"jubeljaar zijn;","tekst":"Het Hebreeuwse woord Jobel betekent vooreerst een weer of ram, daarna een ramshoorn, en eindelijk het vijftigste jaar, hetwelk met een ramshoorn verkondigd werd, gelijk hier. In dit jaar werd de vrijheid voor de Israëlietische knechten en dienstmaagden uitgeroepen, en die hun erfgoederen door armoede verkocht hadden, kwamen weder in derzelver bezit. Het woord jaar wordt hier en in het volgende bijgevoegd uit vs.13."},{"catchword":"tot zijn geslacht","tekst":"Dat is, tot zijne maagschap en vrienden, van wie hij zich afgezonderd had door zich aan vreemden te verkopen. Zie onder, vs.41. Lev 25:11."}],"11":[{"catchword":"hetzelve afsnijden","tekst":"Versta, het vijftigste jaar. Zie boven, vs.5."}],"12":[{"catchword":"heilig zijn;","tekst":"Hebreeuws, heiligheid"},{"catchword":"de inkomst daarvan eten","tekst":"Te weten, die vanzelf, zonder uw arbeid, zal gewassen zijn."}],"14":[{"catchword":"de een den ander","tekst":"Hebreeuws, een man zijnen broeder"},{"catchword":"verdrukke","tekst":"Of, verkorte. Zie boven, Lev 19:33."}],"15":[{"catchword":"van de jaren der inkomsten","tekst":"Dat is, waarin het veld of de akkers hunne inkomst voortbrengen. Want het land werd niet verkocht, maar alleen zijn inkomen voor zekere jaren, gelijk blijkt uit het volgende."}],"16":[{"catchword":"zijn koop vermeerderen,","tekst":"Versta, van het goed, dat te verkopen is, prijs of waarde."},{"catchword":"getal der inkomsten","tekst":"Dat is, niet het eigendom des lands, maar het gebruik en de inkomsten daarvan, en dat voor een getal van jaren, dat met het jubeljaar moet eindigen. Want alsdan mocht de verkoper of eigenaar weder in zijn goed komen, en de koper er uit scheiden."}],"21":[{"catchword":"gebieden","tekst":"Dat is, Ik zal mijn zegen geven en toezenden. Gods gebieden betekent zijn doen, volbrengen en uitvoeren, òf met dadelijke zegening, gelijk hier en Deu 28:8, en Psa 111:9, en Psa 133:3; òf met dadelijke straf, gelijk Isa 5:6; Amo 9:4; Nah 1:14. Vergelijk Gen 1:3."}],"22":[{"catchword":"zijn inkomst ingekomen is,","tekst":"Te weten, van het achtste jaar."}],"23":[{"catchword":"voor altoos verkocht worden;","tekst":"Hebreeuws, tot afsnijding; te weten, van het recht der lossing; zodat den verkoper ten enenmale zou afgesneden en ontnomen zijn het recht van zijn verkocht erf te mogen lossen, of in het jubeljaar wederom tot zijne bezitting te keren. Zie dezelfde manier van spreken onder, vs.30."}],"24":[{"catchword":"zult gij,","tekst":"Dat is, gij zult het met deze conditie verkopen, dat het zal mogen gelost worden."},{"catchword":"toelaten","tekst":"Hebreeuws, eigenlijk geven."}],"26":[{"catchword":"maar zijn hand bekomen","tekst":"Zie dergelijke manier van spreken, boven, Lev 5:7."},{"catchword":"zoveel genoeg is","tekst":"Hebreeuws, naar de genoegzaamheid zijner lossing."}],"27":[{"catchword":"jaren zijner verkoping rekenen,","tekst":"Te weten, van toen de verkoping was geschied tot het jubeljaar daaraan volgende, rekenende de inkomst van zoveel jaren als er nog overig waren, en die betalende naar de waarde, gelijk de koop geschied was. Zie boven, vs.16."}],"28":[{"catchword":"zijn hand niet gevonden heeft,","tekst":"Vergelijk dit met de aantekeningen op vs.30, en Jdg 9:33."},{"catchword":"zal het uitgaan,","tekst":"Dat is, het verkochte goed zal niet meer in de macht desgenen zijn, die dat gekocht had. Anders, hij, te weten, de koper zal uitgaan. Vergelijk onder, vs.30,31, in het volgende, hij, te weten, de verkoper."}],"29":[{"catchword":"bemuurde stad zal verkocht hebben,","tekst":"Hebreeuws, een stad des muurs"},{"catchword":"vol jaar zal zijn lossing wezen","tekst":"Hebreeuws, dagen. Alzo wordt dit woordje voor een volkomen jaar genomen, Exo 13:10; 1Sa 1:3, en 1Sa 27:7. De zin is, dat het recht dezer lossing duurde een geheel en volkomen jaar nadat de verkoping geschied was."}],"30":[{"catchword":"voor altoos blijven aan hem,","tekst":"Hebreeuws, tot afsnijding; gelijk boven, vs.23. De zin is, dat het huis den koper alzo toebehoren en eigen worden moest, dat den verkoper alle recht van dat te mogen lossen afgesneden werd."},{"catchword":"het zal in het jubeljaar","tekst":"Versta dit van het verkochte huis, hetwelk ook uit het vermogen des kopers in het jubeljaar niet mocht uitgaan, maar hem moest eigen blijven."}],"31":[{"catchword":"daarvoor zal lossing zijn,","tekst":"Te weten, voor de huizen der dorpen, gelijk van het veld verordineerd wordt, boven, vs.25,26. In het Hebreeuws staat dit in het getal van enen, ziende op elk dorpshuis. Anders, voor hem [den verkoper] zal lossing zijn en [de koper] zal er uitgaan in het jubeljaar."}],"32":[{"catchword":"een eeuwige lossing hebben","tekst":"Versta dit van den tijd der wet en der Joodse politie in het land Kanaän; alzo onder, vs.34. Zie Gen 13:15."}],"33":[{"catchword":"onder de Levieten","tekst":"Anders, als men van de Levieten enig huis zal gekocht hebben, enz. Of, maar die lost, [hetzij] van de Levieten, of, de [koper] zal van het verkochte huis, enz."},{"catchword":"van het huis","tekst":"Namelijk, dat van den verkoper zal gelost worden."},{"catchword":"van de stad zijner bezitting","tekst":"Versta, tot welke het huis behoorde of waaronder het sorteerde."}],"34":[{"catchword":"voorstad hunner steden","tekst":"Dat is, dat onder de stad gelegen is."},{"catchword":"een eeuwige bezitting voor hen","tekst":"Als boven, vs.32."}],"35":[{"catchword":"bij u wankelen zal,","tekst":"Dat is, zijn vermogen en middelen zullen afgaande zijn. Anders, zijn bevende hand tot u uitstrekken zal, om hulp in zijne armoede en ellende bij u te verkrijgen."},{"catchword":"vasthouden,","tekst":"Het Hebreeuwse woord betekent eigenlijk aangrijpen en vatten om vast te houden. Versta hierdoor allerlei onderstand en weldadigheid, waardoor men den armen tehulp komt. Vergelijk Eze 16:49."},{"catchword":"vreemdeling en bijwoner,","tekst":"Men kan hier verstaan dezulken, die Jodengenoten geworden waren en de Israëlietische religie aangenomen hadden. Want aan andere vreemdelingen mochten zij op woeker lenen, Deu 23:20, hetwelk God verboden had te doen aan den gelovigen vreemdeling; Exo 22:25; Deu 23:19."}],"36":[{"catchword":"woeker","tekst":"Het Hebreeuwse woord betekent een bijting of doorknaging; omdat door den woeker de middelen der mensen verslonden worden."},{"catchword":"overwinst van hem nemen;","tekst":"Het Hebreeuwse woord is zoveel als vermenigvuldiging of overmatige vergroting, gelijk is woeker van woeker, gewin van gewin, en overschatting buiten reden en maat nemen. Sommigen nemen het eerste woord voor den woeker, die met geld geschiedt, het andere voor het overgewin, dat verkregen wordt met waar, spijs, kleding, enz."}],"38":[{"catchword":"opdat Ik u tot een God zij","tekst":"Zie Gen 17:7."}],"39":[{"catchword":"verkocht zal hebben,","tekst":"Of, aan u verkocht zal worden"},{"catchword":"gij zult hem niet doen dienen","tekst":"Of, gij zult hem geen dienst afeischen, naar slaafse dienstbaarheid, of, gij zult [u] door hem niet laten dienen, of door hem niet gediend zijn met den dienst van een slaaf of lijfeigene; dat is, gij zult zijn dienst niet gebruiken met zulke hardheid, die men de slaven placht op te leggen. Hebreeuws, gij zult niet dienen in hem den dienst eens knechts. Zie dezelfde manier van spreken onder, vs.46; Exo 1:14; Jer 25:14, en Jer 30:8, en Jer 34:9-10."}],"41":[{"catchword":"geslacht wederkeren,","tekst":"Zie boven, vs.10."}],"42":[{"catchword":"dienstknechten,","tekst":"Die Ik uit alle volken verkoren heb tot mijn eigendom, om Mij alhier te dienen, en hierna eeuwiglijk met Mij te leven. Alzo onder, vs.55."},{"catchword":"gelijk men een slaaf verkoopt","tekst":"Hebreeuws, door, of naar de verkoping van een slaaf; dat is, om als slaven behandeld te worden, en eeuwiglijk te dienen."}],"45":[{"catchword":"bezitting zijn","tekst":"Te weten, om die als slaven, die in het jubeljaar niet konden gelost worden, altijd te gebruiken."}],"46":[{"catchword":"dienen;","tekst":"Te weten, als slaven en lijfeigenen, gelijk boven, vs.39."}],"47":[{"catchword":"bekomen zal hebben,","tekst":"Dat is, enige middelen of rijkdom verkregen zal hebben; alzo onder, vs.49."},{"catchword":"aan den stam","tekst":"Dat is, aan den ingeborene en ingezetene, welke, ofschoon hij van uitlandse ouders afkomstig is, nochtans in uw land geboren en daarin door langdurige inwoning ingeworteld is."}],"50":[{"catchword":"van de jaren,","tekst":"Te weten, dat hij zijn heer gediend zal hebben, om zoveel van het geld der lossing af te trekken als zijn heer in dien tijd een dagloner had moeten geven."},{"catchword":"zal het met hem zijn","tekst":"Dat is, zal men met hem handelen."}],"51":[{"catchword":"jaren zijn,","tekst":"Te weten, die het jubeljaar voorafgaan, in hetwelk de knechten moesten losgelaten worden. Vergelijk vs.52."},{"catchword":"naar die","tekst":"Dat is, naar dat er nog vele jaren overig zijn voor het jubeljaar, dat hij zijnen heer van het geld, waarvoor hij verkocht was, wedergeve."},{"catchword":"het geld,","tekst":"Hebreeuws, het geld zijner koping."}],"53":[{"catchword":"jaar tot jaar bij hem zijn;","tekst":"Dat is, die niet nu en dan eens, maar een vol jaar of meer voor loon gearbeid heeft."},{"catchword":"voor uw ogen","tekst":"Dat is, waarop gij het aanschouwt en door de vingers ziet."}],"54":[{"catchword":"hierdoor niet gelost wordt,","tekst":"Dat is door de voorverhaalde personen of middelen. Anders, in deze, te weten, jaren."}]},"kanttekeningen_en":{"2":[{"catchword":null,"tekst":"Speak unto the children of Israel, and say to them; when ye shall be come into the Land, that I give you, then that Land shall rest [ viz. from being tilled and husbanded] a Sabbath [the word Sabbath doth signify to rest and surcease form any manner of work. the outward Sabbath in the old Testament was first, of days; as of the seventh day, and the Feast days. Exod. 20. 8. Lev. 23. 39, & c. secondly, for months; as of the new-moons, above chap. 23. 24. Numb. 28. 11. thirdly of the years; as here and below chap. 26. 35, & c.] to the LORD. [i.e. according to his command, and to his honour. Otherwise the Land shall rest, it shall be a Sabbath, etc.]"}],"3":[{"catchword":null,"tekst":"Six years shalt thou sow thy field, and six years cut thy vineyard, and gather the income thereof."}],"4":[{"catchword":null,"tekst":"Yet in the seventh year there shall be a Sabbath of rest for the land? a Sabbath to the LORD: thy field thou shalt not sow, nor cut thy vineyard."}],"5":[{"catchword":null,"tekst":"That which shall have grown of it self of thy Harvest, thou shall not reap, nor cut off the grapes of thy separation: [Oth. that which thou didst not cut, (or, prune) or from which thou withheldest thy self. Understand hereby the vineyard of every Israelite, from which he was to separate himself, according to this Law, so as that he might neither husband, nor dress the same, nor gather in ought of its growth. And thus the said vineyard is likewise called bel. v. 11.] it shall be a year of rest for the land."}],"6":[{"catchword":null,"tekst":"And the (income of the ) Sabbath of the land shall be for food unto you; for thee, and for thy man-servant, and for thy Maid-servant, and for thy day-labourer (or hireling) and for thy cohabitant that sojourns with thee: [The meaning is, That they might feed on the fruits, which in that seventh year should grow for themselves through the blessing of the LORD, without any labour and dressing in their fields and vineyards, and which no owner was permitted to gather in according to the usual manner, for to be laid up in barns and cellars, or store-houses.]"}],"7":[{"catchword":null,"tekst":"Together with thy Cattle, and for the beasts, that are in thy Land, shall all the income thereof be for food."}],"8":[{"catchword":null,"tekst":"Thou shall likewise number thee seven year-weeks, [Heb. Sabbath-years. The word Sabbath doth signify a week here, as above chap. 23. 15. Now as a week of days, so a week of years had seven years] seven times seven years; so that the days of the seven year-weeks, shall be unto you forty and nine year."}],"9":[{"catchword":null,"tekst":"After that shalt thou cause in the seventh Moneth, [See above chap. 23. on v. 24.] the trumpet of sounding to pass thorough; [i.e. to go all the Land over, that there may be a general proclamation made of the year of Jubilee] upon the expiation-day [see above chap. 23. on v. 27.] shall ye cause the Trumpet to pass through in all your Land."}],"10":[{"catchword":null,"tekst":"And ye shall hallow that fiftieth year [Heb. the year of fifty year, i.e. proclaim of it, that it is a year peculiarly set apart and dedicated to the LORD, for a singular and holy use. See of the word hallowing, taken in this sence above chap. 8. on verse 10.] and proclaim freedom in the Land, for all its inhabitants: it shall be a (year of) Jubilee unto you, [The Hebrew word Jobel signifieth first a Weather, or Ram: afterward a Ram&acirc;&euro;&trade;s horn; signifieth first a Weather, or Ram: afterward a Ram&acirc;&euro;&trade;s horn; at last the fiftieth year, which was proclaimed by the sound of a Ram&acirc;&euro;&trade;s-horn; as here in this year the freedom of men, and Maid-servants was proclaimed: and such as had sold their inheritance, through poverty, came to be repossessed of the same. The word year, is inserted in the text here, and in the sequel, out of verse 13.] and ye shall return every one to his possession, and shall return to his generation. [i.e. to his friends and kindred, from whom he had separated himself, by selling his freedom to others, see bel. v. 41.]"}],"11":[{"catchword":null,"tekst":"This Jubel-year shall be the fiftieth year unto you; ye shall not sow, nor reap what shall have grown therein of itself, neither cut off (the grapes of) the separation in the same. [viz. in that fiftieth year. see above es of the Villages in the same manner as was ordained for the fields, or lands, above verse 25. 26. In the Hebrew it is, for them there shall be redemption, in the plural; i.e. for every Village-house. Oth. for him (i.e. for the Seller) there shall be redemption, and (the Buyer) shall go out in the Jubel-year] and they shall go out in the Jubel-year."}],"32":[{"catchword":null,"tekst":"As for the cities of the Levites, and the houses of the cities of their possession; the Levites shall have a perpetual redemption: [Understand this during the time of the Law, and judaical-government in the land of Canaan, so below verse 34. see Gen. 13. on verse 5."}],"33":[{"catchword":null,"tekst":"And when redemption shall have been made among the Levites, [Oth. When one shall have bought any house of the Levites, &c. or, but he that redeemeth (he) of the Levites; or, the (Buyer) of the sold house shall, etc.] then the buying (or purchase) of the house [viz. which is to be redeemed by the Buyer] and of the city of his possession [understand to which the house appertained, or under whose jurisdiction it was] shall go out in the Jubel-year: for the houses of the cities of the Levites are their possession in the midst of the children of Israel."}],"34":[{"catchword":null,"tekst":"Yet the Field of the Suburb [Lying under the City] of their Cities shall not be sold: for it is a perpetual possession for them, [as above verse 32]"}],"35":[{"catchword":null,"tekst":"And when thy Brother shall be improverished, and his hand shall waver by thee, [i.e. his means and ability shall be decayed. Other his shaking hand shall extend to thee; for to crave and obtain relief in his poverty and distress] then thou shalt uphold, (or, hold him fast) [The Hebrew word doth properly signify to seize, and lay hold on, for to hold fast: understand here all manner of relief and kindness, whereby the poor may be upheld and comforted. Comp. Ezek. 16. 49.] (even) a stranger, [Here may be understood the Strangers
