e schaamte te ontdekken; Ik ben de HEERE!","7":"U zult de schaamte van uw vader en de schaamte van uw moeder niet ontdekken; zij is uw moeder; u zult haar schaamte niet ontdekken.","8":"U zult de schaamte van de vrouw van uw vader niet ontdekken; het is de schaamte van uw vader.","9":"De schaamte van uw zuster, de dochter van uw vader, of de dochter van uw moeder, in huis geboren of buiten geboren, haar schaamte zult u niet ontdekken.","10":"De schaamte van de dochter van uw zoon, of van de dochter van uw dochter, haar schaamte zult u niet ontdekken; want zij zijn uw eigen schaamte.","11":"De schaamte van de dochter van de vrouw van uw vader, die uw vader geboren is (zij is uw zuster), haar schaamte zult u niet ontdekken.","12":"U zult de schaamte van de zuster van uw vader niet ontdekken; zij is de nabestaande van uw vader.","13":"U zult de schaamte van de zuster van uw moeder niet ontdekken; want zij is de nabestaande van uw moeder.","14":"U zult de schaamte van de broer van uw vader niet ontdekken; tot zijn vrouw zult u niet naderen; zij is uw tante.","15":"U zult de schaamte van uw schoondochter niet ontdekken; zij is de vrouw van uw zoon; u zult haar schaamte niet ontdekken.","16":"U zult de schaamte van de vrouw van uw broer niet ontdekken; het is de schaamte van uw broer.","17":"U zult de schaamte van een vrouw en haar dochter niet ontdekken; de dochter van haar zoon, noch de dochter van haar dochter zult u nemen, om haar schaamte te ontdekken; zij zijn nabestaanden; het is een schandelijke daad.","18":"U zult ook geen vrouw tot haar zuster nemen, om *haar* te benauwen, en zo haar schaamte naast haar, tijdens haar leven, te ontdekken.","19":"Ook zult u tot de vrouw in de afzondering van haar onreinheid niet naderen, om haar schaamte te ontdekken.","20":"En u zult niet liggen bij de vrouw van uw naaste voor gemeenschap, om met haar onrein te worden.","21":"En van uw nageslacht zult u niet geven, niet geven om voor de Molech door het *vuur* te doen gaan; en de Naam van uw God zult u niet ontheiligen; Ik ben de HEERE!","22":"Bij een man zult u niet liggen zoals bij een vrouw; dit is een gruwel.","23":"Insgelijks zult u bij geen dier liggen, om daarmee onrein te worden; een vrouw zal ook niet gaan staan voor een dier, om daarmee gemeenschap te hebben; het is een gruwelijke vermenging.","24":"Verontreinig u niet met enige van deze dingen; want de heidenen, die Ik van voor uw ogen uitwerp, zijn met dit alles verontreinigd;","25":"Zodat het land onrein is, en Ik over hen zijn ongerechtigheid bezoek, en het land zijn inwoners uitspuwt.","26":"Maar u zult Mijn inzettingen en Mijn rechten onderhouden, en van al die gruwelen niets doen, inboorling noch vreemdeling, die te midden van u als vreemdeling verkeert.","27":"Want de mensen van dit land, die vóór u geweest zijn, hebben al deze gruwelen gedaan; en het land is onrein geworden.","28":"Opdat dat land u niet uitspuwt, als u het zult verontreinigd hebben; zoals het het volk, dat vóór u was, heeft uitgespuwd.","29":"Want al wie enige van deze gruwelen zal doen, die zielen, die ze doen, zullen uit het midden van hun volk uitgeroeid worden.","30":"Daarom zult u Mijn bevel onderhouden, dat u niets doet van die gruwelijke inzettingen, die vóór u zijn gedaan, en u daarmee niet verontreinigt; Ik ben de HEERE, uw God!"},"SV":{"1":"Verder sprak de HEERE tot Mozes, zeggende:","2":"Spreek tot de kinderen Israëls en zeg tot hen: Ik ben de HEERE, uw God!","3":"Gij zult niet doen naar de werken des Egyptischen lands, waarin gij gewoond hebt; en naar de werken des lands Kanaän, waarheen Ik u brenge, zult gij niet doen, en zult in hun inzettingen niet wandelen.","4":"Mijn rechten zult gij doen, en Mijn inzettingen zult gij houden, om in die te wandelen; Ik ben de HEERE, uw God!","5":"Ja, Mijn inzettingen en Mijn rechten zult gij houden; welk mens dezelve zal doen, die zal door dezelve leven; Ik ben de HEERE!","6":"Niemand zal tot enige nabestaande zijns vleses naderen, om de schaamte te ontdekken; Ik ben de HEERE!","7":"Gij zult de schaamte uws vaders en de schaamte uwer moeder niet ontdekken; zij is uw moeder; gij zult haar schaamte niet ontdekken.","8":"Gij zult de schaamte der huisvrouw uws vaders niet ontdekken; het is de schaamte uws vaders.","9":"De schaamte uwer zuster, der dochter uws vaders, of der dochter uwer moeder, te huis geboren of buiten geboren, haar schaamte zult gij niet ontdekken.","10":"De schaamte der dochter uws zoons, of der dochter uwer dochter, haar schaamte zult gij niet ontdekken; want zij zijn uw schaamte.","11":"De schaamte van de dochter der huisvrouw uws vaders, die uw vader geboren is (zij is uw zuster), haar schaamte zult gij niet ontdekken.","12":"Gij zult de schaamte van de zuster uws vaders niet ontdekken; zij is uws vaders nabestaande.","13":"Gij zult de schaamte van de zuster uwer moeder niet ontdekken; want zij is uwer moeder nabestaande.","14":"Gij zult de schaamte van den broeder uws vaders niet ontdekken; tot zijn huisvrouw zult gij niet naderen; zij is uw moei.","15":"Gij zult de schaamte uwer schoondochter niet ontdekken; zij is uws zoons huisvrouw; gij zult haar schaamte niet ontdekken.","16":"Gij zult de schaamte der huisvrouw uws broeders niet ontdekken; het is de schaamte uws broeders.","17":"Gij zult de schaamte ener vrouw en harer dochter niet ontdekken; de dochter haars zoons, noch de dochter van haar dochter zult gij nemen, om haar schaamte te ontdekken; zij zijn nabestaanden; het is een schandelijke daad.","18":"Gij zult ook geen vrouw tot haar zuster nemen, om *haar* te benauwen, mits haar schaamte nevens haar, in haar leven, te ontdekken.","19":"Ook zult gij tot de vrouw in de afzondering van haar onreinigheid niet naderen, om haar schaamte te ontdekken.","20":"En gij zult niet liggen bij uws naasten huisvrouw ter bezading, om met haar onrein te worden.","21":"En van uw zaad zult gij niet geven, niet geven om voor den Molech door het *vuur* te doen gaan; en den Naam uws Gods zult gij niet ontheiligen; Ik ben de HEERE!","22":"Bij een manspersoon zult gij niet liggen met vrouwelijke bijligging; dit is een gruwel.","23":"Insgelijks zult gij bij geen beest liggen, om daarmede onrein te worden; een vrouw zal ook niet staan voor een beest, om daarmede te doen te hebben; het is een gruwelijke vermenging.","24":"Verontreinigt u niet met enige van deze; want de heidenen, die Ik van uw aangezicht uitwerpe, zijn met alle deze verontreinigd;","25":"Zodat het land onrein is, en Ik over hetzelve zijn ongerechtigheid bezoeke, en het land zijn inwoners uitspuwt.","26":"Maar gij zult Mijn inzettingen en Mijn rechten onderhouden, en van al die gruwelen niets doen, inboorling noch vreemdeling, die in het midden van u als vreemdeling verkeert.","27":"Want de lieden dezes lands, die voor u geweest zijn, hebben al deze gruwelen gedaan; en het land is onrein geworden.","28":"Dat u dat land niet uitspuwe, als gij hetzelve zult verontreinigd hebben; gelijk als het het volk, dat voor u was, uitgespuwd heeft.","29":"Want al wie enige van deze gruwelen doen zal, die zielen, die ze doen, zullen uit het midden van haar volk uitgeroeid worden.","30":"Daarom zult gij Mijn bevel onderhouden, dat gij niet doet van die gruwelijke inzettingen, die voor u zijn gedaan geweest, en u daarmede niet verontreinigt; Ik ben de HEERE, uw God!"},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Speak unto the children of Israel, and say unto them, I am the LORD your God.","3":"After the doings of the land of Egypt, wherein ye dwelt, shall ye not do: and after the doings of the land of Canaan, whither I bring you, shall ye not do: neither shall ye walk in their ordinances.","4":"Ye shall do my judgments, and keep mine ordinances, to walk therein: I *am* the LORD your God.","5":"Ye shall therefore keep my statutes, and my judgments: which if a man do, he shall live in them: I *am* the LORD.","6":"None of you shall approach to any that is near of kin to him, to uncover *their* nakedness: I *am* the LORD.","7":"The nakedness of thy father, or the nakedness of thy mother, shalt thou not uncover: she *is* thy mother; thou shalt not uncover her nakedness.","8":"The nakedness of thy father's wife shalt thou not uncover: it *is* thy father's nakedness.","9":"The nakedness of thy sister, the daughter of thy father, or daughter of thy mother, *whether she be* born at home, or born abroad, *even* their nakedness thou shalt not uncover.","10":"The nakedness of thy son's daughter, or of thy daughter's daughter, *even* their nakedness thou shalt not uncover: for theirs *is* thine own nakedness.","11":"The nakedness of thy father's wife's daughter, begotten of thy father, she *is* thy sister, thou shalt not uncover her nakedness.","12":"Thou shalt not uncover the nakedness of thy father's sister: she *is* thy father's near kinswoman.","13":"Thou shalt not uncover the nakedness of thy mother's sister: for she *is* thy mother's near kinswoman.","14":"Thou shalt not uncover the nakedness of thy father's brother, thou shalt not approach to his wife: she *is* thine aunt.","15":"Thou shalt not uncover the nakedness of thy daughter in law: she *is* thy son's wife; thou shalt not uncover her nakedness.","16":"Thou shalt not uncover the nakedness of thy brother's wife: it *is* thy brother's nakedness.","17":"Thou shalt not uncover the nakedness of a woman and her daughter, neither shalt thou take her son's daughter, or her daughter's daughter, to uncover her nakedness; *for* they *are* her near kinswomen: it *is* wickedness.","18":"Neither shalt thou take a wife to her sister, to vex *her*, to uncover her nakedness, beside the other in her life","19":"Also thou shalt not approach unto a woman to uncover her nakedness, as long as she is put apart for her uncleanness.","20":"Moreover thou shalt not lie carnally with thy neighbour's wife, to defile","21":"And thou shalt not let any of thy seed pass through *the fire* to Molech, neither shalt thou profane the name of thy God: I *am* the LORD.","22":"Thou shalt not lie with mankind, as with womankind: it *is* abomination.","23":"Neither shalt thou lie with any beast to defile thyself therewith: neither shall any woman stand before a beast to lie down thereto: it *is* confusion.","24":"Defile not ye yourselves in any of these things: for in all these the nations are defiled which I cast out before","25":"And the land is defiled: therefore I do visit the iniquity thereof upon it, and the land itself vomiteth out her inhabitants.","26":"Ye shall therefore keep my statutes and my judgments, and shall not commit *any* of these abominations; *neither* any of your own nation, nor any stranger that sojourneth among","27":"(For all these abominations have the men of the land done, which *were* before you, and the land is defiled;)","28":"That the land spue not you out also, when ye defile it, as it spued out the nations that *were* before","29":"For whosoever shall commit any of these abominations, even the souls that commit *them* shall be cut off from among their people.","30":"Therefore shall ye keep mine ordinance, that *ye* commit not *any one* of these abominable customs, which were committed before you, and that ye defile not yourselves therein: I *am* the LORD your God."}},"tsk":{"3":[{"kopje":"de werken","refs":["Ps 106:35","Ezech 20:7","Ezech 20:8","Ezech 23:8","Ef 5:7-11","1 Petr 4:2-4"]},{"kopje":"en naar","refs":["Lev 20:23","Ex 23:24","Deut 12:4","Deut 12:30","Deut 12:31","Jer 10:2","Jer 10:3","Rom 12:2"]}],"5":[{"kopje":"welk mens die doet","refs":["Ezech 20:11","Ezech 20:13","Ezech 20:21","Luk 10:28","Rom 10:5","Gal 3:12"]},{"kopje":"Ik ben de Heere","refs":["Ex 6:1","Ex 6:5","Ex 6:28","Mal 3:6"]}],"6":[{"kopje":"de schaamte te ontdekken","refs":["Lev 18:7-19","Lev 20:11","Lev 20:12","Lev 20:17-21"]}],"17":[{"kopje":"een vrouw","refs":["Lev 20:14","Deut 27:23","Amos 2:7"]},{"kopje":"het is een schandelijke daad","refs":["Lev 20:14"]}],"18":[{"kopje":"vrouw","refs":["Gen 4:19","Gen 29:28","Ex 26 \">do:</span> and after the <span class=\"wl wl-kjv\" data-code=\"H4639\">doings</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> whither I <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> you, shall ye not <span class=\"wl wl-kjv\" data-code=\"H6213\">do:</span> neither shall ye <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in their ordinances.","4":"Ye shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> mine <span class=\"wl wl-kjv\" data-code=\"H2708\">ordinances,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> therein: I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","5":"Ye shall therefore <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> and my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments:</span> <span class=\"wl wl-kjv\" data-code=\"H834\">which</span> if a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H2425\">live</span> in them: I am the LORD.","6":"None of you shall <span class=\"wl wl-kjv\" data-code=\"H7126\">approach</span> to <span class=\"wl wl-kjv\" data-code=\"H376\">any</span> that is <span class=\"wl wl-kjv\" data-code=\"H7607\">near</span> of <span class=\"wl wl-kjv\" data-code=\"H1320\">kin</span> to him, to <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover</span> their <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness:</span> I am the LORD.","7":"The <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> or the <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> shalt thou not <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover:</span> she is thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother;</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover</span> her nakedness.","8":"The <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> shalt thou not <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover:</span> it is thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> nakedness.","9":"The <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> or <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> whether she be <span class=\"wl wl-kjv\" data-code=\"H4138\">born</span> at <span class=\"wl wl-kjv\" data-code=\"H1004\">home,</span> or <span class=\"wl wl-kjv\" data-code=\"H4138\">born</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad,</span> even their <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> thou shalt not uncover.","10":"The <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> or of thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> even their <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover:</span> for <span class=\"wl wl-kjv\" data-code=\"H2007\">theirs</span> is thine own nakedness.","11":"The <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> <span class=\"wl wl-kjv\" data-code=\"H4138\">begotten</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> she is thy <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover</span> her nakedness.","12":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover</span> the <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister:</span> she is thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> near kinswoman.","13":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover</span> the <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister:</span> for she is thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> near kinswoman.","14":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover</span> the <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H7126\">approach</span> to his <span class=\"wl wl-kjv\" data-code=\"H802\">wife:</span> she is thine aunt.","15":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover</span> the <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of thy daughter in <span class=\"wl wl-kjv\" data-code=\"H3618\">law:</span> she is thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife;</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover</span> her nakedness.","16":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover</span> the <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife:</span> it is thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother's</span> nakedness.","17":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover</span> the <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> of a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> and her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> neither shalt thou <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> her <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> or her <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> to <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover</span> her <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness;</span> for they are her near <span class=\"wl wl-kjv\" data-code=\"H7608\">kinswomen:</span> it is wickedness.","18":"Neither shalt thou <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> to her <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> to <span class=\"wl wl-kjv\" data-code=\"H6887\">vex</span> her, to <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover</span> her <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness,</span> beside the other in her life","19":"Also thou shalt not <span class=\"wl wl-kjv\" data-code=\"H7126\">approach</span> unto a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> to <span class=\"wl wl-kjv\" data-code=\"H1540\">uncover</span> her <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness,</span> as long as she is put <span class=\"wl wl-kjv\" data-code=\"H5079\">apart</span> for her uncleanness.","20":"Moreover thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">not</span> <span class=\"wl wl-kjv\" data-code=\"H7903\">lie</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">carnally</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5997\">neighbour's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> to defile","21":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">not</span> let any of thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> through the fire to <span class=\"wl wl-kjv\" data-code=\"H4432\">Molech,</span> neither shalt thou <span class=\"wl wl-kjv\" data-code=\"H2490\">profane</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of thy <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> I am the LORD.","22":"Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with <span class=\"wl wl-kjv\" data-code=\"H2145\">mankind,</span> as <span class=\"wl wl-kjv\" data-code=\"H4904\">with</span> <span class=\"wl wl-kjv\" data-code=\"H802\">womankind:</span> it is abomination.","23":"Neither shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">thou</span> <span class=\"wl wl-kjv\" data-code=\"H7903\">lie</span> with any <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> to <span class=\"wl wl-kjv\" data-code=\"H2930\">defile</span> thyself therewith: neither shall any <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> a <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> to lie <span class=\"wl wl-kjv\" data-code=\"H7250\">down</span> thereto: it is confusion.","24":"<span class=\"wl wl-kjv\" data-code=\"H2930\">Defile</span> not ye yourselves in any of these <span class=\"wl wl-kjv\" data-code=\"H428\">things:</span> for in all these the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> are <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled</span> which I cast <span class=\"wl wl-kjv\" data-code=\"H7971\">out</span> before","25":"And the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is <span class=\"wl wl-kjv\" data-code=\"H2930\">defiled:</span> therefore I do <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> thereof upon it, and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> itself vomiteth <span class=\"wl wl-kjv\" data-code=\"H6958\">out</span> her inhabitants.","26":"Ye shall therefore <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> and my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and shall not <span class=\"wl wl-kjv\" data-code=\"H6213\">commit</span> any of these <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations;</span> neither any of your own <span class=\"wl wl-kjv\" data-code=\"H249\">nation,</span> nor any <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> that <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourneth</span> among","27":"(For all <span class=\"wl wl-kjv\" data-code=\"H411\">these</span> <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> have the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> which were <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you, and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is defiled;)","28":"That the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> spue not you <span class=\"wl wl-kjv\" data-code=\"H6958\">out</span> also, when ye <span class=\"wl wl-kjv\" data-code=\"H2930\">defile</span> it, as it spued <span class=\"wl wl-kjv\" data-code=\"H6958\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that were before","29":"For whosoever shall <span class=\"wl wl-kjv\" data-code=\"H6213\">commit</span> any of these <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations,</span> even the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">commit</span> them shall be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> their people.","30":"Therefore shall ye <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> mine <span class=\"wl wl-kjv\" data-code=\"H4931\">ordinance,</span> that ye <span class=\"wl wl-kjv\" data-code=\"H6213\">commit</span> not any one of these <span class=\"wl wl-kjv\" data-code=\"H8441\">abominable</span> <span class=\"wl wl-kjv\" data-code=\"H2708\">customs,</span> which were <span class=\"wl wl-kjv\" data-code=\"H6213\">committed</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you, and that ye <span class=\"wl wl-kjv\" data-code=\"H2930\">defile</span> not yourselves therein: I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"de HEERE, uw God!","tekst":"Te weten, wien gij als uw enigen God en Heiland gehoorzamen moet, en die de gehoorzamen belonen en de ongehoorzamen kan en wil straffen."}],"3":[{"catchword":"inzettingen niet wandelen","tekst":"Zo worden genoemd de afgrijslijke gewoonten, die door toelating en het gewone gebruik onder de gemelde volken zo de overhand genomen hadden, dat ze voor gestelde wetten gehouden werden. Vergelijk onder, vs.30, en Lev 20:23."}],"5":[{"catchword":"mens dezelve zal doen,","tekst":"Deze spreuk leert drie dingen:&lt;i&gt;I.&lt;/i&gt; de volmaaktheid van de leer der wet;&lt;i&gt;II.&lt;/i&gt; de gerechtigheid der werken;&lt;i&gt;III.&lt;/i&gt; het loon, dat op zulke gerechtigheid van God toegezegd is; maar dewijl de verdorven mens die in zich niet heeft, zo is het loon uit enkele genade, om de verzoening door Christus, door het geloof aangenomen; Isa 53:11; Rom 3:20-23, enz. Vergelijk de aantekeningen op Deu 6:25."}],"6":[{"catchword":"Niemand zal tot enige","tekst":"Hebreeuws, man, man zal niet, enz.; dat is, geen man; want al deze geboden spreken eigenlijk tot de manspersonen, doch alzo, dat bij noodwendig gevolg het vrouwelijke geslacht er mede onder begrepen is."},{"catchword":"nabestaande zijns vleses naderen,","tekst":"Het Hebreeuwse woord is wel gemeen den man en de vrouw, maar wordt hier eigenlijk van de vrouw genomen, en strekt zich uit tot de graden of trappen der maagschap en der zwagerschap, die hier uitgedrukt staan, en uit dezelve door gelijkvormigheid van bestaan besloten kunnen worden."},{"catchword":"schaamte te ontdekken;","tekst":"Hebreeuws, naaktheid; en zo in het volgende. Het is een eerbare manier van spreken, betekenende zoveel als wat de Schrift anders noemt iemand bekennen. Zie Gen 4:1. Een gelijke manier van spreken is: den zoom der kleding ontdekken, Deu 22:30, en Deu 27:20."}],"7":[{"catchword":"en de schaamte uwer moeder","tekst":"Het woordje en dient hier tot uitlegging, alsof men zeide: te weten; want vaders schaamte en moeders schaamte worden hier voor één genomen. Zie ook vs.8, 16."},{"catchword":"zij is uw moeder;","tekst":"Dat is, gij zijt uit haar geboren; en versta, bijgevolg, hetzelfde van den vader, die de schaamte zijner dochter niet mag ontdekken, omdat hij haar vader en zij van hem geboren is."}],"8":[{"catchword":"der huisvrouw uws vaders","tekst":"Dat is, van uwe stiefmoeder; alzo ook van uw stiefvader. Want onder één exempel moeten de gelijke trappen begrepen worden."},{"catchword":"uws vaders","tekst":"Wien het alleen geoorloofd is die te ontdekken."}],"9":[{"catchword":"vaders,","tekst":"Dat is, van uwe halfzuster van vaders zijde."},{"catchword":"moeder,","tekst":"Dat is, van uwe halfzuster van moeders zijde."},{"catchword":"te huis geboren","tekst":"Dat is, in een wettig huwelijk."},{"catchword":"buiten geboren,","tekst":"Dat is, onwettig. Andere nemen het alzo: Dat God in het algemeen verbiedt de zuster te trouwen, hetzij zij is de dochter uws vaders, thuis geboren; dat is, uw volle zuster; hetzij zij is de dochter uwer moeder, buiten geboren; dat is, uwe halfzuster van moeders zijde. Gelijk vs.11, verboden wordt de trouw met de halfzuster van vaders zijde."}],"10":[{"catchword":"dochter uws zoons,","tekst":"En alzo nederwaarts in de rechte linie, van alle kinderen uwer kinderen."},{"catchword":"zij zijn uw schaamte","tekst":"Dat is, zij zijn door middel uwer kinderen van u voortgekomen en geboren."}],"12":[{"catchword":"zuster uws vaders","tekst":"Te weten, die uwe moei is, van vaders zijde, gelijk in vs.13 van de moei der moederlijke zijde gesproken wordt."}],"14":[{"catchword":"broeder uws vaders","tekst":"Dat is, van de huisvrouw des broeders van uw vader, gelijk de volgende woorden medebrengen; welker schaamte des ooms schaamte genoemd werd, omdat zij met hem één vlees is."},{"catchword":"naderen;","tekst":"Te weten, om met haar vleselijke gemeenschap te hebben. Zie Gen 20:4."},{"catchword":"uw moei","tekst":"Te weten, behuwde moei, die een neef des overledenen ook niet mocht trouwen. Hierom was nog meer ongeoorloofd het huwelijk tussen den oom en zijns broeders dochter."}],"15":[{"catchword":"zij is uws zoons huisvrouw;","tekst":"Insgelijks was ongeoorloofd het huwelijk tussen den schoonzoon en de behuwde moeder; onder Lev 20:14."}],"16":[{"catchword":"der huisvrouw uws broeders","tekst":"Van deze wet werd toenmaals uitgenomen, wanneer de broeder zonder mannelijke erfgenamen na te laten gestorven was; want dan moest de naaste broeder of bloedvriend de weduwe trouwen, om zijnen gestorven broeder zaad te verwekken; Deu 25:5; Mat 22:24. Uit deze wet volgt noodzakelijk dat ene vrouw, met den enen broeder getrouwd zijnde, na zijn dood met den anderen broeder niet mag trouwen; en eveneens een man met de ene zuster getrouwd zijnde, mag na haar dood de andere zuster niet trouwen."}],"17":[{"catchword":"de dochter haars zoons,","tekst":"Versta, de stiefdochter en de stiefzoon, en de kinderen van dezen voortkomende, van welke de stiefvader en de stiefgrootvader zich moesten, als van hun eigen kinderen en kindskinderen, onthouden."}],"18":[{"catchword":"Gij zult ook geen vrouw","tekst":"Deze wet wordt door sommigen aldus verstaan, dat een man niet tegelijk twee vrouwen in huwelijk mocht hebben. Want hoewel enige oudvaders dit gedaan hebben, en God dit in dien tijd geduld heeft, nochtans was het zo van den beginne niet geweest, gelijk Christus leert Mat 19:8; Gen 2:24, en is in het Nieuwe Testament afgeschaft. Doch velen verstaan door het woord zuster hier de eigen zuster van de vrouw."},{"catchword":"zuster nemen,","tekst":"Volgens de eerste uitlegging zou het woord zuster hier niet die van dezelfde natuurlijke ouders geboren is, maar slechts een andere vrouw betekenen, gelijk het aldus voor het woord andere genomen wordt; Exo 26:3; Eze 1:9, en Eze 3:13, enz."},{"catchword":"benauwen,","tekst":"Dat is, schande, spijt en kwelling aan te doen; hetwelk gemeenlijk geschiedt waar meer vrouwen zijn dan ene. Zie 1 Sam. 1. Veel meer waar twee zusters tegelijk zijn, gelijk te zien is in de huisvrouwen van Jakob; Gen 30."},{"catchword":"in haar leven,","tekst":"Als men dit verstaat van de eigenlijke zuster, kunnen deze woorden dienen tot vergroting van de benauwdheid, die haar van haar eigen zuster in haar leven zou wedervaren. Dienvolgens kan geenszins daaruit besloten worden, dat de man na haar dood haar zuster zou mogen trouwen. Zie daarvan vs.16."}],"19":[{"catchword":"afzondering van haar onreinigheid","tekst":"Dat is, wanneer zij om haar bloedgang moet afgezonderd w const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');

const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
