ohannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"U zult voor uzelf geen afgoden maken; ook geen gesneden beeld of opgericht beeld zult u zich stellen, en geen gebeelde steen zult u in uw land zetten, om u daarvoor te buigen; want Ik ben de HEERE, uw God!","2":"Mijn sabbatten zult u houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!","3":"Als u in Mijn inzettingen wandelt, en Mijn geboden houdt, en die doet;","4":"Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven;","5":"En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen.","6":"Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.","7":"En u zult uw vijanden vervolgen; en zij zullen voor uw aangezicht door het zwaard vallen.","8":"Vijf uit u zullen honderd vervolgen, en honderd uit u zullen tienduizend vervolgen; en uw vijanden zullen voor uw aangezicht door het zwaard vallen.","9":"En Ik zal Mij tot u wenden, en zal u vruchtbaar maken, en u meer maken; en Mijn verbond zal Ik met u bevestigen.","10":"En u zult het oude, dat verouderd is, eten; en het oude zult u wegdoen vanwege het nieuwe.","11":"En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.","12":"En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.","13":"Ik ben de HEERE, uw God, Die u uit het land van de Egyptenaren uitgevoerd heeft, opdat u hun slaven niet zou zijn; en Ik heb de disselbomen van uw juk verbroken, en heb u rechtop laten staan.","14":"Maar als u Mij niet zult horen, en al deze geboden niet zult doen;","15":"En als u Mijn inzettingen smadelijk verwerpt, en als uw ziel van Mijn rechten walgt, zodat u niet al Mijn geboden doet, om Mijn verbond te vernietigen;","16":"Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten.","17":"Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand.","18":"En als u Mij ook na deze dingen niet zult horen, zal Ik nog daaraan toedoen, om u zevenvoudig over uw zonden te tuchtigen.","19":"Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.","20":"En uw macht zal voor niets verbruikt worden; en uw land zal zijn opbrengst niet geven, en het geboomte van het land zal zijn vrucht niet geven.","21":"En als u tegen Mij in blijft ingaan[1], en Mij niet wilt horen, zal Ik over u, naar uw zonden, zevenvoudig slagen toedoen.","22":"Want Ik zal onder u zenden het gedierte van het veld, dat u van uw kinderen zal beroven, en uw vee zal uitroeien, en u zal verminderen; en uw wegen zullen woest worden.","23":"Als u door deze dingen nog niet getuchtigd bent, maar tegen Mij in blijft ingaan;","24":"Dan zal Ik ook tegen u in gaan, en Ik zal u ook zevenvoudig over uw zonden slaan.","25":"Want Ik zal een zwaard over u brengen, dat de wraak van het verbond wreken zal, zodat u in uw steden verzameld wordt; dan zal Ik de pest in uw midden zenden, en u zult in de hand van de vijand overgegeven worden.","26":"Als Ik u de staf van het brood zal hebben gebroken, dan zullen tien vrouwen uw brood in één oven bakken, en zullen uw brood bij het gewicht teruggeven; en u zult eten, maar niet verzadigd worden.","27":"Als u ook hierom Mij niet zult horen, maar tegen Mij in blijft gaan;","28":"Dan zal Ik ook in verhitte woede tegen u in gaan, en Ik zal u ook zevenvoudig over uw zonden tuchtigen.","29":"Want u zult het vlees van uw zonen eten, en het vlees van uw dochters zult u eten.","30":"En Ik zal uw hoogten verderven, en uw zonnebeelden[2] uitroeien, en Ik zal uw dode lichamen op de dode lichamen van uw drekgoden[3] werpen; en Mijn ziel zal van u walgen.","31":"En Ik zal uw steden een woestijn maken, en uw heiligdommen verwoesten; en Ik zal uw liefelijke geur niet ruiken.","32":"Ja, Ik zal dat land verwoesten; zodat uw vijanden, die daarin zullen wonen, zich daarover ontzetten zullen.","33":"Daartoe zal Ik u onder de heidenen verstrooien; en een zwaard achter u trekken; en uw land zal woest zijn, en uw steden zullen een woestijn zijn.","34":"Dan zal het land aan zijn sabbatten een welgevallen hebben, al de dagen van de verwoesting, terwijl u in het land van uw vijanden bent; dan zal het land rusten, en aan zijn sabbatten een welgevallen hebben.","35":"Al de dagen van de verwoesting zal het rusten, omdat het niet rustte in uw sabbatten, toen u daarin woonde.","36":"En wat betreft de overgeblevenen onder u, Ik zal in hun hart een angstige zwakheid laten komen in de landen van hun vijanden; zodat het geruis van een opgejaagd blad hen zal opjagen, en zij zullen vluchten, zoals men vlucht voor een zwaard, en zullen vallen, terwijl niemand hen opjaagt.","37":"En zij zullen de een over de ander vallen als voor het zwaard, terwijl niemand hen opjaagt; en u zult niet kunnen standhouden voor het aangezicht van uw vijanden.","38":"Maar u zult omkomen onder de heidenen, en het land van uw vijanden zal u verteren.","39":"En de overgeblevenen onder u zullen om hun ongerechtigheid in de landen van uw vijanden wegteren; ja, ook om de ongerechtigheden van hun vaderen zullen zij met hen wegteren.","40":"Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben.","41":"Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden;","42":"Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;","43":"Want het land zal om hunnentwil verlaten zijn geweest, en aan zijn sabbatten een welgevallen gehad hebben, toen het om hunnentwil verwoest was, en zij de straf voor hun ongerechtigheid aanvaard zullen hebben; omdat, en omdat zij Mijn rechten hadden verworpen, en hun ziel van Mijn inzettingen gewalgd had.","44":"En hierboven is dit ook: als zij in het land van hun vijanden zullen zijn, zal Ik hen niet verwerpen, en ook niet van hen walgen, om een einde aan hen te maken en Mijn verbond met hen te vernietigen; want Ik ben de HEERE, hun God!","45":"Maar Ik zal hun ten goede denken aan het verbond van hun voorouders, die Ik uit het land Egypte voor de ogen van de heidenen uitgevoerd heb, opdat Ik hun tot een God zou zijn; Ik ben de HEERE!","46":"Dit zijn de inzettingen, en de rechten, en de wetten, die de HEERE gegeven heeft, tussen Zich en de kinderen van Israël, op de berg Sinaï, door de hand van Mozes."},"SV":{"1":"Gij zult ulieden geen afgoden maken; noch gesneden beeld, noch opgericht beeld zult gij u stellen, noch gebeelden steen in uw land zetten, om u daarvoor te buigen; want Ik ben de HEERE, uw God!","2":"Mijn sabbatten zult gij houden, en Mijn heiligdom zult gij vrezen; Ik ben de HEERE!","3":"Indien gij in Mijn inzettingen wandelen, en Mijn geboden houden, en die doen zult;","4":"Zo zal Ik uw regens geven op hun tijd; en het land zal zijn inkomst geven, en het geboomte des velds zal zijn vrucht geven;","5":"En de dorstijd zal u reiken tot den wijnoogst, en de wijnoogst zal reiken tot den zaaitijd; en gij zult uw brood eten tot verzadiging toe, en gij zult zeker in uw land wonen.","6":"Ook zal Ik vrede geven in het land, dat gij zult te slapen liggen, en niemand zij, die verschrikke; en Ik zal het boos gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.","7":"En gij zult uw vijanden vervolgen; en zij zullen voor uw aangezicht door het zwaard vallen.","8":"Vijf uit u zullen honderd vervolgen, en honderd uit u zullen tien duizend vervolgen; en uw vijanden zullen voor uw aangezicht door het zwaard vallen.","9":"En Ik zal Mij tot u wenden, en zal u vruchtbaar maken, en u vermenigvuldigen; en Mijn verbond zal Ik met u bevestigen.","10":"En gij zult het oude, dat verouderd is, eten; en het oude zult gij vanwege het nieuwe uitbrengen.","11":"En Ik zal Mijn tabernakel in het midden van u zetten; en Mijn ziel zal van u niet walgen.","12":"En Ik zal in het midden van u wandelen, en zal u tot een God zijn, en gij zult Mij tot een volk zijn.","13":"Ik ben de HEERE, uw God, Die u uit het land der Egyptenaren uitgevoerd heb, opdat gij hun slaven niet zoudt zijn; en Ik heb de disselbomen van uw juk verbroken, en heb u doen rechtop staan.","14":"Maar indien gij Mij niet zult horen, en al deze geboden niet zult doen;","15":"En zo gij Mijn inzettingen zult smadelijk verwerpen, en zo uw ziel van Mijn rechten zal walgen, dat gij niet doet al Mijn geboden, om Mijn verbond te vernietigen;","16":"Dit zal Ik u ook doen, dat Ik over u stellen zal verschrikking, tering en koorts, die de ogen verteren en de ziel pijnigen; gij zult ook uw zaad te vergeefs zaaien, en uw vijanden zullen dat opeten.","17":"Daartoe zal Ik Mijn aangezicht tegen ulieden zetten, dat gij geslagen zult worden voor het aangezicht uwer vijanden; en uw haters zullen over u heerschappij hebben, en gij zult vlieden, als u iemand vervolgt.","18":"En zo gij Mij tot deze dingen toe nog niet horen zult, Ik zal nog daar toedoen, om u zevenvoudig over uw zonden te tuchtigen.","19":"Want Ik zal de hovaardigheid uwer kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.","20":"En uw macht zal ijdellijk verdaan worden; en uw land zal zijn inkomsten niet geven, en het geboomte des lands zal zijn vrucht niet geven.","21":"En zo gij met Mij *in* tegenheid wandelen zult, en Mij niet zult willen horen, zo zal Ik over u, naar uw zonden, zevenvoudig slagen toedoen.","22":"Want Ik zal onder u zenden het gedierte des velds, hetwelk u beroven, en uw vee uitroeien, en u verminderen zal; en uw wegen zullen woest worden.","23":"Indien gij nog door deze dingen Mij niet getuchtigd zult zijn, maar met Mij *in* tegenheid wandelen;","24":"Zo zal Ik ook met u in tegenheid wandelen, en Ik zal u ook zevenvoudig over uw zonden slaan.","25":"Want Ik zal een zwaard over u brengen, dat de wraak des verbonds wreken zal, zodat gij in uw steden vergaderd zult worden; dan zal Ik de pest in het midden van u zenden, en gij zult in de hand des vijands overgegeven worden.","26":"Als Ik u den staf des broods zal gebroken hebben, dan zullen tien vrouwen uw brood in een oven bakken, en zullen uw brood bij het gewicht wedergeven; en gij zult eten, maar niet verzadigd worden.","27":"Als gij ook hierom Mij niet horen zult, maar met Mij wandelen zult in tegenheid;","28":"Zo zal Ik ook met u in heetgrimmige tegenheid wandelen, en Ik zal u ook zevenvoudig over uw zonden tuchtigen.","29":"Want gij zult het vlees uwer zonen eten, en het vlees uwer dochteren zult gij eten.","30":"En Ik zal uw hoogten verderven, en uw zonnebeelden uitroeien, en zal uw dode lichamen op de dode lichamen uwer drekgoden werpen; en Mijn ziel zal aan u walgen.","31":"En Ik zal uw steden een woestijn maken, en uw heiligdommen verwoesten; en Ik zal uw liefelijken reuk niet rieken.","32":"Ja, Ik zal dat land verwoesten; dat uw vijanden, die daarin zullen wonen, zich daarover ontzetten zullen.","33":"Daartoe zal Ik u onder de heidenen verstrooien; en een zwaard achter u uittrekken; en uw land zal woest, en uw steden zullen een woestijn zijn.","34":"Dan zal het land aan zijn sabbatten een welgevallen hebben, al de dagen der verwoesting, en gij zult in het land uwer vijanden zijn; dan zal het land rusten, en aan zijn sabbatten een welgevallen hebben.","35":"Al de dagen der verwoesting zal het rusten, overmits het niet rustte in uw sabbatten, als gij daarin woondet.","36":"En aangaande de overgeblevenen onder u, Ik zal in hun hart een wekigheid in de landen hunner vijanden laten komen; zodat het geruis van een gedreven blad hen jagen zal, en zij zullen vlieden, gelijk men vliedt voor een zwaard, en zullen vallen, waar niemand is, die jaagt.","37":"En zij zullen de een op den ander als voor het zwaard vallen, waar niemand is, die jaagt; en gij zult voor het aangezicht uwer vijanden niet kunnen bestaan.","38":"Maar gij zult omkomen onder de heidenen, en het land uwer vijanden zal u verteren.","39":"En de overgeblevenen onder u zullen om hun ongerechtigheid in de landen uwer vijanden uitteren; ja, ook om de ongerechtigheden hunner vaderen zullen zij met hen uitteren.","40":"Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid hunner vaderen met hun overtredingen, waarmede zij tegen Mij overtreden hebben, en ook dat zij met Mij in tegenheid gewandeld hebben.","41":"Dat Ik ook met hen in tegenheid gewandeld, en hen in het land hunner vijanden gebracht zal hebben. Zo dan hun onbesneden hart gebogen wordt, en zij dan aan de straf hunner ongerechtigheid een welgevallen hebben;","42":"Dan zal Ik gedenken aan Mijn verbond *met* Jakob, en ook aan Mijn verbond *met* Izak, en ook aan Mijn verbond *met* Abraham zal Ik gedenken, en aan het land zal Ik gedenken;","43":"Als het land om hunnentwil zal verlaten zijn geweest, en aan zijn sabbatten een welgevallen gehad hebben, wanneer het om hunnentwil verwoest was, en zij aan de straf hunner ongerechtigheid een welgevallen zullen gehad hebben; daarom, en omdat zij Mijn rechten hadden verworpen, en hun ziel van Mijn inzettingen gewalgd had.","44":"En hierenboven is dit ook; als zij in het land hunner vijanden zullen zijn, zal Ik hen niet verwerpen, noch van hen walgen, om een einde van hen te maken, vernietigende Mijn verbond met hen; want Ik ben de HEERE, hun God!","45":"Maar Ik zal hun *ten* *beste* gedenken aan het verbond der voorouderen, die Ik uit Egypteland voor de ogen der heidenen uitgevoerd heb, opdat Ik hun tot een God ware; Ik ben de HEERE!","46":"Dit zijn die inzettingen, en die rechten, en die wetten, welke de HEERE gegeven heeft, tussen Zich en tussen de kinderen Israëls, op den berg Sinaï, door de hand van Mozes."},"KJV":{"1":"Ye shall make you no idols nor graven image, neither rear you up a standing image, neither shall ye set up *any* image of stone in your land, to bow down unto it: for I *am* the LORD your God.","2":"Ye shall keep my sabbaths, and reverence my sanctuary: I *am* the LORD.","3":"If ye walk in my statutes, and keep my commandments, and do","4":"Then I will give you rain in due season, and the land shall yield her increase, and the trees of the field shall yield their fruit.","5":"And your threshing shall reach unto the vintage, and the vintage shall reach unto the sowing time: and ye shall eat your bread to the full, and dwell in your land safely.","6":"And I will give peace in the land, and ye shall lie down, and none shall make *you* afraid: and I will rid evil beasts out of the land, neither shall the sword go through your land.","7":"And ye shall chase your enemies, and they shall fall before you by the sword.","8":"And five of you shall chase an hundred, and an hundred of you shall put ten thousand to flight: and your enemies shall fall before you by the sword.","9":"For I will have respect unto you, and make you fruitful, and multiply you, and establish my covenant","10":"And ye shall eat old store, and bring forth the old because of the new.","11":"And I will set my tabernacle among you: and my soul shall not abhor","12":"And I will walk among you, and will be your God, and ye shall be my people.","13":"I *am* the LORD your God, which brought you forth out of the land of Egypt, that ye should not be their bondmen; and I have broken the bands of your yoke, and made you go upright.","14":"But if ye will not hearken unto me, and will not do all these commandments;","15":"And if ye shall despise my statutes, or if your soul abhor my judgments, so that ye will not do all my commandments, *but* that ye break my covenant:","16":"I also will do this unto you; I will even appoint over you terror, consumption, and the burning ague, that shall consume the eyes, and cause sorrow of heart: and ye shall sow your seed in vain, for your enemies shall eat","17":"And I will set my face against you, and ye shall be slain before your enemies: they that hate you shall reign over you; and ye shall flee when none pursueth","18":"And if ye will not yet for all this hearken unto me, then I will punish you seven times more for your sins.","19":"And I will break the pride of your power; and I will make your heaven as iron, and your earth as brass:","20":"And your strength shall be spent in vain: for your land shall not yield her increase, neither shall the trees of the land yield their fruits.","21":"And if ye walk contrary unto me, and will not hearken unto me; I will bring seven times more plagues upon you according to your sins.","22":"I will also send wild beasts among you, which shall rob you of your children, and destroy your cattle, and make you few in number; and your *high* ways shall be desolate.","23":"And if ye will not be reformed by me by these things, but will walk contrary","24":"Then will I also walk contrary unto you, and will punish you yet seven times for your sins.","25":"And I will bring a sword upon you, that shall avenge the quarrel of *my* covenant: and when ye are gathered together within your cities, I will send the pestilence among you; and ye shall be delivered into the hand of the enemy.","26":"*And* when I have broken the staff of your bread, ten women shall bake your bread in one oven, and they shall deliver *you* your bread again by weight: and ye shall eat, and not be satisfied.","27":"And if ye will not for all this hearken unto me, but walk contrary","28":"Then I will walk contrary unto you also in fury; and I, even I, will chastise you seven times for your sins.","29":"And ye shall eat the flesh of your sons, and the flesh of your daughters shall ye eat.","30":"And I will destroy your high places, and cut down your images, and cast your carcases upon the carcases of your idols, and my soul shall abhor","31":"And I will make your cities waste, and bring your sanctuaries unto desolation, and I will not smell the savour of your sweet odours.","32":"And I will bring the land into desolation: and your enemies which dwell therein shall be astonished","33":"And I will scatter you among the heathen, and will draw out a sword after you: and your land shall be desolate, and your cities waste.","34":"Then shall the land enjoy her sabbaths, as long as it lieth desolate, and ye *be* in your enemies' land; *even* then shall the land rest, and enjoy her sabbaths.","35":"As long as it lieth desolate it shall rest; because it did not rest in your sabbaths, when ye dwelt","36":"And upon them that are left *alive* of you I will send a faintness into their hearts in the lands of their enemies; and the sound of a shaken leaf shall chase them; and they shall flee, as fleeing from a sword; and they shall fall when none pursueth.","37":"And they shall fall one upon another, as it were before a sword, when none pursueth: and ye shall have no power to stand before your enemies.","38":"And ye shall perish among the heathen, and the land of your enemies shall eat you up.","39":"And they that are left of you shall pine away in their iniquity in your enemies' lands; and also in the iniquities of their fathers shall they pine away","40":"If they shall confess their iniquity, and the iniquity of their fathers, with their trespass which they trespassed against me, and that also they have walked contrary","41":"And *that* I also have walked contrary unto them, and have brought them into the land of their enemies; if then their uncircumcised hearts be humbled, and they then accept of the punishment of their iniquity:","42":"Then will I remember my covenant with Jacob, and also my covenant with Isaac, and also my covenant with Abraham will I remember; and I will remember the land.","43":"The land also shall be left of them, and shall enjoy her sabbaths, while she lieth desolate without them: and they shall accept of the punishment of their iniquity: because, even because they despised my judgments, and because their soul abhorred my statutes.","44":"And yet for all that, when they be in the land of their enemies, I will not cast them away, neither will I abhor them, to destroy them utterly, and to break my covenant with them: for I ode=\"H1653\">rain</span> in due <span class=\"wl wl-kjv\" data-code=\"H6256\">season,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">yield</span> her <span class=\"wl wl-kjv\" data-code=\"H2981\">increase,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">yield</span> their fruit.","5":"And your <span class=\"wl wl-kjv\" data-code=\"H1786\">threshing</span> shall <span class=\"wl wl-kjv\" data-code=\"H5381\">reach</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1210\">vintage,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1210\">vintage</span> shall <span class=\"wl wl-kjv\" data-code=\"H5381\">reach</span> unto the sowing <span class=\"wl wl-kjv\" data-code=\"H2233\">time:</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> your <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> to the <span class=\"wl wl-kjv\" data-code=\"H7648\">full,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in your <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> safely.","6":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and ye shall lie <span class=\"wl wl-kjv\" data-code=\"H7901\">down,</span> and none shall make you <span class=\"wl wl-kjv\" data-code=\"H2729\">afraid:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7673\">rid</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> neither shall the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">go v\" data-code=\"H8432\">among</span> you, and will <span class=\"wl wl-kjv\" data-code=\"H1961\">be</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H1961\">be</span> my people.","13":"I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which brought you <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> that ye should not be their <span class=\"wl wl-kjv\" data-code=\"H5650\">bondmen;</span> and I have <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> the <span class=\"wl wl-kjv\" data-code=\"H4133\">bands</span> of your <span class=\"wl wl-kjv\" data-code=\"H5923\">yoke,</span> and made you <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> upright.","14":"But if ye will not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto me, and will not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all these commandments;","15":"And if ye shall <span class=\"wl wl-kjv\" data-code=\"H3988\">despise</span> my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> or if your <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H1602\">abhor</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> so that ye will not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all my <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> but that ye <span class=\"wl wl-kjv\" data-code=\"H6565\">break</span> my covenant:","16":"I also will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this unto you; I will even <span class=\"wl wl-kjv\" data-code=\"H6485\">appoint</span> over you <span class=\"wl wl-kjv\" data-code=\"H928\">terror,</span> <span class=\"wl wl-kjv\" data-code=\"H7829\">consumption,</span> and the burning <span class=\"wl wl-kjv\" data-code=\"H6920\">ague,</span> that shall <span class=\"wl wl-kjv\" data-code=\"H3615\">consume</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and cause <span class=\"wl wl-kjv\" data-code=\"H1727\">sorrow</span> of <span class=\"wl wl-kjv\" data-code=\"H5315\">heart:</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H2232\">sow</span> your <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> in <span class=\"wl wl-kjv\" data-code=\"H7385\">vain,</span> for your <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> shall eat","17":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> against you, and ye shall be <span class=\"wl wl-kjv\" data-code=\"H5062\">slain</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> your <span class=\"wl wl-kjv\" data-code=\"H341\">enemies:</span> they that <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> you shall <span class=\"wl wl-kjv\" data-code=\"H7287\">reign</span> over you; and ye shall <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> when none pursueth","18":"And if ye will not <span class=\"wl wl-kjv\" data-code=\"H5704\">yet</span> for all this <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto me, then I will <span class=\"wl wl-kjv\" data-code=\"H3256\">punish</span> you seven <span class=\"wl wl-kjv\" data-code=\"H7651\">times</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> for your sins.","19":"And I will <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> the <span class=\"wl wl-kjv\" data-code=\"H1347\">pride</span> of your <span class=\"wl wl-kjv\" data-code=\"H5797\">power;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> your <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> as <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> and your <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> as brass:","20":"And your <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8552\">spent</span> in <span class=\"wl wl-kjv\" data-code=\"H7385\">vain:</span> for your <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall not <span class=\"wl wl-kjv\" data-code=\"H5414\">yield</span> her <span class=\"wl wl-kjv\" data-code=\"H2981\">increase,</span> neither shall the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">yield</span> their fruits.","21":"And if ye <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H7147\">contrary</span> unto me, and <span class=\"wl wl-kjv\" data-code=\"H14\">will</span> not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto me; I will <span class=\"wl wl-kjv\" data-code=\"H3254\">bring</span> seven <span class=\"wl wl-kjv\" data-code=\"H7651\">times</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">plagues</span> upon you according to your sins.","22":"I will also <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">wild</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> among you, which shall rob you of your <span class=\"wl wl-kjv\" data-code=\"H7921\">children,</span> and <span class=\"wl wl-kjv\" data-code=\"H3772\">destroy</span> your <span class=\"wl wl-kjv\" data-code=\"H929\">cattle,</span> and make you few in <span class=\"wl wl-kjv\" data-code=\"H4591\">number;</span> and your high <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> shall be desolate.","23":"And if ye will not be <span class=\"wl wl-kjv\" data-code=\"H3256\">reformed</span> by me by these things, but will <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> contrary","24":"Then will I also <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H7147\">contrary</span> unto you, and will <span class=\"wl wl-kjv\" data-code=\"H5221\">punish</span> you <span class=\"wl wl-kjv\" data-code=\"H1571\">yet</span> seven <span class=\"wl wl-kjv\" data-code=\"H7651\">times</span> for your sins.","25":"And I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> upon you, that shall <span class=\"wl wl-kjv\" data-code=\"H5358\">avenge</span> the <span class=\"wl wl-kjv\" data-code=\"H5359\">quarrel</span> of my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant:</span> and when ye are gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> <span class=\"wl wl-kjv\" data-code=\"H413\">within</span> your <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> the <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> you; and ye shall be <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the enemy.","26":"And when I have <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> the <span class=\"wl wl-kjv\" data-code=\"H4294\">staff</span> of your <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> shall <span class=\"wl wl-kjv\" data-code=\"H644\">bake</span> your <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8574\">oven,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H7725\">deliver</span> you your <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> by <span class=\"wl wl-kjv\" data-code=\"H4948\">weight:</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and not be satisfied.","27":"And if ye will not for all <span class=\"wl wl-kjv\" data-code=\"H2063\">this</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto me, but <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> contrary","28":"Then I will <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H7147\">contrary</span> unto you also in <span class=\"wl wl-kjv\" data-code=\"H2534\">fury;</span> and I, <span class=\"wl wl-kjv\" data-code=\"H637\">even</span> I, will <span class=\"wl wl-kjv\" data-code=\"H3256\">chastise</span> you seven <span class=\"wl wl-kjv\" data-code=\"H7651\">times</span> for your sins.","29":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of your <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of your <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> shall ye eat.","30":"And I will <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> your high <span class=\"wl wl-kjv\" data-code=\"H1116\">places,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">down</span> your <span class=\"wl wl-kjv\" data-code=\"H2553\">images,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">cast</span> your <span class=\"wl wl-kjv\" data-code=\"H6297\">carcases</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6297\">carcases</span> of your <span class=\"wl wl-kjv\" data-code=\"H1544\">idols,</span> and my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall abhor","31":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> your <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> <span class=\"wl wl-kjv\" data-code=\"H2723\">waste,</span> and <span class=\"wl wl-kjv\" data-code=\"H8074\">bring</span> your <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuaries</span> unto <span class=\"wl wl-kjv\" data-code=\"H8074\">desolation,</span> and I will not <span class=\"wl wl-kjv\" data-code=\"H7306\">smell</span> the <span class=\"wl wl-kjv\" data-code=\"H7381\">savour</span> of your sweet odours.","32":"And I will <span class=\"wl wl-kjv\" data-code=\"H8074\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> into <span class=\"wl wl-kjv\" data-code=\"H8074\">desolation:</span> and your <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein shall be astonished","33":"And I will <span class=\"wl wl-kjv\" data-code=\"H2219\">scatter</span> you among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and will draw <span class=\"wl wl-kjv\" data-code=\"H7324\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> you: and your <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate,</span> and your <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> waste.","34":"Then shall the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H7521\">enjoy</span> her <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths,</span> as <span class=\"wl wl-kjv\" data-code=\"H3117\">long</span> as it lieth <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate,</span> and ye be in your <span class=\"wl wl-kjv\" data-code=\"H341\">enemies'</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> even then shall the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H7673\">rest,</span> and <span class=\"wl wl-kjv\" data-code=\"H7521\">enjoy</span> her sabbaths.","35":"As long <span class=\"wl wl-kjv\" data-code=\"H3117\">as</span> it lieth <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate</span> it shall <span class=\"wl wl-kjv\" data-code=\"H7673\">rest;</span> because it did not <span class=\"wl wl-kjv\" data-code=\"H7673\">rest</span> in your <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths,</span> when ye dwelt","36":"And upon them that are <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> alive of you I will <span class=\"wl wl-kjv\" data-code=\"H935\">send</span> a <span class=\"wl wl-kjv\" data-code=\"H4816\">faintness</span> into their <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">lands</span> of their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies;</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of a <span class=\"wl wl-kjv\" data-code=\"H5086\">shaken</span> <span class=\"wl wl-kjv\" data-code=\"H5929\">leaf</span> shall <span class=\"wl wl-kjv\" data-code=\"H7291\">chase</span> them; and they shall <span class=\"wl wl-kjv\" data-code=\"H5127\">flee,</span> as <span class=\"wl wl-kjv\" data-code=\"H4499\">fleeing</span> from a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> when none pursueth.","37":"And they shall <span class=\"wl wl-kjv\" data-code=\"H3782\">fall</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> upon <span class=\"wl wl-kjv\" data-code=\"H251\">another,</span> as it were <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> when none <span class=\"wl wl-kjv\" data-code=\"H7291\">pursueth:</span> and ye shall have no power to <span class=\"wl wl-kjv\" data-code=\"H8617\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> your enemies.","38":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H6\">perish</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of your <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> shall eat you up.","39":"And they that are <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> of you shall pine <span class=\"wl wl-kjv\" data-code=\"H4743\">away</span> in their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> in your <span class=\"wl wl-kjv\" data-code=\"H341\">enemies'</span> <span class=\"wl wl-kjv\" data-code=\"H776\">lands;</span> and also in the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> shall they pine away","40":"If they shall <span class=\"wl wl-kjv\" data-code=\"H3034\">confess</span> their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> with their <span class=\"wl wl-kjv\" data-code=\"H4604\">trespass</span> which they <span class=\"wl wl-kjv\" data-code=\"H4603\">trespassed</span> against me, and that also they have <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> contrary","41":"And that I also have <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> <span class=\"wl wl-kjv\" data-code=\"H7147\">contrary</span> unto them, and have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies;</span> if <span class=\"wl wl-kjv\" data-code=\"H176\">then</span> their <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised</span> <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts</span> be <span class=\"wl wl-kjv\" data-code=\"H3665\">humbled,</span> and they then <span class=\"wl wl-kjv\" data-code=\"H7521\">accept</span> of the punishment of their iniquity:","42":"Then will I <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and also my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and also my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> will I <span class=\"wl wl-kjv\" data-code=\"H2142\">remember;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> the land.","43":"The <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> also shall be <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> of them, and shall <span class=\"wl wl-kjv\" data-code=\"H7521\">enjoy</span> her <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths,</span> while she lieth <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate</span> without them: and they shall <span class=\"wl wl-kjv\" data-code=\"H7521\">accept</span> of the punishment of their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity:</span> <span class=\"wl wl-kjv\" data-code=\"H3282\">because,</span> even <span class=\"wl wl-kjv\" data-code=\"H3282\">because</span> they <span class=\"wl wl-kjv\" data-code=\"H3988\">despised</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> and because their <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H1602\">abhorred</span> my statutes.","44":"And <span class=\"wl wl-kjv\" data-code=\"H637\">yet</span> for all <span class=\"wl wl-kjv\" data-code=\"H2063\">that,</span> when they <span class=\"wl wl-kjv\" data-code=\"H1571\">be</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> I will not cast them <span class=\"wl wl-kjv\" data-code=\"H3988\">away,</span> neither will I <span class=\"wl wl-kjv\" data-code=\"H1602\">abhor</span> them, to destroy them <span class=\"wl wl-kjv\" data-code=\"H3615\">utterly,</span> and to <span class=\"wl wl-kjv\" data-code=\"H6565\">break</span> my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with them: for I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their God.","45":"But I will for their sakes <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of their <span class=\"wl wl-kjv\" data-code=\"H7223\">ancestors,</span> whom I brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> that I might be their <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> I am the LORD.","46":"These are the <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes</span> and <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> and <span class=\"wl wl-kjv\" data-code=\"H8451\">laws,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> between him and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H5514\">Sinai</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of Moses."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"afgoden maken;","tekst":"Zie boven, Lev 19:4."},{"catchword":"opgericht beeld","tekst":"Het Hebreeuwse woord betekent al wat op de wijze van een pilaar opgericht of op een pilaar gesteld werd, ter ere van de afgoden; Exo 23:24; Deu 16:22."},{"catchword":"gebeelden steen","tekst":"Hebreeuws, steen van het beeld, of der afbeelding."}],"2":[{"catchword":"vrezen;","tekst":"Zie boven, Lev 19:30."}],"4":[{"catchword":"uw regens geven op hun tijd;","tekst":"Die gij nodig hebt, te weten den vroegen en den spaden regen."}],"5":[{"catchword":"dorstijd zal u reiken","tekst":"De zin is, dat de oogst zo overvloedig zou zijn, dat zij al het graan niet zouden kunnen dorsen vóór den wijnoogst, en dat de wijnoogst ook zo overvloedig zou zijn, dat zij den wijn niet zouden kunnen kelderen vóór den zaaitijd; zodat zij van het werk zouden overvallen worden."},{"catchword":"verzadiging toe,","tekst":"Alzo boven, Lev 25:19."}],"6":[{"catchword":"te slapen liggen,","tekst":"Of, slapen, of nederliggen. Alzo Gen 19:4."},{"catchword":"zal door uw land niet doorgaan","tekst":"Dat is, zal met geen oorlog gekweld worden. Alzo is het woord zwaard voor oorlog genomen; Num 14:3; 2Sa 12:10; Isa 1:20; Eze 30:4. Vergelijk de aantekeningen op Gen 27:40."}],"7":[{"catchword":"door het zwaard vallen","tekst":"Dat is, door den oorlog vergaan. Alzo in vs.8, en Num 14:3; 2Sa 3:29; Psa 78:64; Jer 20:4."}],"8":[{"catchword":"Vijf uit u","tekst":"Een zeker getal wordt hier gesteld voor een onzeker, gelijk onder, vs.18, 26; Gen 4:15, Gen 4:24, enz.; Num 14:22; 1Sa 18:7; Job 5:19. De zin is hier, dat weinige Israëlieten velen hunner vijanden verslaan zouden."}],"9":[{"catchword":"Mij tot u wenden,","tekst":"Of, op u het gezicht hebben; te weten, om u goed te doen."}],"10":[{"catchword":"oude, dat verouderd is,","tekst":"Versta dit van de vruchten, die men lang bewaren kan, blijvende smakelijk en bekwaam tot voeding."},{"catchword":"en het oude","tekst":"Dat is, zulken overvloed zal Ik geven dat de oude vruchten uit de schuren nog niet zullen opgeruimd, noch verteerd zijn, als de nieuwe er in zullen moeten gebracht of verzameld worden."},{"catchword":"vanwege het nieuwe uitbrengen","tekst":"Hebreeuws, van het aangezicht des, enz."}],"11":[{"catchword":"tabernakel","tekst":"Dat is, Ik wil maken dat mijn genade en woord en godsdienst u steeds bijblijven zullen, opdat ik uw God blijve en gij mijn volk. Vergelijk vs.12."},{"catchword":"walgen","tekst":"Het Hebreeuwse woord betekent iets met grote verfoeiing verwerpen en een afkeer daarvan hebben. Alzo onder, vs.15, 30, 43,44."}],"12":[{"catchword":"wandelen,","tekst":"Te weten, om u in het geestelijke te onderwijzen, te heiligen en te geleiden ter eeuwige zaligheid, en in het lichamelijke met overvloed van gezondheid, vruchtbaarheid, rijkdom en vrede te zegenen."},{"catchword":"en zal u tot een God zijn,","tekst":"Zie Gen 17:7; Eze 11:20."},{"catchword":"tot een volk zijn","tekst":"Dat is, dat Ik uit genade door den beloofden Messias verlichten, rechtvaardigen en heiligen zal ter eeuwige zaligheid; 1Co 1:30."}],"13":[{"catchword":"disselbomen van uw juk","tekst":"De disselboom aan een wagen is het middenhout, waaraan de paarden samen vastgemaakt zijn; of versta, de banden en zelen, waarmede zij aan den disselboom vastgemaakt en gebonden worden. Hierbij wordt vergeleken de dienstbaarheid, die de Israëlieten als een juk in Egypte moesten dragen. Zie deze en gelijke manier van spreken, Jer 27:2, Jer 27:8, en Jer 28:2, Jer 28:13, Jer 28:15; idem Nah 1:13."},{"catchword":"rechtop staan","tekst":"Hebreeuws, [met] oprichting; dat is, met opgerichten halze, komende uit een gerust, welverzekerd en mannelijk gemoed."}],"15":[{"catchword":"vernietigen;","tekst":"Dat is, te maken dat het krachteloos zij, en dat Ik mijne beloften niet volbreng om uw ongeloof en ongehoorzaamheid. Alzo Isa 24:5."}],"16":[{"catchword":"over u stellen zal","tekst":"Te weten, als oversten, die, over u als strenge rechters heersende, u straffen en plagen zullen, om mijn rechtvaardige oordelen tegen u uit te voeren. Vergelijk deze manier van spreken met een gelijke 2Ki 8:1, en zie aldaar de aantekeningen."},{"catchword":"de ogen verteren","tekst":"Zie 1Sa 2:33."}],"17":[{"catchword":"aangezicht tegen ulieden zetten,","tekst":"Zie boven, Lev 17:10."}],"18":[{"catchword":"zo gij Mij","tekst":"Dat is, wanneer Ik zover met mijne straffen zal voortgegaan zijn, en gij door dezelve nog tot mijne gehoorzaamheid niet zult bewogen worden."},{"catchword":"zevenvoudig","tekst":"Zie boven, vs.8."}],"19":[{"catchword":"de hovaardigheid","tekst":"Dat is, de sterke, waarover gij hovaardig zijt."},{"catchword":"als ijzer maken,","tekst":"Dat is, droog, zonder regen te geven."},{"catchword":"als koper","tekst":"Dat is, hard en onvruchtbaar."}],"20":[{"catchword":"En uw macht","tekst":"Dat is, gij zult arbeiden met lichaam, met ziel en met al uwe middelen, om u te helpen; maar het zal ijdele en vergeefse arbeid zijn."}],"21":[{"catchword":"in tegenheid wandelen zult,","tekst":"Dat is, met opzet en moedwil u tegen Mij stellen, of Mij als tegenpartijders bejegenen; recht [zoals men zegt] tegen Mij wilt aangaan; verachtende mijne geboden, omdat gij tegen dezelve doorgaans moedwilliglijk zult zondigen. Anders, lichtvaardiglijk, roekelooslijk, zonder zorg, of, achterdenken, omdat zij zichzelven zullen wijsmaken dat hun wel- of kwalijkvaren niet van Mij komt, maar bij geval, en daarom Mij den behoorlijken eerbied en gehoorzaamheid zullen weigeren. Het woordje in wordt vs.21 en vs.23 ingevoegd uit vs.24, 40,41."}],"22":[{"catchword":"u beroven,","tekst":"Te weten, van uwe kinderen. Zie Eze 5:17."},{"catchword":"wegen zullen woest worden","tekst":"Te weten, die in uwe landen zijn, die niemand zal durven gebruiken, uit vrees van het wild, verslindend gedierte."}],"23":[{"catchword":"in tegenheid wandelen;","tekst":"Zie boven, vs.21."}],"24":[{"catchword":"in tegenheid wandelen,","tekst":"Dat is, u met mijn rechtvaardige straffen en oordelen tegenkomen. Anders, in of, bij geval; te weten, als die geen zorg meer voor u zal dragen, om u wel te doen. Maar zo zal Ik met u handelen, dat alle plagen u als bij ongeluk zullen schijnen te overvallen. Vergelijk Psa 18:27."}],"25":[{"catchword":"wraak des verbonds","tekst":"Dat is, de straf, die gij verdiend zult hebben, omdat gij door uw afval en ongehoorzaamheid mijn verbond zult krachteloos gemaakt hebben. Zie boven, vs.15."}],"26":[{"catchword":"staf des broods","tekst":"Dat is, de kracht van allerlei spijs om te voeden, en voornamelijk des broods, waarop het leven des mensen door den zegen des Heeren steunt gelijk een zwak lichaam op een staf is steunende. Zie deze manier van spreken, ook Eze 4:16."},{"catchword":"in een oven bakken,","tekst":"De zin is, dat er zulk een schaarsheid van brood zal wezen, dat één over voor vele vrouwen genoeg zal zijn, om voor vele huisgezinnen te bakken, waar anders één huisgezin, naar zijn grootte, dikwijls wel één oven alleen behoeven zou."},{"catchword":"bij het gewicht wedergeven;","tekst":"Dat is, het brood zal zijn gewicht hebben, maar niet zijn kracht naar het gewicht."}],"28":[{"catchword":"in heetgrimmige tegenheid","tekst":"Hebreeuws, in hittige gramschap der tegenheid, of, ontmoeting."}],"30":[{"catchword":"hoogten verderven,","tekst":"Versta, hoge plaatsen, als bergen en heuvelen, op welke men de afgoden offeranden deed; of de hoge timmeringen der altaren. Zie van deze ook Num 33:52; Eze 6:3."},{"catchword":"zonnebeelden uitroeien,","tekst":"Het Hebreeuwse woord betekent beelden, die hun naam hadden van hittigheid en warmte, of [zoals men meent] omdat zij in de zon tentoon stonden. Anderen verstaan de huizen en altaren, die ter ere van de zon opgericht waren. Of op welke het vuur als een God werd geëerd. Zie van deze beelden ook 2Ch 14:5, en Eze 6:4, enz."},{"catchword":"dode lichamen uwer","tekst":"Alzo noemt hij de afgebroken stukken der afgoden en de rompen derzelve, zoals die verachtelijk daarheen zouden geworpen worden, alzo zouden ook de lichamen der afgodendienaars veracht en de begrafenis niet waardig gehouden worden."},{"catchword":"drekgoden werpen;","tekst":"Hebreeuws, drekken; dat is, welke door God niet anders dan als mensendrek geacht worden en die ieder daarom billijk als stinkende drek behoorde te verfoeien. De beelden der afgoden worden dikwijls aldus genoemd, om ons van afgoderij als van een afschuwelijke vuiligheid een walging te maken. Zie Deu 29:17; 1Ki 15:12; 2Ki 17:12, en 2Ki 21:11; Jer 50:2; Eze 6:6, en Eze 14:3, en Eze 20:7, enz."}],"31":[{"catchword":"uw heiligdommen verwoesten;","tekst":"Versta, den tempel, die ook alzo in het getal van velen genoemd wordt Eze 21:2. De reden is, omdat deze vele delen had, te weten, het allerheiligste, het heilige en de voorhoven."},{"catchword":"liefelijken reuk","tekst":"Te weten, die van uwe offerande komt; dat is, uwe offers zullen Mij niet aangenaam zijn. Vergelijk Gen 8:21; Isa 1:11-13, enz."}],"32":[{"catchword":"daarin zullen wonen,","tekst":"Te weten, wanneer gij daaruit verdreven zult zijn. Zie vs.33."}],"34":[{"catchword":"een welgevallen hebben,","tekst":"Dat is, het land zal zijn rust hebben, welke gij hetzelve zult geweigerd hebben tegen mijne wet; Lev 25:4. Zie vs.35."}],"36":[{"catchword":"Ik zal in hun hart","tekst":"Dat is, Ik zal hun allen moed en kracht benemen en een vrees aanjagen, dat zij zonder nood zullen verschrikt worden."},{"catchword":"gelijk men vliedt","tekst":"Hebreeuws, de vlucht eens zwaards."}],"37":[{"catchword":"de een op den ander","tekst":"Hebreeuws, de man op zijn broeder"},{"catchword":"niet kunnen bestaan","tekst":"Hebreeuws, u zal niet zijn, of, gij zult niet hebben de bestendigheid, of opstanding, òf kracht om u op te richten."}],"39":[{"catchword":"om de ongerechtigheden","tekst":"Te weten, die zij zullen nagevolgd hebben. Zie Gods dreigement Exo 20:5."}],"41":[{"catchword":"Dat Ik ook met hen","tekst":"Anders, ja Ik zal met hen in tegenheid wandelen en hen in het land hunner vijanden brengen. Immers, dan zal hun onbesneden hart, enz. En Ik zal, enz."},{"catchword":"onbesneden hart gebogen wordt,","tekst":"Dat is, onboetvaardig, moedwillig, en de zonde van zich niet wegwerpende, maar die bij zich behoudende en voedende. Alzo Jer 9:26; Eze 44:7; Act 7:51."},{"catchword":"straf hunner ongerechtigheid","tekst":"Hebreeuws, ongerechtigheid. Zie boven, Lev 5:1."},{"catchword":"een welgevallen hebben;","tekst":"Dat is, zo zij recht bekennen de straf vanwege hun zonden verdiend te hebben, en dienvolgens zich van harte bekeren."}],"43":[{"catchword":"hunnentwil","tekst":"Of, van hen"},{"catchword":"om hunnentwil verwoest was,","tekst":"Of, van hen"},{"catchword":"straf hunner ongerechtigheid","tekst":"Hebreeuws, ongerechtigheid; als boven, vs.41."}],"44":[{"catchword":"hierenboven is dit ook;","tekst":"Dat is, boven dat Ik hunner gedachtig zal zijn, wanneer zij zich tot Mij bekeren zullen; zo is het, dat Ik ook gedenken zal wanneer zij onder hun vijanden gevankelijk zullen zijn, en nog in onboetvaardigheid steken zullen."}],"45":[{"catchword":"ten beste gedenken","tekst":"Hebreeuws, voor henlieden. Vergelijk Psa 79:8."},{"catchword":"der voorouderen,","tekst":"Of, der vorigen; dat is, wat Ik met de ouden, te weten, hunne voorvaders, die Ik uit Egypteland leidde, gemaakt heb."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Ye shall make to your selves no Idols, [See above chap. 19. v. 4.] nor set up to your selves a Cut, (or Carved) image, nor erect image. [The Hebrew word signifieth all manner of things reared up Pillar-wise, or placed upon a Pillar in honour of Idols, Exod. 23. 24. Deut. 16. 22.] nor set up (any) Image-stone. [Hebr. stone of the Image, or Imagery] to bow your selves before it, for I am the LORD your God."}],"2":[{"catchword":null,"tekst":"Ye shall keep my Sabbaths, and shall fear (stand in aw of) my Sanctuary; [see above chap. 19. 30.] I am the LORD."}],"3":[{"catchword":null,"tekst":"If ye shall walk in my Institutions, and keep my Commandments and do them."}],"4":[{"catchword":null,"tekst":"Then will I give you rain [Heb. hath the plural, i.e. such as ye shall in need of, v. 3. both the early and the latter rain] in their seasons; and land shall give its income, and the trees of the field shall yield their fruit."}],"5":[{"catchword":null,"tekst":"And the thrashing-time shall reach you to the Vintage; and the Vintage shall reach you to the sowing-time: [The meaning is, that their Harvest should be so plentiful, that they should not be able to make an end with thrashing of their grain before the Vintage, and their Vintage should likewise be so abundant, that they should not have done gathering, pressing, and cellaring their wine before the seed time; so that they should have work enough to receive all these blessings at God&acirc;&euro;&trade;s hand] and ye shall eat your bread, even to satiety, [so above chap. 25. 19.] and shall dwell securely in your land."}],"6":[{"catchword":null,"tekst":"I shall likewise give peace in the land, that ye shall lie down to sleep [Or, that ye shall sleep, or lie down, so Gen. 19. ver. 4.] and there be none to affright you: and I shall make the evil beast to surcease out of the land, and the sword shall not pass through your land: [i.e. is shall not be troubled with wars; thus the Sword is taken for war, Numb. 14. 3. 2 Sam. 12. 10. Isa. 1. 20. Ezek. 30. 4. comp. Gen. 27. on vers. 40.]"}],"7":[{"catchword":null,"tekst":"And ye shall persecute your enemies, and they shall fall by the sword, [i.e. perish in war, and so in the next verse, and Numb. 14. 3. 2 Sam. 3. 29. Psal. 78. 64. Jer. 20. 4.] before your face."}],"8":[{"catchword":null,"tekst":"Five of your shall pursue an hundred, and an hundred of you shall pursue ten thousand, [there is a certain number set down here for an uncertain, as likewise verse 18. and 26. Gen. 4. 15. and 26, & c. Num. 14. 22. I Sam. 18. 7. Job. 5. 19. the meaning is here, that a few Israelites should be able to chase and defeat a great many of their Enemies] and your Enemies shall fall by the sword before your face."}],"9":[{"catchword":null,"tekst":"And I will turn myself unto you, [Or, have the face upon you, viz. for to do you good] and will make you fruitful and multiply you, and my Covenant I will establish with you."}],"10":[{"catchword":null,"tekst":"And ye shall eat the old, that is grown old; [Understand this of such fruits, as keep long, and prove rather better than worse by being kept long, both for taste and nourishment] and the old ye shall bring forth because of the new. [Heb. from the face of the new, i.e. I will bestow such plenty and abundance upon you, that the old fruits shall not be voided nor spent yet out of your barns or store-houses, before the new shall come to take their place, and for whom ye must make riddance of the old.]"}],"11":[{"catchword":null,"tekst":"And I will set my Tabernacle in the midst of you: [i.e. I will cause my grace and favour, my word and worship to abide continually amongst you, that I may remain your God and ye my People: compare the next verse] and my soul shall not loath you. The Heb. word signifieth to reject a thing with great abhorency, so that it causeth an utter aversion, and turning away of one&acirc;&euro;&trade;s self from it, and so below verse 15. 30, 43, 44.]"}],"12":[{"catchword":null,"tekst":"And I will walk in the midst of you, [viz. for to instruct you in spiritual matters, to sanctify and conduct you to your everlasting salvation and outwardly also, to bless you with abundance of health, wealth, fruitfulness and peace] and will be a God unto you: [See Gen. 17. on verse 7. Ezek. 11. 20.] and ye shall be a people unto me, [i.e. such a one whom I shall of grace relieve, justify and sanctify for eternal salvation through the promised Messiah, 1 Cor. 1. 30]"}],"13":[{"catchword":null,"tekst":"I am the LORD your God, which carried you forth out of the land of the Egyptians, that ye should not be their slaves; (bondmen) and I have broken the axel-trees of your yoke; [The Axel-tree in a Wagon, is the middle most beam, or peace of the wood there, unto which the horses are fastened for to draw: or, ye may understand here the Cart-ropes, or Wain ropes and tacklings, wherewith they are tied, and fastened to the Axel-tree; hereunto is the bondage of the Israelites compared, they being made to go as under a heavy yoke in Egypt; see of this and the like phrases, Jer. 27. 2, 8. and 28. 2, 13, 14. item. Nah. 1. 13.] and have made you go upright. [Heb. (with) erection, i.e. so that you were able to lift up your heads again and walk bolt uprightly in token of being cased, revived, cheered, courageous.]"}],"14":[{"catchword":null,"tekst":"But if ye shall not hearken to me, and not do all these commandments."}],"15":[{"catchword":null,"tekst":"And if ye shall disdainfully reject my institution, and if your soul shall loath my rights, that ye do not all my commands, to nullify my covenant. [i.e. to make it of no effect, that I cannot perform my promises by reason of your unbelief and disobedience, so Isa. 24. 5.]"}],"16":[{"catchword":null,"tekst":"This shall I likewise do unto you, that I shall put over you, [viz. as so many Commanders, who shall Lord it over you; and like severe Judges, punish and plague you in executing my righteous judgements against you, compare this kind of expression, with another not unlike 2 King. 8. 1. and see the ann. there] Terror, consumption and the Fever, which consume the eyes, [See 1 Sam. 2. 33.] and torment the soul; ye shall likewise sow your seed in vain, and your Enemies shall eat the same."}],"17":[{"catchword":null,"tekst":"Withall, I shall set my face against you, see above, chap. 17. on verse 10.] that ye shall be beaten before the face of your Enemies, and your haters shall lord it over you, and you shall flee when none pursuit you."}],"21":[{"catchword":null,"tekst":"And if ye walk (in) contrariety with me, [i.e set your selves of purpose in opposition against me, encountering me like adversaries, as resolved to contrary me; despising my commands, and willfully trampling them under your feet by your trespassing against me, Otherwise carelessly, recklessly, without any fear or consideration, as persuading themselves in their fond conceits, that their weal and woe comes not from me, but accidentally by haphazard, and therefore refuse and deny me all due reverence and obedience. The particle (in) is inserted in the text here, out of verse 24. 40, 41.] and shall not be willing to hear me, then shall I add sevenfold smittings over you, according to your sins."}],"22":[{"catchword":null,"tekst":"For I will send among you the beasts of the field, which shall bereave you; [viz. of your children, see Ezek. 5. 17.] and destroy your cattle, and diminish you; and your ways shall become desolate, [viz. those in your own land, none daring to use them, for fear of those devouring beasts abroad.]"}],"23":[{"catchword":null,"tekst":"If yet by these things ye shall not be chastisized unto me, but walk (in) contrariety with me, see above on verse 21.]"}],"24":[{"catchword":null,"tekst":"Then shall I likewise walk in contrariety with you, [i.e. come against you with my righteous punishments and judgements. Otherwise walk in, or, by casualty (as it falls out,) viz. as one that takes no further care of you, to do you good; but I shall so deal with you, that all manner of plagues shall light on you, as by ill luck and accident, compare Psa. 18. 27.] and I shall likewise smite you seven fold over your sins."}],"25":[{"catchword":null,"tekst":"For I shall bring a sword over you, which shall avenge the vengeance of the Covenant, [i.e. the punishment which ye shall have deserved; for having, through your apostacy and disobedience, made my Covenant of no effect: see above, verse 15.] so that ye shall be gathered into your Cities; then shall I send the pestilence in the midst of you, and ye shall be delivered up into the hand of the enemy."}],"26":[{"catchword":null,"tekst":"Whe // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';

      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';

  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
