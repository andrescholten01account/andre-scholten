s","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Dit is nu de wet van het schuldoffer: het is allerheiligst.","2":"In de plaats waar zij het brandoffer slachten, zullen zij het schuldoffer slachten; en men zal het bloed ervan rondom op het altaar sprenkelen.","3":"En daarvan zal men al zijn vet offeren: de staart, en het vet dat het ingewand bedekt;","4":"ook de beide nieren, en het vet dat daaraan is, dat op de weekdelen is; en het net over de lever, met de nieren, zal men wegnemen.","5":"En de priester zal die aansteken op het altaar, als een vuuroffer voor de HEERE; het is een schuldoffer.","6":"Al wie mannelijk is onder de priesters mag dat eten; op de heilige plaats zal het gegeten worden; het is allerheiligst.","7":"Zoals het zondoffer is, zo zal ook het schuldoffer zijn; er zal één wet voor beide zijn; het zal voor de priester zijn die daarmee verzoening gedaan heeft.","8":"Ook de priester die iemands brandoffer offert, die priester zal de huid van het brandoffer hebben dat hij geofferd heeft.","9":"Verder zal al het spijsoffer dat in de oven gebakken wordt, met al wat in de ketel en in de pan bereid wordt, voor de priester zijn die dat offert.","10":"Ook elk spijsoffer dat met olie gemengd is, of droog, zal voor alle zonen van Aäron zijn, voor de een evenveel als voor de ander.","11":"Dit is nu de wet van het dankoffer, dat men de HEERE zal offeren.","12":"Als hij dat als een lofoffer offert, zal hij naast het lofoffer ongezuurde koeken met olie gemengd, en ongezuurde vladen met olie bestreken, offeren; en die koeken met olie gemengd zullen van geroosterde meelbloem zijn.","13":"Naast de koeken zal hij tot zijn offergave gedesemd brood offeren, samen met het lofoffer van zijn dankoffers.","14":"En één daarvan uit de hele offergave zal hij de HEERE als hefoffer offeren; het zal voor de priester zijn die het bloed van het dankoffer sprenkelt.","15":"Maar het vlees van het lofoffer van zijn dankoffers zal op de dag van zijn offergave gegeten worden; daarvan zal men niets tot de morgen overlaten.","16":"En als het slachtoffer van zijn offergave een gelofte of vrijwillig offer is, zal dat gegeten worden op de dag dat hij zijn offer offert, en wat ervan overblijft zal ook de volgende dag gegeten worden.","17":"Wat nog van het vlees van het slachtoffer overgebleven is, zal op de derde dag met vuur verbrand worden;","18":"want als er op de derde dag toch van dat vlees van zijn dankoffer gegeten wordt, zal het niet aangenaam zijn voor hem die het geofferd heeft; het zal hem niet toegerekend worden, het zal een afgrijselijk ding zijn; en de ziel die daarvan eet, zal haar ongerechtigheid dragen.","19":"En het vlees dat iets onreins aangeraakt heeft, zal niet gegeten worden; met vuur zal het verbrand worden; maar wat het andere vlees betreft, dat vlees mag ieder die rein is, eten.","20":"Maar als een ziel het vlees van het dankoffer, dat van de HEERE is, gegeten zal hebben terwijl haar onreinheid op haar is, dan zal die ziel uit haar volk uitgeroeid worden.","21":"En wanneer een ziel iets onreins aangeraakt zal hebben, zoals de onreinheid van een mens, of het onreine vee, of enig onrein verfoeisel, en zal van het vlees van het dankoffer, dat van de HEERE is, gegeten hebben, dan zal die ziel uit haar volk uitgeroeid worden.","22":"Daarna sprak de HEERE tot Mozes, en Hij zei:","23":"Spreek tot de kinderen van Israël, en zeg: U zult geen enkel vet van een rund, schaap of geit eten.","24":"Maar het vet van een dood gevonden dier, en het vet van iets dat verscheurd is, mag voor alle andere doeleinden gebruikt worden; maar u zult het beslist niet eten.","25":"Want ieder die het vet eet van vee waarvan men de HEERE een vuuroffer geofferd heeft, die ziel die het gegeten heeft, zal uit haar volk uitgeroeid worden.","26":"Ook zult u in uw woonplaatsen geen bloed eten, van gevogelte of van vee.","27":"Elke ziel die enig bloed eet, die ziel zal uit haar volk uitgeroeid worden.","28":"Verder sprak de HEERE tot Mozes, en Hij zei:","29":"Spreek tot de kinderen van Israël, en zeg: Wie zijn dankoffer aan de HEERE offert, zal zijn offergave van zijn dankoffer aan de HEERE brengen.","30":"Zijn eigen handen zullen de vuuroffers van de HEERE brengen; het vet aan de borst zal hij met die borst brengen, om die als beweegoffer voor het aangezicht van de HEERE te bewegen.","31":"En de priester zal dat vet op het altaar aansteken; maar de borst zal voor Aäron en zijn zonen zijn.","32":"U zult ook de rechterschouder als hefoffer aan de priester geven, uit uw dankoffers.","33":"Wie uit de zonen van Aäron het bloed van het dankoffer en het vet offert, die zal de rechterschouder als deel toekomen.","34":"Want de beweegborst en de hefschouder heb Ik van de kinderen van Israël uit hun dankoffers genomen, en heb die aan Aäron, de priester, en aan zijn zonen gegeven, als een eeuwige inzetting, vanwege de kinderen van Israël.","35":"Dit is het deel van de zalving van Aäron en de zalving van zijn zonen, van de vuuroffers van de HEERE, op de dag toen Hij hen liet naderen om het priesterschap voor de HEERE te bedienen;","36":"wat de HEERE geboden heeft hun te geven van de kinderen van Israël, op de dag dat Hij hen zalfde; het is een eeuwige inzetting voor hun geslachten.","37":"Dit is de wet van het brandoffer, het spijsoffer, het zondoffer, het schuldoffer, het inwijdingsoffer en het dankoffer;","38":"die de HEERE Mozes geboden heeft op de berg Sinaï, op de dag dat Hij de kinderen van Israël gebood hun offergaven aan de HEERE te offeren, in de woestijn van Sinaï."},"SV":{"1":"Dit is nu de wet des schuldoffers; het is een heiligheid der heiligheden.","2":"In de plaats, waar zij het brandoffer slachten, zullen zij het schuldoffer slachten; en men zal deszelfs bloed rondom op het altaar sprengen.","3":"En daarvan zal men al zijn vet offeren, den staart, en het vet, dat het ingewand bedekt;","4":"Ook de beide nieren, en het vet, dat daaraan is, dat op de weekdarmen is; en het net over de lever, met de nieren, zal men afnemen.","5":"En de priester zal die aansteken op het altaar, ten vuuroffer den HEERE; het is een schuldoffer.","6":"Al wat mannelijk is onder de priesteren zal dat eten; in de heilige plaats zal het gegeten worden; het is een heiligheid der heiligheden.","7":"Gelijk het zondoffer, alzo zal ook het schuldoffer zijn; enerlei wet zal voor dezelve zijn; het zal des priesters zijn, die daarmede verzoening gedaan zal hebben.","8":"Ook de priester, die iemands brandoffer offert, die priester zal de huid des brandoffers hebben, dat hij geofferd heeft.","9":"Daartoe al het spijsoffer, dat in den oven gebakken wordt, met al wat in den ketel en in den pan bereid wordt, zal des priesters zijn, die dat offert.","10":"Ook alle spijsoffer met olie gemengd, of droog, zal voor alle zonen van Aäron zijn, voor den enen als voor den anderen.","11":"Dit is nu de wet des dankoffers, dat men den HEERE offeren zal.","12":"Indien hij dat tot een lof *offer* offert, zo zal hij, nevens het lofoffer, ongezuurde koeken met olie gemengd, en ongezuurde vladen met olie bestreken, offeren; en zullen die koeken met olie gemengd van geroost meelbloem zijn.","13":"Benevens de koeken zal hij tot zijn offerande gedesemd brood offeren, met het lofoffer zijns dankoffers.","14":"En een daarvan uit de ganse offerande zal hij den HEERE ten hefoffer offeren; het zal voor den priester zijn, die het bloed des dankoffers sprengt.","15":"Maar het vlees van het lofoffer zijns dankoffers zal op den dag van deszelfs offerande gegeten worden; daarvan zal men niet tot den morgen overlaten.","16":"En zo het slachtoffer zijner offerande een gelofte, of vrijwillig offer is, dat zal ten dage als hij zijn offer offeren zal, gegeten worden, en het overgeblevene daarvan zal ook des anderen daags gegeten worden.","17":"Wat nog van het vlees des slachtoffers overgebleven is, zal op den derden dag met vuur verbrand worden;","18":"Want zo enigszins van dat vlees zijns dankoffers op den derden dag gegeten wordt, die dat geofferd heeft, zal niet aangenaam zijn; het zal hem niet toegerekend worden, het zal een afgrijselijk ding zijn; en de ziel, die daarvan eet, zal haar ongerechtigheid dragen.","19":"En het vlees, dat iets onreins aangeroerd zal hebben, zal niet gegeten worden; met vuur zal het verbrand worden; maar aangaande het *andere* vlees, dat vlees zal een ieder, die rein is, mogen eten.","20":"Doch als een ziel het vlees van het dankoffer, hetwelk des HEEREN is, gegeten zal hebben, en haar onreinigheid aan haar is, zo zal die ziel uit haar volken uitgeroeid worden.","21":"En wanneer een ziel iets onreins zal aangeroerd hebben, *als* de onreinigheid des mensen, of het onreine vee, of enig onrein verfoeisel, en zal van het vlees des dankoffers, hetwelk des HEEREN is, gegeten hebben, zo zal die ziel uit haar volken uitgeroeid worden.","22":"Daarna sprak de HEERE tot Mozes, zeggende:","23":"Spreek tot de kinderen Israëls, zeggende: Geen vet van een os, of schaap, of geit, zult gij eten.","24":"Maar het vet van een dood aas, en het vet van het verscheurde, mag tot alle werk gebezigd worden; doch gij zult het ganselijk niet eten.","25":"Want al wie het vet van vee eten zal, van hetwelk men den HEERE een vuuroffer zal geofferd hebben, die ziel, die het gegeten zal hebben, zal uit haar volken uitgeroeid worden.","26":"Ook zult gij in uw woningen geen bloed eten, hetzij van het gevogelte, of van het vee.","27":"Alle ziel, die enig bloed eten zal, die ziel zal uit haar volken uitgeroeid worden.","28":"Voorts sprak de HEERE tot Mozes, zeggende:","29":"Spreek tot de kinderen Israëls, zeggende: Wie zijn dankoffer den HEERE offert, zal zijn offerande van zijn dankoffer den HEERE toebrengen.","30":"Zijn handen zullen de vuurofferen des HEEREN brengen; het vet aan de borst zal hij met die borst brengen, om die tot een beweegoffer voor het aangezicht des HEEREN te bewegen.","31":"En de priester zal dat vet op het altaar aansteken; doch de borst zal voor Aäron en zijn zonen zijn.","32":"Gij zult ook den rechterschouder tot een hefoffer den priester geven, uit uw dankofferen.","33":"Wie uit de zonen van Aäron het bloed des dankoffers en het vet offert, dien zal de rechterschouder ten dele zijn.","34":"Want de beweegborst en den hefschouder heb Ik van de kinderen Israëls uit hun dankofferen genomen, en heb dezelve aan Aäron, den priester, en aan zijn zonen, tot een eeuwige inzetting gegeven, van de kinderen Israëls.","35":"Dit is de zalving van Aäron en de zalving van zijn zonen, van de vuurofferen des HEEREN; ten dage als Hij hen deed naderen, om het priesterdom den HEERE te bedienen;","36":"Hetwelk de HEERE hun van de kinderen Israëls te geven geboden heeft, ten dage als Hij hen zalfde; het zij een eeuwige inzetting voor hun geslachten.","37":"Dit is de wet des brandoffers, des spijsoffers, des zondoffers, des schuldoffers, des vuloffers en des dankoffers;","38":"Die de HEERE Mozes op den berg Sinaï geboden heeft, ten dage als Hij den kinderen Israëls gebood, dat zij hun offeranden den HEERE, in de woestijn van Sinaï, zouden offeren."},"KJV":{"1":"Likewise this *is* the law of the trespass offering: it *is* most holy.","2":"In the place where they kill the burnt offering shall they kill the trespass offering: and the blood thereof shall he sprinkle round about upon the altar.","3":"And he shall offer of it all the fat thereof; the rump, and the fat that covereth the inwards,","4":"And the two kidneys, and the fat that *is* on them, which *is* by the flanks, and the caul *that is* above the liver, with the kidneys, it shall he take away:","5":"And the priest shall burn them upon the altar *for* an offering made by fire unto the LORD: it *is* a trespass offering.","6":"Every male among the priests shall eat thereof: it shall be eaten in the holy place: it *is* most holy.","7":"As the sin offering *is*, so *is* the trespass offering: *there is* one law for them: the priest that maketh atonement","8":"And the priest that offereth any man's burnt offering, *even* the priest shall have to himself the skin of the burnt offering which he hath offered.","9":"And all the meat offering that is baken in the oven, and all that is dressed in the fryingpan, and in the pan, shall be the priest's that offereth","10":"And every meat offering, mingled with oil, and dry, shall all the sons of Aaron have, one *as much* as another.","11":"And this *is* the law of the sacrifice of peace offerings, which he shall offer unto the LORD.","12":"If he offer it for a thanksgiving, then he shall offer with the sacrifice of thanksgiving unleavened cakes mingled with oil, and unleavened wafers anointed with oil, and cakes mingled with oil, of fine flour, fried.","13":"Besides the cakes, he shall offer *for* his offering leavened bread with the sacrifice of thanksgiving of his peace offerings.","14":"And of it he shall offer one out of the whole oblation *for* an heave offering unto the LORD, *and* it shall be the priest's that sprinkleth the blood of the peace offerings.","15":"And the flesh of the sacrifice of his peace offerings for thanksgiving shall be eaten the same day that it is offered; he shall not leave any of it until the morning.","16":"But if the sacrifice of his offering *be* a vow, or a voluntary offering, it shall be eaten the same day that he offereth his sacrifice: and on the morrow also the remainder of it shall be eaten:","17":"But the remainder of the flesh of the sacrifice on the third day shall be burnt with fire.","18":"And if *any* of the flesh of the sacrifice of his peace offerings be eaten at all on the third day, it shall not be accepted, neither shall it be imputed unto him that offereth it: it shall be an abomination, and the soul that eateth of it shall bear his iniquity.","19":"And the flesh that toucheth any unclean *thing* shall not be eaten; it shall be burnt with fire: and as for the flesh, all that be clean shall eat","20":"But the soul that eateth *of* the flesh of the sacrifice of peace offerings, that *pertain* unto the LORD, having his uncleanness upon him, even that soul shall be cut off from his people.","21":"Moreover the soul that shall touch any unclean *thing, as* the uncleanness of man, or *any* unclean beast, or any abominable unclean *thing*, and eat of the flesh of the sacrifice of peace offerings, which *pertain* unto the LORD, even that soul shall be cut off from his people.","22":"And the LORD spake unto Moses, saying,","23":"Speak unto the children of Israel, saying, Ye shall eat no manner of fat, of ox, or of sheep, or of goat.","24":"And the fat of the beast that dieth of itself, and the fat of that which is torn with beasts, may be used in any other use: but ye shall in no wise eat","25":"For whosoever eateth the fat of the beast, of which men offer an offering made by fire unto the LORD, even the soul that eateth *it* shall be cut off from his people.","26":"Moreover ye shall eat no manner of blood, *whether it be* of fowl or of beast, in any of your dwellings.","27":"Whatsoever soul *it be* that eateth any manner of blood, even that soul shall be cut off from his people.","28":"And the LORD spake unto Moses, saying,","29":"Speak unto the children of Israel, saying, He that offereth the sacrifice of his peace offerings unto the LORD shall bring his oblation unto the LORD of the sacrifice of his peace offerings.","30":"His own hands shall bring the offerings of the LORD made by fire, the fat with the breast, it shall he bring, that the breast may be waved *for* a wave offering before the LORD.","31":"And the priest shall burn the fat upon the altar: but the breast shall be Aaron's and his sons'.","32":"And the right shoulder shall ye give unto the priest *for* an heave offering of the sacrifices of your peace offerings.","33":"He among the sons of Aaron, that offereth the blood of the peace offerings, and the fat, shall have the right shoulder for *his* part.","34":"For the wave breast and the heave shoulder have I taken of the children of Israel from off the sacrifices of their peace offerings, and have given them unto Aaron the priest and unto his sons by a statute for ever from among the children of Israel.","35":"This *is the portion* of the anointing of Aaron, and of the anointing of his sons, out of the offerings of the LORD made by fire, in the day *when* he presented them to minister unto the LORD in the priest's office;","36":"Which the LORD commanded to be given them of the children of Israel, in the day that he anointed them, *by* a statute for ever throughout their generations.","37":"This *is* the law of the burnt offering, of the meat offering, and of the sin offering, and of the trespass offering, and of the consecrations, and of the sacrifice of the peace offerings;","38":"Which the LORD commanded Moses in mount Sinai, in the day that he commanded the children of Israel to offer their oblations unto the LORD, in the wilderness of Sinai."}},"tsk":{"1":[{"kopje":"de wet","refs":["Lev 5:1","Lev 6:7","Lev 14:12","Lev 14:13","Lev 19:21","Lev 19:22","Num 6:12","Ezech 40:39","Ezech 44:29","Ezech 46:20"]},{"kopje":"het is","refs":["Lev 6:17","Lev 6:25","Lev 21:22"]}],"2":[{"kopje":"in de plaats","refs":["Lev 1:3","Lev 1:5","Lev 1:11","Lev 4:24","Lev 4:29","Lev 4:33","Lev 6:25","Num 6:12","Ezech 40:39"]},{"kopje":"en men","refs":["Lev 1:5","Lev 3:2","Lev 3:8","Lev 5:9","Jes 52:15","Ezech 36:25","Hebr 9:19-22","Hebr 11:28","Hebr 12:24","1 Petr 1:2"]}],"6":[{"kopje":"mannelijk","refs":["Lev 6:16-18","Lev 6:29","Num 18:9","Num 18:10"]},{"kopje":"het is allerheiligst","refs":["Lev 2:3"]}],"7":[{"kopje":"het schuldoffer","refs":["Lev 6:25","Lev 6:26","Lev 14:13"]}],"8":[{"kopje":"de priester","refs":["Lev 15:17"]},{"kopje":"de huid","refs":["Lev 1:6","Lev 4:11","Gen 3:21","Ex 29:14","Num 19:5","Rom 13:14"]}],"9":[{"kopje":"het spijsoffer","refs":["Lev 2:4-7","Num 18:9","Ezech 44:29"]},{"kopje":"in de pan","refs":["Lev 2:5"]},{"kopje":"zijn","refs":["Lev 2:3","Lev 2:10","Lev 5:13","Lev 6:16-18","1 Kor 9:7","1 Kor 9:13","Gal 6:6"]}],"10":[{"kopje":"voor de een evenveel","refs":["Ex 16:18","2 Kor 8:14"]}],"12":[{"kopje":"een lofoffer","refs":["Lev 22:29","2 Kron 29:31","2 Kron 33:16","Neh 12:43","Ps 50:13","Ps 50:14","Ps 50:23","Ps 103:1","Ps 103:2","Ps 107:8","Ps 107:21","Ps 107:22","Ps 116:17","Jer 33:11","Hos 14:3","Luk 17:16","Luk 17:18","Rom 1:21","2 Kor 9:11-15","Ef 5:20","Hebr 13:15","1 Petr 2:5"]},{"kopje":"ongezuurde koeken","refs":["Lev 2:4","Lev 6:16","Num 6:15"]}],"13":[{"kopje":"gedesemd brood","refs":["Lev 23:17","Amos 4:5","Matt 13:33","1 Tim 4:4"]}],"14":[{"kopje":"hefoffer","refs":["Ex 29:27","Ex 29:28","Num 15:19-21","Num 18:24-28","Num 31:29","Num 31:41"]},{"kopje":"de priester","refs":["Lev "L1\" data-code=\"H8451\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8451\">wet</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8451\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5930\">het</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5930\">brandoffer</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H5930\">het</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4503\">spijsoffer</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H4503\">het</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2403\">zondoffer</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H2403\">het</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H817\">schuldoffer</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H817\">het</span> inwijdingsoffer <span class=\"wl\" data-l=\"L6\" data-code=\"H2077\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2077\">het</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2077\">dankoffer</span>;","38":"<span class=\"wl\" data-l=\"L1\" data-code=\"H4872\">die</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4872\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4872\">HEERE</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4872\">Mozes</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6680\">geboden</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6680\">heeft</span> op <span class=\"wl\" data-l=\"L2\" data-code=\"H2022\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H2022\">berg</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5514\">Sinaï</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H5514\">op</span> de dag <span class=\"wl\" data-l=\"L7\" data-code=\"H7133\">dat</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">Hij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">van</span> <span class=\"wl\" data- 459\">fat</span> that <span class=\"wl wl-kjv\" data-code=\"H3680\">covereth</span> the inwards,","4":"And the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3629\">kidneys,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> that is on them, which is by the <span class=\"wl wl-kjv\" data-code=\"H3689\">flanks,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3508\">caul</span> that is above the <span class=\"wl wl-kjv\" data-code=\"H3516\">liver,</span> with the <span class=\"wl wl-kjv\" data-code=\"H3629\">kidneys,</span> it shall he take away:","5":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6999\">burn</span> them upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> for an offering made by <span class=\"wl wl-kjv\" data-code=\"H801\">fire</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> it is a trespass offering.","6":"Every <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> among the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> thereof: it shall be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> in the <span class=\"wl wl-kjv\" data-code=\"H6918\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place:</span> it is <span class=\"wl wl-kjv\" data-code=\"H6944\">most</span> holy.","7":"As the sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering</span> is, so is the trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering:</span> there is <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> for them: the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> that maketh atonement","8":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> that <span class=\"wl wl-kjv\" data-code=\"H7126\">offereth</span> any <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> even the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall have to himself the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> of the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> which he hath offered.","9":"And all the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> that is <span class=\"wl wl-kjv\" data-code=\"H644\">baken</span> in the <span class=\"wl wl-kjv\" data-code=\"H8574\">oven,</span> and all that is <span class=\"wl wl-kjv\" data-code=\"H6213\">dressed</span> in the <span class=\"wl wl-kjv\" data-code=\"H4802\">fryingpan,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H4227\">pan,</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest's</span> that offereth","10":"And every meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering,</span> <span class=\"wl wl-kjv\" data-code=\"H1101\">mingled</span> with <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H2720\">dry,</span> shall all the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> have, <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> as much as another.","11":"And this is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings,</span> which he shall <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> unto the LORD.","12":"If he <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> it for a <span class=\"wl wl-kjv\" data-code=\"H8426\">thanksgiving,</span> then he shall <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> with the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of <span class=\"wl wl-kjv\" data-code=\"H8426\">thanksgiving</span> <span class=\"wl wl-kjv\" data-code=\"H4682\">unleavened</span> <span class=\"wl wl-kjv\" data-code=\"H2471\">cakes</span> <span class=\"wl wl-kjv\" data-code=\"H1101\">mingled</span> with <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H4682\">unleavened</span> <span class=\"wl wl-kjv\" data-code=\"H7550\">wafers</span> <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed</span> with <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H2471\">cakes</span> <span class=\"wl wl-kjv\" data-code=\"H1101\">mingled</span> with <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> of fine <span class=\"wl wl-kjv\" data-code=\"H5560\">flour,</span> fried.","13":"Besides the <span class=\"wl wl-kjv\" data-code=\"H2471\">cakes,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> for his <span class=\"wl wl-kjv\" data-code=\"H7133\">offering</span> <span class=\"wl wl-kjv\" data-code=\"H2557\">leavened</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> with the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of <span class=\"wl wl-kjv\" data-code=\"H8426\">thanksgiving</span> of his peace offerings.","14":"And of it he shall <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> out of the whole <span class=\"wl wl-kjv\" data-code=\"H7133\">oblation</span> for an heave <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and it shall be the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest's</span> that <span class=\"wl wl-kjv\" data-code=\"H2236\">sprinkleth</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the peace offerings.","15":"And the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of his peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings</span> for <span class=\"wl wl-kjv\" data-code=\"H8426\">thanksgiving</span> shall be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that it is <span class=\"wl wl-kjv\" data-code=\"H7133\">offered;</span> he shall not <span class=\"wl wl-kjv\" data-code=\"H3240\">leave</span> any of it until the morning.","16":"But if the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of his <span class=\"wl wl-kjv\" data-code=\"H7133\">offering</span> be a <span class=\"wl wl-kjv\" data-code=\"H5088\">vow,</span> or a voluntary <span class=\"wl wl-kjv\" data-code=\"H5071\">offering,</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that he <span class=\"wl wl-kjv\" data-code=\"H7126\">offereth</span> his <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice:</span> and on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow</span> also the <span class=\"wl wl-kjv\" data-code=\"H3498\">remainder</span> of it shall be eaten:","17":"But the <span class=\"wl wl-kjv\" data-code=\"H3498\">remainder</span> of the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> on the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> with fire.","18":"And if any of the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of his peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings</span> be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> at <span class=\"wl w 15\">soul</span> that shall <span class=\"wl wl-kjv\" data-code=\"H5060\">touch</span> any <span class=\"wl wl-kjv\" data-code=\"H2932\">unclean</span> thing, as the <span class=\"wl wl-kjv\" data-code=\"H2932\">uncleanness</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> or any <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> or any <span class=\"wl wl-kjv\" data-code=\"H8263\">abominable</span> <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> thing, and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings,</span> which pertain unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> even that <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from his people.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","23":"<span class=\"wl wl-kjv\" data-code=\"H1696\">Speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> no manner of <span class=\"wl wl-kjv\" data-code=\"H2459\">fat,</span> of <span class=\"wl wl-kjv\" data-code=\"H7794\">ox,</span> or of <span class=\"wl wl-kjv\" data-code=\"H3775\">sheep,</span> or of goat.","24":"And the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> of the beast that dieth of <span class=\"wl wl-kjv\" data-code=\"H5038\">itself,</span> and the <span class=\"wl wl-kjv\" dat // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
