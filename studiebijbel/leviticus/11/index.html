 maar naar de wil van God de tijd te leven die nog over is in het vlees.", "Ps 99:9": "Verhef de HEERE, onze God, en buig u voor de berg van Zijn heiligheid; want de HEERE, onze God, is heilig.", "Deut 14:26": "En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.", "Deut 14:8": "Ook het varken; want dat verdeelt zijn klauw wel, maar het herkauwt niet; onrein zal het voor u zijn; van hun vlees zult u niet eten, en hun dode kadaver zult u niet aanraken.", "1 Kor 10:32": "Wees zonder aanstoot te geven, zowel voor de Joden als voor de Grieken als voor de gemeente van God.", "Ps 47:9": "God regeert over de heidenen; God zit op de troon van Zijn heiligheid.", "Hand 22:16": "En nu, waarom wacht u nog? Sta op, laat u dopen en uw zonden afwassen, terwijl u de Naam van de Heere aanroept.", "Jes 29:10": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.", "Num 19:11-16": "Wie een dode aanraakt, welk dood lichaam van een mens dan ook, die zal zeven dagen onrein zijn. Op de derde dag zal hij zich daarmee ontzondigen, dan zal hij op de zevende dag rein zijn; maar als hij zich op de derde dag niet ontzondigt, dan zal hij op de zevende dag niet rein zijn. Ieder die een dode, het dode lichaam van een mens die gestorven is, aanraakt, en zich niet ontzondigd zal hebben, die verontreinigt de tabernakel van de HEERE; daarom zal die ziel uitgeroeid worden uit Israël; omdat het water van de afzondering niet op hem gesprenkeld is, zal hij onrein zijn; zijn onreinheid is nog in hem.", "Luk 15:15": "En hij ging heen, en voegde zich bij één van de burgers van dat land; en die stuurde hem naar zijn land om de zwijnen te weiden.", "Jes 55:3": "Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "Ps 94:11": "De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "Ps 2:1": "Waarom woeden de heidenen, en bedenken de volken iets zinloos?", "Joh 12:15": "Vrees niet, dochter van Sion, zie, uw Koning komt, zittend op het veulen van een ezelin.", "Joh 8:44": "U bent uit uw vader de duivel, en u wilt de begeerten van uw vader doen; die was een mensenmoordenaar van het begin af aan, en is niet in de waarheid blijven staan, want er is geen waarheid in hem. Wanneer hij de leugen spreekt, spreekt hij uit wat van hemzelf is; want hij is een leugenaar, en de vader daarvan.", "Job 4:17-19": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker? Zie, op Zijn knechten zou Hij niet vertrouwen; ook Zijn engelen heeft Hij van dwaasheid beschuldigd. Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot.", "Spr 2:2": "Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt;", "Jes 2:20": "Op die dag zal de mens zijn zilveren afgoden, en zijn gouden afgoden, die zij zich gemaakt hadden, om zich daarvoor neer te buigen, wegwerpen voor de mollen en de vleermuizen;", "Ps 118:22": "De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "2 Kron 17:7-9": "In het derde jaar van zijn regering nu zond hij naar zijn vorsten, naar Ben-chaïl, en naar Obadja, en naar Zecharja, en naar Nathaneël, en naar Michaja, om te leren in de steden van Juda. En met hen de Levieten, Semaja en Nethanja, en Zebadja, en Asaël, en Semiramoth, en Jonathan, en Adonia, en Tobia, en Tob-adonia, de Levieten, en met hen de priesters Elisama en Joram. En zij leerden in Juda, en het wetboek van de HEERE was bij hen; en zij gingen rond in alle steden van Juda, en leerden onder het volk.", "Jes 48:12": "Hoor naar Mij, o Jakob! En u, Israël, Mijn geroepene! Ik ben Dezelfde; Ik ben de Eerste, ook ben Ik de Laatste.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Jes 40:3": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God!", "Matt 8:17": "opdat vervuld zou worden wat gesproken was door de profeet Jesaja, die zei: Hij heeft onze ziekten op Zich genomen, en onze kwalen gedragen.", "1 Joh 2:5": "Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Hand 2:25-28": "Want David zegt van Hem: Ik zag de Heere altijd voor mij; want Hij is aan mijn rechterhand, opdat ik niet bewogen zou worden. Daarom is mijn hart verblijd, en mijn tong verheugt zich; ja, ook mijn vlees zal rusten in hoop; Want U zult mijn ziel niet verlaten in het rijk van de dood, en Uw Heilige zult U niet overgeven om verderving te zien.", "1 Petr 3:10-12": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen. Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Hand 7:7": "En het volk dat zij zullen dienen, zal Ik oordelen, zei God; en daarna zullen zij uitgaan, en zij zullen Mij dienen op deze plaats.", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Deut 14:10": "Maar alles wat geen vinnen en schubben heeft, zult u niet eten; het zal voor u onrein zijn.", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Rom 2:28": "Want die is niet een Jood, die het in het openbaar is; en dat is ook niet de besnijdenis, die het in het openbaar in het vlees is;", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "Luk 24:27": "En Hij begon bij Mozes en bij al de profeten, en legde hun uit, in al de Schriften, wat over Hemzelf geschreven was.", "Mal 3:16": "Toen spraken zij die de HEERE vrezen, ieder tot zijn naaste: De HEERE merkt er toch op en hoort, en er is een gedenkboek voor Zijn aangezicht geschreven, voor hen die de HEERE vrezen, en voor hen die aan Zijn Naam denken.", "Lev 20:25": "Daarom zult u onderscheid maken tussen reine en onreine dieren, en tussen het onreine en reine gevogelte; en u zult uzelf niet verfoeilijk maken aan de dieren en aan het gevogelte, en aan alles wat op de aardbodem kruipt, dat Ik voor u afgezonderd heb, opdat u het onrein houdt.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Ps 74:2": "Denk aan Uw vergadering, die U vanouds verworven hebt; de roede van Uw erfenis, die U verlost hebt; de berg Sion, waar U gewoond hebt.", "Luk 7:27": "Deze is het, over wie geschreven is: Zie, Ik zend Mijn engel voor Uw aangezicht uit, die Uw weg voor U klaar zal maken.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "Rom 9:26": "En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.", "Luk 6:36": "Wees dan barmhartig, zoals ook uw Vader barmhartig is.", "Ps 33:5": "Hij heeft gerechtigheid en recht lief; de aarde is vol van de goedertierenheid van de HEERE.", "Gal 5:22-25": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing. Tegen zulke mensen is de wet niet. Maar wie van Christus zijn, hebben het vlees gekruisigd met zijn hartstochten en begeerten.", "Mark 12:26": "Maar wat de doden betreft, dat zij opgewekt zullen worden: hebt u niet gelezen in het boek van Mozes, hoe God in de doornstruik tot hem gesproken heeft: Ik ben de God van Abraham, en de God van Izak, en de God van Jakob?", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Hebr 1:13": "En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?", "1 Joh 2:20": "Maar u hebt de zalving van de Heilige, en u weet alle dingen.", "1 Petr 4:7": "En het einde van alle dingen is nabij; wees dan nuchter en waak in de gebeden.", "Ps 22:19": "Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad.", "Ps 111:9": "Pe. Hij heeft Zijn volk verlossing gezonden; Tsade. Hij heeft Zijn verbond in eeuwigheid geboden; Koph. Zijn Naam is heilig en ontzagwekkend.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ex 28:36": "Verder zult u een plaat maken van zuiver goud, en u zult daarin graveren, zoals men de zegels graveert: HEILIGHEID VOOR DE HEERE!", "Ps 135:4": "Want de HEERE heeft Zich Jakob verkoren, Israël tot Zijn eigendom.", "Lev 14:54-57": "Dit is de wet voor elke plaag van de melaatsheid, en voor schurftheid; en voor melaatsheid van de kleren, en van de huizen; alsook voor gezwel, en voor gezweer, en voor blaren;", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Ezech 37:27": "En Mijn tabernakel zal bij hen zijn, en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "1 Kor 10:31": "Of u dus eet, of drinkt, of iets anders doet, doe alles tot eer van God.", "Ps 98:1": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven.", "Ps 104:4": "Hij maakt Zijn engelen geesten, Zijn dienaars tot een vlammend vuur.", "Ps 91:11": "Want Hij zal Zijn engelen aangaande u bevelen, dat zij u bewaren op al uw wegen.", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "Rom 10:20": "En Jesaja durft het aan, en zegt: Ik ben gevonden door hen die Mij niet zochten; Ik ben openbaar geworden aan hen die naar Mij niet vroegen.", "Rom 7:4": "Zo dan, mijn broeders, u bent ook voor de wet gedood door het lichaam van Christus, opdat u zou toebehoren aan een Ander, namelijk aan Hem Die van de doden opgewekt is, opdat wij voor God vruchten zouden dragen.", "Deut 1:8": "Zie, Ik heb dat land aan u gegeven; ga erin, en bezit erfelijk het land, dat de HEERE aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft dat Hij het hun en hun nageslacht na hen geven zou.", "Gen 1:26": "En God zei: Laat Ons mensen maken, naar Ons beeld, naar Onze gelijkenis; en laten zij heersen over de vissen van de zee, en over het gevogelte van de hemel, en over het vee, en over de hele aarde, en over al de kruipende dieren die op de aarde kruipen.", "Jes 40:3-5": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God! Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden. En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Ef 4:8": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven."}, "noten": {"1": "SV: konijntje. D.i.: waarschijnlijk de klipdas, een klein herkauwend zoogdier."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">HEERE</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">sprak</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">tot</span> <span class=\"wl\" data-l=\"L2\" data-c ertheless</span> these shall ye not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of them that <span class=\"wl wl-kjv\" data-code=\"H5927\">chew</span> the <span class=\"wl wl-kjv\" data-code=\"H1625\">cud,</span> or of them that <span class=\"wl wl-kjv\" data-code=\"H6536\">divide</span> the <span class=\"wl wl-kjv\" data-code=\"H6541\">hoof:</span> as the <span class=\"wl wl-kjv\" data-code=\"H1581\">camel,</span> because he <span class=\"wl wl-kjv\" data-code=\"H5927\">cheweth</span> the <span class=\"wl wl-kjv\" data-code=\"H1625\">cud,</span> but <span class=\"wl wl-kjv\" data-code=\"H6536\">divideth</span> not the <span class=\"wl wl-kjv\" data-code=\"H6541\">hoof;</span> he is unclean", "5": "And the <span class=\"wl wl-kjv\" data-code=\"H8227\">coney,</span> because he <span class=\"wl wl-kjv\" data-code=\"H5927\">cheweth</span> the <span class=\"wl wl-kjv\" data-code=\"H1625\">cud,</span> but <span class=\"wl wl-kjv\" data-code=\"H6536\">divideth</span> not the <span class=\"wl wl-kjv\" data-code=\"H6541\">hoof;</span> he is unclean", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H768\">hare,</span> because he <span class=\"wl wl-kjv\" data-code=\"H5927\">cheweth</span> the <span class=\"wl wl-kjv\" data-code=\"H1625\">cud,</span> but <span class=\"wl wl-kjv\" data-code=\"H6536\">divideth</span> not the <span class=\"wl wl-kjv\" data-code=\"H6541\">hoof;</span> he is unclean", "7": "And the <span class=\"wl wl-kjv\" data-code=\"H2386\">swine,</span> though he <span class=\"wl wl-kjv\" data-code=\"H6536\">divide</span> the <span class=\"wl wl-kjv\" data-code=\"H6541\">hoof,</span> and be <span class=\"wl wl-kjv\" data-code=\"H8156\">clovenfooted,</span> yet he <span class=\"wl wl-kjv\" data-code=\"H1641\">cheweth</span> not the <span class=\"wl wl-kjv\" data-code=\"H1625\">cud;</span> he is unclean", "8": "Of their <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> shall ye not <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and their <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> shall ye not <span class=\"wl wl-kjv\" data-code=\"H5060\">touch;</span> they are unclean", "9": "These shall ye <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of all that are in the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters:</span> whatsoever hath <span class=\"wl wl-kjv\" data-code=\"H5579\">fins</span> and <span class=\"wl wl-kjv\" data-code=\"H7193\">scales</span> in the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3220\">seas,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5158\">rivers,</span> them shall ye eat.", "10": "And all that have not <span class=\"wl wl-kjv\" data-code=\"H5579\">fins</span> and <span class=\"wl wl-kjv\" data-code=\"H7193\">scales</span> in the <span class=\"wl wl-kjv\" data-code=\"H3220\">seas,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5158\">rivers,</span> of all that <span class=\"wl wl-kjv\" data-code=\"H8318\">move</span> in the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> and of any <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">thing</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> they shall be an abomination", "11": "They shall be even an <span class=\"wl wl-kjv\" data-code=\"H8263\">abomination</span> unto you; ye shall not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of their <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> but ye shall have their <span class=\"wl wl-kjv\" data-code=\"H5038\">carcases</span> in abomination.", "12": "Whatsoever hath no <span class=\"wl wl-kjv\" data-code=\"H5579\">fins</span> nor <span class=\"wl wl-kjv\" data-code=\"H7193\">scales</span> in the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> that shall be an abomination", "13": "And these are they which ye shall have in <span class=\"wl wl-kjv\" data-code=\"H8262\">abomination</span> <span class=\"wl wl-kjv\" data-code=\"H4480\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls;</span> they shall not be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten,</span> they are an <span class=\"wl wl-kjv\" data-code=\"H8263\">abomination:</span> the <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6538\">ossifrage,</span> and the ospray,", "14": "And the <span class=\"wl wl-kjv\" data-code=\"H1676\">vulture,</span> and the <span class=\"wl wl-kjv\" data-code=\"H344\">kite</span> after his kind;", "15": "Every <span class=\"wl wl-kjv\" data-code=\"H6158\">raven</span> after his kind;", "16": "And the <span class=\"wl wl-kjv\" data-code=\"H1323\">owl,</span> and the night <span class=\"wl wl-kjv\" data-code=\"H8464\">hawk,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7828\">cuckow,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5322\">hawk</span> after his kind,", "17": "And the little <span class=\"wl wl-kjv\" data-code=\"H3563\">owl,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7994\">cormorant,</span> and the great owl,", "18": "And the <span class=\"wl wl-kjv\" data-code=\"H8580\">swan,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6893\">pelican,</span> and the gier eagle,", "19": "And the <span class=\"wl wl-kjv\" data-code=\"H2624\">stork,</span> the <span class=\"wl wl-kjv\" data-code=\"H601\">heron</span> after her <span class=\"wl wl-kjv\" data-code=\"H4327\">kind,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1744\">lapwing,</span> and the bat.", "20": "All <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> that <span class=\"wl wl-kjv\" data-code=\"H8318\">creep,</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">going</span> upon all <span class=\"wl wl-kjv\" data-code=\"H702\">four,</span> shall be an abomination", "21": "Yet these may ye <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of every <span class=\"wl wl-kjv\" data-code=\"H5775\">flying</span> <span class=\"wl wl-kjv\" data-code=\"H8318\">creeping</span> thing that <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> upon all <span class=\"wl wl-kjv\" data-code=\"H702\">four,</span> which have <span class=\"wl wl-kjv\" data-code=\"H3767\">legs</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">above</span> their <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> to <span class=\"wl wl-kjv\" data-code=\"H5425\">leap</span> <span class=\"wl wl-kjv\" data-code=\"H2004\">withal</span> upon the earth;", "22": "Even these of them ye may <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> the <span class=\"wl wl-kjv\" data-code=\"H697\">locust</span> after his <span class=\"wl wl-kjv\" data-code=\"H4327\">kind,</span> and the bald <span class=\"wl wl-kjv\" data-code=\"H5556\">locust</span> after his <span class=\"wl wl-kjv\" data-code=\"H4327\">kind,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2728\">beetle</span> after his <span class=\"wl wl-kjv\" data-code=\"H4327\">kind,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2284\">grasshopper</span> after his kind.", "23": "But all other <span class=\"wl wl-kjv\" data-code=\"H5775\">flying</span> creeping <span class=\"wl wl-kjv\" data-code=\"H8318\">things,</span> which have <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> shall be an abomination", "24": "And for these ye shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> whosoever <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> of them shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "25": "And whosoever <span class=\"wl wl-kjv\" data-code=\"H5375\">beareth</span> ought of the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> of them shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "26": "The carcases of every <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> which <span class=\"wl wl-kjv\" data-code=\"H6536\">divideth</span> the <span class=\"wl wl-kjv\" data-code=\"H6541\">hoof,</span> and is not <span class=\"wl wl-kjv\" data-code=\"H8157\">clovenfooted,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5927\">cheweth</span> the <span class=\"wl wl-kjv\" data-code=\"H1625\">cud,</span> are <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> unto you: every one that <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> them shall be unclean.", "27": "And <span class=\"wl wl-kjv\" data-code=\"H3605\">whatsoever</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3709\">paws,</span> among all manner of <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> on all <span class=\"wl wl-kjv\" data-code=\"H702\">four,</span> those are <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> unto you: whoso <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> their <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "28": "And he that <span class=\"wl wl-kjv\" data-code=\"H5375\">beareth</span> the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> of them shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the <span class=\"wl wl-kjv\" data-code=\"H6153\">even:</span> they are unclean", "29": "These also shall be <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> unto you among the creeping <span class=\"wl wl-kjv\" data-code=\"H8318\">things</span> that <span class=\"wl wl-kjv\" data-code=\"H8317\">creep</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> the <span class=\"wl wl-kjv\" data-code=\"H2467\">weasel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5909\">mouse,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6632\">tortoise</span> after his kind,", "30": "And the <span class=\"wl wl-kjv\" data-code=\"H604\">ferret,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3581\">chameleon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3911\">lizard,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2546\">snail,</span> and the mole.", "31": "These are <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> to you among all that <span class=\"wl wl-kjv\" data-code=\"H8318\">creep:</span> whosoever doth <span class=\"wl wl-kjv\" data-code=\"H5060\">touch</span> them, when they be <span class=\"wl wl-kjv\" data-code=\"H4194\">dead,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "32": "And upon whatsoever any of them, when they are <span class=\"wl wl-kjv\" data-code=\"H4194\">dead,</span> doth <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean;</span> whether it be any <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> of <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> or <span class=\"wl wl-kjv\" data-code=\"H899\">raiment,</span> or <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> or <span class=\"wl wl-kjv\" data-code=\"H8242\">sack,</span> whatsoever <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> it be, wherein any <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> is <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> it must be <span class=\"wl wl-kjv\" data-code=\"H935\">put</span> into <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the <span class=\"wl wl-kjv\" data-code=\"H6153\">even;</span> so it shall be cleansed.", "33": "And every <span class=\"wl wl-kjv\" data-code=\"H2789\">earthen</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel,</span> whereinto any of them <span class=\"wl wl-kjv\" data-code=\"H5307\">falleth,</span> whatsoever is in it shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean;</span> and ye shall break", "34": "Of all <span class=\"wl wl-kjv\" data-code=\"H400\">meat</span> which may be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten,</span> that on which such <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> and all <span class=\"wl wl-kjv\" data-code=\"H4945\">drink</span> that may be <span class=\"wl wl-kjv\" data-code=\"H8354\">drunk</span> in every such <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> shall be unclean.", "35": "And every thing whereupon any part of their <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">falleth</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean;</span> whether it be <span class=\"wl wl-kjv\" data-code=\"H8574\">oven,</span> or <span class=\"wl wl-kjv\" data-code=\"H3600\">ranges</span> for pots, they shall be broken <span class=\"wl wl-kjv\" data-code=\"H5422\">down:</span> for they are <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean,</span> and shall be unclean", "36": "Nevertheless a <span class=\"wl wl-kjv\" data-code=\"H4599\">fountain</span> or <span class=\"wl wl-kjv\" data-code=\"H953\">pit,</span> wherein there is <span class=\"wl wl-kjv\" data-code=\"H4723\">plenty</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2889\">clean:</span> but that which <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> their <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> shall be unclean.", "37": "And if any part of their <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> upon any <span class=\"wl wl-kjv\" data-code=\"H2221\">sowing</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> which is to be <span class=\"wl wl-kjv\" data-code=\"H2232\">sown,</span> it shall be clean.", "38": "But if any <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> be <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and any part of their <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> thereon, it shall be unclean", "39": "And if any <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> of which ye may <span class=\"wl wl-kjv\" data-code=\"H402\">eat,</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die;</span> he that <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "40": "And he that <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> of the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> of it shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the <span class=\"wl wl-kjv\" data-code=\"H6153\">even:</span> he also that <span class=\"wl wl-kjv\" data-code=\"H5375\">beareth</span> the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> of it shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "41": "And every creeping <span class=\"wl wl-kjv\" data-code=\"H8318\">thing</span> that <span class=\"wl wl-kjv\" data-code=\"H8317\">creepeth</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall be an <span class=\"wl wl-kjv\" data-code=\"H8263\">abomination;</span> it shall not be eaten.", "42": "Whatsoever <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1512\">belly,</span> and whatsoever <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> upon all <span class=\"wl wl-kjv\" data-code=\"H702\">four,</span> or whatsoever hath <span class=\"wl wl-kjv\" data-code=\"H7235\">more</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> among all creeping <span class=\"wl wl-kjv\" data-code=\"H8318\">things</span> that <span class=\"wl wl-kjv\" data-code=\"H8317\">creep</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> them ye shall not <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> for they are an abomination.", "43": "Ye shall not <span class=\"wl wl-kjv\" data-code=\"H8262\">make</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">yourselves</span> <span class=\"wl wl-kjv\" data-code=\"H8262\">abominable</span> with any creeping <span class=\"wl wl-kjv\" data-code=\"H8318\">thing</span> that <span class=\"wl wl-kjv\" data-code=\"H8317\">creepeth,</span> neither shall ye make yourselves <span class=\"wl wl-kjv\" data-code=\"H2933\">unclean</span> with them, that ye should be defiled", "44": "For I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> ye shall therefore sanctify <span class=\"wl wl-kjv\" data-code=\"H6942\">yourselves,</span> and ye shall be <span class=\"wl wl-kjv\" data-code=\"H6918\">holy;</span> for I am <span class=\"wl wl-kjv\" data-code=\"H6918\">holy:</span> neither shall ye <span class=\"wl wl-kjv\" data-code=\"H2930\">defile</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">yourselves</span> with any manner of creeping <span class=\"wl wl-kjv\" data-code=\"H8318\">thing</span> that <span class=\"wl wl-kjv\" data-code=\"H7430\">creepeth</span> upon the earth.", "45": "For I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that <span class=\"wl wl-kjv\" data-code=\"H5927\">bringeth</span> you up out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> to be your <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> ye shall therefore be <span class=\"wl wl-kjv\" data-code=\"H6918\">holy,</span> for I am holy.", "46": "This is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowl,</span> and of every <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">creature</span> that <span class=\"wl wl-kjv\" data-code=\"H7430\">moveth</span> in the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> and of every <span class=\"wl wl-kjv\" data-code=\"H5315\">creature</span> that <span class=\"wl wl-kjv\" data-code=\"H8317\">creepeth</span> upon the earth:", "47": "To make a <span class=\"wl wl-kjv\" data-code=\"H914\">difference</span> between the <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> and the <span class=\"wl wl-kjv\" data-code=\"H2889\">clean,</span> and between the <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> that may be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> and the <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> that may not be eaten."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
