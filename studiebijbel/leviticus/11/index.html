ohannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En de HEERE sprak tot Mozes en tot Aäron, en zei tegen hen:","2":"Spreek tot de kinderen van Israël: Dit is het gedierte dat u eten mag uit alle dieren die op de aarde zijn.","3":"Alles onder de dieren wat de klauw verdeelt, en de klauwen in tweeën gespleten heeft, en herkauwt, dat mag u eten.","4":"Deze echter zult u niet eten, van de dieren die *alleen* herkauwen, of *alleen* de klauwen verdelen: de kameel, want die herkauwt wel, maar verdeelt de klauw niet; die zal voor u onrein zijn;","5":"En het klipdasje[1], want het herkauwt wel, maar verdeelt de klauw niet; dat zal voor u onrein zijn;","6":"En de haas, want hij herkauwt wel, maar verdeelt de klauw niet; die zal voor u onrein zijn.","7":"Ook het varken, want dat verdeelt wel de klauw, en heeft de klauwen in tweeën gespleten, maar herkauwt het gekauwde niet; dat zal voor u onrein zijn.","8":"Van hun vlees zult u niet eten, en hun kadaver niet aanraken; zij zullen voor u onrein zijn.","9":"Dit zult u eten van alles wat in het water is: alles wat in het water, in de zeeën en in de rivieren, vinnen en schubben heeft, dat mag u eten;","10":"Maar alles wat in de zeeën en in de rivieren, van al wat wemelt in het water, en van elke levende ziel die in het water is, geen vinnen of schubben heeft, dat zal voor u een gruwel zijn.","11":"Ja, een gruwel zullen zij voor u zijn; van hun vlees zult u niet eten, en hun kadaver zult u verafschuwen.","12":"Alles wat in het water geen vinnen en schubben heeft, dat zal voor u een gruwel zijn.","13":"En van het gevogelte zult u deze verafschuwen, zij zullen niet gegeten worden, zij zijn een gruwel: de arend, en de lammergier, en de zeearend,","14":"En de gier, en de kraai, naar hun soort;","15":"Elke raaf naar zijn soort;","16":"En de struisvogel, en de nachtuil, en de koekoek, en de sperwer naar zijn soort;","17":"En de steenuil, en de aalscholver, en de oehoe,","18":"En de kauw, en de roerdomp, en de pelikaan,","19":"En de ooievaar, de reiger naar zijn soort, en de hop, en de vleermuis.","20":"Al het kruipend gevogelte dat op vier *voeten* loopt, zal voor u een gruwel zijn.","21":"Dit echter zult u eten van al het kruipend gevogelte dat op vier *voeten* loopt: wat boven aan zijn voeten schenkels heeft, om daarmee op de aarde te springen;","22":"Van deze zult u eten: de sprinkhaan naar zijn soort, en de solham naar zijn soort, en de hargol naar zijn soort, en de hagab naar zijn soort.","23":"En al het kruipend gevogelte dat vier voeten heeft, zal voor u een gruwel zijn.","24":"En hierdoor zult u onrein worden: wie hun kadaver aangeraakt zal hebben, zal onrein zijn tot de avond.","25":"Wie van hun kadaver gedragen zal hebben, zal zijn kleren wassen, en onrein zijn tot de avond.","26":"Elk dier dat de klauw verdeelt, maar de klauwen niet in tweeën gespleten heeft, en niet herkauwt, zal voor u onrein zijn; wie het aangeraakt zal hebben, zal onrein zijn.","27":"En alles wat op zijn poten loopt onder alle gedierte dat op vier *voeten* loopt, zal voor u onrein zijn; wie hun kadaver aangeraakt zal hebben, zal onrein zijn tot de avond.","28":"Ook wie hun kadaver gedragen zal hebben, zal zijn kleren wassen, en onrein zijn tot de avond; zij zullen voor u onrein zijn.","29":"Verder zal dit voor u onrein zijn onder het kruipend gedierte dat op de aarde kruipt: het wezeltje, en de muis, en de schildpad, naar hun soort;","30":"En de egel, en de kameleon, en de hagedis, en de slak, en de mol;","31":"Die zullen voor u onrein zijn onder al het kruipend gedierte; wie ze aangeraakt zal hebben, als ze dood zijn, zal onrein zijn tot de avond.","32":"Ook alles waarop *iets* van hen vallen zal, als ze dood zijn, zal onrein zijn: hetzij een houten vat, of een kleed, of een vel, of een zak, *of* enig voorwerp waarmee werk gedaan wordt; het zal in het water gestoken worden, en onrein zijn tot de avond; daarna zal het rein zijn.","33":"En elk aarden vat waarin *iets* van hen zal zijn gevallen, alles wat erin is zal onrein zijn, en u zult het breken.","34":"Van al het voedsel dat men eet, waarop het water gekomen zal zijn, dat zal onrein zijn; en alle drank die men drinkt, zal in elk vat onrein zijn.","35":"En alles waarop iets van hun kadaver zal vallen, zal onrein zijn; de oven en de aarden pan zal stukgebroken worden; ze zijn onrein, daarom zullen ze voor u onrein zijn.","36":"Maar een bron, of een put waarin water verzameld is, zal rein zijn; maar wie hun kadaver aangeraakt zal hebben, zal onrein zijn.","37":"En wanneer van hun kadaver iets zal gevallen zijn op zaaizaad dat gezaaid wordt, dat zal rein zijn.","38":"Maar als er water op het zaad gedaan zal worden, en van hun kadaver daarop zal gevallen zijn, dat zal voor u onrein zijn.","39":"En wanneer van de dieren die u tot voedsel zijn *iets* zal gestorven zijn, wie het kadaver ervan aangeraakt zal hebben, zal onrein zijn tot de avond.","40":"Ook wie van hun kadaver gegeten zal hebben, zal zijn kleren wassen, en onrein zijn tot de avond; en wie hun kadaver gedragen zal hebben, zal zijn kleren wassen, en onrein zijn tot de avond.","41":"Vervolgens: al het kruipend gedierte dat op de aarde kruipt, zal een gruwel zijn; het zal niet gegeten worden.","42":"Alles wat op zijn buik gaat, en alles wat op zijn vier *voeten* gaat, of alles wat veel voeten heeft, onder al het kruipend gedierte dat op de aarde kruipt, dat zult u niet eten, want ze zijn een gruwel.","43":"Maak uzelf niet gruwelijk aan enig kruipend gedierte dat kruipt; en verontreinig uzelf daaraan niet, zodat u daardoor onrein zou worden.","44":"Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.","45":"Want Ik ben de HEERE, Die u uit het land Egypte doet optrekken, opdat Ik u tot een God zij, en opdat u heilig bent, omdat Ik heilig ben.","46":"Dit is de wet van de dieren, en van het gevogelte, en van elke levende ziel die zich beweegt in het water, en van elke ziel die kruipt op de aarde;","47":"Om onderscheid te maken tussen het onreine en het reine, en tussen het gedierte dat men mag eten en het gedierte dat men niet eten mag."},"SV":{"1":"En de HEERE sprak tot Mozes en tot Aäron, zeggende tot hen:","2":"Spreekt tot de kinderen Israëls, zeggende: Dit is het gedierte, dat gij eten zult uit alle beesten, die op de aarde zijn.","3":"Al wat onder de beesten den klauw verdeelt, en de kloof der klauwen in tweeën klieft, *en* herkauwt, dat zult gij eten.","4":"Deze nochtans zult gij niet eten, van degenen, die *alleen* herkauwen, of de klauwen *alleen* verdelen: den kemel, want hij herkauwt wel, maar verdeelt den klauw niet; die zal u onrein zijn;","5":"En het konijntje, want het herkauwt wel, maar verdeelt den klauw niet; dat zal u onrein zijn;","6":"En den haas, want hij herkauwt wel, maar verdeelt den klauw niet; die zal u onrein zijn.","7":"Ook het zwijn, want dat verdeelt wel den klauw, en klieft de klove der klauwen in tweeën, maar herkauwt het gekauwde niet; dat zal u onrein zijn.","8":"Van hun vlees zult gij niet eten, en hun dood aas niet aanroeren, zij zullen u onrein zijn.","9":"Dit zult gij eten van al wat in de wateren is: al wat in de wateren, in de zeeën en in de rivieren, vinnen en schubben heeft, dat zult gij eten;","10":"Maar al wat in de zeeën en in de rivieren, van alle gewemel der wateren, en van alle levende ziel, die in de wateren is, geen vinnen of schubben heeft, dat zal u een verfoeisel zijn.","11":"Ja, een verfoeisel zullen zij u zijn; van hun vlees zult gij niet eten, en hun dood aas zult gij verfoeien.","12":"Al wat in de wateren geen vinnen en schubben heeft, dat zal u een verfoeisel zijn.","13":"En van het gevogelte zult gij deze verfoeien, zij zullen niet gegeten worden, zij zullen een verfoeisel zijn: de arend, en de havik, en de zeearend,","14":"En de gier, en de kraai, naar haar aard;","15":"Alle rave naar haar aard;","16":"En de struis, en de nachtuil, en de koekoek, en de sperwer naar zijn aard;","17":"En de steenuil, en het duikertje, en de schuifuit,","18":"En de kauw, en de roerdomp, en de pelikaan,","19":"En de ooievaar, de reiger naar zijn aard, en de hop, en de vledermuis.","20":"Alle kruipend gevogelte, dat op vier *voeten* gaat, zal u een verfoeisel zijn.","21":"Dit nochtans zult gij eten van al het kruipend gevogelte, dat op vier *voeten* gaat, hetwelk boven aan zijn voeten schenkelen heeft, om daarmede op de aarde te springen;","22":"Van die zult gij deze eten: den sprinkhaan naar zijn aard, en den solham naar zijn aard, en den hargol naar zijn aard, en den hagab naar zijn aard.","23":"En alle kruipend gevogelte, dat vier voeten heeft, zal u een verfoeisel zijn.","24":"En aan deze zult gij verontreinigd worden; zo wie hun dood aas zal aangeroerd hebben, zal onrein zijn tot aan den avond.","25":"Zo wie van hun dood aas gedragen zal hebben, zal zijn klederen wassen, en onrein zijn tot aan den avond.","26":"Alle beest, dat den klauw verdeelt, doch de klove niet in tweeën klieft, en niet herkauwt, zal u onrein zijn; zo wie hetzelve aangeroerd zal hebben, zal onrein zijn.","27":"En al wat op zijn poten gaat onder alle gedierte, op vier *voeten* gaande, die zullen u onrein zijn; al wie hun dood aas aangeroerd zal hebben, zal onrein zijn tot aan den avond.","28":"Ook die hun dood aas zal gedragen hebben, zal zijn klederen wassen, en onrein zijn tot aan den avond; zij zullen u onrein zijn.","29":"Verder zal u dit onder het kruipend gedierte, dat op de aarde kruipt, onrein zijn: het wezeltje, en de muis, en de schildpad, naar haar aard;","30":"En de zwijnegel, en de krokodil, en de hagedis, en de slak, en de mol;","31":"Die zullen u onrein zijn onder alle kruipend gedierte; zo wie die zal aangeroerd hebben, als zij dood zijn, zal onrein zijn tot aan den avond.","32":"Daartoe al hetgeen, waarop *iets* van dezelve vallen zal, als zij dood zijn, zal onrein zijn, *hetzij* van alle houten vat, of kleed, of vel, of zak, *of* alle vat, waarmede *enig* werk gedaan wordt; het zal in het water gestoken worden, en onrein zijn tot aan den avond; daarna zal het rein zijn.","33":"En alle aarden vat, waarin *iets* van dezelve zal gevallen zijn, al wat daarin is, zal onrein zijn, en gij zult dat breken.","34":"Van alle spijze, die men eet, waarop het water zal gekomen zijn, *die* zal onrein zijn; en alle drank, die men drinkt, zal in alle vat onrein zijn.","35":"En waarop iets van hun dood aas zal vallen, zal onrein zijn; de oven en de aarden pan zal verbroken worden; zij zijn onrein, daarom zullen zij u onrein zijn.","36":"Doch een fontein, of put van vergadering der wateren, zal rein zijn; maar wie hun dood aas zal aangeroerd hebben, zal onrein zijn.","37":"En wanneer van hun dood aas zal gevallen zijn op enig zaaibaar zaad, dat gezaaid wordt, dat zal rein zijn.","38":"Maar als water op het zaad gedaan zal worden, en van hun dood aas daarop zal gevallen zijn, dat zal u onrein zijn.","39":"En wanneer van de dieren, die u tot spijze zijn, *iets* zal gestorven zijn, wie deszelfs dood aas zal aangeroerd hebben, zal onrein zijn tot aan den avond.","40":"Ook die van hun dood aas gegeten zal hebben, zal zijn klederen wassen, en onrein zijn tot aan den avond; en die hun dood aas zal gedragen hebben, zal zijn klederen wassen, en onrein zijn tot aan den avond.","41":"Voorts alle kruipend gedierte, dat op de aarde kruipt, zal een verfoeisel zijn; het zal niet gegeten worden.","42":"Al wat op zijn buik gaat, en al wat gaat op zijn vier *voeten*, of al wat vele voeten heeft, onder alle kruipend gedierte, dat op de aarde kruipt, die zult gij niet eten, want zij zijn een verfoeisel.","43":"Maakt uw zielen niet verfoeilijk aan enig kruipend gedierte, dat kruipt; en verontreinigt u niet daaraan, dat gij daaraan verontreinigd zoudt worden.","44":"Want Ik ben de HEERE, uw God; daarom zult gij u heiligen, en heilig zijn, dewijl Ik heilig ben; en gij zult uw ziel niet verontreinigen aan enig kruipend gedierte, dat zich op de aarde roert.","45":"Want Ik ben de HEERE, die u uit Egypteland doe optrekken, opdat Ik u tot een God zij, en opdat gij heilig zijt, dewijl Ik heilig ben.","46":"Dit is de wet van de beesten, en van het gevogelte, en van alle levende ziel, die zich roert in de wateren, en van alle ziel, die kruipt op de aarde;","47":"Om te onderscheiden tussen het onreine en tussen het reine, en tussen het gedierte, dat men eten, en tussen het gedierte, dat men niet eten zal."},"KJV":{"1":"And the LORD spake unto Moses and to Aaron, saying","2":"Speak unto the children of Israel, saying, These *are* the beasts which ye shall eat among all the beasts that *are* on the earth.","3":"Whatsoever parteth the hoof, and is clovenfooted, *and* cheweth the cud, among the beasts, that shall ye eat.","4":"Nevertheless these shall ye not eat of them that chew the cud, or of them that divide the hoof: *as* the camel, because he cheweth the cud, but divideth not the hoof; he *is* unclean","5":"And the coney, because he cheweth the cud, but divideth not the hoof; he *is* unclean","6":"And the hare, because he cheweth the cud, but divideth not the hoof; he *is* unclean","7":"And the swine, though he divide the hoof, and be clovenfooted, yet he cheweth not the cud; he *is* unclean","8":"Of their flesh shall ye not eat, and their carcase shall ye not touch; they *are* unclean","9":"These shall ye eat of all that *are* in the waters: whatsoever hath fins and scales in the waters, in the seas, and in the rivers, them shall ye eat.","10":"And all that have not fins and scales in the seas, and in the rivers, of all that move in the waters, and of any living thing which *is* in the waters, they *shall be* an abomination","11":"They shall be even an abomination unto you; ye shall not eat of their flesh, but ye shall have their carcases in abomination.","12":"Whatsoever hath no fins nor scales in the waters, that *shall be* an abomination","13":"And these *are they which* ye shall have in abomination among the fowls; they shall not be eaten, they *are* an abomination: the eagle, and the ossifrage, and the ospray,","14":"And the vulture, and the kite after his kind;","15":"Every raven after his kind;","16":"And the owl, and the night hawk, and the cuckow, and the hawk after his kind,","17":"And the little owl, and the cormorant, and the great owl,","18":"And the swan, and the pelican, and the gier eagle,","19":"And the stork, the heron after her kind, and the lapwing, and the bat.","20":"All fowls that creep, going upon *all* four, *shall be* an abomination","21":"Yet these may ye eat of every flying creeping thing that goeth upon *all* four, which have legs above their feet, to leap withal upon the earth;","22":"*Even* these of them ye may eat; the locust after his kind, and the bald locust after his kind, and the beetle after his kind, and the grasshopper after his kind.","23":"But all *other* flying creeping things, which have four feet, *shall be* an abomination","24":"And for these ye shall be unclean: whosoever toucheth the carcase of them shall be unclean until the even.","25":"And whosoever beareth *ought* of the carcase of them shall wash his clothes, and be unclean until the even.","26":"*The carcases* of every beast which divideth the hoof, and *is* not clovenfooted, nor cheweth the cud, *are* unclean unto you: every one that toucheth them shall be unclean.","27":"And whatsoever goeth upon his paws, among all manner of beasts that go on *all* four, those *are* unclean unto you: whoso toucheth their carcase shall be unclean until the even.","28":"And he that beareth the carcase of them shall wash his clothes, and be unclean until the even: they *are* unclean","29":"These also *shall be* unclean unto you among the creeping things that creep upon the earth; the weasel, and the mouse, and the tortoise after his kind,","30":"And the ferret, and the chameleon, and the lizard, and the snail, and the mole.","31":"These *are* unclean to you among all that creep: whosoever doth touch them, when they be dead, shall be unclean until the even.","32":"And upon whatsoever *any* of them, when they are dead, doth fall, it shall be unclean; whether *it be* any vessel of wood, or raiment, or skin, or sack, whatsoever vessel *it be*, wherein *any* work is done, it must be put into water, and it shall be unclean until the even; so it shall be cleansed.","33":"And every earthen vessel, whereinto *any* of them falleth, whatsoever *is* in it shall be unclean; and ye shall break","34":"Of all meat which may be eaten, *that* on which *such* water cometh shall be unclean: and all drink that may be drunk in every *such* vessel shall be unclean.","35":"And every *thing* whereupon *any part* of their carcase falleth shall be unclean; *whether it be* oven, or ranges for pots, they shall be broken down: *for* they *are* unclean, and shall be unclean","36":"Nevertheless a fountain or pit, *wherein there is* plenty of water, shall be clean: but that which toucheth their carcase shall be unclean.","37":"And if *any part* of their carcase fall upon any sowing seed which is to be sown, it *shall be* clean.","38":"But if *any* water be put upon the seed, and *any part* of their carcase fall thereon, it *shall be* unclean","39":"And if any beast, of which ye may eat, die; he that toucheth the carcase thereof shall be unclean until the even.","40":"And he that eateth of the carcase of it shall wash his clothes, and be unclean until the even: he also that beareth the carcase of it shall wash his clothes, and be unclean until the even.","41":"And every creeping thing that creepeth upon the earth *shall be* an abomination; it shall not be eaten.","42":"Whatsoever goeth upon the belly, and whatsoever goeth upon *all* four, or whatsoever hath more feet among all creeping things that creep upon the earth, them ye shall not eat; for they *are* an abomination.","43":"Ye shall not make yourselves abominable with any creeping thing that creepeth, neither shall ye make yourselves unclean with them, that ye should be defiled","44":"For I *am* the LORD your God: ye shall therefore sanctify yourselves, and ye shall be holy; for I *am* holy: neither shall ye defile yourselves with any manner of creeping thing that creepeth upon the earth.","45":"For I *am* the LORD that bringeth you up out of the land of Egypt, to be your God: ye shall therefore be holy, for I *am* holy.","46":"This *is* the law of the beasts, and of the fowl, and of every living creature that moveth in the waters, and of every creature that creepeth upon the earth:","47":"To make a difference between the unclean and the clean, and between the beast that may be eaten and t ta-code=\"H8157\">clovenfooted,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5927\">cheweth</span> the <span class=\"wl wl-kjv\" data-code=\"H1625\">cud,</span> are <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> unto you: every one that <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> them shall be unclean.","27":"And <span class=\"wl wl-kjv\" data-code=\"H3605\">whatsoever</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3709\">paws,</span> among all manner of <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> on all <span class=\"wl wl-kjv\" data-code=\"H702\">four,</span> those are <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> unto you: whoso <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> their <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","28":"And he that <span class=\"wl wl-kjv\" data-code=\"H5375\">beareth</span> the <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> of them shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the <span class=\"wl wl-kjv\" data-code=\"H6153\">even:</span> they are unclean","29":"These also shall be <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> unto you among the creeping <span class=\"wl wl-kjv\" data-code=\"H8318\">things</span> that <span class=\"wl wl-kjv\" data-code=\"H8317\">creep</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> the <span class=\"wl wl-kjv\" data-code=\"H2467\">weasel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5909\">mouse,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6632\">tortoise</span> after his kind,","30":"And the <span class=\"wl wl-kjv\" data-code=\"H604\">ferret,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3581\">chameleon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3911\">lizard,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2546\">snail,</span> and the mole.","31":"These are <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> to you among all that <span class=\"wl wl-kjv\" data-code=\"H8318\">creep:</span> whosoever doth <span class=\"wl wl-kjv\" data-code=\"H5060\">touch</span> them, when they be <span class=\"wl wl-kjv\" data-code=\"H4194\">dead,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","32":"And upon whatsoever any of them, when they are <span class=\"wl wl-kjv\" data-code=\"H4194\">dead,</span> doth <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean;</span> whether it be any <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> of <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> or <span class=\"wl wl-kjv\" data-code=\"H899\">raiment,</span> or <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> or <span class=\"wl wl-kjv\" data-code=\"H8242\">sack,</span> whatsoever <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> it be, wherein any <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> is <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> it must be <span class=\"wl wl-kjv\" data-code=\"H935\">put</span> into <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the <span class=\"wl wl-kjv\" data-code=\"H6153\">even;</span> so it shall be cleansed.","33":"And every <span class=\"wl wl-kjv\" data-code=\"H2789\">earthen</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel,</span> whereinto any of them <span class=\"wl wl-kjv\" data-code=\"H5307\">falleth,</span> whatsoever is in it shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean;</span> and ye shall break","34":"Of all <span class=\"wl wl-kjv\" data-code=\"H400\">meat</span> which may be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten,</span> that on which such <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> and all <span class=\"wl wl-kjv\" data-code=\"H4945\">drink</span> that may be <span class=\"wl wl-kjv\" data-code=\"H8354\">drunk</span> in every such <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> shall be unclean.","35":"And every thing whereupon any part of their <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">falleth</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean;</span> whether it be <span class=\"wl wl-kjv\" data-code=\"H8574\">oven,</span> or <span class=\"wl wl-kjv\" data-code=\"H3600\">ranges</span> for pots, they shall be broken <span class=\"wl wl-kjv\" data-code=\"H5422\">down:</span> for they are <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean,</span> and shall be unclean","36":"Nevertheless a <span class=\"wl wl-kjv\" data-code=\"H4599\">fountain</span> or <span class=\"wl wl-kjv\" data-code=\"H953\">pit,</span> wherein there is <span class=\"wl wl-kjv\" data-code=\"H4723\">plenty</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2889\">clean:</span> but that which <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> their <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> shall be unclean.","37":"And if any part of their <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> upon any <span class=\"wl wl-kjv\" data-code=\"H2221 "wl wl-kjv\" data-code=\"H8263\">abomination;</span> it shall not be eaten.","42":"Whatsoever <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1512\">belly,</span> and whatsoever <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> upon all <span class=\"wl wl-kjv\" data-code=\"H702\">four,</span> or whatsoever hath <span class=\"wl wl-kjv\" data-code=\"H7235\">more</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> among all creeping <span class=\"wl wl-kjv\" data-code=\"H8318\">things</span> that <span class=\"wl wl-kjv\" data-code=\"H8317\">creep</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> them ye shall not <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> for they are an abomination.","43":"Ye shall not <span class=\"wl wl-kjv\" data-code=\"H8262\">make</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">yourselves</span> <span class=\"wl wl-kjv\" data-code=\"H8262\">abominable</span> with any creeping <span class=\"wl wl-kjv\" data-code=\"H8318\">thing</span> that <span class=\"wl wl-kjv\" data-code=\"H8317\">creepeth,</span> neither shall ye make yourselves <span class=\"wl wl-kjv\" data-code=\"H2933\">unclean</span> with them, that ye should be defiled","44":"For I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> ye shall therefore sanctify <span class=\"wl wl-kjv\" data-code=\"H6942\">yourselves,</span> and ye shall be <span class=\"wl wl-kjv\" data-code=\"H6918\">holy;</span> for I am <span class=\"wl wl-kjv\" data-code=\"H6918\">holy:</span> neither shall ye <span class=\"wl wl-kjv\" data-code=\"H2930\">defile</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">yourselves</span> with any manner of creeping <span class=\"wl wl-kjv\" data-code=\"H8318\">thing</span> that <span class=\"wl wl-kjv\" data-code=\"H7430\">creepeth</span> upon the earth.","45":"For I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that <span class=\"wl wl-kjv\" data-code=\"H5927\">bringeth</span> you up out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> to be your <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> ye shall therefore be <span class=\"wl wl-kjv\" data-code=\"H6918\">holy,</span> for I am holy.","46":"This is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowl,</span> and of every <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">creature</span> that <span class=\"wl wl-kjv\" data-code=\"H7430\">moveth</span> in the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> and of every <span class=\"wl wl-kjv\" data-code=\"H5315\">creature</span> that <span class=\"wl wl-kjv\" data-code=\"H8317\">creepeth</span> upon the earth:","47":"To make a <span class=\"wl wl-kjv\" data-code=\"H914\">difference</span> between the <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> and the <span class=\"wl wl-kjv\" data-code=\"H2889\">clean,</span> and between the <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> that may be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> and the <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> that may not be eaten."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"alle beesten,","tekst":"Hebreeuws, uit alle vee. Het Hebreeuwse woord is hier in het algemeen genomen; alsook Gen 1:26, en Gen 6:7, Gen 6:20"}],"3":[{"catchword":"den klauw verdeelt,","tekst":"Dat is, welker hoef, of schoe, of nagel verdeeld is, hetwelk zo niet is in de klauwen der paarden, ezels, enz."},{"catchword":"de kloof der klauwen in tweeën klieft,","tekst":"Dat is, alzo verdeeld, dat zij de klauwen niet in velen gelijk in de honden, katten, enz. te zien is, maar in tweeën gespleten hebben, gelijk in de ossen, koeien, schapen, enz."},{"catchword":"herkauwt,","tekst":"Hebreeuws, het gekauwde weder ophaalt, en zo in het volgende. Versta, het gedierte, dat opnieuw kauwt hetgeen het gekauwd en ingeslikt had, gelijk wij zien dat de ossen, koeien en schapen doen wanneer zij nedergezeten zijn. Drie conditiën of eigenschappen worden in deze reine dieren vereist:&lt;i&gt;I.&lt;/i&gt; de verdeling der klauwen;&lt;i&gt;II.&lt;/i&gt; de klieving in tweeën;&lt;i&gt;III.&lt;/i&gt; de herkauwing. De onderscheiding der twee eerste conditiën is af te leiden niet alleen uit dit en vs.7, maar voornamelijk uit Lev 7:26."},{"catchword":"zult gij eten","tekst":"Dat is, dat moogt gij eten."}],"4":[{"catchword":"die alleen herkauwen,","tekst":"Dat is, die alleen herkauwen zonder de andere eigenschappen te hebben; alzo in de volgende woorden: die de klauwen alleen verdelen. Zie Deu 14:6."},{"catchword":"niet;","tekst":"Versta, niet in tweeën, maar in meer delen, hetwelk is tegen de tweede vereiste conditie, die ook niet is in de konijnen en hazen, vermeld in vs.5,6."}],"5":[{"catchword":"konijntje,","tekst":"Anders, bergmuis, of beermuis; een viervoetig gedierte van grootte als een egel en van gestalte als een muis en beer, wonende in de holen der steenrotsen; zeer veel gevonden in Palestina."}],"7":[{"catchword":"zal u onrein zijn","tekst":"Want het heeft slechts de twee eerste conditiën en niet de derde."}],"9":[{"catchword":"vinnen en schubben heeft,","tekst":"Te weten, beiden samen. Daarom waren onder de vissen onrein:&lt;i&gt;I.&lt;/i&gt; die vinnen noch schubben hadden;&lt;i&gt;II.&lt;/i&gt; die slechts een van beiden hadden."}],"10":[{"catchword":"levende ziel,","tekst":"Zie Gen 1:20."},{"catchword":"een verfoeisel zijn","tekst":"Dat is, wat men verfoeien moet te eten en, dood zijnde, aan te tasten, gelijk in vs.11 verklaard wordt."}],"13":[{"catchword":"de arend,","tekst":"In het vertalen van deze namen heeft men hier gevolgd het meest algemene gevoelen der geleerden."},{"catchword":"havik,","tekst":"Anders, de beenbreker; een soort van arenden, die zijne jeugd vernieuwt; Psa 103:5."},{"catchword":"zeearend,","tekst":"Hij heeft den naam van de kracht en sterkte van zijn vliegen."}],"14":[{"catchword":"kraai,","tekst":"Dezen vogel wordt een goed en sterk gezicht toegeschreven; Job 28:7."}],"16":[{"catchword":"struis,","tekst":"Hebreeuws, de dochter van den struis. Sommigen menen dat deze benaming daarvan komt, omdat onder deze vogels gene mannetjes, maar alleen wijfjes zouden zijn. Anderen, de uil."}],"17":[{"catchword":"schuifuit,","tekst":"Een soort van een groten uil, of een vogel, die des nachts vliegt, anders een huhu genaamd."}],"19":[{"catchword":"ooievaar,","tekst":"Deze vogel heeft zijn naam van de weldadigheid, die hij zijnen voorttelers bewijst, die zij voeden en helpen, wanneer zij door oudheid machteloos geworden zijn."}],"21":[{"catchword":"hetwelk boven aan zijn voeten schenkelen heeft,","tekst":"Anders, hetwelk geen schenkelen heeft."}],"22":[{"catchword":"sprinkhaan","tekst":"Hebreeuws, Arbe. Dat deze in de oosterse landen gegeten werd, is te zien Mat 3:4; Mar 1:6."},{"catchword":"Solham . . . hargol . . . hagab.","tekst":"Deze drie namen worden hier gelaten gelijk zij in den Hebreeuwsen tekst staan, omdat zij niet zo eigenlijk en zekerlijk bekend zijn. In het algemeen betekenen zij zekere soorten van diertjes, die de Latijnen Insecta noemen, beschreven in vs.21."}],"24":[{"catchword":"aan deze","tekst":"Te weten aan de navolgende dingen, welke verhaald worden van hier af tot en met vs.43."},{"catchword":"verontreinigd worden;","tekst":"Te weten, met het aanroeren daarvan."},{"catchword":"zal onrein zijn","tekst":"Dat is, hij zal vanwege zijn ceremoniëele onreinheid niet mogen verkeren met de mensen, veel minder in den voorhof des Heeren verschijnen, of van het geofferde eten, dan na den avond."}],"26":[{"catchword":"Alle beest," rd hebben,","tekst":"Dat is, welke persoon, of wat ding het dood aas aanroert, als dit uit de fontein of put, enz. getrokken wordt, waarin het gevallen was."}],"37":[{"catchword":"zaaibaar zaad,","tekst":"Dat is, wat men placht te zaaien tot gebruik der mensen of der beesten, gelijk uit de volgende woorden te verstaan is."}],"40":[{"catchword":"gegeten zal hebben,","tekst":"Versta dit eigenlijk van het eten uit onwetendheid, wanneer men niet wist dat de spijs van zodanig dood aas toegemaakt was. Want overigens was het hun verboden van zodanig aas te eten; Deu 14:21."}],"42":[{"catchword":"al wat vele voeten heeft,","tekst":"Hebreeuws, tot al wat de voeten vermenigvuldigt."}],"43":[{"catchword":"uw zielen niet verfoeilijk","tekst":"Dat is, uwe personen. Zie Gen 12:5."}],"44":[{"catchword":"Ik ben de HEERE,","tekst":"Uit de redenen, die God hier gebruikt, om zijn volk de voorgemelde wetten in te scherpen, blijkt dat de ceremoniëele reinheid is geweest ene aanwijzing en aanleiding tot de ware geestelijke heiligmaking, die voornamelijk betracht moet worden. God neemt zijne redenen:&lt;i&gt;I.&lt;/i&gt; van zijne natuur, die geestelijk en volkomen heilig is;&lt;i&gt;II.&lt;/i&gt; van het einde, waartoe Hij de Israëlieten verkoren en geroepen had, hetwelk was hunne heiligmaking naar het lichaam en naar den geest;&lt;i&gt;III.&lt;/i&gt; van de weldaad, die Hij hun bewees, hen geleid hebbende uit Egypte, om hen te brengen in het beloofde land; betekenende daarmede, dat Hij hen ook uit het geestelijke Egypte verlossen wilde, opdat zij hem hier kennen en dienen, en hierna in het hemelse Kanaän eeuwiglijk met hem leven zouden."},{"catchword":"heiligen,","tekst":"Dat is, reinigt u van alle besmetting des lichaams en des geestes, en volbrengt de heiligmaking, dat is, de ware vernieuwing des levens in de vreze Gods; 2Co 7:1."}],"45":[{"catchword":"tot een God zij,","tekst":"Zie Gen 17:7."},{"catchword":"en opdat gij heilig zijt,","tekst":"Of, weest dan heilig, want Ik ben heilig."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the LORD spoke to Moseh and to Aaron, saying:"}],"2":[{"catchword":null,"tekst":"Speak unto the children of Israel, saying: This is the Beasts which ye shall eat, out of all the beasts that are upon the earth. [Heb. out of all cattle. The Hebrew word is taken here in a general notion: as also Gen. 1. 26. and chap. 6. verse 7, 20.]"}],"3":[{"catchword":null,"tekst":"Whatsoever among the beasts divideth the claw [or, hoof, contrary to horses, asses, mules, & c.] and cleaveth the cleft of the claw in two, [ i.e. so parteth that they have their claws divided, not into many, as we see in dogs, cats, & c.] (and) cheweth the cud; [Heb. fetcheth up the chewed (meat) or, cud, and so in the sequel. Understand these beasts which ruminate or chew again, what they had chewed and swallowed once already; as we see the oxen, cows, and sheep do, being sat down. Three conditions or properties are required in these clean beasts: 1. The dividing of the claws or hoofs. 2. The cleaving of them in two. 3. The chewing of the cud. The difference of the two former conditions, is to be taken not only out of this verse and the seventh, but especially out of verse 26.] that shall [i.e. may] ye cat."}],"4":[{"catchword":null,"tekst":"Nevertheless these shall ye not eat of them, which (only) chew the cud, [Wanting the two other properties; and so for the words following, (only) divide the claws: see Deut. 14. 6.] or only divide the claws: the Camel, for he cheweth the cud indeed, but doth not divide the claw. [viz. into two parts, but into more; which is against the second requisite condition, wanting likewise in the Conies and Hares, mentioned in the two next verses] the same shall be unclean to you."}],"5":[{"catchword":null,"tekst":"And the Coney, [Oth. a mount-mouse, or, a bear-mouse, being a four footed beast of the bigness of a hedgehog, and the shape of a mouse and bear, having its abode in hollow rocks, and abounding much in Palestina] for that cheweth the cud indeed, but divideth not the claw; the same shall be unclean to you."}],"6":[{"catchword":null,"tekst":"And the Hare; for he indeed doth chew the cud, but divideth not the claw: the same shall be unclean to you."}],"7":[{"catchword":null,"tekst":"Also the Swine, for that divideth the claw indeed, and cleaveth the cleft of the claw in two, but cheweth not the cud: the same shall be unclean to you. [as having but the two former conditions, and wanting the third.]"}],"8":[{"catchword":null,"tekst":"Of their flesh ye shall not eat, nor touch their dead carcass; they shall be unclean to you."}],"9":[{"catchword":null,"tekst":"This ye shall eat of all that is in the waters: all that (or, whatsoever) in the waters, in the Seas, in the Rivers, hath fins and scales, [Together namely; therefore among the fishes all were unclean: 1. That had neither fins or scales: 2. That had but one of these] the same ye shall eat."}],"10":[{"catchword":null,"tekst":"But whatsoever, in the Seas, and in the Rivers, of all the crawling of the waters, and of every living soul that is in the waters [See Gen. 1. on verse 20.] hath no fins or scales, the same shall be an abomination to you. [i.e. that whereof men ought to abhor to eat, or to touch it being dead, as the next verse explaineth it.]"}],"12":[{"catchword":null,"tekst":"Whatsoever hath no fins nor scales in the waters, the same shall be an abomination unto you."}],"13":[{"catchword":null,"tekst":"And of the fowl, ye shall abhor these; they shall not be eaten, they shall be an abomination: the Eagle, [In the Translation of the names of the Fowls here set down, the most common opinions of the Learned hath been followed] and the Hawk, [Oth. Ossifrage, (or, the Bone-breaker) a certain kind Eagle, which renew their age, Psalm 103. 5.] and the Sea-Eagle, [having his name in Hebrew, from the strength and vigour of his flying.]"}],"14":[{"catchword":null,"tekst":"And the Vulture, and the Crow after her kind. [Unto this Fowl there is ascribed a very good and sharp sight, Job. 28. 7.]"}],"15":[{"catchword":null,"tekst":"All (or every) Raven after his kind."}],"16":[{"catchword":null,"tekst":"And the Ostrich [Heb. the daughter of the Ostrich. Some are of opinion that this qualification here is given to this sort of fowl, because they should be all females or hens, and have no cock among them. Oth. the Owl] and the night-Owl, and the Cuckoe, and the sparrow Hawk, after its kind."}],"17":[{"catchword":null,"tekst":"And the stone-owl, and the dive-or di-dopper, and the Scrich-Owl. [Here is mearnt a certain kind of great Owls, or a fowl flying in the night, otherwise called Huhu.]"}],"18":[{"catchword":null,"tekst":"The Jack-Daw, and the Bittern, and the Pelican,"}],"19":[{"catchword":null,"tekst":"And the Stork, [Having his name in the Hebrew from his kindness to his sires, or parents, feeding, helping and supporting them in their old age, and when they cannot help themselves] the Hen after his kind, and the Lap-wing, and the Bat."}],"20":[{"catchword":null,"tekst":"Every creeping fowl, that goeth upon four (feet), shall be an abomination to you."}],"21":[{"catchword":null,"tekst":"This nevertheless thou shalt eat of all the creeping fowl, that goeth upon four (feet), which hath legs above on its feet; [Oth. which hath no legs. (Some Hebrew Texts having and others ] to leap therewithal upon the earth."}],"22":[{"catchword":null,"tekst":"Of those ye shall eat these, the Grasshopper, after its kind, [That this creature was fed on in the Oriental Countries, appeareth by Matth. 3. 4. Mark 1. 6.] and the Solham according to its kind, and the Hargol after its kind, and the Hagab after its kind. These three names, Solham, Hargol, and Hagab, are left here as they are expressed in the Origional, in regard that they are not so properly and certainly known, what they were. In the general, they signify certain kinds of small creatures, called insects, described in the former verse.]"}],"23":[{"catchword":null,"tekst":"And all creeping fowl having four feet, shall be an abomination to you."}],"24":[{"catchword":null,"tekst":"And in these [viz. following things, rehearsed from hence to verse 43.] shall ye he made unclean; [viz. by touching of the same] who so shall have touched a dead carcass, he shall be unclean, until the evening. [i.e. he shall, by reason of his ceremonial uncleaness, not be allowed to converse with other men, much less appear in Court of the LORD, or eat of that which is offered till after the evening.]"}],"25":[{"catchword":null,"tekst":"Who so shall have carried (ought) of their dead carcass; he shall wash his clothes, and be unclean until the evening."}],"26":[{"catchword":null,"tekst":"Every Beast [Three sorts of Beasts are mentioned here, by whose touching a man was made unclean: 1. Unclean great ones, here and in the two next verses. 2. Unclean small ones, verse 29, 30, 31, & c. 3. Unclean ones dying of themselves, or torn in pieces, v. 39.] that divideth the hoof, yet cleaveth not the cleft in two, [i.e. that divideth indeed the hoof, but not in two only, as the sheep, and oxen, but in more parts, as the lions, wolves, bears, dogs, cats. See above on verse 3, and 4.] nor cheweth the end, shall be unclean to you: who so shall have touched the same, he shall be unclean."}],"27":[{"catchword":null,"tekst":"And whatsoever goeth upon its paws among all beasts, going upon four (feet), they shall be unclean to you: whosoever shall have touched their dead carcass, he shall be unclean until the evening."}],"28":[{"catchword":null,"tekst":"Also, who so shall have carried their dead carcass, he shall wash his clothes, and be unclean until the evening: they shall be unclean to you."}],"29":[{"catchword":null,"tekst":"Moreover these among the creeping creatures, that creep upon the earth, shall be unclean to you: the Weasel, and the Mouse, and the Tortoise, after their kinds. [The Hebrew word for Tortoise, signifieth properly that which is swollen or blown up and vaulted as it were. In translating of the names of these creatures in general set down in this and the next verse, we have followed that which seemed most probable and likely, and is most received among the Learned.]"}],"30":[{"catchword":null,"tekst":"And the Hedgehog, and the Crocodile, and the Lizard, and the snail, and the Mole."}],"31":[{"catchword":null,"tekst":"They shall be unclean to you among all creeping creatures: [Understand the foresaid Locusts, which made a man unclean, not only being eaten, but also by being only touched, as appeareth further by the sequel] who so shall have touched them when they are dead, he shall be unclean until the evening."}],"32":[{"catchword":null,"tekst":"Besides all that whereon (ought) of the same shall fall, being dead, shall be unclean, (whether it be) of any wooden Vessel, or garment, or skin, or sack, or any Vessel wherewith (any) work is done: it shall be put into the water, and be unclean until the evening, after that, it shall be clean."}],"33":[{"catchword":null,"tekst":"And every earthen Vessel, into which (ought) of the same shall have fallen, [Heb. which shall fall out of the same into its middest, i.e. into the midst whereof, or into which there shall have fallen any thing of the said unclean beasts, whether they were alive or dead; for they were not to be touched in any wise] all that is therein, shall be unclean, and thou shalt break the same."}],"34":[{"catchword":null,"tekst":"Of all food a man eateth, whereupon the water shall be come, [viz. wherewith any thing shall have been washed, that was made unclean by touching the things or creatures aforesaid.] (the same) shall be unclean: and every drink, a man drinketh, shall be clean in every Vessel. [viz. which through the touching of those things was become unclean.]"}],"35":[{"catchword":null,"tekst":"And whereupon ought of their dead carcass shall fall, (that) shall be unclean, the oven, and the earthen pan shall be broken, they are unclean: therefore they shall be unclean unto you."}],"36":[{"catchword":null,"tekst":"Yet a fountain, or well of gathering of waters [viz. into which any of these unclean beasts shall have fallen, or be cast and perished] shall be clean [i.e. one shall not need to draw out all their water, and throw it away as unclean; but every one shall have liberty to use it, according to his occasions] but who so shall have touched their dead carcass, [Whatsoever person, or thing, the carcass toucheth, being drawn forth out of the well or water-fountain, into which it was fallen or thrown, & c] shall be unclean."}],"37":[{"catchword":null,"tekst":"And if (ought) of their dead carcass shall be fallen upon any sowing seed, [i.e. such as is usually sowed for the use of man or beasts: as appeareth by the words following] that is sown, that shall be clean."}],"38":[{"catchword":null,"tekst":"But when water shall be put upon the seed, and (ought) of their dead carcass shall be fallen thereupon, that shall be unclean to you."}],"39":[{"catchword":null,"tekst":"And if (any) of the beasts, which are food for you, shall be dead, who so shall have touched the carcass of the same, shall be unclean until the evening."}],"40":[{"catchword":null,"tekst":"Likewise, he that shall have eaten of the carcass thereof, [Understand this properly of eating of it ignorantly, when a man knew not that the meat made ready and put before him, was of a dead carcass, for otherwise they were prohibited to eat of any such, Deu. 14. 21.] shall wash his clothes, and be unclean until the evening: and who so shall have carried the carcass of it, shall wash his cloth, and be unclean until the evening."}],"41":[{"catchword":null,"tekst":"Moreover every creeping creature, the creepeth upon the earth, that shall be an abomination, it shall not be eaten."}],"42":[{"catchword":null,"tekst":"Whatsoever goeth upon its belly, and whatsoever upon its four (feet); or, whatsoever hath many feet, [Heb. unto all that multipl  the earth."}],"47":[{"catchword":null,"tekst":"For to put difference betwixt the unclean and betwixt the clean: and betwixt the creature to be eaten, and betwixt the creature not to be eaten."}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
