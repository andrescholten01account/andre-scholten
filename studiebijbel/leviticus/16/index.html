ohannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En de HEERE sprak tot Mozes, nadat de twee zonen van Aäron gestorven waren, toen zij voor het aangezicht van de HEERE genaderd waren en gestorven waren;","2":"De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel.","3":"Hiermee zal Aäron het heilige binnengaan: met een jonge stier als zondoffer, en een ram als brandoffer.","4":"Hij zal de heilige linnen rok aandoen, en een linnen onderbroek zal om zijn lichaam zijn, en met een linnen gordel zal hij zich omgorden, en met een linnen hoofddoek zich bedekken; dit zijn heilige klederen; daarom zal hij zijn lichaam met water baden, als hij ze zal aandoen.","5":"En van de vergadering van de kinderen van Israël zal hij twee geitenbokken nemen als zondoffer, en één ram als brandoffer.","6":"Daarna zal Aäron de stier van het zondoffer, die voor hemzelf zal zijn, offeren, en voor zichzelf en voor zijn huis verzoening doen.","7":"Hij zal ook beide bokken nemen, en hij zal ze stellen voor het aangezicht van de HEERE, bij de deur van de tent der samenkomst.","8":"En Aäron zal de loten over die twee bokken werpen: één lot voor de HEERE, en één lot voor de weggaande bok.","9":"Dan zal Aäron de bok, op wie het lot voor de HEERE gevallen is, brengen, en hem als zondoffer bereiden.","10":"Maar de bok op wie het lot gevallen is om een weggaande bok te zijn, zal levend voor het aangezicht van de HEERE gesteld worden, om door hem verzoening te doen; opdat men hem als een weggaande bok naar de woestijn uitlaat.","11":"Aäron dan zal de stier van het zondoffer, die voor hemzelf zal zijn, brengen, en voor zichzelf en voor zijn huis verzoening doen, en zal de stier van het zondoffer, die voor hemzelf zal zijn, slachten.","12":"Hij zal ook een wierookvat vol vurige kolen nemen van het altaar, van voor het aangezicht van de HEERE, en zijn handen vol fijngestoten reukwerk van welriekende specerijen; en hij zal het binnen het voorhangsel dragen.","13":"En hij zal dat reukwerk op het vuur leggen, voor het aangezicht van de HEERE, opdat de wolk van het reukwerk het verzoendeksel dat op de getuigenis is bedekt, en dat hij niet sterft.","14":"En hij zal van het bloed van de stier nemen, en zal met zijn vinger op het verzoendeksel aan de oostkant sprenkelen; en voor het verzoendeksel zal hij zevenmaal met zijn vinger van dat bloed sprenkelen.","15":"Daarna zal hij de bok van het zondoffer, die voor het volk zal zijn, slachten, en zal zijn bloed tot binnen het voorhangsel dragen, en zal met zijn bloed doen zoals hij met het bloed van de stier gedaan heeft, en zal het sprenkelen op het verzoendeksel, en voor het verzoendeksel.","16":"Zo zal hij voor het heilige, vanwege de onreinheden van de kinderen van Israël, en vanwege hun overtredingen, naar al hun zonden, verzoening doen; en zo zal hij ook doen voor de tent der samenkomst, die met hen woont te midden van hun onreinheden.","17":"En geen mens zal in de tent der samenkomst zijn, als hij zal ingaan om in het heilige verzoening te doen, totdat hij weer naar buiten komt; zo zal hij verzoening doen voor zichzelf, en voor zijn huis, en voor de hele gemeente van Israël.","18":"Daarna zal hij naar het altaar dat voor het aangezicht van de HEERE is, gaan, en verzoening ervoor doen; en hij zal van het bloed van de stier, en van het bloed van de bok nemen, en het rondom op de hoorns van het altaar doen.","19":"En hij zal daarop van dat bloed met zijn vinger zevenmaal sprenkelen, en hij zal het reinigen en heiligen van de onreinheden van de kinderen van Israël.","20":"Als hij nu klaar zal zijn met het verzoenen van het heilige, en de tent der samenkomst, en het altaar, dan zal hij de levende bok brengen.","21":"En Aäron zal beide zijn handen op het hoofd van de levende bok leggen, en zal daarop al de ongerechtigheden van de kinderen van Israël, en al hun overtredingen, naar al hun zonden, belijden; en hij zal ze op het hoofd van de bok leggen, en zal hem door de hand van iemand die daarvoor gereed staat, naar de woestijn laten wegbrengen.","22":"Zo zal die bok op zich al hun ongerechtigheden naar een afgezonderd land wegdragen; en hij zal die bok in de woestijn laten wegbrengen.","23":"Daarna zal Aäron de tent der samenkomst binnengaan, en de linnen klederen uittrekken die hij aangedaan had toen hij het heilige binnenging, en hij zal ze daar laten.","24":"En hij zal zijn lichaam in de heilige plaats met water baden, en zijn klederen aandoen; dan zal hij naar buiten gaan, en zijn brandoffer, en het brandoffer van het volk bereiden, en voor zichzelf en voor het volk verzoening doen.","25":"Ook zal hij het vet van het zondoffer op het altaar in rook laten opgaan.","26":"En hij die de bok, die een weggaande bok was, weggebracht heeft, zal zijn klederen wassen, en zijn lichaam met water baden; en daarna zal hij in het kamp komen.","27":"Maar de stier van het zondoffer, en de bok van het zondoffer, waarvan het bloed binnengebracht is om verzoening te doen in het heilige, zal men tot buiten het kamp brengen; en hun huiden, hun vlees en hun mest zullen zij met vuur verbranden.","28":"Wie ze verbrandt, zal zijn klederen wassen, en zijn lichaam met water baden; en daarna zal hij in het kamp komen.","29":"En dit zal voor u een eeuwige inzetting zijn: u zult in de zevende maand, op de tiende van de maand, uzelf verootmoedigen, en geen enkel werk doen, of het nu een geboren Israëliet is of een vreemdeling die te midden van u verblijft.","30":"Want op die dag zal hij voor u verzoening doen, om u te reinigen; van al uw zonden zult u voor het aangezicht van de HEERE gereinigd worden.","31":"Dat zal voor u een sabbat van rust zijn, opdat u uzelf verootmoedigt; het is een eeuwige inzetting.","32":"En de priester die men zal zalven, en van wie men de hand zal vullen om in de plaats van zijn vader het priesterambt te bedienen, zal de verzoening doen, als hij de linnen klederen, de heilige klederen, aangetrokken zal hebben.","33":"Zo zal hij het heilige heiligdom verzoenen, en de tent der samenkomst, en het altaar zal hij verzoenen; evenzo zal hij voor de priesters, en voor heel het volk van de gemeente verzoening doen.","34":"En dit zal voor u een eeuwige inzetting zijn, om voor de kinderen van Israël, voor al hun zonden, eenmaal per jaar verzoening te doen. En men deed zoals de HEERE Mozes geboden had."},"SV":{"1":"En de HEERE sprak tot Mozes, nadat de twee zonen van Aäron gestorven waren, als zij genaderd waren voor het aangezicht des HEEREN, en gestorven waren;","2":"De HEERE dan zeide tot Mozes: Spreek tot uw broeder Aäron, dat hij niet te allen tijde ga in het heilige, binnen den voorhang, voor het verzoendeksel, dat op de ark is, opdat hij niet sterve; want Ik verschijn in een wolk op het verzoendeksel.","3":"Hiermede zal Aäron in het heilige gaan: met een var, een jong rund ten zondoffer, en een ram ten brandoffer.","4":"Hij zal den heiligen linnen rok aandoen, en een linnen onderbroek zal aan zijn vlees zijn, en met een linnen gordel zal hij zich gorden, en met een linnen hoed bedekken; dit zijn heilige klederen; daarom zal hij zijn vlees met water baden, als hij ze zal aandoen.","5":"En aan de vergadering der kinderen Israëls zal hij nemen twee geitenbokken ten zondoffer, en een ram ten brandoffer.","6":"Daarna zal Aäron den var des zondoffers, die voor hem zal zijn, offeren, en zal voor zich en voor zijn huis verzoening doen.","7":"Hij zal ook beide bokken nemen, en hij zal die stellen voor het aangezicht des HEEREN, aan de deur van de tent der samenkomst.","8":"En Aäron zal de loten over die twee bokken werpen: een lot voor den HEERE, en een lot voor den weggaanden bok.","9":"Dan zal Aäron den bok, op denwelken het lot voor den HEERE zal gekomen zijn, toebrengen, en zal hem ten zondoffer maken.","10":"Maar de bok, op denwelken het lot zal gekomen zijn, om een weggaande bok te zijn, zal levend voor het aangezicht des HEEREN gesteld worden, om door hem verzoening te doen; opdat men hem als een weggaanden bok naar de woestijn uitlate.","11":"Aäron dan zal den var des zondoffers, die voor hemzelven zal zijn, toebrengen, en voor zichzelven en voor zijn huis verzoening doen, en zal den var des zondoffers, die voor hemzelven zal zijn, slachten.","12":"Hij zal ook een wierookvat vol vurige kolen nemen van het altaar, van voor het aangezicht des HEEREN, en zijn handen vol reukwerk van welriekende specerijen, klein gestoten; en hij zal het binnen den voorhang dragen.","13":"En hij zal dat reukwerk op het vuur leggen, voor het aangezicht des HEEREN, opdat de nevel des reukwerks het verzoendeksel, hetwelk is op de getuigenis, bedekke, en dat hij niet sterve.","14":"En hij zal van het bloed van den var nemen, en zal met zijn vinger op het verzoendeksel oostwaarts sprengen; en voor het verzoendeksel zal hij zevenmaal met zijn vinger van dat bloed sprengen.","15":"Daarna zal hij den bok des zondoffers, die voor het volk zal zijn, slachten, en zal zijn bloed tot binnen in den voorhang dragen, en zal met zijn bloed doen, gelijk als hij met het bloed van den var gedaan heeft, en zal dat sprengen op het verzoendeksel, en voor het verzoendeksel.","16":"Zo zal hij voor het heilige, vanwege de onreinigheden der kinderen Israëls, en vanwege hun overtredingen, naar al hun zonden, verzoening doen; en alzo zal hij doen aan de tent der samenkomst, welke met hen woont in het midden hunner onreinigheden.","17":"En geen mens zal in de tent der samenkomst zijn, als hij zal ingaan, om in het heilige verzoening te doen, totdat hij zal uitkomen; alzo zal hij verzoening doen, voor zichzelven, en voor zijn huis, en voor de gehele gemeente van Israël.","18":"Daarna zal hij tot het altaar, dat voor het aangezicht des HEEREN is, uitkomen, en verzoening voor hetzelve doen; en hij zal van het bloed van den var, en van het bloed van den bok nemen, en doen het rondom op de hoornen des altaars.","19":"En hij zal daarop van dat bloed met zijn vinger zevenmaal sprengen, en hij zal dat reinigen en heiligen van de onreinigheden der kinderen Israëls.","20":"Als hij nu zal geëindigd hebben van het heilige, en de tent der samenkomst, en het altaar te verzoenen, zo zal hij dien levenden bok toebrengen.","21":"En Aäron zal beide zijn handen op het hoofd van den levenden bok leggen, en zal daarop al de ongerechtigheden der kinderen Israëls, en al hun overtredingen, naar al hun zonden, belijden; en hij zal die op het hoofd des boks leggen, en zal *hem* door de hand eens mans, die voorhanden is, naar de woestijn uitlaten.","22":"Alzo zal die bok op zich al hun ongerechtigheden in een afgezonderd land wegdragen; en hij zal dien bok in de woestijn uitlaten.","23":"Daarna zal Aäron komen in de tent der samenkomst, en zal de linnen klederen uitdoen, die hij aangedaan had, als hij in het heilige ging, en hij zal ze daar laten.","24":"En hij zal zijn vlees in de heilige plaats met water baden, en zijn klederen aandoen; dan zal hij uitgaan, en zijn brandoffer, en het brandoffer des volks bereiden, en voor zich en voor het volk verzoening doen.","25":"Ook zal hij het vet des zondoffers op het altaar aansteken.","26":"En die den bok, welke een weggaande bok was, zal uitgelaten hebben, zal zijn klederen wassen, en zijn vlees met water baden; en daarna zal hij in het leger komen.","27":"Maar den var des zondoffers, en den bok des zondoffers, welker bloed ingebracht is, om verzoening te doen in het heilige, zal men tot buiten het leger uitvoeren; doch hun vellen, hun vlees en hun mest zullen zij met vuur verbranden.","28":"Die nu dezelve verbrandt, zal zijn klederen wassen, en zijn vlees met water baden; en daarna zal hij in het leger komen.","29":"En *dit* zal voor u tot een eeuwige inzetting zijn: gij zult in de zevende maand, op den tienden der maand, uw zielen verootmoedigen, en geen werk doen, inboorling noch vreemdeling, die in het midden van u als vreemdeling verkeert.","30":"Want op dien dag zal hij voor u verzoening doen, om u te reinigen; van al uw zonden zult gij voor het aangezicht des HEEREN gereinigd worden.","31":"Dat zal u een sabbat der rust zijn, opdat gij uw zielen verootmoedigt; het is een eeuwige inzetting.","32":"En de priester, dien men gezalfd, en wiens hand men gevuld zal hebben, om voor zijn vader het priesterambt te bedienen, zal de verzoening doen, als hij de linnen klederen, de heilige klederen, zal aangetrokken hebben.","33":"Zo zal hij het heilige heiligdom verzoenen, en de tent der samenkomst, en het altaar zal hij verzoenen; desgelijks voor de priesteren, en voor al het volk der gemeente zal hij verzoening doen.","34":"En dit zal u tot een eeuwige inzetting zijn, om voor de kinderen Israëls van al hun zonden, eenmaal des jaars, verzoening te doen. En men deed, gelijk als de HEERE Mozes geboden had."},"KJV":{"1":"And the LORD spake unto Moses after the death of the two sons of Aaron, when they offered before the LORD, and died;","2":"And the LORD said unto Moses, Speak unto Aaron thy brother, that he come not at all times into the holy *place* within the vail before the mercy seat, which *is* upon the ark; that he die not: for I will appear in the cloud upon the mercy","3":"Thus shall Aaron come into the holy *place*: with a young bullock for a sin offering, and a ram for a burnt offering.","4":"He shall put on the holy linen coat, and he shall have the linen breeches upon his flesh, and shall be girded with a linen girdle, and with the linen mitre shall he be attired: these *are* holy garments; therefore shall he wash his flesh in water, and *so* put them on.","5":"And he shall take of the congregation of the children of Israel two kids of the goats for a sin offering, and one ram for a burnt offering.","6":"And Aaron shall offer his bullock of the sin offering, which *is* for himself, and make an atonement for himself, and for his house.","7":"And he shall take the two goats, and present them before the LORD *at* the door of the tabernacle of the congregation.","8":"And Aaron shall cast lots upon the two goats; one lot for the LORD, and the other lot for the scapegoat.","9":"And Aaron shall bring the goat upon which the LORD'S lot fell, and offer him *for* a sin offering.","10":"But the goat, on which the lot fell to be the scapegoat, shall be presented alive before the LORD, to make an atonement with him, *and* to let him go for a scapegoat into the wilderness.","11":"And Aaron shall bring the bullock of the sin offering, which *is* for himself, and shall make an atonement for himself, and for his house, and shall kill the bullock of the sin offering","12":"And he shall take a censer full of burning coals of fire from off the altar before the LORD, and his hands full of sweet incense beaten small, and bring *it* within the vail:","13":"And he shall put the incense upon the fire before the LORD, that the cloud of the incense may cover the mercy seat that *is* upon the testimony, that he die","14":"And he shall take of the blood of the bullock, and sprinkle *it* with his finger upon the mercy seat eastward; and before the mercy seat shall he sprinkle of the blood with his finger seven times.","15":"Then shall he kill the goat of the sin offering, that *is* for the people, and bring his blood within the vail, and do with that blood as he did with the blood of the bullock, and sprinkle it upon the mercy seat, and before the mercy seat:","16":"And he shall make an atonement for the holy *place*, because of the uncleanness of the children of Israel, and because of their transgressions in all their sins: and so shall he do for the tabernacle of the congregation, that remaineth among them in the midst of their uncleanness.","17":"And there shall be no man in the tabernacle of the congregation when he goeth in to make an atonement in the holy *place*, until he come out, and have made an atonement for himself, and for his household, and for all the congregation of Israel.","18":"And he shall go out unto the altar that *is* before the LORD, and make an atonement for it; and shall take of the blood of the bullock, and of the blood of the goat, and put *it* upon the horns of the altar round about.","19":"And he shall sprinkle of the blood upon it with his finger seven times, and cleanse it, and hallow it from the uncleanness of the children of Israel.","20":"And when he hath made an end of reconciling the holy *place*, and the tabernacle of the congregation, and the altar, he shall bring the live goat:","21":"And Aaron shall lay both his hands upon the head of the live goat, and confess over him all the iniquities of the children of Israel, and all their transgressions in all their sins, putting them upon the head of the goat, and shall send *him* away by the hand of a fit man into the wilderness:","22":"And the goat shall bear upon him all their iniquities unto a land not inhabited: and he shall let go the goat in the wilderness.","23":"And Aaron shall come into the tabernacle of the congregation, and shall put off the linen garments, which he put on when he went into the holy *place*, and shall leave","24":"And he shall wash his flesh with water in the holy place, and put on his garments, and come forth, and offer his burnt offering, and the burnt offering of the people, and make an atonement for himself, and for the people.","25":"And the fat of the sin offering shall he burn upon the altar.","26":"And he that let go the goat for the scapegoat shall wash his clothes, and bathe his flesh in water, and afterward come into the camp.","27":"And the bullock *for* the sin offering, and the goat *for* the sin offering, whose blood was brought in to make atonement in the holy *place*, shall *one* carry forth without the camp; and they shall burn in the fire their skins, and their flesh, and their dung.","28":"And he that burneth them shall wash his clothes, and bathe his flesh in water, and afterward he shall come into the camp.","29":"And *this* shall be a statute for ever unto you: *that* in the seventh month, on the tenth *day* of the month, ye shall afflict your souls, and do no work at all, *whether it be* one of your own country, or a stranger that sojourneth among","30":"For on that day shall *the priest* make an atonement for you, to cleanse you, *that* ye may be clean from all your sins before the LORD.","31":"It *shall be* a sabbath of rest unto you, and ye shall afflict your souls, by a statute for ever.","32":"And the priest, whom he shall anoint, and whom he shall consecrate to minister in the priest's office in his father's stead, shall make the atonement, and shall put on the linen clothes, *even* the holy garments:","33":"And he shall make an atonement for the holy sanctuary, and he shall make an atonement for the tabernacle of the congregation, and for the altar, and he shall make an atonement for the priests, and for all the people of the congregation.","34":"And this shall be an everlasting statute unto you, to make an atonement for the children of Israel for all their sins once a year. And he did as the LORD commanded Moses."}},"tsk":{"2":[{"kopje":"binnengaat","refs":["Lev 23:27","Ex 26:33","Ex 26:34","Ex 30:10","Ex 40:20","Ex 40:21","1 Kon 8:6","Hebr 9:3","Hebr 9:7","Hebr 9:8","Hebr 10:19","Hebr 10:20"]},{"kopje":"opdat hij niet sterft","refs":["Lev 16:13","Lev 8:35","Num 4:19","Num 17:10","Matt 27:51","Hebr 4:14-16","Hebr 10:19"]},{"kopje":"in een wolk","refs":["Ex 40:34","Ex 40:35","1 Kon 8:10-12","2 Kron 5:14"]},{"kopje":"het verzoendeksel","refs":["Ex 25:17-22"]}],"3":[{"kopje":"Aäron","refs":["Hebr 9:7","Hebr 9:12","Hebr 9:24","Hebr 9:25"]},{"kopje":"een jonge","refs":["Lev 4:3","Lev 8:14","Num 29:7-11"]},{"kopje":"een ram als brandoffer","refs":["Lev 1:3","Lev 1:10","Lev 8:18","Lev 9:3"]}],"4":[{"kopje":"heilige linnen rok","refs":["Ex 28:4","Lev 6:10","Ex 28:2","Ex 28:39-43","Ex 39:27-29","Jes 53:2","Ezech 44:17","Ezech 44:18","Luk 1:35","Fil 2:7","Hebr 2:14","Hebr 7:26"]},{"kopje":"daarom","refs":["Lev 8:6","Lev 8:7","Ex 29:4","Ex 30:20","Ex 40:12","Ex 40:31","Ex 40:32","Openb 1:5","Openb 1:6"]}],"6":[{"kopje":"die","refs":["Lev 8:14-17","Hebr 9:7"]},{"kopje":"voor zichzelf","refs":["Lev 9:7","Ezra 10:18","Ezra 10:19","Job 1:5","Ezech 43:19","Ezech 43:27","Hebr 5:2"]}],"8":[{"kopje":"loten werpen","refs":["Num 26:55","Num 33:54","Joz 18:10","Joz 18:11","1 Sam 14:41","1 Sam 14:42","Spr 16:33","Ezech 48:29","Jona 1:7","Hand 1:23-26"]}],"9":[{"kopje":"op wie","refs":["Hand 2:23","Hand 4:27","Hand 4:28"]}],"10":[{"kopje":"weggaande bok","refs":["Lev 16:21","Lev 16:22"]},{"kopje":"om te","refs":["Jes 53:5","Jes 53:6","Jes 53 H175\">Aaron</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place: with a <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and a <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> for a burnt offering.","4":"He shall put <span class=\"wl wl-kjv\" data-code=\"H3847\">on</span> the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H906\">linen</span> <span class=\"wl wl-kjv\" data-code=\"H3801\">coat,</span> and he shall have the <span class=\"wl wl-kjv\" data-code=\"H906\">linen</span> <span class=\"wl wl-kjv\" data-code=\"H4370\">breeches</span> upon his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and shall be <span class=\"wl wl-kjv\" data-code=\"H2296\">girded</span> with a <span class=\"wl wl-kjv\" data-code=\"H906\">linen</span> <span class=\"wl wl-kjv\" data-code=\"H73\">girdle,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H906\">linen</span> <span class=\"wl wl-kjv\" data-code=\"H4701\">mitre</span> shall he be <span class=\"wl wl-kjv\" data-code=\"H6801\">attired:</span> <span class=\"wl wl-kjv\" data-code=\"H1992\">these</span> are <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H899\">garments;</span> therefore shall he <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and so put them on.","5":"And he shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8163\">kids</span> of the <span class=\"wl wl-kjv\" data-code=\"H5795\">goats</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> for a burnt offering.","6":"And <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> shall <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> his <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> of the sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> which is for <span class=\"wl wl-kjv\" data-code=\"H1157\">himself,</span> and make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for himself, and for his house.","7":"And he shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8163\">goats,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">present</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation.","8":"And <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">cast</span> <span class=\"wl wl-kjv\" data-code=\"H1486\">lots</span> upon the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8163\">goats;</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1486\">lot</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> <span class=\"wl wl-kjv\" data-code=\"H1486\">lot</span> 4289\">censer</span> <span class=\"wl wl-kjv\" data-code=\"H4393\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">burning</span> <span class=\"wl wl-kjv\" data-code=\"H1513\">coals</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> from off the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2651\">hands</span> <span class=\"wl wl-kjv\" data-code=\"H4393\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H5561\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H7004\">incense</span> beaten <span class=\"wl wl-kjv\" data-code=\"H1851\">small,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> it <span class=\"wl wl-kjv\" data-code=\"H1004\">within</span> the vail:","13":"And he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H7004\">incense</span> upon the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> of the <span class=\"wl wl-kjv\" data-code=\"H7004\">incense</span> may <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> the mercy <span class=\"wl wl-kjv\" data-code=\"H3727\">seat</span> that is upon the <span class=\"wl wl-kjv\" data-code=\"H5715\">testimony,</span> that he die","14":"And he shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock,</span> and <span class=\"wl wl-kjv\" data-code=\"H5137\">sprinkle</span> it with his <span class=\"wl wl-kjv\" data-code=\"H676\">finger</span> upon the mercy <span class=\"wl wl-kjv\" data-code=\" /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
