,"href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Verder sprak de HEERE tot Mozes en zei:","2":"Als een mens gezondigd heeft en tegen de HEERE door overtreding overtreden zal hebben, doordat hij tegen zijn naaste gelogen heeft over iets dat hem in bewaring gegeven was, of ter hand gesteld was, of over roof, of dat hij met geweld zijn naaste iets onthoudt;","3":"Of dat hij het verlorene gevonden heeft, en daarover gelogen heeft, en met valsheid gezworen zal hebben; over iets van alles dat de mens doet, waarin hij zo zondigt.","4":"Dan zal het gebeuren, omdat hij gezondigd heeft en schuldig geworden is, dat hij zal teruggeven de roof die hij geroofd heeft, of het onthoudene dat hij met geweld onthoudt, of het bewaarde dat bij hem te bewaren gegeven was, of het verlorene dat hij gevonden heeft;","5":"Of van al waarover hij valselijk gezworen heeft, dat hij het in zijn hoofdsom teruggeeft, en er nog het vijfde deel bovenop zal toedoen; aan wie het toebehoort, aan hem zal hij het geven, op de dag van zijn schuld.","6":"En hij zal de HEERE zijn schuldoffer brengen naar de priester, een volkomen ram uit de kudde, met uw schatting, tot een schuldoffer.","7":"Dan zal de priester voor hem verzoening doen voor het aangezicht van de HEERE, en het zal hem vergeven worden; over iets van alles wat hij doet, waaraan hij schuldig is.","8":"Verder sprak de HEERE tot Mozes en zei:","9":"Gebied Aäron en zijn zonen en zeg: Dit is de wet van het brandoffer: het is het brandoffer dat door de branding op het altaar de hele nacht tot aan de morgen opgaat; en het vuur van het altaar zal daarbij brandend gehouden worden.","10":"En de priester zal zijn linnen kleed aantrekken, en de linnen onderbroek over zijn vlees aantrekken, en zal de as opnemen als het vuur het brandoffer op het altaar verteerd zal hebben, en zal die bij het altaar leggen.","11":"Daarna zal hij zijn kleren uittrekken, en andere kleren aandoen, en zal de as tot buiten het leger naar een reine plaats brengen.","12":"Het vuur op het altaar nu zal daarop brandend gehouden worden, het zal niet uitgeblust worden; maar de priester zal daar elke morgen hout aansteken, en zal daarop het brandoffer schikken, en het vet van de dankoffers daarop aansteken.","13":"Het vuur zal voortdurend op het altaar brandend gehouden worden; het zal niet uitgeblust worden.","14":"Dit is nu de wet van het spijsoffer: een van de zonen van Aäron zal dat voor het aangezicht van de HEERE offeren, voor het altaar.","15":"En hij zal daarvan zijn hand vol opnemen, uit de meelbloem van het spijsoffer, en van de olie daarvan, en al de wierook die op het spijsoffer is; dan zal hij het aansteken op het altaar; het is een liefelijke reuk, tot gedachtenis daarvan, voor de HEERE.","16":"En wat daarvan overblijft, zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden, in de heilige plaats; in de voorhof van de tent der samenkomst zullen zij dat eten.","17":"Het zal niet met desem gebakken worden; het is hun deel, dat Ik hun gegeven heb van Mijn vuuroffers; het is allerheiligst, evenals het zondoffer en evenals het schuldoffer.","18":"Al wie mannelijk is onder de zonen van Aäron zal het eten; het is een eeuwige inzetting voor uw geslachten, van de vuuroffers van de HEERE; al wat die zal aanraken, zal heilig zijn.","19":"Verder sprak de HEERE tot Mozes en zei:","20":"Dit is de offerande van Aäron en van zijn zonen, die zij de HEERE offeren zullen op de dag dat hij gezalfd wordt: het tiende deel van een efa[1] meelbloem, een voortdurend spijsoffer; de helft daarvan op de morgen, en de helft daarvan op de avond.","21":"Het zal in een pan met olie gemaakt worden; geroosterd zult u het brengen; en de gebakken stukken van het spijsoffer zult u offeren, tot een liefelijke reuk voor de HEERE.","22":"Ook zal de priester die uit zijn zonen in zijn plaats gezalfd wordt, hetzelfde doen; het is een eeuwige inzetting; het zal voor de HEERE geheel aangestoken worden.","23":"Zo zal elk spijsoffer van de priester geheel verbrand worden; het zal niet gegeten worden.","24":"Verder sprak de HEERE tot Mozes en zei:","25":"Spreek tot Aäron en tot zijn zonen en zeg: Dit is de wet van het zondoffer: op de plaats waar het brandoffer geslacht wordt, zal het zondoffer voor het aangezicht van de HEERE geslacht worden; het is allerheiligst.","26":"De priester die het voor de zonde offert, zal het eten; in de heilige plaats zal het gegeten worden, in de voorhof van de tent der samenkomst.","27":"Al wat het vlees daarvan aanraakt, zal heilig zijn; en als iemand van het bloed daarvan op een kleed gesprengd heeft, dan zult u datgene waarop hij gesprengd heeft, wassen in de heilige plaats.","28":"En het aarden vat waarin het gekookt is, zal gebroken worden; maar als het in een koperen vat gekookt is, zal het geschuurd en in water gespoeld worden.","29":"Al wie mannelijk is onder de priesters, zal daarvan eten; het is allerheiligst.","30":"Maar geen zondoffer, waarvan bloed in de tent der samenkomst gebracht wordt om in het heiligdom verzoening te doen, zal gegeten worden; het zal in het vuur verbrand worden."},"SV":{"1":"Verder sprak de HEERE tot Mozes, zeggende:","2":"Als een mens gezondigd, en tegen den HEERE door overtreding overtreden zal hebben, dat hij aan zijn naaste zal gelogen hebben van hetgeen hem in bewaring gegeven, of ter hand gesteld was, of van roof, of *dat* hij met geweld zijn naaste onthoudt;","3":"Of dat hij het verlorene gevonden, en daarover gelogen, en met valsheid gezworen zal hebben; over iets van alles, dat de mens doet, daarin zondigende.","4":"Het zal dan geschieden, dewijl hij gezondigd heeft, en schuldig geworden is, dat hij wederuitkeren zal den roof, dien hij geroofd, of het onthoudene, dat hij met geweld onthoudt, of het bewaarde, dat bij hem te bewaren gegeven was, of het verlorene, dat hij gevonden heeft;","5":"Of van al, waarover hij valselijk gezworen heeft, dat hij hetzelve in zijn hoofdsom wedergeve, en nog het vijfde deel daarenboven toedoen zal; wiens dat is, dien zal hij dat geven op den dag zijner schuld.","6":"En hij zal den HEERE zijn schuldoffer brengen tot den priester, een volkomen ram uit de kudde, met uw schatting, ten schuldoffer.","7":"Dan zal de priester voor hem verzoening doen voor het aangezicht des HEEREN, en het zal hem vergeven worden; over iets van al, wat hij doet, waar hij schuld aan heeft.","8":"Verder sprak de HEERE tot Mozes, zeggende:","9":"Gebied Aäron en zijn zonen, zeggende: Dit is de wet des brandoffers; het is hetgeen, wat door de branding op het altaar den gansen nacht tot aan den morgen opvaart; alwaar het vuur des altaars zal brandende gehouden worden.","10":"En de priester zal zijn linnen kleed aantrekken, en de linnen onderbroek over zijn vlees aantrekken, en zal de as opnemen, als het vuur het brandoffer op het altaar zal verteerd hebben, en zal die bij het altaar leggen.","11":"Daarna zal hij zijn klederen uittrekken, en zal andere klederen aandoen, en zal de as tot buiten het leger uitdragen aan een reine plaats.","12":"Het vuur nu op het altaar zal daarop brandende gehouden worden, het zal niet uitgeblust worden; maar de priester zal daar elken morgen hout aansteken, en zal daarop het brandoffer schikken, en het vet der dankofferen daarop aansteken.","13":"Het vuur zal geduriglijk op het altaar brandende gehouden worden; het zal niet uitgeblust worden.","14":"Dit is nu de wet des spijsoffers; een der zonen van Aäron zal dat voor het aangezicht des HEEREN offeren, voor het altaar.","15":"En hij zal daarvan opnemen zijn hand vol, uit de meelbloem des spijsoffers, en van deszelfs olie, en al den wierook, die op het spijsoffer is; dan zal hij het aansteken op het altaar; het is een liefelijke reuk tot deszelfs gedachtenis voor den HEERE.","16":"En het overblijvende daarvan zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden in de heilige plaats; in den voorhof van de tent der samenkomst zullen zij dat eten.","17":"Het zal niet gedesemd gebakken worden; het is hun deel, dat Ik gegeven heb van Mijn vuurofferen; het is een heiligheid der heiligheden, gelijk het zondoffer en gelijk het schuldoffer.","18":"Al wat mannelijk is onder de zonen van Aäron zal het eten; het zij een eeuwige inzetting voor uw geslachten van de vuurofferen des HEEREN; al wat die zal aanroeren, zal heilig zijn.","19":"Wijders sprak de HEERE tot Mozes, zeggende:","20":"Dit is de offerande van Aäron en van zijn zonen, die zij den HEERE offeren zullen, ten dage als hij zal gezalfd worden: het tiende deel ener efa meelbloem, een spijsoffer gedurig; de helft daarvan op den morgen, en de helft daarvan op den avond.","21":"Het zal in een pan met olie gemaakt worden; geroost zult gij het brengen; en de gebakken stukken des spijsoffers zult gij offeren, tot een liefelijken reuk den HEERE.","22":"Ook zal de priester, die uit zijn zonen in zijn plaats de gezalfde zal worden, hetzelfde doen; het zij een eeuwige inzetting; het zal voor den HEERE geheel aangestoken worden.","23":"Alzo zal alle spijsoffer des priesters ganselijk zijn; het zal niet gegeten worden.","24":"Verder sprak de HEERE tot Mozes, zeggende:","25":"Spreek tot Aäron en tot zijn zonen, zeggende: Dit is de wet des zondoffers: in de plaats, waar het brandoffer geslacht wordt, zal het zondoffer voor het aangezicht des HEEREN geslacht worden; het is een heiligheid der heiligheden.","26":"De priester, die het voor de zonde offert, zal het eten; in de heilige plaats zal het gegeten worden, in den voorhof van de tent der samenkomst.","27":"Al wat deszelfs vlees zal aanroeren, zal heilig zijn; zo wie van zijn bloed op een kleed zal gesprengd hebben, dat, waarop hij gesprengd zal hebben, zult gij in de heilige plaats wassen.","28":"En het aarden vat, waarin het gezoden is, zal gebroken worden; maar zo het in een koperen vat gezoden is, zo zal het geschuurd en in water gespoeld worden.","29":"Al wat mannelijk is onder de priesteren, zal dat eten; het is een heiligheid der heiligheden.","30":"Maar geen zondoffer, van welks bloed in de tent der samenkomst zal gebracht worden, om in het heiligdom te verzoenen, zal gegeten worden; het zal in het vuur verbrand worden."},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"If a soul sin, and commit a trespass against the LORD, and lie unto his neighbour in that which was delivered him to keep, or in fellowship, or in a thing taken away by violence, or hath deceived his neighbour;","3":"Or have found that which was lost, and lieth concerning it, and sweareth falsely; in any of all these that a man doeth, sinning therein:","4":"Then it shall be, because he hath sinned, and is guilty, that he shall restore that which he took violently away, or the thing which he hath deceitfully gotten, or that which was delivered him to keep, or the lost thing which he found,","5":"Or all that about which he hath sworn falsely; he shall even restore it in the principal, and shall add the fifth part more thereto, *and* give it unto him to whom it appertaineth, in the day of his trespass offering.","6":"And he shall bring his trespass offering unto the LORD, a ram without blemish out of the flock, with thy estimation, for a trespass offering, unto the priest:","7":"And the priest shall make an atonement for him before the LORD: and it shall be forgiven him for any thing of all that he hath done in trespassing","8":"And the LORD spake unto Moses, saying,","9":"Command Aaron and his sons, saying, This *is* the law of the burnt offering: It *is* the burnt offering, because of the burning upon the altar all night unto the morning, and the fire of the altar shall be burning","10":"And the priest shall put on his linen garment, and his linen breeches shall he put upon his flesh, and take up the ashes which the fire hath consumed with the burnt offering on the altar, and he shall put them beside the altar.","11":"And he shall put off his garments, and put on other garments, and carry forth the ashes without the camp unto a clean place.","12":"And the fire upon the altar shall be burning in it; it shall not be put out: and the priest shall burn wood on it every morning, and lay the burnt offering in order upon it; and he shall burn thereon the fat of the peace offerings.","13":"The fire shall ever be burning upon the altar; it shall never go out.","14":"And this *is* the law of the meat offering: the sons of Aaron shall offer it before the LORD, before the altar.","15":"And he shall take of it his handful, of the flour of the meat offering, and of the oil thereof, and all the frankincense which *is* upon the meat offering, and shall burn *it* upon the altar *for* a sweet savour, *even* the memorial of it, unto the LORD.","16":"And the remainder thereof shall Aaron and his sons eat: with unleavened bread shall it be eaten in the holy place; in the court of the tabernacle of the congregation they shall eat","17":"It shall not be baken with leaven. I have given it *unto them for* their portion of my offerings made by fire; it *is* most holy, as *is* the sin offering, and as the trespass offering.","18":"All the males among the children of Aaron shall eat of it. *It shall be* a statute for ever in your generations concerning the offerings of the LORD made by fire: every one that toucheth them shall be holy.","19":"And the LORD spake unto Moses, saying,","20":"This *is* the offering of Aaron and of his sons, which they shall offer unto the LORD in the day when he is anointed; the tenth part of an ephah of fine flour for a meat offering perpetual, half of it in the morning, and half thereof at night.","21":"In a pan it shall be made with oil; *and when it is* baken, thou shalt bring it in: *and* the baken pieces of the meat offering shalt thou offer *for* a sweet savour unto the LORD.","22":"And the priest of his sons that is anointed in his stead shall offer it: *it is* a statute for ever unto the LORD; it shall be wholly burnt.","23":"For every meat offering for the priest shall be wholly burnt: it shall not be eaten.","24":"And the LORD spake unto Moses, saying,","25":"Speak unto Aaron and to his sons, saying, This *is* the law of the sin offering: In the place where the burnt offering is killed shall the sin offering be killed before the LORD: it *is* most holy.","26":"The priest that offereth it for sin shall eat it: in the holy place shall it be eaten, in the court of the tabernacle of the congregation.","27":"Whatsoever shall touch the flesh thereof shall be holy: and when there is sprinkled of the blood thereof upon any garment, thou shalt wash that whereon it was sprinkled in the holy place.","28":"But the earthen vessel wherein it is sodden shall be broken: and if it be sodden in a brasen pot, it shall be both hath <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> <span class=\"wl wl-kjv\" data-code=\"H8267\">falsely;</span> he shall even <span class=\"wl wl-kjv\" data-code=\"H7999\">restore</span> it in the <span class=\"wl wl-kjv\" data-code=\"H7218\">principal,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> the fifth <span class=\"wl wl-kjv\" data-code=\"H2549\">part</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> thereto, and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it unto him to whom it appertaineth, in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of his trespass offering.","6":"And he shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> his trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> a <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> without <span class=\"wl wl-kjv\" data-code=\"H8549\">blemish</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock,</span> with thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation,</span> for a trespass <span class=\"wl wl-kjv\" data-code=\"H817\">offering,</span> unto the priest:","7":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for him <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H5545\">forgiven</span> him for any <span class=\"wl wl-kjv\" data-code=\"H259\">thing</span> of all that he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in trespassing","8":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","9":"<span class=\"wl l-kjv\" data-code=\"H6584\">off</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> and put <span class=\"wl wl-kjv\" data-code=\"H3847\">on</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> and carry <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H1880\">ashes</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> unto a <span class=\"wl wl-kjv\" data-code=\"H2889\">clean</span> place.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3344\">burning</span> in it; it shall not be put <span class=\"wl wl-kjv\" data-code=\"H3518\">out:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H1197\">burn</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> on it every <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and lay the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> in <span class=\"wl wl-kjv\" data-code=\"H6186\">order</span> upon it; and he shall <span class=\"wl wl-kjv\" data-code=\"H6999\">burn</span> thereon the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> of the peace offerings.","13":"The <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> shall <span class=\"wl wl-kjv\" data-code=\"H8548\">ever</span> be <span class=\"wl wl-kjv\" data-code=\"H3344\">burning</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar;</span> it shall never go out.","14":"And this is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering:</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of < hen he is <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed;</span> the tenth <span class=\"wl wl-kjv\" data-code=\"H6224\">part</span> of an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> of fine <span class=\"wl wl-kjv\" data-code=\"H5560\">flour</span> for a meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">perpetual,</span> <span class=\"wl wl-kjv\" data-code=\"H4276\">half</span> of it in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H4276\">half</span> thereof at night.","21":"In a <span class=\"wl wl-kjv\" data-code=\"H4227\">pan</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> with <span class=\"wl wl-kjv\" data-code=\"H8081\">oil;</span> and when it is <span class=\"wl wl-kjv\" data-code=\"H7246\">baken,</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> it in: and the <span class=\"wl wl-kjv\" data-code=\"H8601\">baken</span> <span class=\"wl wl-kjv\" data-code=\"H6595\">pieces</span> of the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> for a <span class=\"wl wl-kjv\" data-code=\"H5207\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H7381\">savour</span> unto the LORD.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> of his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> that is <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed</span> in his stead shall <span class=\"wl wl-kjv\" data-code=\"H6213\">offer</span> it: it is a <span class=\"wl wl-kjv\" data-code=\"H2706\">statute</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H3632\">wholly</span> burnt.","23":"For every meat <span class=\"wl wl-kj n> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H6942\">holy:</span> and when there is <span class=\"wl wl-kjv\" data-code=\"H5137\">sprinkled</span> of the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> thereof upon any <span class=\"wl wl-kjv\" data-code=\"H899\">garment,</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> that whereon it was <span class=\"wl wl-kjv\" data-code=\"H5137\">sprinkled</span> in the <span class=\"wl wl-kjv\" data-code=\"H6918\">holy</span> place.","28":"But the <span class=\"wl wl-kjv\" data-code=\"H2789\">earthen</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> wherein it is <span class=\"wl wl-kjv\" data-code=\"H1310\">sodden</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7665\">broken:</span> and if it be <span class=\"wl wl-kjv\" data-code=\"H1310\">sodden</span> in a <span class=\"wl wl-kjv\" data-code=\"H5178\">brasen</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">pot,</span> it shall be both <span class=\"wl wl-kjv\" data-code=\"H4838\">scoured,</span> and <span class=\"wl wl-kjv\" data-code=\"H7857\">rinsed</span> in water.","29":"All the <span class=\"wl wl-kjv\" data-code=\"H2145\">males</span> among the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> thereof: it is <span class=\"wl wl-kjv\" data-code=\"H6944\">most</span> holy.","30":"And no sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> whereof any of the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> into the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation</span> to <span class=\"wl wl-kjv\" data-code=\"H3722\">reconcile</span> withal in the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place, shall be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten:</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> in the fire."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"sprak de HEERE tot Mozes,","tekst":"De eerste zeven verzen dit hoofdstuk, worden van anderen, naar uitwijzen van den Hebreeuwsen tekst, bij Lev. 5, gevoegd en dat niet zonder reden, dewijl hier nog van de schuldoffers gehandeld wordt."}],"2":[{"catchword":"mens gezondigd,","tekst":"Hebreeuws, ziel; en zo in het volgende. Zie Gen 12:5."},{"catchword":"tegen den HEERE","tekst":"Die aan zijn naasten misdoet, zondigt ook tegen den Heere; niet alleen omdat de mens Gods schepsel is en Hem toebehoort, maar ook omdat God bevolen heeft zijn naasten te lieven, en niet te beschadigen; en dikwijls in en over de zonden tegen den naasten begaan, de naam des Heeren misbruikt wordt."},{"catchword":"gelogen hebben","tekst":"Anders, geloochend."},{"catchword":"ter hand gesteld was,","tekst":"Hebreeuws, van stelling der hand; dat is, dat iemand in handen gegeven en besteld is, hetzij van een alleen, of van velen, met welke hij door handgeving, handtekening of anderszins in gemeenschap of maatschappij getreden is, om dat wèl te bezorgen en waar te nemen."},{"catchword":"met geweld zijn naaste onthoudt;","tekst":"Of, bedriegelijk zijn naasten onttrokken heeft."}],"5":[{"catchword":"in zijn hoofdsom wedergeve,","tekst":"Hebreeuws, in zijn hoofd; dat is in het principale zelf wat ontvreemd is, of in de kapitale som."},{"catchword":"op den dag zijner schuld","tekst":"Dat is, als hij schuldig bevonden en verklaard zal worden. Anders, ten dage zijns schuldoffers; dat is, wanneer hij de offerande voor zijne schuld zal moeten offeren om zich te verzoenen met God, dan zal hij meteen zijn naasten voldoen; vergelijk Mat 5:23."}],"6":[{"catchword":"met uw schatting,","tekst":"Zie boven, Lev 5:15."}],"7":[{"catchword":"hem verzoening doen","tekst":"Zie boven, Lev 1:4."},{"catchword":"waar hij schuld aan heeft","tekst":"Hebreeuws, ten schuld daarin."}],"9":[{"catchword":"Dit is de wet des brandoffers;","tekst":"Dat is, het voorschrift van die manier hoe men brandoffer doen zal, of het dagelijkse, Exo 29:38, of het vrijwillige, Lev. 1 , of wat de wet voor enige zonde beveelt."},{"catchword":"het is hetgeen,","tekst":"Te weten, het brandoffer. Het is ene beschrijving des brandoffers; vergelijk die met de aantekeningen op Gen 8:20."},{"catchword":"het vuur des altaars","tekst":"Te weten, wat op dit altaar, toen de eerste offerande daarop geschiedde, uit den hemel gevallen is, en daarna altijd brandende onderhouden moest worden; onder vs.12,13,."}],"10":[{"catchword":"linnen kleed aantrekken,","tekst":"Zie hiervan, Exo 28:39-40."},{"catchword":"die bij het altaar leggen","tekst":"Te weten, as. Zie boven, Lev 1:16."}],"11":[{"catchword":"tot buiten het leger uitdragen aan een reine plaats","tekst":"Zie boven, Lev 4:12."}],"12":[{"catchword":"daar","tekst":"Te weten, op het altaar."},{"catchword":"elken morgen hout aansteken,","tekst":"Hebreeuws, in den morgen, in den morgen. Zie Gen 39:10."}],"14":[{"catchword":"spijsoffers;","tekst":"Zie boven, Lev 2:1."},{"catchword":"voor aan het altaar","tekst":"Anders, op het altaar. Hebreeuws, aan het aangezicht des altaars."}],"15":[{"catchword":"een liefelijke reuk","tekst":"Zie boven, Lev 1:9."},{"catchword":"tot deszelfs gedachtenis","tekst":"Zie boven, Lev 2:2."}],"16":[{"catchword":"zullen Aäron en zijn zonen eten;","tekst":"Deze wet had drie redenen:&lt;i&gt;I.&lt;/i&gt; opdat het geheiligde niet in kleinachting zou komen door het algemene gebruik;&lt;i&gt;II.&lt;/i&gt; opdat het daarna door de gemeente niet door vertoning, eergierigheid, overdaad of anderszins misbruikt zou worden;&lt;i&gt;III.&lt;/i&gt; opdat de priesters, die het altaar dienden, van het altaar zouden leven; 1Co 9:10."},{"catchword":"in den voorhof van de tent","tekst":"Hiermede wordt uitgedrukt welke de heilige plaats is, waar het heilige door de priesters gegeten moest worden. Zie ook onder, vs.26, en Lev 10:12-13."}],"17":[{"catchword":"een heiligheid der heiligheden,","tekst":"Zie boven, Lev 2:3."}],"18":[{"catchword":"eeuwige inzetting","tekst":"Hebreeuws, inzetting der eeuwigheid. Zie Gen 13:15."},{"catchword":"wat","tekst":"Of, al wie."},{"catchword":"die zal aanroeren,","tekst":"Te weten, de dingen, vermeld in vs.16,17."},{"catchword":"heilig zijn","tekst":"Dat is, voor heilig geacht en niet gebruikelijk in enige andere zaken; maar het meost òf gebroken òf gewassen òf ook geschuurd en afgespoeld worden. Zie onder, vs.27,28."}],"20":[{"catchword":"hij zal gezalfd worden","tekst":"Namelijk, Aäron, of een zijner zonen."},{"catchword":"efa meelbloem,","tekst":"Zie boven, Lev 5:11."},{"catchword":"een spijsoffer gedurig;","tekst":"Dat is, of, gelijk het gedurig spijsoffer, of, met het gedurig spijsoffer, of, ten gedurigen spijsoffer; te weten, in de zalving der priesters. Aangaande het gedurig spijsoffer, zie Exo 29:40."},{"catchword":"de helft daarvan op den morgen,","tekst":"Dat is, de ene helft der meelbloem voor het morgenoffer en de ander voor het avondoffer."}],"21":[{"catchword":"geroost zult gij het brengen;","tekst":"Anders, gebakken, en zo gezoden, dat het opbobbelt en door het koken opgeblazen wordt, en tot enige verheffing komt; alzo onder, Lev 7:12."},{"catchword":"gebakken stukken","tekst":"Hebreeuws, kooksel des spijsoffers van de stukken; dat is, gekookte of gebakken stukken des spijsoffers."}],"22":[{"catchword":"gezalfde zal worden,","tekst":"Te weten, om na zijn dood in zijn ambt te treden."},{"catchword":"aangestoken worden","tekst":"Om ganselijk verbrand te worden."}],"23":[{"catchword":"Alzo zal alle spijsoffer des priesters ganselijk zijn;","tekst":"Te weten, dat het gans aangestoken en verbrand zal worden. Anders, zal geheel verbrand worden."}],"25":[{"catchword":"zondoffers","tekst":"Zie boven, Lev 4:3."},{"catchword":"in de plaats,","tekst":"Zie boven, Lev 1: // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
