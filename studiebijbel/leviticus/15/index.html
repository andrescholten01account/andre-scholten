04\">bed</span> shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "6": "And he that <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth</span> on any <span class=\"wl wl-kjv\" data-code=\"H3627\">thing</span> whereon he <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> that hath the <span class=\"wl wl-kjv\" data-code=\"H2100\">issue</span> shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "7": "And he that <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of him that hath the <span class=\"wl wl-kjv\" data-code=\"H2100\">issue</span> shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "8": "And if he that hath the <span class=\"wl wl-kjv\" data-code=\"H2100\">issue</span> <span class=\"wl wl-kjv\" data-code=\"H7556\">spit</span> upon him that is <span class=\"wl wl-kjv\" data-code=\"H2889\">clean;</span> then he shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "9": "And what <span class=\"wl wl-kjv\" data-code=\"H4817\">saddle</span> soever he <span class=\"wl wl-kjv\" data-code=\"H7392\">rideth</span> upon that hath the <span class=\"wl wl-kjv\" data-code=\"H2100\">issue</span> shall be unclean.", "10": "And whosoever <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> any thing that was under him shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the <span class=\"wl wl-kjv\" data-code=\"H6153\">even:</span> and he that <span class=\"wl wl-kjv\" data-code=\"H5375\">beareth</span> any of those things shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "11": "And whomsoever he <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> that hath the <span class=\"wl wl-kjv\" data-code=\"H2100\">issue,</span> and hath not <span class=\"wl wl-kjv\" data-code=\"H7857\">rinsed</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "12": "And the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> of <span class=\"wl wl-kjv\" data-code=\"H2789\">earth,</span> that he <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> which hath the <span class=\"wl wl-kjv\" data-code=\"H2100\">issue,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7665\">broken:</span> and every <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> of <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7857\">rinsed</span> in water.", "13": "And when he that hath an <span class=\"wl wl-kjv\" data-code=\"H2100\">issue</span> is <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed</span> of his <span class=\"wl wl-kjv\" data-code=\"H2101\">issue;</span> then he shall <span class=\"wl wl-kjv\" data-code=\"H5608\">number</span> to himself <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> for his <span class=\"wl wl-kjv\" data-code=\"H2893\">cleansing,</span> and <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> in <span class=\"wl wl-kjv\" data-code=\"H2416\">running</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and shall be clean.", "14": "And on the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> to him <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8449\">turtledoves,</span> or <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H3123\">pigeons,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them unto the priest:", "15": "And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">offer</span> them, the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for him <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for his issue.", "16": "And if any <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H7902\">copulation</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from him, then he shall <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> all his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "17": "And every <span class=\"wl wl-kjv\" data-code=\"H899\">garment,</span> and every <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> whereon is the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H7902\">copulation,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3526\">washed</span> with <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "18": "The <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> also with whom <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H7902\">copulation,</span> they shall both <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> themselves in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "19": "And if a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> have an <span class=\"wl wl-kjv\" data-code=\"H2100\">issue,</span> and her <span class=\"wl wl-kjv\" data-code=\"H2101\">issue</span> in her <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> be <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> she shall be put <span class=\"wl wl-kjv\" data-code=\"H5079\">apart</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> and whosoever <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> her shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "20": "And every thing that she <span class=\"wl wl-kjv\" data-code=\"H7901\">lieth</span> upon in her <span class=\"wl wl-kjv\" data-code=\"H5079\">separation</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> every thing also that she <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth</span> upon shall be unclean.", "21": "And whosoever <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> her <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "22": "And whosoever <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> any <span class=\"wl wl-kjv\" data-code=\"H3627\">thing</span> that she <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> upon shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "23": "And if it be on her <span class=\"wl wl-kjv\" data-code=\"H4904\">bed,</span> or on any <span class=\"wl wl-kjv\" data-code=\"H3627\">thing</span> whereon she <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth,</span> when he <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> it, he shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "24": "And if any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with her at <span class=\"wl wl-kjv\" data-code=\"H7901\">all,</span> and her <span class=\"wl wl-kjv\" data-code=\"H5079\">flowers</span> be upon him, he shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> whereon he <span class=\"wl wl-kjv\" data-code=\"H7901\">lieth</span> shall be unclean.", "25": "And if a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H2100\">have</span> an <span class=\"wl wl-kjv\" data-code=\"H2101\">issue</span> of her <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H3808\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of her <span class=\"wl wl-kjv\" data-code=\"H5079\">separation,</span> or if it <span class=\"wl wl-kjv\" data-code=\"H2100\">run</span> beyond the <span class=\"wl wl-kjv\" data-code=\"H5921\">time</span> of her <span class=\"wl wl-kjv\" data-code=\"H5079\">separation;</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of the <span class=\"wl wl-kjv\" data-code=\"H2101\">issue</span> of her <span class=\"wl wl-kjv\" data-code=\"H2932\">uncleanness</span> shall be as the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of her <span class=\"wl wl-kjv\" data-code=\"H5079\">separation:</span> she shall be unclean.", "26": "Every <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> whereon she <span class=\"wl wl-kjv\" data-code=\"H7901\">lieth</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of her <span class=\"wl wl-kjv\" data-code=\"H2101\">issue</span> shall be unto her as the <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> of her <span class=\"wl wl-kjv\" data-code=\"H5079\">separation:</span> and <span class=\"wl wl-kjv\" data-code=\"H3627\">whatsoever</span> she <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth</span> upon shall be <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean,</span> as the <span class=\"wl wl-kjv\" data-code=\"H2932\">uncleanness</span> of her separation.", "27": "And whosoever <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> those things shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.", "28": "But if she be <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed</span> of her <span class=\"wl wl-kjv\" data-code=\"H2101\">issue,</span> then she shall <span class=\"wl wl-kjv\" data-code=\"H5608\">number</span> to herself <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that she shall be clean.", "29": "And on the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> she shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> unto her <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8449\">turtles,</span> or <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H3123\">pigeons,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> them unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> to the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation.", "30": "And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">offer</span> the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for her <span class=\"wl wl-kjv\" data-code=\"H6440\" /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Matthew Henry-verklaring']],
  ['Geloofsbelijdenissen', ['1689 Baptist Confession', 'Westminster Confession']],
  ['Boeken', ['Institutie — Calvijn', 'A Body of Divinity — Watson']],
  ['Preken', ['Spurgeon']],
  ['Devotionals', ['Spurgeon']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */

  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {

  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
