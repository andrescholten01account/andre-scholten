eg tegen hen: Iedere man, als hij een vloed heeft uit zijn vlees, zal om zijn vloed onrein zijn.", "3": "Dit nu zal zijn onreinheid zijn om zijn vloed: of zijn vlees zijn vloed laat druppelen, of zijn vlees van zijn vloed zich verstopt, dat is zijn onreinheid.", "4": "Elk bed waarop hij, die de vloed heeft, zal liggen, zal onrein zijn, en al het voorwerp waarop hij zal zitten, zal onrein zijn.", "5": "Ieder ook, die zijn bed aanraakt, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond.", "6": "En wie op dat voorwerp zit waarop hij, die de vloed heeft, gezeten zal hebben, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond.", "7": "En wie het vlees aanraakt van hem die de vloed heeft, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.", "8": "Als ook hij, die de vloed heeft, op een reine zal gespuugd hebben, dan zal hij zijn kleren wassen, en zal zich met water baden, en onrein zijn tot aan de avond.", "9": "Evenzo zal elk zadel, waarop hij, die de vloed heeft, zal gereden hebben, onrein zijn.", "10": "En ieder die iets aanraakt dat onder hem geweest zal zijn, zal onrein zijn tot aan de avond; en wie het draagt, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.", "11": "Bovendien: ieder die hij, die de vloed heeft, aangeraakt zal hebben zonder zijn handen met water gespoeld te hebben, die zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.", "12": "Ook zal het aarden vat, dat hij, die de vloed heeft, aangeraakt zal hebben, gebroken worden; maar elk houten vat zal met water gespoeld worden.", "13": "Als hij nu, die de vloed heeft, van zijn vloed gereinigd zal zijn, dan zal hij voor zichzelf zeven dagen tellen voor zijn reiniging, en zijn kleren wassen, en hij zal zijn vlees met levend water baden, dan zal hij rein zijn.", "14": "En op de achtste dag zal hij voor zichzelf twee tortelduiven of twee jonge duiven nemen; en zal voor het aangezicht van de HEERE, aan de deur van de tent van de samenkomst komen, en zal ze aan de priester geven.", "15": "En de priester zal die bereiden, de één als zondoffer, en de ander als brandoffer; zo zal de priester voor hem, vanwege zijn vloed, verzoening doen voor het aangezicht van de HEERE.", "16": "Verder, een man bij wie het zaad van het bijliggen zal zijn uitgegaan, die zal zijn hele vlees met water baden, en onrein zijn tot aan de avond.", "17": "Ook elk kledingstuk, en elk vel, waaraan het zaad van het bijliggen zal zijn, dat zal met water gewassen worden, en onrein zijn tot aan de avond.", "18": "Alsook de vrouw, als een man met het zaad van het bijliggen bij haar gelegen zal hebben; daarom zullen zij zich beiden met water baden, en onrein zijn tot aan de avond.", "19": "Maar als een vrouw een vloed zal hebben, en haar vloed van bloed in haar vlees is, dan zal zij zeven dagen in haar afzondering zijn; en ieder die haar aanraakt, zal onrein zijn tot aan de avond.", "20": "En alles waarop zij in haar afzondering zal hebben gelegen, zal onrein zijn; alsook alles waarop zij zal hebben gezeten, zal onrein zijn.", "21": "En ieder die haar bed aanraakt, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.", "22": "Ook ieder die enig voorwerp aanraakt waarop zij zal hebben gezeten, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.", "23": "Zelfs als het op het bed geweest zal zijn, of op het voorwerp waarop zij zat, wanneer hij dat aanraakte, zal hij onrein zijn tot aan de avond.", "24": "Evenzo, als iemand werkelijk bij haar gelegen heeft, zodat haar afzondering op hem is, dan zal hij zeven dagen onrein zijn; bovendien zal elk bed, waarop hij zal hebben gelegen, onrein zijn.", "25": "Wanneer ook een vrouw, veel dagen buiten de tijd van haar afzondering, van de vloed van haar bloed zal vloeien, of wanneer zij zal vloeien langer dan haar afzondering duurt, dan zal zij al de dagen van de vloed van haar onreinheid, zoals in de dagen van haar afzondering, onrein zijn.", "26": "Elk bed waarop zij al de dagen van haar vloed zal hebben gelegen, zal voor haar zijn als het bed van haar afzondering; en elk voorwerp waarop zij zal hebben gezeten, zal onrein zijn, zoals de onreinheid van haar afzondering.", "27": "En al wie die dingen aanraakt, zal onrein zijn; daarom zal hij zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.", "28": "Maar als zij van haar vloed rein wordt, dan zal zij voor zichzelf zeven dagen tellen, daarna zal zij rein zijn.", "29": "En op de achtste dag zal zij voor zichzelf twee tortelduiven, of twee jonge duiven nemen, en zij zal ze naar de priester brengen, aan de deur van de tent van de samenkomst.", "30": "Dan zal de priester de één als zondoffer en de ander als brandoffer bereiden; en de priester zal voor haar, vanwege de vloed van haar onreinheid, verzoening doen voor het aangezicht van de HEERE.", "31": "Zo zult u de kinderen van Israël afzonderen van hun onreinheid; opdat zij in hun onreinheid niet sterven, wanneer zij Mijn tabernakel, die in hun midden is, zouden verontreinigen.", "32": "Dit is de wet van hem die de vloed heeft, en van hem uit wie het zaad van de gemeenschap uitgaat, zodat hij daardoor onrein wordt;", "33": "Alsook van een vrouw die zwak is door haar afzondering, en van hem die van zijn vloed is vloeiende, voor een man, en voor een vrouw; en voor een man, die bij een onreine zal hebben gelegen."}, "SV": {"1": "Verder sprak de HEERE tot Mozes en tot Aäron, zeggende:", "2": "Spreekt tot de kinderen Israëls, en zegt tot hen: Een ieder man, als hij vloeiende zal zijn uit zijn vlees, zal om zijn vloed onrein zijn.", "3": "Dit nu zal zijn onreinigheid om zijn vloed zijn: zo zijn vlees zijn vloed uitzevert, of zijn vlees van zijn vloed zich verstopt, dat is zijn onreinigheid.", "4": "Alle leger, waarop hij, die den vloed heeft, zal liggen, zal onrein zijn, en alle tuig, waarop hij zal zitten, zal onrein zijn.", "5": "Een ieder ook, die zijn leger zal aanroeren, zal zijn klederen wassen, en zich met water baden, en zal onrein zijn tot aan den avond.", "6": "En die op dat tuig zit, waarop hij, die den vloed heeft, gezeten zal hebben, zal zijn klederen wassen, en zich met water baden, en zal onrein zijn tot aan den avond.", "7": "En die het vlees desgenen, die den vloed heeft, aanroert, zal zijn klederen wassen, en zich met water baden, en onrein zijn tot aan den avond.", "8": "Als ook hij, die den vloed heeft, op een reine zal gespogen hebben, dan zal hij zijn klederen wassen, en zal zich met water baden, en onrein zijn tot aan den avond.", "9": "Insgelijks alle zadel, waarop hij, die den vloed heeft, zal gereden hebben, zal onrein zijn.", "10": "En al wie iets aanroert, dat onder hem zal geweest zijn, zal onrein zijn tot aan den avond; en die hetzelve draagt, zal zijn klederen wassen, en zich met water baden, en onrein zijn tot aan den avond.", "11": "Daartoe een ieder, wien hij, die den vloed heeft, zal aangeroerd hebben, zonder zijn handen met water gespoeld te hebben, die zal zijn klederen wassen, en zich met water baden, en onrein zijn tot aan den avond.", "12": "Ook het aarden vat, hetwelk hij, die den vloed heeft, zal aangeroerd hebben, zal gebroken worden; maar alle houten vat zal met water gespoeld worden.", "13": "Als hij nu, die den vloed heeft, van zijn vloed gereinigd zal zijn, zo zal hij tot zijn reiniging zeven dagen voor zich tellen, en zijn klederen wassen, en hij zal zijn vlees met levend water baden, zo zal hij rein zijn.", "14": "En op den achtsten dag zal hij voor zich twee tortelduiven of twee jonge duiven nemen; en zal voor het aangezicht des HEEREN, aan de deur van de tent der samenkomst komen, en zal ze den priester geven.", "15": "En de priester zal die bereiden, een ten zondoffer, en een ten brandoffer; zo zal de priester over hem voor het aangezicht des HEEREN, vanwege zijn vloed, verzoening doen.", "16": "Verder een man, als van hem het zaad des bijliggens zal uitgegaan zijn, die zal zijn ganse vlees met water baden, en onrein zijn tot aan den avond.", "17": "Ook alle kleed, en alle vel, aan hetwelk het zaad des bijliggens wezen zal, dat zal met water gewassen worden, en onrein zijn tot aan den avond.", "18": "Mitsgaders de vrouw, als een man met het zaad des bijliggens bij haar gelegen zal hebben; daarom zullen zij zich met water baden, en onrein zijn tot aan den avond.", "19": "Maar als een vrouw vloeiende zijn zal, zijnde haar vloed van bloed in haar vlees, zo zal zij zeven dagen in haar afzondering zijn; en al wie haar aanroert, zal onrein zijn tot aan den avond.", "20": "En al hetgeen, waarop zij in haar afzondering zal gelegen hebben, zal onrein zijn; mitsgaders alles, waarop zij zal gezeten hebben, zal onrein zijn.", "21": "En al wie haar leger aanroert, zal zijn klederen wassen, en zich met water baden, en onrein zijn tot aan den avond.", "22": "Ook al wie enig tuig, waarop zij gezeten zal hebben, aanroert, zal zijn klederen wassen, en zich met water baden, en onrein zijn tot aan den avond.", "23": "Zelfs indien het op het leger geweest zal zijn, of op het tuig, waarop zij zat, als hij dat aanroerde, hij zal onrein zijn tot aan den avond.", "24": "Insgelijks zo iemand zekerlijk bij haar gelegen heeft, dat haar afzondering op hem zij, zo zal hij zeven dagen onrein zijn; daartoe alle leger, waarop hij zal gelegen hebben, zal onrein zijn.", "25": "Wanneer ook een vrouw, vele dagen buiten den tijd harer afzondering, van den vloed haars bloeds vloeien zal, of wanneer zij vloeien zal boven hare afzondering, zij zal al den dagen van den vloed harer onreinigheid, als in de dagen harer afzondering onrein zijn.", "26": "Alle leger, waarop zij al de dagen haars vloeds gelegen zal hebben, zal haar zijn als het leger harer afzondering; en alle tuig, waarop zij zal gezeten hebben, zal onrein zijn, naar de onreinigheid harer afzondering.", "27": "En zo wie die dingen aanroert, zal onrein zijn; daarom zal hij zijn klederen wassen, en zich met water baden, en onrein zijn tot aan den avond.", "28": "Maar als zij van haar vloed rein wordt, dan zal zij voor zich zeven dagen tellen, daarna zal zij rein zijn.", "29": "En op den achtsten dag zal zij voor zich twee tortelduiven, of twee jonge duiven nemen, en zij zal die tot den priester brengen, aan de deur van de tent der samenkomst.", "30": "Dan zal de priester een ten zondoffer en een ten brandoffer bereiden; en de priester zal voor haar, van den vloed harer onreinigheid, verzoening doen voor het aangezicht des HEEREN.", "31": "Alzo zult gij de kinderen Israëls afzonderen van hun onreinigheid; opdat zij in hun onreinigheid niet sterven, als zij Mijn tabernakel, die in het midden van hen is, verontreinigen zouden.", "32": "Dit is de wet desgenen, die den vloed heeft, en van wien het zaad der bijligging uitgaat; zodat hij daardoor onrein wordt;", "33": "Mitsgaders van een zwakke vrouw in haar afzondering, en van degene, die van zijn vloed is vloeiende, voor een man, en voor een vrouw; en voor een man, die bij een onreine zal gelegen hebben."}, "KJV": {"1": "And the LORD spake unto Moses and to Aaron, saying,", "2": "Speak unto the children of Israel, and say unto them, When any man hath a running issue out of his flesh, *because of* his issue he *is* unclean.", "3": "And this shall be his uncleanness in his issue: whether his flesh run with his issue, or his flesh be stopped from his issue, it *is* his uncleanness.", "4": "Every bed, whereon he lieth that hath the issue, is unclean: and every thing, whereon he sitteth, shall be unclean.", "5": "And whosoever toucheth his bed shall wash his clothes, and bathe *himself* in water, and be unclean until the even.", "6": "And he that sitteth on *any* thing whereon he sat that hath the issue shall wash his clothes, and bathe *himself* in water, and be unclean until the even.", "7": "And he that toucheth the flesh of him that hath the issue shall wash his clothes, and bathe *himself* in water, and be unclean until the even.", "8": "And if he that hath the issue spit upon him that is clean; then he shall wash his clothes, and bathe *himself* in water, and be unclean until the even.", "9": "And what saddle soever he rideth upon that hath the issue shall be unclean.", "10": "And whosoever toucheth any thing that was under him shall be unclean until the even: and he that beareth *any of* those things shall wash his clothes, and bathe *himself* in water, and be unclean until the even.", "11": "And whomsoever he toucheth that hath the issue, and hath not rinsed his hands in water, he shall wash his clothes, and bathe *himself* in water, and be unclean until the even.", "12": "And the vessel of earth, that he toucheth which hath the issue, shall be broken: and every vessel of wood shall be rinsed in water.", "13": "And when he that hath an issue is cleansed of his issue; then he shall number to himself seven days for his cleansing, and wash his clothes, and bathe his flesh in running water, and shall be clean.", "14": "And on the eighth day he shall take to him two turtledoves, or two young pigeons, and come before the LORD unto the door of the tabernacle of the congregation, and give them unto the priest:", "15": "And the priest shall offer them, the one *for* a sin offering, and the other *for* a burnt offering; and the priest shall make an atonement for him before the LORD for his issue.", "16": "And if any man's seed of copulation go out from him, then he shall wash all his flesh in water, and be unclean until the even.", "17": "And every garment, and every skin, whereon is the seed of copulation, shall be washed with water, and be unclean until the even.", "18": "The woman also with whom man shall lie *with* seed of copulation, they shall *both* bathe *themselves* in water, and be unclean until the even.", "19": "And if a woman have an issue, *and* her issue in her flesh be blood, she shall be put apart seven days: and whosoever toucheth her shall be unclean until the even.", "20": "And every thing that she lieth upon in her separation shall be unclean: every thing also that she sitteth upon shall be unclean.", "21": "And whosoever toucheth her bed shall wash his clothes, and bathe *himself* in water, and be unclean until the even.", "22": "And whosoever toucheth any thing that she sat upon shall wash his clothes, and bathe *himself* in water, and be unclean until the even.", "23": "And if it *be* on *her* bed, or on any thing whereon she sitteth, when he toucheth it, he shall be unclean until the even.", "24": "And if any man lie with her at all, and her flowers be upon him, he shall be unclean seven days; and all the bed whereon he lieth shall be unclean.", "25": "And if a woman have an issue of her blood many days out of the time of her separation, or if it run beyond the time of her separation; all the days of the issue of her uncleanness shall be as the days of her separation: she *shall be* unclean.", "26": "Every bed whereon she lieth all the days of her issue shall be unto her as the bed of her separation: and whatsoever she sitteth upon shall be unclean, as the uncleanness of her separation.", "27": "And whosoever toucheth those things shall be unclean, and shall wash his clothes, and bathe *himself* in water, and be unclean until the even.", "28": "But if she be cleansed of her issue, then she shall number to herself seven days, and after that she shall be clean.", "29": "And on the eighth day she shall take unto her two turtles, or two young pigeons, and bring them unto the priest, to the door of the tabernacle of the congregation.", "30": "And the priest shall offer the one *for* a sin offering, and the other *for* a burnt offering; and the priest shall make an atonement for her before the LORD for the issue of her uncleanness.", "31": "Thus shall ye separate the children of Israel from their uncleanness; that they die not in their uncleanness, when they defile my tabernacle ": "Lev 14:54-57", "svLabel": null}, {"disp": "Lev 15:2-13", "href": "../../leviticus/15/#v2", "ref": "Lev 15:2-13", "svLabel": null}, {"disp": "Lev 15:16-28", "href": "../../leviticus/15/#v16", "ref": "Lev 15:16-28", "svLabel": null}, {"disp": "Lev 15:32", "href": "../../leviticus/15/#v32", "ref": "Lev 15:32", "svLabel": null}, {"disp": "Lev 15:33", "href": "../../leviticus/15/#v33", "ref": "Lev 15:33", "svLabel": null}, {"disp": "Lev 22:4-8", "href": "../../leviticus/22/#v4", "ref": "Lev 22:4-8", "svLabel": null}, {"disp": "Num 5:2-4", "href": "../../numeri/5/#v2", "ref": "Num 5:2-4", "svLabel": null}, {"disp": "Num 9:6", "href": "../../numeri/9/#v6", "ref": "Num 9:6", "svLabel": null}, {"disp": "Num 9:10", "href": "../../numeri/9/#v10", "ref": "Num 9:10", "svLabel": null}, {"disp": "Num 19:11-16", "href": "../../numeri/19/#v11", "ref": "Num 19:11-16", "svLabel": null}, {"disp": "Num 19:22", "href": "../../numeri/19/#v22", "ref": "Num 19:22", "svLabel": null}, {"disp": "Num 31:19", "href": "../../numeri/31/#v19", "ref": "Num 31:19", "svLabel": null}, {"disp": "Num 31:20", "href": "../../numeri/31/#v20", "ref": "Num 31:20", "svLabel": null}, {"disp": "Deut 23:10", "href": "../../deuteronomium/23/#v10", "ref": "Deut 23:10", "svLabel": null}, {"disp": "Deut 23:11", "href": "../../deuteronomium/23/#v11", "ref": "Deut 23:11", "svLabel": null}, {"disp": "Deut 24:8", "href": "../../deuteronomium/24/#v8", "ref": "Deut 24:8", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Num 31:22-24": "Alleen het goud en het zilver, het koper, het ijzer, het tin en het lood; Alles wat tegen het vuur bestand is, moet u door het vuur laten gaan, zodat het rein wordt; toch zal het ook met het water der afzondering ontzondigd moeten worden; maar alles wat niet tegen het vuur bestand is, moet u door het water laten gaan. U moet ook uw kleren op de zevende dag wassen, zodat u rein wordt; en daarna zult u in het leger komen.", "Lev 5:2": "Of wanneer een mens iets onreins zal hebben aangeraakt, hetzij het dode aas van een wild onrein dier, of het dode aas van onrein vee, of het dode aas van onrein kruipend gedierte; ook al is het voor hem verborgen geweest, toch is hij onrein en schuldig.", "Lev 20:18": "En als een man gemeenschap heeft met een vrouw die ongesteld is, en haar schaamte ontdekt, haar bron blootlegt, en zij zelf de bron van haar bloed ontdekt heeft, zullen zij beiden uit het midden van hun volk uitgeroeid worden.", "Lev 22:3": "Zeg tegen hen: Elke man onder uw geslachten, uit uw hele nageslacht, die tot de heilige dingen zal naderen die de kinderen van Israël de HEERE heiligen, terwijl zijn onreinheid op hem is; die mens zal van voor Mijn aangezicht uitgeroeid worden; Ik ben de HEERE!", "Ezech 36:17": "Mensenkind! Het huis van Israël, toen zij in hun land woonden, verontreinigden zij dat met hun weg en met hun handelingen; hun weg was voor Mijn aangezicht als de onreinheid van een afgezonderde vrouw.", "Num 28:30": "Een geitenbok, om voor u verzoening te doen.", "Lev 15:16-27": "Verder, een man bij wie het zaad van het bijliggen zal zijn uitgegaan, die zal zijn hele vlees met water baden, en onrein zijn tot aan de avond. Ook elk kledingstuk, en elk vel, waaraan het zaad van het bijliggen zal zijn, dat zal met water gewassen worden, en onrein zijn tot aan de avond. Alsook de vrouw, als een man met het zaad van het bijliggen bij haar gelegen zal hebben; daarom zullen zij zich beiden met water baden, en onrein zijn tot aan de avond.", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Rom 3:2": "Veel, in alle opzichten; want dit is wel het eerste, dat hun de woorden van God zijn toevertrouwd.", "Num 31:20": "Ook moet u alle kleding, en alle voorwerpen van vellen, en alle werk van geitenhaar, en voorwerpen van hout, ontzondigen.", "1 Kor 15:33": "Dwaal niet. Slechte omgang bederft goede zeden.", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Ex 30:18-21": "U moet ook een koperen wasvat maken, met zijn koperen voet, om mee te wassen; en u moet het zetten tussen de tent van de samenkomst en het altaar, en u moet er water in doen; Zodat Aäron en zijn zonen zich daarmee kunnen wassen, hun handen en voeten. Wanneer zij de tent van de samenkomst binnengaan, moeten zij zich met water wassen, zodat zij niet sterven; of wanneer zij tot het altaar naderen om te dienen, om het vuuroffer aan de HEERE aan te steken;", "Num 6:10": "En op de achtste dag zal hij twee tortelduiven of twee jonge duiven brengen tot de priester, tot de deur van de tent der samenkomst.", "Lev 22:4-7": "Niemand van het nageslacht van Aäron die melaats is, of een vloed heeft, zal van die heilige dingen eten, totdat hij rein is; alsook wie iets aanraakt dat onrein is door een dood lichaam, of een man aan wie het zaad van de gemeenschap ontgaat. Of wie ook maar enig kruipend gedierte zal hebben aangeraakt waardoor hij onrein wordt, of een mens waardoor hij onrein wordt, naar al zijn onreinheid; De mens die dat zal hebben aangeraakt, zal onrein zijn tot aan de avond, en hij zal van die heilige dingen niet eten, maar zal zijn lichaam met water baden.", "1 Kor 6:18": "Vlucht voor de hoererij. Elke zonde die de mens doet, is buiten het lichaam, maar wie hoererij bedrijft, zondigt tegen zijn eigen lichaam.", "Num 19:7": "Dan zal de priester zijn kleren wassen, en zijn lichaam met water baden, en daarna in het leger gaan; en de priester zal onrein zijn tot de avond.", "2 Kron 4:6": "En hij maakte tien wasvaten, en zette vijf aan de rechterhand en vijf aan de linkerhand, om daarin te wassen; wat bij het brandoffer hoorde, staken zij daarin; maar de zee was ervoor dat de priesters zich daarin zouden wassen.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Lev 11:8": "Van hun vlees zult u niet eten, en hun kadaver niet aanraken; zij zullen voor u onrein zijn.", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "Num 19:15": "Ook elk open voorwerp waarop geen deksel vastgebonden is, is onrein.", "Num 5:3": "Van de man tot de vrouw toe zult u hen wegzenden; tot buiten het leger zult u hen wegzenden; zodat zij hun legers niet verontreinigen, in welker midden Ik woon.", "Ex 29:37": "Zeven dagen zult u verzoening doen voor het altaar, en zult het heiligen; dan zal dat altaar allerheiligst zijn; al wat het altaar aanraakt, zal heilig zijn.", "Ps 25:14": "Samech. De verborgenheid van de HEERE is voor hen die Hem vrezen; en Zijn verbond, om het hun bekend te maken.", "Lev 19:22": "En de priester zal met de ram van het schuldoffer, voor hem over zijn zonde die hij gezondigd heeft, voor het aangezicht van de HEERE verzoening doen; en hem zal vergeving gebeuren van zijn zonde die hij gezondigd heeft.", "Lev 9:1-21": "Het gebeurde op de achtste dag, dat Mozes Aäron en zijn zonen riep, en de oudsten van Israël; En hij zei tegen Aäron: Neem u een kalf, een jong rund, tot zondoffer, en een ram tot brandoffer, die volkomen zijn; en breng ze voor het aangezicht van de HEERE. Daarna spreek tot de kinderen van Israël, en zeg: Neem een geitenbok tot zondoffer, en een kalf, en een lam, eenjarig, volkomen, tot brandoffer;", "Lev 7:21": "En wanneer een ziel iets onreins aangeraakt zal hebben, zoals de onreinheid van een mens, of het onreine vee, of enig onrein verfoeisel, en zal van het vlees van het dankoffer, dat van de HEERE is, gegeten hebben, dan zal die ziel uit haar volk uitgeroeid worden.", "Ef 1:6": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;", "Lev 13:34": "Daarna zal de priester die schurftheid op de zevende dag bekijken; indien, zie, de schurftheid in het vel niet uitgespreid is, en haar aanzien niet dieper is dan het vel, zal de priester hem rein verklaren; en hij zal zijn kleren wassen, en rein zijn.", "Ex 19:10": "Ook zei de HEERE tot Mozes: Ga tot het volk, en heilig hen heden en morgen, en laat hen hun kleren wassen,", "Num 28:15": "Daartoe zal een geitenbok als zondoffer voor de HEERE, boven het voortdurende brandoffer, bereid worden, met zijn drankoffer.", "Lev 11:24-40": "En hierdoor zult u onrein worden: wie hun kadaver aangeraakt zal hebben, zal onrein zijn tot de avond. Wie van hun kadaver gedragen zal hebben, zal zijn kleren wassen, en onrein zijn tot de avond. Elk dier dat de klauw verdeelt, maar de klauwen niet in tweeën gespleten heeft, en niet herkauwt, zal voor u onrein zijn; wie het aangeraakt zal hebben, zal onrein zijn.", "Klaagl 1:8": "Cheth. Jeruzalem heeft zwaar gezondigd, daarom is zij als een afgezonderde vrouw geworden; allen, die haar eerden, achten haar onwaard, omdat zij haar naaktheid gezien hebben; zij zucht ook, en zij is achterwaarts gekeerd.", "Lev 15:19-30": "Maar als een vrouw een vloed zal hebben, en haar vloed van bloed in haar vlees is, dan zal zij zeven dagen in haar afzondering zijn; en ieder die haar aanraakt, zal onrein zijn tot aan de avond. En alles waarop zij in haar afzondering zal hebben gelegen, zal onrein zijn; alsook alles waarop zij zal hebben gezeten, zal onrein zijn. En ieder die haar bed aanraakt, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.", "Num 20:12": "Daarom zei de HEERE tot Mozes en tot Aäron: Omdat u Mij niet geloofd hebt, door Mij te heiligen voor de ogen van de kinderen van Israël, daarom zult u deze gemeente niet brengen in het land, dat Ik hun gegeven heb.", "Lev 6:26-30": "De priester die het voor de zonde offert, zal het eten; in de heilige plaats zal het gegeten worden, in de voorhof van de tent der samenkomst. Al wat het vlees daarvan aanraakt, zal heilig zijn; en als iemand van het bloed daarvan op een kleed gesprengd heeft, dan zult u datgene waarop hij gesprengd heeft, wassen in de heilige plaats. En het aarden vat waarin het gekookt is, zal gebroken worden; maar als het in een koperen vat gekookt is, zal het geschuurd en in water gespoeld worden.", "Lev 11:31-40": "Die zullen voor u onrein zijn onder al het kruipend gedierte; wie ze aangeraakt zal hebben, als ze dood zijn, zal onrein zijn tot de avond. Ook alles waarop iets van hen vallen zal, als ze dood zijn, zal onrein zijn: hetzij een houten vat, of een kleed, of een vel, of een zak, of enig voorwerp waarmee werk gedaan wordt; het zal in het water gestoken worden, en onrein zijn tot de avond; daarna zal het rein zijn. En elk aarden vat waarin iets van hen zal zijn gevallen, alles wat erin is zal onrein zijn, en u zult het breken.", "2 Kor 5:1": "Want wij weten dat als ons aardse huis, deze tent, afgebroken wordt, wij een gebouw van God hebben, een huis niet met handen gemaakt, maar eeuwig, in de hemelen.", "Lev 4:26": "Hij zal ook al zijn vet op het altaar in rook laten opgaan, zoals het vet van het dankoffer; zo zal de priester voor hem verzoening doen van zijn zonde, en het zal hem vergeven worden.", "Num 4:17": "En de HEERE sprak tot Mozes en tot Aäron:", "Num 19:8": "Ook hij die haar verbrand heeft, zal zijn kleren met water wassen, en zijn lichaam met water baden, en onrein zijn tot de avond.", "Num 19:11-16": "Wie een dode aanraakt, welk dood lichaam van een mens dan ook, die zal zeven dagen onrein zijn. Op de derde dag zal hij zich daarmee ontzondigen, dan zal hij op de zevende dag rein zijn; maar als hij zich op de derde dag niet ontzondigt, dan zal hij op de zevende dag niet rein zijn. Ieder die een dode, het dode lichaam van een mens die gestorven is, aanraakt, en zich niet ontzondigd zal hebben, die verontreinigt de tabernakel van de HEERE; daarom zal die ziel uitgeroeid worden uit Israël; omdat het water van de afzondering niet op hem gesprenkeld is, zal hij onrein zijn; zijn onreinheid is nog in hem.", "Lev 14:30": "Daarna zal hij de ene van de tortelduiven, of van de jonge duiven, bereiden, van wat zijn hand bereiken kan.", "Lev 11:24-28": "En hierdoor zult u onrein worden: wie hun kadaver aangeraakt zal hebben, zal onrein zijn tot de avond. Wie van hun kadaver gedragen zal hebben, zal zijn kleren wassen, en onrein zijn tot de avond. Elk dier dat de klauw verdeelt, maar de klauwen niet in tweeën gespleten heeft, en niet herkauwt, zal voor u onrein zijn; wie het aangeraakt zal hebben, zal onrein zijn.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Judas 1:4": "Want er zijn sommige mensen ingeslopen, die vroeger al voor ditzelfde oordeel opgeschreven zijn, goddelozen, die de genade van onze God veranderen in losbandigheid, en de enige Heerser, God, en onze Heere Jezus Christus verloochenen.", "Num 29:5": "En een geitenbok tot een zondoffer, om voor u verzoening te doen;", "Deut 4:7": "Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Neh 9:14": "En U hebt Uw heilige sabbat bekendgemaakt; en U hebt hun geboden, en inzettingen en een wet bevolen, door de hand van Uw knecht Mozes.", "Num 18:1": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.", "Ezra 10:19": "En zij gaven hun hand, dat zij hun vrouwen zouden wegsturen; en omdat zij schuldig waren, offerden zij een ram uit de kudde voor hun schuld.", "Hebr 12:14": "Jaag de vrede na met allen, en de heiligmaking, zonder welke niemand de Heere zien zal;", "Lev 13:2-59": "Een mens, als er in het vel van zijn vlees een gezwel, of gezweer, of witte blaar zal zijn, welke in het vel van zijn vlees tot een plaag van de melaatsheid zou worden, hij zal dan naar de priester Aäron, of naar een van zijn zonen, de priesters, gebracht worden. En de priester zal de plaag in het vel van het vlees bekijken; als het haar in die plaag in wit veranderd is, en het aanzien van de plaag dieper is dan het vel van zijn vlees, is het de plaag van de melaatsheid; als de priester hem bekeken zal hebben, zal hij hem onrein verklaren. Maar als de blaar in het vel van zijn vlees wit is, en haar aanzien niet dieper is dan het vel, en het haar niet in wit veranderd is, zal de priester hem, die de plaag heeft, zeven dagen opsluiten.", "Num 2:1": "En de HEERE sprak tot Mozes en tot Aäron:", "Num 8:7": "En zo zult u hun doen, om hen te reinigen: sprenkel op hen water van de ontzondiging; en zij zullen het scheermes over hun hele lichaam laten gaan, en zij zullen hun kleren wassen, en zich reinigen.", "Lev 4:31": "En al haar vet zal hij wegnemen, zoals het vet van het dankoffer weggenomen wordt, en de priester zal het in rook laten opgaan op het altaar, tot een liefelijke reuk voor de HEERE; en de priester zal voor hem verzoening doen, en het zal hem vergeven worden.", "Lev 12:7": "Die zal het offeren voor het aangezicht van de HEERE, en voor haar verzoening doen; zo zal zij rein zijn van de vloed van het bloed van haar. Dit is de wet voor haar die een jongetje of meisje gebaard heeft.", "Num 15:27": "En indien één ziel door afdwaling gezondigd zal hebben, zal die een eenjarige geit tot zondoffer offeren.", "1 Tess 4:3-5": "Want dit is de wil van God, uw heiliging: dat u zich onthoudt van de hoererij; Dat ieder van u weet zijn eigen lichaam te bezitten in heiliging en eer; Niet in kwade hartstocht van begeerte, zoals ook de heidenen, die God niet kennen.", "Lev 12:6-8": "En als de dagen van haar reiniging voor de zoon of voor de dochter vervuld zijn, zal zij een eenjarig lam als brandoffer, en een jonge duif of tortelduif als zondoffer brengen, naar de deur van de tent van de samenkomst, naar de priester. Die zal het offeren voor het aangezicht van de HEERE, en voor haar verzoening doen; zo zal zij rein zijn van de vloed van het bloed van haar. Dit is de wet voor haar die een jongetje of meisje gebaard heeft. Maar als haar hand niet genoeg vindt voor een lam, zal zij twee tortelduiven of twee jonge duiven nemen, één als brandoffer en één als zondoffer; en de priester zal voor haar verzoening doen; zo zal zij rein zijn.", "Klaagl 1:17": "Pe. Sion breidt haar handen uit, er is geen trooster voor haar; de HEERE heeft van Jakob geboden, dat wie rondom hem zijn, zijn tegenstanders zouden zijn; Jeruzalem is als een afgezonderde vrouw onder hen.", "Lev 14:34-48": "Als u gekomen zult zijn in het land Kanaän, dat Ik u tot bezitting geven zal, en Ik de plaag van de melaatsheid aan een huis van dat land van uw bezitting gegeven zal hebben, zal hij, van wie dat huis is, komen, en het de priester te kennen geven en zeggen: Het schijnt mij, alsof er een plaag in het huis is. En de priester zal gebieden dat zij dat huis ruimen, voordat de priester komt om die plaag te bezien, zodat niet alles wat in dat huis is onrein wordt; en daarna zal de priester komen om dat huis te bezien.", "Lev 5:3": "Of als hij de onreinheid van een mens zal hebben aangeraakt, wat voor onreinheid het ook is waardoor hij onrein wordt; en het is voor hem verborgen geweest, maar hij komt erachter, dan is hij schuldig.", "Dan 9:27": "En hij zal voor velen het verbond versterken, één week; en in de helft van de week zal hij het slachtoffer en het spijsoffer doen ophouden, en over de gruwelijke vleugel zal een verwoester zijn, ook tot de voleinding toe, die vast besloten is, zal uitgestort worden over de verwoeste.", "Lev 4:35": "En al het vet daarvan zal hij wegnemen, zoals het vet van het lam van het dankoffer weggenomen wordt, en de priester zal ze in rook laten opgaan op het altaar, op de vuuroffers van de HEERE; en de priester zal voor hem verzoening doen over zijn zonde, die hij gezondigd heeft, en het zal hem vergeven worden.", "Ps 147:19": "Hij maakt aan Jakob Zijn woorden bekend, aan Israël Zijn inzettingen en Zijn rechten.", "Fil 3:21": "Die ons vernederde lichaam veranderen zal, opdat het gelijkvormig wordt aan Zijn heerlijk lichaam, naar de werking waardoor Hij ook alle dingen aan Zichzelf kan onderwerpen.", "Hebr 13:4": "Het huwelijk is eerbaar onder allen, en het huwelijksbed onbevlekt; maar hoereerders en overspelers zal God oordelen.", "Num 19:14": "Dit is de wet, wanneer een mens gestorven is in een tent: ieder die in die tent binnengaat, en ieder die in die tent is, zal zeven dagen onrein zijn.", "Lev 18:19": "Ook zult u tot de vrouw in de afzondering van haar onreinheid niet naderen, om haar schaamte te ontdekken.", "Num 19:22": "Ja, alles wat die onreine aangeraakt zal hebben, zal onrein zijn; en de ziel die dat aangeraakt zal hebben, zal onrein zijn tot de avond.", "Lev 11:32": "Ook alles waarop iets van hen vallen zal, als ze dood zijn, zal onrein zijn: hetzij een houten vat, of een kleed, of een vel, of een zak, of enig voorwerp waarmee werk gedaan wordt; het zal in het water gestoken worden, en onrein zijn tot de avond; daarna zal het rein zijn.", "Ex 29:35": "U zult dan aan Aäron en aan zijn zonen zo doen, naar alles wat Ik u geboden heb; zeven dagen zult u hun hand vullen.", "Num 9:6": "Toen waren er mannen geweest, die over het dode lichaam van een mens onrein waren, en op diezelfde dag het pascha niet hadden kunnen houden; daarom naderden zij voor het aangezicht van Mozes, en voor het aangezicht van Aäron op diezelfde dag.", "Lev 14:46-57": "En wie in dat huis gaat op enige dag dat men het toegesloten heeft, zal onrein zijn tot aan de avond. Wie ook in dat huis ligt te slapen, zal zijn kleren wassen; evenzo, wie in dat huis eet, zal zijn kleren wassen. Maar als de priester weer ingegaan zal zijn, en merkt dat, zie, die plaag aan dat huis niet uitgespreid is, nadat het huis bestreken zal zijn, zal de priester dat huis rein verklaren, omdat die plaag genezen is.", "Lev 11:47": "Om onderscheid te maken tussen het onreine en het reine, en tussen het gedierte dat men mag eten en het gedierte dat men niet eten mag.", "Ezech 44:23": "En zij zullen Mijn volk onderscheid leren tussen het heilige en het onheilige, en hun het onderscheid bekend maken tussen het onreine en het reine.", "Num 25:13": "En hij zal hebben, en zijn nageslacht na hem, het verbond van het eeuwige priesterschap, omdat hij voor zijn God geijverd heeft, en verzoening gedaan heeft voor de kinderen van Israël.", "Deut 23:11": "Maar het zal gebeuren dat hij zich tegen het naken van de avond met water zal baden; en als de zon ondergegaan is, zal hij tot binnen het leger komen.", "Lev 11:1": "En de HEERE sprak tot Mozes en tot Aäron, en zei tegen hen:", "Mark 7:2-9": "En toen zij zagen dat sommigen van Zijn discipelen met onreine, dat wil zeggen, met ongewassen handen brood aten, berispten zij hen. Want de Farizeeën en alle Joden eten niet, tenzij zij eerst de handen dikwijls wassen, en zo de overleveringen van de ouden vasthouden. En wanneer zij van de markt komen, eten zij niet, tenzij zij eerst gewassen zijn. En er zijn nog vele andere dingen, die zij aangenomen hebben om vast te houden, namelijk het wassen van drinkbekers, en kannen, en koperen vaten, en bedden.", "Num 15:25": "En de priester zal de verzoening doen voor de hele vergadering van de kinderen van Israël, en het zal hun vergeven worden; want het was een afdwaling, en zij hebben hun offerande gebracht, een vuuroffer voor de HEERE, en hun zondoffer, voor het aangezicht van de HEERE, over hun afdwaling.", "Lev 12:4": "Daarna zal zij drieëndertig dagen blijven in het bloed van haar reiniging; niets heiligs zal zij aanraken, en tot het heiligdom zal zij niet komen, totdat de dagen van haar reiniging vervuld zijn.", "Ezech 23:38": "Nog hebben zij Mij dit aangedaan: zij hebben Mijn heiligdom op diezelfde dag verontreinigd, en Mijn sabbatten ontheiligd.", "Lev 15:31-33": "Zo zult u de kinderen van Israël afzonderen van hun onreinheid; opdat zij in hun onreinheid niet sterven, wanneer zij Mijn tabernakel, die in hun midden is, zouden verontreinigen. Dit is de wet van hem die de vloed heeft, en van hem uit wie het zaad van de gemeenschap uitgaat, zodat hij daardoor onrein wordt; Alsook van een vrouw die zwak is door haar afzondering, en van hem die van zijn vloed is vloeiende, voor een man, en voor een vrouw; en voor een man, die bij een onreine zal hebben gelegen.", "Ef 5:11": "En heb geen gemeenschap met de onvruchtbare werken van de duisternis, maar bestraf ze veeleer.", "Lev 23:19": "Ook zult u een geitenbok tot zondoffer, en twee eenjarige lammeren tot dankoffer bereiden.", "Lev 14:19": "De priester zal ook het zondoffer bereiden, en voor hem die van zijn onreinheid te reinigen is verzoening doen; en daarna zal hij het brandoffer slachten.", "Num 19:11": "Wie een dode aanraakt, welk dood lichaam van een mens dan ook, die zal zeven dagen onrein zijn.", "1 Petr 2:11": "Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel;", "Num 19:19": "En de reine zal de onreine op de derde dag, en op de zevende dag besprenkelen; en op de zevende dag zal hij hem ontzondigen; en hij zal zijn kleren wassen, en zichzelf met water baden, en op de avond rein zijn.", "Lev 22:4-8": "Niemand van het nageslacht van Aäron die melaats is, of een vloed heeft, zal van die heilige dingen eten, totdat hij rein is; alsook wie iets aanraakt dat onrein is door een dood lichaam, of een man aan wie het zaad van de gemeenschap ontgaat. Of wie ook maar enig kruipend gedierte zal hebben aangeraakt waardoor hij onrein wordt, of een mens waardoor hij onrein wordt, naar al zijn onreinheid; De mens die dat zal hebben aangeraakt, zal onrein zijn tot aan de avond, en hij zal van die heilige dingen niet eten, maar zal zijn lichaam met water baden.", "Lev 22:4": "Niemand van het nageslacht van Aäron die melaats is, of een vloed heeft, zal van die heilige dingen eten, totdat hij rein is; alsook wie iets aanraakt dat onrein is door een dood lichaam, of een man aan wie het zaad van de gemeenschap ontgaat.", "Lev 16:26": "En hij die de bok, die een weggaande bok was, weggebracht heeft, zal zijn klederen wassen, en zijn lichaam met water baden; en daarna zal hij in het kamp komen.", "Klaagl 1:9": "Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar einde, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot.", "Lev 13:2-5": "Een mens, als er in het vel van zijn vlees een gezwel, of gezweer, of witte blaar zal zijn, welke in het vel van zijn vlees tot een plaag van de melaatsheid zou worden, hij zal dan naar de priester Aäron, of naar een van zijn zonen, de priesters, gebracht worden. En de priester zal de plaag in het vel van het vlees bekijken; als het haar in die plaag in wit veranderd is, en het aanzien van de plaag dieper is dan het vel van zijn vlees, is het de plaag van de melaatsheid; als de priester hem bekeken zal hebben, zal hij hem onrein verklaren. Maar als de blaar in het vel van zijn vlees wit is, en haar aanzien niet dieper is dan het vel, en het haar niet in wit veranderd is, zal de priester hem, die de plaag heeft, zeven dagen opsluiten.", "Num 19:7-12": "Dan zal de priester zijn kleren wassen, en zijn lichaam met water baden, en daarna in het leger gaan; en de priester zal onrein zijn tot de avond. Ook hij die haar verbrand heeft, zal zijn kleren met water wassen, en zijn lichaam met water baden, en onrein zijn tot de avond. En een rein man zal de as van deze vaars verzamelen, en buiten het leger op een reine plaats wegleggen; en het zal bewaard worden voor de gemeenschap van de kinderen van Israël, tot het water van de afzondering; het is een ontzondiging.", "Lev 4:20": "En hij zal met deze var doen zoals hij met de var van het zondoffer gedaan heeft, zo zal hij met hem doen; en de priester zal voor hen verzoening doen, en het zal hun vergeven worden.", "Num 4:1": "En de HEERE sprak tot Mozes en tot Aäron:", "Lev 15:19-33": "Maar als een vrouw een vloed zal hebben, en haar vloed van bloed in haar vlees is, dan zal zij zeven dagen in haar afzondering zijn; en ieder die haar aanraakt, zal onrein zijn tot aan de avond. En alles waarop zij in haar afzondering zal hebben gelegen, zal onrein zijn; alsook alles waarop zij zal hebben gezeten, zal onrein zijn. En ieder die haar bed aanraakt, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.", "Num 19:13": "Ieder die een dode, het dode lichaam van een mens die gestorven is, aanraakt, en zich niet ontzondigd zal hebben, die verontreinigt de tabernakel van de HEERE; daarom zal die ziel uitgeroeid worden uit Israël; omdat het water van de afzondering niet op hem gesprenkeld is, zal hij onrein zijn; zijn onreinheid is nog in hem.", "Num 19:1": "Verder sprak de HEERE tot Mozes en tot Aäron, en zei:", "Lev 8:6": "En Mozes liet Aäron en zijn zonen naderbij komen, en waste hen met dat water.", "Matt 15:2": "Waarom overtreden Uw discipelen de overlevering van de ouden? Want zij wassen hun handen niet wanneer zij brood zullen eten.", "Lev 11:31-38": "Die zullen voor u onrein zijn onder al het kruipend gedierte; wie ze aangeraakt zal hebben, als ze dood zijn, zal onrein zijn tot de avond. Ook alles waarop iets van hen vallen zal, als ze dood zijn, zal onrein zijn: hetzij een houten vat, of een kleed, of een vel, of een zak, of enig voorwerp waarmee werk gedaan wordt; het zal in het water gestoken worden, en onrein zijn tot de avond; daarna zal het rein zijn. En elk aarden vat waarin iets van hen zal zijn gevallen, alles wat erin is zal onrein zijn, en u zult het breken.", "2 Sam 11:4": "Toen zond David boden, en liet haar halen. En toen zij bij hem gekomen was, lag hij bij haar (zij had zich namelijk van haar onreinheid gezuiverd), daarna keerde zij terug naar haar huis.", "Hebr 9:10": "het bestond alleen in spijzen, en dranken, en verscheidene wassingen en instellingen voor het vlees, opgelegd tot de tijd van verbetering.", "Num 31:11-20": "En zij namen alle buit en alle roof, van mensen en van beesten. Daarna brachten zij de gevangenen, en de buit, en de roof, tot Mozes en tot Eleazar, de priester, en tot de vergadering van de kinderen van Israël, in het leger, in de vlakke velden van Moab, die aan de Jordaan bij Jericho liggen. Maar Mozes en Eleazar, de priester, en alle leiders van de vergadering, gingen naar buiten, hun tegemoet, tot buiten voor het leger.", "Lev 14:22": "alsook twee tortelduiven, of twee jonge duiven, die zijn hand bereiken kan, waarvan de ene als zondoffer, en de andere als brandoffer zal zijn.", "Mark 5:25": "En een zekere vrouw, die twaalf jaar lang aan bloedvloeiingen geleden had,", "Ex 19:14": "Toen ging Mozes van de berg af naar het volk, en hij heiligde het volk; en zij wasten hun kleren.", "Lev 13:59": "Dit is de wet van de plaag van de melaatsheid, van een wollen of linnen kleed, of een scheerdraad, of een inslag, of alle vellentuig, om dat rein te verklaren, of onrein te verklaren.", "Luk 8:43": "En een vrouw die twaalf jaar lang bloedvloeiingen gehad had, en die al haar middelen van bestaan aan artsen had uitgegeven, maar door niemand genezen had kunnen worden,", "Lev 13:31-33": "Maar als de priester de plaag van de schurftheid bekeken zal hebben, dat, zie, haar aanzien niet dieper is dan het vel, en er geen zwart haar op is, zal de priester hem, die de plaag van de schurftheid heeft, zeven dagen laten opsluiten. Daarna zal de priester die plaag op de zevende dag bekijken; indien, zie, de schurftheid niet uitgespreid is, en er geen geelachtig haar op is, en het aanzien van de schurftheid niet dieper is dan het vel; Zal hij zich laten scheren; maar de schurftheid zal hij niet scheren; en de priester zal hem, die de schurftheid heeft, opnieuw zeven dagen laten opsluiten.", "Num 6:12": "Daarna zal hij de dagen van zijn Nazireeërschap voor de HEERE afzonderen, en een eenjarig lam brengen als schuldoffer; en de vorige dagen zullen vervallen, omdat zijn Nazireeërschap verontreinigd was.", "Ex 12:1": "De HEERE nu had tot Mozes en tot Aäron in Egypteland gesproken en gezegd:", "Matt 9:20": "(En zie, een vrouw die twaalf jaar bloedvloeiingen had gehad, kwam van achteren bij Hem en raakte de zoom van Zijn kleed aan;", "Lev 19:21": "En hij zal zijn schuldoffer de HEERE aan de deur van de tent van de samenkomst brengen, een ram ten schuldoffer.", "Lev 13:1": "Verder sprak de HEERE tot Mozes en tot Aäron, en Hij zei:", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Lev 13:46": "Al de dagen waarin deze plaag in hem zal zijn, zal hij onrein zijn; onrein is hij, hij zal alleen wonen; buiten het leger zal zijn woning zijn.", "Lev 14:8": "Die nu te reinigen is, zal zijn kleren wassen, en al zijn haar afscheren, en zich in het water afwassen, dan zal hij rein zijn; daarna zal hij in het leger komen, maar zal buiten zijn tent zeven dagen blijven.", "Lev 22:6": "De mens die dat zal hebben aangeraakt, zal onrein zijn tot aan de avond, en hij zal van die heilige dingen niet eten, maar zal zijn lichaam met water baden.", "Num 19:20": "Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden van de gemeenschap uitgeroeid worden; want hij heeft het heiligdom van de HEERE verontreinigd, het water van de afzondering is niet op hem gesprenkeld, hij is onrein.", "Ezech 5:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE (omdat u Mijn heiligdom verontreinigd hebt met al uw verfoeisels, en met al uw gruwelen), zeker zal Ik ook u daarom verminderen, en Mijn oog zal u niet verschonen, en Ik zal ook niet sparen!", "Jer 33:8": "En Ik zal hen reinigen van al hun ongerechtigheid, waarmee zij tegen Mij gezondigd hebben; en Ik zal al hun ongerechtigheden vergeven, waarmee zij tegen Mij gezondigd en waarmee zij tegen Mij overtreden hebben.", "Num 29:11": "Een geitenbok tot een zondoffer, behalve het zondoffer van de verzoeningen, en het gedurige brandoffer; en zijn spijsoffer, met hun drankoffers.", "Gen 31:34": "Maar Rachel had de terafim genomen, en had ze in het zadeltuig van de kameel gelegd, en zij zat erop. En Laban doorzocht de hele tent, en hij vond niets.", "Lev 15:4-13": "Elk bed waarop hij, die de vloed heeft, zal liggen, zal onrein zijn, en al het voorwerp waarop hij zal zitten, zal onrein zijn. Ieder ook, die zijn bed aanraakt, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond. En wie op dat voorwerp zit waarop hij, die de vloed heeft, gezeten zal hebben, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond.", "Num 9:10": "Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "Lev 15:5-13": "Ieder ook, die zijn bed aanraakt, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond. En wie op dat voorwerp zit waarop hij, die de vloed heeft, gezeten zal hebben, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond. En wie het vlees aanraakt van hem die de vloed heeft, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.", "Lev 14:18": "Wat nog over is van die olie, die in de hand van de priester geweest is, zal hij doen op het hoofd van hem die te reinigen is; zo zal de priester over hem verzoening doen voor het aangezicht van de HEERE.", "Lev 7:1-7": "Dit is nu de wet van het schuldoffer: het is allerheiligst. In de plaats waar zij het brandoffer slachten, zullen zij het schuldoffer slachten; en men zal het bloed ervan rondom op het altaar sprenkelen. En daarvan zal men al zijn vet offeren: de staart, en het vet dat het ingewand bedekt;", "Lev 14:10": "En op de achtste dag zal hij twee volkomen lammeren, en een eenjarig volkomen schaap nemen, alsook drie tienden meelbloem als spijsoffer, met olie gemengd, en een log olie.", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Lev 21:23": "Doch tot het voorhangsel zal hij niet komen, en tot het altaar niet toetreden, omdat een gebrek in hem is; opdat hij Mijn heiligdommen niet ontheiligt; want Ik ben de HEERE, die hen heiligt!", "Num 29:6": "Behalve het brandoffer van de maand, en zijn spijsoffer, en het gedurige brandoffer, en zijn spijsoffer, met hun drankoffers, naar hun wijze, tot een liefelijke reuk, een vuuroffer voor de HEERE.", "1 Sam 21:5": "David antwoordde de priester, en zei tegen hem: Ja zeker, de vrouwen zijn ons onthouden geweest, gisteren en eergisteren, toen ik uitging, en de spullen van de knechten zijn heilig; en het is brood dat op zekere manier gewoon is, temeer omdat er heden ander in de spullen geheiligd zal worden.", "Neh 9:13": "En U bent neergedaald op de berg Sinaï, en hebt met hen gesproken uit de hemel; en U hebt hun rechtmatige rechten gegeven, en getrouwe wetten, goede inzettingen en geboden.", "Lev 2:13": "En elk offer van uw spijsoffer zult u met zout zouten, en het zout van het verbond van uw God mag u niet laten ontbreken bij uw spijsoffer; met heel uw offer zult u zout offeren.", "Lev 5:2-13": "Of wanneer een mens iets onreins zal hebben aangeraakt, hetzij het dode aas van een wild onrein dier, of het dode aas van onrein vee, of het dode aas van onrein kruipend gedierte; ook al is het voor hem verborgen geweest, toch is hij onrein en schuldig. Of als hij de onreinheid van een mens zal hebben aangeraakt, wat voor onreinheid het ook is waardoor hij onrein wordt; en het is voor hem verborgen geweest, maar hij komt erachter, dan is hij schuldig. Of als een mens zal hebben gezworen, onbedacht met zijn lippen uitsprekend om kwaad te doen of om goed te doen, wat de mens ook onbedacht uitspreekt in een eed; en het is voor hem verborgen geweest, maar hij komt erachter, dan is hij aan een van die dingen schuldig.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Lev 13:45": "Verder zullen de kleren van de melaatse, in wie die plaag is, gescheurd zijn, en zijn hoofd zal onbedekt zijn, en hij zal zijn bovenlip bedekken; daarbij zal hij roepen: Onrein, onrein!", "Num 6:11": "De priester nu zal er een bereiden tot zondoffer, en een tot brandoffer, en zal voor hem verzoening doen, omdat hij aan het dode lichaam gezondigd heeft; zo zal hij zijn hoofd op diezelfde dag heiligen.", "Deut 23:10": "Wanneer iemand onder u is die niet rein is door iets wat hem 's nachts is overkomen, dan zal hij naar buiten, tot buiten het leger gaan; hij zal niet tot binnen het leger komen.", "Mark 7:20-23": "En Hij zei: Wat uit de mens komt, dat verontreinigt de mens. Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden, diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid.", "1 Sam 21:4": "En de priester antwoordde David, en zei: Er is geen gewoon brood onder mijn hand; maar er is heilig brood, als de knechten zich tenminste van vrouwen onthouden hebben.", "Lev 15:2-13": "Spreek tot de kinderen van Israël, en zeg tegen hen: Iedere man, als hij een vloed heeft uit zijn vlees, zal om zijn vloed onrein zijn. Dit nu zal zijn onreinheid zijn om zijn vloed: of zijn vlees zijn vloed laat druppelen, of zijn vlees van zijn vloed zich verstopt, dat is zijn onreinheid. Elk bed waarop hij, die de vloed heeft, zal liggen, zal onrein zijn, en al het voorwerp waarop hij zal zitten, zal onrein zijn.", "Lev 14:9": "En op de zevende dag zal gebeuren dat hij al zijn haar afscheert, zijn hoofd, en zijn baard, en de wenkbrauwen van zijn ogen; ja, al zijn haar zal hij afscheren, en al zijn kleren wassen, en zijn lichaam met water baden, dan zal hij rein zijn.", "Lev 17:15": "En elke ziel onder de inboorlingen of onder de vreemdelingen, die een dood aas of het verscheurde zal gegeten hebben, die zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond; daarna zal hij rein zijn.", "Num 5:2-4": "Gebied de kinderen van Israël dat zij uit het leger wegzenden alle melaatsen, en alle vloeiende, en allen die onrein zijn van een dode. Van de man tot de vrouw toe zult u hen wegzenden; tot buiten het leger zult u hen wegzenden; zodat zij hun legers niet verontreinigen, in welker midden Ik woon. En de kinderen van Israël deden zo, en zonden hen tot buiten het leger; zoals de HEERE tot Mozes gesproken had, zo deden de kinderen van Israël.", "Lev 13:6": "En de priester zal hem opnieuw op de zevende dag bekijken; indien, zie, de plaag ingetrokken is, en de plaag in het vel niet uitgespreid is, zal de priester hem rein verklaren; het was een verzwering; en hij zal zijn kleren wassen, zo is hij rein.", "Lev 14:10-22": "En op de achtste dag zal hij twee volkomen lammeren, en een eenjarig volkomen schaap nemen, alsook drie tienden meelbloem als spijsoffer, met olie gemengd, en een log olie. De priester nu, die de reiniging doet, zal de man die te reinigen is, en die dingen, stellen voor het aangezicht van de HEERE, aan de deur van de tent der samenkomst. En de priester zal dat ene lam nemen, en het offeren als schuldoffer met de log olie; en zal die als beweegoffer voor het aangezicht van de HEERE bewegen.", "Ps 66:18": "Had ik naar ongerechtigheid met mijn hart gezien, de Heere zou niet gehoord hebben.", "Matt 3:17": "En zie, een stem uit de hemelen zei: Deze is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb!", "Lev 15:1-15": "Verder sprak de HEERE tot Mozes en tot Aäron, en zei: Spreek tot de kinderen van Israël, en zeg tegen hen: Iedere man, als hij een vloed heeft uit zijn vlees, zal om zijn vloed onrein zijn. Dit nu zal zijn onreinheid zijn om zijn vloed: of zijn vlees zijn vloed laat druppelen, of zijn vlees van zijn vloed zich verstopt, dat is zijn onreinheid.", "Num 8:12": "En de Levieten zullen hun handen op het hoofd van de stieren leggen; daarna bereidt u de één als zondoffer, en de ander als brandoffer voor de HEERE, om over de Levieten verzoening te doen.", "Ex 19:15": "En hij zei tot het volk: Weest gereed tegen de derde dag, en nadert niet tot de vrouw.", "Num 31:19": "En u, legert u buiten het leger, zeven dagen; ieder die een mens gedood heeft, en ieder die een gesneuvelde heeft aangeraakt, moet zich op de derde dag en op de zevende dag ontzondigen, u en uw gevangenen.", "Lev 15:5-11": "Ieder ook, die zijn bed aanraakt, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond. En wie op dat voorwerp zit waarop hij, die de vloed heeft, gezeten zal hebben, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond. En wie het vlees aanraakt van hem die de vloed heeft, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.", "Lev 13:47-59": "Verder, als er op een kleed de plaag van de melaatsheid zal zijn, op een wollen kleed, of op een linnen kleed, Of op de scheerdraad, of op de inslag van linnen, of van wol, of op vel, of op enig vellenwerk; En die plaag op het kleed, of op het vel, of op de scheerdraad, of op de inslag, of op enig vellentuig, groenachtig of roodachtig is; het is de plaag van de melaatsheid; daarom zal het aan de priester vertoond worden.", "Lev 15:16-28": "Verder, een man bij wie het zaad van het bijliggen zal zijn uitgegaan, die zal zijn hele vlees met water baden, en onrein zijn tot aan de avond. Ook elk kledingstuk, en elk vel, waaraan het zaad van het bijliggen zal zijn, dat zal met water gewassen worden, en onrein zijn tot aan de avond. Alsook de vrouw, als een man met het zaad van het bijliggen bij haar gelegen zal hebben; daarom zullen zij zich beiden met water baden, en onrein zijn tot aan de avond.", "Num 8:8": "Daarna zullen zij een jonge stier nemen, met zijn spijsoffer van meelbloem, met olie gemengd; en een andere jonge stier zult u nemen als zondoffer.", "Ex 40:30-32": "Hij zette ook het wasvat tussen de tent der samenkomst en het altaar; en hij deed er water in om te wassen. En Mozes en Aäron en zijn zonen wasten daaruit hun handen en hun voeten. Als zij ingingen tot de tent der samenkomst, en als zij tot het altaar naderden, dan wasten zij zich, zoals de HEERE aan Mozes geboden had.", "Lev 16:28": "Wie ze verbrandt, zal zijn klederen wassen, en zijn lichaam met water baden; en daarna zal hij in het kamp komen.", "Ps 51:7": "Zie, ik ben in ongerechtigheid geboren, en in zonde heeft mijn moeder mij ontvangen.", "Num 28:22-24": "Daarna een bok als zondoffer, om voor u verzoening te doen. Behalve het morgenbrandoffer, dat een voortdurend brandoffer is, zult u deze dingen bereiden. Van het achtervolgen van deze dingen zult u per dag, zeven dagen lang, het voedsel van het vuuroffer bereiden tot een liefelijke reuk voor de HEERE; boven dat voortdurende brandoffer zal het bereid worden, met zijn drankoffer.", "Lev 8:33": "Ook zult u uit de deur van de tent der samenkomst, zeven dagen lang, niet weggaan, tot aan de dag dat de dagen van uw vuloffer vervuld worden; want zeven dagen zal men uw handen vullen.", "Ezech 36:25-29": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen. En Ik zal u een nieuw hart geven, en zal een nieuwe geest geven in het binnenste van u; en Ik zal het stenen hart uit uw vlees wegnemen, en zal u een vlezen hart geven. En Ik zal Mijn Geest geven in het binnenste van u; en Ik zal maken dat u in Mijn inzettingen zult wandelen, en Mijn rechten zult bewaren en doen.", "Lev 14:3": "En de priester zal het leger uit gaan; als de priester merkt dat, zie, die plaag van de melaatsheid van de melaatse genezen is,", "Lev 11:33": "En elk aarden vat waarin iets van hen zal zijn gevallen, alles wat erin is zal onrein zijn, en u zult het breken.", "Lev 7:19": "En het vlees dat iets onreins aangeraakt heeft, zal niet gegeten worden; met vuur zal het verbrand worden; maar wat het andere vlees betreft, dat vlees mag ieder die rein is, eten.", "Lev 9:1": "Het gebeurde op de achtste dag, dat Mozes Aäron en zijn zonen riep, en de oudsten van Israël;", "Ef 5:3-11": "Maar hoererij en alle onreinheid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt, ook geen oneerbaarheid, geen zot geklap of grappenmakerij, wat niet betaamt; maar veelmeer dankzegging. Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Ex 29:10-14": "En u zult de stier dichtbij brengen voor de tent van de samenkomst; en Aäron en zijn zonen zullen hun handen op het hoofd van de stier leggen. En u zult de stier slachten voor het aangezicht van de HEERE, bij de deur van de tent van de samenkomst. Daarna zult u van het bloed van de stier nemen, en met uw vinger op de hoornen van het altaar doen; en al het bloed zult u uitgieten bij de bodem van het altaar.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Lev 16:4": "Hij zal de heilige linnen rok aandoen, en een linnen onderbroek zal om zijn lichaam zijn, en met een linnen gordel zal hij zich omgorden, en met een linnen hoofddoek zich bedekken; dit zijn heilige klederen; daarom zal hij zijn lichaam met water baden, als hij ze zal aandoen.", "Ps 147:20": "Zo heeft Hij met geen enkel volk gedaan; en Zijn rechten, die kennen zij niet. Hallelujah!", "Gen 35:2": "Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren;", "Num 29:16-38": "En een geitenbok tot een zondoffer; behalve het gedurige brandoffer, zijn spijsoffer, en zijn drankoffer. Daarna, op de tweede dag: twaalf jonge varren, twee rammen, veertien volkomen eenjarige lammeren; En hun spijsoffer, en hun drankoffers voor de varren, voor de rammen, en voor de lammeren, naar hun aantal, volgens de wijze;", "Spr 1:21": "Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad;", "Ezech 18:6": "Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert;", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "Ps 78:5": "Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken;", "Lev 14:54-57": "Dit is de wet voor elke plaag van de melaatsheid, en voor schurftheid; en voor melaatsheid van de kleren, en van de huizen; alsook voor gezwel, en voor gezweer, en voor blaren;", "Ex 29:4": "Dan zult u Aäron en zijn zonen laten naderen bij de deur van de tent van de samenkomst; en u zult hen met water wassen.", "Deut 24:8": "Wacht u voor de plaag van de melaatsheid, dat u nauwkeurig in acht neemt en doet naar alles wat de Levitische priesters u zullen leren; zoals ik hun geboden heb, zult u erop letten het te doen.", "Spr 3:21": "Mijn zoon! Laat ze niet afwijken van uw ogen; bewaar de degelijke wijsheid en bedachtzaamheid.", "Spr 1:23": "Keert u tot Mijn bestraffing; ziet, Ik zal Mijn Geest overvloedig over u uitstorten; Ik zal Mijn woorden u bekendmaken.", "Ezech 44:5-7": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom. En zeg tegen die opstandigen, tegen het huis van Israël: Zo zegt de Heere HEERE: Het is genoeg geweest voor u, vanwege al uw gruwelen, o huis van Israël. Omdat u vreemden hebt binnengebracht, onbesnedenen van hart en onbesnedenen van vlees, om in Mijn heiligdom te zijn, om dat te ontheiligen, namelijk Mijn huis; toen u Mijn brood, het vette en het bloed offerde, en zij Mijn verbond verbraken, naast al uw gruwelen.", "Num 5:2": "Gebied de kinderen van Israël dat zij uit het leger wegzenden alle melaatsen, en alle vloeiende, en allen die onrein zijn van een dode.", "Hebr 12:15": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.", "Lev 6:28": "En het aarden vat waarin het gekookt is, zal gebroken worden; maar als het in een koperen vat gekookt is, zal het geschuurd en in water gespoeld worden.", "Lev 14:20": "En de priester zal dat brandoffer en dat spijsoffer op het altaar offeren; zo zal de priester de verzoening voor hem doen, en hij zal rein zijn.", "Num 6:14": "Hij dan zal als zijn offer aan de HEERE offeren een volkomen eenjarig lam als brandoffer, en een volkomen eenjarig ooilam als zondoffer, en een volkomen ram als dankoffer.", "Lev 6:1-7": "Verder sprak de HEERE tot Mozes en zei: Als een mens gezondigd heeft en tegen de HEERE door overtreding overtreden zal hebben, doordat hij tegen zijn naaste gelogen heeft over iets dat hem in bewaring gegeven was, of ter hand gesteld was, of over roof, of dat hij met geweld zijn naaste iets onthoudt; Of dat hij het verlorene gevonden heeft, en daarover gelogen heeft, en met valsheid gezworen zal hebben; over iets van alles dat de mens doet, waarin hij zo zondigt.", "Hebr 13:11-13": "Want de lichamen van de dieren waarvan het bloed voor de zonde door de hogepriester in het heiligdom gedragen werd, worden verbrand buiten de legerplaats. Daarom heeft ook Jezus, opdat Hij door Zijn eigen bloed het volk zou heiligen, buiten de poort geleden. Laten wij dan naar Hem uitgaan, buiten de legerplaats, terwijl wij Zijn smaad dragen.", "Num 8:21": "En de Levieten ontzondigden zich, en wasten hun kleren, en Aäron bewoog hen als beweegoffer voor het aangezicht van de HEERE; en Aäron deed verzoening over hen, om hen te reinigen.", "Lev 15:5-7": "Ieder ook, die zijn bed aanraakt, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond. En wie op dat voorwerp zit waarop hij, die de vloed heeft, gezeten zal hebben, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond. En wie het vlees aanraakt van hem die de vloed heeft, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.", "Lev 16:24": "En hij zal zijn lichaam in de heilige plaats met water baden, en zijn klederen aandoen; dan zal hij naar buiten gaan, en zijn brandoffer, en het brandoffer van het volk bereiden, en voor zichzelf en voor het volk verzoening doen.", "Lev 14:34-38": "Als u gekomen zult zijn in het land Kanaän, dat Ik u tot bezitting geven zal, en Ik de plaag van de melaatsheid aan een huis van dat land van uw bezitting gegeven zal hebben, zal hij, van wie dat huis is, komen, en het de priester te kennen geven en zeggen: Het schijnt mij, alsof er een plaag in het huis is. En de priester zal gebieden dat zij dat huis ruimen, voordat de priester komt om die plaag te bezien, zodat niet alles wat in dat huis is onrein wordt; en daarna zal de priester komen om dat huis te bezien.", "Lev 14:31": "Van wat zijn hand bereiken kan, zal de ene als zondoffer, en de andere als brandoffer zijn, naast het spijsoffer; zo zal de priester voor hem die te reinigen is, verzoening doen voor het aangezicht van de HEERE.", "Lev 10:8": "En de HEERE sprak tegen Aäron:", "Ex 40:12": "U zult ook Aäron en zijn zonen laten naderen tot de deur van de tent der samenkomst; en u zult hen met water wassen.", "Deut 4:8": "En welk groot volk is er, dat zulke rechtvaardige inzettingen en rechten heeft als deze hele wet, die ik vandaag voor u leg?", "Ef 4:17-19": "Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed. Verduisterd in het verstand, vervreemd van het leven van God, door de onwetendheid die in hen is, door de verharding van hun hart; Zij hebben, ongevoelig geworden, zichzelf overgegeven aan losbandigheid, om alle onreinheid gierig te bedrijven.", "Num 6:16": "En de priester zal het voor het aangezicht van de HEERE brengen, en zal zijn zondoffer en zijn brandoffer bereiden.", "2 Sam 3:29": "Het moet blijven op het hoofd van Joab, en op heel het huis van zijn vader; en het mag van het huis van Joab niet ontbreken dat er iemand is die een vloed heeft, of melaats is, of zich aan de kruk moet vasthouden, of door het zwaard valt, of gebrek aan brood heeft!", "1 Kor 6:12": "Alle dingen zijn mij toegestaan, maar niet alle dingen zijn nuttig; alle dingen zijn mij toegestaan, maar ik zal mij door niets onder de macht laten brengen.", "Num 19:12": "Op de derde dag zal hij zich daarmee ontzondigen, dan zal hij op de zevende dag rein zijn; maar als hij zich op de derde dag niet ontzondigt, dan zal hij op de zevende dag niet rein zijn.", "Matt 15:19": "Want uit het hart komen voort boze overwegingen, doodslagen, overspelen, hoererijen, dieverijen, valse getuigenissen, lasteringen.", "Lev 14:2": "Dit zal de wet zijn voor de melaatse, op de dag van zijn reiniging: dat hij naar de priester wordt gebracht.", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Num 8:6": "Neem de Levieten uit het midden van de kinderen van Israël, en reinig hen.", "Num 12:14": "En de HEERE zei tegen Mozes: Als haar vader smadelijk in haar gezicht had gespuwd, zou zij dan niet zeven dagen beschaamd zijn? Laat haar zeven dagen buiten het kamp opgesloten worden, en daarna weer toegelaten worden!", "Lev 12:2": "Spreek tot de kinderen van Israël en zeg: Wanneer een vrouw zwanger is geworden en een jongetje gebaard heeft, dan zal zij zeven dagen onrein zijn; net als in de dagen van haar afzondering tijdens haar maandelijkse ongesteldheid zal zij onrein zijn.", "Num 19:21": "Dit zal voor hen een eeuwige inzetting zijn. En hij die het water van de afzondering sprenkelt, zal zijn kleren wassen; ook wie het water van de afzondering aanraakt, die zal onrein zijn tot de avond.", "Lev 5:7-10": "Maar als zijn hand niet zoveel bereiken kan als genoeg is voor een stuk kleinvee, dan zal hij als zijn offer voor de schuld die hij gezondigd heeft, aan de HEERE brengen twee tortelduiven of twee jonge duiven, een als zondoffer en een als brandoffer. En hij zal ze naar de priester brengen, die eerst degene zal offeren die voor het zondoffer is; en hij zal haar hoofd bij haar nek met zijn nagel splijten, maar niet afscheiden. En van het bloed van het zondoffer zal hij tegen de wand van het altaar sprenkelen; maar wat er van dat bloed overblijft, zal uitgeknepen worden tegen de bodem van het altaar; het is een zondoffer."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">Verder</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">sprak</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4872\">HEERE</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H
