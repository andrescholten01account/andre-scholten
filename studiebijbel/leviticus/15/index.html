voorwerp zit waarop hij, die de vloed heeft, gezeten zal hebben, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond.","7":"En wie het vlees aanraakt van hem die de vloed heeft, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.","8":"Als ook hij, die de vloed heeft, op een reine zal gespuugd hebben, dan zal hij zijn kleren wassen, en zal zich met water baden, en onrein zijn tot aan de avond.","9":"Evenzo zal elk zadel, waarop hij, die de vloed heeft, zal gereden hebben, onrein zijn.","10":"En ieder die iets aanraakt dat onder hem geweest zal zijn, zal onrein zijn tot aan de avond; en wie het draagt, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.","11":"Bovendien: ieder die hij, die de vloed heeft, aangeraakt zal hebben zonder zijn handen met water gespoeld te hebben, die zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.","12":"Ook zal het aarden vat, dat hij, die de vloed heeft, aangeraakt zal hebben, gebroken worden; maar elk houten vat zal met water gespoeld worden.","13":"Als hij nu, die de vloed heeft, van zijn vloed gereinigd zal zijn, dan zal hij voor zichzelf zeven dagen tellen voor zijn reiniging, en zijn kleren wassen, en hij zal zijn vlees met levend water baden, dan zal hij rein zijn.","14":"En op de achtste dag zal hij voor zichzelf twee tortelduiven of twee jonge duiven nemen; en zal voor het aangezicht van de HEERE, aan de deur van de tent van de samenkomst komen, en zal ze aan de priester geven.","15":"En de priester zal die bereiden, de één als zondoffer, en de ander als brandoffer; zo zal de priester voor hem, vanwege zijn vloed, verzoening doen voor het aangezicht van de HEERE.","16":"Verder, een man bij wie het zaad van het bijliggen zal zijn uitgegaan, die zal zijn hele vlees met water baden, en onrein zijn tot aan de avond.","17":"Ook elk kledingstuk, en elk vel, waaraan het zaad van het bijliggen zal zijn, dat zal met water gewassen worden, en onrein zijn tot aan de avond.","18":"Alsook de vrouw, als een man met het zaad van het bijliggen bij haar gelegen zal hebben; daarom zullen zij zich beiden met water baden, en onrein zijn tot aan de avond.","19":"Maar als een vrouw een vloed zal hebben, en haar vloed van bloed in haar vlees is, dan zal zij zeven dagen in haar afzondering zijn; en ieder die haar aanraakt, zal onrein zijn tot aan de avond.","20":"En alles waarop zij in haar afzondering zal hebben gelegen, zal onrein zijn; alsook alles waarop zij zal hebben gezeten, zal onrein zijn.","21":"En ieder die haar bed aanraakt, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.","22":"Ook ieder die enig voorwerp aanraakt waarop zij zal hebben gezeten, zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.","23":"Zelfs als het op het bed geweest zal zijn, of op het voorwerp waarop zij zat, wanneer hij dat aanraakte, zal hij onrein zijn tot aan de avond.","24":"Evenzo, als iemand werkelijk bij haar gelegen heeft, zodat haar afzondering op hem is, dan zal hij zeven dagen onrein zijn; bovendien zal elk bed, waarop hij zal hebben gelegen, onrein zijn.","25":"Wanneer ook een vrouw, veel dagen buiten de tijd van haar afzondering, van de vloed van haar bloed zal vloeien, of wanneer zij zal vloeien langer dan haar afzondering duurt, dan zal zij al de dagen van de vloed van haar onreinheid, zoals in de dagen van haar afzondering, onrein zijn.","26":"Elk bed waarop zij al de dagen van haar vloed zal hebben gelegen, zal voor haar zijn als het bed van haar afzondering; en elk voorwerp waarop zij zal hebben gezeten, zal onrein zijn, zoals de onreinheid van haar afzondering.","27":"En al wie die dingen aanraakt, zal onrein zijn; daarom zal hij zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond.","28":"Maar als zij van haar vloed rein wordt, dan zal zij voor zichzelf zeven dagen tellen, daarna zal zij rein zijn.","29":"En op de achtste dag zal zij voor zichzelf twee tortelduiven, of twee jonge duiven nemen, en zij zal ze naar de priester brengen, aan de deur van de tent van de samenkomst.","30":"Dan zal de priester de één als zondoffer en de ander als brandoffer bereiden; en de priester zal voor haar, vanwege de vloed van haar onreinheid, verzoening doen voor het aangezicht van de HEERE.","31":"Zo zult u de kinderen van Israël afzonderen van hun onreinheid; opdat zij in hun onreinheid niet sterven, wanneer zij Mijn tabernakel, die in hun midden is, zouden verontreinigen.","32":"Dit is de wet van hem die de vloed heeft, en van hem uit wie het zaad van de gemeenschap uitgaat, zodat hij daardoor onrein wordt;","33":"Alsook van een vrouw die zwak is door haar afzondering, en van hem die van zijn vloed is vloeiende, voor een man, en voor een vrouw; en voor een man, die bij een onreine zal hebben gelegen."},"SV":{"1":"Verder sprak de HEERE tot Mozes en tot Aäron, zeggende:","2":"Spreekt tot de kinderen Israëls, en zegt tot hen: Een ieder man, als hij vloeiende zal zijn uit zijn vlees, zal om zijn vloed onrein zijn.","3":"Dit nu zal zijn onreinigheid om zijn vloed zijn: zo zijn vlees zijn vloed uitzevert, of zijn vlees van zijn vloed zich verstopt, dat is zijn onreinigheid.","4":"Alle leger, waarop hij, die den vloed heeft, zal liggen, zal onrein zijn, en alle tuig, waarop hij zal zitten, zal onrein zijn.","5":"Een ieder ook, die zijn leger zal aanroeren, zal zijn klederen wassen, en zich met water baden, en zal onrein zijn tot aan den avond.","6":"En die op dat tuig zit, waarop hij, die den vloed heeft, gezeten zal hebben, zal zijn klederen wassen, en zich met water baden, en zal onrein zijn tot aan den avond.","7":"En die het vlees desgenen, die den vloed heeft, aanroert, zal zijn klederen wassen, en zich met water baden, en onrein zijn tot aan den avond.","8":"Als ook hij, die den vloed heeft, op een reine zal gespogen hebben, dan zal hij zijn klederen wassen, en zal zich met water baden, en onrein zijn tot aan den avond.","9":"Insgelijks alle zadel, waarop hij, die den vloed heeft, zal gereden hebben, zal onrein zijn.","10":"En al wie iets aanroert, dat onder hem zal geweest zijn, zal onrein zijn tot aan den avond; en die hetzelve draagt, zal zijn klederen wassen, en zich met water baden, en onrein zijn tot aan den avond.","11":"Daartoe een ieder, wien hij, die den vloed heeft, zal aangeroerd hebben, zonder zijn handen met water gespoeld te hebben, die zal zijn klederen wassen, en zich met water baden, en onrein zijn tot aan den avond.","12":"Ook het aarden vat, hetwelk hij, die den vloed heeft, zal aangeroerd hebben, zal gebroken worden; maar alle houten vat zal met water gespoeld worden.","13":"Als hij nu, die den vloed heeft, van zijn vloed gereinigd zal zijn, zo zal hij tot zijn reiniging zeven dagen voor zich tellen, en zijn klederen wassen, en hij zal zijn vlees met levend water baden, zo zal hij rein zijn.","14":"En op den achtsten dag zal hij voor zich twee tortelduiven of twee jonge duiven nemen; en zal voor het aangezicht des HEEREN, aan de deur van de tent der samenkomst komen, en zal ze den priester geven.","15":"En de priester zal die bereiden, een ten zondoffer, en een ten brandoffer; zo zal de priester over hem voor het aangezicht des HEEREN, vanwege zijn vloed, verzoening doen.","16":"Verder een man, als van hem het zaad des bijliggens zal uitgegaan zijn, die zal zijn ganse vlees met water baden, en onrein zijn tot aan den avond.","17":"Ook alle kleed, en alle vel, aan hetwelk het zaad des bijliggens wezen zal, dat zal met water gewassen worden, en onrein zijn tot aan den avond.","18":"Mitsgaders de vrouw, als een man met het zaad des bijliggens bij haar gelegen zal hebben; daarom zullen zij zich met water baden, en onrein zijn tot aan den avond.","19":"Maar als een vrouw vloeiende zijn zal, zijnde haar vloed van bloed in haar vlees, zo zal zij zeven dagen in haar afzondering zijn; en al wie haar aanroert, zal onrein zijn tot aan den avond.","20":"En al hetgeen, waarop zij in haar afzondering zal gelegen hebben, zal onrein zijn; mitsgaders alles, waarop zij zal gezeten hebben, zal onrein zijn.","21":"En al wie haar leger aanroert, zal zijn klederen wassen, en zich met water baden, en onrein zijn tot aan den avond.","22":"Ook al wie enig tuig, waarop zij gezeten zal hebben, aanroert, zal zijn klederen wassen, en zich met water baden, en onrein zijn tot aan den avond.","23":"Zelfs indien het op het leger geweest zal zijn, of op het tuig, waarop zij zat, als hij dat aanroerde, hij zal onrein zijn tot aan den avond.","24":"Insgelijks zo iemand zekerlijk bij haar gelegen heeft, dat haar afzondering op hem zij, zo zal hij zeven dagen onrein zijn; daartoe alle leger, waarop hij zal gelegen hebben, zal onrein zijn.","25":"Wanneer ook een vrouw, vele dagen buiten den tijd harer afzondering, van den vloed haars bloeds vloeien zal, of wanneer zij vloeien zal boven hare afzondering, zij zal al den dagen van den vloed harer onreinigheid, als in de dagen harer afzondering onrein zijn.","26":"Alle leger, waarop zij al de dagen haars vloeds gelegen zal hebben, zal haar zijn als het leger harer afzondering; en alle tuig, waarop zij zal gezeten hebben, zal onrein zijn, naar de onreinigheid harer afzondering.","27":"En zo wie die dingen aanroert, zal onrein zijn; daarom zal hij zijn klederen wassen, en zich met water baden, en onrein zijn tot aan den avond.","28":"Maar als zij van haar vloed rein wordt, dan zal zij voor zich zeven dagen tellen, daarna zal zij rein zijn.","29":"En op den achtsten dag zal zij voor zich twee tortelduiven, of twee jonge duiven nemen, en zij zal die tot den priester brengen, aan de deur van de tent der samenkomst.","30":"Dan zal de priester een ten zondoffer en een ten brandoffer bereiden; en de priester zal voor haar, van den vloed harer onreinigheid, verzoening doen voor het aangezicht des HEEREN.","31":"Alzo zult gij de kinderen Israëls afzonderen van hun onreinigheid; opdat zij in hun onreinigheid niet sterven, als zij Mijn tabernakel, die in het midden van hen is, verontreinigen zouden.","32":"Dit is de wet desgenen, die den vloed heeft, en van wien het zaad der bijligging uitgaat; zodat hij daardoor onrein wordt;","33":"Mitsgaders van een zwakke vrouw in haar afzondering, en van degene, die van zijn vloed is vloeiende, voor een man, en voor een vrouw; en voor een man, die bij een onreine zal gelegen hebben."},"KJV":{"1":"And the LORD spake unto Moses and to Aaron, saying,","2":"Speak unto the children of Israel, and say unto them, When any man hath a running issue out of his flesh, *because of* his issue he *is* unclean.","3":"And this shall be his uncleanness in his issue: whether his flesh run with his issue, or his flesh be stopped from his issue, it *is* his uncleanness.","4":"Every bed, whereon he lieth that hath the issue, is unclean: and every thing, whereon he sitteth, shall be unclean.","5":"And whosoever toucheth his bed shall wash his clothes, and bathe *himself* in water, and be unclean until the even.","6":"And he that sitteth on *any* thing whereon he sat that hath the issue shall wash his clothes, and bathe *himself* in water, and be unclean until the even.","7":"And he that toucheth the flesh of him that hath the issue shall wash his clothes, and bathe *himself* in water, and be unclean until the even.","8":"And if he that hath the issue spit upon him that is clean; then he shall wash his clothes, and bathe *himself* in water, and be unclean until the even.","9":"And what saddle soever he rideth upon that hath the issue shall be unclean.","10":"And whosoever toucheth any thing that was under him shall be unclean until the even: and he that beareth *any of* those things shall wash his clothes, and bathe *himself* in water, and be unclean until the even.","11":"And whomsoever he toucheth that hath the issue, and hath not rinsed his hands in water, he shall wash his clothes, and bathe *himself* in water, and be unclean until the even.","12":"And the vessel of earth, that he toucheth which hath the issue, shall be broken: and every vessel of wood shall be rinsed in water.","13":"And when he that hath an issue is cleansed of his issue; then he shall number to himself seven days for his cleansing, and wash his clothes, and bathe his flesh in running water, and shall be clean.","14":"And on the eighth day he shall take to him two turtledoves, or two young pigeons, and come before the LORD unto the door of the tabernacle of the congregation, and give them unto the priest:","15":"And the priest shall offer them, the one *for* a sin offering, and the other *for* a burnt offering; and the priest shall make an atonement for him before the LORD for his issue.","16":"And if any man's seed of copulation go out from him, then he shall wash all his flesh in water, and be unclean until the even.","17":"And every garment, and every skin, whereon is the seed of copulation, shall be washed with water, and be unclean until the even.","18":"The woman also with whom man shall lie *with* seed of copulation, they shall *both* bathe *themselves* in water, and be unclean until the even.","19":"And if a woman have an issue, *and* her issue in her flesh be blood, she shall be put apart seven days: and whosoever toucheth her shall be unclean until the even.","20":"And every thing that she lieth upon in her separation shall be unclean: every thing also that she sitteth upon shall be unclean.","21":"And whosoever toucheth her bed shall wash his clothes, and bathe *himself* in water, and be unclean until the even.","22":"And whosoever toucheth any thing that she sat upon shall wash his clothes, and bathe *himself* in water, and be unclean until the even.","23":"And if it *be* on *her* bed, or on any thing whereon she sitteth, when he toucheth it, he shall be unclean until the even.","24":"And if any man lie with her at all, and her flowers be upon him, he shall be unclean seven days; and all the bed whereon he lieth shall be unclean.","25":"And if a woman have an issue of her blood many days out of the time of her separation, or if it run beyond the time of her separation; all the days of the issue of her uncleanness shall be as the days of her separation: she *shall be* unclean.","26":"Every bed whereon she lieth all the days of her issue shall be unto her as the bed of her separation: and whatsoever she sitteth upon shall be unclean, as the uncleanness of her separation.","27":"And whosoever toucheth those things shall be unclean, and shall wash his clothes, and bathe *himself* in water, and be unclean until the even.","28":"But if she be cleansed of her issue, then she shall number to herself seven days, and after that she shall be clean.","29":"And on the eighth day she shall take unto her two turtles, or two young pigeons, and bring them unto the priest, to the door of the tabernacle of the congregation.","30":"And the priest shall offer the one *for* a sin offering, and the other *for* a burnt offering; and the priest shall make an atonement for her before the LORD for the issue of her uncleanness.","31":"Thus shall ye separate the children of Israel from their uncleanness; that they die not in their uncleanness, when they defile my tabernacle that *is* among","32":"This *is* the law of him that hath an issue, and *of him* whose seed goeth from him, and is defiled","33":"And of her that is sick of her flowers, and of him that hath an issue, of the man, and of the woman, and of him that lieth with her that is unclean."}},"tsk":{"1":[{"kopje":"Aäron","refs":["Lev 11:1","Lev 13:1","Ps 25:14","Amos 3:7","Hebr 1:1"]}],"2":[{"kopje":"tot de","refs":["Deut 4:7","Deut 4:8","Neh 9:13","Neh 9:14","Ps 78:5","Ps 147:19","Ps 147:20","Rom 3:2"]},{"kopje":"Iedere man","refs":["Lev 22:4","Num 5:2","2 Sam 3:29","Matt 9:20","Mark 5:25","Mark 7:20-23","Luk 8:43"]}],"4":[{"kopje":"onrein zijn","refs":["1 Kor 15:33","Ef 5:11","Tit 1:15"]}],"9":[{"kopje":"zadel","refs":["Gen 31:34",  is his uncleanness.","4":"Every <span class=\"wl wl-kjv\" data-code=\"H4904\">bed,</span> whereon he <span class=\"wl wl-kjv\" data-code=\"H7901\">lieth</span> that hath the <span class=\"wl wl-kjv\" data-code=\"H2100\">issue,</span> is <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> and every <span class=\"wl wl-kjv\" data-code=\"H3627\">thing,</span> whereon he <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth,</span> shall be unclean.","5":"And <span class=\"wl wl-kjv\" data-code=\"H376\">whosoever</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> his <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","6":"And he that <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth</span> on any <span class=\"wl wl-kjv\" data-code=\"H3627\">thing</span> whereon he <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> that hath the <span class=\"wl wl-kjv\" data-code=\"H2100\">issue</span> shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","7":"And he that <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of him that hath the <span class=\"wl wl-kjv\" data-code=\"H2100\">issue</span> shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","8":"And if he that hath the <span class=\"wl wl-kjv\" data-code=\"H2100\">issue</span> <span class=\"wl wl-kjv\" data-code=\"H7556\">spit</span> upon him that is <span class=\"wl wl-kjv\" data-code=\"H2889\">clean;</span> then he shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","9":"And what <span class=\"wl wl-kjv\" data-code=\"H4817\">saddle</span> soever he <span class=\"wl wl-kjv\" data-code=\"H7392\">rideth</span> upon that hath the <span class=\"wl wl-kjv\" data-code=\"H2100\">issue</span> shall be unclean.","10":"And whosoever <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> any thing that was under him shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the <span class=\"wl wl-kjv\" data-code=\"H6153\">even:</span> and he that <span class=\"wl wl-kjv\" data-code=\"H5375\">beareth</span> any of those things shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","11":"And whomsoever he <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> that hath the <span class=\"wl wl-kjv\" data-code=\"H2100\">issue,</span> and hath not <span class=\"wl wl-kjv\" data-code=\"H7857\">rinsed</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> of <span class=\"wl wl-kjv\" data-code=\"H2789\">earth,</span> that he <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> which hath the <span class=\"wl wl-kjv\" data-code=\"H2100\">issue,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7665\">broken:</span> and every <span class=\"wl wl-kjv\" data-code=\"H3627\">vessel</span> of <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7857\">rinsed</span> in water.","13":"And when he that hath an <span class=\"wl wl-kjv\" data-code=\"H2100\">issue</span> is <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed</span> of his <span class=\"wl wl-kjv\" data-code=\"H2101\">issue;</span> then he shall <span class=\"wl wl-kjv\" data-code=\"H5608\">number</span> to himself <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> for his <span class=\"wl wl-kjv\" data-code=\"H2893\">cleansing,</span> and <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> in <span class=\"wl wl-kjv\" data-code=\"H2416\">running</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and shall be clean.","14":"And on the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> to him <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8449\">turtledoves,</span> or <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H3123\">pigeons,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them unto the priest:","15":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">offer</span> them, the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for him <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for his issue.","16":"And if any <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H7902\">copulation</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from him, then he shall <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> all his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","17":"And every <span class=\"wl wl-kjv\" data-code=\"H899\">garment,</span> and every <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> whereon is the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H7902\">copulation,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3526\">washed</span> with <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","18":"The <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> also with whom <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H7902\">copulation,</span> they shall both <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> themselves in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","19":"And if a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> have an <span class=\"wl wl-kjv\" data-code=\"H2100\">issue,</span> and her <span class=\"wl wl-kjv\" data-code=\"H2101\">issue</span> in her <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> be <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> she shall be put <span class=\"wl wl-kjv\" data-code=\"H5079\">apart</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> and whosoever <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> her shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","20":"And every thing that she <span class=\"wl wl-kjv\" data-code=\"H7901\">lieth</span> upon in her <span class=\"wl wl-kjv\" data-code=\"H5079\">separation</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean:</span> every thing also that she <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth</span> upon shall be unclean.","21":"And whosoever <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> her <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","22":"And whosoever <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> any <span class=\"wl wl-kjv\" data-code=\"H3627\">thing</span> that she <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> upon shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","23":"And if it be on her <span class=\"wl wl-kjv\" data-code=\"H4904\">bed,</span> or on any <span class=\"wl wl-kjv\" data-code=\"H3627\">thing</span> whereon she <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth,</span> when he <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> it, he shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","24":"And if any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with her at <span class=\"wl wl-kjv\" data-code=\"H7901\">all,</span> and her <span class=\"wl wl-kjv\" data-code=\"H5079\">flowers</span> be upon him, he shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> whereon he <span class=\"wl wl-kjv\" data-code=\"H7901\">lieth</span> shall be unclean.","25":"And if a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H2100\">have</span> an <span class=\"wl wl-kjv\" data-code=\"H2101\">issue</span> of her <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H3808\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of her <span class=\"wl wl-kjv\" data-code=\"H5079\">separation,</span> or if it <span class=\"wl wl-kjv\" data-code=\"H2100\">run</span> beyond the <span class=\"wl wl-kjv\" data-code=\"H5921\">time</span> of her <span class=\"wl wl-kjv\" data-code=\"H5079\">separation;</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of the <span class=\"wl wl-kjv\" data-code=\"H2101\">issue</span> of her <span class=\"wl wl-kjv\" data-code=\"H2932\">uncleanness</span> shall be as the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of her <span class=\"wl wl-kjv\" data-code=\"H5079\">separation:</span> she shall be unclean.","26":"Every <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> whereon she <span class=\"wl wl-kjv\" data-code=\"H7901\">lieth</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of her <span class=\"wl wl-kjv\" data-code=\"H2101\">issue</span> shall be unto her as the <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> of her <span class=\"wl wl-kjv\" data-code=\"H5079\">separation:</span> and <span class=\"wl wl-kjv\" data-code=\"H3627\">whatsoever</span> she <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth</span> upon shall be <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean,</span> as the <span class=\"wl wl-kjv\" data-code=\"H2932\">uncleanness</span> of her separation.","27":"And whosoever <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> those things shall be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3526\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">bathe</span> himself in <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2930\">unclean</span> until the even.","28":"But if she be <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed</span> of her <span class=\"wl wl-kjv\" data-code=\"H2101\">issue,</span> then she shall <span class=\"wl wl-kjv\" data-code=\"H5608\">number</span> to herself <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that she shall be clean.","29":"And on the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> she shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> unto her <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8449\">turtles,</span> or <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H3123\">pigeons,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> them unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> to the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation.","30":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">offer</span> the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering,</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for her <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for the <span class=\"wl wl-kjv\" data-code=\"H2101\">issue</span> of her uncleanness.","31":"Thus shall ye <span class=\"wl wl-kjv\" data-code=\"H5144\">separate</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> from their <span class=\"wl wl-kjv\" data-code=\"H2932\">uncleanness;</span> that they <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> not in their <span class=\"wl wl-kjv\" data-code=\"H2932\">uncleanness,</span> when they <span class=\"wl wl-kjv\" data-code=\"H2930\">defile</span> my <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> that is among","32":"This is the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of him that hath an <span class=\"wl wl-kjv\" data-code=\"H2100\">issue,</span> and of him whose <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">goeth</span> from him, and is defiled","33":"And of her that is <span class=\"wl wl-kjv\" data-code=\"H1739\">sick</span> of her <span class=\"wl wl-kjv\" data-code=\"H5079\">flowers,</span> and of him that <span class=\"wl wl-kjv\" data-code=\"H2100\">hath</span> an <span class=\"wl wl-kjv\" data-code=\"H2101\">issue,</span> of the <span class=\"wl wl-kjv\" data-code=\"H2145\">man,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H5347\">woman,</span> and of <span class=\"wl wl-kjv\" data-code=\"H376\">him</span> that <span class=\"wl wl-kjv\" data-code=\"H7901\">lieth</span> with her that is unclean."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Een ieder man,","tekst":"Hebreeuws, Man man. Welke herhaling betekent alle, of een ieder man. Alzo Exo 36:4, en onder, Lev 17:3, Lev 17:8, Lev 17:10."},{"catchword":"vlees,","tekst":"Zo wordt eerbaarlijk genaamd de schamelheid des mans, gelijk ook boven, Lev 12:3; Eze 16:26, en Eze 23:20, en hier in vs.3."}],"3":[{"catchword":"uitzevert,","tekst":"Te weten, door zwakheid en natuurlijke ziekte, die de geneesheren gomorrhoeam noemen."}],"4":[{"catchword":"tuig,","tekst":"Of, vat. Het Hebreeuwse woord betekent hier allerlei huisraad, gereedschap, vaten, klederen, werktuig, roerend goed. Alzo onder, vs.6, 22."}],"7":[{"catchword":"het vlees desgenen,","tekst":"Dat is, het lichaam desgenen, die den vloed heeft, uitgenomen zijne handen, die gewassen zijn. Zie onder, vs.11."}],"8":[{"catchword":"hij zijn klederen wassen,","tekst":"Te weten, die bespogen is."}],"9":[{"catchword":"zadel,","tekst":"Versta, allerlei tuig, gereedschap of maaksel en kussenwerk, bekwaam om op te zitten."},{"catchword":"gereden hebben,","tekst":"Of, gevaren hebben. Want het Hebreeuwse woord betekent niet alleen rijden op een beest, Gen 24:61; Num 22:22, maar ook rijden op een wagen; 2Ch 35:24; Jer 17:25."}],"13":[{"catchword":"gereinigd zal zijn,","tekst":"Dat is, wanneer zijn vloed zal ophouden."},{"catchword":"zijn reiniging","tekst":"Versta, de onderhouding der ceremoniën, die naar de wet vereist waren, opdat hij voor rein gehouden mocht worden."},{"catchword":"zeven dagen","tekst":"Zie Num 19:11, enz."},{"catchword":"levend water baden,","tekst":"Zie boven, Lev 14:5."}],"14":[{"catchword":"twee jonge duiven nemen;","tekst":"Hebreeuws, twee zonen ener duif; en zo onder, vs.29."}],"16":[{"catchword":"zal uitgegaan zijn,","tekst":"Te weten, in den slaap. Want dit is een andere soort van onreinheid dan de voorgemelde, die uit lichamelijke zwakheid veroorzaakt werd."}],"18":[{"catchword":"de vrouw,","tekst":"Te weten, zal onrein zijn."},{"catchword":"als een man","tekst":"Versta hier, een zodanig man, die de voorgemelde ziekte had, of die anderszins in den slaap verontreinigd was."}],"19":[{"catchword":"afzondering zijn;","tekst":"Zie boven, Lev 12:2."}],"22":[{"catchword":"tuig,","tekst":"Zie boven, vs.4."}],"23":[{"catchword":"het op het leger geweest zal zijn,","tekst":"Te weten, tuig, of vat, of roerend goed, liggende op haar leger, of op enig ding, dat er op is."}],"24":[{"catchword":"zekerlijk","tekst":"Hebreeuws, liggende gelegen heeft."},{"catchword":"haar gelegen heeft,","tekst":"Hebbende haar vloed, doch buiten weten van den bijligger, want wetens en willens bij ene maandstondige te slapen, was op lijfstraf verboden; onder, Lev 20:18."},{"catchword":"afzondering","tekst":"Dat is, haar maandstonden; zo genoemd omdat zij gedurende dezelve van het gezelschap der mensen afgezonderd werd."},{"catchword":"op hem zij,","tekst":"Dat is, dat hij met haar maandstonden besmet werd."}],"25":[{"catchword":"tijd harer afzondering,","tekst":"Versta, den gewonen tijd van haar maandstonden."},{"catchword":"boven hare afzondering,","tekst":"Dat is, langer dan zij gewoon was."}],"28":[{"catchword":"als zij van haar vloed","tekst":"Dat is, wanneer de vloed ophoudt."}],"31":[{"catchword":"in hun onreinigheid niet sterven,","tekst":"Dat is, om hunne onreinheid."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Moreover the LORD spoke to Moseh and to Aaron, saying:"}],"2":[{"catchword":null,"tekst":"Speak unto the children of Israel, and say to them: Every man, [Heb. man, man, which repetition implieth all men, or every one. Thus Exod. 36. 4. and below chap. 17, 3, 8, 10, & c.] when he shall be running (or, issuing , flowing) out of his flesh, [thus the Scripture modestly calleth the man&acirc;&euro;&trade;s privy part, as likewise above chap. 12 verse 3. Ezek. 16. 26. and 23. 20. and here in the next verse] shall be unclean for his running."}],"3":[{"catchword":null,"tekst":"This now shall be his uncleanness for his running: if his flesh run forth his running, [viz. through weakness and natural infirmity, which the Physitians call Gonorrhea] or his flesh doth stop it self of his running, that is his uncleanness."}],"4":[{"catchword":null,"tekst":"Every couch (or, lying place) whereon he that hath the running, shall lie, shall be unclean: and every stuff [or, Vessel. The Hebrew word signifieth here all manner of house-hold stuff, furniture, vessels, garments, utensils, moveable goods, so below verse 6, and 22.] whereon he shall sit, shall be clean."}],"5":[{"catchword":null,"tekst":"Every one likewise that shall touch his couch, shall wash his clothes, and bath himself with water, and shall be unclean until the evening."}],"6":[{"catchword":null,"tekst":"And he that sitteth upon that stuff, whereon he that hath the running, shall have sat, shall wash his clothes, and bath himself with water, and shall be unclean until the Even."}],"7":[{"catchword":null,"tekst":"And he that toucheth the flesh of him that hath the running, [i.e. any part of his body, saving the hands, they being washed , see below verse 11.] shall wash his clothes, and bath himself with water, and be unclean until the even."}],"8":[{"catchword":null,"tekst":"Likewise, when he that hath the running, shall have spit upon a clean one, then shall he [viz. that is spit upon] wash his clothes, and shall bath himself with water, and be unclean until the Even."}],"9":[{"catchword":null,"tekst":"Also every saddle (understand hereby all manner of furniture, cushions, seats, & c. whereon men use to sit] whereon he shall have ridden [whether on horse-back, or any otherwise; for the Hebrew word signifieth not only to ride upon a horse, or other beast, as Gen. 24. 61. Num. 22. 22. but likewise upon Waggons and Chariots & c. 2 Chron. 35. ver. 24. Jer. 17. 25.] shall be unclean:"}],"11":[{"catchword":null,"tekst":"Besides, every one, whom he that hath the running, shall have touched, not having rinsed his hands with water, the same shall wash his clothes, and bath himself with water, and be unclean until the even."}],"12":[{"catchword":null,"tekst":"The earthen vessel likewise, which he that hath the running, shall have touched, shall be broken: but every wooden vessel shall be rinsed with water."}],"13":[{"catchword":null,"tekst":"Now when he that hath the running, shall be cleansed of his running, [i.e. when his running shall have ceased] then shall he for his cleansing [Understand, for the Ceremonies which the Law required that he might be reputed clean again] number seven days for himself, [see Num. 19. 11, & c.] and wash his clothes; and he shall bath his flesh with living water, [see above chap. 14. on verse 5.] so he shall be clean."}],"14":[{"catchword":null,"tekst":"And on the eight day, he shall take for himself two Turtle-doves, or two young Pigeons; [Heb. two sons of a dove, and so below verse 29.] and shall come before the face of the LORD, at the door of the Tent of the Congregation, and shall give them to the Priest."}],"15":[{"catchword":null,"tekst":"And the Priest shall prepare the same, one for a sin-offering, and one for a burnt-offering: so the Priest shall make expiation over him before the face of the LORD, by reason of his running."}],"16":[{"catchword":null,"tekst":"Moreover a man, when the seed of copulation shall be gone forth from him, [viz. in his sleep; for here is described another sort of uncleanness, besides that which proceeded from bodily weakness] he shall bath all his flesh with water, and be unclean until the even."}],"17":[{"catchword":null,"tekst":"Also every garment, and every skin, on which the seed of copulation shall be, the same shall be washed with water, and be unclean until the even."}],"18":[{"catchword":null,"tekst":"Likewise the woman, [viz. shall be unclean] when a man shall have lain by her with the seed of copulation: [Understand here, such a man, as had the aforesaid infirmity upon him, or who was polluted in his sleep] therefore they shall bath themselves with water, and be unclean until the even."}],"19":[{"catchword":null,"tekst":"But when a woman shall be running, her issue of blood being in her flesh, then she shall be seven days in her separation, [See above chap. 12. on verse 2.] and whosoever toucheth her, shall be unclean until the even."}],"20":[{"catchword":null,"tekst":"And whatsoever she shall have lain upon in her separation, the same shall be unclean; together with whatsoever she shall have sat upon, shall be unclean."}],"21":[{"catchword":null,"tekst":"And whatsoever toucheth her couch (or, lying place); shall wash his clothes, and bath himself with water, and be unclean until the even."}],"22":[{"catchword":null,"tekst":"Also whosoever toucheth any stuff, [See above on verse 4.] whereon she shall have sat, shall wash his clothes, and bath himself with water, and be unclean until the even."}],"23":[{"catchword":null,"tekst":"Yea, if it shall have been upon the couch, or upon the stuff whereon she sat, [viz. any stuff, vessel, furniture or moveable goods, that lay upon her bed, couch or upon anything that was thereupon] when he touched the same, he shall be unclean until the even."}],"24":[{"catchword":null,"tekst":"Likewise if any have surely lain [Heb. lying, lain] by her, [she having her course upon her, though without his knowledge; for wittingly and willingly to lie with a menstruous woman, was forbidden on pain of death, below chap. 20. verse 18.] that her separation [i.e. her monthly course, so called, because that during the same, she was separated from the society of men] be upon him, [i.e. that he be defiled with her monthly issue] then he shall be seven days unclean; besides every couch, [or, lying place] whereon he shall have lain // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');

    const gwTekst = wl.closest('.gw-tekst');

    const isKjv = wl.classList.contains('wl-kjv');

  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
