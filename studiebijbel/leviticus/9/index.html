es","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het gebeurde op de achtste dag, dat Mozes Aäron en zijn zonen riep, en de oudsten van Israël;","2":"En hij zei tegen Aäron: Neem u een kalf, een jong rund, tot zondoffer, en een ram tot brandoffer, *die* volkomen zijn; en breng ze voor het aangezicht van de HEERE.","3":"Daarna spreek tot de kinderen van Israël, en zeg: Neem een geitenbok tot zondoffer, en een kalf, en een lam, eenjarig, volkomen, tot brandoffer;","4":"Ook een os en ram tot dankoffer, om voor het aangezicht van de HEERE te offeren; en een spijsoffer met olie gemengd; want vandaag zal de HEERE u verschijnen.","5":"Toen namen zij wat Mozes geboden had, *en brachten dat* tot voor de tent der samenkomst; en de hele vergadering naderde, en stond voor het aangezicht van de HEERE.","6":"En Mozes zei: Dit is de zaak die de HEERE geboden heeft, dat u doen zult; en de heerlijkheid van de HEERE zal u verschijnen.","7":"En Mozes zei tegen Aäron: Nader tot het altaar, en maak uw zondoffer, en uw brandoffer klaar; en doe verzoening voor u en voor het volk; maak daarna de offerande van het volk klaar, en doe de verzoening voor hen, zoals de HEERE geboden heeft.","8":"Toen naderde Aäron tot het altaar, en slachtte het kalf van het zondoffer, dat voor hem was.","9":"En de zonen van Aäron brachten het bloed tot hem, en hij doopte zijn vinger in dat bloed, en deed het op de hoornen van het altaar; daarna goot hij het bloed uit aan de bodem van het altaar.","10":"Maar het vet, en de nieren, en het net van de lever van het zondoffer heeft hij op het altaar aangestoken, zoals de HEERE Mozes geboden had.","11":"Maar het vlees en de huid verbrandde hij met vuur buiten het leger.","12":"Daarna slachtte hij het brandoffer; en de zonen van Aäron leverden aan hem het bloed; en hij sprengde dat rondom op het altaar.","13":"Ook leverden zij aan hem het brandoffer in zijn stukken, met het hoofd; en hij stak het aan op het altaar.","14":"En hij waste het ingewand en de schenkels; en hij stak ze aan op het brandoffer, op het altaar.","15":"Daarna liet hij de offerande van het volk toebrengen; en nam de bok van het zondoffer, die voor het volk was, en slachtte hem, en bereidde hem tot zondoffer, zoals de eerste.","16":"Verder liet hij het brandoffer toebrengen, en maakte dat klaar naar het recht.","17":"En hij liet het spijsoffer toebrengen, en vulde daarvan zijn hand, en stak het aan op het altaar, behalve het morgenbrandoffer.","18":"Daarna slachtte hij de os, en de ram tot dankoffer, dat voor het volk was; en de zonen van Aäron leverden het bloed aan hem, dat hij rondom op het altaar sprengde;","19":"En het vet van de os, en van de ram, de staart, en wat het *ingewand* bedekt, en de nieren, en het net van de lever;","20":"En zij legden het vet op de borsten; en hij stak dat vet aan op het altaar.","21":"Maar de borsten en de rechterschouder bewoog Aäron tot beweegoffer voor het aangezicht van de HEERE, zoals Mozes geboden had.","22":"Daarna hief Aäron zijn handen op tot het volk, en zegende hen; en hij kwam naar beneden, nadat hij het zondoffer, en brandoffer, en dankoffer klaargemaakt had.","23":"Toen ging Mozes met Aäron in de tent der samenkomst; daarna kwamen zij naar buiten, en zegenden het volk; en de heerlijkheid van de HEERE verscheen aan heel het volk.","24":"Want een vuur ging uit van het aangezicht van de HEERE, en verteerde op het altaar het brandoffer, en het vet. Toen heel het volk dit zag, juichten zij, en vielen op hun aangezichten."},"SV":{"1":"En het geschiedde op den achtsten dag, dat Mozes riep Aäron en zijn zonen, en de oudsten van Israël;","2":"En hij zeide tot Aäron: Neem u een kalf, een jong rund, ten zondoffer, en een ram ten brandoffer, *die* volkomen zijn; en breng ze voor het aangezicht des HEEREN.","3":"Daarna spreek tot de kinderen Israëls, zeggende: Neemt een geitenbok ten zondoffer, en een kalf, en een lam, eenjarig, volkomen, ten brandoffer;","4":"Ook een os en ram ten dankoffer, om voor het aangezicht des HEEREN te offeren; en spijsoffer met olie gemengd; want heden zal de HEERE u verschijnen.","5":"Toen namen zij hetgeen Mozes geboden had, *brengende* *dat* tot voor aan de tent der samenkomst; en de gehele vergadering naderde, en stond voor het aangezicht des HEEREN.","6":"En Mozes zeide: Deze zaak, die de HEERE geboden heeft, zult gij doen; en de heerlijkheid des HEEREN zal u verschijnen.","7":"En Mozes zeide tot Aäron: Nader tot het altaar, en maak uw zondoffer, en uw brandoffer toe; en doe verzoening voor u en voor het volk; maak daarna de offerande des volks toe, en doe de verzoening voor hen, gelijk als de HEERE geboden heeft.","8":"Toen naderde Aäron tot het altaar, en slachtte het kalf des zondoffers, dat voor hem was.","9":"En de zonen van Aäron brachten het bloed tot hem, en hij doopte zijn vinger in dat bloed, en deed het op de hoornen des altaars; daarna goot hij het bloed uit aan den bodem des altaars.","10":"Maar het vet, en de nieren, en het net van de lever van het zondoffer heeft hij op het altaar aangestoken, gelijk als de HEERE Mozes geboden had.","11":"Doch het vlees, en de huid verbrandde hij met vuur buiten het leger.","12":"Daarna slachtte hij het brandoffer; en de zonen van Aäron leverden aan hem het bloed; en hij sprengde dat rondom op het altaar.","13":"Ook leverden zij aan hem het brandoffer in zijn stukken, met het hoofd; en hij stak het aan op het altaar.","14":"En hij wies het ingewand en de schenkelen; en hij stak ze aan op het brandoffer, op het altaar.","15":"Daarna deed hij de offerande des volks toebrengen; en nam den bok des zondoffers, die voor het volk was, en slachtte hem, en bereidde hem ten zondoffer, gelijk het eerste.","16":"Verder deed hij het brandoffer toebrengen, en maakte dat toe naar het recht.","17":"En hij deed het spijsoffer toebrengen, en vulde daarvan zijn hand, en stak het aan op het altaar, behalve het morgenbrandoffer.","18":"Daarna slachtte hij den os, en den ram ten dankoffer, dat voor het volk was; en de zonen van Aäron leverden het bloed aan hem, hetwelk hij rondom op het altaar sprengde;","19":"En het vet van den os, en van den ram, den staart, en wat het *ingewand* bedekt, en de nieren, en het net der lever;","20":"En zij leiden het vet op de borsten; en hij stak dat vet aan op het altaar.","21":"Maar de borsten en den rechterschouder bewoog Aäron ten beweegoffer voor het aangezicht des HEEREN, gelijk als Mozes geboden had.","22":"Daarna hief Aäron zijn handen op tot het volk, en zegende hen; en hij kwam af, nadat hij het zondoffer, en brandoffer, en dankoffer gedaan had.","23":"Toen ging Mozes met Aäron in de tent der samenkomst; daarna kwamen zij uit, en zegenden het volk; en de heerlijkheid des HEEREN verscheen al het volk.","24":"Want een vuur ging uit van het aangezicht des HEEREN, en verteerde op het altaar het brandoffer, en het vet. Als het ganse volk dit zag, zo juichten zij, en vielen op hun aangezichten."},"KJV":{"1":"And it came to pass on the eighth day, *that* Moses called Aaron and his sons, and the elders of Israel;","2":"And he said unto Aaron, Take thee a young calf for a sin offering, and a ram for a burnt offering, without blemish, and offer *them* before the LORD.","3":"And unto the children of Israel thou shalt speak, saying, Take ye a kid of the goats for a sin offering; and a calf and a lamb, *both* of the first year, without blemish, for a burnt offering;","4":"Also a bullock and a ram for peace offerings, to sacrifice before the LORD; and a meat offering mingled with oil: for to day the LORD will appear","5":"And they brought *that* which Moses commanded before the tabernacle of the congregation: and all the congregation drew near and stood before the LORD.","6":"And Moses said, This *is* the thing which the LORD commanded that ye should do: and the glory of the LORD shall appear","7":"And Moses said unto Aaron, Go unto the altar, and offer thy sin offering, and thy burnt offering, and make an atonement for thyself, and for the people: and offer the offering of the people, and make an atonement for them; as the LORD commanded.","8":"Aaron therefore went unto the altar, and slew the calf of the sin offering,","9":"And the sons of Aaron brought the blood unto him: and he dipped his finger in the blood, and put *it* upon the horns of the altar, and poured out the blood at the bottom of the altar:","10":"But the fat, and the kidneys, and the caul above the liver of the sin offering, he burnt upon the altar; as the LORD commanded Moses.","11":"And the flesh and the hide he burnt with fire without the camp.","12":"And he slew the burnt offering; and Aaron's sons presented unto him the blood, which he sprinkled round about upon the altar.","13":"And they presented the burnt offering unto him, with the pieces thereof, and the head: and he burnt *them* upon the altar.","14":"And he did wash the inwards and the legs, and burnt *them* upon the burnt offering on the altar.","15":"And he brought the people's offering, and took the goat, which *was* the sin offering for the people, and slew it, and offered it for sin, as the first.","16":"And he brought the burnt offering, and offered it according to the manner.","17":"And he brought the meat offering, and took an handful thereof, and burnt *it* upon the altar, beside the burnt sacrifice of the morning.","18":"He slew also the bullock and the ram *for* a sacrifice of peace offerings, which *was* for the people: and Aaron's sons presented unto him the blood, which he sprinkled upon the altar round about,","19":"And the fat of the bullock and of the ram, the rump, and that which covereth *the inwards*, and the kidneys, and the caul *above* the liver:","20":"And they put the fat upon the breasts, and he burnt the fat upon the altar:","21":"And the breasts and the right shoulder Aaron waved *for* a wave offering before the LORD; as Moses commanded.","22":"And Aaron lifted up his hand toward the people, and blessed them, and came down from offering of the sin offering, and the burnt offering, and peace offerings.","23":"And Moses and Aaron went into the tabernacle of the congregation, and came out, and blessed the people: and the glory of the LORD appeared unto all the people.","24":"And there came a fire out from before the LORD, and consumed upon the altar the burnt offering and the fat: *which* when all the people saw, they shouted, and fell on their faces."}},"tsk":{"1":[{"kopje":"de achtste dag","refs":["Lev 12:2","Lev 12:3","Lev 14:8-10","Lev 15:13","Lev 15:14","Lev 22:27","Num 6:9","Num 6:10","Lev 8:33","Lev 14:10","Lev 14:23","Lev 15:14","Lev 15:29","Num 6:10","Ezech 43:26","Ezech 43:27","Matt 28:1"]}],"2":[{"kopje":"een jong rund","refs":["Lev ],"5":[{"catchword":null,"tekst":"Then they took what Moseh had commanded them, (bringing the same) [These words in the parenthesis are inserted here, in regard that the precedent Verb to take, doth oft times include another word in it self, to complete the sense. See Gen. 12. on verse 15. Oth. Then they brought that which Moseh had commanded] right before the Tent of the Congregation: and the whole Congregation drew near, and stood before the face of the LORD."}],"6":[{"catchword":null,"tekst":"And Moseh said; This thing which the LORD hath commanded, shall ye do: and the glory of the LORD shall appear unto you. [Understand the glorious tokens of the manifestation of God by fire, which came forth from the LORD, whereby the burnt-offering was kindled and consumed without any human means or help: see below verse 23, 24. Compare Exod. 24. 16, 17. and chap. 40, 34, 35. Ezek. 43. 2.]"}],"7":[{"catchword":null,"tekst":"And Moseh said to Aaron; Draw near unto the Altar, and make (ready) thy sin-offering, and thy burnt-offering: and make Expiation for thee and for the people; [first, for thyself, that thou mayest be sit, to make the Expiation for the people, having expiated thy self first. For the Levitical Priest&acirc;&euro;&trade;s, being sinners as well as the rest, they were necessitated to offer likewise for themselves, Heb. 7. 27, 28.] after that make (ready) the sacrifice of the people, and make the Expiation for them, according as the LORD hath commanded."}],"8":[{"catchword":null,"tekst":"Then Aaron approached to the Altar; and slew the calf of the sin-offering [i.e. that which was to be offered for sin. Compare below the Annotations on ferse 1.5.] which was for him (self)."}],"9":[{"catchword":null,"tekst":"And the sons of Aaron brought the blood unto him, and he dipped his finger in that blood, and did it upon the horns of the Altar: then he poured out the blood at the bottomof the Altar."}],"10":[{"catchword":null,"tekst":"But the fat and kidneys, and the cawl of the liver of the sin-offering he did kindle upon the Altar, [i.e. he did fit and prepare the same for to be kindled and consumed there. So below chap. 13. verse 14, 27, 20. for it was presently after kindled and consumed by the fire, which wonderfully fell down out of heaven, or else came forth out of the Holy of Holies; below verse 24.] according as the LORD had commanded Moseh."}],"11":[{"catchword":null,"tekst":"But the flesh and the skin [Together with all that was yet remaining of that Calf. Compare above 4. 11.] he burned with fire without the Camp."}],"12":[{"catchword":null,"tekst":"After that he slew the burnt-offering: and the sons of Aaron delivered unto him [Heb. caused to find on him, i.e. delivered, reached forth to him, or served him with, or brought unto him; and so in the sequel, verse 13. and 18, & c.] the blood; and he sprinkled that round about the Altar."}],"13":[{"catchword":null,"tekst":"They delivered him likewise the burnt-offering in its pieces; with the head: and he kindled it upon the Altar."}],"14":[{"catchword":null,"tekst":"And he washed the entrails and the legs; and he kindled them upon the burnt-offering upon the Altar."}],"15":[{"catchword":null,"tekst":"After that, he caused the sacrifice of the people to be brought near: and took the he-goat of the sin-offering, which was for the people, [Or, of the people; i.e. to be offered for the people. Compare verse 8. the Annotations] and slew him, and prepared him for a sin-offering, [Heb. he made him sin; i.e. he prepared him to be an offering for sin. Or, he un-sinned him; or, made him sin-less; i.e. he cleansed and purified the people of their sin by offering of him; understand, not really by the blood of the goat, but typically, and as pointing at the only sacrifice, Christ, who alone is able actually to take away sins, Heb. 9. and 10. see above chap. 4. on ver. 20. wherefore he is likewise said to be made sin to us, 2 Cor. 5. 11. ] like unto the first: [viz. the offering of the Calf: see above ver. 1. and 8.]"}],"16":[{"catchword":null,"tekst":"Moreover he caused the burnt-offering to be brought near, and made the same (ready) according to the right. [i.e. in that lawful manner, as it ought to be done. See above chap. 5. on verse 10.]"}],"17":[{"catchword":null,"tekst":"And he caused the meat-offering to be brought near, [Which was always to accompany the burnt-offering, as is to be gathered, above by chap. 6.] and filled thereof his hand [viz. with meal-flower whereof kindled it upon the Altar; besides the burnt-offering of the morning. [i.e. that which was to be offered every morning in course: See Exod. 29. 38, 39, 40.]"}],"18":[{"catchword":null,"tekst":"After that he slew the Bullock and the Ram for a thank-offering, which was for the people: [viz. to be sacrificed for them. Compare above the annotation on v. 8.] and the sons of Aaron delivered the blood unto him (which he sprinkled round about the Altar)"}],"19":[{"catchword":null,"tekst":"And the fat of the Bullock, and of the Ram , the rump, and that which covereth (the Entrails) [Understand the fat, which covereth the entrails. Compare above chap. 3. v. 3, 9. 14. and chap. 4. v. 8. and chap. 7. v. 3, & c. out of which places this word entrails, is inserted here, to make up the sence.] and the kidneys, and the cawl of the liver."}],"21":[{"catchword":null,"tekst":"But the breasts and the right shoulder Aaron waved for a wave-offering, before the face of the LORD, according as Moseh had commanded."}],"22":[{"catchword":null,"tekst":"After that, Aaron lifted up his hands to the people, and blessed them; [viz. as Priest, whose office it was, to impart the spiritual goods unto the people of God; by teaching, offering, and praying. Now the public blessing was a kind of prayer, whereof we read the form. Num. 6. verse 23] and he came down [viz. from an hillock of an ease gentle ascent, without steps whereon the Altar stood, so that it could easily be seen round about, what was a doing thereupon. Compare Exod. 20. 26. Oth. being come down] after that he had done the sin-offering, and burnt-offering, and thank-offering. [Heb. from doing of the sin-offering, etc.]"}],"23":[{"catchword":null,"tekst":"Then Moseh went with Aaron into the Tent of Congregation, after that they came forth and blessed the people: [viz. as God&acirc;&euro;&trade;s Ministers over his people; which blessing was performed openly with calling on the Name of God, according to the prescript, Num. 6. 24, etc. see also Deut. 10. 8.] and the glory of the LORD appeared unto all the people. [See the next verse, and above the Note on ver. 6.]"}],"24":[{"catchword":null,"tekst":"For a fire went forth from the face of the LORD, [i.e. from the Holy of Holies, called together with the whole Tabernacle, the House of God, 1 Sam. 3. 15. 1 Chron. 6. 31, 32. where the Ark of the Covenant was, a Token of God&acirc;&euro;&trade;s presence. Or, understand this of Heavens, called likewise the Habitation of the LORD; Deut. 26. 15. Isa. 63. 15. 2 Chron. 30. 27. from whence in the days of Eliah, the fire fell down upon his sacrifice, 1 Kings 18. 38.] and consumed upon the Altar the burnt-offering, and the fat: when all the people saw this, they shouted, [i.e. made a joyful noise and acclamation] and fell upon their faces. [in token of their humility and reverence: see Gen 17. on verse 3.]"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
