 het is een spijs van het vuuroffer voor de HEERE.", "Lev 7:4": "ook de beide nieren, en het vet dat daaraan is, dat op de weekdelen is; en het net over de lever, met de nieren, zal men wegnemen.", "Num 28:13": "En bij elk tiende deel meelbloem als spijsoffer, met olie gemengd, bij het ene lam; het is een brandoffer tot een liefelijke reuk, een vuuroffer, voor de HEERE.", "Num 29:10": "Voor elk een tiende voor een lam, tot al die zeven lammeren toe;", "Lev 7:18": "want als er op de derde dag toch van dat vlees van zijn dankoffer gegeten wordt, zal het niet aangenaam zijn voor hem die het geofferd heeft; het zal hem niet toegerekend worden, het zal een afgrijselijk ding zijn; en de ziel die daarvan eet, zal haar ongerechtigheid dragen.", "Lev 4:10": "Zoals het van de os van het dankoffer opgenomen wordt; en de priester zal ze in rook laten opgaan op het altaar van het brandoffer.", "Lev 15:13": "Als hij nu, die de vloed heeft, van zijn vloed gereinigd zal zijn, dan zal hij voor zichzelf zeven dagen tellen voor zijn reiniging, en zijn kleren wassen, en hij zal zijn vlees met levend water baden, dan zal hij rein zijn.", "Richt 13:23": "Maar zijn vrouw zei tegen hem: Als de HEERE ons had willen doden, had Hij het brandoffer en spijsoffer niet uit onze hand aangenomen, en had Hij ons dit alles niet getoond, en had Hij ons dit niet op dit moment laten horen.", "Ezech 43:26": "Zeven dagen zullen zij het altaar verzoenen, en het reinigen, en zijn handen vullen.", "Lev 14:19": "De priester zal ook het zondoffer bereiden, en voor hem die van zijn onreinheid te reinigen is verzoening doen; en daarna zal hij het brandoffer slachten.", "Lev 4:22-35": "Als een leider zal gezondigd hebben, en tegen een van de geboden van de HEERE zijn God, door afdwaling, gedaan zal hebben wat niet gedaan zou mogen worden, zodat hij schuldig is; Of men hem zijn zonde, die hij daarmee gezondigd heeft, bekend zal hebben gemaakt; dan zal hij als zijn offer brengen een geitenbok, een volkomen mannetje. En hij zal zijn hand op het hoofd van de bok leggen, en hem slachten op de plaats waar men het brandoffer slacht voor het aangezicht van de HEERE; het is een zondoffer.", "Num 16:22": "Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden?", "Ex 29:24-28": "En leg ze alle op de handen van Aäron, en op de handen van zijn zonen, en beweeg ze tot een beweegoffer voor het aangezicht van de HEERE. Neem ze daarna van hun hand, en steek ze in brand op het altaar, op het brandoffer, tot een liefelijke reuk voor het aangezicht van de HEERE; het is een vuuroffer voor de HEERE. En neem de borst van de ram van de vuloffers, die van Aäron is, en beweeg hem tot een beweegoffer voor het aangezicht van de HEERE; en het zal voor u een deel zijn.", "Lev 4:23": "Of men hem zijn zonde, die hij daarmee gezondigd heeft, bekend zal hebben gemaakt; dan zal hij als zijn offer brengen een geitenbok, een volkomen mannetje.", "Ex 4:29-31": "Toen ging Mozes en Aäron, en zij verzamelden al de oudsten van de kinderen van Israël. En Aäron sprak al de woorden, die de HEERE tot Mozes gesproken had; en hij deed de tekenen voor de ogen van het volk. En het volk geloofde, en zij hoorden, dat de HEERE de kinderen van Israël bezocht had, en dat Hij hun verdrukking gezien had, en zij bogen hun hoofden, en aanbaden.", "1 Petr 4:11": "Als iemand spreekt, laat hij spreken als de woorden van God; als iemand dient, laat hij dienen als uit kracht die God verleent; opdat God in alles geprezen wordt door Jezus Christus, aan Wie de heerlijkheid en de kracht toekomt, tot in alle eeuwigheid. Amen.", "Lev 6:20": "Dit is de offerande van Aäron en van zijn zonen, die zij de HEERE offeren zullen op de dag dat hij gezalfd wordt: het tiende deel van een efa meelbloem, een voortdurend spijsoffer; de helft daarvan op de morgen, en de helft daarvan op de avond.", "Lev 7:9-13": "Verder zal al het spijsoffer dat in de oven gebakken wordt, met al wat in de ketel en in de pan bereid wordt, voor de priester zijn die dat offert. Ook elk spijsoffer dat met olie gemengd is, of droog, zal voor alle zonen van Aäron zijn, voor de een evenveel als voor de ander. Dit is nu de wet van het dankoffer, dat men de HEERE zal offeren.", "Num 29:14": "En hun spijsoffer van meelbloem, met olie gemengd: drie tienden voor elke var, van die dertien varren; twee tienden voor elke ram, van die twee rammen;", "Ex 40:35": "Zodat Mozes niet in de tent der samenkomst kon ingaan, omdat de wolk daarop bleef, en de heerlijkheid van de HEERE de tabernakel vervulde.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Num 11:16-18": "En de HEERE zei tegen Mozes: Verzamel voor Mij zeventig mannen uit de oudsten van Israël, van wie u weet dat zij de oudsten van het volk en zijn opzichters zijn; en u zult hen brengen naar de tent van de samenkomst, en zij zullen zich daar bij u opstellen. Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt. En tegen het volk zult u zeggen: Heilig u tegen morgen, en u zult vlees eten; want u hebt voor de oren van de HEERE geweend en gezegd: Wie zal ons vlees te eten geven? Want het ging ons goed in Egypte! Daarom zal de HEERE u vlees geven, en u zult eten.", "Lev 8:18": "Daarna liet hij de ram van het brandoffer bijbrengen; en Aäron en zijn zonen legden hun handen op het hoofd van de ram.", "Lev 18:30": "Daarom zult u Mijn bevel onderhouden, dat u niets doet van die gruwelijke inzettingen, die vóór u zijn gedaan, en u daarmee niet verontreinigt; Ik ben de HEERE, uw God!", "Hebr 9:26-28": "(anders had Hij dikwijls moeten lijden, vanaf de grondlegging van de wereld) maar nu is Hij eenmaal, bij de voleinding van de eeuwen, geopenbaard, om de zonde teniet te doen, door Zijn eigen offer. En zoals het de mensen beschikt is eenmaal te sterven, en daarna het oordeel; zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "Lev 15:29": "En op de achtste dag zal zij voor zichzelf twee tortelduiven, of twee jonge duiven nemen, en zij zal ze naar de priester brengen, aan de deur van de tent van de samenkomst.", "Num 29:3": "En hun spijsoffer van meelbloem, met olie gemengd; drie tienden voor de var, twee tienden voor de ram.", "Ps 72:17": "Zijn naam zal zijn tot in eeuwigheid; zolang als er de zon is, zal zijn naam van kind tot kind voortgeplant worden; en zij zullen in hem gezegend worden; alle heidenvolken zullen hem gelukkig noemen.", "Hebr 7:6": "Maar hij, die zijn geslachtsregister niet uit hen heeft, heeft van Abraham tienden genomen, en hem, die de beloften had, heeft hij gezegend.", "Lev 3:8": "En hij zal zijn hand op het hoofd van zijn offergave leggen, en hij zal het slachten voor de tent der samenkomst; en de zonen van Aäron zullen het bloed daarvan sprengen op het altaar rondom.", "Lev 1:4": "En hij zal zijn hand op het hoofd van het brandoffer leggen, opdat het voor hem aangenaam is, om hem te verzoenen.", "Gen 4:4": "En Abel bracht ook van de eerstgeborenen van zijn schapen, en van hun vet. En de HEERE zag Abel en zijn offer met welgevallen aan;", "Joz 8:32": "Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël.", "Gen 15:17": "En het gebeurde, toen de zon onderging en het duister werd, en zie, daar was een rokende oven en een vurige fakkel, die tussen die stukken doorging.", "Lev 23:20": "Dan zal de priester die met het brood van de eerstelingen tot beweegoffer, voor het aangezicht van de HEERE, met de twee lammeren bewegen; zij zullen voor de HEERE een heilig ding zijn, voor de priester.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "Rom 5:1": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus;", "Lev 4:30": "Daarna zal de priester van haar bloed met zijn vinger nemen, en doen op de hoornen van het altaar van het brandoffer; dan zal hij al het bloed daarvan aan de voet van dat altaar uitgieten.", "Num 6:11": "De priester nu zal er een bereiden tot zondoffer, en een tot brandoffer, en zal voor hem verzoening doen, omdat hij aan het dode lichaam gezondigd heeft; zo zal hij zijn hoofd op diezelfde dag heiligen.", "Joz 24:1": "Daarna verzamelde Jozua al de stammen van Israël te Sichem, en hij riep de oudsten van Israël, en hun hoofden, en hun rechters, en hun opzichters; en zij stelden zich voor het aangezicht van God.", "2 Kron 6:2": "En ik heb U een huis gebouwd om in te wonen, en een vaste plaats tot Uw eeuwige woning.", "Lev 4:3": "Als de priester die gezalfd is, zal gezondigd hebben tot schuld van het volk, dan zal hij voor zijn zonde die hij gezondigd heeft, een var offeren, een volkomen jong rund, de HEERE tot zondoffer.", "Num 14:5": "Toen vielen Mozes en Aäron op hun gezicht, voor het aangezicht van de hele gemeente van de vergadering van de kinderen van Israël.", "Lev 3:13": "En hij zal zijn hand op haar hoofd leggen, en hij zal haar slachten voor de tent der samenkomst; en de zonen van Aäron zullen haar bloed op het altaar sprengen rondom.", "Ezech 43:2": "En zie, de heerlijkheid van de God van Israël kwam van de weg naar het oosten; en Zijn stem was als het geruis van veel water, en de aarde werd verlicht van Zijn heerlijkheid.", "Num 14:10": "Toen zei de hele vergadering dat men hen met stenen zou stenigen. Maar de heerlijkheid van de HEERE verscheen in de tent van de samenkomst, voor al de kinderen van Israël.", "Lev 7:30-34": "Zijn eigen handen zullen de vuuroffers van de HEERE brengen; het vet aan de borst zal hij met die borst brengen, om die als beweegoffer voor het aangezicht van de HEERE te bewegen. En de priester zal dat vet op het altaar aansteken; maar de borst zal voor Aäron en zijn zonen zijn. U zult ook de rechterschouder als hefoffer aan de priester geven, uit uw dankoffers.", "Deut 27:1": "En Mozes gebood, samen met de oudsten van Israël, het volk: Houd al deze geboden die ik u vandaag gebied.", "Lev 23:12": "U zult ook op de dag, als u die schoof bewegen zult, een volkomen lam bereiden, dat eenjarig is, tot een brandoffer voor de HEERE;", "Num 28:22-24": "Daarna een bok als zondoffer, om voor u verzoening te doen. Behalve het morgenbrandoffer, dat een voortdurend brandoffer is, zult u deze dingen bereiden. Van het achtervolgen van deze dingen zult u per dag, zeven dagen lang, het voedsel van het vuuroffer bereiden tot een liefelijke reuk voor de HEERE; boven dat voortdurende brandoffer zal het bereid worden, met zijn drankoffer.", "Num 28:9": "Maar op de sabbatdag twee volkomen eenjarige lammeren, en twee tienden meelbloem, als spijsoffer, met olie gemengd, alsook zijn drankoffer.", "Lev 7:37": "Dit is de wet van het brandoffer, het spijsoffer, het zondoffer, het schuldoffer, het inwijdingsoffer en het dankoffer;", "Ex 29:31": "U zult de ram van de vulling nemen, en u zult zijn vlees in de heilige plaats koken.", "Lev 9:15-21": "Daarna liet hij de offerande van het volk toebrengen; en nam de bok van het zondoffer, die voor het volk was, en slachtte hem, en bereidde hem tot zondoffer, zoals de eerste. Verder liet hij het brandoffer toebrengen, en maakte dat klaar naar het recht. En hij liet het spijsoffer toebrengen, en vulde daarvan zijn hand, en stak het aan op het altaar, behalve het morgenbrandoffer.", "Ex 29:26-28": "En neem de borst van de ram van de vuloffers, die van Aäron is, en beweeg hem tot een beweegoffer voor het aangezicht van de HEERE; en het zal voor u een deel zijn. En u zult de borst van het beweegoffer heiligen, en de schouder van het hefoffer, die bewogen wordt, en die opgeheven zal zijn van de ram van het vuloffer, van hetgeen dat van Aäron is, en van hetgeen dat van zijn zonen is. En het zal voor Aäron en zijn zonen zijn tot een eeuwige inzetting vanwege de kinderen van Israël; want het is een hefoffer; en het hefoffer vanwege de kinderen van Israël zal zijn van hun dankoffers; hun hefoffer zal voor de HEERE zijn.", "Num 5:26": "De priester zal ook van dat spijsoffer, het gedenkoffer ervan, een handvol grijpen, en zal het op het altaar in rook doen opgaan; en daarna zal hij dat water die vrouw te drinken geven.", "Hebr 13:11": "Want de lichamen van de dieren waarvan het bloed voor de zonde door de hogepriester in het heiligdom gedragen werd, worden verbrand buiten de legerplaats.", "Ezra 6:17": "En zij offerden, ter inwijding van dit huis van God, honderd runderen, tweehonderd rammen, vierhonderd lammeren en twaalf geitenbokken, tot zondoffer voor heel Israël, naar het getal van de stammen van Israël.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Lev 16:15": "Daarna zal hij de bok van het zondoffer, die voor het volk zal zijn, slachten, en zal zijn bloed tot binnen het voorhangsel dragen, en zal met zijn bloed doen zoals hij met het bloed van de stier gedaan heeft, en zal het sprenkelen op het verzoendeksel, en voor het verzoendeksel.", "Lev 4:8-10": "Verder zal hij al het vet van de var van het zondoffer daarvan opnemen; het vet dat het ingewand bedekt, en al het vet dat aan het ingewand is; Daarbij de twee nieren, en het vet dat daaraan is, dat aan de weekdarmen is, en het net over de lever, met de nieren, zal hij wegnemen; Zoals het van de os van het dankoffer opgenomen wordt; en de priester zal ze in rook laten opgaan op het altaar van het brandoffer.", "Ex 29:38": "Dit nu is het, wat u op het altaar bereiden zult: twee lammeren, die eenjarig zijn, dagelijks, voortdurend.", "Lev 14:12-32": "En de priester zal dat ene lam nemen, en het offeren als schuldoffer met de log olie; en zal die als beweegoffer voor het aangezicht van de HEERE bewegen. Daarna zal hij dat lam slachten op de plaats waar men het zondoffer en het brandoffer slacht, in de heilige plaats; want het schuldoffer, evenals het zondoffer, is voor de priester; het is allerheiligst. En de priester zal van het bloed van het schuldoffer nemen, dat de priester doen zal op het lapje van het rechteroor van hem die te reinigen is, en op de duim van zijn rechterhand, en op de grote teen van zijn rechtervoet.", "1 Petr 3:9": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.", "Hebr 13:11-13": "Want de lichamen van de dieren waarvan het bloed voor de zonde door de hogepriester in het heiligdom gedragen werd, worden verbrand buiten de legerplaats. Daarom heeft ook Jezus, opdat Hij door Zijn eigen bloed het volk zou heiligen, buiten de poort geleden. Laten wij dan naar Hem uitgaan, buiten de legerplaats, terwijl wij Zijn smaad dragen.", "Lev 14:31": "Van wat zijn hand bereiken kan, zal de ene als zondoffer, en de andere als brandoffer zijn, naast het spijsoffer; zo zal de priester voor hem die te reinigen is, verzoening doen voor het aangezicht van de HEERE.", "Deut 21:5": "Dan zullen de priesters, de kinderen van Levi, toetreden; want de HEERE, uw God, heeft hen uitgekozen om Hem te dienen, en om in de Naam van de HEERE te zegenen, en naar hun oordeel zal elke twist en elke aanklacht worden afgehandeld.", "Ex 19:11": "En gereed zijn tegen de derde dag; want op de derde dag zal de HEERE voor de ogen van al het volk neerkomen, op de berg Sinaï.", "Num 28:21": "Bij elk zult u een tiende deel bereiden bij een lam, tot al die zeven lammeren toe.", "Hand 5:18": "en zij sloegen hun handen aan de apostelen, en zetten hen in de gemeenschappelijke gevangenis.", "Lev 9:19-21": "En het vet van de os, en van de ram, de staart, en wat het ingewand bedekt, en de nieren, en het net van de lever; En zij legden het vet op de borsten; en hij stak dat vet aan op het altaar. Maar de borsten en de rechterschouder bewoog Aäron tot beweegoffer voor het aangezicht van de HEERE, zoals Mozes geboden had.", "Lev 12:2": "Spreek tot de kinderen van Israël en zeg: Wanneer een vrouw zwanger is geworden en een jongetje gebaard heeft, dan zal zij zeven dagen onrein zijn; net als in de dagen van haar afzondering tijdens haar maandelijkse ongesteldheid zal zij onrein zijn.", "Hebr 7:7": "Nu, zonder enige tegenspraak, wordt het mindere gezegend door het meerdere."}, "noten": {}, "koppeling": {"1": "Het gebeurde op <span class=\"wl\" data-l=\"L1\" data-code=\"H8066\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8066\">achtste</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3117\">dag</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H4872\">dat</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4872\">Mozes</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H175\">Aäron</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8066\">en</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8066\">zijn</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1121\">zonen</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7121\">riep</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H1121\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H2205\">oudsten</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H2205\">van</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3478\">Israël</span>;", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H559\">En</span> <span class=\"wl\" data-l=\"L1\" data /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';

    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';

    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;

  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +

}

    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
