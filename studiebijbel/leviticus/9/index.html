ij zei tegen Aäron: Neem u een kalf, een jong rund, tot zondoffer, en een ram tot brandoffer, *die* volkomen zijn; en breng ze voor het aangezicht van de HEERE.", "3": "Daarna spreek tot de kinderen van Israël, en zeg: Neem een geitenbok tot zondoffer, en een kalf, en een lam, eenjarig, volkomen, tot brandoffer;", "4": "Ook een os en ram tot dankoffer, om voor het aangezicht van de HEERE te offeren; en een spijsoffer met olie gemengd; want vandaag zal de HEERE u verschijnen.", "5": "Toen namen zij wat Mozes geboden had, *en brachten dat* tot voor de tent der samenkomst; en de hele vergadering naderde, en stond voor het aangezicht van de HEERE.", "6": "En Mozes zei: Dit is de zaak die de HEERE geboden heeft, dat u doen zult; en de heerlijkheid van de HEERE zal u verschijnen.", "7": "En Mozes zei tegen Aäron: Nader tot het altaar, en maak uw zondoffer, en uw brandoffer klaar; en doe verzoening voor u en voor het volk; maak daarna de offerande van het volk klaar, en doe de verzoening voor hen, zoals de HEERE geboden heeft.", "8": "Toen naderde Aäron tot het altaar, en slachtte het kalf van het zondoffer, dat voor hem was.", "9": "En de zonen van Aäron brachten het bloed tot hem, en hij doopte zijn vinger in dat bloed, en deed het op de hoornen van het altaar; daarna goot hij het bloed uit aan de bodem van het altaar.", "10": "Maar het vet, en de nieren, en het net van de lever van het zondoffer heeft hij op het altaar aangestoken, zoals de HEERE Mozes geboden had.", "11": "Maar het vlees en de huid verbrandde hij met vuur buiten het leger.", "12": "Daarna slachtte hij het brandoffer; en de zonen van Aäron leverden aan hem het bloed; en hij sprengde dat rondom op het altaar.", "13": "Ook leverden zij aan hem het brandoffer in zijn stukken, met het hoofd; en hij stak het aan op het altaar.", "14": "En hij waste het ingewand en de schenkels; en hij stak ze aan op het brandoffer, op het altaar.", "15": "Daarna liet hij de offerande van het volk toebrengen; en nam de bok van het zondoffer, die voor het volk was, en slachtte hem, en bereidde hem tot zondoffer, zoals de eerste.", "16": "Verder liet hij het brandoffer toebrengen, en maakte dat klaar naar het recht.", "17": "En hij liet het spijsoffer toebrengen, en vulde daarvan zijn hand, en stak het aan op het altaar, behalve het morgenbrandoffer.", "18": "Daarna slachtte hij de os, en de ram tot dankoffer, dat voor het volk was; en de zonen van Aäron leverden het bloed aan hem, dat hij rondom op het altaar sprengde;", "19": "En het vet van de os, en van de ram, de staart, en wat het *ingewand* bedekt, en de nieren, en het net van de lever;", "20": "En zij legden het vet op de borsten; en hij stak dat vet aan op het altaar.", "21": "Maar de borsten en de rechterschouder bewoog Aäron tot beweegoffer voor het aangezicht van de HEERE, zoals Mozes geboden had.", "22": "Daarna hief Aäron zijn handen op tot het volk, en zegende hen; en hij kwam naar beneden, nadat hij het zondoffer, en brandoffer, en dankoffer klaargemaakt had.", "23": "Toen ging Mozes met Aäron in de tent der samenkomst; daarna kwamen zij naar buiten, en zegenden het volk; en de heerlijkheid van de HEERE verscheen aan heel het volk.", "24": "Want een vuur ging uit van het aangezicht van de HEERE, en verteerde op het altaar het brandoffer, en het vet. Toen heel het volk dit zag, juichten zij, en vielen op hun aangezichten."}, "SV": {"1": "En het geschiedde op den achtsten dag, dat Mozes riep Aäron en zijn zonen, en de oudsten van Israël;", "2": "En hij zeide tot Aäron: Neem u een kalf, een jong rund, ten zondoffer, en een ram ten brandoffer, *die* volkomen zijn; en breng ze voor het aangezicht des HEEREN.", "3": "Daarna spreek tot de kinderen Israëls, zeggende: Neemt een geitenbok ten zondoffer, en een kalf, en een lam, eenjarig, volkomen, ten brandoffer;", "4": "Ook een os en ram ten dankoffer, om voor het aangezicht des HEEREN te offeren; en spijsoffer met olie gemengd; want heden zal de HEERE u verschijnen.", "5": "Toen namen zij hetgeen Mozes geboden had, *brengende* *dat* tot voor aan de tent der samenkomst; en de gehele vergadering naderde, en stond voor het aangezicht des HEEREN.", "6": "En Mozes zeide: Deze zaak, die de HEERE geboden heeft, zult gij doen; en de heerlijkheid des HEEREN zal u verschijnen.", "7": "En Mozes zeide tot Aäron: Nader tot het altaar, en maak uw zondoffer, en uw brandoffer toe; en doe verzoening voor u en voor het volk; maak daarna de offerande des volks toe, en doe de verzoening voor hen, gelijk als de HEERE geboden heeft.", "8": "Toen naderde Aäron tot het altaar, en slachtte het kalf des zondoffers, dat voor hem was.", "9": "En de zonen van Aäron brachten het bloed tot hem, en hij doopte zijn vinger in dat bloed, en deed het op de hoornen des altaars; daarna goot hij het bloed uit aan den bodem des altaars.", "10": "Maar het vet, en de nieren, en het net van de lever van het zondoffer heeft hij op het altaar aangestoken, gelijk als de HEERE Mozes geboden had.", "11": "Doch het vlees, en de huid verbrandde hij met vuur buiten het leger.", "12": "Daarna slachtte hij het brandoffer; en de zonen van Aäron leverden aan hem het bloed; en hij sprengde dat rondom op het altaar.", "13": "Ook leverden zij aan hem het brandoffer in zijn stukken, met het hoofd; en hij stak het aan op het altaar.", "14": "En hij wies het ingewand en de schenkelen; en hij stak ze aan op het brandoffer, op het altaar.", "15": "Daarna deed hij de offerande des volks toebrengen; en nam den bok des zondoffers, die voor het volk was, en slachtte hem, en bereidde hem ten zondoffer, gelijk het eerste.", "16": "Verder deed hij het brandoffer toebrengen, en maakte dat toe naar het recht.", "17": "En hij deed het spijsoffer toebrengen, en vulde daarvan zijn hand, en stak het aan op het altaar, behalve het morgenbrandoffer.", "18": "Daarna slachtte hij den os, en den ram ten dankoffer, dat voor het volk was; en de zonen van Aäron leverden het bloed aan hem, hetwelk hij rondom op het altaar sprengde;", "19": "En het vet van den os, en van den ram, den staart, en wat het *ingewand* bedekt, en de nieren, en het net der lever;", "20": "En zij leiden het vet op de borsten; en hij stak dat vet aan op het altaar.", "21": "Maar de borsten en den rechterschouder bewoog Aäron ten beweegoffer voor het aangezicht des HEEREN, gelijk als Mozes geboden had.", "22": "Daarna hief Aäron zijn handen op tot het volk, en zegende hen; en hij kwam af, nadat hij het zondoffer, en brandoffer, en dankoffer gedaan had.", "23": "Toen ging Mozes met Aäron in de tent der samenkomst; daarna kwamen zij uit, en zegenden het volk; en de heerlijkheid des HEEREN verscheen al het volk.", "24": "Want een vuur ging uit van het aangezicht des HEEREN, en verteerde op het altaar het brandoffer, en het vet. Als het ganse volk dit zag, zo juichten zij, en vielen op hun aangezichten."}, "KJV": {"1": "And it came to pass on the eighth day, *that* Moses called Aaron and his sons, and the elders of Israel;", "2": "And he said unto Aaron, Take thee a young calf for a sin offering, and a ram for a burnt offering, without blemish, and offer *them* before the LORD.", "3": "And unto the children of Israel thou shalt speak, saying, Take ye a kid of the goats for a sin offering; and a calf and a lamb, *both* of the first year, without blemish, for a burnt offering;", "4": "Also a bullock and a ram for peace offerings, to sacrifice before the LORD; and a meat offering mingled with oil: for to day the LORD will appear", "5": "And they brought *that* which Moses commanded before the tabernacle of the congregation: and all the congregation drew near and stood before the LORD.", "6": "And Moses said, This *is* the thing which the LORD commanded that ye should do: and the glory of the LORD shall appear", "7": "And Moses said unto Aaron, Go unto the altar, and offer thy sin offering, and thy burnt offering, and make an atonement for thyself, and for the people: and offer the offering of the people, and make an atonement for them; as the LORD commanded.", "8": "Aaron therefore went unto the altar, and slew the calf of the sin offering,", "9": "And the sons of Aaron brought the blood unto him: and he dipped his finger in the blood, and put *it* upon the horns of the altar, and poured out the blood at the bottom of the altar:", "10": "But the fat, and the kidneys, and the caul above the liver of the sin offering, he burnt upon the altar; as the LORD commanded Moses.", "11": "And the flesh and the hide he burnt with fire without the camp.", "12": "And he slew the burnt offering; and Aaron's sons presented unto him the blood, which he sprinkled round about upon the altar.", "13": "And they presented the burnt offering unto him, with the pieces thereof, and the head: and he burnt *them* upon the altar.", "14": "And he did wash the inwards and the legs, and burnt *them* upon the burnt offering on the altar.", "15": "And he brought the people's offering, and took the goat, which *was* the sin offering for the people, and slew it, and offered it for sin, as the first.", "16": "And he brought the burnt offering, and offered it according to the manner.", "17": "And he brought the meat offering, and took an handful thereof, and burnt *it* upon the altar, beside the burnt sacrifice of the morning.", "18": "He slew also the bullock and the ram *for* a sacrifice of peace offerings, which *was* for the people: and Aaron's sons presented unto him the blood, which he sprinkled upon the altar round about,", "19": "And the fat of the bullock and of the ram, the rump, and that which covereth *the inwards*, and the kidneys, and the caul *above* the liver:", "20": "And they put the fat upon the breasts, and he burnt the fat upon the altar:", "21": "And the breasts and the right shoulder Aaron waved *for* a wave offering before the LORD; as Moses commanded.", "22": "And Aaron lifted up his hand toward the people, and blessed them, and came down from offering of the sin offering, and the burnt offering, and peace offerings.", "23": "And Moses and Aaron went into the tabernacle of the congregation, and came out, and blessed the people: and the glory of the LORD appeared unto all the people.", "24": "And there came a fire out from before the LORD, and consumed upon the altar the burnt offering and the fat: *which* when all the people saw, they shouted, and fell on their faces."}}, "tsk": {"1": [{"kopje": "de achtste dag", "refs": ["Lev 12:2", "Lev 12:3", "Lev 14:8-10", "Lev 15:13", "Lev 15:14", "Lev 22:27", "Num 6:9", "Num 6:10", "Lev 8:33", "Lev 14:10", "Lev 14:23", "Lev 15:14", "Lev 15:29", "Num 6:10", "Ezech 43:26", "Ezech 43:27", "Matt 28:1"]}], "2": [{"kopje": "een jong rund", "refs": ["Lev 9:7", "Lev 9:8", "Lev 4:3", "Lev 8:14", "Ex 29:1", "2 Kor 5:21", "Hebr 5:3", "Hebr 7:27", "Hebr 10:10-14"]}, {"kopje": "en een ram", "refs": ["Lev 8:18"]}], "3": [{"kopje": "Neem", "refs": ["Lev 4:23", "Lev 16:5", "Lev 16:15", "Ezra 6:17", "Ezra 10:19", "Jes 53:10", "Rom 8:3", "2 Kor 5:21", "Tit 2:14", "Hebr 9:26-28", "1 Petr 2:24", "1 Petr 3:18", "Openb 5:9"]}, {"kopje": "een kalf", "refs": ["Lev 9:2"]}, {"kopje": "en een lam", "refs": ["Lev 12:6", "Lev 14:10", "Lev 23:12", "Ex 12:5"]}], "4": [{"kopje": "Een os", "refs": ["Lev 3:1-17"]}, {"kopje": "en een spijsoffer", "refs": ["Lev 2:1-16", "Lev 6:14-23", "Num 15:3-9"]}, {"kopje": "vandaag", "refs": ["Lev 9:6", "Lev 9:23", "Ex 16:10", "Ex 19:11", "Ex 24:16", "Ex 29:43", "Ex 40:34", "Ex 40:35", "Num 14:10", "Num 16:19", "1 Kon 8:10-12", "Ezech 43:2"]}], "5": [{"kopje": "de hele vergadering", "refs": ["Ex 19:17", "Deut 31:12", "1 Kron 15:3", "2 Kron 5:2", "2 Kron 5:3", "Neh 8:2"]}], "6": [{"kopje": "de heerlijkheid", "refs": ["Lev 9:23", "Ex 16:10", "Ex 24:16", "Ex 40:34", "Ex 40:35", "1 Kon 8:10-12", "2 Kron 5:13", "2 Kron 5:14", "Ezech 43:2"]}], "7": [{"kopje": "uw zondoffer", "refs": ["Lev 9:2", "Lev 4:3", "Lev 4:20", "Lev 8:34", "1 Sam 3:14", "Hebr 5:3", "Hebr 7:27", "Hebr 7:28", "Hebr 9:7"]}, {"kopje": "de offerande" ", "href": "../../nave/m/#t-miracles", "kinderen": [{"label": "Catalogue Of", "href": "../../nave/m/?hl=Lev.9.24#i13833", "refs": [], "kinderen": [{"label": "Of Aaron", "href": "../../nave/m/?hl=Lev.9.24#i13881", "refs": [{"disp": "Lev 9:24", "href": "../../leviticus/9/#v24", "ref": "Lev 9:24", "svLabel": null}], "kinderen": []}]}]}], "torrey": [{"topic": "Altar Of Burnt-offering, The", "href": "../../torrey/a/#t-altar-of-burnt-offering-the", "kinderen": [{"label": "The Fire Upon", "href": "../../torrey/a/?hl=Lev.9.24#i382", "refs": [], "kinderen": [{"label": "Came from before the Lord", "href": "../../torrey/a/?hl=Lev.9.24#i383", "refs": [{"disp": "Lev 9:24", "href": "../../leviticus/9/#v24", "ref": "Lev 9:24", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Fire", "href": "../../torrey/f/#t-fire", "kinderen": [{"label": "Sacred", "href": "../../torrey/f/?hl=Lev.9.24#i6781", "refs": [], "kinderen": [{"label": "Came from before the Lord", "href": "../../torrey/f/?hl=Lev.9.24#i6782", "refs": [{"disp": "Lev 9:24", "href": "../../leviticus/9/#v24", "ref": "Lev 9:24", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Sacrifices", "href": "../../torrey/s/#t-sacrifices", "kinderen": [{"label": "Often consumed by fire from heaven", "href": "../../torrey/s/?hl=Lev.9.24#i18271", "refs": [{"disp": "Lev 9:24", "href": "../../leviticus/9/#v24", "ref": "Lev 9:24", "svLabel": null}, {"disp": "1 Kon 18:38", "href": "../../1-koningen/18/#v38", "ref": "1 Kon 18:38", "svLabel": null}, {"disp": "2 Kron 7:1", "href": "../../2-kronieken/7/#v1", "ref": "2 Kron 7:1", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Num 28:22": "Daarna een bok als zondoffer, om voor u verzoening te doen.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "2 Kron 6:3": "Daarna wendde de koning zijn gezicht om, en zegende de gehele gemeente van Israël; en de gehele gemeente van Israël stond.", "Lev 8:29": "Verder nam Mozes de borst, en bewoog ze als beweegoffer voor het aangezicht van de HEERE; zij werd Mozes ten deel van de ram van het vuloffer, zoals de HEERE Mozes geboden had.", "Hebr 7:28": "Want de wet stelt tot hogepriesters mensen aan, die zwakheid hebben; maar het woord van de eedzwering, dat na de wet gekomen is, stelt de Zoon aan, Die in eeuwigheid volmaakt gemaakt is.", "Hebr 9:7": "maar in de tweede tabernakel ging alleen de hogepriester, eenmaal per jaar, niet zonder bloed, dat hij offerde voor zichzelf en voor de overtredingen van het volk.", "Deut 31:9": "En Mozes schreef deze wet, en gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël.", "Num 6:10": "En op de achtste dag zal hij twee tortelduiven of twee jonge duiven brengen tot de priester, tot de deur van de tent der samenkomst.", "Ex 29:40": "Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam.", "Lev 3:10": "Ook beide de nieren, en het vet, dat daaraan is, dat aan de weekdarmen is; en het net over de lever met de nieren, zal hij afnemen.", "Lev 16:12": "Hij zal ook een wierookvat vol vurige kolen nemen van het altaar, van voor het aangezicht van de HEERE, en zijn handen vol fijngestoten reukwerk van welriekende specerijen; en hij zal het binnen het voorhangsel dragen.", "Lev 19:22": "En de priester zal met de ram van het schuldoffer, voor hem over zijn zonde die hij gezondigd heeft, voor het aangezicht van de HEERE verzoening doen; en hem zal vergeving gebeuren van zijn zonde die hij gezondigd heeft.", "Ex 29:43": "En daar zal Ik komen tot de kinderen van Israël; opdat zij geheiligd worden door Mijn heerlijkheid.", "Num 10:35": "Het gebeurde nu bij het optrekken van de ark, dat Mozes zei: Sta op, HEERE! En laat Uw vijanden verstrooid worden, en laat Uw haters van Uw aangezicht vluchten!", "Lev 9:1-21": "Het gebeurde op de achtste dag, dat Mozes Aäron en zijn zonen riep, en de oudsten van Israël; En hij zei tegen Aäron: Neem u een kalf, een jong rund, tot zondoffer, en een ram tot brandoffer, die volkomen zijn; en breng ze voor het aangezicht van de HEERE. Daarna spreek tot de kinderen van Israël, en zeg: Neem een geitenbok tot zondoffer, en een kalf, en een lam, eenjarig, volkomen, tot brandoffer;", "Ex 29:1": "Dit nu is de zaak die u met hen doen zult, om hen te heiligen, zodat zij Mij het priesterambt bedienen: neem een jonge stier, het jong van een rund, en twee volkomen rammen;", "Num 6:20": "En de priester zal die bewegen als beweegoffer, voor het aangezicht van de HEERE; het is een heilig deel voor de priester, met de borst van het beweegoffer en met de schouder van het hefoffer; en daarna zal die Nazireeër wijn drinken.", "Matt 28:1": "En na de sabbat, toen het licht begon te worden op de eerste dag van de week, kwamen Maria Magdalena en de andere Maria om naar het graf te kijken.", "Ex 3:2": "En de Engel van de HEERE verscheen hem in een vuurvlam uit het midden van een braambos; en hij zag, en zie, het braambos brandde in het vuur, en het braambos werd niet verteerd.", "Lev 4:19": "Verder zal hij al zijn vet van hem opnemen, en op het altaar in rook laten opgaan.", "Lev 16:24-34": "En hij zal zijn lichaam in de heilige plaats met water baden, en zijn klederen aandoen; dan zal hij naar buiten gaan, en zijn brandoffer, en het brandoffer van het volk bereiden, en voor zichzelf en voor het volk verzoening doen. Ook zal hij het vet van het zondoffer op het altaar in rook laten opgaan. En hij die de bok, die een weggaande bok was, weggebracht heeft, zal zijn klederen wassen, en zijn lichaam met water baden; en daarna zal hij in het kamp komen.", "Ex 40:27": "En hij stak daarop reukwerk aan van welriekende specerijen, zoals de HEERE aan Mozes geboden had.", "Lev 8:14-36": "Toen liet hij de stier van het zondoffer bijeenkomen; en Aäron en zijn zonen legden hun handen op het hoofd van de stier van het zondoffer; En men slachtte hem; en Mozes nam het bloed, en deed het met zijn vinger rondom op de hoornen van het altaar, en ontzondigde het altaar; daarna goot hij het bloed uit aan de voet van het altaar, en heiligde het, om er verzoening voor te doen. Verder nam hij al het vet dat aan het ingewand zit, en het net van de lever, en de twee nieren en hun vet; en Mozes stak het aan op het altaar.", "Gen 14:22": "Doch Abram zei tegen de koning van Sodom: Ik heb mijn hand opgeheven tot de HEERE, de allerhoogste God, Die hemel en aarde bezit;", "Lev 8:16": "Verder nam hij al het vet dat aan het ingewand zit, en het net van de lever, en de twee nieren en hun vet; en Mozes stak het aan op het altaar.", "Lev 12:6-8": "En als de dagen van haar reiniging voor de zoon of voor de dochter vervuld zijn, zal zij een eenjarig lam als brandoffer, en een jonge duif of tortelduif als zondoffer brengen, naar de deur van de tent van de samenkomst, naar de priester. Die zal het offeren voor het aangezicht van de HEERE, en voor haar verzoening doen; zo zal zij rein zijn van de vloed van het bloed van haar. Dit is de wet voor haar die een jongetje of meisje gebaard heeft. Maar als haar hand niet genoeg vindt voor een lam, zal zij twee tortelduiven of twee jonge duiven nemen, één als brandoffer en één als zondoffer; en de priester zal voor haar verzoening doen; zo zal zij rein zijn.", "Num 5:18": "Daarna zal de priester de vrouw voor het aangezicht van de HEERE stellen, en zal het hoofd van de vrouw ontbloten, en zal het spijsoffer van de gedachtenis op haar handen leggen, dat het spijsoffer van de ijveringen is; en in de hand van de priester zal dat bittere water zijn, dat de vloek meebrengt.", "Num 15:22-28": "Verder, wanneer u afgedwaald zult zijn, en niet gedaan hebt al deze geboden die de HEERE tot Mozes gesproken heeft; Alles wat de HEERE u door de hand van Mozes geboden heeft; van de dag af dat de HEERE het geboden heeft, en vervolgens bij uw geslachten; Dan zal het gebeuren, indien iets bij dwaling gedaan is, en voor de ogen van de vergadering verborgen is, dat de hele vergadering een var, een jong rund, zal bereiden tot brandoffer, tot een liefelijke reuk voor de HEERE, met zijn spijsoffer en zijn drankoffer, naar de gebruikelijke wijze; en een geitenbok tot zondoffer.", "Num 6:19": "Daarna zal de priester een gekookte schouder nemen van de ram, en een ongezuurde koek uit de korf, en een ongezuurde vlade; en hij zal ze op de handen van de Nazireeër leggen, nadat hij zijn Nazireeërschap afgeschoren heeft.", "Ps 20:5": "Hij geeft u naar uw hart, en vervult al uw raad.", "Neh 8:2": "verzamelde het hele volk zich als één man op het plein voor de Waterpoort; en zij zeiden tegen Ezra, de schriftgeleerde, dat hij het boek van de wet van Mozes zou halen, die de HEERE aan Israël geboden had.", "Richt 13:20": "En het gebeurde, toen de vlam van het altaar opsteeg naar de hemel, dat de Engel van de HEERE opsteeg in de vlam van het altaar. Toen Manoach en zijn vrouw dat zagen, vielen zij op hun gezicht ter aarde.", "Lev 23:19": "Ook zult u een geitenbok tot zondoffer, en twee eenjarige lammeren tot dankoffer bereiden.", "1 Sam 3:14": "Daarom heb Ik het huis van Eli gezworen: Nooit zal het ongerecht van het huis van Eli tot in eeuwigheid verzoend worden door slachtoffer of door spijsoffer!", "Deut 32:14": "Boter van koeien, en melk van klein vee, met het vet van de lammeren en van de rammen, die in Basan weiden, en van de bokken, met het vette van de nieren van tarwe; en het druivenbloed, reine wijn, hebt u gedronken.", "Ex 17:5": "Toen zei de HEERE tegen Mozes: Ga voor het volk uit, en neem enkele van de oudsten van Israël met u mee; en neem uw staf, waarmee u de rivier sloeg, in uw hand, en ga op weg.", "Ex 19:17": "En Mozes leidde het volk uit het leger, God tegemoet; en zij stonden onderaan de berg.", "1 Kron 15:3": "Ook verzamelde David heel Israël in Jeruzalem, om de ark van de HEERE op te halen naar haar plaats, die hij voor haar bereid had.", "Lev 4:20": "En hij zal met deze var doen zoals hij met de var van het zondoffer gedaan heeft, zo zal hij met hem doen; en de priester zal voor hen verzoening doen, en het zal hun vergeven worden.", "Lev 8:15": "En men slachtte hem; en Mozes nam het bloed, en deed het met zijn vinger rondom op de hoornen van het altaar, en ontzondigde het altaar; daarna goot hij het bloed uit aan de voet van het altaar, en heiligde het, om er verzoening voor te doen.", "Jes 49:3": "En Hij heeft tegen Mij gezegd: U bent Mijn Knecht, Israël, door Wie Ik verheerlijkt zal worden.", "Joz 23:2": "Zo riep Jozua heel Israël, hun oudsten, en hun hoofden, en hun rechters, en hun opzichters, en hij zei tegen hen: Ik ben oud geworden, en wel bedaagd;", "Hand 5:21-41": "Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen. Maar toen de dienaars daar kwamen, vonden zij hen niet in de gevangenis, maar keerden terug, en berichtten dit, en zeiden: Wij vonden de kerker met alle zorgvuldigheid gesloten, en de wachters buiten staand voor de deuren; maar toen wij die geopend hadden, vonden wij niemand daarbinnen.", "Joz 24:24": "En het volk zei tegen Jozua: Wij zullen de HEERE, onze God, dienen, en wij zullen Zijn stem gehoorzamen.", "Lev 10:17": "Waarom hebt u dat zondoffer niet gegeten in de heilige plaats? Want het is allerheiligst, en Hij heeft het u gegeven, opdat u de ongerechtigheid van de gemeenschap zou dragen, om voor hen verzoening te doen voor het aangezicht van de HEERE.", "Num 5:15": "Dan zal die man zijn huisvrouw tot de priester brengen, en zal haar offerande voor haar meebrengen, een tiende deel van een efa gerstemeel; hij zal geen olie daarop gieten, en geen wierook daarop leggen, omdat het een spijsoffer van de ijveringen is, een spijsoffer van de gedachtenis, dat de ongerechtigheid in gedachtenis brengt.", "Lev 3:15": "Alsook de beide nieren, en het vet, dat daaraan is, dat aan de weekdarmen is; en het net over de lever, met de nieren, zal hij afnemen.", "Num 29:11": "Een geitenbok tot een zondoffer, behalve het zondoffer van de verzoeningen, en het gedurige brandoffer; en zijn spijsoffer, met hun drankoffers.", "Num 10:10": "Ook op de dag van uw vrolijkheid, en op uw vastgestelde hoogtijden, en aan de begin van uw maanden, zult u ook met de trompetten blazen over uw brandoffers en over uw dankoffers; en zij zullen u ter gedachtenis zijn voor het aangezicht van uw God; Ik ben de HEERE, uw God!", "Deut 1:13-15": "Neem voor u wijze, verstandige en ervaren mannen, uit uw stammen, zodat ik hen tot uw hoofden stel. Toen antwoordde u mij, en zei: Dit woord dat u gesproken hebt, is goed om te doen. Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen.", "Lev 9:12-14": "Daarna slachtte hij het brandoffer; en de zonen van Aäron leverden aan hem het bloed; en hij sprengde dat rondom op het altaar. Ook leverden zij aan hem het brandoffer in zijn stukken, met het hoofd; en hij stak het aan op het altaar. En hij waste het ingewand en de schenkels; en hij stak ze aan op het brandoffer, op het altaar.", "Num 29:6": "Behalve het brandoffer van de maand, en zijn spijsoffer, en het gedurige brandoffer, en zijn spijsoffer, met hun drankoffers, naar hun wijze, tot een liefelijke reuk, een vuuroffer voor de HEERE.", "Hebr 10:1-22": "Want de wet, die een schaduw heeft van de toekomstige goederen en niet het beeld zelf van de zaken, kan met dezelfde offers, die zij elk jaar voortdurend opofferen, nooit degenen die daar toegaan volmaakt maken. Zou anders het offeren niet opgehouden zijn, omdat degenen die de dienst uitvoerden geen geweten van zonden meer zouden hebben, eenmaal gereinigd zijnde? Maar in die offers wordt elk jaar juist weer aan de zonden gedacht.", "Lev 4:34": "Daarna zal de priester van het bloed van het zondoffer met zijn vinger nemen, en zal het doen op de hoornen van het altaar van het brandoffer; dan zal hij al het bloed daarvan aan de voet van dat altaar uitgieten.", "Jes 49:22": "Zo zegt de Heere HEERE: Zie, Ik zal Mijn hand opheffen naar de heidenen, en naar de volken zal Ik Mijn banier opsteken; dan zullen zij uw zonen in de armen brengen, en uw dochters zullen op de schouder gedragen worden.", "Joz 8:10": "En Jozua maakte zich 's morgens vroeg op, en hij monsterde het volk; en hij trok op, hij en de oudsten van Israël, voor het volk uit, naar Ai.", "Num 6:9": "En als degene onvoorziens, snel bij hem gestorven is, waardoor hij het hoofd van zijn Nazireeërschap zou hebben verontreinigd, dan zal hij op de dag van zijn reiniging zijn hoofd scheren; op de zevende dag zal hij het scheren.", "Hebr 5:1": "Want elke hogepriester, die uit de mensen genomen wordt, wordt aangesteld voor de mensen in de zaken die bij God gedaan moeten worden, opdat hij gaven en slachtoffers offert voor de zonden;", "Lev 6:7": "Dan zal de priester voor hem verzoening doen voor het aangezicht van de HEERE, en het zal hem vergeven worden; over iets van alles wat hij doet, waaraan hij schuldig is.", "1 Kon 18:38": "Toen viel het vuur van de HEERE, en verteerde dat brandoffer, en dat hout, en die stenen, en dat stof, ja, likte dat water op dat in de geul was.", "Lev 7:31": "En de priester zal dat vet op het altaar aansteken; maar de borst zal voor Aäron en zijn zonen zijn.", "Lev 8:25-29": "En hij nam het vet, en de staart, en al het vet dat aan het ingewand zit, en het net van de lever, en de beide nieren, en hun vet, alsook de rechterschouder. Ook nam hij uit de korf met de ongezuurde broden, die voor het aangezicht van de HEERE was, één ongezuurde koek, en een geoliede broodkoek, en één wafel; en hij legde ze op dat vet, en op de rechterschouder. En hij gaf dat alles in de handen van Aäron, en in de handen van zijn zonen; en bewoog die als beweegoffer, voor het aangezicht van de HEERE.", "Deut 31:28": "Verzamel bij mij alle oudsten van uw stammen, en uw opzichters; opdat ik ten aanhoren van hen deze woorden spreek, en tegen hen de hemel en de aarde tot getuigen neem.", "Ex 29:10-14": "En u zult de stier dichtbij brengen voor de tent van de samenkomst; en Aäron en zijn zonen zullen hun handen op het hoofd van de stier leggen. En u zult de stier slachten voor het aangezicht van de HEERE, bij de deur van de tent van de samenkomst. Daarna zult u van het bloed van de stier nemen, en met uw vinger op de hoornen van het altaar doen; en al het bloed zult u uitgieten bij de bodem van het altaar.", "Ex 29:22": "Daarna zult u van de ram nemen het vet alsook de staart, ook het vet, dat het ingewand bedekt, en het net van de lever en de beide nieren, met het vet, dat daaraan is, en de rechterschouder; want het is een ram van de vuloffers;", "Ps 51:19": "De offeranden van God zijn een gebroken geest; een gebroken en verslagen hart zult U, o God! niet verachten.", "2 Kron 5:3": "En alle mannen van Israël verzamelden zich bij de koning op het feest, dat in de zevende maand was.", "Num 29:16-38": "En een geitenbok tot een zondoffer; behalve het gedurige brandoffer, zijn spijsoffer, en zijn drankoffer. Daarna, op de tweede dag: twaalf jonge varren, twee rammen, veertien volkomen eenjarige lammeren; En hun spijsoffer, en hun drankoffers voor de varren, voor de rammen, en voor de lammeren, naar hun aantal, volgens de wijze;", "Ex 30:9": "U moet geen vreemd reukwerk daarop aansteken, ook geen brandoffer, geen spijsoffer; u moet er ook geen drankoffer op gieten.", "Luk 24:50": "En Hij leidde hen naar buiten tot bij Bethanië, en hief Zijn handen op en zegende hen.", "Openb 7:11": "En alle engelen stonden rond de troon, en rond de oudsten en de vier dieren; en zij vielen voor de troon neer op hun gezicht, en aanbaden God,", "Lev 12:6": "En als de dagen van haar reiniging voor de zoon of voor de dochter vervuld zijn, zal zij een eenjarig lam als brandoffer, en een jonge duif of tortelduif als zondoffer brengen, naar de deur van de tent van de samenkomst, naar de priester.", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "Spr 23:26": "Mijn zoon! geef mij uw hart, en laat uw ogen mijn wegen behartigen.", "Num 6:14": "Hij dan zal als zijn offer aan de HEERE offeren een volkomen eenjarig lam als brandoffer, en een volkomen eenjarig ooilam als zondoffer, en een volkomen ram als dankoffer.", "Lev 15:30": "Dan zal de priester de één als zondoffer en de ander als brandoffer bereiden; en de priester zal voor haar, vanwege de vloed van haar onreinheid, verzoening doen voor het aangezicht van de HEERE.", "Lev 4:18": "En van dat bloed zal hij doen op de hoornen van het altaar dat voor het aangezicht van de HEERE is, dat in de tent der samenkomst is; dan zal hij al het bloed uitgieten aan de voet van het altaar van het brandoffer, dat bij de deur van de tent der samenkomst is.", "Lev 10:15": "De hefschouder en de beweegborst zullen zij samen met de vuuroffers van het vet brengen, om als beweegoffer voor het aangezicht van de HEERE te bewegen; dat zal voor u en uw zonen met u tot een eeuwige inzetting zijn, zoals de HEERE geboden heeft.", "Num 15:3-16": "En u de HEERE een vuuroffer zult doen, een brandoffer of slachtoffer, om een gelofte af te zonderen, of in een vrijwillig offer, of op uw vastgestelde hoogtijden, om de HEERE een liefelijke reuk te maken, van runderen of van klein vee; Zo zal hij, die zijn offerande de HEERE offert, een spijsoffer offeren van een tiende meelbloem, gemengd met een vierendeel van een hin olie. En wijn ten drankoffer, een vierendeel van een hin, zult u bereiden tot een brandoffer of tot een slachtoffer, voor één lam.", "Lev 3:1-17": "En als zijn offergave een dankoffer is; als hij het van de runderen offert, hetzij mannetje of vrouwtje, volmaakt zal hij het offeren, voor het aangezicht van de HEERE. En hij zal zijn hand op het hoofd van zijn offergave leggen, en zal het slachten voor de deur van de tent der samenkomst; en de zonen van Aäron, de priesters, zullen het bloed rondom op het altaar sprengen. Daarna zal hij van dat dankoffer een vuuroffer aan de HEERE offeren; het vet, dat het ingewand bedekt, en al het vet, dat aan het ingewand is.", "Lev 4:11": "Maar de huid van die var, en al zijn vlees, met zijn hoofd en met zijn schenkels, en zijn ingewand, en zijn mest;", "Ex 24:1": "Daarna zei Hij tegen Mozes: Klim op tot de HEERE, u en Aäron, Nadab en Abihu, en zeventig van de oudsten van Israël; en buig u neer van verre!", "Deut 23:12": "U zult ook een plaats hebben buiten het leger, en daarheen zult u naar buiten gaan.", "Num 4:16": "Het toezicht nu van Eleazar, de zoon van Aäron, de priester, zal zijn over de olie van het licht, en het reukwerk van de welriekende specerijen, en het gedurige spijsoffer, en de zalfolie; het toezicht over de hele tabernakel, en alles wat daarin is, over het heiligdom en zijn gereedschap.", "Hebr 9:22": "En bijna alle dingen worden door bloed gereinigd naar de wet, en zonder bloedstorting gebeurt er geen vergeving.", "Ex 29:13": "U zult ook al het vet nemen, dat het ingewand bedekt, en het net over de lever, en beide nieren en het vet, dat daaraan is, en u zult ze in rook laten opgaan op het altaar.", "2 Kron 7:1": "Toen Salomo klaar was met bidden, daalde het vuur van de hemel neer en verteerde het brandoffer en de slachtoffers; en de heerlijkheid van de HEERE vervulde het huis.", "Luk 1:22": "En toen hij naar buiten kwam, kon hij niet tegen hen spreken; en zij begrepen dat hij een visioen in de tempel had gezien. En hij bleef naar hen wenken, en bleef stom.", "Lev 14:8-10": "Die nu te reinigen is, zal zijn kleren wassen, en al zijn haar afscheren, en zich in het water afwassen, dan zal hij rein zijn; daarna zal hij in het leger komen, maar zal buiten zijn tent zeven dagen blijven. En op de zevende dag zal gebeuren dat hij al zijn haar afscheert, zijn hoofd, en zijn baard, en de wenkbrauwen van zijn ogen; ja, al zijn haar zal hij afscheren, en al zijn kleren wassen, en zijn lichaam met water baden, dan zal hij rein zijn. En op de achtste dag zal hij twee volkomen lammeren, en een eenjarig volkomen schaap nemen, alsook drie tienden meelbloem als spijsoffer, met olie gemengd, en een log olie.", "Lev 4:8-12": "Verder zal hij al het vet van de var van het zondoffer daarvan opnemen; het vet dat het ingewand bedekt, en al het vet dat aan het ingewand is; Daarbij de twee nieren, en het vet dat daaraan is, dat aan de weekdarmen is, en het net over de lever, met de nieren, zal hij wegnemen; Zoals het van de os van het dankoffer opgenomen wordt; en de priester zal ze in rook laten opgaan op het altaar van het brandoffer.", "Lev 23:17-20": "U zult uit uw woningen twee beweegbroden brengen, zij zullen van twee tienden meelbloem zijn, gedesemd zullen zij gebakken worden; het zijn de eerstelingen voor de HEERE. U zult ook met het brood zeven volkomen eenjarige lammeren, en een var, het jong van een rund, en twee rammen offeren; zij zullen voor de HEERE een brandoffer zijn, met hun spijsoffer en hun drankoffers, een vuuroffer, tot een liefelijke reuk voor de HEERE. Ook zult u een geitenbok tot zondoffer, en twee eenjarige lammeren tot dankoffer bereiden.", "Ezra 3:11": "En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE.", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "Gen 14:18-20": "En Melchizedek, koning van Salem, bracht brood en wijn; en hij was een priester van de allerhoogste God. En hij zegende hem en zei: Gezegend zij Abram door God, de Allerhoogste, Die hemel en aarde bezit! En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Num 18:9": "Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn.", "Kol 1:20": "en dat Hij, door Hem vrede gemaakt te hebben door het bloed van Zijn kruis, door Hem, zeg ik, alle dingen met Zichzelf verzoenen zou, hetzij de dingen die op de aarde, hetzij de dingen die in de hemelen zijn.", "Num 28:15": "Daartoe zal een geitenbok als zondoffer voor de HEERE, boven het voortdurende brandoffer, bereid worden, met zijn drankoffer.", "Lev 4:8": "Verder zal hij al het vet van de var van het zondoffer daarvan opnemen; het vet dat het ingewand bedekt, en al het vet dat aan het ingewand is;", "Lev 8:34": "Zoals men gedaan heeft op deze dag, heeft de HEERE geboden te doen, om voor u verzoening te doen.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Lev 2:1-16": "Als iemand de HEERE een offer van spijsoffer zal brengen, zal zijn offer van meelbloem zijn; en hij zal olie daarop gieten, en wierook daarop leggen. En hij zal het brengen tot de zonen van Aäron, de priesters, van wie er één daarvan zijn hand vol zal grijpen uit de meelbloem, en uit de olie, met alle wierook; en de priester zal het gedenkoffer daarvan aansteken op het altaar; het is een vuuroffer, tot een liefelijke reuk voor de HEERE. Wat nu overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is allerheiligst van de vuuroffers van de HEERE.", "Hebr 5:3": "en om die zwakheid moet hij, zoals voor het volk, zo ook voor zichzelf, offers brengen voor de zonden.", "Num 10:36": "En als zij rustte, zei hij: Kom terug, HEERE, tot de tienduizenden van de duizenden van Israël!", "1 Kon 18:39": "Toen heel het volk dat zag, vielen zij op hun gezicht, en zeiden: De HEERE is God, de HEERE is God!", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "Num 15:27": "En indien één ziel door afdwaling gezondigd zal hebben, zal die een eenjarige geit tot zondoffer offeren.", "Lev 8:18-21": "Daarna liet hij de ram van het brandoffer bijbrengen; en Aäron en zijn zonen legden hun handen op het hoofd van de ram. En men slachtte hem; en Mozes sprenkelde het bloed rondom op het altaar. Hij deelde de ram in zijn delen; en Mozes stak het hoofd aan, en die delen, en het vet;", "Lev 4:35": "En al het vet daarvan zal hij wegnemen, zoals het vet van het lam van het dankoffer weggenomen wordt, en de priester zal ze in rook laten opgaan op het altaar, op de vuuroffers van de HEERE; en de priester zal voor hem verzoening doen over zijn zonde, die hij gezondigd heeft, en het zal hem vergeven worden.", "Lev 3:4": "Dan zal hij beide de nieren, en het vet, dat daaraan is, dat aan de weekdarmen is; en het net over de lever, met de nieren, zal hij afnemen.", "Ex 40:29": "En hij zette het altaar van het brandoffer bij de deur van de tabernakel, van de tent der samenkomst; en hij offerde daarop brandoffer en spijsoffer, zoals de HEERE aan Mozes geboden had.", "Hebr 9:24-28": "Want Christus is niet ingegaan in het heiligdom dat met handen gemaakt is, dat een tegenbeeld is van het ware, maar in de hemel zelf, om nu te verschijnen voor het aangezicht van God voor ons; ook niet opdat Hij Zichzelf dikwijls zou opofferen, zoals de hogepriester elk jaar het heiligdom binnengaat met vreemd bloed; (anders had Hij dikwijls moeten lijden, vanaf de grondlegging van de wereld) maar nu is Hij eenmaal, bij de voleinding van de eeuwen, geopenbaard, om de zonde teniet te doen, door Zijn eigen offer.", "Lev 3:2": "En hij zal zijn hand op het hoofd van zijn offergave leggen, en zal het slachten voor de deur van de tent der samenkomst; en de zonen van Aäron, de priesters, zullen het bloed rondom op het altaar sprengen.", "Num 16:25": "Toen stond Mozes op, en ging naar Dathan en Abiram; en achter hem gingen de oudsten van Israël.", "Rom 8:3": "Want wat voor de wet onmogelijk was, omdat zij door het vlees krachteloos was, dat heeft God gedaan: Hij heeft Zijn eigen Zoon gezonden in de gelijkenis van het zondige vlees, en dat voor de zonde, en Hij heeft de zonde veroordeeld in het vlees.", "Num 11:30": "Daarna verzamelde Mozes zich met het leger, hij en de oudsten van Israël.", "Lev 6:13": "Het vuur zal voortdurend op het altaar brandend gehouden worden; het zal niet uitgeblust worden.", "Num 6:23": "Spreek tot Aäron en zijn zonen en zeg: Zo zult u de kinderen van Israël zegenen, door tot hen te zeggen:", "Ps 20:4": "Hij gedenkt al uw spijsoffers, en maakt uw brandoffer tot as. Sela.", "Hebr 10:10-14": "Door die wil zijn wij geheiligd, door het offer van het lichaam van Jezus Christus, eens en voor altijd gebracht. En iedere priester stond wel elke dag te dienen, en offerde dikwijls dezelfde offers, die de zonden nooit kunnen wegnemen; Maar Deze, die één offer voor de zonden gebracht heeft, is voor eeuwig gaan zitten aan de rechterhand van God;", "Lev 14:22": "alsook twee tortelduiven, of twee jonge duiven, die zijn hand bereiken kan, waarvan de ene als zondoffer, en de andere als brandoffer zal zijn.", "Lev 7:11-15": "Dit is nu de wet van het dankoffer, dat men de HEERE zal offeren. Als hij dat als een lofoffer offert, zal hij naast het lofoffer ongezuurde koeken met olie gemengd, en ongezuurde vladen met olie bestreken, offeren; en die koeken met olie gemengd zullen van geroosterde meelbloem zijn. Naast de koeken zal hij tot zijn offergave gedesemd brood offeren, samen met het lofoffer van zijn dankoffers.", "Ex 19:7": "En Mozes kwam en riep de oudsten van het volk, en legde hun al deze woorden voor, die de HEERE hem geboden had.", "Openb 5:8": "En toen Het dat boek genomen had, vielen de vier dieren en de vierentwintig oudsten voor het Lam neer, elk met een citer en gouden schalen vol reukwerk, dat zijn de gebeden van de heiligen.", "Ex 29:34": "En indien er iets zal overblijven van het vlees van de vuloffers, of van dit brood, tot aan de morgen, dan zult u het overgeblevene met vuur verbranden; het zal niet gegeten worden, want het is heilig.", "Lev 6:30": "Maar geen zondoffer, waarvan bloed in de tent der samenkomst gebracht wordt om in het heiligdom verzoening te doen, zal gegeten worden; het zal in het vuur verbrand worden.", "Ex 3:18": "En zij zullen naar uw stem luisteren; en u zult gaan, u en de oudsten van Israël, naar de koning van Egypte, en u zult tegen hem zeggen: De HEERE, de God van de Hebreeën, is ons ontmoet; zo laat ons nu toch gaan, drie dagreizen ver de woestijn in, opdat wij de HEERE, onze God, offeren!", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "Lev 14:10": "En op de achtste dag zal hij twee volkomen lammeren, en een eenjarig volkomen schaap nemen, alsook drie tienden meelbloem als spijsoffer, met olie gemengd, en een log olie.", "Lev 8:17": "Maar de stier met zijn huid, en zijn vlees, en zijn mest, heeft hij buiten het leger met vuur verbrand, zoals de HEERE Mozes geboden had.", "Lev 6:17": "Het zal niet met desem gebakken worden; het is hun deel, dat Ik hun gegeven heb van Mijn vuuroffers; het is allerheiligst, evenals het zondoffer en evenals het schuldoffer.", "2 Kron 7:1-3": "Toen Salomo klaar was met bidden, daalde het vuur van de hemel neer en verteerde het brandoffer en de slachtoffers; en de heerlijkheid van de HEERE vervulde het huis. En de priesters konden niet ingaan in het huis van de HEERE, want de heerlijkheid van de HEERE had het huis van de HEERE vervuld. En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "1 Petr 3:18": "Want Christus heeft ook eenmaal voor de zonden geleden, Hij, de Rechtvaardige, voor de onrechtvaardigen, opdat Hij ons tot God zou brengen; Hij is wel gedood in het vlees, maar levend gemaakt door de Geest;", "Lev 16:28": "Wie ze verbrandt, zal zijn klederen wassen, en zijn lichaam met water baden; en daarna zal hij in het kamp komen.", "2 Kron 5:14": "En de priesters konden, vanwege die wolk, niet staan om te dienen; want de heerlijkheid van de HEERE had het huis van God vervuld.", "Ex 30:26": "En daarmee moet u zalven: de tent van de samenkomst en de ark van de getuigenis,", "Lev 8:33": "Ook zult u uit de deur van de tent der samenkomst, zeven dagen lang, niet weggaan, tot aan de dag dat de dagen van uw vuloffer vervuld worden; want zeven dagen zal men uw handen vullen.", "Luk 2:13": "En opeens was er bij de engel een menigte van het hemelse leger, die God prezen en zeiden:", "Deut 23:13": "En u zult een schopje hebben, naast uw gereedschap, en het zal gebeuren, als u buiten gezeten hebt, dat u daarmee graaft, en u omkeert, en bedekt wat van u uitgegaan is.", "Lev 7:19": "En het vlees dat iets onreins aangeraakt heeft, zal niet gegeten worden; met vuur zal het verbrand worden; maar wat het andere vlees betreft, dat vlees mag ieder die rein is, eten.", "Lev 22:27": "Wanneer een os, of lam, of geit geboren zal zijn, dan zal die zeven dagen onder zijn moeder zijn; daarna, vanaf de achtste dag en verder, zal hij aangenaam zijn als offergave van het vuuroffer voor de HEERE.", "Lev 7:30": "Zijn eigen handen zullen de vuuroffers van de HEERE brengen; het vet aan de borst zal hij met die borst brengen, om die als beweegoffer voor het aangezicht van de HEERE te bewegen.", "Lev 8:14": "Toen liet hij de stier van het zondoffer bijeenkomen; en Aäron en zijn zonen legden hun handen op het hoofd van de stier van het zondoffer;", "Lev 23:13": "en zijn spijsoffer twee tienden meelbloem, met olie gemengd, tot een vuuroffer, voor de HEERE tot een liefelijke reuk; en zijn drankoffer van wijn, het vierde deel van een hin.", "Jes 53:10": "Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan.", "1 Kon 8:55": "zo stond hij, en zegende de hele gemeente van Israël, met luide stem, en zei:", "Lev 8:25": "En hij nam het vet, en de staart, en al het vet dat aan het ingewand zit, en het net van de lever, en de beide nieren, en hun vet, alsook de rechterschouder.", "Num 5:25": "En de priester zal uit de hand van die vrouw het spijsoffer van de ijveringen nemen, en hij zal dat spijsoffer voor het aangezicht van de HEERE bewegen, en zal dat op het altaar offeren.", "Lev 5:12": "En hij zal het naar de priester brengen, en de priester zal daarvan een handvol nemen, als gedenkdeel daarvan, en dat op het altaar aansteken, boven op de vuuroffers van de HEERE; het is een zondoffer.", "Ex 24:14": "En hij zei tegen de oudsten: Blijft u hier voor ons, totdat wij weer tot u komen; en zie, Aäron en Hur zijn bij u; wie een zaak heeft, moet naar hen toe gaan.", "Ps 134:2": "Hef uw handen op naar het heiligdom, en loof de HEERE.", "Hebr 9:19": "Want toen alle geboden, naar de wet van Mozes, aan heel het volk uitgesproken waren, nam hij het bloed van kalveren en bokken, met water, en purperen wol, en hysop, en besprenkelde zowel het boek zelf, als heel het volk,", "Lev 6:1-7": "Verder sprak de HEERE tot Mozes en zei: Als een mens gezondigd heeft en tegen de HEERE door overtreding overtreden zal hebben, doordat hij tegen zijn naaste gelogen heeft over iets dat hem in bewaring gegeven was, of ter hand gesteld was, of over roof, of dat hij met geweld zijn naaste iets onthoudt; Of dat hij het verlorene gevonden heeft, en daarover gelogen heeft, en met valsheid gezworen zal hebben; over iets van alles dat de mens doet, waarin hij zo zondigt.", "Ex 30:10": "En Aäron zal eens per jaar over de hoornen ervan verzoening doen, met het bloed van het zondoffer van de verzoeningen; eens per jaar zal hij daarop verzoening doen bij uw geslachten; het is allerheiligst voor de HEERE!", "Lev 5:6-10": "En hij zal zijn schuldoffer aan de HEERE brengen voor zijn zonde die hij gezondigd heeft: een wijfje van het kleinvee, een lam of een jonge geit, als zondoffer; en de priester zal voor hem verzoening doen vanwege zijn zonde. Maar als zijn hand niet zoveel bereiken kan als genoeg is voor een stuk kleinvee, dan zal hij als zijn offer voor de schuld die hij gezondigd heeft, aan de HEERE brengen twee tortelduiven of twee jonge duiven, een als zondoffer en een als brandoffer. En hij zal ze naar de priester brengen, die eerst degene zal offeren die voor het zondoffer is; en hij zal haar hoofd bij haar nek met zijn nagel splijten, maar niet afscheiden.", "Num 16:42": "En het gebeurde, toen de vergadering zich verzamelde tegen Mozes en Aäron, en zich wendde naar de tent van de samenkomst, zie, dat de wolk haar bedekte; en de heerlijkheid van de HEERE verscheen.", "Lev 1:9": "Maar zijn ingewand en zijn schenkels zal men met water wassen; en de priester zal dat alles aansteken op het altaar; het is een brandoffer, een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Num 6:23-27": "Spreek tot Aäron en zijn zonen en zeg: Zo zult u de kinderen van Israël zegenen, door tot hen te zeggen: De HEERE zegent u, en behoedt u! De HEERE doet Zijn aangezicht over u lichten, en is u genadig!", "Lev 2:1": "Als iemand de HEERE een offer van spijsoffer zal brengen, zal zijn offer van meelbloem zijn; en hij zal olie daarop gieten, en wierook daarop leggen.", "Lev 7:26": "Ook zult u in uw woonplaatsen geen bloed eten, van gevogelte of van vee.", "Lev 3:3-5": "Daarna zal hij van dat dankoffer een vuuroffer aan de HEERE offeren; het vet, dat het ingewand bedekt, en al het vet, dat aan het ingewand is. Dan zal hij beide de nieren, en het vet, dat daaraan is, dat aan de weekdarmen is; en het net over de lever, met de nieren, zal hij afnemen. En de zonen van Aäron zullen dat aansteken op het altaar, op het brandoffer, dat op het hout zal zijn, dat op het vuur is; het is een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Num 6:16": "En de priester zal het voor het aangezicht van de HEERE brengen, en zal zijn zondoffer en zijn brandoffer bereiden.", "Lev 5:9": "En van het bloed van het zondoffer zal hij tegen de wand van het altaar sprenkelen; maar wat er van dat bloed overblijft, zal uitgeknepen worden tegen de bodem van het altaar; het is een zondoffer.", "Joz 23:3": "En u hebt gezien alles, wat de HEERE, uw God, gedaan heeft aan al deze volken voor uw aangezicht; want de HEERE, uw God, Zelf, is het, Die voor u gestreden heeft.", "Lev 8:32": "Maar wat overblijft van het vlees en van het brood, zult u met vuur verbranden.", "Lev 23:11": "En hij zal die schoof voor het aangezicht van de HEERE bewegen, opdat het voor u aangenaam zij; de dag na de sabbat zal de priester die bewegen.", "Lev 9:8-24": "Toen naderde Aäron tot het altaar, en slachtte het kalf van het zondoffer, dat voor hem was. En de zonen van Aäron brachten het bloed tot hem, en hij doopte zijn vinger in dat bloed, en deed het op de hoornen van het altaar; daarna goot hij het bloed uit aan de bodem van het altaar. Maar het vet, en de nieren, en het net van de lever van het zondoffer heeft hij op het altaar aangestoken, zoals de HEERE Mozes geboden had.", "Joz 24:25": "Zo sloot Jozua op die dag een verbond met het volk; en hij stelde het hun tot een inzetting en recht te Sichem.", "Lev 4:15": "En de oudsten van de gemeenschap zullen hun handen op het hoofd van de var leggen, voor het aangezicht van de HEERE; en men zal de var slachten voor het aangezicht van de HEERE.", "Lev 7:17": "Wat nog van het vlees van het slachtoffer overgebleven is, zal op de derde dag met vuur verbrand worden;", "Num 28:12": "En drie tienden meelbloem als spijsoffer, met olie gemengd bij de ene stier; en twee tienden meelbloem als spijsoffer, met olie gemengd, bij de ene ram;", "Ex 29:27": "En u zult de borst van het beweegoffer heiligen, en de schouder van het hefoffer, die bewogen wordt, en die opgeheven zal zijn van de ram van het vuloffer, van hetgeen dat van Aäron is, en van hetgeen dat van zijn zonen is.", "Lev 1:13": "Maar het ingewand en de schenkels zal men met water wassen; en de priester zal dat alles offeren en aansteken op het altaar; het is een brandoffer, een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Lev 7:11-18": "Dit is nu de wet van het dankoffer, dat men de HEERE zal offeren. Als hij dat als een lofoffer offert, zal hij naast het lofoffer ongezuurde koeken met olie gemengd, en ongezuurde vladen met olie bestreken, offeren; en die koeken met olie gemengd zullen van geroosterde meelbloem zijn. Naast de koeken zal hij tot zijn offergave gedesemd brood offeren, samen met het lofoffer van zijn dankoffers.", "Ex 29:38-42": "Dit nu is het, wat u op het altaar bereiden zult: twee lammeren, die eenjarig zijn, dagelijks, voortdurend. Het ene lam zult u 's morgens bereiden; maar het andere lam zult u bereiden tussen de twee avonden. Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam.", "Ex 16:10": "En het gebeurde, toen Aäron tegen de hele gemeenschap van de Israëlieten sprak, en zij zich naar de woestijn keerden, zie, daar verscheen de heerlijkheid van de HEERE in de wolk.", "Lev 4:12": "En die hele var zal hij tot buiten het leger uitvoeren, naar een reine plaats, waar men de as uitstort, en zal hem met vuur op het hout verbranden; bij de uitgegoten as zal hij verbrand worden.", "Openb 4:9": "En wanneer de dieren heerlijkheid, en eer, en dankzegging gaven aan Hem Die op de troon zat, Die leeft tot in alle eeuwigheid,", "Hand 3:26": "God heeft, na Zijn Kind Jezus te hebben opgewekt, Hem eerst tot u gezonden, om u te zegenen, doordat Hij ieder van u afkeert van zijn slechte daden.", "Ex 29:28": "En het zal voor Aäron en zijn zonen zijn tot een eeuwige inzetting vanwege de kinderen van Israël; want het is een hefoffer; en het hefoffer vanwege de kinderen van Israël zal zijn van hun dankoffers; hun hefoffer zal voor de HEERE zijn.", "Lev 8:27-29": "En hij gaf dat alles in de handen van Aäron, en in de handen van zijn zonen; en bewoog die als beweegoffer, voor het aangezicht van de HEERE. Daarna nam Mozes ze uit hun handen, en stak ze aan op het altaar, op het brandoffer; zij waren vulofferen tot een liefelijke reuk; het was een vuuroffer voor de HEERE. Verder nam Mozes de borst, en bewoog ze als beweegoffer voor het aangezicht van de HEERE; zij werd Mozes ten deel van de ram van het vuloffer, zoals de HEERE Mozes geboden had.", "Lev 16:15-19": "Daarna zal hij de bok van het zondoffer, die voor het volk zal zijn, slachten, en zal zijn bloed tot binnen het voorhangsel dragen, en zal met zijn bloed doen zoals hij met het bloed van de stier gedaan heeft, en zal het sprenkelen op het verzoendeksel, en voor het verzoendeksel. Zo zal hij voor het heilige, vanwege de onreinheden van de kinderen van Israël, en vanwege hun overtredingen, naar al hun zonden, verzoening doen; en zo zal hij ook doen voor de tent der samenkomst, die met hen woont te midden van hun onreinheden. En geen mens zal in de tent der samenkomst zijn, als hij zal ingaan om in het heilige verzoening te doen, totdat hij weer naar buiten komt; zo zal hij verzoening doen voor zichzelf, en voor zijn huis, en voor de hele gemeente van Israël.", "Richt 6:21": "En de Engel van de HEERE stak het uiteinde van de staf uit, die in Zijn hand was, en raakte het vlees en de ongezuurde koeken aan; toen ging er vuur op uit de rots, en verteerde het vlees en de ongezuurde koeken. En de Engel van de HEERE verdween uit zijn ogen.", "Lev 6:26-30": "De priester die het voor de zonde offert, zal het eten; in de heilige plaats zal het gegeten worden, in de voorhof van de tent der samenkomst. Al wat het vlees daarvan aanraakt, zal heilig zijn; en als iemand van het bloed daarvan op een kleed gesprengd heeft, dan zult u datgene waarop hij gesprengd heeft, wassen in de heilige plaats. En het aarden vat waarin het gekookt is, zal gebroken worden; maar als het in een koperen vat gekookt is, zal het geschuurd en in water gespoeld worden.", "Num 15:3-9": "En u de HEERE een vuuroffer zult doen, een brandoffer of slachtoffer, om een gelofte af te zonderen, of in een vrijwillig offer, of op uw vastgestelde hoogtijden, om de HEERE een liefelijke reuk te maken, van runderen of van klein vee; Zo zal hij, die zijn offerande de HEERE offert, een spijsoffer offeren van een tiende meelbloem, gemengd met een vierendeel van een hin olie. En wijn ten drankoffer, een vierendeel van een hin, zult u bereiden tot een brandoffer of tot een slachtoffer, voor één lam.", "Ex 30:7-10": "En Aäron zal daarop welriekende specerijen aansteken; elke morgen, als hij de lampen in orde heeft gebracht, zal hij ze aansteken. En als Aäron de lampen aansteekt, tussen de twee avonden, zal hij het aansteken; het zal een voortdurend reukwerk zijn, voor het aangezicht van de HEERE, bij uw geslachten. U moet geen vreemd reukwerk daarop aansteken, ook geen brandoffer, geen spijsoffer; u moet er ook geen drankoffer op gieten.", "Lev 16:27": "Maar de stier van het zondoffer, en de bok van het zondoffer, waarvan het bloed binnengebracht is om verzoening te doen in het heilige, zal men tot buiten het kamp brengen; en hun huiden, hun vlees en hun mest zullen zij met vuur verbranden.", "Lev 4:26": "Hij zal ook al zijn vet op het altaar in rook laten opgaan, zoals het vet van het dankoffer; zo zal de priester voor hem verzoening doen van zijn zonde, en het zal hem vergeven worden.", "Lev 4:7": "Ook zal de priester van dat bloed doen op de hoornen van het reukaltaar van de welriekende specerijen, voor het aangezicht van de HEERE, dat in de tent der samenkomst is; dan zal hij al het bloed van de var uitgieten aan de voet van het altaar van het brandoffer, dat bij de deur van de tent der samenkomst is.", "Ex 29:19-22": "Daarna zult u de andere ram nemen, en Aäron en zijn zonen zullen hun handen op het hoofd van de ram leggen; En u zult de ram slachten, en van zijn bloed nemen, en het doen op het rechter oorlapje van Aäron, en op het rechteroorlapje van zijn zonen, evenzo op de duim van hun rechterhand, en op de grote teen van hun rechtervoet; en dat bloed zult u op het altaar sprengen, rondom heen. Dan zult u nemen van het bloed, dat op het altaar is, en van de zalfolie, en u zult op Aäron en op zijn kleren sprengen, en op zijn zonen en op de kleren van zijn zonen met hem; opdat hij geheiligd is, en zijn kleren, ook zijn zonen, en de kleren van zijn zonen met hem.", "Num 29:5": "En een geitenbok tot een zondoffer, om voor u verzoening te doen;", "Deut 31:12": "verzamel het volk, de mannen, en de vrouwen, en de kinderen, en uw vreemdelingen die in uw poorten zijn; opdat zij horen, en opdat zij leren, en de HEERE, uw God, vrezen, en nauwlettend doen alle woorden van deze wet.", "Ezra 10:19": "En zij gaven hun hand, dat zij hun vrouwen zouden wegsturen; en omdat zij schuldig waren, offerden zij een ram uit de kudde voor hun schuld.", "Lev 4:31": "En al haar vet zal hij wegnemen, zoals het vet van het dankoffer weggenomen wordt, en de priester zal het in rook laten opgaan op het altaar, tot een liefelijke reuk voor de HEERE; en de priester zal voor hem verzoening doen, en het zal hem vergeven worden.", "Ex 40:34": "Toen bedekte de wolk de tent der samenkomst; en de heerlijkheid van de HEERE vervulde de tabernakel.", "Ex 30:12-16": "Als u de som van de kinderen van Israël opneemt, naar hun aantal geteld, dan zal ieder de losprijs voor zijn ziel aan de HEERE geven, wanneer u hen telt; opdat er onder hen geen plaag komt, wanneer u hen telt. Dit moeten zij geven, ieder die overgaat tot de getelden: de helft van een sikkel, naar de sikkel van het heiligdom (deze sikkel is twintig gera); de helft van een sikkel is een hefoffer voor de HEERE. Ieder die overgaat tot de getelden, van twintig jaar oud en daarboven, zal het hefoffer van de HEERE geven.", "Num 16:19": "En Korach liet de hele vergadering tegen hen verzamelen bij de deur van de tent van de samenkomst. Toen verscheen de heerlijkheid van de HEERE aan deze hele vergadering.", "Lev 1:3-10": "Als zijn offerande een brandoffer van runderen is, zal hij een volkomen mannetje offeren; aan de deur van de tent van de samenkomst zal hij dat offeren, naar zijn welgevallen, voor het aangezicht van de HEERE. En hij zal zijn hand op het hoofd van het brandoffer leggen, opdat het voor hem aangenaam is, om hem te verzoenen. Daarna zal hij het jonge rund slachten voor het aangezicht van de HEERE; en de zonen van Aäron, de priesters, zullen het bloed offeren, en het bloed sprengen rondom dat altaar, dat voor de deur van de tent van de samenkomst is.", "Num 29:4": "En een tiende voor een lam, tot al die zeven lammeren toe;", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Lev 23:10": "Spreek tot de kinderen van Israël, en zeg tegen hen: Als u in het land zult gekomen zijn, dat Ik u geven zal, en u uw oogst zult inoogsten, dan zult u een schoof van de eerstelingen van uw oogst tot de priester brengen.", "Hebr 7:27": "Hij heeft het niet elke dag nodig, zoals de hogepriesters, om eerst voor zijn eigen zonden slachtoffers te offeren, en daarna voor de zonden van het volk; want dat heeft Hij eenmaal gedaan, toen Hij Zichzelf opgeofferd heeft.", "Lev 23:17": "U zult uit uw woningen twee beweegbroden brengen, zij zullen van twee tienden meelbloem zijn, gedesemd zullen zij gebakken worden; het zijn de eerstelingen voor de HEERE.", "Lev 4:25": "Daarna zal de priester van het bloed van het zondoffer met zijn vinger nemen, en dat op de hoornen van het altaar van het brandoffer doen; dan zal hij zijn bloed aan de voet van het altaar van het brandoffer uitgieten.", "Lev 3:14-17": "Dan zal hij daarvan zijn offergave offeren, een vuuroffer aan de HEERE; het vet dat het ingewand bedekt, en al het vet, dat aan het ingewand is; Alsook de beide nieren, en het vet, dat daaraan is, dat aan de weekdarmen is; en het net over de lever, met de nieren, zal hij afnemen. En de priester zal die aansteken op het altaar; het is een spijs van het vuuroffer, tot een liefelijke reuk; al het vet zal van de HEERE zijn.", "Ex 29:14": "Maar het vlees van de stier, en zijn vel, en zijn drek, zult u met vuur verbranden, buiten het kamp; het is een zondoffer.", "1 Kon 8:10-12": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde. En de priesters konden niet blijven staan om te dienen, vanwege de wolk; want de heerlijkheid van de HEERE had het huis van de HEERE vervuld. Toen zei Salomo: De HEERE heeft gezegd, dat Hij in donkerheid zou wonen.", "Rom 5:10": "Want als wij, toen wij nog vijanden waren, met God verzoend zijn door de dood van Zijn Zoon, zullen wij des te meer, nu wij verzoend zijn, behouden worden door Zijn leven.", "Ex 12:5": "U moet een volkomen lam hebben, een mannetje, een jaar oud; van de schapen of van de geitenbokken moet u het nemen.", "Joz 8:33": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen.", "Lev 17:11": "Want de ziel van het vlees is in het bloed; daarom heb Ik het u op het altaar gegeven, om voor uw zielen verzoening te doen; want het is het bloed, dat voor de ziel verzoening doet.", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Joz 23:6": "Zo weest zeer sterk, om te bewaren en om te doen alles, wat geschreven is in het wetboek van Mozes; opdat u daarvan niet afwijkt naar rechts noch naar links;", "Ezech 43:27": "Als zij nu deze dagen zullen voleind hebben, dan zal het op de achtste dag en vervolgens gebeuren, dat de priesters uw brandoffers en uw dankoffers op het altaar zullen bereiden; en Ik zal een welgevallen aan u hebben, spreekt de Heere HEERE.", "Lev 16:3": "Hiermee zal Aäron het heilige binnengaan: met een jonge stier als zondoffer, en een ram als brandoffer.", "Lev 14:23": "En hij zal die, op de achtste dag van zijn reiniging, naar de priester brengen, aan de deur van de tent der samenkomst, voor het aangezicht van de HEERE.", "Deut 29:10-15": "U staat heden allen voor het aangezicht van de HEERE, uw God: uw hoofden van uw stammen, uw oudsten, en uw opzichters, alle mannen van Israël; Uw kinderen, uw vrouwen, en uw vreemdeling, die in het midden van uw kamp is, van uw houthakker tot uw waterputter toe; Om over te gaan in het verbond van de HEERE, uw God, en in Zijn vloek, die de HEERE, uw God, heden met u maakt;", "Num 15:24": "Dan zal het gebeuren, indien iets bij dwaling gedaan is, en voor de ogen van de vergadering verborgen is, dat de hele vergadering een var, een jong rund, zal bereiden tot brandoffer, tot een liefelijke reuk voor de HEERE, met zijn spijsoffer en zijn drankoffer, naar de gebruikelijke wijze; en een geitenbok tot zondoffer.", "Lev 7:5": "En de priester zal die aansteken op het altaar, als een vuuroffer voor de HEERE; het is een schuldoffer.", "Ex 29:41": "Het andere lam nu zult u bereiden tussen de twee avonden; u zult daarmee doen gelijk met het morgenspijsoffer, en gelijk met het drankoffer daarvan, tot een liefelijke reuk; het is een vuuroffer voor de HEERE.", "Num 28:5": "En een tiende deel van een efa meelbloem als spijsoffer, gemengd met het vierendeel van een hin gestoten olie.", "Ex 19:8": "Toen antwoordde al het volk gezamenlijk en zei: Al wat de HEERE gesproken heeft, zullen wij doen! En Mozes bracht de woorden van het volk terug naar de HEERE.", "Ex 12:21": "Mozes riep dan alle oudsten van Israël, en zei tegen hen: Kiest en neemt lammeren voor uw huisgezinnen, en slacht het pascha.", "Num 8:12": "En de Levieten zullen hun handen op het hoofd van de stieren leggen; daarna bereidt u de één als zondoffer, en de ander als brandoffer voor de HEERE, om over de Levieten verzoening te doen.", "Lev 16:5": "En van de vergadering van de kinderen van Israël zal hij twee geitenbokken nemen als zondoffer, en één ram als brandoffer.", "2 Kor 13:14": "De genade van de Heere Jezus Christus, en de liefde van God, en de gemeenschap van de Heilige Geest, zij met u allen. Amen. De tweede brief aan de Korinthiërs werd door Titus en Lukas geschreven vanuit Filippi, een stad in Macedonië.", "Ex 18:12": "Toen nam Jethro, de schoonvader van Mozes, voor God een brandoffer en slachtoffers; en Aäron kwam, en al de leiders van Israël, om brood te eten met de schoonvader van Mozes, voor het aangezicht van God.", "Lev 16:6": "Daarna zal Aäron de stier van het zondoffer, die voor hemzelf zal zijn, offeren, en voor zichzelf en voor zijn huis verzoening doen.", "Lev 16:10": "Maar de bok op wie het lot gevallen is om een weggaande bok te zijn, zal levend voor het aangezicht van de HEERE gesteld worden, om door hem verzoening te doen; opdat men hem als een weggaande bok naar de woestijn uitlaat.", "Num 28:20": "En hun spijsoffer zal zijn meelbloem, met olie gemengd; drie tienden bij een stier, en twee tienden bij een ram zult u bereiden.", "Num 18:18": "En hun vlees zal het uwe zijn; net als de beweegborst, en net als de rechterschouder, zal het het uwe zijn.", "Richt 13:19": "Toen nam Manoach een geitenbokje en het spijsoffer, en offerde het op de rotssteen aan de HEERE. En Hij handelde wonderlijk in Zijn doen; en Manoach en zijn vrouw keken toe.", "Num 8:8": "Daarna zullen zij een jonge stier nemen, met zijn spijsoffer van meelbloem, met olie gemengd; en een andere jonge stier zult u nemen als zondoffer.", "Lev 19:6": "Op de dag van uw offeren, en de volgende dag, zal het gegeten worden; maar wat tot op de derde dag overblijft, zal met vuur verbrand worden.", "Lev 4:21": "Daarna zal hij die var tot buiten het leger uitvoeren, en hem verbranden, zoals hij de eerste var verbrand heeft; het is een zondoffer van de gemeente.", "Ef 2:14-17": "Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken; en opdat Hij die beiden met God in één lichaam zou verzoenen door het kruis, nadat Hij de vijandschap daaraan gedood had.", "Gen 17:3": "Toen viel Abram op zijn aangezicht, en God sprak met hem en zei:", "Hand 5:17": "En de hogepriester stond op, en allen die met hem waren (dat was de sekte van de Sadduceeën), en werden vervuld met nijd;", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Lev 2:2": "En hij zal het brengen tot de zonen van Aäron, de priesters, van wie er één daarvan zijn hand vol zal grijpen uit de meelbloem, en uit de olie, met alle wierook; en de priester zal het gedenkoffer daarvan aansteken op het altaar; het is een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Lev 15:14": "En op de achtste dag zal hij voor zichzelf twee tortelduiven of twee jonge duiven nemen; en zal voor het aangezicht van de HEERE, aan de deur van de tent van de samenkomst komen, en zal ze aan de priester geven.", "1 Kron 23:13": "De kinderen van Amram waren Aäron en Mozes. Aäron nu werd afgezonderd om de allerheiligste dingen te heiligen, hij en zijn zonen, tot in eeuwigheid, om te roken voor het aangezicht van de HEERE, om Hem te dienen en om in Zijn Naam tot in eeuwigheid te zegenen.", "Ex 29:36": "U zult ook dagelijks een stier als zondoffer bereiden, tot de verzoeningen, en u zult het altaar ontzondigen, door verzoening over hetzelve te doen; en u zult het zalven, om het te heiligen.", "Lev 7:34": "Want de beweegborst en de hefschouder heb Ik van de kinderen van Israël uit hun dankoffers genomen, en heb die aan Aäron, de priester, en aan zijn zonen gegeven, als een eeuwige inzetting, vanwege de kinderen van Israël.", "Lev 16:18": "Daarna zal hij naar het altaar dat voor het aangezicht van de HEERE is, gaan, en verzoening ervoor doen; en hij zal van het bloed van de stier, en van het bloed van de bok nemen, en het rondom op de hoorns van het altaar doen.", "Hebr 9:12": "ook niet door het bloed van bokken en kalveren, maar door Zijn eigen bloed, eenmaal ingegaan in het heiligdom, en heeft een eeuwige verlossing verworven.", "Joh 6:53": "Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: als u het vlees van de Zoon des mensen niet eet en Zijn bloed niet drinkt, hebt u geen leven in uzelf.", "Lev 16:11": "Aäron dan zal de stier van het zondoffer, die voor hemzelf zal zijn, brengen, en voor zichzelf en voor zijn huis verzoening doen, en zal de stier van het zondoffer, die voor hemzelf zal zijn, slachten.", "Ex 3:16": "Ga heen, en verzamel de oudsten van Israël, en zeg tegen hen: De HEERE, de God van uw vaderen, is mij verschenen, de God van Abraham, Izak en Jakob, en Hij zei: Ik heb u getrouw bezocht, en gezien wat u in Egypte is aangedaan;", "Lev 10:16-18": "En Mozes zocht heel zorgvuldig de bok van het zondoffer; en zie, hij was verbrand. Daardoor werd hij zeer boos op Eleazar en op Ithamar, de overgebleven zonen van Aäron, en zei: Waarom hebt u dat zondoffer niet gegeten in de heilige plaats? Want het is allerheiligst, en Hij heeft het u gegeven, opdat u de ongerechtigheid van de gemeenschap zou dragen, om voor hen verzoening te doen voor het aangezicht van de HEERE. Zie, het bloed daarvan is niet binnen in het heiligdom gebracht; u had dat helemaal moeten opeten in het heiligdom, zoals ik geboden heb.", "Mark 10:16": "En Hij omarmde ze met Zijn armen, en Hij legde de handen op hen, en zegende hen.", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "Lev 7:29-34": "Spreek tot de kinderen van Israël, en zeg: Wie zijn dankoffer aan de HEERE offert, zal zijn offergave van zijn dankoffer aan de HEERE brengen. Zijn eigen handen zullen de vuuroffers van de HEERE brengen; het vet aan de borst zal hij met die borst brengen, om die als beweegoffer voor het aangezicht van de HEERE te bewegen. En de priester zal dat vet op het altaar aansteken; maar de borst zal voor Aäron en zijn zonen zijn.", "2 Kron 5:2": "Toen verzamelde Salomo de oudsten van Israël, en al de hoofden van de stammen, de leiders van de vaderen onder de kinderen van Israël, in Jeruzalem, om de ark van het verbond van de HEERE op te brengen uit de stad van David, dat is Sion.", "Num 28:30": "Een geitenbok, om voor u verzoening te doen.", "Lev 23:16": "tot de dag na de zevende sabbat zult u vijftig dagen tellen, dan zult u een nieuw spijsoffer aan de HEERE offeren.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Richt 21:16-25": "En de oudsten van de vergadering zeiden: Wat zullen wij doen, als het gaat om vrouwen voor hen die overgebleven zijn? Want de vrouwen zijn uit Benjamin uitgeroeid. Verder zeiden zij: De erfenis van hen die ontkomen zijn, is van Benjamin, en er moet geen stam uit Israël weggevaagd worden. Maar wij zullen hun geen vrouwen van onze dochters kunnen geven; want de kinderen van Israël hebben gezworen: Vervloekt is hij die aan de Benjaminieten een vrouw geeft!", "Lev 4:16-20": "Daarna zal die gezalfde priester van het bloed van de var naar de tent der samenkomst brengen. En de priester zal zijn vinger indopen, nadat hij van dat bloed genomen heeft; en hij zal zevenmaal sprenkelen voor het aangezicht van de HEERE, voor de voorhang. En van dat bloed zal hij doen op de hoornen van het altaar dat voor het aangezicht van de HEERE is, dat in de tent der samenkomst is; dan zal hij al het bloed uitgieten aan de voet van het altaar van het brandoffer, dat bij de deur van de tent der samenkomst is.", "Luk 1:21": "En het volk was op Zacharias aan het wachten, en zij verbaasden zich erover dat hij zo lang in de tempel bleef.", "1 Kron 21:26": "Toen bouwde David daar voor de HEERE een altaar, en hij offerde brandoffers en dankoffers. Toen hij de HEERE aanriep, antwoordde Hij hem door vuur uit de hemel, op het brandofferaltaar.", "2 Kron 4:6": "En hij maakte tien wasvaten, en zette vijf aan de rechterhand en vijf aan de linkerhand, om daarin te wassen; wat bij het brandoffer hoorde, staken zij daarin; maar de zee was ervoor dat de priesters zich daarin zouden wassen.", "Lev 18:25": "Zodat het land onrein is, en Ik over hen zijn ongerechtigheid bezoek, en het land zijn inwoners uitspuwt.", "Num 28:26-31": "Ook op de dag van de eerstelingen, als u een nieuw spijsoffer de HEERE zult offeren naar uw weken, zult u een heilige samenkomst hebben; geen dienstwerk zult u doen. Dan zult u de HEERE een brandoffer tot liefelijke reuk offeren: twee jonge stieren, een ram, zeven eenjarige lammeren; En hun spijsoffer van meelbloem, met olie gemengd: drie tienden bij een stier, twee tienden bij een ram;", "Lev 12:3": "En op de achtste dag zal het vlees van zijn voorhuid besneden worden.", "Ex 30:27": "En de tafel met al zijn gereedschap, en de kandelaar met zijn gereedschap, en het reukaltaar;", "Ex 17:6": "Zie, Ik zal daar voor u op de rots bij Horeb staan; en u zult op de rots slaan, dan zal er water uit komen, zodat het volk kan drinken. Mozes deed dat voor de ogen van de oudsten van Israël.", "Deut 1:11": "De HEERE, de God van uw vaderen, maakt u, zoals u nu bent, duizend keer talrijker, en Hij zegent u, zoals Hij tot u gesproken heeft!", "Lev 7:24": "Maar het vet van een dood gevonden dier, en het vet van iets dat verscheurd is, mag voor alle andere doeleinden gebruikt worden; maar u zult het beslist niet eten.", "Lev 4:9": "Daarbij de twee nieren, en het vet dat daaraan is, dat aan de weekdarmen is, en het net over de lever, met de nieren, zal hij wegnemen;", "Lev 5:11": "Maar als zijn hand niet twee tortelduiven of twee jonge duiven kan bereiken, dan zal hij die gezondigd heeft, als zijn offergave het tiende deel van een efa meelbloem brengen als zondoffer; hij zal er geen olie overheen doen, en er ook geen wierook op leggen; want het is een zondoffer.", "Deut 5:23": "En het gebeurde, toen u die stem uit het midden van de duisternis hoorde, terwijl de berg van vuur brandde, dat u tot mij naderde, alle hoofden van uw stammen, en uw oudsten,", "Gen 4:3": "En het gebeurde na verloop van enige dagen, dat Kaïn van de vrucht van het land de HEERE een offer bracht.", "Lev 6:14-23": "Dit is nu de wet van het spijsoffer: een van de zonen van Aäron zal dat voor het aangezicht van de HEERE offeren, voor het altaar. En hij zal daarvan zijn hand vol opnemen, uit de meelbloem van het spijsoffer, en van de olie daarvan, en al de wierook die op het spijsoffer is; dan zal hij het aansteken op het altaar; het is een liefelijke reuk, tot gedachtenis daarvan, voor de HEERE. En wat daarvan overblijft, zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden, in de heilige plaats; in de voorhof van de tent der samenkomst zullen zij dat eten.", "Deut 10:8": "In die tijd zonderde de HEERE de stam Levi af, om de ark van het verbond van de HEERE te dragen, om voor het aangezicht van de HEERE te staan, om Hem te dienen, en om in Zijn Naam te zegenen, tot op deze dag.", "Lev 10:14": "Ook de beweegborst en de hefschouder moet u eten in een reine plaats, u, en uw zonen, en uw dochters met u; want als uw bescheiden deel, en het bescheiden deel van uw zonen, zijn zij uit de dankoffers van de kinderen van Israël gegeven.", "Num 18:11": "Ook zal dit het uwe zijn: het hefoffer van hun gave, met alle beweegoffers van de kinderen van Israël; Ik heb ze aan u gegeven, en aan uw zonen, en aan uw dochters met u, tot een eeuwige inzetting; ieder die in uw huis rein is, zal dat eten.", "Joz 7:6": "Toen scheurde Jozua zijn kleren, en viel op zijn gezicht ter aarde, voor de ark van de HEERE, tot de avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd.", "Lev 3:9-11": "Daarna zal hij van dat dankoffer een vuuroffer aan de HEERE offeren; zijn vet, de hele staart, die hij dicht aan de ruggengraat zal afnemen, en het vet dat het ingewand bedekt, en al het vet, dat aan het ingewand is; Ook beide de nieren, en het vet, dat daaraan is, dat aan de weekdarmen is; en het net over de lever met de nieren, zal hij afnemen. En de priester zal dat aansteken op het altaar;
