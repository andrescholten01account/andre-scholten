s","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Verder sprak de HEERE tot Mozes en zei:","2":"Neem Aäron en zijn zonen met hem, en de kleren, en de zalfolie, ook de stier van het zondoffer, en de twee rammen, en de korf met de ongezuurde *broden*;","3":"En verzamel de hele vergadering bij de deur van de tent der samenkomst.","4":"Mozes nu deed zoals de HEERE hem geboden had; en de vergadering werd verzameld bij de deur van de tent der samenkomst.","5":"Toen zei Mozes tegen de vergadering: Dit is de zaak die de HEERE geboden heeft te doen.","6":"En Mozes liet Aäron en zijn zonen naderbij komen, en waste hen met dat water.","7":"Daar deed hij hem het onderkleed aan, en gordde hem met de gordel, en trok hem de mantel aan; en deed hij hem de efod[1] aan, en gordde die met de kunstige band van de efod, en bond hem daarmee vast.","8":"Vervolgens deed hij hem de borstlap aan, en voegde aan de borstlap de Urim[2] en de Tummim toe.","9":"En hij zette de hoed op zijn hoofd; en aan de hoed, boven zijn gezicht, zette hij de gouden plaat, de kroon van de heiligheid, zoals de HEERE Mozes geboden had.","10":"Toen nam Mozes de zalfolie, en zalfde de tabernakel, en alles wat daarin was, en heiligde ze.","11":"En hij sprenkelde daarvan op het altaar zevenmaal; en hij zalfde het altaar, en al zijn gereedschap, alsook het wasvat en zijn voetstuk, om die te heiligen.","12":"Daarna goot hij van de zalfolie op het hoofd van Aäron, en hij zalfde hem, om hem te heiligen.","13":"Ook liet Mozes de zonen van Aäron naderbij komen, en trok hun onderkleren aan, en gordde hen met een gordel, en bond hun mutsen om, zoals de HEERE Mozes geboden had.","14":"Toen liet hij de stier van het zondoffer bijeenkomen; en Aäron en zijn zonen legden hun handen op het hoofd van de stier van het zondoffer;","15":"En men slachtte *hem*; en Mozes nam het bloed, en deed het met zijn vinger rondom op de hoornen van het altaar, en ontzondigde het altaar; daarna goot hij het bloed uit aan de voet van het altaar, en heiligde het, om er verzoening voor te doen.","16":"Verder nam hij al het vet dat aan het ingewand zit, en het net van de lever, en de twee nieren en hun vet; en Mozes stak het aan op het altaar.","17":"Maar de stier met zijn huid, en zijn vlees, en zijn mest, heeft hij buiten het leger met vuur verbrand, zoals de HEERE Mozes geboden had.","18":"Daarna liet hij de ram van het brandoffer bijbrengen; en Aäron en zijn zonen legden hun handen op het hoofd van de ram.","19":"En men slachtte *hem*; en Mozes sprenkelde het bloed rondom op het altaar.","20":"Hij deelde de ram in zijn delen; en Mozes stak het hoofd aan, en die delen, en het vet;","21":"Doch het ingewand en de schenkels waste hij met water; en Mozes stak die hele ram aan op het altaar; het was een brandoffer tot een liefelijke reuk, een vuuroffer was het voor de HEERE, zoals de HEERE Mozes geboden had.","22":"Daarna liet hij de andere ram, de ram van het vuloffer, bijbrengen; en Aäron met zijn zonen legden hun handen op het hoofd van de ram.","23":"En men slachtte *hem*; en Mozes nam van zijn bloed, en deed het op het lelletje van Aärons rechteroor, en op de duim van zijn rechterhand, en op de grote teen van zijn rechtervoet.","24":"Hij liet ook de zonen van Aäron naderbij komen; en Mozes deed van dat bloed op het lelletje van hun rechteroor, en op de duim van hun rechterhand, en op de grote teen van hun rechtervoet; daarna sprenkelde Mozes dat bloed rondom op het altaar.","25":"En hij nam het vet, en de staart, en al het vet dat aan het ingewand zit, en het net van de lever, en de beide nieren, en hun vet, alsook de rechterschouder.","26":"Ook nam hij uit de korf met de ongezuurde *broden*, die voor het aangezicht van de HEERE was, één ongezuurde koek, en een geoliede broodkoek, en één wafel; en hij legde ze op dat vet, en op de rechterschouder.","27":"En hij gaf dat alles in de handen van Aäron, en in de handen van zijn zonen; en bewoog die als beweegoffer, voor het aangezicht van de HEERE.","28":"Daarna nam Mozes ze uit hun handen, en stak ze aan op het altaar, op het brandoffer; zij waren vulofferen tot een liefelijke reuk; het was een vuuroffer voor de HEERE.","29":"Verder nam Mozes de borst, en bewoog ze als beweegoffer voor het aangezicht van de HEERE; zij werd Mozes ten deel van de ram van het vuloffer, zoals de HEERE Mozes geboden had.","30":"Mozes nam ook van de zalfolie, en van het bloed dat op het altaar was, en sprenkelde het op Aäron, op zijn kleren, en op zijn zonen, en op de kleren van zijn zonen met hem; en hij heiligde Aäron, zijn kleren, en zijn zonen, en de kleren van zijn zonen met hem.","31":"En Mozes zei tegen Aäron en tegen zijn zonen: Kook dat vlees bij de deur van de tent der samenkomst, en eet het daar, alsook het brood dat in de korf van het vuloffer is; zoals ik geboden heb en zei: Aäron en zijn zonen zullen dat eten.","32":"Maar wat overblijft van het vlees en van het brood, zult u met vuur verbranden.","33":"Ook zult u uit de deur van de tent der samenkomst, zeven dagen lang, niet weggaan, tot aan de dag dat de dagen van uw vuloffer vervuld worden; want zeven dagen zal men uw handen vullen.","34":"Zoals men gedaan heeft op deze dag, heeft de HEERE geboden te doen, om voor u verzoening te doen.","35":"U zult dan bij de deur van de tent der samenkomst blijven, dag en nacht, zeven dagen, en de wacht van de HEERE waarnemen, opdat u niet sterft; want zo is het mij geboden.","36":"Aäron nu en zijn zonen deden al de dingen die de HEERE door de dienst van Mozes geboden had."},"SV":{"1":"Verder sprak de HEERE tot Mozes, zeggende:","2":"Neem Aäron en zijn zonen met hem, en de klederen, en de zalfolie, daartoe den var des zondoffers, en de twee rammen, en den korf van de ongezuurde *broden*;","3":"En verzamel de ganse vergadering aan de deur van de tent der samenkomst.","4":"Mozes nu deed, gelijk als de HEERE hem geboden had; en de vergadering werd verzameld aan de deur van de tent der samenkomst.","5":"Toen zeide Mozes tot de vergadering: Dit is de zaak, die de HEERE geboden heeft te doen.","6":"En Mozes deed Aäron en zijn zonen naderen, en wies hen met dat water.","7":"Daar deed hij hem den rok aan, en gordde hem met den gordel, en trok hem den mantel aan; en deed hij hem den efod aan, en gordde dien met den kunstelijken riem des efods, en ombond hem daarmede.","8":"Voorts deed hij hem den borstlap aan, en voegde aan den borstlap de Urim en de Thummim.","9":"En hij zette den hoed op zijn hoofd; en aan den hoed boven zijn aangezicht zette hij de gouden plaat, de kroon der heiligheid, gelijk als de HEERE Mozes geboden had.","10":"Toen nam Mozes de zalfolie, en zalfde den tabernakel, en al wat daarin was, en heiligde ze.","11":"En hij sprengde daarvan op het altaar zevenmaal; en hij zalfde het altaar, en al zijn gereedschap, mitsgaders het wasvat en zijn voet, om die te heiligen.","12":"Daarna goot hij van de zalfolie op het hoofd van Aäron, en hij zalfde hem, om hem te heiligen.","13":"Ook deed Mozes de zonen van Aäron naderen, en trok hun rokken aan, en gordde hen met een gordel, en bond hun mutsen op, gelijk als de HEERE Mozes geboden had.","14":"Toen deed hij den var des zondoffers bijeenkomen; en Aäron en zijn zonen leiden hun handen op het hoofd van den var des zondoffers;","15":"En men slachtte *hem*; en Mozes nam het bloed, en deed het met zijn vinger rondom op de hoornen des altaars, en ontzondigde het altaar; daarna goot hij het bloed uit aan den bodem des altaars, en heiligde het, om voor hetzelve verzoening te doen.","16":"Voorts nam hij al het vet, dat aan het ingewand is, en het net der lever, en de twee nieren en haar vet; en Mozes stak het aan op het altaar.","17":"Maar den var met zijn huid, en zijn vlees, en zijn mest, heeft hij buiten het leger met vuur verbrand, gelijk als de HEERE Mozes geboden had.","18":"Daarna deed hij den ram des brandoffers bijbrengen; en Aäron en zijn zonen leiden hun handen op het hoofd van den ram.","19":"En men slachtte *hem*; en Mozes sprengde het bloed op het altaar rondom.","20":"Hij deelde ook den ram in zijn delen; en Mozes stak het hoofd aan, en die delen, en het smeer;","21":"Doch het ingewand en de schenkelen wies hij met water; en Mozes stak dien gehelen ram aan op het altaar; het was een brandoffer tot een liefelijken reuk, een vuuroffer was het den HEERE, gelijk als de HEERE Mozes geboden had.","22":"Daarna deed hij den anderen ram, den ram des vuloffers, bijbrengen; en Aäron met zijn zonen leiden hun handen op het hoofd van den ram.","23":"En men slachtte *hem*; en Mozes nam van zijn bloed, en deed het op het lapje van Aärons rechteroor, en op den duim zijner rechterhand, en op den groten teen van zijn rechtervoet.","24":"Hij deed ook de zonen van Aäron naderen; en Mozes deed van dat bloed op het lapje van hun rechteroor, en op den duim van hun rechterhand, en op den groten teen van hun rechtervoet; daarna sprengde Mozes dat bloed rondom op het altaar.","25":"En hij nam het vet, en den staart, en al het vet, dat aan het ingewand is, en het net der lever, en de beide nieren, en haar vet, daartoe den rechterschouder.","26":"Ook nam hij uit den korf van de ongezuurde *broden*, die voor het aangezicht des HEEREN was, een ongezuurde koek, en een geolieden broodkoek, en een vlade; en hij leide ze op dat vet, en op den rechterschouder.","27":"En hij gaf dat alles in de handen van Aäron, en in de handen zijner zonen; en bewoog die ten beweegoffer, voor het aangezicht des HEEREN.","28":"Daarna nam Mozes ze uit hun handen, en stak ze aan op het altaar, op het brandoffer; zij waren vulofferen tot een liefelijken reuk; het was een vuuroffer den HEERE.","29":"Voorts nam Mozes de borst, en bewoog ze ten beweegoffer voor het aangezicht des HEEREN; zij werd Mozes ten dele van den ram des vuloffers, gelijk als de HEERE Mozes geboden had.","30":"Mozes nam ook van de zalfolie, en van het bloed, hetwelk op het altaar was, en sprengde het op Aäron, op zijn klederen, en op zijn zonen, en op de klederen zijner zonen met hem; en hij heiligde Aäron, zijn klederen, en zijn zonen, en de klederen zijner zonen met hem.","31":"En Mozes zeide tot Aäron en tot zijn zonen: Ziedt dat vlees voor de deur van de tent der samenkomst, en eet hetzelve daar, mitsgaders het brood, dat in den korf des vuloffers is; gelijk als ik geboden heb, zeggende: Aäron en zijn zonen zullen dat eten.","32":"Maar het overige van het vlees en van het brood zult gij met vuur verbranden.","33":"Ook zult gij uit de deur van de tent der samenkomst, zeven dagen, niet uitgaan, tot aan den dag, dat vervuld worden de dagen uws vuloffers; want zeven dagen zal men uw handen vullen.","34":"Gelijk men gedaan heeft op dezen dag, heeft de HEERE te doen geboden, om voor u verzoening te doen.","35":"Gij zult dan aan de deur van de tent der samenkomst blijven, dag en nacht, zeven dagen, en zult de wacht des HEEREN waarnemen, opdat gij niet sterft; want alzo is het mij geboden.","36":"Aäron nu en zijn zonen deden al de dingen, die de HEERE door den dienst van Mozes geboden had."},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Take Aaron and his sons with him, and the garments, and the anointing oil, and a bullock for the sin offering, and two rams, and a basket of unleavened bread;","3":"And gather thou all the congregation together unto the door of the tabernacle of the congregation.","4":"And Moses did as the LORD commanded him; and the assembly was gathered together unto the door of the tabernacle of the congregation.","5":"And Moses said unto the congregation, This *is* the thing which the LORD commanded to be done.","6":"And Moses brought Aaron and his sons, and washed them with water.","7":"And he put upon him the coat, and girded him with the girdle, and clothed him with the robe, and put the ephod upon him, and he girded him with the curious girdle of the ephod, and bound","8":"And he put the breastplate upon him: also he put in the breastplate the Urim and the Thummim.","9":"And he put the mitre upon his head; also upon the mitre, *even* upon his forefront, did he put the golden plate, the holy crown; as the LORD commanded Moses.","10":"And Moses took the anointing oil, and anointed the tabernacle and all that *was* therein, and sanctified","11":"And he sprinkled thereof upon the altar seven times, and anointed the altar and all his vessels, both the laver and his foot, to sanctify","12":"And he poured of the anointing oil upon Aaron's head, and anointed him, to sanctify","13":"And Moses brought Aaron's sons, and put coats upon them, and girded them with girdles, and put bonnets upon them; as the LORD commanded Moses.","14":"And he brought the bullock for the sin offering: and Aaron and his sons laid their hands upon the head of the bullock for the sin offering.","15":"And he slew *it*; and Moses took the blood, and put *it* upon the horns of the altar round about with his finger, and purified the altar, and poured the blood at the bottom of the altar, and sanctified it, to make reconciliation","16":"And he took all the fat that *was* upon the inwards, and the caul *above* the liver, and the two kidneys, and their fat, and Moses burned *it* upon the altar.","17":"But the bullock, and his hide, his flesh, and his dung, he burnt with fire without the camp; as the LORD commanded Moses.","18":"And he brought the ram for the burnt offering: and Aaron and his sons laid their hands upon the head of the ram.","19":"And he killed *it*; and Moses sprinkled the blood upon the altar round about.","20":"And he cut the ram into pieces; and Moses burnt the head, and the pieces, and the fat.","21":"And he washed the inwards and the legs in water; and Moses burnt the whole ram upon the altar: it *was* a burnt sacrifice for a sweet savour, *and* an offering made by fire unto the LORD; as the LORD commanded Moses.","22":"And he brought the other ram, the ram of consecration: and Aaron and his sons laid their hands upon the head of the ram.","23":"And he slew *it*; and Moses took of the blood of it, and put *it* upon the tip of Aaron's right ear, and upon the thumb of his right hand, and upon the great toe of his right foot.","24":"And he brought Aaron's sons, and Moses put of the blood upon the tip of their right ear, and upon the thumbs of their right hands, and upon the great toes of their right feet: and Moses sprinkled the blood upon the altar round about.","25":"And he took the fat, and the rump, and all the fat that *was* upon the inwards, and the caul *above* the liver, and the two kidneys, and their fat, and the right shoulder:","26":"And out of the basket of unleavened bread, that *was* before the LORD, he took one unleavened cake, and a cake of oiled bread, and one wafer, and put *them* on the fat, and upon the right shoulder:","27":"And he put all upon Aaron's hands, and upon his sons' hands, and waved them *for* a wave offering before the LORD.","28":"And Moses took them from off their hands, and burnt *them* on the altar upon the burnt offering: they *were* consecrations for a sweet savour: it *is* an offering made by fire unto the LORD.","29":"And Moses took the breast, and waved it *for* a wave offering before the LORD: *for* of the ram of consecration it was Moses' part; as the LORD commanded Moses.","30":"And Moses took of the anointing oil, and of the blood which *was* upon the altar, and sprinkled *it* upon Aaron, *and* upon his garments, and upon his sons, and upon his sons' garments with him; and sanctified Aaron, *and* his garments, and his sons, and his sons' garments","31":"And Moses said unto Aaron and to his sons, Boil the flesh *at* the door of the tabernacle of the congregation: and there eat it with the bread that *is* in the basket of consecrations, as I commanded, saying, Aaron and his sons shall eat","32":"And that which remaineth of the flesh and of the bread shall ye burn with fire.","33":"And ye shall not go out of the door of the tabernacle of the congregation *in* seven days, until the days of your consecration be at an end: for seven days shall he consecrate","34":"As he hath done this day, *so* the LORD hath commanded to do, to make an atonement","35":"Therefore shall ye abide *at* the door of the tabernacle of the congregation day and night seven days, and keep the charge of the LORD, that ye die not: for so I am commanded.","36":"So Aaron and his sons did all things which the LORD commanded by the hand of Moses."}},"tsk":{"2":[{"kopje":"Aäron","refs":["Ex 29:1-4"]},{"kopje":"de kleren","refs":["Ex 28:2-4","Ex 28:40-43","Ex 39:1-31","Ex 39:41"]},{"kopje":"zalfolie","refs":["Ex 30:23-37","Ex 40:12-15"]},{"kopje":"de stier","refs":["Ex 29:1","Ex 29:2","Hebr 7:27"]}],"5":[{"kopje":"de HEERE geboden heeft te doen","r // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
