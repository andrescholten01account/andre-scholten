l.","6":"Maar is het iemand van een maand oud tot iemand van vijf jaar oud, dan zal uw schatting voor een man vijf sikkel zilver zijn, en uw schatting voor een vrouw zal drie sikkel zilver zijn.","7":"En is het iemand van zestig jaar oud en ouder, is het een man, dan zal uw schatting vijftien sikkel zijn, en voor een vrouw tien sikkel.","8":"Maar als hij armer is dan uw schatting, dan zal hij zich voor het aangezicht van de priester stellen, zodat de priester hem schat; naar wat de hand van hem die de gelofte gedaan heeft, kan opbrengen, zal de priester hem schatten.","9":"En als het een dier is waarvan men de HEERE een offergave brengt: alles wat hij daarvan aan de HEERE geeft, zal heilig zijn.","10":"Hij zal het niet ruilen, en het ook niet verwisselen, een goed voor een slecht, of een slecht voor een goed; als hij toch een dier voor een dier op enige manier verwisselt, dan zal dit, en waarvoor het verwisseld is, heilig zijn.","11":"En als het enig onrein dier is, waarvan men de HEERE geen offergave brengt, dan zal hij dat dier voor het aangezicht van de priester stellen.","12":"En de priester zal het schatten, naardat het goed of slecht is; naar uw schatting, priester, zo zal het zijn.","13":"Maar als hij het echt wil afkopen, dan zal hij een vijfde deel boven uw schatting toevoegen.","14":"En wanneer iemand zijn huis geheiligd heeft, zodat het de HEERE heilig is, dan zal de priester dat schatten, naardat het goed of slecht is; zoals de priester het geschat heeft, zo zal het blijven staan.","15":"En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.","16":"Als ook iemand van de akker van zijn eigendom iets aan de HEERE heiligt, dan zal uw schatting zijn naar het zaad ervan; een homer[1] gerstezaad zal geschat worden op vijftig sikkel zilver.","17":"Als hij zijn akker vanaf het jubeljaar geheiligd heeft, dan zal het naar uw schatting blijven staan.","18":"Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.","19":"En als hij die de akker geheiligd heeft, die helemaal wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en dan zal die hem toegewezen zijn.","20":"En als hij die akker niet afkoopt, of als hij die akker aan een andere man verkocht heeft, dan zal hij niet meer afgekocht worden.","21":"Maar die akker zal, nadat hij in het jubeljaar is uitgegaan, de HEERE heilig zijn, als een verboden akker; het eigendom daarvan zal aan de priester toevallen.","22":"En als hij de HEERE een akker heeft geheiligd die hij gekocht heeft, en die niet bij de akker van zijn eigendom hoort;","23":"dan zal de priester hem de som van uw schatting berekenen tot het jubeljaar; en hij zal op diezelfde dag uw schatting geven, als iets heiligs voor de HEERE.","24":"In het jubeljaar zal die akker terugkeren naar hem van wie hij hem gekocht had, naar hem aan wie het eigendom van dat land toebehoorde.","25":"Al uw schatting nu zal gebeuren naar de sikkel van het heiligdom; de sikkel zal van twintig gera zijn.","26":"Maar het eerstgeborene, dat de HEERE als eerstgeborene van een dier toebehoort, dat zal niemand heiligen; hetzij een rund, of een schaap of geit, het is van de HEERE.","27":"Maar is het van een onrein dier, dan zal hij dat afkopen naar uw schatting, en zal er zijn vijfde deel daarboven aan toevoegen; en als het niet afgekocht wordt, dan zal het verkocht worden, naar uw schatting.","28":"Toch, niets wat verboden is, dat iemand aan de HEERE verboden heeft, van alles wat hij heeft, van een mens, of van een dier, of van de akker van zijn eigendom, zal verkocht of afgekocht worden; alles wat verboden is, zal voor de HEERE allerheiligst zijn.","29":"Alles wat verboden is, dat van de mensen verboden zal zijn, zal niet afgekocht worden; het zal zeker gedood worden.","30":"Ook alle tienden van het land, van het zaad van het land, van de vrucht van de boom, zijn van de HEERE; zij zijn de HEERE heilig.","31":"Maar als iemand van zijn tienden iets echt wil afkopen, zal hij zijn vijfde deel daarboven toevoegen.","32":"Wat betreft alle tienden van runderen en klein vee, alles wat onder de herdersstaf doorgaat, het tiende zal de HEERE heilig zijn.","33":"Hij zal niet onderzoeken of het goed of slecht is; hij zal het ook niet verwisselen; maar als hij het toch verwisselt, dan zal dit, en waarvoor het verwisseld is, heilig zijn; het zal niet afgekocht worden.","34":"Dit zijn de geboden die de HEERE Mozes geboden heeft, aan de kinderen van Israël, op de berg Sinaï."},"SV":{"1":"Verder sprak de HEERE tot Mozes, zeggende:","2":"Spreek tot de kinderen Israëls, en zeg tot hen: Wanneer iemand een gelofte zal afgezonderd hebben, naar uw schatting zullen de zielen des HEEREN zijn.","3":"Als uw schatting eens mans zal zijn van twintig jaren oud, tot een, die zestig jaren oud is; dan zal uw schatting zijn van vijftig sikkelen zilvers, naar den sikkel des heiligdoms.","4":"Maar is het een vrouw, dan zal uw schatting zijn dertig sikkelen.","5":"En is het van een, die vijf jaren oud is, tot een, die twintig jaren oud is, zo zal uw schatting van een man twintig sikkelen zijn, en voor een vrouw tien sikkelen.","6":"Maar is het van een, die een maand oud is, tot een, die vijf jaren oud is, zo zal uw schatting van een man zijn vijf sikkelen zilvers, en uw schatting over een vrouw zal zijn drie sikkelen zilvers.","7":"En is het van een, die zestig jaren oud is en daarboven, is het een man, zo zal uw schatting zijn vijftien sikkelen, en voor een vrouw tien sikkelen.","8":"Maar zo hij armer is, dan uw schatting, zo zal hij zich voor het aangezicht des priesters zetten, opdat de priester hem schatte; naar dat de hand desgenen, die de gelofte gedaan heeft, zal kunnen bekomen, zal de priester hem schatten.","9":"En indien het een beest is, waarvan men den HEERE offerande offert; al wat hij daarvan den HEERE zal gegeven hebben, zal heilig zijn.","10":"Hij zal niet vermangelen, noch hetzelve verwisselen, een goed voor een kwaad, of een kwaad voor een goed; indien hij nochtans een beest voor een beest enigszins verwisselt, zo zal dit, en wat daarvoor verwisseld is, heilig zijn.","11":"En indien het enig onrein beest is, van hetwelk men den HEERE geen offerande offert, zo zal hij dat beest voor het aangezicht des priesters zetten.","12":"En de priester zal dat schatten, naar dat het goed of kwaad is; naar uw schatting, priester! zo zal het zijn.","13":"Maar indien hij het immers lossen zal, zo zal hij deszelfs vijfde deel boven uw schatting toedoen.","14":"En wanneer iemand zijn huis zal geheiligd hebben, dat het den HEERE heilig zij, zo zal de priester dat schatten, naar dat het goed of kwaad is; gelijk als de priester dat geschat zal hebben, zo zal het stand hebben.","15":"En indien hij, die het geheiligd heeft, zijn huis zal lossen, zo zal hij een vijfde deel des gelds uwer schatting daarboven toedoen, zo zal het zijne zijn.","16":"Indien ook iemand van den akker zijner bezitting den HEERE wat geheiligd zal hebben, zo zal uw schatting zijn naar zijn zaad; een homer gerstezaad zal zijn op vijftig sikkelen zilvers.","17":"Indien hij zijn akker van het jubeljaar af geheiligd zal hebben, zo zal het naar uw schatting stand hebben.","18":"Maar zo hij zijn akker na het jubeljaar geheiligd zal hebben, dan zal hem de priester het geld rekenen, naar de jaren, die nog overig zijn tot het jubeljaar; en het zal van uw schatting afgetrokken worden.","19":"En indien hij, die den akker geheiligd heeft, denzelven ganselijk lossen zal, zo zal hij een vijfde deel des gelds uwer schatting daarboven toedoen, en dezelve zal hem gevestigd zijn.","20":"En indien hij dien akker niet zal lossen, of indien hij dien akker aan een anderen man verkocht heeft, zo zal hij niet meer gelost worden.","21":"Maar die akker, nadat hij in het jubeljaar zal uitgegaan zijn, zal den HEERE heilig zijn, als een verbannen akker; de bezitting daarvan zal des priesters zijn.","22":"En indien hij den HEERE een akker heeft geheiligd, dien hij gekocht heeft, en niet is van den akker zijner bezitting;","23":"Zo zal de priester hem rekenen de som uwer schatting tot het jubeljaar; en hij zal op denzelven dag uw schatting geven, een heiligheid den HEERE.","24":"In het jubeljaar zal die akker wederkomen tot dien, van wien hij hem gekocht had, tot hem, wiens de bezitting van dat land was.","25":"Al uw schatting nu zal naar den sikkel des heiligdoms geschieden; de sikkel zal zijn van twintig gera.","26":"Maar het eerstgeborene, dat den HEERE van een beest eerstgeboren wordt, dat zal niemand heiligen; hetzij een os, of klein vee, het is des HEEREN.","27":"Doch is het van een onrein beest, hij zal dat lossen naar uw schatting, en zal zijn vijfde deel daarboven toedoen; en indien het niet gelost wordt, zo zal het verkocht worden, naar uw schatting.","28":"Evenwel niets, dat verbannen is, dat iemand den HEERE zal verbannen hebben, van al hetgeen hij heeft, van een mens, of van een beest, of van den akker zijner bezitting, zal verkocht noch gelost worden; al wat verbannen is, zal den HEERE een heiligheid der heiligheden zijn.","29":"Al wat verbannen is, dat van de mensen zal verbannen zijn, zal niet gelost worden; het zal zekerlijk gedood worden.","30":"Ook alle tienden des lands, van het zaad des lands, van de vrucht van het geboomte, zijn des HEEREN; zij zijn den HEERE heilig.","31":"Maar zo iemand van zijn tienden immer iets lossen zal, hij zal zijn vijfde deel daarboven toedoen.","32":"Aangaande al de tienden van runderen en klein vee, alles wat onder de roede zal doorgaan, het tiende zal den HEERE heilig zijn.","33":"Hij zal tussen het goede en het kwade niet onderzoeken; hij zal het ook niet verwisselen; maar indien hij het immers verwisselen zal, zo zal dit, en wat daarvoor verwisseld is, heilig zijn; het zal niet gelost worden.","34":"Dit zijn de geboden, die de HEERE Mozes geboden heeft, aan de kinderen Israëls, op den berg Sinaï."},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Speak unto the children of Israel, and say unto them, When a man shall make a singular vow, the persons *shall be* for the LORD by thy estimation.","3":"And thy estimation shall be of the male from twenty years old even unto sixty years old, even thy estimation shall be fifty shekels of silver, after the shekel of the sanctuary.","4":"And if it *be* a female, then thy estimation shall be thirty shekels.","5":"And if *it be* from five years old even unto twenty years old, then thy estimation shall be of the male twenty shekels, and for the female ten shekels.","6":"And if *it be* from a month old even unto five years old, then thy estimation shall be of the male five shekels of silver, and for the female thy estimation *shall be* three shekels of silver.","7":"And if *it be* from sixty years old and above; if *it be* a male, then thy estimation shall be fifteen shekels, and for the female ten shekels.","8":"But if he be poorer than thy estimation, then he shall present himself before the priest, and the priest shall value him; according to his ability that vowed shall the priest value","9":"And if *it be* a beast, whereof men bring an offering unto the LORD, all that *any man* giveth of such unto the LORD shall be holy.","10":"He shall not alter it, nor change it, a good for a bad, or a bad for a good: and if he shall at all change beast for beast, then it and the exchange thereof shall be holy.","11":"And if *it be* any unclean beast, of which they do not offer a sacrifice unto the LORD, then he shall present the beast before the priest:","12":"And the priest shall value it, whether it be good or bad: as thou valuest it, *who art* the priest,","13":"But if he will at all redeem it, then he shall add a fifth *part* thereof unto thy estimation.","14":"And when a man shall sanctify his house *to be* holy unto the LORD, then the priest shall estimate it, whether it be good or bad: as the priest shall estimate it, so shall it stand.","15":"And if he that sanctified it will redeem his house, then he shall add the fifth *part* of the money of thy estimation","16":"And if a man shall sanctify unto the LORD *some part* of a field of his possession, then thy estimation shall be according to the seed thereof: an homer of barley seed *shall be valued* at fifty shekels of silver.","17":"If he sanctify his field from the year of jubile, according to thy estimation it shall stand.","18":"But if he sanctify his field after the jubile, then the priest shall reckon unto him the money according to the years that remain, even unto the year of the jubile, and it shall be abated from thy estimation.","19":"And if he that sanctified the field will in any wise redeem it, then he shall add the fifth *part* of the money of thy estimation unto it, and it shall be assured","20":"And if he will not redeem the field, or if he have sold the field to another man, it shall not be redeemed","21":"But the field, when it goeth out in the jubile, shall be holy unto the LORD, as a field devoted; the possession thereof shall be the priest's.","22":"And if *a man* sanctify unto the LORD a field which he hath bought, which *is* not of the fields of his possession;","23":"Then the priest shall reckon unto him the worth of thy estimation, *even* unto the year of the jubile: and he shall give thine estimation in that day, *as* a holy thing unto the LORD.","24":"In the year of the jubile the field shall return unto him of whom it was bought, *even* to him to whom the possession of the land","25":"And all thy estimations shall be according to the shekel of the sanctuary: twenty gerahs shall be the shekel.","26":"Only the firstling of the beasts, which should be the LORD'S firstling, no man shall sanctify it; whether *it be* ox, or sheep: it *is* the LORD'S.","27":"And if *it be* of an unclean beast, then he shall redeem *it* according to thine estimation, and shall add a fifth *part* of it thereto: or if it be not redeemed, then it shall be sold according to thy estimation.","28":"Notwithstanding no devoted thing, that a man shall devote unto the LORD of all that he hath, *both* of man and beast, and of the field of his possession, shall be sold or redeemed: every devoted thing *is* most holy unto the LORD.","29":"None devoted, which shall be devoted of men, shall be redeemed; *but* shall surely be put to death.","30":"And all the tithe of the land, *whether* of the seed of the land, *or* of the fruit of the tree, *is* the LORD'S: *it is* holy unto the LORD.","31":"And if a man will at all redeem *ought* of his tithes, he shall add thereto the fifth","32":"And concerning the tithe of the herd, or of the flock, *even* of whatsoever passeth under the rod, the tenth shall be holy unto the LORD.","33":"He shall not search whether it be good or bad, neither shall he change it: and if he change it at all, then both it and the change thereof shall be holy; it shall not be redeemed.","34":"These *are* the commandments, which the LORD commanded Moses for the children of Israel in mount Sinai."}},"tsk":{"2":[{"kopje":"Wanneer","refs":["Gen 28:20-22","Num 6:2","Num 21:2","Deut 23:21-23","Richt 11:30","Richt 11:31","Richt 11:39","1 Sam 1:11","1 Sam 1:28"]},{"kopje":"een gelofte gedaan heeft","refs":["Lev 7:16","Pred 5:3","Pred 5:4"]}],"3":[{"kopje":"uw schatting","refs":["Lev 27:14","Lev 5:15","Lev 6:6","Num 18:16","2 Kon 12:4"]},{"kopje":"tot iemand die","refs":["Lev 27:25","Ex 30:13"]}],"4":[{"kopje":"dertig sikkel","refs":["Zach 11:12","Zach 11:13","Matt 26:15","Matt 27:9","Matt 27:10"]}],"5":[{"kopje":"tien sikkel","refs":["Lev 27:5"]}],"6":[{"kopje":"tot iemand van","refs":["Num 3:40-43","Num 18:14-16"]}],"7":[{"kopje":"van","refs":["Ps 90:10"]}],"8":[{"kopje":"armer","refs":["Lev 5:7","Lev 12:8","Lev 14:21","Lev 14:22","Mark 14:7","Luk 21:1-4","2 Kor 8:12"]},{"kop ":"And if it be a <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> whereof men <span class=\"wl wl-kjv\" data-code=\"H7126\">bring</span> an <span class=\"wl wl-kjv\" data-code=\"H7133\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> all that any man <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> of such unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be holy.","10":"He shall not <span class=\"wl wl-kjv\" data-code=\"H2498\">alter</span> it, nor <span class=\"wl wl-kjv\" data-code=\"H4171\">change</span> it, a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> for a <span class=\"wl wl-kjv\" data-code=\"H7451\">bad,</span> or a <span class=\"wl wl-kjv\" data-code=\"H7451\">bad</span> for a <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> and if he shall at <span class=\"wl wl-kjv\" data-code=\"H4171\">all</span> <span class=\"wl wl-kjv\" data-code=\"H4171\">change</span> <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> for <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> then it and the <span class=\"wl wl-kjv\" data-code=\"H8545\">exchange</span> thereof shall be holy.","11":"And if it be any <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> of which they do not <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> a <span class=\"wl wl-kjv\" data-code=\"H7133\">sacrifice</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> then he shall <span class=\"wl wl-kjv\" data-code=\"H5975\">present</span> the <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the priest:","12":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6186\">value</span> it, <span class=\"wl wl-kjv\" data-code=\"H996\">whether</span> it be <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H996\">or</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">bad:</span> as thou <span class=\"wl wl-kjv\" data-code=\"H6187\">valuest</span> it, who art the priest,","13":"But if he will at <span class=\"wl wl-kjv\" data-code=\"H1350\">all</span> <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it, then he shall <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> a <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> part thereof unto thy estimation.","14":"And when a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to be <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6186\">estimate</span> it, whether it be <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> or <span class=\"wl wl-kjv\" data-code=\"H7451\">bad:</span> as the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6186\">estimate</span> it, so shall it stand.","15":"And if he that <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> it will <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> then he shall <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> part of the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of thy estimation","16":"And if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> some part of a <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of his <span class=\"wl wl-kjv\" data-code=\"H272\">possession,</span> then thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6310\">according</span> to the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> thereof: an <span class=\"wl wl-kjv\" data-code=\"H2563\">homer</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall be valued at <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of silver.","17":"If he <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> his <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> from the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile,</span> according to thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> it shall stand.","18":"But if he <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> his <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile,</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H2803\">reckon</span> unto him the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> according <span class=\"wl wl-kjv\" data-code=\"H6310\">to</span> the <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> that <span class=\"wl wl-kjv\" data-code=\"H3498\">remain,</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of the <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile,</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H1639\">abated</span> from thy estimation.","19":"And if he that <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> will in any <span class=\"wl wl-kjv\" data-code=\"H1350\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it, then he shall <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> part of the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> unto it, and it shall be assured","20":"And if he will not <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> or if he have <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> to <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> it shall not be redeemed","21":"But the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> when it goeth <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> in the <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as a <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> <span class=\"wl wl-kjv\" data-code=\"H2764\">devoted;</span> the <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> thereof shall be the priest's.","22":"And if a man <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> a <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> which he hath <span class=\"wl wl-kjv\" data-code=\"H4736\">bought,</span> which is not of the <span class=\"wl wl-kjv\" data-code=\"H7704\">fields</span> of his possession;","23":"Then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H2803\">reckon</span> unto him the <span class=\"wl wl-kjv\" data-code=\"H4373\">worth</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation,</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of the <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thine <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> as a holy <span class=\"wl wl-kjv\" data-code=\"H6944\">thing</span> unto the LORD.","24":"In the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of the <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto him of whom it was <span class=\"wl wl-kjv\" data-code=\"H7069\">bought,</span> even to him to whom the <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> of the land","25":"And all thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimations</span> shall be according to the <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary:</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H1626\">gerahs</span> shall be the shekel.","26":"Only the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstling</span> of the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts,</span> which should be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H1069\">firstling,</span> no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> it; whether it be <span class=\"wl wl-kjv\" data-code=\"H7794\">ox,</span> or <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep:</span> it is the LORD'S.","27":"And if it be of an <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> then he shall <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem</span> it according to thine <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> a <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> part of it thereto: or if it be not <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemed,</span> then it shall be <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> according to thy estimation.","28":"Notwithstanding no devoted <span class=\"wl wl-kjv\" data-code=\"H2764\">thing,</span> that a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H2763\">devote</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of all that he hath, both of <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of his <span class=\"wl wl-kjv\" data-code=\"H272\">possession,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> or <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemed:</span> every devoted <span class=\"wl wl-kjv\" data-code=\"H2764\">thing</span> is <span class=\"wl wl-kjv\" data-code=\"H6944\">most</span> <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> unto the LORD.","29":"None <span class=\"wl wl-kjv\" data-code=\"H2764\">devoted,</span> which shall <span class=\"wl wl-kjv\" data-code=\"H3808\">be</span> <span class=\"wl wl-kjv\" data-code=\"H2763\">devoted</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed;</span> but shall <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> be put to death.","30":"And all the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithe</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> whether of the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> or of the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of the <span class=\"wl wl-kjv\" data-code=\"H6086\">tree,</span> is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S:</span> it is <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> unto the LORD.","31":"And if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> will at <span class=\"wl wl-kjv\" data-code=\"H1350\">all</span> <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> ought of his <span class=\"wl wl-kjv\" data-code=\"H4643\">tithes,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> thereto the fifth","32":"And concerning the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithe</span> of the <span class=\"wl wl-kjv\" data-code=\"H1241\">herd,</span> or of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock,</span> even of whatsoever <span class=\"wl wl-kjv\" data-code=\"H5674\">passeth</span> under the <span class=\"wl wl-kjv\" data-code=\"H7626\">rod,</span> the <span class=\"wl wl-kjv\" data-code=\"H6224\">tenth</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> unto the LORD.","33":"He shall not <span class=\"wl wl-kjv\" data-code=\"H1239\">search</span> whether it be <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> or <span class=\"wl wl-kjv\" data-code=\"H7451\">bad,</span> neither shall he <span class=\"wl wl-kjv\" data-code=\"H4171\">change</span> it: and if he <span class=\"wl wl-kjv\" data-code=\"H4171\">change</span> it at <span class=\"wl wl-kjv\" data-code=\"H4171\">all,</span> then both it and the <span class=\"wl wl-kjv\" data-code=\"H8545\">change</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">holy;</span> it shall not be redeemed.","34":"These are the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Sinai."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"zal afgezonderd hebben,","tekst":"Te weten, uit de dingen of personen, die hem toebehoren, of in zijn vermogen zijn, begerende die den HEERE toe te eigenen tot een heilig gebruik, hetwelk onder vs.14, enz. heiligen wordt genoemd."},{"catchword":"uw schatting","tekst":"De HEERE spreekt den priester toe, gelijk blijkt uit vs.12, die deze schatting doen moest; versta bij deze de som geld, naar welke het geheiligde gewaardeerd en gelost werd."},{"catchword":"de zielen","tekst":"Dat is, de personen of mensen. Zie Gen 12:5."},{"catchword":"HEEREN zijn","tekst":"En vervolgens des priesters, die den dienst des HEEREN en wat er toe behoorde waarnemen moest. Hebreeuws, den HEERE."}],"3":[{"catchword":"zal zijn van twintig jaren oud,","tekst":"Hebreeuws, van een zoon van twintig jaren tot een zoon van zestig jaren; en zo in het volgende."},{"catchword":"ikkelen zilvers,","tekst":"Zie van deze munt Gen 20:16, en Gen 23:15."}],"8":[{"catchword":"dan uw schatting,","tekst":"Of, dan gij hem geschat hebt; dat is, zo hij te arm is om uw schatting te betalen."},{"catchword":"hand desgenen,","tekst":"Zie van deze manier van spreken boven, Lev 5:7."}],"9":[{"catchword":"hij","tekst":"Te weten, hij, die de belofte gedaan heeft."},{"catchword":"daarvan den HEERE","tekst":"Dat is, van wat men in de wet placht te offeren."},{"catchword":"heilig zijn","tekst":"Hebreeuws, heiligheid; alzo in vs.1 uit de macht en de bezitting desgenen, die hem gekocht had. Zie boven, Lev 25:28."},{"catchword":"verbannen akker;","tekst":"Het Hebreeuwse woord betekent wel ene uitroeiing ten verderving, waarvan niet moest overgelaten worden, Deu 2:34, en Deu 7:26, maar ook een toeheiliging van hetgeen God alleen toebehoren moest, en dienvolgens den priester eigen werd, gelijk hier en onder, vs.28; Num 18:14."}],"22":[{"catchword":"dien hij gekocht heeft,","tekst":"Hebreeuws, zijner koping, of verovering"},{"catchword":"bezitting;","tekst":"Dat is, dien hij als erfgoed bezit."}],"23":[{"catchword":"uwer schatting","tekst":"Dat is, der schatting, die gij, Mozes, door mijn gebod hem voorstelt, welke schatting door den priester moest geschieden, vs.25; of met deze woorden sprak de HEERE den priester toe, die de schatting doen moest. Zie boven, vs.12."},{"catchword":"hij zal op denzelven dag","tekst":"Te weten, hij, die den akker heeft geheiligd."},{"catchword":"een heiligheid den HEERE","tekst":"Dat is, die den HEERE geheiligd is, of, den HEERE [ter] heiligheid; dat is, opdat zij den HEERE heilig zij."}],"25":[{"catchword":"uw schatting","tekst":"Hier spreekt de HEERE wederom den priester aan."},{"catchword":"gera","tekst":"Een gera woog zestig gerstekorreltjes of azen, bedragende het twintigste deel van een halven rijksdaalder. Zie ook van deze munt Exo 30:13; Num 3:47, en Num 18:16."}],"26":[{"catchword":"eerstgeborene,","tekst":"Dat is, dat anders, vanwege het recht der eerstgeboorte, den HEERE toebehoort, en daarom kunt gij daarvan geen belofte doen. Zie Exo 13:2, en Exo 22:29, en Exo 34:19; Num 3:13, en Num 8:17."}],"28":[{"catchword":"verbannen is,","tekst":"Zie boven, vs.21."},{"catchword":"al wat verbannen is,","tekst":"Hebreeuws, alle verbanning"},{"catchword":"heiligheid der heiligheden zijn","tekst":"Zie boven, Lev 2:3."}],"29":[{"catchword":"het zal zekerlijk","tekst":"Versta dit van mensen, die vijanden Gods en van zijn volk zijn, en welke inzonderheid de Heere geboden  the children of Israel, and say to them; when any one shall have separated a Vow, [viz. of such things or persons as appertain unto him, or are in his power and disposing, desirons to dedicate and consecrate the same to the LORD for an holy use: which therefore below verse 14. etc. is called a hallowing] the souls, [i.e. the persons, or men. See Gen. 12. on verse 5.] shall be the LORD&acirc;&euro;&trade;s, [and consequently the Priests, who were to administer the service of the LORD, and to take charge of all that belonged thereunto. Heb. unto the LORD] according to thy Estimation. [The LORD speaketh unto the Priest here, as appeareth by verse 12. who was to make this Estimation; understand thereby the sum of money, which the hallowed things were valued at and redeemed for]"}],"3":[{"catchword":null,"tekst":"When thy Estimation shall be of a man of twenty years old, to one that is sixty years old, [Heb. of a son of twenty years, to a son of sixty years, and so in the sequel] then shall thy Estimation be of fifty shekels of silver [of this coin, see Gen. 20. on verse 16. and chap. 23. on verse 15.] according to the shekel of the Sanctuary."}],"4":[{"catchword":null,"tekst":"But if it be a woman, then shall thy Estimation be thirty shekels."}],"5":[{"catchword":null,"tekst":"And if it be of one that is five years old, to one that is twenty years old, then the Estimation of a man shall be twenty shekels, and for a woman ten shekels."}],"6":[{"catchword":null,"tekst":"But if it be of one that is a month old, unto one that is five years old, then the Estimation of a man shall be five shekels of silver, and thy Estimation over a woman, shall be three shekels of silver."}],"7":[{"catchword":null,"tekst":"And if it be one of that is sixty years old, and upwards, if it be a man, then thy Estimation shall be fifteen shekels; and for a woman ten shekels."}],"8":[{"catchword":null,"tekst":"But if he be poorer then thy Estimation, [Or, then thou hast estimated him, i.e. if he be so poor, that he is not able to pay thy Estimation] then he shall place himself before the face of the Priest, that the Priest may estimate him; the Priest shall estimate him according, that the hand of him that made the Vow, shall be able to get. [see of this phrase above chap. 5. on verse 7.]"}],"9":[{"catchword":null,"tekst":"And If it be a beast, whereof one offereth sacrifice unto the LORD, whatsoever he [viz. that made the Vow] shall have given thereof [i.e. of what one useth to offer, according to the Law] unto the LORD (the same) shall be holy. [Heb. holiness and so in the next verse, and verse 14, etc. i.e. dedicated and consecrated to God.]"}],"10":[{"catchword":null,"tekst":"He shall not alter, nor charge the same, a good for a bad (one) or a bad for a good (one) if nevertheless he in any wise exchange [Heb. exchanging exchange] a beast for a beast, then this, [viz. that was changed] and that for which it is changed, [Heb. his exchange, i.e. that which is put in the place of the changed, so below verse 33.] shall be holy."}],"11":[{"catchword":null,"tekst":"And if it be any unclean beast, of which one offereth no sacrifice unto the LORD, then he shall place that beast before the face of the Priest:"}],"12":[{"catchword":null,"tekst":"And the Priest shall estimate the same, according as it is good or bad, and accordingly to proportion his estimate, Hebr. betwixt good and betwixt bad, and so below verse 14.] according to thy estimation, Priest, so shall it be."}],"13":[{"catchword":null,"tekst":"But if he will needs redeem it, [Heb. redeeming redeem] then shall he and the first part of it above the estimation."}],"14":[{"catchword":null,"tekst":"And when any shall have consecrated (hallowed) his house, [i.e. freely offered and dedicated the same to God by a Vow, whereby it became the Priests; in which case, if one would have the house redeemed, the estimation of the value thereof was to be made by the Priest, and a first part over and above the same to be paid for it] that it should be holy to the Lord, then the Priest shall estimate the same, according as it is good or bad; even as the Priest shall have estimated the same, so shall it stand."}],"15":[{"catchword":null,"tekst":"And if he that hallowed it, will redeem his house, then he shall add above the same a fifth part of the money of thy estimation, then it shall be his."}],"16":[{"catchword":null,"tekst":"If likewise any one shall have hallowed ought unto the LORD of the field of his possession, then thy estimation shall be according to its seed; [i.e. according to the quantity of the seed, wherewith that land was to be sowed, shalt thou value the money that is to be paid for the redemption thereof ] one Homer [of this measure, see 1 King. 4. on vers. 22. Isa. 5. 10. Ezek. 45. 11. Hos. 3. 2.] of barly seed shall be at fifty shekels of silver."}],"17":[{"catchword":null,"tekst":"If he shall have consecrated his field from the Jubel-year, [see above chap. 25. verse 20.] then shall it stand according to thy estimation. [i.e. according to the price thou puttest upon it, shall that land return again to him that had hallowed it unto the LORD, he paying the said price."}],"18":[{"catchword":null,"tekst":"But if he shall have hallowed his field after the Jubel-year, then shall the Priest count him the money, according to the years, that are remaining yet unto the Jubel-year, [i.e. according to as many, or as few, as are remaining over, until the Jubel-year] and shall be deducted from thy estimation. [Of this deduction and abatement, according to the number of years from the Jubilee, see above chap. 25. 15, 16, 17.]"}],"19":[{"catchword":null,"tekst":"And it he will absolutely redeem [Heb. redeeming redeem] the field, that hallowed the same; then he shall add a first part of the money of thy estimation above it, and the same shall be confirmed to him."}],"20":[{"catchword":null,"tekst":"And if he shall not redeem that field, or if he have sold that filed unto another man; then it shall be redeemed no more."}],"21":[{"catchword":null,"tekst":"But that field, after that it shall have gone out in the Jubel-year [viz. out of the power and the possession of then that had bought the same, see above chap. 25. on ver. 28.] shall be holy to the LORD, like a banned (accursed, or devoted) field: [ The Hebr. Epithite here implyeth indeed an extirpation and destruction, whereof nothing was to be left over, Deut. 2. 34. and 7. 26. but withal, a dedicating and consecrating of some thing to Gods peculiar service, which consequently became the Priests own, or propriety, as here, and below ver. 29. Num. 18. ver. 14.] the possession thereof shall he the Priests."}],"22":[{"catchword":null,"tekst":"And if he have hallowed a field to the LORD, which he bought, [Heb. of his buying, or, acquiring] and is not of the field of his possession, [viz. by inheritance.]"}],"23":[{"catchword":null,"tekst":"Then the Priest shall count unto him the sum of thy Estimation unto the Jubel-year: [i.e. the Estimation which thou Moseh, by my command dost appoint him, which must be made by the Priest himself, ver. 25. or, these words are addressed by the LORD unto the Priest himself, that was to make this Estimation, see above verse 12.] and he {viz. which hallowed the field] shall give thy Estimation upon the same day, a holiness to the LORD, [i.e. which is hallowed unto the LORD, or, unto the LORD (for) holiness i.e. that it may be holy to the LORD.]"}],"24":[{"catchword":null,"tekst":"In the Jubel-year shall that field return again to him, from whom he had bought it, unto him that had the possession of that land."}],"25":[{"catchword":null,"tekst":"All thy estimation [Now here the LORD speaks apparently again to the Priest] Shall be made according to the Shekel of the Sanctuary, the shekel shall be of twenty Gerahs, [a Gerah weighed sixty barly-grains, or aces, answering in our value the twentieth part of a Rix-doller, (about two pence three farthings within a small matter) See likewise of this coin, Ex. 30. 13. Num. 3. 41. & 18. 16.]"}],"27":[{"catchword":null,"tekst":"Yet if it be of an unclean beast, he shall redeem it according to thy Estimation, and shall add its first part above the same; and if it be not redeemed, it shall be sold, according to thy Estimation."}],"28":[{"catchword":null,"tekst":"However, nothing that is banned, [See above on verse 21]. that any one shall have banned to the LORD, of all that he hath of man or beast, or of the field of his possession shall be sold or redeemed, whatsoever is banned, [Heb. all banning] shall be a holiness of holinesses unto the LORD [see above chap. 2. on verse 3.]"}],"29":[{"catchword":null,"tekst":"Whatsoever is banned, that which is banned of man, shall not be redeemed; it shall surely be put to death. [understand this of men, enemies to God and to his people, especially these whom the LORD commanded to be destroyed and extirpated, those might not be redeemed, nor suffered to live, see Num. 21. 2, 3. Josh. 6. 17, 18. 1 Sam. 15. 3. This may likewise be understood not of men, but of beasts banned, or devoted by men.]"}],"30":[{"catchword":null,"tekst":"Also all tenths of the land, of the fruit of the trees are the LORD&acirc;&euro;&trade;s, they are holy to the LORD. [There were four sorts of Tenths. 1. The ordinary yearly Tenths of the Levites, spoken of in this place , Num. 18. 21. etc. Deut. 14. 22, etc. and 25. verse 12, & c. 2 Chron. 31. verse 5. Neh. 10. verse 37. Heb. 7. 9, 10. 2. The Tenth which the Levites were to give unto the High Priest out of those Tenths, Num. 18. verse 26, etc. 3. The yearly tenths, whereof the Israelites, together with their families, and the Levites were to rejoice before the LORD, Deut. 12. 17, 18. and chap. 14. 22, 23. 4. The trienniall Tenths in the behalf of the Levites, the Poor, the Widows and Fatherless, and the Strangers, Deut. 14. 28. and chap. 26. 12]"}],"31":[{"catchword":null,"tekst":"But if anyone will needs redeem, [Heb. redeeming will redeem] his Tenth, he shall add its first part to it above the same."}],"32":[{"catchword":null,"tekst":"As for all the Tenths of bullocks and small cattle, all that shall pass under the rod, the Tenth shall be holy unto the LORD. [This hath regard to the manner of choosing out the Tenths among the cattle, which was in use then; the beasts came forth out of the stables or folds one by one, and the Tithing-man touched the tenth beast in numbering of them with his rod or staff, and so took it away for to hallow it unto the LORD, see likewise Jer. 33. 13.]"}],"33":[{"catchword":null,"tekst":"He shall not make search between the good and the bad; [As between the fat and the lean, there was no choice to be made by either giver or receiver of the Tenths: he that paid his Tenths gave not what he would himself, but that which in numbering of the cattle coming forth, happened to prove the tenth in number, as is said just before] he shall not change it neither; but if he change it in any wise, [see above on verse 10.] then (both) this, and that which changed for it, shall be holy, it shall not be redeemed."}],"34":[{"catchword":null,"tekst":"These are the Commandments, which the LORD commanded Moseh to the children of Israel upon Mount Sinai. [See hereof above chap. 25. 1. and chap. 26. 46.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

/* ---------- rijen (her)bouwen ---------- */

    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
