gen hen: Wanneer iemand een gelofte gedaan heeft *om iemand af te zonderen*, zullen de zielen naar uw schatting van de HEERE zijn.", "3": "Als uw schatting van een man geldt, van twintig jaar oud tot iemand die zestig jaar oud is, dan zal uw schatting vijftig sikkel zilver zijn, naar de sikkel van het heiligdom.", "4": "Maar is het een vrouw, dan zal uw schatting dertig sikkel zijn.", "5": "En is het iemand van vijf jaar oud tot iemand van twintig jaar oud, dan zal uw schatting voor een man twintig sikkel zijn, en voor een vrouw tien sikkel.", "6": "Maar is het iemand van een maand oud tot iemand van vijf jaar oud, dan zal uw schatting voor een man vijf sikkel zilver zijn, en uw schatting voor een vrouw zal drie sikkel zilver zijn.", "7": "En is het iemand van zestig jaar oud en ouder, is het een man, dan zal uw schatting vijftien sikkel zijn, en voor een vrouw tien sikkel.", "8": "Maar als hij armer is dan uw schatting, dan zal hij zich voor het aangezicht van de priester stellen, zodat de priester hem schat; naar wat de hand van hem die de gelofte gedaan heeft, kan opbrengen, zal de priester hem schatten.", "9": "En als het een dier is waarvan men de HEERE een offergave brengt: alles wat hij daarvan aan de HEERE geeft, zal heilig zijn.", "10": "Hij zal het niet ruilen, en het ook niet verwisselen, een goed voor een slecht, of een slecht voor een goed; als hij toch een dier voor een dier op enige manier verwisselt, dan zal dit, en waarvoor het verwisseld is, heilig zijn.", "11": "En als het enig onrein dier is, waarvan men de HEERE geen offergave brengt, dan zal hij dat dier voor het aangezicht van de priester stellen.", "12": "En de priester zal het schatten, naardat het goed of slecht is; naar uw schatting, priester, zo zal het zijn.", "13": "Maar als hij het echt wil afkopen, dan zal hij een vijfde deel boven uw schatting toevoegen.", "14": "En wanneer iemand zijn huis geheiligd heeft, zodat het de HEERE heilig is, dan zal de priester dat schatten, naardat het goed of slecht is; zoals de priester het geschat heeft, zo zal het blijven staan.", "15": "En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.", "16": "Als ook iemand van de akker van zijn eigendom iets aan de HEERE heiligt, dan zal uw schatting zijn naar het zaad ervan; een homer[1] gerstezaad zal geschat worden op vijftig sikkel zilver.", "17": "Als hij zijn akker vanaf het jubeljaar geheiligd heeft, dan zal het naar uw schatting blijven staan.", "18": "Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.", "19": "En als hij die de akker geheiligd heeft, die helemaal wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en dan zal die hem toegewezen zijn.", "20": "En als hij die akker niet afkoopt, of als hij die akker aan een andere man verkocht heeft, dan zal hij niet meer afgekocht worden.", "21": "Maar die akker zal, nadat hij in het jubeljaar is uitgegaan, de HEERE heilig zijn, als een verboden akker; het eigendom daarvan zal aan de priester toevallen.", "22": "En als hij de HEERE een akker heeft geheiligd die hij gekocht heeft, en die niet bij de akker van zijn eigendom hoort;", "23": "dan zal de priester hem de som van uw schatting berekenen tot het jubeljaar; en hij zal op diezelfde dag uw schatting geven, als iets heiligs voor de HEERE.", "24": "In het jubeljaar zal die akker terugkeren naar hem van wie hij hem gekocht had, naar hem aan wie het eigendom van dat land toebehoorde.", "25": "Al uw schatting nu zal gebeuren naar de sikkel van het heiligdom; de sikkel zal van twintig gera zijn.", "26": "Maar het eerstgeborene, dat de HEERE als eerstgeborene van een dier toebehoort, dat zal niemand heiligen; hetzij een rund, of een schaap of geit, het is van de HEERE.", "27": "Maar is het van een onrein dier, dan zal hij dat afkopen naar uw schatting, en zal er zijn vijfde deel daarboven aan toevoegen; en als het niet afgekocht wordt, dan zal het verkocht worden, naar uw schatting.", "28": "Toch, niets wat verboden is, dat iemand aan de HEERE verboden heeft, van alles wat hij heeft, van een mens, of van een dier, of van de akker van zijn eigendom, zal verkocht of afgekocht worden; alles wat verboden is, zal voor de HEERE allerheiligst zijn.", "29": "Alles wat verboden is, dat van de mensen verboden zal zijn, zal niet afgekocht worden; het zal zeker gedood worden.", "30": "Ook alle tienden van het land, van het zaad van het land, van de vrucht van de boom, zijn van de HEERE; zij zijn de HEERE heilig.", "31": "Maar als iemand van zijn tienden iets echt wil afkopen, zal hij zijn vijfde deel daarboven toevoegen.", "32": "Wat betreft alle tienden van runderen en klein vee, alles wat onder de herdersstaf doorgaat, het tiende zal de HEERE heilig zijn.", "33": "Hij zal niet onderzoeken of het goed of slecht is; hij zal het ook niet verwisselen; maar als hij het toch verwisselt, dan zal dit, en waarvoor het verwisseld is, heilig zijn; het zal niet afgekocht worden.", "34": "Dit zijn de geboden die de HEERE Mozes geboden heeft, aan de kinderen van Israël, op de berg Sinaï."}, "SV": {"1": "Verder sprak de HEERE tot Mozes, zeggende:", "2": "Spreek tot de kinderen Israëls, en zeg tot hen: Wanneer iemand een gelofte zal afgezonderd hebben, naar uw schatting zullen de zielen des HEEREN zijn.", "3": "Als uw schatting eens mans zal zijn van twintig jaren oud, tot een, die zestig jaren oud is; dan zal uw schatting zijn van vijftig sikkelen zilvers, naar den sikkel des heiligdoms.", "4": "Maar is het een vrouw, dan zal uw schatting zijn dertig sikkelen.", "5": "En is het van een, die vijf jaren oud is, tot een, die twintig jaren oud is, zo zal uw schatting van een man twintig sikkelen zijn, en voor een vrouw tien sikkelen.", "6": "Maar is het van een, die een maand oud is, tot een, die vijf jaren oud is, zo zal uw schatting van een man zijn vijf sikkelen zilvers, en uw schatting over een vrouw zal zijn drie sikkelen zilvers.", "7": "En is het van een, die zestig jaren oud is en daarboven, is het een man, zo zal uw schatting zijn vijftien sikkelen, en voor een vrouw tien sikkelen.", "8": "Maar zo hij armer is, dan uw schatting, zo zal hij zich voor het aangezicht des priesters zetten, opdat de priester hem schatte; naar dat de hand desgenen, die de gelofte gedaan heeft, zal kunnen bekomen, zal de priester hem schatten.", "9": "En indien het een beest is, waarvan men den HEERE offerande offert; al wat hij daarvan den HEERE zal gegeven hebben, zal heilig zijn.", "10": "Hij zal niet vermangelen, noch hetzelve verwisselen, een goed voor een kwaad, of een kwaad voor een goed; indien hij nochtans een beest voor een beest enigszins verwisselt, zo zal dit, en wat daarvoor verwisseld is, heilig zijn.", "11": "En indien het enig onrein beest is, van hetwelk men den HEERE geen offerande offert, zo zal hij dat beest voor het aangezicht des priesters zetten.", "12": "En de priester zal dat schatten, naar dat het goed of kwaad is; naar uw schatting, priester! zo zal het zijn.", "13": "Maar indien hij het immers lossen zal, zo zal hij deszelfs vijfde deel boven uw schatting toedoen.", "14": "En wanneer iemand zijn huis zal geheiligd hebben, dat het den HEERE heilig zij, zo zal de priester dat schatten, naar dat het goed of kwaad is; gelijk als de priester dat geschat zal hebben, zo zal het stand hebben.", "15": "En indien hij, die het geheiligd heeft, zijn huis zal lossen, zo zal hij een vijfde deel des gelds uwer schatting daarboven toedoen, zo zal het zijne zijn.", "16": "Indien ook iemand van den akker zijner bezitting den HEERE wat geheiligd zal hebben, zo zal uw schatting zijn naar zijn zaad; een homer gerstezaad zal zijn op vijftig sikkelen zilvers.", "17": "Indien hij zijn akker van het jubeljaar af geheiligd zal hebben, zo zal het naar uw schatting stand hebben.", "18": "Maar zo hij zijn akker na het jubeljaar geheiligd zal hebben, dan zal hem de priester het geld rekenen, naar de jaren, die nog overig zijn tot het jubeljaar; en het zal van uw schatting afgetrokken worden.", "19": "En indien hij, die den akker geheiligd heeft, denzelven ganselijk lossen zal, zo zal hij een vijfde deel des gelds uwer schatting daarboven toedoen, en dezelve zal hem gevestigd zijn.", "20": "En indien hij dien akker niet zal lossen, of indien hij dien akker aan een anderen man verkocht heeft, zo zal hij niet meer gelost worden.", "21": "Maar die akker, nadat hij in het jubeljaar zal uitgegaan zijn, zal den HEERE heilig zijn, als een verbannen akker; de bezitting daarvan zal des priesters zijn.", "22": "En indien hij den HEERE een akker heeft geheiligd, dien hij gekocht heeft, en niet is van den akker zijner bezitting;", "23": "Zo zal de priester hem rekenen de som uwer schatting tot het jubeljaar; en hij zal op denzelven dag uw schatting geven, een heiligheid den HEERE.", "24": "In het jubeljaar zal die akker wederkomen tot dien, van wien hij hem gekocht had, tot hem, wiens de bezitting van dat land was.", "25": "Al uw schatting nu zal naar den sikkel des heiligdoms geschieden; de sikkel zal zijn van twintig gera.", "26": "Maar het eerstgeborene, dat den HEERE van een beest eerstgeboren wordt, dat zal niemand heiligen; hetzij een os, of klein vee, het is des HEEREN.", "27": "Doch is het van een onrein beest, hij zal dat lossen naar uw schatting, en zal zijn vijfde deel daarboven toedoen; en indien het niet gelost wordt, zo zal het verkocht worden, naar uw schatting.", "28": "Evenwel niets, dat verbannen is, dat iemand den HEERE zal verbannen hebben, van al hetgeen hij heeft, van een mens, of van een beest, of van den akker zijner bezitting, zal verkocht noch gelost worden; al wat verbannen is, zal den HEERE een heiligheid der heiligheden zijn.", "29": "Al wat verbannen is, dat van de mensen zal verbannen zijn, zal niet gelost worden; het zal zekerlijk gedood worden.", "30": "Ook alle tienden des lands, van het zaad des lands, van de vrucht van het geboomte, zijn des HEEREN; zij zijn den HEERE heilig.", "31": "Maar zo iemand van zijn tienden immer iets lossen zal, hij zal zijn vijfde deel daarboven toedoen.", "32": "Aangaande al de tienden van runderen en klein vee, alles wat onder de roede zal doorgaan, het tiende zal den HEERE heilig zijn.", "33": "Hij zal tussen het goede en het kwade niet onderzoeken; hij zal het ook niet verwisselen; maar indien hij het immers verwisselen zal, zo zal dit, en wat daarvoor verwisseld is, heilig zijn; het zal niet gelost worden.", "34": "Dit zijn de geboden, die de HEERE Mozes geboden heeft, aan de kinderen Israëls, op den berg Sinaï."}, "KJV": {"1": "And the LORD spake unto Moses, saying,", "2": "Speak unto the children of Israel, and say unto them, When a man shall make a singular vow, the persons *shall be* for the LORD by thy estimation.", "3": "And thy estimation shall be of the male from twenty years old even unto sixty years old, even thy estimation shall be fifty shekels of silver, after the shekel of the sanctuary.", "4": "And if it *be* a female, then thy estimation shall be thirty shekels.", "5": "And if *it be* from five years old even unto twenty years old, then thy estimation shall be of the male twenty shekels, and for the female ten shekels.", "6": "And if *it be* from a month old even unto five years old, then thy estimation shall be of the male five shekels of silver, and for the female thy estimation *shall be* three shekels of silver.", "7": "And if *it be* from sixty years old and above; if *it be* a male, then thy estimation shall be fifteen shekels, and for the female ten shekels.", "8": "But if he be poorer than thy estimation, then he shall present himself before the priest, and the priest shall value him; according to his ability that vowed shall the priest value", "9": "And if *it be* a beast, whereof men bring an offering unto the LORD, all that *any man* giveth of such unto the LORD shall be holy.", "10": "He shall not alter it, nor change it, a good for a bad, or a bad for a good: and if he shall at all change beast for beast, then it and the exchange thereof shall be holy.", "11": "And if *it be* any unclean beast, of which they do not offer a sacrifice unto the LORD, then he shall present the beast before the priest:", "12": "And the priest shall value it, whether it be good or bad: as thou valuest it, *who art* the priest,", "13": "But if he will at all redeem it, then he shall add a fifth *part* thereof unto thy estimation.", "14": "And when a man shall sanctify his house *to be* holy unto the LORD, then the priest shall estimate it, whether it be good or bad: as the priest shall estimate it, so shall it stand.", "15": "And if he that sanctified it will redeem his house, then he shall add the fifth *part* of the money of thy estimation", "16": "And if a man shall sanctify unto the LORD *some part* of a field of his possession, then thy estimation shall be according to the seed thereof: an homer of barley seed *shall be valued* at fifty shekels of silver.", "17": "If he sanctify his field from the year of jubile, according to thy estimation it shall stand.", "18": "But if he sanctify his field after the jubile, then the priest shall reckon unto him the money according to the years that remain, even unto the year of the jubile, and it shall be abated from thy estimation.", "19": "And if he that sanctified the field will in any wise redeem it, then he shall add the fifth *part* of the money of thy estimation unto it, and it shall be assured", "20": "And if he will not redeem the field, or if he have sold the field to another man, it shall not be redeemed", "21": "But the field, when it goeth out in the jubile, shall be holy unto the LORD, as a field devoted; the possession thereof shall be the priest's.", "22": "And if *a man* sanctify unto the LORD a field which he hath bought, which *is* not of the fields of his possession;", "23": "Then the priest shall reckon unto him the worth of thy estimation, *even* unto the year of the jubile: and he shall give thine estimation in that day, *as* a holy thing unto the LORD.", "24": "In the year of the jubile the field shall return unto him of whom it was bought, *even* to him to whom the possession of the land", "25": "And all thy estimations shall be according to the shekel of the sanctuary: twenty gerahs shall be the shekel.", "26": "Only the firstling of the beasts, which should be the LORD'S firstling, no man shall sanctify it; whether *it be* ox, or sheep: it *is* the LORD'S.", "27": "And if *it be* of an unclean beast, then he shall redeem *it* according to thine estimation, and shall add a fifth *part* of it thereto: or if it be not redeemed, then it shall be sold according to thy estimation.", "28": "Notwithstanding no devoted thing, that a man shall devote unto the LORD of all that he hath, *both* of man and beast, and of the field of his possession, shall be sold or redeemed: every devoted thing *is* most holy unto the LORD.", "29": "None devoted, which shall be devoted of men, shall be redeemed; *but* shall surely be put to death.", "30": "And all the tithe of the land, *whether* of the seed of the land, *or* of the fruit of the tree, *is* the LORD'S: *it is* holy unto the LORD.", "31": "And if a man will at all redeem *ought* of his tithes, he shall add thereto the fifth", "32": "And concerning the tithe of the herd, or of the flock, *even* of whatsoever passeth under the rod, the tenth shall be holy unto the LORD.", "33": "He shall not search whether it be good or bad, neither shall he change it: and if he change it at all, then both it and the change thereof shall be holy; it shall not be redeemed.", "34": "These *are* the commandments, which the LORD commanded Moses for the children of Israel in mount Sinai."}}, "tsk": {"2": [{"kopje": "Wanneer", "refs": [
