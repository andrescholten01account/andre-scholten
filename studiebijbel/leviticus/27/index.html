4:12-18", "svLabel": null}, {"disp": "Ex 32:15", "href": "../../exodus/32/#v15", "ref": "Ex 32:15", "svLabel": null}, {"disp": "Ex 32:16", "href": "../../exodus/32/#v16", "ref": "Ex 32:16", "svLabel": null}, {"disp": "Ex 34:2-4", "href": "../../exodus/34/#v2", "ref": "Ex 34:2-4", "svLabel": null}, {"disp": "Lev 7:38", "href": "../../leviticus/7/#v38", "ref": "Lev 7:38", "svLabel": null}, {"disp": "Lev 25:1", "href": "../../leviticus/25/#v1", "ref": "Lev 25:1", "svLabel": null}, {"disp": "Lev 26:46", "href": "../../leviticus/26/#v46", "ref": "Lev 26:46", "svLabel": null}, {"disp": "Lev 27:34", "href": "../../leviticus/27/#v34", "ref": "Lev 27:34", "svLabel": null}, {"disp": "Num 3:1", "href": "../../numeri/3/#v1", "ref": "Num 3:1", "svLabel": null}, {"disp": "Deut 4:15", "href": "../../deuteronomium/4/#v15", "ref": "Deut 4:15", "svLabel": null}, {"disp": "Deut 5:26", "href": "../../deuteronomium/5/#v26", "ref": "Deut 5:26", "svLabel": null}, {"disp": "Deut 29:1", "href": "../../deuteronomium/29/#v1", "ref": "Deut 29:1", "svLabel": null}, {"disp": "Deut 33:2", "href": "../../deuteronomium/33/#v2", "ref": "Deut 33:2", "svLabel": null}, {"disp": "Neh 9:13", "href": "../../nehemia/9/#v13", "ref": "Neh 9:13", "svLabel": null}, {"disp": "Ps 68:8", "href": "../../psalmen/68/#v9", "ref": "Ps 68:9", "svLabel": "SV 9"}, {"disp": "Ps 68:17", "href": "../../psalmen/68/#v18", "ref": "Ps 68:18", "svLabel": "SV 18"}, {"disp": "Mal 4:4", "href": "../../maleachi/4/#v4", "ref": "Mal 4:4", "svLabel": null}, {"disp": "Hand 7:30", "href": "../../handelingen/7/#v30", "ref": "Hand 7:30", "svLabel": null}, {"disp": "Hand 7:38", "href": "../../handelingen/7/#v38", "ref": "Hand 7:38", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Lev 27:11-23": "En als het enig onrein dier is, waarvan men de HEERE geen offergave brengt, dan zal hij dat dier voor het aangezicht van de priester stellen. En de priester zal het schatten, naardat het goed of slecht is; naar uw schatting, priester, zo zal het zijn. Maar als hij het echt wil afkopen, dan zal hij een vijfde deel boven uw schatting toevoegen.", "Gen 17:12": "Een zoontje van acht dagen zal bij u besneden worden, alles wat mannelijk is in uw geslachten: degene die in het huis geboren is, en degene die met geld gekocht is van elke vreemdeling die niet van uw nageslacht is;", "Num 3:1": "Dit nu zijn de geboorten van Aäron en Mozes; ten dage dat de HEERE met Mozes gesproken heeft op de berg Sinaï.", "Deut 5:26": "Want wie is er van alle vlees, die de stem van de levende God, sprekend uit het midden van het vuur, gehoord heeft zoals wij, en is levend gebleven?", "Richt 21:18": "Maar wij zullen hun geen vrouwen van onze dochters kunnen geven; want de kinderen van Israël hebben gezworen: Vervloekt is hij die aan de Benjaminieten een vrouw geeft!", "Ex 13:12-16": "dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn. Maar alles wat de baarmoeder van de ezelin opent, moet u vrijkopen met een lam; en als u het niet vrijkoopt, moet u het de nek breken; maar alle eerstgeborenen van de mens onder uw zonen moet u vrijkopen. Wanneer het zal gebeuren dat uw zoon u later zal vragen en zegt: Wat is dat, dan moet u tegen hem zeggen: De HEERE heeft ons door een sterke hand uit Egypte, uit het diensthuis, uitgevoerd.", "Ex 13:12": "dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "Deut 14:26": "En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.", "Deut 26:1-4": "Verder zal het gebeuren, wanneer u gekomen bent in het land dat de HEERE, uw God, u als erfelijk bezit geven zal, en u dat erfelijk bezit en daarin woont; dan zult u van de eerstelingen van alle vrucht van het land nemen, die u opbrengt van uw land dat de HEERE, uw God, u geeft, en zult ze in een korf leggen; en u zult gaan naar de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; en u zult komen bij de priester die er in die dagen zal zijn, en tegen hem zeggen: Ik verklaar heden voor de HEERE, uw God, dat ik gekomen ben in het land dat de HEERE onze vaderen gezworen heeft ons te zullen geven.", "Hand 7:38": "Dit is degene die in de samenkomst van het volk in de woestijn was, samen met de engel die tot hem sprak op de berg Sinaï, en met onze vaders; die de levende woorden ontving, om ons die te geven,", "Lev 22:11": "Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten.", "Joz 6:17-19": "Doch deze stad zal de HEERE verbannen zijn, zij en al wat daarin is; alleen zal de hoer Rachab levend blijven, zij en allen die met haar in het huis zijn, omdat zij de boden, die wij uitgezonden hadden, verborgen heeft. Alleen dat u zich wacht voor het verbannene, opdat u zich niet misschien verbant, door van het verbannene te nemen, en het leger van Israël niet tot een ban stelt, noch dat verstoort. Maar al het zilver en goud, en de koperen en ijzeren voorwerpen, zullen de HEERE heilig zijn; naar de schat van de HEERE zullen zij komen.", "Spr 7:20": "Hij heeft een bundel van het geld in zijn hand genomen; op de vastgestelde dag zal hij naar zijn huis komen.", "Lev 27:1-13": "Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer iemand een gelofte gedaan heeft om iemand af te zonderen, zullen de zielen naar uw schatting van de HEERE zijn. Als uw schatting van een man geldt, van twintig jaar oud tot iemand die zestig jaar oud is, dan zal uw schatting vijftig sikkel zilver zijn, naar de sikkel van het heiligdom.", "1 Sam 1:28": "Daarom heb ik hem ook aan de HEERE overgegeven al de dagen die hij leven zal; hij is aan de HEERE gegeven. En hij aanbad daar de HEERE.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "Num 36:4": "Wanneer ook de kinderen van Israël een jubeljaar zullen hebben, dan zou hun erfenis toegevoegd worden aan de erfenis van die stam waaraan zij zouden komen; zo zou hun erfenis van de erfenis van de stam van onze vaderen afgetrokken worden.", "Neh 5:11": "Geeft hun toch, nog vandaag, hun akkers, hun wijngaarden, hun olijfgaarden en hun huizen terug; en het honderdste deel van het geld en van het koren, de most en de olie, die u van hen gevorderd hebt.", "Deut 26:12-15": "Wanneer u klaar bent met het vertienen van alle tienden van uw inkomen, in het derde jaar, het jaar van de tienden; dan zult u aan de Leviet, aan de vreemdeling, aan de wees en aan de weduwe geven, opdat zij in uw poorten eten en verzadigd worden. En u zult voor het aangezicht van de HEERE, uw God, zeggen: Ik heb het heilige uit het huis weggenomen, en heb het ook aan de Leviet en aan de vreemdeling, aan de wees en aan de weduwe gegeven, naar al Uw geboden die U mij geboden hebt; ik heb niets van Uw geboden overtreden, en niets vergeten. Ik heb daarvan niets gegeten in mijn rouw, en heb daarvan niets weggenomen tot iets onreins, en daarvan ook niets gegeven voor een dode; ik ben de stem van de HEERE, mijn God, gehoorzaam geweest, ik heb gedaan naar alles wat U mij geboden hebt.", "Lev 27:1-8": "Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer iemand een gelofte gedaan heeft om iemand af te zonderen, zullen de zielen naar uw schatting van de HEERE zijn. Als uw schatting van een man geldt, van twintig jaar oud tot iemand die zestig jaar oud is, dan zal uw schatting vijftig sikkel zilver zijn, naar de sikkel van het heiligdom.", "Ezech 45:11-14": "Een efa en een bath zullen van dezelfde maat zijn, zodat een bath het tiende deel van een homer bevat; ook een efa het tiende deel van een homer; de maat daarvan zal zijn naar de homer. En de sikkel zal zijn van twintig gera; twintig sikkels, vijfentwintig sikkels en vijftien sikkels, zal u een pond zijn. Dit is het hefoffer dat u brengen zult: het zesde deel van een efa van een homer tarwe; ook zult u het zesde deel van een efa geven van een homer gerst.", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "Lev 27:16-25": "Als ook iemand van de akker van zijn eigendom iets aan de HEERE heiligt, dan zal uw schatting zijn naar het zaad ervan; een homer gerstezaad zal geschat worden op vijftig sikkel zilver. Als hij zijn akker vanaf het jubeljaar geheiligd heeft, dan zal het naar uw schatting blijven staan. Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.", "Ezech 45:12": "En de sikkel zal zijn van twintig gera; twintig sikkels, vijfentwintig sikkels en vijftien sikkels, zal u een pond zijn.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "Job 31:39": "Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen;", "Hand 4:34-37": "Want er was ook niemand onder hen die gebrek had; want allen die bezitters waren van landen of huizen, verkochten die, en brachten de prijs van het verkochte, En legden die aan de voeten van de apostelen; en aan ieder werd uitgedeeld naar dat hij nodig had. En Joses, door de apostelen bijgenaamd Barnabas (dat is vertaald: een zoon van vertroosting), een Leviet, van geboorte uit Cyprus,", "Ex 22:30": "Hetzelfde moet u doen met uw runderen en met uw schapen; zeven dagen moeten ze bij hun moeder blijven, op de achtste dag moet u ze aan Mij geven.", "Num 3:48-51": "En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten. Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten. Van de eerstgeborenen van de kinderen van Israël nam hij dat geld, duizend driehonderdvijfenzestig sikkels, naar de sikkel van het heiligdom.", "Deut 21:14": "En het zal gebeuren, als u geen behagen meer in haar hebt, dat u haar zult laten gaan waarheen zij wil; maar u zult haar beslist niet voor geld verkopen, u zult geen handel met haar drijven, omdat u haar vernederd hebt.", "Neh 5:10": "Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Lev 27:14-23": "En wanneer iemand zijn huis geheiligd heeft, zodat het de HEERE heilig is, dan zal de priester dat schatten, naardat het goed of slecht is; zoals de priester het geschat heeft, zo zal het blijven staan. En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn. Als ook iemand van de akker van zijn eigendom iets aan de HEERE heiligt, dan zal uw schatting zijn naar het zaad ervan; een homer gerstezaad zal geschat worden op vijftig sikkel zilver.", "Jer 33:13": "In de steden van het gebergte, in de steden van de laagte, en in de steden van het zuiden, en in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, zullen de kudden weer onder de handen van hem die ze telt, doorgaan, zegt de HEERE.", "Gen 23:9": "Dat hij mij de spelonk van Machpela geeft, die hij heeft, die aan het eind van zijn akker is; dat hij die mij voor het volle geld geeft, tot een eigen graf in het midden van u.", "2 Kon 22:9": "Daarna kwam Safan, de schrijver, bij de koning, en bracht de koning verslag terug, en hij zei: Uw dienaren hebben het geld dat in het huis gevonden was bij elkaar gebracht, en hebben het gegeven in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE.", "Ruth 4:3-10": "Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht. En ik heb gezegd: Ik zal het voor uw oor bekendmaken en zeggen: Koop het in tegenwoordigheid van de inwoners en in tegenwoordigheid van de oudsten van mijn volk; als u het zult lossen, los het; en als men het niet zou lossen, verklaar het mij, zodat ik het weet; want er is niemand behalve u die het kan lossen, en ik na u. Toen zei hij: Ik zal het lossen. Maar Boaz zei: Op de dag dat u het land aanvaardt van de hand van Naomi, zult u het ook aanvaarden van Ruth, de Moabitische, de vrouw van de gestorvene, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel.", "Gen 17:13": "Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.", "Ex 21:11": "En als hij haar deze drie dingen niet doet, zal zij om niet uitgaan, zonder geld.", "Hebr 12:18-25": "Want u bent niet gekomen tot de tastbare berg, en het brandende vuur, en donkerheid, en duisternis, en onweer, En tot het geschal van de bazuin, en de stem van de woorden; waarbij zij die het hoorden, baden dat het woord tot hen niet meer gesproken zou worden. (Want zij konden niet dragen wat er geboden werd: Zelfs als een dier de berg aanraakt, zal het gestenigd of met een pijl doorschoten worden.", "Mark 14:11": "En zij, die dit hoorden, waren verblijd, en beloofden hem geld te geven; en hij zocht hoe hij Hem op een geschikt moment kon overleveren.", "Num 18:14": "Al het verbannene in Israël zal het uwe zijn.", "Deut 4:45": "Dit zijn de getuigenissen, en de inzettingen, en de rechten, die Mozes sprak tot de kinderen van Israël, toen zij uit Egypte waren uitgetrokken;", "Matt 26:15": "en zei: Wat wilt u mij geven, en ik zal Hem aan u overleveren? En zij hebben hem dertig zilveren munten toegezegd.", "Zach 11:12": "Want ik had tegen hen gezegd: Als het goed is in uw ogen, breng mijn loon, en zo niet, laat het na. En zij hebben mijn loon gewogen, dertig zilverlingen.", "Luk 9:3": "En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Luk 19:23": "Waarom hebt u dan mijn geld niet bij de bank gebracht, zodat ik het bij mijn komst met rente had kunnen opeisen?", "Ezra 10:8": "En ieder die niet binnen drie dagen kwam, naar de raad van de vorsten en de oudsten, al zijn bezit zou verbeurd worden; en hijzelf zou afgezonderd worden van de gemeente van de weggevoerden.", "Ex 32:15": "En Mozes keerde zich om, en klom van de berg af, met de twee tafelen van de getuigenis in zijn hand; deze tafelen waren aan beide kanten beschreven, aan de ene en aan de andere kant beschreven.", "Hand 7:30": "En toen er veertig jaar verstreken waren, verscheen hem in de woestijn van de berg Sinaï een engel van de Heere, in een vlam van vuur uit een doornstruik.", "Lev 25:37": "Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.", "Num 18:21-24": "En zie, aan de kinderen van Levi heb Ik alle tienden in Israël tot erfenis gegeven, voor hun dienst die zij bedienen, de dienst van de tent der samenkomst. En de kinderen van Israël zullen niet meer tot de tent der samenkomst naderen, om zonde te dragen en te sterven. Maar de Levieten, die zullen de dienst van de tent der samenkomst bedienen, en die zullen hun ongerechtigheid dragen; het zal een eeuwige inzetting zijn voor uw geslachten; en te midden van de kinderen van Israël zullen zij geen erfenis erven.", "1 Sam 15:18": "En de HEERE heeft u op weg gezonden, en gezegd: Ga heen en verban de zondaars, de Amalekieten, en strijd tegen hen, totdat u hen vernietigt.", "Ex 13:13": "Maar alles wat de baarmoeder van de ezelin opent, moet u vrijkopen met een lam; en als u het niet vrijkoopt, moet u het de nek breken; maar alle eerstgeborenen van de mens onder uw zonen moet u vrijkopen.", "Ex 21:34": "dan zal de eigenaar van de kuil het vergoeden; hij zal aan de eigenaar van het dier het geld teruggeven; maar het dode dier zal hem toebehoren.", "Ex 35:4-29": "Verder sprak Mozes tot de hele vergadering van de kinderen van Israël en zei: Dit is het woord, dat de HEERE geboden heeft: Neemt van hetgeen dat u hebt, een hefoffer voor de HEERE; ieder wiens hart vrijwillig is, zal het brengen als hefoffer voor de HEERE: goud, en zilver, en koper; Als ook hemelsblauw, en purper, en scharlaken, en fijn linnen, en geitenhaar;", "Ex 13:2": "Heilig voor Mij alle eerstgeborenen; wat er ook onder de kinderen van Israël de baarmoeder opent, van mensen en van dieren, dat is Mijn eigendom.", "Deut 12:6": "En daarheen zult u brengen uw brandoffers, en uw slachtoffers, en uw tienden, en het hefoffer van uw hand, en uw geloften, en uw vrijwillige offers, en de eerstgeboorte van uw runderen en van uw schapen.", "Richt 11:39": "En het gebeurde, aan het einde van twee maanden, dat zij naar haar vader terugkwam, die met haar deed naar zijn gelofte die hij beloofd had; en zij had geen man bekend. Verder werd het een gewoonte in Israël,", "Ezech 44:29": "Het spijsoffer, en het zondoffer, en het schuldoffer, die zullen zij eten; ook zal al het verbannene  in Israël het hunne zijn.", "Gen 20:16": "En tegen Sara zei hij: Zie, ik heb uw broeder duizend zilverlingen gegeven; zie, dat moet voor u een bedekking van de ogen zijn, voor allen die bij u zijn, ja, tegenover allen, en wees terechtgewezen.", "Lev 25:15": "Naar het getal van de jaren, vanaf het jubeljaar, zult u van uw naaste kopen, en naar het getal van de jaren van de opbrengsten zal hij het aan u verkopen.", "Richt 17:4": "Maar hij gaf dat geld aan zijn moeder terug. En zijn moeder nam tweehonderd zilverlingen, en gaf ze aan de goudsmid, die maakte daarvan een gesneden beeld en een gegoten beeld; dat was in het huis van Micha.", "Matt 27:9": "Toen is vervuld wat gesproken is door de profeet Jeremia, die zei: En zij hebben de dertig zilverstukken genomen, de prijs van Hem Die gewaardeerd was, op wie de kinderen van Israël een waarde gesteld hadden;", "Deut 14:25": "Zo maak het tot geld, en bind het geld in uw hand, en ga naar de plaats die de HEERE, uw God, zal uitkiezen;", "Gen 44:1-8": "En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak; En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had. 's Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.", "Lev 25:8-55": "U zult u ook zeven jaarweken tellen, zevenmaal zeven jaar; zodat de dagen van de zeven jaarweken u negenenveertig jaar zullen zijn. Daarna zult u in de zevende maand, op de tiende van de maand, de bazuin van het geschal laten doorgaan; op de verzoendag zult u de bazuin laten doorgaan in uw hele land. En u zult dat vijftigste jaar heiligen, en vrijheid uitroepen in het land, voor al zijn inwoners; het zal u een jubeljaar zijn; en u zult terugkeren, ieder tot zijn bezittingen, en u zult terugkeren, ieder tot zijn geslacht.", "Ex 34:2-4": "En wees bereid tegen de morgen; dat u in de morgen op de berg Sinaï klimt, en u daar voor Mij stelt, op de top van de berg. En niemand zal met u opklimmen; dat er ook niemand gezien wordt op de hele berg; ook het kleine vee, noch de runderen zullen tegenover deze berg niet weiden. Toen hieuw hij twee stenen tafelen, gelijk de eerste; en Mozes stond 's morgens vroeg op, en klom op de berg Sinaï, zoals de HEERE hem geboden had; en hij nam de twee stenen tafelen in zijn hand.", "Deut 33:2": "Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen.", "Ex 34:20": "Doch de ezel, die de baarmoeder opent, zult u met een stuk klein vee lossen; maar als u hem niet zult lossen, zo zult u hem de nek breken. Al de eerstgeborenen van uw zonen zult u lossen, en men zal voor Mijn aangezicht niet met lege handen verschijnen.", "Deut 29:1": "Dit zijn de woorden van het verbond, dat de HEERE Mozes geboden heeft te maken met de kinderen van Israël, in het land van Moab, naast het verbond, dat Hij met hen gemaakt had aan Horeb.", "Luk 19:15": "En het gebeurde, toen hij terugkwam nadat hij het koninkrijk ontvangen had, dat hij zei dat die dienstknechten aan wie hij het geld gegeven had bij hem geroepen moesten worden, opdat hij zou weten wat ieder met handel verdiend had.", "Ex 30:16": "U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.", "Deut 4:15": "Let dan goed op uzelf; want u hebt geen gelijkenis gezien, op de dag dat de HEERE op Horeb uit het midden van het vuur tot u sprak;", "2 Kon 12:18": "Maar Joas, de koning van Juda, nam al de geheiligde dingen die Josafat, en Joram, en Ahazia, zijn vaderen, de koningen van Juda, geheiligd hadden, en zijn eigen geheiligde dingen, en al het goud dat gevonden werd in de schatten van het huis van de HEERE en van het huis van de koning, en zond het aan Hazaël, de koning van Syrië; toen trok hij weg van Jeruzalem.", "Num 11:32": "Toen maakte het volk zich op, die hele dag, en die hele nacht, en de hele volgende dag, en verzamelde de kwakkels; wie het minst had, had tien homers verzameld; en zij spreidden ze voor zichzelf uit rondom het leger.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "Gen 43:12-23": "En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing. Neem ook uw broer mee, en maak u op, ga terug naar die man. En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Joz 7:11-13": "Israël heeft gezondigd; en zij hebben ook Mijn verbond, dat Ik hun geboden had, overtreden; en ook hebben zij van het verbannene genomen, en ook gestolen, en ook gelogen, en hebben het ook onder hun eigen spullen gelegd. Daarom zullen de kinderen van Israël niet kunnen standhouden voor het aangezicht van hun vijanden; zij zullen de rug keren voor het aangezicht van hun vijanden; want zij zijn in de ban. Ik zal voortaan niet meer met u zijn, tenzij u de ban uit uw midden verdelgt. Sta op, heilig het volk, en zeg: Heilig uzelf tegen morgen; want zo zegt de HEERE, de God van Israël: Er is een ban in uw midden, Israël! U zult niet kunnen standhouden voor het aangezicht van uw vijanden, totdat u de ban uit uw midden wegdoet.", "Num 5:10": "En ieders geheiligde dingen zullen van hem zijn; wat iemand de priester zal gegeven hebben, zal van hem zijn.", "Lev 25:10": "En u zult dat vijftigste jaar heiligen, en vrijheid uitroepen in het land, voor al zijn inwoners; het zal u een jubeljaar zijn; en u zult terugkeren, ieder tot zijn bezittingen, en u zult terugkeren, ieder tot zijn geslacht.", "Gal 4:24": "dit zijn dingen die een andere betekenis hebben; want dit zijn de twee verbonden: het ene, van de berg Sinaï, dat kinderen baart tot dienstbaarheid, dat is Hagar;", "Jer 32:9": "Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels.", "Richt 11:30": "En Jeftha beloofde de HEERE een gelofte, en zei: Als U de kinderen van Ammon werkelijk in mijn hand geeft,", "Ezech 20:37": "En Ik zal u onder de roede laten doorgaan, en Ik zal u brengen onder de band van het verbond.", "Lev 25:13": "In dat jubeljaar zult u ieder terugkeren tot zijn bezitting.", "Lev 7:16": "En als het slachtoffer van zijn offergave een gelofte of vrijwillig offer is, zal dat gegeten worden op de dag dat hij zijn offer offert, en wat ervan overblijft zal ook de volgende dag gegeten worden.", "Deut 12:7": "En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "Ex 22:29": "Met het brengen van de opbrengst van uw oogst en van uw perskuip mag u niet talmen; de eerstgeborene van uw zonen moet u aan Mij geven.", "Richt 21:5": "En de kinderen van Israël zeiden: Wie is er, van al de stammen van Israël, die niet is opgekomen in de vergadering tot de HEERE? Want er was een grote eed gezworen aangaande hem die niet opkwam tot de HEERE te Mizpa: Hij zal zeker gedood worden.", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Num 8:17": "Want elke eerstgeborene onder de kinderen van Israël is van Mij, onder de mensen en onder de dieren; op de dag dat Ik elke eerstgeborene in Egypteland sloeg, heb Ik ze voor Mij geheiligd.", "Ex 40:9-15": "Dan zult u de zalfolie nemen en de tabernakel zalven, en alles wat daarin is; en u zult dezelf heiligen, met al zijn gereedschap, en het zal heilig zijn. U zult ook het altaar van het brandoffer zalven, en al zijn gereedschap; en u zult het altaar heiligen, en het altaar zal allerheiligst zijn. Dan zult u het wasvat zalven, en zijn voetstuk; en u zult het heiligen.", "Hand 23:12-14": "En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben. En het waren er meer dan veertig die deze eed samen hadden afgelegd. Zij gingen naar de overpriesters en de oudsten en zeiden: Wij hebben onszelf met een vervloeking vervloekt om niets te nuttigen totdat wij Paulus gedood zullen hebben.", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "Pred 7:12": "Want de wijsheid is tot een schaduw, en het geld is tot een schaduw; maar de uitnemendheid van de wetenschap is, dat de wijsheid haar bezitters het leven geeft.", "Lev 25:28": "Maar als zijn hand niet gevonden heeft wat genoeg is, om aan hem terug uit te keren, dan zal zijn verkochte goed blijven in de hand van diegene die het gekocht heeft, tot het jubeljaar toe; maar in het jubeljaar zal het uitgaan, en hij zal terugkeren tot zijn bezitting.", "Ezech 46:18": "En de vorst zal niets nemen van de erfenis van het volk, door hen van hun bezitting te beroven; van zijn eigen bezitting zal hij zijn zonen erfenis nalaten; opdat niet Mijn volk, ieder uit zijn bezitting, verstrooid wordt.", "Jer 32:7-16": "Zie, Hanameel, de zoon van Sallum, uw oom, zal naar u toe komen en zeggen: Koop voor uzelf mijn veld dat bij Anathoth is, want u hebt het recht van lossing, om het te kopen. Zo kwam Hanameel, de zoon van mijn oom, naar het woord van de HEERE, tot mij, in het voorhof van de bewaking, en zei tegen mij: Koop toch mijn veld, dat bij Anathoth is, dat in het land van Benjamin is; want u hebt het erfrecht, en u hebt de lossing, koop het voor uzelf. Toen merkte ik dat het woord van de HEERE was. Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels.", "Deut 23:21-23": "Wanneer u de HEERE, uw God, een gelofte beloofd hebt, zult u niet talmen die te betalen; want de HEERE, uw God, zal die zeker van u eisen, en er zou zonde in u zijn. Maar als u nalaat te beloven, zal het geen zonde in u zijn. Wat uit uw lippen komt, zult u houden en doen; zoals u de HEERE, uw God, een vrijwillig offer beloofd hebt, dat u met uw mond gesproken hebt.", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "Deut 15:19": "Al het eerstgeborene, dat onder uw runderen en onder uw schapen geboren zal worden, als het een mannetje is, zult u aan de HEERE, uw God, heiligen; u zult niet werken met de eerstgeborene van uw os, en de eerstgeborene van uw schapen niet scheren.", "2 Kon 5:26": "Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?", "Ezra 3:7": "Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.", "Lev 12:8": "Maar als haar hand niet genoeg vindt voor een lam, zal zij twee tortelduiven of twee jonge duiven nemen, één als brandoffer en één als zondoffer; en de priester zal voor haar verzoening doen; zo zal zij rein zijn.", "Lev 25:29-31": "Evenzo, wanneer iemand een woonhuis in een ommuurde stad verkocht zal hebben, dan zal zijn lossing gelden, totdat het jaar van zijn verkoop volledig zal zijn; binnen een vol jaar zal zijn lossing gelden. Maar als het niet gelost wordt, voordat het volledige jaar voor hem zal vervuld zijn, dan zal dat huis, dat in die stad is, die een muur heeft, voor altijd blijven aan hem die het gekocht heeft, onder zijn geslachten; het zal in het jubeljaar niet uitgaan. Maar de huizen van de dorpen, die rondom geen muur hebben, zullen gerekend worden als het veld van het land; daarvoor zal lossing gelden, en zij zullen in het jubeljaar uitgaan.", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "2 Kon 7:1": "Toen zei Elisa: Hoor het woord van de HEERE; zo zegt de HEERE: Morgen omtrent deze tijd zal een maat meelbloem verkocht worden voor een sikkel, en twee maten gerst voor een sikkel, in de poort van Samaria.", "Ex 34:19": "Al wat de baarmoeder opent, is Mijn; ja, al uw vee, dat mannelijk zal geboren worden, wat de baarmoeder opent van het grote en kleine vee.", "Matt 15:5": "Maar u zegt: Wie tegen vader of moeder zal zeggen: Het is een gave, wat u ook van mij zou kunnen ten nutte komen; en zijn vader of zijn moeder geenszins zal eren, die voldoet.", "Ex 32:16": "En diezelfde tafelen waren het werk van God; het schrift was ook het schrift van God zelf, in de tafelen gegraveerd.", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "1 Kon 21:15": "Het gebeurde nu, toen Izebel hoorde dat Naboth gestenigd en dood was, dat Izebel tegen Achab zei: Sta op, neem de wijngaard van Naboth, de Jizreëliet, in bezit, die hij u weigerde voor geld te geven; want Naboth leeft niet meer, maar is dood.", "Ps 101:2-7": "Ik zal verstandig handelen op de oprechte weg; wanneer zult U tot mij komen? Ik zal in het midden van mijn huis wandelen, in oprechtheid van mijn hart. Ik zal geen slechte zaak voor mijn ogen stellen; ik haat het doen van de afvalligen, het zal mij niet aankleven. Het verkeerde hart zal van mij wijken; de boze zal ik niet kennen.", "Lev 26:46": "Dit zijn de inzettingen, en de rechten, en de wetten, die de HEERE gegeven heeft, tussen Zich en de kinderen van Israël, op de berg Sinaï, door de hand van Mozes.", "Mark 14:7": "Want de armen hebt u altijd bij u, en wanneer u wilt, kunt u hun goeddoen; maar Mij hebt u niet altijd.", "Luk 22:5": "En zij waren blij, en zijn het eens geworden dat zij hem geld zouden geven.", "Deut 15:19-23": "Al het eerstgeborene, dat onder uw runderen en onder uw schapen geboren zal worden, als het een mannetje is, zult u aan de HEERE, uw God, heiligen; u zult niet werken met de eerstgeborene van uw os, en de eerstgeborene van uw schapen niet scheren. Voor het aangezicht van de HEERE, uw God, zult u ze jaar op jaar eten in de plaats die de HEERE zal uitkiezen, u en uw huis. Maar als er enig gebrek aan is, hetzij mank of blind, of enig ander ernstig gebrek, dan zult u het aan de HEERE, uw God, niet offeren;", "1 Sam 15:3": "Ga nu heen, en sla Amalek, en verban alles wat hij heeft, en verschoon hem niet; maar dood van de man af tot de vrouw toe, van de kinderen tot de zuigelingen, van de ossen tot de schapen, van de kamelen tot de ezels toe.", "Neh 5:4": "Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.", "Pred 5:3": "Wanneer u een gelofte aan God zult hebben beloofd, stel het niet uit om die te betalen; want Hij heeft geen behagen in dwazen; wat u zult hebben beloofd, betaal het.", "Deut 7:1": "Wanneer de HEERE, uw God, u gebracht zal hebben in het land waar u naar toe gaat om het te erven, en Hij vele volken voor uw aangezicht zal hebben uitgeworpen, de Hethieten, en de Girgasieten, en de Amorieten, en de Kanaänieten, en de Ferezieten, en de Hevieten, en de Jebusieten, zeven volken, die groter en machtiger zijn dan u,", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "2 Kon 23:35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "Gen 28:20-22": "En Jakob deed een gelofte, en zei: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op deze weg die ik reis, en mij brood gegeven zal hebben om te eten, en kleren om aan te trekken; en ik in vrede naar het huis van mijn vader terugkeer, dan zal de HEERE mij tot een God zijn! En deze steen, die ik als opgericht teken gezet heb, zal een huis van God zijn; en van alles wat U mij geven zult, zal ik U zeker de tienden geven!", "2 Kon 15:20": "Menahem nu bracht dit geld op van Israël, van alle vermogende mannen, om aan de koning van Assyrië te geven, voor elke man vijftig zilveren sikkels; zo keerde de koning van Assyrië terug, en bleef daar niet in het land.", "Deut 23:19": "U zult uw broeder geen rente laten betalen, rente van geld, rente van voedsel, rente van enig ding waarover men rente vraagt.", "Lev 14:22": "alsook twee tortelduiven, of twee jonge duiven, die zijn hand bereiken kan, waarvan de ene als zondoffer, en de andere als brandoffer zal zijn.", "Deut 25:19": "Het zal dan gebeuren, als de HEERE, uw God, u rust gegeven heeft van al uw vijanden rondom, in het land dat de HEERE, uw God, u als erfdeel geven zal om het te bezitten, dat u de gedachtenis aan Amalek van onder de hemel zult uitwissen; vergeet het niet!", "Joz 7:1": "Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "2 Kron 34:9": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.", "Ex 19:14": "Toen ging Mozes van de berg af naar het volk, en hij heiligde het volk; en zij wasten hun kleren.", "Num 8:18": "En Ik heb de Levieten genomen in plaats van alle eerstgeborenen onder de kinderen van Israël.", "Num 6:2": "Spreek tot de kinderen van Israël, en zeg tot hen: Wanneer een man of een vrouw zich afgescheiden zal hebben, door de gelofte van een Nazireeër te beloven, om zich voor de HEERE af te zonderen;", "1 Sam 14:38-45": "Toen zei Saul: Kom hierheen, alle hoofden van het volk, en onderzoek en kijk waarin deze zonde vandaag gebeurd is. Want zo waarachtig als de HEERE leeft, Die Israël verlost: al was het bij mijn zoon Jonathan, dan zal hij zeker sterven; en niemand uit heel het volk antwoordde hem. Verder zei hij tegen heel Israël: U zult aan de ene kant staan, en ik en mijn zoon Jonathan zullen aan de andere kant staan. Toen zei het volk tegen Saul: Doe wat goed is in uw ogen.", "Lev 5:7": "Maar als zijn hand niet zoveel bereiken kan als genoeg is voor een stuk kleinvee, dan zal hij als zijn offer voor de schuld die hij gezondigd heeft, aan de HEERE brengen twee tortelduiven of twee jonge duiven, een als zondoffer en een als brandoffer.", "Gen 47:14-18": "Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao. Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op. En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.", "1 Kon 21:2": "Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven.", "Lev 7:38": "die de HEERE Mozes geboden heeft op de berg Sinaï, op de dag dat Hij de kinderen van Israël gebood hun offergaven aan de HEERE te offeren, in de woestijn van Sinaï.", "Lev 27:11-13": "En als het enig onrein dier is, waarvan men de HEERE geen offergave brengt, dan zal hij dat dier voor het aangezicht van de priester stellen. En de priester zal het schatten, naardat het goed of slecht is; naar uw schatting, priester, zo zal het zijn. Maar als hij het echt wil afkopen, dan zal hij een vijfde deel boven uw schatting toevoegen.", "1 Kor 16:22": "Als iemand de Heere Jezus Christus niet liefheeft, laat die een vervloeking zijn; Maran-atha!", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Lev 6:6": "En hij zal de HEERE zijn schuldoffer brengen naar de priester, een volkomen ram uit de kudde, met uw schatting, tot een schuldoffer.", "1 Sam 15:33": "Maar Samuël zei: Zoals uw zwaard vrouwen van hun kinderen beroofd heeft, zo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht van de HEERE te Gilgal.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "2 Kron 34:17": "En zij hebben het geld dat in het huis van de HEERE gevonden is, samengevoegd, en hebben het gegeven in de hand van de opzichters, en in de hand van hen die het werk verrichtten.", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "Matt 28:15": "En zij namen het geld, en deden zoals hun geleerd was. En dit verhaal is onder de Joden verspreid geraakt tot op deze huidige dag.", "Num 18:17": "Maar het eerstgeborene van een koe, of het eerstgeborene van een schaap, of het eerstgeborene van een geit zult u niet lossen, zij zijn heilig; hun bloed zult u sprenkelen op het altaar, en hun vet zult u aansteken, tot een vuuroffer van liefelijke reuk voor de HEERE.", "Num 3:13": "Want elke eerstgeborene is van Mij; van de dag dat Ik alle eerstgeborenen in Egypteland sloeg, heb Ik Mij geheiligd alle eerstgeborenen in Israël, van de mensen tot de dieren; zij zullen van Mij zijn; Ik ben de HEERE!", "Lev 27:26-33": "Maar het eerstgeborene, dat de HEERE als eerstgeborene van een dier toebehoort, dat zal niemand heiligen; hetzij een rund, of een schaap of geit, het is van de HEERE. Maar is het van een onrein dier, dan zal hij dat afkopen naar uw schatting, en zal er zijn vijfde deel daarboven aan toevoegen; en als het niet afgekocht wordt, dan zal het verkocht worden, naar uw schatting. Toch, niets wat verboden is, dat iemand aan de HEERE verboden heeft, van alles wat hij heeft, van een mens, of van een dier, of van de akker van zijn eigendom, zal verkocht of afgekocht worden; alles wat verboden is, zal voor de HEERE allerheiligst zijn.", "Ex 22:7": "Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven.", "Ex 30:13": "Dit moeten zij geven, ieder die overgaat tot de getelden: de helft van een sikkel, naar de sikkel van het heiligdom (deze sikkel is twintig gera); de helft van een sikkel is een hefoffer voor de HEERE.", "Ps 23:4": "Al ging ik ook in een dal van de schaduw van de dood, ik zou geen kwaad vrezen, want U bent met mij; Uw stok en Uw staf, die troosten mij.", "1 Sam 14:24-28": "En de mannen van Israël werden uitgeput op die dag, want Saul had het volk bezworen en gezegd: Vervloekt is de man die voedsel eet vóór de avond, totdat ik mij op mijn vijanden gewroken heb! Daarom proefde heel het volk geen voedsel. En heel het volk kwam in een bos; en daar was honig op het veld. Toen het volk het bos in kwam, zie, er was een stroom honig; maar niemand raakte met zijn hand zijn mond aan, want het volk was bang voor de eed.", "Num 18:16": "Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.", "Joz 7:25": "En Jozua zei: Hoe hebt u ons in het ongeluk gestort? De HEERE zal u op deze dag in het ongeluk storten! En heel Israël stenigde hem met stenen, en zij verbrandden hen met vuur, en overwierpen hen met stenen.", "Richt 5:19": "De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan.", "Num 3:40-51": "En de HEERE zei tegen Mozes: Tel alle eerstgeborenen, wat mannelijk is onder de kinderen van Israël, van een maand oud en daarboven; en neem het getal van hun namen op. En u zult voor Mij de Levieten nemen (Ik ben de HEERE!), in plaats van alle eerstgeborenen onder de kinderen van Israël, en de dieren van de Levieten, in plaats van alle eerstgeborenen onder de dieren van de kinderen van Israël. Mozes dan telde, zoals de HEERE hem geboden had, alle eerstgeborenen onder de kinderen van Israël.", "Joz 6:26": "En terzelfder tijd bezwoer Jozua hen, en zei: Vervloekt zij die man voor het aangezicht van de HEERE, die zich opmaakt en deze stad Jericho bouwen zal; dat hij haar grondvest op zijn eerstgeboren zoon, en haar poorten stelt op zijn jongste zoon!", "Num 3:40-43": "En de HEERE zei tegen Mozes: Tel alle eerstgeborenen, wat mannelijk is onder de kinderen van Israël, van een maand oud en daarboven; en neem het getal van hun namen op. En u zult voor Mij de Levieten nemen (Ik ben de HEERE!), in plaats van alle eerstgeborenen onder de kinderen van Israël, en de dieren van de Levieten, in plaats van alle eerstgeborenen onder de dieren van de kinderen van Israël. Mozes dan telde, zoals de HEERE hem geboden had, alle eerstgeborenen onder de kinderen van Israël.", "Joh 1:17": "Want de wet is door Mozes gegeven, de genade en de waarheid is door Jezus Christus geworden.", "Ex 22:25": "Als u Mijn volk, dat arm is onder u, geld leent, mag u zich niet als een woekeraar tegenover hen gedragen; u mag geen rente van hen vragen.", "Lev 27:30-33": "Ook alle tienden van het land, van het zaad van het land, van de vrucht van de boom, zijn van de HEERE; zij zijn de HEERE heilig. Maar als iemand van zijn tienden iets echt wil afkopen, zal hij zijn vijfde deel daarboven toevoegen. Wat betreft alle tienden van runderen en klein vee, alles wat onder de herdersstaf doorgaat, het tiende zal de HEERE heilig zijn.", "Neh 9:13": "En U bent neergedaald op de berg Sinaï, en hebt met hen gesproken uit de hemel; en U hebt hun rechtmatige rechten gegeven, en getrouwe wetten, goede inzettingen en geboden.", "Gal 4:25": "want Hagar is de berg Sinaï in Arabië, en komt overeen met het huidige Jeruzalem, dat met haar kinderen in dienstbaarheid is.", "Pred 5:4": "Het is beter dat u niet belooft, dan dat u belooft en niet betaalt.", "Hand 7:16": "En zij werden overgebracht naar Sichem, en gelegd in het graf, dat Abraham gekocht had voor een som geld, van de zonen van Hemor, de vader van Sichem.", "Jes 5:10": "Ja, tien bunders wijngaard zullen maar één bath geven, en een homer zaad zal een efa geven.", "Lev 5:15": "Als een mens door overtreding ontrouw wordt, en door onwetendheid zondigt tegen de heilige dingen van de HEERE, dan zal hij als zijn schuldoffer aan de HEERE brengen een gaaf ram uit de kudde, naar uw schatting aan zilveren sikkels, gerekend naar de sikkel van het heiligdom, als schuldoffer.", "Ps 68:9": "Daverde de aarde, ook dropen de hemelen voor Gods aanschijn; zelfs deze Sinaï, voor het aanschijn van God, de God van Israël.", "Micha 7:14": "Weid Ú dan Uw volk met Uw staf, de kudde van Uw erfenis, die alleen woont, in het woud, midden in een vruchtbaar land; laat ze weiden in Basan en Gilead, als in de dagen van ouds.", "Lev 27:1-34": "Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer iemand een gelofte gedaan heeft om iemand af te zonderen, zullen de zielen naar uw schatting van de HEERE zijn. Als uw schatting van een man geldt, van twintig jaar oud tot iemand die zestig jaar oud is, dan zal uw schatting vijftig sikkel zilver zijn, naar de sikkel van het heiligdom.", "2 Kron 34:14": "En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.", "2 Kron 24:11": "Het gebeurde nu ter tijd, als hij de kist, naar het bevel van de koning, door de hand van de Levieten inbracht, en als zij zagen dat er veel van het geld was, dat de schrijver van de koning kwam, en de gestelde van de hoofdpriester, en de kist leegmaakten, en die opnamen, en die terugbrachten naar haar plaats; zo deden zij van dag tot dag, en verzamelden geld in overvloed;", "Rom 9:3": "Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "Richt 11:31": "dan zal het zo zijn, dat wat uit de deur van mijn huis mij tegemoet komt, wanneer ik in vrede terugkeer van de kinderen van Ammon, dat zal van de HEERE zijn, en ik zal het offeren als brandoffer.", "Zach 11:13": "Doch de HEERE zei tegen mij: Werp ze heen voor de pottenbakker: een heerlijke prijs, die Ik van hen waard geacht ben geweest! En ik nam die dertig zilverlingen, en wierp ze in het huis van de HEERE, voor de pottenbakker.", "Lev 25:1": "Verder sprak de HEERE tot Mozes, bij de berg Sinaï, en zei:", "Hos 3:2": "En ik kocht haar voor mij voor vijftien zilverstukken, en een homer gerst, en een halve homer gerst.", "Gen 17:27": "En alle mannen van zijn huis, degenen die in het huis geboren waren, en degenen die met geld gekocht waren, van de vreemdeling af, werden met hem besneden.", "1 Kon 21:6": "En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven.", "Num 18:21": "En zie, aan de kinderen van Levi heb Ik alle tienden in Israël tot erfenis gegeven, voor hun dienst die zij bedienen, de dienst van de tent der samenkomst.", "Joz 6:17": "Doch deze stad zal de HEERE verbannen zijn, zij en al wat daarin is; alleen zal de hoer Rachab levend blijven, zij en allen die met haar in het huis zijn, omdat zij de boden, die wij uitgezonden hadden, verborgen heeft.", "Lev 27:14-16": "En wanneer iemand zijn huis geheiligd heeft, zodat het de HEERE heilig is, dan zal de priester dat schatten, naardat het goed of slecht is; zoals de priester het geschat heeft, zo zal het blijven staan. En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn. Als ook iemand van de akker van zijn eigendom iets aan de HEERE heiligt, dan zal uw schatting zijn naar het zaad ervan; een homer gerstezaad zal geschat worden op vijftig sikkel zilver.", "2 Kon 12:7-16": "Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Lev 25:31": "Maar de huizen van de dorpen, die rondom geen muur hebben, zullen gerekend worden als het veld van het land; daarvoor zal lossing gelden, en zij zullen in het jubeljaar uitgaan.", "Deut 13:16": "En al haar buit zult u verzamelen midden op haar straat, en de stad en al haar buit geheel met vuur verbranden voor de HEERE, uw God; en zij zal een puinhoop zijn voor eeuwig, zij zal niet opnieuw gebouwd worden.", "Luk 21:1-4": "En toen Hij omhoogkeek, zag Hij de rijken hun gaven in de schatkist werpen. En Hij zag ook een zekere arme weduwe twee kleine penningen daarin werpen. En Hij zei: Waarlijk, Ik zeg u, dat deze arme weduwe meer dan allen heeft ingeworpen.", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Deut 16:16": "Driemaal in het jaar zal alles wat mannelijk onder u is, verschijnen voor het aangezicht van de HEERE, uw God, in de plaats die Hij zal uitkiezen: op het feest van de ongezuurde broden, en op het feest van de weken, en op het feest van de loofhutten; maar men zal niet met lege handen verschijnen voor het aangezicht van de HEERE.", "Neh 10:36": "En de eerstgeborenen van onze zonen en onze dieren, zoals het in de wet geschreven is; en dat wij de eerstgeborenen van onze runderen en onze schapen zouden brengen naar het huis van onze God, tot de priesters, die in het huis van onze God dienen.", "Deut 2:28": "Verkoop mij voedsel voor geld, dat ik eet, en geef mij water voor geld, dat ik drink; laat mij alleen te voet doortrekken;", "Ex 22:20": "Wie aan andere goden offert, behalve aan de HEERE alleen, moet met de ban geslagen worden.", "Deut 14:22": "U zult getrouw vertienen alle opbrengst van uw zaad, dat elk jaar van het veld voortkomt.", "Ps 90:10": "Aangaande de dagen van onze jaren, daarin zijn zeventig jaren, of, als wij zeer sterk zijn, tachtig jaren; en het voortreffelijkste van die is moeite en verdriet; want het wordt snel afgesneden, en wij vliegen daarheen.", "1 Sam 15:18-23": "En de HEERE heeft u op weg gezonden, en gezegd: Ga heen en verban de zondaars, de Amalekieten, en strijd tegen hen, totdat u hen vernietigt. Waarom toch hebt u niet naar de stem van de HEERE gehoord, maar bent u op de buit afgevlogen, en hebt u gedaan wat kwaad was in de ogen van de HEERE? Toen zei Saul tegen Samuël: Ik heb zeker naar de stem van de HEERE gehoord, en ben gegaan op de weg waarop de HEERE mij gezonden heeft; en ik heb Agag, de koning van de Amalekieten, meegebracht, maar de Amalekieten heb ik verbannen.", "Lev 27:17-24": "Als hij zijn akker vanaf het jubeljaar geheiligd heeft, dan zal het naar uw schatting blijven staan. Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden. En als hij die de akker geheiligd heeft, die helemaal wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en dan zal die hem toegewezen zijn.", "Deut 12:17-19": "U zult in uw poorten niet mogen eten de tienden van uw koren, en van uw most, en van uw olie, noch de eerstgeboorte van uw runderen en van uw schapen, noch enige van uw geloften die u zult hebben beloofd, noch uw vrijwillige offers, noch het hefoffer van uw hand. Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt. Wacht u ervoor dat u de Leviet niet verlaat, al uw dagen in uw land.", "Deut 13:15": "dan zult u de inwoners van die stad zeker slaan met de scherpte van het zwaard, haar met de ban slaan, en alles wat daarin is, ook haar beesten, met de scherpte van het zwaard.", "Gen 42:25-35": "En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo. En zij laadden hun koren op hun ezels, en trokken vandaar weg. Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.", "Matt 25:18": "Maar hij die het ene ontvangen had, ging weg en groef in de aarde, en verborg het geld van zijn heer.", "Deut 20:17": "Maar u zult ze helemaal verbannen: de Hethieten, en de Amorieten, en de Kanaänieten, en de Ferezieten, de Hevieten, en de Jebusieten, zoals de HEERE, uw God, u geboden heeft;", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Openb 6:6": "En ik hoorde een stem in het midden van de vier dieren, die zei: Een maatje tarwe voor een penning, en drie maatjes gerst voor een penning; en beschadig de olie en de wijn niet.", "Jer 5:7": "Hoe zou Ik u om deze dingen vergeven? Uw kinderen hebben Mij verlaten, en zweren bij hen die geen God zijn; toen Ik hen verzadigd had, bedreven zij overspel, en verzamelden zich in troepen in het hoerenhuis.", "Gen 2:3": "En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.", "Ex 21:21": "Als hij echter een dag of twee dagen overeind blijft, zal hij niet gewroken worden; want hij is zijn eigen geld waard.", "Matt 27:10": "en zij hebben die gegeven voor de akker van de pottenbakker, zoals de Heere mij bevolen heeft.", "Gen 23:13": "En hij sprak tot Efron, ten aanhoren van het volk van het land, en zei: Trouwens, als u het toch wilt geven, hoor mij dan alstublieft; ik zal het geld van de akker geven; neem het van mij aan, dan zal ik mijn dode daar begraven.", "Deut 2:6": "Voedsel zult u voor geld van hen kopen, dat u eet; en ook zult u water voor geld van hen kopen, dat u drinkt.", "Num 18:14-16": "Al het verbannene in Israël zal het uwe zijn. Alles wat de baarmoeder opent, van alle vlees, dat zij de HEERE zullen brengen, onder de mensen, en onder de dieren, zal het uwe zijn; maar de eerstgeborenen van de mensen zult u helemaal lossen; ook zult u de eerstgeborenen van de onreine dieren lossen. Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.", "Ezech 36:30": "En Ik zal de vrucht van het geboomte en de opbrengst van het veld vermenigvuldigen, opdat u de smaad van het honger niet meer ontvangt onder de heidenen.", "Num 21:3": "De HEERE dan verhoorde de stem van Israël, en gaf de Kanaänieten over; en Israël verbande hen en hun steden; en men noemde de naam van die plaats Horma.", "Matt 28:12": "En zij kwamen samen met de oudsten, en namen samen een besluit, en gaven de soldaten veel geld,", "Ex 12:44": "Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.", "Deut 7:2": "en de HEERE, uw God, hen aan u zal hebben overgegeven, zodat u hen verslaat, dan moet u hen helemaal met de ban vernietigen; u zult geen verbond met hen maken, en hun ook niet genadig zijn.", "Num 21:2": "Toen beloofde Israël de HEERE een gelofte en zei: Als U dit volk geheel in mijn hand geeft, zal ik hun steden verbannen.", "Lev 27:14-33": "En wanneer iemand zijn huis geheiligd heeft, zodat het de HEERE heilig is, dan zal de priester dat schatten, naardat het goed of slecht is; zoals de priester het geschat heeft, zo zal het blijven staan. En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn. Als ook iemand van de akker van zijn eigendom iets aan de HEERE heiligt, dan zal uw schatting zijn naar het zaad ervan; een homer gerstezaad zal geschat worden op vijftig sikkel zilver.", "Lev 25:25": "Wanneer uw broeder verarmd zal zijn, en iets van zijn bezitting verkocht zal hebben, dan zal zijn losser, die hem het naast bestaat, komen, en zal het verkochte van zijn broeder lossen.", "Deut 14:22-29": "U zult getrouw vertienen alle opbrengst van uw zaad, dat elk jaar van het veld voortkomt. En voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen om Zijn Naam daar te doen wonen, zult u eten de tienden van uw koren, van uw most, en van uw olie, en de eerstgeboorte van uw runderen en van uw schapen; opdat u de HEERE, uw God, leert vrezen alle dagen. Wanneer dan de weg voor u te lang zal zijn, zodat u het niet zou kunnen dragen, omdat de plaats te ver van u zal zijn – die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te vestigen – wanneer de HEERE, uw God, u gezegend zal hebben;", "2 Kor 8:12": "Want als de bereidheid van het gemoed er eerst is, dan is iemand aangenaam naar wat hij heeft, niet naar wat hij niet heeft.", "Num 3:47": "U zult voor elk hoofd vijf sikkels nemen; naar de sikkel van het heiligdom zult u ze nemen; die sikkel is twintig gera.", "2 Kron 24:5": "Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet.", "Num 5:9": "Evenzo zal alle heffing van alle geheiligde dingen van de kinderen van Israël, die zij tot de priester brengen, van hem zijn.", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "1 Sam 15:32": "Toen zei Samuël: Breng Agag, de koning van de Amalekieten, hier bij mij. Agag nu ging vol vertrouwen naar hem toe; en Agag zei: Voorwaar, de bitterheid van de dood is geweken!", "Lev 25:25-34": "Wanneer uw broeder verarmd zal zijn, en iets van zijn bezitting verkocht zal hebben, dan zal zijn losser, die hem het naast bestaat, komen, en zal het verkochte van zijn broeder lossen. En wanneer iemand geen losser zal hebben, maar zijn hand het bekomen heeft en hij gevonden zal hebben, zoveel als genoeg is tot zijn lossing; Dan zal hij de jaren van zijn verkoop berekenen, en het overschot zal hij uitkeren aan de man aan wie hij het verkocht had; en hij zal terugkeren tot zijn bezitting.", "Num 18:15-17": "Alles wat de baarmoeder opent, van alle vlees, dat zij de HEERE zullen brengen, onder de mensen, en onder de dieren, zal het uwe zijn; maar de eerstgeborenen van de mensen zult u helemaal lossen; ook zult u de eerstgeborenen van de onreine dieren lossen. Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera. Maar het eerstgeborene van een koe, of het eerstgeborene van een schaap, of het eerstgeborene van een geit zult u niet lossen, zij zijn heilig; hun bloed zult u sprenkelen op het altaar, en hun vet zult u aansteken, tot een vuuroffer van liefelijke reuk voor de HEERE.", "Gen 17:23": "Toen nam Abraham zijn zoon Ismaël, en alle mannen die in zijn huis geboren waren, en alle die met zijn geld gekocht waren, alles wat mannelijk was onder de mensen van het huis van Abraham, en hij besneed het vlees van hun voorhuid, op diezelfde dag, zoals God met hem gesproken had.", "Hand 5:4": "Zolang het bleef, bleef het niet uw eigendom? En verkocht zijnde, was het niet in uw macht? Wat is het, dat u deze daad in uw hart hebt voorgenomen? U hebt niet mensen gelogen, maar God.", "Ps 15:5": "Die zijn geld niet uitleent tegen woeker, en geen geschenk aanneemt tegen de onschuldige. Wie deze dingen doet, zal niet wankelen in eeuwigheid.", "Lev 14:21": "Maar als hij arm is, en zijn hand dat niet bereikt, zal hij een lam als schuldoffer, ter beweging, nemen, om voor hem verzoening te doen; daartoe een tiende meelbloem, met olie gemengd, als spijsoffer, en een log olie;", "Richt 21:11": "Doch dit is de zaak die u doen zult: al wat mannelijk is, en alle vrouwen die gemeenschap met een man gehad hebben, zult u met de ban slaan.", "Lev 25:51": "Als er nog veel van die jaren zijn, zal hij naar verhouding daarvan tot zijn lossing van het geld waarvoor hij gekocht is, teruggeven.", "Ex 21:35": "Wanneer nu iemands os de os van zijn naaste zo kwetst, dat hij sterft, dan zal men de levende os verkopen en het geld daarvan gelijk delen, en het dode dier zal men ook gelijk delen.", "Lev 25:23-33": "Het land ook zal niet voor altijd verkocht worden; want het land is van Mij, omdat u vreemdelingen en bijwoners bij Mij bent. Daarom zult u, in het hele land van uw bezitting, teruggave voor het land toelaten. Wanneer uw broeder verarmd zal zijn, en iets van zijn bezitting verkocht zal hebben, dan zal zijn losser, die hem het naast bestaat, komen, en zal het verkochte van zijn broeder lossen.", "Deut 13:17": "Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;", "Richt 16:18": "Toen Delila nu zag, dat hij haar zijn hele hart bekend had gemaakt, zond zij mensen weg, en riep de vorsten van de Filistijnen, en zei: Komt ditmaal, want hij heeft mij zijn hele hart bekendgemaakt. En de vorsten van de Filistijnen kwamen naar haar toe, en brachten dat geld in hun hand.", "Gen 31:15": "Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.", "2 Kon 22:7": "Doch er werd met hen geen rekening gehouden van het geld dat in hun hand geleverd was, want zij handelden trouw.", "Lev 27:2-13": "Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer iemand een gelofte gedaan heeft om iemand af te zonderen, zullen de zielen naar uw schatting van de HEERE zijn. Als uw schatting van een man geldt, van twintig jaar oud tot iemand die zestig jaar oud is, dan zal uw schatting vijftig sikkel zilver zijn, naar de sikkel van het heiligdom. Maar is het een vrouw, dan zal uw schatting dertig sikkel zijn.", "Ex 19:3-25": "En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen: U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb. Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "Est 4:7": "gaf Mordechai hem te kennen alles wat hem overkomen was, en de opgave van het zilver dat Haman gezegd had te zullen wegen in de schatten van de koning, voor de Joden, om hen om te brengen.", "Deut 20:16": "Maar van de steden van deze volken, die de HEERE, uw God, u als erfdeel geeft, zult u niets laten leven dat adem heeft.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Ex 24:12-18": "Toen zei de HEERE tegen Mozes: Kom tot Mij op de berg, en wees daar; en Ik zal u stenen tafelen geven, en de wet, en de geboden, die Ik geschreven heb, om hen te onderwijzen. Toen maakte Mozes zich op, met Jozua, zijn dienaar; en Mozes klom op de berg van God. En hij zei tegen de oudsten: Blijft u hier voor ons, totdat wij weer tot u komen; en zie, Aäron en Hur zijn bij u; wie een zaak heeft, moet naar hen toe gaan.", "Lev 27:9-13": "En als het een dier is waarvan men de HEERE een offergave brengt: alles wat hij daarvan aan de HEERE geeft, zal heilig zijn. Hij zal het niet ruilen, en het ook niet verwisselen, een goed voor een slecht, of een slecht voor een goed; als hij toch een dier voor een dier op enige manier verwisselt, dan zal dit, en waarvoor het verwisseld is, heilig zijn. En als het enig onrein dier is, waarvan men de HEERE geen offergave brengt, dan zal hij dat dier voor het aangezicht van de priester stellen.", "Lev 25:16": "Naar de veelheid van de jaren zult u zijn koopprijs vermeerderen, en naar de geringheid van de jaren zult u zijn koopprijs verminderen; want hij verkoopt aan u het getal van de opbrengsten.", "Mal 4:4": "Denk aan de wet van Mozes, Mijn knecht, die Ik hem geboden heb op Horeb voor heel Israël, met de inzettingen en rechten.", "Jer 32:10": "En ik ondertekende de brief en verzegelde hem, en liet het door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had.", "Matt 25:27": "Dan had u mijn geld naar de wisselaars moeten brengen, en zou ik bij mijn komst het mijne met rente teruggekregen hebben."}, "noten": {"1": "Een homer is een inhoudsmaat van ongeveer 220 liter."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">Verder</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">sprak</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1
