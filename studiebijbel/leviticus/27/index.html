>."}, "koppeling_kjv": {"1": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,", "2": "<span class=\"wl wl-kjv\" data-code=\"H1696\">Speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, When a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall make a <span class=\"wl wl-kjv\" data-code=\"H6381\">singular</span> <span class=\"wl wl-kjv\" data-code=\"H5088\">vow,</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">persons</span> shall be for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> by thy estimation.", "3": "And thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> shall be of the <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> from <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> even unto <span class=\"wl wl-kjv\" data-code=\"H8346\">sixty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old,</span> even thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> after the <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel</span> of the sanctuary.", "4": "And if it be a <span class=\"wl wl-kjv\" data-code=\"H5347\">female,</span> then thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> shekels.", "5": "And if it be from <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> even unto <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old,</span> then thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> shall be of the <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H5347\">female</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> shekels.", "6": "And if it be from a <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> even unto <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old,</span> then thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> shall be of the <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H5347\">female</span> thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of silver.", "7": "And if it be from <span class=\"wl wl-kjv\" data-code=\"H8346\">sixty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">above;</span> if it be a <span class=\"wl wl-kjv\" data-code=\"H2145\">male,</span> then thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2568\">fifteen</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H5347\">female</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> shekels.", "8": "But if he be <span class=\"wl wl-kjv\" data-code=\"H4134\">poorer</span> than thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation,</span> then he shall <span class=\"wl wl-kjv\" data-code=\"H5975\">present</span> himself <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6186\">value</span> him; according <span class=\"wl wl-kjv\" data-code=\"H6310\">to</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">ability</span> that <span class=\"wl wl-kjv\" data-code=\"H5087\">vowed</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> value", "9": "And if it be a <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> whereof men <span class=\"wl wl-kjv\" data-code=\"H7126\">bring</span> an <span class=\"wl wl-kjv\" data-code=\"H7133\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> all that any man <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> of such unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be holy.", "10": "He shall not <span class=\"wl wl-kjv\" data-code=\"H2498\">alter</span> it, nor <span class=\"wl wl-kjv\" data-code=\"H4171\">change</span> it, a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> for a <span class=\"wl wl-kjv\" data-code=\"H7451\">bad,</span> or a <span class=\"wl wl-kjv\" data-code=\"H7451\">bad</span> for a <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> and if he shall at <span class=\"wl wl-kjv\" data-code=\"H4171\">all</span> <span class=\"wl wl-kjv\" data-code=\"H4171\">change</span> <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> for <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> then it and the <span class=\"wl wl-kjv\" data-code=\"H8545\">exchange</span> thereof shall be holy.", "11": "And if it be any <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> of which they do not <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> a <span class=\"wl wl-kjv\" data-code=\"H7133\">sacrifice</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> then he shall <span class=\"wl wl-kjv\" data-code=\"H5975\">present</span> the <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the priest:", "12": "And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6186\">value</span> it, <span class=\"wl wl-kjv\" data-code=\"H996\">whether</span> it be <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H996\">or</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">bad:</span> as thou <span class=\"wl wl-kjv\" data-code=\"H6187\">valuest</span> it, who art the priest,", "13": "But if he will at <span class=\"wl wl-kjv\" data-code=\"H1350\">all</span> <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it, then he shall <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> a <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> part thereof unto thy estimation.", "14": "And when a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to be <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6186\">estimate</span> it, whether it be <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> or <span class=\"wl wl-kjv\" data-code=\"H7451\">bad:</span> as the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H6186\">estimate</span> it, so shall it stand.", "15": "And if he that <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> it will <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> then he shall <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> part of the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of thy estimation", "16": "And if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> some part of a <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of his <span class=\"wl wl-kjv\" data-code=\"H272\">possession,</span> then thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6310\">according</span> to the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> thereof: an <span class=\"wl wl-kjv\" data-code=\"H2563\">homer</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall be valued at <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of silver.", "17": "If he <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> his <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> from the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile,</span> according to thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> it shall stand.", "18": "But if he <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> his <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile,</span> then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H2803\">reckon</span> unto him the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> according <span class=\"wl wl-kjv\" data-code=\"H6310\">to</span> the <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> that <span class=\"wl wl-kjv\" data-code=\"H3498\">remain,</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of the <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile,</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H1639\">abated</span> from thy estimation.", "19": "And if he that <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> will in any <span class=\"wl wl-kjv\" data-code=\"H1350\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it, then he shall <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> part of the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> unto it, and it shall be assured", "20": "And if he will not <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> or if he have <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> to <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> it shall not be redeemed", "21": "But the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> when it goeth <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> in the <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as a <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> <span class=\"wl wl-kjv\" data-code=\"H2764\">devoted;</span> the <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> thereof shall be the priest's.", "22": "And if a man <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> a <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> which he hath <span class=\"wl wl-kjv\" data-code=\"H4736\">bought,</span> which is not of the <span class=\"wl wl-kjv\" data-code=\"H7704\">fields</span> of his possession;", "23": "Then the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> shall <span class=\"wl wl-kjv\" data-code=\"H2803\">reckon</span> unto him the <span class=\"wl wl-kjv\" data-code=\"H4373\">worth</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation,</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of the <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thine <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> as a holy <span class=\"wl wl-kjv\" data-code=\"H6944\">thing</span> unto the LORD.", "24": "In the <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of the <span class=\"wl wl-kjv\" data-code=\"H3104\">jubile</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto him of whom it was <span class=\"wl wl-kjv\" data-code=\"H7069\">bought,</span> even to him to whom the <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> of the land", "25": "And all thy <span class=\"wl wl-kjv\" data-code=\"H6187\">estimations</span> shall be according to the <span class=\"wl wl-kjv\" data-code=\"H8255\">shekel</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary:</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H1626\">gerahs</span> shall be the shekel.", "26": "Only the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstling</span> of the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts,</span> which should be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H1069\">firstling,</span> no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> it; whether it be <span class=\"wl wl-kjv\" data-code=\"H7794\">ox,</span> or <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep:</span> it is the LORD'S.", "27": "And if it be of an <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean</span> <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> then he shall <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem</span> it according to thine <span class=\"wl wl-kjv\" data-code=\"H6187\">estimation,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> a <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> part of it thereto: or if it be not <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemed,</span> then it shall be <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> according to thy estimation.", "28": "Notwithstanding no devoted <span class=\"wl wl-kjv\" data-code=\"H2764\">thing,</span> that a <span class=\"wl wl-kj an class=\"wl wl-kjv\" data-code=\"H4643\">tithes,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> thereto the fifth", "32": "And concerning the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithe</span> of the <span class=\"wl wl-kjv\" data-code=\"H1241\">herd,</span> or of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock,</span> even of whatsoever <span class=\"wl wl-kjv\" data-code=\"H5674\">passeth</span> under the <span class=\"wl wl-kjv\" data-code=\"H7626\">rod,</span> the <span class=\"wl wl-kjv\" data-code=\"H6224\">tenth</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> unto the LORD.", "33": "He shall not <span class=\"wl wl-kjv\" data-code=\"H1239\">search</span> whether it be <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> or <span class=\"wl wl-kjv\" data-code=\"H7451\">bad,</span> neither shall he <span class=\"wl wl-kjv\" data-code=\"H4171\">change</span> it: and if he <span class=\"wl wl-kjv\" data-code=\"H4171\">change</span> it at <span class=\"wl wl-kjv\" data-code=\"H4171\">all,</span> then both it and the <span class=\"wl wl-kjv\" data-code=\"H8545\">change</span> thereof shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">holy;</span> it shall not be redeemed.", "34": "These are the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Sinai."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
