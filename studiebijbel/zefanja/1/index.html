e kleding.","9":"Ook zal Ik op diezelfde dag bezoeking doen over allen die over de drempel springen; die het huis van hun heren vullen met geweld en bedrog.","10":"En er zal op die dag, spreekt de HEERE, een stem van geschrei zijn vanaf de Vispoort, en een gehuil van het tweede gedeelte, en een grote breuk van de heuvels af.","11":"Huil, inwoners van de laagte! Want al het volk van koophandel is uitgeroeid, alle zilverdragers zijn uitgeroeid.","12":"En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.","13":"Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken.","14":"De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.","15":"Die dag zal een dag van verbolgenheid zijn; een dag van benauwdheid en angst, een dag van woestheid en verwoesting, een dag van duisternis en donkerheid, een dag van wolk en dikke duisternis;","16":"Een dag van de bazuin en van het geschal tegen de vaste steden en tegen de hoge hoeken.","17":"En Ik zal de mensen bang maken, zodat zij zullen gaan als de blinden; want zij hebben tegen de HEERE gezondigd; en hun bloed zal vergoten worden als stof, en hun vlees zal worden als drek.","18":"Ook hun zilver, ook hun goud zal hen niet kunnen redden op de dag van de verbolgenheid van de HEERE; maar door het vuur van het ijver van Hem zal dit hele land verteerd worden; want Hij zal een voleinding maken, zeker, een haastige, met alle inwoners van dit land."},"SV":{"1":"Het woord des HEEREN, hetwelk geschied is tot Zefanja, den zoon van Cuschi, den zoon van Gedalja, den zoon van Amarja, den zoon van Hizkia; in de dagen van Josia, den zoon van Amon, den koning van Juda.","2":"Ik zal ganselijk alles wegrapen uit dit land, spreekt de HEERE.","3":"Ik zal wegrapen mensen en beesten; Ik zal wegrapen de vogelen des hemels, en de vissen der zee, en de ergernissen met de goddelozen; ja, Ik zal de mensen uit dit land uitroeien, spreekt de HEERE.","4":"En Ik zal Mijn hand uitstrekken tegen Juda, en tegen alle inwoners van Jeruzalem; en Ik zal uit deze plaats uitroeien het overblijfsel van Baäl, *en* den naam der Chemarim met de priesters;","5":"En die zich nederbuigen op de daken voor het heir des hemels, en die zich nederbuigende zweren bij den HEERE, en zweren bij Malcham;","6":"En die terugkeren van achter den HEERE; en die den HEERE niet zoeken, en vragen naar Hem niet.","7":"Zwijgt voor het aangezicht des Heeren HEEREN; want de dag des HEEREN is nabij; want de HEERE heeft een slachtoffer bereid, Hij heeft Zijn genoden geheiligd.","8":"En het zal geschieden in den dag van het slachtoffer des HEEREN, dat Ik bezoeking zal doen over de vorsten, en over de kinderen des konings, en over allen, die zich kleden met vreemde kleding.","9":"Ook zal Ik ten zelven dage bezoeking doen over al wie over den dorpel springt; die het huis hunner heren vullen met geweld en bedrog.","10":"En er zal te dien dage, spreekt de HEERE, een stem des gekrijts zijn van de Vispoort af, en een gehuil van het tweede gedeelte, en een grote breuk van de heuvelen af.","11":"Huilt, gij inwoners der laagte! Want al het volk van koophandel is uitgehouwen, al de gelddragers zijn uitgeroeid.","12":"En het zal geschieden te dien tijde, Ik zal Jeruzalem met lantaarnen doorzoeken; en Ik zal bezoeking doen over de mannen, die stijf geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.","13":"Daarom zal hun vermogen ten roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen derzelver wijn niet drinken.","14":"De grote dag des HEEREN is nabij; hij is nabij, en zeer haastende; de stem van den dag des HEEREN; de held zal aldaar bitterlijk schreeuwen.","15":"Die dag zal een dag der verbolgenheid zijn; een dag der benauwdheid en des angstes, een dag der woestheid en verwoesting, een dag der duisternis en der donkerheid, een dag der wolk en der dikke donkerheid;","16":"Een dag der bazuin en des geklanks tegen de vaste steden en tegen de hoge hoeken.","17":"En Ik zal de mensen bang maken, dat zij zullen gaan als de blinden; want zij hebben tegen den HEERE gezondigd; en hun bloed zal vergoten worden als stof, en hun vlees zal worden als drek.","18":"Noch hun zilver, noch hun goud zal hen kunnen redden ten dage der verbolgenheid des HEEREN; maar door het vuur Zijns ijvers zal dit ganse land verteerd worden; want Hij zal een voleinding maken, gewisselijk, een haastige, met al de inwoners dezes lands."},"KJV":{"1":"The word of the LORD which came unto Zephaniah the son of Cushi, the son of Gedaliah, the son of Amariah, the son of Hizkiah, in the days of Josiah the son of Amon, king of Judah.","2":"I will utterly consume all *things* from off the land, saith the LORD.","3":"I will consume man and beast; I will consume the fowls of the heaven, and the fishes of the sea, and the stumblingblocks with the wicked; and I will cut off man from off the land, saith the LORD.","4":"I will also stretch out mine hand upon Judah, and upon all the inhabitants of Jerusalem; and I will cut off the remnant of Baal from this place, *and* the name of the Chemarims with the priests;","5":"And them that worship the host of heaven upon the housetops; and them that worship *and* that swear by the LORD, and that swear by Malcham;","6":"And them that are turned back from the LORD; and *those* that have not sought the LORD, nor enquired","7":"Hold thy peace at the presence of the Lord GOD: for the day of the LORD *is* at hand: for the LORD hath prepared a sacrifice, he hath bid his guests.","8":"And it shall come to pass in the day of the LORD'S sacrifice, that I will punish the princes, and the king's children, and all such as are clothed with strange apparel.","9":"In the same day also will I punish all those that leap on the threshold, which fill their masters' houses with violence and deceit.","10":"And it shall come to pass in that day, saith the LORD, *that there shall be* the noise of a cry from the fish gate, and an howling from the second, and a great crashing from the hills.","11":"Howl, ye inhabitants of Maktesh, for all the merchant people are cut down; all they that bear silver are cut off.","12":"And it shall come to pass at that time, *that* I will search Jerusalem with candles, and punish the men that are settled on their lees: that say in their heart, The LORD will not do good, neither will he do evil.","13":"Therefore their goods shall become a booty, and their houses a desolation: they shall also build houses, but not inhabit *them*; and they shall plant vineyards, but not drink the wine","14":"The great day of the LORD *is* near, *it is* near, and hasteth greatly, *even* the voice of the day of the LORD: the mighty man shall cry there bitterly.","15":"That day *is* a day of wrath, a day of trouble and distress, a day of wasteness and desolation, a day of darkness and gloominess, a day of clouds and thick darkness,","16":"A day of the trumpet and alarm against the fenced cities, and against the high towers.","17":"And I will bring distress upon men, that they shall walk like blind men, because they have sinned against the LORD: and their blood shall be poured out as dust, and their flesh as the dung.","18":"Neither their silver nor their gold shall be able to deliver them in the day of the LORD'S wrath; but the whole land shall be devoured by the fire of his jealousy: for he shall make even a speedy riddance of all them that dwell in the land."}},"tsk":{"1":[{"kopje":"woord","refs":["Ezech 1:3","Hos 1:1","2 Tim 3:16","2 Petr 1:19"]},{"kopje":"in de dagen","refs":["2 Kon 22 jv\" data-code=\"H113\">masters'</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> with <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> and deceit.","10":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that there shall be the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of a <span class=\"wl wl-kjv\" data-code=\"H6818\">cry</span> from the <span class=\"wl wl-kjv\" data-code=\"H1709\">fish</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and an <span class=\"wl wl-kjv\" data-code=\"H3215\">howling</span> from the <span class=\"wl wl-kjv\" data-code=\"H4932\">second,</span> and a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7667\">crashing</span> from the hills.","11":"<span class=\"wl wl-kjv\" data-code=\"H3213\">Howl,</span> ye <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H4389\">Maktesh,</span> for all the <span class=\"wl wl-kjv\" data-code=\"H3667\">merchant</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are cut <span class=\"wl wl-kjv\" data-code=\"H1820\">down;</span> all they that <span class=\"wl wl-kjv\" data-code=\"H5187\">bear</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> are cut off.","12":"And it shall come to pass at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> that I will <span class=\"wl wl-kjv\" data-code=\"H2664\">search</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> with <span class=\"wl wl-kjv\" data-code=\"H5216\">candles,</span> and <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that are <span class=\"wl wl-kjv\" data-code=\"H7087\">settled</span> on their <span class=\"wl wl-kjv\" data-code=\"H8105\">lees:</span> that <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> in their <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will not do <span class=\"wl wl-kjv\" data-code=\"H3190\">good,</span> neither will he do evil.","13":"Therefore their <span class=\"wl wl-kjv\" data-code=\"H2428\">goods</span> shall become a <span class=\"wl wl-kjv\" data-code=\"H4933\">booty,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> a <span class=\"wl wl-kjv\" data-code=\"H8077\">desolation:</span> they shall also <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> but not <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabit</span> them; and they shall <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> but not <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> the wine","14":"The <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H7138\">near,</span> it is <span class=\"wl wl-kjv\" data-code=\"H7138\">near,</span> and <span class=\"wl wl-kjv\" data-code=\"H4118\">hasteth</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly,</span> even the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H6873\">cry</span> there bitterly.","15":"That <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> is a <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath,</span> a <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H6869\">trouble</span> and <span class=\"wl wl-kjv\" data-code=\"H4691\">distress,</span> a <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H7722\">wasteness</span> and <span class=\"wl wl-kjv\" data-code=\"H4875\">desolation,</span> a <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> and <span class=\"wl wl-kjv\" data-code=\"H653\">gloominess,</span> a <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H6051\">clouds</span> and thick darkness,","16":"A <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> and <span class=\"wl wl-kjv\" data-code=\"H8643\">alarm</span> against the <span class=\"wl wl-kjv\" data-code=\"H1219\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and against the <span class=\"wl wl-kjv\" data-code=\"H1364\">high</span> towers.","17":"And I will bring <span class=\"wl wl-kjv\" data-code=\"H6887\">distress</span> upon <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> that they shall <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> like blind <span class=\"wl wl-kjv\" data-code=\"H5787\">men,</span> because they have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and their <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shall be poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> as <span class=\"wl wl-kjv\" data-code=\"H6083\">dust,</span> and their <span class=\"wl wl-kjv\" data-code=\"H3894\">flesh</span> as the dung.","18":"Neither their <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> nor their <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> them in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath;</span> but the whole <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall be <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> by the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> of his <span class=\"wl wl-kjv\" data-code=\"H7068\">jealousy:</span> for he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> even a <span class=\"wl wl-kjv\" data-code=\"H926\">speedy</span> <span class=\"wl wl-kjv\" data-code=\"H3617\">riddance</span> of all them that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the land."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Zefanja,","tekst":"Ook gemeenlijk genoemd Sofonias."},{"catchword":"Cuschi,","tekst":"Wie deze Cuschi en die hier na hem volgen geweest zijn, is ons nu onbekend, maar zij zijn buiten twijfel in die tijden vermaarde en welbekende mannen geweest; en het schijnt dat hier dit geslachtregister der voorouders van Zefanja gesteld is, om hem te onderscheiden van Zefanja, den zoon van Manaseja, die ook ten tijde van Josia geleefd heeft. De profeet Zefanja heeft ook geleefd en geprofeteerd ten tijde van Jeremia en van de profetes Hulda; verg. 2Ki 22:14 , en 2Ch 34:22 , en 2Ch 35:25 ; Jer 1:2 ."},{"catchword":"in de dagen van Josia,","tekst":"Te weten, nadat Josia den kerkedienst en godsdienst gereformeerd had, gelijk af te leiden is uit vs.4."}],"2":[{"catchword":"ganselijk alles wegrapen","tekst":"Hebr. wegrapende wagrapen, te weten, door de koning der Chaldeën. Zie van de betekenis van het woord wegrapen Psa 26:9 ."},{"catchword":"uit dit land,","tekst":"Hebr. van op het aangezicht van dit land, te weten, van het land Juda."}],"3":[{"catchword":"beesten;","tekst":"Hier worden ook de dieren vermengd onder de straffen, die de mensen met hunne zonden verdiend hebben, om te doen blijken hoe gruwelijk de zonde voor God is. Verg. Jer 4:23 , Jer 4:25-27 , en Jer 9:10 ; Hos 4:3 ."},{"catchword":"de ergernissen met de goddelozen;","tekst":"Of, de aanstotingen, te weten, het overblijfsel van den Baäl, vs.4, gelijk waren afgoden, kapellen en alle gereedschap, behorende tot de afgoderij, want hierdoor werden de godzaligen geërgerd en bedroefd en van den waren godsdienst afgeleid; zie Eze 14:3 , Eze 14:7 ."}],"4":[{"catchword":"En Ik zal Mijn hand","tekst":"Anders: dat is, in welke betekenis de letter Vau dikwijls genomen wordt."},{"catchword":"uitstrekken tegen Juda,","tekst":"Te weten, om te slaan."},{"catchword":"uit deze plaats uitroeien","tekst":"Te weten, uit Juda en Jeruzalem."},{"catchword":"het overblijfsel van Baäl,","tekst":"Dat is, het gereedschap, dienende tot den afgodischen dienst van Baäl, welken de vrome koning Josia niet ten enemale heeft kunnen uitroeien. Doch anderen verstaan dit van het overblijfsel der afgoderij, die na het wegvoeren van de tien stammen naar Assyrië, onder het volk van God, zelfs in Juda, nog overgebleven was."},{"catchword":"der Chemárim","tekst":"Zie de aantekening bij 2Ki 23:5 , wat door de chemarin te verstaan is."},{"catchword":"met de priesters;","tekst":"Versta hier, die priesters, die zich met afgoderij bezoedeld en ontheiligd hadden in den algemenen afval. Zie 2Ki 23:9 , en Zep 3:4 ."}],"5":[{"catchword":"En","tekst":"Te weten, Ik zal uitroeien."},{"catchword":"die zich nederbuigende","tekst":"Dat is, niet allen degenen, die openbare afgodendienaars waren, maar ook hen, die een vermengde religie hebben en die nevens of met hunne afgoden ook den ware God dienen willen. Hetwelk God verbiedt 1Ki 18:21 , en 2Ki 17:33 ; Eze 20:39 ."},{"catchword":"de daken","tekst":"Die in Judea en andere landen daar omheen, plat waren; zie de aantekening bij Deu 22:8 , en op welke zij dikwijls hunne afgoderij bedreven; zie 2Ki 23:12 , en Jer 19:13 ."},{"catchword":"het heir des hemels,","tekst":"Dat is, voor de sterren, zon en maan. Zie de aantekening bij Deu 4:19 , en Jer 7:18 , en Jer 10:2 ."},{"catchword":"zweren bij den HEERE,","tekst":"Of, den Heere zweren, gelijk 2Ch 15:14 ; hetwelk betekent Gode gehoorzaamheid en onderhouding zijner geboden beloven, en zich Gode heiligen en overgeven."},{"catchword":"zweren","tekst":"Zie de aantekening bij Jer 49:1 ."},{"catchword":"bij Malcham;","tekst":"Of, Melech, of Moloch, den afgod der kinderen Ammons. Doch onder dezen afgod kan men ook alle andere afgodenn verstaan, welken de afgodendienaars noemden hunne koningin. Melech betekent in het Hebr. een koning."}],"7":[{"catchword":"Zwijgt","tekst":"Dat is, murmureert niet tegen den Heere, maar bekent dat Hij oprecht oordeelt. Of, houdt u maar stil, gij zult in het kort de uitvoering zijner dreigementen zien."},{"catchword":"voor het aangezicht des Heeren HEEREN;","tekst":"Dat is, vanwege de tegenwoordigheid des Heeren."},{"catchword":"de dag des HEEREN is nabij;","tekst":"Te weten, de dag der wraak des Heere, in welken Hij de goddeloze afgodische Joden straffen zal. Alzo vs.14. Van den dood van den koning Josia af zijn de Joden geduriglijk van de ene ellende in de andere vervallen, totdat hunne koningen en zij met hen ten ondergebracht zijn geworden."},{"catchword":"een slachtoffer bereid,","tekst":"Of, een slachtmaaltijd, tot welken men vee slachtte. Het Hebr. woord betekent ook een beest, hetwelk geslacht werd om geofferd te worden. En versta hier, door deze slachting, ene slachting der Joden. Zie dergelijke manier van spreken Isa 34:6 ; Jer 46:10 , en Rev 19:17 ."},{"catchword":"Zijn genoden","tekst":"Versta door deze genodigde gasten de Chaldeën en andere vijanden der Joden, die uit hun eigen land naar Jeruzalem komen zouden, om daar alles te vermoorden en te roven. Doch men kan hier ook wel door de genodigden verstaan de vogelen des hemels en de wilde dieren des velds, die het vlees der gedode Joden eten zouden, gelijk Deu 28:26 , en Eze 39:17 ."},{"catchword":"geheiligd","tekst":"Dat is, bereid of afgezonderd. Zie Jer 12:3 ."}],"8":[{"catchword":"dat Ik bezoeking zal doen","tekst":"Voor dat Hij, te weten de Heere. Alzo vs.7."},{"catchword":"over de kinderen des konings,","tekst":"Zie de vervulling Jer 39:6 ."},{"catchword":"die zich kleden met vreemde kleding","tekst":"Hebr. die zich kleden met de klederen van een vreemd [volk], denheidenen ten gevalle. Anderen verstaan de dartele en brooddronken willen, niet tevreden zijnde met de gewone dracht der klederen in hun land gebruikelijk, maar willen het alles naar een nieuwe mode en uitlands fatsoen hebben."}],"9":[{"catchword":"bezoeking doen","tekst":"Dat is, Ik zal straffen."},{"catchword":"over al wie over den dorpel springt;","tekst":"Dat is, die met geweld in het huis van een anderen man invalt, om zijnen naaste te beroven. Of, die hunne palen overtreden en in het land van hun naasten overtreden. Hos 5:10 . Of, die met buit en roof geladen zijnde, tehuis komen, en met vreugde daarin springen."},{"catchword":"die het huis hunner heren vullen","tekst":"Dat is, die mede zulke stukken helpen verrichten, gelijk der grote heren dienaren wel plachten de hand mede te slaan aan zulke lelijke stukken die hunne heren bedrijven."},{"catchword":"met geweld en bedrog","tekst":"Dat is, met rijkdom door geweld en bedrog samengebracht."}],"10":[{"catchword":"te dien dage,","tekst":"Te weten, als de Chaldeën zullen komen en de stad overvallen."},{"catchword":"een stem des gekrijts zijn","tekst":"Te weten, der burgers te Jeruzalem, onderstaande uit den inval of overval der Chaldeën."},{"catchword":"de Vispoort af,","tekst":"Van deze poort wordt ook gewag gemaakt Neh 3:3 ; zij was de naaste van al de poorten van Jeruzalem naar de zee, aan die zijde der stad waar men ging naar Diospoli en Joppe."},{"catchword":"het tweede gedeelte,","tekst":"Anders genoemd de middelstad; zie de aantekening op 2Ki 20:4 , en 2Ki 22:14 . Anders: de tweede [poort]."},{"catchword":"een grote breuk","tekst":"Dat is, een grote jammer, ellende, moordgeschrei. Als men met zulk geweld roept en schreeuwt, dat schier de keel scheurt of kraakt, en dat er de lucht van breekt en scheurt."},{"catchword":"van de heuvelen af","tekst":"Dat is, van die zijde der stad waar verscheidene heuvels lagen, naar de drekpoort aan. Zie Jer 31:39 , en de aantekening aldaar. Aan welk oord ook de Olijfberg lag. In een woord, de profeet wil in dit vers te kennen geven dat er grote jammer zou wezen aan alle hoeken en kanten der stad, van welke drie hier genoemd worden, waaronder de anderen verstaan worden."}],"11":[{"catchword":"der laagte","tekst":"Eenigen behouden het Hebr. woord machtes in den tekst. Anderen vertalen het in de kramerstraat, of in de apothekers, of kruideniersstraat. Het Hebr. woord betekent eigenlijk een mortier; het schijnt dat het de naam van een zekere straat binnen Jeruzalem geweest is, de mortierstraat genoemd, omdat men daar dagelijks den mortier hoorde klinken, gelijk dan de apothekers en kruideniers dien dagelijks gebruikten, om hunne kruiden of medicijnen daarin te stoten. Anders: in de holligheid, of holle straat; dat is, waar veel kelders waren, waarin die kooplieden hunne waren legden. Hier woonden ook de goudsmeden, gelijk af te leiden is uit Neh 3:8 , Neh 3:31-32 ."},{"catchword":"koophandel is","tekst":"Of, kramervolk of handelaars, kooplieden. Anders: het volk van Kanaän, hetwelk voor kooplieden genomen wordt, omdat de Kanaänieten groten koophandel dreven."},{"catchword":"uitgehouwen,","tekst":"Of, uitgedelgd; dat is, zullen uitgeroeid worden. Anders: zullen zwijgen, of stil zijn, hetzij dat er geen nering meer wezen zal, of dat zij dood zullen wezen."},{"catchword":"de gelddragers zijn uitgeroeid","tekst":"Of, allen die met geld beladen zijn, te weten, de kooplieden en hunne schrijvers, kassiers en wis  down here, to distinguish him from Zephania the son of Mehaseia, who likewise lived in Josia&acirc;&euro;&trade;s time: our Zephania here, was also contemporarie with Jeremie and the prophetesse Hulda. Compare 2 Kings 22.4. and 2 Chro. 34.22 and chap 35.25 and Jer. 1.2.] in the days of Josia, [to wit, after that Josia had reformed the worship of God and true religion, as may be gathered from verse 4.] the son of Amon, the King of Juda."}],"2":[{"catchword":null,"tekst":"I will utterly take away all [Heb. raking away raje-away: viz by the king of Chaldeans. See of the word here used, Psa 26:9.] out of this land, [Heb. from on the face of this land, to wit the land of Juda] saith the LORD."}],"3":[{"catchword":null,"tekst":"I will rake-away men and beasts, [Here the very beasts also are made liable to the punishments, which men deserved by their sins, to make it appear, how heinous a thing sin is before God. Compare Hos. 4.3 Jer. 4.23,25,26,27 and chap. 9.20.] I will take away the fowls of the air, and the fishes of the sea, and the scandals [oth. Offences; to wit, the remainders of Baal, verse 4 such as were the idols, the chapels, and all manner of furniture belonging to idolatry; for by such things the godly were offended and made sad and many seduced from the true worship of God. See Ezek. 14.37.] with the wicked; yet I will destroy the men [hominess mankinde] out of this land, saith the LORD."}],"4":[{"catchword":null,"tekst":"And I will stretch out my hand [viz. for to strike or smite. Oth. Instead of the copulative and, read that is, in which sense the letter Van is off-times taken] against Juda and against all the inhabitants of Jeruslaem, and I will destroy out of this place [i.e. out of Juda and Jerusalem] the remains of Baal, [that is all the furniture serving for the idolatrous worship of Baal, which the pidus King Josia was not able to root out at once. Yet some do understand this of the remnant of idolatry, which after the carrying away of the ten tribes into Assyria, remaind yet among God&acirc;&euro;&trade;s people, in Juda it self.] (and) the name of the Chemarim, [see the annotate. 2 Kings 23. on verse 5. what is to be understood by these] with the priests: [understand those priests, that had defiled themselves and unhallowed themselves with idolatrie, in the common apostle. See 2 Kings 23 on verse 9. and Zeph. 3.4.]"}],"5":[{"catchword":null,"tekst":"And [to wit, I will destroy] those that bow down themselves upon the roofs [which in Juda and other countries of those parts, were flat. See the annotate. Duet. 22. on verse 8 and whereon they much used to practice their idolatry. See Jer. 19.13 and on verse 12.] before the hoste of heaven [that is before the stars, sun and moon. See annotate Deut. 4.19 and Jer 7:18. and 10.2.] and that bowing down themselves do swear by the LORD [or, to the LORD, as 2 Kings 15.14. which implieth promise of obedience and keeping of his commandments, with a consecrating of, and yielding up ones felt to God] and swear by Malcham [see Jer. 49 on verse 1. Oth. Molech or, Molech the idol of the children of Ammon; though under the name of this idol there may be understood likewise all other idols, whom the idolaters were wont to call their king, Moloch signifieth a king in the Heb. Here then in this verse God threateneth to destroy, not onely those that were open, possessed idolaters, but such also, as had a mixt religion and would serve the true God, besides or together with their idols; which God expressly forbidden 1 Kings 18.21 and 2 Kings 17.33. Ezek. 20.30.]"}],"6":[{"catchword":null,"tekst":"And those that turn back from after the LORD: and those that do not seek the LORD, and care not for him."}],"7":[{"catchword":null,"tekst":"Be silent [i.e. do not murmure against the LORD, but acknowledge, that he doth judge uptightly: or, be but quiet a while, and ye shall soon see the execution of his threatening] before the face of the Lord [i.e. by reason of the presence of the LORD] for the day of the LORD [i.e. the day of God&acirc;&euro;&trade;s vengeance, wherein he will punish the wicked idolatrous Jews. So verse 4.] Is neer [from the death of King Josiah under whom Zephania prophesied, the Jews fell out of one calamitie into the other, until their Kings and they together with them came to be destroyed, according to this prophecie] fo the LORD hath prepared a slay-offering; [or, a slaughter for which cattel must be slaughtered. The Hebrew word doth also signifie a beast slain for sacrifice: but here is understood a slaughter of the Jews. See the like phrase, Isa. 34.6 and Jer. 46.10. And Rev. 19.17.] He hath hallowed [i.e. prepared separated. See Jer 12 on verse 3.] his guests [or, invited ones; by them he understands the Chaldeans, and other enemies of the Jew, which were to come to Jerusalem out of their own countrie, for to kill and slay and plunder all they met with. Yet there may also b understood the fowls of the air, and the wilde beasts of the field, which should eat up the dead bodies of the slain: as Ezek. 39.17. And Deut. 28.26]"}],"8":[{"catchword":null,"tekst":"And it shall come to pass&Atilde;&copy; in the day of the slay-offering of the LORD that I [for, that he; to wit, the LORD, and so also below verse 9.] will make visitation upon the princess, and upon the children of the king [see the fulfilling hereof Jer. 39.6.] and upon all that clothe themselves with strange clothing. [Heb. that clothe themselves with the clothes of a strange (people) for to please the heathen: others understand it of vain wantom people, that knew not for wantomnesse how to clothe, dresse and fashion themselves, being never satisfied with the usual wear and habit received and kept in their country, but must still have some new stuffe, guize, size and new sangle or other to be in mode and fashion.]"}],"9":[{"catchword":null,"tekst":"Also on the day will I made visitation [i.e. punish] upon everyone, that leapeth over the threshold: [i.e that violently enters into another man&acirc;&euro;&trade;s house, to rob his neighbour: or, that transgresse the bounds or pales, and trespasse on their neighbour&acirc;&euro;&trade;s land. Hos. 5.10 or such as being well aden with prey and booty from abroad, are coming home, and for joy leap into their houses] that fill his house of their masters [Or, Lord, i.e help to commit the like soul practices, as great men&acirc;&euro;&trade;s servants used to do, who are seldom backward to assist their masters, in committing their villanies and violences] with violence and deceit. [i.e. with riches and treasure got and raked together by violence and deceit.]"}],"10":[{"catchword":null,"tekst":"And they shall be on that day [viz. when the chaldeans shall come and take the city] saith the LORD, a voice crying, [to wit among the inhabitants of Jerusalem, caused by surprizal or forcible entrance of the chaldeans] from the fish-gate, [of this gate mention is made likewise. Neh. 3.3 it was the nearest of all the rest, toward the sea-side, on the side of the city, which led toward Diospolis and Joppan.] and howling from the second partition, [otherwise called the middle city. See the annotat. 2 Kings 2 on verse 4 and 2 Kings 22 on verse 14. oth. The second (gate) and a great breach [i.e. an excessive clamour, roaring and outcry; crying with that force and violence, that even tears and rents both the throat and the air] from the hills. [i.e. from that side of the city, that was mostly hilly, near the dung-gate. See Jer. 31.39. and the annotate. There; on which side also the mount of Olives lay; in a word, the prophets set out in this verse, that the city would be in a sad and woful condition then, in all quarters, whereof three are named and the rest understood.]"}],"11":[{"catchword":null,"tekst":"Howl ye inhabitants of the plain: [some keep the Hebrew word machters in the text: other render it in mercer street: or the Apothecaries or, Drugsters. The Heb. word doth properly signifie a mortar: and ill distress the people, that they shall go as the blind ones, [which know not whither they go or tend, what they shall do first or last] for they have sinned against the LORD: and their blood shall be shed as dust [i.e abundantly, in great quantity, as a matter of no value at all. Thus dust is taken Mat. 10.14. Act 13:51. and 18.6.] and their flesh, [or body, properly meat. So the body is called, because it becomes at length worms-meat] shall become like dung. [The meaning is; their dead bodies shall be cast upon the fields and grounds, even as dung is cast forth there, to fatten the soil.]"}],"18":[{"catchword":null,"tekst":"Neither their silver, nor their gold shall be able to deliver them in the day of the indignation of the LORD; but by the fire of his jealousie, [i.e. by his jealousie burning like fire. See Ezek. 38.19..] shall this whole land be consumed: [Heb. be eaten up, as below chap. 3.8.] for he shall make an accomplishment [see Jer. 4.27.] certainly, an hasty one, with all the inhabitants of this land. [viz. the land of Juda.]"}]}}};

(function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;

  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;

});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
