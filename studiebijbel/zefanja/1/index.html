o mensenkind, want het zal zijn tegen Mijn volk, het zal zijn tegen al de vorsten van Israël; verschrikkingen zullen vanwege het zwaard bij Mijn volk zijn; klop daarom op de heup.", "2 Kon 18:12": "Omdat zij de stem van de HEERE, hun God, niet gehoorzaam waren geweest, maar Zijn verbond overtreden hadden; en al wat Mozes, de knecht van de HEERE, geboden had, dat hadden zij niet gehoord, noch gedaan.", "Jes 30:2": "Die gaan om af te trekken naar Egypte, en vragen Mijn mond niet; om zich te sterken met de macht van Farao, en om hun toevlucht te nemen onder de schaduw van Egypte.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Neh 3:3": "De Vispoort nu bouwden de kinderen van Senaä; zij zolderde die, en richtten haar deuren op, met haar sloten en haar grendelen.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Luk 14:16": "Maar Hij zei tegen hem: Een zeker mens bereidde een groot avondmaal, en nodigde er velen voor uit.", "Matt 12:32": "En wie een woord zal spreken tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest zal spreken, het zal hem niet vergeven worden, niet in deze eeuw, en ook niet in de toekomende.", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "2 Petr 2:3": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "Jer 9:19": "Want er is een stem van weeklacht gehoord uit Sion: Hoe zijn wij verwoest! Wij zijn zeer beschaamd, omdat wij het land hebben verlaten, omdat zij onze woningen hebben omgeworpen.", "Jer 50:24": "Ik heb u een strik gesteld, en daardoor bent u ook gevangen, o Babel! Zonder dat u het wist; u bent gevonden, en ook gegrepen, omdat u zich tegen de HEERE in strijd gemengd hebt.", "2 Kon 25:6": "Zij dan grepen de koning, en voerden hem op naar de koning van Babel, naar Ribla; en zij spraken een oordeel tegen hem.", "2 Kron 29:6": "Want onze vaders hebben overtreden, en gedaan wat kwaad was in de ogen van de HEERE, onze God, en hebben Hem verlaten, en zij hebben hun gezicht van de tabernakel van de HEERE afgewend, en hebben Hem de rug toegekeerd.", "Ps 94:20": "Zou de troon van het onrecht zich met U verbinden, die moeite verzint bij wet?", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Luk 17:2": "Het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd en hij in de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "Jes 34:6": "Het zwaard van de HEERE is vol bloed, het is vet geworden van vet, van het bloed van de lammeren en de bokken, van het vet van de nieren van de rammen; want de HEERE heeft een offer in Bozra, en een grote slachting in het land van de Edomieten.", "2 Kon 9:33-37": "En hij zei: Gooi haar naar beneden. En zij gooiden haar naar beneden, zodat van haar bloed tegen de muur en tegen de paarden gespat werd; en hij vertrapte haar. Toen hij nu binnengekomen was, en gegeten en gedronken had, zei hij: Kijk nu naar die vervloekte, en begraaf haar; want zij is een koningsdochter. En zij gingen haar begraven; maar zij vonden niets van haar dan de schedel, en de voeten, en de palmen van haar handen.", "Kol 3:8": "Maar leg nu ook u dit alles af: gramschap, toorn, kwaadheid, lastering, vuil spreken uit uw mond.", "Ezech 24:13": "In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.", "Jer 2:21": "Ik had u toch geplant, een edele wijnstok, een geheel getrouw zaad; hoe bent u Mij dan veranderd in verbasterde ranken van een vreemde wijnstok?", "Luk 16:1-13": "En Hij zei ook tegen Zijn discipelen: Er was een zeker rijk mens, die een rentmeester had; en deze werd bij hem beschuldigd, dat hij zijn goederen verkwistte. En hij riep hem en zei tegen hem: Hoe hoor ik dit van u? Geef rekenschap van uw rentmeesterschap; want u zult niet meer rentmeester kunnen zijn. En de rentmeester zei bij zichzelf: Wat zal ik doen, omdat mijn heer dit rentmeesterschap van mij afneemt? Graven kan ik niet; te bedelen schaam ik mij.", "Spr 29:12": "Een heerser die op leugentaal let, al zijn dienaars worden goddeloos.", "Job 13:7-9": "Zult u voor God onrecht spreken, en zult u voor Hem bedriegerij spreken? Zult u Zijn aangezicht aannemen? Zult u voor God twisten? Zal het goed zijn, als Hij u zal onderzoeken? Zult u met Hem spotten, zoals men met een mens spot?", "Jer 20:7": "HEERE! U hebt mij overgehaald, en ik ben overgehaald; U bent mij te sterk geweest, en hebt de overhand gehad; ik ben de hele dag tot een belaching, ieder van hen bespot mij.", "Ps 58:7-10": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE! Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren. Laat hem heengaan als een wegsmeltende slak; laat hen, als de misdracht van een vrouw, de zon niet zien.", "Hos 8:14": "Want Israël heeft zijn Maker vergeten en tempels gebouwd, en Juda heeft versterkte steden vermenigvuldigd; maar Ik zal een vuur zenden in zijn steden, dat zal hun paleizen verteren.", "Jes 36:20": "Welke zijn er onder al de goden van deze landen, die hun land uit mijn hand gered hebben, zodat de HEERE Jeruzalem uit mijn hand zou redden?", "Ezra 9:14": "zullen wij dan weer teruggaan om Uw geboden te vernietigen, en ons te verzwageren met de volken van deze gruwelen? Zou U dan niet tegen ons toornen tot verterens toe, zodat er geen overblijfsel noch ontkoming zou zijn?", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Rom 9:20": "Maar toch, o mens, wie bent u, die tegen God antwoordt? Zal ook het maaksel tegen hem die het gemaakt heeft zeggen: Waarom hebt u mij zo gemaakt?", "Matt 27:39-44": "En zij die voorbijgingen, beschimpten Hem en schudden hun hoofd, en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af. En evenzo zeiden ook de overpriesters, met de schriftgeleerden en oudsten, en Farizeeën, terwijl zij Hem bespotten:", "Jes 36:6": "Zie, u vertrouwt op die gebroken rietstaf, op Egypte; als iemand daarop leunt, zal hij in zijn hand gaan en die doorboren; zo is farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Ezech 7:6": "Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Jes 5:1-8": "Nu zal ik voor mijn Beminde een lied van mijn Liefste zingen, over Zijn wijngaard. Mijn Beminde heeft een wijngaard op een vruchtbare heuvel. En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij goede druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht. Nu dan, u, inwoners van Jeruzalem, en u, mannen van Juda, oordeel toch tussen Mij en tussen Mijn wijngaard.", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "Gen 16:6-9": "En Abram zei tegen Sarai: Zie, uw dienstmaagd is in uw hand; doe met haar wat goed is in uw ogen. En Sarai vernederde haar, en zij vluchtte van haar aangezicht. En de Engel van de HEERE vond haar bij een waterbron in de woestijn, bij de bron op de weg naar Sur. En hij zei: Hagar, dienstmaagd van Sarai, waar komt u vandaan, en waar zult u heengaan? En zij zei: Ik vlucht van het aangezicht van mijn meesteres Sarai!", "Klaagl 4:17": "Ain. Nog steeds bezweken onze ogen, terwijl ze uitkeken naar onze nutteloze hulp; wij tuurden met gespannen aandacht naar een volk dat niet kon verlossen.", "Ps 37:13-22": "De Heere belacht hem, want Hij ziet dat zijn dag komt. Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn. Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "Zach 1:14": "En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver.", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "Job 9:16": "Al zou ik roepen en Hij mij antwoorden, ik zou niet geloven dat Hij mijn stem ter ore genomen heeft.", "Job 3:5": "Dat de duisternis en de schaduw van de dood hem verontreinigen; dat wolken over hem wonen; dat hem verschrikken de zwarte dampen van de dag!", "Dan 9:5-19": "Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten. En wij hebben niet geluisterd naar Uw dienstknechten, de profeten, die in Uw Naam spraken tot onze koningen, onze vorsten en onze vaders, en tot heel het volk van het land. Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "Jer 11:11": "Daarom zegt de HEERE zo: Zie, Ik zal een kwaad over hen brengen, waaruit zij niet zullen kunnen ontkomen; als zij dan tot Mij zullen roepen, zal Ik naar hen niet horen.", "Jer 22:13": "Wee hem die zijn huis bouwt met ongerechtigheid, en zijn bovenzalen met onrecht; die de dienst van zijn naaste voor niets gebruikt, en hem zijn arbeidsloon niet geeft!", "Hebr 3:16-18": "Want sommigen, toen zij die gehoord hadden, hebben Hem verbitterd, maar niet allen die uit Egypte door Mozes weggetrokken zijn. Over wie nu is Hij veertig jaar lang vertoornd geweest? Was het niet over hen die gezondigd hadden, van wie de lichamen gevallen zijn in de woestijn? En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?", "Jer 7:34": "En Ik zal uit de steden van Juda en uit de straten van Jeruzalem doen ophouden de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid; want het land zal tot een verwoesting worden.", "Spr 30:21": "Om drie dingen beeft de aarde, ja, om vier, die zij niet kan dragen:", "Jer 2:37": "U zult ook van hier uitgaan met uw handen op uw hoofd; want de HEERE heeft al uw vertrouwen verworpen, zodat u daarmee niet zult gedijen.", "Luk 21:22": "Want dit zijn dagen van wraak, opdat alles vervuld wordt wat geschreven is.", "Spr 28:28": "Als de goddelozen opkomen, verbergt de mens zich; maar als zij omkomen, worden de rechtvaardigen talrijker.", "Jes 2:6": "Maar U hebt Uw volk, het huis van Jakob, verlaten, want zij zijn vervuld met goddeloosheid, meer dan het oosten, en zij zijn van het guichelaar gelijk de Filistijnen, en aan de kinderen van de vreemden tonen zij hun behagen.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Jes 8:21": "En ieder van hen zal daar doorgaan, hard gedrukt en hongerig; en het zal gebeuren, wanneer hem hongert en hij zeer toornig zal zijn, dan zal hij vloeken op zijn koning en op zijn God, als hij opwaarts zal zien;", "Ezech 18:2": "Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden?", "Jes 57:4-11": "Over wie maakt u zich vrolijk, tegen wie sperrt u de mond wijd open en steekt u de tong lang uit? Bent u geen kinderen van de overtreding, een nageslacht van de valsheid? U die verhit bent in de eikenbossen, onder elke groene boom; die de kinderen slacht bij de beken, onder de richels van de rotsen? Aan de gladde stenen van de beek is uw deel; die, die zijn uw lot; ook stort u daarover een drankoffer uit, u offert hun een spijsoffer; zou Ik Mij hierover laten troosten?", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "2 Kon 23:37": "En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vaders gedaan hadden.", "Ps 58:2": "Spreekt u werkelijk gerechtigheid, gij vergadering? Oordeelt u wat recht is, mensenkinderen?", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Jer 47:7": "Hoe zou u stil houden? De HEERE heeft toch aan het zwaard bevel gegeven; tegen Askelon en tegen de zeehaven, daar heeft Hij het besteld.", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Klaagl 2:21": "Schin. De jongen en de ouden liggen op de aarde op de straten; mijn jonkvrouwen en mijn jongelingen zijn door het zwaard gevallen; Gij hebt ze gedood in de dag van Uw toorn, Gij hebt ze geslacht en niet verschoond.", "Jer 39:6": "En de koning van Babel slachtte de zonen van Zedekia te Ribla voor zijn ogen; ook slachtte de koning van Babel alle edelen van Juda.", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Jer 2:5": "Zo zegt de HEERE: Wat voor onrecht hebben uw vaders aan Mij gevonden, dat zij ver van Mij zijn geweken, en de ijdelheid hebben nagewandeld, en zelf ijdel zijn geworden?", "Jes 47:10": "Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Spr 18:23": "De arme spreekt smekingen; maar de rijke antwoordt harde dingen.", "Hand 17:18": "En sommigen van de Epicureïsche en Stoïcijnse wijsgeren streden met hem; en sommigen zeiden: Wat wil deze praatjesmaker toch zeggen? Maar anderen zeiden: Hij lijkt een verkondiger te zijn van vreemde goden; omdat hij hun Jezus en de opstanding verkondigde.", "2 Kon 21:18-26": "En Manasse ontsliep met zijn vaderen, en werd begraven in de tuin van zijn huis, in de tuin van Uzza; en zijn zoon Amon werd koning in zijn plaats. Amon was tweeëntwintig jaar oud, toen hij koning werd, en hij regeerde twee jaar te Jeruzalem; en de naam van zijn moeder was Mesullemet, een dochter van Haruz uit Jotba. En hij deed wat kwaad was in de ogen van de HEERE, zoals zijn vader Manasse gedaan had.", "Dan 7:25": "En het zal woorden spreken tegen de Allerhoogste, en het zal de heiligen van de hoge plaatsen uitputten, en het zal proberen de tijden en de wet te veranderen, en zij zullen in zijn hand overgegeven worden tot een tijd, en tijden, en een deel van een tijd.", "Job 27:13-23": "Dit is het deel van de goddeloze mens bij God, en de erve van de tirannen, die zij van de Almachtige ontvangen zullen. Indien zijn kinderen zich vermenigvuldigen, het is voor het zwaard; en zijn spruiten zullen van brood niet verzadigd worden. Zijn overgeblevenen zullen in de dood begraven worden, en zijn weduwen zullen niet wenen.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Job 21:30": "Dat de boze gespaard wordt op de dag van het verderf; dat zij op de dag van de verbolgenheden weggevoerd worden.", "Hos 4:1": "Hoor het woord van de Heere, kinderen van Israël! Want de Heere heeft een geschil met de inwoners van het land, omdat er geen trouw, en geen goedertierenheid, en geen kennis van God in het land is;", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Jes 2:21": "Gaande in de reten van de rotsen, en in de kloven van de steenrotsen, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde geweldig te verschrikken.", "Spr 29:19": "Een knecht zal door woorden niet getuchtigd worden; al begrijpt hij het, toch zal hij niet gehoorzamen.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Joh 13:37": "Petrus zei tegen Hem: Heere, waarom kan ik U nu niet volgen? Ik zal mijn leven voor U geven.", "2 Tess 2:4": "die zich tegenstelt en zich verheft boven alles wat God genoemd wordt, of als God vereerd wordt, zodat hij in de tempel van God als God zal zitten, zichzelf voordoend dat hij God is.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Ps 37:21": "Lamed. De goddeloze leent en geeft niet terug; maar de rechtvaardige ontfermt zich, en geeft.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "2 Kon 23:4": "En de koning gebood de hogepriester Hilkia, en de priesters van de tweede rang, en de bewakers van de drempel, dat zij uit de tempel van de HEERE al het gereedschap, dat voor Baäl, en voor het beeld van het bos en voor heel het leger van de hemel gemaakt was, naar buiten zouden brengen; en hij verbrandde dat buiten Jeruzalem in de velden van Kidron, en liet het stof daarvan naar Beth-el brengen.", "Jer 5:29": "Zou Ik hierom geen straf brengen? spreekt de HEERE; zou Mijn ziel zich niet wreken aan zo'n volk als dit is?", "Matt 26:33-35": "Doch Petrus antwoordde en zei tegen Hem: Al werden zij ook allen aan U geërgerd, ik zal nooit geërgerd worden. Jezus zei tegen hem: Voorwaar, Ik zeg u dat u in deze zelfde nacht, voordat de haan gekraaid zal hebben, Mij driemaal zult verloochenen. Petrus zei tegen Hem: Al moest ik ook met U sterven, ik zal U geenszins verloochenen! Hetzelfde zeiden ook alle discipelen.", "Amos 6:1": "Wee de geruste mensen in Sion, en degenen die zeker zijn op de berg van Samaria! Zij zijn de voornaamste van de eerstelingen der volken, en tot hen komen die van het huis van Israël.", "Matt 13:12-15": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "Jer 12:10-13": "Veel herders hebben Mijn wijngaard verdorven, zij hebben Mijn akker vertrapt; zij hebben Mijn gewenste akker gesteld tot een woeste wildernis. Men heeft het gesteld tot een woestenij, verwoest zijnde treurt het tot Mij; het hele land is verwoest, omdat er niemand is die het ter harte neemt. Op alle hoge plaatsen in de woestijn zijn verstoorders gekomen; want het zwaard van de HEERE verteert van het ene einde van het land tot aan het andere einde van het land; er is geen vrede voor enig vlees.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Joël 2:10": "De aarde is beroerd voor hun aangezicht, de hemel beeft; de zon en maan worden zwart, en de sterren trekken hun glans in.", "Joz 23:7": "Dat u niet ingaat tot deze volken: deze, die overgebleven zijn bij u; gedenkt ook niet aan de naam van hun goden, en laat er niet bij zweren, en dient hen niet, en buigt u voor hen niet;", "Hos 10:7": "De koning van Samaria is afgehouwen, als schuim op het water.", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "Ezech 5:1-17": "En u, mensenkind, neem een scherp mes, een scheermes van de barbiers zult u nemen, en dat zult u over uw hoofd en over uw baard laten gaan; daarna zult u een weegschaal nemen, en die haren verdelen. Een derde deel zult u in het midden van de stad met vuur verbranden, nadat de dagen van de belegering vervuld zijn; dan zult u een derde deel nemen, en daaromheen slaan met een zwaard, en een derde deel zult u in de wind strooien; want Ik zal het zwaard achter hen uittrekken. U zult ook een klein aantal daarvan nemen, en in uw slippen binden.", "Ezech 39:17": "U dan, mensenkind! Zo zegt de Heere HEERE: Zeg tegen het gevogelte van elke vleugel, en tegen alle dieren van het veld: Verzamel u, en kom aan, verzamel u van rondom, bij Mijn slachtoffer dat Ik voor u geslacht heb, een groot slachtoffer, op de bergen van Israël, en eet vlees, en drink bloed.", "Mark 14:29-31": "En Petrus zei tegen Hem: Al zouden zij allen aanstoot nemen, ik zal het toch niet doen. En Jezus zei tegen hem: Voorwaar, Ik zeg u, dat u heden, in deze nacht, voordat de haan tweemaal gekraaid zal hebben, Mij driemaal zult verloochenen. Maar hij zei des te heftiger: Al moest ik met U sterven, ik zal U geenszins verloochenen! En evenzo zeiden zij ook allen.", "Ps 106:14": "Maar zij werden belust met begeerte in de woestijn, en zij verzochten God in de wildernis.", "Deut 28:30": "U zult een vrouw ondertrouwen, maar een ander zal met haar slapen; een huis zult u bouwen, maar er niet in wonen; een wijngaard zult u planten, maar de vrucht ervan niet gewoon gebruiken.", "Jes 28:18-22": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Zef 1:14-18": "De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen. Die dag zal een dag van verbolgenheid zijn; een dag van benauwdheid en angst, een dag van woestheid en verwoesting, een dag van duisternis en donkerheid, een dag van wolk en dikke duisternis; Een dag van de bazuin en van het geschal tegen de vaste steden en tegen de hoge hoeken.", "Openb 17:3": "En hij bracht mij weg naar een woestijn, in de geest, en ik zag een vrouw zitten op een scharlaken rood beest, dat vol was van namen van godslastering, en dat zeven hoofden had en tien horens.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "1 Kor 8:9-13": "Maar kijk uit, dat deze macht van u niet op de een of andere manier een aanstoot wordt voor hen die zwak zijn. Want als iemand u, die de kennis hebt, ziet aanzitten in de tempel van de afgod, zal het geweten van hem, die zwak is, dan niet gesterkt worden om te eten de dingen die aan de afgoden geofferd zijn? En zal de broeder, die zwak is, door uw kennis verloren gaan, om wie Christus gestorven is?", "Ezech 38:19": "Want Ik heb gesproken in Mijn ijver, in het vuur van Mijn verbolgenheid: Zeker, op die dag zal er een grote beving zijn in het land van Israël!", "1 Kor 10:5-11": "Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Lev 19:35": "U zult geen onrecht doen in het gericht, met de el, met het gewicht, of met de maat.", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Ezech 22:14": "Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.", "Job 24:22": "Ook trekt hij de machtigen mee door zijn kracht; staat hij op, dan is niemand zeker van zijn leven.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Hos 11:2": "Maar net zoals zij hen riepen, zo gingen zij van hun aangezicht weg; zij offerden aan de Baäls, en brandden reukwerk voor de gesneden beelden.", "Job 21:13": "In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "Amos 3:6": "Zal de bazuin in de stad geblazen worden, zonder dat het volk sidddert? Zal er een kwaad in de stad zijn, dat de HEERE niet doet?", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "Ezech 7:10": "Zie, de dag, zie, de morgenstond is gekomen, de morgenstond is voortgekomen, de roede heeft gebloeid, de hoogmoed heeft gebloeid.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Deut 29:19-21": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Ezech 12:23": "Daarom, zeg tegen hen: Zo zegt de Heere HEERE: Ik zal dit spreekwoord doen ophouden, zodat zij het niet meer als spreekwoord zullen gebruiken in Israël. Maar spreek tot hen: De dagen zijn nabijgekomen, en het woord van elk visioen.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Jes 34:8": "Want het zal zijn de dag van de wraak van de HEERE, een jaar van vergeldingen, om de rechtszaak van Sion.", "2 Kron 32:19": "En zij spraken over de God van Jeruzalem zoals over de goden van de volken van de aarde, een werk van mensenhanden.", "Jer 32:29": "En de Chaldeeën, die tegen deze stad strijden, zullen erin komen, en deze stad met vuur aansteken, en zullen haar verbranden, met de huizen op wier daken zij voor Baäl gerookt en aan andere goden drankoffers geofferd hebben, om Mij te vertoornen.", "2 Kron 30:6": "De boodschappers dan gingen weg met de brieven uit de hand van de koning en zijn leiders, door heel Israël en Juda, en naar het bevel van de koning, en zeiden: Kinderen van Israël, bekeer u tot de HEERE, de God van Abraham, Izak en Israël, dan zal Hij Zich keren naar wie ontkomen waren, die voor u overgebleven zijn uit de hand van de koningen van Assyrië.", "1 Kor 3:21": "Niemand roemt dan op mensen; want alles is van u.", "Matt 18:34": "En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.", "Job 20:28": "De inkomsten van zijn huis zullen weggevoerd worden; het zal allemaal wegvloeien op de dag van Zijn toorn.", "Ps 52:7-9": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela. En de rechtvaardigen zullen het zien, en vrezen; en zij zullen over hem lachen, en zeggen: Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Jer 42:14": "en zegt: Nee, maar wij zullen naar Egypteland gaan, waar wij geen oorlog zullen zien, noch het geluid van de bazuin horen, noch naar brood hongeren, en daar zullen wij blijven;", "Ps 78:19": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn?", "Ps 78:10": "Zij hielden Gods verbond niet, en weigerden te wandelen in Zijn wet.", "Ps 44:10-17": "Maar nu hebt U ons verstoten en te schande gemaakt, omdat U met onze legers niet uittrekt. U doet ons achterwaarts keren van de tegenstander; en onze haters beroven ons voor zichzelf. U geeft ons over als schapen ten voedsel, en U verstrooit ons onder de heidenvolken.", "Ezech 18:29": "Toch zegt het huis van Israël: De weg van de Heere is niet recht. Zouden Mijn wegen, o huis van Israël, niet recht zijn? Zijn niet uw wegen onrecht?", "2 Kon 17:41": "Maar deze volken vreesden de HEERE, en dienden hun gesneden beelden; ook doen hun kinderen en hun kleinkinderen, zoals hun vaders gedaan hebben, tot op deze dag.", "Richt 2:14": "Zo ontstak de toorn van de HEERE tegen Israël, en Hij gaf hen in de hand van rovers, die hen beroofden; en Hij verkocht hen in de hand van hun vijanden rondom; en zij konden niet meer standhouden voor het aangezicht van hun vijanden.", "Jer 14:7": "Hoewel onze ongerechtigheden tegen ons getuigen, o HEERE, doe het om Uw Naams wil; want onze afdwalingen zijn talrijk, wij hebben tegen U gezondigd.", "Matt 18:7-9": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Klaagl 1:14": "Nun. Het juk van mijn overtredingen is aangebonden door Zijn hand, zij zijn samengevlochten, zij zijn op mijn hals geklommen; Hij heeft mijn kracht doen vervallen; de Heere heeft mij in hun handen gegeven, ik kan niet opstaan.", "1 Sam 5:5": "Daarom stappen de priesters van Dagon, en allen die het huis van Dagon binnenkomen, tot op deze dag niet op de drempel van Dagon te Asdod.", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Hos 7:15": "Ik heb hen wel getuchtigd, en hun armen gesterkt; maar zij denken kwaad tegen Mij.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Jes 59:11": "Wij brommen allen als de beren, en wij kirren voortdurend als de duiven; wij wachten op recht, maar er is geen, op heil, maar het is ver van ons.", "Jer 10:21": "Want de herders zijn redeloos geworden, en hebben de HEERE niet gezocht; daarom hebben zij niet verstandig gehandeld, en hun hele kudde is verstrooid.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Ex 15:12": "U hebt Uw rechterhand uitgestrekt, de aarde heeft hen verslonden!", "Spr 17:2": "Een verstandige knecht zal heersen over een zoon die beschaamd maakt, en in het midden van de broeders zal hij erfenis delen.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Ps 74:18": "Denk hieraan; de vijand heeft de HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Ezech 13:11": "Zeg tegen hen die met loze kalk pleisteren, dat hij omvallen zal; er zal een overstelpende plasregen zijn; en u, grote hagelstenen, zult vallen, en een grote stormwind zal hem splijten.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "Jer 25:28": "En het zal gebeuren, wanneer zij weigeren de beker van uw hand aan te nemen om te drinken, dat u tot hen zult zeggen: Zo zegt de HEERE van de heerscharen: U zult zeker drinken!", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Jer 48:11": "Moab is van zijn jeugd af aan rustig geweest, en hij heeft op zijn droesem stilgelegen, en is van vat in vat niet overgegoten, en heeft niet in gevangenschap gewandeld; daarom is zijn smaak in hem gebleven, en zijn geur niet veranderd.", "Gen 3:4": "Toen zei de slang tegen de vrouw: U zult zeker niet sterven;", "2 Sam 5:9": "Zo woonde David in de burcht en noemde die de stad van David. En David bouwde rondom, vanaf Millo naar binnen toe.", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Jer 46:10": "Maar deze dag is van de Heere, de HEERE van de heerscharen, een dag van wraak, dat Hij zich wreekt van Zijn tegenstanders, en het zwaard zal verslinden, en verzadigd, en dronken worden van hun bloed; want de Heere, HEERE van de heerscharen, heeft een slachtoffer in het land van het noorden, aan de rivier Frath.", "Jes 65:7": "Uw ongerechtigheden, en de ongerechtigheden van uw vaderen tegelijk, zegt de HEERE, die op de bergen wierook gebrand hebben, en Mij smaad aangedaan hebben op de heuvels; daarom zal Ik hun vorige werkloon weer in hun boezem toemeten.", "Jer 4:10": "Toen zei ik: Ach, Heere HEERE! werkelijk, U hebt dit volk en Jeruzalem grotelijks bedrogen, door te zeggen: U zult vrede hebben; terwijl het zwaard tot aan de ziel raakt.", "Mal 4:5": "Zie, Ik zend u de profeet Elia, voordat die grote en vreselijke dag van de HEERE komt.", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Joël 1:13": "Omgord u, en rouwklaag, priesters! Huil, dienaars van het altaar! Ga naar binnen, overnacht in zakken, dienaars van mijn God! Want spijsoffer en drankoffer is geweerd van het huis van uw God.", "Jer 3:23": "Waarlijk, tevergeefs verwacht men het van de heuvels en de menigte van bergen; waarlijk, in de HEERE, onze God, is het heil van Israël!", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Luk 21:23": "Maar wee de zwangere vrouwen en de vrouwen die zogen in die dagen, want er zal grote nood zijn in het land, en toorn over dit volk.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Jes 65:2": "Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.", "Deut 22:5": "Het kleed van een man mag niet gedragen worden door een vrouw, en een man mag geen vrouwenkleed aantrekken; want ieder die dat doet, is de HEERE, uw God, een gruwel.", "2 Kron 33:21-25": "Amon was tweeëntwintig jaar oud, toen hij koning werd, en hij regeerde twee jaar te Jeruzalem. En hij deed wat kwaad was in de ogen van de HEERE, zoals zijn vader Manasse gedaan had; want Amon offerde aan alle gesneden beelden, die zijn vader Manasse gemaakt had, en diende ze. Maar hij vernederde zich niet voor het aangezicht van de HEERE, zoals Manasse, zijn vader, zich vernederd had; maar deze Amon vermeerderde de schuld.", "Deut 32:30": "Hoe zou één duizend achtervolgen, en twee tienduizend doen vluchten, als niet hun Rotssteen hen verkocht had, en de HEERE hen overgeleverd had?", "Jer 39:2": "In het elfde jaar van Zedekia, in de vierde maand, op de negende dag van de maand, werd de stad doorgebroken.", "Jer 34:8-17": "Het woord dat tot Jeremia gebeurde van de HEERE, nadat koning Zedekia een verbond gemaakt had met heel het volk dat te Jeruzalem was, om vrijheid voor hen uit te roepen. Dat ieder zijn knecht, en ieder zijn slavin, die een Hebreeër of een Hebreeuwse is, zou laten vrijgaan; zodat niemand zich van hen, van een Jood, zijn broeder, zou laten dienen. Nu hoorden alle vorsten en heel het volk die het verbond waren ingegaan, dat zij, ieder zijn knecht en ieder zijn slavin, zouden laten vrijgaan, zodat zij zich niet meer van hen zouden laten dienen; zij hoorden dan, en lieten hen gaan.", "Kol 3:22-25": "Dienstknechten, wees in alles gehoorzaam aan uw heren naar het vlees, niet met ogendiensten als mensenbehagers, maar met eenvoud van hart, terwijl u God vreest. En alles wat u doet, doe dat van harte, als voor de Heere en niet voor de mensen; want u weet dat u van de Heere de vergelding van de erfenis zult ontvangen; want u dient de Heere Christus.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Ps 48:13": "Ga rondom Sion, en omring haar; tel haar torens;", "Micha 6:11": "Zou ik rein zijn, met een goddeloze weegschaal en met een zak met bedrieglijke gewichten?", "Job 15:25": "Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan.", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "Jer 2:18": "En nu, wat hebt u te doen met de weg van Egypte, om de wateren van Sihor te drinken? En wat hebt u te doen met de weg van Assur, om de wateren van de rivier te drinken?", "Jes 5:19": "Die zeggen: Laat Hij haasten, laat Hij Zijn werk bespoedigen, opdat wij het zien; en laat het raadsbesluit van de Heilige van Israël naderen en komen, opdat wij het vernemen!", "Jes 30:9": "Want het is een opstandig volk; het zijn leugenachtige kinderen; kinderen die de wet van de HEERE niet willen horen.", "Luk 18:22-26": "Toen Jezus dit hoorde, zei Hij tegen hem: Nog één ding ontbreekt u; verkoop alles wat u hebt, en deel het onder de armen, en u zult een schat hebben in de hemel; en kom hier, volg Mij. Maar toen hij dit hoorde, werd hij erg verdrietig; want hij was zeer rijk. Toen Jezus zag dat hij erg verdrietig geworden was, zei Hij: Hoe moeilijk zullen zij die rijkdom hebben, het Koninkrijk van God ingaan!", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Ps 73:9": "Zij zetten hun mond tegen de hemel, en hun tong gaat rond op de aarde.", "Spr 18:11": "Het bezit van de rijke is de stad van zijn sterkte, en als een hoge muur in zijn eigen inbeelding.", "Amos 5:18": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht.", "Job 21:15": "Wat is de Almachtige, dat wij Hem zouden dienen? En wat baat zouden wij hebben, dat wij Hem zouden aanroepen?", "Jes 5:12-30": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst. Daarom zal het graf zichzelf wijd opensperren, en zijn mond zonder maat opendoen; zodat haar heerlijkheid, en haar menigte, met haar gedruis, en wie daarin van vreugde opspringt, erin neerdaalt.", "2 Petr 2:12-17": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Num 32:23": "Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!", "Rom 12:1": "Ik smeek u dan, broeders, door de ontfermingen van God, dat u uw lichamen stelt tot een levend, heilig en Gode welbehaaglijk offer, dat is uw redelijke godsdienst.", "Matt 22:23": "Diezelfde dag kwamen de Sadduceeën naar Hem toe, die zeggen dat er geen opstanding is, en vroegen Hem,", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Spr 19:10": "De weelde past een dwaas niet; hoeveel te minder past het een knecht om te heersen over vorsten!", "Matt 15:14": "Laat hen gaan; zij zijn blinde leiders van blinden. Als nu de blinde de blinde leidt, zullen zij beiden in de gracht vallen.", "Ps 109:6-19": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "Jer 48:7": "Want om uw vertrouwen op uw werken, en op uw schatten, zult u ook ingenomen worden; en Kamos zal weggaan in gevangenschap, zijn priesters en zijn vorsten samen.", "2 Kron 33:5": "Daartoe bouwde hij altaren voor heel het leger van de hemel, in beide voorhoven van het huis van de HEERE.", "Jes 66:6": "Er zal een stem van een groot rumoer uit de stad zijn, een stem uit de tempel, de stem van de HEERE, Die Zijn vijanden de verdiensten vergeldt.", "Ex 3:9": "En nu, zie, het geschrei van de kinderen van Israël is tot Mij gekomen; en ook heb Ik de verdrukking gezien waarmee de Egyptenaren hen verdrukken.", "Ezech 8:16": "En Hij bracht mij tot de binnenste voorhof van het huis van de HEERE; en zie, aan de deur van de tempel van de HEERE, tussen het voorhuis en het altaar, waren ongeveer vijfentwintig mannen; hun achterste lichaamsdelen waren naar de tempel van de HEERE, en hun gezichten naar het oosten, en zij bogen zich neer naar het oosten voor de zon.", "1 Kon 18:21": "Toen naderde Elia tot heel het volk, en zei: Hoe lang hinkt u op twee gedachten? Als de HEERE God is, volg Hem na, en als het Baäl is, volg hem na! Maar het volk antwoordde hem geen woord.", "Ps 73:3-22": "Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris. Zij zijn niet in de moeite zoals andere mensen, en worden niet met andere mensen geplaagd.", "Hand 1:25": "om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "Hand 1:18": "Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "Ps 107:11": "Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Jer 23:10": "Want het land is vol overspelers, want het land treurt vanwege de vloek, de weiden van de woestijn verdorren, omdat hun loop slecht is, en hun macht niet recht.", "Spr 10:27-31": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Job 35:3": "Want u hebt gezegd: Wat zou het u baten? Wat voor meer voordeel zal ik daarmee doen, dan met mijn zonde?", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Jer 5:17": "En het zal uw oogst en uw brood opeten, dat uw zonen en uw dochters zouden eten; het zal uw schapen en uw runderen opeten; het zal uw wijnstok en uw vijgenboom opeten; uw vaste steden, waarop u vertrouwt, zal het arm maken door het zwaard.", "Ps 46:11": "Laat af, en weet, dat Ik God ben; Ik zal verhoogd worden onder de heidenen, Ik zal verhoogd worden op de aarde.", "Matt 1:10": "en Hizkia verwekte Manasse, en Manasse verwekte Amon, en Amon verwekte Josia;", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "Ezech 14:3": "Mensenkind, deze mannen hebben hun drekgoden in hun hart opgezet, en hebben de aanstoot van hun ongerechtigheid recht voor hun aangezicht gezet; zou Ik dan werkelijk door hen geraadpleegd worden?", "Ps 89:32": "als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;", "Ps 107:17": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Ps 78:19-22": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn? Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden? Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Neh 9:26": "Maar zij zijn opstandig geworden, en hebben tegen U gerebelleerd, en Uw wet achter hun rug geworpen, en Uw profeten gedood die tegen hen getuigden, om hen te doen terugkeren tot U; zo hebben zij grote lasteringen gedaan.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Amos 6:13": "U, die blij bent over een nietig ding; u, die zegt: Hebben wij niet door onze eigen kracht hoorns voor onszelf verkregen?", "Jer 5:1-31": "Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn. En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals. HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.", "Hand 23:3": "Toen zei Paulus tegen hem: God zal u slaan, u witgepleisterde muur! Zit u daar om mij naar de wet te oordelen, en beveelt u, tegen de wet in, dat men mij zal slaan?", "2 Tess 1:5-9": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Ezech 8:3-5": "En Hij stak de gelijkenis van een hand uit, en nam mij bij het haar van mijn hoofd; en de Geest voerde mij op tussen de aarde en de hemel, en bracht mij in visioenen van God naar Jeruzalem, tot de deur van de poort van de binnenste voorhof, die uitziet naar het noorden, waar de zitplaats was van een beeld van de ijver, dat tot ijver opwekt. En zie, de heerlijkheid van de God van Israël was daar, naar de gedaante die ik in de vallei gezien had. En Hij zei tegen mij: Mensenkind, hef nu uw ogen op naar de weg van het noorden; en ik hief mijn ogen op naar de weg van het noorden, en zie, tegen het noorden aan de poort van het altaar was dit beeld van de ijver, in de ingang.", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Job 31:13": "Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij;", "Job 33:10": "Zie, Hij vindt oorzaken tegen mij, Hij houdt mij voor Zijn vijand.", "Spr 11:5-8": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid. De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid. Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Zef 3:3": "Haar vorsten zijn brullende leeuwen in haar midden; haar rechters zijn avondwolven, die de beenderen niet breken tot aan de morgen.", "Richt 2:12": "En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "Jes 14:26": "Dit is de raadslag, die beraadslaagd is over dat hele land; en dit is de hand, die uitgestrekt is over alle volken.", "Ezech 33:30": "En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt.", "Num 15:30": "Maar de ziel die iets doet met opgeheven hand, hetzij van inboorlingen of van vreemdelingen, die smaadt de HEERE; en die ziel zal uitgeroeid worden uit het midden van haar volk;", "Amos 6:1-7": "Wee de geruste mensen in Sion, en degenen die zeker zijn op de berg van Samaria! Zij zijn de voornaamste van de eerstelingen der volken, en tot hen komen die van het huis van Israël. Ga over naar Kalne, en zie toe; en ga vandaar naar Hamath, de grote stad, en trek af naar Gath van de Filistijnen; zijn zij beter dan deze koninkrijken, of is hun gebied groter dan uw gebied? U, die de kwade dag ver weg zet, en de zetel van het geweld dichtbij brengt.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Ezech 3:20": "Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "1 Tess 4:16": "Want de Heere Zelf zal met een geroep, met de stem van de aartsengel, en met de bazuin van God neerdalen van de hemel; en zij die in Christus gestorven zijn, zullen eerst opstaan;", "2 Kron 33:3": "Want hij bouwde de hoogten weer op, die zijn vader Jehizkia afgebroken had, en richtte voor de Baäls altaren op, en maakte offerbossen, en boog zich neer voor heel het leger van de hemel, en diende ze.", "Micha 6:13": "zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.", "Job 15:20-24": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Spr 13:21": "Het kwaad zal de zondaars vervolgen; maar de rechtvaardige zal men met goed vergelden.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Jes 5:7": "Want de wijngaard van de HEERE van de heerscharen is het huis van Israël, en de mannen van Juda zijn een plant van Zijn welbehagen; en Hij heeft gewacht op recht, maar zie, het is onderdrukking; op gerechtigheid, maar zie, het is geschreeuw.", "Ps 64:6": "Zij sterken zichzelf in een boze zaak; zij overleggen om strikken te verbergen; zij zeggen: Wie zal ze zien?", "Matt 15:19": "Want uit het hart komen voort boze overwegingen, doodslagen, overspelen, hoererijen, dieverijen, valse getuigenissen, lasteringen.", "Matt 25:5": "Toen de bruidegom uitbleef, werden zij allemaal slaperig, en vielen in slaap.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "Deut 28:39": "Wijngaarden zult u planten en bewerken, maar u zult geen wijn drinken, noch iets vergaren; want de worm zal het opeten.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Matt 21:44": "En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.", "Jer 24:8-10": "En zoals de slechte vijgen, die vanwege de slechtheid niet gegeten kunnen worden (want zo zegt de HEERE), zo zal Ik Zedekia, de koning van Juda, maken, alsook zijn vorsten, en het overblijfsel van Jeruzalem, die in dit land zijn overgebleven, en die in het land Egypte wonen; En Ik zal hen overgeven tot een verschrikking voor alle koninkrijken van de aarde, tot hun kwaad; tot smaad, en tot een spreekwoord, tot een spotrede, en tot een vloek, in alle plaatsen waarheen Ik hen verdreven zal hebben; En Ik zal onder hen zenden het zwaard, de honger en de pest, totdat zij verteerd zullen zijn uit het land, dat Ik hun en hun vaderen gegeven had.", "Hos 4:16": "Want Israël is koppig, als een koppige koe; nu zal de Heere hen weiden, als een lam in de ruimte.", "Jer 2:13": "Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Ezech 5:8-17": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Luk 16:19-26": "En er was een zeker rijk mens, en die was gekleed met purper en zeer fijn linnen, en leefde elke dag vrolijk en overvloedig. En er was een zekere bedelaar, met de naam Lazarus, die voor zijn poort lag, vol zweren; En hij verlangde verzadigd te worden van de kruimels die van de tafel van de rijke vielen; maar ook de honden kwamen en likten zijn zweren.", "Micha 7:13": "Maar dit land zal worden tot een verwoesting, vanwege zijn inwoners, vanwege de vrucht van hun handelingen.", "Spr 1:22": "U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Spr 3:28": "Zeg niet tegen uw naaste: Ga heen, en kom terug, en morgen zal ik geven, terwijl u het bij u hebt.", "Ezech 24:14": "Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.", "Jer 7:17-20": "Ziet u niet wat zij doen in de steden van Juda en op de straten van Jeruzalem? De kinderen rapen hout, en de vaders steken het vuur aan, en de vrouwen kneden het deeg, om koeken te maken voor de koningin van de hemel, en drankoffers te offeren aan andere goden, om Mij verdriet aan te doen. Doen zij Mij verdriet aan? spreekt de HEERE. Doen zij het zichzelf niet aan, tot beschaming van hun eigen aangezicht?", "Spr 11:19": "Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.", "Jer 49:5": "Zie, Ik zal vrees over u brengen, spreekt de Heere, de HEERE van de heerscharen, van allen die rondom u zijn, en u zult, ieder voor zich heen, weggedreven worden, en niemand zal hen die omzwerven bijeenbrengen.", "Hand 7:42": "En God keerde Zich af, en gaf hen over om het leger van de hemel te dienen, zoals geschreven staat in het boek van de profeten: Hebt u soms slachtoffers en offers aan Mij gebracht, veertig jaar lang in de woestijn, huis van Israël?", "1 Kor 14:8": "Want ook als de bazuin een onzeker geluid geeft, wie zal zich dan voorbereiden op de strijd?", "Jes 3:18-24": "Op diezelfde dag zal de Heere wegnemen het sieraad van de kousebanden, en de netjes, en de maantjes, De reukdoosjes, en de kleine ketentjes, en de glinsterende kledingen, De hoofdkroning, en de armversierselen, en de bindselen, en de reukballetjes, en de oorringen,", "Matt 11:23": "En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.", "Spr 21:12": "De rechtvaardige let verstandig op het huis van de goddeloze, als God de goddelozen in het kwaad stort.", "Amos 5:26": "Ja, u droeg de tent van uw Melech, en de Kijun, uw beelden, de ster van uw god, die u zelf gemaakt had.", "Spr 28:26": "Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.", "Jes 8:22": "als hij de aarde aanschouwen zal, zie, dan zal er benauwdheid en duisternis zijn; hij zal verduisterd zijn door angst, en voortgedreven door donkerheid.", "Ezech 12:22": "Mensenkind, wat is dit voor een spreekwoord dat u hebt in het land Israël, namelijk: de dagen worden verlengd, en elk visioen vervalt?", "2 Sam 3:39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.", "Hos 8:1": "De bazuin aan uw mond; hij komt als een arend tegen het huis van de Heere; omdat zij Mijn verbond hebben overtreden, en tegen Mijn wet in opstand zijn gekomen.", "Jer 43:2": "Toen zei Azaria, de zoon van Hosaja, en Johanan, de zoon van Kareah, en alle trotse mannen, tegen Jeremia: U spreekt leugen; de HEERE, onze God, heeft u niet gezonden, om te zeggen: U zult niet naar Egypte gaan, om daar als vreemdelingen te verblijven.", "Deut 4:19": "Dat u ook uw ogen niet opheft naar de hemel, en de zon aanziet, en de maan, en de sterren, heel het leger van de hemel; en zich laat verleiden om u daarvoor te buigen en ze te dienen; die de HEERE, uw God, aan alle volken onder de hele hemel heeft toebedeeld.", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "Hebr 12:25": "Zie erop toe dat u Hem, Die spreekt, niet verwerpt; want als dezen niet ontkomen zijn, die hem verwierpen die op aarde Goddelijke antwoorden gaf, hoeveel te meer zullen wij niet ontkomen, als wij ons afkeren van Hem Die van de hemelen is;", "Ps 55:20": "God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.", "Ps 143:3": "Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Luk 12:19-21": "en ik zal tegen mijn ziel zeggen: Ziel, je hebt veel goederen liggen, voor vele jaren; neem rust, eet, drink, wees vrolijk. Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn? Zo gaat het met wie voor zichzelf schatten verzamelt, en niet rijk is in God.", "Ps 49:7": "Aangaande hen die op hun bezit vertrouwen, en op de overvloed van hun rijkdom roemen;", "Deut 32:18": "De Rotssteen, Die u verwekt heeft, bent u vergeten; en u hebt de God, Die u gebaard heeft, in vergetelheid gesteld.", "Zach 13:2": "En het zal op die dag gebeuren, spreekt de HEERE van de heerscharen, dat Ik de namen van de afgoden uit het land zal uitroeien, zodat er niet meer aan gedacht wordt; en ook de profeten en de onreine geest zal Ik uit het land wegdoen.", "2 Kon 17:33": "Zij vreesden de HEERE, en dienden ook hun eigen goden, naar de wijze van de volken van wie zij weggevoerd waren.", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "Ezech 33:27-29": "Zo zult u tegen hen zeggen: Zo zegt de Heere HEERE: Zo waarachtig als Ik leef, wie in die verwoeste plaatsen zijn, zullen door het zwaard vallen, en wie op het open veld is, die zal Ik aan het wilde gedierte overgeven om hem te verslinden, en wie in de vestingen en in de holen zijn, zullen door de pest sterven! Want Ik zal het land tot een verwoesting en een schrik maken, en aan de trots van zijn kracht zal een einde komen; en de bergen van Israël zullen woest zijn, zodat niemand er meer doorheen trekt. Dan zullen zij weten dat Ik de HEERE ben, wanneer Ik het land tot een verwoesting en een schrik gemaakt heb, om al hun gruwelen die zij gedaan hebben.", "Hos 12:8": "In de hand van de koopman is een bedrieglijke weegschaal, hij houdt ervan te verdrukken;", "Hos 9:15": "Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "Job 22:12-14": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn. Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen? De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Jes 10:3": "Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "Ezech 22:6": "Zie, de vorsten van Israël zijn in u geweest, ieder naar zijn kracht, om bloed te vergieten.", "1 Kor 12:3": "Daarom maak ik u bekend, dat niemand die door de Geest van God spreekt, Jezus een vervloeking noemt; en niemand kan zeggen dat Jezus de Heere is, dan door de Heilige Geest.", "Jer 6:14": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Doch daar is geen vrede.", "Matt 12:24": "Maar de Farizeeën hoorden dit en zeiden: Deze werpt de duivels niet anders uit dan door Beëlzebul, de leider van de duivels.", "Ps 94:7": "En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Jer 17:5": "Zo zegt de HEERE: Vervloekt is de man die op een mens vertrouwt, en vlees tot zijn arm stelt, en wiens hart van de HEERE afwijkt!", "Job 34:16-19": "Zo er dan verstand bij u is, hoor dit; neig de oren tot de stem van mijn woorden. Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen? Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen!", "Ps 75:9": "Want in de hand van de HEERE is een beker, en de wijn is beroerd, vol van mengeling, en Hij schenkt daaruit; doch alle goddelozen van de aarde zullen zijn droesems drinken, terwijl ze die uitzuigen.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Ps 107:12": "Daarom heeft Hij hun hart door zwarigheid vernederd; zij zijn gestruikeld, en er was geen helper.", "Jona 1:6": "En de opperschipper kwam naar hem toe, en zei tegen hem: Wat is er met u, harde slaper? Sta op, roep tot uw God; misschien zal die God aan ons denken, zodat wij niet vergaan.", "Ps 76:9": "U deed een oordeel horen uit de hemel; de aarde vreesde en werd stil,", "Ps 78:20": "Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden?", "Micha 6:15": "U zult zaaien, maar niet maaien; u zult olijven treden, maar u met olie niet zalven, en most, maar geen wijn drinken.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "2 Kon 24:13": "En hij bracht van daar al de schatten van het huis van de HEERE, en de schatten van het huis van de koning; en hij hakte alle gouden vaten stuk die Salomo, de koning van Israël, in de tempel van de HEERE gemaakt had, zoals de HEERE gesproken had.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Jer 2:31": "Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?", "Ps 28:5": "Omdat zij niet letten op de daden van de HEERE, en ook niet op het werk van Zijn handen, zal Hij hen afbreken en niet meer opbouwen.", "Ezech 36:6": "Daarom profeteer van het land van Israël, en zeg tot de bergen en tot de heuvels, tot de stromen en tot de dalen: Zo zegt de Heere HEERE: Ziet, Ik heb in Mijn ijver en in Mijn grimmigheid gesproken, omdat u de smaad van de heidenen gedragen hebt;", "Job 19:7": "Zie, ik roep: geweld! maar word niet verhoord; ik schreeuw, maar er is geen recht.", "Micha 7:10": "En mijn vijandin zal het zien, en schaamte zal haar bedekken; zij die tegen mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen op haar neerzien; nu zal zij worden tot vertreding, als slijk van de straten.", "Deut 11:26": "Zie, ik stel u heden voor: zegen en vloek:", "Luk 16:22": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven.", "Ps 10:13": "Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?", "Dan 3:15": "Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, dan is het goed; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen?", "Fil 4:18": "Maar ik heb alles ontvangen, en ik heb overvloed; ik ben vervuld geworden, nu ik van Epafroditus ontvangen heb wat door u gestuurd was, als een welriekende geur, een aangenaam offer, God welgevallig.", "2 Kron 32:22": "Zo verloste de HEERE Jehizkia en de inwoners van Jeruzalem uit de hand van Sanherib, de koning van Assyrië, en uit de hand van allen; en Hij leidde hen aan alle zijden.", "Zach 5:4": "Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Jes 33:12": "En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.", "Jes 27:9": "Daarom zal daardoor de ongerechtigheid van Jakob verzoend worden, en dit is de hele vrucht, dat Hij zijn zonde zal wegdoen: wanneer Hij alle stenen van het altaar maakt als verstrooide kalkstenen, zullen de bossen en de zonnebeelden niet blijven bestaan.", "Ps 9:6": "Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.", "Deut 28:25-68": "De HEERE zal geven dat u verslagen wordt voor uw vijanden; door één weg zult u tegen hem uittrekken, en door zeven wegen zult u voor hem vluchten; en u zult heen en weer gedreven worden onder alle koninkrijken van de aarde. En uw dode lichaam zal voedsel zijn voor alle vogels van de hemel, en voor de dieren van de aarde; en niemand zal ze verjagen. De HEERE zal u slaan met zweren van Egypte, en met gezwellen, en met droge schurft, en met huiduitslag, waarvan u niet zult kunnen genezen.", "Openb 19:17-21": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Luk 22:33": "En hij zei tegen Hem: Heere, ik ben bereid, met U ook in de gevangenis en in de dood te gaan.", "Jer 44:23": "Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.", "Luk 12:15-21": "En Hij zei tegen hen: Kijk uit en wees op uw hoede voor hebzucht; want het leven van iemand hangt niet af van de overvloed van zijn bezittingen. En Hij vertelde hun een gelijkenis: Het land van een rijke man had veel opgebracht; en hij overlegde bij zichzelf en zei: Wat zal ik doen, want ik heb geen plaats waar ik mijn vruchten kan verzamelen.", "Matt 8:9": "Want ik ben ook een mens onder het gezag van anderen, en heb soldaten onder mij; en ik zeg tegen deze: Ga! en hij gaat; en tegen de ander: Kom! en hij komt; en tegen mijn dienstknecht: Doe dit! en hij doet het.", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Hand 17:32": "Toen zij nu van de opstanding van de doden hoorden, spotten sommigen daarmee; en sommigen zeiden: Wij zullen u hierover een andere keer horen.", "Openb 18:11-18": "En de kooplieden van de aarde zullen wenen en rouw bedrijven over haar, omdat niemand hun waren meer koopt; Waren van goud, en van zilver, en van kostbaar gesteente, en van parels, en van fijn linnen, en van purper, en van zijde, en van scharlaken; en allerlei welriekend hout, en allerlei ivoren vaten, en allerlei vaten van het kostbaarste hout, en van koper, en van ijzer, en van marmersteen; En kaneel, en reukwerk, en welriekende zalf, en wierook, en wijn, en olie, en meelbloem, en tarwe, en lastdieren, en schapen; en van paarden, en van wagens, en van lichamen, en de zielen van de mensen.", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschul
