n ook de Farizeeën, die geldgierig waren, en zij beschimpten Hem.", "Joël 3:14": "Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing.", "Zach 5:2-4": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el. Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden. Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Hos 5:1-15": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor. En zij die afwijken, verdiepen zich erin om te slachten; maar Ik zal hun allen een tuchtmeester zijn. Ik ken Efraïm, en Israël is voor Mij niet verborgen; want nu, Efraïm, hoereert u, en Israël is verontreinigd.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "Openb 16:9": "En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.", "Jes 3:8": "Want Jeruzalem is gestruikeld, en Juda is gevallen, omdat hun tong en hun daden tegen de HEERE zijn, om de ogen van Zijn heerlijkheid te verbitteren.", "Jes 57:13": "Wanneer u zult roepen, laat dan degenen die door u verzameld zijn, u redden; maar de wind zal hen allemaal wegvoeren, de leegte zal hen wegnemen. Maar wie op Mij vertrouwt, die zal het land erven, en Mijn heilige berg in bezit krijgen.", "Jer 18:21": "Daarom, geef hun zonen over aan de honger, en doe hen wegvloeien door het geweld van het zwaard, en laat hun vrouwen van kinderen beroofd en weduwe worden, en laat hun mannen door de dood omgebracht worden, en hun jongemannen met het zwaard geslagen worden in de strijd.", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Spr 17:15": "Wie de goddeloze rechtvaardigt, en de rechtvaardige veroordeelt, zijn de HEERE een gruwel, zij beiden.", "Fil 2:17": "Ja, ook al word ik tot een drankoffer geofferd over de offerande en bediening van uw geloof, dan verblijd ik mij, en verblijd ik mij met u allen.", "Job 34:37": "Want tot zijn zonde zou hij nog overtreding bijvoegen; hij zou onder ons in de handen klappen, en hij zou zijn redenen vermenigvuldigen tegen God.", "Jes 30:33": "Want Tofeth is van oudsher bereid; ja, hij is ook voor de koning bereid; Hij heeft hem diep en wijd gemaakt, het vuur en hout van zijn brandstapel is veel; de adem van de HEERE zal hem aansteken als een zwavelstroom.", "Klaagl 2:22": "Thau. Gij hebt mijn verschrikkingen van rondom geroepen, als tot een dag van een gezet hoogtijd; en er is niemand aan de dag van de toorn van de HEERE ontkomen of overgebleven; die ik op de handen gedragen en opgevoed heb, die heeft mijn vijand omgebracht.", "Jer 12:12": "Op alle hoge plaatsen in de woestijn zijn verstoorders gekomen; want het zwaard van de HEERE verteert van het ene einde van het land tot aan het andere einde van het land; er is geen vrede voor enig vlees.", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Hand 13:45": "Doch de Joden, die de menigten zagen, werden vervuld met afgunst, en weerspraken wat door Paulus gezegd werd, en tegenspraken en lasterden.", "Jer 5:27-29": "Zoals een kooi vol is van vogels, zo zijn hun huizen vol van bedrog; daarom zijn zij groot en rijk geworden. Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet. Zou Ik hierom geen straf brengen? spreekt de HEERE; zou Mijn ziel zich niet wreken aan zo'n volk als dit is?", "Luk 13:9": "en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Matt 25:24-27": "Maar hij die het ene talent ontvangen had, kwam ook en zei: Heer, ik kende u, dat u een hard mens bent, die maait waar u niet gezaaid hebt, en verzamelt vandaar waar u niet gestrooid hebt; En ik was bang, en ben weggegaan, en heb uw talent verborgen in de aarde; zie, u hebt het uwe. Maar zijn heer antwoordde en zei tegen hem: U slechte en luie dienstknecht! U wist dat ik maai waar ik niet gezaaid heb, en vandaar verzamel waar ik niet gestrooid heb.", "Jes 29:16": "Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.", "Jer 9:22": "Spreek: Zo spreekt de HEERE: Ja, een dood lichaam van de mens zal liggen, als mest op het open veld, en als een schoof achter de maaier, die niemand opzamelt.", "Jer 2:11-13": "Heeft ook een volk de goden veranderd, hoewel die geen goden zijn? Toch heeft Mijn volk zijn Eer veranderd in iets dat geen nut doet. Ontzet u hierover, hemelen, en wees verschrikt, word zeer woest, spreekt de HEERE. Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Job 39:38": "Eenmaal heb ik gesproken, maar zal niet antwoorden; of tweemaal, maar zal niet voortvaren.", "Job 4:9": "Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Ps 78:56-64": "Maar zij verzochten en verbitterden God, de Allerhoogste, en onderhielden Zijn getuigenissen niet. En zij weken terug, en handelden trouweloos, zoals hun vaders; zij zijn omgekeerd, als een bedrieglijke boog. En zij verwekten Hem tot toorn door hun hoogten, en verwekten Hem tot ijver door hun gesneden beelden.", "Joël 3:13-16": "Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot. Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing. De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Ezech 13:10": "Daarom, ja, daarom dat zij Mijn volk verleiden, en zeggen: Vrede, terwijl er geen vrede is; en dat de een een lemen wand bouwt, en zie, de anderen die pleisteren met loze kalk.", "Jes 3:14": "De HEERE komt ten gerichte tegen de oudsten van Zijn volk en hun vorsten, want u hebt deze wijngaard verteerd; de roof van de ellendige is in uw huizen.", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Lev 6:2-7": "Als een mens gezondigd heeft en tegen de HEERE door overtreding overtreden zal hebben, doordat hij tegen zijn naaste gelogen heeft over iets dat hem in bewaring gegeven was, of ter hand gesteld was, of over roof, of dat hij met geweld zijn naaste iets onthoudt; Of dat hij het verlorene gevonden heeft, en daarover gelogen heeft, en met valsheid gezworen zal hebben; over iets van alles dat de mens doet, waarin hij zo zondigt. Dan zal het gebeuren, omdat hij gezondigd heeft en schuldig geworden is, dat hij zal teruggeven de roof die hij geroofd heeft, of het onthoudene dat hij met geweld onthoudt, of het bewaarde dat bij hem te bewaren gegeven was, of het verlorene dat hij gevonden heeft;", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "Ef 6:5-9": "U dienstknechten, wees gehoorzaam aan uw heren naar het vlees, met vrees en beven, in eenvoud van uw hart, zoals aan Christus; niet uit ogendienst, als mensenbehagers, maar als dienstknechten van Christus, terwijl u de wil van God doet van harte; terwijl u dient met goedwilligheid de Heere, en niet de mensen;", "Amos 4:2": "De Heere HEERE heeft gezworen bij Zijn heiligheid, dat er, zie, dagen over u zullen komen, dat men u zal optrekken met haken, en uw nakomelingen met visangels.", "Job 18:6": "Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Deut 32:21-25": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken. Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten. Ik zal kwaad over hen ophopen; Mijn pijlen zal Ik op hen verschieten.", "Job 39:28": "In het volle geschal van de bazuin, zegt het: Heah! en ruikt de krijg van verre, de donder van de vorsten en het gejuich.", "Jer 15:1": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan.", "Jes 28:18": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden.", "Ps 10:11-13": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit. Sta op, HEERE God! Hef Uw hand op, vergeet de ellendigen niet. Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?", "Jes 17:11": "Op de dag dat u ze plant, zult u ze doen groeien, en in de morgenstond zult u uw zaad doen bloeien; maar het zal maar een hoop zijn van het gemaaide, op de dag van ziekte en van pijnlijke smart.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Spr 27:18": "Wie de vijgenboom bewaakt, zal zijn vrucht eten; en wie zijn heer waarneemt, zal geëerd worden.", "Hand 23:8": "Want de Sadduceeën zeggen dat er geen opstanding is, en ook geen engel of geest; maar de Farizeeën belijden het beide.", "Job 36:23": "Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?", "Job 19:15": "Mijn huisgenoten en mijn dienstmaagden achten mij als een vreemde; een buitenlander ben ik in hun ogen.", "Neh 5:15": "En de vorige landvoogden, die vóór mij geweest zijn, hebben het volk bezwaard en van hen genomen aan brood en wijn, daarna veertig zilveren sikkels; ook heersten hun knechten over het volk; maar ik heb dat niet gedaan, om de vreze van God.", "Jer 8:16": "Vanuit Dan wordt het gesnuif van zijn paarden gehoord; het hele land beeft van het geluid van het gebries van zijn sterke dieren; en zij komen daarheen om het land op te eten en al wat het bevat, de stad en wie daarin wonen.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Jes 32:14": "Want het paleis zal verlaten zijn, het gewoel van de stad zal ophouden; Ofel en de wachttorens zullen tot spelonken zijn, tot in eeuwigheid, een vreugde van de woudezels, een weide voor de kudden.", "Jer 9:4-6": "Wacht u, ieder voor zijn vriend, en vertrouw niet op enige broeder; want elke broeder doet niet dan bedriegen, en elke vriend gaat om met achterklap. En zij bedriegen, ieder zijn vriend, en spreken de waarheid niet; zij leren hun tong leugen spreken, zij maken zich moe met verkeerd te handelen. Uw woning is in het midden van bedrog; door bedrog weigeren zij Mij te kennen, spreekt de HEERE.", "Deut 4:25-31": "Wanneer u nu kinderen en kleinkinderen verwekt hebt, en oud geworden bent in het land, en u zich te gronde richt door gesneden beelden te maken, de gelijkenis van iets, en door te doen wat kwaad is in de ogen van de HEERE, uw God, om Hem tot toorn te verwekken; Dan roep ik vandaag de hemel en de aarde tot getuige tegen u, dat u zeker snel zult omkomen uit het land waar u de Jordaan voor oversteekt om het in bezit te nemen; u zult uw dagen daarin niet verlengen, maar helemaal uitgeroeid worden. En de HEERE zal u verstrooien onder de volken; en u zult met weinigen in getal overblijven onder de heidenvolken waarheen de HEERE u zal leiden.", "Deut 31:16-30": "En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb. Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is? Ik dan zal Mijn aangezicht op die dag geheel en al verbergen, om al het kwaad dat het gedaan heeft; want het heeft zich gewend tot andere goden.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Jer 46:15-17": "Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat de HEERE hen voortdreef. Hij maakte de struikelende velen; ja, de een viel op de ander; zodat zij zeiden: Staat op en laat ons wederkeren tot ons volk, en tot het land van onze geboorte, vanwege het verdrukkende zwaard. Daar riepen zij: Farao, de koning van Egypte, is maar een gedruis; hij heeft de gezette tijd laten voorbijgaan.", "Jer 9:8": "Hun tong is een moordpijl, zij spreekt bedrog; ieder spreekt met zijn naaste van vrede met zijn mond, maar in zijn binnenste legt hij lagen.", "Ps 14:1": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet.", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "Ps 123:2": "Zie, zoals de ogen van de knechten zijn op de hand van hun heren, zoals de ogen van de dienstmaagd zijn op de hand van haar meesteres, zo zijn onze ogen op de HEERE, onze God, totdat Hij ons genadig is.", "Job 34:5": "Want Job heeft gezegd: Ik ben rechtvaardig, en God heeft mijn recht weggenomen.", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "2 Petr 2:20-22": "Want als zij, nadat zij door de kennis van de Heere en Zaligmaker Jezus Christus aan de besmettingen van de wereld ontkomen zijn, daar opnieuw in verstrikt raken en erdoor overwonnen worden, dan is voor hen het laatste erger geworden dan het eerste. Want het zou beter voor hen geweest zijn de weg van de gerechtigheid niet gekend te hebben, dan die gekend te hebben en zich weer af te keren van het heilige gebod dat hun overgeleverd was. Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Jer 4:2": "Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.", "Jes 5:21": "Wee hun die in hun eigen ogen wijs, en naar hun eigen oordeel verstandig zijn!", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Rom 14:13": "Laten wij elkaar dan niet meer oordelen; maar oordeelt dit liever, namelijk dat u de broeder geen aanstoot of ergernis geeft.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Amos 8:5": "En zegt: Wanneer is de nieuwe maan voorbij, zodat wij koren mogen verkopen? en de sabbat, zodat wij graan mogen aanbieden? terwijl u de efa verkleint en de sikkel vergroot, en verkeerd handelt met bedrieglijke weegschalen;", "Pred 5:13": "Of die rijkdom zelf gaat verloren door een moeilijke bezigheid; en hij verwekt een zoon, en er is helemaal niets in zijn hand.", "Jes 10:15": "Zal een bijl zich beroemen tegen hem die daarmee houwt? Zal een zaag pochen tegen hem die ze trekt? Alsof een staf beweegt wie hem opheffen? Als men een stok opheft, is het geen hout?", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Jes 5:30": "En zij zullen op die dag tegen hen bruisen, als het bruisen van de zee. Als men dan naar het land kijkt, zie, dan is er duisternis en benauwdheid, en het licht zal verduisterd worden in de wolken erboven.", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "Jes 24:21": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.", "Lev 26:33-35": "Daartoe zal Ik u onder de heidenen verstrooien; en een zwaard achter u trekken; en uw land zal woest zijn, en uw steden zullen een woestijn zijn. Dan zal het land aan zijn sabbatten een welgevallen hebben, al de dagen van de verwoesting, terwijl u in het land van uw vijanden bent; dan zal het land rusten, en aan zijn sabbatten een welgevallen hebben. Al de dagen van de verwoesting zal het rusten, omdat het niet rustte in uw sabbatten, toen u daarin woonde.", "Ezech 28:5": "Door de grootheid van uw wijsheid in uw koophandel hebt u uw vermogen vermeerderd, en uw hart verheft zich vanwege uw vermogen.", "Pred 10:5-7": "Er is nog een kwaad dat ik gezien heb onder de zon, als een dwaling die van het aangezicht van de leider voortkomt. Een dwaas wordt gezet in grote hoogheden, maar de rijken zitten in de laagte. Ik heb knechten te paard gezien, en vorsten die als knechten op de aarde gingen.", "Jes 30:16": "En u zegt: Nee, maar op paarden zullen wij vluchten; daarom zult u vluchten! En: Op snelle paarden zullen wij rijden; daarom zullen uw vervolgers ook snel zijn!", "Job 31:24": "Als ik het goud tot mijn hoop gezet heb, of tot het fijn goud gezegd heb: U bent mijn vertrouwen;", "Jak 5:4": "Zie, het loon van de arbeiders die uw landen gemaaid hebben, dat door u is achtergehouden, roept; en het geschrei van hen die geoogst hebben, is gekomen tot in de oren van de Heere Sebaoth.", "Jes 59:14": "Daarom is het recht achterwaarts geweken, en de gerechtigheid staat ver weg; want de waarheid struikelt op de straat, en wat recht is, kan er niet ingaan.", "Job 22:17": "Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?", "Hos 10:13": "U hebt goddeloosheid geploegd, verkeerdheid gemaaid, en de vrucht van de leugen gegeten; want u hebt vertrouwd op uw eigen weg, op de veelheid van uw helden.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Ezech 30:8": "En zij zullen weten dat Ik de HEERE ben, als Ik een vuur in Egypte zal hebben aangestoken, en al zijn helpers zullen verbroken worden.", "Jak 5:1": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen.", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Ezech 29:6": "En alle inwoners van Egypte zullen weten dat Ik de HEERE ben, omdat zij voor het huis van Israël een rietstok geweest zijn.", "2 Kon 22:1": "Josia was acht jaar oud, toen hij koning werd, en regeerde eenendertig jaar te Jeruzalem; en de naam van zijn moeder was Jedida, een dochter van Adaja, uit Bozkath.", "2 Petr 1:9": "Want bij wie deze dingen niet aanwezig zijn, die is blind, kan niet ver zien, en is vergeten dat hij gereinigd is van zijn vroegere zonden.", "Ezech 14:7": "Want ieder man uit het huis van Israël, en uit de vreemdeling die in Israël verblijft, die zich van achter Mij afscheidt, en zijn drekgoden opzet in zijn hart, en de aanstoot van zijn ongerechtigheid recht voor zijn aangezicht zet, en komt tot de profeet om Mij door hem te raadplegen; Ik ben de HEERE, hem zal door Mij geantwoord worden;", "Amos 2:2": "Daarom zal Ik een vuur in Moab zenden, dat zal de paleizen van Kerioth verteren; en Moab zal sterven met groot gedruis, met gejuich, met geluid van de bazuin.", "2 Petr 2:18-22": "Want zij spreken zeer opgeblazen, holle woorden, en verleiden door de begeerten van het vlees en door losbandigheid hen die net ontkomen waren aan degenen die in dwaling wandelen; zij beloven hun vrijheid, terwijl zijzelf slaven zijn van de verdorvenheid; want door wie iemand overwonnen is, daarvan is hij ook tot een slaaf gemaakt. Want als zij, nadat zij door de kennis van de Heere en Zaligmaker Jezus Christus aan de besmettingen van de wereld ontkomen zijn, daar opnieuw in verstrikt raken en erdoor overwonnen worden, dan is voor hen het laatste erger geworden dan het eerste.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Ps 53:5": "Hebben dan de werkers van de ongerechtigheid geen kennis, die Mijn volk opeten, alsof zij brood aten? Zij roepen God niet aan.", "1 Kor 10:22": "Of willen wij de Heere tot jaloersheid tergen? Zijn wij soms sterker dan Hij?", "Spr 24:9": "De gedachte van de dwaasheid is zonde; en een spotter is de mensen een gruwel.", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Pred 4:1": "Daarna richtte ik mijn aandacht en zag alle onderdrukkingen die onder de zon gebeuren; en zie, er waren de tranen van de verdrukten, en van hen die geen trooster hadden; en aan de kant van hun verdrukkers was macht, zij daarentegen hadden geen trooster.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Ps 78:40-43": "Hoe dikwijls verbitterden zij Hem in de woestijn, deden zij Hem smart aan in de wildernis! Want zij kwamen telkens terug, en verzochten God, en stelden de Heilige van Israël een grens. Zij dachten niet aan Zijn hand, aan de dag, toen Hij hen verloste van de tegenstander;", "Job 24:24": "Zij zijn een korte tijd verheven, daarna is er niemand meer van hen; zij worden neergedrukt; net als alle anderen worden zij weggenomen; en net als de top van een aar worden zij afgesneden.", "Jes 28:17-22": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen. En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn.", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Hab 1:4": "Daarom wordt de wet losgelaten, en het recht komt nooit meer voort; want de goddeloze omringt de rechtvaardige; daarom komt het recht verdraaid voort.", "Joh 19:7": "De Joden antwoordden hem: Wij hebben een wet, en naar onze wet moet Hij sterven, want Hij heeft Zichzelf Gods Zoon gemaakt.", "Hos 5:8": "Blaas de bazuin te Gibea, de trompet te Rama; roep luid te Beth-Aven; achter u, Benjamin!", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Ezra 9:10": "En nu, wat zullen wij zeggen, o onze God, na dit alles? Want wij hebben Uw geboden verlaten,", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Jes 48:1": "Hoor dit, huis van Jakob, die genoemd wordt met de naam van Israël, en uit de wateren van Juda voortgekomen bent! Die daar zweert bij de Naam van de HEERE, en de God van Israël vermeldt, maar niet in waarheid, en ook niet in gerechtigheid.", "Jes 29:21": "die een mens schuldig maken om een woord, en die strikken leggen voor hem die bestraft in de poort; en die de rechtvaardige verdrijven met valse argumenten.", "Ezech 28:2": "Mensenkind! Zeg tegen de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God.", "Ex 20:10": "maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is;", "Jer 5:12": "Zij verloochenen de HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen geen zwaard en geen honger zien.", "Jes 59:10": "Wij tasten naar de wand, zoals de blinden, en zoals wie geen ogen hebben, tasten wij; wij struikelen op de middag als in de schemering, wij zijn op woeste plaatsen als de doden.", "Spr 19:29": "Gerichten zijn voor de spotters bereid, en slagen voor de rug van de dwazen.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Job 10:2-7": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist. Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft? Hebt U vleselijke ogen, ziet U zoals een mens ziet?", "Jes 22:11": "Ook zult u een gracht maken tussen beide de muren, voor het water van de oude vijver; maar u zult niet omhoogkijken naar Hem, Die dat gedaan heeft, en Hem niet aanmerken, Die dat van verre tijden gevormd heeft.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Luk 16:13": "Geen huisknecht kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten; u kunt God niet dienen en de Mammon.", "Rom 9:21": "Of heeft de pottenbakker geen macht over het leem, om uit dezelfde klomp het ene vat tot eer te maken, en het andere tot oneer?", "Jes 5:25-30": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt. Want Hij zal een banier opwerpen voor de heidenvolken van ver, en Hij zal hen hierheen lokken met een fluitsignaal, van het einde van de aarde; en zie, haastig, snel zullen zij aankomen. Geen vermoeide, en geen struikelende zal onder hen zijn; niemand zal sluimeren noch slapen, noch zal de gordel om zijn heupen losraken, noch zal de schoenriem van zijn schoenen afscheuren.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Amos 3:11": "Daarom, zo zegt de Heere HEERE: De vijand! En dat rondom het land! Die zal uw sterkte van u neerstorten, en uw paleizen zullen uitgeplunderd worden.", "Ps 10:6": "Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Ps 1:1": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;", "Jer 6:1": "Vlucht met opeenpakking, kinderen van Benjamin, uit het midden van Jeruzalem, en waai de bazuin te Thekoa, en hef een vuurteken op te Beth-cherem; want er kijkt een kwaad uit van het noorden, en een grote breuk.", "Ps 50:18": "Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers.", "Deut 5:14": "maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw os, noch uw ezel, noch enig van uw vee, noch de vreemdeling die in uw poorten is; opdat uw dienstknecht en uw dienstmaagd rusten, net als u.", "Ezech 23:25": "En Ik zal Mijn na-ijver tegen u inzetten, zodat zij in grimmigheid met u zullen handelen; zij zullen uw neus en uw oren afsnijden, en wat er van u overblijft zal door het zwaard vallen; zij zullen uw zonen en uw dochters wegnemen, en wat er van u overblijft zal door het vuur verteerd worden.", "Micha 3:9-12": "Hoor nu dit, hoofden van het huis van Jakob, en leiders van het huis van Israël! die van het gericht een gruwel hebben, en alles wat recht is verdraaien; Zij bouwen Sion met bloed, en Jeruzalem met onrecht. Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Jer 14:13": "Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Micha 6:10": "Zijn er niet nog, in het huis van elke goddeloze, schatten van goddeloosheid en een schaarse efa, die te verfoeien is?", "Job 10:20-22": "Zijn mijn dagen niet weinig? Houd op, laat van mij af, dat ik mij een weinig verkwikt; Voordat ik heenga (en niet terugkom) naar een land van duisternis en van de schaduw van de dood; Een stikdonker land, als de duisternis zelf, de schaduw van de dood, en zonder ordeningen, en het geeft schijnsel als de duisternis.", "Jak 5:9": "Zucht niet tegen elkaar, broeders, opdat u niet veroordeeld wordt; zie, de Rechter staat voor de deur.", "Ezech 15:6-8": "Daarom, zo zegt de Heere HEERE: Zoals het hout van de wijnstok is onder het hout van het woud, dat Ik aan het vuur overgeef, opdat het verteerd wordt, zo zal Ik de inwoners van Jeruzalem overgeven. Want Ik zal Mijn aangezicht tegen hen zetten; als zij van het ene vuur uitgaan, zal het andere vuur hen verteren; en u zult weten, dat Ik de HEERE ben, als Ik Mijn aangezicht tegen hen gesteld zal hebben. En Ik zal het land woest maken, omdat zij zwaar overtreden hebben, spreekt de Heere HEERE.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Luk 17:26-30": "En zoals het gebeurde in de dagen van Noach, zo zal het ook zijn in de dagen van de Zoon des mensen. Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot de dag waarop Noach in de ark ging, en de zondvloed kwam en hen allen verdierf. Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "Hab 3:6": "Hij stond, en mat het land, Hij zag toe, en maakte de heidenvolken los, en de aloude bergen zijn verstrooid geworden; de heuvels van eeuwigheid hebben zich gebogen; de gangen van eeuwigheid zijn van Hem.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Openb 16:10": "En de vijfde engel goot zijn schaal uit op de troon van het beest; en zijn rijk werd verduisterd; en zij kauwden van pijn op hun tongen;", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "Jer 2:32": "Vergeet ook een jonkvrouw haar versiersel, of een bruid haar bindselen? Toch heeft Mijn volk Mij vergeten, dagen zonder getal.", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Zach 14:2": "Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen worden, en de huizen zullen geplunderd worden, en de vrouwen zullen geschonden worden; en de helft van de stad zal uitgaan in de gevangenis, maar het overige van het volk zal uit de stad niet uitgeroeid worden.", "2 Petr 3:4": "En zeggen: Waar is de belofte van Zijn komst? Want vanaf de dag dat de vaders ontslapen zijn, blijven alle dingen zo, net zoals vanaf het begin van de schepping.", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "Job 27:10": "Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "Ezech 7:7": "De morgenstond is tot u gekomen, o inwoner van het land, de tijd is gekomen, de dag van de opschudding is nabij, en er is geen weerklank van de bergen.", "1 Kor 1:23": "Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Zach 8:2": "Zo zegt de HEERE van de heerscharen: Ik heb geijverd over Sion met een grote ijver; ja, met grote grimmigheid heb Ik over haar geijverd.", "2 Kron 27:2": "En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader Uzzia gedaan had, behalve dat hij de tempel van de HEERE niet binnenging; en het volk verdierf zich nog.", "Luk 12:10": "En ieder die een woord spreken zal tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest gelasterd zal hebben, die zal het niet vergeven worden.", "Openb 12:18": "En ik stond op het zand van de zee.", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "2 Kon 10:22": "Toen zei hij tot hem die over het klerenmagazijn was: Breng voor alle dienaren van Baäl de kleding naar buiten. En hij bracht voor hen de kleding naar buiten.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Num 14:27-34": "Hoelang zal Ik het bij deze slechte vergadering uithouden, die tegen Mij morren? Ik heb het gemor van de kinderen van Israël gehoord, waarmee zij tegen Mij morren. Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de HEERE, zoals u in Mijn oren gesproken hebt, zo zal Ik u doen! Uw dode lichamen zullen in deze woestijn vallen; en al uw getelden, naar uw hele aantal, van twintig jaar oud en daarboven, u die tegen Mij gemord hebt.", "2 Kon 2:24": "En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "Ps 79:6": "Stort Uw grimmigheid uit over de heidenen, die U niet kennen, en over de koninkrijken, die Uw Naam niet aanroepen.", "Ezech 14:3-7": "Mensenkind, deze mannen hebben hun drekgoden in hun hart opgezet, en hebben de aanstoot van hun ongerechtigheid recht voor hun aangezicht gezet; zou Ik dan werkelijk door hen geraadpleegd worden? Daarom, spreek met hen en zeg tegen hen: Zo zegt de Heere HEERE: Ieder man uit het huis van Israël die de drekgoden in zijn hart opzet, en de aanstoot van zijn ongerechtigheid recht voor zijn aangezicht zet, en komt tot de profeet, Ik, de HEERE, zal hem antwoorden als hij komt, naar de veelheid van zijn drekgoden; Opdat Ik het huis van Israël in hun hart grijp, omdat zij allen door hun drekgoden van Mij vervreemd zijn.", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Job 22:13": "Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen?", "Jer 6:17": "Ik heb ook wachters over u gesteld, en gezegd: Luistert naar het geluid van de bazuin; maar zij zeggen: Wij zullen niet luisteren.", "Openb 18:7": "Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien.", "Jes 47:8": "Nu dan, hoor dit, weelderige! Die zo zeker woont, die in haar hart zegt: Ik ben het, en niemand meer dan ik: ik zal geen weduwe zitten, en de beroving van kinderen niet kennen.", "Ps 10:18": "Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Rom 11:25": "Want ik wil niet, broeders, dat u deze verborgenheid onbekend is (opdat u niet wijs bent, bij uzelf), dat de verharding voor een deel over Israël gekomen is, totdat de volheid van de heidenen zal ingegaan zijn.", "Hab 1:6-10": "Want zie, Ik verwek de Chaldeeën, een bitter en snel volk, dat door de breedten van de aarde trekt, om woningen die niet van hem zijn, in erfelijk bezit te nemen. Schrikkelijk en vreselijk is het; zijn recht en zijn hoogheid gaan van hemzelf uit. Want zijn paarden zijn lichter dan de luipaarden, en zij zijn scherper dan de avondwolven, en zijn ruiters verspreiden zich; ja, zijn ruiters zullen van verre komen, zij zullen vliegen als een arend, die zich haast om te eten.", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Jes 44:5": "Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Lev 26:17": "Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand.", "2 Kon 24:12": "Toen ging Jojachin, de koning van Juda, naar de koning van Babel, hij, en zijn moeder, en zijn dienaren, en zijn vorsten, en zijn hovelingen; en de koning van Babel nam hem gevangen in het achtste jaar van zijn regering.", "2 Kron 12:1-12": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem. Daarom gebeurde het, in het vijfde jaar van koning Rehabeam, dat Sisak, de koning van Egypte, tegen Jeruzalem optrok (want zij hadden tegen de HEERE overtreden), met duizend tweehonderd wagens, en met zestigduizend ruiters; en van het volk dat met hem uit Egypte kwam was geen getal: Libiërs, Sukkieten en Cusjieten.", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Ps 58:3": "Ja, u werkt ongerechtigheden in het hart; u weegt het geweld van uw handen af op de aarde.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "1 Kon 11:33": "Omdat zij Mij verlaten hebben, en zich neergebogen hebben voor Astoreth, de god van de Sidoniërs, Kamos, de god van de Moabieten, en Milchom, de god van de kinderen Ammons; en niet in Mijn wegen gewandeld hebben om te doen wat recht is in Mijn ogen, namelijk Mijn inzettingen en Mijn rechten, zoals zijn vader David.", "Jes 13:3": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid.", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "Jes 20:5": "En zij zullen verschrikken en beschaamd zijn over de Moren, op wie zij hun hoop hadden gevestigd, en over de Egyptenaars, hun roem.", "Luk 12:35-48": "Laat uw middel omgord zijn, en de lampen brandend. En wees zelf gelijk aan mensen die op hun heer wachten, wanneer hij terugkomt van de bruiloft, zodat zij, als hij komt en klopt, hem meteen kunnen opendoen. Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Jes 34:2-6": "Want de toorn van de HEERE is over alle heidenvolken, en grimmigheid over heel hun leger; Hij heeft hen met de ban geslagen, Hij heeft ze ter slachting overgegeven. En hun gesneuvelden zullen weggeworpen worden, en van hun dode lichamen zal hun stank opstijgen; en de bergen zullen smelten van hun bloed. En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom.", "Pred 8:9": "Dit alles heb ik gezien, toen ik mijn hart richtte op elk werk dat onder de zon gebeurt: er is een tijd dat de ene mens over de andere heerst, hem tot zijn eigen kwaad.", "Jer 2:19": "Uw boosheid zal u kastijden, en uw afkeringen zullen u straffen; weet dan en zie, dat het kwaad en bitter is, dat u de HEERE, uw God, verlaat, en Mijn vreze niet bij u is, spreekt de Heere, de HEERE van de heerscharen.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "Hos 4:3": "Daarom zal het land treuren, en ieder die daarin woont, kwijnen weg, met de dieren van het veld, en met de vogels van de hemel; ja, ook de vissen van de zee zullen weggeraapt worden.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Jer 47:6": "O wee, u zwaard van de HEERE! Hoe lang zult u niet stil houden? Vaar in uw schede, rust en wees stil!", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "2 Kon 18:21": "Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Neh 3:31": "Na hem verbeterde Malchia, de zoon van het goudsmid, tot aan het huis van de Nethinim en van de kruideniers, tegenover de poort van Mifkad, en tot de bovenzaal van het punt.", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "Mal 3:14": "U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "2 Kron 36:21": "Opdat het woord van de HEERE vervuld werd, door de mond van Jeremia, totdat het land aan zijn sabbatten een welgevallen had; het rustte al de dagen van de verwoesting, totdat de zeventig jaren vervuld waren.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "1 Tim 6:17-19": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten; dat zij goed doen, rijk worden in goede werken, vrijgevig zijn en bereid om te delen; en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Jes 10:1-3": "Wee hun die onrechtvaardige regels bepalen, en de schrijvers die moeite voorschrijven; om de armen van het recht af te wenden, en om het recht van de ellendigen van Mijn volk te roven, opdat de weduwen hun buit worden, en opdat zij de wezen mogen plunderen! Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Ps 5:3": "Let op de stem van mijn geroep, o mijn Koning en mijn God! Want tot U zal ik bidden.", "Ex 14:11": "En zij zeiden tegen Mozes: Had u ons daarom, omdat er in Egypte helemaal geen graven waren, weggehaald, opdat wij in deze woestijn zouden sterven? Waarom heeft u ons dit aangedaan, dat u ons uit Egypte hebt weggevoerd?", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "Hos 7:7": "Zij zijn allemaal samen verhit als een bakoven, en zij verteren hun rechters; al hun koningen vallen; er is niemand onder hen die tot Mij roept.", "Jer 12:7": "Ik heb Mijn huis verlaten, Ik heb Mijn erfenis laten varen; Ik heb de beminde van Mijn ziel in de hand van haar vijanden gegeven.", "2 Tess 1:8": "Met vlammend vuur, wraak oefenend over hen die God niet kennen, en over hen die het Evangelie van onze Heere Jezus Christus niet gehoorzaam zijn.", "Ps 12:9": "De goddelozen lopen rond aan alle kanten, wanneer de snoodsten van de mensenkinderen verhoogd worden.", "Jer 6:21": "Daarom zegt de HEERE zo: Ziet, Ik zal dit volk allerlei aanstoot stellen; en daaraan zullen zich stoten samen vaders en kinderen, de buurman en zijn metgezel, en zij zullen omkomen.", "2 Kon 5:20-27": "Gehazi nu, de knecht van Elisa, de man van God, zei: Zie, mijn heer heeft Naäman, deze Syriër, ontzien, doordat hij niet uit zijn hand heeft aangenomen wat hij gebracht had; maar zo waarachtig als de HEERE leeft, ik zal hem achterna lopen, en zal iets van hem aannemen! Zo achtervolgde Gehazi Naäman. En toen Naäman zag dat hij hem achterna liep, sprong hij van de wagen af, hem tegemoet, en zei: Is alles goed? En hij zei: Het is goed; mijn heer heeft mij gestuurd, om te zeggen: Zie, zojuist zijn er twee jonge mannen uit de zonen van de profeten, van het gebergte van Efraïm, bij mij gekomen; geef hun toch een talent van het zilver en twee stellen kleren.", "Micha 3:1-3": "Verder zei ik: Hoor nu, hoofden van Jakob, en leiders van het huis van Israël! Betaamt het u niet om het recht te weten? Zij haten het goede, en hebben het kwade lief; zij roven hun huid van hen af, en hun vlees van hun beenderen. Ja, zij zijn het, die het vlees van mijn volk eten, en hun huid afstropen, en hun beenderen verbreken; en uiteen leggen, zoals in een pot, en als vlees in het midden van een ketel.", "Jak 2:6": "Maar u hebt de arme oneer aangedaan. Onderdrukken de rijken u niet, en trekken zij u niet voor de rechterstoelen?", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Joh 9:40": "En dit hoorden enkelen van de Farizeeën die bij Hem waren, en zij zeiden tegen Hem: Zijn wij dan ook blind?", "Jer 4:26-29": "Ik keek, en zie, het vruchtbare land was een woestijn, en al zijn steden waren afgebroken, vanwege de HEERE, vanwege de gloed van Zijn toorn. Want zo zegt de HEERE: Dit hele land zal een woestijn zijn (toch zal Ik geen volledig einde maken); Hierom zal de aarde treuren, en de hemel daarboven zwart zijn; omdat Ik het heb gesproken, Ik heb het voorgenomen en het zal Mij niet berouwen, en Ik zal Mij daarvan niet afkeren.", "Pred 10:17": "Gelukkig bent u, land, waarvan de koning een zoon van edelen is, en waarvan de vorsten op de juiste tijd eten, tot sterkte en niet tot drinkerij.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Klaagl 5:8": "Knechten heersen over ons; er is niemand die ons uit hun hand rukt.", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "Jes 29:10": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.", "Jes 1:4": "Wee het zondige volk, het volk van zware ongerechtigheid, het nageslacht van de boosdoeners, de verdervende kinderen! Zij hebben de HEERE verlaten, zij hebben de Heilige van Israël gelasterd, zij hebben zich vervreemd, wijkende achterwaarts.", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "Job 19:22": "Waarom vervolgt u mij als God, en wordt u niet verzadigd van mijn vlees?", "Ezech 35:12": "En u zult weten, dat Ik, de HEERE, al uw lasteringen gehoord heb, die u tegen de bergen van Israël gesproken hebt, en u zei: Zij zijn verwoest, zij zijn ons tot voedsel gegeven.", "Ex 5:2": "Maar Farao zei: Wie is de HEERE, Wiens stem ik gehoorzamen zou, om Israël te laten trekken? Ik ken de HEERE niet, en ik zal ook Israël niet laten trekken.", "2 Sam 13:24": "En Absalom kwam bij de koning, en zei: Zie, uw knecht heeft nu schaapscheerders; laat toch de koning en zijn knechten met uw knecht meegaan.", "Jes 50:3": "Ik bekleed de hemel met zwartheid, en maak een zak tot zijn bedekking.", "2 Petr 2:17": "Dezen zijn waterloze bronnen, wolken die door een storm worden voortgedreven; voor hen is de donkerheid van de duisternis voor eeuwig bewaard.", "Matt 19:24": "En verder zeg Ik u: Het is gemakkelijker dat een kameel door het oog van een naald gaat, dan dat een rijke ingaat in het Koninkrijk van God.", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Jes 36:21": "Toch zwegen zij stil, en antwoordden hem geen woord; want het gebod van de koning was: U zult hem niet antwoorden.", "Ezech 23:22-25": "Daarom, o Oholiba! Zo zegt de Heere HEERE: Zie, Ik zal uw minnaars, van wie uw ziel is afgekeerd, tegen u opwekken, en Ik zal hen van rondom tegen u aanbrengen. De zonen van Babel en alle Chaldeeën, Pekod, en Soa, en Koa, en alle zonen van Assur met hen; aantrekkelijke jonge mannen, die allen vorsten en machthebbers zijn, hoofdmannen en vermaarde mannen, die allen te paard rijden. Die zullen tegen u komen met karren, wagens en wielen, en met een menigte van volken, met kleine schilden, grote schilden, en helmen; zij zullen zich rondom tegen u opstellen; en Ik zal voor hun aangezicht het strafgericht neerleggen, en zij zullen u berechten naar hun rechtsregels.", "Ps 125:5": "Maar die zich neigen tot hun kromme wegen, die zal de HEERE weg doen gaan met de werkers van de ongerechtigheid. Vrede zal over Israël zijn!", "Jes 22:4": "Daarom zeg ik: Wend uw blik van mij af; laat mij bitter wenen; dring er niet op aan om mij te troosten over de verwoesting van de dochters van mijn volk.", "Jes 2:20": "Op die dag zal de mens zijn zilveren afgoden, en zijn gouden afgoden, die zij zich gemaakt hadden, om zich daarvoor neer te buigen, wegwerpen voor de mollen en de vleermuizen;", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Spr 9:12": "Als u wijs bent, bent u wijs voor uzelf; en bent u een spotter, dan zult u het alleen dragen.", "Jer 4:7": "De leeuw is opgekomen uit zijn schuilplaats, en de verwoester van de heidenvolken is opgetrokken, hij is uitgegaan uit zijn plaats, om uw land te maken tot een woestenij; uw steden zullen verwoest worden, zodat er niemand in woont.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Jer 10:25": "Stort Uw grimmigheid uit over de heidenen, die U niet kennen, en over de geslachten, die Uw Naam niet aanroepen; want zij hebben Jakob opgegeten, ja, zij hebben hem opgegeten, en hem verteerd, en zijn woning verwoest.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Ezech 8:15": "En Hij zei tegen mij: Hebt u, mensenkind, dat gezien? U zult nog grotere gruwelen zien dan deze.", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "Openb 14:9-11": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Klaagl 4:14": "Nun. Zij zwierven als blinden op de straten, zij waren met bloed besmet, zodat men niet kon zien of men hun kleren aanraakte.", "Openb 16:21": "En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot.", "Ezech 34:7-10": "Daarom, u herders! Hoor het woord van de HEERE! Zo waarachtig als Ik leef, spreekt de Heere HEERE, zeker! Omdat Mijn schapen geworden zijn tot een roof, en Mijn schapen al het wilde gedierte van het veld tot voedsel geworden zijn, omdat er geen herder is, en Mijn herders naar Mijn schapen niet vragen; en de herders weiden zichzelf, maar Mijn schapen weiden zij niet; Daarom, u herders! Hoor het woord van de HEERE!", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Jer 2:17": "Doet u dit niet zelf, doordat u de HEERE, uw God, verlaat, ten tijde als Hij u op de weg leidt?", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Jer 46:21": "Zelfs haar gehuurden in haar midden zijn als gemeste kalveren; maar die hebben zich ook gewend, zij zijn samen gevlucht, zij hebben niet gestaan; want de dag van hun verderf is over hen gekomen, de tijd van hun bezoeking.", "Jes 1:21": "Hoe is de trouwe stad tot een hoer geworden! Zij was vol recht, gerechtigheid herbergde daarin, maar nu doodslagers.", "Job 16:9": "Zijn toorn verscheurt, en Hij haat mij; Hij knerst over mij met Zijn tanden; mijn tegenstander scherpt zijn ogen tegen mij.", "Zach 14:1": "Zie, de dag komt, de HEERE, dat uw roof zal uitgedeeld worden in het midden van u, o Jeruzalem!", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Ezech 7:14": "Zij hebben op de trompet geblazen, en hebben alles klaargemaakt, maar niemand trekt ten strijde; want Mijn brandende toorn is over de gehele menigte van het land.", "Micha 3:9-11": "Hoor nu dit, hoofden van het huis van Jakob, en leiders van het huis van Israël! die van het gericht een gruwel hebben, en alles wat recht is verdraaien; Zij bouwen Sion met bloed, en Jeruzalem met onrecht. Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Jer 4:31": "Want ik hoor een stem als van een vrouw, die in barensnood is, een benauwdheid als van iemand die haar eerste kind baart, de stem van de dochter van Sion; zij hijgt, zij spreidt haar handen uit, en zegt: O, wee mij nu, want mijn ziel is moe vanwege de moordenaars!", "2 Petr 3:3": "Dit moet u eerst weten, dat er in de laatste dagen spotters zullen komen, die naar hun eigen begeerten zullen wandelen,", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "Luk 6:24": "Maar wee u, rijken, want u hebt uw troost al gehad.", "Dan 9:13": "Zoals geschreven is in de wet van Mozes, zo is al dat kwaad over ons gekomen; en wij smeekten het aangezicht van de HEERE, onze God, niet, door ons af te keren van onze ongerechtigheden en verstandig acht te geven op Uw waarheid.", "Ezech 11:1-21": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk. En Hij zei tegen mij: Mensenkind, dit zijn de mannen die onrecht bedenken, en die slechte raad geven in deze stad. Die zeggen: Men moet niet snel huizen bouwen; deze stad is de pot, en wij zijn het vlees.", "Micha 7:4": "De beste van hen is als een doorn; de oprechtste is scherper dan een doornheg; de dag van uw wachters, uw bezoeking, is gekomen; nu zal hun verwarring zijn.", "Deut 32:5": "Hij heeft het tegen Hem verdorven; het zijn Zijn kinderen niet; de schandvlek is hun; het is een verkeerd en verdraaid geslacht.", "Ezech 45:9": "Zo zegt de Heere HEERE: Het is genoeg voor u, vorsten van Israël! Doe geweld en verwoesting weg, en doe recht en gerechtigheid; neem uw uitstotingen weg van Mijn volk, spreekt de Heere HEERE.", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "2 Petr 3:7": "Maar de hemelen die er nu zijn, en de aarde, zijn door datzelfde woord als een schat weggelegd, en worden voor het vuur bewaard tegen de dag van het oordeel en van het verderf van de goddeloze mensen.", "Jes 22:5": "Want het is een dag van beroering, en van vertrapping, en van verwarring van de Heere, de HEERE van de heerscharen, in het dal van het gezicht, een dag van afbraak van het muur, en van geschreeuw naar het gebergte toe.", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "2 Kon 22:14": "Toen ging de priester Hilkia, en Ahikam, en Achbor, en Safan, en Asaja naar de profetes Hulda, de vrouw van Sallum, de zoon van Tikva, de zoon van Harhas, de klederbewaarder (zij woonde nu te Jeruzalem, in het tweede deel), en zij spraken met haar.", "1 Kon 14:22": "En Juda deed wat kwaad was in de ogen van de HEERE, en zij verwekten Hem tot ijver, meer dan al hun vaderen gedaan hadden, met hun zonden die zij zondigden.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Jer 48:41": "Elke stad is gewonnen, en elke vesting is ingenomen; en het hart van Moabs helden zal op die dag zijn als het hart van een vrouw die in barensnood is.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Zach 11:3": "Er is een stem van het gehuil van de herders, omdat hun heerlijkheid verwoest is; een stem van het gebrul van de jonge leeuwen, omdat de hoogmoed van de Jordaan verwoest is.", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Jak 2:7": "Lasteren zij niet de goede naam die over u aangeroepen is?", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "2 Kron 33:11": "Daarom bracht de HEERE over hen de legeroversten van de koning van Assyrië, die Manasse gevangen namen tussen de doornen; en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "Ps 12:4": "De HEERE snijdt alle vleiende lippen af, en de tong die grootspreekt;", "Jes 2:12": "Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt;", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "2 Petr 2:1": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen;", "Joël 3:15": "De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Hos 4:10": "En zij zullen eten, maar niet verzadigd worden, zullen hoereren, maar niet toenemen in aantal; want zij hebben nagelaten de Heere in acht te nemen.", "Hos 6:4-11": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat. Daarom heb Ik hen gehakt door de profeten; Ik heb hen gedood door de woorden van Mijn mond; en uw oordelen zullen voortkomen als het licht. Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "Luk 12:19": "en ik zal tegen mijn ziel zeggen: Ziel, je hebt veel goederen liggen, voor vele jaren; neem rust, eet, drink, wees vrolijk.", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "Spr 11:21": "Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Spr 30:7-9": "Twee dingen heb ik van U gevraagd, onthoud ze mij niet, voordat ik sterf; Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is; Opdat ik, als ik verzadigd ben, U dan niet verloochent, en zeg: Wie is de HEERE? of dat ik, als ik arm geworden ben, dan niet steel, en de Naam van mijn God aantast.", "Hos 12:3": "Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.", "Jes 24:5": "Want het land is bevlekt vanwege zijn inwoners; want zij overtreden de wetten, zij veranderen de inzettingen, zij vernietigen het eeuwige verbond.", "Ex 17:7": "En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?", "Jes 64:5-7": "U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden."}, "noten": {"1": "Vers 4: SV: \"de Chemarim\" – D.i.: de afgodspriesters (naam voor priesters van afgodendienst).", "2": "Vers 12: D.i.: onverschillig/zorgeloos geworden, als wijn die op zijn droesem is blijven staan."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">Het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">woord</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H834\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H834\">HEERE</span>, dat <span class=\"wl\" data-l=\"L3\" data-code=\"H1961\">gebeurd</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1961\">is</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H413\">tot</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6846\">Z  class=\"wl wl-kjv\" data-code=\"H5678\">wrath,</span> a <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H6869\">trouble</span> and <span class=\"wl wl-kjv\" data-code=\"H4691\">distress,</span> a <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H7722\">wasteness</span> and <span class=\"wl wl-kjv\" data-code=\"H4875\">desolation,</span> a <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> and <span class=\"wl wl-kjv\" data-code=\"H653\">gloominess,</span> a <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H6051\">clouds</span> and thick darkness,", "16": "A <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> and <span class=\"wl wl-kjv\" data-code=\"H8643\">alarm</span> against the <span class=\"wl wl-kjv\" data-code=\"H1219\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and against the <span class=\"wl wl-kjv\" data-code=\"H1364\">high</span> towers.", "17": "And I will bring <span class=\"wl wl-kjv\" data-code=\"H6887\">distress</span> upon <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> that they shall <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> like blind <span class=\"wl wl-kjv\" data-code=\"H5787\">men,</span> because they have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and their <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shall be poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> as <span class=\"wl wl-kjv\" data-code=\"H6083\">dust,</span> and their <span class=\"wl wl-kjv\" data-code=\"H3894\">flesh</span> as the dung.", "18": "Neither their <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> no
