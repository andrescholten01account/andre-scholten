 beschimpt hebben, en zich groot gemaakt hebben tegen hun grondgebied.","9":"Daarom, zo waarachtig als Ik leef, spreekt de HEERE van de heerscharen[2], de God van Israël: Moab zal zeker zijn als Sodom, en de kinderen van Ammon als Gomorra, een netelveld, en een zoutgroeve, en een verwoesting tot in eeuwigheid! De overigen van Mijn volk zullen hen beroven, en het overige van Mijn volk zal hen erfelijk bezitten.","10":"Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.","11":"Vreselijk zal de HEERE tegen hen zijn, want Hij zal al de goden van de aarde doen uitteren; en ieder uit zijn plaats zal Hem aanbidden, alle eilanden van de heidenvolken.","12":"Ook u, Moren! zult de verslagenen van Mijn zwaard zijn.","13":"Hij zal ook Zijn hand uitstrekken tegen het noorden, en Hij zal Assur verdoen; en Hij zal Ninevé stellen tot een verwoesting, droog als een woestijn.","14":"En in haar midden zullen de kudden liggen, al het gedierte van de volken; ook de roerdomp, ook de nachtuil zullen op haar granaatappels overnachten; een stem zal in het venster zingen, verwoesting zal op de drempel zijn, wanneer Hij haar cederwerk zal hebben blootgelegd.","15":"Dit is de stad, die opspringt van vreugde, die zorgeloos woont, die in haar hart zegt: Ik ben het, en buiten mij is er niemand meer; hoe is zij geworden tot woestheid, een rustplaats voor het gedierte! Ieder die daar voorbij trekt, zal haar aanfluiten, hij zal zijn hand bewegen."},"SV":{"1":"Doorzoek u zelf nauw, ja, doorzoek nauw, gij volk, dat met geen lust bevangen wordt!","2":"Eer het besluit bare (gelijk kaf gaat de dag voorbij), terwijl de hittigheid van des HEEREN toorn over ulieden nog niet komt; terwijl de dag van den toorn des HEEREN over ulieden nog niet komt.","3":"Zoekt den HEERE, alle gij zachtmoedigen des lands, die Zijn recht werken! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult gij verborgen worden in den dag van den toorn des HEEREN.","4":"Want Gaza zal verlaten wezen, en Askelon zal ter verwoesting wezen; Asdod zal men in den middag verdrijven, en Ekron zal uitgeworteld worden.","5":"Wee den inwoneren van de landstreek der zee, den volken der Cheretim! Het woord des HEEREN zal tegen ulieden zijn, gij Kanaän, der Filistijnen land! en Ik zal u verdoen, dat er geen inwoner zal zijn.","6":"En de landstreek der zee zal wezen *tot* hutten, uitgegraven putten der herders, en betuiningen der kudden.","7":"En de landstreek zal wezen voor het overblijfsel van het huis van Juda, dat zij daarin weiden; des avonds zullen zij in de huizen van Askelon legeren, als de HEERE, hunlieder God, hen zal bezocht, en hun gevangenis zal gewend hebben.","8":"Ik heb de beschimping van Moab gehoord, en de scheldwoorden der kinderen Ammons, waarmede zij Mijn volk beschimpt hebben, en hebben zich groot gemaakt tegen deszelfs landpale.","9":"Daarom, *zo* *waarachtig* *als* Ik leef, spreekt de HEERE der heirscharen, de God Israëls: Moab zal zekerlijk zijn als Sodom, en de kinderen Ammons als Gomorra, een netelheide, en een zoutgroeve, en een verwoesting tot in eeuwigheid! De overigen Mijns volks zullen ze beroven, en het overige Mijns volks zal ze erfelijk bezitten.","10":"Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en hebben zich groot gemaakt tegen het volk van den HEERE der heirscharen.","11":"Vreselijk zal de HEERE tegen hen wezen, want Hij zal al de goden der aarde doen uitteren; en een iegelijk uit zijn plaats zal Hem aanbidden, al de eilanden der heidenen.","12":"Ook gij, Moren! zult de verslagenen van Mijn zwaard zijn.","13":"Hij zal ook Zijn hand uitstrekken tegen het Noorden, en Hij zal Assur verdoen; en Hij zal Nineve stellen tot een verwoesting, droog als een woestijn.","14":"En in het midden van haar zullen den kudden legeren, al het gedierte der volken; ook de roerdomp, ook de nachtuil zullen op haar granaatappelen vernachten; een stem zal in het venster zingen, verwoesting zal in den dorpel zijn, als Hij haar cederwerk zal ontbloot hebben.","15":"Dit is die stad, die opspringt van vreugde, die zeker woont, die in haar hart zegt: Ik ben het, en buiten mij is geen meer; hoe is zij geworden tot woestheid, een rustplaats van het gedierte! Een ieder, die daardoor trekt, zal ze aanfluiten, hij zal zijn hand bewegen."},"KJV":{"1":"Gather yourselves together, yea, gather together, O nation not desired;","2":"Before the decree bring forth, *before* the day pass as the chaff, before the fierce anger of the LORD come upon you, before the day of the LORD'S anger come","3":"Seek ye the LORD, all ye meek of the earth, which have wrought his judgment; seek righteousness, seek meekness: it may be ye shall be hid in the day of the LORD'S anger.","4":"For Gaza shall be forsaken, and Ashkelon a desolation: they shall drive out Ashdod at the noon day, and Ekron shall be rooted up.","5":"Woe unto the inhabitants of the sea coast, the nation of the Cherethites! the word of the LORD *is* against you; O Canaan, the land of the Philistines, I will even destroy thee, that there shall be no inhabitant.","6":"And the sea coast shall be dwellings *and* cottages for shepherds, and folds for flocks.","7":"And the coast shall be for the remnant of the house of Judah; they shall feed thereupon: in the houses of Ashkelon shall they lie down in the evening: for the LORD their God shall visit them, and turn away their captivity.","8":"I have heard the reproach of Moab, and the revilings of the children of Ammon, whereby they have reproached my people, and magnified *themselves* against their border.","9":"Therefore *as* I live, saith the LORD of hosts, the God of Israel, Surely Moab shall be as Sodom, and the children of Ammon as Gomorrah, *even* the breeding of nettles, and saltpits, and a perpetual desolation: the residue of my people shall spoil them, and the remnant of my people shall possess","10":"This shall they have for their pride, because they have reproached and magnified *themselves* against the people of the LORD of hosts.","11":"The LORD *will be* terrible unto them: for he will famish all the gods of the earth; and *men* shall worship him, every one from his place, *even* all the isles of the heathen.","12":"Ye Ethiopians also, ye *shall be* slain by my sword.","13":"And he will stretch out his hand against the north, and destroy Assyria; and will make Nineveh a desolation, *and* dry like a wilderness.","14":"And flocks shall lie down in the midst of her, all the beasts of the nations: both the cormorant and the bittern shall lodge in the upper lintels of it; *their* voice shall sing in the windows; desolation *shall be* in the thresholds: for he shall uncover the cedar work.","15":"This *is* the rejoicing city that dwelt carelessly, that said in her heart, I *am*, and *there is* none beside me: how is she become a desolation, a place for beasts to lie down in! every one that passeth by her shall hiss, *and* wag his hand."}},"tsk":{"1":[{"kopje":"Doorzoek","refs":["2 Kron 20:4","Neh 8:2","Neh 9:1","Est 4:16","Joël 1:14","Joël 2:12-18","Matt 18:20"]},{"kopje":"gij volk","refs":["Jes 1:4-6","Jes 1:10-15","Jer 12:7-9","Zach 11:8"]},{"kopje":"lust bevangen","refs":["Jes 26:8","Jes 26:9"]}],"2":[{"kopje":"het besluit","refs":["Zef 3:8","2 Kon 22:16","2 Kon 22:17","2 Kon 23:26","2 Kon 23:27","Ezech 12:25","Matt 24:35","2 Petr 3:4-10"]},{"kopje":"zoals","refs":["Job 21:18","Ps 1:4","Jes 17:13","Jes 41:15","Jes 41:16","Hos 13:3"]},{"kopje":"voordat de gloed van de toorn","refs":["Zef 1:18","2 Kron 36:16","2 Kron 36:17","Ps 2:12","Ps 50:22","Jer 23:20","Klaagl 4:11","Nahum 1:6","Mal 4:1","Mal 4:2","Luk 13:24-28"]},{"kopje":"voordat de dag van","refs":["Ps 95:7","Ps 95:8"]}],"3":[{"kopje":"Zoekt","refs":["Ps 105:4","Jes 55:6","Jes 55:7","Jer 3:13","Jer 3:14","Jer 4:1","Jer 4:2","Jer 29:12","Jer 29:13","Hos 7:10","Hos 10:12","Amos 5:4-6","Amos 5:14","Amos 5:15","Matt 7:7","Matt 7:8"]},{"kopje":"alle","ref code=\"H6485\">visit</span> them, and turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> their <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity.</span>","8":"I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1421\">revilings</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> whereby they have <span class=\"wl wl-kjv\" data-code=\"H2778\">reproached</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H1431\">magnified</span> themselves against their border.","9":"Therefore as I <span class=\"wl wl-kjv\" data-code=\"H2416\">live,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Surely <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> shall be as <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> as <span class=\"wl wl-kjv\" data-code=\"H6017\">Gomorrah,</span> even the <span class=\"wl wl-kjv\" data-code=\"H4476\">breeding</span> of <span class=\"wl wl-kjv\" data-code=\"H2738\">nettles,</span> and <span class=\"wl wl-kjv\" data-code=\"H4379\">saltpits,</span> and a <span class=\"wl wl-kjv\" data-code=\"H5704\">perpetual</span> <span class=\"wl wl-kjv\" data-code=\"H8077\">desolation:</span> the <span class=\"wl wl-kjv\" data-code=\"H7611\">residue</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H962\">spoil</span> them, and the <span class=\"wl wl-kjv\" data-code=\"H3499\">remnant</span> of my <span class=\"wl wl-kjv\" data-code=\"H1471\">people</span> shall possess","10":"This shall they have for their <span class=\"wl wl-kjv\" data-code=\"H1347\">pride,</span> because they have <span class=\"wl wl-kjv\" data-code=\"H2778\">reproached</span> and <span class=\"wl wl-kjv\" data-code=\"H1431\">magnified</span> themselves against the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","11":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will be <span class=\"wl wl-kjv\" data-code=\"H3372\">terrible</span> unto them: for he will <span class=\"wl wl-kjv\" data-code=\"H7329\">famish</span> all the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> and men shall <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> him, every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> from his <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> even all the <span class=\"wl wl-kjv\" data-code=\"H339\">isles</span> of the heathen.","12":"Ye <span class=\"wl wl-kjv\" data-code=\"H3569\">Ethiopians</span> also, <span class=\"wl wl-kjv\" data-code=\"H1992\">ye</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> by my sword.","13":"And he will stretch <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> and <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria;</span> and will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> <span class=\"wl wl-kjv\" data-code=\"H5210\">Nineveh</span> a <span class=\"wl wl-kjv\" data-code=\"H8077\">desolation,</span> and <span class=\"wl wl-kjv\" data-code=\"H6723\">dry</span> like a wilderness.","14":"And <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks</span> shall lie <span class=\"wl wl-kjv\" data-code=\"H7257\">down</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of her, all the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations:</span> both the <span class=\"wl wl-kjv\" data-code=\"H6893\">cormorant</span> and the <span class=\"wl wl-kjv\" data-code=\"H7090\">bittern</span> shall <span class=\"wl wl-kjv\" data-code=\"H3885\">lodge</span> in the upper <span class=\"wl wl-kjv\" data-code=\"H3730\">lintels</span> of it; their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> shall <span class=\"wl wl-kjv\" data-code=\"H7891\">sing</span> in the <span class=\"wl wl-kjv\" data-code=\"H2474\">windows;</span> <span class=\"wl wl-kjv\" data-code=\"H2721\">desolation</span> shall be in the <span class=\"wl wl-kjv\" data-code=\"H5592\">thresholds:</span> for he shall <span class=\"wl wl-kjv\" data-code=\"H6168\">uncover</span> the cedar work.","15":"This is the <span class=\"wl wl-kjv\" data-code=\"H5947\">rejoicing</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> <span class=\"wl wl-kjv\" data-code=\"H983\">carelessly,</span> that <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> in her <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> I am, and there is none <span class=\"wl wl-kjv\" data-code=\"H657\">beside</span> me: how is she become a <span class=\"wl wl-kjv\" data-code=\"H8047\">desolation,</span> a place for <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> to lie down <span class=\"wl wl-kjv\" data-code=\"H4769\">in!</span> every one that passeth <span class=\"wl wl-kjv\" data-code=\"H5674\">by</span> her shall <span class=\"wl wl-kjv\" data-code=\"H8319\">hiss,</span> and <span class=\"wl wl-kjv\" data-code=\"H5128\">wag</span> his hand."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"u zelf nauw,","tekst":"De zin is: Ga in uzelven, en onderzoek al uw doen, opdat gij verstaat hoe zwaarlijk gij God den Heere vertoornd hebt met uw grote en menigvuldige zonden. Hebr. verzamel u. Het wordt eigenlijk gebruikt voor het verzamelen der stoppelen of houten, gelijk Exo 5:7 , Exo 5:12 , en 1Ki 17:10 ; hetwelk dewijl het niet geschieden kan dan met naarstig zoeken, zo wordt het ook voor zoeken gebruikt."},{"catchword":"doorzoek nauw,","tekst":"Benaarstig u ten hoogste, te weten om u met God te verzoenen."},{"catchword":"dat met geen lust bevangen wordt","tekst":"Te weten, om u met God te verzoenen; of om wat goeds te doen. Anders: o volk, niet waardig begeerd te worden."}],"2":[{"catchword":"Eer het besluit bare","tekst":"Dat is, eer hetgeen komt, dat van God tegen u besloten is; het besluit van God baart alsdan, als de strafoefening geschiedt. Gelijk de baring niet straks na de ontvangenis volgt, maar op den bestemden tijd, alzo wordt Gods besluit uitgevoerd ten tijde, dien Hij daartoe bestemd heeft. Verg. Eze 20:25 ."},{"catchword":"(gelijk kaf gaat de dag voorbij),","tekst":"Dat is, snellijk; daarom bekeer u dewijl gij nog tijd hebt, eer de dag, die als kaf voorbijvliegt, het besluit bare, dat is, tevoorschijn brenge hetgeen God tegen u besloten heeft. Anders: [en] de dag voorbijga als kaf."}],"3":[{"catchword":"gij zachtmoedigen des lands,","tekst":"Dat is, gijlieden, die den Heere vreest in deze verwarde tijden."},{"catchword":"Zijn recht werken","tekst":"Te weten, het recht, hetwelk God u gegeven en voorgeschreven heeft. De zin is: Gij allen, die oprecht en vromelijk geleefd hebt naar den regel zijner wetten."},{"catchword":"misschien","tekst":"Zie de aantekening bij Joe 2:14 ."},{"catchword":"zult gij verborgen worden","tekst":"Of, zult gij u kunnen verbergen, en volgens dien zo zult gij van de vijanden niet gekwetst of beschadigd worden. Verg. Psa 27:5 , en Psa 32:6-7 ."}],"4":[{"catchword":"Want Gaza","tekst":"De zin is: God zal Gaza, Askelon, Asdod en andere volken, die rondom of omtrent u wonen, vanwege hunne zonden, zwaarlijk straffen; zo kunt dan gij, Joden, uwe rekening wel maken, dat Hij ulieden ook niet verschonen zal, tenzij gij boete doet. De drie steden, die hier genoemd worden, lagen in der Filistijnen land, en het waren hoofdsteden. Zie Jos 13:3 . Verg. Amo 1:7 ."},{"catchword":"zal verlaten wezen,","tekst":"De burgers daaruit verdreven of vernield zijnde door de Chaldeën."},{"catchword":"in den middag verdrijven,","tekst":"Dat is, openlijk, bij schonen lichten dag. Zie Jer 6:4 ."},{"catchword":"Ekron","tekst":"Het luidt in het Hebr. alsof men zeide, de gewortelde [want dat betekent ] Ekron zal uitgeworteld worden, dat is, met den wortel uitgeworteld worden."}],"5":[{"catchword":"van de landstreek der zee,","tekst":"Hebr. van het koord, touw, snoer. Zie Deu 3:4 ; alzo ook hieronder in vs.6,7. Hier is een beschrijving van het land der Filistijnen, palende aan de Middellandse zee."},{"catchword":"der Cheretim","tekst":"Of, der Cheretieten; zie Eze 25:16 . Zie ook 1Sa 30:14 . Zij waren dappere krijgslieden, en daarom waren zij, naar sommiger gevoelen, van David tot zijne lijfwachters en hellebaardiers verkoren. Zie 2Sa 8:18 , en 2Sa 15:18 , en 1Ch 18:17 ."},{"catchword":"Het woord des HEEREN","tekst":"Dat is, de straf, die de Heere u gedreigd heeft in zijn woord, zal ulieden overkomen; gijlieden, die anderen tot nog toe geplaagd hebt, zult nu ook geplaagd worden, nadat de Heere zijn volk zal gekastijd hebben."},{"catchword":"Ik zal u","tekst":"Te weten, Ik de Heere."},{"catchword":"verdoen,","tekst":"Of, verdelgen."}],"6":[{"catchword":"de landstreek der zee","tekst":"Te weten, het lande der Filistijnen, aan de zee gelegen."},{"catchword":"uitgegraven putten","tekst":"Welke de herders in de dorre heiden graven, om water daarin te vergaderen. De profeet wil in dit vers te kennen geven dat die grote schone kastelen en gebouwen, die daar in die landstreken plachten te staan, zullen afgebroken en verwoest worden, en dat er in plaats daarvan niet dan hutten der herders zullen staan, en in plaats van rijke voortreffelijke personen, schaapherders en andere gewone lieden wonen zullen, die daar hunne huisjes en hutjes zullen opslaan, om voor een tijdlang te verblijven."}],"7":[{"catchword":"de landstreek","tekst":"Dit kan wel enigermate aldus verstaan worden, dat de Joden wederkerende uit de Babylonische gevangenschap, het land der Filistijnen, hetwelk zij ledig en woest zullen vinden, innemen en bezitten zullen; maar voornamelijk is het geestelijkerwijze te verstaan, alzo namelijk dat de Filistijnen en andere natiën der heidenen zich ten tijde van Christus het volk Gods zouden onderwerpen, en der gemeente van Christus zouden ingelijfd worden. Zie Isa 11:14 ."},{"catchword":"dat zij daarin weiden;","tekst":"Dat is, zij zullen aldaar hunne weide en woning hebben, gelijk de schapen des nachts hunne rust in hunne stallen hebben. Anderen verstaan het aldus, dat de Joden Christus aangenomen hebbende, de Filistijnen en anderen het Evangelie zullen prediken, want dat heet ook weiden, gelijk te zien is Joh 10 , en Joh 21:15-17 , en dit is inderdaad alzo geschied, als Gaza, Azotes en de omliggende plaatsen, door de predikatie der apostelen tot Christus zijn bekeerd geworden; Act 8:26 , Act 8:40 , en Act 9:32 , Act 9:35-36 . Verg. Oba 1:18-20 ."},{"catchword":"des avonds","tekst":"De zin is: Daar zal alsdan zulk een rust en vrede tussen hen wezen, dat zelfs des avonds en bij nacht, wanneer gemeenlijk de een voor de ander bevreesd is, elk gerustelijk zal wonen en omgaan."},{"catchword":"als de HEERE,","tekst":"Of, want de Heere hun God zal hen bezoeken, en, enz."},{"catchword":"bezocht,","tekst":"Te weten, met genade, gelijk Psa 8:5 . Eerst hen uit de Babylonische gevangenschap verlossende, daarna uit de gevangenschap van den satan, als Christus, geleden hebbende en uit de doden opstaande, ten hemel zal gevaren zijn en de menigte der gevangenen gevangen zal genomen hebben; Eph 4:8 ."}],"8":[{"catchword":"de beschimping van Moab gehoord,","tekst":"Of, de versmading, of den smaad."},{"catchword":"zich groot gemaakt","tekst":"Oorlog tegen hen voerende, en hun een deel van hun land afnemende, pochende dat zij nog meer land hun wilde afnemen. Zie de aantekening bij Psa 35:26 , en verg. Jer 48 , en Jer 49 ."}],"9":[{"catchword":"zo waarachtig als Ik leef,","tekst":"Hebr. Ik leEf."},{"catchword":"Moab zal zekerlijk zijn","tekst":"De Moabieten en hun land. Zie Jer 48:1 , enz."},{"catchword":"als Sodom,","tekst":"Te weten, enigermate en een tijdlang zal hun land woest liggen; maar Hij wil niet zeggen dat het alzo zal vernield worden, noch dat het in der eeuwigheid zo woest zou blijven, gelijk Sodom."},{"catchword":"een zoutgroeve,","tekst":"Woest en ellendig waar niets wassen zal. Zie Jdg 9:45 ; Psa 107:34 ; Plin lib 31, Nat. Hist. cap. 7."},{"catchword":"tot in eeuwigheid","tekst":"Dat is, een lange tijd. Want deze landen zijn niet altoos dus desolaat gebleven."},{"catchword":"zullen ze beroven,","tekst":"De zin is: Eenige Ammonieten en uit Moabieten Christelijken godsdienst bekeren, en zij zullen in den schoot der gemeente ontvangen en aangenoemen worden. Verg. vs.7, en zie de aantekening bij Isa 11:14 ."},{"catchword":"zal ze erfelijk bezitten","tekst":"Of, zullen ze erven."}],"10":[{"catchword":"in plaats van hun hoogmoed;","tekst":"Of, voor hun hoogmoed, vanwege hunne hovaardij, die zij het volk Gods betoond hebben, toen het in zwarigheid en ellende was."}],"11":[{"catchword":"doen uitteren;","tekst":"Dat is, allengskens teniet maken; men zal hun gene offeranden meer brengen. Dit is geschied in de verschijning van Christus, en daarna."},{"catchword":"een iegelijk","tekst":"Alsof hij zeide: Men zal te dien tijde den waren God niet alleen in Judea eren en aanbidden, maar iedere natie in haar land en stad, zonder dat zij naar Jeruzalem zullen behoeven te reizen. Zie Joh 4:21 ."},{"catchword":"zal Hem aanbidden,","tekst":"Zie de aantekening bij Gen 24:26 ."},{"catchword":"al de eilanden der heidenen","tekst":"Dat is, al de heidense natiën, wie en waar die zijn."}],"12":[{"catchword":"Ook gij, Moren","tekst":"Of, aldus: Wat ook ulieden, o Moren, aangaat, gij zult door mijn zwaard geslagen worden. De zin is: Gij Moren, zult wel eerst verwoest worden, zie 2Ch 14:9 ; maar daarna zult gij alsmede tot Christus gebracht worden. Zie Zep 3:10 . Hebr. ook gij, Moren, zij zullen, enz. Verg. Mic 1:2 met de aantekening aldaar."},{"catchword":"Mijn zwaard zijn","tekst":"Hij noemt den koning Nebukadnezar zijn zwaard, gelijk Assur genoemd wordt, de roede of staf van den toorn Gods, Isa 10:5 ."}],"13":[{"catchword":"Hij zal ook Zijn hand uitstrekken","tekst":"Te weten, de Heere."},{"catchword":"Assur verdoen;","tekst":"Dat is, de Assyriërs."},{"catchword":"stellen tot een verwoesting,","tekst":"Dat is, maken."},{"catchword":"droog als een woestijn","tekst":"Die tevoren waterrijk was; Nah 2:8 ."}],"14":[{"catchword":"volken;","tekst":"Dat is, der omliggende natiën, die hun vee daar zullen legeren. Of, gelijk anderen, allerlei lelijke verschrikkelijke beesten, die bij de vergelegen natiën in de grote wildernis gevonden worden. Versta hierbij, in plaats van mensen en allerlei lieflijkheid."},{"catchword":"roerdomp,","tekst":"Of, putoor."},{"catchword":"haar granaatappelen vernachten;","tekst":"Die boven aan de balken, of op de huizen tot sieraad, plachten geschilderd of gemaakt en gesneden te worden. Verg. Amo 9:1 ."},{"catchword":"een stem","tekst":"Of, derzelver stem, te weten, ene stem dier afgrijselijke dieren, die hier genoemd staan, en Isa 13:21-22 , en Isa 34:11 , enz."},{"catchword":"in den dorpel zijn,","tekst":"Of, aan de posten."},{"catchword":"Hij","tekst":"Te weten, de Heere, of de vijand."},{"catchword":"haar cederwerk","tekst":"Hebr. hare cederen, of zijne cederen; dat is, het beschutwerk van cederhout. Of, hare huizen van cederhout gemaakt."},{"catchword":"zal ontbloot hebben","tekst":"Of, zal afgerukt hebben."}],"15":[{"catchword":"Dit is die stad,","tekst":"Dat is, alzo zal het die stad Nineve gaan, die tevoren zo vol vreugde en blijdschap geweest is."},{"catchword":"die zeker woont,","tekst":"Die gerust is en niemand vreest."},{"catchword":"Ik ben het,","tekst":"Ik ben alleen de onoverwinnelijke, gene stad is bij mij te vergelijken inhoogheid, sterkte, voortreffelijkheid. Verg. Isa 47:8 ."},{"catchword":"hoe is zij geworden tot woestheid,","tekst":"Zie vs.14."},{"catchword":"zal haar aanfluiten,","tekst":"Zie 1Ki 9:8 ; Lam 2:15-16 ; Eze 27:36 ; Mic 6:16 ; Nah 3:19 ."},{"catchword":"bewegen","tekst":"Tot een teken van bespotting, of verwondering."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Search yourselves narrowly, yea search your selves narrowly, [i.e. strive and endeavour with utmost care and diligence, to wit, to be around and reconciled with God, the sense is; enter into yourselves, search, try and examine all your wayes and doings, that ye may rightly understand, how heavily and grievously God must needs be offended with your great and manifold sins. Heb gather, or assembe your selves, the word is properly taken, for gathering of stubble, small sticks, c as Exo 5:7,12 and 1 Kings 17.10. which since it cannot be done, without seeking and searching near and narrowly, therefore it is likewise used for seeking and searching narrowly in general, and making a thorow search] ye people, that are taken with no desire. [viz. to be reconciled with God; or, of doing ought that&acirc;&euro;&trade;s good. Oth. O people not worthy to be desired1]"}],"2":[{"catchword":null,"tekst":"Before the decree bring forth, [i.e. before that come to pass, which is decreed by God against you: God&acirc;&euro;&trade;s decree is then said to bring forth, when it comes to be executed, as the bringing forth of a w function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
