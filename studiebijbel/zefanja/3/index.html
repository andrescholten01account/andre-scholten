d van Mijn toorn, uit te storten; want dit gehele land zal door het vuur van Mijn na-ijver verteerd worden.","9":"Zeker, dan zal Ik tot de volken een reine spraak wenden; opdat zij allen de Naam van de HEERE aanroepen, opdat zij Hem dienen met één schouder³.","10":"Van de zijden van de rivieren van Morenland zullen Mijn ernstige aanbidders, *met* de dochter van Mijn verstrooiden, Mijn offeranden brengen.","11":"Op die dag zult u niet beschaamd zijn vanwege al uw handelingen, waarmee u tegen Mij overtreden hebt; want dan zal Ik uit uw midden wegnemen wie van vreugde opspringen over uw hoogmoed, en u zult zich voortaan niet meer verheffen om Mijn heilige berg.","12":"Maar Ik zal in uw midden doen overblijven een ellendig en arm volk; die zullen op de Naam van de HEERE vertrouwen.","13":"De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedrieglijke tong gevonden worden; maar zij zullen weiden en neerliggen, en niemand zal hen schrik aanjagen.","14":"Zing vrolijk, dochter van Sion, juich, Israël; wees blij, en spring op van vreugde met heel uw hart, dochter van Jeruzalem!","15":"De HEERE heeft uw oordelen weggenomen, Hij heeft uw vijand weggevaagd; de Koning van Israël, de HEERE, is in uw midden, u zult geen kwaad meer zien.","16":"Op die dag zal tegen Jeruzalem gezegd worden: Vrees niet, o Sion! Laat uw handen niet slap worden.","17":"De HEERE, uw God, is in uw midden, een Held, *Die* verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.","18":"De bedroefden, om de bijeenkomst, zal Ik verzamelen, zij zijn uit u; de smaad is een last op haar.","19":"Zie, Ik zal in die tijd al uw verdrukkers verdoen; en Ik zal de hinkende behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het gehele land, waar zij beschaamd zijn geweest.","20":"In die tijd zal Ik u hierheen brengen, in de tijd namelijk dat Ik u verzamelen zal; zeker zal Ik u stellen tot een naam en tot een lof, onder alle volken van de aarde, als Ik uw gevangenschap voor uw ogen terugbrengen zal, zegt de HEERE."},"SV":{"1":"Wee der ijselijke, en der bevlekte, der verdrukkende stad!","2":"Zij hoort naar de stem niet; zij neemt de tucht niet aan; zij vertrouwt niet op den HEERE; tot haar God nadert zij niet.","3":"Haar vorsten zijn brullende leeuwen in het midden van haar; haar rechters zijn avondwolven, die de beenderen niet breken tot aan den morgen.","4":"Haar profeten zijn lichtvaardig, gans trouweloze mannen; haar priesters verontreinigen het heilige, zij doen der wet geweld aan.","5":"De rechtvaardige HEERE is in het midden van haar, Hij doet geen onrecht; allen morgen geeft Hij Zijn recht in het licht, er ontbreekt niet; doch de verkeerde weet van geen schaamte.","6":"Ik heb de heidenen uitgeroeid, hun hoeken zijn verwoest, Ik heb hun straten eenzaam gemaakt, dat niemand daardoor gaat; hun steden zijn verstoord, zodat er niemand is, dat er geen inwoner is.","7":"Ik zeide: Immers zult gij Mij vrezen, gij zult de tucht aannemen, opdat haar woning niet uitgeroeid zou worden; al wat Ik haar bezocht hebbe, waarlijk, zij hebben zich vroeg opgemaakt, zij hebben al hun handelingen verdorven.","8":"Daarom verwacht Mij, spreekt de HEERE, ten dage als Ik Mij opmake tot den roof; want Mijn oordeel is, de heidenen te verzamelen, de koninkrijken te vergaderen, om over hen Mijn gramschap, de ganse hittigheid Mijns toorns uit te storten, want dit ganse land zal door het vuur van Mijn ijver verteerd worden.","9":"Gewisselijk, dan zal Ik tot de volken een reine spraak wenden; opdat zij allen den Naam des HEEREN aanroepen, opdat zij Hem dienen met een eenparigen schouder.","10":"Van de zijden der rivieren der Moren zullen Mijn ernstige aanbidders, *met* de dochter Mijner verstrooiden, Mijn offeranden brengen.","11":"Te dien dage zult gij niet beschaamd wezen vanwege al uw handelingen, waarmede gij tegen Mij overtreden hebt; want alsdan zal Ik uit het midden van u wegnemen, die van vreugde opspringen over uw hovaardij, en gij zult u voortaan niet meer verheffen om Mijns heiligen bergs wil.","12":"Maar Ik zal in het midden van u doen overblijven een ellendig en arm volk; die zullen op den Naam des HEEREN betrouwen.","13":"De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedriegelijke tong gevonden worden; maar zij zullen weiden en nederliggen, en niemand zal hen verschrikken.","14":"Zing vrolijk, gij dochter Sions, juich, Israël; wees blijde, en spring op van vreugde van ganser harte, gij dochter Jeruzalems!","15":"De HEERE heeft uw oordelen weggenomen, Hij heeft uw vijand weggevaagd; de Koning Israëls, de HEERE, is in het midden van u, gij zult geen kwaad meer zien.","16":"Te dien dage zal tot Jeruzalem gezegd worden: Vrees niet, o Sion! laat uw handen niet slap worden.","17":"De HEERE, uw God, is in het midden van u, een Held, *Die* verlossen zal; Hij zal over u vrolijk zijn met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.","18":"De bedroefden, om der bijeenkomst wil, zal Ik verzamelen, zij zijn uit u; de schimping is een last op haar.","19":"Ziet, Ik zal te dien tijde al uw verdrukkers verdoen; en Ik zal de hinkenden behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het ganse land, waar zij beschaamd zijn geweest.","20":"Te dier tijd zal Ik ulieden herwaarts brengen, ten tijde namelijk, als Ik u verzamelen zal; zekerlijk Ik zal ulieden zetten tot een naam en tot een lof, onder alle volken der aarde, als Ik uw gevangenissen voor uw ogen wenden zal, zegt de HEERE."},"KJV":{"1":"Woe to her that is filthy and polluted, to the oppressing city!","2":"She obeyed not the voice; she received not correction; she trusted not in the LORD; she drew not near to her God.","3":"Her princes within her *are* roaring lions; her judges *are* evening wolves; they gnaw not the bones till the morrow.","4":"Her prophets *are* light *and* treacherous persons: her priests have polluted the sanctuary, they have done violence to the law.","5":"The just LORD *is* in the midst thereof; he will not do iniquity: every morning doth he bring his judgment to light, he faileth not; but the unjust knoweth no shame.","6":"I have cut off the nations: their towers are desolate; I made their streets waste, that none passeth by: their cities are destroyed, so that there is no man, that there is none inhabitant.","7":"I said, Surely thou wilt fear me, thou wilt receive instruction; so their dwelling should not be cut off, howsoever I punished them: but they rose early, *and* corrupted all their doings.","8":"Therefore wait ye upon me, saith the LORD, until the day that I rise up to the prey: for my determination *is* to gather the nations, that I may assemble the kingdoms, to pour upon them mine indignation, *even* all my fierce anger: for all the earth shall be devoured with the fire of my jealousy.","9":"For then will I turn to the people a pure language, that they may all call upon the name of the LORD, to serve him with one consent.","10":"From beyond the rivers of Ethiopia my suppliants, *even* the daughter of my dispersed, shall bring mine offering.","11":"In that day shalt thou not be ashamed for all thy doings, wherein thou hast transgressed against me: for then I will take away out of the midst of thee them that rejoice in thy pride, and thou shalt no more be haughty because of my holy mountain.","12":"I will also leave in the midst of thee an afflicted and poor people, and they shall trust in the name of the LORD.","13":"The remnant of Israel shall not do iniquity, nor speak lies; neither shall a deceitful tongue be found in their mouth: for they shall feed and lie down, and none shall make *them* afraid.","14":"Sing, O daughter of Zion; shout, O Israel; be glad and rejoice with all the heart, O daughter of Jerusalem.","15":"The LORD hath taken away thy judgments, he hath cast out thine enemy: the king of Israel, *even* the LORD, *is* in the midst of thee: thou shalt not see evil","16":"In that day it shall be said to Jerusalem, Fear thou not: *and to* Zion, Let not thine hands be slack.","17":"The LORD thy God in the midst of thee *is* mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.","18":"I will gather *them that are* sorrowful for the solemn assembly, *who* are of thee, *to whom* the reproach of it *was* a burden.","19":"Behold, at that time I will undo all that afflict thee: and I will save her that halteth, and gather her that was driven out; and I will get them praise and fame in every land where they have been put to shame.","20":"At that time will I bring you *again*, even in the time that I gather you: for I will make you a name and a praise among all people of the earth, when I turn back your captivity before your eyes, saith the LORD."}},"tsk":{"1":[{"kopje":"de smerige","refs":["Lev 1:16"]},{"kopje":"de onderdrukkende","refs":["Jes 5:7","Jes 30:12","Jes 59:13","Jer 6:6","Jer 22:17","Ezech 22:7","Ezech 22:29","Amos 3:9","Amos 4:1","Micha 2:2","Zach 7:10","Mal 3:5"]}],"2":[{"kopje":"naar de stem","refs":["Deut 28:15-68","Neh 9:26","Jer 7:23-28","Jer 22:21","Zach 7:11-14"]},{"kopje":"neemt aan","refs":["Jes 1:5","Jer 2:30","Jer 5:3","Ezech 24:13"]},{"kopje":"de tucht","refs":["Ps 50:17","Spr 1:7","Spr 5:12","Jer 32:33","Jer 35:13","Jer 35:17","Joh 3:18","Joh 3:19"]},{"kopje":"zij vertrouwt","refs":["Ps 78:22","Jes 30:1-3","Jes 31:1","Jer 17:5","Jer 17:6"]},{"kopje":"nadert zij","refs":["Ps 10:4","Jes 29:13","Jes 43:22","Hebr 10:22"]}],"3":[{"kopje":"vorsten","refs":["Job 4:8-11","Ps 10:8-10","Spr 28:15","Jes 1:23","Jer 22:17","Ezech 22:6","Ezech 22:25-27","Micha 3:1-4","Micha 3:9-11"]},{"kopje":"avondwolven","refs":["Jer 5:6","Hab 1:8"]}],"4":[{"kopje":"lichtvaardig","refs":["Jes 9:14","Jes 56:10-12","Jer 5:31","Jer 6 wl\" data-l=\"L8\" data-code=\"H5971\">van</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H776\">de</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H776\">aarde</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H6908\">als</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H7622\">Ik</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H7622\">uw</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H7622\">gevangenschap</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H7622\">voor</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5869\">uw</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5869\">ogen</span> terugbrengen <span class=\"wl\" data-l=\"L12\" data-code=\"H559\">zal</span>, <span class=\"wl\" data-l=\"L12\" data-code=\"H559\">zegt</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H559\">de</span> HEERE."},"koppeling_kjv":{"1":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> to her that is <span class=\"wl wl-kjv\" data-code=\"H4754\">filthy</span> and <span class=\"wl wl-kjv\" data-code=\"H1351\">polluted,</span> to the <span class=\"wl wl-kjv\" data-code=\"H3238\">oppressing</span> city!","2":"She <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> not the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice;</span> she <span class=\"wl wl-kjv\" data-code=\"H3947\">received</span> not <span class=\"wl wl-kjv\" data-code=\"H4148\">correction;</span> she <span class=\"wl wl-kjv\" data-code=\"H982\">trusted</span> not in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> she drew not <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> to her God.","3":"Her <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">within</span> her are <span class=\"wl wl-kjv\" data-code=\"H7580\">roaring</span> <span class=\"wl wl-kjv\" data-code=\"H738\">lions;</span> her <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> are <span class=\"wl wl-kjv\" data-code=\"H6153\">evening</span> <span class=\"wl wl-kjv\" data-code=\"H2061\">wolves;</span> they gnaw not the <span class=\"wl wl-kjv\" data-code=\"H1633\">bones</span> till the morrow.","4":"Her <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> are <span class=\"wl wl-kjv\" data-code=\"H6348\">light</span> and <span class=\"wl wl-kjv\" data-code=\"H900\">treacherous</span> <span class=\"wl wl-kjv\" data-code=\"H582\">persons:</span> her <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> have <span class=\"wl wl-kjv\" data-code=\"H2490\">polluted</span> the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary,</span> they have done <span class=\"wl wl-kjv\" data-code=\"H2554\">violence</span> to the law.","5":"The <span class=\"wl wl-kjv\" data-code=\"H6662\">just</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> thereof; he will not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity:</span> <span class=\"wl wl-kjv\" data-code=\"H1242\">every</span> <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> doth he <span class=\"wl wl-kjv\" data-code=\"H5414\">bring</span> his <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> to <span class=\"wl wl-kjv\" data-code=\"H216\">light,</span> he <span class=\"wl wl-kjv\" data-code=\"H5737\">faileth</span> not; but the <span class=\"wl wl-kjv\" data-code=\"H5767\">unjust</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> no shame.","6":"I have cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations:</span> their <span class=\"wl wl-kjv\" data-code=\"H6438\">towers</span> are <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate;</span> I made their <span class=\"wl wl-kjv\" data-code=\"H2351\">streets</span> <span class=\"wl wl-kjv\" data-code=\"H2717\">waste,</span> that none passeth <span class=\"wl wl-kjv\" data-code=\"H5674\">by:</span> their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> are <span class=\"wl wl-kjv\" data-code=\"H6658\">destroyed,</span> so that there is no <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> that there is none inhabitant.","7":"I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Surely thou wilt <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> me, thou wilt <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> <span class=\"wl wl-kjv\" data-code=\"H4148\">instruction;</span> so their <span class=\"wl wl-kjv\" data-code=\"H4583\">dwelling</span> should not be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">howsoever</span> I <span class=\"wl wl-kjv\" data-code=\"H6485\">punished</span> them: <span class=\"wl wl-kjv\" data-code=\"H403\">but</span> they rose <span class=\"wl wl-kjv\" data-code=\"H7925\">early,</span> and <span class=\"wl wl-kjv\" data-code=\"H7843\">corrupted</span> all their doings.","8":"Therefore <span class=\"wl wl-kjv\" data-code=\"H2442\">wait</span> ye upon me, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> until the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that I rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H5706\">prey:</span> for my <span class=\"wl wl-kjv\" data-code=\"H4941\">determination</span> is to <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H6908\">assemble</span> the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms,</span> to <span class=\"wl wl-kjv\" data-code=\"H8210\">pour</span> upon them mine <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation,</span> even all my <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger:</span> for all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall be <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> with the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> of my jealousy.","9":"For then will I <span class=\"wl wl-kjv\" data-code=\"H2015\">turn</span> to the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> a <span class=\"wl wl-kjv\" data-code=\"H1305\">pure</span> <span class=\"wl wl-kjv\" data-code=\"H8193\">language,</span> that they may all <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> upon the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him with <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> consent.","10":"From <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">rivers</span> of <span class=\"wl wl-kjv\" data-code=\"H3568\">Ethiopia</span> my <span class=\"wl wl-kjv\" data-code=\"H6282\">suppliants,</span> even the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of my <span class=\"wl wl-kjv\" data-code=\"H6327\">dispersed,</span> shall <span class=\"wl wl-kjv\" data-code=\"H2986\">bring</span> mine offering.","11":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shalt thou not be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> for all thy <span class=\"wl wl-kjv\" data-code=\"H5949\">doings,</span> wherein thou hast <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressed</span> against me: for then I will take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> out of the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of thee them that <span class=\"wl wl-kjv\" data-code=\"H5947\">rejoice</span> in thy <span class=\"wl wl-kjv\" data-code=\"H1346\">pride,</span> and thou shalt no <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> be <span class=\"wl wl-kjv\" data-code=\"H1361\">haughty</span> because of my <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> mountain.","12":"I will also <span class=\"wl wl-kjv\" data-code=\"H7604\">leave</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of thee an <span class=\"wl wl-kjv\" data-code=\"H6041\">afflicted</span> and <span class=\"wl wl-kjv\" data-code=\"H1800\">poor</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H2620\">trust</span> in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the LORD.","13":"The <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H3577\">lies;</span> neither shall a <span class=\"wl wl-kjv\" data-code=\"H8649\">deceitful</span> <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> be <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in their <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth:</span> for they shall <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> and lie <span class=\"wl wl-kjv\" data-code=\"H7257\">down,</span> and none shall make them afraid.","14":"<span class=\"wl wl-kjv\" data-code=\"H7442\">Sing,</span> O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion;</span> <span class=\"wl wl-kjv\" data-code=\"H7321\">shout,</span> O <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> be <span class=\"wl wl-kjv\" data-code=\"H8055\">glad</span> and <span class=\"wl wl-kjv\" data-code=\"H5937\">rejoice</span> with all the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of Jerusalem.","15":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath taken <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> he hath cast <span class=\"wl wl-kjv\" data-code=\"H6437\">out</span> thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemy:</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> even the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> is in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of thee: thou shalt not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> evil","16":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> thou not: and to <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> Let not thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> be slack.","17":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of thee is <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty;</span> he will <span class=\"wl wl-kjv\" data-code=\"H3467\">save,</span> he will <span class=\"wl wl-kjv\" data-code=\"H7797\">rejoice</span> over thee with <span class=\"wl wl-kjv\" data-code=\"H8057\">joy;</span> he will <span class=\"wl wl-kjv\" data-code=\"H2790\">rest</span> in his <span class=\"wl wl-kjv\" data-code=\"H160\">love,</span> he will <span class=\"wl wl-kjv\" data-code=\"H1523\">joy</span> over thee with singing.","18":"I will <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> them that are <span class=\"wl wl-kjv\" data-code=\"H3013\">sorrowful</span> for the solemn <span class=\"wl wl-kjv\" data-code=\"H4150\">assembly,</span> who are of thee, to whom the <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> of it was a burden.","19":"Behold, at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> I will <span class=\"wl wl-kjv\" data-code=\"H6213\">undo</span> all that <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> thee: and I will <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> her that <span class=\"wl wl-kjv\" data-code=\"H6760\">halteth,</span> and <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> her that was driven <span class=\"wl wl-kjv\" data-code=\"H5080\">out;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7760\">get</span> them <span class=\"wl wl-kjv\" data-code=\"H8416\">praise</span> and <span class=\"wl wl-kjv\" data-code=\"H8034\">fame</span> in every <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> where they have been put to shame.","20":"At that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> will I <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> you again, even in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> that I <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> you: for I will <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> you a <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> and a <span class=\"wl wl-kjv\" data-code=\"H8416\">praise</span> among all <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> when I turn <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> your <span class=\"wl wl-kjv\" data-code=\"H7622\">captivity</span> before your <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"der ijselijke,","tekst":"Of, vervuilde, lasterlijke, of gierige. Anders: wee den krop, dat is, de stad die een groten krop heeft, die alles verslindt, gelijk de roofvogels, die alles wat zij vinden inslokken, hetzij ruw of rauw."},{"catchword":"der bevlekte,","tekst":"Of, roofstad. Het Hebr. woord betekent roven en onderdrukken. Anders: de besmettende stad, te weten met allerlei gruwelijke zonden. Eenigen hebben hier de duifstad, welke vogel een grote krop heeft en veel spijs opsnapt."},{"catchword":"der verdrukkende stad","tekst":"Versta, de stad Jeruzalem, wier koningen, vorsten en verscheidene machtige en trotsche burgers en inwoners velen menschen grooten overlast gedaan hebben. Verg. met dit vs. Isa 1 , en Isa 5 ."}],"2":[{"catchword":"stem niet;","tekst":"De vermaning des Heeren door zijne profeten."},{"catchword":"zij neemt de tucht niet aan;","tekst":"Zij laat zich niet onderrichten, hetwelk een teken van dwaasheid is; Pro 1:7 . Verg. Jer 2:30 , en Jer 5:3 , en Jer 7:28 ."},{"catchword":"nadert zij niet","tekst":"Te weten, van ganse harte; verg. Isa 29:13 ; maar Hos 6:1 , vermanen de godzaligen elkander tot den Heere ter keren."}],"3":[{"catchword":"avondwolven,","tekst":"Die des avonds romdom sluipen, te weten, om op de schapen te loeren; zie Hab 1:8 . Men kan ook door avond verstaan den nacht, gelijk Zep 2:7 ."},{"catchword":"die de beenderen","tekst":"Maar terstond hunne prooi met vlees en beenderen opvreten, nietmetal, ja zelf de beenderen niet overlatende tot des anderen daags 's morgens. Hebr. die niet ontbenen tot 's morgens. Zie Num 24:8 , en verg. Jer 5:6 ."},{"catchword":"tot aan den morgen","tekst":"Of, op den morgen, of tot op den morgen."}],"4":[{"catchword":"trouweloze mannen;","tekst":"Hebr. mannen der trouweloosheden, die God noch de mensen getrouw zijn."},{"catchword":"verontreinigen het heilige,","tekst":"Dat is, ontheiligen, of ontwijden het heiligdom, of hetgeen den Heere gehieligd en geofferd werd; of, zij prediken het woorde Gods niet oprecht en leggen het niet uit in zijn rechten zin."},{"catchword":"zij doen der wet geweld aan","tekst":"Zie de aantekening bij Eze 22:26 ; verg. Mat 23:16 ; Mar 7:9-10 , enz."}],"5":[{"catchword":"De rechtvaardige HEERE","tekst":"Of, de Heere die rechtvaardig is, is, enz."},{"catchword":"is in het midden","tekst":"Ten aanzien dat Hij te Jeruzalem zijnen godsdienst hed opgericht. Eenigen menen dat dit de woorden zijn der Joden, dit den profeet voorwerpende op zijne woorden, vs.4."},{"catchword":"van haar,","tekst":"Te weten, van den stad Jeruzalem."},{"catchword":"allen morgen","tekst":"Hebr. in morgen, in morgen; dat is, alle dagen; zie 2Ch 36:15 ; Jer 7:13 , Jer 7:25 , en Jer 11:7 , en Jer 25:3 ."},{"catchword":"geeft Hij Zijn recht","tekst":"Dat is, laat Hij zijn recht openlijk leren, te weten, door zijne profeten, die, buiten twijfel, gedaan hebben hetgeen Paulus zijnen discipel Timotheus vermaant 1Ti 4:16 , en 2Ti 4:2 ."},{"catchword":"daar ontbreekt niets;","tekst":"Te weten, wat ontbreken kan tot onderrichting van dit volk; Isa 5:4 ."},{"catchword":"weet van geen schaamte","tekst":"Dat is, hij vraagt naar eer noch oneer. Verg. Jer 3:3 , enz. en Jer 5:3 ."}],"6":[{"catchword":"hun hoeken zijn verwoest,","tekst":"Zie Zep 1:16 ; doch enigen verstaan door de hoeken de uiterste grenzen, of palen des lands."},{"catchword":"zodat er niemand is,","tekst":"Dat is, dat er geen mens in dezelve te vinden is; verg. Zep 2:5-6 , Zep 2:14-15 ."}],"7":[{"catchword":"Ik zeide","tekst":"Dat is, Ik dacht bij mijzelven."},{"catchword":"Immers zult","tekst":"Te weten, aanmerkende de traffen, die den heidenen zijn overkomen. Anderen: vreest mij nochtans, neem de tucht aan, enz."},{"catchword":"gij Mij vrezen,","tekst":"O Jeruzalem, zult mij vrezen, u aan de heidenen spiegelende."},{"catchword":"haar woning","tekst":"Dat is, de stad Jeruzalem. Anderen verstaan hierdoor de woning de inwoners der stad Jeruzalem; of hare woning, voor hare woningen."},{"catchword":"al wat Ik haar bezocht hebbe,","tekst":"Of, [door] alles waarmede Ik hen bezocht heb; door hen, verstaan enigen de heidenen, andere de Joden."},{"catchword":"waarlijk,","tekst":"Of, nochtans hebben zij zich gehaast; enz.; dat is, zij hebben zichzelven moedwillig vroeg in het verderf gebracht; of, van des morgens vroeg hebben zij al hunne werken bedorven. of, nochtans hebben zij al hunne werken bedorven. Zie van dusdanige samenvoeging van twee woorden, Psa 45:5 ."}],"8":[{"catchword":"verwacht Mij,","tekst":"Hij spreekt nog de bozen onder de Joden aan. De zin is: Past er vrij op, Ik zal bij u gewisselijk komen, en zal u door de Chaldeën en andere volken bezoeken."},{"catchword":"Mijn oordeel is,","tekst":"Dat is, het besluit van mijn voornemen."},{"catchword":"de heidenen te verzamelen,","tekst":"Te weten, de Chaldeën en andere volken. Zie Eze 16:37 ."},{"catchword":"over hen Mijn gramschap,","tekst":"Te weten, over de Joden, namelijk, over de halsstarrige Joden; zie Zep 1:18 ."},{"catchword":"uit te storten,","tekst":"Zie Psa 79:6 , en verg. Eze 22:31 ."},{"catchword":"ganse land","tekst":"Te weten, het ganse Joodse land, gelijk in Zep 1:18 . Doch versta dit hier van het grootste deel der inwoners van het Joodse land. Alzo staat er in Gen 41:57 :Alle landen kwamen in Egypte tot Jozef; dat is, vele van de inwoners der omliggende landen."}],"9":[{"catchword":"dan","tekst":"Te weten, nadat Ik die volken en de Joden alzo zal bezocht hebben. Anderen verstaan door [dan] hier betekent wordt de tijd der verschijning van den Messias."},{"catchword":"zal Ik tot de volken","tekst":"Of, asldan zal Ik den volken de lippen veranderen in reine [lippen]; dat is, Ik zal mijne uitverkorenen onder de heidenen wederbaren door de Heilige Geest, dat hun mond en hart rein zullen zijn; dat zij God rein zullen gevoelen en spreken, Hem heilig dienende; zie Isa 57:19 ."},{"catchword":"spraak wenden;","tekst":"Hebr. lip."},{"catchword":"met een eenparigen schouder","tekst":"Dat is, een manier van spreken, genomen van de lastdragende mensen of beesten. Zie de aantekening bij Hos 6:9 . Verg. Jer 32:39 , en zie de vervulling Act 1:14 , en Act 2:1 , Act 2:46 , en Act 4:32 . Zie ook Joh 10:16 ; Eph 2:14 , enz."}],"10":[{"catchword":"der Moren","tekst":"Dat is, van Morenland. Doch Moren natiën; Isa 18:1 , Isa 18:7 , en Isa 60:4 ."},{"catchword":"ernstige aanbidders,","tekst":"Zie de aantekening bij Gen 25:21 , en Eze 35:13 . Versta hier degenen, die tot den waren God bekeerd zijnde, dagelijks hunne gebeden tot God doen zullen."},{"catchword":"met de dochter Mijner verstrooiden,","tekst":"Dat is, mitsgaders de Joden, die in de Babylonische gevangenschap zijn verstrooid geweest, die mij zo lief zijn als een dochter hare moeder is. Verg. Joh 11:52 . Sommigen overzetters voegen hier in voor met het woord namelijk; in deze zin: Het geschenk, hetwelk men mij brengen zal, zullen zijn de Joden, die verstrooid zijn in de landen, gelegen aan de zijde van de rivieren der Moren."},{"catchword":"offeranden brengen","tekst":"Te weten, geestelijke offeranden, of geschenken; dat is, zij zullen mij dienen en gehoorzamen. Verg. Isa 18:7 ; Mal 1:11 ; Rom 12:1 . Anders: van de andere zijde van de rivier der Moren, zullen mij mijn ernstige aanbidders toegebracht worden tot een geschenk. Zie de volvoering dezer profetie Act 8:27 , Act 8:35-36 ."}],"11":[{"catchword":"gij","tekst":"O mijn volk, o mijne kerk."},{"catchword":"niet beschaamd wezen","tekst":"De zin is: Dewijl gij zult geheiligd en van al uwe zonden gereinigd zijn, door het bloed en den Geest van den Heere Jezus Christus, zo zult gij voor den rechterstoel Gods daarover niet beschaamd worden."},{"catchword":"hovaardij,","tekst":"Anders: heerlijkheid. Want het Hebr. woord wordt in het goede en in het kwade genoemn. En hier schijnt dit de zin te wezen: Daar zullen voortaan geen onder u gevonden worden, die zich zullen verhovaardigen over de uitwendige ceremoniën en dien voortreffelijken tempel. [ Jer 7:4 ,] want het rijk Gods en zijne gemeente zal voortaan door de ganse wereld verspreid worden; Joh 4:21 , Joh 4:23 ."},{"catchword":"om Mijns heiligen bergs wil","tekst":"Of, op mijn heiligen berg. Hebr. op den berg mijner heiligheid; dat is, omdat gij offert in mijn tempel op den berg des Heeren, of vanwege het ijdel vertrouwen op de uiterlijke ceremoniën, zonder te letten op de heiliging der conscientie."}],"12":[{"catchword":"een ellendig","tekst":"Ten aanzien dat Ik het wel terdege zal gekastijd en vernederd hebben."},{"catchword":"arm volk;","tekst":"Dat is, gering en veracht bij de wereld, en door Gods genade nochtans rijk gemaakt in het geloof en andere geestelijke gaven."},{"catchword":"op den Naam des HEEREN betrouwen","tekst":"Dat is, op den Heere, niet op enige uitwendige dingen, hetzij Jeruzalem, of den tempel, of iets dergelijks; maar alleen op den Heere. Zie Jer 9:23-24 ."}],"13":[{"catchword":"De overgeblevenen van Israël","tekst":"Hebr. het overblijfsel van Israël zullen geen onrecht doen; te weten, die de Heere uit den hoop der verworpen en verloren Joden uitverkoren heeft."},{"catchword":"zullen geen onrecht doen,","tekst":"Te weten, met opgezetten moedwil, of tegen hunne conscientie. Zie 1Jo 3:9 ."},{"catchword":"leugen spreken,","tekst":"Dat is, zij zullen zich niet begeven nog gewennen tot liegen en bedriegen, maar zij zullen zich benaarstigen om te doen al wat heilig, oprecht en wel gedaan is."},{"catchword":"zij zullen weiden en nederliggen,","tekst":"Dat is, God de Heere zal hen beschutten en bewaren voor al het kwaad, dat de boze mensen hun zoeken aan te doen. Verg. Mic 4:4 ."},{"catchword":"niemand zal hen verschrikken","tekst":"Dat is, zij zullen zeker en gerust leven. De zin is: De boze boeven zullen hen niet beschadigen, naar hunnen moedwil."}],"14":[{"catchword":"juich, Israël;","tekst":"Het Hebr. woord staat in het meervoudig getal, en Israël in het enkelvoudige."},{"catchword":"gij dochter Jeruzalems","tekst":"Dat is, gij Israëlieten. Het betekent hetzelfde wat gij dochteren van Zion betekent, namelijk hier de gemeente der gelovigen van het Nieuwe Testament."}],"15":[{"catchword":"oordelen weggenomen,","tekst":"Dat is,kastijdingen of straffen vanwege de zonden. Dat is, de oorzaak der blijdschap, waarvan in vs.14 gesproken wordt."},{"catchword":"uw vijand","tekst":"Te weten, de Assyriërs, Chaldeën, enz., ja ook uw geestelijke vijanden, den duivel en de hel, heeft Hij onder uwe voeten gelegd; 1Co 15:25-26 , 1Co 15:56-57 ."},{"catchword":"weggevaagd;","tekst":"Of, weggeruimd, uit den weg geweerd; zie Gen 24:31 ."},{"catchword":"is in het midden van u,","tekst":"Te weten, om u te beschutten en te beschermen."},{"catchword":"gij zult geen kwaad meer zien","tekst":"Dat is, Gods, gij behoeft geen kwaad meer te vrezen. Want daar is niets, dat ons scheiden kan van de liefde Gods, die daar is in Christus Jezus onzen Heere; Rom 8:39 ; zie Lev 14:36 ; Job 7:7 ; Psa 80:10 ; Isa 40:3 , en Isa 57:14 , en Isa 62:10 ; Mal 3:1 ."}],"16":[{"catchword":"o Sion","tekst":"Anders: [tot] Zion."},{"catchword":"laat uw handen niet slap worden","tekst":"Dat is, geef den moed niet verloren, en vertraag niet in den ijver der godzaligheid; de reden is vs.15, namelijk omdat de Heere in het midden van hen was. Zie deze manier van spreken bij 2Sa 4:1 en de aantekening aldaar."}],"17":[{"catchword":"een Held,","tekst":"In en door Christus allen overwinnen wij; Rom 8:37 ; 1Co 15:57 ; 1Jo 5:4-5 ."},{"catchword":"over u vrolijk zijn met blijdschap,","tekst":"Vanwege de zonderlinge liefde, die Hij u is toedragende."},{"catchword":"Hij zal zwijgen in Zijn liefde,","tekst":"Of, stil zijn, of gerust zijn; dat is, Hij zal genoegen hebben in de liefde welke Hij te uwaarts dragen zal, 1Pe 2:5 . Of Hij zal u niet meer alzo plagen gelijk Hij vóór dezen gedaan heeft, dewijl Hij u in Christus liefheeft, en u uwe zonden vergeeft."}],"18":[{"catchword":"De bedroefden,","tekst":"Dat is, die treurig en bedroefd zijn omdat zij in den tempel niet mogen samenkomen, tot oefening van den godsdienst. Verg. Psa 42:2-3 , Psa 42:5 ."},{"catchword":"zij zijn uit u;","tekst":"Dewijl zij ook Gods volk zijn; o uit u; o Jeruzalem, dat is, uit Gods volk."},{"catchword":"op haar","tekst":"Te weten, de bedroefde gemeente, namelijk als zij bij die spotvogels moeten verkeren, die God en zijn Woord beschimpen. Zie doorgaans Psa 42 ."}],"19":[{"catchword":"de hinkenden behoeden,","tekst":"Dat is, mijne kerk, die nu aanstoot lijdt. Zie de aantekening bij Mic 4:6 , en verg. Eze 34:16 ; Mic 4:7 ."},{"catchword":"de uitgestotenen verzamelen;","tekst":"Door de uitgestotenen verstaan enigen de heidenen, gelijk ook Mic 4:6 ; anderen die, welken in ballingschap vervoerd en verstoten waren."},{"catchword":"Ik zal ze stellen tot een lof,","tekst":"Te weten, mijn volk, de kerk, die Hij straks genoemd heeft de hinkende, of kreupele en uitgestotenen."},{"catchword":"tot een naam,","tekst":"Dat is, tot eer, gelijk in vs.20."},{"catchword":"in het ganse land,","tekst":"Hebr. in het ganse land hunner schaamte. Anders: welker schaamte over de ganse aarde geweest is. In plaatsen waar men hun overal schande en smaad heeft aangedaan, inzonderheid bij den Assyriërs en Chaldeën, die hun spot met Gods volk dreven."}],"20":[{"catchword":"ulieden","tekst":"O gij Joden."},{"catchword":"herwaarts brengen,","tekst":"Te weten, in uw land, waar gij zozeer naar verlangt."},{"catchword":"zekerlijk","tekst":"Of, want, of Dan."},{"catchword":"onder alle volken der aarde,","tekst":"Dat is, te verstaan te dien aanzien, dat de kerk door de ganse wereld zou uitgebreid worden ten tijde der verschijning van den Messias."},{"catchword":"uw gevangenissen","tekst":"Dat is, het groot getal uwer gevangenen. Verg. Amo 9:14 ."}]},"kanttekeningen_en":{"1":[{"catchword":"Wo unto the heinous","tekst":"Or, corrupt, rotten, vicious, or greedy. Oth. Wo to the crop. i.e. the city with the great crop, that followes up all like unto the birds of prey, that swallow all they meet with though never so course or raw"},{"catchword":"and the defiled:","tekst":"or, prey-city: the Hebr. Word signifies to prey and oppress. Oth. The strained city. Viz. with all manner of abominable sins. Some read here, the pigeon-city, the sort of fowl having a great crop, and devouring up much meat"},{"catchword":"the oppressing city:","tekst":"meaning, whose kings and princes and oter mighty and insolent citizens and inhabitants were wont variously and grievously to abuse and oppress many. Compare with this verse, the first and fifth chapters of the prophet Isaiah."}],"2":[{"catchword":"She doth not hearken after the voice","tekst":"that is, after the warnings and exhortations of the LORD by his prophets"},{"catchword":"she doth not receive instructions:","tekst":"i.e. she refuseth to be instructed, which is a sure mark f folly Prov. 1.7. compare Jer. 2.30. and chapter 5.3. and chap. 7.28."},{"catchword":"she trusteth no in the LORD; she draweth not inceer to her LORD","tekst":"viz. with all her heart. Compare Isa 29:12. but, Hos. 6.1 the godly call one upon another, to turn unto the LORD."}],"3":[{"catchword":"Princes are roaring lions in the midst of her","tekst":"see Prov. 28.15. and compare Ezek. 22.27."},{"catchword":"her Judge are evening-woves","tekst":"the range about in the evening, to see what sheep they may catch and worrie. See Hab. 1.8. by the evening here the night also may be understood; as Hab 2.6."},{"catchword":"that do not break the bones until the morning","tekst":"Or, on the morning, but presently devour all, flesh and bones together, not leaving so much as the bare bones behinde to the next morning. Heb. That do not unbone (exossare) in the morning. See Num. 24. on verse 8. and compare Jer. 5.6."}],"4":[{"catchword":"Heb. Men of faithlesse; which are faithful to neither God nor man; their; their preist pollute the holy (thing)","tekst":"i.e. they profane, or, unhallow the sanctuary; or, that which is hallowed and consecrated to the LORD: or, they do not preach the word of God uprightly, nor explain the true meaning thereof"},{"catchword":"they do violence to the law","tekst":"see Ezek. 22. the annotate. R verse 26. compare are Mat. 23.16. and Mark 7.9, 10, 10, &c."}],"5":[{"catchword":"The righteous LORD","tekst":"Or, the Lord that is righteous"},{"catchword":"is in the midst of her","tekst":"to wit, the city of Jerusalem; in regard that there he set up his worship; some conceive that these are the Jewes words, objected against those of the prophet, verse 4."},{"catchword":"he doth no wrong: every morning","tekst":"Heb. In morning, in morning i.e. dayly. See Chro. 36.15. Jer. 5.13. and 7.25. and 11.7. & 25.3"},{"catchword":"doth he give his right in the light","tekst":"i.e. doth he cause his right or judgement to be publickly taught, viz. by his Prophets who doubtless did what Paul commends to his disciple Timotheus 1 Tim. 4.16 and 2 Tim 4.2."},{"catchword":"there is no want","tekst":"to wit,of any thing, whereby this people may be instructed Isa 5:4."},{"catchword":"yet the perverse knows of no shame","tekst":"all is like to him. Comp. Jer. 3.3. &c and chap. 5.3."}],"6":[{"catchword":"I have destroyed the heathen, their corners","tekst":"see above chap. 1.16. yet some do here understand by corners the uttermost borders or frontiers of their countries"},{"catchword":"are laid waste; I have made their streets solitarie, that none passeth them: their cities are destroyed, so that there is none, that there is no inhabitant","tekst":"i.e. there is not a man to be found in them. Comp. above chap. 2.5, 56.14, 15."}],"7":[{"catchword":"I said","tekst":"i.e. I thought with my self"},{"catchword":"sure","tekst":"namely, in consideration of the judgements, that were executed upon the heathen"},{"catchword":"thou","tekst":"O Jerusalem"},{"catchword":"wilt fear me, thou wilt receive instruction","tekst":"taking example and warning by the Heathen, oth. R /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {

}

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
