","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Voor de koorleider*, een psalm van David, de knecht van de HEERE, die de woorden van dit lied tot de HEERE gesproken heeft, ten dage dat de HEERE hem gered had uit de hand van al zijn vijanden, en uit de hand van Saul.","2":"Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte!","3":"De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek.","4":"Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.","5":"Banden van de dood hadden mij omvangen, en beken van Belial verschrikten mij.","6":"Banden van het graf omringden mij, strikken van de dood bejegenden mij.","7":"Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; Hij hoorde mijn stem uit Zijn paleis, en mijn geroep voor Zijn aangezicht kwam in Zijn oren.","8":"Toen daverde en beefde de aarde, en de gronden van de bergen beroerden zich en daverden, omdat Hij ontstoken was.","9":"Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daarvan aangestoken.","10":"En Hij boog de hemel, en daalde neer, en donkerheid was onder Zijn voeten.","11":"En Hij voer op een cherub, en vloog; ja, Hij vloog snel op de vleugels van de wind.","12":"Duisternis zette Hij tot Zijn verberging; rondom Hem was Zijn tent, duisterheid van water, wolken van de hemel.","13":"Van de glans die voor Hem was, dreven Zijn wolken daarheen, hagel en vurige kolen.","14":"En de HEERE donderde in de hemel, en de Allerhoogste gaf Zijn stem, hagel en vurige kolen.","15":"En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.","16":"En de diepe kolken van het water werden gezien, en de gronden van de wereld werden ontdekt, van Uw schelden, o HEERE! van het geblaas van de wind van Uw neus.","17":"Hij zond van de hoogte, Hij nam mij, Hij trok mij op uit veel water.","18":"Hij verloste mij van mijn sterke vijand, en van mijn haters, omdat zij machtiger waren dan ik.","19":"Zij hadden mij bejegend ten dage van mijn ongeval; maar de HEERE was mij tot een Steunsel.","20":"En Hij voerde mij uit in de ruimte, Hij rukte mij eruit, want Hij had lust aan mij.","21":"De HEERE vergold mij naar mijn gerechtigheid, Hij gaf mij weer naar de reinheid van mijn handen.","22":"Want ik heb de wegen van de HEERE gehouden, en ben van mijn God niet goddeloos afgegaan.","23":"Want al Zijn rechten waren voor mij, en Zijn inzettingen deed ik niet van mij weg.","24":"Maar ik was oprecht bij Hem, en ik wachtte mij voor mijn ongerechtigheid.","25":"Zo gaf mij de HEERE weer naar mijn gerechtigheid, naar de reinheid van mijn handen, voor Zijn ogen.","26":"Bij de goedertierene houdt U Zich goedertieren, bij de oprechte man houdt U Zich oprecht.","27":"Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.","28":"Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.","29":"Want U doet mijn lamp lichten; de HEERE, mijn God, doet mijn duisternis opklaren.","30":"Want met U loop ik door een bende, en met mijn God spring ik over een muur.","31":"Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.","32":"Want wie is God, behalve de HEERE? En wie is een Rotssteen, dan alleen onze God?","33":"Het is God, die mij met kracht omgordt; en Hij heeft mijn weg volkomen gemaakt.","34":"Hij maakt mijn voeten gelijk als die van de hinden, en Hij stelt mij op mijn hoogten.","35":"Hij leert mijn handen ten strijde, zodat een stalen boog met mijn armen verbroken is.","36":"Ook hebt U mij het schild van Uw heil gegeven, en Uw rechterhand heeft mij ondersteund, en Uw zachtmoedigheid heeft mij groot gemaakt.","37":"U hebt mijn voetstap ruim gemaakt onder mij, en mijn enkels hebben niet gewankeld.","38":"Ik vervolgde mijn vijanden, en trof hen aan; en ik keerde niet weer, totdat ik hen verdaan had.","39":"Ik doorstak hen, zodat zij niet weer konden opstaan; zij vielen onder mijn voeten.","40":"Want U omgordde mij met kracht ten strijde; U deed onder mij nederbukken die tegen mij opstonden.","41":"En U gaf mij de nek van mijn vijanden, en mijn haters, die vernielde ik.","42":"Zij riepen, maar er was geen verlosser; tot de HEERE, maar Hij antwoordde hun niet.","43":"Toen vergruisde ik hen als stof voor de wind; ik ruimde hen weg als slijk van de straten.","44":"U hebt mij uitgeholpen van de twisten van het volk; U hebt mij gesteld tot een hoofd van de heidenen; het volk *dat* ik niet kende, heeft mij gediend.","45":"Zo gauw als hun oor van mij hoorde, hebben zij mij gehoorzaamd; vreemden hebben zich mij geveinsd onderworpen.","46":"Vreemden zijn vervallen, en hebben gesidderd uit hun schuilplaatsen.","47":"De HEERE leeft, en geloofd zij mijn Rotssteen, en verhoogd zij de God van mijn heil!","48":"De God, Die mij volkomen wraak geeft, en de volken onder mij brengt;","49":"Die mij uithelpt van mijn vijanden; ja, U verhoogt mij boven hen die tegen mij opstaan; U redt mij van de man van het geweld.","50":"Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;","51":"Die de verlossingen van Zijn koning groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn nageslacht tot in eeuwigheid."},"SV":{"1":"Voor den opperzangmeester, *een* *psalm* van David, den knecht des HEEREN, die de woorden dezes lieds tot den HEERE gesproken heeft, ten dage, als hem de HEERE gered had uit de hand van al zijn vijanden, en uit de hand van Saul.","2":"Hij zeide dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte!","3":"De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Welken ik betrouw; mijn Schild, en de Hoorn mijns heils, mijn Hoog Vertrek.","4":"Ik riep den HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.","5":"Banden des doods hadden mij omvangen, en beken Belials verschrikten mij.","6":"Banden der hel omringden mij, strikken des doods bejegenden mij.","7":"Als mij bange was, riep ik den HEERE aan, en riep tot mijn God; Hij hoorde mijn stem uit Zijn paleis, en mijn geroep voor Zijn aangezicht kwam in Zijn oren.","8":"Toen daverde en beefde de aarde, en de gronden der bergen beroerden zich en daverden, omdat Hij ontstoken was.","9":"Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daarvan aangestoken.","10":"En Hij boog den hemel, en daalde neder, en donkerheid was onder Zijn voeten.","11":"En Hij voer op een cherub, en vloog; ja, Hij vloog snellijk op de vleugelen des winds.","12":"Duisternis zette Hij tot Zijn verberging; rondom Hem was Zijn tent, duisterheid der wateren, wolken des hemels.","13":"Van den glans, die voor Hem was, dreven Zijn wolken daarhenen, hagel en vurige kolen.","14":"En de HEERE donderde in den hemel, en de Allerhoogste gaf Zijn stem, hagel en vurige kolen.","15":"En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.","16":"En de diepe kolken der wateren werden gezien, en de gronden der wereld werden ontdekt, van Uw schelden, o HEERE! van het geblaas des winds van Uw neus.","17":"Hij zond van de hoogte, Hij nam mij, Hij trok mij op uit grote wateren.","18":"Hij verloste mij van mijn sterken vijand, en van mijn haters, omdat zij machtiger waren dan ik.","19":"Zij hadden mij bejegend ten dage mijns ongevals; maar de HEERE was mij tot een Steunsel.","20":"En Hij voerde mij uit in de ruimte, Hij rukte mij uit, want Hij had lust aan mij.","21":"De HEERE vergold mij naar mijn gerechtigheid, Hij gaf mij weder naar de reinigheid mijner handen.","22":"Want ik heb des HEEREN wegen gehouden, en ben van mijn God niet goddelooslijk afgegaan.","23":"Want al Zijn rechten waren voor mij, en Zijn inzettingen deed ik niet van mij weg.","24":"Maar ik was oprecht bij Hem, en ik wachtte mij voor mijn ongerechtigheid.","25":"Zo gaf mij de HEERE weder naar mijn gerechtigheid, naar de reinigheid mijner handen, voor Zijn ogen.","26":"Bij den goedertierene houdt Gij U goedertieren, bij den oprechten man houdt Gij U oprecht.","27":"Bij den reine houdt Gij U rein, maar bij den verkeerde bewijst Gij U een Worstelaar.","28":"Want Gij verlost het bedrukte volk, maar de hoge ogen vernedert Gij.","29":"Want Gij doet mijn lamp lichten; de HEERE, mijn God, doet mijn duisternis opklaren.","30":"Want met U loop ik door een bende, en met mijn God spring ik over een muur.","31":"Gods weg is volmaakt; de rede des HEEREN is doorlouterd; Hij is een Schild allen, die op Hem betrouwen.","32":"Want wie is God, behalve de HEERE? En wie is een Rotssteen, dan alleen onze God?","33":"Het is God, die mij met kracht omgordt; en Hij heeft mijn weg volkomen gemaakt.","34":"Hij maakt mijn voeten gelijk als der hinden, en Hij stelt mij op mijn hoogten.","35":"Hij leert mijn handen ten strijde, zodat een stalen boog met mijn armen verbroken is.","36":"Ook hebt Gij mij het schild Uws heils gegeven, en Uw rechterhand heeft mij ondersteund, en Uw zachtmoedigheid heeft mij groot gemaakt.","37":"Gij hebt mijn voetstap ruim gemaakt onder mij, en mijn enkelen hebben niet gewankeld.","38":"Ik vervolgde mijn vijanden, en trof hen aan; en ik keerde niet weder, totdat ik hen verdaan had.","39":"Ik doorstak hen, dat zij niet weder konden opstaan; zij vielen onder mijn voeten.","40":"Want Gij omgorddet mij met kracht ten strijde; Gij deedt onder mij nederbukken, die tegen mij opstonden.","41":"En Gij gaaft mij den nek mijner vijanden, en mijn haters, die vernielde ik.","42":"Zij riepen, maar er was geen verlosser; tot den HEERE, maar Hij antwoordde hun niet.","43":"Toen vergruisde ik hen als stof voor den wind; ik ruimde hen weg als slijk der straten.","44":"Gij hebt mij uitgeholpen van de twisten des volks; Gij hebt mij gesteld tot een hoofd der heidenen; het volk, *dat* ik niet kende, heeft mij gediend.","45":"Zo haast als *hun* oor *van* *mij* hoorde, hebben zij mij gehoorzaamd; vreemden hebben zich mij geveinsdelijk onderworpen.","46":"Vreemden zijn vervallen, en hebben gesidderd uit hun sloten.","47":"De HEERE leeft, en geloofd zij mijn Rotssteen, en verhoogd zij de God mijns heils!","48":"De God, Die mij volkomen wraak geeft, en de volken onder mij brengt;","49":"Die mij uithelpt van mijn vijanden; ja, Gij verhoogt mij boven degenen, die tegen mij opstaan; Gij redt mij van den man des gewelds.","50":"Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;","51":"Die de verlossingen Zijns konings groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn zaad tot in eeuwigheid."},"KJV":{"1":"[[To the chief Musician, *A Psalm* of David, the servant of the LORD, who spake unto the LORD the words of this song in the day *that* the LORD delivered him from the hand of all his enemies, and from the hand of Saul: And he said,]] I will love thee, O LORD, my strength.","2":"[[To the chief Musician, *A Psalm* of David, the servant of the LORD, who spake unto the LORD the words of this song in the day *that* the LORD delivered him from the hand of all his enemies, and from the hand of Saul: And he said,]] I will love thee, O LORD, my strength.","3":"The LORD *is* my rock, and my fortress, and my deliverer; my God, my strength, in whom I will trust; my buckler, and the horn of my salvation, *and* my high tower.","4":"I will call upon the LORD, *who is worthy* to be praised: so shall I be saved from mine enemies.","5":"The sorrows of death compassed me, and the floods of ungodly men made me afraid.","6":"The sorrows of hell compassed me about: the snares of death prevented","7":"In my distress I called upon the LORD, and cried unto my God: he heard my voice out of his temple, and my cry came before him, *even* into his ears.","8":"Then the earth shook and trembled; the foundations also of the hills moved and were shaken, because he was wroth.","9":"There went up a smoke out of his nostrils, and fire out of his mouth devoured: coals were kindled","10":"He bowed the heavens also, and came down: and darkness *was* under his feet.","11":"And he rode upon a cherub, and did fly: yea, he did fly upon the wings of the wind.","12":"He made darkness his secret place; his pavilion round about him *were* dark waters *and* thick clouds of the skies.","13":"At the brightness *that was* before him his thick clouds passed, hail *stones* and coals of fire.","14":"The LORD also thundered in the heavens, and the Highest gave his voice; hail *stones* and coals of fire.","15":"Yea, he sent out his arrows, and scattered them; and he shot out lightnings, and discomfited","16":"Then the channels of waters were seen, and the foundations of the world were discovered at thy rebuke, O LORD, at the blast of the breath of thy nostrils.","17":"He sent from above, he took me, he drew me out of many waters.","18":"He delivered me from my strong enemy, and from them which hated me: for they were too strong","19":"They prevented me in the day of my calamity: but the LORD was my stay.","20":"He brought me forth also into a large place; he delivered me, because he delighted","21":"The LORD rewarded me according to my righteousness; according to the cleanness of my hands hath he recompensed","22":"For I have kept the ways of the LORD, and have not wickedly departed from my God.","23":"For all his judgments *were* before me, and I did not put away his statutes","24":"I was also upright before him, and I kept myself from mine iniquity.","25":"Therefore hath the LORD recompensed me according to my righteousness, according to the cleanness of my hands in his eyesight.","26":"With the merciful thou wilt shew thyself merciful; with an upright man thou wilt shew thyself upright;","27":"With the pure thou wilt shew thyself pure; and with the froward thou wilt shew thyself froward.","28":"For thou wilt save the afflicted people; but wilt bring down high looks.","29":"For thou wilt light my candle: the LORD my God will enlighten my darkness.","30":"For by thee I have run through a troop; and by my God have I leaped over a wall.","31":"*As for* God, his way *is* perfect: the word of the LORD is tried: he *is* a buckler to all those that trust","32":"For who *is* God save the LORD? or who *is* a rock save our God?","33":"*It is* God that girdeth me with strength, and maketh my way perfect.","34":"He maketh my feet like hinds' *feet*, and setteth me upon my high places.","35":"He teacheth my hands to war, so that a bow of steel is broken by mine arms.","36":"Thou hast also given me the shield of thy salvation: and thy right hand hath holden me up, and thy gentleness hath made me great.","37":"Thou hast enlarged my steps under me, that my feet did not slip.","38":"I have pursued mine enemies, and overtaken them: neither did I turn again till they were consumed.","39":"I have wounded them that they were not able to rise: they are fallen under my feet.","40":"For thou hast girded me with strength unto the battle: thou hast subdued under me those that rose up","41":"Thou hast also given me the necks of mine enemies; that I might destroy them that hate","42":"They cried, but *there was* none to save *them: even* unto the LORD, but he answered","43":"Then did I beat them small as the dust before the wind: I did cast them out as the dirt in the streets.","44":"Thou hast delivered me from the strivings of the people; *and* thou hast made me the head of the heathen: a people *whom* I have not known shall serve","45":"As soon as they hear of me, they shall obey me: the strangers shall submit","46":"The strangers shall fade away, and be afraid out of their close places.","47":"The LORD liveth; and blessed *be* my rock; and let the God of my salvation be exalted.","48":"*It is* God that avengeth me, and subdueth the people","49":"He delivereth me from mine enemies: yea, thou liftest me up above those that rise up against me: thou hast delivered me from the violent man.","50":"Therefore will I give thanks unto thee, O LORD, among the heathen, and sing praises unto thy name.","51":"Great deliverance giveth he to his king; and sheweth mercy to his anointed, to David, and to his seed for evermore."}},"tsk":{"2":[{"kopje":"Hij zei dan","refs":["Ps 34:20","Ex 15:1-21","Richt 5:1-31","1 Sam 2:1-10","Jes 12:1-6"]},{"kopje":"Ik zal","refs":["Ps 116:1-6","Ps 144:1","Ps 144:2","1 Joh 4:19"]},{"kopje":"mijn","refs":["Ps 18:33","Ps 28:7","Ps 28:8","Ps 118:14","Jes 12:2","Fil 4:13","Kol 1:11"]}],"3":[{"kopje":"HEERE","refs":["Ps 28:1","Ps 62:3","Ps 62:8","Jes 32:2"]},{"kopje":"Burg","refs":["Ps 91:2","Ps 144:2","Jer 16:19"]},{"kopje":"op Wie","refs":["Hebr 2:13"]},{"kopje":"Schild","refs":["Ps 91:4","Spr 2:7"]},{"kopje":"Hoorn","refs":["Ps 132:17","2 Sam 22:3"]},{"kopje":"Hoog","refs":["Spr 18:10"]}],"4":[{"kopje":"Ik riep","refs":["Ps 5:3","Ps 5:4","Ps 28:1","Ps 28:2","Ps 55:17","Ps 62:9","2 Sam 22:4","Fil 4:6","Fil 4:7"]},{"kopje":"die","refs":["Ps 65:2","Ps 65:3","Ps 76:5","Neh 9:5","Openb 4:11","Openb 5:12-14"]},{"kopje":"werd verlost","refs":["Ps 50:15","Ps 91:15","Luk 1:71","Hand 2:21","Rom 8:31-39"]}],"5":[{"kopje":"Banden","refs":["Ps 116:3","2 Sam 22:5","2 Sam 22:6","Jes 13:8","Jes 53:3","Jes 53:4","Matt 26:38","Matt 26:39","Mark 14:33 =\"H3068\">LORD</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of this <span class=\"wl wl-kjv\" data-code=\"H7892\">song</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> him from the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of all his <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul:</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,]]</span> I will <span class=\"wl wl-kjv\" data-code=\"H7355\">love</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> my strength.","2":"[[To the chief <span class=\"wl wl-kjv\" data-code=\"H5329\">Musician,</span> A Psalm of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> who <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of this <span class=\"wl wl-kjv\" data-code=\"H7892\">song</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> him from the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of all his <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul:</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,]]</span> I will <span class=\"wl wl-kjv\" data-code=\"H7355\">love</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> my strength.","3":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is my <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> and my <span class=\"wl wl-kjv\" data-code=\"H4686\">fortress,</span> and my <span class=\"wl wl-kjv\" data-code=\"H6403\">deliverer;</span> my <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> my <span class=\"wl wl-kjv\" data-code=\"H6697\">strength,</span> in whom I will <span class=\"wl wl-kjv\" data-code=\"H2620\">trust;</span> my <span class=\"wl wl-kjv\" data-code=\"H4043\">buckler,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> of my <span class=\"wl wl-kjv\" data-code=\"H3468\">salvation,</span> and my high tower.","4":"I will <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> who is worthy to be <span class=\"wl wl-kjv\" data-code=\"H1984\">praised:</span> so shall I be <span class=\"wl wl-kjv\" data-code=\"H3467\">saved</span> from mine enemies.","5":"The <span class=\"wl wl-kjv\" data-code=\"H2256\">sorrows</span> of <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> <span class=\"wl wl-kjv\" data-code=\"H661\">compassed</span> me, and the <span class=\"wl wl-kjv\" data-code=\"H5158\">floods</span> of ungodly <span class=\"wl wl-kjv\" data-code=\"H1100\">men</span> made me afraid.","6":"The <span class=\"wl wl-kjv\" data-code=\"H2256\">sorrows</span> of <span class=\"wl wl-kjv\" data-code=\"H7585\">hell</span> compassed me <span class=\"wl wl-kjv\" data-code=\"H5437\">about:</span> the <span class=\"wl wl-kjv\" data-code=\"H4170\">snares</span> of <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> prevented","7":"In my <span class=\"wl wl-kjv\" data-code=\"H6862\">distress</span> I <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H7768\">cried</span> unto my <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> he <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> my <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> out of his <span class=\"wl wl-kjv\" data-code=\"H1964\">temple,</span> and my <span class=\"wl wl-kjv\" data-code=\"H7775\">cry</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, even into his ears.","8":"Then the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H1607\">shook</span> and <span class=\"wl wl-kjv\" data-code=\"H7493\">trembled;</span> the <span class=\"wl wl-kjv\" data-code=\"H4146\">foundations</span> also of the <span class=\"wl wl-kjv\" data-code=\"H2022\">hills</span> <span class=\"wl wl-kjv\" data-code=\"H7264\">moved</span> and were <span class=\"wl wl-kjv\" data-code=\"H1607\">shaken,</span> because he was wroth.","9":"There went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H6227\">smoke</span> out of his <span class=\"wl wl-kjv\" data-code=\"H639\">nostrils,</span> and <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> out of his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> <span class=\"wl wl-kjv\" data-code=\"H398\">devoured:</span> <span class=\"wl wl-kjv\" data-code=\"H1513\">coals</span> were kindled","10":"He <span class=\"wl wl-kjv\" data-code=\"H5186\">bowed</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> also, and came <span class=\"wl wl-kjv\" data-code=\"H3381\">down:</span> and <span class=\"wl wl-kjv\" data-code=\"H6205\">darkness</span> was under his feet.","11":"And he <span class=\"wl wl-kjv\" data-code=\"H7392\">rode</span> upon a <span class=\"wl wl-kjv\" data-code=\"H3742\">cherub,</span> and did <span class=\"wl wl-kjv\" data-code=\"H5774\">fly:</span> yea, he did <span class=\"wl wl-kjv\" data-code=\"H1675\">fly</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> of the wind.","12":"He <span class=\"wl wl-kjv\" data-code=\"H7896\">made</span> <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> his secret <span class=\"wl wl-kjv\" data-code=\"H5643\">place;</span> his <span class=\"wl wl-kjv\" data-code=\"H5521\">pavilion</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> him were <span class=\"wl wl-kjv\" data-code=\"H2824\">dark</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> and thick <span class=\"wl wl-kjv\" data-code=\"H5645\">clouds</span> of the skies.","13":"At the <span class=\"wl wl-kjv\" data-code=\"H5051\">brightness</span> that was before him his thick <span class=\"wl wl-kjv\" data-code=\"H5645\">clouds</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">passed,</span> <span class=\"wl wl-kjv\" data-code=\"H1259\">hail</span> stones and <span class=\"wl wl-kjv\" data-code=\"H1513\">coals</span> of fire.","14":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> also <span class=\"wl wl-kjv\" data-code=\"H7481\">thundered</span> in the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5945\">Highest</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice;</span> <span class=\"wl wl-kjv\" data-code=\"H1259\">hail</span> stones and <span class=\"wl wl-kjv\" data-code=\"H1513\">coals</span> of fire.","15":"Yea, he sent <span class=\"wl wl-kjv\" data-code=\"H7971\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows,</span> and <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered</span> them; and he shot <span class=\"wl wl-kjv\" data-code=\"H7232\">out</span> <span class=\"wl wl-kjv\" data-code=\"H1300\">lightnings,</span> and discomfited","16":"Then the <span class=\"wl wl-kjv\" data-code=\"H650\">channels</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> were <span class=\"wl wl-kjv\" data-code=\"H7200\">seen,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4146\">foundations</span> of the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> were <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> at thy <span class=\"wl wl-kjv\" data-code=\"H1606\">rebuke,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> at the <span class=\"wl wl-kjv\" data-code=\"H5397\">blast</span> of the <span class=\"wl wl-kjv\" data-code=\"H7307\">breath</span> of thy nostrils.","17":"He <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> from <span class=\"wl wl-kjv\" data-code=\"H4791\">above,</span> he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> me, he <span class=\"wl wl-kjv\" data-code=\"H4871\">drew</span> me out of <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> waters.","18":"He <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> me from my <span class=\"wl wl-kjv\" data-code=\"H5794\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> and from them which <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> me: for they were too strong","19":"They <span class=\"wl wl-kjv\" data-code=\"H6923\">prevented</span> me in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of my <span class=\"wl wl-kjv\" data-code=\"H343\">calamity:</span> but the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was my stay.","20":"He brought me <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> also into a large <span class=\"wl wl-kjv\" data-code=\"H4800\">place;</span> he <span class=\"wl wl-kjv\" data-code=\"H2502\">delivered</span> me, because he delighted","21":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1580\">rewarded</span> me according to my <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness;</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1252\">cleanness</span> of my <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> hath he recompensed","22":"For I have <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and have not wickedly <span class=\"wl wl-kjv\" data-code=\"H7561\">departed</span> from my God.","23":"For all his <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> were before me, and I did not put <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> his statutes","24":"I was also <span class=\"wl wl-kjv\" data-code=\"H8549\">upright</span> before him, and I <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> myself from mine iniquity.","25":"Therefore hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">recompensed</span> me according to my <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1252\">cleanness</span> of my <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> in his eyesight.","26":"With the <span class=\"wl wl-kjv\" data-code=\"H2623\">merciful</span> thou wilt shew thyself <span class=\"wl wl-kjv\" data-code=\"H2616\">merciful;</span> with an <span class=\"wl wl-kjv\" data-code=\"H8549\">upright</span> <span class=\"wl wl-kjv\" data-code=\"H1399\">man</span> thou wilt shew thyself upright;","27":"With the <span class=\"wl wl-kjv\" data-code=\"H1305\">pure</span> thou wilt shew thyself <span class=\"wl wl-kjv\" data-code=\"H1305\">pure;</span> and with the <span class=\"wl wl-kjv\" data-code=\"H6141\">froward</span> thou wilt shew thyself froward.","28":"For thou wilt <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> the <span class=\"wl wl-kjv\" data-code=\"H6041\">afflicted</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> but wilt bring <span class=\"wl wl-kjv\" data-code=\"H8213\">down</span> <span class=\"wl wl-kjv\" data-code=\"H7311\">high</span> looks.","29":"For thou wilt <span class=\"wl wl-kjv\" data-code=\"H215\">light</span> my <span class=\"wl wl-kjv\" data-code=\"H5216\">candle:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> will <span class=\"wl wl-kjv\" data-code=\"H5050\">enlighten</span> my darkness.","30":"For by thee I have run <span class=\"wl wl-kjv\" data-code=\"H7323\">through</span> a <span class=\"wl wl-kjv\" data-code=\"H1416\">troop;</span> and by my <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> have I leaped <span class=\"wl wl-kjv\" data-code=\"H1801\">over</span> a wall.","31":"As for <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> his <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> is <span class=\"wl wl-kjv\" data-code=\"H8549\">perfect:</span> the <span class=\"wl wl-kjv\" data-code=\"H565\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H6884\">tried:</span> he is a <span class=\"wl wl-kjv\" data-code=\"H4043\">buckler</span> to all those that trust","32":"For who is <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1107\">save</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span> or who is a <span class=\"wl wl-kjv\" data-code=\"H6697\">rock</span> <span class=\"wl wl-kjv\" data-code=\"H2108\">save</span> our God?","33":"It is <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> that <span class=\"wl wl-kjv\" data-code=\"H247\">girdeth</span> me with <span class=\"wl wl-kjv\" data-code=\"H2428\">strength,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">maketh</span> my <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> perfect.","34":"He <span class=\"wl wl-kjv\" d /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

/* ---------- kopieerfunctie ---------- */

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
