tenschap voor uw ziel liefelijk zal zijn; Zo zal de bedachtzaamheid over u de wacht houden, de verstandigheid zal u behoeden;", "2 Tess 3:3": "Maar de Heere is getrouw, Die u zal versterken en bewaren van de boze.", "Jak 1:18": "Naar Zijn wil heeft Hij ons gebaard door het Woord van de waarheid, opdat wij zouden zijn als eerstelingen van Zijn schepselen.", "Matt 5:3-10": "Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen. Zalig zijn zij die treuren, want zij zullen vertroost worden. Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Ex 15:21": "Toen antwoordde Mirjam hun: Zingt de HEERE; want Hij is hoog verheven! Hij heeft het paard met zijn ruiter in de zee gestort!", "Jer 31:10": "Hoort het woord van de HEERE, heidenvolken! En verkondigt het in de eilanden die ver weg zijn, en zegt: Hij, Die Israël verstrooid heeft, zal hem weer verzamelen, en hem bewaren zoals een herder zijn kudde.", "Jona 4:6": "En God, de HEERE, liet een wonderboom groeien en die opschieten boven Jona, zodat er schaduw zou zijn over zijn hoofd, om hem te bevrijden van zijn ellende. En Jona verheugde zich over de wonderboom met grote blijdschap.", "Job 4:7": "Bedenk toch, wie is de onschuldige die is omgekomen; en waar zijn de oprechten verdelgd?", "Jes 11:1-10": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Jes 35:9": "Er zal geen leeuw zijn, en geen verscheurend gedierte zal daarop komen, en het zal daar niet gevonden worden; maar de verlosten zullen daarop wandelen.", "Openb 21:9-27": "En er kwam naar mij een van de zeven engelen, die de zeven schalen hadden, die vol geweest waren van de zeven laatste plagen, en hij sprak met mij en zei: Kom hier, ik zal u de Bruid tonen, de Vrouw van het Lam. En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God. En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal.", "Openb 21:10-27": "En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God. En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal. En zij had een grote en hoge muur, en had twaalf poorten, en bij de poorten twaalf engelen, en namen daarop geschreven, welke zijn de namen van de twaalf geslachten van de kinderen van Israël.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Joh 1:4": "In Hem was het Leven, en het Leven was het Licht van de mensen.", "Ps 18:18": "Hij verloste mij van mijn sterke vijand, en van mijn haters, omdat zij machtiger waren dan ik.", "Jer 31:28": "En het zal gebeuren, zoals Ik over hen gewaakt heb om uit te rukken, en af te breken, en te verstoren, en te verderven, en kwaad aan te doen; zo zal Ik over hen waken om te bouwen en te planten, spreekt de HEERE.", "2 Sam 7:8": "Nu dan, zo zult u tegen Mijn knecht, tegen David, zeggen: Zo zegt de HEERE van de heerscharen: Ik heb u genomen van de schaapskooi, van achter de schapen, om een voorganger te zijn over Mijn volk, over Israël.", "Jes 45:6": "Opdat men weet, vanaf de opgang van de zon tot aan de ondergang, dat er buiten Mij niets is, Ik ben de HEERE, en niemand meer.", "Ps 65:4": "Onrechtvaardige dingen hadden de overhand over mij; maar onze overtredingen, die verzoent U.", "Spr 14:11": "Het huis van de goddelozen zal weggevaagd worden; maar de tent van de oprechten zal bloeien.", "Ps 1:1": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "Jer 33:9": "En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.", "Ps 103:2-5": "Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden;", "Jes 30:26": "En het licht van de maan zal zijn als het licht van de zon, en het licht van de zon zal zevenvoudig zijn als het licht van zeven dagen; op de dag dat de HEERE de breuk van Zijn volk zal verbinden, en de wond waarmee het geslagen is, genezen.", "Hand 7:38": "Dit is degene die in de samenkomst van het volk in de woestijn was, samen met de engel die tot hem sprak op de berg Sinaï, en met onze vaders; die de levende woorden ontving, om ons die te geven,", "Luk 18:8": "Ik zeg u dat Hij hun snel recht zal doen. Maar de Zoon des mensen, zal Hij, als Hij komt, geloof vinden op de aarde?", "Jes 1:25": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen.", "2 Kron 20:3-30": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda. En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof.", "Ps 81:14-17": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld! In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders. Zij die de HEERE haten, zouden zich Hem geveinsd onderworpen hebben, maar hun tijd zou eeuwig geweest zijn.", "Jer 31:23": "Zo zegt de HEERE van de heerscharen, de God van Israël: Dit woord zullen zij nog zeggen in het land van Juda, en in zijn steden, wanneer Ik hun gevangenschap ombuigen zal: De HEERE zegent u, woning van de gerechtigheid, berg van de heiligheid!", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Hand 3:26": "God heeft, na Zijn Kind Jezus te hebben opgewekt, Hem eerst tot u gezonden, om u te zegenen, doordat Hij ieder van u afkeert van zijn slechte daden.", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Dan 11:43": "En hij zal heersen over de verborgen schatten van het goud en van het zilver, en over al de kostbare dingen van Egypte; en die van Libye, en de Moren zullen in zijn gevolg zijn.", "1 Kron 25:7": "En hun aantal, met hun broeders die onderwezen waren in het gezang van de HEERE, allen meesters, was tweehonderdachtentachtig.", "Jes 16:10": "zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.", "Rom 7:26": "Zo dan, ik zelf dien wel met het gemoed de wet van God, maar met het vlees de wet van de zonde.", "Hebr 10:13": "verder wachtend, totdat Zijn vijanden neergelegd worden als een voetbank voor Zijn voeten.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Jes 44:4": "En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken.", "Ps 149:1-3": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten. Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning. Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "1 Kor 12:25": "opdat er geen verdeeldheid in het lichaam zou zijn, maar de leden voor elkaar dezelfde zorg zouden dragen.", "Ef 5:29": "Want niemand heeft ooit zijn eigen vlees gehaat, maar hij voedt het, en verzorgt het, zoals ook de Heere de Gemeente.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Ps 41:2-4": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads. De HEERE zal hem bewaren, en zal hem bij het leven behouden; hij zal op aarde gelukkig gemaakt worden. Geef hem ook niet over in de begeerte van zijn vijanden. De HEERE zal hem ondersteunen op het ziekbed; in zijn ziekte verandert U zijn hele leger.", "Ps 48:2": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid.", "Ex 13:21": "En de HEERE ging voor hun aangezicht uit, overdag in een wolkkolom om hen de weg te leiden, en 's nachts in een vuurkolom om hen licht te geven, zodat zij dag en nacht konden voortgaan.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Jer 3:17": "In die tijd zullen zij Jeruzalem noemen: de troon van de HEERE; en alle heidenvolken zullen daar samenkomen, vanwege de Naam van de HEERE, in Jeruzalem; en zij zullen niet meer wandelen naar het goeddunken van hun slechte hart.", "Spr 3:2": "Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen.", "Rom 7:24": "Ik, ellendig mens, wie zal mij verlossen uit het lichaam van deze dood?", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Jes 52:1": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen.", "Ps 10:18": "Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven.", "Hand 11:21": "En de hand van de Heere was met hen; en een groot aantal geloofde en bekeerde zich tot de Heere.", "Spr 19:23": "De vreze van de HEERE is ten leven; want men zal verzadigd zijnde overnachten; met het kwaad zal men niet bezocht worden.", "Jes 48:20": "Ga uit van Babel, vlucht van de Chaldeeën, verkondig met de stem van het gejuich, doe zulks horen, breng het uit tot aan het einde van de aarde, zeg: De HEERE heeft Zijn knecht Jakob verlost!", "Jer 3:14-17": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen. En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand. En het zal gebeuren, wanneer u meer geworden en vruchtbaar geworden bent in het land, in die dagen, spreekt de HEERE, dat zij niet meer zullen zeggen: De ark van het verbond van de HEERE, en zij zal ook niet in het hart opkomen; en zij zullen er niet aan denken, en haar niet bezoeken, en zij zal niet opnieuw gemaakt worden.", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "1 Kor 1:26": "Want u ziet uw roeping, broeders, dat u niet veel wijzen bent naar het vlees, niet veel machtigen, niet veel edelen.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Ps 51:20": "Doe goed bij Sion naar Uw welbehagen; bouw de muren van Jeruzalem op.", "Matt 13:23": "Maar die in de goede aarde bezaaid is, dit is degene die het woord hoort en begrijpt, die ook vrucht draagt en voortbrengt, de een honderdvoud, de ander zestigvoud, en de ander dertigvoud.", "1 Kron 15:16-22": "En David zei tegen de leiders van de Levieten, dat zij hun broeders, de zangers, moesten aanstellen met muziekinstrumenten, met luiten, en harpen, en cimbalen, zodat zij zich lieten horen, terwijl zij de stem verhieven met blijdschap. Zo stelden de Levieten Heman aan, de zoon van Joël, en uit zijn broeders Asaf, de zoon van Berechja; en uit de zonen van Merari, hun broeders, Ethan, de zoon van Kusaja; En met hen hun broeders van de tweede orde: Zecharja, Ben en Jaaziel, en Semiramoth, en Jehiel, en Unni, Eliab, en Benaja, en Maaseja, en Mattithja, en Elifele, en Mikneja, en Obed-edom, en Jeiel, de poortwachters.", "Kol 1:24": "die mij nu verblijd in mijn lijden voor u, en aanvult in mijn vlees wat nog ontbreekt aan de verdrukkingen van Christus, voor Zijn lichaam, dat is de Gemeente;", "Jer 33:22": "Zoals het leger van de hemel niet geteld, en het zand van de zee niet gemeten kan worden, zo zal Ik het nageslacht van Mijn knecht David vermenigvuldigen, en de Levieten die Mij dienen.", "Deut 11:8": "Houd dan alle geboden, die ik u heden gebied; opdat u sterk wordt en het land binnengaat, en het erft, waarheen u overtrekt, om dat te erven;", "Ps 31:21": "U verbergt hen in het verborgene van Uw aangezicht voor de hoogmoedigheden van de man; U versteekt hen in een hut voor de twist van de tongen.", "Jes 44:5": "Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Ef 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, aan de heiligen die te Efeze zijn, en gelovigen in Christus Jezus:", "Ex 12:23": "Want de HEERE zal doorgaan, om de Egyptenaren te slaan; doch wanneer Hij het bloed zien zal aan de bovendorpel en aan de twee zijposten, zal de HEERE de deur voorbijgaan, en de verderver niet toelaten in uw huizen te komen om te slaan.", "Fil 1:6": "Ervan overtuigd dat Hij, Die in u een goed werk begonnen is, dat zal voleindigen tot op de dag van Jezus Christus;", "Ps 22:31": "Het nageslacht zal Hem dienen; het zal aan de Heere toegeschreven worden tot in geslachten.", "Ex 23:20-31": "Zie, Ik zend een Engel voor uw aangezicht, om u te behoeden op deze weg, en om u te brengen naar de plaats die Ik voorbereid heb. Wees op uw hoede voor Zijn aangezicht, en wees Zijn stem gehoorzaam, en verbitter Hem niet; want Hij zal uw overtredingen niet vergeven; want Mijn Naam is in Hem. Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ef 5:23-27": "want de man is het hoofd van de vrouw, zoals ook Christus het Hoofd van de Gemeente is; en Hij is de Behouder van het lichaam. Daarom, zoals de Gemeente aan Christus onderdanig is, zo ook de vrouwen aan hun eigen mannen in alles. Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven,", "Ex 19:4": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb.", "Jes 19:25": "Want de HEERE van de heerscharen zal hen zegenen en zeggen: Gezegend zij Mijn volk, de Egyptenaars, en de Assyriërs, het werk van Mijn handen, en Israël, Mijn erfdeel!", "Jes 49:17": "Uw zonen zullen zich haasten; maar uw verstoorders en uw verwoesters zullen van u uitgaan.", "Jes 4:2-6": "Op die dag zal de SPRUIT van de HEERE tot sieraad en heerlijkheid zijn, en de vrucht van de aarde tot voortreffelijkheid en tot versiering voor hen die ontkomen zullen in Israël. En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem; wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Gen 31:27": "Waarom bent u heimelijk gevlucht, en hebt u zich aan mij ontstolen? En hebt u het mij niet verteld, zodat ik u had kunnen wegzenden met vreugde, en met gezangen, met tamboerijn en met harp?", "Luk 21:18": "Toch zal er geen haar van uw hoofd verloren gaan.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 98:1-8": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven. De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen. Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Jes 23:17": "Want het zal gebeuren aan het einde van zeventig jaren, dat de HEERE Tyrus zal bezoeken, en dat zij zal terugkeren tot haar hoerenloon, en zij zal hoererij bedrijven met alle koninkrijken van de aarde, die op de aardbodem zijn.", "Zach 9:8": "En Ik zal Mij rondom Mijn huis legeren, vanwege het leger, vanwege de doorgaande, en vanwege de wederkerende, opdat de drijver niet meer door hen doorga; want nu heb Ik het met Mijn ogen aangezien.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "1 Joh 3:7": "Kinderen, laat niemand u verleiden. Die de rechtvaardigheid doet, is rechtvaardig, zoals Hij rechtvaardig is.", "Job 5:18-24": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen. In zes benauwdheden zal Hij u verlossen, en in de zevende zal het kwaad u niet aanraken. In de honger zal Hij u verlossen van de dood, en in de oorlog van het geweld van het zwaard.", "Hebr 3:1": "Daarom, heilige broeders, die deel hebben aan de hemelse roeping, richt uw aandacht op de Apostel en Hogepriester van onze belijdenis, Christus Jezus;", "Jes 49:14-17": "Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten. Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.", "Openb 18:2": "En hij riep met kracht, met een grote stem, en zei: Zij is gevallen, zij is gevallen, het grote Babylon, en is een woonplaats van duivels geworden, en een bewaarplaats van alle onreine geesten, en een bewaarplaats van alle onrein en gehaat gevogelte;", "Ex 8:23": "En Ik zal een verlossing zetten tussen Mijn volk en uw volk; tegen morgen zal dit teken gebeuren!", "2 Petr 1:1": "Simeon Petrus, een dienstknecht en apostel van Jezus Christus, aan hen die even kostbaar geloof met ons verkregen hebben, door de rechtvaardigheid van onze God en Zaligmaker, Jezus Christus;", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "Ps 9:10": "En de HEERE zal een Hoog Vertrek zijn voor de verdrukte, een Hoog Vertrek in tijden van benauwdheid.", "Jer 31:13": "Dan zal de jonkvrouw zich verblijden in de rei, en ook de jongelingen en de ouderen samen; want Ik zal hun rouw in vrolijkheid veranderen, en zal hen troosten, en zal hen verblijden na hun droefenis.", "Jes 37:35": "Want Ik zal deze stad beschermen om die te verlossen, omwille van Mijzelf, en omwille van David, Mijn knecht.", "Ps 51:9": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw.", "Ps 12:8": "U, HEERE, zult hen bewaren; U zult hen behoeden voor dit geslacht, tot in eeuwigheid.", "1 Joh 3:3": "En ieder die deze hoop op Hem heeft, reinigt zichzelf, zoals Hij rein is.", "Jes 51:3-16": "Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang. Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken. Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.", "Pred 2:8": "Ik verzamelde mij ook zilver en goud, en kostbaarheden van koningen en landstreken; ik nam mij zangers en zangeressen aan, en wat mensenkinderen tot lust strekt: allerlei snarenspel.", "Hand 15:9": "en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.", "1 Petr 4:2": "om niet meer naar de begeerten van de mensen, maar naar de wil van God de tijd te leven die nog over is in het vlees.", "1 Kon 10:1-29": "En toen de koningin van Scheba het gerucht van Salomo hoorde, aangaande de Naam van de HEERE, kwam zij om hem met raadsels te toetsen. En zij kwam in Jeruzalem, met een zeer zwaar leger, met kamelen die specerijen droegen, en zeer veel goud, en kostbaar gesteente; en zij kwam bij Salomo, en sprak met hem over alles wat er in haar hart was. En Salomo verklaarde haar al haar woorden; er was geen ding voor de koning verborgen, dat hij haar niet verklaarde.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Ezech 29:17-20": "Verder gebeurde het in het zevenentwintigste jaar, in de eerste maand, op de eerste dag van de maand, dat het woord van de HEERE tot mij kwam. Hij zei: Mensenkind! Nebukadrezar, de koning van Babel, heeft zijn leger een grote dienst laten verrichten tegen Tyrus; alle hoofden zijn kaal geworden, en alle zijden zijn opengeschuurd; en noch hij, noch zijn leger heeft loon gehad vanwege Tyrus, voor de dienst die hij tegen haar verricht heeft. Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.", "Ps 102:15": "Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis.", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "Ps 47:9": "God regeert over de heidenen; God zit op de troon van Zijn heiligheid.", "Openb 22:1-5": "En hij toonde mij een zuivere rivier van het water des levens, klaar als kristal, die uit de troon van God en van het Lam kwam. In het midden van haar straat en aan de ene en de andere zijde van de rivier was de boom des levens, die twaalf keer vrucht droeg, van maand tot maand zijn vrucht gevend; en de bladeren van de boom waren tot genezing van de heidenen. En geen vervloeking zal er meer tegen iemand zijn; en de troon van God en van het Lam zal daar zijn, en Zijn dienstknechten zullen Hem dienen;", "Deut 30:4": "Al waren uw verdrevenen aan het einde van de hemel, van daar zal de HEERE, uw God, u bijeenbrengen, en van daar zal Hij u halen.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Gen 28:20": "En Jakob deed een gelofte, en zei: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op deze weg die ik reis, en mij brood gegeven zal hebben om te eten, en kleren om aan te trekken;", "Openb 18:22": "En de stem van citerspelers, en zangers, en fluiters, en bazuinblazers, zal in u niet meer gehoord worden; en geen enkele kunstenaar van welke kunst dan ook zal meer in u gevonden worden; en het geluid van de molen zal in u niet meer gehoord worden.", "Hagg 2:8-10": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen. Mijn is het zilver, en Mijn is het goud, spreekt de HEERE van de heerscharen. De heerlijkheid van dit laatste huis zal groter worden dan die van het eerste, zegt de HEERE van de heerscharen; en in deze plaats zal Ik vrede geven, spreekt de HEERE van de heerscharen.", "Spr 24:16": "Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad neerstruikelen.", "1 Joh 3:2": "Geliefden, nu zijn wij kinderen van God, en het is nog niet openbaar geworden wat wij zijn zullen. Maar wij weten dat, als Hij geopenbaard zal zijn, wij Hem gelijk zullen zijn; want wij zullen Hem zien zoals Hij is.", "Rom 8:35-39": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "Jes 46:12": "Hoor naar Mij, u die hardnekkig van hart bent, u, die ver van de gerechtigheid zijt!", "Ps 138:4": "Alle koningen van de aarde zullen U, o HEERE! loven, wanneer zij de redenen van Uw mond gehoord zullen hebben.", "Job 27:3": "Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus;", "Ps 72:16": "Is er een handvol koren in het land op de hoogte van de bergen, de vrucht daarvan zal ruisen als de Libanon; en die van de stad zullen bloeien als het kruid van de aarde.", "Jer 3:19": "Ik zei wel: Hoe zal Ik u onder de kinderen plaatsen, en u het begeerlijke land geven, de sierlijke erfenis van de heerscharen van de heidenvolken? Maar Ik zei: U zult tot Mij roepen: Mijn Vader! en u zult van achter Mij niet afkeren.", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Ps 68:26": "De zangers gingen voorop, de speellieden erachteraan, in het midden de trommelende meisjes.", "Jes 54:2-10": "Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen. Vrees niet, want u zult niet beschaamd worden, en word niet schaamrood, want u zult niet te schande worden; maar u zult de schaamte van uw jonkheid vergeten, en de smaad van het weduwschap zult u niet meer gedenken.", "Ps 147:2": "De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël.", "Jer 49:28-30": "Tegen Kedar, en tegen de koninkrijken van Hazor, die Nebukadrezar, de koning van Babel, sloeg, zegt de HEERE zo: Maak u op, trek op tegen Kedar, en verwoest de kinderen van het oosten. Zij zullen hun tenten en hun kudden nemen, hun gordijnen en al hun gereedschap, en hun kamelen voor zich wegnemen; en zij zullen tegen hen uitroepen: Schrik van rondom! Vlucht, zwerf vlug heen, woon in diepe plaatsen, inwoners van Hazor! spreekt de HEERE; want Nebukadrezar, de koning van Babel, heeft een raadsbesluit tegen u beraadslaagd, en een gedachte tegen hen gedacht.", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Matt 19:14": "Maar Jezus zei: Laat de kinderen begaan, en verhinder hen niet om tot Mij te komen; want voor zulken is het Koninkrijk der hemelen.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Jes 49:10": "Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Jes 46:13": "Ik breng Mijn gerechtigheid nabij, zij zal niet ver weg zijn, en Mijn heil zal niet uitblijven; maar Ik zal heil geven in Sion, aan Israël Mijn heerlijkheid.", "1 Kor 12:28": "En God heeft sommigen in de Gemeente gesteld: ten eerste apostelen, ten tweede profeten, ten derde leraars, daarna krachten, daarna gaven van gezondmaking, hulpverleningen, bestuur, allerlei talen.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "Joël 2:15-17": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit. Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer. Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Ps 21:4-6": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud. Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos. Groot is zijn eer door Uw heil; majesteit en heerlijkheid hebt U hem toegevoegd.", "Fil 2:10": "Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn.", "Ps 91:1-16": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige. Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw! Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie.", "Ps 72:19": "En geloofd zij de Naam van Zijn heerlijkheid tot in eeuwigheid; en de hele aarde moet met Zijn heerlijkheid vervuld worden. Amen, ja, amen.", "Joh 3:3-5": "Jezus antwoordde en zei tegen hem: Voorwaar, voorwaar, Ik zeg u: Als iemand niet opnieuw geboren wordt, kan hij het Koninkrijk van God niet zien. Nicodemus zei tegen Hem: Hoe kan een mens geboren worden als hij al oud is? Kan hij soms voor de tweede keer in de buik van zijn moeder ingaan en geboren worden? Jezus antwoordde: Voorwaar, voorwaar, Ik zeg u: Als iemand niet geboren wordt uit water en Geest, kan hij het Koninkrijk van God niet binnengaan.", "1 Joh 2:5": "Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Zach 3:8": "Hoor nu toe, Jozua, u hogepriester! U en uw vrienden, die voor uw aangezicht zitten, want zij zijn een wonderteken; want zie, Ik zal Mijn Knecht, de SPRUITE, doen komen.", "1 Kron 6:32": "En zij dienden voor de tabernakel van de tent der samenkomst met gezangen, totdat Salomo het huis van de HEERE in Jeruzalem bouwde; en zij stonden naar hun beurt in hun ambt.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Deut 33:25-29": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen! Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken. De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Deut 23:14": "Want de HEERE, uw God, wandelt in het midden van uw leger, om u te verlossen, en om uw vijanden aan u over te geven; daarom zal uw leger heilig zijn, opdat Hij niets schandelijks onder u ziet, en Zich niet van u afkeert.", "Rom 2:28": "Want die is niet een Jood, die het in het openbaar is; en dat is ook niet de besnijdenis, die het in het openbaar in het vlees is;", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "Ps 134:1-3": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat! Hef uw handen op naar het heiligdom, en loof de HEERE. De HEERE zegent u uit Sion, Hij, Die de hemel en de aarde gemaakt heeft.", "1 Kor 15:48": "Zoals de aardse is, zo zijn ook de aardsen; en zoals de Hemelse is, zo zijn ook de hemelsen.", "Spr 3:24": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn.", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Jer 5:24": "En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; Die voor ons de weken, de vastgestelde tijden van de oogst, bewaart.", "1 Tim 6:19": "en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "Ps 74:2": "Denk aan Uw vergadering, die U vanouds verworven hebt; de roede van Uw erfenis, die U verlost hebt; de berg Sion, waar U gewoond hebt.", "Ps 72:5": "Zij zullen U vrezen, zolang de zon en maan er zijn, van geslacht tot geslacht.", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Matt 7:16-20": "Aan hun vruchten zult u hen herkennen. Plukt men ook een druif van doornen, of vijgen van distels? Zo brengt iedere goede boom goede vruchten voort, maar een slechte boom brengt slechte vruchten voort. Een goede boom kan geen slechte vruchten voortbrengen, en een slechte boom kan geen goede vruchten voortbrengen.", "Dan 4:10-26": "De visioenen van mijn hoofd op mijn bed waren deze: ik zag, en zie, er was een boom in het midden van de aarde, en zijn hoogte was groot. De boom werd groot en sterk; en zijn hoogte reikte aan de hemel, en hij werd gezien tot aan het einde van de hele aarde; Zijn loof was mooi, en zijn vruchten veel, en er was voedsel aan voor allen; onder hem vond het gedierte van het veld schaduw, en de vogels van de hemel woonden in zijn takken, en alle vlees werd daarvan gevoed.", "Gen 8:22": "Voortaan, al de dagen van de aarde, zullen zaaiing en oogst, en koude en hitte, en zomer en winter, en dag en nacht niet ophouden.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Ps 104:33": "Ik zal de HEERE zingen in mijn leven; ik zal mijn God psalmzingen, zolang ik nog ben.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "Ezech 44:9": "Zo zegt de Heere HEERE: Geen vreemde, onbesneden van hart en onbesneden van vlees, zal in Mijn heiligdom naar binnen gaan, van enige vreemde die te midden van de kinderen van Israël is.", "Ef 1:4-7": "Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde; Die ons van tevoren voorbestemd heeft tot aanneming tot kinderen, door Jezus Christus, voor Zichzelf, naar het welbehagen van Zijn wil. Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;", "Ezech 37:27": "En Mijn tabernakel zal bij hen zijn, en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Ef 2:10": "Want wij zijn Zijn maaksel, geschapen in Christus Jezus tot goede werken, die God voorbereid heeft, opdat wij daarin zouden wandelen.", "Ps 68:17": "Waarom springt u op, u bultige bergen? Deze berg heeft God begeerd tot Zijn woning; ook zal de HEERE er wonen in eeuwigheid.", "Ps 137:1-6": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion;", "Openb 20:12": "En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken.", "Amos 9:9": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.", "Deut 7:21": "Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "Deut 10:18": "Die het recht van de wees en van de weduwe doet; en de vreemdeling liefheeft, door hem brood en kleding te geven.", "Ef 4:8": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H4210\">Een</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4210\">psalm</span>, <span class=\"wl\" data-l=\"L1\" data-code=\"H4210\">een</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7892\">lied</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7892\">voor</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7141\">Korach</span>. <span class=\"wl\" data-l=\"L4\" data-code=\"H7141\">Zijn</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3248\">grondslag</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3248\">is</span> op <span class=\"wl\" data-l= /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
