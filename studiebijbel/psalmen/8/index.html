s, dat zij zich gedragen zoals bij heiligheid past, geen lasteraarsters zijn, zich niet overgeven aan veel wijn, maar leraressen zijn van het goede; Opdat zij de jonge vrouwen leren bezonnen te zijn, hun mannen lief te hebben, hun kinderen lief te hebben; Matig te zijn, kuis te zijn, het huis te bewaren, goed te zijn, hun eigen mannen onderdanig te zijn, opdat het Woord van God niet gelasterd wordt.", "Ps 104:19": "Hij heeft de maan gemaakt tot vaste tijden, de zon weet haar ondergang.", "Dan 2:30": "Aan mij nu is dit geheim geopenbaard, niet door wijsheid die in mij meer zou zijn dan in alle levenden, maar opdat men de koning de uitleg bekend zou maken, en opdat u de gedachten van uw hart zou kennen.", "2 Sam 14:29": "Daarom zond Absalom iemand naar Joab, om hem naar de koning te sturen; maar hij wilde niet naar hem toe komen. Toen zond hij nog een tweede keer; toch wilde hij niet komen.", "Gen 32:10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "Ps 34:21": "Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken.", "Spr 30:2": "Voorwaar, ik ben onverstandiger dan wie ook; en ik heb geen mensenverstand;", "Ps 119:64": "HEERE! de aarde is vol van Uw goedertierenheid; leer mij Uw inzettingen.", "1 Petr 1:12": "Aan hen is geopenbaard dat zij niet zichzelf, maar ons dienden met deze dingen, die u nu aangekondigd zijn door hen die u het Evangelie verkondigd hebben door de Heilige Geest, Die van de hemel gezonden is; dingen waar de engelen graag een blik in willen werpen.", "Ps 139:17": "Daarom, hoe kostbaar zijn mij, o God, Uw gedachten! Hoe machtig veel zijn hun sommen!", "Gen 1:28": "En God zegende hen, en God zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde en onderwerp haar, en heers over de vissen van de zee, en over het gevogelte van de hemel, en over al de dieren die op de aarde kruipen!", "Matt 21:13": "En Hij zei tegen hen: Er is geschreven: Mijn huis zal een huis van gebed genoemd worden; maar u hebt het tot een rovershol gemaakt.", "Hand 17:24-26": "De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn; En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft; En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Gal 3:6": "Zoals Abraham God geloofd heeft, en het is hem tot rechtvaardigheid gerekend;", "Hos 13:14": "Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,", "Ps 90:2": "Eer de bergen geboren waren, en U de aarde en de wereld voortgebracht had, ja, van eeuwigheid tot eeuwigheid bent U God.", "Ps 74:16": "De dag is van U, ook is de nacht van U; U hebt het licht en de zon bereid.", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Ps 44:23": "Maar om Uwentwil worden wij de hele dag gedood; wij worden geacht als slachtschapen.", "Dan 7:14": "En Hem werd gegeven heerschappij, en eer, en het Koninkrijk, dat alle volken, natiën en talen Hem zouden eren; Zijn heerschappij is een eeuwige heerschappij, die niet zal vergaan, en Zijn Koninkrijk zal niet te gronde gericht worden.", "Ps 102:26": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen;", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "Joh 3:29": "Wie de bruid heeft, is de bruidegom, maar de vriend van de bruidegom, die staat en hem hoort, verblijdt zich zeer over de stem van de bruidegom. Deze blijdschap van mij is dan vervuld geworden.", "Ps 95:7-11": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort, Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn; Waar uw vaders Mij verzochten, Mij beproefden, ook Mijn werk zagen.", "Ps 135:21": "Geloofd zij de HEERE uit Sion, Die te Jeruzalem woont. Halleluja!", "Ps 80:18": "Uw hand zij over de man van Uw rechterhand, over de zoon van de mens, die U voor Uzelf gesterkt hebt.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ps 97:6": "De hemelen verkondigen Zijn gerechtigheid, en alle volken zien Zijn eer.", "Luk 2:20": "En de herders keerden terug, terwijl zij God verheerlijkten en prezen om alles wat zij gehoord en gezien hadden, zoals tegen hen gesproken was.", "1 Joh 4:8": "Wie niet liefheeft, kent God niet; want God is liefde.", "1 Kon 3:7": "Nu dan, HEERE, mijn God! U hebt Uw knecht koning gemaakt in de plaats van mijn vader David; en ik ben een jonge man, ik weet niet uit te gaan of in te gaan.", "Ex 34:33": "Zo eindigde Mozes met hen te spreken, en hij had een sluier op zijn aangezicht gelegd.", "Matt 25:31": "En wanneer de Zoon des mensen komen zal in Zijn heerlijkheid, en alle heilige engelen met Hem, dan zal Hij zitten op de troon van Zijn heerlijkheid.", "Gen 15:6": "En hij geloofde in de HEERE; en Hij rekende het hem tot gerechtigheid.", "1 Tess 1:5": "Want ons Evangelie is bij u niet alleen met woorden gekomen, maar ook met kracht, en met de Heilige Geest, en met veel zekerheid; zoals u weet wat voor mensen wij bij u geweest zijn, ter wille van u.", "Deut 24:14": "U zult de arme en behoeftige dagloner niet verdrukken, die uit uw broeders is, of uit uw vreemdelingen die in uw land en in uw poorten zijn.", "Ps 144:1": "Een psalm van David. Geprezen zij de HEERE, mijn Rotssteen, Die mijn handen leert voor de strijd, mijn vingers voor de oorlog;", "Num 16:5": "En hij sprak tot Korach en tot zijn hele vergadering, en zei: Morgenvroeg zal de HEERE bekendmaken wie van Hem is, en wie de heilige is, die Hij tot Zich zal laten naderen; en wie Hij verkoren zal hebben, die zal Hij tot Zich laten naderen.", "Matt 15:27": "En zij zei: Ja, Heere! maar de hondjes eten ook van de brokjes die van de tafel van hun heren vallen.", "Jes 55:9": "Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.", "Ps 91:12": "Zij zullen u op de handen dragen, opdat u uw voet aan geen steen stoot.", "1 Kron 29:14": "Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Hand 13:41": "Zie, u verachters, verwonder u, en verdwijn; want Ik doe een werk in uw dagen, een werk dat u beslist niet zult geloven, ook al vertelt iemand het u.", "Jes 53:7": "Toen die geëist werd, werd Hij verdrukt; maar Hij deed Zijn mond niet open; als een lam werd Hij ter slachting geleid, en zoals een schaap stom is voor het aangezicht van zijn scheerders, zo deed Hij Zijn mond niet open.", "Job 22:12": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn.", "Ps 17:7": "Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan!", "Hebr 10:16": "want nadat Hij eerder gezegd had: Dit is het verbond, dat Ik met hen sluiten zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun harten geven, en Ik zal die in hun verstand schrijven;", "Ps 107:43": "Wie is wijs? Laat hij op deze dingen letten; en laat men verstandig letten op de blijken van goedertierenheid van de HEERE.", "Hebr 6:14": "en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken.", "Jes 24:23": "En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.", "Ex 31:18": "En Hij gaf aan Mozes, toen Hij met hem op de berg Sinaï geëindigd had te spreken, de twee tafelen van de getuigenis, tafelen van steen, beschreven met de vinger van God.", "Gen 12:1": "De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal.", "Luk 15:7": "Ik zeg u, dat er zo blijdschap zal zijn in de hemel over één zondaar die zich bekeert, meer dan over negenennegentig rechtvaardigen, die de bekering niet nodig hebben.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "2 Petr 3:18": "Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen.", "Rom 7:7": "Wat zullen wij dan zeggen? Is de wet zonde? Volstrekt niet. Ja, ik kende de zonde niet dan door de wet; want ik had ook de begeerte niet gekend als zonde, als de wet niet zei: U zult niet begeren.", "Jak 2:23": "En de Schrift is vervuld die zegt: En Abraham geloofde God, en het is hem tot rechtvaardigheid gerekend, en hij is een vriend van God genoemd.", "Jona 2:9": "Maar ik zal U offeren met de stem van de dankzegging; wat ik beloofd heb, zal ik betalen. Het heil is van de HEERE.", "Jes 33:5": "De HEERE is verheven, want Hij woont in de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "Ps 69:35": "Dat Hem prijzen de hemel en de aarde, de zeeën, en al wat daarin wemelt.", "2 Kor 2:14-16": "En God zij dank, Die ons altijd doet triomferen in Christus, en de geur van Zijn kennis door ons openbaar maakt op elke plaats. Want wij zijn voor God een goede geur van Christus, onder hen die behouden worden, en onder hen die verloren gaan; voor de laatsten een geur van dood tot dood, maar voor de eersten een geur van leven tot leven. En wie is hiertoe bekwaam?", "Jak 5:13": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen.", "1 Kor 10:20": "Nee, maar ik zeg dat wat de heidenen offeren, zij dat aan de duivelen offeren en niet aan God; en ik wil niet dat u gemeenschap hebt met de duivelen.", "Hand 26:23": "Namelijk dat de Christus moest lijden, en dat Hij, als Eerste uit de opstanding van de doden, een licht zou verkondigen aan dit volk en aan de heidenen.", "Mark 15:34": "En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Jes 26:15": "U, o HEERE, had dit volk vermeerderd, U had dit volk vermeerderd; U was verheerlijkt; maar U hebt hen tot alle einden van het aardrijk ver weggedaan.", "Ps 24:7-10": "Heft uw hoofden op, poorten, en verhef u, eeuwige deuren, opdat de Koning der ere ingaat! Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in de strijd. Heft uw hoofden op, poorten, ja, heft op, eeuwige deuren! opdat de Koning der ere ingaat!", "Matt 11:26": "Ja, Vader! Want zo is het welbehagen geweest voor U.", "Luk 22:37": "Want Ik zeg u, dat nog dit, wat geschreven is, in Mij vervuld moet worden, namelijk: En Hij is met de misdadigers gerekend. Want ook wat over Mij geschreven is, heeft een einde.", "Job 10:3": "Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft?", "Hebr 2:7": "U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen;", "Jes 35:2": "Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God.", "Hebr 2:6-9": "Maar iemand heeft ergens verklaard: Wat is de mens, dat U aan hem denkt, of de zoon van de mens, dat U naar hem omziet! U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen; Alle dingen hebt U onder zijn voeten onderworpen. Want doordat Hij hem alle dingen onderworpen heeft, heeft Hij niets overgelaten dat hem niet onderworpen is; maar nu zien wij nog niet dat hem alle dingen onderworpen zijn;", "Mal 4:5": "Zie, Ik zend u de profeet Elia, voordat die grote en vreselijke dag van de HEERE komt.", "Luk 1:55": "zoals Hij gesproken heeft tot onze vaderen, tot Abraham en zijn nageslacht, tot in eeuwigheid.", "1 Kor 8:6": "toch hebben wij maar één God, de Vader, uit Wie alle dingen zijn, en wij tot Hem; en maar één Heere, Jezus Christus, door Wie alle dingen zijn, en wij door Hem.", "Rom 10:15": "En hoe zullen zij prediken, als zij niet gezonden worden? Zoals geschreven is: Hoe lieflijk zijn de voeten van hen die vrede verkondigen, van hen die het goede verkondigen!", "1 Kron 16:31": "Laat de hemelen zich verblijden, en de aarde zich verheugen, en laat men onder de heidenen zeggen: De HEERE regeert.", "Jer 51:16": "Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Ps 69:5": "Die mij zonder oorzaak haten, zijn meer dan de haren van mijn hoofd; die mij zoeken te vernielen, die mij om valse oorzaken vijand zijn, zijn machtig geworden; wat ik niet geroofd heb, moet ik dan teruggeven.", "Ps 45:2-4": "Mijn hart geeft een goede rede op; ik spreek mijn gedichten uit van een Koning; mijn tong is een pen van een vaardige schrijver. U bent veel mooier dan de mensenkinderen; genade is uitgestort op Uw lippen; daarom heeft God U gezegend voor eeuwig. Gord Uw zwaard aan de heup, o Held! Uw Majesteit en Uw heerlijkheid.", "Job 38:7": "Toen de morgensterren samen vrolijk zongen, en al de kinderen van God juichten.", "Ex 33:23": "En wanneer Ik Mijn hand zal hebben weggenomen, zult u Mijn achterste delen zien; maar Mijn aangezicht zal niet gezien worden!", "Luk 2:32": "een licht tot verlichting van de heidenen, en tot heerlijkheid van Uw volk Israël.", "Ef 1:14": "Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Jes 49:13": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.", "Job 10:2-18": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist. Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft? Hebt U vleselijke ogen, ziet U zoals een mens ziet?", "Deut 5:25": "Maar nu, waarom zouden wij sterven? Want dit grote vuur zou ons verteren; als wij nog langer de stem van de HEERE, onze God, blijven horen, zouden wij sterven.", "Jes 65:2": "Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.", "Matt 2:18": "Een stem is in Rama gehoord, geklaag, geween en veel gekerm; Rachel beweende haar kinderen, en wilde niet getroost worden, omdat zij er niet meer zijn!", "Ef 3:21": "Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.", "Joz 2:9-11": "En zij sprak tot die mannen: Ik weet dat de HEERE u dit land gegeven heeft, en dat de schrik voor u op ons gevallen is, en dat alle inwoners van dit land voor u vergaan zijn van angst. Want wij hebben gehoord dat de HEERE het water van de Schelfzee heeft laten opdrogen voor u, toen u uit Egypte trok; en wat u gedaan hebt aan de twee koningen van de Amorieten, Sihon en Og, die aan de overkant van de Jordaan waren, die u met de ban geslagen hebt. Toen wij dat hoorden, versmolt ons hart, en er bleef geen moed meer over in iemand, vanwege uw aanwezigheid; want de HEERE, uw God, is een God boven in de hemel, en beneden op de aarde.", "Gen 17:19": "En God zei: Voorwaar, Sara, uw vrouw, zal u een zoon baren, en u zult zijn naam Izak noemen; en Ik zal Mijn verbond met hem oprichten, tot een eeuwig verbond voor zijn nageslacht na hem.", "Job 26:13": "Door Zijn Geest heeft Hij de hemel versierd; Zijn hand heeft de kronkelende slang geschapen.", "Deut 6:4": "Hoor, Israël! De HEERE, onze God, is een enig HEERE!", "Matt 25:37-40": "Dan zullen de rechtvaardigen Hem antwoorden: Heere! Wanneer hebben wij U hongerig gezien, en te eten gegeven, of dorstig, en te drinken gegeven? En wanneer hebben wij U een vreemdeling gezien, en een onderkomen gegeven, of naakt en gekleed? En wanneer hebben wij U ziek gezien, of in de gevangenis, en zijn bij U gekomen?", "Ps 75:2": "Wij loven U, o God! Wij loven, dat Uw Naam nabij is; men vertelt Uw wonderen.", "Gen 1:20-25": "En God zei: Laten de wateren wemelen van een overvloed aan levende wezens; en laat het gevogelte boven de aarde vliegen, langs het uitspansel van de hemel! En God schiep de grote zeedieren, en alle levende, wemelende wezens die de wateren in overvloed voortbrachten, naar hun aard; en al het gevleugelde gevogelte naar zijn aard. En God zag dat het goed was. En God zegende ze en zei: Wees vruchtbaar en word talrijk, en vervul de wateren in de zeeën; en laat het gevogelte talrijk worden op de aarde!", "Ps 41:10": "Zelfs de man van mijn vrede, op wie ik vertrouwde, die mijn brood at, heeft zijn hiel tegen mij groot gemaakt.", "Ps 8:6-9": "En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond? U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet; Schapen en ossen, alle die; ook de dieren van het veld.", "Jes 2:10": "Ga in de rotssteen, en verberg u in het stof, vanwege de schrik van de HEERE, en om de heerlijkheid van Zijn majesteit.", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "1 Tess 2:4": "maar zoals wij door God beproefd zijn, zodat ons het Evangelie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft.", "1 Kor 15:41": "De ene heerlijkheid is die van de zon, en de andere heerlijkheid is die van de maan, en de andere heerlijkheid is die van de sterren; want de ene ster verschilt van de andere ster in heerlijkheid.", "1 Petr 3:1": "Evenzo, u vrouwen, wees uw eigen mannen onderdanig; opdat ook, als er sommigen zijn die het Woord ongehoorzaam zijn, zij door de wandel van de vrouwen zonder Woord gewonnen mogen worden;", "Ps 119:172": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid.", "Ef 6:2": "Eer uw vader en moeder (dat is het eerste gebod met een belofte),", "Openb 4:11": "U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.", "Ps 108:2-4": "O God! Mijn hart is bereid; ik zal zingen en psalmzingen, ook mijn eer. Ontwaak, u luit en harp! Ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o HEERE! En ik zal U psalmzingen onder de natiën.", "Ps 32:11": "Verblijd u in de HEERE, en verheug u, rechtvaardigen! En zing vrolijk, alle oprechten van hart!", "Job 7:17": "Wat is de mens, dat U hem groot acht, en dat U Uw hart op hem zet?", "Ex 34:5-7": "De HEERE nu kwam neerwaarts in een wolk, en stelde Zich daar bij hem; en Hij riep de Naam van de HEERE uit. Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid. Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Joh 13:31": "Toen hij dan naar buiten gegaan was, zei Jezus: Nu is de Zoon des mensen verheerlijkt, en God is in Hem verheerlijkt.", "Pred 3:11": "Hij heeft ieder ding mooi gemaakt op zijn tijd; ook heeft Hij de eeuw in hun hart gelegd, zonder dat een mens het werk, dat God gemaakt heeft, kan doorgronden, van het begin tot het einde toe.", "Hebr 1:6": "En als Hij de Eerstgeborene opnieuw in de wereld inbrengt, zegt Hij: En dat alle engelen van God Hem aanbidden.", "Jes 52:15": "zo zal Hij veel heidenvolken besprenkelen; ja, koningen zullen hun mond over Hem dichthouden; want aan wie het niet verkondigd was, die zullen het zien, en wie het niet gehoord hebben, die zullen het begrijpen.", "Pred 3:14": "Ik weet, dat al wat God doet, dat zal in eeuwigheid zijn, en er is niets aan toe te doen, en er is niets van af te doen; en God doet dat, opdat men vreest voor Zijn aangezicht.", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Deut 5:5": "(ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei:", "Ex 20:13": "U zult niet doodslaan.", "Ps 106:48": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid; en al het volk zegt: Amen, Halleluja!", "Ps 86:12": "Heere, mijn God! ik zal U met mijn hele hart loven, en ik zal Uw Naam eren tot in eeuwigheid;", "Jes 59:8": "De weg van de vrede kennen zij niet; en er is geen recht in hun gangen; hun paden maken zij krom voor zichzelf; ieder die daarop gaat, kent de vrede niet.", "Mark 15:36": "En er liep iemand, en vulde een spons met azijn, en stak die op een rietstok, en gaf Hem te drinken, en zei: Laat staan, laten we zien of Elia komt om Hem eraf te halen.", "Hebr 13:2": "Vergeet de herbergzaamheid niet; want hierdoor hebben sommigen zonder het te weten engelen geherbergd.", "Matt 8:20": "En Jezus zei tegen hem: De vossen hebben holen, en de vogels van de hemel nesten; maar de Zoon des mensen heeft niets waar Hij het hoofd kan neerleggen.", "Ps 117:1": "Loof de HEERE, alle heidenvolken; prijs Hem, alle natiën!", "Ps 78:2": "Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af.", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Ps 89:53": "Geloofd zij de HEERE in eeuwigheid! Amen, ja, amen.", "1 Petr 1:25": "maar het Woord van de Heere blijft in eeuwigheid. En dit is het Woord dat onder u verkondigd is.", "Hebr 2:6-8": "Maar iemand heeft ergens verklaard: Wat is de mens, dat U aan hem denkt, of de zoon van de mens, dat U naar hem omziet! U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen; Alle dingen hebt U onder zijn voeten onderworpen. Want doordat Hij hem alle dingen onderworpen heeft, heeft Hij niets overgelaten dat hem niet onderworpen is; maar nu zien wij nog niet dat hem alle dingen onderworpen zijn;", "Hand 2:35": "Totdat Ik Uw vijanden tot een voetbank voor Uw voeten gezet zal hebben.", "Hand 2:34": "Want David is niet opgevaren naar de hemel; maar hij zegt zelf: De Heere heeft gesproken tot mijn Heere: Zit aan Mijn rechterhand,", "Dan 9:21-23": "terwijl ik nog sprak in het gebed, kwam de man Gabriël, die ik in het begin in een visioen gezien had, snel gevlogen, en raakte mij aan, omtrent de tijd van het avondoffer. En hij onderrichtte mij en sprak met mij, en zei: Daniël! nu ben ik uitgegaan, om u het inzicht te doen verstaan. In het begin van uw smekingen is het woord uitgegaan, en ik ben gekomen om het u bekend te maken; want u bent een zeer geliefde man; versta dan dit woord, en let op dit visioen.", "Hebr 2:16": "Want inderdaad, Hij neemt niet de engelen aan, maar Hij neemt het nageslacht van Abraham aan.", "Dan 2:23": "Ik dank U en ik loof U, o God van mijn vaderen! Omdat U mij wijsheid en kracht gegeven hebt, en mij nu bekendgemaakt hebt wat wij van U gevraagd hebben, want U hebt ons de zaak van de koning bekendgemaakt.", "1 Kor 15:25": "Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd.", "Ps 46:11": "Laat af, en weet, dat Ik God ben; Ik zal verhoogd worden onder de heidenen, Ik zal verhoogd worden op de aarde.", "Openb 10:6": "En hij zwoer bij Hem Die leeft in alle eeuwigheid, Die de hemel geschapen heeft en wat daarin is, en de aarde en wat daarin is, en de zee en wat daarin is, dat er geen tijd meer zal zijn;", "Hebr 7:26": "Want zo'n Hogepriester paste bij ons: heilig, onschuldig, onbesmet, afgescheiden van de zondaars, en hoger geworden dan de hemelen;", "Ps 131:1": "Een lied Hammaaloth, van David. HEERE, mijn hart is niet hoogmoedig, en mijn ogen zijn niet trots; ook heb ik niet gestreefd naar dingen die mij te groot en te wonderlijk zijn.", "Ps 69:22": "Ja, zij hebben mij gal tot mijn spijs gegeven; en in mijn dorst hebben zij mij azijn te drinken gegeven.", "1 Petr 5:11": "Aan Hem zij de heerlijkheid en de kracht, tot in alle eeuwigheid. Amen.", "Jes 53:12": "Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "Ps 68:20": "Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela.", "Jes 8:14": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem.", "Joh 6:31": "Onze vaders hebben het manna gegeten in de woestijn, zoals geschreven is: Hij gaf hun brood uit de hemel te eten.", "Joh 1:52": "En Hij zei tegen hem: Voorwaar, voorwaar, Ik zeg u: Van nu af aan zult u de hemel geopend zien, en de engelen van God opklimmen en neerdalen op de Zoon des mensen.", "Ps 52:3": "Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag.", "Ps 107:31": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Matt 17:10-13": "En Zijn discipelen vroegen Hem: Waarom zeggen de Schriftgeleerden dan dat Elia eerst moet komen? Jezus antwoordde en zei tegen hen: Elia zal inderdaad eerst komen en alles herstellen. Maar Ik zeg u dat Elia al gekomen is, en zij hebben hem niet erkend; maar zij hebben met hem gedaan wat zij wilden. Zo zal ook de Zoon des mensen door hen lijden.", "Matt 7:11": "Als u dan, die slecht bent, uw kinderen goede gaven weet te geven, hoeveel te meer zal uw Vader, Die in de hemelen is, goede gaven geven aan hen die ze van Hem vragen!", "Ps 43:4": "En dat ik inga tot Gods altaar, tot de God van de blijdschap van mijn verheuging, en U met de harp loof, o God, mijn God!", "Deut 5:17": "U zult niet doodslaan.", "Ps 8:2-10": "O HEERE, onze Heere! Hoe heerlijk is Uw Naam op de hele aarde! U, die Uw majesteit boven de hemelen gesteld hebt. Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden. Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt;", "Luk 12:8": "En Ik zeg u: ieder die Mij belijden zal voor de mensen, die zal ook de Zoon des mensen belijden voor de engelen van God.", "Joh 2:17": "En Zijn discipelen herinnerden zich dat er geschreven is: De ijver voor Uw huis heeft mij verslonden.", "Rom 9:27": "En Jesaja roept over Israël: Al zou het aantal kinderen van Israël zijn als het zand van de zee, toch zal het overblijfsel behouden worden.", "Ps 57:12": "Verhef U boven de hemelen, o God! Uw eer zij over de hele aarde.", "Rom 4:3": "Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.", "1 Kor 14:1-20": "Jaag de liefde na, en streef ernaar de geestelijke gaven te ontvangen, maar het meest, dat u mag profeteren. Want wie een vreemde taal spreekt, spreekt niet tot de mensen, maar tot God; want niemand verstaat het, doch met de geest spreekt hij verborgenheden. Maar wie profeteert, spreekt tot de mensen stichting, en vermaning en vertroosting.", "Ps 16:8-11": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen. Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten. Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Matt 11:13": "Want al de profeten en de wet hebben tot Johannes toe geprofeteerd.", "Matt 19:18": "Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Rom 9:7": "Ook zijn zij niet allen kinderen omdat zij nageslacht van Abraham zijn; maar: In Izaak zal uw nageslacht genoemd worden.", "Rom 11:3": "Heere! Zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn leven.", "Jes 53:9": "En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij de rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, en er geen bedrog in Zijn mond geweest is.", "Luk 17:16": "En hij viel op zijn gezicht voor Zijn voeten en dankte Hem; en dat was een Samaritaan.", "Ex 20:13-17": "U zult niet doodslaan. U zult geen echtbreuk plegen. U zult niet stelen.", "Joh 17:10": "En al het Mijne is van U, en het Uwe is van Mij; en Ik ben in hen verheerlijkt.", "Jes 8:13": "De HEERE van de heerscharen, Die zult u heiligen, en Hij zij uw vrees, en Hij zij uw verschrikking.", "Rom 15:11": "En opnieuw: Looft de Heere, alle heidenen, en prijst Hem, alle volken!", "Openb 21:10": "En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God.", "Jak 2:8": "Als u dan de koninklijke wet vervult, naar de Schrift: U zult uw naaste liefhebben als uzelf, dan doet u goed;", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "Ps 104:2": "Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Jak 1:5": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden.", "Gen 1:16-18": "God maakte dan die twee grote lichten: dat grote licht om te heersen over de dag, en dat kleine licht om te heersen over de nacht; en ook de sterren. En God stelde ze aan het uitspansel van de hemel, om licht te geven op de aarde, en om te heersen over de dag en over de nacht, en om scheiding te maken tussen het licht en de duisternis. En God zag dat het goed was.", "Matt 21:9": "En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "Gal 3:16": "Nu zijn de beloften gesproken tot Abraham en zijn nageslacht. Hij zegt niet: En aan de nageslachten, alsof het over velen ging; maar alsof het over één ging: En uw nageslacht; dat is Christus.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Gen 9:2": "En vrees en angst voor u zal er zijn over al het gedierte van de aarde, en over al het gevogelte van de hemel; over alles wat zich op de aardbodem beweegt, en over alle vissen van de zee; zij zijn in uw hand overgegeven.", "Joh 15:25": "Maar dit gebeurt, zodat het woord vervuld wordt dat in hun wet geschreven is: Zij hebben Mij zonder oorzaak gehaat.", "Ps 98:4-6": "Juich de HEERE toe, heel de aarde! Roep uit van vreugde, en zing vrolijk, en zing psalmen. Zing psalmen voor de HEERE met de harp, met de harp en met de stem van het gezang, Met trompetten en bazuingeklank; juich voor het aangezicht van de Koning, de HEERE.", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Ps 9:12": "Zingt psalmen voor de HEERE, Die te Sion woont; verkondigt onder de volken Zijn daden.", "Luk 17:15": "En een van hen, die zag dat hij genezen was, keerde terug en verheerlijkte God met luide stem.", "Ef 1:22": "En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;", "Rom 9:9": "Want dit is het woord van de belofte: Rond deze tijd zal Ik komen, en Sara zal een zoon hebben.", "Mark 12:19": "Meester, Mozes heeft ons geschreven: Als iemands broer sterft, en een vrouw achterlaat, en geen kinderen nalaat, dat zijn broer diens vrouw moet nemen en voor zijn broer nageslacht moet verwekken.", "Ps 95:6": "Komt, laat ons aanbidden en neerbukken; laat ons knielen voor de HEERE, Die ons gemaakt heeft.", "Ps 139:18": "Zou ik ze tellen? Ze zijn meer dan het zand; word ik wakker, dan ben ik nog bij U.", "Ps 146:3": "Vertrouw niet op prinsen, op een mensenkind, bij wie geen heil is.", "Hand 7:42": "En God keerde Zich af, en gaf hen over om het leger van de hemel te dienen, zoals geschreven staat in het boek van de profeten: Hebt u soms slachtoffers en offers aan Mij gebracht, veertig jaar lang in de woestijn, huis van Israël?", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "Hebr 1:10-12": "En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen; Die zullen vergaan, maar U blijft altijd, en zij zullen allemaal verouderen als een kleed; En als een dekkleed zult U ze oprollen, en zij zullen veranderd worden; maar U bent Dezelfde, en Uw jaren zullen niet ophouden.", "Jes 45:11": "Zo zegt de HEERE, de Heilige van Israël, en zijn Formeerder: Zij hebben Mij naar toekomende dingen gevraagd; over Mijn kinderen, zou u Mij over het werk van Mijn handen bevel geven?", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Matt 6:13": "En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.", "2 Tess 1:7": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "Matt 11:14": "En als u het wilt aannemen, hij is Elia, die komen zou.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "Ps 119:7": "Ik zal U loven in oprechtheid van hart, als ik de rechten van Uw gerechtigheid geleerd zal hebben.", "Ps 113:2-4": "De Naam van de HEERE zij geprezen, van nu af tot in eeuwigheid. Van de opgang van de zon af tot haar neergang zij de Naam van de HEERE geloofd. De HEERE is hoog boven alle heidenvolken, boven de hemelen is Zijn heerlijkheid.", "Ps 104:1-32": "Loof de HEERE, mijn ziel! O HEERE, mijn God! U bent zeer groot, U bent bekleed met majesteit en heerlijkheid. Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn. Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Deut 4:19": "Dat u ook uw ogen niet opheft naar de hemel, en de zon aanziet, en de maan, en de sterren, heel het leger van de hemel; en zich laat verleiden om u daarvoor te buigen en ze te dienen; die de HEERE, uw God, aan alle volken onder de hele hemel heeft toebedeeld.", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Ps 113:6": "Die zeer laag ziet, in de hemel en op de aarde.", "Matt 11:10": "Want deze is het, van wie geschreven staat: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg bereiden zal voor U heen.", "Jer 33:21": "Dan zou ook Mijn verbond met Mijn knecht David verbroken kunnen worden, zodat hij geen zoon heeft die op zijn troon regeert, en met de Levieten, de priesters, Mijn dienaren.", "Hand 23:5": "En Paulus zei: Ik wist niet, broeders, dat hij de hogepriester was; want er is geschreven: De leider van uw volk zult u niet vervloeken.", "Jes 40:22": "Hij is het, Die daar zit boven de kring van de aarde, en haar inwoners zijn als sprinkhanen; Hij is het, Die de hemel uitspant als een dunne doek, en breidt hem uit als een tent, om te bewonen;", "Deut 30:12-14": "Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Want dit woord is heel dichtbij u, in uw mond, en in uw hart, om dat te doen.", "Ex 32:6": "En zij stonden de volgende dag vroeg op, en offerden brandoffers en brachten dankoffers; en het volk zat neer om te eten en te drinken, daarna stonden zij op om te spelen.", "Fil 3:12": "Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben.", "Hand 4:26": "De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde.", "Mark 15:28": "En de Schrift is vervuld die zegt: En Hij is met de misdadigers gerekend.", "Dan 4:13": "Ik zag verder in de visioenen van mijn hoofd, op mijn bed; en zie, een wachter, namelijk een heilige, kwam neer uit de hemel,", "Hebr 12:5": "En u bent de vermaning vergeten, die tot u spreekt als tot zonen: Mijn zoon, acht de kastijding van de Heere niet klein, en bezwijk niet als u door Hem bestraft wordt;", "Matt 27:48": "En meteen liep een van hen toe, nam een spons, vulde die met azijn, stak ze op een rietstok, en gaf Hem te drinken.", "Ps 71:22": "Ook zal ik U loven met het instrument van de luit, Uw trouw, mijn God; ik zal U psalmzingen met de harp, o Heilige van Israël!", "Ps 108:6": "Verhef U, o God! Boven de hemelen, en Uw eer over de hele aarde.", "Joh 19:29": "Daar stond dan een vat vol azijn, en zij vulden een spons met azijn, en omlegden ze met hysop, en brachten ze aan Zijn mond.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Rom 4:18": "Hij heeft tegen hoop op hoop geloofd, dat hij een vader van veel volken zou worden, volgens wat gezegd was: Zo zal uw nageslacht zijn.", "Ps 100:3": "Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "Luk 7:6": "En Jezus ging met hen mee. En toen Hij al niet ver meer van het huis was, zond de hoofdman over honderd enkele vrienden naar Hem toe, en zei tegen Hem: Heere, doe geen moeite; want ik ben het niet waard dat U onder mijn dak komt.", "Ps 143:10": "Leer mij Uw welbehagen doen, want Gij zijt mijn God; Uw goede Geest leidt mij in een effen land.", "Luk 1:68": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht;", "Matt 19:19": "Eer uw vader en moeder; en: U zult uw naaste liefhebben als uzelf.", "Gen 2:1-25": "Zo zijn de hemel en de aarde voltooid, en heel hun leger. Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had. En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.", "2 Kor 4:13": "Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;", "Ex 15:1": "Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen.", "Ps 79:13": "Zo zullen wij, Uw volk en de schapen van Uw weide, U loven in eeuwigheid, van geslacht tot geslacht; wij zullen Uw roem vertellen.", "Fil 2:9-11": "Daarom heeft God Hem ook uitermate verhoogd, en heeft Hem een Naam gegeven, die boven alle naam is; Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn. En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "1 Kor 11:12": "Want zoals de vrouw uit de man is, zo is ook de man door de vrouw; maar alle dingen zijn uit God.", "Mark 10:6": "Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt.", "1 Sam 13:14": "Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.", "Jes 51:3": "Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang.", "Openb 15:8": "En de tempel werd vervuld met rook uit de heerlijkheid van God, en uit Zijn kracht; en niemand kon de tempel binnengaan, totdat de zeven plagen van de zeven engelen geëindigd waren.", "Matt 5:38": "U hebt gehoord dat gezegd is: Oog om oog, en tand om tand.", "1 Kor 1:26-29": "Want u ziet uw roeping, broeders, dat u niet veel wijzen bent naar het vlees, niet veel machtigen, niet veel edelen. Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen; En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken;", "Spr 3:11": "Mijn zoon! Verwerp de tucht van de HEERE niet, en word niet verdrietig over Zijn kastijding;", "Ps 68:19": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!", "Jes 6:5-7": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien. Maar een van de serafs vloog naar mij toe, en had een gloeiende kool in zijn hand, die hij met de tang van het altaar genomen had. En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Jes 27:9": "Daarom zal daardoor de ongerechtigheid van Jakob verzoend worden, en dit is de hele vrucht, dat Hij zijn zonde zal wegdoen: wanneer Hij alle stenen van het altaar maakt als verstrooide kalkstenen, zullen de bossen en de zonnebeelden niet blijven bestaan.", "Deut 25:5": "Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen.", "Hebr 4:5-7": "En op deze plaats opnieuw: Zij zullen Mijn rust niet ingaan! Omdat het dan blijft gelden dat sommigen die rust ingaan, en zij aan wie het Evangelie eerst verkondigd was, niet ingegaan zijn vanwege de ongehoorzaamheid, bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.", "Ps 145:7": "Zain. Zij zullen de gedachtenis van de grootheid van Uw goedheid overvloedig uitstorten, en zij zullen Uw gerechtigheid met gejuich verkondigen.", "Fil 3:13": "Broeders, ik acht niet dat ik het zelf al gegrepen heb.", "Ps 36:6": "O HEERE! Uw goedertierenheid is tot in de hemelen; Uw waarheid tot de bovenste wolken toe.", "1 Kron 23:30": "En om elke morgen te staan om de HEERE te loven en te prijzen; en evenzo 's avonds;", "1 Petr 5:5": "Evenzo, u jongeren, wees de ouderen onderdanig; en wees allen elkaar onderdanig; bekleed u met nederigheid; want God weerstaat de hoogmoedigen, maar aan de nederigen geeft Hij genade.", "Gen 21:1": "En de HEERE bezocht Sara, zoals Hij gezegd had; en de HEERE deed aan Sara, zoals Hij gesproken had.", "Ps 66:2": "Zingt psalmen tot eer van Zijn Naam; geeft eer aan Zijn lof.", "Deut 32:43": "Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "2 Kor 8:15": "Zoals geschreven is: Wie veel verzameld had, had niet over; en wie weinig verzameld had, had niet te weinig.", "Ezech 36:22": "Daarom, zeg tot het huis van Israël: Zo zegt de Heere HEERE: Ik doe het niet om u, huis van Israël! Maar om Mijn heilige Naam, die u ontheiligd hebt onder de heidenen waarheen u gekomen bent.", "Deut 18:18": "Een Profeet zal Ik hun doen opstaan uit hun broeders, zoals u; en Ik zal Mijn woorden in Zijn mond leggen, en Hij zal tot hen spreken alles wat Ik Hem gebieden zal.", "Luk 2:23": "(zoals geschreven is in de wet van de Heere: Al wat mannelijk is, dat de moeder opent, zal de Heere heilig genoemd worden.)", "Ps 119:73": "Jod. Uw handen hebben mij gemaakt, en bereid; maak mij verstandig, opdat ik Uw geboden leer.", "Hos 2:22": "En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!", "Job 39:4-33": "Weet u de tijd van het baren van de steengeiten? Hebt u waargenomen de arbeid van de hinden? Zult u de maanden tellen, die zij vervullen, en weet u de tijd van haar baren? Als zij zich krommen, haar jongen met versplijting voortbrengen, haar smarten uitwerpen?", "1 Tim 5:21": "Ik roep als getuige God aan, en de Heere Jezus Christus, en de uitverkoren engelen, dat u deze dingen bewaart, zonder vooroordeel, niets doend uit partijdigheid.", "Ps 144:9": "O God, ik zal U een nieuw lied zingen; met de luit en het tiensnarig instrument zal ik U lofzingen.", "Rom 15:3": "Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.", "Spr 15:20": "Een wijze zoon verblijdt de vader; maar een dwaas mens veracht zijn moeder.", "Matt 27:46": "En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Ex 3:2": "En de Engel van de HEERE verscheen hem in een vuurvlam uit het midden van een braambos; en hij zag, en zie, het braambos brandde in het vuur, en het braambos werd niet verteerd.", "Gen 15:5": "Toen leidde Hij hem naar buiten, en zei: Zie nu op naar de hemel, en tel de sterren, als u ze tellen kunt; en Hij zei tegen hem: Zo zal uw nageslacht zijn!", "Rom 1:23": "en hebben de heerlijkheid van de onvergankelijke God veranderd in de gelijkenis van het beeld van een vergankelijk mens, en van vogels, en van viervoetige en kruipende dieren.", "Jes 53:1": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard?", "Ef 3:10": "opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "Ps 78:24": "En Hij regende op hen het Manna om te eten, en gaf hun hemels koren.", "2 Sam 7:19": "Daarbij is dit in Uw ogen nog klein geweest, Heere HEERE, maar U hebt ook over het huis van uw knecht gesproken tot ver in de toekomst; en dit naar de wet van de mensen, Heere HEERE!", "Jes 1:9": "Als de HEERE van de heerscharen ons niet nog een klein overblijfsel had gelaten, zouden wij als Sodom geworden zijn; wij zouden Gomorra gelijk zijn geworden.", "Jes 40:26": "Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist.", "Deut 4:11": "En u kwam dichterbij en stond onder aan die berg (die berg brandde nu van vuur tot aan het midden van de hemel; er was duisternis, wolken en donkerheid).", "Matt 26:31": "Toen zei Jezus tegen hen: U zult allen deze nacht aan Mij geërgerd worden; want er is geschreven: Ik zal de Herder slaan, en de schapen van de kudde zullen verstrooid worden.", "Jes 28:12": "tot wie Hij gezegd heeft: Dit is de rust, geef de moede rust, en dit is de verkwikking; toch hebben zij niet willen horen.", "Ex 2:14": "Hij dan zei: Wie heeft u tot een leider en rechter over ons gezet? Wilt u mij doden, zoals u de Egyptenaar gedood hebt? Toen werd Mozes bang, en zei: Zeker, deze zaak is bekend geworden!", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Deut 5:11": "U zult de Naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal hem die Zijn Naam ijdel gebruikt, niet onschuldig houden.", "Hebr 11:3": "Door het geloof begrijpen wij dat de wereld door het woord van God gemaakt is, zodat de dingen die men ziet niet ontstaan zijn uit dingen die zichtbaar zijn.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Mark 14:50": "En zij verlieten Hem, en vluchtten allen.", "Ps 95:2": "Laat ons Zijn aangezicht tegemoet gaan met lof; laat ons Hem juichen met psalmen.", "Jes 53:11": "Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen.", "Ps 69:10": "Want de ijver voor Uw huis heeft mij verteerd; en de smaad van hen die U smaden, is op mij gevallen.", "Rom 3:13": "Hun keel is een geopend graf; met hun tongen plegen zij bedrog; slangenvenijn is onder hun lippen.", "Num 22:35": "De Engel van de HEERE zei toen tegen Bileam: Ga met deze mannen mee; maar alleen dat woord dat Ik tot u spreken zal, dat zult u spreken. Zo ging Bileam met de vorsten van Balak mee.", "Ps 8:7-9": "U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet; Schapen en ossen, alle die; ook de dieren van het veld. Het gevogelte van de hemel, en de vissen van de zee; wat de paden van de zeeën doorwandelt.", "Ps 109:3": "En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak.", "Kol 1:23-29": "als u maar blijft in het geloof, gefundeerd en vast, en niet wordt weggebracht van de hoop van het Evangelie dat u gehoord hebt, dat gepredikt is onder alle schepselen die onder de hemel zijn; waarvan ik, Paulus, een dienaar geworden ben; die mij nu verblijd in mijn lijden voor u, en aanvult in mijn vlees wat nog ontbreekt aan de verdrukkingen van Christus, voor Zijn lichaam, dat is de Gemeente; waarvan ik een dienaar geworden ben, naar de bedeling van God die mij gegeven is voor u, om het Woord van God te vervullen;", "Ex 19:18": "En de hele berg Sinaï rookte, omdat de HEERE daarop neerkwam in vuur; en zijn rook steeg op, als de rook van een oven; en de hele berg beefde erg.", "Gen 14:20": "En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Spr 25:22": "Want u zult vurige kolen op zijn hoofd hopen, en de HEERE zal het u vergelden.", "Job 38:4": "Waar was u, toen Ik de aarde grondde? Geef het te kennen, indien u kloek van verstand bent.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Ps 24:2": "Want Hij heeft haar gegrond op de zeeën, en heeft haar gevestigd op de rivieren.", "Jer 31:31-34": "Zie, de dagen komen, spreekt de HEERE, dat Ik met het huis van Israël en met het huis van Juda een nieuw verbond zal sluiten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hun hand vastgreep om hen uit het land Egypte uit te leiden, welk verbond van Mij zij verbroken hebben, hoewel Ik hen getrouwd had, spreekt de HEERE; Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Jes 40:17": "Alle volken zijn als niets voor Hem; en zij worden bij Hem geacht minder dan niet, en ijdelheid.", "Mark 14:26": "En nadat zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.", "Job 37:16": "Hebt u kennis van de opwegingen van de dikke wolken; de wonderen van Hem die volmaakt is in wetenschappen?", "Jes 7:14": "Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen.", "Spr 3:12": "Want de HEERE kastijdt hem die Hij liefheeft, ja, zoals een vader de zoon in wie hij een welbehagen heeft.", "Ps 67:4": "De volken zullen U, o God, loven; de volken, allemaal, zullen U loven.", "Jes 51:16": "En Ik leg Mijn woorden in uw mond, en bedek u onder de schaduw van Mijn hand; om de hemel te planten, en om de aarde te gronden, en om tegen Sion te zeggen: U bent Mijn volk.", "Ezech 3:12": "Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "Deut 28:58": "Als u niet oplet om al de woorden van deze wet te doen, die in dit boek geschreven zijn, om deze heerlijke en ontzagwekkende Naam te vrezen, de HEERE, uw God;", "Hand 2:16-21": "Maar dit is wat gesproken is door de profeet Joël: En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren.", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "Spr 22:2": "Rijken en armen ontmoeten elkaar; de HEERE heeft hen allen gemaakt.", "Job 38:12": "Hebt u van uw dagen de morgenstond geboden? Hebt u de dageraad zijn plaats gewezen;", "Ps 8:4-7": "Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt; Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt? En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond?", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "Fil 1:11": "Vervuld met vruchten van de gerechtigheid, die door Jezus Christus zijn tot heerlijkheid en lof van God.", "Nahum 1:3-6": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten. Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg. De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.", "2 Tess 1:11": "Daarom bidden wij ook altijd voor u, dat onze God u waardig acht voor deze roeping, en al het welbehagen van Zijn goedheid vervult, en het werk van het geloof met kracht.", "Ps 19:5": "Hun richtsnoer gaat uit over de hele aarde, en hun redenen tot het einde van de wereld; Hij heeft daarin een tent gesteld voor de zon.", "Deut 18:15-19": "Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren, naar alles wat u van de HEERE, uw God, bij Horeb, op de dag van de samenkomst, gevraagd hebt, en zei: Ik wil de stem van de HEERE, mijn God, niet meer horen, en dit grote vuur wil ik niet meer zien, opdat ik niet sterf. Toen zei de HEERE tot mij: Het is goed, wat zij gesproken hebben.", "Gen 18:18": "Omdat Abraham zeker tot een groot en machtig volk zal worden, en alle volken van de aarde in hem gezegend zullen worden?", "Mark 12:10": "Hebt u deze Schrift niet gelezen: De steen die de bouwers verworpen hebben, die is tot een hoeksteen geworden;", "Luk 4:8": "En Jezus antwoordde en zei tegen hem: Ga weg van Mij, satan, want er is geschreven: U zult de Heere, uw God, aanbidden, en Hem alleen dienen.", "Ps 19:2": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen.", "1 Kon 19:12": "En na de aardbeving een vuur; de HEERE was ook in het vuur niet; en na het vuur het suizen van een zachte stilte.", "Ps 56:11": "In God zal ik het woord prijzen; in de HEERE zal ik het woord prijzen.", "Matt 22:24": "En zeiden: Meester! Mozes heeft gezegd: Als iemand sterft zonder kinderen te hebben, zal zijn broer met zijn vrouw trouwen en voor zijn broer nakomelingen verwekken.", "Ps 47:8": "Want God is een Koning van de hele aarde; zingt psalmen met verstand!", "Ef 3:8": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,", "Jes 52:12": "Want u zult niet haastig weggaan, en ook niet vluchtend heengaan; want de HEERE zal voor uw aangezicht heentrekken, en de God van Israël zal uw achterhoede zijn.", "Ps 51:17": "Heere, open mijn lippen, zo zal mijn mond Uw lof verkondigen.", "2 Kor 6:16": "Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Jer 33:2": "Zo zegt de HEERE, Die het doet, de HEERE, Die dat vormt, opdat Hij het bevestigt, HEERE is Zijn Naam;", "Openb 4:10": "dan vielen de vierentwintig oudsten neer voor Hem Die op de troon zat, en aanbaden Hem Die leeft tot in alle eeuwigheid, en wierpen hun kronen voor de troon, en zeiden:", "Rom 1:18-20": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden. Omdat wat van God gekend kan worden, in hen openbaar is; want God heeft het hun geopenbaard. Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "Matt 4:11": "Toen liet de duivel Hem los; en zie, de engelen kwamen naar Hem toe, en dienden Hem.", "Hebr 10:38": "Maar de rechtvaardige zal uit het geloof leven; en als iemand zich terugtrekt, heeft Mijn ziel in hem geen behagen.", "Jes 45:12": "Ik heb de aarde gemaakt, en Ik heb de mens daarop geschapen; Ik ben het! Mijn handen hebben de hemelen uitgebreid, en Ik heb heel hun leger bevel gegeven.", "Luk 9:31": "die in heerlijkheid verschenen en spraken over Zijn heengaan, dat Hij te Jeruzalem zou volbrengen.", "Rom 10:19": "Maar ik zeg: Heeft Israël het niet begrepen? Mozes zegt eerst: Ik zal u tot jaloersheid verwekken door hen die geen volk zijn; door een onverstandig volk zal Ik u tot toorn verwekken.", "Hebr 3:4": "Want ieder huis wordt door iemand gebouwd; maar Die dit alles gebouwd heeft, is God.", "Ef 1:6": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;", "Rom 10:6-8": "Maar de rechtvaardigheid die uit het geloof is, spreekt zo: Zeg niet in uw hart: Wie zal naar de hemel opklimmen? Dat is: om Christus van boven af te brengen. Of: wie zal in de afgrond neerdalen? Dat is: om Christus uit de doden op te brengen. Maar wat zegt zij? Dicht bij u is het Woord, in uw mond en in uw hart. Dit is het Woord van het geloof, dat wij prediken;", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "Luk 3:4-6": "zoals geschreven is in het boek van de woorden van Jesaja, de profeet, die zei: De stem van iemand die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht! Elk dal zal gevuld worden, en elke berg en heuvel zal verlaagd worden, en de kromme wegen zullen tot een rechte weg worden, en de oneffen tot effen wegen. En alle vlees zal de zaligheid van God zien.", "Ps 116:12-14": "Wat zal ik de HEERE vergelden voor al Zijn weldaden aan mij bewezen? Ik zal de beker der verlossingen opnemen, en de Naam van de HEERE aanroepen. Mijn geloften zal ik de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk.", "Jer 31:35-37": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam: Als deze ordeningen van voor Mijn aangezicht zullen wijken, spreekt de HEERE, dan zal ook het nageslacht van Israël ophouden een volk te zijn voor Mijn aangezicht, alle dagen. Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "Matt 4:19": "en Hij zei tegen hen: Volg Mij, en Ik zal u vissers van mensen maken.", "Job 26:7-13": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets. Hij bindt het water in Zijn wolken; toch scheurt de wolk daaronder niet. Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "1 Kor 1:31": "Opdat het zij, zoals geschreven is: Wie roemt, laat hij roemen in de Heere.", "Spr 13:1": "Een wijze zoon hoort de tucht van de vader; maar een spotter hoort de bestraffing niet.", "Ex 20:19": "en zij zeiden tegen Mozes: Spreek ú met ons, en wij zullen horen; en laat God niet met ons spreken, opdat wij niet sterven!", "Openb 7:9": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen.", "Hebr 2:9": "maar wij zien Jezus met heerlijkheid en eer gekroond, Die een weinig minder dan de engelen geworden was, vanwege het lijden van de dood, opdat Hij door de genade van God voor allen de dood zou proeven.", "Matt 27:9": "Toen is vervuld wat gesproken is door de profeet Jeremia, die zei: En zij hebben de dertig zilverstukken genomen, de prijs van Hem Die gewaardeerd was, op wie de kinderen van Israël een waarde gesteld hadden;", "Ps 96:7-9": "Geeft de HEERE, geslachten van de volken! Geeft de HEERE eer en sterkte. Geeft de HEERE de eer van Zijn Naam; brengt een offer, en komt in Zijn voorhoven. Aanbidt de HEERE in de heerlijkheid van het heiligdom; beeft voor Zijn aangezicht, heel de aarde.", "Spr 3:19": "De HEERE heeft de aarde door wijsheid gegrond, de hemelen door verstandigheid bereid.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Luk 20:42": "En David zelf zegt in het boek van de Psalmen: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand,", "Ps 76:5": "U bent doorluchtiger en heerlijker dan de roofbergen.", "Mal 1:2": "Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad,", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Rom 1:17": "Want de rechtvaardigheid van God wordt daarin geopenbaard uit geloof tot geloof; zoals geschreven is: Maar de rechtvaardige zal uit het geloof leven.", "Ex 20:12-17": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.", "Luk 9:30": "En zie, twee mannen spraken met Hem; dat waren Mozes en Elia,", "Ps 33:7": "Hij verzamelt de wateren van de zee als op een hoop; Hij legt de diepten in schatkamers.", "Matt 24:36": "Maar die dag en dat uur kent niemand, ook de engelen van de hemelen niet, maar alleen Mijn Vader.", "Ps 71:14": "Doch ik zal voortdurend hopen, en zal al Uw lof nog groter maken.", "Ps 145:1-21": "Een lofzang van David. Aleph. O mijn God, U Koning! Ik zal U verhogen, en Uw Naam loven voor eeuwig en altijd. Beth. Elke dag zal ik U loven, en Uw Naam prijzen voor eeuwig en altijd. Gimel. De HEERE is groot en zeer te prijzen, en Zijn grootheid is ondoorgrondelijk.", "Ps 22:24": "U die de HEERE vreest, prijs Hem; al u nageslacht van Jakob, vereer Hem; en ontzie u voor Hem, al u nageslacht van Israël!", "Deut 5:24": "en u zei: Zie, de HEERE, onze God, heeft ons Zijn heerlijkheid en Zijn grootheid laten zien, en wij hebben Zijn stem gehoord uit het midden van het vuur; vandaag hebben wij gezien dat God met de mens spreekt, en dat hij levend blijft.", "Ps 135:7": "Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort.", "1 Kor 10:26": "want de aarde is van de Heere, en al wat zij bevat.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Gen 46:26": "Al de zielen die met Jakob naar Egypte kwamen, uit zijn heup voortgekomen, behalve de vrouwen van de zonen van Jakob, waren allen zesenzestig zielen.", "Neh 9:5": "En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Sta op, loof de HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love de Naam van Uw heerlijkheid, die verhoogd is boven alle lof en prijs!", "Ps 138:1": "Een psalm van David. Ik zal U loven met mijn hele hart; in de tegenwoordigheid van de goden zal ik U psalmzingen.", "Rom 9:28": "Want Hij voltooit een zaak en snijdt haar af in rechtvaardigheid; want de Heere zal een afgesneden zaak doen op de aarde.", "Jer 32:17": "Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk.", "Matt 26:53": "Of denkt u dat Ik Mijn Vader nu niet kan bidden, en Hij zal Mij meer dan twaalf legioenen engelen ter beschikking stellen?", "Mark 7:7": "Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen;", "Jer 10:2": "Zo zegt de HEERE: Leert de weg van de heidenen niet, en schrikt niet van de tekenen van de hemel, omdat de heidenen daarvan schrikken.", "Ps 147:15-18": "Hij zendt Zijn bevel over de aarde; Zijn woord loopt zeer snel. Hij geeft sneeuw als wol; Hij strooit de rijp als as. Hij werpt Zijn ijs neer als stukken; wie kan standhouden voor Zijn koude?", "Ps 21:14": "Verhoog U, HEERE! In Uw sterkte; zo zullen wij zingen, en Uw macht met psalmen loven.", "Jer 31:35": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:", "Deut 33:26": "Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken.", "Job 26:7-14": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets. Hij bindt het water in Zijn wolken; toch scheurt de wolk daaronder niet. Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "Dan 2:21": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "Ps 113:5": "Wie is gelijk de HEERE, onze God? Die zeer hoog woont.", "Ps 34:9": "Teth. Proeft en ziet dat de HEERE goed is; gelukkig is de man die op Hem vertrouwt.", "1 Tess 2:3-12": "Want onze vermaning is niet voortgekomen uit dwaling, niet uit onreinheid, en niet met bedrog; maar zoals wij door God beproefd zijn, zodat ons het Evangelie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft. Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige!", "Matt 12:17-21": "Opdat vervuld zou worden wat gesproken is door de profeet Jesaja, die zei: Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen. Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen.", "Hos 6:6": "Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "Rom 15:9": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.", "Mal 2:10": "Hebben wij niet allen één Vader? Heeft niet één God ons geschapen? Waarom handelen wij dan trouweloos, de één tegen de ander, door het verbond van onze vaders te ontheiligen?", "Openb 21:23": "En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Ex 8:19": "Toen zeiden de tovenaars tegen Farao: Dit is Gods vinger! Doch Farao's hart verstijfde, zodat hij niet naar hen luisterde, zoals de HEERE gesproken had.", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Matt 22:38": "Dit is het eerste en het grootste gebod.", "Rom 9:33": "zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.", "Job 7:18": "En dat U hem bezoekt elke morgen; dat U hem elk ogenblik beproeft?", "Spr 15:5": "Een dwaas zal de tucht van zijn vader versmaden; maar wie de bestraffing ter harte neemt, zal kloekzinnig handelen.", "2 Kor 3:13": "en doen niet zoals Mozes, die een sluier op zijn gezicht legde, opdat de kinderen van Israël niet strak zouden kijken naar het einde van wat teniet gedaan wordt.", "Gen 5:1": "Dit is het boek van Adams geslacht. Op de dag dat God de mens schiep, maakte Hij hem naar de gelijkenis van God.", "Ps 66:1": "Een lied, een psalm, voor de koorleider. Juicht tot God, heel de aarde!", "Gen 18:10": "En Hij zei: Ik zal zeker bij u terugkomen, omstreeks deze tijd volgend jaar; en zie, Sara, uw vrouw, zal een zoon hebben! En Sara hoorde het aan de deur van de tent, die achter Hem was.", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Jes 29:14": "daarom, zie, Ik zal verder wonderlijk handelen met dit volk, wonderlijk en wonderbaarlijk; want de wijsheid van zijn wijzen zal vergaan, en het verstand van zijn verstandigen zal zich verbergen.", "1 Petr 1:20": "Die al vóór de grondlegging van de wereld voorbestemd was, maar in deze laatste tijden geopenbaard is omwille van u,", "Luk 4:10": "Want er is geschreven dat Hij Zijn engelen bevelen zal geven over U, dat zij U bewaren zullen;", "1 Kron 16:26": "Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemelen gemaakt.", "2 Kor 5:18": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.", "Matt 5:13-16": "U bent het zout der aarde; maar als het zout smakeloos wordt, waarmee zal het gezouten worden? Het deugt nergens meer toe dan om buiten geworpen en door de mensen vertrapt te worden. U bent het licht der wereld; een stad die boven op een berg ligt, kan niet verborgen zijn. Ook steekt men geen kaars aan om die onder een korenmaat te zetten, maar op een kandelaar, en zij schijnt voor allen die in het huis zijn.", "Deut 27:26": "Vervloekt is hij die de woorden van deze wet niet bevestigt door ze te doen! En heel het volk zal zeggen: Amen.", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "Ps 134:2": "Hef uw handen op naar het heiligdom, en loof de HEERE.", "Matt 26:56": "maar dit alles is gebeurd, opdat de Schriften van de profeten vervuld zouden worden. Toen vluchtten alle discipelen en lieten Hem in de steek.", "Ex 32:1-6": "Toen het volk zag dat Mozes lang wegbleef om van de berg af te komen, verzamelde het volk zich bij Aäron, en zij zeiden tegen hem: Sta op, maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft weggeleid, weten wij niet wat er van hem geworden is. Aäron zei tegen hen: Rukt de gouden oorringen af, die in de oren van uw vrouwen, uw zonen en uw dochters zijn, en breng ze bij mij. Toen rukte heel het volk de gouden oorringen af die in hun oren waren, en zij brachten ze bij Aäron.", "Luk 13:35": "Zie, uw huis wordt aan u woest achtergelaten. En voorwaar, Ik zeg u, dat u Mij niet zult zien, totdat de tijd zal zijn gekomen dat u zult zeggen: Gezegend is Hij Die komt in de Naam van de Heere!", "Jes 53:4": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "Ps 118:28": "U bent mijn God, daarom zal ik U loven; o mijn God, ik zal U verhogen.", "Job 26:7": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets.", "Matt 27:10": "en zij hebben die gegeven voor de akker van de pottenbakker, zoals de Heere mij bevolen heeft.", "Ps 103:20-22": "Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord. Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet! Loof de HEERE, al Zijn werken! Aan alle plaatsen van Zijn heerschappij. Loof de HEERE, mijn ziel!", "Jes 1:24": "Daarom spreekt de Heere, HEERE van de heerscharen, de Machtige van Israël: O wee! Ik zal Mij troosten over Mijn tegenstanders. Ik zal Mij wreken op Mijn vijanden.", "Ps 8:5-7": "Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt? En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond? U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;", "Luk 20:43": "totdat Ik Uw vijanden tot een voetbank voor Uw voeten zal gezet hebben.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "Hab 3:3": "God kwam van Theman, en de Heilige van de berg Paran. Sela. Zijn heerlijkheid bedekte de hemelen, en het aardrijk was vol van Zijn lof.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Hoogl 5:16": "Zijn gehemelte is enkel zoetigheid, en al wat aan Hem is, is geheel begeerlijk. Zulk een is mijn Liefste; ja, zulk een is mijn Vriend, dochters van Jeruzalem!", "Rom 11:9": "En David zegt: Hun tafel moet worden tot een strik, en tot een val, en tot een aanstoot, en tot een vergelding voor hen.", "Hebr 5:5": "Zo heeft ook Christus Zichzelf niet verheerlijkt om Hogepriester te worden, maar Hij die tot Hem gesproken heeft: U bent Mijn Zoon, heden heb Ik U gegenereerd.", "Ps 132:17": "Daar zal Ik David een hoorn doen uitspruiten; Ik heb voor Mijn Gezalfde een lamp klaargemaakt.", "Ps 113:4": "De HEERE is hoog boven alle heidenvolken, boven de hemelen is Zijn heerlijkheid.", "Hand 17:23-28": "Want toen ik door de stad liep en uw heiligdommen bekeek, vond ik ook een altaar waarop een opschrift stond: AAN DE ONBEKENDE GOD. Hem dan, Die u niet kent en toch dient, verkondig ik u. De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn; En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft;", "Job 9:14": "Hoeveel te minder zal ik Hem antwoorden, en mijn woorden uitkiezen tegen Hem?", "1 Kor 15:9": "Want ik ben de minste van de apostelen, die niet waardig ben een apostel genoemd te worden, omdat ik de Gemeente van God vervolgd heb.", "Hand 8:26": "En een engel van de Heere sprak tot Filippus en zei: Sta op, en ga na
