svLabel": null}, {"disp": "Spr 12:3", "href": "../../spreuken/12/#v3", "ref": "Spr 12:3", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Usury Or Interest", "href": "../../torrey/u/#t-usury-or-interest", "kinderen": [{"label": "True and faithful Israelites never took, from their brethren", "href": "../../torrey/u/?hl=Ps.15.5#i22394", "refs": [{"disp": "Ps 15:5", "href": "../../psalmen/15/#v5", "ref": "Ps 15:5", "svLabel": null}, {"disp": "Ezech 18:8", "href": "../../ezechiel/18/#v8", "ref": "Ezech 18:8", "svLabel": null}, {"disp": "Ezech 18:9", "href": "../../ezechiel/18/#v9", "ref": "Ezech 18:9", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Rom 14:22": "Hebt u geloof? Houd dat bij uzelf voor God. Zalig is hij die zichzelf niet oordeelt in wat hij voor goed houdt.", "1 Tess 4:3": "Want dit is de wil van God, uw heiliging: dat u zich onthoudt van de hoererij;", "Matt 22:39": "En het tweede, hieraan gelijk, is: U zult uw naaste liefhebben als uzelf.", "Spr 12:23": "Een schrander mens bedekt de wetenschap; maar het hart van de zotten roept dwaasheid uit.", "Spr 4:25-27": "Laat uw ogen recht vooruit zien, en uw oogleden zich recht voor u heen richten. Weeg de gang van uw voet, en laat al uw wegen vast staan. Wijk niet naar rechts of naar links, wend uw voet af van het kwade.", "Jer 51:45": "Ga uit, Mijn volk, uit haar midden, en red ieder zijn ziel, vanwege de gloed van de toorn van de HEERE.", "Matt 5:33": "Wederom hebt u gehoord dat tot de ouden gezegd is: U zult de eed niet breken, maar u zult aan de Heere uw eden houden.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Joh 10:5": "Maar een vreemde zullen zij nooit volgen, maar zij zullen van hem wegvluchten; omdat zij de stem van de vreemden niet kennen.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Fil 3:3": "Want wij zijn de besnijding, wij, die God in de Geest dienen, en in Christus Jezus roemen, en niet vertrouwen op het vlees.", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Spr 17:12": "Beter dat een berin die van haar jongen beroofd is, een man tegemoetkomt, dan een dwaas in zijn dwaasheid.", "Ex 23:7": "Blijf ver van valse zaken; en de onschuldige en rechtvaardige zult u niet doden; want Ik zal de goddeloze niet rechtvaardigen.", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Openb 17:14": "Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "Ps 119:121": "Ain. Ik heb recht en gerechtigheid gedaan; geef mij niet over aan mijn onderdrukkers.", "Mark 14:11": "En zij, die dit hoorden, waren verblijd, en beloofden hem geld te geven; en hij zocht hoe hij Hem op een geschikt moment kon overleveren.", "Ps 121:3-8": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren. Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Openb 13:6": "En het opende zijn mond tot lastering tegen God, om Zijn Naam te lasteren, en Zijn tabernakel, en hen die in de hemel wonen.", "Hebr 4:9": "Er blijft dan een rust over voor het volk van God.", "Joh 10:27": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij.", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "Spr 16:21-24": "Wie wijs van hart is, zal verstandig genoemd worden; en zoetheid van de lippen zal de lering vermeerderen. Het verstand van hen die het bezitten is een bron van leven; maar de tucht van de dwazen is dwaasheid. Het hart van een wijze maakt zijn mond verstandig, en zal op zijn lippen de lering vermeerderen.", "Deut 14:25": "Zo maak het tot geld, en bind het geld in uw hand, en ga naar de plaats die de HEERE, uw God, zal uitkiezen;", "Jes 49:9-12": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn. Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden. En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "Fil 3:7-11": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Spr 11:1": "Een bedrieglijke weegschaal is de HEERE een gruwel; maar een volkomen weegsteen is Zijn welgevallen.", "Ps 7:9": "De HEERE zal de volken recht doen; doe mij recht, HEERE, naar mijn gerechtigheid, en naar mijn oprechtheid, die bij mij is.", "Hos 7:9": "Vreemden verteren zijn kracht, en hij merkt het niet; ook is de grauwheid over hem verspreid, en hij merkt het niet.", "Deut 14:2": "Want u bent een heilig volk voor de HEERE, uw God; en de HEERE heeft u uitgekozen om Hem tot een volk van het eigendom te zijn, uit alle volken die op de aardbodem zijn.", "1 Tim 5:22": "Leg niemand haastig de handen op, en heb geen gemeenschap met de zonden van anderen; bewaar uzelf rein.", "Hand 10:35": "maar in ieder volk is hij die Hem vreest en gerechtigheid doet, Hem aangenaam.", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "Ezech 18:8": "Niet uitleent op woeker, noch overwinst neemt, zijn hand van onrecht afkeert, waarachtig recht tussen de een en de ander toepast;", "Matt 5:29": "Als dan uw rechteroog u ergert, ruk het uit en werp het van u; want het is beter voor u dat een van uw lichaamsdelen verloren gaat, en niet uw hele lichaam in de hel geworpen wordt.", "Jer 17:7": "Gezegend daarentegen is de man die op de HEERE vertrouwt, en wiens vertrouwen de HEERE is!", "Lev 25:35-37": "En als uw broeder verarmd zal zijn, en zijn hand bij u wankelt, dan zult u hem vasthouden, ook al is hij een vreemdeling en bijwoner, opdat hij bij u leeft. U zult geen rente noch overwinst van hem nemen; maar u zult vrezen voor uw God, opdat uw broeder bij u leeft. Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.", "Ezech 18:5-9": "Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet; Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert; En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;", "Ps 85:10": "Zeker, Zijn heil is nabij hen die Hem vrezen, opdat in ons land eer woont.", "Matt 24:12": "En omdat de ongerechtigheid zal toenemen, zal de liefde van velen verkillen.", "Jes 62:12": "En zij zullen hen noemen het heilige volk, de verlosten van de HEERE; en u zult genoemd worden de gezochte, de stad, die niet verlaten is.", "Ps 77:13": "En ik zal al Uw werken overdenken, en van Uw daden spreken.", "Mark 12:31": "En het tweede, hieraan gelijk, is dit: U zult uw naaste liefhebben als uzelf. Er is geen ander gebod groter dan deze.", "2 Petr 1:2-8": "Genade en vrede worden u vermeerderd door de kennis van God, en van Jezus, onze Heere; Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd; Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Hebr 10:34-36": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen. Werp dan uw vrijmoedigheid niet weg, die een grote beloning van loon heeft. Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Ps 7:4": "HEERE, mijn God, als ik dat gedaan heb, als er onrecht in mijn handen is;", "Jes 33:24": "En geen inwoner zal zeggen: Ik ben ziek, want het volk, dat daarin woont, zal vergeving van ongerechtigheid ontvangen.", "2 Tim 2:17": "En hun woord zal voortvreten als de kanker; onder wie zijn Hymeneüs en Filetus;", "Luk 20:35": "maar wie waardig geacht worden om die andere wereld te verwerven en de opstanding uit de doden, zullen niet trouwen, en ook niet ten huwelijk uitgegeven worden;", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Jes 32:5": "De dwaas zal niet meer milddadig genoemd worden, en de gierige zal niet meer mild geheten worden.", "Jes 61:9-11": "En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft. Ik verheug mij zeer in de HEERE, mijn ziel verblijdt zich in mijn God, want Hij heeft mij bekleed met de klederen van het heil, de mantel van de gerechtigheid heeft Hij mij omgedaan; zoals een bruidegom zich met priesterlijk sieraad versiert, en zoals een bruid zich versiert met haar sieraden. Want zoals de aarde haar spruit voortbrengt, en zoals een tuin datgene wat erin gezaaid is, laat uitspruiten, zo zal de Heere HEERE gerechtigheid en lof laten uitspruiten voor alle volken.", "2 Kor 4:14": "Wetend dat Hij, Die de Heere Jezus opgewekt heeft, ook ons door Jezus zal opwekken, en met u daar zal stellen.", "1 Joh 3:17-24": "Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem? Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid. En hieraan weten wij dat wij uit de waarheid zijn, en wij zullen ons hart verzekeren voor Hem.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Jer 31:12-14": "Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn. Dan zal de jonkvrouw zich verblijden in de rei, en ook de jongelingen en de ouderen samen; want Ik zal hun rouw in vrolijkheid veranderen, en zal hen troosten, en zal hen verblijden na hun droefenis. En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "Matt 25:18": "Maar hij die het ene ontvangen had, ging weg en groef in de aarde, en verborg het geld van zijn heer.", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Fil 4:7": "En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.", "Spr 15:21": "De dwaasheid is voor de verstandeloze een blijdschap; maar een man van verstand gaat recht zijn weg.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "Mark 3:35": "Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Matt 28:12": "En zij kwamen samen met de oudsten, en namen samen een besluit, en gaven de soldaten veel geld,", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "Rom 5:9-11": "Veelmeer dan zullen wij, nu gerechtvaardigd door Zijn bloed, door Hem behouden worden van de toorn. Want als wij, toen wij nog vijanden waren, met God verzoend zijn door de dood van Zijn Zoon, zullen wij des te meer, nu wij verzoend zijn, behouden worden door Zijn leven. En niet alleen dit, maar wij roemen ook in God, door onze Heere Jezus Christus, door Wie wij nu de verzoening gekregen hebben.", "1 Joh 3:9": "Ieder die uit God geboren is, doet de zonde niet, want Zijn zaad blijft in hem; en hij kan niet zondigen, want hij is uit God geboren.", "Rom 8:14-18": "Want zovelen als er door de Geest van God geleid worden, die zijn kinderen van God. Want u hebt niet de geest van slavernij ontvangen, om opnieuw te vrezen, maar u hebt de Geest van aanneming tot kinderen ontvangen, door Wie wij roepen: Abba, Vader! Diezelfde Geest getuigt met onze geest, dat wij kinderen van God zijn.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Deut 6:13": "U zult de HEERE, uw God, vrezen, en Hem dienen; en u zult bij Zijn Naam zweren.", "Pred 9:17": "De woorden van de wijzen moeten in stilte aangehoord worden, meer dan het geroep van hem die over de dwazen heerst.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Ezech 18:19": "Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven.", "Job 10:7": "Het is Uw wetenschap, dat ik niet goddeloos ben; nochtans is er niemand, die uit Uw hand verlost.", "Mark 11:24": "Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Ps 119:115": "Wijkt van mij, u boosdoeners! dat ik de geboden van mijn God moge bewaren.", "2 Sam 21:2": "Toen riep de koning de Gibeonieten, en zei tegen hen: (De Gibeonieten nu waren niet van de kinderen van Israël, maar van het overblijfsel van de Amorieten; en de kinderen van Israël hadden hun gezworen, maar Saul zocht hen te doden in zijn ijver voor de kinderen van Israël en Juda.)", "1 Kor 10:21": "U kunt niet de drinkbeker van de Heere drinken én de drinkbeker van de duivelen; u kunt niet deelhebben aan de tafel van de Heere én aan de tafel van de duivelen.", "Rom 8:9": "Maar u bent niet in het vlees, maar in de Geest, als tenminste de Geest van God in u woont. Maar als iemand de Geest van Christus niet heeft, die komt Hem niet toe.", "Spr 13:2": "Ieder zal van de vrucht van de mond het goede eten; maar de ziel van de trouwelozen het geweld.", "2 Kon 22:9": "Daarna kwam Safan, de schrijver, bij de koning, en bracht de koning verslag terug, en hij zei: Uw dienaren hebben het geld dat in het huis gevonden was bij elkaar gebracht, en hebben het gegeven in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE.", "Luk 6:45": "De goede mens brengt het goede voort uit de goede schat van zijn hart; en de slechte mens brengt het kwade voort uit de kwade schat van zijn hart; want uit de overvloed van het hart spreekt zijn mond.", "Zach 14:20": "Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "Rom 15:2": "Laat dan ieder van ons zijn naaste behagen ten goede, tot opbouw.", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "2 Kor 5:11": "Wij dan, die de schrik van de Heere kennen, bewegen de mensen tot het geloof, en wij zijn openbaar geworden voor God; en ik hoop dat wij ook in uw gewetens geopenbaard zijn geworden.", "Spr 28:19": "Wie zijn land bouwt, zal met brood verzadigd worden; maar wie nietige mensen volgt, zal met armoede verzadigd worden.", "Job 5:24": "En u zult bevinden dat uw tent in vrede is; en u zult uw woning verzorgen, en zult niet feilen.", "1 Petr 4:6": "Want daarom is ook aan de doden het Evangelie verkondigd, opdat zij weliswaar naar de mens in het vlees geoordeeld zouden worden, maar naar God zouden leven in de geest.", "Lev 19:36": "U zult een eerlijke weegschaal hebben, eerlijke gewichten, een eerlijke efa, en een eerlijke hin; Ik ben de HEERE, uw God, Die u uit Egypteland uitgevoerd heb!", "2 Kor 7:2": "Geef ons plaats; wij hebben niemand onrecht aangedaan, wij hebben niemand verdorven, wij hebben bij niemand ons voordeel gezocht.", "Spr 25:15": "Een leider wordt door geduld overreed; en een zachte tong breekt het gebeente.", "Spr 12:14": "Ieder wordt van de vrucht van de mond met goed verzadigd; en de vergelding van de handen van de mens zal Hij hem terugbrengen.", "1 Petr 3:11": "hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "1 Tim 5:13": "En meteen leren zij ook nietsdoend rondgaan bij de huizen; en zijn niet alleen nietsdoend, maar ook praatziek, en bezig met wat hen niet aangaat, terwijl zij spreken wat niet betaamt.", "Gal 6:15": "Want in Christus Jezus heeft noch besnijdenis enige kracht, noch onbesneden zijn, maar een nieuw schepsel.", "Ps 73:2-22": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Zach 3:2": "Doch de HEERE zei tegen de satan: De HEERE bestraft u, satan! Ja, de HEERE bestraft u, Die Jeruzalem verkiest; is deze niet een vuurbrand uit het vuur gered?", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Joh 3:15-18": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want God heeft Zijn Zoon niet in de wereld gezonden opdat Hij de wereld zou veroordelen, maar opdat de wereld door Hem behouden zou worden.", "Mark 8:35": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen, omwille van Mij, en omwille van het Evangelie, die zal het behouden.", "Job 32:22": "Want ik weet geen bijnamen te gebruiken; anders zou mijn Maker mij binnenkort wegnemen.", "1 Joh 4:4-21": "Kinderen, u bent uit God, en hebt hen overwonnen; want Hij die in u is, is meer dan hij die in de wereld is. Zij zijn uit de wereld; daarom spreken zij uit de wereld, en de wereld hoort hen. Wij zijn uit God. Die God kent, hoort ons; die niet uit God is, hoort ons niet. Hieraan herkennen wij de geest van de waarheid en de geest van de dwaling.", "1 Joh 2:29": "Als u weet, dat Hij rechtvaardig is, dan weet u, dat ieder, die de rechtvaardigheid doet, uit Hem geboren is.", "Luk 22:5": "En zij waren blij, en zijn het eens geworden dat zij hem geld zouden geven.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Openb 16:15": "Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.", "Ex 23:32": "U zult met hen, noch met hun goden, een verbond sluiten.", "2 Kron 34:9": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.", "Joh 15:4": "Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Ps 101:4": "Het verkeerde hart zal van mij wijken; de boze zal ik niet kennen.", "Joh 10:4": "En wanneer hij zijn eigen schapen naar buiten gedreven heeft, gaat hij voor hen uit; en de schapen volgen hem, omdat zij zijn stem kennen.", "Hebr 12:1": "Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is;", "Matt 14:9": "En de koning werd bedroefd; maar vanwege de eden, en degenen die met hem aanzaten, gebood hij dat het haar gegeven zou worden;", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Spr 10:9": "Wie in oprechtheid wandelt, wandelt zeker; maar wie zijn wegen verdraait, zal bekend worden.", "Rom 2:7": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Ex 23:1-33": "U zult geen vals gerucht verspreiden; en u zult uw hand niet bij de goddeloze leggen, om een getuige te zijn tot geweld. U zult de menigte niet volgen tot boze zaken; en u zult niet spreken in een geschil om u naar de menigte te neigen, om het recht te buigen. Ook zult u de arme niet voortrekken in zijn geschil.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "2 Kor 11:2": "Want ik ben ijverig over u met een ijver van God; want ik heb u toebereid om u als een reine maagd aan één man voor te stellen, namelijk aan Christus.", "Hand 2:38": "En Petrus zei tegen hen: Bekeer u, en ieder van u moet gedoopt worden in de Naam van Jezus Christus, tot vergeving van de zonden; en u zult de gave van de Heilige Geest ontvangen.", "Neh 5:2-5": "Want er waren er die zeiden: Onze zonen en onze dochters, wij zijn met velen; daarom hebben wij koren opgenomen, opdat wij eten en leven. Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen. Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.", "Jer 51:6": "Vlucht uit het midden van Babel, en red ieder zijn ziel; word niet uitgeroeid in haar ongerechtigheid; want dit is de tijd van de wraak van de HEERE, Die haar de verdienste betaalt.", "Spr 3:26": "Want de HEERE zal uw vertrouwen zijn, en Hij zal uw voet bewaren voor gevangenschap.", "Jak 1:12": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben.", "Ps 34:16": "Ain. De ogen van de HEERE zijn op de rechtvaardigen, en Zijn oren gericht op hun geroep.", "Luk 1:74": "dat wij, verlost uit de hand van onze vijanden, Hem zonder vrees zouden dienen,", "Hos 4:15": "Als u, Israël! wilt hoereren, laat Juda dan zeker niet schuldig worden; kom toch niet naar Gilgal, en ga niet op naar Beth-Aven, en zweer niet: Zo waarachtig als de Heere leeft.", "Ps 140:14": "Zeker, de rechtvaardigen zullen Uw Naam loven; de oprechten zullen voor Uw aangezicht blijven.", "1 Joh 3:9-11": "Ieder die uit God geboren is, doet de zonde niet, want Zijn zaad blijft in hem; en hij kan niet zondigen, want hij is uit God geboren. Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft, want dit is de verkondiging die u vanaf het begin gehoord hebt, dat wij elkaar zouden liefhebben.", "Joh 15:19": "Als u van de wereld was, zou de wereld het hare liefhebben; maar omdat u van de wereld niet bent, maar Ik u uit de wereld heb uitverkoren, daarom haat de wereld u.", "Joh 8:51": "Voorwaar, voorwaar, Ik zeg u: Als iemand Mijn woord bewaart, zal hij de dood in eeuwigheid niet zien.", "1 Kor 2:13": "Die dingen spreken wij ook, niet met woorden die de menselijke wijsheid leert, maar met woorden die de Heilige Geest leert, terwijl wij geestelijke dingen met geestelijke vergelijken.", "1 Joh 5:18": "Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.", "Deut 16:20": "Gerechtigheid, gerechtigheid zult u najagen; opdat u leeft, en het land erfelijk bezit dat de HEERE, uw God, u geven zal.", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Ps 37:26": "De hele dag ontfermt hij zich, en leent; en zijn nageslacht is tot zegen.", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "Jak 3:2": "Want wij struikelen allen in veel dingen. Als iemand in woorden niet struikelt, die is een volmaakt man, in staat om ook het hele lichaam in toom te houden.", "Joh 17:22": "En Ik heb hun de heerlijkheid gegeven die U Mij gegeven hebt; opdat zij één zijn, zoals Wij Eén zijn;", "1 Kor 1:2": "Aan de Gemeente van God, die te Korinthe is, de geheiligden in Christus Jezus, de geroepen heiligen, met allen die de Naam van onze Heere Jezus Christus aanroepen in elke plaats, zowel hun als onze Heere;", "Ps 15:1-5": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid? Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "1 Kor 6:9-11": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven? Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven. En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "Lev 25:51": "Als er nog veel van die jaren zijn, zal hij naar verhouding daarvan tot zijn lossing van het geld waarvoor hij gekocht is, teruggeven.", "1 Tess 5:27": "Ik bezweer u bij de Heere, dat deze brief aan alle heilige broeders voorgelezen wordt.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Spr 11:5": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid.", "Spr 12:16-20": "De toorn van de dwaas wordt op diezelfde dag bekend; maar wie schrander is, bedekt de schande. Wie waarheid voortbrengt, maakt gerechtigheid bekend; maar een getuige van leugens maakt bedrog bekend. Er is een die woorden als steken van een zwaard onbedacht uitspreekt; maar de tong van de wijzen is medicijn.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Spr 12:22": "Valse lippen zijn de HEERE een gruwel; maar wie trouw handelen, zijn Zijn welgevallen.", "Spr 17:7": "Een voortreffelijke lip past een dwaas niet, veel minder een vorst een leugenachtige lip.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Rom 8:1": "Er is dan nu geen veroordeling voor hen die in Christus Jezus zijn, die niet naar het vlees wandelen, maar naar de Geest.", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "1 Petr 2:12": "En houd uw levenswandel eerlijk onder de heidenen; opdat, waar zij nu kwaad van u spreken als van kwaaddoeners, zij door de goede werken die zij van u zien, God mogen verheerlijken op de dag dat Hij naar hen omziet.", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "Openb 7:3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "Spr 12:11": "Wie zijn land bewerkt, zal met brood verzadigd worden; maar wie nutteloze mensen volgt, is verstandeloos.", "Ex 23:33": "Zij zullen in uw land niet wonen, opdat zij u niet tegen Mij laten zondigen; als u hun goden dient, zal het u zeker tot een valstrik zijn.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ef 4:22-32": "Namelijk dat u zou afleggen, wat betreft de vorige levenswandel, de oude mens, die verdorven wordt door de begeerten van de verleiding; En dat u vernieuwd zou worden in de geest van uw gemoed, En de nieuwe mens zou aandoen, die naar God geschapen is in ware rechtvaardigheid en heiligheid.", "1 Kor 15:34": "Word op de juiste manier wakker, en zondig niet. Want sommigen hebben geen kennis van God. Ik zeg dit tot uw schaamte.", "Ezech 18:9": "In Mijn inzettingen wandelt, en Mijn rechten onderhoudt, om trouw te handelen; die rechtvaardige zal zeker leven, spreekt de Heere HEERE.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Luk 9:3": "En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Spr 4:14": "Kom niet op het pad van de goddelozen, en betreed niet de weg van de bozen.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "Openb 22:7": "Zie, Ik kom haastig; zalig is hij die de woorden van de profetie van dit boek bewaart.", "Spr 4:18": "Maar het pad van de rechtvaardigen is als een schijnend licht, dat voortgaat en meer licht geeft tot de volle dag toe.", "Matt 5:20": "Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan.", "Spr 16:29": "Een man van geweld verlokt zijn naaste, en hij leidt hem op een weg die niet goed is.", "Ef 3:17-19": "opdat Christus door het geloof in uw harten woont, en u in de liefde geworteld en gegrond bent; opdat u ten volle in staat bent te begrijpen, met al de heiligen, wat de breedte, en lengte, en diepte, en hoogte is, en de liefde van Christus kent, die de kennis te boven gaat, opdat u vervuld wordt tot al de volheid van God.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Ex 22:31": "U moet Mij heilige mensen zijn; daarom mag u geen vlees eten dat door wilde dieren op het veld verscheurd is, u moet het aan de honden voorwerpen.", "Dan 12:7": "En ik hoorde die Man, gekleed in linnen, Die boven op het water van de rivier was, en Hij hief Zijn rechterhand en Zijn linkerhand op naar de hemel, en zwoer bij Hem Die eeuwig leeft, dat het na een bestemde tijd, bestemde tijden, en een helft zal zijn, en wanneer Hij voleindigd zal hebben het uiteenslaan van de macht van het heilige volk, al deze dingen voleindigd zullen worden.", "Ex 30:16": "U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.", "Gal 5:14": "Want de hele wet wordt in één woord vervuld, namelijk in dit: U zult uw naaste liefhebben als uzelf.", "Jer 5:2": "En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals.", "Ef 4:29": "Laat geen vuile taal uit uw mond komen, maar als er iets goeds is tot nuttige opbouw, opdat het genade geeft aan hen die het horen.", "Spr 12:5": "De gedachten van de rechtvaardigen zijn recht; de raadslagen van de goddelozen zijn bedrog.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "1 Petr 1:2-5": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd. Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden. Tot een onvergankelijke, onbevlekte en onverwelkbare erfenis, die in de hemelen bewaard is voor u.", "1 Petr 2:11": "Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel;", "Jer 12:16": "En het zal gebeuren, als zij de wegen van Mijn volk vlijtig zullen leren, zwerend bij Mijn Naam: Zo waarachtig als de HEERE leeft! – zoals zij Mijn volk geleerd hebben te zweren bij Baäl – dan zullen zij te midden van Mijn volk gebouwd worden.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Deut 23:19": "U zult uw broeder geen rente laten betalen, rente van geld, rente van voedsel, rente van enig ding waarover men rente vraagt.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Hagg 2:5": "Toch nu, wees sterk, Zerubbabel! spreekt de HEERE; en wees sterk, Josua, zoon van Jozadak, hogepriester! en wees sterk, al u volk van het land! spreekt de HEERE; en werk, want Ik ben met u, spreekt de HEERE van de heerscharen;", "Matt 5:48": "Wees dan volmaakt, zoals uw Vader, Die in de hemelen is, volmaakt is.", "Hand 11:23": "Toen hij daar aangekomen was en de genade van God zag, werd hij blij, en vermaande hen allen dat zij met een vast voornemen van het hart bij de Heere zouden blijven.", "1 Tim 6:6": "Maar de godsvrucht is, samen met tevredenheid, een grote winst.", "Mark 10:14": "Maar Jezus zag dit, en nam het Hem zeer kwalijk, en zei tegen hen: Laat de kinderen bij Mij komen, en verhinder ze niet; want voor zulke is het Koninkrijk van God.", "Neh 5:1-13": "Maar het geroep van het volk en van hun vrouwen was groot, tegen hun broeders, de Joden. Want er waren er die zeiden: Onze zonen en onze dochters, wij zijn met velen; daarom hebben wij koren opgenomen, opdat wij eten en leven. Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen.", "Spr 10:2": "Schatten van goddeloosheid geven geen voordeel; maar gerechtigheid redt van de dood.", "Spr 21:21": "Wie rechtvaardigheid en weldadigheid najaagt, zal het leven, rechtvaardigheid en eer vinden.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Jes 56:2-8": "Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen. En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom. Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond;", "Luk 18:29": "En Hij zei tegen hen: Voorwaar, Ik zeg u, er is niemand die huis, of ouders, of broers, of vrouw, of kinderen heeft verlaten om het Koninkrijk van God,", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Ps 26:4": "Ik zit niet bij nietswaardige mensen, en met huichelaars ga ik niet om.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Joh 3:21": "Maar wie de waarheid doet, komt tot het licht, opdat van zijn werken openbaar wordt dat zij in God gedaan zijn.", "Spr 11:13": "Wie als een achterklapper rondgaat, openbaart het geheime; maar wie trouw is van geest, bedekt de zaak.", "Ps 87:1-3": "Een psalm, een lied voor de kinderen van Korach. Zijn grondslag is op de bergen van heiligheid. De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob. Zeer heerlijke dingen worden van u gesproken, o stad van God! Sela.", "Kol 4:6": "Laat uw woord altijd aangenaam zijn, met zout besprengd, opdat u weet hoe u ieder moet antwoorden.", "Jes 60:21": "En uw volk zullen allen samen rechtvaardig zijn, zij zullen voor eeuwig de aarde erfelijk bezitten; zij zullen zijn een scheut van Mijn planting, een werk van Mijn handen, opdat Ik verheerlijkt word.", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "2 Kon 12:7-16": "Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Spr 9:6": "Verlaat de dwaasheden, en leef; en treed in de weg van het verstand.", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "1 Tess 1:3": "Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader;", "Job 8:4-7": "Als uw kinderen tegen Hem gezondigd hebben, dan heeft Hij hen ook overgegeven aan de macht van hun overtreding. Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt; als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "Job 36:7-12": "Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven. En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben;", "1 Petr 4:1": "Omdat Christus dan voor ons in het vlees geleden heeft, wapent u zich ook met dezelfde gedachte, namelijk dat wie in het vlees geleden heeft, opgehouden heeft met de zonde;", "Lev 20:7": "Daarom heilig u, en wees heilig; want Ik ben de HEERE, uw God!", "Matt 5:8": "Zalig zijn de reinen van hart, want zij zullen God zien.", "1 Kor 6:20": "Want u bent duur gekocht: verheerlijk dan God in uw lichaam en in uw geest, die van God zijn.", "Joz 7:13": "Sta op, heilig het volk, en zeg: Heilig uzelf tegen morgen; want zo zegt de HEERE, de God van Israël: Er is een ban in uw midden, Israël! U zult niet kunnen standhouden voor het aangezicht van uw vijanden, totdat u de ban uit uw midden wegdoet.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "Joh 14:1-3": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij. In het huis van Mijn Vader zijn veel woningen; anders zou Ik het u gezegd hebben. Ik ga heen om u plaats te bereiden. En wanneer Ik heen zal zijn gegaan en u plaats zal hebben bereid, kom Ik terug en zal u tot Mij nemen, opdat u ook mag zijn waar Ik ben.", "Ps 101:7": "Wie bedrog pleegt, zal binnen mijn huis niet blijven; die leugens spreekt, zal voor mijn ogen niet bevestigd worden.", "Lev 19:16-18": "U zult niet rondgaan als een kwaadspreker onder uw volken; u zult niet opstaan tegen het bloed van uw naaste; Ik ben de HEERE! U zult uw broeder in uw hart niet haten; u zult uw naaste zeker berispen, en zult de zonde in hem niet laten voortbestaan. U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "Spr 25:3": "Aan de hoogte van de hemel, en aan de diepte van de aarde, en aan het hart van koningen is geen doorgronding.", "1 Tess 3:12": "En moge de Heere u doen toenemen en overvloedig maken in de liefde tot elkaar en tot allen, zoals wij ook zijn tot u,", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "Spr 7:20": "Hij heeft een bundel van het geld in zijn hand genomen; op de vastgestelde dag zal hij naar zijn huis komen.", "Gal 2:14": "Maar toen ik zag dat zij niet oprecht wandelden naar de waarheid van het Evangelie, zei ik tegen Petrus, in aanwezigheid van allen: Als u, die een Jood bent, leeft naar heidense wijze en niet naar Joodse wijze, waarom dwingt u dan de heidenen naar de Joodse wijze te leven?", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "1 Kor 15:33": "Dwaal niet. Slechte omgang bederft goede zeden.", "1 Kor 6:3": "Weet u niet, dat wij de engelen zullen oordelen? Hoeveel te meer de zaken die dit leven aangaan?", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "Job 22:21-30": "Gewen u toch aan Hem, en heb vrede; daardoor zal het goede u overkomen. Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart. Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ps 125:1-3": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid. Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid. Want de scepter van de goddeloosheid zal niet rusten op het lot van de rechtvaardigen; opdat de rechtvaardigen hun handen niet uitstrekken tot onrecht.", "Job 31:39": "Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen;", "Ps 97:11": "Het licht is gezaaid voor de rechtvaardige, en vrolijkheid voor de oprechten van hart.", "2 Petr 3:11": "Omdat al deze dingen dan zullen vergaan, wat voor mensen moet u dan wel zijn, in een heilige levenswandel en in godsvrucht!", "Deut 4:7": "Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "Micha 6:16": "Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Ps 101:6": "Mijn ogen zullen zijn op de getrouwen in het land, dat zij bij mij zitten; die op de oprechte weg wandelt, die zal mij dienen.", "Pred 3:7": "Een tijd om te scheuren, en een tijd om toe te naaien; een tijd om te zwijgen, en een tijd om te spreken;", "Lev 19:16": "U zult niet rondgaan als een kwaadspreker onder uw volken; u zult niet opstaan tegen het bloed van uw naaste; Ik ben de HEERE!", "Richt 17:4": "Maar hij gaf dat geld aan zijn moeder terug. En zijn moeder nam tweehonderd zilverlingen, en gaf ze aan de goudsmid, die maakte daarvan een gesneden beeld en een gegoten beeld; dat was in het huis van Micha.", "Rom 2:10": "Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.", "Ezech 18:27": "Maar als de goddeloze zich bekeert van zijn goddeloosheid, die hij gedaan heeft, en recht en gerechtigheid doet, die zal zijn ziel in het leven behouden;", "1 Petr 4:13": "maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen.", "Est 3:2": "En alle knechten van de koning die in de poort van de koning waren, knielden en bogen zich neer voor Haman; want de koning had zo over hem bevolen; maar Mordechai knielde niet, en boog zich niet neer.", "Job 36:21": "Wacht u, keer u niet tot ongerechtigheid; want dat hebt u boven de ellende verkozen.", "Jes 56:2": "Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen.", "Ps 41:2": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "1 Petr 3:16": "en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.", "Jak 5:12": "Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.", "Rom 12:17": "Vergeld niemand kwaad voor kwaad. Zorg voor wat eerlijk is voor alle mensen.", "Matt 12:33": "Of maak de boom goed en zijn vrucht goed; of maak de boom slecht en zijn vrucht slecht; want aan de vrucht wordt de boom gekend.", "Rom 9:1": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest),", "Matt 13:43": "Dan zullen de rechtvaardigen stralen als de zon, in het Koninkrijk van hun Vader. Wie oren heeft om te horen, laat hij horen.", "Spr 14:3": "In de mond van de dwaas is een roede van het hoogmoed; maar de lippen van de wijzen bewaren hen.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "1 Petr 3:9-12": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven. Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Jes 28:17": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.", "Openb 18:4": "En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.", "Rom 11:16": "En als de eerstelingen heilig zijn, dan is ook het deeg heilig, en als de wortel heilig is, dan zijn ook de takken heilig.", "Ef 5:3": "Maar hoererij en alle onreinheid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt,", "Ps 120:5-7": "O, wee mij, dat ik een vreemdeling ben in Mesech, dat ik in de tenten van Kedar woont. Mijn ziel heeft lang gewoond bij hen die de vrede haten. Ik ben vreedzaam; maar als ik spreek, zijn zij uit op oorlog.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Job 31:1-40": "Ik heb een verbond gemaakt met mijn ogen; hoe zou ik dan acht gegeven hebben op een maagd? Want wat is het deel van God van boven, of de erve van de Almachtige uit de hoogten? Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "2 Kor 6:14-17": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis? En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige? Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Hebr 13:3": "Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "Ps 24:4": "Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert;", "2 Kron 24:11": "Het gebeurde nu ter tijd, als hij de kist, naar het bevel van de koning, door de hand van de Levieten inbracht, en als zij zagen dat er veel van het geld was, dat de schrijver van de koning kwam, en de gestelde van de hoofdpriester, en de kist leegmaakten, en die opnamen, en die terugbrachten naar haar plaats; zo deden zij van dag tot dag, en verzamelden geld in overvloed;", "Deut 6:25": "En het zal ons gerechtigheid zijn, als wij ernaar streven al deze geboden te doen, voor het aangezicht van de HEERE, onze God, zoals Hij ons geboden heeft.", "Jer 15:10": "Wee mij, mijn moeder, dat u mij gebaard hebt, een man van twist, en een man van ruzie voor het hele land! Ik heb hun niet op rente gegeven, ook hebben zij mij niet op rente gegeven, toch vervloekt mij ieder van hen.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "2 Tess 3:6": "En wij bevelen u, broeders, in de Naam van onze Heere Jezus Christus, dat u zich onttrekt van iedere broeder die ongeregeld wandelt, en niet naar de overlevering die hij van ons ontvangen heeft.", "Joh 8:39": "Zij antwoordden en zeiden tegen Hem: Abraham is onze vader. Jezus zei tegen hen: Als u Abrahams kinderen was, zou u de werken van Abraham doen.", "Ps 101:3": "Ik zal geen slechte zaak voor mijn ogen stellen; ik haat het doen van de afvalligen, het zal mij niet aankleven.", "Hand 8:37": "En Filippus zei: Als u van ganser harte gelooft, is het geoorloofd. En hij antwoordde en zei: Ik geloof dat Jezus Christus de Zoon van God is.", "Ps 73:1": "Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn.", "Spr 3:25": "Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt.", "Spr 31:26": "Pe. Zij doet haar mond open met wijsheid; en op haar tong is onderwijs van goedheid.", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "Ps 28:8": "De HEERE is hun Sterkte, en Hij is de Sterkheid van de verlossingen van Zijn Gezalfde.", "Openb 22:4": "En zij zullen Zijn aangezicht zien, en Zijn Naam zal op hun voorhoofden zijn.", "Deut 30:10": "wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, door Zijn geboden en Zijn inzettingen te houden, die in dit boek van de wet geschreven zijn; wanneer u zich zult bekeren tot de HEERE, uw God, met uw ganse hart en met uw ganse ziel.", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "Joz 9:19": "Toen zeiden alle leiders tegen de hele vergadering: Wij hebben hun gezworen bij de HEERE, de God van Israël; daarom kunnen wij hen niet aanraken.", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "Ps 119:1-3": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan. Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken; Ook geen onrecht werken, maar wandelen in Zijn wegen.", "Ps 37:30": "Pe. De mond van de rechtvaardige spreekt wijsheid, en zijn tong spreekt het recht.", "Spr 22:1": "Een goede naam is verkieslijker dan grote rijkdom, goede gunst dan zilver en dan goud.", "Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "Spr 2:21": "Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;", "Spr 2:19": "Allen die tot haar ingaan, zullen niet terugkomen, en zullen de paden van het leven niet bereiken;", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "Ps 139:22": "Ik haat hen met volkomen haat, tot vijanden zijn zij mij.", "Kol 3:9-17": "Lieg niet tegen elkaar, omdat u de oude mens met zijn werken hebt uitgedaan, en de nieuwe mens hebt aangedaan, die vernieuwd wordt tot kennis, naar het evenbeeld van Hem die hem geschapen heeft; waarin niet is Griek en Jood, besnijdenis en voorhuid, barbaar en Scyth, dienstknecht en vrije; maar Christus is alles en in allen.", "Ex 21:11": "En als hij haar deze drie dingen niet doet, zal zij om niet uitgaan, zonder geld.", "Ezech 18:20": "De ziel die zondigt, die zal sterven; de zoon zal niet dragen de ongerechtigheid van de vader, en de vader zal niet dragen de ongerechtigheid van de zoon; de gerechtigheid van de rechtvaardige zal op hem zijn, en de goddeloosheid van de goddeloze zal op hem zijn.", "Ps 5:13": "Want U, HEERE, zult de rechtvaardige zegenen; U zult hem met goedgunstigheid kronen, als met een schild.", "Ezra 9:14": "zullen wij dan weer teruggaan om Uw geboden te vernietigen, en ons te verzwageren met de volken van deze gruwelen? Zou U dan niet tegen ons toornen tot verterens toe, zodat er geen overblijfsel noch ontkoming zou zijn?", "Lev 27:15": "En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "2 Tim 4:6-8": "Want ik word al als een drankoffer geofferd, en de tijd van mijn heengaan is nabij. Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden; Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Rom 16:19": "Want uw gehoorzaamheid is bij allen bekend geworden. Ik verblijd mij dan over u; en ik wil dat u wijs bent in het goede, maar onbedorven in het kwade.", "Ps 85:14": "De gerechtigheid zal voor Zijn aangezicht heengaan, en Hij zal ze zetten op de weg van Zijn voetstappen.", "Ps 34:14": "Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "1 Kor 6:13": "De spijzen zijn voor de buik, en de buik is voor de spijzen; maar God zal beide dit en dat tenietdoen. Maar het lichaam is niet voor de hoererij, maar voor de Heere, en de Heere voor het lichaam.", "2 Kor 10:3": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Ef 5:8": "Want u was eertijds duisternis, maar nu bent u licht in de Heere; wandel als kinderen van het licht.", "1 Tim 5:9": "Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Matt 7:8": "Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden.", "1 Joh 3:18": "Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid.", "Amos 5:13": "Daarom zal de verstandige in die tijd zwijgen, want het zal een slechte tijd zijn.", "1 Kon 3:6": "En Salomo zei: U hebt aan Uw knecht David, mijn vader, grote goedertierenheid bewezen, zoals hij voor Uw aangezicht gewandeld heeft, in waarheid en in gerechtigheid en in oprechtheid van hart met U; en U hebt hem deze grote goedertierenheid bewaard, dat U hem een zoon gegeven hebt, die op zijn troon zit, zoals op deze dag.", "Ps 106:34": "Zij hebben die volken niet verdelgd, die de HEERE hun gezegd had;", "Spr 13:3": "Die zijn mond bewaart, behoudt zijn ziel; maar voor hem is verstoring, die zijn lippen wijd opendoet.", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "Lev 11:47": "Om onderscheid te maken tussen het onreine en het reine, en tussen het gedierte dat men mag eten en het gedierte dat men niet eten mag.", "Spr 17:9": "Die de overtreding toedekt, zoekt liefde; maar die de zaak weer ophaalt, brengt scheiding tussen de beste vrienden.", "1 Tess 5:4": "Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen.", "Jer 22:13": "Wee hem die zijn huis bouwt met ongerechtigheid, en zijn bovenzalen met onrecht; die de dienst van zijn naaste voor niets gebruikt, en hem zijn arbeidsloon niet geeft!", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "Hos 6:3": "Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "2 Petr 2:7": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft;", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "Zach 8:17": "En denk niet, de een over de ander, kwaad in uw hart; en heb een valse eed niet lief; want al deze dingen zijn wat Ik haat, spreekt de HEERE.", "Ps 119:13": "Ik heb met mijn lippen verteld al de rechten van Uw mond.", "Joz 9:16-19": "En het gebeurde na verloop van drie dagen, nadat zij het verbond met hen gesloten hadden, dat zij hoorden dat zij hun naburen waren, en dat zij te midden van hen woonden. Want toen de kinderen van Israël verder trokken, kwamen zij op de derde dag bij hun steden aan; hun steden nu waren Gibeon, en Chefira, en Beeroth, en Kirjath-jearim. En de kinderen van Israël sloegen ze niet, omdat de leiders van de vergadering hun gezworen hadden bij de HEERE, de God van Israël; daarom morde de hele vergadering tegen de leiders.", "1 Petr 1:14-16": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had; maar word, zoals Hij Die u geroepen heeft heilig is, ook zelf heilig in heel uw levenswandel; want er staat geschreven: Wees heilig, want Ik ben heilig.", "Matt 19:29": "En al wie huizen zal verlaten hebben, of broeders, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers, om Mijn Naam, die zal honderdvoud ontvangen, en het eeuwige leven beërven.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "1 Petr 5:7": "Werp al uw bekommernis op Hem, want Hij zorgt voor u.", "Ps 37:23-29": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg. Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand. Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.", "2 Petr 1:5-9": "En span daarom ook alle inspanning in om, naast uw geloof, ook deugd te voegen, en naast de deugd kennis, En naast de kennis matigheid, en naast de matigheid volharding, en naast de volharding godsvrucht, En naast de godsvrucht broederlijke liefde, en naast de broederlijke liefde, liefde jegens allen.", "Rom 6:22": "Maar nu, vrijgemaakt van de zonde, en dienstbaar gemaakt aan God, hebt u uw vrucht tot heiliging, en het einde het eeuwige leven.", "Matt 7:7": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "1 Tess 4:11": "En dat u zich beijvert om stil te zijn, en uw eigen zaken te doen, en te werken met uw eigen handen, zoals wij u bevolen hebben;", "2 Tim 3:4": "verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Jes 26:3": "Het is een vast voornemen: U zult allerlei vrede bewaren, want men heeft op U vertrouwd.", "Jes 65:13": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "Mark 9:49": "Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.", "Rom 14:5": "De één acht de ene dag boven de andere dag; maar de ander acht alle dagen gelijk. Laat ieder in zijn eigen gemoed ten volle overtuigd zijn.", "Ezech 18:13": "Uitleent op woeker, en overwinst neemt; zou die leven? Hij zal niet leven, al die gruwelen heeft hij gedaan; hij zal zeker gedood worden; zijn bloed zal op hem zijn!", "Joh 10:27-29": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij. En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken. Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "1 Tim 6:11": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "1 Tess 5:9-11": "Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus. Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven. Daarom, vermaan elkaar en bouw de één de ander op, zoals u ook doet.", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "2 Kor 1:20-22": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons. Maar Die ons met u bevestigt in Christus, en Die ons gezalfd heeft, is God; Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Spr 2:12": "Om u te redden van de kwade weg, van de man die verkeerdheden spreekt;", "Spr 14:26": "In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.", "Joh 15:12": "Dit is Mijn gebod, dat u elkaar liefhebt, zoals Ik u liefgehad heb.", "1 Petr 5:6": "Verneder u dan onder de krachtige hand van God, opdat Hij u verhoogt op Zijn tijd.", "Ex 12:44": "Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Ps 31:7": "Ik haat hen die op valse ijdelheden acht slaan, en ik vertrouw op de HEERE.", "Openb 2:19": "Ik weet uw werken, en liefde, en dienst, en geloof, en uw lijdzaamheid, en uw werken, en dat de laatste meer zijn dan de eerste.", "1 Kor 6:19": "Of weet u niet, dat uw lichaam een tempel is van de Heilige Geest, Die in u is, Die u van God hebt, en dat u niet van uzelf bent?", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Openb 21:3-7": "En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn. En God zal alle tranen van hun ogen afvegen; en de dood zal niet meer zijn; noch rouw, noch geroep, noch moeite zal er meer zijn; want de eerste dingen zijn weggegaan. En Die op de troon zat, zei: Zie, Ik maak alle dingen nieuw. En Hij zei tegen mij: Schrijf, want deze woorden zijn waarachtig en betrouwbaar.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Spr 10:30": "De rechtvaardige zal in eeuwigheid niet wankelen; maar de goddelozen zullen de aarde niet bewonen.", "Openb 11:12": "En zij hoorden een grote stem uit de hemel, die tegen hen zei: Kom hier boven. En zij voeren op naar de hemel, in de wolk; en hun vijanden aanschouwden hen.", "Joh 14:12-21": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, de werken die Ik doe, zal hij ook doen, en zal grotere doen dan deze, want Ik ga heen tot Mijn Vader. En wat u ook zult vragen in Mijn Naam, dat zal Ik doen, opdat de Vader in de Zoon verheerlijkt wordt. Als u iets zult vragen in Mijn Naam, Ik zal het doen.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "1 Petr 3:14": "Maar als u ook lijdt om de gerechtigheid, dan bent u gelukkig te prijzen; en wees niet bang voor hun dreiging, en raak niet in verwarring;", "1 Joh 2:12-15": "Ik schrijf u, kinderen, want de zonden zijn u vergeven omwille van Zijn Naam. Ik schrijf u, vaders! want u hebt Hem gekend, Die er vanaf het begin is. Ik schrijf u, jongemannen, want u hebt de boze overwonnen. Ik schrijf u, kinderen, want u hebt de Vader gekend. Ik heb u geschreven, vaders, want u hebt Hem gekend, Die er vanaf het begin is. Ik heb u geschreven, jongemannen, want u bent sterk, en het Woord van God blijft in u, en u hebt de boze overwonnen.", "Joh 8:47": "Wie uit God is, hoort de woorden van God; daarom hoort u niet, omdat u niet uit God bent.", "Neh 5:7-13": "En mijn hart beraadslaagde in mij; daarna berispte ik de edelen en de overheden, en zei tegen hen: U vordert een last, ieder van zijn broeder. Vervolgens riep ik een grote vergadering tegen hen bijeen. En ik zei tegen hen: Wij hebben onze broeders, de Joden, die aan de heidenen verkocht waren, naar ons vermogen teruggekocht; en zouden u ook uw broeders verkopen, of zouden zij aan ons verkocht worden? Toen zwegen zij en vonden geen antwoord. Verder zei ik: De zaak die u doet, is niet goed; zou u niet wandelen in de vreze van onze God, om de smaad van de heidenen, onze vijanden?", "Lev 19:35": "U zult geen onrecht doen in het gericht, met de el, met het gewicht, of met de maat.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Lev 26:6": "Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Matt 26:15": "en zei: Wat wilt u mij geven, en ik zal Hem aan u overleveren? En zij hebben hem dertig zilveren munten toegezegd.", "Openb 7:9-17": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen. En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam. En alle engelen stonden rond de troon, en rond de oudsten en de vier dieren; en zij vielen voor de troon neer op hun gezicht, en aanbaden God,", "Lev 11:45": "Want Ik ben de HEERE, Die u uit het land Egypte doet optrekken, opdat Ik u tot een God zij, en opdat u heilig bent, omdat Ik heilig ben.", "Openb 10:5": "En de engel die ik zag staan op de zee en op de aarde, hief zijn hand op naar de hemel.", "Mal 3:3": "En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "Openb 14:5": "En in hun mond is geen bedrog gevonden; want zij zijn onberispelijk voor de troon van God.", "Hebr 12:14": "Jaag de vrede na met allen, en de heiligmaking, zonder welke niemand de Heere zien zal;", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Ps 33:19": "Om hun ziel van de dood te redden, en om hen bij het leven te houden in de honger.", "1 Joh 5:5": "Wie is het, die de wereld overwint, dan hij die gelooft dat Jezus de Zoon van God is?", "Rom 5:1-5": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus; Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God. En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt;", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "Spr 15:28": "Het hart van de rechtvaardige bedenkt zich, om te antwoorden; maar de mond van de goddelozen stort overvloedig kwade dingen uit.", "Deut 30:2": "En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel.", "Matt 18:19": "Verder zeg Ik u: als twee van u het op de aarde over enige zaak eens worden waar zij om zouden vragen, dat zal hun gebeuren van Mijn Vader, Die in de hemelen is.", "2 Tess 1:3-5": "Wij moeten God altijd danken over u, broeders, zoals het behoort, omdat uw geloof zeer meer wordt, en de liefde van elk van u allen jegens elkaar overvloedig wordt; Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt; Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt;", "Job 32:21": "Och, dat ik niemands aanzien aanneem, en tegen de mens geen bijnamen gebruik!", "Ps 16:3": "maar tot de heiligen die op de aarde zijn, en de heerlijke mensen, in wie al mijn vreugde is.", "Deut 16:19": "U zult het recht niet buigen; u zult niet partijdig zijn; ook zult u geen geschenk aannemen; want het geschenk verblindt de ogen van de wijzen, en verdraait de woorden van de rechtvaardigen.", "1 Joh 2:25": "En dit is de belofte, die Hij ons beloofd heeft, namelijk het eeuwige leven.", "Jak 2:5": "Luister, mijn geliefde broeders, heeft God niet de armen van deze wereld uitverkoren, om rijk te zijn in het geloof, en erfgenamen van het Koninkrijk, dat Hij belooft aan hen die Hem liefhebben?", "Rom 14:17-19": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest. Want hij die Christus in deze dingen dient, is God welgevallig, en aangenaam bij de mensen. Laten wij dan najagen wat tot de vrede dient, en wat tot de opbouw van elkaar dient.", "Pred 7:18": "Het is goed dat u daaraan vasthoudt, en trek ook uw hand van dit niet af; want wie God vreest, die ontgaat dat allemaal.", "Rom 8:29": "Want die Hij van tevoren gekend heeft, die heeft Hij ook van tevoren bestemd om gelijkvormig te zijn aan het beeld van Zijn Zoon, opdat Hij de Eerstgeborene zou zijn onder veel broeders.", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "2 Kon 3:13": "Maar Elisa zei tegen de koning van Israël: Wat heb ik met u te doen? Ga naar de profeten van uw vader, en naar de profeten van uw moeder. Doch de koning van Israël zei tegen hem: Nee, want de HEERE heeft deze drie koningen bij elkaar geroepen, om hen in de hand van de Moabieten te geven.", "Joh 5:24": "Voorwaar, voorwaar, Ik zeg u: Wie Mijn woord hoort
