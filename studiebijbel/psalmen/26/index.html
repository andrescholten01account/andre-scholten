t, ik heb het geloof behouden;", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "Job 36:19": "Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht?", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Ps 34:10": "Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek.", "Jes 1:11-15": "Waartoe zal Mij de veelheid van uw slachtoffers zijn? zegt de HEERE; Ik ben zat van de brandoffers van de rammen, en het vet van de vette dieren, en heb geen lust aan het bloed van de stieren, noch van de lammeren, noch van de bokken. Wanneer u voor Mijn aangezicht komt te verschijnen, wie heeft dat van uw hand geëist, dat u Mijn voorhoven zou betreden? Breng niet meer een nutteloos offer; het reukwerk is Mij een gruwel; de nieuwe manen, en sabbatten, en het bijeenroepen van de samenkomsten kan Ik niet verdragen, het is ongerechtigheid, zelfs de verbodsdagen.", "Spr 2:9": "Dan zult u verstaan gerechtigheid, en recht, en wat recht is, en elk goed pad.", "Job 16:19": "Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.", "2 Kor 4:2": "Maar wij hebben de bedekselen der schande verworpen, en wandelen niet in arglistigheid, en vervalsen ook het Woord van God niet, maar door openbaring van de waarheid maken wij onszelf aangenaam bij ieder geweten van de mensen, in de tegenwoordigheid van God.", "Ps 85:11-14": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen. De waarheid zal uit de aarde opkomen, en gerechtigheid zal vanuit de hemel neerzien. Ook zal de HEERE het goede geven; en ons land zal zijn vrucht geven.", "Jer 20:12": "Gij dan, o HEERE van de heerscharen, Die de rechtvaardige beproeft, Die de nieren en het hart ziet, laat mij Uw wraak op hen zien, want ik heb U mijn rechtszaak voorgelegd.", "Matt 10:32": "Ieder dan die Mij belijden zal voor de mensen, die zal Ik ook belijden voor Mijn Vader, Die in de hemelen is.", "Jes 26:1": "Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.", "Ps 27:1-6": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn? Toen de bozen, mijn tegenpartijen en mijn vijanden, tegen mij naar mij toe kwamen om mijn vlees te eten, stieten zij zelf aan en vielen. Ofschoon een leger mij belegerde, mijn hart zou niet vrezen; ofschoon een oorlog tegen mij opstond, toch vertrouw ik hierop.", "Ps 66:9": "Die onze zielen in het leven houdt, en niet toelaat dat onze voet wankelt.", "Amos 5:12": "Want Ik weet dat uw overtredingen talrijk, en uw zonden machtig veel zijn; zij benauwen de rechtvaardige, nemen steekpenningen aan, en verdringen de behoeftigen in de poort.", "Jer 17:9": "Arglistig is het hart, meer dan enig ding, ja, dodelijk is het; wie zal het kennen?", "1 Sam 24:16": "Doch de HEERE zal Rechter zijn, en rechtspreken tussen mij en tussen u, en zien daarin, en mijn geschil beslechten, en mij redden uit uw hand.", "Ps 16:2": "O mijn ziel, u hebt tegen de HEERE gezegd: U bent de Heere, mijn goedheid raakt niet tot U;", "Hand 16:25": "En omtrent middernacht baden Paulus en Silas en zongen lofzangen voor God; en de gevangenen luisterden naar hen.", "Lev 20:23": "En wandel niet in de gewoonten van het volk, dat Ik voor uw aangezicht wegjaag; want al deze dingen hebben zij gedaan; daarom ben Ik verdrietig op hen geworden.", "Spr 1:15": "Mijn zoon! wandel niet met hen op de weg; weer uw voet van hun pad.", "Ps 40:6": "Gij, o HEERE, mijn God! hebt Uw wonderen en Uw gedachten aan ons vele gemaakt, men kan ze niet in orde bij U verhalen; zal ik ze verkondigen en uitspreken, dan zijn ze menigvuldiger dan dat ik ze zou kunnen vertellen.", "Ps 54:8": "Ik zal U met vrijwilligheid offeren; ik zal Uw Naam, o HEERE, loven, want Hij is goed.", "1 Kron 16:33": "Dan zullen de bomen van het woud juichen voor het aangezicht van de HEERE, omdat Hij komt om de aarde te richten.", "Jer 51:10": "De HEERE heeft onze gerechtigheden hervoor gebracht; kom en laat ons in Sion het werk van de HEERE, onze God, vertellen!", "Spr 6:16": "Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel:", "Ps 116:19": "in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "Spr 24:1": "Wees niet jaloers op de slechte mensen, en laat u niet drijven om bij hen te zijn.", "Ps 94:14": "Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.", "Spr 23:20": "Wees niet onder de wijnzuipers, ook niet onder de vleesvreters;", "Ex 34:13-16": "Maar hun altaren zult u omverwerpen, en hun opgerichte beelden zult u verbreken, en hun gewijde palen zult u afhouwen. (Want u zult zich niet buigen voor een andere god; want de Naam van de HEERE is IJveraar! Een ijverig God is Hij!) Zodat u misschien geen verbond maakt met de inwoner van dat land; en zij hun goden niet nahoereren, noch hun goden offers brengen, en hij u uitnodigt, en u van zijn offer eet.", "Jes 25:9": "En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.", "Ezech 18:5": "Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet;", "1 Kor 15:15": "En dan blijken wij ook valse getuigen van God te zijn; want wij hebben van God getuigd dat Hij Christus opgewekt heeft, Die Hij niet opgewekt heeft, als namelijk de doden niet opgewekt worden.", "Job 23:7": "Daar zou de oprechte met Hem pleiten; en ik zou mij voor eeuwig van mijn Rechter vrijmaken.", "2 Kor 5:7": "(Want wij wandelen door geloof en niet door aanschouwen.)", "Ps 22:23-26": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen. U die de HEERE vreest, prijs Hem; al u nageslacht van Jakob, vereer Hem; en ontzie u voor Hem, al u nageslacht van Israël! Want Hij heeft niet veracht, noch verfoeid de verdrukking van de verdrukte, noch Zijn aangezicht voor hem verborgen; maar Hij heeft gehoord, toen hij tot Hem riep.", "1 Tim 6:13": "Ik beveel u voor het aangezicht van God, Die alles levend maakt, en van Christus Jezus, Die onder Pontius Pilatus de goede belijdenis heeft afgelegd,", "Ps 17:3": "U hebt mijn hart geproefd, 's nachts bezocht, U hebt mij getoetst. U vindt niets; wat ik gedacht heb, overtreedt mijn mond niet.", "Deut 21:6": "En alle oudsten van die stad, die het dichtst bij de gedode wonen, zullen hun handen wassen boven deze jonge koe, waarvan in dat dal de nek doorgehouwen is;", "Ezech 18:25": "Nog zegt u: De weg van de Heere is niet recht; hoor nu, o huis van Israël! Is Mijn weg niet recht? Zijn niet uw wegen onrecht?", "2 Kron 32:7": "Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.", "Dan 7:9": "Dit zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Jes 24:14-16": "Die zullen hun stem opheffen, zij zullen vrolijk zingen; vanwege de heerlijkheid van de HEERE zullen zij juichen vanaf de zee. Daarom eert de HEERE in de valleien, in de eilanden van de zee de Naam van de HEERE, de God van Israël. Van het uiterste einde van de aarde horen wij psalmen, tot verheerlijking van de Rechtvaardige. Maar nu zeg ik: Ik word mager, ik word mager, wee mij! De trouwelozen handelen trouweloos, en met trouweloosheid handelen de trouwelozen trouweloos.", "Ps 30:2": "Ik zal U verhogen, HEERE, want U hebt mij opgetrokken, en mijn vijanden over mij niet verblijd.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Ps 84:2": "Hoe lieflijk zijn Uw woningen, o HEERE van de heerscharen!", "Jes 12:6": "Juich en zing vrolijk, u inwoners van Sion! Want de Heilige van Israël is groot in uw midden.", "Pred 4:17": "Let op uw voet, als u naar het huis van God gaat, en wees liever bereid om te horen, dan om het offer van dwazen te geven; want zij weten niet dat zij kwaad doen.", "Matt 5:22": "Maar Ik zeg u: ieder die zonder reden toornig is op zijn broeder, die zal strafbaar zijn voor het gericht; en wie tegen zijn broeder zegt: Raka! die zal strafbaar zijn voor de grote raad; maar wie zegt: Dwaas! die zal strafbaar zijn voor het helse vuur.", "3 Joh 1:3": "Want ik ben zeer verblijd geweest, toen de broeders kwamen en getuigden van uw waarheid, zoals u in de waarheid wandelt.", "Ps 92:2-4": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste! Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten; Op het tiensnarig instrument en op de luit, met een voorbedacht lied op de harp.", "Gen 48:15": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag;", "Spr 14:30": "Een gezond hart is het leven van het vlees; maar afgunst is verrotting van de beenderen.", "Ps 122:1": "Een lied Hammaaloth, van David. Ik verblijd mij over hen die tegen mij zeggen: Wij zullen naar het huis van de HEERE gaan.", "Ps 7:4-6": "HEERE, mijn God, als ik dat gedaan heb, als er onrecht in mijn handen is; Als ik kwaad vergolden heb aan hem die vrede met mij had; (ja, ik heb hem gered, die mij zonder reden benauwde!) Laat dan de vijand mijn ziel vervolgen, en achterhaalt haar, en vertreedt mijn leven ter aarde, en mijn eer in het stof doet wonen! Sela.", "1 Kor 14:15": "Wat is het dan? Ik zal wel met de geest bidden, maar ik zal ook met het verstand bidden; ik zal wel met de geest zingen, maar ik zal ook met het verstand zingen.", "Joh 4:39": "En velen van de Samaritanen uit die stad geloofden in Hem, om het woord van de vrouw die getuigde: Hij heeft mij alles gezegd wat ik gedaan heb.", "Ps 18:36": "Ook hebt U mij het schild van Uw heil gegeven, en Uw rechterhand heeft mij ondersteund, en Uw zachtmoedigheid heeft mij groot gemaakt.", "Ezech 14:23": "Zo zullen zij u vertroosten, wanneer u hun weg en hun handelingen zult zien; en u zult weten dat Ik niet zonder reden heb gedaan al wat Ik in haar gedaan heb, spreekt de Heere HEERE.", "Ps 9:8": "Maar de HEERE zal in eeuwigheid zitten; Hij heeft Zijn troon bereid ten gerichte.", "Hebr 13:18": "Bid voor ons; want wij vertrouwen dat wij een goed geweten hebben, omdat wij in alles eerlijk willen wandelen.", "Spr 22:24": "Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man;", "Ps 71:5-7": "Want Gij zijt mijn Verwachting, Heere HEERE! mijn Vertrouwen van mijn jeugd af aan. Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U. Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.", "Ex 20:24-26": "Maak Mij een altaar van aarde, en offer daarop uw brandoffers en uw dankoffers, uw schapen en uw runderen; op elke plaats waar Ik Mijn Naam gedenken zal, zal Ik tot u komen en zal u zegenen. Maar als u Mij een stenen altaar zult maken, dan zult u dit niet bouwen van gehouwen steen; want als u uw houwijzer daarover heft, zult u het ontheiligen. U zult ook niet met trappen naar Mijn altaar opklimmen, opdat uw schaamte daarover niet ontdekt wordt.", "Matt 5:23": "Als u dan uw gave op het altaar offert, en u daar herinnert dat uw broeder iets tegen u heeft,", "Ps 16:8": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen.", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de Heere voegde dagelijks mensen die behouden werden aan de Gemeente toe.", "Openb 22:14": "Zalig zijn zij die Zijn geboden doen, zodat hun macht toekomt aan de boom des levens, en zij door de poorten de stad mogen binnengaan.", "Spr 29:24": "Wie met een dief deelt, haat zijn eigen leven; hij hoort een vervloeking, en geeft het niet te kennen.", "2 Tim 3:5": "met een schijn van godzaligheid, maar de kracht daarvan verloochenend. Heb ook een afkeer van hen.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Num 21:17": "(Toen zong Israël dit lied: Spring op, put, zing daarvan bij beurte!", "Ps 22:26": "Van U zal mijn lof zijn in een grote gemeente; ik zal mijn geloften betalen in de tegenwoordigheid van hen die Hem vrezen.", "Dan 9:7": "Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Ps 63:4-7": "Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen. Zo zou ik U loven in mijn leven; in Uw Naam zou ik mijn handen opheffen. Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen.", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "Ps 107:32": "En Hem verhogen in de gemeente van het volk, en Hem roemen in de vergadering van de oudsten.", "Luk 3:14": "En ook de soldaten vroegen hem: En wij, wat zullen wij doen? En hij zei tegen hen: Doe niemand geweld aan, en pers niemand af door bedrog, en wees tevreden met uw soldij.", "Rom 10:10": "Want met het hart gelooft men tot rechtvaardigheid, en met de mond belijdt men tot zaligheid.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Ps 119:100-102": "Ik ben voorzichtiger dan de ouden, omdat ik Uw bevelen bewaard heb. Ik heb mijn voeten geweerd van alle kwade paden, opdat ik Uw woord zou onderhouden. Ik ben niet geweken van Uw rechten, want U hebt mij geleerd.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Job 27:4-6": "Indien mijn lippen onrecht zullen spreken, en indien mijn tong bedrog zal uitspreken! Het zij verre van mij, dat ik u rechtvaardigen zou; totdat ik de geest zal gegeven hebben, zal ik mijn oprechtheid niet van mij wegdoen. Aan mijn gerechtigheid zal ik vasthouden, en zal ze niet laten varen; mijn hart zal die niet versmaden van mijn dagen.", "Ex 30:19-21": "Zodat Aäron en zijn zonen zich daarmee kunnen wassen, hun handen en voeten. Wanneer zij de tent van de samenkomst binnengaan, moeten zij zich met water wassen, zodat zij niet sterven; of wanneer zij tot het altaar naderen om te dienen, om het vuuroffer aan de HEERE aan te steken; Dan moeten zij hun handen en voeten wassen, zodat zij niet sterven; en dit zal voor hen een eeuwige instelling zijn, voor hem en zijn nageslacht, bij hun geslachten.", "Mal 2:11-13": "Juda handelt trouweloos, en er wordt een gruwel gedaan in Israël en in Jeruzalem; want Juda ontheiligt de heiligheid van de HEERE, die Hij liefheeft; want hij heeft de dochter van een vreemde god getrouwd. De HEERE zal de man die dit doet, uitroeien uit de tenten van Jakob, hem die waakt en hem die antwoordt, en die de HEERE van de heerscharen een spijsoffer brengt. Dit tweede doet u ook: dat u het altaar van de HEERE bedekt met tranen, met wenen en met zuchten, zodat Hij niet meer naar het spijsoffer wil omzien, en het ook niet met welgevallen uit uw hand wil ontvangen.", "Ps 31:4-7": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam. Doe mij uitgaan uit het net, dat zij voor mij verborgen hebben, want U bent mijn Sterkte. In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Hos 10:10": "Het is Mijn wens, dat Ik hen zal tuchtigen; en volken zullen tegen hen verzameld worden, wanneer Ik hen bind in hun twee voren.", "Hab 2:20": "Maar de HEERE is in Zijn heilige tempel. Zwijg voor Zijn aangezicht, heel de aarde!", "1 Sam 17:37": "Verder zei David: De HEERE, Die mij gered heeft uit de klauw van de leeuw en uit de klauw van de beer, Die zal mij redden uit de hand van deze Filistijn. Toen zei Saul tegen David: Ga heen, en de HEERE zij met u!", "Ps 71:16": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.", "Spr 2:11": "Zo zal de bedachtzaamheid over u de wacht houden, de verstandigheid zal u behoeden;", "Spr 1:12": "Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;", "Ps 44:6": "Door U zullen wij onze tegenstanders met hoorns stoten; in Uw Naam zullen wij vertrappen die tegen ons opstaan.", "Ps 18:21": "De HEERE vergold mij naar mijn gerechtigheid, Hij gaf mij weer naar de reinheid van mijn handen.", "Spr 13:20": "Die met de wijzen omgaat, zal wijs worden; maar die de metgezel van de dwazen is, zal verbroken worden.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Ps 54:3": "O God! Verlos mij door Uw Naam, en doe mij recht door Uw macht.", "Deut 31:16": "En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb.", "1 Tim 3:9": "mensen die de verborgenheid van het geloof vasthouden in een rein geweten.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Jer 2:25": "Bedwing uw voet van ontschoeiing, en uw keel van dorst; maar u zegt: Het is buiten hoop; nee, want ik heb de vreemden lief, en die zal ik nawandelen!", "Gen 35:2": "Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren;", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Jer 7:7": "dan zal Ik u in deze plaats, in het land dat Ik uw vaderen gegeven heb, laten wonen van eeuw tot eeuw.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Hand 2:4-11": "En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken. En er waren Joden die in Jeruzalem woonden, godvruchtige mannen, uit alle volken die er onder de hemel zijn. En toen deze stem gebeurd was, kwam de menigte samen en raakte in verwarring, want ieder hoorde hen in zijn eigen taal spreken.", "Richt 11:27": "Ik heb ook niet tegen u gezondigd, maar u doet mij onrecht aan door tegen mij te strijden. De HEERE, Die Rechter is, oordele vandaag tussen de kinderen van Israël en de kinderen van Ammon!", "Jes 52:7-10": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning. Er is een stem van uw wachters; zij verheffen de stem, zij juichen samen; want zij zullen oog in oog zien, wanneer de HEERE Sion terugbrengen zal. Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "2 Kor 6:15": "En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige?", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Spr 25:14": "Een man die zichzelf beroemt op een valse gift, is als wolken en wind, waar geen regen bij is.", "Ps 43:3": "Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Deut 27:25": "Vervloekt is hij die geschenken aanneemt om een ziel, het bloed van een onschuldige, te doden! En heel het volk zal zeggen: Amen.", "Ps 111:10": "Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.", "Jes 42:10-12": "Zingt de HEERE een nieuw lied, Zijn lof van het einde van de aarde; u, die ter zee vaart, en al wat daarin is, u eilanden en hun inwoners. Laat de woestijn en haar steden de stem verheffen, met de dorpen die Kedar bewoont; laat hen juichen die in de rotsen wonen, en van de top van de bergen af schreeuwen. Laat ze de HEERE de eer geven, en Zijn lof in de eilanden verkondigen.", "Spr 28:20": "Een geheel getrouw man zal overvloedig zijn in zegeningen; maar wie zich haast om rijk te worden, zal niet onschuldig blijven.", "Spr 23:6": "Eet niet het brood van hem die boos is van oog, en wees niet belust op zijn smakelijke gerechten;", "Job 4:17": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker?", "2 Kron 32:8": "Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.", "Ps 119:166": "O HEERE! ik hoop op Uw heil, en doe Uw geboden.", "1 Kor 11:28": "Maar laat de mens zichzelf beproeven, en laat hij zo van het brood eten, en van de drinkbeker drinken.", "Hebr 11:4": "Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is.", "Num 35:30": "Ieder die iemand doodslaat, moet men op grond van de verklaring van getuigen doden; maar één enkele getuige mag niet tegen iemand getuigen, zodat hij sterft.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "Gen 1:25": "En God maakte de wilde dieren van de aarde naar hun aard, en het vee naar zijn aard, en al de kruipende dieren van de aardbodem naar hun aard. En God zag dat het goed was.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Gal 6:3-5": "Want als iemand denkt iets te zijn, terwijl hij niets is, bedriegt hij zichzelf in zijn gemoed. Maar ieder moet zijn eigen werk beproeven; en dan zal hij aan zichzelf alleen roem hebben, en niet aan een ander. Want ieder zal zijn eigen pak dragen.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Openb 3:4": "Toch hebt u enkele weinige namen ook in Sardis, die hun kleren niet bevlekt hebben, en zij zullen met Mij wandelen in witte kleren, omdat zij het waard zijn.", "Ps 26:1-3": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen. Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart. Want Uw goedertierenheid is voor mijn ogen, en ik wandel in Uw waarheid.", "1 Sam 8:1": "Het gebeurde nu, toen Samuël oud geworden was, dat hij zijn zonen tot richters over Israël aanstelde.", "Ps 49:16": "Maar God zal mijn ziel uit de macht van het graf verlossen, want Hij zal mij opnemen. Sela.", "Ps 43:5": "Wat buigt u zich neer, o mijn ziel! En wat bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de rijke Verlossing van mijn aangezicht, en mijn God.", "Ps 111:1": "Halleluja! Aleph. Ik zal de HEERE loven van ganser harte; Beth. in de raad en vergadering van de oprechten.", "Ps 68:33-35": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela. Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken.", "Ps 138:7": "Als ik wandel in het midden van de benauwdheid, maakt Gij mij levend; Uw hand strekt Gij uit tegen de toorn van mijn vijanden, en Uw rechterhand behoudt mij.", "Ps 18:50": "Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "Hand 24:15": "Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen.", "Gen 4:9-12": "En de HEERE zei tegen Kaïn: Waar is Abel, uw broeder? En hij zei: Ik weet het niet; ben ik de hoeder van mijn broeder? En Hij zei: Wat hebt u gedaan? Daar is een stem van het bloed van uw broeder, die tot Mij roept vanuit de aardbodem. En nu bent u vervloekt, verbannen van de aardbodem, die zijn mond heeft opengedaan om het bloed van uw broeder uit uw hand te ontvangen.", "Zach 8:21": "En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan.", "Ps 103:6": "De HEERE doet gerechtigheid en recht aan allen die onderdrukt worden.", "Gen 49:6": "Mijn ziel, kom niet in hun verborgen raad; mijn eer, wordt niet verenigd met hun vergadering! Want in hun toorn hebben zij de mannen doodgeslagen, en in hun moedwil hebben zij de ossen verlamd.", "Kol 3:23": "En alles wat u doet, doe dat van harte, als voor de Heere en niet voor de mensen;", "1 Kor 5:9-11": "Ik heb u in de brief geschreven dat u zich niet moet inlaten met de hoereerders; Maar niet geheel met de hoereerders van deze wereld, of met de gierigaards, of met de rovers, of met de afgodendienaars; want dan zou u wel uit de wereld moeten gaan. Maar nu heb ik u geschreven dat u zich niet moet inlaten namelijk met iemand die een broeder genoemd wordt, en toch een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; met zo iemand moet u zelfs niet eten.", "1 Sam 17:45-47": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Job 14:15": "Dat U zou roepen, en ik U zou antwoorden, dat U naar het werk van Uw handen zou verlangen.", "Ps 119:8": "Ik zal Uw inzettingen bewaren; verlaat mij niet al te zeer.", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Hos 7:8": "Efraïm, die vermengt zich met de volken; Efraïm is een koek die niet is omgekeerd;", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "2 Kon 17:36": "Maar de HEERE, Die u uit het land Egypte met grote kracht en met een uitgestrekte arm opgevoerd heeft, Hem zult u vrezen, en voor Hem zult u zich buigen, en Hem zult u offers brengen;", "1 Petr 1:18": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd,", "Ps 119:26": "Ik heb U mijn wegen verteld, en U hebt mij verhoord; leer mij Uw inzettingen.", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Job 9:15": "Aan wie ik, ook al was ik rechtvaardig, niet zou antwoorden; mijn Rechter zal ik om genade bidden.", "2 Kron 31:20": "Zo deed Hizkia in heel Juda; en hij deed wat goed, en recht, en waarachtig was, voor het aangezicht van de HEERE, zijn God.", "Ps 62:7": "Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen.", "Rom 9:14": "Wat zullen wij dan zeggen? Is er onrechtvaardigheid bij God? Dat zij verre.", "Joh 4:24": "God is een Geest, en wie Hem aanbidden, moeten Hem aanbidden in geest en waarheid.", "Ps 81:8": "In de benauwdheid riep u, en Ik hielp u eruit; Ik antwoordde u uit de schuilplaats van de donder; Ik beproefde u aan het water van Meriba. Sela.", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Spr 5:8": "Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;", "Hebr 11:14": "Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken.", "Jes 38:18": "Want het graf zal U niet loven, de dood zal U niet prijzen; wie in de kuil neerdalen, zullen op Uw waarheid niet hopen.", "Matt 5:24": "laat uw gave daar voor het altaar, en ga heen; verzoen u eerst met uw broeder, en kom dan en offer uw gave.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Job 1:8": "En de HEERE zei tegen de satan: Hebt u ook acht geslagen op Mijn knecht Job? Want er is niemand op de aarde zoals hij, een man oprecht en vroom, godvrezend en afwijkend van het kwaad.", "Klaagl 3:24-32": "Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen. Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt. Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Joz 5:15": "Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "Ps 70:5": "Laat in U vrolijk en verblijd zijn allen, die U zoeken; laat de liefhebbers van uw heil voortdurend zeggen: God zij groot gemaakt!", "Luk 8:39": "Keer terug naar uw huis, en vertel wat voor grote dingen God aan u gedaan heeft. En hij ging heen en verkondigde door de hele stad wat voor grote dingen Jezus aan hem gedaan had.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "Ps 6:10": "De HEERE heeft mijn smeking gehoord; de HEERE zal mijn gebed aannemen.", "Ef 6:6": "niet uit ogendienst, als mensenbehagers, maar als dienstknechten van Christus, terwijl u de wil van God doet van harte;", "Gen 24:7": "De HEERE, de God van de hemel, Die mij uit het huis van mijn vader en uit het land van mijn familie genomen heeft, en Die tot mij gesproken heeft, en Die mij gezworen heeft en zei: Aan uw nageslacht zal Ik dit land geven! Die Zelf zal Zijn Engel voor uw aangezicht zenden, zodat u voor mijn zoon van daar een vrouw neemt.", "Ps 119:59": "Ik heb mijn wegen bedacht, en heb mijn voeten gekeerd tot Uw getuigenissen.", "Ps 7:18": "Ik zal de HEERE loven naar Zijn gerechtigheid, en voor de Naam van de HEERE, de Allerhoogste, psalmzingen.", "Ps 139:23": "Doorgrond mij, o God! En ken mijn hart; beproef mij, en ken mijn gedachten.", "Neh 7:2": "En ik gaf bevel aan mijn broer Hanani, en aan Hananja, de leider van de burcht in Jeruzalem, want hij was een man van trouw, en godvrezend boven velen.", "Ps 69:20": "U weet mijn smaad, en mijn schaamte, en mijn schande; al mijn belagers zijn voor U.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Ps 121:2": "Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft.", "Jer 10:12": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid heeft door Zijn verstand.", "Jes 3:14": "De HEERE komt ten gerichte tegen de oudsten van Zijn volk en hun vorsten, want u hebt deze wijngaard verteerd; de roof van de ellendige is in uw huizen.", "Ps 71:8": "Laat mijn mond vervuld worden met Uw lof, de hele dag met Uw heerlijkheid.", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "Luk 2:46": "En het gebeurde na drie dagen, dat zij Hem vonden in de tempel, zittend te midden van de leraren, terwijl Hij naar hen luisterde en hun vragen stelde.", "Ps 118:10": "Alle heidenen hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.", "Ps 60:11": "Wie zal mij brengen in een vaste stad? Wie zal mij leiden tot in Edom?", "Ex 24:1": "Daarna zei Hij tegen Mozes: Klim op tot de HEERE, u en Aäron, Nadab en Abihu, en zeventig van de oudsten van Israël; en buig u neer van verre!", "Ps 65:2": "De lofzang is in stilte tot U, o God! in Sion; en U zal de gelofte betaald worden.", "1 Sam 8:3": "Doch zijn zonen wandelden niet in zijn wegen, maar neigden zich naar de gierigheid, en namen geschenken aan, en bogen het recht.", "Ps 23:1-6": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Ps 103:3": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "Ps 33:20-22": "Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild. Want ons hart is in Hem verblijd, omdat wij op de Naam van Zijn heiligheid vertrouwen. Uw goedertierenheid, HEERE! zij over ons, zoals wij op U hopen.", "Luk 11:42": "Maar wee u, Farizeeën, want u geeft tienden van munt en wijnruit en van alle moeskruid, en u gaat voorbij aan het recht en de liefde van God. Dit moest men doen, en het andere niet nalaten.", "1 Tim 1:12": "En ik dank Hem, Die mij kracht gegeven heeft, namelijk Christus Jezus, onze Heere, dat Hij mij trouw geacht heeft, doordat Hij mij in de bediening gesteld heeft;", "Deut 22:8": "Wanneer u een nieuw huis bouwt, zult u op uw dak een leuning maken; opdat u geen bloedschuld op uw huis legt, wanneer iemand ervan afvalt.", "2 Kron 7:1": "Toen Salomo klaar was met bidden, daalde het vuur van de hemel neer en verteerde het brandoffer en de slachtoffers; en de heerlijkheid van de HEERE vervulde het huis.", "Ps 116:16": "Och HEERE, zeker, ik ben Uw knecht, ik ben Uw knecht, een zoon van Uw dienstmaagd; U hebt mijn banden losgemaakt.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "Spr 28:6": "De arme, die in zijn oprechtheid wandelt, is beter dan wie verkeerd is van wegen, al is hij rijk.", "Micha 4:2": "En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Ps 55:17": "Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen.", "Spr 20:7": "De rechtvaardige wandelt steeds in zijn oprechtheid; gelukkig zijn zijn kinderen na hem.", "Neh 5:15": "En de vorige landvoogden, die vóór mij geweest zijn, hebben het volk bezwaard en van hen genomen aan brood en wijn, daarna veertig zilveren sikkels; ook heersten hun knechten over het volk; maar ik heb dat niet gedaan, om de vreze van God.", "Joz 23:6-13": "Zo weest zeer sterk, om te bewaren en om te doen alles, wat geschreven is in het wetboek van Mozes; opdat u daarvan niet afwijkt naar rechts noch naar links; Dat u niet ingaat tot deze volken: deze, die overgebleven zijn bij u; gedenkt ook niet aan de naam van hun goden, en laat er niet bij zweren, en dient hen niet, en buigt u voor hen niet; Maar de HEERE, uw God, zult u aanhangen, zoals u tot op deze dag gedaan hebt.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Rom 16:27": "Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. De brief aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is.", "Ps 36:9": "Zij worden dronken van de vettigheid van uw huis; en U drenkt hen uit de beek van Uw wellusten.", "Spr 17:8": "Het geschenk is in de ogen van wie het bezit een aangenaam gesteente; waarheen het zich ook wendt, het zal wel gedijen.", "Num 33:55": "Maar als u de inwoners van het land niet voor uw aangezicht uit hun bezit verdrijft, dan zal het gebeuren dat wie u van hen laat overblijven, tot doornen zullen zijn in uw ogen, en tot prikkels in uw zijden, en u zullen benauwen in het land waarin u woont.", "Hand 4:24": "En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn.", "Ps 50:4": "Hij zal roepen tot de hemel van boven, en tot de aarde, om Zijn volk te oordelen.", "Rom 14:14": "Ik weet en ben verzekerd in de Heere Jezus, dat niets onrein is op zichzelf; behalve voor hem die iets acht onrein te zijn, voor hem is het onrein.", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Ps 67:7": "De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Ps 24:3-6": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Luk 6:31": "En zoals u wilt dat de mensen u doen, doe hun ook hetzelfde.", "Ps 40:2-4": "Ik heb de HEERE lang verwacht; en Hij heeft Zich tot mij geneigd, en mijn geroep gehoord. En Hij heeft mij uit een ruisende kuil, uit modderig slijk opgehaald, en heeft mijn voeten op een rotssteen gesteld, Hij heeft mijn gangen vastgemaakt. En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.", "Ps 143:9": "Red mij, HEERE, van mijn vijanden; bij U schuil ik.", "Fil 3:4-14": "Hoewel ik ook redenen had om op het vlees te vertrouwen; als iemand anders meent te kunnen vertrouwen op het vlees, ik nog meer. Besneden op de achtste dag, uit het geslacht van Israël, van de stam van Benjamin, een Hebreeër uit de Hebreeën, wat de wet betreft een Farizeeër; Wat de ijver betreft een vervolger van de Gemeente; wat de rechtvaardigheid betreft die in de wet is, onberispelijk.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Jer 19:4": "Omdat zij Mij verlaten, en deze plaats vervreemd hebben, en andere goden daarin gerookt hebben die zij niet gekend hebben, zij, noch hun vaders, noch de koningen van Juda; en hebben deze plaats vervuld met bloed van onschuldigen.", "1 Sam 2:3": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan.", "Ps 77:11-13": "Daarna zei ik: Dit krenkt mij; maar de rechterhand van de Allerhoogste verandert. Ik zal de daden van de HEERE gedenken; ja, ik zal Uw wonderen van vroeger gedenken; En ik zal al Uw werken overdenken, en van Uw daden spreken.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Ps 57:8-10": "Mijn hart is standvastig, o God! mijn hart is standvastig; ik zal zingen en psalmzingen. Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o Heere! ik zal U psalmzingen onder de naties.", "Ps 109:30": "Ik zal de HEERE met mijn mond zeer loven, en te midden van velen zal ik Hem prijzen.", "Ps 119:27": "Geef mij de weg van Uw bevelen te verstaan, opdat ik Uw wonderen betracht.", "Ef 4:32": "Maar wees jegens elkaar goedertieren, barmhartig, en vergeef elkaar, zoals ook God in Christus u vergeven heeft.", "Pred 11:1": "Werp uw brood uit op het water, want u zult het vinden na veel dagen.", "Spr 1:14": "U zult uw lot midden onder ons werpen; wij zullen allen één buidel hebben.", "Ps 32:7": "U bent mij een schuilplaats; U behoedt mij voor benauwdheid; U omringt mij met vrolijke gezangen van bevrijding. Sela.", "Ps 37:31": "De wet van zijn God is in zijn hart; zijn gangen zullen niet uitglijden.", "1 Tim 6:12": "Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen.", "Spr 19:1": "De arme, die in zijn oprechtheid wandelt, is beter dan de verkeerde van lippen, en die een dwaas is.", "Ps 59:11": "De God van mijn goedertierenheid zal mij voor zijn; God zal mij op mijn verspieders doen zien.", "2 Kron 19:7": "Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "Luk 1:46-55": "En Maria zei: Mijn ziel maakt de Heere groot, en mijn geest verheugt zich in God, mijn Zaligmaker; omdat Hij de nederigheid van Zijn dienstmaagd heeft aangezien; want zie, van nu af aan zullen alle geslachten mij zalig spreken.", "Ps 121:8": "De HEERE zal uw uitgaan en uw ingaan bewaren, van nu aan tot in eeuwigheid.", "3 Joh 1:11": "Geliefde, volg het kwade niet na, maar het goede. Wie goed doet, is uit God; maar wie kwaad doet, heeft God niet gezien.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Jer 17:12": "Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.", "Richt 9:57": "Op dezelfde manier liet God al het kwaad van de mensen van Sichem op hun hoofd terugkomen; en de vloek van Jotham, de zoon van Jerubbaäl, kwam over hen.", "Ef 4:20-25": "Maar u hebt Christus zo niet geleerd; Als u naar Hem hebt geluisterd, en door Hem geleerd bent, zoals de waarheid in Jezus is; Namelijk dat u zou afleggen, wat betreft de vorige levenswandel, de oude mens, die verdorven wordt door de begeerten van de verleiding;", "Matt 5:21": "U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Gen 49:7": "Vervloekt is hun toorn, want hij is heftig; en hun verbolgenheid, want zij is hard! Ik zal hen verdelen onder Jakob, en zal hen verstrooien onder Israël.", "Ps 44:9": "In God roemen wij de hele dag, en Uw Naam zullen wij loven tot in eeuwigheid. Sela.", "Ps 119:31": "Ik kleef vast aan Uw getuigenissen; o HEERE! beschaam mij niet.", "Spr 2:5": "Dan zult u de vreze des HEEREN verstaan, en zult de kennis van God vinden.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Jer 31:11": "Want de HEERE heeft Jakob vrijgekocht, en Hij heeft hem verlost uit de hand van hem die sterker was dan hij.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Ps 27:6": "Ook nu zal mijn hoofd verhoogd worden boven mijn vijanden die rondom mij zijn, en ik zal in Zijn tent offeranden van het geschal offeren; ik zal zingen, ja, psalmzingen voor de HEERE.", "Ps 22:6": "Tot U hebben zij geroepen, en zijn uitgered; op U hebben zij vertrouwd, en zijn niet beschaamd geworden.", "1 Sam 22:18": "Toen zei de koning tegen Doeg: Wend u om, en val de priesters aan. Toen wendde Doeg, de Edomiet, zich om, en hij viel de priesters aan, en doodde op die dag vijfentachtig mannen die de linnen priesterrok droegen.", "Ps 118:29": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Jes 10:17": "Want het Licht van Israël zal tot een vuur zijn, en zijn Heilige tot een vlam, die in brand zal steken en verteren zal zijn doornen en zijn distels, op één dag.", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Ps 1:1": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "Ps 50:18": "Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers.", "Ex 28:35": "En Aäron zal die aanhebben om te dienen; opdat zijn geluid gehoord wordt als hij in het heilige, voor het aangezicht van de HEERE, ingaat, en als hij uitgaat, opdat hij niet sterft.", "Ps 145:12": "Lamed. Om aan de mensenkinderen bekend te maken Zijn machtige daden, en de eer van de heerlijkheid van Zijn Koninkrijk.", "Ps 119:71": "Het is mij goed, dat ik verdrukt ben geweest, opdat ik Uw inzettingen leerde.", "Micha 6:8": "Hij heeft u bekendgemaakt, o mens, wat goed is; en wat eist de HEERE van u, dan recht te doen, en weldadigheid lief te hebben, en ootmoedig te wandelen met uw God?", "Ps 136:1-26": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Loof de God der goden; want Zijn goedertierenheid is voor eeuwig. Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig.", "Ps 121:3": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "Ps 100:5": "Want de HEERE is goed; Zijn goedertierenheid is eeuwig, en Zijn trouw van geslacht tot geslacht.", "Ps 107:15": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "2 Kor 5:15": "Omdat wij dit oordelen: dat als Eén voor allen gestorven is, zij dan allen gestorven zijn. En Hij is voor allen gestorven, opdat zij die leven niet meer voor zichzelf zouden leven, maar voor Hem Die voor hen gestorven en opgewekt is.", "Jes 45:21": "Verkondig het en treed hier toe, ja, beraadslaag samen: wie heeft dat van oudsher laten horen? Wie heeft dat van toen af verkondigd? Ben Ik het niet, de HEERE? En er is geen God meer behalve Mij, een rechtvaardig God, en een Heiland, niemand is er dan Ik.", "Ps 54:9": "Want Hij heeft mij gered uit alle benauwdheid; en mijn oog heeft gezien op mijn vijanden.", "Jes 43:22-24": "Doch u hebt Mij niet aangeroepen, o Jakob! toen u zich tegen Mij vermoeid hebt, o Israël! Mij hebt u niet gebracht het kleinvee van uw brandoffers, en met uw slachtoffers hebt u Mij niet geëerd; Ik heb u Mij niet doen dienen met spijsoffer, en Ik heb u niet vermoeid met wierook. Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Luk 1:6": "En zij waren beiden rechtvaardig voor God, en wandelden onberispelijk in alle geboden en voorschriften van de Heere.", "Matt 26:3": "Toen kwamen de overpriesters en de Schriftgeleerden en de oudsten van het volk samen in de zaal van de hogepriester, die Kajafas genoemd werd;", "Jer 7:10": "en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "Ps 115:12-14": "De HEERE is aan ons indachtig geweest, Hij zal zegenen; Hij zal het huis van Israël zegenen, Hij zal het huis van Aäron zegenen. Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten. De HEERE zal de zegen over u vermeerderen, over u en over uw kinderen.", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "Num 9:23": "Naar het bevel van de HEERE legerden zij zich, en naar het bevel van de HEERE trokken zij verder; zij namen de wacht van de HEERE waar, naar het bevel van de HEERE, door de hand van Mozes.", "Spr 17:23": "De goddeloze neemt het geschenk uit de schoot, om de paden van het recht te buigen.", "Ps 119:43": "En ruk het woord van de waarheid van mijn mond niet al te zeer, want ik hoop op Uw rechten.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Zef 3:12": "Maar Ik zal in uw midden doen overblijven een ellendig en arm volk; die zullen op de Naam van de HEERE vertrouwen.", "1 Kor 1:6": "Zoals de getuigenis van Christus onder u bevestigd is;", "Ps 145:5": "He. Ik zal uitspreken de heerlijkheid van de eer van Uw majesteit, en Uw wonderlijke daden.", "Ps 97:12": "Rechtvaardigen, verblijd u in de HEERE, en spreek lof ter gedachtenis van Zijn heiligheid.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Job 35:14": "Dat u ook gezegd hebt: U zult Hem niet aanschouwen; er is toch een oordeel voor Zijn aangezicht, wacht u dan op Hem.", "Ps 19:13": "Wie zou de afdwalingen verstaan? Reinig mij van de verborgen afdwalingen.", "Spr 12:26": "De rechtvaardige is voortreffelijker dan zijn naaste; maar de weg van de goddelozen doet hen dwalen.", "Ps 66:14": "Die mijn lippen hebben geuit, en mijn mond heeft uitgesproken, toen het mij bang te moede was.", "Ps 135:19": "U, huis van Israël! looft de HEERE; u, huis van Aäron! looft de HEERE.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Ps 48:2": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid.", "Ps 91:1": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige.", "Ps 20:6-8": "Wij zullen juichen over Uw heil, en de vaandels opsteken in de Naam van onze God. De HEERE vervult al uw verlangens. Nu weet ik, dat de HEERE Zijn Gezalfde behoudt; Hij zal Hem verhoren uit de hemel van Zijn heiligheid; het heil van Zijn rechterhand zal zijn met machten. Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "Ex 40:34": "Toen bedekte de wolk de tent der samenkomst; en de heerlijkheid van de HEERE vervulde de tabernakel.", "Ps 91:10": "U zal geen kwaad overkomen, en geen plaag zal uw tent naderen.", "Ps 111:4": "Zain. Hij heeft Zijn wonderen tot een gedachtenis gemaakt; Cheth. de HEERE is genadig en barmhartig.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Ps 111:2": "Gimel. De werken van de HEERE zijn groot; Daleth. ze worden gezocht door allen die er lust in hebben.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Ps 63:4": "Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen.", "Ps 135:1-3": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE! U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God! Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.", "2 Kor 6:14": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis?", "2 Sam 16:7": "Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!", "Ps 10:14": "U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Ps 119:44": "Zo zal ik Uw wet voortdurend onderhouden, eeuwig en altijd.", "Ezech 22:8": "Mijn heilige dingen hebt u veracht, en Mijn sabbatten hebt u ontheiligd.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Tit 3:3-7": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar. Maar toen de goedertierenheid van God, onze Zaligmaker, en Zijn liefde tot de mensen verschenen is, Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Ps 11:5": "De HEERE beproeft de rechtvaardige; maar de goddeloze, en wie geweld liefheeft, haat Zijn ziel.", "Ef 5:1": "Wees dan navolgers van God, als geliefde kinderen;", "Ps 73:23-26": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat; U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen. Aan wie heb ik behalve U iets in de hemel? Behalve U verlang ik ook niets op de aarde!", "Ps 139:14": "Ik loof U, omdat ik op een heel ontzagwekkende wijze wonderbaarlijk gemaakt ben; wonderlijk zijn Uw werken! Ook weet mijn ziel het zeer goed.", "Gen 35:3": "En laten wij ons opmaken en optrekken naar Bethel; en ik zal daar een altaar maken voor de God Die mij antwoordt op de dag van mijn benauwdheid, en met mij geweest is op de weg die ik gegaan heb.", "1 Petr 3:15": "maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,", "Kol 3:13": "verdraag elkaar en vergeef elkaar, als iemand tegen iemand enige klacht heeft; zoals ook Christus u vergeven heeft, doe ook u zo.", "Ps 148:1-14": "Halleluja! Looft de HEERE uit de hemelen; looft Hem in de hoogste plaatsen! Looft Hem, al Zijn engelen! Looft Hem, al Zijn heerscharen! Looft Hem, zon en maan! Looft Hem, alle lichtende sterren!", "Amos 2:6": "Zo zegt de HEERE: Om drie overtredingen van Israël, en om vier zal Ik dat niet afwenden; omdat zij de rechtvaardige voor geld verkopen, en de arme om een paar schoenen.", "Ex 19:21-24": "En de HEERE zei tot Mozes: Ga af, waarschuw dit volk, dat zij niet doorbreken naar de HEERE om te zien, en velen van hen vallen. Daartoe zullen ook de priesters, die tot de HEERE naderen, zich heiligen, dat de HEERE niet tegen hen uitbreekt. Toen zei Mozes tot de HEERE: Het volk zal de berg Sinaï niet kunnen beklimmen, want U hebt ons gewaarschuwd en gezegd: Bepaal de grens van de berg, en heilig hem.", "Fil 4:20": "Onze God en Vader nu zij de heerlijkheid tot in alle eeuwigheid. Amen.", "Ps 22:5": "Op U hebben onze vaders vertrouwd; zij hebben vertrouwd, en U hebt hen uitgeholpen.", "Ezech 18:30": "Daarom zal Ik u richten, o huis van Israël, ieder naar zijn wegen, spreekt de Heere HEERE. Keer terug, en bekeer u van al uw overtredingen, zo zal de ongerechtigheid u niet tot een struikelblok worden.", "Spr 16:11": "Een eerlijke weegschaal en balans zijn van de HEERE; alle gewichten in de zak zijn Zijn werk.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Spr 28:17": "Een mens, gedrukt door het bloed van iemand, zal naar de kuil toevluchten; men houde hem niet tegen!", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "1 Kor 13:1": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn.", "Hos 4:17": "Efraïm is met de afgoden verbonden; laat hem begaan.", "Openb 16:5-7": "En ik hoorde de engel van het water zeggen: U bent rechtvaardig, Heere! Die is, en Die was, en Die zijn zal, dat U dit geoordeeld hebt; Omdat zij het bloed van de heiligen en van de profeten vergoten hebben, hebt U hun ook bloed te drinken gegeven; want zij zijn het waard. En ik hoorde een ander vanaf het altaar zeggen: Ja, Heere, U almachtige God! Uw oordelen zijn waarachtig en rechtvaardig.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Joh 4:28-30": "Toen liet de vrouw haar watervat staan, en ging naar de stad, en zei tegen de mensen: Kom, kijk naar een Mens Die mij alles gezegd heeft wat ik gedaan heb; is Deze niet de Christus? Zij gingen dan de stad uit, en kwamen naar Hem toe.", "Ps 59:10": "Tegen zijn sterkte zal ik op U wachten; want God is mijn Hoog Vertrek.", "Job 13:18": "Zie toch, ik heb de zaak ordelijk gesteld; ik weet dat ik rechtvaardig verklaard zal worden.", "Hand 2:1-4": "En toen de dag van het Pinksterfeest vervuld werd, waren zij allen eendrachtig bijeen. En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen.", "Joh 4:41": "En er geloofden er nog veel meer om Zijn woord;", "Ps 116:17-19": "Ik zal U een offer van dankzegging offeren, en de Naam van de HEERE aanroepen. Ik zal mijn gelofte de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk, in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "Ps 141:4": "Neig mijn hart niet tot een kwade zaak, om enige handel in goddeloosheid te bedrijven, met mannen die ongerechtigheid bedrijven; en laat mij niet eten van hun lekkernijen.", "Gen 18:21": "Zal Ik nu afgaan en zien of zij naar hun geroep, dat tot Mij gekomen is, het uiterste gedaan hebben, en zo niet, Ik zal het weten.", "Joz 24:19": "Toen zei Jozua tegen het volk: U zult de HEERE niet kunnen dienen, want Hij is een heilig God; Hij is een na-ijverig God; Hij zal uw overtredingen en uw zonden niet vergeven.", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "Jes 12:1-6": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij. Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden. En u zult water scheppen met vreugde uit de fonteinen van het heil;", "Ps 51:9": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw.", "Neh 9:33": "Doch U bent rechtvaardig, in alles wat ons overkomen is; want U hebt trouw gehandeld, maar wij hebben goddeloos gehandeld.", "Ps 5:8": "Maar ik zal door de grootheid van Uw goedertierenheid in Uw huis ingaan; ik zal mij buigen naar het paleis van Uw heiligheid, in Uw vreze.", "Fil 1:19-21": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus. Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood. Want het leven is voor mij Christus, en het sterven is winst.", "Ps 99:9": "Verhef de HEERE, onze God, en buig u voor de berg van Zijn heiligheid; want de HEERE, onze God, is heilig.", "Ps 50:23": "Wie dank offert, die zal Mij eren; en wie zijn weg goed inricht, die zal Ik Gods heil doen zien.", "Ps 41:12": "Hierbij weet ik, dat U lust aan mij hebt, dat mijn vijand over mij niet zal juichen.", "Ps 119:125": "Ik ben Uw knecht, maak mij verstandig, en ik zal Uw getuigenissen kennen.", "Ps 52:4": "Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog.", "Job 21:22": "Zal men God wetenschap leren, terwijl Hij hen die hoog zijn richt?", "Ex 21:29-32": "Maar als de os al eerder stotig was, en zijn eigenaar daarvan gewaarschuwd is, en hij hem niet bewaakt heeft, en hij doodt een man of een vrouw, zal die os gestenigd worden, en zijn eigenaar zal ook gedood worden. Als hem losgeld opgelegd wordt, zal hij tot vrijkoop van zijn leven geven naar alles wat hem opgelegd wordt; of hij nu een zoon gestoten heeft, of een dochter gestoten heeft, naar dit recht zal hem gedaan worden.", "Ps 34:2-4": "Aleph. Ik zal de HEERE loven te allen tijde; Zijn lof zal voortdurend in mijn mond zijn. Beth. Mijn ziel zal zich beroemen in de HEERE; de zachtmoedigen zullen het horen en zich verblijden. Gimel. Maakt de HEERE met mij groot, en laten wij Zijn Naam samen verhogen.", "Dan 3:16": "Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden.", "Ps 104:34": "Mijn overdenking van Hem zal zoet zijn; ik zal mij in de HEERE verblijden.", "Ps 136:5": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "Ps 119:62": "Te middernacht sta ik op, om U te loven voor de rechten van Uw gerechtigheid.", "Ps 105:1-5": "Looft de HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken. Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen. Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "Joz 23:12": "Want als u enigszins afkeert, en het overige van deze volken aanhangt, van deze, die bij u overgebleven zijn, en u met hen verzwagert, en u tot hen ingaat, en zij tot u;", "Ps 21:8": "Want de koning vertrouwt op de HEERE, en door de goedertierenheid van de Allerhoogste zal hij niet wankelen.", "Ps 4:9": "Ik zal in vrede samen neerliggen en slapen; want U, o HEERE! alleen zult mij zeker doen wonen.", "Gen 6:9": "Dit zijn de afstammelingen van Noach. Noach was een rechtvaardig, oprecht man onder zijn tijdgenoten. Noach wandelde met God.", "2 Kron 6:1": "Toen zei Salomo: De HEERE heeft gezegd dat Hij in de donkerheid zou wonen.", "Ps 113:2": "De Naam van de HEERE zij geprezen, van nu af tot in eeuwigheid.", "Spr 2:2": "Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt;", "2 Kor 13:5": "Onderzoek uzelf, of u in het geloof bent, beproef uzelf. Of weet u zelf niet, dat Jezus Christus in u is? Tenzij u op de een of andere manier verwerpelijk bent.", "Hebr 10:25": "en laten wij onze onderlinge bijeenkomst niet nalaten, zoals sommigen dat gewend zijn, maar elkaar vermanen; en dat des te meer, naarmate u ziet dat de dag nadert.", "Jer 7:5": "Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "Jer 7:9": "Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent,", "Hand 3:15": "En de Vorst van het leven hebt u gedood, Die God heeft opgewekt uit de doden; waarvan wij getuigen zijn.", "Ps 84:5": "Gelukkig zijn zij, die in Uw huis wonen; zij prijzen U gestadig. Sela.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "Num 16:22": "Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden?", "Hand 2:46": "En zij bleven dagelijks eendrachtig in de tempel volharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "1 Joh 4:16": "En wij hebben de liefde gekend en geloofd, die God tot ons heeft. God is liefde; en die in de liefde blijft, blijft in God, en God in hem.", "Ps 60:14": "In God zullen wij kloeke daden doen, en Hij zal onze tegenstanders vertreden.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Ps 149:1-9": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten. Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning. Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "Ex 40:35": "Zodat Mozes niet in de tent der samenkomst kon ingaan, omdat de wolk daarop bleef, en de heerlijkheid van de HEERE de tabernakel vervulde.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "Ex 18:21": "Doch zoek u onder al het volk uit naar bekwame mannen, die God vrezen, betrouwbare mannen, die hebzucht haten; stel hen aan over hen als leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien.", "Mal 2:6": "De wet van de waarheid was in zijn mond, en er werd geen onrecht in zijn lippen gevonden; hij wandelde met Mij in vrede en in rechtvaardigheid, en hij bekeerde er velen van ongerechtigheid.", "Ps 22:24-26": "U die de HEERE vreest, prijs Hem; al u nageslacht van Jakob, vereer Hem; en ontzie u voor Hem, al u nageslacht van Israël! Want Hij heeft niet veracht, noch verfoeid de verdrukking van de verdrukte, noch Zijn aangezicht voor hem verborgen; maar Hij heeft gehoord, toen hij tot Hem riep. Van U zal mijn lof zijn in een grote gemeente; ik zal mijn geloften betalen in de tegenwoordigheid van hen die Hem vrezen.", "Ps 98:9": "Voor het aangezicht van de HEERE, want Hij komt om de aarde te oordelen; Hij zal de wereld oordelen in gerechtigheid, en de volken in alle rechtmatigheid.", "2 Kon 18:5": "Hij vertrouwde op de HEERE, de God van Israël, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die vóór hem geweest waren.", "Zach 8:22": "Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "Job 13:23": "Hoeveel misdaden en zonden heb ik? Maak mij mijn overtreding en mijn zonden bekend.", "Ps 66:16-20": "Komt, hoort toe, allen die God vrezen, en ik zal vertellen wat Hij aan mijn ziel gedaan heeft. Ik riep tot Hem met mijn mond, en Hij werd verhoogd onder mijn tong. Had ik naar ongerechtigheid met mijn hart gezien, de Heere zou niet gehoord hebben.", "Ps 27:4-6": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel. Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen. Ook nu zal mijn hoofd verhoogd worden boven mijn vijanden die rondom mij zijn, en ik zal in Zijn tent offeranden van het geschal offeren; ik zal zingen, ja, psalmzingen voor de HEERE.", "Ps 91:2": "Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw!", "Ps 119:164": "Ik loof U zevenmaal per dag, over de rechten van Uw gerechtigheid.", "Deut 10:21": "Hij is uw lof, en Hij is uw God. Die bij u deze grote en ontzagwekkende dingen gedaan heeft, die uw ogen gezien hebben.", "Luk 6:36": "Wees dan barmhartig, zoals ook uw Vader barmhartig is.", "Ps 33:5": "Hij heeft gerechtigheid en recht lief; de aarde is vol van de goedertierenheid van de HEERE.", "Ps 30:12": "U hebt mijn weeklagen veranderd in een reidans; U hebt mijn rouwkleed losgemaakt, en mij met blijdschap omgord;", "Jona 2:2-9": "En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen. En ik zei: Ik ben weggestoten van voor Uw ogen; toch zal ik de tempel van Uw heiligheid weer aanschouwen.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Ps 104:33": "Ik zal de HEERE zingen in mijn leven; ik zal mijn God psalmzingen, zolang ik nog ben.", "Jes 50:7-9": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Ps 119:108": "Laat U toch, o HEERE! welgevallen de vrijwillige offeranden van mijn mond, en leer mij Uw rechten.", "Ps 94:18": "Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 119:146": "Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden.", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "2 Sam 22:21": "De HEERE vergold mij naar mijn gerechtigheid; Hij gaf mij weer naar de reinheid van mijn handen.", "1 Sam 17:36": "Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "Ps 40:5": "Gelukkig is de man die de HEERE tot zijn vertrouwen stelt, en niet omziet naar de hoogmoedigen, en die tot leugen afwijken.", "Job 15:34": "Want de vergadering van de huichelaars wordt eenzaam, en het vuur verteert de tenten van de geschenken.", "Hand 24:14": "Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is;", "Ps 47:2": "Al u volken, klapt in de hand; juicht tot God met een stem van vreugdegezang.", "Matt 5:44-48": "Maar Ik zeg u: heb uw vijanden lief; zegen hen die u vervloeken; doe goed aan hen die u haten; en bid voor hen die u geweld aandoen en die u vervolgen; opdat u kinderen mag zijn van uw Vader, Die in de hemelen is; want Hij laat Zijn zon opgaan over bozen en goeden, en laat het regenen over rechtvaardigen en onrechtvaardigen. Want als u hen liefhebt die u liefhebben, wat voor loon hebt u? Doen ook de tollenaars niet hetzelfde?", "Spr 1:10": "Mijn zoon! als de zondaars u aanlokken, stem er niet mee in;", "Ps 98:1": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven.", "Dan 6:23": "Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "Ezech 22:9": "Achterklappers zijn in u geweest om bloed te vergieten, en in u hebben zij op de bergen gegeten, zij hebben schandelijkheid in uw midden gedaan.", "Ps 94:3": "Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Rom 14:6": "Hij die de dag in acht neemt, neemt hem in acht voor de Heere; en hij die de dag niet in acht neemt, neemt hem niet in acht voor de Heere. Hij die eet, eet dat voor de Heere, want hij dankt God; en hij die niet eet, eet dat niet voor de Heere, en hij dankt God.", "Lev 18:3": "U zult niet doen naar de werken van het Egyptische land, waarin u gewoond hebt; en naar de werken van het land Kanaän, waarheen Ik u breng, zult u niet doen, en u zult in hun inzettingen niet wandelen.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond."}, "noten": {}, "koppeling": {"1": "Een psalm <span class=\"wl\" data-l=\"L1\" data-code=\"H1732\">van</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1732\">David</span>. <span class=\"wl\" data-l=\"L2\" data-code=\"H8199\">Doe</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H8199\">mij</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H8199\">recht</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H1980\">HEERE</span>! <span class=\"wl\" data-l=\"L3\" data-code=\"H1980\">Want</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1980\">ik</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1980\">wandel</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1980\">in</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H8537\">mijn</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H8537\">oprechtheid</span>; <span class=\"wl\" data-l=\"L5\" data-code=\"H982\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H982\">ik</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H982\">vertrouw</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H982\">op</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4571\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4571\">HEERE</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H4571\">ik</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4571\">zal</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4571\">niet</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4571\">wankelen</span>.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H974\">Proef</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5254\">mij</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H5254\">HEERE</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H5254\">en</span> beproef <span class=\"wl\" data-l=\"L3\" data-code=\"H6884\">mij</span>; <span class=\"wl\" data-l=\"L3\" data-code=\"H6884\">toets</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6884\">mijn</span> <sp
