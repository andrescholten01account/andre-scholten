t onze God; laat een sterfelijk mens tegen U niets vermogen.", "Luk 21:34": "En let op uzelf, dat uw harten niet op enig moment bezwaard worden met brasserij en dronkenschap, en zorgen van dit leven, en dat die dag u niet onvoorzien overkomt.", "Ps 17:6": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden.", "Spr 22:27": "Als u niets hebt om te betalen, waarom zou men uw bed van onder u wegnemen?", "2 Sam 23:5": "Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.", "Ps 58:7-10": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE! Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren. Laat hem heengaan als een wegsmeltende slak; laat hen, als de misdracht van een vrouw, de zon niet zien.", "Ps 71:9": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Job 17:16": "Zij zullen mee naar beneden gaan met de grendels van het graf, als er rust samen in het stof zal zijn.", "Ps 77:3": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden.", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "Ps 142:6": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden.", "Ps 118:7": "De HEERE is bij mij onder degenen die mij helpen; daarom zal ik mijn lust zien aan degenen die mij haten.", "Ps 37:13-22": "De Heere belacht hem, want Hij ziet dat zijn dag komt. Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn. Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Amos 5:13": "Daarom zal de verstandige in die tijd zwijgen, want het zal een slechte tijd zijn.", "Spr 13:3": "Die zijn mond bewaart, behoudt zijn ziel; maar voor hem is verstoring, die zijn lippen wijd opendoet.", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "1 Tess 5:4": "Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen.", "Ps 119:148": "Mijn ogen komen de nachtwaken voor, om Uw rede te betrachten.", "Ps 89:27": "Hij zal Mij noemen: Gij zijt mijn Vader! mijn God, en de Rotssteen van mijn heil!", "Spr 22:3": "Een verstandig mens ziet het kwaad en verbergt zich; maar de eenvoudigen gaan door en worden gestraft.", "Luk 12:35-37": "Laat uw middel omgord zijn, en de lampen brandend. En wees zelf gelijk aan mensen die op hun heer wachten, wanneer hij terugkomt van de bruiloft, zodat zij, als hij komt en klopt, hem meteen kunnen opendoen. Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "Dan 9:14": "Daarom heeft de HEERE over het kwade gewaakt, en Hij heeft het over ons gebracht; want de HEERE, onze God, is rechtvaardig in al Zijn werken die Hij gedaan heeft, omdat wij Zijn stem niet gehoorzaamden.", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Job 14:19-21": "Het water vermaalt de stenen, het stof van de aarde overspoelt het gewas dat er zelf uit voortkomt; zo verderft U de verwachting van de mens. U overweldigt hem voor altijd, en hij gaat heen; U verandert zijn gelaat, en zendt hem weg. Zijn kinderen komen tot eer, en hij weet het niet; of zij worden klein, en hij merkt het niet aan hen.", "Neh 9:32": "Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "Ps 119:28": "Mijn ziel druipt weg van treurigheid; richt mij op naar Uw woord.", "Ps 119:13": "Ik heb met mijn lippen verteld al de rechten van Uw mond.", "Pred 8:8": "Er is geen mens die macht heeft over de geest, om de geest tegen te houden; en hij heeft geen macht over de dag van de dood; er is ook geen vrijstelling in die strijd; en de goddeloosheid zal haar meesters niet redden.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Pred 7:15": "Dit alles heb ik gezien in de dagen van mijn vluchtige leven; er is een rechtvaardige die in zijn gerechtigheid omkomt; daarentegen is er een goddeloze die in zijn slechtheid zijn dagen verlengt.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "1 Petr 5:7": "Werp al uw bekommernis op Hem, want Hij zorgt voor u.", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "Ps 23:4": "Al ging ik ook in een dal van de schaduw van de dood, ik zou geen kwaad vrezen, want U bent met mij; Uw stok en Uw staf, die troosten mij.", "Jak 1:11": "Want de zon is opgegaan met hitte, en heeft het gras dor gemaakt, en zijn bloem is afgevallen, en de mooie vorm van zijn aanzien is vergaan; zo zal ook de rijke in zijn wegen verwelken.", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Job 14:10-12": "Maar een man sterft als hij is verzwakt, en de mens geeft de geest, waar is hij dan? Het water verdwijnt uit een meer, en een rivier droogt uit en verdort; Zo ligt de mens neer, en staat niet meer op; totdat de hemelen er niet meer zijn, zullen zij niet ontwaken, noch uit hun slaap opgewekt worden.", "2 Kor 6:3-11": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt. Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "Job 16:20": "Mijn vrienden bespotten mij; maar mijn oog druipt tot God.", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "1 Petr 5:9": "Weersta hem, vast staand in het geloof, in de wetenschap dat hetzelfde lijden wordt volbracht aan uw broederschap die in de wereld is.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Ps 71:4": "Mijn God, bevrijd mij van de hand van de goddeloze, van de hand van hem die verkeerd handelt, en van de opgeblazene.", "Spr 18:16": "Het geschenk van een mens maakt hem ruimte, en het brengt hem voor het aangezicht van de groten.", "Ef 3:14-19": "Om deze reden buig ik mijn knieën voor de Vader van onze Heere Jezus Christus, uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt, opdat Hij u geeft, naar de rijkdom van Zijn heerlijkheid, met kracht versterkt te worden door Zijn Geest in de innerlijke mens;", "Ps 71:2": "Red mij door Uw gerechtigheid, en bevrijd mij; neig Uw oor tot mij, en verlos mij.", "Spr 20:5": "De raad in het hart van een man is als diepe wateren; maar een man van verstand zal die naar boven halen.", "Gen 43:14": "En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Ex 23:13": "In alles wat Ik tegen u gezegd heb, zult u op uw hoede zijn; en de naam van andere goden zult u niet noemen; uit uw mond zal hij niet gehoord worden!", "Mark 9:49": "Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.", "Luk 12:27": "Kijk naar de lelies, hoe zij groeien; zij werken niet en spinnen niet; en Ik zeg u: zelfs Salomo in al zijn heerlijkheid was niet gekleed als één van deze.", "Ps 140:8": "HEERE, Heere, sterkte van mijn heil! U hebt mijn hoofd bedekt op de dag van de wapening.", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Deut 11:16": "Wacht uzelf, dat uw hart niet verleid wordt, dat u afwijkt, en andere goden dient, en u voor die buigt;", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Ps 6:8": "Mijn oog is doorknaagd van verdriet, is verouderd, vanwege al mijn tegenstanders.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Spr 15:22": "Plannen worden tenietgedaan als er geen overleg is; maar door veel raadgevers komen ze tot stand.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Pred 10:1": "Een dode vlieg doet de zalf van de apotheker stinken en opwellen; zo doet een weinig dwaasheid met een man die kostelijk is van wijsheid en van eer.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Ps 31:2-5": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid. Neig Uw oor tot mij, red mij haastig; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden. Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.", "Ef 1:16-19": "Houd niet op voor u te danken, en u te gedenken in mijn gebeden; Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem; Namelijk verlichte ogen van uw verstand, opdat u mag weten wat de hoop is van Zijn roeping, en wat de rijkdom is van de heerlijkheid van Zijn erfenis in de heiligen;", "Ps 118:17": "Ik zal niet sterven, maar leven; en ik zal de werken van de HEERE vertellen.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Ps 119:40": "Zie, ik heb een begeerte tot Uw bevelen; maak mij levend door Uw gerechtigheid.", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "Ps 94:1-23": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend! Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen. Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?", "Ps 27:11": "HEERE, leer mij Uw weg, en leid mij op het rechte pad, omwille van mijn verspieders.", "Matt 13:12-15": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Deut 4:23": "Wacht u ervoor dat u het verbond van de HEERE, uw God, dat Hij met u gesloten heeft, vergeet, zodat u een gesneden beeld zou maken, de gelijkenis van iets dat de HEERE, uw God, u verboden heeft.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Matt 15:22-28": "En zie, een Kananese vrouw, die uit die omgeving kwam, riep tot Hem en zei: Heere! U Zoon van David, ontferm U over mij! mijn dochter is ernstig door de duivel bezeten. Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na. Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Jer 14:22": "Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.", "Ps 71:21": "Gij zult mijn grootheid vermeerderen, en mij rondom vertroosten.", "Job 7:21": "En waarom vergeeft U mijn overtreding niet, en doet U mijn ongerechtigheid niet weg? Want nu zal ik in het stof liggen; en U zult mij vroeg zoeken, maar ik zal niet zijn.", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "Klaagl 1:20": "Resch. Zie, HEERE, want mij is bang; mijn ingewand is beroerd, mijn hart heeft zich omgekeerd in het binnenste van mij, want ik ben zeer opstandig geweest; van buiten heeft mij het zwaard van kinderen beroofd, van binnen is het als de dood.", "Ps 78:39": "En Hij dacht eraan, dat zij vlees waren, een wind, die heengaat en niet terugkeert.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Jes 28:18-22": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "1 Kor 10:5-11": "Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Ps 79:9": "Help ons, o God van ons heil! Vanwege de eer van Uw Naam; en red ons, en doe verzoening over onze zonden, om Uw Naam.", "Ps 143:8": "Doe mij Uw goedertierenheid in de morgenstond horen, want ik vertrouw op U; maak mij de weg bekend die ik moet gaan, want ik hef mijn ziel tot U op.", "Ps 63:7": "Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.", "Deut 32:39": "Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "Ezech 22:14": "Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.", "Job 21:32": "Ten slotte wordt hij naar de graven gebracht, en blijft hij op de aardhoop.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Jer 52:21": "Aangaande de pilaren, achttien el was de hoogte van één pilaar, en een draad van twaalf el omving hem; en zijn dikte was vier vingers, en hij was hol.", "Ps 139:17": "Daarom, hoe kostbaar zijn mij, o God, Uw gedachten! Hoe machtig veel zijn hun sommen!", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Ps 51:16": "Verlos mij van bloedschuld, o God, U, God van mijn heil! zo zal mijn tong Uw gerechtigheid vrolijk roemen.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Openb 14:5": "En in hun mond is geen bedrog gevonden; want zij zijn onberispelijk voor de troon van God.", "Hos 13:14": "Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "2 Kron 20:4-13": "En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof. En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Spr 17:18": "Een mens zonder verstand slaat de hand erop, en stelt zich borg bij zijn naaste.", "Jer 20:11": "Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Spr 15:28": "Het hart van de rechtvaardige bedenkt zich, om te antwoorden; maar de mond van de goddelozen stort overvloedig kwade dingen uit.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Ps 143:1-12": "Een psalm van David. O HEERE, hoor mijn gebed, neig de oren tot mijn smekingen; verhoor mij naar Uw waarheid, naar Uw gerechtigheid. En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn. Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ps 25:2": "Beth. Mijn God! op U vertrouw ik; laat mij niet beschaamd worden; laat mijn vijanden niet van vreugde opspringen over mij.", "Ps 119:173": "Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen.", "2 Kor 4:8": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig;", "1 Kon 3:7": "Nu dan, HEERE, mijn God! U hebt Uw knecht koning gemaakt in de plaats van mijn vader David; en ik ben een jonge man, ik weet niet uit te gaan of in te gaan.", "Ps 61:8": "Hij zal eeuwig voor Gods aangezicht zitten; bereid goedertierenheid en waarheid, dat zij hem behoeden.", "Pred 7:16": "Wees niet al te rechtvaardig, en houd uzelf ook niet al te wijs; waarom zou u verwoesting over u brengen?", "Job 17:13": "Als ik wacht, het graf zal mijn huis wezen; in de duisternis zal ik mijn bed spreiden.", "Matt 18:34": "En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.", "Pred 11:8": "Maar als de mens veel jaren leeft, en zich in die allemaal verblijdt, laat hij dan ook denken aan de dagen van de duisternis, want die zullen er veel zijn; en alles wat komt, is vergankelijk.", "Matt 6:25-34": "Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding? Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven? Wie van u kan, door bezorgd te zijn, één el aan zijn lengte toevoegen?", "Matt 18:7-9": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Ps 119:117": "Ondersteun mij, zo zal ik behouden zijn; dan zal ik mij voortdurend in Uw inzettingen vermaken.", "Ps 56:10": "Dan zullen mijn vijanden achterwaarts keren, ten dage dat ik roepen zal; dit weet ik, dat God met mij is.", "Job 9:18": "Hij laat mij niet toe mijn adem te halen, maar Hij verzadigt mij met bitterheden.", "Job 5:9": "Die grote dingen doet, die men niet doorzoeken kan; wonderen, die men niet tellen kan;", "Ps 141:7": "Onze beenderen zijn verstrooid bij de mond van het graf, zoals wanneer iemand op de aarde iets kloofde en verdeelde.", "Jes 53:7": "Toen die geëist werd, werd Hij verdrukt; maar Hij deed Zijn mond niet open; als een lam werd Hij ter slachting geleid, en zoals een schaap stom is voor het aangezicht van zijn scheerders, zo deed Hij Zijn mond niet open.", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Ps 57:2-4": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan. Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien. Hij zal vanuit de hemel zenden, en mij verlossen, en te schande maken hem die mij zoekt te verslinden. Sela. God zal Zijn goedertierenheid en Zijn waarheid zenden.", "Ps 82:7": "Toch zult u sterven als een mens; en als een van de vorsten zult u vallen.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "Ps 4:2": "Als ik roep, verhoor mij, o God van mijn gerechtigheid! In benauwdheid hebt U mij ruimte gemaakt; wees mij genadig, en hoor mijn gebed.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Spr 17:2": "Een verstandige knecht zal heersen over een zoon die beschaamd maakt, en in het midden van de broeders zal hij erfenis delen.", "Ps 42:2-12": "Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God! Mijn ziel dorst naar God, naar de levende God; wanneer zal ik binnengaan en voor het aangezicht van God verschijnen? Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?", "Micha 7:7-9": "Maar ik zal uitzien naar de HEERE, ik zal wachten op de God van mijn heil; mijn God zal mij horen. Verblijd u niet over mij, o mijn vijandin! Wanneer ik gevallen ben, zal ik weer opstaan; wanneer ik in duisternis gezeten ben, zal de HEERE mij een licht zijn. Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Job 2:9": "Toen zei zijn vrouw tegen hem: Houdt u nog steeds vast aan uw oprechtheid? Vervloek God en sterf.", "Mark 15:34": "En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Ps 142:4": "Toen mijn geest in mij overweldigd was, kende U mijn pad. Zij hebben in het geheim een strik voor mij verborgen op de weg die ik zou gaan.", "Job 7:6": "Mijn dagen zijn lichter geweest dan een weversspoel, en zijn vergaan zonder verwachting.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Fil 1:20": "Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood.", "Jes 64:1": "Och, dat U de hemelen scheurde, dat U neerkwam, dat de bergen van Uw aangezicht wegsmolten;", "Job 8:9": "Want wij zijn van gisteren en weten niets, omdat onze dagen op de aarde een schaduw zijn.", "Ps 25:22": "O God! verlos Israël uit al zijn benauwdheden.", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Ps 49:15": "Men zet hen als schapen in het graf, de dood zal hen afweiden; en de oprechten zullen over hen heersen in die morgenstond; en het graf zal hun gedaante verslijten, elk uit zijn woning.", "Ps 70:2": "Haast U, o God, om mij te verlossen, o HEERE, tot mijn hulp.", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Hos 10:12": "Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen.", "Ps 92:11": "Maar U zult mijn hoorn verhogen, zoals de hoorn van een eenhoorn; ik ben met verse olie overgoten.", "Spr 4:23": "Behoed uw hart boven alles wat te bewaren is, want daaruit komt het leven voort.", "Matt 26:42": "Opnieuw, voor de tweede keer, ging Hij heen en bad, en zei: Mijn Vader! Als deze drinkbeker niet aan Mij voorbij kan gaan zonder dat Ik hem drink, laat Uw wil dan gebeuren!", "Job 34:32": "Behalve wat ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.", "Hebr 2:15": "en zou verlossen allen die door angst voor de dood, heel hun leven lang, aan slavernij onderworpen waren.", "Ps 35:21": "En zij sperren hun mond wijd open tegen mij; zij zeggen: Ha, ha, ons oog heeft het gezien!", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Ps 7:7": "Sta op, HEERE, in Uw toorn, verhef U om de woede van hen die mij benauwen, en ontwaak tot mij; U hebt het oordeel bevolen.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "1 Tim 1:1": "Paulus, een apostel van Jezus Christus, naar het bevel van God, onze Zaligmaker, en de Heere Jezus Christus, Die onze Hoop is,", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "Spr 8:12": "Ik, Wijsheid, woon bij de kloekzinnigheid, en vind de kennis van alle bedachtzaamheid.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Ps 31:25": "Wees sterk, en Hij zal uw hart versterken, allen u, die op de HEERE hoopt!", "Job 27:16": "Zo hij zilver opgehoopt zal hebben als stof, en kleding bereid als leem;", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Ps 9:2": "Ik zal de HEERE loven met mijn hele hart; ik zal al Uw wonderen vertellen.", "Job 4:7-21": "Bedenk toch, wie is de onschuldige die is omgekomen; en waar zijn de oprechten verdelgd? Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook. Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Neh 4:9": "Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.", "Hand 16:34": "En hij bracht hen in zijn huis, en zette hun de tafel voor, en verheugde zich dat hij met heel zijn huis gelovig geworden was in God.", "Ps 130:1-8": "Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE! Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen. Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "Rom 11:21": "Want als God de natuurlijke takken niet gespaard heeft, zie toe, dat Hij ook mogelijk u niet spaart.", "2 Sam 22:2-5": "Hij zei dan: De HEERE is mij mijn Steenrots, en mijn Burg, en mijn Uithelper. God is mijn Rots, ik zal op Hem vertrouwen; mijn Schild en de Hoorn van mijn heil, mijn Hoog Vertrek en mijn Toevlucht, mijn Verlosser! Van geweld hebt U mij verlost! Ik riep de HEERE aan, Die te prijzen is, en ik werd verlost van mijn vijanden.", "Gal 5:5": "Want wij verwachten door de Geest, uit het geloof, de hoop van de rechtvaardigheid.", "Hab 1:13": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Ps 39:2-5": "Ik zei: Ik zal op mijn wegen letten, dat ik niet zondig met mijn tong; ik zal mijn mond met een breidel in toom houden, terwijl de goddeloze nog tegenover mij is. Ik was verstomd door stilzwijgen, ik zweeg over het goede; maar mijn smart werd zwaarder. Mijn hart werd heet in mijn binnenste, een vuur ontbrandde in mijn overdenking; toen sprak ik met mijn tong:", "Ps 3:6": "Ik lag neer en sliep; ik werd wakker, want de HEERE ondersteunde mij.", "Spr 27:24": "Want de schat is niet voor eeuwig; of zal de kroon van geslacht tot geslacht zijn?", "Gen 50:24": "En Jozef zei tot zijn broeders: Ik sterf; maar God zal u zeker bezoeken, en Hij zal u doen optrekken uit dit land, naar het land, dat Hij aan Abraham, Izak en Jakob gezworen heeft.", "Jes 38:14-19": "Zoals een kraanvogel of zwaluw, zo piepte ik; ik kirde als een duif; mijn ogen keken smachtend omhoog; o HEERE! ik word onderdrukt, wees Gij mijn Borg. Wat zal ik spreken? Zoals Hij het mij heeft toegezegd, zo heeft Hij het gedaan; ik zal nu al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel. Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.", "Ps 35:10": "Al mijn beenderen zullen zeggen: HEERE, wie is U gelijk! U, Die de ellendige redt van hem die sterker is dan hij, en de ellendige en de nooddruftige van zijn berover.", "Ps 9:14": "Wees mij genadig, HEERE, zie mijn ellende aan, die mijn haters mij aandoen, Gij, Die mij verhoogt uit de poorten van de dood;", "Ps 61:5": "Ik zal in Uw hut verkeren in eeuwigheden; ik zal mijn toevlucht nemen in het verborgene van Uw vleugels. Sela.", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "Ps 62:2": "Zeker, mijn ziel is stil bij God; van Hem is mijn heil.", "Gen 16:13": "En zij noemde de Naam van de HEERE, Die tot haar sprak: U bent de God van het aanzien! want zij zei: Heb ik ook hier gezien naar Hem, Die mij aanziet?", "Ps 119:66": "Leer mij een goede zin en wetenschap, want ik heb aan Uw geboden geloofd.", "Pred 1:4": "Het ene geslacht gaat, en het andere geslacht komt; maar de aarde blijft staan in eeuwigheid.", "2 Tim 2:4": "Niemand die als soldaat dient, wikkelt zich in de zaken van het dagelijks leven, opdat hij hem kan behagen die hem tot soldaat heeft aangenomen.", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "Ps 73:9": "Zij zetten hun mond tegen de hemel, en hun tong gaat rond op de aarde.", "Joz 23:14": "En ziet, ik ga heden in de weg van de hele aarde; en u weet in uw hele hart en in uw hele ziel, dat er niet één woord gevallen is van al die goede woorden, die de HEERE, uw God, over u gesproken heeft; zij zijn u alle overkomen; er is daarvan niet één woord gevallen.", "Luk 8:14": "En wat tussen de dorens valt, dat zijn zij die gehoord hebben, en gaandeweg verstikt worden door de zorgen en rijkdom en genietingen van het leven, en geen rijpe vrucht voortbrengen.", "Ps 119:75": "Ik weet, HEERE! dat Uw gerichten de gerechtigheid zijn, en dat U mij uit getrouwheid verdrukt hebt.", "Ps 119:172": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid.", "Micha 7:5": "Geloof een vriend niet, vertrouw niet op een boezemvriend; bewaar de deuren van uw mond voor haar die in uw schoot ligt.", "Ps 102:12": "Mijn dagen zijn als een afgaande schaduw, en ik verdor als gras.", "2 Petr 2:12-17": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Joh 12:20": "En er waren enkele Grieken onder hen die opgegaan waren om op het feest te aanbidden;", "Ps 123:4": "Onze ziel is veel te zat van de spot van de weldenkenden, van de verachting van de hoogmoedigen.", "1 Kor 10:23": "Alle dingen zijn mij geoorloofd, maar niet alle dingen zijn nuttig; alle dingen zijn mij geoorloofd, maar niet alle dingen bouwen op.", "Num 32:23": "Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!", "Spr 10:11": "De mond van de rechtvaardige is een bron van leven; maar het geweld bedekt de mond van de goddelozen.", "Job 7:17": "Wat is de mens, dat U hem groot acht, en dat U Uw hart op hem zet?", "Zach 1:5": "Uw vaderen, waar zijn die? En de profeten, zullen zij eeuwig leven?", "Rom 5:3": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt;", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Matt 12:37": "Want uit uw woorden zult u gerechtvaardigd worden, en uit uw woorden zult u veroordeeld worden.", "Job 14:14": "Als een man gestorven is, zal hij dan weer leven? Ik zou al de dagen van het strijd hopen, totdat mijn verandering zou komen.", "Ps 118:14": "De HEERE is mijn Sterkte en Psalm, want Hij is mij tot heil geweest.", "Pred 12:9-11": "En verder, omdat de prediker wijs geweest is, leerde hij het volk nog kennis, en lette hij op, en onderzocht hij; hij bracht veel spreuken in orde. De prediker zocht aangename woorden te vinden, en wat er geschreven is, is recht: woorden van de waarheid. De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.", "Jes 38:3": "En hij zei: Och HEERE, denk er toch aan dat ik voor Uw gezicht in waarheid en met een volkomen hart gewandeld heb, en dat ik gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg hard.", "Job 9:25": "En mijn dagen zijn sneller geweest dan een loper; zij zijn weggevlucht, zij hebben het goede niet gezien.", "Ps 109:6-19": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "Ps 86:16": "Wend U tot mij, en wees mij genadig, geef Uw knecht Uw sterkte, en verlos de zoon van uw dienstmaagd.", "Ps 86:12": "Heere, mijn God! ik zal U met mijn hele hart loven, en ik zal Uw Naam eren tot in eeuwigheid;", "Ps 42:8": "De afgrond roept tot de afgrond, bij het gedruis van uw watergoten; al uw baren en uw golven zijn over mij heen gegaan.", "Ps 69:21": "De smaad heeft mijn hart gebroken, en ik ben zeer zwak; en ik heb gewacht op medelijden, maar er is geen; en op vertroosters, maar heb ze niet gevonden.", "Hand 1:25": "om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "Pred 10:10": "Als hij het ijzer stomp heeft gemaakt en hij slijpt de snede niet, dan moet hij meer kracht gebruiken; maar de wijsheid is een uitnemende zaak om iets recht te maken.", "Hand 1:18": "Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "Spr 16:21": "Wie wijs van hart is, zal verstandig genoemd worden; en zoetheid van de lippen zal de lering vermeerderen.", "Jer 17:14": "Genees mij, HEERE! zo zal ik genezen worden, behoud mij, zo zal ik behouden worden; want Gij zijt mijn Lof.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "Ps 77:8-10": "Zal de Heere dan voor eeuwig verstoten, en voortaan niet meer goedgunstig zijn? Houdt Zijn goedertierenheid voor eeuwig op? Heeft de toezegging een einde, van geslacht tot geslacht? Heeft God vergeten genadig te zijn? Heeft Hij Zijn barmhartigheden door toorn toegesloten? Sela.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Spr 10:28": "De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan.", "Spr 10:27-31": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Joh 3:33": "Wie Zijn getuigenis aangenomen heeft, die heeft verzegeld dat God waarachtig is.", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Jes 38:16": "Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.", "Rom 5:4": "En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop;", "Ex 15:1-19": "Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen. De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen! De HEERE is een krijgsman; HEERE is Zijn Naam!", "Ps 40:2": "Ik heb de HEERE lang verwacht; en Hij heeft Zich tot mij geneigd, en mijn geroep gehoord.", "Matt 12:35": "De goede mens brengt goede dingen voort uit de goede schat van het hart, en de slechte mens brengt slechte dingen voort uit de slechte schat.", "Ps 89:40-52": "Gij hebt het verbond van Uw knecht teniet gedaan; Gij hebt zijn kroon ontheiligd tegen de aarde. Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen. Allen die de weg voorbijgingen, hebben hem beroofd; voor zijn naburen is hij tot een smaad geweest.", "Hebr 12:9": "Verder, wij hebben de vaders van ons vlees wel als kastijders gehad, en wij hadden ontzag voor hen; zullen wij dan niet veel meer onderworpen zijn aan de Vader van de geesten, en leven?", "Job 10:20": "Zijn mijn dagen niet weinig? Houd op, laat van mij af, dat ik mij een weinig verkwikt;", "Spr 15:1": "Een zacht antwoord keert de grimmigheid af; maar een smartend woord doet de toorn oprijzen.", "Jes 40:7": "Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras.", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "Deut 6:17": "U zult de geboden van de HEERE, uw God, zorgvuldig houden, alsook Zijn getuigenissen, en Zijn inzettingen, die Hij u geboden heeft.", "Job 19:7-20": "Zie, ik roep: geweld! maar word niet verhoord; ik schreeuw, maar er is geen recht. Hij heeft mijn weg toegemuurd, zodat ik niet door kan gaan, en over mijn paden heeft Hij duisternis gesteld. Mijn eer heeft Hij van mij afgetrokken, en de kroon van mijn hoofd heeft Hij weggenomen.", "Spr 8:34": "Gelukkig is de mens die naar Mij hoort, dagelijks wakend aan Mijn poorten, wachtend bij de posten van Mijn deuren.", "Ps 83:2-19": "O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "Ps 89:32": "als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;", "1 Kor 7:32": "En ik wil dat u zonder zorgen bent. De ongetrouwde bekommert zich met de dingen van de Heere, hoe hij de Heere zal behagen;", "Ps 107:17": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Deut 4:29": "Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "2 Tess 1:5-9": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Job 5:6": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde;", "Pred 4:7": "Ik richtte mijn aandacht opnieuw, en ik zag een vluchtigheid onder de zon;", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Num 10:29": "Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.", "Spr 11:5-8": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid. De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid. Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Neh 2:20": "Toen gaf ik hun antwoord, en zei tegen hen: De God van de hemel, Hij zal het ons doen gelukken, en wij, Zijn dienaren, zullen opstaan en bouwen; maar u hebt geen deel, geen recht, en geen aandenken in Jeruzalem.", "1 Kor 15:26": "De laatste vijand die tenietgedaan wordt, is de dood.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Job 14:1": "De mens, uit een vrouw geboren, leeft maar kort en is vol onrust.", "Spr 16:17": "De weg van de oprechten is van het kwaad af te wijken; hij bewaart zijn ziel, die zijn weg bewaakt.", "Ps 86:11": "Leer mij, HEERE! Uw weg; ik zal in Uw waarheid wandelen; verenig mijn hart tot de vreze van uw Naam.", "Micha 6:13": "zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.", "2 Kor 4:9": "Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven;", "Job 15:20-24": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Spr 13:21": "Het kwaad zal de zondaars vervolgen; maar de rechtvaardige zal men met goed vergelden.", "Pred 9:4": "Want voor hem die zich bij alle levenden gevoegd heeft, is er hoop; want een levende hond is beter dan een dode leeuw.", "Ps 140:13": "Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Ps 27:5": "Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.", "1 Kor 6:12": "Alle dingen zijn mij toegestaan, maar niet alle dingen zijn nuttig; alle dingen zijn mij toegestaan, maar ik zal mij door niets onder de macht laten brengen.", "Ps 40:4": "En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.", "Ps 77:3-5": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden. Dacht ik aan God, dan maakte ik misbaar; peinsde ik, dan werd mijn ziel overstelpt. Sela. U hield mijn ogen wakend; ik was verslagen, en sprak niet.", "Ps 130:6": "Mijn ziel wacht op de Heere, meer dan de wachters op de morgen; de wachters op de morgen.", "Hand 23:6": "En omdat Paulus wist dat het ene deel bestond uit Sadduceeën en het andere uit Farizeeën, riep hij in de raad: Mannen broeders, ik ben een Farizeeër, de zoon van een Farizeeër; ik word beoordeeld om de hoop en opstanding van de doden.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "Kol 4:5": "Wandel met wijsheid bij hen die buiten zijn, en maak gebruik van elke gelegenheid.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Ps 119:134": "Verlos mij van de overlast van de mens, en ik zal Uw bevelen onderhouden.", "Matt 21:44": "En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.", "1 Kor 11:30-32": "Daarom zijn er onder u velen zwak en ziek, en velen slapen. Want als wij onszelf zouden oordelen, zouden wij niet geoordeeld worden. Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Ps 130:7": "Israël, hoop op de HEERE; want bij de HEERE is goedertierenheid, en bij Hem is veel verlossing.", "Ezech 5:8-17": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Jak 1:5": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden.", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Num 20:16": "Toen riepen wij tot de HEERE, en Hij hoorde onze stem, en Hij zond een Engel, en Hij leidde ons uit Egypte; en zie, wij zijn te Kades, een stad aan de rand van uw gebied.", "Ps 38:10": "Heere! Voor U is al mijn verlangen; en mijn zuchten is voor U niet verborgen.", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Ezech 24:14": "Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.", "Spr 11:19": "Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.", "Ps 33:22": "Uw goedertierenheid, HEERE! zij over ons, zoals wij op U hopen.", "Ps 86:7": "In de dag van mijn benauwdheid roep ik U aan, want Gij verhoort mij.", "Ps 139:18": "Zou ik ze tellen? Ze zijn meer dan het zand; word ik wakker, dan ben ik nog bij U.", "Neh 1:8-10": "Denk toch aan het woord, dat U Uw dienaar Mozes geboden hebt, en zei: Als u ontrouw wordt, zal Ik u onder de volken verstrooien. Maar als u zich tot Mij bekeert, en Mijn geboden houdt, en die doet; al waren uw verdrevenen aan het einde van de hemel, Ik zal hen vandaar verzamelen, en zal ze brengen naar de plaats die Ik gekozen heb om Mijn Naam daar te doen wonen. Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Job 23:6": "Zou Hij naar de grootheid van Zijn macht met mij twisten? Nee; maar Hij zou acht op mij slaan.", "Ps 32:4": "Want Uw hand was dag en nacht zwaar op mij; mijn sap veranderde in zomerdroogte. Sela.", "Ps 54:3-5": "O God! Verlos mij door Uw Naam, en doe mij recht door Uw macht. O God! Hoor mijn gebed; neig Uw oren tot de woorden van mijn mond. Want vreemden staan tegen mij op, en tirannen zoeken mijn ziel; zij stellen God niet voor hun ogen. Sela.", "Matt 11:23": "En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.", "Spr 21:12": "De rechtvaardige let verstandig op het huis van de goddeloze, als God de goddelozen in het kwaad stort.", "Ps 119:88": "Maak mij levend naar Uw goedertierenheid, dan zal ik de getuigenis van Uw mond onderhouden.", "Ps 31:10-14": "Wees mij genadig, HEERE! Want ik heb het benauwd; van verdriet is mijn oog doorknaagd, mijn ziel en mijn buik. Want mijn leven is verteerd van droefenis, en mijn jaren van zuchten; mijn kracht is vervallen door mijn ongerechtigheid, en mijn beenderen zijn doorknaagd. Vanwege al mijn wederpartijders ben ik, ook voor mijn buren, zeer tot een smaad geworden, en voor mijn bekenden tot een schrik; die mij op de straten zien, vluchten van mij weg.", "Spr 28:26": "Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "2 Kron 33:12": "En toen hij in nood verkeerde, zocht hij het aangezicht van de HEERE, zijn God, met ernst, en vernederde zich zeer voor het aangezicht van de God van zijn vaderen,", "1 Kron 5:20": "Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden.", "2 Sam 3:39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.", "Rom 8:38": "Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal,", "Ps 38:2-23": "O HEERE! Straf mij niet in Uw grote toorn, en straf mij niet in Uw grimmigheid. Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald. Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Spr 15:15": "Al de dagen van de bedrukte zijn kwaad; maar een vrolijk hart is een voortdurende maaltijd.", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "Dan 6:17": "Toen beval de koning, en zij brachten Daniël naar voren, en wierpen hem in de kuil van de leeuwen; en de koning antwoordde en zei tegen Daniël: Uw God, Die u voortdurend eert, Die verlost u!", "Ps 11:1": "Een psalm van David, voor de koorleider. Ik vertrouw op de HEERE; hoe zegt u tegen mijn ziel: Vlucht naar uw gebergte, als een vogel?", "Ps 55:20": "God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.", "Ps 143:3": "Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.", "Luk 2:25": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "2 Sam 15:31": "Toen liet men David weten, en zei: Achitofel is onder degenen die zich met Absalom hebben verbonden. Toen zei David: HEERE, maak toch de raad van Achitofel tot dwaasheid.", "2 Sam 16:11": "Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "Job 1:13-22": "Er was nu een dag, dat zijn zonen en zijn dochters aten en wijn dronken in het huis van hun broer, de eerstgeborene. Dat er een bode tot Job kwam en zei: De runderen waren aan het ploegen, en de ezelinnen weidden aan hun zijden. Doch de Sabeeërs deden een inval, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "Pred 2:21": "Want er is een mens wiens arbeid in wijsheid, in kennis en in bekwaamheid bestaat; en toch zal hij die overdragen als zijn deel aan een mens die daar niet aan gewerkt heeft. Dit is ook ijdelheid en een groot kwaad.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "Ps 144:10": "U, Die de koningen overwinning geeft, Die Zijn dienaar David bevrijdt van het boze zwaard;", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "Hos 9:15": "Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "Jes 10:3": "Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "Mark 13:9-23": "Maar let u zelf op; want zij zullen u overleveren aan de raadsvergaderingen, en aan de synagogen; u zult geslagen worden, en u zult voor stadhouders en koningen gebracht worden, omwille van Mij, hun tot een getuigenis. En het Evangelie moet eerst gepredikt worden onder alle volken. Maar wanneer zij u zullen wegleiden om u over te leveren, maak u dan niet vooraf bezorgd over wat u zult spreken, en bedenk het niet van tevoren; maar wat u in dat uur gegeven zal worden, spreek dat; want u bent het niet die spreekt, maar de Heilige Geest.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Ps 102:14": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen.", "Rom 14:8": "Want hetzij wij leven, wij leven voor de Heere; hetzij wij sterven, wij sterven voor de Heere. Hetzij wij dan leven, hetzij wij sterven, wij zijn van de Heere.", "Ps 19:15": "Laat de redenen van mijn mond, en de overdenking van mijn hart welgevallig zijn voor Uw aangezicht, o HEERE, mijn Rotssteen en mijn Verlosser!", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Ps 75:9": "Want in de hand van de HEERE is een beker, en de wijn is beroerd, vol van mengeling, en Hij schenkt daaruit; doch alle goddelozen van de aarde zullen zijn droesems drinken, terwijl ze die uitzuigen.", "Ps 90:4": "Want duizend jaren zijn in Uw ogen als de dag van gisteren, als hij voorbijgegaan is, en als een nachtwaak.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Jer 27:8": "En het zal gebeuren: het volk en het koninkrijk dat hem, Nebukadnezar, de koning van Babel, niet zal dienen, en dat zijn hals niet onder het juk van de koning van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.", "Ps 103:10": "Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "Rom 4:18": "Hij heeft tegen hoop op hoop geloofd, dat hij een vader van veel volken zou worden, volgens wat gezegd was: Zo zal uw nageslacht zijn.", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "2 Kon 19:19": "Nu dan, HEERE, onze God, verlos ons toch uit zijn hand; zo zullen alle koninkrijken van de aarde weten dat U, HEERE, alleen God bent.", "Ps 61:7": "U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;", "2 Tess 1:4": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Ps 119:74": "Die U vrezen, zullen mij aanzien, en zich verblijden, omdat ik op Uw woord gehoopt heb.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Ezech 43:13": "En dit zijn de maten van het altaar naar de ellen, waarbij de el een el en een handbreed is; de voet van een el, en een el de breedte; en zijn rand aan zijn zoom rondom een span; en dit is de rug van het altaar.", "Ps 119:82": "Mijn ogen zijn bezweken van verlangen naar Uw toezegging, terwijl ik zei: Wanneer zult U mij vertroosten?", "Ps 79:8": "Denk ons de vorige misdaden niet aan; haast U, laat Uw barmhartigheden ons tegemoetkomen; want wij zijn zeer zwak geworden.", "Ps 28:5": "Omdat zij niet letten op de daden van de HEERE, en ook niet op het werk van Zijn handen, zal Hij hen afbreken en niet meer opbouwen.", "1 Kor 16:13": "Waakt, staat vast in het geloof, houdt u mannelijk, weest sterk.", "Spr 12:6": "De woorden van de goddelozen zijn om op bloed te loeren; maar de mond van de oprechten zal ze redden.", "2 Kor 4:13": "Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;", "Spr 4:25": "Laat uw ogen recht vooruit zien, en uw oogleden zich recht voor u heen richten.", "Job 21:23": "De één sterft in de kracht van zijn volkomenheid, terwijl hij helemaal stil en gerust was;", "Spr 18:20": "Van de vrucht van ieders mond zal zijn buik verzadigd worden; hij zal verzadigd worden van de opbrengst van zijn lippen.", "Deut 11:26": "Zie, ik stel u heden voor: zegen en vloek:", "Hand 28:20": "Om deze reden dan heb ik u bij mij geroepen, om u te zien en aan te spreken; want vanwege de hoop van Israël ben ik met deze keten geboeid.", "1 Kor 9:26": "Ik loop dan zo, niet als op het onzekere; ik strijd zo, niet als iemand die de lucht slaat;", "Micha 7:20": "U zult Jakob de trouw, Abraham de goedertierenheid geven, die U onze vaderen van oude dagen af gezworen hebt.", "Ps 120:2": "O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong.", "2 Kor 11:23-30": "Zijn zij dienaars van Christus? (ik spreek als een onwijze) ik ben boven hen; in arbeid overvloediger, in slagen voortreffelijker, in gevangenissen overvloediger, in doodsgevaar menigmaal. Van de Joden heb ik veertig slagen min één, vijfmaal ontvangen. Driemaal ben ik met roeden gegeseld geweest, eens ben ik gestenigd, driemaal heb ik schipbreuk geleden, een hele nacht en dag heb ik in de diepte doorgebracht.", "Spr 3:11": "Mijn zoon! Verwerp de tucht van de HEERE niet, en word niet verdrietig over Zijn kastijding;", "1 Petr 5:8": "Wees nuchter en waakzaam; want uw tegenstander, de duivel, gaat rond als een brullende leeuw, op zoek naar wie hij zou kunnen verslinden.", "Jes 33:12": "En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.", "Spr 10:13": "In de lippen van de verstandige wordt wijsheid gevonden; maar op de rug van hem die zonder verstand is, de roede.", "Ps 9:6": "Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.", "Ps 119:151": "Maar U, HEERE! bent nabij, en al Uw geboden zijn waarheid.", "Ps 119:121-123": "Ain. Ik heb recht en gerechtigheid gedaan; geef mij niet over aan mijn onderdrukkers. Wees borg voor Uw knecht ten goede; laat de hoogmoedigen mij niet onderdrukken. Mijn ogen zijn bezweken van verlangen naar Uw heil, en naar de toezegging van Uw rechtvaardigheid.", "Openb 19:17-21": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Jer 44:23": "Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.", "Luk 18:1": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven,", "Job 34:15": "Alle vlees zou tegelijk de geest geven, en de mens zou tot stof terugkeren.", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Job 17:14": "Tot de groeve roep ik: U bent mijn vader! Tot het gewormte: Mijn moeder, en mijn zuster!", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Ps 79:4": "Wij zijn onze buren tot smaad geworden; een spot en schimp voor hen die rondom ons zijn.", "Deut 27:9": "Vervolgens sprak Mozes, samen met de Levitische priesters, tot heel Israël: Luister toe en hoor, o Israël! Op deze dag bent u het volk van de HEERE, uw God, geworden.", "Joh 7:34": "U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.", "Ps 119:133": "Maak mijn voetstappen vast in Uw Woord, en laat geen ongerechtigheid over mij heersen.", "Job 42:2": "Ik weet, dat U alles vermag, en dat geen van Uw gedachten kan afgesneden worden.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Micha 7:6": "Want de zoon veracht de vader, de dochter staat op tegen haar moeder, de schoondochter tegen haar schoonmoeder; iemands vijanden zijn zijn huisgenoten.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "2 Petr 1:19": "En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten.", "Pred 2:11": "Toen wendde ik mij tot al mijn werken die mijn handen gemaakt hadden, en tot de arbeid die ik met inspanning had verricht; zie, het was allemaal ijdelheid en kwelling van de geest, en daarin was geen voordeel onder de zon.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Richt 10:15": "Maar de Israëlieten zeiden tegen de HEERE: Wij hebben gezondigd; doe met ons naar alles wat goed is in Uw ogen; verlos ons toch alleen op deze dag!", "Ps 104:35": "De zondaars zullen van de aarde weggevaagd worden, en de goddelozen zullen niet meer zijn. Loof de HEERE, mijn ziel! Hallelujah!", "Jes 9:17": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook.", "Job 3:1-26": "Daarna opende Job zijn mond, en vervloekte zijn dag. Want Job antwoordde en zei: De dag verga, waarop ik geboren ben, en de nacht waarin men zei: Een knechtje is ontvangen.", "Ps 119:73": "Jod. Uw handen hebben mij gemaakt, en bereid; maak mij verstandig, opdat ik Uw geboden leer.", "Ps 31:15-19": "Maar ik vertrouw op U, o HEERE! Ik zeg: U bent mijn God. Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers. Laat Uw aangezicht over Uw knecht lichten; verlos mij door Uw goedertierenheid.", "Job 27:17": "Hij zal ze bereiden, maar de rechtvaardige zal ze aantrekken, en de onschuldige zal het zilver delen.", "Klaagl 1:7": "Zain. Jeruzalem is, in de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.", "Jes 26:21": "Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden.", "Matt 26:24": "De Zoon des mensen gaat wel heen, zoals over Hem geschreven is; maar wee die mens door wie de Zoon des mensen verraden wordt; het zou beter voor hem geweest zijn als die mens niet geboren was.", "Job 5:7": "Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen.", "Ps 102:3": "Verberg Uw aangezicht niet voor mij, neig Uw oor tot mij ten dage van mijn benauwdheid; ten dage als ik roep, verhoor mij haastig.", "Jer 17:18": "Laat mijn vervolgers beschaamd worden, maar laat mij niet beschaamd worden; laat hen verschrikt worden, maar laat mij niet verschrikt worden; breng over hen de dag van het kwaad, en verbreek hen met een dubbele verbreking.", "Joh 8:21": "Jezus zei dan weer tegen hen: Ik ga heen, en u zult Mij zoeken, en in uw zonden zult u sterven; waar Ik heenga, kunt u niet komen.", "Ps 90:12": "Leer ons zo onze dagen tellen, dat wij een wijs hart bekomen.", "Jer 14:8": "O Israëls Verwachting, Zijn Verlosser in tijd van benauwdheid! Waarom zou U zijn als een vreemdeling in het land, en als een reiziger die slechts inkeert om te overnachten?", "Ps 62:10": "Zeker, de gewone mensen zijn nietigheid, de aanzienlijke mensen zijn leugen; in de weegschaal gewogen, zouden zij samen lichter zijn dan de nietigheid.", "Ps 145:11": "Caph. Zij zullen de heerlijkheid van Uw Koninkrijk vermelden, en Uw macht zullen zij uitspreken.", "Ps 49:11": "Want hij ziet dat de wijzen sterven, dat samen een dwaas en een onverstandig mens omkomen, en hun bezit aan anderen nalaten.", "Pred 2:23": "Want al zijn dagen zijn smarten, en zijn bezigheid is verdriet; zelfs 's nachts vindt zijn hart geen rust. Dat is ook ijdelheid.", "Matt 27:46": "En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Kol 4:2-4": "Houd sterk aan in het gebed, en waak daarin met dankzegging; bid meteen ook voor ons, dat God ons de deur van het Woord opent, om de verborgenheid van Christus te spreken, waarvoor ik ook gebonden ben; opdat ik die openbaar maak, zoals ik moet spreken.", "Ps 106:18": "En een vuur brandde onder hun groep, een vlam stak de goddelozen in brand.", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Job 13:25": "Zult U een heen en weer gedreven blad verbrijzelen, en zult U een droge stoppel vervolgen?", "Luk 12:5": "Maar Ik zal u tonen voor wie u bang moet zijn: wees bang voor Hem, Die, nadat Hij gedood heeft, ook macht heeft om in de hel te werpen; ja, Ik zeg u, wees bang voor Hem!", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Job 34:14": "Als Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich verzamelen;", "Hand 27:25": "Daarom, houd moed, mannen, want ik geloof God, dat het zo zal zijn zoals het mij gezegd is.", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "Ps 11:6": "Hij zal op de goddelozen strikken doen regenen, vuur en zwavel; en een geweldige stormwind zal het deel van hun beker zijn.", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "Tit 3:7": "Opdat wij, gerechtvaardigd door Zijn genade, erfgenamen zouden worden naar de hoop van het eeuwige leven.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Ps 90:15": "Verblijd ons naar de dagen, waarin U ons gedrukt hebt, naar de jaren, waarin wij het kwaad gezien hebben.", "Deut 4:9": "Wacht u alleen, en let goed op uzelf, dat u niet vergeet wat uw ogen gezien hebben; en dat het niet uit uw hart wijkt, al de dagen van uw leven; en u zult het aan uw kinderen en uw kleinkinderen bekendmaken.", "Job 30:30": "Mijn huid is zwart geworden over mij, en mijn gebeente is ontstoken van dorheid.", "Matt 23:33": "Slangen, adde
