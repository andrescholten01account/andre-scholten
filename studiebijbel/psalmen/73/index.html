<style>

  /* verzen — tabsmodus (één kolom) */

  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }

  .vers:hover .kopieer { opacity: .75; }

","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn.","2":"Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden.","3":"Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag.","4":"Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.","5":"Zij zijn niet in de moeite zoals andere mensen, en worden niet met andere mensen geplaagd.","6":"Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.","7":"Hun ogen puilen uit van het vet; zij gaan de inbeeldingen van hun hart te boven.","8":"Zij mergelen de mensen uit, en spreken bos van verdrukking; zij spreken uit de hoogte.","9":"Zij zetten hun mond tegen de hemel, en hun tong gaat rond op de aarde.","10":"Daarom keert Zijn volk zich hierheen, als hun water uit een volle beker wordt uitgedrukt,","11":"Zodat zij zeggen: Hoe zou God het weten, en zou er kennis zijn bij de Allerhoogste?","12":"Zie, dezen zijn goddeloos; toch hebben zij rust in de wereld; zij vermeerderen hun vermogen.","13":"Zeker heb ik tevergeefs mijn hart gezuiverd, en mijn handen in onschuld gewassen.","14":"Want ik ben de hele dag geplaagd, en mijn straf is er elke morgen.","15":"Als ik zou zeggen: Ik zal ook zo spreken; zie, dan zou ik trouweloos zijn tegenover het geslacht van Uw kinderen.","16":"Toch heb ik erover nagedacht om dit te mogen begrijpen; maar het was moeite in mijn ogen;","17":"Totdat ik in Gods heiligdommen inging, en op hun einde lette.","18":"Zeker, U zet hen op gladde plaatsen; U doet hen vallen in verwoestingen.","19":"Hoe worden zij als in een ogenblik tot verwoesting, komen zij aan hun einde, gaan zij te niet van verschrikkingen!","20":"Als een droom na het ontwaken! Als U opwaakt, o Heere, dan zult U hun beeld verachten.","21":"Toen mijn hart verbitterd was, en ik in mijn nieren geprikkeld werd,","22":"Toen was ik redeloos, en wist niets; ik was een groot dier bij U.","23":"Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;","24":"U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.","25":"Aan wie heb ik behalve U *iets* in de hemel? Behalve U verlang ik ook niets op de aarde!","26":"Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.","27":"Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;","28":"Maar wat mij aangaat, het is mij goed om dicht bij God te zijn; ik stel mijn vertrouwen op de Heere HEERE, om al Uw werken te vertellen."},"SV":{"1":"Een psalm van Asaf. Immers is God Israël goed, dengenen, die rein van harte zijn.","2":"Maar mij aangaande, mijn voeten waren bijna uitgeweken ; mijn treden waren bijkans uitgeschoten.","3":"Want ik was nijdig op de dwazen, ziende der goddelozen vrede.","4":"Want er zijn geen banden tot hun dood toe, en hun kracht is fris.","5":"Zij zijn niet in de moeite *als* *andere* mensen, en worden met *andere* mensen niet geplaagd.","6":"Daarom omringt hen de hovaardij als een keten; het geweld bedekt hen *als* een gewaad.","7":"Hun ogen puilen uit van vet; zij gaan de inbeeldingen des harten te boven.","8":"Zij mergelen *de* *lieden* uit, en spreken boselijk van verdrukking; zij spreken uit de hoogte.","9":"Zij zetten hun mond tegen den hemel, en hun tong wandelt op de aarde.","10":"Daarom keert zich Zijn volk hiertoe, als hun wateren eens vollen *bekers* worden uitgedrukt,","11":"Dat zij zeggen: Hoe zou het God weten, en zou er wetenschap zijn bij den Allerhoogste?","12":"Ziet, dezen zijn goddeloos; nochtans hebben zij rust in de wereld; zij vermenigvuldigen het vermogen.","13":"Immers heb ik te vergeefs mijn hart gezuiverd, en mijn handen in onschuld gewassen.","14":"Dewijl ik den gansen dag geplaagd ben, en mijn straffing is er alle morgens.","15":"Indien ik zou zeggen: Ik zal ook alzo spreken; ziet, zo zou ik trouweloos zijn aan het geslacht Uwer kinderen.","16":"Nochtans heb ik gedacht om dit te mogen verstaan; *maar* het was moeite in mijn ogen;","17":"Totdat ik in Gods heiligdommen inging, *en* op hun einde merkte.","18":"Immers zet Gij hen op gladde plaatsen; Gij doet hen vallen in verwoestingen.","19":"Hoe worden zij als in een ogenblik tot verwoesting, nemen een einde, worden te niet van verschrikkingen!","20":"Als een droom na het ontwaken! Als Gij opwaakt, o Heere, *dan* zult Gij hun beeld verachten.","21":"Als mijn hart opgezwollen was, en ik in mijn nieren geprikkeld werd,","22":"Toen was ik onvernuftig, en wist niets; ik was een groot beest bij U.","23":"Ik zal dan geduriglijk bij U zijn; Gij hebt mijn rechterhand gevat;","24":"Gij zult mij leiden door Uw raad; en daarna zult Gij mij *in* heerlijkheid opnemen.","25":"Wien heb ik *nevens* *U* in den hemel? Nevens U lust mij ook niets op de aarde!","26":"Bezwijkt mijn vlees en mijn hart, zo is God de Rotssteen mijns harten, en mijn Deel in eeuwigheid.","27":"Want ziet, die verre van U zijn, zullen vergaan; Gij roeit uit, al wie van U afhoereert;","28":"Maar mij aangaande, het is mij goed nabij God te wezen; ik zet mijn betrouwen op den Heere HEERE, om al Uw werken te vertellen."},"KJV":{"1":"[[A Psalm of Asaph.]] Truly God *is* good to Israel, *even* to such as are of a clean heart.","2":"But as for me, my feet were almost gone; my steps had well nigh slipped.","3":"For I was envious at the foolish, *when* I saw the prosperity of the wicked.","4":"For *there are* no bands in their death: but their strength *is* firm.","5":"They *are* not in trouble *as other* men; neither are they plagued like *other* men.","6":"Therefore pride compasseth them about as a chain; violence covereth them *as* a garment.","7":"Their eyes stand out with fatness: they have more than heart could wish.","8":"They are corrupt, and speak wickedly *concerning* oppression: they speak loftily.","9":"They set their mouth against the heavens, and their tongue walketh through the earth.","10":"Therefore his people return hither: and waters of a full *cup* are wrung out","11":"And they say, How doth God know? and is there knowledge in the most High?","12":"Behold, these *are* the ungodly, who prosper in the world; they increase *in* riches.","13":"Verily I have cleansed my heart *in* vain, and washed my hands in innocency.","14":"For all the day long have I been plagued, and chastened every morning.","15":"If I say, I will speak thus; behold, I should offend *against* the generation of thy children.","16":"When I thought to know this, it *was* too painful for me;","17":"Until I went into the sanctuary of God; *then* understood I their end.","18":"Surely thou didst set them in slippery places: thou castedst them down into destruction.","19":"How are they *brought* into desolation, as in a moment! they are utterly consumed with terrors.","20":"As a dream when *one* awaketh; *so*, O Lord, when thou awakest, thou shalt despise their image.","21":"Thus my heart was grieved, and I was pricked in my reins.","22":"So foolish *was* I, and ignorant: I was *as* a beast","23":"Nevertheless I *am* continually with thee: thou hast holden *me* by my right hand.","24":"Thou shalt guide me with thy counsel, and afterward receive me *to* glory.","25":"Whom have I in heaven *but thee*? and *there is* none upon earth *that* I desire","26":"My flesh and my heart faileth: *but* God *is* the strength of my heart, and my portion for ever.","27":"For, lo, they that are far from thee shall perish: thou hast destroyed all them that go a whoring","28":"But *it is* good for me to draw near to God: I have put my trust in the Lord GOD, that I may declare all thy works."}},"tsk":{"1":[{"kopje":"Zeker","refs":["Ps 2:6","Ps 42:12"]},{"kopje":"God","refs":["Ps 73:18-28","Ps 84:12","Jes 63:7-9","Luk 12:32"]},{"kopje":"voor hen","refs":["Joh 1:48","Rom 2:28","Rom 2:29","Rom 4:16","Rom 9:6","Rom 9:7"]},{"kopje":"van hart","refs":["Ps 51:12","Jer 4:14","Matt 5:8","Tit 3:5","Jak 4:8"]}],"2":[{"kopje":"Maar","refs":["Ps 5:8","Ps 17:15","Ps 35:13","Joz 24:15","1 Sam 12:23","1 Kron 22:7","Job 21:4"]},{"kopje":"voeten","refs":["Ps 116:8","1 Sam 2:9","Rom 7:23","Rom 7:24"]},{"kopje":"schreden","refs":["Ps 17:5","Ps 38:17","Ps 94:18","Job 12:5"]}],"3":[{"kopje":"ik was","refs":["Ps 37:1","Ps 37:7","Job 21:7","Spr 3:31","Spr 24:1","Jer 12:1","Jak 4:5"]}],"4":[{"kopje":"geen","refs":["Ps 17:14","Job 21:23","Job 21:24","Job 24:20","Pred 2:16","Pred 7:15","Luk 16:22"]},{"kopje":"fris","refs":["Ps 17:10"]}],"5":[{"kopje":"Zij zijn","refs":["Ps 73:12","Job 21:6","Spr 3:11","Spr 3:12","Jer 12:1","Jer 12:2","1 Kor 11:32","Hebr 12:8","Openb 3:19"]}],"6":[{"kopje":"Daarom","refs":["Deut 8:13","Deut 8:14","Deut 32:15","Est 3:1","Est 3:5","Est 3:6","Est 5:9-11","Job 21:7-15","Pred 8:11","Jer 48:11","Jer 48:29","Ezech 28:2-5","Dan 4:30"]},{"kopje":"als een keten","refs":["Richt 8:26","Spr 1:9","Hoogl 4:9","Jes 3:19","Ezech 16:11"]},{"kopje":"het geweld","refs":["Spr 3:31","Spr 4:17","Micha 2:1","Micha 2:2","Micha 3:5","Jak 5:4-6"]},{"kopje":"bedekt","refs":["Ps 109:18","Ps 109:29","1 Petr 5:5"]}],"7":[{"kopje":"ogen","refs":["Ps 17:10","Ps 119:70","Job 15:27","Jes 3:9","Jer 5:28","Ezech 16:49"]},{"kopje":"puilen uit","refs":["Ps 73:12","Ps 17:14","1 Sam 25: 9\">despise</span> their image.","21":"Thus my <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> was <span class=\"wl wl-kjv\" data-code=\"H2556\">grieved,</span> and I was <span class=\"wl wl-kjv\" data-code=\"H8150\">pricked</span> in my reins.","22":"So <span class=\"wl wl-kjv\" data-code=\"H1198\">foolish</span> was I, and <span class=\"wl wl-kjv\" data-code=\"H3045\">ignorant:</span> I was as a beast","23":"Nevertheless I am <span class=\"wl wl-kjv\" data-code=\"H8548\">continually</span> with thee: thou hast <span class=\"wl wl-kjv\" data-code=\"H270\">holden</span> me by my <span class=\"wl wl-kjv\" data-code=\"H3225\">right</span> hand.","24":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H5148\">guide</span> me with thy <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> me to glory.","25":"Whom have I in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> but thee? and there is none upon <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> that I desire","26":"My <span class=\"wl wl-kjv\" data-code=\"H7607\">flesh</span> and my <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H3615\">faileth:</span> but <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is the <span class=\"wl wl-kjv\" data-code=\"H6697\">strength</span> of my <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and my <span class=\"wl wl-kjv\" data-code=\"H2506\">portion</span> for ever.","27":"For, lo, they that are <span class=\"wl wl-kjv\" data-code=\"H7369\">far</span> from thee shall <span class=\"wl wl-kjv\" data-code=\"H6\">perish:</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H6789\">destroyed</span> all them that go a whoring","28":"<span class=\"wl wl-kjv\" data-code=\"H589\">But</span> it is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> for me to draw <span class=\"wl wl-kjv\" data-code=\"H7132\">near</span> to <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> I have <span class=\"wl wl-kjv\" data-code=\"H7896\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H4268\">trust</span> in the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H5608\">declare</span> all thy works."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Asaf","tekst":"Zie Psa 50:1 ."},{"catchword":"Immers","tekst":"Of, evenwel, nochtans, zekerlijk. Met deze woorden breekt de profeet uit, nadat hij een zwaren inwendigen strijd en aanvechting, vanwege der goddelozen tijdelijk geluk, overwonnen had. Verg. Psa 62:2 ."},{"catchword":"die rein","tekst":"Dat is, den rechten Israëlieten, niet die zonder zonde zijn, [ Pro 20:9 ] , maar die Hem met een oprecht geloof en ongeveinsde godzaligheid dienen. Zie Joh 1:48 ; Act 15:9 ; Rom 9:6 , Rom 9:8 ; 1Jo 3:3 ."}],"2":[{"catchword":"mijn voeten","tekst":"Anders, ik was bijna uitgeweken met mijne voeten."}],"3":[{"catchword":"dwazen,","tekst":"Zie van het Hebr. woord Psa 5:6 ."},{"catchword":"vrede","tekst":"Dat is, tijdelijk geluk en voorspoed."}],"4":[{"catchword":"banden","tekst":"Of, knopen; dat is, zij hebben gene kwellingen van krankten en lichamelijke zwakheden, waardoor de mens als gebonden en belet wordt in zijn handel en wandel. Sommigen houden het voor ene gelijkenis, genomen van de grove sterke draden, die in het weven effen en onverbroken aflopen, zodat men ze niet behoeft te knopen of te binden. Alzo loopt het leven van vele goddelozen effen door, zonder grote strubbeling, tegenstoot of hindernis."},{"catchword":"tot hun","tekst":"Anders, in hunnen dood; dat is, zij sterven een zachten en gemakkelijken dood. Zie Job 21:13 ."},{"catchword":"fris","tekst":"Dat is, lustig, gezond zijn zij. [Zie Job 21:23-24 ] . Hebr. vet, gezond. Anders, hun portaal is sterk."}],"5":[{"catchword":"mensen","tekst":"Hebr. in de moeite des mensen, en zo terstond wederom. Hier worden twee woorden Enos en Adam [beide betekenende mens ] gebruikt, waarvan het eerste ziet op de sterflijkheid en ellendigheid, het andere op den oorsprong des lichaams van de aarde."}],"6":[{"catchword":"omringt","tekst":"Voor deze woorden, omringt hen als een keten, is in het Hebreeuws een woord, betekenende zoveel alsof men zeide, ketent hen; dat is, is hun in plaats van een keten, omgehangen sieraad, gouden halsband. Of, zij zijn met hovaardij rondom behangen gelijk een keten rondom den hals gaat."},{"catchword":"gewaad","tekst":"Of, pronkkleed. Het Hebreeuwse woord wordt Pro 7:10 , gebruikt van het kleed ener overspeelster, en schijnt de betekenis te hebben van een welzittend, welpassend, sierlijk kleed; alzo pronken de goddelozen met overlast en geweld, alsof zij hun sieraad en opschik waren. Zie het tegendeel Job 29:14 ."}],"7":[{"catchword":"puilen","tekst":"Hebr. gaat uit; te weten, elk oog. Verg. Job 15:27 ."},{"catchword":"gaan de","tekst":"Dat is, het gaat hun beter dan zij zichzelven hadden ingebeeld; of de inbeeldingen huns harten gaat voort, of zij bedrijven meer kwaad dan iemands hart zou kunnen bedenken. Verg. Jer 5:28 ."}],"8":[{"catchword":"mergelen","tekst":"Of, doen [de mensen] uitteren, of smelten, door allerlei overlast en trots, gelijk de volgende woorden verklaren. Het Hebr. woord wordt alleen hier alzo gevonden en daarom verscheidenlijk overgezet."},{"catchword":"boselijk","tekst":"Hebr. in, of, met het boze, of boosheid."},{"catchword":"hoogte","tekst":"Voerende overal [gelijk men zegt] het hoogste woord, willende van niemand tegengesproken zijn. Verg. Psa 12:5 ."}],"9":[{"catchword":"Zij zetten","tekst":"Dat is, zij lasteren onbeschroomd zowel God en alle goddelijke zaken als de mensen. Verg. Rev 13:6 , alzo wordt door den hemel God verstaan; Dan 4:26 ; Luk 15:18 ."}],"10":[{"catchword":"zijn volk","tekst":"Te weten, Gods, van welken in het eerste vers van dezen psalm en in het naastvolgende gesproken wordt. De zin is dat de vromen, overdenkende hun groot kruis en daarentegen der goddelozen voorspoed, met deze gedachten bestreden worden. Of ook God op de menselijke zaken acht zou nemen."},{"catchword":"bekers","tekst":"Of, bekkens; dat is, lijden wordt hun in een volle en overvloeiende maat toegedeeld, alsof men water in een bekken of beker voor iemand uit iets, dat vol vochtigheid is, uitwrong of uitdrukte. Zie 2Sa 22:17 ; Psa 11:6 . Of, men kan door de wateren hier verstaan tranen; uit vergelijking van Psa 42:4 , en Psa 80:6 ; alsof de profeet zeide: een beker vol tranen."}],"12":[{"catchword":"hebben","tekst":"Heb [zij zijn] de gerusten, of vrede hebbenden der wereld, of der eeuw, of eeuwigheid; dat is, die den vrede, [verg. Joh 14:27 ] of het geluk dezer wereld genieten, of hun levenlang in rust, gemak en weelde zitten en gans zorgeloos leven. Van zulk een gebruik des woords, [eeuwigheid] zie Deu 15:17 , en verg. met deze klacht Jer 12:1-2 ."},{"catchword":"vermogen","tekst":"Dat is, rijkdom, gelijk Deu 8:17-18 ; Rth 2:1 ; 2Ki 5:1 ."}],"13":[{"catchword":"Immers","tekst":"Woorden van den profeet in zijnen strijd."},{"catchword":"hart","tekst":"Zie vs.1."},{"catchword":"handen","tekst":"Zie Psa 26:6 ."}],"14":[{"catchword":"alle morgen","tekst":"Hebr. in de morgenstonden; dat is, alle morgen, of vroeg. Alzo Job 7:18 ; Psa 101:8 ; Isa 33:2 ; Lam 3:23 ."}],"15":[{"catchword":"zeggen","tekst":"Dit kan men nemen voor zeggen bij zichzelven; dat is, denken, gelijk elders dikwijls."},{"catchword":"alzo","tekst":"Dat is, ik zal deze plaag de overhand in mij laten nemen, mijn vlees bijvallen, en voortaan de vromen bij openlijke uitspraak verdoemen en de goddelozen prijzen."},{"catchword":"geslacht","tekst":"Dat is, aan de ganse menigte der vromen, uw ganse kerk, ook genoemd het geslacht der rechtvaardigen, of het rechtvaardige geslacht; Psa 14:5 . Hij wil zeggen dat hij de kerk Gods grotelijks zou verongelijken en zich grovelijk aan hen en God zelven vergrijpen, mits die om des kruises wil verdoemende. Van het Hebreeuwse woord, dat voor geslacht genomen wordt, zie Psa 12:8 ."}],"16":[{"catchword":"ogen","tekst":"Dat is, deze zaak, van het kruis der vromen en het geluk der goddelozen, scheen mij te zwaar om te begrijpen, ik kon mij daarin niet onderrichten. Zie Job 18:3 ."}],"17":[{"catchword":"heiligdommen","tekst":"Versta, Gods woord en de plaats waar Gods volk bijeenkomt en zijn woord verhandeld, geleerd en onderzocht wordt."},{"catchword":"einde","tekst":"Hebr. achterste, laatste, uiterste; dat is, hoe de goddelozen ten laatste varen zullen, gelijk Deu 32:20 , Deu 32:29 , enz."}],"18":[{"catchword":"gladde","tekst":"Eene gelijkenis, genomen van slibberige wegen, waarop men niet vast gaat en lichtelijk komt te vallen."},{"catchword":"verwoestingen","tekst":"Of, verstoringen. Eigenlijk die met groot gedruis en onstuimigheid overvallen."}],"20":[{"catchword":"droom","tekst":"Dat is, al hun geluk, voorspoed, weelde en wellust verdwijnt in der haast, gelijk een droom wanneer men wakker wordt; zie Job 20:8-9 ; Isa 29:7-8 ."},{"catchword":"opwaakt,","tekst":"Dat is, U gereedmaakt tot hunne straf, Gij die tevoren scheent te slapen en hunne boosheid niet te zien. Alzo Psa 35:23 , enz. Anders, als Gij [hen] opwekt; te weten, ten jongsten dage."},{"catchword":"beeld","tekst":"Dat is, al hun vergankelijk geluk, heerlijkheid en glans. Verg. Psa 39:7 , en 1Co 7:31 . Dit kan men wijders ook duiden op de eeuwige smaadheid der goddelozen, die zij lijden zullen na de opstanding uit de doden; zie Dan 12:3 ."}],"21":[{"catchword":"opgezwollen","tekst":"Of, opliep, als een zuurdeeg; waarvan het Hebr. woord eigenlijk gebruikt wordt. Dat is, als ik zo onrustig, verdrietig en toornig was over het geluk der goddelozen."},{"catchword":"nieren","tekst":"Dat is, heftiglijk bewogen werd, of mijne bewegingen zeer scherp waren. Zie Job 19:27 ."}],"22":[{"catchword":"onvernuftig","tekst":"Als een overnuftig dier. Zie Psa 49:11 ."},{"catchword":"groot","tekst":"Dat is, zeer beestelijk. Hebr. behemoth; dat is, beesten. Welk woord gebruikt wordt Job 40:10 , naar sommiger gevoelen, van den olifant. De zin is: Ik mocht met recht bij U gehouden worden zo onverstandig en beestelijk als de beesten zelf."}],"23":[{"catchword":"bij U","tekst":"Dat is, mij aan U houden en mij in uw wijze en heilige regering geruststellen."},{"catchword":"rechterhand","tekst":"Dat is, mij in mijn onverstand en zwaren strijd bewaard en ondersteund, dat ik niet ben afgeweken. Zie boven, vs.2."}],"24":[{"catchword":"raad","tekst":"Dat is, door uw Heiligen Geest, mitsgaders uw vaderlijke voorzorg en regering."},{"catchword":"heerlijkheid","tekst":"Verg. deze manier van spreken met 1Ti 3:16 , en Heb 3:10 ; idem 1Th 4:17 ."}],"25":[{"catchword":"Wien","tekst":"Of, wie is er voor mij; te weten, benevens U; welke woorden, in het volgende lid gesteld, hiertoe ook behoren. Hij wil zeggen dat hij in den hemel niemand heeft, dien hij aanroept en op wien hij vertrouwt dan God."},{"catchword":"lust","tekst":"Om daarin mijn genoegen te stellen, of mij daarop te vertrouwen. De profeet wil zeggen dat God zijn enig en opperste goed is, hetwelk hebbende, hij ten volle tevreden is."}],"26":[{"catchword":"vlees","tekst":"Dat is, lijf en ziel, gelijk Psa 84:3 ."},{"catchword":"rotssteen","tekst":"Dat is, op welken mijn hart vertrouwt, als mijn sterkte en toevlucht. Zie Deu 32:4 ."},{"catchword":"deel","tekst":"Verg. Psa 15:5-6 ."}],"27":[{"catchword":"verre","tekst":"Die gene gemeenschap met U hebben, of zich ver van U houden."},{"catchword":"van U afhoereert","tekst":"Dat is, geestelijke hoererij of overspel bedrijft, iets anders liever hebbende dan U. Zie Lev 17:7 ."}],"28":[{"catchword":"nabij","tekst":"Hebr. naheid, of nadering Gods; dat is, tot God, gelijk Isa 58:2 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A Psalm of Asaph. [See Psa.50.on v.1.] Sure God is good to Israel; [or yet however, nevertheless, assuredly, &c. Thus the Prophet breaketh out, after that he had overcome a heavy inward combat and temptation by reason of the wickeds temporal prosperity. Compare Psa 62:2.] to those that are pure of heart. [i.e. to the true but such as do serve God with an upright faith, and godliness unfeigned. See Joh 1:48. Act 15:9. Rom 9:6,8. 1Jn 3:3.]"}],"2":[{"catchword":null,"tekst":"But as for me,. My feet had almost turned out, [Oth. I was (or had) almost turned out with my feet] my steps were even shot forth."}],"3":[{"catchword":null,"tekst":"For I envied the foolish, [Job 21,7, &c. Psa 37:1. Jer 12:1,2. See of the Hebrew word Psa.5.on v.6. seeing the peace of the wicked. [i.e. their temporal welfare and prosperity.]"}],"4":[{"catchword":null,"tekst":"For there are no bonds [Or knots, i.e. they have or feel no pains of sicknesses, or bodily infirmities, whereby a man comes to be bound, or tied and hindered from going about his affairs. Some do hold it to be a similitude taken from the courser sort of yarn or thread, which run smoothly all the loom over without breaking, so that one need not bind or knit them together again, so in like manner doth the life of the wicked pass smoothly away, without any great rub, adversity or impediment] until their death, [Oth. In their death, i.e. they die an easy gentle death. See Job 21:13.] and their vigour (or power) is fresh. [i.e. they are healthy and lively, see Job 21:23,24.) Heb. Fat, healthy. Oth. Their portal is strong.]"}],"5":[{"catchword":null,"tekst":"They are not in toil as (other) men [Heb. In the toil of man; and so again presently. Here two words are used one after another Enosh and Adam, both signifying man, whereof the former hath regard to the mortality, and wretchedness of man, the other to the original of his body made earth.] and are not plagued with (other) men."}],"6":[{"catchword":null,"tekst":"Therefore doth pride encompass them as a chain: [Heb. Chain them, i.e. is instead of a chain to them, hanging about them like an ornament, or golden collar, and chain about their neck; or they are hung round about with pride, even as a chain goeth round about the neck.] Violence covereth them (as) a garment [or, gay apparel. The Hebrew word is used Pro 7:10. for the garment of an adulteress, and seems to have its denomination from sitting, or sitting well and comely to the body. So the wicked brave it with violence and oppression, as if it were their gallantry and ornament. See the contrary Job 29:14.]"}],"7":[{"catchword":null,"tekst":"Their eyes butt out of fatness, [Heb. Goeth forth, each eye namely. Compare Job 15:27.] they go above the imaginations of the heart. [i.e. it fareth better with them, then they could have imagined; or, the imaginations of their heart to proceed; or, they practise more (mischief) than any ones heart could imagine. Compare Jer 5:28.]"}],"8":[{"catchword":null,"tekst":"They tire out (men,) [Or, consume, waste, or melt (men) by all manner of oppression and insolence, as the following words declare. The Hebrew word is found no where thus but here, and therefore diversly rendered] and speak evil [Heb. In, or, with evil or malice] of oppression, and whom none must gainsay, compare Psa 12:5.]"}],"9":[{"catchword":null,"tekst":"They set their mouth against heaven: their tongue walketh upon the earth. [i.e. they speak and rail as well against God, and all divine things, as against men. Compare Revel.13.6. thus God is likewise understood by heaven Dan.4.verse 26. Luk 15:18.]"}],"10":[{"catchword":null,"tekst":"Therefore his people turneth hither; [Gods people namely, of whom the first verse of this Psalm, and sequel here speaketh. The sence is, that the godly considering their great crosses on the one, and the prosperity of the wicked on the otherside, they are troubled with these thoughts, whether God indeed have any care of human things] when waters of a full (cup) are wrung out unto them. [cup, or bason. Afflictions being in such abundant manner measured out unto them, as if one squeezed or wrung out water out of some moist or sappy matter into a bason or beaker. See Psalm 11.on v.6. 2 Sam.22.verse 17. Or by the waters may be here be understood tears, by comparing Psa 80:6. and 42.4. as if the Prophet had said, A cup full of tears.]"}],"11":[{"catchword":null,"tekst":"That they say; How should God know, and there be knowledge with the most high?"}],"12":[{"catchword":null,"tekst":"Behold these are wicked, nevertheless they have rest in the world, [Heb. They are the quiet, or peaceful of the world, or, of the age, or eternity, i.e. such or those that enjoy peace (compare Joh 14:27.) or the luck and success of this world; or that are rest, and possessed of ease and prosperity all their life time, and live in all security. Of this use of the word eternity, See Deut.15.on v.17.] and compare with this complaint Jer.12.v.1,2.] they multiply the substance. [i.e. their riches, as Deu 8:17,18. Ruth 2 verse 1.2. Kings 5.1.]"}],"13":[{"catchword":null,"tekst":"Sure in vain have I cleansed my heart: [The words of the Prophet. See above on verse 1.] and washed mine hands in innocency: [See Psalm 26.on verse 6.]"}],"14":[{"catchword":null,"tekst":"Because I am afflicted all the day, and my correction it every morning [Heb. In the morning hours, i.e. every morning, or very early still. So Job 7:18. Psa 101:8. Isa 33:2. Lamentations 3.23.]"}],"15":[{"catchword":null,"tekst":"If I should say; [This may be taken for thinking or saying with ones self, as it is frequently used .] I shall likewise speak thus; [i.e. I shall give way to this tentatio to prevail over me, so that I yield to my flesh, and openly henceforth pronounce the godly unhappy and praise the ungodly] behold, then should I be unfaithful to praise the ungodly] behold, then should I be unfaithful to the generation of thy children. [i.e. to all the Godly in general, thy universal Church, elsewhere also called the generation of the righteous, or, the righteous generation, Psa 14:5. implying that he should greatly wrong the Church of God, and greatly trespass against both them and God himself, by condemning them, by reason of their affliction. Of the Hebrew word, rendered generation, see Psalm 12.on v.8.]"}],"16":[{"catchword":null,"tekst":"Nevertheless I mused for to understand this: (but) it was toil (or, toilsome) in mine eyes: [This business about the cross of the godly and the speed of the wicked, seemed too difficult for my apprehension, I was not able to extricate my doubts about it. See Job 18.on verse 3.]"}],"17":[{"catchword":null,"tekst":"Till I entered into Gods sanctuaries; [Understand the word of God, and the place also, where Gods people assembleth together, and his word is handled, taught and searched into] and marked their end. [Heb. Hindermost, last, utmost, i.e. how it fareth with the wicked at their latter end, as Deuteronomy 32.verse 20,29. &c.]"}],"18":[{"catchword":null,"tekst":"Sure thou settest them upon smooth places, [A comparison taken from slippery ways, where there is no sure footing, and one may easily get a fall.] thou causeth them to fall into desolations. [or destructions, properly such as fall out with a great deal of noise and impetuosity.]"}],"19":[{"catchword":null,"tekst":"How do they become a desolation, as in a moment! Take an end, are consumed of frightings."}],"20":[{"catchword":null,"tekst":"Like unto a dream, after waking: [i.e. all their speed prosperity, ease and pleasure doth vanish on a sudden, like unto a dream, to him that awaked. See Job 20:8,9. Isa 29:7,8.] when thou awakes, O LORD [i.e. doest prepare thy self to punish them, when as before thou didst seem to sleep, and not to see their wickedness; See Psa 35:23, &c. Oth. When thou raisest, or awakenest (them,) viz. At the last day to judgement.] (then) shalt thou despised their image. [i.e. all their fading and transitory prosperity, luster and glory. Compare 1 Cor.7.31. et Psa 39:7, this may also have relation to the everlasting confusion of the wicked, which they are to undergo, after the resurrection from the dead. See Dan.12.2.]"}],"21":[{"catchword":null,"tekst":"When my heart was swelled up, [Or, rose up, like leaven, as the word doth properly imply in the Hebrew, i.e. when I was thus disquieted, vexed and angered with the prosperity of the wicked] and I was pricked in my reins. [i.e. mightily provoked to passion, or when my passions were most sharp and vehement. See Job 19:27.]"}],"22":[{"catchword":null,"tekst":"Then was I senceless, [Like unto brute animals see Psalm 49.on verse 11.] and knew nothing: I was a great beast with thee. [i.e. very bruitish, or beastly Heb. Behemoth, i.e. Beasts, which word is used Job 40:10. as some conceive of the Elephant; the meaning is, I might justly be accounted as brutish and beastly by thee, as the beasts themselves are.]"}],"23":[{"catchword":null,"tekst":"Now shall I be continually with thee: [i.e. cleave close unto, and rest satisfied with thy wise and holy government] thou hast taken hold of my right hand.[i.e. preserved and supported me, in my senceless, that I turned not aside. See above verse 2.]"}],"24":[{"catchword":null,"tekst":"Thou shalt guide me by thy counsel: [By thy word and holy Spirit, together with thy fatherly providence and government.] and after take me up in glory [Comp. This kind of speaking with 1 Tim.3.16. & Heb 2:10. item 1 Thess.4.17.]"}],"25":[{"catchword":null,"tekst":"Whom have I (besides thee) in heaven? [Or who is there for me, viz. Besides thee, which words being expressed in the sequel, are likewise to be applied to this antecedent; the prophet implying that he had none in heaven, to call upon and trust unto but God.] besides thee also I desire (or long for) nothing upon earth. [viz. So as to rest satisfied therein, or to rely upon it; God, would he say, was his onely and chiefest good, which having once obtained, he had all his hearts desire fulfilled.]"}],"26":[{"catchword":null,"tekst":"If my flesh and my heart [i.e. my body and soul, as Psalm.84.3.] faint, God is the rock of my heart, [i.e. he in whom my heart doth trust, as my best strength and refuge. See Deut.32.on v.4.] and my portion in eternity forever. [comp. Psalm.16.on v.5,6.]"}],"27":[{"catchword":null,"tekst":"For loe, those that are far from thee, [That have no communion with thee, or continue at distance from thee.] shall perish: thou destroyest every one that goeth a whoring from thee. [commiting spiritual whoredom or adultery, and loving any other thing more then thee. See Levit.17.on verse 7.]"}],"28":[{"catchword":null,"tekst":"But as for me: it is good for me to be neer God: [Heb. Neerness, or drawing neer approaching of God, i.e. unto God, as Isa 58:2.] I put my trust upon the Lord LORD; for to relate (or recount) all thy works."}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
// vanuit een rechtsklik-vertaalmenu (elders) kan de link ?vert=SV meegeven om
// meteen die vertaling te tonen, i.p.v. altijd terug te vallen op SVnu.
const _vertParam = new URLSearchParams(location.search).get('vert');
if (_vertParam && D.vertalingen[_vertParam]) vertaling = _vertParam;
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =

    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
