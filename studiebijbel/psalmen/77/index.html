ik ben verzadigd van schande, maar zie mijn ellende aan.","Ps 6:8":"Mijn oog is doorknaagd van verdriet, is verouderd, vanwege al mijn tegenstanders.","Mal 3:4":"Dan zal het spijsoffer van Juda en Jeruzalem de HEERE zoet zijn, zoals in de oude dagen, en zoals in de vorige jaren.","Jes 44:3":"Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.","Ps 66:7":"Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.","Jes 46:10":"Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.","Hebr 10:34":"Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.","Ps 31:2-5":"Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid. Neig Uw oor tot mij, red mij haastig; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden. Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.","Job 11:10":"Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?","1 Kor 11:27":"Zo dan, wie onwaardig dit brood eet, of de drinkbeker van de Heere drinkt, die zal schuldig zijn aan het lichaam en bloed van de Heere.","Ps 118:17":"Ik zal niet sterven, maar leven; en ik zal de werken van de HEERE vertellen.","Rom 8:39":"Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.","Jes 55:6":"Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.","Ps 94:1-23":"O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend! Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen. Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?","Ps 27:11":"HEERE, leer mij Uw weg, en leid mij op het rechte pad, omwille van mijn verspieders.","1 Kon 8:3-11":"En al de oudsten van Israël kwamen; en de priesters namen de ark op. En zij brachten de ark van de HEERE en de tent van de samenkomst omhoog, alsook alle heilige voorwerpen die in de tent waren; en de priesters en de Levieten brachten die omhoog. De koning Salomo nu en de hele gemeente van Israël, die bij hem vergaderd waren, waren met hem voor de ark, terwijl zij schapen en runderen offerden, die vanwege de menigte niet te tellen en niet te berekenen waren.","Ps 65:8":"Die het bruisen van de zeeën stilt, het bruisen van haar golven, en het rumoer van de volken.","Ps 42:5":"Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.","Klaagl 3:17":"Vau. En U hebt mijn ziel ver van de vrede verstoten, ik heb het goede vergeten.","Ps 91:2-13":"Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw! Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie. Hij zal u dekken met Zijn vlerken, en onder Zijn vleugels zult u vertrouwen; Zijn waarheid is een schild en beukelaar.","Matt 15:22-28":"En zie, een Kananese vrouw, die uit die omgeving kwam, riep tot Hem en zei: Heere! U Zoon van David, ontferm U over mij! mijn dochter is ernstig door de duivel bezeten. Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na. Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.","Jer 14:22":"Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.","Ps 71:21":"Gij zult mijn grootheid vermeerderen, en mij rondom vertroosten.","Jes 56:7":"Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.","Hand 4:18-20":"En zij riepen hen en zeiden hun aan, dat zij helemaal niet meer zouden spreken, noch leren, in de Naam van Jezus. Maar Petrus en Johannes antwoordden hun: Oordeelt u zelf, of het recht is voor God, meer naar u te luisteren dan naar God. Want wij kunnen niet nalaten te spreken over wat wij gezien en gehoord hebben.","Klaagl 1:20":"Resch. Zie, HEERE, want mij is bang; mijn ingewand is beroerd, mijn hart heeft zich omgekeerd in het binnenste van mij, want ik ben zeer opstandig geweest; van buiten heeft mij het zwaard van kinderen beroofd, van binnen is het als de dood.","Jes 52:9":"Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.","2 Kron 5:13":"het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.","Openb 3:19":"Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.","Ps 79:9":"Help ons, o God van ons heil! Vanwege de eer van Uw Naam; en red ons, en doe verzoening over onze zonden, om Uw Naam.","Job 38:37":"Wie kan de wolken met wijsheid tellen, en wie kan de flessen van de hemel neerleggen?","Ps 143:8":"Doe mij Uw goedertierenheid in de morgenstond horen, want ik vertrouw op U; maak mij de weg bekend die ik moet gaan, want ik hef mijn ziel tot U op.","Ps 63:7":"Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.","Deut 32:39":"Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!","2 Kron 31:21":"En in al het werk dat hij begon in de dienst van het huis van God, en in de wet en in het gebod, om zijn God te zoeken, deed hij dat met zijn hele hart, en had voorspoed.","Ps 139:17":"Daarom, hoe kostbaar zijn mij, o God, Uw gedachten! Hoe machtig veel zijn hun sommen!","Mal 3:3":"En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.","Deut 3:24":"Heere HEERE! U bent begonnen Uw dienaar Uw grootheid en Uw sterke hand te tonen; want welke God is er in de hemel of op de aarde, die kan doen naar Uw werken en naar Uw machtige daden!","Ps 20:3":"Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.","Openb 14:5":"En in hun mond is geen bedrog gevonden; want zij zijn onberispelijk voor de troon van God.","Ps 93:5":"Uw getuigenissen zijn heel betrouwbaar; de heiligheid sierlijk Uw huis, HEERE! tot in lengte van dagen.","Mark 14:19":"En zij begonnen bedroefd te worden, en de een na de ander tegen Hem te zeggen: Ben ik het? En een ander: Ben ik het?","Matt 26:39":"En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.","2 Kron 20:4-13":"En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof. En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.","Ps 13:2":"Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen?","Jer 20:11":"Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.","Spr 15:28":"Het hart van de rechtvaardige bedenkt zich, om te antwoorden; maar de mond van de goddelozen stort overvloedig kwade dingen uit.","Ezech 18:21-23":"Maar wanneer de goddeloze zich bekeert van al zijn zonden, die hij gedaan heeft, en al Mijn inzettingen onderhoudt, en recht en gerechtigheid doet, hij zal zeker leven, hij zal niet sterven. Al zijn overtredingen, die hij gedaan heeft, zullen hem niet aangerekend worden; door zijn gerechtigheid, die hij gedaan heeft, zal hij leven. Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?","Ps 143:1-12":"Een psalm van David. O HEERE, hoor mijn gebed, neig de oren tot mijn smekingen; verhoor mij naar Uw waarheid, naar Uw gerechtigheid. En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn. Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.","Matt 19:26":"En Jezus keek hen aan, en zei tegen hen: Bij de mensen is dat onmogelijk, maar bij God zijn alle dingen mogelijk.","Matt 18:19":"Verder zeg Ik u: als twee van u het op de aarde over enige zaak eens worden waar zij om zouden vragen, dat zal hun gebeuren van Mijn Vader, Die in de hemelen is.","Amos 5:21-24":"Ik haat, Ik verafschuw uw feesten, en Ik kan uw verbodsdagen niet rieken. Want al offert u Mij brandoffers, alsook uw spijsoffers, Ik heb er toch geen welgevallen aan; en het dankoffer van uw vette beesten wil Ik niet aanzien. Doe het lawaai van uw liederen van Mij weg; ook wil Ik het spel van uw luiten niet horen.","Ps 25:2":"Beth. Mijn God! op U vertrouw ik; laat mij niet beschaamd worden; laat mijn vijanden niet van vreugde opspringen over mij.","Ps 145:18":"Koph. De HEERE is nabij allen die Hem aanroepen, allen die Hem aanroepen in waarheid.","Ps 119:173":"Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen.","2 Kor 4:8":"Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig;","Ps 61:8":"Hij zal eeuwig voor Gods aangezicht zitten; bereid goedertierenheid en waarheid, dat zij hem behoeden.","Jer 8:18":"Mijn verkwikking is in droefenis; mijn hart is flauw in mij.","Ex 24:2":"En dat Mozes alleen tot de HEERE nadert, maar dat zij niet naderen; en het volk klimt ook niet op met hem.","Jes 55:9":"Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.","Ps 118:19":"Doe mij de poorten van de gerechtigheid open, ik zal daardoor ingaan, ik zal de HEERE loven.","Jes 27:11":"Als haar takken verdord zijn, zullen ze afgebroken worden, en de vrouwen zullen komen en ze aansteken; want het is een volk zonder enig verstand; daarom zal Hij, Die het gemaakt heeft, Zich niet over hen ontfermen, en Die het geformeerd heeft, zal hun geen genade bewijzen.","Ps 56:10":"Dan zullen mijn vijanden achterwaarts keren, ten dage dat ik roepen zal; dit weet ik, dat God met mij is.","Job 9:18":"Hij laat mij niet toe mijn adem te halen, maar Hij verzadigt mij met bitterheden.","Jes 51:5":"Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.","Job 5:9":"Die grote dingen doet, die men niet doorzoeken kan; wonderen, die men niet tellen kan;","Job 36:26":"Zie, God is groot, en wij begrijpen het niet; er is ook geen onderzoeking van het aantal van Zijn jaren.","Ps 141:7":"Onze beenderen zijn verstrooid bij de mond van het graf, zoals wanneer iemand op de aarde iets kloofde en verdeelde.","Ps 57:2-4":"Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan. Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien. Hij zal vanuit de hemel zenden, en mij verlossen, en te schande maken hem die mij zoekt te verslinden. Sela. God zal Zijn goedertierenheid en Zijn waarheid zenden.","2 Kron 11:16":"Na hen kwamen ook uit alle stammen van Israël naar Jeruzalem, mensen die hun hart erop gericht hadden om de HEERE, de God van Israël, te zoeken, om aan de HEERE, de God van hun vaderen, offers te brengen.","Ps 4:2":"Als ik roep, verhoor mij, o God van mijn gerechtigheid! In benauwdheid hebt U mij ruimte gemaakt; wees mij genadig, en hoor mijn gebed.","Micha 1:4":"En de bergen zullen onder Hem versmelten, en de dalen gekloofd worden, zoals was voor het vuur, zoals water dat uitgestort wordt in de laagte.","Ps 28:2":"Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.","Micha 7:7-9":"Maar ik zal uitzien naar de HEERE, ik zal wachten op de God van mijn heil; mijn God zal mij horen. Verblijd u niet over mij, o mijn vijandin! Wanneer ik gevallen ben, zal ik weer opstaan; wanneer ik in duisternis gezeten ben, zal de HEERE mij een licht zijn. Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.","Ps 6:4":"Ja, mijn ziel is zeer verschrikt; en U, HEERE, hoe lang nog?","Ex 3:5":"En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land.","Ps 142:2-4":"Ik riep met mijn stem tot de HEERE; ik smeekte tot de HEERE met mijn stem. Ik stortte mijn klacht uit voor Zijn aangezicht; ik maakte voor Zijn aangezicht mijn benauwdheid bekend. Toen mijn geest in mij overweldigd was, kende U mijn pad. Zij hebben in het geheim een strik voor mij verborgen op de weg die ik zou gaan.","Mark 15:34":"En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?","Matt 18:20":"Want waar twee of drie in Mijn Naam bijeengekomen zijn, daar ben Ik in hun midden.","Ps 142:4":"Toen mijn geest in mij overweldigd was, kende U mijn pad. Zij hebben in het geheim een strik voor mij verborgen op de weg die ik zou gaan.","Jes 64:1":"Och, dat U de hemelen scheurde, dat U neerkwam, dat de bergen van Uw aangezicht wegsmolten;","Ps 22:3":"Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte.","Ps 25:22":"O God! verlos Israël uit al zijn benauwdheden.","Job 12:14-16":"Zie, Hij breekt af, en het zal niet herbouwd worden; Hij besluit iemand op, en er zal niet opengedaan worden. Zie, Hij houdt de wateren tegen, en zij drogen uit; ook laat Hij ze los, en zij keren de aarde om. Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.","Ps 74:7":"Zij hebben Uw heiligdommen in het vuur gezet; tot op de grond hebben zij de woning van Uw Naam ontheiligd.","Ps 70:2":"Haast U, o God, om mij te verlossen, o HEERE, tot mijn hulp.","Hos 10:12":"Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen.","Ps 66:19":"Maar zeker, God heeft gehoord; Hij heeft gemerkt op de stem van mijn gebed.","Ps 92:11":"Maar U zult mijn hoorn verhogen, zoals de hoorn van een eenhoorn; ik ben met verse olie overgoten.","Klaagl 4:1":"Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!","Matt 26:42":"Opnieuw, voor de tweede keer, ging Hij heen en bad, en zei: Mijn Vader! Als deze drinkbeker niet aan Mij voorbij kan gaan zonder dat Ik hem drink, laat Uw wil dan gebeuren!","1 Petr 5:12":"Door Silvanus, die u een trouwe broeder is, zoals ik meen, heb ik u in het kort geschreven, u vermanend en u ervan verzekerend dat dit de ware genade van God is, waarin u staat.","Job 42:3":"Wie is hij, zegt U, die de raad verbergt zonder wetenschap? Zo heb ik dan verteld, wat ik niet begreep, dingen, die voor mij te wonderbaar waren, die ik niet wist.","Dan 6:28":"Hij verlost en redt, en Hij doet tekenen en wonderen in de hemel en op de aarde; Hij heeft Daniël uit de macht van de leeuwen verlost.","Ps 136:4":"Hem, Die alleen grote wonderen doet; want Zijn goedertierenheid is voor eeuwig.","Ps 7:7":"Sta op, HEERE, in Uw toorn, verhef U om de woede van hen die mij benauwen, en ontwaak tot mij; U hebt het oordeel bevolen.","Dan 9:3":"En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.","Jer 51:16":"Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.","1 Sam 12:8":"Nadat Jakob in Egypte gekomen was, riepen uw vaders tot de HEERE; en de HEERE zond Mozes en Aäron, en zij leidden uw vaders uit Egypte, en lieten hen op deze plaats wonen.","Jes 49:13":"Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.","Ps 136:12":"Met een sterke hand, en met een uitgestrekte arm; want Zijn goedertierenheid is voor eeuwig.","Ps 9:2":"Ik zal de HEERE loven met mijn hele hart; ik zal al Uw wonderen vertellen.","Klaagl 3:1-21":"Aleph. Ik ben de man die ellende gezien heeft door de roede van Zijn verbolgenheid. Aleph. Hij heeft mij geleid en gevoerd in de duisternis, en niet in het licht. Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.","Job 4:7-21":"Bedenk toch, wie is de onschuldige die is omgekomen; en waar zijn de oprechten verdelgd? Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook. Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.","Neh 4:9":"Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.","1 Kor 11:28-32":"Maar laat de mens zichzelf beproeven, en laat hij zo van het brood eten, en van de drinkbeker drinken. Want wie onwaardig eet en drinkt, die eet en drinkt zichzelf een oordeel, omdat hij het lichaam van de Heere niet onderscheidt. Daarom zijn er onder u velen zwak en ziek, en velen slapen.","Hand 16:34":"En hij bracht hen in zijn huis, en zette hun de tafel voor, en verheugde zich dat hij met heel zijn huis gelovig geworden was in God.","Ps 130:1-8":"Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE! Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen. Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?","2 Sam 22:2-5":"Hij zei dan: De HEERE is mij mijn Steenrots, en mijn Burg, en mijn Uithelper. God is mijn Rots, ik zal op Hem vertrouwen; mijn Schild en de Hoorn van mijn heil, mijn Hoog Vertrek en mijn Toevlucht, mijn Verlosser! Van geweld hebt U mij verlost! Ik riep de HEERE aan, Die te prijzen is, en ik werd verlost van mijn vijanden.","Gal 5:5":"Want wij verwachten door de Geest, uit het geloof, de hoop van de rechtvaardigheid.","Ef 3:21":"Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.","Ps 26:2":"Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart.","Hab 1:13":"U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?","Ps 39:2-5":"Ik zei: Ik zal op mijn wegen letten, dat ik niet zondig met mijn tong; ik zal mijn mond met een breidel in toom houden, terwijl de goddeloze nog tegenover mij is. Ik was verstomd door stilzwijgen, ik zweeg over het goede; maar mijn smart werd zwaarder. Mijn hart werd heet in mijn binnenste, een vuur ontbrandde in mijn overdenking; toen sprak ik met mijn tong:","Ps 3:6":"Ik lag neer en sliep; ik werd wakker, want de HEERE ondersteunde mij.","Job 23:15-17":"Hierom word ik voor Zijn aangezicht ontsteld; als ik het aanmerk, vrees ik voor Hem; Want God heeft mijn hart week gemaakt, en de Almachtige heeft mij ontsteld; Omdat ik niet weggevaagd ben vóór de duisternis, en Hij van mijn aangezicht de donkerheid niet bedekt heeft.","Gen 50:24":"En Jozef zei tot zijn broeders: Ik sterf; maar God zal u zeker bezoeken, en Hij zal u doen optrekken uit dit land, naar het land, dat Hij aan Abraham, Izak en Jakob gezworen heeft.","Jes 49:15":"Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.","Jes 38:14-19":"Zoals een kraanvogel of zwaluw, zo piepte ik; ik kirde als een duif; mijn ogen keken smachtend omhoog; o HEERE! ik word onderdrukt, wees Gij mijn Borg. Wat zal ik spreken? Zoals Hij het mij heeft toegezegd, zo heeft Hij het gedaan; ik zal nu al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel. Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.","Ps 35:10":"Al mijn beenderen zullen zeggen: HEERE, wie is U gelijk! U, Die de ellendige redt van hem die sterker is dan hij, en de ellendige en de nooddruftige van zijn berover.","Ps 9:14":"Wees mij genadig, HEERE, zie mijn ellende aan, die mijn haters mij aandoen, Gij, Die mij verhoogt uit de poorten van de dood;","Ps 84:11":"Want een dag in Uw voorhoven is beter dan duizend elders; ik koos liever aan de drempel in het huis van mijn God te zijn, dan lang te wonen in de tenten van de goddeloosheid.","Ps 61:5":"Ik zal in Uw hut verkeren in eeuwigheden; ik zal mijn toevlucht nemen in het verborgene van Uw vleugels. Sela.","Ps 62:2":"Zeker, mijn ziel is stil bij God; van Hem is mijn heil.","Gen 16:13":"En zij noemde de Naam van de HEERE, Die tot haar sprak: U bent de God van het aanzien! want zij zei: Heb ik ook hier gezien naar Hem, Die mij aanziet?","Ps 118:6":"De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?","Job 9:16-23":"Al zou ik roepen en Hij mij antwoorden, ik zou niet geloven dat Hij mijn stem ter ore genomen heeft. Want Hij vermorzelt mij door een onweer, en vermenigvuldigt mijn wonden zonder oorzaak. Hij laat mij niet toe mijn adem te halen, maar Hij verzadigt mij met bitterheden.","Klaagl 3:57":"Koph. U bent tot mij genaderd op de dag dat ik U aanriep; U hebt gezegd: Vrees niet!","Ps 119:172":"Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid.","Openb 4:11":"U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.","Matt 26:22":"En zij werden zeer bedroefd en ieder van hen begon tegen Hem te zeggen: Ben ik het, Heere?","Jes 27:4":"Grimmigheid is bij Mij niet; wie zou Mij als een doorn en distel in oorlog willen zetten, zodat Ik tegen hem zou aanvallen, en hem tegelijk zou verbranden?","Ps 123:4":"Onze ziel is veel te zat van de spot van de weldenkenden, van de verachting van de hoogmoedigen.","Spr 10:11":"De mond van de rechtvaardige is een bron van leven; maar het geweld bedekt de mond van de goddelozen.","Hebr 8:2":"Een Bedienaar van het heiligdom, en van de ware tabernakel, die de Heere heeft opgericht, en geen mens.","Pred 3:11":"Hij heeft ieder ding mooi gemaakt op zijn tijd; ook heeft Hij de eeuw in hun hart gelegd, zonder dat een mens het werk, dat God gemaakt heeft, kan doorgronden, van het begin tot het einde toe.","Matt 12:37":"Want uit uw woorden zult u gerechtvaardigd worden, en uit uw woorden zult u veroordeeld worden.","Num 18:5":"U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.","Ps 118:14":"De HEERE is mijn Sterkte en Psalm, want Hij is mij tot heil geweest.","Jes 38:3":"En hij zei: Och HEERE, denk er toch aan dat ik voor Uw gezicht in waarheid en met een volkomen hart gewandeld heb, en dat ik gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg hard.","Gen 48:3-20":"Daarna zei Jakob tegen Jozef: God de Almachtige is aan mij verschenen te Luz, in het land Kanaän, en Hij heeft mij gezegend; en Hij heeft tegen mij gezegd: Zie, Ik zal u vruchtbaar maken, en u vermenigvuldigen, en u tot een menigte van volken maken; en Ik zal aan uw nageslacht na u dit land tot een eeuwig bezit geven. Nu dan, uw twee zonen, die u in Egypteland geboren zijn, voordat ik naar u toe in Egypte gekomen ben, zijn van mij; Efraïm en Manasse zullen van mij zijn, zoals Ruben en Simeon.","Pred 12:9-11":"En verder, omdat de prediker wijs geweest is, leerde hij het volk nog kennis, en lette hij op, en onderzocht hij; hij bracht veel spreuken in orde. De prediker zocht aangename woorden te vinden, en wat er geschreven is, is recht: woorden van de waarheid. De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.","Deut 5:15":"Want u zult gedenken dat u een dienstknecht in Egypteland geweest bent, en dat de HEERE, uw God, u vandaar heeft uitgeleid door een sterke hand en een uitgestrekte arm; daarom heeft de HEERE, uw God, u geboden dat u de sabbatdag houden zult.","Ps 42:8":"De afgrond roept tot de afgrond, bij het gedruis van uw watergoten; al uw baren en uw golven zijn over mij heen gegaan.","Ps 69:21":"De smaad heeft mijn hart gebroken, en ik ben zeer zwak; en ik heb gewacht op medelijden, maar er is geen; en op vertroosters, maar heb ze niet gevonden.","2 Kor 12:7":"En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.","Ps 66:13":"Ik zal met brandoffers Uw huis binnengaan; ik zal U mijn geloften betalen,","Ezech 1:14":"De levende wezens nu liepen en keerden weer als de gedaante van een bliksemflits.","Ps 77:8-10":"Zal de Heere dan voor eeuwig verstoten, en voortaan niet meer goedgunstig zijn? Houdt Zijn goedertierenheid voor eeuwig op? Heeft de toezegging een einde, van geslacht tot geslacht? Heeft God vergeten genadig te zijn? Heeft Hij Zijn barmhartigheden door toorn toegesloten? Sela.","Joh 3:33":"Wie Zijn getuigenis aangenomen heeft, die heeft verzegeld dat God waarachtig is.","Jes 38:16":"Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.","1 Joh 3:17":"Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem?","Ps 40:2":"Ik heb de HEERE lang verwacht; en Hij heeft Zich tot mij geneigd, en mijn geroep gehoord.","Ex 15:1-19":"Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen. De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen! De HEERE is een krijgsman; HEERE is Zijn Naam!","Matt 12:35":"De goede mens brengt goede dingen voort uit de goede schat van het hart, en de slechte mens brengt slechte dingen voort uit de slechte schat.","Ps 89:40-52":"Gij hebt het verbond van Uw knecht teniet gedaan; Gij hebt zijn kroon ontheiligd tegen de aarde. Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen. Allen die de weg voorbijgingen, hebben hem beroofd; voor zijn naburen is hij tot een smaad geweest.","Hebr 12:9":"Verder, wij hebben de vaders van ons vlees wel als kastijders gehad, en wij hadden ontzag voor hen; zullen wij dan niet veel meer onderworpen zijn aan de Vader van de geesten, en leven?","Ps 18:3":"De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek.","Ps 89:9":"O HEERE, God van de heerscharen! Wie is als Gij, grootmachtig, o HEERE! en Uw getrouwheid is rondom U.","Spr 15:1":"Een zacht antwoord keert de grimmigheid af; maar een smartend woord doet de toorn oprijzen.","Job 19:7-20":"Zie, ik roep: geweld! maar word niet verhoord; ik schreeuw, maar er is geen recht. Hij heeft mijn weg toegemuurd, zodat ik niet door kan gaan, en over mijn paden heeft Hij duisternis gesteld. Mijn eer heeft Hij van mij afgetrokken, en de kroon van mijn hoofd heeft Hij weggenomen.","Spr 8:34":"Gelukkig is de mens die naar Mij hoort, dagelijks wakend aan Mijn poorten, wachtend bij de posten van Mijn deuren.","Ps 83:2-19":"O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.","Klaagl 5:20":"Waarom zou U ons voor altijd vergeten? Waarom zou U ons zo lange tijd verlaten?","Jes 30:29":"Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.","Deut 4:29":"Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel.","Rom 9:6":"Maar ik zeg dit niet alsof het woord van God vervallen zou zijn; want niet allen die uit Israël zijn, zijn Israël.","1 Kron 22:19":"Zo richt dan nu uw hart en uw ziel erop om de HEERE, uw God, te zoeken, en maak u op, en bouw het heiligdom van God, de HEERE; opdat men de ark van het verbond van de HEERE en de heilige voorwerpen van God in dit huis brengt, dat gebouwd zal worden voor de Naam van de HEERE.","Luk 23:29":"Want zie, er komen dagen waarin men zal zeggen: Zalig zijn de onvruchtbaren, en de buiken die niet gebaard hebben, en de borsten die niet gezoogd hebben.","Job 5:6":"Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde;","Jes 45:19":"Ik heb niet in het verborgene gesproken, op een donkere plaats van de aarde; Ik heb tegen het zaad van Jakob niet gezegd: Zoekt Mij tevergeefs; Ik ben de HEERE, Die gerechtigheid spreekt, Die rechtmatige dingen verkondigt.","Job 36:22":"Zie, God verhoogt door Zijn kracht; wie is een Leraar zoals Hij?","Num 10:29":"Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.","Neh 2:20":"Toen gaf ik hun antwoord, en zei tegen hen: De God van de hemel, Hij zal het ons doen gelukken, en wij, Zijn dienaren, zullen opstaan en bouwen; maar u hebt geen deel, geen recht, en geen aandenken in Jeruzalem.","Ps 84:2-5":"Hoe lieflijk zijn Uw woningen, o HEERE van de heerscharen! Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God. Zelfs vindt de mus een huis, en de zwaluw een nest voor zich, waar zij haar jongen legt, bij Uw altaren, HEERE van de heerscharen, mijn Koning, en mijn God!","Joh 9:17":"Zij zeiden opnieuw tegen de blinde: U, wat zegt u van Hem, omdat Hij uw ogen geopend heeft? En hij zei: Hij is een Profeet.","Job 14:1":"De mens, uit een vrouw geboren, leeft maar kort en is vol onrust.","Job 38:25":"Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen?","Ps 105:2":"Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen.","2 Kor 4:9":"Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven;","Hand 17:25":"En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft;","Pred 5:1":"Wees niet te snel met uw mond, en laat uw hart niet haasten om een woord voort te brengen voor Gods aangezicht; want God is in de hemel, en u bent op de aarde; daarom laat uw woorden weinig zijn.","Ps 140:13":"Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.","Ps 88:2-4":"O HEERE, God van mijn heil! Bij dag, bij nacht roep ik voor U. Laat mijn gebed voor Uw aangezicht komen; neig Uw oor tot mijn geschrei. Want mijn ziel is verzadigd van tegenspoed, en mijn leven raakt tot aan het graf.","Ps 27:5":"Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.","Ps 40:4":"En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.","Ps 77:3-5":"Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden. Dacht ik aan God, dan maakte ik misbaar; peinsde ik, dan werd mijn ziel overstelpt. Sela. U hield mijn ogen wakend; ik was verslagen, en sprak niet.","Ps 130:6":"Mijn ziel wacht op de Heere, meer dan de wachters op de morgen; de wachters op de morgen.","Ps 119:134":"Verlos mij van de overlast van de mens, en ik zal Uw bevelen onderhouden.","Num 17:13":"Al wie ook maar enigszins nadert tot de tabernakel van de HEERE, zal sterven; zullen wij dan allen stervend omkomen?","Ps 49:6":"Waarom zou ik vrezen in kwade dagen, als de ongerechtigen, die op de hielen zijn, mij omringen?","Openb 15:4":"Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.","Ps 27:13":"Als ik niet had geloofd dat ik het goede van de HEERE zou zien in het land van de levenden, dan was ik vergaan.","Num 20:16":"Toen riepen wij tot de HEERE, en Hij hoorde onze stem, en Hij zond een Engel, en Hij leidde ons uit Egypte; en zie, wij zijn te Kades, een stad aan de rand van uw gebied.","Ps 38:10":"Heere! Voor U is al mijn verlangen; en mijn zuchten is voor U niet verborgen.","Ps 38:4-9":"Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde. Want mijn ongerechtigheden gaan over mijn hoofd; als een zware last zijn zij mij te zwaar geworden. Mijn etterbuilen stinken, zij zijn ontstoken, vanwege mijn dwaasheid.","Openb 18:1":"En hierna zag ik een andere engel uit de hemel neerdalen, die grote macht had, en de aarde werd verlicht door zijn heerlijkheid.","Ps 76:8":"U, vreselijk bent U; en wie zal voor Uw aangezicht bestaan, vanaf het moment van uw toorn?","Job 30:20":"Ik schrei tot U, maar U antwoordt mij niet; ik sta, maar U let niet op mij.","Ps 95:6":"Komt, laat ons aanbidden en neerbukken; laat ons knielen voor de HEERE, Die ons gemaakt heeft.","Gen 32:29":"En Jakob vroeg: Vertel mij toch Uw naam. En Hij zei: Waarom vraagt u naar Mijn naam? En Hij zegende hem daar.","Ps 86:7":"In de dag van mijn benauwdheid roep ik U aan, want Gij verhoort mij.","Ps 139:18":"Zou ik ze tellen? Ze zijn meer dan het zand; word ik wakker, dan ben ik nog bij U.","Jes 51:15":"Want Ik ben de HEERE, uw God, Die de zee klieft, zodat haar golven bruisen; HEERE van de heerscharen is Zijn Naam.","Spr 28:5":"De kwade mensen begrijpen het recht niet; maar wie de HEERE zoeken, begrijpen alles.","Neh 1:8-10":"Denk toch aan het woord, da ijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen; Aan Wie ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.","Joh 11:31":"De Joden dan, die met haar in het huis waren en haar troostten, zagen dat Maria haastig opstond en naar buiten ging, en volgden haar, en zeiden: Zij gaat naar het graf om daar te wenen.","Job 7:2-6":"Zoals de dienstknecht hijgt naar de schaduw, en zoals de dagloner uitkijkt naar zijn werkloon; Zo zijn mij maanden van ijdelheid ten erve geworden, en nachten van moeite zijn mij voorbereid. Als ik ga liggen om te slapen, dan zeg ik: Wanneer zal ik opstaan, en heeft Hij de avond afgemeten? En ik word verzadigd van woelingen tot aan de schemertijd.","Ps 105:26":"Hij zond Mozes, Zijn knecht, en Aäron, die Hij verkoren had.","Ex 19:18":"En de hele berg Sinaï rookte, omdat de HEERE daarop neerkwam in vuur; en zijn rook steeg op, als de rook van een oven; en de hele berg beefde erg.","Lev 21:12":"En uit het heiligdom zal hij niet weggaan, opdat hij het heiligdom van zijn God niet ontheiligt, want de kroon van de zalfolie van zijn God is op hem; Ik ben de HEERE!","Ps 42:7":"O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.","Ezra 3:10-13":"Toen nu de bouwers de grond van de tempel van de HEERE legden, stelden zij de priesters op, gekleed in hun ambtskleding, met trompetten, en de Levieten, de zonen van Asaf, met cimbalen, om de HEERE te loven, naar de instelling van David, de koning van Israël. En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE. Maar velen van de priesters en de Levieten en hoofden van de families, die oud waren en het eerste huis gezien hadden, weenden ngsten;","Jes 52:10":"De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.","Ps 99:6-8":"Mozes en Aäron waren onder Zijn priesters, en Samuël onder de aanroepers van Zijn Naam; zij riepen tot de HEERE, en Hij verhoorde hen. Hij sprak tot hen in een wolkkolom; zij hebben Zijn getuigenissen onderhouden, en de inzettingen die Hij hun gegeven had. O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.","Ps 27:10":"Want mijn vader en mijn moeder hebben mij verlaten, maar de HEERE zal mij aannemen.","Ps 116:12-14":"Wat zal ik de HEERE vergelden voor al Zijn weldaden aan mij bewezen? Ik zal de beker der verlossingen opnemen, en de Naam van de HEERE aanroepen. Mijn geloften zal ik de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk.","Luk 13:24":"Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen;","Luk 1:51":"Hij heeft een krachtig werk gedaan met Zijn arm; Hij heeft de hoogmoedigen verstrooid in de gedachten van hun hart.","Ps 140:7":"Ik heb tegen de HEERE gezegd: U bent mijn God; neem ter ore, HEERE, de stem van mijn smekingen.","Ps 80:4-6":"O God! Breng ons terug, en laat Uw aanschijn lichten, zo zullen wij verlost worden. HEERE, God van de heerscharen! Hoe lang zult U roken tegen het gebed van Uw volk? U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.","Ps 94:22":"Doch de HEERE is mij geweest tot een Hoog Vertrek, en mijn God tot een Steenrots van mijn toevlucht.","Ps 1:2":"Maar zijn vreugde is in de wet van de HEERE, en hij overdenkt Zijn wet dag en nacht.","Deut 9:26":"En ik bad tot de HEERE, en zei: Heere, HEERE, verderf Uw volk en Uw erfdeel niet, dat U door Uw grootheid verlost hebt; dat U uit Egypte door een sterke hand hebt uitgevoerd.","Hand 4:29":"En nu dan, Heere, zie op hun dreigingen, en geef Uw dienstknechten rend.","Ps 102:4-29":"Want mijn dagen zijn vergaan als rook, en mijn beenderen zijn uitgebrand als een haard. Mijn hart is geslagen en verdord als gras, zodat ik vergeten heb mijn brood te eten. Mijn beenderen kleven aan mijn vlees, vanwege de stem van het zuchten.","Ps 31:16":"Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers.","Spr 20:15":"Goud is er, en een menigte van robijnen; maar de lippen van de wetenschap zijn een kostbaar kleinood.","Ps 71:14":"Doch ik zal voortdurend hopen, en zal al Uw lof nog groter maken.","Klaagl 2:18":"Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op!","Job 36:15":"Hij zal de ellendige in zijn ellende bevrijden, en in de onderdrukking zal Hij voor hun oor openbaren.","Jes 63:16":"U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.","Ps 119:97-99":"Mem. Hoe lief heb ik Uw wet! Zij is mijn betrachting de hele dag. Zij maakt mij door Uw geboden wijzer, dan mijn vijanden zijn, want zij is in eeuwigheid bij mij. Ik ben verstandiger dan al mijn leraars, omdat Uw getuigenissen mijn betrachting zijn.","Ps 56:2-14":"Wees mij genadig, o God! Want de mens zoekt mij op te slokken; de hele dag dringt de bestrijder mij. Mijn verspieders zoeken mij de hele dag op te slokken; want ik heb veel bestrijders, o Allerhoogste! Ten dage dat ik zal vrezen, zal ik op U vertrouwen.","Ps 135:7":"Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort.","Ps 3:4":"Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.","Ps 43:1-5":"Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht. Want U bent de God van mijn sterkte; waarom verstoot U mij dan? Waarom ga ik steeds in het zwart, vanwege de onderdrukking van de vijand? Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;","Hand 5:32":"En wij zijn Zijn getuigen van deze dingen; en ook de Heilige Geest, Die God gegeven heeft hun die Hem gehoorzaam zijn.","1 Kor 14:15-17":"Wat is het dan? Ik zal wel met de geest bidden, maar ik zal ook met het verstand bidden; ik zal wel met de geest zingen, maar ik zal ook met het verstand zingen. Anders, als u dankzegt met de geest, hoe zal degene die de plaats van een ongeleerde inneemt, amen zeggen op uw dankzegging, omdat hij niet weet wat u zegt? Want u dankt wel behoorlijk, maar de ander wordt niet gesticht.","Ps 145:19":"Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.","Hand 7:60":"En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.","2 Kon 19:3":"En zij zeiden tegen hem: Zo zegt Hizkia: Deze dag is een dag van benauwdheid, en van bestraffing, en van smaad; want de kinderen zijn tot aan de geboorte gekomen, en er is geen kracht om te baren.","Mark 9:19":"En Hij antwoordde hem en zei: O ongelovig geslacht, hoelang zal Ik nog bij u zijn? Hoelang zal Ik u nog verdragen? Breng hem bij Mij.","Jer 32:17":"Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk.","Ef 4:22":"Namelijk dat u zou afleggen, wat betreft de vorige levenswandel, de oude mens, die verdorven wordt door de begeerten van de verleiding;","Ps 50:15":"En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.","Ps 21:14":"Verhoog U, HEERE! In Uw sterkte; zo zullen wij zingen, en Uw macht met psalmen loven.","Num 19:20":"Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden van de gemeenschap uitgeroeid worden; want hij heeft het heiligdom van de HEERE verontreinigd, het water van de afzondering is niet op hem gesprenkeld, hij is onrein.","Ps 119:16":"Ik zal mijzelf vermaken in Uw inzettingen; Uw woord zal ik niet vergeten.","Ps 91:9":"Want U, HEERE, bent mijn Toevlucht! De Allerhoogste hebt u gesteld tot uw Vertrek;","Ps 116:17":"Ik zal U een offer van dankzegging offeren, en de Naam van de HEERE aanroepen.","Joh 6:37":"Alles wat de Vader Mij geeft, zal tot Mij komen; en wie tot Mij komt, zal Ik beslist niet buitensluiten.","Ps 73:13-17":"Zeker heb ik tevergeefs mijn hart gezuiverd, en mijn handen in onschuld gewassen. Want ik ben de hele dag geplaagd, en mijn straf is er elke morgen. Als ik zou zeggen: Ik zal ook zo spreken; zie, dan zou ik trouweloos zijn tegenover het geslacht van Uw kinderen.","Jona 1:14":"Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd.","Ps 34:9":"Teth. Proeft en ziet dat de HEERE goed is; gelukkig is de man die op Hem vertrouwt.","2 Kron 30:27":"Toen stonden de Levitische priesters op, en zegenden het volk; en hun stem werd gehoord; want hun gebed kwam tot Zijn heilige woning in de hemel.","Hos 6:6":"Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.","Matt 8:25":"En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan!","Ps 97:4":"Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft.","Ex 25:8":"En zij zullen Mij een heiligdom maken, dat Ik in hun midden woon.","Zach 8:20-23":"Zo zegt de HEERE van de heerscharen: Nog zal het gebeuren, dat de volken, en de inwoners van veel steden, komen zullen; En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan. Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.","Jer 31:12":"Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn.","Mark 4:40":"En Hij zei tegen hen: Waarom bent u zo angstig? Hoe kan het dat u geen geloof hebt?","Gen 24:40":"En hij zei tegen mij: De HEERE, voor Wiens aangezicht ik gewandeld heb, zal Zijn Engel met u zenden, en Hij zal uw weg voorspoedig maken, zodat u voor mijn zoon een vrouw neemt, uit mijn geslacht en uit het huis van mijn vader.","Amos 8:12":"En zij zullen zwerven van zee tot zee, en van het noorden tot het oosten; zij zullen rondlopen om het woord van de HEERE te zoeken, maar zullen het niet vinden.","Jes 56:6":"En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden;","Ex 13:14":"Wanneer het zal gebeuren dat uw zoon u later zal vragen en zegt: Wat is dat, dan moet u tegen hem zeggen: De HEERE heeft ons door een sterke hand uit Egypte, uit het diensthuis, uitgevoerd.","Job 8:5":"Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt;","Ps 119:54":"Uw inzettingen zijn mij gezangen geweest, ter plaatse van mijn vreemdelingschap.","Ps 74:1":"Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?","Ps 66:3":"Zegt tot God: Hoe ontzagwekkend bent U in Uw werken! Om de grootheid van Uw sterkte zullen Uw vijanden zich geveinsd aan U onderwerpen.","Ps 13:3":"Hoe lang zal ik plannen maken in mijn ziel, verdriet in mijn hart bij dag? Hoe lang zal mijn vijand boven mij verheven zijn?","Ps 44:24-27":"Waak op, waarom zou U slapen, Heere! Ontwaak, verstoot niet tot in eeuwigheid. Waarom zou U Uw aangezicht verbergen, onze ellende en onze onderdrukking vergeten? Want onze ziel is in het stof neergebogen; onze buik kleeft aan de aarde.","Joël 2:12":"Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw hele hart, en dat met vasten en met geween, en met rouwklagen.","Matt 17:17":"Jezus antwoordde en zei: O ongelovig en verkeerd geslacht, hoe lang zal Ik nog bij u zijn, hoe lang zal Ik u nog verdragen? Breng hem hier bij Mij.","Ex 5:1":"En daarna gingen Mozes en Aäron heen, en zeiden tegen Farao: Zo zegt de HEERE, de God van Israël: Laat Mijn volk trekken, zodat het voor Mij een feest houdt in de woestijn!","Ex 25:22":"En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.","Ps 116:1-14":"Ik heb Hem lief, want de HEERE hoort mijn stem, mijn smekingen; want Hij neigt Zijn oor tot mij; daarom zal ik Hem in mijn dagen aanroepen. De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.","Spr 14:10":"Het hart kent zijn eigen bittere droefheid; en een vreemde zal zich met zijn blijdschap niet vermengen.","Ps 59:18":"Van U, o mijn Sterkte, zal ik psalmzingen; want God is mijn Hoog Vertrek, de God van mijn goedertierenheid.","Ps 130:2":"Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen.","Ps 3:2":"O HEERE, hoe zijn mijn tegenstanders talrijk geworden; velen staan tegen mij op.","Ezra 8:22":"Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.","Ps 7:11":"Mijn schild is bij God, Die de oprechten van hart behoudt.","Jer 32:16-25":"Vervolgens, nadat ik de koopbrief aan Baruch, de zoon van Nerija, gegeven had, bad ik tot de HEERE: Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk. U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!","Ps 78:34":"Toen Hij hen doodde, zochten zij Hem, en keerden weer, en zochten God vroeg;","Ps 25:1":"Een psalm van David. Aleph. Tot U, o HEERE! hef ik mijn ziel op.","Job 28:26":"Toen Hij voor de regen een vaste orde maakte, en een weg voor het weerlicht van de donders;","2 Tim 1:12":"Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.","Openb 9:6":"En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.","Ps 56:9":"U hebt mijn omzwerven geteld; leg mijn tranen in Uw fles; staan zij niet in Uw register?","Ps 145:16":"Pe. U doet Uw hand open, en verzadigt alles wat leeft, naar Uw welbehagen.","Spr 22:11":"Wie de reinheid van het hart liefheeft, wiens lippen aangenaam zijn, diens vriend is de koning.","Ps 42:2-5":"Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God! Mijn ziel dorst naar God, naar de levende God; wanneer zal ik binnengaan en voor het aangezicht van God verschijnen? Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?","Ps 55:5":"Mijn hart doet mij pijn in mijn binnenste, en verschrikkingen van de dood zijn op mij gevallen.","Num 14:8":"Als de HEERE een welgevallen aan ons heeft, zal Hij ons in dat land brengen, en zal het ons geven; een land dat overvloeit van melk en honing.","Klaagl 3:39":"Mem. Wat klaagt dan een levend mens? Ieder klaagt vanwege zijn zonden.","Neh 10:39":"Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.","Ps 150:1":"Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte!","Ps 63:8":"Want U bent mij een hulp geweest; en in de schaduw van Uw vleugels zal ik vrolijk zingen.","Num 3:28":"In getal van al wat mannelijk was, van een maand oud en daarboven, waren achtduizend zeshonderd, die de wacht van het heiligdom waarnamen.","Ps 71:3":"Wees mij tot een Rotssteen, om daarin te wonen, om voortdurend daarin te gaan; Gij hebt bevel gegeven, om mij te verlossen, want Gij zijt mijn Steenrots en mijn Burg.","Job 41:1":"Niemand is zo dapper, dat hij hem opwekken zou; wie is dan hij, die zich voor Mijn aangezicht stellen zou?","1 Sam 2:6-8":"De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.","Job 5:18":"Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen.","Jes 1:6":"Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.","Ps 144:2":"Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!","Deut 11:2":"En u zult heden weten, dat ik niet spreek met uw kinderen, die het niet weten, en de vermaning van de HEERE, uw God, niet gezien hebben. Zijn grootheid, Zijn sterke hand en Zijn uitgestrekte arm;","1 Kron 29:11":"Van U, o HEERE, is de grootheid, en de macht, en de heerlijkheid, en de overwinning, en de majesteit; want alles wat in de hemel en op aarde is, is van U: van U, o HEERE, is het Koninkrijk, en U hebt Uzelf verhoogd tot een Hoofd boven alles.","Ps 55:18":"'s Avonds, en 's morgens, en 's middags zal ik klagen en getier maken; en Hij zal mijn stem horen.","Ps 27:14":"Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.","Ex 34:8":"Mozes nu haastte zich en boog het hoofd ter aarde, en hij boog zich neer.","Num 23:19":"God is geen man, dat Hij zou liegen, en ook geen mensenkind, dat het Hem berouwen zou; zou Hij het zeggen, en het niet doen, of spreken, en het niet waarmaken?","2 Kor 5:1":"Want wij weten dat als ons aardse huis, deze tent, afgebroken wordt, wij een gebouw van God hebben, een huis niet met handen gemaakt, maar eeuwig, in de hemelen.","Spr 11:12-14":"Wie zonder verstand is, veracht zijn naaste; maar een man van groot verstand zwijgt stil. Wie als een achterklapper rondgaat, openbaart het geheime; maar wie trouw is van geest, bedekt de zaak. Als er geen wijs beleid is, valt het volk; maar de behoudenis is in de veelheid van raadslieden.","Ps 74:21-23":"Laat de verdrukte niet beschaamd terugkeren; laat de ellendige en de arme Uw Naam prijzen. Sta op, o God! Voer Uw eigen rechtszaak; denk aan de smaad die U de hele dag door de dwaas aangedaan wordt. Vergeet het geroep van Uw tegenstanders niet; het rumoer van hen die tegen U opstaan, klimt voortdurend op.","Ex 15:11":"O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet?","Ps 119:10":"Ik zoek U met mijn hele hart, laat mij van Uw geboden niet afdwalen.","Ps 89:10":"Gij heerst over de opgeblazenheid van de zee; wanneer haar baren zich verheffen, dan stilt Gij ze.","Job 35:10":"Maar niemand zegt: Waar is God, mijn Maker, Die de lofzangen geeft in de nacht?","Spr 15:13":"Een vrolijk hart maakt het gezicht blij; maar door verdriet in het hart wordt de geest verslagen.","Ps 116:2":"want Hij neigt Zijn oor tot mij; daarom zal ik Hem in mijn dagen aanroepen.","Job 26:14":"Zie, dit zijn nog maar de uiterste randen van Zijn wegen; en wat een klein stukje van de zaak hebben wij van Hem gehoord? Wie zou dan de donder van Zijn machtige daden kunnen begrijpen?","Ps 48:15":"Want deze God is onze God eeuwig en altoos; Hij zal ons geleiden tot de dood toe.","1 Kron 24:5":"En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.","Ps 92:16":"Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.","Ps 63:2":"O God! U bent mijn God! Ik zoek U in de dageraad; mijn ziel dorst naar U; mijn lichaam verlangt naar U, in een land, dor en mat, zonder water.","Jes 64:8":"Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen.","Dan 9:17":"En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf.","Est 4:1-4":"Toen Mordechai wist wat er allemaal gebeurd was, verscheurde hij zijn kleren en trok een zak met as aan; en hij ging door het midden van de stad, en riep met een luid en bitter geroep. En hij kwam tot vóór de poort van de koning; want niemand mocht bij de poort van de koning naar binnen gaan, gekleed in een zak. En in elk landschap en elke plaats, waar het woord van de koning en zijn wet aankwam, was er grote rouw onder de Joden, met vasten, geween en misbaar; velen lagen in zakken en as.","Joz 14:12":"En nu, geef mij dit gebergte, waarvan de HEERE op die dag gesproken heeft; want u hebt op diezelfde dag gehoord dat de Enakieten daar waren, en dat er grote versterkte steden waren; misschien is de HEERE met mij, zodat ik hen verdrijf, zoals de HEERE gesproken heeft.","1 Petr 2:5":"Dan wordt u ook zelf, als levende stenen, gebouwd tot een geestelijk huis, tot een heilig priesterschap, om geestelijke offers te brengen die God aangenaam zijn door Jezus Christus.","Dan 11:31":"En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen.","2 Tim 4:7":"Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden;","Ps 114:4-7":"De bergen sprongen als rammen, de heuvels als lammeren. Wat was er met u, zee, dat u vluchtte? Met u, Jordaan, dat u achterwaarts keerde? Bergen, dat u opsprong als rammen? Heuvels, als lammeren?","Jes 66:2":"Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.","Ps 34:10":"Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek.","Jes 14:27":"Want de HEERE van de heerscharen heeft het in Zijn raad besloten, wie zal het dan verbreken? en Zijn hand is uitgestrekt, wie zal die dan keren?","Jes 1:11-15":"Waartoe zal Mij de veelheid van uw slachtoffers zijn? zegt de HEERE; Ik ben zat van de brandoffers van de rammen, en het vet van de vette dieren, en heb geen lust aan het bloed van de stieren, noch van de lammeren, noch van de bokken. Wanneer u voor Mijn aangezicht komt te verschijnen, wie heeft dat van uw hand geëist, dat u Mijn voorhoven zou betreden? Breng niet meer een nutteloos offer; het reukwerk is Mij een gruwel; de nieuwe manen, en sabbatten, en het bijeenroepen van de samenkomsten kan Ik niet verdragen, het is ongerechtigheid, zelfs de verbodsdagen.","Job 16:19":"Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.","Neh 4:5":"Dek hun ongerechtigheid niet toe, en laat hun zonde niet uitgewist worden van voor Uw aangezicht, want zij hebben U getergd, tegenover de bouwers.","Job 14:22":"Maar zijn vlees, dat nog aan hem is, heeft smart; en zijn ziel, die nog in hem is, heeft rouw.","Pred 10:12":"De woorden van de mond van een wijze zijn aangenaam; maar de lippen van een dwaas verslinden hemzelf.","Jes 26:1":"Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.","Spr 15:7":"De lippen van de wijzen zullen de wetenschap uitstrooien; maar het hart van de zotten niet zo.","Neh 9:11":"En U hebt de zee voor hun aangezicht gekliefd, zodat zij in het midden van de zee op het droge zijn doorgegaan; en hun vervolgers hebt U in de diepten geworpen, als een steen in sterk water.","Ps 27:1-6":"Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn? Toen de bozen, mijn tegenpartijen en mijn vijanden, tegen mij naar mij toe kwamen om mijn vlees te eten, stieten zij zelf aan en vielen. Ofschoon een leger mij belegerde, mijn hart zou niet vrezen; ofschoon een oorlog tegen mij opstond, toch vertrouw ik hierop.","Ps 66:9":"Die onze zielen in het leven houdt, en niet toelaat dat onze voet wankelt.","Ps 26:12":"Mijn voet staat op effen grond; ik zal de HEERE loven in de samenkomsten.","Luk 16:25":"Maar Abraham zei: Kind, herinner u dat u uw goed ontvangen hebt in uw leven, en Lazarus evenzo het kwade; en nu wordt hij vertroost, en u lijdt pijn.","Deut 33:27":"De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!","Jer 17:9":"Arglistig is het hart, meer dan enig ding, ja, dodelijk is het; wie zal het kennen?","Spr 21:23":"Wie zijn mond en zijn tong bewaart, bewaart zijn ziel van benauwdheden.","Rom
