wie is een groot God, gelijk God?","15":"U bent die God, Die wonderen doet; U hebt Uw sterkte bekendgemaakt onder de volken.","16":"U hebt Uw volk door Uw arm verlost; de kinderen van Jakob en van Jozef. Sela.","17":"De wateren zagen U, o God! De wateren zagen U, zij beefden; ook waren de afgronden beroerd.","18":"De dikke wolken goten water uit; de bovenste wolken gaven geluid; ook gingen Uw pijlen daarheen.","19":"Het geluid van uw donder was rondom; de bliksemen verlichtten de wereld; de aarde werd beroerd en daverde.","20":"Uw weg was in de zee, en Uw pad in het grote water, en Uw voetstappen werden niet bekend.","21":"U leidde Uw volk als een kudde door de hand van Mozes en Aäron."},"SV":{"1":"Een psalm van Asaf, voor den opperzangmeester, over Jeduthun.","2":"Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen.","3":"Ten dage mijner benauwdheid zocht ik den Heere; mijn hand was des nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden.","4":"Dacht ik aan God, zo maakte ik misbaar; peinsde ik, zo werd mijn ziel overstelpt. Sela.","5":"Gij hieldt mijn ogen wakende; ik was verslagen, en sprak niet.","6":"Ik overdacht de dagen van ouds, de jaren der eeuwen.","7":"Ik dacht aan mijn snarenspel; in den nacht overleide ik in mijn hart, en mijn geest onderzocht:","8":"Zal dan de Heere in eeuwigheden verstoten, en voortaan niet meer goedgunstig zijn?","9":"Houdt Zijn goedertierenheid in eeuwigheid op? Heeft de toezegging een einde, van geslacht tot geslacht?","10":"Heeft God vergeten genadig te zijn? Heeft Hij Zijn barmhartigheden door toorn toegesloten? Sela.","11":"Daarna zeide ik: Dit krenkt mij; *maar* de rechterhand des Allerhoogsten verandert.","12":"Ik zal de daden des HEEREN gedenken ; ja, ik zal gedenken Uw wonderen van ouds her;","13":"En zal al Uw werken betrachten, en van Uw daden spreken.","14":"O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?","15":"Gij zijt die God, Die wonder doet; Gij hebt Uw sterkte bekend gemaakt onder de volken.","16":"Gij hebt Uw volk door *Uw* arm verlost; de kinderen van Jakob en van Jozef. Sela.","17":"De wateren zagen U, o God! de wateren zagen U, zij beefden; ook waren de afgronden beroerd.","18":"De dikke wolken goten water uit; de bovenste wolken gaven geluid; ook gingen Uw pijlen daarhenen.","19":"Het geluid Uws donders was in het ronde; de bliksemen verlichtten de wereld; de aarde werd beroerd en daverde.","20":"Uw weg was in de zee, en Uw pad in grote wateren, en Uw voetstappen werden niet bekend.","21":"Gij leiddet Uw volk, als een kudde door de hand van Mozes en Aäron."},"KJV":{"1":"[[To the chief Musician, to Jeduthun, A Psalm of Asaph.]] I cried unto God with my voice, *even* unto God with my voice; and he gave ear","2":"[[To the chief Musician, to Jeduthun, A Psalm of Asaph.]] I cried unto God with my voice, *even* unto God with my voice; and he gave ear","3":"In the day of my trouble I sought the Lord: my sore ran in the night, and ceased not: my soul refused to be comforted.","4":"I remembered God, and was troubled: I complained, and my spirit was overwhelmed. Selah.","5":"Thou holdest mine eyes waking: I am so troubled that I cannot speak.","6":"I have considered the days of old, the years of ancient times.","7":"I call to remembrance my song in the night: I commune with mine own heart: and my spirit made diligent search.","8":"Will the Lord cast off for ever? and will he be favourable","9":"Is his mercy clean gone for ever? doth *his* promise fail for evermore?","10":"Hath God forgotten to be gracious? hath he in anger shut up his tender mercies? Selah.","11":"And I said, This *is* my infirmity: *but I will remember* the years of the right hand of the most High.","12":"I will remember the works of the LORD: surely I will remember thy wonders of old.","13":"I will meditate also of all thy work, and talk of thy doings.","14":"Thy way, O God, *is* in the sanctuary: who *is so* great a God as *our* God?","15":"Thou *art* the God that doest wonders: thou hast declared thy strength among the people.","16":"Thou hast with *thine* arm redeemed thy people, the sons of Jacob and Joseph. Selah.","17":"The waters saw thee, O God, the waters saw thee; they were afraid: the depths also were troubled.","18":"The clouds poured out water: the skies sent out a sound: thine arrows also went abroad.","19":"The voice of thy thunder *was* in the heaven: the lightnings lightened the world: the earth trembled and shook.","20":"Thy way *is* in the sea, and thy path in the great waters, and thy footsteps are not known.","21":"Thou leddest thy people like a flock by the hand of Moses and Aaron."}},"tsk":{"2":[{"kopje":"of Asaph","refs":["Ps 50:1"]},{"kopje":"ik roep","refs":["Ps 3:5","Ps 34:7","Ps 55:17","Ps 55:18","Ps 142:2-4"]},{"kopje":"roep","refs":["Ps 116:1","Ps 116:2"]}],"3":[{"kopje":"Ten dage","refs":["Ps 18:7","Ps 50:15","Ps 88:2-4","Ps 102:2","Ps 102:3","Ps 130:1","Ps 130:2","Gen 32:7-12","Gen 32:28","2 Kon 19:3","2 Kon 19:4","2 Kon 19:15-20","Jes 26:9","Jes 26:16","Jona 2:1","Jona 2:2","2 Kor 12:7","2 Kor 12:8","Hebr 5:7"]},{"kopje":"mijn","refs":["Ps 6:3","Ps 6:4","Ps 38:4-9","2 Kron 6:28","Jes 1:5","Jes 1:6","Hos 5:13","Hos 6:1"]},{"kopje":"mijn ziel","refs":["Gen 37:35","Est 4:1-4","Spr 18:14","Jer 31:15","Joh 11:31"]}],"4":[{"kopje":"Dacht ik","refs":["Job 6:4","Job 23:15","Job 23:16","Job 31:23","Jer 17:17"]},{"kopje":"peinsde ik","refs":["Ps 88:4-19","Ps 102:4-29","Job 7:11","Klaagl 3:17","Klaagl 3:39"]},{"kopje":"spirit","refs":["Ps 55:5","Ps 55:6","Ps 61:3","Ps 142:3","Ps 142:4","Ps 143:4","Ps 143:5"]}],"5":[{"kopje":"hield","refs":["Ps 6:7","Est 6:1","Job 7:13-15"]},{"kopje":"ik was","refs":["Job 2:13","Job 6:3"]}],"7":[{"kopje":"mijn snarenspel","refs":["Ps 42:9","Job 35:10","Hab 3:17","Hab 3:18","Jona 1:2","Hand 16:25"]},{"kopje":"overlegde ik","refs":["Ps 4:5","Pred 1:16"]},{"kopje":"en","refs":["Ps 139:23","Ps 139:24","Job 10:2","Klaagl 3:40","1 Kor 11:28-32"] 26","svLabel":null},{"disp":"Micha 6:4","href":"../../micha/6/#v4","ref":"Micha 6:4","svLabel":null}],"kinderen":[]}]}],"torrey":[{"topic":"Shepherds","href":"../../torrey/s/#t-shepherds","kinderen":[{"label":"Care Of The Sheep By, Exhibited In","href":"../../torrey/s/?hl=Ps.77.21#i19534","refs":[],"kinderen":[{"label":"Going before and leading them","href":"../../torrey/s/?hl=Ps.77.21#i19536","refs":[{"disp":"Ps 77:20","href":"../../psalmen/77/#v21","ref":"Ps 77:21","svLabel":"SV 21"},{"disp":"Ps 78:52","href":"../../psalmen/78/#v52","ref":"Ps 78:52","svLabel":null},{"disp":"Ps 80:1","href":"../../psalmen/80/#v2","ref":"Ps 80:2","svLabel":"SV 2"}],"kinderen":[]}]},{"label":"Illustrative","href":"../../torrey/s/?hl=Ps.77.21#i19545","refs":[],"kinderen":[{"label":"Of God as leader of Israel","href":"../../torrey/s/?hl=Ps.77.21#i19546","refs":[{"disp":"Ps 77:20","href":"../../psalmen/77/#v21","ref":"Ps 77:21","svLabel":"SV 21"},{"disp":"Ps 80:1","href":"../../psalmen/80/#v2","ref":"Ps 80:2","svLabel":"SV 2"}],"kinderen":[]}]}]}]}},"extern":{"Ps 21:3":"U hebt hem de wens van zijn hart gegeven, en de uitspraak van zijn lippen hebt U niet geweerd. Sela.","Ps 71:12":"O God, wees niet ver van mij; mijn God! haast U tot mijn hulp.","Num 17:4":"En u zult ze wegleggen in de tent van de samenkomst, voor de getuigenis, waar Ik met u samenkomen zal.","Job 6:1-30":"Maar Job antwoordde en zei: Och, of mijn verdriet grondig gewogen werd, en men mijn ellende samen in een weegschaal ophief! Want het zou nu zwaarder zijn dan het zand der zeeën; daarom worden mijn woorden opgezwolgen.","Spr 12:23":"Een schrander mens bedekt de wetenschap; maar het hart van de zotten roept dwaasheid uit.","Matt 14:30":"Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij!","2 Kron 6:28":"Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren of honigdauw, sprinkhanen en kevers zullen zijn, als iemand van zijn vijanden hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn;","Ps 93:1":"De HEERE regeert, Hij is met majesteit bekleed; de HEERE is bekleed met sterkte, Hij heeft Zich omgord. Ook is de wereld bevestigd, zij zal niet wankelen.","Ps 57:3":"Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.","Jer 14:19-21":"Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking. HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd. Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.","2 Kor 4:16":"Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag.","Ps 62:6-8":"Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.","Fil 3:3":"Want wij zijn de besnijding, wij, die God in de Geest dienen, en in Christus Jezus roemen, en niet vertrouwen op het vlees.","Ps 26:6-8":"Ik was mijn handen in onschuld, en ik ga rondom Uw altaar, o HEERE! Om te laten horen de stem van de lof, en om te vertellen al Uw wonderen. HEERE! Ik heb lief de woning van Uw huis, en de plaats van de tabernakel van Uw eer.","Ps 94:15":"Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.","Ps 34:2-5":"Aleph. Ik zal de HEERE loven te allen tijde; Zijn lof zal voortdurend in mijn mond zijn. Beth. Mijn ziel zal zich beroemen in de HEERE; de zachtmoedigen zullen het horen en zich verblijden. Gimel. Maakt de HEERE met mij groot, en laten wij Zijn Naam samen verhogen.","Ps 73:12-22":"Zie, dezen zijn goddeloos; toch hebben zij rust in de wereld; zij vermeerderen hun vermogen. Zeker heb ik tevergeefs mijn hart gezuiverd, en mijn handen in onschuld gewassen. Want ik ben de hele dag geplaagd, en mijn straf is er elke morgen.","Ps 88:10-15":"Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?","Job 10:2":"Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.","Hand 13:31":"En Hij is vele dagen lang gezien door hen die met Hem waren opgekomen van Galilea naar Jeruzalem, die Zijn getuigen zijn bij het volk.","Luk 10:18":"En Hij zei tegen hen: Ik zag de satan als een bliksem uit de hemel vallen.","Ps 40:2-5":"Ik heb de HEERE lang verwacht; en Hij heeft Zich tot mij geneigd, en mijn geroep gehoord. En Hij heeft mij uit een ruisende kuil, uit modderig slijk opgehaald, en heeft mijn voeten op een rotssteen gesteld, Hij heeft mijn gangen vastgemaakt. En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.","Matt 24:30":"En dan zal in de hemel het teken van de Zoon des mensen verschijnen; en dan zullen alle geslachten van de aarde treuren, en zij zullen de Zoon des mensen zien komen op de wolken van de hemel, met grote kracht en heerlijkheid.","Deut 7:19":"de grote verzoekingen die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en de uitgestrekte arm, waardoor de HEERE, uw God, u heeft uitgevoerd; zo zal de HEERE, uw God, doen aan alle volken voor wie u bevreesd bent.","Jak 4:8":"Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!","Matt 7:7-12":"Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden. Of welk mens is er onder u die, als zijn zoon hem om brood zou vragen, hem een steen zal geven?","Ps 123:3":"Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.","Ps 21:5":"Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos.","Ps 48:9":"Zoals wij gehoord hadden, zo hebben wij gezien in de stad van de HEERE van de heerscharen, in de stad van onze God; God zal haar bevestigen tot in eeuwigheid. Sela.","Jes 8:10":"Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!","Num 4:12":"Zij zullen ook al het gereedschap van de dienst nemen, waarmee zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen het met een deksel van dassenvellen bedekken; en zij zullen het op de draagboom leggen.","Spr 16:21-24":"Wie wijs van hart is, zal verstandig genoemd worden; en zoetheid van de lippen zal de lering vermeerderen. Het verstand van hen die het bezitten is een bron van leven; maar de tucht van de dwazen is dwaasheid. Het hart van een wijze maakt zijn mond verstandig, en zal op zijn lippen de lering vermeerderen.","Jer 18:12":"Doch zij zeggen: Het is buiten hoop; maar wij zullen naar onze eigen gedachten wandelen, en wij zullen doen, ieder, wat zijn boze hart goeddunkt.","Jes 49:9-12":"Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn. Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden. En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.","Deut 32:31":"Want hun rotssteen is niet gelijk onze Rotssteen, zelfs onze vijanden zijn daar rechters over.","Ps 60:3-5":"O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.","Ps 84:3":"Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God.","Ps 89:47":"Hoe lang, o HEERE! zult Gij U steeds verbergen, zal Uw grimmigheid branden als een vuur?","2 Kron 20:6":"En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.","Ps 18:5-7":"Banden van de dood hadden mij omvangen, en beken van Belial verschrikten mij. Banden van het graf omringden mij, strikken van de dood bejegenden mij. Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; Hij hoorde mijn stem uit Zijn paleis, en mijn geroep voor Zijn aangezicht kwam in Zijn oren.","Ps 16:11":"U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.","Ps 27:1":"Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?","Ps 44:5":"U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.","Ps 18:2-4":"Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte! De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek. Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.","Ef 1:20":"Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;","Ps 74:19":"Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig.","2 Kor 6:4-10":"Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten, in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,","Ps 55:5-9":"Mijn hart doet mij pijn in mijn binnenste, en verschrikkingen van de dood zijn op mij gevallen. Vrees en beving komen over mij, en gruwen overdekt mij; Zodat ik zeg: Och, kreeg ik maar vleugels als een duif! ik zou wegvliegen, waar ik blijven mocht.","Ex 15:16":"Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.","Openb 14:6":"En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;","Ps 116:7":"Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.","Ps 35:25":"Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!","Gen 48:21":"Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.","2 Kron 20:12":"O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.","Ps 111:6":"Caph. Hij heeft de kracht van Zijn werken aan Zijn volk bekendgemaakt; Lamed. door hun de erve van de heidenen te geven.","Ps 103:1-4":"Een psalm van David. Loof de HEERE, mijn ziel, en al wat binnen in mij is, Zijn heilige Naam. Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;","Ps 89:11":"Gij hebt Rahab verbrijzeld als een verslagene; Gij hebt Uw vijanden verstrooid met de arm van Uw sterkte.","Spr 13:12":"De uitgestelde hoop maakt het hart ziek; maar de begeerte die komt, is een boom des levens.","2 Kor 4:16-18":"Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag. Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid; Omdat wij niet letten op de dingen die men ziet, maar op de dingen die men niet ziet; want de dingen die men ziet, zijn tijdelijk, maar de dingen die men niet ziet, zijn eeuwig.","Klaagl 3:1-36":"Aleph. Ik ben de man die ellende gezien heeft door de roede van Zijn verbolgenheid. Aleph. Hij heeft mij geleid en gevoerd in de duisternis, en niet in het licht. Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.","Ps 130:5":"Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord.","Hebr 7:25":"Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.","Ps 116:4":"Maar ik riep de Naam van de HEERE aan: Och HEERE, bevrijd mijn ziel.","1 Sam 2:10":"Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.","Ps 143:6":"Ik breid mijn handen uit tot U; mijn ziel is voor U als een dorstig land. Sela.","Ps 124:8":"Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.","Jona 2:1":"En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis.","Openb 14:7":"en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.","Ex 15:2":"De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!","Jes 59:16":"Omdat Hij zag dat er niemand was, ontzette Hij Zich, omdat er geen voorbidder was; daarom bracht Zijn arm Hem heil, en Zijn gerechtigheid ondersteunde Hem.","Ps 100:1-4":"Een lofzang. Heel de aarde, juich voor de HEERE! Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang. Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.","Ps 56:12":"Ik vertrouw op God, ik zal niet vrezen; wat zou de mens mij doen?","Jes 63:18":"Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden.","Ps 40:10":"Ik verkondig de gerechtigheid in de grote gemeente; zie, mijn lippen bedwing ik niet; HEERE! Gij weet het.","1 Kor 2:11":"Want wie van de mensen weet wat een mens is, dan de geest van de mens die in hem is? Zo weet ook niemand wat van God is, dan de Geest van God.","Ps 144:5":"Buig Uw hemelen, HEERE, en daal neer; raak de bergen aan, zodat ze roken.","Ps 70:3":"Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.","Ps 89:8":"God is zeer geducht in de raad van de heiligen, en te vrezen boven allen die rondom Hem zijn.","Ps 80:15":"O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,","Ps 17:13":"Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;","Ps 138:3":"Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.","Amos 9:6":"Die Zijn bovenzalen in de hemel bouwt, en Zijn gewelf heeft Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.","2 Kor 4:14":"Wetend dat Hij, Die de Heere Jezus opgewekt heeft, ook ons door Jezus zal opwekken, en met u daar zal stellen.","Job 34:28":"Opdat Hij op hem het geroep van de arme brengt, en het geroep van de ellendigen verhoort.","Luk 23:46":"En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.","2 Kron 30:18":"Want een menigte van het volk, velen uit Efraïm en Manasse, Issaschar en Zebulon, hadden zich niet gereinigd, maar aten het pascha, niet zoals geschreven is. Doch Hizkia bad voor hen, en zei: De HEERE, die goed is, doe verzoening voor ieder,","Jes 48:13":"Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.","Jes 51:10":"Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?","Ps 119:48":"En ik zal mijn handen opheffen naar Uw geboden, die ik liefheb, en ik zal Uw inzettingen betrachten.","Jer 8:20":"De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost.","Jer 10:23":"Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.","Spr 8:17":"Ik heb hen lief die Mij liefhebben; en die Mij vroeg zoeken, zullen Mij vinden.","Ps 16:5-9":"De HEERE is het deel van mijn erfenis en van mijn beker; U onderhoudt mijn lot. De snoeren zijn mij op fijne plaatsen gevallen; ja, een mooie erfenis is mij ten deel gevallen. Ik zal de HEERE loven, Die mij raad heeft gegeven; zelfs 's nachts onderwijzen mijn nieren mij.","1 Tim 2:8":"Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.","Ps 61:3":"Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.","Hoogl 2:6":"Zijn linkerhand is onder mijn hoofd, en Zijn rechterhand omhelst mij.","Pr iegen zal, en de velden geen voedsel voortbrengen; dat men de kudde uit de kooi zal wegscheuren, en dat er geen rund in de stallen zal zijn; Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil. De HEERE Heere is mijn Sterkte; en Hij zal mijn voeten maken als die van de hinden, en Hij zal mij doen treden op mijn hoogten. Voor de koorleider, op mijn Neginoth.","Spr 13:2":"Ieder zal van de vrucht van de mond het goede eten; maar de ziel van de trouwelozen het geweld.","Jes 2:19":"Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.","Jes 61:1-3":"De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.","Ps 141:8":"Doch op U zijn mijn ogen, HEERE, Heere; op U vertrouw ik, ontbloot mijn ziel niet.","Ps 35:28":"Zo zal mijn tong Uw gerechtigheid vermelden, en Uw lof de hele dag.","Job 23:10":"Toch kent Hij de weg die bij mij is; Hij beproeft mij; als goud zal ik uitkomen.","Luk 6:45":"De goede mens brengt het goede voort uit de goede schat van zijn hart; en de slechte mens brengt het kwade voort uit de kwade schat van zijn hart; want uit de overvloed van het hart spreekt zijn mond.","Ps 13:2-5":"Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen? Hoe lang zal ik plannen maken in mijn ziel, verdriet in mijn hart bij dag? Hoe lang zal mijn vijand boven mij verheven zijn? Kijk naar mij, verhoor mij, HEERE, mijn God; verlicht mijn ogen, zodat ik niet in de dood ontslaap;","1 Kor 2:16":"Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.","Gen 32:11":"Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!","Num 18:1":"Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.","Matt 22:29":"Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.","Luk 16:26":"En boven dit alles, tussen ons en u is een grote kloof gevestigd, zodat wie van hier naar u toe wil overgaan, dat niet zou kunnen, en ook zij die daar zijn, van daar naar ons toe niet kunnen overkomen.","Deut 29:29":"De verborgen dingen zijn voor de HEERE, onze God; maar de geopenbaarde dingen zijn voor ons en voor onze kinderen, tot in eeuwigheid, om al de woorden van deze wet te doen.","Ex 19:16":"En het gebeurde op de derde dag, toen het morgen was, dat er op de berg donder en bliksem waren, en een zware wolk, en het geluid van een zeer sterke bazuin, zodat al het volk dat in het leger was, beefde van schrik.","Spr 25:15":"Een leider wordt door geduld overreed; en een zachte tong breekt het gebeente.","2 Kon 19:16":"HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.","Num 23:22":"God heeft hen uit Egypte geleid; zijn krachten zijn als die van een eenhoorn.","Joël 1:19":"Tot U, HEERE, roep ik; want een vuur heeft de weiden van de woestijn verteerd, en een vlam heeft alle bomen van het veld aangestoken.","Jes 40:25":"Bij wie dan zult u Mij vergelijken, aan wie zou Ik gelijk zijn? zegt de Heilige.","Spr 12:14":"Ieder wordt van de vrucht van de mond met goed verzadigd; en de vergelding van de handen van de mens zal Hij hem terugbrengen.","Num 8:19":"En Ik heb de Levieten aan Aäron en aan zijn zonen als gift gegeven, uit het midden van de kinderen van Israël, om de dienst van de kinderen van Israël in de tent van de samenkomst te verrichten, en om voor de kinderen van Israël verzoening te doen, zodat er geen plaag onder de kinderen van Israël komt, als de kinderen van Israël tot het heiligdom zouden naderen.","1 Petr 1:6":"Daarin verheugt u zich, ook al bent u nu, voor een korte tijd (als het nodig is), bedroefd door allerlei beproevingen,","Ps 119:114":"U bent mijn Schuilplaats en mijn Schild; op Uw Woord heb ik gehoopt.","Ps 18:19":"Zij hadden mij bejegend ten dage van mijn ongeval; maar de HEERE was mij tot een Steunsel.","Job 4:3-6":"Zie, u hebt velen onderwezen, en u hebt slappe handen gesterkt; uw woorden hebben de struikelende opgericht, en de knieën die knikten hebt u vastgesteld; maar nu komt het aan bij u, en u bent verdrietig; het raakt tot u, en u wordt beroerd.","Ps 143:4":"Daarom wordt mijn geest overstelpt in mij, mijn hart is verbaasd in het midden van mij.","Openb 20:11":"En ik zag een grote witte troon, en Hem Die daarop zat, van Wiens aangezicht de aarde en de hemel wegvloden, en er werd geen plaats voor hen gevonden.","2 Kron 26:5":"Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.","Deut 4:34":"Of: of God ooit beproefd heeft te gaan om Zich een volk uit het midden van een ander volk aan te nemen, door beproevingen, door tekenen, en door wonderen, en door strijd, en door een sterke hand, en door een uitgestrekte arm, en met grote verschrikkingen; naar alles wat de HEERE, uw God, voor u in Egypte voor uw ogen gedaan heeft?","Jes 2:3":"En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.","2 Sam 22:15":"En Hij zond pijlen uit en verstrooide ze; bliksemen en verschrikte ze.","Ps 73:28":"Maar wat mij aangaat, het is mij goed om dicht bij God te zijn; ik stel mijn vertrouwen op de Heere HEERE, om al Uw werken te vertellen.","Rom 11:32":"Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.","Joh 15:2":"Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.","Mark 4:38":"En Hij lag in het achterschip te slapen op een kussen; en zij maakten Hem wakker, en zeiden tegen Hem: Meester, kan het U niet schelen dat wij vergaan?","Ps 35:19":"Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.","Num 14:9":"Wees alleen niet opstandig tegen de HEERE! En vrees het volk van dit land niet; want zij zijn ons brood! Hun bescherming is van hen geweken, en de HEERE is met ons; vrees hen niet!","Jes 45:22":"Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.","Joël 2:11":"En de HEERE verheft Zijn stem voor Zijn leger uit; want Zijn leger is zeer groot, want Hij is machtig, Hij die Zijn woord uitvoert; want de dag van de HEERE is groot en zeer vreselijk, en wie zal hem kunnen verdragen?","Zef 3:18":"De bedroefden, om de bijeenkomst, zal Ik verzamelen, zij zijn uit u; de smaad is een last op haar.","Joh 9:30-33":"De man antwoordde en zei tegen hen: Hierin zit toch iets wonderlijks, dat u niet weet vanwaar Hij is, en Hij heeft toch mijn ogen geopend. En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij. Van alle eeuwen af is het niet gehoord dat iemand de ogen van een blindgeborene geopend heeft.","Hebr 11:16-39":"maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt. Door het geloof heeft Abraham, toen hij beproefd werd, Izak geofferd, en hij die de beloften ontvangen had, heeft zijn enige zoon geofferd, (tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),","Ps 17:6-9":"Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden. Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan! Bewaar mij als het zwart van de oogappel, verberg mij onder de schaduw van Uw vleugels,","Ps 108:7":"Opdat Uw beminden bevrijd worden; geef heil door Uw rechterhand, en verhoor ons.","Ps 80:6":"U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.","2 Kron 2:6":"Doch wie zou de kracht hebben om voor Hem een huis te bouwen, aangezien de hemelen, ja, de hemel der hemelen, Hem niet bevatten kunnen? En wie ben ik, dat ik voor Hem een huis zou bouwen, behalve om reukwerk voor Zijn aangezicht aan te steken?","Hab 3:2-13":"HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen. God kwam van Theman, en de Heilige van de berg Paran. Sela. Zijn heerlijkheid bedekte de hemelen, en het aardrijk was vol van Zijn lof. En er was een glans als van het licht, Hij had hoornen aan Zijn hand, en daar was Zijn sterkte verborgen.","Job 9:10":"Die grote dingen doet, die men niet doorzoeken kan; en wonderen, die men niet tellen kan.","Openb 11:19":"En de tempel van God in de hemel is geopend, en de ark van het verbond is gezien in Zijn tempel; en er kwamen bliksems, en stemmen, en donderslagen, en aardbeving, en grote hagel.","Ps 90:1":"Een gebed van Mozes, de man van God. Heere! U bent ons geweest een Toevlucht van geslacht tot geslacht.","Dan 4:35":"En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?","2 Kron 16:9":"Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.","Ps 51:21":"Dan zult U lust hebben aan de offeranden van de gerechtigheid, aan brandoffer en een offer dat helemaal verteerd wordt; dan zullen zij jonge stieren offeren op Uw altaar.","Openb 4:5":"En van de troon gingen bliksemflitsen uit, en donderslagen, en stemmen; en zeven vurige lampen waren brandend voor de troon, welke de zeven Geesten van God zijn.","Hab 3:15":"U betrad met Uw paarden de zee; het geweldige water werd een hoop.","Ps 64:3":"Verberg mij voor de heimelijke afspraken van de boosdoeners, voor het oproer van de werkers van ongerechtigheid.","Hebr 12:6":"Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.","Ps 119:145":"Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren.","Jes 16:12":"En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.","Klaagl 2:19":"Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.","2 Kron 5:14":"En de priesters konden, vanwege die wolk, niet staan om te dienen; want de heerlijkheid van de HEERE had het huis van God vervuld.","Ps 118:18":"De HEERE heeft mij wel hard gekastijd; maar Hij heeft mij niet ter dood overgegeven.","Ps 145:6":"Vau. En zij zullen vermelden de kracht van Uw ontzagwekkende daden; en Uw grootheid, die zal ik vertellen.","Neh 4:4":"Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.","Ps 61:2":"O God! hoor mijn geschrei, merk op mijn gebed.","1 Kron 28:9":"En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.","Jes 43:13":"Ook eer de dag was, ben Ik, en er is niemand, die uit Mijn hand redden kan; Ik zal werken, en wie zal het keren?","Luk 1:38":"En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg.","Openb 15:3":"En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!","Ps 3:3":"Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.","Jak 3:2":"Want wij struikelen allen in veel dingen. Als iemand in woorden niet struikelt, die is een volmaakt man, in staat om ook het hele lichaam in toom te houden.","Gen 3:16":"Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen.","Jes 43:17":"Die wagens en paarden, leger en macht voortbracht; samen zijn zij neergelegen, zij zullen niet weer opstaan, zij zijn uitgeblust, als een vlaswiek zijn zij uitgegaan.","Ps 66:20":"Geloofd zij God, Die mijn gebed niet heeft afgewend, en Zijn goedertierenheid niet van mij.","Amos 5:8":"Die n over.","Spr 17:7":"Een voortreffelijke lip past een dwaas niet, veel minder een vorst een leugenachtige lip.","1 Sam 14:6":"Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.","1 Sam 1:11":"En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.","Job 37:1-23":"Ook hierover beeft mijn hart, en springt op uit zijn plaats. Hoort met aandacht naar de beweging van Zijn stem, en het geluid dat uit Zijn mond uitgaat! Dat zendt Hij rechtuit onder de hele hemel, en Zijn licht over de einden der aarde.","1 Petr 2:12":"En houd uw levenswandel eerlijk onder de heidenen; opdat, waar zij nu kwaad van u spreken als van kwaaddoeners, zij door de goede werken die zij van u zien, God mogen verheerlijken op de dag dat Hij naar hen omziet.","Ps 88:4-19":"Want mijn ziel is verzadigd van tegenspoed, en mijn leven raakt tot aan het graf. Ik word gerekend bij hen die in de kuil neerdalen; ik ben geworden als een man die geen kracht heeft; Afgezonderd onder de doden, zoals de verslagenen die in het graf liggen, die U niet meer gedenkt, en zij zijn afgesneden van Uw hand.","Jer 23:24-26":"Zou iemand zich in verborgen plaatsen kunnen verbergen, zodat Ik hem niet zou zien? spreekt de HEERE; vervul Ik niet de hemel en de aarde? spreekt de HEERE. Ik heb gehoord wat de profeten zeggen, die in Mijn Naam leugen profeteren, en zeggen: Ik heb gedroomd, ik heb gedroomd. Hoe lang? Is er dan een droom in het hart van de profeten, die de leugen profeteren? Ja, het zijn profeten van de bedriegerij van hun eigen hart.","Deut 28:65-67":"Daarbij zult u onder die volken geen rust vinden, en uw voetzool zal geen rust hebben; want de HEERE zal u daar een bevend hart geven, en bezwijking van de ogen, en kwelling van de ziel. En uw leven zal voor u onzeker hangen; en u zult nacht en dag angst hebben, en u zult niet zeker zijn van uw leven. Des morgens zult u zeggen: Was het maar avond; en des avonds zult u zeggen: Was het maar morgen; vanwege de schrik van uw hart, waarmee u geschrokken zult zijn, en vanwege wat uw ogen te zien krijgen.","Klaagl 5:19-22":"U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht. Waarom zou U ons voor altijd vergeten? Waarom zou U ons zo lange tijd verlaten? HEERE, bekeer ons tot U, dan zullen wij bekeerd zijn; vernieuw onze dagen als vanouds.","Ps 79:5":"Hoe lang, HEERE? Zult U eeuwig toornen? Zal Uw ijver als vuur branden?","Ps 33:20":"Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild.","Spr 21:30":"Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.","Ps 86:1-17":"Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig. Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt. Wees mij genadig, Heere! want ik roep tot U de hele dag.","Pred 1:16":"Ik sprak met mijn hart en zei: Zie, ik heb wijsheid vergroot en vermeerderd, boven allen die vóór mij te Jeruzalem geweest zijn; en mijn hart heeft veel wijsheid en kennis gezien.","Openb 21:6":"En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.","Ps 56:4":"Ten dage dat ik zal vrezen, zal ik op U vertrouwen.","Hebr 11:13":"Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren.","Jes 33:3":"Van het geluid van het rumoer zullen de volken wegvluchten; van Uw verhoging zullen de heidenvolken verstrooid worden.","2 Tim 4:8":"Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.","Ps 39:4":"Mijn hart werd heet in mijn binnenste, een vuur ontbrandde in mijn overdenking; toen sprak ik met mijn tong:","Ps 22:27":"De zachtmoedigen zullen eten en verzadigd worden; zij zullen de HEERE prijzen, die Hem zoeken; uw hart zal in eeuwigheid leven.","Ps 13:6":"Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.","1 Kron 28:10":"Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.","Klaagl 3:18-23":"Vau. Toen zei ik: Mijn sterkte is vergaan, en mijn hoop van de HEERE. Zain. Denk aan mijn ellende en aan mijn ballingschap, aan de alsem en gal. Zain. Mijn ziel denkt er wel terdege aan, en zij buigt zich neer in mij.","Ps 31:2":"Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid.","Hebr 11:5":"Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming had hij het getuigenis dat hij God behaagde.","Jes 38:20":"De HEERE was gereed om mij te verlossen; daarom zullen wij op mijn snarenspel spelen, al de dagen van ons leven, in het huis van de HEERE.","Ef 4:29":"Laat geen vuile taal uit uw mond komen, maar als er iets goeds is tot nuttige opbouw, opdat het genade geeft aan hen die het horen.","Rom 15:29":"En ik weet dat ik, wanneer ik tot u kom, met volle zegen van het Evangelie van Christus komen zal.","Ps 42:10":"Ik zal zeggen tot God: Mijn Steenrots! Waarom vergeet U mij? Waarom ga ik in het zwart, vanwege de onderdrukking van de vijand?","Job 17:13-16":"Als ik wacht, het graf zal mijn huis wezen; in de duisternis zal ik mijn bed spreiden. Tot de groeve roep ik: U bent mijn vader! Tot het gewormte: Mijn moeder, en mijn zuster! Waar zou dan nu mijn verwachting wezen? Ja, mijn verwachting, wie zal ze aanschouwen?","Ps 63:3":"Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien;","2 Kron 33:13":"En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.","Ps 104:29":"Verbergt U Uw gezicht, zij worden angstig; neemt U hun adem weg, zij sterven, en zij keren terug tot hun stof.","1 Kron 28:20":"En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.","Ps 89:2":"Ik zal de goedertierenheid van de HEERE eeuwig zingen; ik zal Uw waarheid met mijn mond bekend maken, van geslacht tot geslacht.","Ps 30:2-7":"Ik zal U verhogen, HEERE, want U hebt mij opgetrokken, en mijn vijanden over mij niet verblijd. HEERE, mijn God! ik heb tot U geroepen, en U hebt mij genezen. HEERE! U hebt mijn ziel uit het graf opgevoerd; U hebt mij bij het leven behouden, zodat ik niet in de kuil neerdaalde.","Deut 26:8":"En de HEERE voerde ons uit Egypte, door een sterke hand, en door een uitgestrekte arm, en door grote schrik, en door tekenen, en door wonderen.","Ps 41:13":"Want mij aangaande, U onderhoudt mij in mijn oprechtheid, en U stelt mij voor Uw aangezicht in eeuwigheid.","Ps 35:18":"Zo zal ik U loven in de grote gemeente; onder machtig veel volk zal ik U prijzen.","2 Kron 25:9":"En Amazia zei tegen de man van God: Maar wat moet men doen met de honderd talenten, die ik aan de troepen van Israël gegeven heb? En de man van God zei: De HEERE heeft meer dan dit, om u te geven.","Ps 126:1-3":"Een lied Hammaäloth. Toen de HEERE de gevangenen van Sion terugbracht, waren wij als mensen die dromen. Toen was onze mond vol lachen, en onze tong vol gejuich; toen zei men onder de heidenvolken: De HEERE heeft grote dingen aan hen gedaan. De HEERE heeft grote dingen bij ons gedaan; daarom zijn wij verblijd.","1 Kor 11:20-22":"Als u dan bijeen samenkomt, is dat niet het avondmaal van de Heere eten. Want bij het eten neemt ieder van tevoren zijn eigen avondmaal; en de een is hongerig, en de ander is dronken. Hebt u dan geen huizen om te eten en te drinken? Of veracht u de Gemeente van God, en beschaamt u degenen die niets hebben? Wat zal ik u zeggen? Zal ik u prijzen? Hierin prijs ik u niet.","Dan 3:17":"Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.","Ps 31:23":"Ik zei wel in mijn haast: Ik ben afgesneden van voor Uw ogen; maar toch hoorde U de stem van mijn smekingen, toen ik tot U riep.","Ps 3:7":"Ik zal niet bang zijn voor tienduizenden van het volk, die zich rondom tegen mij opstellen.","Ps 28:6-8":"Geprezen zij de HEERE, want Hij heeft de stem van mijn smekingen gehoord. De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven. De HEERE is hun Sterkte, en Hij is de Sterkheid van de verlossingen van Zijn Gezalfde.","Ps 52:10":"Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.","Job 13:15":"Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.","Ps 54:6":"Zie, God is mij een Helper; de Heere is onder hen die mijn ziel ondersteunen.","1 Kor 11:13":"Oordeel bij uzelf: is het gepast dat de vrouw ongedekt tot God bidt?","Hebr 5:7":"Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.","Hebr 1:3":"Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;","Jes 46:5":"Aan wie zou u Mij gelijk maken, en gelijkstellen, en Mij vergelijken, dat wij op elkaar zouden lijken?","Ps 27:4":"Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.","Job 37:23":"De Almachtige, Hem kunnen wij niet doorgronden; Hij is groot van kracht; doch door recht en grote gerechtigheid verdrukt Hij niet.","Dan 6:11":"Toen Daniël nu begreep dat dit geschrift ondertekend was, ging hij naar zijn huis (hij had namelijk in zijn bovenzaal open vensters in de richting van Jeruzalem), en hij knielde drie keer per dag op zijn knieën, en hij bad, en dankte voor het aangezicht van zijn God, geheel zoals hij hiervoor gedaan had.","Ps 27:12":"Geef mij niet over in de begeerte van mijn tegenstanders; want valse getuigen zijn tegen mij opgestaan, alsook wie geweld uitblaast.","Spr 17:3":"De smeltkroes is voor het zilver, en de oven voor het goud; maar de HEERE toetst de harten.","Kol 4:6":"Laat uw woord altijd aangenaam zijn, met zout besprengd, opdat u weet hoe u ieder moet antwoorden.","Dan 2:20":"Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.","Ps 145:4-7":"Daleth. Geslacht aan geslacht zal Uw werken roemen; en zij zullen Uw machtige daden verkondigen. He. Ik zal uitspreken de heerlijkheid van de eer van Uw majesteit, en Uw wonderlijke daden. Vau. En zij zullen vermelden de kracht van Uw ontzagwekkende daden; en Uw grootheid, die zal ik vertellen.","Ps 4:5":"Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.","Ps 40:18":"Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.","Jak 1:19":"Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;","Job 13:21":"Doe Uw hand ver van mij weg, en laat Uw verschrikking mij niet verbaasd maken.","Ps 39:14":"Wend U van mij af, dat ik verkwikt word, voordat ik heenga, en er niet meer ben.","Ps 28:6":"Geprezen zij de HEERE, want Hij heeft de stem van mijn smekingen gehoord.","Ps 147:16":"Hij geeft sneeuw als wol; Hij strooit de rijp als as.","Dan 4:1-37":"Koning Nebukadnezar aan alle volken, natiën en talen, die op de hele aardbodem wonen: uw vrede moet vermenigvuldigd worden! Het behaagt mij te verkondigen de tekenen en wonderen, die de allerhoogste God aan mij gedaan heeft. Hoe groot zijn Zijn tekenen! En hoe machtig Zijn wonderen! Zijn Rijk is een eeuwig Rijk, en Zijn heerschappij is van geslacht tot geslacht.","Job 23:14":"Want Hij zal volbrengen wat over mij bepaald is; en dergelijke dingen zijn er veel bij Hem.","Ps 80:2":"O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.","Luk 8:25":"En Hij zei tegen hen: Waar is uw geloof? Maar zij werden bevreesd en verwonderden zich, en zeiden tegen elkaar: Wie is toch Deze, dat Hij ook de winden en het water gebiedt, en zij Hem gehoorzaam zijn?","Hebr 12:18":"Want u bent niet gekomen tot de tastbare berg, en het brandende vuur, en donkerheid, en duisternis, en onweer,","Ps 119:154":"Twist mijn twistzaak, en verlos mij, maak mij levend, naar Uw toezegging.","Jer 17:17":"Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.","Ex 18:11":"Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.","Jes 8:17":"Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.","Num 14:34":"Naar het getal van de dagen waarin u dat land verspied hebt, veertig dagen, elke dag voor elk jaar, zult u uw ongerechtigheden dragen, veertig jaar, en u zult Mijn tegenwerking ervaren.","Jer 32:27":"Zie, Ik ben de HEERE, de God van alle vlees; zou voor Mij iets te wonderlijk zijn?","Klaagl 3:26":"Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.","Pred 11:5":"Zoals u niet weet wat de weg van de wind is, of hoe de beenderen zijn in de buik van een zwangere vrouw, zo weet u het werk van God niet, Die het alles maakt.","Klaagl 3:58":"Resch. Heere! U hebt de rechtszaken van mijn ziel bepleit, U hebt mijn leven verlost.","Jes 49:23":"En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.","Ps 78:12-16":"Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan. Hij kliefde de zee, en liet hen erdoorheen gaan; en de wateren liet Hij staan als een hoop. En Hij leidde hen overdag met een wolk, en de hele nacht met een licht van het vuur.","Ps 102:4-12":"Want mijn dagen zijn vergaan als rook, en mijn beenderen zijn uitgebrand als een haard. Mijn hart is geslagen en verdord als gras, zodat ik vergeten heb mijn brood te eten. Mijn beenderen kleven aan mijn vlees, vanwege de stem van het zuchten.","Ps 132:14":"Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd.","Jer 51:15":"Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid door Zijn verstand;","Ps 139:24":"En zie, of er bij mij een schadelijke weg is; en leid mij op de eeuwige weg.","Job 36:27-33":"Want Hij trekt de druppels van het water op, die als regen neerdruppelen door zijn damp; Die de wolken uitgieten, en over de mens overvloedig afdruipen. Kan iemand ook verstaan de uitbreidingen van de wolken, en de donderslagen van Zijn tent?","Ps 25:20":"Schin. Bewaar mijn ziel, en red mij; laat mij niet beschaamd worden, want ik vertrouw op U.","2 Petr 3:13":"Maar wij verwachten, naar Zijn belofte, nieuwe hemelen en een nieuwe aarde, waarin gerechtigheid woont.","Job 37:3":"Dat zendt Hij rechtuit onder de hele hemel, en Zijn licht over de einden der aarde.","Ps 107:13-20":"Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten. Hij voerde hen uit de duisternis en de schaduw van de dood, en Hij brak hun banden. Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;","Jes 24:1-16":"Zie, de HEERE maakt het land leeg, en Hij maakt het woest; en Hij keert de gestalte ervan om, en Hij verstrooit zijn inwoners. En zoals het met het volk zal gaan, zo zal het met de priester zijn; zoals met de knecht, zo met zijn heer; zoals met de dienstmaagd, zo met haar vrouw; zoals met de koper, zo met de verkoper; zoals met de lener, zo met de ontlener; zoals met de woekeraar, zo met hem van wie hij woeker ontvangt. Dat land zal helemaal leeg gemaakt worden, en het zal helemaal beroofd worden; want de HEERE heeft dit woord gesproken.","Jes 59:20":"En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.","Ex 28:34":"Dat er een gouden schelletje, daarna een granaatappel is; opnieuw een gouden schelletje, en een granaatappel, aan de zomen van de mantel rondom.","Job 2:13":"Zo zaten zij met hem op de grond, zeven dagen en zeven nachten; en niemand sprak een woord tegen hem, want zij zagen dat de smart zeer groot was.","Rom 8:18":"Want ik houd het ervoor, dat het lijden van deze tegenwoordige tijd niet opweegt tegen de heerlijkheid die aan ons geopenbaard zal worden.","Ps 97:3-5":"Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand. Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft. De bergen smelten als was voor het aangezicht van de HEERE, voor het aangezicht van de Heere van de hele aarde.","Ps 18:15":"En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.","Pred 3:7":"Een tijd om te scheuren, en een tijd om toe te naaien; een tijd om te zwijgen, en een tijd om te spreken;","Ps 92:6":"O HEERE! hoe groot zijn Uw werken! Zeer diep zijn Uw gedachten.","Matt 3:9":"En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken.","Ps 28:7":"De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.","Ps 98:3":"Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.","Mark 10:27":"Maar Jezus keek hen aan, en zei: Bij de mensen is het onmogelijk, maar niet bij God; want bij God zijn alle dingen mogelijk.","Ps 135:6":"Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden.","1 Sam 1:10":"Zij dan, bitter bedroefd zijnde, bad tot de HEERE, en zij weende zeer.","2 Kor 1:10":"Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.","Ps 42:9":"Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.","1 Petr 3:16":"en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.","Ps 69:37":"En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.","Ps 119:46":"Ook zal ik voor koningen gmoed; maar de lippen van de wijzen bewaren hen.","Ps 98:2":"De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen.","Ps 85:6-8":"Zult U eeuwig tegen ons toornen? Zult U Uw toorn uitstrekken van geslacht tot geslacht? Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt? Toon ons Uw goedertierenheid, o HEERE, en geef ons Uw heil.","Ps 69:2-4":"Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel. Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij. Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.","2 Petr 1:16":"Want wij hebben geen kunstig verzonnen fabels nagevolgd, toen wij u de kracht en toekomst van onze Heere Jezus Christus bekendmaakten, maar wij zijn ooggetuigen geweest van Zijn majesteit.","Num 23:21":"Hij ziet geen ongerechtigheid in Jakob; ook ziet Hij geen boosheid in Israël. De HEERE, zijn God, is met hem, en het geschal van de Koning is bij hem.","Ps 29:10":"De HEERE heeft gezeten over de watervloed; ja, de HEERE zit, Koning in eeuwigheid.","Ps 46:2-4":"God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden. Daarom zullen wij niet vrezen, al veranderde de aarde haar plaats, en al werden de bergen verzet in het hart van de zeeën; Laat haar water bruisen, laat het beroerd worden; laat de bergen daveren, door de verheffing daarvan! Sela.","Ps 74:12":"Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.","Ezech 48:21":"En het overgelatene zal voor de vorst zijn, van deze en van gene zijde van het heilig hefoffer, en van de bezitting van de stad, voor aan de vijfentwintigduizend meetrieten van het hefoffer, tot aan de oostgrens en westgrens, voor aan de vijfentwintigduizend aan de westgrens, tegenover de andere delen, dat zal voor de vorst zijn; en het heilig hefoffer, en het heiligdom van het huis, zal in het midden daarvan zijn.","Klaagl 3:40":"Nun. Laat ons onze wegen onderzoeken en doorzoeken, en laat ons terugkeren tot de HEERE.","Ps 108:13":"Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.","Hab 3:4":"En er was een glans als van het licht, Hij had hoornen aan Zijn hand, en daar was Zijn sterkte verborgen.","Jes 17:13":"De naties zullen wel ruisen, zoals grote wateren ruisen; maar Hij zal het bestraffen, zo zal het ver wegvluchten, ja, het zal opgejaagd worden als het kaf van de bergen voor de wind, en als een bal voor de wervelwind.","Jona 2:1-10":"En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis. En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.","Ps 69:36":"Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;","Ps 29:2":"Geef de HEERE de eer van Zijn Naam, aanbid de HEERE in de heerlijkheid van het heiligdom.","Ps 65:5":"Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.","Neh 1:10":"Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.","Jer 15:18":"Waarom is mijn pijn steeds durend, en mijn plaag smartelijk? Zij weigert genezen te worden; zou U voor mij helemaal als een leugenachtige zijn, als water dat niet betrouwbaar is?","Ps 147:18":"Hij zendt Zijn woord, en doet ze smelten; Hij laat Zijn wind waaien, de wateren stromen weg.","Ps 60:12":"Zult U het niet zijn, o God! Die ons verstoten had, en niet uittrok, o God! met onze legers?","Ps 18:4":"Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.","Ps 74:3":"He ning; met het licht gingen Uw pijlen daarheen, met glans Uw bliksemende speer.","Ps 89:39":"Maar Gij hebt hem verstoten en verworpen; Gij bent verbolgen geworden tegen Uw gezalfde.","Lev 16:2":"De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel.","Ex 15:6-8":"O HEERE! Uw rechterhand is verheerlijkt in macht; Uw rechterhand, o HEERE, heeft de vijand verbroken! En door Uw grote hoogheid hebt U hen die tegen U opstonden, omgeworpen; U hebt Uw brandende toorn losgelaten, die hen verteerd heeft als een stoppel. En door het geblaas van Uw neus zijn de wateren opgehoopt; de stromen hebben overeind gestaan als een hoop; de afgronden zijn stijf geworden in het hart van de zee.","Ps 107:6-8":"Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij heeft hen gered uit hun angsten; En Hij leidde hen op een rechte weg, om te gaan naar een stad om in te wonen. Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;","Job 16:20":"Mijn vrienden bespotten mij; maar mijn oog druipt tot God.","1 Petr 5:9":"Weersta hem, vast staand in het geloof, in de wetenschap dat hetzelfde lijden wordt volbracht aan uw broederschap die in de wereld is.","Ps 71:4":"Mijn God, bevrijd mij van de hand van de goddeloze, van de hand van hem die verkeerd handelt, en van de opgeblazene.","Joël 2:13":"En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.","Ps 71:2":"Red mij door Uw gerechtigheid, en bevrijd mij; neig Uw oor tot mij, en verlos mij.","Zach 9:14":"En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen
