minnen, de leugen zoeken? Sela.","4":"Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.","5":"Zijt beroerd, en zondigt niet; spreekt in ulieder hart op uw leger, en zijt stil. Sela.","6":"Offert offeranden der gerechtigheid, en vertrouwt op den HEERE.","7":"Velen zeggen: Wie zal ons het goede doen zien? Verhef Gij over ons het licht Uws aanschijns, o HEERE!","8":"Gij hebt vreugde in mijn hart gegeven, meer dan ter tijd, als hun koren en hun most vermenigvuldigd zijn.","9":"Ik zal in vrede te zamen nederliggen en slapen; want Gij, o HEERE! alleen zult mij doen zeker wonen."},"KJV":{"1":"[[To the chief Musician on Neginoth, A Psalm of David.]] Hear me when I call, O God of my righteousness: thou hast enlarged me *when I was* in distress; have mercy upon me, and hear my prayer.","2":"[[To the chief Musician on Neginoth, A Psalm of David.]] Hear me when I call, O God of my righteousness: thou hast enlarged me *when I was* in distress; have mercy upon me, and hear my prayer.","3":"O ye sons of men, how long *will ye turn* my glory into shame? *how long* will ye love vanity, *and* seek after leasing? Selah.","4":"But know that the LORD hath set apart him that is godly for himself: the LORD will hear when I call","5":"Stand in awe, and sin not: commune with your own heart upon your bed, and be still. Selah.","6":"Offer the sacrifices of righteousness, and put your trust in the LORD.","7":"*There be* many that say, Who will shew us *any* good? LORD, lift thou up the light of thy countenance","8":"Thou hast put gladness in my heart, more than in the time *that* their corn and their wine increased.","9":"I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety."}},"tsk":{"2":[{"kopje":"verhoor mij","refs":["Ps 6:2","Ps 67:2","Ps 76:2","Hab 3:19"]},{"kopje":"o","refs":["Ps 11:7","Ps 24:5","Ps 41:13","Jes 45:24","Jer 23:6","1 Kor 1:30","2 Kor 5:20","2 Kor 5:21"]},{"kopje":"U","refs":["Ps 1 ass=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in safety."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"opperzangmeester","tekst":"Dat is, die den opperzangmeester gegeven werd, om dien in het huis des Heeren te doen spelen en zingen. Het Hebr. woord overwinnaar, en voorts aandrijver, voortdrijver, die anderen, onder zijn opzicht gesteld zijnde, in kloekheid overwint of teboven gaat, en het werk aandrijft totdat het als overwonnen en ten einde gebracht is; en vervolgens in zake van gezang, een meester, opziener, voorganger van de zangers en speellieden. Verg. Psa 13:1 , en zie 2Ch 2:2 , 2Ch 2:18 , 2Ch 34:12-13 ; Ezr 3:8-9 . Aangaande deze ordinantie in de muziek van den godsdienst, zie 1Ch 6:31 , enz., en 1Ch 15:16-17 , enz., en 1Ch 16:4-5 , 1Ch 16:7 , en 1Ch 25:1-2 , enz."},{"catchword":"neginòth","tekst":"Of, in, met Neginoth. Hierdoor verstaan sommigen het snarenspel, of de instumenten van muziek, waarop met vingers gegrepen, geslagen of gespeeld werd, gelijk bij ons zijn luiten, harpen, cithers, vedelen, clavecimbalen, enz. Anderen houden het voor zekeren toon van de muziek."},{"catchword":"roep,","tekst":"Te weten, tot U, gelijk Psa 1:4 , dat is, vuriglijk bid. Zie Job 36:13 ; alzo dikwijls."},{"catchword":"gerechtigheid","tekst":"Dat is, die mijn rechtvaardige zaak voorstaat."}],"2":[{"catchword":"opperzangmeester","tekst":"Dat is, die den opperzangmeester gegeven werd, om dien in het huis des Heeren te doen spelen en zingen. Het Hebr. woord overwinnaar, en voorts aandrijver, voortdrijver, die anderen, onder zijn opzicht gesteld zijnde, in kloekheid overwint of teboven gaat, en het werk aandrijft totdat het als overwonnen en ten einde gebracht is; en vervolgens in zake van gezang, een meester, opziener, voorganger van de zangers en speellieden. Verg. Psa 13:1 , en zie 2Ch 2:2 , 2Ch 2:18 , 2Ch 34:12-13 ; Ezr 3:8-9 . Aangaande deze ordinantie in de muziek van den godsdienst, zie 1Ch 6:31 , enz., en 1Ch 15:16-17 , enz., en 1Ch 16:4-5 , 1Ch 16:7 , en 1Ch 25:1-2 , enz."},{"catchword":"neginòth","tekst":"Of, in, met Neginoth. Hierdoor verstaan sommigen het snarenspel, of de instumenten van muziek, waarop met vingers gegrepen, geslagen of gespeeld werd, gelijk bij ons zijn luiten, harpen, cithers, vedelen, clavecimbalen, enz. Anderen houden het voor zekeren toon van de muziek."},{"catchword":"roep,","tekst":"Te weten, tot U, gelijk Psa 1:4 , dat is, vuriglijk bid. Zie Job 36:13 ; alzo dikwijls."},{"catchword":"gerechtigheid","tekst":"Dat is, die mijn rechtvaardige zaak voorstaat."}],"3":[{"catchword":"Gij mannen,","tekst":"Hebr. mans zonen, of mans kinderen, Alzo worden de grote of aanzienlijke lieden en heren genoemd, gelijk de gemene, onaanzienlijke lieden kinderen, of zonen der mensen, in tegenstelling genoemd worden; Psa 49:3 , Psa 62:10 ; Pro 8:4 . Verg. ook Isa 2:9 ."},{"catchword":"eer tot","tekst":"Dat mij God door Samuël tot een koning heeft doen zalven."},{"catchword":"leugen","tekst":"Om mij met valse beschuldiging te bezwaren, of, u daarop verlaten, waarmede gij bedrogen zult uitkomen, dat toch feilen en u bedriegen zal. In zulk een zin kan het Hebreeuwse woord ook bekwamelijk worden genomen, uit vergelijking van 2Ki 4:16 ; Job 40:28 ; Psa 89:36 ; Isa 58:11 . Verg. voorts Psa 7:15 , en Psa 60:13 ."},{"catchword":"Sela","tekst":"Zie van dit woord Psa 3:3 ."}],"4":[{"catchword":"gunstgenoot","tekst":"Te weten, mij, dien God onverdiende goedertierenheid, gunst en weldadigheid bewijst, welke ik genietende en gevoelende, ook van harte genegen ben anderen gunst en we`ldadigheid te bewijzen, zelfs mijnen haters, naar den aard en plicht der kinderen Gods. Zie Mat 5:44-45 ; 1Jo 4:11 , en voorts van het Hebr. woord zie 2Ch 6:41 ."},{"catchword":"heeft afgezonderd;","tekst":"Te weten, tot het koninkrijk. Het Hebr. woord heeft betekenis van wonderlijk handelen en ook afzonderen. Waarom sommigen het overzetten: wonderlijk afgezonderd. Zie Exo 9:4 , en Exo 11:7 , en Exo 33:16 ; idem Psa 17:7 , enz."}],"5":[{"catchword":"Zijt beroerd,","tekst":"Alsof hij zeide: Zo gij u vertoornt of onstelt, òf over mijne verkiezing tot het koninkrijk, òf dat de zaken in het land kwalijk gaan, vergrijpt u daarom niet tegen mij, maar bekeert u en verzoent u met God; of, zijt beroerd; te weten door vrees van Gods zwaren toorn, dien gij op u laadt, en vaart niet voort in het zondigen."},{"catchword":"spreekt","tekst":"Dat is, denkt, overpeinst bij uzelven, [verg. Psa 14:1 , en Psa 35:25 ; Mat 24:48 ; Rom 10:6 , Rev 18:7 ] , overwegende uw doen, oordelende uzelven."},{"catchword":"zijt stil","tekst":"Laat af van mij te vervolgen."}],"6":[{"catchword":"offeranden","tekst":"Dat is, wettelijke offeranden, vergezelschapt met een oprecht geloof en bekering des harten. Alzo onder Psa 51:21 ."}],"7":[{"catchword":"Wie","tekst":"Of, och of iemand ons het goede deed zien? een manier van wensen. Zie Deu 5:29 , alsof zij zeiden: Hoe zullen wij nog eens uit deze onrusten en kwellingen geraken? Of: och mochten wij een vruchtbaar en vredelijk jaar hebben!"},{"catchword":"zien?","tekst":"Dat is, doen genieten. Zie Job 7:7 ."},{"catchword":"Verhef Gij","tekst":"Alsof de profeet zeide: Ik daarentegen zeg: Alles zal wel zijn, als maar Gij, o God, enz."},{"catchword":"licht","tekst":"Zie Num 6:25-26 ."}],"8":[{"catchword":"Gij hebt","tekst":"O God."},{"catchword":"vreugde","tekst":"Geestelijke vreugde, door het licht uws aanschijns, die groter is dan de hunne placht te zijn over een overvloedigen oogst. Verg. Son 1:2 , Son 1:4 , en zie de aantekening bij Hos 9:1 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A Psalm of David for the chief song-master, [i.e. given to the chief song-master, for to be played and sung in the house of the LORD. The Hebrew word doth signify, an overcommer, conqueror, and withal an exciter; instigator, stirring up, and driving on, i.e. one that overcometh and excelleth in skill and ability, such as are commited unto and under his inspection and government; driving on and urging the work, till it be as were overcome and consummated, and consequently in matter of singing, or music, a Master, Insepector, Director and Leader of those that sing and play on musical Instruments. Compare Psa.13.on v.2. and see 2 Chron.2.1,18. And 34.12,13. Ezra 3.8, 9. Touching these Ordinances in the music of the public worship, see 1 Chron.6.31. &c.and 15. 16, 17. &c. And 16.4,5,7. And 25.1,2, &c.] on Neginoth. [or, in with, Neg: Hereby some understand the string-play, or the instruments of music, which are touched or struck, or played upon with fingers, in manner as with us now, the Lute, the Harp, the Gittern, the Viol, the Virginals, &c. Others hold it to imply a certain tune or air of music.] (4:2) When I do call, [viz. Unto thee, as v.4. i.e. pray servently; see Job 36.on v.13. and thus frequently] hear me, O God of righteousness, [i.e. that doest maintain my righteous cause] In distress hast made me room: be gracious unto me, and hear my payer."}],"2":[{"catchword":null,"tekst":"A Psalm of David for the chief song-master, [i.e. given to the chief song-master, for to be played and sung in the house of the LORD. The Hebrew word doth signify, an overcommer, conqueror, and withal an exciter; instigator, stirring up, and driving on, i.e. one that overcometh and excelleth in skill and ability, such as are commited unto and under his inspection and government; driving on and urging the work, till it be as were overcome and consummated, and consequently in matter of singing, or music, a Master, Insepector, Director and Leader of those that sing and play on musical Instruments. Compare Psa.13.on v.2. and see 2 Chron.2.1,18. And 34.12,13. Ezra 3.8, 9. Touching these Ordinances in the music of the public worship, see 1 Chron.6.31. &c.and 15. 16, 17. &c. And 16.4,5,7. And 25.1,2, &c.] on Neginoth. [or, in with, Neg: Hereby some understand the string-play, or the instruments of music, which are touched or struck, or played upon with fingers, in manner as with us now, the Lute, the Harp, the Gittern, the Viol, the Virginals, &c. Others hold it to imply a certain tune or air of music.] (4:2) When I do call, [viz. Unto thee, as v.4. i.e. pray servently; see Job 36.on v.13. and thus frequently] hear me, O God of righteousness, [i.e. that doest maintain my righteous cause] In distress hast made me room: be gracious unto me, and hear my payer."}],"3":[{"catchword":null,"tekst":"(3) Yee men [Heb. sons; (or children) of the man (Viri). Thus the great ones are called, such as are eminent in honour and authority; as the meaner sort, in opposition are teamed, children (or sons) of man, (homiminis:) Psa 49:3. and 62.10. Pro 8:4. compare also Isa 2:9.] how long shall mine honour [that God caused me to be anointed King by Samuel] be (put) to shame? (how long) shall ye love vanity, seek the ly? [to charge me with false imputation, or rely on that which shall deceive you at last, and fail and foil your expectation. In this sense the Hebrew word may conveniently be taken likewise, by comparing 2 Kings 4.16. Job 40:28. Psa 89:36. Isa 58:11. Compare moreover Psa 7:15. and 60.17.] Sela. [See above 3.on v.3.]"}],"4":[{"catchword":null,"tekst":"(4) Know ye that the LORD hath separated him, [viz. For the Kingdom, the Hebrew word signifieth to deal wonderfully, and likewise to separate; therefore some render it, wonderfully separated. See Exo 9:4. and 11.7. and 33.16. Item Psa 17:7, &c.] a Favourite: [viz. My self, to whom God sheweth undeserved kindness, favour and bounty; the Enjoying and experience whereof, maketh me also disposed and heartily enclined, to shew favour and kindness unto others, even to my haters themselves, according to the nature and duty of Gods children. See Mat 5:44, 45. 1 John 4 11. And further of the Hebrew word, 2 Chron.6.on v.41.] the LORD shall hear when I call unto him."}],"5":[{"catchword":null,"tekst":"(5) Be troubled and sin not, [As if he said, if it do anger and vex, or trouble you, that I am chosen to the Kingdom; or that things go cross, or amiss in the it; but rather turn your selves and be reconciled to God, or be ye troubled, viz. With the apprehension of the heavy wrath of God, which you do draw upon your selves, and go not on in sinning] speak (or commune) in your heart, [i.e. consider, ponder by your selves, (Compare Psa 14:1. and 35.25. Mat 24:48. Rom 10:6. Rev 18:7.) weighing and sifting your practices; and judging your selves.] upon your Couch, and be fill, [i.e. cease and give over to persecute me.] Sela! [see above Psalm 3.verse 3.]"}],"6":[{"catchword":null,"tekst":"(6) Offer offerings of righteousness, [i.e. Lawful ones and warrantable, accompanied with an upright faith and conversion of the heart, and so below Psal.5.ver. 20.] and trust in the LORD."}],"7":[{"catchword":null,"tekst":"(7) Many say; who shall make us see the good? [See for enjoy. See Job 7.on verse 7. Or, O, that any would make us see the good, or; would shew us the good, in a wishing expression. See Deut.5.on verse 29. As if they should say: how shall we get once out of these troubles, and distractions? Or; O that we might enjoy a plentiful and peaceable year!] do thou, O LORD, lift over us [as if the Prophet said; But I say; all shall be well, if but thou, O God, do lift, &c.] the light of thy countenance, [See Numb.6.on verse 25,26.]"}],"8":[{"catchword":null,"tekst":"(8) Thou [viz. O God] hast given joy in my heart, more then at the time, when their corn, and their must [or new Wine] are multiplied. [i.e. thou hast by the light of thy countenance, filled me with spiritual Joy, which much exceedeth theirs at best, which is, when they have a plentiful harvest and vintage. Compare Cant.1.2,4. And Hos 9:1. with the annotation.]"}],"9":[{"catchword":null,"tekst":"(9) I shall ly down and sleep together, in peace; [i.e. in safety and quiet, not with standing all the plots and practices of mine Enemies and Persecutors. See Psalm 3.on v.6.] For thou, O LORD, alone shalt make me dwell in safety. [Oth. for thou (art) LORD alone, thou shalt make me to dwell in safety.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
