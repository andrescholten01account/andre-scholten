","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een psalm van David, toen hij zich vreemd gedroeg voor Abimelech, die hem wegjoeg, waarna hij vertrok.","2":"Aleph. Ik zal de HEERE loven te allen tijde; Zijn lof zal voortdurend in mijn mond zijn.","3":"Beth. Mijn ziel zal zich beroemen in de HEERE; de zachtmoedigen zullen het horen en zich verblijden.","4":"Gimel. Maakt de HEERE met mij groot, en laten wij Zijn Naam samen verhogen.","5":"Daleth. Ik heb de HEERE gezocht, en Hij heeft mij geantwoord, en mij uit al mijn angsten gered.","6":"He. Vau. Zij hebben op Hem gezien, ja, *Hem* toegestroomd als water; en hun gezichten zijn niet rood van schaamte geworden.","7":"Zain. Deze ellendige riep, en de HEERE hoorde; en Hij verloste hem uit al zijn benauwdheden.","8":"Cheth. De Engel van de HEERE legert Zich rondom hen die Hem vrezen, en redt hen.","9":"Teth. Proeft en ziet dat de HEERE goed is; gelukkig is de man *die* op Hem vertrouwt.","10":"Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek.","11":"Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.","12":"Lamed. Komt, kinderen! Hoort naar mij! Ik zal u de vreze van de HEERE leren.","13":"Mem. Wie is de man die lust heeft ten leven, die dagen liefheeft om het goede te zien?","14":"Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog.","15":"Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.","16":"Ain. De ogen van de HEERE zijn op de rechtvaardigen, en Zijn oren gericht op hun geroep.","17":"Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.","18":"Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.","19":"Koph. De HEERE is nabij de gebrokenen van hart, en Hij behoudt de verslagenen van geest.","20":"Resch. Veel is de tegenspoed van de rechtvaardige; maar uit dat alles redt de HEERE hem.","21":"Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken.","22":"Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.","23":"De HEERE verlost de ziel van Zijn knechten; en allen die op Hem vertrouwen, zullen niet schuldig verklaard worden."},"SV":{"1":"*Een* *psalm* van David, als hij zijn gelaat veranderd had voor het aangezicht van Abimelech, die hem wegjoeg, dat hij doorging.","2":"Aleph. Ik zal den HEERE loven te aller tijd; Zijn lof zal geduriglijk in mijn mond zijn.","3":"Beth. Mijn ziel zal zich beroemen in den HEERE; de zachtmoedigen zullen het horen en verblijd zijn.","4":"Gimel. Maakt den HEERE met mij groot, en laat ons Zijn Naam samen verhogen.","5":"Daleth. Ik heb den HEERE gezocht, en Hij heeft mij geantwoord, en mij uit al mijn vrezen gered.","6":"He. Vau. Zij hebben op Hem gezien, ja, *Hem* als een waterstroom aangelopen; en hun aangezichten zijn niet schaamrood geworden.","7":"Zain. Deze ellendige riep, en de HEERE hoorde; en Hij verloste hem uit al zijn benauwdheden.","8":"Cheth. De Engel des HEEREN legert Zich rondom degenen, die Hem vrezen, en rukt hen uit.","9":"Teth. Smaakt en ziet, dat de HEERE goed is; welgelukzalig is de man, *die* op Hem betrouwt.","10":"Jod. Vreest den HEERE, gij Zijn heiligen! want die Hem vrezen, hebben geen gebrek.","11":"Caph. De jonge leeuwen lijden armoede, en hongeren; maar die den HEERE zoeken, hebben geen gebrek aan enig goed.","12":"Lamed. Komt, gij, kinderen! hoort naar mij! ik zal u des HEEREN vreze leren.","13":"Mem. Wie is de man, die lust heeft ten leven, die dagen liefheeft, om het goede te zien?","14":"Nun. Bewaar uw tong van het kwaad, en uw lippen van bedrog te spreken.","15":"Samech. Wijk af van het kwaad, en doe het goede; zoek den vrede, en jaag dien na.","16":"Ain. De ogen des HEEREN zijn op de rechtvaardigen, en Zijn oren tot hun geroep.","17":"Pe. Het aangezicht des HEEREN is tegen degenen, die kwaad doen, om hun gedachtenis van de aarde uit te roeien.","18":"Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.","19":"Koph. De HEERE is nabij de gebrokenen van harte, en Hij behoudt de verslagenen van geest.","20":"Resch. Vele zijn de tegenspoeden des rechtvaardigen; maar uit alle die redt hem de HEERE.","21":"Schin. Hij bewaart al zijn beenderen; niet een van die wordt gebroken.","22":"Thau. De boosheid zal den goddeloze doden; en die den rechtvaardige haten, zullen schuldig verklaard worden.","23":"De HEERE verlost de ziel Zijner knechten; en allen, die op Hem betrouwen, zullen niet schuldig verklaard worden."},"KJV":{"1":"[[*A Psalm* of David, when he changed his behaviour before Abimelech; who drove him away, and he departed.]] I will bless the LORD at all times: his praise *shall* continually *be* in my mouth.","2":"[[*A Psalm* of David, when he changed his behaviour before Abimelech; who drove him away, and he departed.]] I will bless the LORD at all times: his praise *shall* continually *be* in my mouth.","3":"My soul shall make her boast in the LORD: the humble shall hear *thereof*, and be glad.","4":"O magnify the LORD with me, and let us exalt his name together.","5":"I sought the LORD, and he heard me, and delivered me from all my fears.","6":"They looked unto him, and were lightened: and their faces were not ashamed.","7":"This poor man cried, and the LORD heard *him*, and saved him out of all his troubles.","8":"The angel of the LORD encampeth round about them that fear him, and delivereth","9":"O taste and see that the LORD *is* good: blessed *is* the man *that* trusteth","10":"O fear the LORD, ye his saints: for *there is* no want to them that fear","11":"The young lions do lack, and suffer hunger: but they that seek the LORD shall not want any good","12":"Come, ye children, hearken unto me: I will teach you the fear of the LORD.","13":"What man *is he that* desireth life, *and* loveth *many* days, that he may see good?","14":"Keep thy tongue from evil, and thy lips from speaking guile.","15":"Depart from evil, and do good; seek peace, and pursue","16":"The eyes of the LORD *are* upon the righteous, and his ears *are open* unto their cry.","17":"The face of the LORD *is* against them that do evil, to cut off the remembrance of them from the earth.","18":"*The righteous* cry, and the LORD heareth, and delivereth them out of all their troubles.","19":"The LORD *is* nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.","20":"Many *are* the afflictions of the righteous: but the LORD delivereth","21":"He keepeth all his bones: not one of them is broken.","22":"Evil shall slay the wicked: and they that hate the righteous shall be desolate.","23":"The LORD redeemeth the soul of his servants: and none of them that trust in him shall be desolate."}},"tsk":{"3":[{"kopje":"beroemen","refs":["Ps 44:9","Ps 105:3","Jes 45:25","Jer 9:24","1 Kor 1:31","2 Kor 10:17"]},{"kopje":"de zachtmoedigen","refs":["Ps 22:23-25","Ps 32:5","Ps 32:6","Ps 119:74","Ps 142:8","1 Tim 1:15","1 Tim 1:16"]}],"4":[{"kopje":"Maakt groot","refs":["Ps 35:27","Ps 40:17","Ps 69:31","Luk 1:46","Hand 19:17","Fil 1:20"]},{"kopje":"laten wij","refs":["Ps 33:1","Ps 33:2","Ps 66:8","Ps 103:20-22","Ps 148:1-14","1 Kron 29: H7200\">see</span> good?","14":"<span class=\"wl wl-kjv\" data-code=\"H5341\">Keep</span> thy <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> from <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> from <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking</span> guile.","15":"<span class=\"wl wl-kjv\" data-code=\"H5493\">Depart</span> from <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good;</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> and pursue","16":"The <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> are upon the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous,</span> and his <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> are open unto their cry.","17":"The <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is against them that <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> to cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H2143\">remembrance</span> of them from the earth.","18":"The righteous <span class=\"wl wl-kjv\" data-code=\"H6817\">cry,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heareth,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">delivereth</span> them out of all their troubles.","19":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H7138\">nigh</span> unto them that are of a <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart;</span> and <span class=\"wl wl-kjv\" data-code=\"H3467\">saveth</span> such as be of a <span class=\"wl wl-kjv\" data-code=\"H1793\">contrite</span> spirit.","20":"<span class=\"wl wl-kjv\" data-code=\"H7227\">Many</span> are the <span class=\"wl wl-kjv\" data-code=\"H7451\">afflictions</span> of the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous:</span> but the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> delivereth","21":"He <span class=\"wl wl-kjv\" data-code=\"H8104\">keepeth</span> all his <span class=\"wl wl-kjv\" data-code=\"H6106\">bones:</span> not <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of <span class=\"wl wl-kjv\" data-code=\"H2007\">them</span> is broken.","22":"<span class=\"wl wl-kjv\" data-code=\"H7451\">Evil</span> shall <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked:</span> and they that <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> shall be desolate.","23":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemeth</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants:</span> and none of them that <span class=\"wl wl-kjv\" data-code=\"H2620\">trust</span> in him shall be desolate."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"gelaat","tekst":"Of, gebaren, wezen. Hebr. eigenlijk, smaak; omdat men uit gebaren den mens pleegt als te proeven en te oordelen wat in hem is. Zie deze historie 1Sa 21:11-13 , enz."},{"catchword":"Abimelech,","tekst":"1Sa 21 wordt hij genoemd bij zijn eigen naam Achis, koning van Gath, maar Abimelech schijnt daarenboven een algemene naam geweest te zijn der Filistijnse koningen. Zie daarvan Gen 20:2 ."},{"catchword":"wegjoeg","tekst":"Te weten, door zijne officieren, die David voor hem brachten, menende dat hij hem zou vasthouden en laten ombrengen, dat hij ook ongetwijfeld zou hebben gedaan indien het God niet merkelijk belet en David uitgeholpen had. Zie 1Sa 21:11-12 ."},{"catchword":"Alef","tekst":"Zie van dit A, B, op den titel van den 25sten Psalm."},{"catchword":"loven","tekst":"Hebr. zegenen."}],"2":[{"catchword":"gelaat","tekst":"Of, gebaren, wezen. Hebr. eigenlijk, smaak; omdat men uit gebaren den mens pleegt als te proeven en te oordelen wat in hem is. Zie deze historie 1Sa 21:11-13 , enz."},{"catchword":"Abimelech,","tekst":"1Sa 21 wordt hij genoemd bij zijn eigen naam Achis, koning van Gath, maar Abimelech schijnt daarenboven een algemene naam geweest te zijn der Filistijnse koningen. Zie daarvan Gen 20:2 ."},{"catchword":"wegjoeg","tekst":"Te weten, door zijne officieren, die David voor hem brachten, menende dat hij hem zou vasthouden en laten ombrengen, dat hij ook ongetwijfeld zou hebben gedaan indien het God niet merkelijk belet en David uitgeholpen had. Zie 1Sa 21:11-12 ."},{"catchword":"Alef","tekst":"Zie van dit A, B, op den titel van den 25sten Psalm."},{"catchword":"loven","tekst":"Hebr. zegenen."}],"3":[{"catchword":"zachtmoedigen","tekst":"Zie Psa 10:17 ."}],"4":[{"catchword":"verhogen","tekst":"Dat is, hogelijk prijzen, gelijk Psa 30:2 ."}],"5":[{"catchword":"gezocht,","tekst":"Door gebeden zijne hulp verzocht."},{"catchword":"vrezen","tekst":"Zie 1Sa 21:12 ."}],"6":[{"catchword":"Zij","tekst":"Te weten, de zachtmoedigen, uit vs.3."},{"catchword":"gezien","tekst":"Met de geestelijke ogen des geloofs uitgezien naar zijne hulp."},{"catchword":"aangelopen;","tekst":"Doende God [om zo te spreken] geweld, door den aanval van hun ijver en krachtige gebeden. Verg. Isa 2:2 , en Isa 60:5 ; Jer 31:12 , en Jer 51:44 ; Mat 11:12 ; Luk 16:16 ; Jam 5:16 . Anders, en zijn verlicht; dat is, vertroost, hebben oorzaak van blijdschap bekomen; alzo hHet Hebr. in tweeërlei betekenis van sommigen wordt genomen."}],"7":[{"catchword":"Deze","tekst":"Namelijk David; die hier van zichzelven spreekt, als op zijn persoon wijzende, of voert in de woorden der gelovigen van hem."}],"8":[{"catchword":"engel","tekst":"Dat is, de engelen, alzo er van legers gesproken wordt. Zie Gen 32:1-2 ; en 2Ki 6:17 ."}],"9":[{"catchword":"Smaakt","tekst":"Dat is, aanmerkt en gevoelt in uwe harten, en vermaakt u daarin, of neemt de proef daarvan, gij zult bevinden dat het zo is. Verg. Job 12:20 ; Pro 31:18 , en 1Pe 2:2-3 ."}],"10":[{"catchword":"Vreest","tekst":"Zie Psa 19:10 ."}],"11":[{"catchword":"lijden","tekst":"Kunnende somtijds geen roof krijgen. Zie Job 4:11 ."}],"12":[{"catchword":"kinderen","tekst":"Die mij houdt voor uw geestelijken vader, dat is profeet en leraar. Zie Jdg 17:10 ; Pro 1:8 ."}],"13":[{"catchword":"Wie","tekst":"Dat is, is er iemand, die enz., of, degene die, enz. Zie Deu 20:5 ; het antwoord op deze vraag hebt gij in volgende verzen."},{"catchword":"dagen","tekst":"Dat is, een lang leven, lengte der dagen."},{"catchword":"het","tekst":"Dat is, welvaart te genieten. Zie Job 7:7 . Deze en dergelijke beloften moeten alzo verstaan worden, dat het kruis geenzins daarmede uitgesloten is, gelijk het ganse woord Gods, en in het bijzonder dit boek der psalmen, zelfs deze psalm vs.20, uitwijst."}],"14":[{"catchword":"Bewaar","tekst":"De zin is, die het voorzeide goed begeert te genieten, die doet dit."}],"16":[{"catchword":"De ogen","tekst":"Gelijk boven, Psa 33:18 ."}],"17":[{"catchword":"aangezicht des Heeren","tekst":"Versta zijn toornig aangezicht, gelijk boven, Psa 21:10 . Zie aldaar."}],"18":[{"catchword":"Zij","tekst":"Te weten, de rechtvaardigen, uit vs.16."}],"19":[{"catchword":"gebrokenen","tekst":"Die, allen hoogmoed afleggende, zich voor den Heere vernederen met hartelijke bekommernissen over hunne zonden en begeerte van genade. Verg. Psa 51:19 , en Psa 147:3 ; Isa 42:3 , en Isa 57:15 , en Isa 61:1 , en Isa 66:2 ; Luk 4:18 , en Luk 7:38 ; Act 2:37 ."},{"catchword":"verslagenen","tekst":"Of, gekneusden, verbrijzelden."}],"20":[{"catchword":"Vele","tekst":"Of, de rechtvaardige heeft vele tegenspoeden. Hebr. kwaden; dat is, veel ellende, kruis en verdriet overkomt hem, bejegent hem."}],"22":[{"catchword":"schuldig","tekst":"Het Hebr. woord betekent somtijds schuldig gehouden, of verklaard worden, somtijds verwoest worden; beide die betekenissen worden hier van sommigen, als elkander na verwant zijnde, tesamen gevoegd aldus: Zullen als schuldigen verwoest worden."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"(A Psalm of) David: when he had changed his behaviour [Or, carriage, deportment. Heb. Properly, taste, or, savour, in regard that a man is usually tried and judge what he is, or what is in him, by his out ward carriage and behaviour. See this History 1 Sam.21. he is called by his proper Name Achis, King of Gath, but Abimelech seemth to have been a more general Name besides of the Philistines Kings. See thereof Gen 21:2.] who chased away; [viz. By his Officers, who had brought David before him in that posture, and thought he would have caused him to be committed and put to death, which doubtless he would have performed likewise, if God had notably hindered it, and helped David out of that straight. See 1 Sam.2`1.11,12.] that he away. (34:2) (Aleph.) [Of this Alphabet, see the annotation upon the title Psalm 25.] I will praise [Heb. Bless] the LORD, at all times: his praise shall be in my mouth continually."}],"2":[{"catchword":null,"tekst":"(A Psalm of) David: when he had changed his behaviour [Or, carriage, deportment. Heb. Properly, taste, or, savour, in regard that a man is usually tried and judge what he is, or what is in him, by his out ward carriage and behaviour. See this History 1 Sam.21. he is called by his proper Name Achis, King of Gath, but Abimelech seemth to have been a more general Name besides of the Philistines Kings. See thereof Gen 21:2.] who chased away; [viz. By his Officers, who had brought David before him // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

    rij.className = 'vers'; rij.id = 'v' + n;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }

    } else {

      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

function toggle(n) {

document.addEventListener('click', e => {

      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
