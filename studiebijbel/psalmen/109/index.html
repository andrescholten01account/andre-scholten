geslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "1 Kron 21:1": "Toen stond de satan op tegen Israël, en hij porde David aan, dat hij Israël telde.", "Ps 94:23": "En Hij zal hun ongerechtigheid op hen doen terugkeren, en Hij zal hen in hun boosheid verdelgen; de HEERE, onze God, zal hen verdelgen.", "Ps 82:3": "Doe recht aan de arme en de wees; geef recht aan de verdrukte en de arme.", "Ps 22:26": "Van U zal mijn lof zijn in een grote gemeente; ik zal mijn geloften betalen in de tegenwoordigheid van hen die Hem vrezen.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Ps 55:2-18": "O God! neem mijn gebed ter ore, en verberg U niet voor mijn smeking. Merk op mij, en verhoor mij; ik bedrijf misbaar in mijn klacht, en maak getier; Om het geroep van de vijand, vanwege de beangstiging van de goddeloze; want zij schuiven ongerechtigheid op mij, en in toorn haten zij mij.", "Ps 63:4-7": "Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen. Zo zou ik U loven in mijn leven; in Uw Naam zou ik mijn handen opheffen. Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen.", "Klaagl 5:1": "Denk, HEERE, aan wat ons gebeurd is, kijk ernaar en zie onze smaad aan.", "Neh 5:13": "Ook schudde ik mijn boezem uit, en zei: Zo schudde God uit iedere man die dit woord niet zal nakomen, uit zijn huis en uit zijn arbeid, en hij worde zo uitgeschud en leeg. En de hele gemeente zei: Amen! En zij prezen de HEERE. En het volk deed volgens dit woord.", "Ps 79:1": "Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt.", "Rom 3:15-17": "hun voeten zijn snel om bloed te vergieten; vernieling en ellende is op hun wegen; en de weg van de vrede hebben zij niet gekend.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Hebr 13:13": "Laten wij dan naar Hem uitgaan, buiten de legerplaats, terwijl wij Zijn smaad dragen.", "Ps 107:32": "En Hem verhogen in de gemeente van het volk, en Hem roemen in de vergadering van de oudsten.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Matt 12:14": "En de Farizeeën gingen naar buiten en beraadslaagden samen tegen Hem, hoe zij Hem konden doden.", "Jer 9:5": "En zij bedriegen, ieder zijn vriend, en spreken de waarheid niet; zij leren hun tong leugen spreken, zij maken zich moe met verkeerd te handelen.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Luk 16:22-28": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Rom 6:16": "Weet u niet dat aan wie u uzelf ter beschikking stelt als dienstknechten tot gehoorzaamheid, u dienstknechten bent van hem die u gehoorzaamt, óf van de zonde tot de dood, óf van de gehoorzaamheid tot gerechtigheid?", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Jes 49:8": "Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Ps 66:10-12": "Want U hebt ons beproefd, o God! U hebt ons gelouterd, zoals men zilver loutert; U had ons in het net gebracht; U had een engs band om onze lenden gelegd; U had de mens over ons hoofd laten rijden; wij waren in het vuur en in het water gekomen; maar U hebt ons uitgevoerd naar een overvloeiende verversing.", "Ps 89:50-52": "Heere! waar zijn Uw vorige blijken van goedertierenheid, die Gij David gezworen hebt bij Uw trouw? Gedenk, Heere! aan de smaad van Uw knechten, die ik in mijn boezem draag, van alle grote volken. Waarmee, o HEERE! Uw vijanden smaden, waarmee zij de voetstappen van Uw gezalfde smaden.", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Mark 14:27": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.", "Hos 13:3": "Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.", "Ps 146:5": "Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is;", "Matt 27:4": "en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien.", "Ex 21:24": "oog voor oog, tand voor tand, hand voor hand, voet voor voet,", "Job 21:34": "Hoe troost u mij dan met ijdelheid, terwijl in uw antwoorden ontrouw overblijft?", "Job 1:6": "Er was nu een dag, dat de kinderen van God kwamen om zich voor de HEERE te stellen, dat de satan ook in hun midden kwam.", "Gal 1:9": "Zoals wij al eerder gezegd hebben, zeg ik het nu ook weer: als iemand u een evangelie verkondigt naast wat u ontvangen hebt, laat hij vervloekt zijn.", "Ps 86:14": "O God! de hoogmoedigen staan tegen mij op, en de bijeenkomsten van de tirannen zoeken mijn ziel; en zij houden U niet voor ogen.", "Ps 119:170": "Laat mijn smeken voor Uw aanschijn komen, red mij naar Uw toezegging.", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Ps 86:1": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig.", "Ps 142:6-8": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden. Let op mijn geschrei, want ik ben zeer uitgeput; red mij van mijn vervolgers, want zij zijn sterker dan ik. Voer mijn ziel uit de gevangenis, om Uw Naam te loven; de rechtvaardigen zullen mij omringen, wanneer U goed voor mij zult zijn geweest.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Matt 5:27": "U hebt gehoord dat gezegd is: U zult geen overspel plegen.", "Luk 18:11": "De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.", "Ps 116:3": "De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "Ps 55:22": "Zijn mond is gladder dan boter, maar zijn hart is oorlog; zijn woorden zijn zachter dan olie, maar ze zijn blote zwaarden.", "Ps 36:13": "Daar zijn de werkers van de ongerechtigheid gevallen; zij zijn neergestoten, en kunnen niet weer opstaan.", "Ps 102:25": "Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht.", "Hand 8:32": "En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.", "Nahum 3:1": "Wee de bloedstad, die helemaal vol leugen en verscheuring is! De roof houdt niet op.", "Joh 15:21": "Maar al deze dingen zullen zij u doen om Mijn Naam, omdat zij Hem niet kennen, Die Mij gezonden heeft.", "Ps 140:2-14": "Red mij, HEERE, van de kwade mens; behoed mij voor de man van geweld; Die veel kwaad in het hart bedenken, elke dag komen zij samen om te oorlogen. Zij scherpen hun tong als een slang; heet addervergif is onder hun lippen. Sela.", "Job 36:17": "Maar u hebt het oordeel van de goddeloze vervuld; het oordeel en het recht houden u vast.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Ps 73:10": "Daarom keert Zijn volk zich hierheen, als hun water uit een volle beker wordt uitgedrukt,", "Ps 17:1": "Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.", "Mark 9:11-13": "En zij vroegen Hem: Waarom zeggen de Schriftgeleerden dat Elia eerst moet komen? En Hij antwoordde en zei tegen hen: Elia komt inderdaad eerst, en herstelt alles; en het zal gebeuren, zoals geschreven is van de Zoon des mensen, dat Hij veel moet lijden en veracht worden. Maar Ik zeg u, dat Elia ook gekomen is, en zij hebben hem gedaan wat zij wilden, zoals van hem geschreven is.", "Ps 35:15": "Maar toen ik hinkte, waren zij verblijd, en verzamelden zich; zij verzamelden zich tegen mij als geslagenen, en ik merkte niets; zij scheurden hun kleren, en zwegen niet stil.", "Gen 3:5": "Maar God weet dat, op de dag dat u daarvan eet, uw ogen geopend zullen worden, en u als God zult zijn, kennend het goed en het kwaad.", "Hand 7:31": "Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,", "Spr 2:12-15": "Om u te redden van de kwade weg, van de man die verkeerdheden spreekt; Van hen die de paden van de oprechtheid verlaten, om te gaan in de wegen van de duisternis; Die blij zijn met het doen van kwaad, zich verheugen in de verkeerdheden van de kwade;", "Spr 20:17": "Het brood van de leugen is de mens zoet; maar daarna zal zijn mond vol worden van zandsteentjes.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "2 Sam 15:7": "Aan het einde van veertig jaren gebeurde het dat Absalom tegen de koning zei: Laat mij toch gaan, en mijn gelofte, die ik de HEERE beloofd heb, te Hebron inlossen.", "Luk 23:36": "En ook de soldaten kwamen naar Hem toe en bespotten Hem, en brachten Hem azijn;", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Ps 82:4": "Verlos de arme en de behoeftige, ruk hem uit de hand van de goddelozen.", "Jes 52:7-10": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning. Er is een stem van uw wachters; zij verheffen de stem, zij juichen samen; want zij zullen oog in oog zien, wanneer de HEERE Sion terugbrengen zal. Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "Matt 2:5": "Zij zeiden tegen hem: In Bethlehem, in Judea; want zo is geschreven door de profeet:", "1 Petr 3:9": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.", "Ps 43:3": "Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Jes 64:9-12": "HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting. Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Ps 111:10": "Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Jes 42:10-12": "Zingt de HEERE een nieuw lied, Zijn lof van het einde van de aarde; u, die ter zee vaart, en al wat daarin is, u eilanden en hun inwoners. Laat de woestijn en haar steden de stem verheffen, met de dorpen die Kedar bewoont; laat hen juichen die in de rotsen wonen, en van de top van de bergen af schreeuwen. Laat ze de HEERE de eer geven, en Zijn lof in de eilanden verkondigen.", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "Ps 79:12": "En geef onze buren zevenvoudig terug in hun schoot hun smaad, waarmee zij U, o Heere, gesmaad hebben.", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Ps 115:1": "Niet ons, o HEERE, niet ons, maar geef aan Uw Naam eer, om Uw goedertierenheid, om Uw waarheid.", "Jer 14:21": "Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.", "Spr 12:2": "De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.", "Matt 21:16": "en zeiden tegen Hem: Hoort U wel wat dezen zeggen? En Jezus zei tegen hen: Ja; hebt u nooit gelezen: Uit de mond van de jonge kinderen en de zuigelingen hebt U Zichzelf lof toebereid?", "Ps 35:11-16": "Wrevelige getuigen staan op; wat ik niet weet, eisen zij van mij. Zij vergelden mij kwaad voor goed, de beroving van mijn ziel. Mij aangaande daarentegen, toen zij ziek waren, was een zak mijn kleed; ik kwelde mijn ziel met vasten, en mijn gebed keerde weer in mijn boezem.", "Luk 16:21": "En hij verlangde verzadigd te worden van de kruimels die van de tafel van de rijke vielen; maar ook de honden kwamen en likten zijn zweren.", "Matt 27:40": "en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af.", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Rom 8:13": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.", "Joh 13:19": "Van nu af zeg Ik het u, voordat het gebeurd is, opdat u, wanneer het gebeurd zal zijn, kunt geloven dat Ik het ben.", "Ps 69:30": "Doch ik ben ellendig en in smart; Uw heil, o God! zette mij in een hoog vertrek.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Matt 27:25": "En al het volk antwoordde en zei: Laat Zijn bloed komen over ons, en over onze kinderen.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Richt 16:28": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken.", "Matt 25:42": "Want Ik ben hongerig geweest, en u hebt Mij niet te eten gegeven; Ik ben dorstig geweest, en u hebt Mij niet te drinken gegeven;", "Luk 12:4": "En Ik zeg u, Mijn vrienden: wees niet bang voor hen die het lichaam doden, en daarna niets meer kunnen doen.", "Openb 9:11": "En zij hadden over zich tot een koning de engel van het afgrond; zijn naam was in het Hebreeuws Abaddon, en in de Griekse taal had hij de naam Apollyon.", "Matt 12:34": "Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond.", "Joh 12:41": "Dit zei Jesaja, toen hij Zijn heerlijkheid zag, en over Hem sprak.", "Ps 111:1": "Halleluja! Aleph. Ik zal de HEERE loven van ganser harte; Beth. in de raad en vergadering van de oprechten.", "Hos 2:8-12": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken. En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden. En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "1 Kor 15:22": "Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.", "2 Sam 12:22": "En hij zei: Toen het kind nog leefde, heb ik gevast en gehuild; want ik zei: Wie weet, de HEERE zou mij misschien genadig kunnen zijn, zodat het kind in leven bleef.", "Ps 68:33-35": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela. Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken.", "Ps 34:7": "Zain. Deze ellendige riep, en de HEERE hoorde; en Hij verloste hem uit al zijn benauwdheden.", "Jes 32:6": "Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen de HEERE, om de ziel van de hongerige leeg te laten, en de dorstige drank te doen ontbreken.", "Matt 11:19": "De Zoon des mensen is gekomen, etend en drinkend, en zij zeggen: Zie daar, een Mens, Die een vraat en wijnzuiper is, een Vriend van tollenaars en zondaars. Maar de Wijsheid is gerechtvaardigd door haar kinderen.", "Hand 28:25-27": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders, Toen hij zei: Ga naar dit volk, en zeg: Met het gehoor zult u horen, en beslist niet begrijpen; en ziende zult u zien, en beslist niet opmerken. Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.", "Ps 18:50": "Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Deut 11:29": "En het zal gebeuren, als de HEERE, uw God, u zal hebben binnengebracht in het land, waar u naartoe gaat, om dat te erven; dan zult u de zegen uitspreken op de berg Gerizim, en de vloek op de berg Ebal.", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "Spr 18:14": "De geest van een man zal zijn ziekte dragen; maar een verslagen geest, wie zal die opheffen?", "Ps 62:5": "Zij overleggen slechts om hem van zijn hoogheid te verstoten; zij hebben behagen in leugen; met hun mond zegenen zij, maar met hun binnenste vloeken zij. Sela.", "Ps 119:173-176": "Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen. O HEERE! ik verlang naar Uw heil, en Uw wet is al mijn vermaking. Laat mijn ziel leven, en zij zal U loven, en laat Uw rechten mij helpen.", "Ps 35:19-21": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten. Want zij spreken niet van vrede, maar zij bedenken bedrieglijke zaken tegen de stillen in het land. En zij sperren hun mond wijd open tegen mij; zij zeggen: Ha, ha, ons oog heeft het gezien!", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Spr 6:19": "een vals getuige, die leugens uitblaast; en wie ruzie zaait tussen broeders.", "Ef 4:27": "En geef de duivel geen plaats.", "Ps 69:11": "En ik heb geweend in het vasten van mijn ziel; maar het is mij tot allerlei smaad geworden.", "Jes 29:20": "Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Spr 19:28": "Een getuige van Belial bespot het recht; en de mond van de goddelozen slokt de ongerechtigheid in.", "Deut 25:4": "Een os zult u niet muilbanden, als hij graan dorst.", "Mark 9:43": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;", "Ps 71:18": "Daarom ook, terwijl het ouderdom en de grijsheid daar zijn, verlaat mij niet, o God, totdat ik aan dit geslacht Uw arm verkondig, aan alle nakomelingen Uw macht.", "Jes 40:6-8": "Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld. Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras. Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "1 Kon 19:14": "En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.", "Neh 6:9": "Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Ezech 22:21": "Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.", "Job 5:14": "Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Ef 1:15": "Daarom ook ik, nadat ik gehoord heb van het geloof in de Heere Jezus, dat onder u is, en de liefde tot al de heiligen,", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Luk 11:18": "Als dan ook de satan tegen zichzelf verdeeld is, hoe zal zijn rijk bestaan? Want u zegt dat Ik door Beëlzebul de demonen uitdrijf.", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Jes 54:1": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE.", "Job 19:21": "Ontferm u over mij, ontferm u over mij, o mijn vrienden! want de hand van God heeft mij aangeraakt.", "Spr 19:9": "Een vals getuige zal niet onschuldig blijven; en die leugens waait, zal vergaan.", "Jak 1:15": "Daarna, als de begeerte ontvangen is, baart zij zonde; en als de zonde volgroeid is, baart zij de dood.", "Luk 6:30-35": "Maar geef ieder die het u vraagt; en van wie het uwe wegneemt, eis het niet terug. En zoals u wilt dat de mensen u doen, doe hun ook hetzelfde. En als u liefhebt wie u liefhebben, wat voor dank hebt u dan? Want ook de zondaars hebben lief wie hen liefhebben.", "Gen 2:7": "En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.", "Ps 120:2-4": "O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong. Wat zal U de bedrieglijke tong geven, of wat zal zij U toevoegen? Scherpe pijlen van een machtige, alsook gloeiende jeneverkolen.", "Hand 13:10": "O kind van de duivel, vol van alle bedrog en van alle arglistigheid, vijand van alle gerechtigheid, zult u niet ophouden de rechte wegen van de Heere te verdraaien?", "Mark 9:44": "Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.", "Dan 7:27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge plaatsen, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "Ps 142:2": "Ik riep met mijn stem tot de HEERE; ik smeekte tot de HEERE met mijn stem.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Luk 7:22": "En Jezus antwoordde en zei tegen hen: Ga heen, en vertel Johannes weer wat u gezien en gehoord hebt: dat de blinden ziende worden, de kreupelen lopen, de melaatsen gereinigd worden, de doven horen, de doden opgewekt worden, aan de armen het Evangelie verkondigd wordt.", "Ps 21:12": "Want zij hebben kwaad tegen U aangelegd; zij hebben een schandelijke daad bedacht, doch zullen niets vermogen.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "Ps 7:15-17": "Zie, hij is zwanger van onrecht, en heeft moeite ontvangen, hij zal leugen baren. Hij heeft een kuil gegraven, en hem uitgegraven, maar hij is gevallen in de groeve, die hij gemaakt heeft. Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.", "Spr 19:17": "Die zich ontfermt over de arme, leent aan de HEERE, en Hij zal hem zijn weldaad vergelden.", "1 Kon 8:36-50": "hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt. Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn; elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Zach 5:2-4": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el. Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden. Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Rom 16:20": "En de God van de vrede zal de satan spoedig onder uw voeten verpletteren. De genade van onze Heere Jezus Christus zij met u. Amen.", "Hand 7:34": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden.", "Jes 63:17-19": "HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel. Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden. Wij zijn geworden als zij over wie U van ouds niet hebt geheerst, en die naar Uw Naam niet genoemd zijn.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Ps 109:22-24": "Want ik ben ellendig en behoeftig, en mijn hart is in mijn binnenste doorwond. Ik ga heen als een schaduw wanneer die zich neigt; ik word omgedreven als een sprinkhaan. Mijn knieën struikelen van het vasten, en mijn vlees is vermagerd, zodat er geen vet aan is.", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "Mark 8:31": "En Hij begon hun te leren dat de Zoon des mensen veel moest lijden, en verworpen moest worden door de oudsten, en overpriesters, en Schriftgeleerden, en gedood moest worden, en na drie dagen weer moest opstaan.", "Jer 18:21": "Daarom, geef hun zonen over aan de honger, en doe hen wegvloeien door het geweld van het zwaard, en laat hun vrouwen van kinderen beroofd en weduwe worden, en laat hun mannen door de dood omgebracht worden, en hun jongemannen met het zwaard geslagen worden in de strijd.", "Ps 74:11": "Waarom trekt U Uw hand, ja, Uw rechterhand terug? Trek haar uit het midden van Uw boezem; maak er een einde aan.", "Klaagl 1:12": "Lamed. Gaat het u niet aan, u allen, die over de weg gaat? Schouwt het aan en ziet, of er een smart is gelijk mijn smart, die mij aangedaan is, waarmee de HEERE mij bedroefd heeft ten dage van de gloed van Zijn toorn.", "Ps 119:39": "Wend mijn smaad af, die ik vrees, want Uw rechten zijn goed.", "Luk 6:11": "Maar zij werden vervuld met woede, en overlegden met elkaar wat zij Jezus zouden aandoen.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Jes 52:14": "Zoals velen zich over u ontzet hebben — zo misvormd was Zijn gelaat, meer dan van iemand anders, en Zijn gedaante, meer dan van andere mensenkinderen —", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Jes 38:18": "Want het graf zal U niet loven, de dood zal U niet prijzen; wie in de kuil neerdalen, zullen op Uw waarheid niet hopen.", "Ps 69:14": "Maar mij aangaande, mijn gebed is tot U, o HEERE; er is een tijd van het welbehagen, o God! Door de grootheid van Uw goedertierenheid; verhoor mij door de trouw van Uw heil.", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Hebr 12:7": "Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt?", "Job 16:6-14": "Als ik spreek, wordt mijn smart niet ingehouden; en houd ik op, wat gaat er dan van mij weg? Zeker, Hij heeft mij nu vermoeid; U hebt mijn hele vergadering verwoest. Dat U mij rimpelig gemaakt hebt, is tot een getuige; en mijn magerheid staat tegen mij op, zij getuigt in mijn gezicht.", "2 Sam 22:7": "Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; en Hij hoorde mijn stem uit Zijn paleis, en mijn geroep kwam in Zijn oren.", "Kol 3:9": "Lieg niet tegen elkaar, omdat u de oude mens met zijn werken hebt uitgedaan,", "Ex 16:18": "Maar toen zij het met de gomer maten, had hij die veel verzameld had, niets over, en hem die weinig verzameld had, ontbrak niets; ieder verzamelde zoveel als hij eten kon.", "Richt 6:3-6": "Want het gebeurde, als Israël gezaaid had, dan kwamen de Midianieten op, en de Amalekieten, en zij die uit het oosten kwamen, kwamen ook tegen hen op. En zij legerden zich tegen hen, en vernielden de opbrengst van het land, tot waar u bij Gaza komt; en zij lieten geen middelen van bestaan over in Israël, geen klein vee, geen os, geen ezel. Want zij kwamen op met hun vee en hun tenten; zij kwamen in zo'n grote menigte als de sprinkhanen, zodat men hen en hun kamelen niet tellen kon; en zij kwamen in het land om het te vernielen.", "Ps 59:4": "Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "Ps 70:5": "Laat in U vrolijk en verblijd zijn allen, die U zoeken; laat de liefhebbers van uw heil voortdurend zeggen: God zij groot gemaakt!", "Ps 4:3": "U, mannen, hoe lang zal mijn eer tot schande zijn? Hoe lang zult u de ijdelheid liefhebben, de leugen zoeken? Sela.", "Luk 13:9": "en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "Job 36:4": "Want voorwaar, mijn woorden zullen geen valsheid zijn; iemand die oprecht van kennis is, is bij u.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "1 Kon 8:60": "Opdat alle volken van de aarde weten, dat de HEERE die God is, niemand anders.", "Ps 72:4": "Hij zal de ellendigen van het volk richten; hij zal de kinderen van de behoeftige verlossen, en de verdrukker verbrijzelen.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Ps 22:7": "Maar ik ben een worm en geen man, een smaad van mensen, en veracht van het volk.", "Ps 7:18": "Ik zal de HEERE loven naar Zijn gerechtigheid, en voor de Naam van de HEERE, de Allerhoogste, psalmzingen.", "Deut 24:15": "Op zijn dag zult u hem zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; zodat hij tegen u niet roept tot de HEERE, en er zonde in u is.", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Job 4:9": "Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Hand 5:3": "En Petrus zei: Ananias, waarom heeft de satan uw hart vervuld, dat u de Heilige Geest zou liegen, en onttrekken van de prijs van het land?", "Ps 69:20": "U weet mijn smaad, en mijn schaamte, en mijn schande; al mijn belagers zijn voor U.", "Joël 3:13-16": "Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot. Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing. De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Gal 4:27": "Want er is geschreven: Wees vrolijk, u onvruchtbare, die niet baart, breek uit en roep, u die geen weeën hebt, want de kinderen van de eenzame zijn veel meer dan van haar die de man heeft.", "Gal 1:8": "Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "1 Petr 2:25": "Want u was als dwalende schapen; maar u bent nu bekeerd tot de Herder en Opziener van uw zielen.", "Ps 34:13-17": "Mem. Wie is de man die lust heeft ten leven, die dagen liefheeft om het goede te zien? Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog. Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Joh 8:59": "Toen namen zij stenen op om die op Hem te werpen. Maar Jezus verborg Zich, en ging de tempel uit, terwijl Hij door hun midden ging; en zo ging Hij weg.", "Jes 8:23": "Maar het land dat beangstigd was, zal niet helemaal verduisterd worden; zoals Hij het in de eerste tijd verachtelijk gemaakt heeft, naar het land van Zebulon toe en naar het land van Nafthali toe, zo heeft Hij het in het laatste heerlijk gemaakt, naar de weg zeewaarts toe gelegen over de Jordaan, aan Galilea van de heidenen.", "Matt 27:3-5": "Toen Judas, die Hem verraden had, zag dat Hij veroordeeld was, kreeg hij berouw en heeft hij de dertig zilverstukken aan de overpriesters en de oudsten teruggebracht, en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien. En toen hij de zilverstukken in de tempel geworpen had, vertrok hij; en hij ging heen en verhing zichzelf.", "Ps 54:7": "Hij zal dit kwaad aan mijn belagers vergelden; roei hen uit door Uw waarheid.", "Joh 12:14": "En Jezus vond een jonge ezel, en ging daarop zitten, zoals geschreven is:", "Ex 17:4": "Toen riep Mozes tot de HEERE en zei: Wat moet ik met dit volk doen? Het scheelt niet veel, of zij zullen mij stenigen.", "Job 15:35": "Zij ontvangen moeite, en baren ijdelheid, en hun buik richt bedrog aan.", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Ps 71:8": "Laat mijn mond vervuld worden met Uw lof, de hele dag met Uw heerlijkheid.", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Ps 69:23": "Hun tafel moet voor hun gezicht tot een strik worden, en tot volle vergelding tot een valstrik.", "Job 13:4": "Want zeker, u bent leugensmeders; u bent allemaal artsen van niets.", "Spr 10:10": "Wie met het oog knipoogt, veroorzaakt smart; en een dwaas van lippen zal ten val komen.", "2 Kor 11:3": "Doch ik vrees dat, zoals de slang Eva door haar arglistigheid bedrogen heeft, zo ook uw gedachten op enigerlei wijze bedorven worden, om af te wijken van de eenvoudigheid die in Christus is.", "Lev 6:2-7": "Als een mens gezondigd heeft en tegen de HEERE door overtreding overtreden zal hebben, doordat hij tegen zijn naaste gelogen heeft over iets dat hem in bewaring gegeven was, of ter hand gesteld was, of over roof, of dat hij met geweld zijn naaste iets onthoudt; Of dat hij het verlorene gevonden heeft, en daarover gelogen heeft, en met valsheid gezworen zal hebben; over iets van alles dat de mens doet, waarin hij zo zondigt. Dan zal het gebeuren, omdat hij gezondigd heeft en schuldig geworden is, dat hij zal teruggeven de roof die hij geroofd heeft, of het onthoudene dat hij met geweld onthoudt, of het bewaarde dat bij hem te bewaren gegeven was, of het verlorene dat hij gevonden heeft;", "Jes 1:15": "En als u uw handen uitspreidt, verberg Ik Mijn ogen voor u; ook wanneer u het gebed vermenigvuldigt, hoor Ik niet; want uw handen zijn vol bloed.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Spr 26:27": "Wie een kuil graaft, zal erin vallen, en wie een steen wentelt, op hem zal die terugkeren.", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "Ps 65:2": "De lofzang is in stilte tot U, o God! in Sion; en U zal de gelofte betaald worden.", "Ps 5:11": "Verklaar hen schuldig, o God; laat hen vervallen van hun raadslagen; drijf hen weg om de veelheid van hun overtredingen, want zij zijn opstandig tegen U.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Jes 59:12": "Want onze overtredingen zijn talrijk voor U, en onze zonden getuigen tegen ons; want onze overtredingen zijn bij ons, en onze ongerechtigheden kennen wij;", "Ps 144:8": "wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Spr 24:29": "Zeg niet: Zoals hij mij gedaan heeft, zo zal ik hem doen; ik zal ieder vergelden naar zijn werk.", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "2 Petr 2:22": "Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.", "Jes 48:10": "Zie, Ik heb u gelouterd, doch niet als zilver, Ik heb u gekeurd in de smeltkroes van de ellende.", "Spr 28:6": "De arme, die in zijn oprechtheid wandelt, is beter dan wie verkeerd is van wegen, al is hij rijk.", "1 Kor 6:16": "Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden.", "Ps 119:153": "Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "Ps 55:17": "Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen.", "Hebr 12:12": "Daarom richt de trage handen weer op, en de slappe knieën;", "Ps 144:4": "De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.", "Ps 107:5": "Zij waren hongerig, ook dorstig; hun ziel was in hen overstelpt.", "Deut 24:1": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis.", "Ex 20:14": "U zult geen echtbreuk plegen.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Ps 73:6": "Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Rom 16:27": "Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. De brief aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is.", "Jer 9:8": "Hun tong is een moordpijl, zij spreekt bedrog; ieder spreekt met zijn naaste van vrede met zijn mond, maar in zijn binnenste legt hij lagen.", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Luk 22:42": "en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede.", "Jes 59:13": "het overtreden en het liegen tegen de HEERE, en het achterwaarts wijken van onze God; het spreken van onderdrukking en afval, het ontvangen en het uitspreken van valse woorden uit het hart.", "Hand 4:24": "En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn.", "Jes 66:3": "Wie een os slacht, slaat een man; wie een lam offert, breekt een hond de hals; wie spijsoffer offert, is als die zwijnenbloed offert; wie wierook brandt tot een gedenkoffer, is als die een afgod zegent. Dezen kiezen ook hun eigen wegen, en hun ziel heeft plezier in hun verfoeisels.", "1 Joh 3:13-15": "Verwonder u niet, mijn broeders, als de wereld u haat. Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood. Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Joh 13:2": "En terwijl het avondmaal gehouden werd, en de duivel al in het hart van Judas, de zoon van Simon Iskariot, gegeven had dat hij Hem verraden zou,", "Neh 1:8": "Denk toch aan het woord, dat U Uw dienaar Mozes geboden hebt, en zei: Als u ontrouw wordt, zal Ik u onder de volken verstrooien.", "Ps 39:13": "Hoor, HEERE, mijn gebed, en neem mijn geroep ter ore; zwijg niet bij mijn tranen; want ik ben een vreemdeling bij U, een bijwoner, zoals al mijn vaders.", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Ps 22:8": "Allen die mij zien, bespotten mij; zij steken de lip uit, zij schudden het hoofd en zeggen:", "Hand 8:33": "In Zijn vernedering is Zijn oordeel weggenomen; en wie zal Zijn geslacht verhalen? Want Zijn leven wordt van de aarde weggenomen.", "Rom 9:29": "En zoals Jesaja van tevoren gezegd heeft: Als de Heere Sebaoth ons geen nageslacht had overgelaten, dan waren wij geworden als Sodom, en gelijk gemaakt aan Gomorra.", "Ps 22:15": "Ik ben uitgestort als water, en al mijn beenderen hebben zich vaneen gescheiden; mijn hart is als was, het is gesmolten in het midden van mijn ingewand.", "Hand 4:11": "Hij is de Steen, Die door u, de bouwlieden, veracht is, Die tot een hoeksteen geworden is.", "Joh 11:3": "Zijn zusters dan zonden tot Hem, en zeiden: Heere, zie, hij die U liefhebt, is ziek.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Ps 126:4": "O HEERE, keer onze gevangenschap, zoals waterstromen in het zuiden.", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Matt 5:31": "Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Mark 12:11": "Dit is door de Heere gebeurd, en het is wonderlijk in onze ogen?", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Deut 9:18": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Spr 20:22": "Zeg niet: Ik zal het kwaad vergelden; wacht op de HEERE, en Hij zal u verlossen.", "Job 5:17": "Zie, gelukzalig is de mens, aan wie God straft; daarom verwerp de kastijding van de Almachtige niet.", "Jak 5:13-16": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen. Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere. En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Matt 19:4": "Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Ps 119:86": "Al Uw geboden zijn waarheid; zij vervolgen mij met leugen, help mij.", "Jak 1:10": "En de rijke in zijn vernedering; want hij zal als een bloem van het gras voorbijgaan.", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "Matt 12:40": "Want zoals Jona drie dagen en drie nachten in de buik van de walvis was, zo zal de Zoon des mensen drie dagen en drie nachten in het hart van de aarde zijn.", "1 Kor 2:2": "Want ik had besloten niets te weten onder u, dan Jezus Christus, en Die gekruisigd.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Ps 22:2-22": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen? Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte. Doch U bent heilig, wonende onder de lofzangen van Israël.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "2 Kor 11:15": "Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.", "Joh 7:1": "Na deze dingen trok Jezus rond in Galilea; want Hij wilde niet in Judea rondtrekken, omdat de Joden Hem probeerden te doden.", "Joh 10:18": "Niemand neemt het van Mij, maar Ik leg het zelf af; Ik heb macht om het af te leggen, en Ik heb macht om het opnieuw te nemen. Dit gebod heb Ik van Mijn Vader ontvangen.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "1 Petr 3:10": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken;", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Ps 109:9-20": "Laat zijn kinderen wezen worden, en zijn vrouw weduwe. En laat zijn kinderen hier en daar omzwerven, en bedelen, en de nooddruft uit hun verwoeste plaatsen zoeken. Laat de schuldeiser aanslaan al wat hij heeft, en laat de vreemden zijn arbeid roven.", "Ps 57:8-10": "Mijn hart is standvastig, o God! mijn hart is standvastig; ik zal zingen en psalmzingen. Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o Heere! ik zal U psalmzingen onder de naties.", "Joh 10:32": "Jezus antwoordde hun: Ik heb u veel goede werken getoond van Mijn Vader; om welk van die werken stenigt u Mij?", "Matt 2:13": "Toen zij vertrokken waren, zie, de engel van de Heere verschijnt aan Jozef in de droom en zegt: Sta op, neem het Kindje en Zijn moeder tot u, en vlucht naar Egypte, en blijf daar totdat ik het u zeg; want Herodes zal het Kindje zoeken om Het te doden.", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Mark 15:23": "En zij gaven Hem wijn met mirre vermengd te drinken; maar Hij nam die niet aan.", "1 Tess 2:18": "Daarom hebben wij tot u willen komen (zeker ik, Paulus) een keer en opnieuw, maar de satan heeft ons verhinderd.", "Ps 102:5": "Mijn hart is geslagen en verdord als gras, zodat ik vergeten heb mijn brood te eten.", "Deut 6:16": "U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.", "Luk 16:3": "En de rentmeester zei bij zichzelf: Wat zal ik doen, omdat mijn heer dit rentmeesterschap van mij afneemt? Graven kan ik niet; te bedelen schaam ik mij.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Spr 17:22": "Een blij hart zal goed doen als een medicijn; maar een verslagen geest zal het gebeente doen verdrogen.", "Zef 3:13": "De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedrieglijke tong gevonden worden; maar zij zullen weiden en neerliggen, en niemand zal hen schrik aanjagen.", "Ex 33:13": "Nu dan, ik bid U, als ik genade gevonden heb in Uw ogen, laat mij dan nu Uw weg weten, en ik zal U kennen, opdat ik genade vind in Uw ogen; en zie aan dat dit volk Uw volk is!", "Job 27:4": "Indien mijn lippen onrecht zullen spreken, en indien mijn tong bedrog zal uitspreken!", "Num 16:15": "Toen ontstak Mozes zeer, en hij zei tegen de HEERE: Zie hun offer niet aan! Ik heb niet één ezel van hen genomen, en niemand van hen kwaad gedaan.", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "2 Kon 9:27": "Toen Ahazia, de koning van Juda, dat zag, vluchtte hij via de weg naar het huis van de hoftuin; maar Jehu vervolgde hem, en zei: Sla hem ook neer op de wagen, bij de opgang naar Gur, die bij Jibleam is; en hij vluchtte naar Megiddo, en stierf daar.", "Spr 19:1": "De arme, die in zijn oprechtheid wandelt, is beter dan de verkeerde van lippen, en die een dwaas is.", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Luk 4:19": "Om aan de gevangenen vrijlating te prediken, en aan de blinden het gezicht, om de verslagenen in vrijheid heen te zenden; om te prediken het aangename jaar van de Heere.", "Pred 5:5": "Laat uw mond niet toe dat hij uw lichaam laat zondigen; en zeg niet voor het aangezicht van de engel dat het een vergissing was; waarom zou God erg toornen om wat u zegt, en het werk van uw handen te gronde richten?", "Luk 1:46-55": "En Maria zei: Mijn ziel maakt de Heere groot, en mijn geest verheugt zich in God, mijn Zaligmaker; omdat Hij de nederigheid van Zijn dienstmaagd heeft aangezien; want zie, van nu af aan zullen alle geslachten mij zalig spreken.", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Ps 137:8": "O dochter van Babel! die verwoest zal worden, gelukkig zal hij zijn, die u uw misdaad vergelden zal, die u aan ons misdaan hebt.", "Luk 11:53": "En toen Hij deze dingen tegen hen zei, begonnen de Schriftgeleerden en Farizeeën Hem hevig aan te vallen, en Hem over veel dingen uit te horen;", "Matt 13:14": "En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Ezech 25:15": "Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap;", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Spr 19:7": "Al de broeders van de arme haten hem; hoeveel te meer gaan zijn vrienden ver van hem weg! Hij loopt hen achterna met woorden, die niets zijn.", "Ps 6:7": "Ik ben moe van mijn zuchten; ik laat mijn bed de hele nacht zwemmen; ik doornat mijn bedstede met mijn tranen.", "Jes 29:21": "die een mens schuldig maken om een woord, en die strikken leggen voor hem die bestraft in de poort; en die de rechtvaardige verdrijven met valse argumenten.", "Matt 5:21": "U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Hand 4:27": "Want in waarheid zijn tegen Uw heilig Kind Jezus, Die U gezalfd hebt, bijeengekomen, zowel Herodes en Pontius Pilatus, met de heidenen en de volken van Israël;", "Hand 4:30": "Doordat U Uw hand uitstrekt tot genezing, en doordat er tekenen en wonderen gebeuren door de Naam van Uw heilig Kind Jezus.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Ps 119:49": "Zain. Gedenk het woord, tot Uw knecht gesproken, waarop U mij hebt doen hopen.", "Ps 22:17": "Want honden hebben mij omsingeld; een vergadering van boosdoeners heeft mij omgeven; zij hebben mijn handen en mijn voeten doorgraven.", "Hand 7:52": "Wie van de profeten hebben uw vaders niet vervolgd? En zij hebben degenen gedood die van tevoren de komst van de Rechtvaardige verkondigd hebben, van Wie u nu verraders en moordenaars geworden bent.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Hand 7:32": "die zei: Ik ben de God van uw vaders, de God van Abraham, en de God van Izak, en de God van Jakob. En Mozes begon hevig te beven, en durfde niet te kijken.", "Ps 31:18": "HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.", "Ps 22:12-22": "Wees dan niet ver van mij, want benauwdheid is nabij; want er is geen helper. Veel stieren hebben mij omsingeld, sterke stieren van Basan hebben mij omringd. Zij hebben hun mond tegen mij opgesperd, als een verscheurende en brullende leeuw.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Luk 4:28": "En zij werden allen in de synagoge met toorn vervuld, toen zij dit hoorden.", "Mark 14:9": "Voorwaar, Ik zeg u: Waar dit Evangelie ook gepredikt zal worden in de hele wereld, daar zal ook gesproken worden over wat zij gedaan heeft, tot haar gedachtenis.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Ps 118:29": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Hand 7:26-28": "En de volgende dag liet hij zich aan hen zien, terwijl zij vochten; en hij drong hen tot vrede, en zei: Mannen, u bent broeders; waarom doet u elkaar onrecht aan? Maar die zijn naaste onrecht aandeed, stiet hem weg, en zei: Wie heeft u tot leider en rechter over ons gesteld? Wilt u mij ook ombrengen, zoals u gisteren de Egyptenaar hebt omgebracht?", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Hand 7:3": "en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal.", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "1 Tim 5:15": "Want sommigen hebben zich al afgewend, achter de satan aan.", "Spr 13:8": "Het rantsoen van ieders ziel is zijn rijkdom; maar de arme hoort het schelden niet.", "Ps 45:7": "Uw troon, o God! is eeuwig en altijd; de scepter van Uw koninkrijk is een scepter van rechtmatigheid.", "Ps 136:1-26": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Loof de God der goden; want Zijn goedertierenheid is voor eeuwig. Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig.", "Ps 39:11": "Neem Uw plaag van mij weg; ik ben bezweken door de slagen van Uw hand.", "2 Sam 16:8": "De HEERE heeft op u al het bloed van het huis van Saul laten terugkomen, in wiens plaats u geregeerd hebt; nu heeft de HEERE het koninkrijk gegeven in de hand van Absalom, uw zoon; zie nu, u bent in uw ongeluk, omdat u een man van bloed bent.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Ps 107:15": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Rom 3:14": "Hun mond is vol vervloeking en bitterheid;", "Ps 119:116": "Ondersteun mij naar Uw toezegging, opdat ik leve; en laat mij niet beschaamd worden over mijn hoop.", "Klaagl 1:9-11": "Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar einde, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot. Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden. Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "Matt 26:3": "Toen kwamen de overpriesters en de Schriftgeleerden en de oudsten van het volk samen in de zaal van de hogepriester, die Kajafas genoemd werd;", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "Spr 13:23": "Het ploegen van de armen geeft overvloed van voedsel; maar er is iemand die verteerd wordt door gebrek aan oordeel.", "Luk 22:47": "En terwijl Hij nog sprak, zie, daar was een menigte; en één van de twaalf, die Judas genoemd werd, ging voor hen uit, en kwam bij Jezus om Hem te kussen.", "Job 6:4": "Want de pijlen van de Almachtige zijn in mij, waarvan het vurige venijn mijn geest uitdrinkt; de verschrikkingen van God rusten zich tegen mij.", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Ps 119:43": "En ruk het woord van de waarheid van mijn mond niet al te zeer, want ik hoop op Uw rechten.", "Rom 1:29-32": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid; kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders; onverstandigen, verbondbrekers, zonder natuurlijke liefde, onverzoenlijken, onbarmhartigen;", "Ps 83:19": "opdat zij weten dat U alleen met Uw Naam de HEERE bent, de Allerhoogste over de hele aarde.", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Jes 53:3-6": "Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht. Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt. Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Matt 20:17-19": "En Jezus, op weg naar Jeruzalem, nam de twaalf discipelen apart onderweg, en zei tegen hen: Zie, wij gaan naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters en Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen; en zij zullen Hem aan de heidenen overleveren, om Hem te bespotten en te geselen en te kruisigen; en op de derde dag zal Hij weer opstaan.", "Zef 3:12": "Maar Ik zal in uw midden doen overblijven een ellendig en arm volk; die zullen op de Naam van de HEERE vertrouwen.", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "Ps 97:12": "Rechtvaardigen, verblijd u in de HEERE, en spreek lof ter gedachtenis van Zijn heiligheid.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Hebr 10:13": "verder wachtend, totdat Zijn vijanden neergelegd worden als een voetbank voor Zijn voeten.", "Ps 119:161": "Schin. De vorsten hebben mij vervolgd zonder oorzaak; maar mijn hart heeft gevreesd voor Uw woord.", "Hand 2:17-21": "En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren. En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.", "Ps 80:7": "U hebt ons onze buren tot een twist gesteld, en onze vijanden spotten onder elkaar.", "Matt 26:21-25": "En terwijl zij aten, zei Hij: Voorwaar, Ik zeg u dat één van u Mij zal verraden. En zij werden zeer bedroefd en ieder van hen begon tegen Hem te zeggen: Ben ik het, Heere? En Hij antwoordde en zei: Die de hand met Mij in de schotel indoopt, die zal Mij verraden.", "2 Tim 4:14": "Alexander, de kopersmid, heeft mij veel kwaad aangedaan; de Heere zal hem vergelden naar zijn werken.", "Zach 11:12": "Want ik had tegen hen gezegd: Als het goed is in uw ogen, breng mijn loon, en zo niet, laat het na. En zij hebben mijn loon gewogen, dertig zilverlingen.", "Spr 24:17": "Verblijd u niet, als uw vijand valt; en als hij neerstruikelt, laat uw hart zich niet verheugen;", "1 Kor 1:23": "Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Ps 7:3": "Anders zou hij mijn ziel roven als een leeuw, die verscheurt, terwijl er geen redder is.", "Ps 135:19": "U, huis van Israël! looft de HEERE; u, huis van Aäron! looft de HEERE.", "1 Sam 26:18": "Hij zei verder: Waarom vervolgt mijn heer zijn dienaar zo achterna? Want wat heb ik gedaan, en wat kwaad is er in mijn hand?", "Ps 48:2": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid.", "Matt 27:34": "gaven zij Hem azijn te drinken, gemengd met gal; en toen Hij dat geproefd had, wilde Hij niet drinken.", "Ps 102:26-28": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn. Maar U bent Dezelfde, en Uw jaren zullen niet geëindigd worden.", "Num 22:12": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend.", "Rom 12:20": "Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen.", "Ps 22:7-9": "Maar ik ben een worm en geen man, een smaad van mensen, en veracht van het volk. Allen die mij zien, bespotten mij; zij steken de lip uit, zij schudden het hoofd en zeggen: Hij heeft het op de HEERE gewenteld, dat Hij hem nu uithelpt, dat Hij hem redt, omdat Hij lust aan hem heeft!", "Ps 35:13": "Mij aangaande daarentegen, toen zij ziek waren, was een zak mijn kleed; ik kwelde mijn ziel met vasten, en mijn gebed keerde weer in mijn boezem.", "Hebr 8:8-12": "Want omdat Hij hen berispt, zegt Hij tegen hen: Zie, de dagen komen, spreekt de Heere, dat Ik over het huis van Israël en over het huis van Juda een nieuw verbond zal oprichten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere. Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Ps 38:21": "En die kwaad voor goed vergelden, staan mij tegen, omdat ik het goede najaag.", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Matt 4:16": "het volk dat in duisternis zat, heeft een groot licht gezien; en over hen die zaten in het land en de schaduw van de dood, is een licht opgegaan.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Mark 1:3": "De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht.", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "Ps 69:26": "Hun paleis worde verwoest; in hun tenten zij geen inwoner.", "Ps 63:4": "Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen.", "Deut 8:5": "Erken dan in uw hart, dat de HEERE, uw God, u opvoedt, zoals een man zijn zoon opvoedt.", "Deut 32:34": "Is dat niet bij Mij opgeslagen, verzegeld in Mijn schatten?", "1 Tim 1:10": "De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "Matt 3:3": "Want deze is het, van wie gesproken is door Jesaja, de profeet, toen hij zei: De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Ps 135:1-3": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE! U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God! Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.", "2 Sam 16:7": "Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!", "Ps 10:14": "U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Gen 21:12": "Maar God zei tegen Abraham:
