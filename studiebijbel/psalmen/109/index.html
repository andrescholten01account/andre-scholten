eren","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een psalm van David, voor de koorleider[1]. O God van mijn lof! Zwijg niet.","2":"Want de mond van de goddeloze en de mond van het bedrog zijn tegen mij opengedaan; zij hebben tegen mij gesproken met een valse tong.","3":"En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak.","4":"Voor mijn liefde staan zij mij tegen; maar ik was *steeds* *in* *het* gebed.","5":"En zij hebben mij kwaad voor goed opgelegd, en haat voor mijn liefde.","6":"Stel een goddeloze over hem, en de satan sta aan zijn rechterhand.","7":"Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden.","8":"Laat zijn dagen weinig zijn; een ander neemt zijn ambt;","9":"Laat zijn kinderen wezen worden, en zijn vrouw weduwe.","10":"En laat zijn kinderen hier en daar omzwerven, en bedelen, en *de* *nooddruft* uit hun verwoeste plaatsen zoeken.","11":"Laat de schuldeiser aanslaan al wat hij heeft, en laat de vreemden zijn arbeid roven.","12":"Laat hij niemand hebben die weldadigheid over hem uitstrekt, en laat er niemand zijn die zijn wezen genadig is.","13":"Laat zijn nakomelingen uitgeroeid worden; hun naam moet uitgedelgd worden in het volgende geslacht.","14":"De ongerechtigheid van zijn vaderen moet gedacht worden bij de HEERE, en de zonde van zijn moeder moet niet uitgedelgd worden.","15":"Laat ze voortdurend voor de HEERE zijn; en Hij roeit hun gedachtenis uit van de aarde.","16":"Omdat hij niet gedacht heeft weldadigheid te doen, maar de ellendige en de behoeftige man heeft vervolgd, en de verslagene van hart, om *hem* te doden.","17":"Omdat hij de vloek heeft liefgehad, laat die hem overkomen, en heeft geen lust gehad tot de zegen, laat die dan ver van hem zijn.","18":"En laat hij bekleed zijn met de vloek, als met zijn kleed, en laat die gaan tot in zijn binnenste als het water, en als de olie in zijn beenderen.","19":"Laat het hem zijn als een kleed, *waarmee* hij zich bedekt, en tot een gordel, waarmee hij zich steeds omgordt.","20":"Dit moet het werkloon zijn van mijn tegenstanders van de HEERE, en van hen die kwaad spreken tegen mijn ziel.","21":"Maar U, o HEERE Heere! doe met mij naar wat past bij Uw Naam; omdat Uw goedertierenheid goed is, verlos mij.","22":"Want ik ben ellendig en behoeftig, en mijn hart is in mijn binnenste doorwond.","23":"Ik ga heen als een schaduw wanneer die zich neigt; ik word omgedreven als een sprinkhaan.","24":"Mijn knieën struikelen van het vasten, en mijn vlees is vermagerd, zodat er geen vet aan is.","25":"Nog ben ik hun een smaad; als zij mij zien, schudden zij hun hoofd.","26":"Help mij, HEERE, mijn God! Verlos mij naar Uw goedertierenheid.","27":"Opdat zij weten dat dit Uw hand is, *dat* U het, HEERE, gedaan hebt.","28":"Laat hen vloeken, maar zegen Ú; laat hen opstaan, maar laat hen beschaamd worden; maar laat Uw knecht zich verblijden.","29":"Laat mijn tegenstanders met schande bekleed worden, en laat hen zich met hun schande bedekken, als met een mantel.","30":"Ik zal de HEERE met mijn mond zeer loven, en te midden van velen zal ik Hem prijzen.","31":"Want Hij zal de behoeftige ter rechterhand staan, om *hem* te verlossen van hen die zijn ziel veroordelen."},"SV":{"1":"Een psalm van David, voor den opperzangmeester. O God mijns lofs! zwijg niet.","2":"Want de mond des goddelozen en de mond des bedrogs zijn tegen mij opengedaan; zij hebben met mij gesproken met een valse tong.","3":"En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak.","4":"Voor mijn liefde, staan zij mij tegen; maar ik was *steeds* *in* *het* gebed.","5":"En zij hebben mij kwaad voor goed opgelegd, en haat voor mijn liefde.","6":"Stel een goddeloze over hem, en de satan sta aan zijn rechterhand.","7":"Als hij gericht wordt, zo ga hij schuldig uit, en zijn gebed zij tot zonde.","8":"Dat zijn dagen weinig zijn; een ander neme zijn ambt;","9":"Dat zijn kinderen wezen worden, en zijn vrouw weduwe.","10":"En dat zijn kinderen hier en daar omzwerven, en bedelen, en *de* *nooddruft* uit hun verwoeste plaatsen zoeken.","11":"Dat de schuldeiser aansla al wat hij heeft, en dat de vreemden zijn arbeid roven.","12":"Dat hij niemand hebbe, die weldadigheid *over* *hem* uitstrekke, en dat er niemand zij, die zijn wezen genadig zij.","13":"Dat zijn nakomelingen uitgeroeid worden; hun naam worde uitgedelgd in het andere geslacht.","14":"De ongerechtigheid zijner vaderen worde gedacht bij den HEERE, en de zonde zijner moeder worde niet uitgedelgd.","15":"Dat zij gedurig voor den HEERE zijn; en Hij roeie hun gedachtenis uit van de aarde.","16":"Omdat hij niet gedacht heeft weldadigheid te doen, maar heeft den ellendigen en den nooddruftigen man vervolgd, en den verslagene van hart, om *hem* te doden.","17":"Dewijl hij den vloek heeft liefgehad, dat die hem overkome, en geen lust gehad heeft tot den zegen, zo zij die verre van hem.","18":"En hij zij bekleed met den vloek, als met zijn kleed, en dat die ga tot in het binnenste van hem als het water, en als de olie in zijn beenderen.","19":"Die zij hem als een kleed, *waarmede* hij zich bedekt, en tot een gordel, waarmede hij zich steeds omgordt.","20":"Dit zij het werkloon mijner tegenstanders van den HEERE, en dergenen, die kwaad spreken tegen mijn ziel.","21":"Maar Gij, o HEERE Heere! maak het met mij om Uws Naams wil; dewijl Uw goedertierenheid goed is, verlos mij.","22":"Want ik ben ellendig en nooddruftig, en mijn hart is in het binnenste van mij doorwond.","23":"Ik ga heen gelijk een schaduw, wanneer zij zich neigt; ik worde omgedreven als een sprinkhaan.","24":"Mijn knieën struikelen van vasten, en mijn vlees is vermagerd, zodat er geen vet aan is.","25":"Nog ben ik hun een smaad; als zij mij zien, zo schudden zij hun hoofd.","26":"Help mij, HEERE, mijn God! verlos mij naar Uw goedertierenheid.","27":"Opdat zij weten, dat dit Uw hand is, *dat* Gij het, HEERE! gedaan hebt.","28":"Laat hen vloeken, maar zegen Gij; laat hen zich opmaken, maar dat zij beschaamd worden; doch dat zich Uw knecht verblijde.","29":"Laat mijn tegenstanders met schande bekleed worden, en dat zij met hun beschaamdheid zich bedekken, als met een mantel.","30":"Ik zal den HEERE met mijn mond zeer loven, en in het midden van velen zal ik Hem prijzen.","31":"Want Hij zal den nooddruftige ter rechterhand staan, om *hem* te verlossen van degenen, die zijn ziel veroordelen."},"KJV":{"1":"[[To the chief Musician, A Psalm of David.]] Hold not thy peace, O God of my praise;","2":"For the mouth of the wicked and the mouth of the deceitful are opened against me: they have spoken against me with a lying tongue.","3":"They compassed me about also with words of hatred; and fought against me without a cause.","4":"For my love they are my adversaries: but I *give myself unto* prayer.","5":"And they have rewarded me evil for good, and hatred for my love.","6":"Set thou a wicked man over him: and let Satan stand at his right hand.","7":"When he shall be judged, let him be condemned: and let his prayer become sin.","8":"Let his days be few; *and* let another take his office.","9":"Let his children be fatherless, and his wife a widow.","10":"Let his children be continually vagabonds, and beg: let them seek *their bread* also out of their desolate places.","11":"Let the extortioner catch all that he hath; and let the strangers spoil his labour.","12":"Let there be none to extend mercy unto him: neither let there be any to favour his fatherless children.","13":"Let his posterity be cut off; *and* in the generation following let their name be blotted out.","14":"Let the iniquity of his fathers be remembered with the LORD; and let not the sin of his mother be blotted out.","15":"Let them be before the LORD continually, that he may cut off the memory of them from the earth.","16":"Because that he remembered not to shew mercy, but persecuted the poor and needy man, that he might even slay the broken in heart.","17":"As he loved cursing, so let it come unto him: as he delighted not in blessing, so let it be far","18":"As he clothed himself with cursing like as with his garment, so let it come into his bowels like water, and like oil into his bones.","19":"Let it be unto him as the garment *which* covereth him, and for a girdle wherewith he is girded continually.","20":"*Let* this *be* the reward of mine adversaries from the LORD, and of them that speak evil against my soul.","21":"But do thou for me, O GOD the Lord, for thy name's sake: because thy mercy *is* good, deliver","22":"For I *am* poor and needy, and my heart is wounded within","23":"I am gone like the shadow when it declineth: I am tossed up and down as the locust.","24":"My knees are weak through fasting; and my flesh faileth of fatness.","25":"I became also a reproach unto them: *when* they looked upon me they shaked their heads.","26":"Help me, O LORD my God: O save me according to thy mercy:","27":"That they may know that this *is* thy hand; *that* thou, LORD, hast done","28":"Let them curse, but bless thou: when they arise, let them be ashamed; but let thy servant rejoice.","29":"Let mine adversaries be clothed with shame, and let them cover themselves with their own confusion, as with a mantle.","3 8034\">name</span> be blotted out.","14":"Let the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> be <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> with the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and let not the <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> of his <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> be blotted out.","15":"Let them be before the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually,</span> that he may cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H2143\">memory</span> of them from the earth.","16":"Because that he <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> not to <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy,</span> but <span class=\"wl wl-kjv\" data-code=\"H7291\">persecuted</span> the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> and <span class=\"wl wl-kjv\" data-code=\"H34\">needy</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> that he might even <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> the <span class=\"wl wl-kjv\" data-code=\"H3512\">broken</span> in heart.","17":"As he <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> <span class=\"wl wl-kjv\" data-code=\"H7045\">cursing,</span> so let it <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto him: as he <span class=\"wl wl-kjv\" data-code=\"H2654\">delighted</span> not in <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing,</span> so let it be far","18":"As he <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> himself with <span class=\"wl wl-kjv\" data-code=\"H7045\">cursing</span> like as with his <span class=\"wl wl-kjv\" data-code=\"H4055\">garment,</span> so let it <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into his <span class=\"wl wl-kjv\" data-code=\"H7130\">bowels</span> like <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and like <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> into his bones.","19":"Let it be unto him as the <span class=\"wl wl-kjv\" data-code=\"H899\">garment</span> which <span class=\"wl wl-kjv\" data-code=\"H5844\">covereth</span> him, and for a <span class=\"wl wl-kjv\" data-code=\"H4206\">girdle</span> wherewith he is <span class=\"wl wl-kjv\" data-code=\"H2296\">girded</span> continually.","20":"Let this be the <span class=\"wl wl-kjv\" data-code=\"H6468\">reward</span> of mine <span class=\"wl wl-kjv\" data-code=\"H7853\">adversaries</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and of them that <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> against my soul.","21":"But <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> thou for me, O <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> for thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name's</span> sake: because thy <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> deliver","22":"For I am <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> and <span class=\"wl wl-kjv\" data-code=\"H34\">needy,</span> and my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is <span class=\"wl wl-kjv\" data-code=\"H2490\">wounded</span> within","23":"I am <span class=\"wl wl-kjv\" data-code=\"H1980\">gone</span> like the <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> when it <span class=\"wl wl-kjv\" data-code=\"H5186\">declineth:</span> I am tossed up and <span class=\"wl wl-kjv\" data-code=\"H5287\">down</span> as the locust.","24":"My <span class=\"wl wl-kjv\" data-code=\"H1290\">knees</span> are <span class=\"wl wl-kjv\" data-code=\"H3782\">weak</span> through <span class=\"wl wl-kjv\" data-code=\"H6685\">fasting;</span> and my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> <span class=\"wl wl-kjv\" data-code=\"H3584\">faileth</span> of fatness.","25":"I became also a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> unto them: when they <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> upon me they <span class=\"wl wl-kjv\" data-code=\"H5128\">shaked</span> their heads.","26":"<span class=\"wl wl-kjv\" data-code=\"H5826\">Help</span> me, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> O <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> me according to thy mercy:","27":"That they may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that this is thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> that thou, <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> hast done","28":"Let them <span class=\"wl wl-kjv\" data-code=\"H7043\">curse,</span> but <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> thou: when they <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> let them be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed;</span> but let thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> rejoice.","29":"Let mine <span class=\"wl wl-kjv\" data-code=\"H7853\">adversaries</span> be <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> with <span class=\"wl wl-kjv\" data-code=\"H3639\">shame,</span> and let them <span class=\"wl wl-kjv\" data-code=\"H5844\">cover</span> themselves with their own <span class=\"wl wl-kjv\" data-code=\"H1322\">confusion,</span> as with a mantle.","30":"I will <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> with my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth;</span> yea, I will <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> him <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the multitude.","31":"For he shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> at the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H34\">poor,</span> to <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> him from those that <span class=\"wl wl-kjv\" data-code=\"H8199\">condemn</span> his soul."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"psalm van David,","tekst":"Zie Psa 4:1 ."},{"catchword":"mijns lofs","tekst":"Dat Gij de materie en stof zijt van mijne lofzangen, en die mij overvloedige oorzaak geeft om U te prijzen, gelijk Exo 15:2 ."},{"catchword":"zwijg niet","tekst":"Dat is, maar antwoord mij en verhoor dit mijn gebed, en help mij, opdat het metterdaad blijke dat Gij mij verhoord hebt. Alzo ook Psa 28:1 , en Psa 35:22 , en Psa 39:13 , en Psa 83:2 ."}],"2":[{"catchword":"de mond des","tekst":"Dat is, de bedriegelijke mond, verstaande daarbij de bedriegelijke, loze mensen."},{"catchword":"zij hebben","tekst":"Te weten, die bedriegers in Sauls hof en dergelijke anderen; door welken de vijanden van den Heere Christus, en inzonderheid van Juda, zijn afgebeeld."}],"3":[{"catchword":"met hatelijke","tekst":"Dat is, met woorden, die uit enkel haat en afgunst gesproken zijn. Hebr. met woorden van den haat."}],"4":[{"catchword":"Voor mijn liefde,","tekst":"Te weten, voor de liefde, waarmede ik hen bemind heb."},{"catchword":"maar ik was","tekst":"Hebr. maar ik het gebed. Anders: maar ik [was een man] des gebeds; dat is, ik heb mij tot het gebed begeven. Alzo staat er in Psa 120 , ik vrede, en Oba 1:7 , uw brood, voor mannen die uw brood eten. Het is zoveel, alsof de profeet hier zeide: Het gebed tot God is mijn enige tegenweer en toevlucht geweest, ik heb geen ongeoorloofde middelen bij de hand genomen. Zie Psa 69:14 . Of, ik heb niet opgehouden voor hen te bidden, die mij zoveel gedaan hebben. Zie Psa 35:13 ."}],"6":[{"catchword":"Stel een goddeloze","tekst":"Dat is, geef een harden, straffen mens last en macht over hem, dat hij zijn dwangmeester en kweller zij, gelijk hij anderen geweest is."},{"catchword":"de satan","tekst":"Of, wederpartijder. Zie de aantekening bij Job 1:6 . De psalmist wenst dat zijn wederpartijder een aanklager hebbe, die hem in zijn aangezicht voor den Rechter gestadig beschuldige, gelijk de duivel Job gedaan heeft."},{"catchword":"sta aan zijn","tekst":"Dat is, overwinne hem in het gericht, door stevig drijven en dringen. Anderen nemen dit alzo: De satan sta aan zijne rechterhand; te weten, om hem tegenstand te doen, alzo dat hij zijne rechterhand niet kan gebruiken, dat is dat hij zijne zaken niet bekwamelijk kan uitrichten. Zie Zec 3:1 , maar onder vs.31 wordt deze manier van spreken gebruikt voor beschutten en beschermen."}],"7":[{"catchword":"schuldig uit, en","tekst":"Dat is, hij worde voor goddeloos gekend en geoordeeld. Zie Num 35:31 ."},{"catchword":"zijn gebed zij","tekst":"Dat is, hij worde door geen bidden ontslagen van den rechter, die hem heeft verwezen, maar dat hij zijne zaak eer kwader daarmede make en die hem derhalve afgeslagen worde, als zijnde onrechtvaardig. Of men mag hier verstaan het gebed, dat hij tot God doet, in dezen zin, dat God hem dat wil afslaan, dewijl het huichelarij is."}],"8":[{"catchword":"zijn dagen weinig","tekst":"Te weten, de dagen zijns levens. Zie Psa 55:24 ."},{"catchword":"ambt;","tekst":"Of, officie, opzicht, bediening. Deze woorden van David worden uitgelegd op Judas, wiens ambt of bediening Matthias gegeven werd; Act 1:20 ."}],"9":[{"catchword":"Dat zijn kinderen","tekst":"Dit is een van de vloeken der wet; Exo 22:24 ; Jer 18:21 ."}],"10":[{"catchword":"hier en daar","tekst":"Hebr. omzwervende omzwerven."},{"catchword":"uit hun verwoeste","tekst":"Anders: vanwege hunne verwoeting; omdat hun eigen land en huizen verwoest zijn."}],"11":[{"catchword":"de schuldeiser","tekst":"Dat is, die wien hij schuldig is. Of versta hier, door den schuldeiser den pander, of executeur."},{"catchword":"al wat hij heeft,","tekst":"Hebr. verstrikke; dat is, in zijne strikken en geweld, of arrest krijge."},{"catchword":"zijn arbeid roven","tekst":"Dat is, hetgeen hij met moeite en arbeid gewonnen heeft. Zie Job 20:18 ."}],"13":[{"catchword":"zijn nakomelingen","tekst":"Anders: zijn laatste, of zijn einde."},{"catchword":"uitgedelgd","tekst":"Of, uitgevaagd, uitgewist. Zie Psa 37:28 ."},{"catchword":"in het andere","tekst":"Dat is, in het geslacht, dat na dezen komen zal."}],"14":[{"catchword":"ongerechtigheid","tekst":"Dat is, de Heere straffe hem niet alleen vanwege zijn eigen, maar ook vanwege de zonden zijner voorvaders. De psalmist ziet hier op de bedreiging van het tweede gebod; Exo 20:5 ."},{"catchword":"de zonde","tekst":"Dat is, God straffe hem ook om zijner moeders zonde, gelijk de aantekening bij vs.14."}],"15":[{"catchword":"gedurig voor","tekst":"Te weten, die ongerechtigheid en zonde, waarvan vs.14 gesproken is."},{"catchword":"Hij roeie","tekst":"Het tegendeel wordt den godzalige beloofd; Psa 41:3 , en Psa 112:6 ."},{"catchword":"hun gedachtenis","tekst":"Te weten, zijns vaders en zijner moeder."}],"16":[{"catchword":"den verslagene","tekst":"Of, den gekrenkte aan het hart."}],"17":[{"catchword":"Dewijl hij den","tekst":"Dat is, dewijl hij lust gehad heeft anderen te vloeken, en door zijne goddeloosheid zichzelven den vloek op den hals gehaald heeft."},{"catchword":"tot den zegen,","tekst":"Dat is, anderen den zegen toe te wensen en godzaliglijk te leven om gezegend te worden. Verg. met deze plaats Pro 8:36 ."},{"catchword":"die verre van hem","tekst":"Te weten, de zegen."}],"19":[{"catchword":"Die zij hem","tekst":"Te weten, de vloek. Hij bidt dat de vloek, dien hij anderen heeft toegewenst, hem steeds aanha n, met grote genegenheid."},{"catchword":"van velen zal","tekst":"Of, van de machtigen, of groten."}],"31":[{"catchword":"ter rechterhand staan,","tekst":"Dat is, beschutten, verdedigen, bijstand doen. Zie boven, vs.6, en Psa 16:8 ; Act 2:25 ."},{"catchword":"zijn ziel veroordelen","tekst":"Zijne ziel; dat is, hem."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A Psalm of David, [See Psa 4:1.] for the chief song-master. O God of my praise, [thou that art the matter and subject of my songs of praise, and that givest me abundant cause of praising thee continually; as Exo 15:2.] be not silent. [but answer me, and hear my prayer, and help me, that it may appear indeed, thou hast heard me. So likewise Psa 28:1. and 35.22. and 39.13. and 83.2.]"}],"2":[{"catchword":null,"tekst":"For the mouth of the wicked, and the mouth of guile, [i.e. the deceitful mouth, whereby is understood a false deceitful man] are opened against me; they have spoken with me with a false tongue. [those deceitful countiers of Saul, namely, and others like them; by whom are typified the enemies of our Saviour Christ, and especially Judas.]"}],"3":[{"catchword":null,"tekst":"And they have surrounded me with hateful words, [With words which proceeded of meer hate and spleen against me. Hebr. With words of hate] yea, they have warred against me without cause."}],"4":[{"catchword":null,"tekst":"For my love, [viz. For the love and affection which I bore unto them] they stand against me: but I was (continually in) prayer. [Hebr. But I the prayer: Others, but I (was a man) of prayer. i.e. I gave my self to prayer. So we have it Psalm 120. I peace, and Obad 7. Thy bread, for such as eat thy bread; as if the Prophet had said here, Praying to God was my onely fence and refuge, I have made use of no unlawful means against them. See Psal.35.v.13.]"}],"5":[{"catchword":null,"tekst":"And they have laid me up evil for good, and hate for my love."}],"6":[{"catchword":null,"tekst":"Put a wicked over him, [i // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  e.stopPropagation();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
