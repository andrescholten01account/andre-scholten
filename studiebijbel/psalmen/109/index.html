 Laat het niet kwaad zijn in uw ogen vanwege de jongen en vanwege uw slavin; alles wat Sara tegen u zegt, luister naar haar stem; want in Izak zal uw nageslacht genoemd worden.", "Jak 4:7": "Onderwerp u dan aan God; weerstaat de duivel, en hij zal van u wegvluchten.", "Jer 18:19": "HEERE, luister naar mij, en hoor naar de stem van hen die met mij twisten.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Matt 21:4": "Dit alles nu is gebeurd, opdat vervuld werd wat gesproken is door de profeet, die zei:", "Ps 119:84": "Hoeveel zullen de dagen van Uw knecht zijn? Wanneer zult U recht doen over mijn vervolgers?", "Matt 15:4": "Want God heeft geboden en gezegd: Eer uw vader en moeder, en: Wie vader of moeder vervloekt, die zal de dood sterven.", "Hebr 8:5": "Deze priesters dienen het voorbeeld en de schaduw van de hemelse dingen, zoals Mozes door een goddelijke aanwijzing gewaarschuwd werd toen hij de tabernakel zou voltooien: Want, zegt Hij, zie erop toe dat u alles maakt naar het patroon dat u op de berg getoond is.", "Job 31:6": "Hij weegt mij op, in een rechte weegschaal, en God zal mijn oprechtheid weten.", "Gen 2:2": "Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Rom 4:8": "Gelukkig is de man, aan wie de Heere de zonden niet toerekent.", "Ps 22:9": "Hij heeft het op de HEERE gewenteld, dat Hij hem nu uithelpt, dat Hij hem redt, omdat Hij lust aan hem heeft!", "Gen 22:16": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt;", "Mark 16:17": "En degenen die geloofd zullen hebben, zullen deze tekenen volgen: in Mijn Naam zullen zij duivels uitwerpen; met nieuwe tongen zullen zij spreken;", "Mark 15:10": "(Want hij wist dat de overpriesters Hem uit afgunst overgeleverd hadden.)", "1 Petr 3:15": "maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,", "Hebr 10:5-7": "Daarom zegt Hij, bij Zijn komst in de wereld: Slachtoffer en offergave hebt U niet gewild, maar U hebt Mij een lichaam toebereid; Brandoffers en offers voor de zonde hebben U niet behaagd. Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Rom 4:17": "(Zoals geschreven staat: Ik heb u tot een vader van veel volken gesteld) voor Hem, aan Wie hij geloofd heeft, namelijk God, Die de doden levend maakt, en de dingen die niet zijn roept alsof zij waren;", "Ps 40:14": "Het behaagt U, HEERE! mij te verlossen; HEERE! haast U tot mijn hulp.", "Ps 148:1-14": "Halleluja! Looft de HEERE uit de hemelen; looft Hem in de hoogste plaatsen! Looft Hem, al Zijn engelen! Looft Hem, al Zijn heerscharen! Looft Hem, zon en maan! Looft Hem, alle lichtende sterren!", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Jes 52:13": "Zie, Mijn Knecht zal verstandig handelen; Hij zal verhoogd en verheven, ja, zeer hoog worden.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Ps 119:77": "Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Ex 20:12": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.", "Rom 1:9": "Want God is mijn Getuige, Die ik dien in mijn geest, in het Evangelie van Zijn Zoon, hoe ik zonder ophouden aan u denk;", "Fil 4:20": "Onze God en Vader nu zij de heerlijkheid tot in alle eeuwigheid. Amen.", "Job 5:15": "Maar Hij verlost de behoeftige van het zwaard, van hun mond, en van de hand van de sterke.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Hand 7:50": "Heeft Mijn hand niet al deze dingen gemaakt?", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Luk 20:37": "En dat de doden opgewekt zullen worden, heeft ook Mozes aangewezen bij de doornstruik, toen hij de Heere de God van Abraham noemt, en de God van Izak, en de God van Jakob.", "Ps 142:3": "Ik stortte mijn klacht uit voor Zijn aangezicht; ik maakte voor Zijn aangezicht mijn benauwdheid bekend.", "Ps 107:4": "Die in de woestijn dwaalden, op een weg door de wildernis, die geen stad vonden om in te wonen;", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "2 Kor 6:18": "en Ik zal u tot een Vader zijn, en u zult Mij tot zonen en dochters zijn, zegt de Heere, de Almachtige.", "Ps 35:22": "HEERE! U hebt het gezien, zwijg niet; Heere! Wees niet ver van mij.", "Ps 69:24": "Laat hun ogen duister worden, dat zij niet zien; en doe hun heupen voortdurend waggelen.", "Luk 4:29": "En zij stonden op en wierpen Hem de stad uit, en leidden Hem naar de top van de berg waarop hun stad gebouwd was, om Hem van de steilte af te werpen;", "Ps 106:47": "Verlos ons, HEERE, onze God! en verzamel ons uit de heidenen, opdat wij de Naam van Uw heiligheid loven, ons beroemend in Uw lof.", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Jes 10:23": "Want een verdelging, die vast besloten is, zal de Heere HEERE van de heerscharen doen in het midden van dit hele land.", "2 Sam 16:10-13": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd. Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "2 Sam 12:16": "En David zocht God voor dat jongetje; en David vastte een vasten, en ging naar binnen, en lag heel de nacht op de aarde.", "Luk 22:31": "En de Heere zei: Simon, Simon, zie, de satan heeft u dringend willen ziften als de tarwe;", "Joh 10:34": "Jezus antwoordde hun: Staat er niet geschreven in uw wet: Ik heb gezegd, u bent goden?", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Luk 6:12": "En het gebeurde in die dagen, dat Hij de berg opging om te bidden, en Hij bracht de nacht door in het gebed tot God.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 6:2-8": "O HEERE, straf mij niet in Uw toorn, en tuchtig mij niet in Uw grimmigheid! Wees mij genadig, HEERE, want ik ben verzwakt; genees mij, HEERE, want mijn beenderen zijn verschrikt. Ja, mijn ziel is zeer verschrikt; en U, HEERE, hoe lang nog?", "Ps 79:10-12": "Waarom zouden de heidenen zeggen: Waar is hun God? Laat de wraak van het vergoten bloed van Uw knechten onder de heidenen voor onze ogen bekend worden. Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn. En geef onze buren zevenvoudig terug in hun schoot hun smaad, waarmee zij U, o Heere, gesmaad hebben.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "Openb 2:13": "Ik weet uw werken, en waar u woont; namelijk daar waar de troon van de satan is, en u houdt Mijn Naam vast, en hebt Mijn geloof niet verloochend, ook in die dagen waarin Antipas, Mijn getrouwe getuige, gedood is bij u, daar waar de satan woont.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Ex 2:13": "De volgende dag ging hij er weer op uit, en zie, twee Hebreeuwse mannen waren aan het vechten; en hij zei tegen degene die ongelijk had: Waarom slaat u uw naaste?", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "Ps 72:12-14": "Want hij zal de behoeftige redden, die daar roept, alsook de ellendige, en die geen helper heeft. Hij zal de arme en behoeftige verschonen, en de zielen van de behoeftigen verlossen. Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "Hebr 4:7": "bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Num 5:27": "Als hij haar nu dat water te drinken gegeven zal hebben, zal het gebeuren, indien zij onrein geworden is, en tegen haar man door overtreding overtreden zal hebben, dat het water dat de vervloeking meebrengt tot bitterheid in haar ingaan zal, en haar buik zwellen, en haar heup vervallen zal; en die vrouw zal in het midden van haar volk tot een vloek zijn.", "Matt 26:44": "En Hij liet hen achter, ging opnieuw weg, en bad voor de derde keer, met dezelfde woorden.", "Ps 69:17": "Verhoor mij, o HEERE, want Uw goedertierenheid is goed; zie mij aan naar de grootheid van Uw barmhartigheden.", "Rom 11:27": "En dit is hun een verbond van Mij, als Ik hun zonden zal wegnemen.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Jes 11:10": "Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.", "Mark 3:22-26": "En de Schriftgeleerden die van Jeruzalem gekomen waren, zeiden: Hij heeft Beëlzebul, en door de leider van de duivels drijft Hij de duivels uit. En Hij riep hen tot Zich, en zei tegen hen in gelijkenissen: Hoe kan de satan de satan uitdrijven? En als een koninkrijk tegen zichzelf verdeeld is, kan dat koninkrijk niet standhouden.", "Spr 14:13": "Het hart zal ook bij het lachen verdriet hebben; en het einde van die blijdschap is droefheid.", "Ps 116:17-19": "Ik zal U een offer van dankzegging offeren, en de Naam van de HEERE aanroepen. Ik zal mijn gelofte de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk, in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "Ps 119:150": "Die kwade praktijken najagen, genaken mij, zij wijken ver van Uw wet.", "Ps 95:11": "Daarom heb Ik in Mijn toorn gezworen: Zij zullen in Mijn rust niet ingaan!", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Ps 25:16-19": "Pe. Wend U tot mij, en wees mij genadig, want ik ben eenzaam en ellendig. Tsade. De benauwdheden van mijn hart hebben zich wijd uitgestrekt; voer mij uit mijn noden. Resch. Zie mijn ellende, en mijn moeite, en neem al mijn zonden weg.", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "Job 19:3": "Nu al tien keer hebben jullie mij schande aangedaan; u schaamt u niet, u verhardt u tegen mij.", "Jes 12:1-6": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij. Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden. En u zult water scheppen met vreugde uit de fonteinen van het heil;", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "Matt 2:15": "en hij was daar tot de dood van Herodes; opdat vervuld zou worden wat door de Heere gesproken is door de profeet: Uit Egypte heb Ik Mijn Zoon geroepen.", "Ps 82:6": "Ik heb wel gezegd: U bent goden; en u bent allen kinderen van de Allerhoogste;", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Ps 7:8": "Zo zal de vergadering van de volken U omringen; keer dan boven haar terug in de hoogte.", "Ps 99:9": "Verhef de HEERE, onze God, en buig u voor de berg van Zijn heiligheid; want de HEERE, onze God, is heilig.", "Ps 50:23": "Wie dank offert, die zal Mij eren; en wie zijn weg goed inricht, die zal Ik Gods heil doen zien.", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Ps 41:8": "Al mijn haters mompelen samen tegen mij; ze bedenken tegen mij wat mij kwaad doet, en zeggen:", "Ps 32:3": "Toen ik zweeg, verouderden mijn beenderen, in mijn brullen de hele dag.", "Matt 26:59-62": "En de overpriesters en de oudsten en de hele Grote Raad zochten valse getuigenis tegen Jezus, opdat zij Hem konden doden; en zij vonden niets. En hoewel er veel valse getuigen gekomen waren, vonden zij toch niets. Maar tenslotte kwamen er twee valse getuigen, en zeiden: Deze heeft gezegd: Ik kan de tempel van God afbreken en in drie dagen weer opbouwen.", "Ps 34:2-4": "Aleph. Ik zal de HEERE loven te allen tijde; Zijn lof zal voortdurend in mijn mond zijn. Beth. Mijn ziel zal zich beroemen in de HEERE; de zachtmoedigen zullen het horen en zich verblijden. Gimel. Maakt de HEERE met mij groot, en laten wij Zijn Naam samen verhogen.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Ps 104:34": "Mijn overdenking van Hem zal zoet zijn; ik zal mij in de HEERE verblijden.", "Ex 10:19": "Toen keerde de HEERE een zeer sterke westenwind, die hief de sprinkhanen op, en wierp ze in de Schelfzee; er bleef niet één sprinkhaan over in heel het gebied van Egypte.", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "Ps 55:16": "Laat de dood hen overvallen als een schuldeiser, laat hen levend in het dodenrijk neerdalen; want boosheden zijn in hun woning, in hun binnenste.", "Micha 3:3": "Ja, zij zijn het, die het vlees van mijn volk eten, en hun huid afstropen, en hun beenderen verbreken; en uiteen leggen, zoals in een pot, en als vlees in het midden van een ketel.", "Jes 29:10": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.", "Ps 119:62": "Te middernacht sta ik op, om U te loven voor de rechten van Uw gerechtigheid.", "Ps 105:1-5": "Looft de HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken. Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen. Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "Ex 22:22-24": "U mag geen weduwe of wees kwaad doen. Als u hen op enige manier kwaad doet, en zij roepen dan tot Mij, zal Ik hun geroep zeker verhoren; en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.", "Gen 3:17": "En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven.", "Luk 11:50": "Opdat van dit geslacht opgeëist wordt het bloed van al de profeten, dat vergoten is vanaf de grondlegging van de wereld.", "Ps 138:4": "Alle koningen van de aarde zullen U, o HEERE! loven, wanneer zij de redenen van Uw mond gehoord zullen hebben.", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "1 Sam 19:5": "Want hij heeft zijn leven gewaagd, en hij heeft de Filistijn geslagen, en de HEERE heeft een grote overwinning aan heel Israël gegeven; u hebt het gezien, en u bent verblijd geweest; waarom zou u dan tegen onschuldig bloed zondigen, David zonder reden doden?", "Jes 55:3": "Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Job 19:22": "Waarom vervolgt u mij als God, en wordt u niet verzadigd van mijn vlees?", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "Jes 53:7-12": "Toen die geëist werd, werd Hij verdrukt; maar Hij deed Zijn mond niet open; als een lam werd Hij ter slachting geleid, en zoals een schaap stom is voor het aangezicht van zijn scheerders, zo deed Hij Zijn mond niet open. Hij is uit de angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken? Want Hij is afgesneden uit het land van de levenden; om de overtreding van Mijn volk is de plaag op Hem geweest. En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij de rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, en er geen bedrog in Zijn mond geweest is.", "Ps 94:11": "De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "Ps 2:1": "Waarom woeden de heidenen, en bedenken de volken iets zinloos?", "Spr 14:8": "De wijsheid van de kloekzinnige is zijn weg te begrijpen; maar dwaasheid van de dwazen is bedrog.", "Joh 12:15": "Vrees niet, dochter van Sion, zie, uw Koning komt, zittend op het veulen van een ezelin.", "Ps 17:2": "Laat mijn recht van voor Uw aangezicht uitgaan, laat Uw ogen aanschouwen wat recht is.", "Joh 8:44": "U bent uit uw vader de duivel, en u wilt de begeerten van uw vader doen; die was een mensenmoordenaar van het begin af aan, en is niet in de waarheid blijven staan, want er is geen waarheid in hem. Wanneer hij de leugen spreekt, spreekt hij uit wat van hemzelf is; want hij is een leugenaar, en de vader daarvan.", "Kol 2:15": "Hij heeft de overheden en de machten ontwapend en openlijk tentoongesteld, en door het kruis over hen getriomfeerd.", "Spr 26:24-26": "Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart. Wiens haat door bedrog bedekt is, diens slechtheid zal in de gemeente openbaar worden.", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Ps 113:2": "De Naam van de HEERE zij geprezen, van nu af tot in eeuwigheid.", "Neh 6:14": "Denk toch, mijn God, aan Tobia en aan Sanballat, naar deze daden van hen; en ook aan de profetes Noadja en de andere profeten, die mij bang hebben proberen te maken.", "Hand 13:48": "Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Ps 84:5": "Gelukkig zijn zij, die in Uw huis wonen; zij prijzen U gestadig. Sela.", "Pred 4:6": "Een hand vol met rust is beter dan beide de vuisten vol met moeite en najagen van de wind.", "Ps 119:124": "Doe bij Uw knecht naar Uw goedertierenheid, en leer mij Uw inzettingen.", "Ps 118:22": "De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Joh 12:27": "Nu is Mijn ziel ontroerd; en wat zal Ik zeggen? Vader, verlos Mij uit dit uur! Maar hierom ben Ik tot dit uur gekomen.", "Matt 25:45": "Dan zal Hij hun antwoorden: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze minsten niet gedaan hebt, hebt u het Mij ook niet gedaan.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Joh 11:57": "De overpriesters nu en de Farizeeën hadden een gebod gegeven dat, als iemand wist waar Hij was, hij het zou melden, opdat zij Hem konden vangen.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "Ps 71:13": "Laat hen beschaamd worden, laat hen verteerd worden, die mijn ziel tegenstaan; laat hen met smaad en schande overdekt worden, die mijn kwaad zoeken.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Joh 15:13": "Niemand heeft meer liefde dan deze, dat iemand zijn leven inzet voor zijn vrienden.", "Num 16:22": "Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden?", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "Joh 13:18-26": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven. Van nu af zeg Ik het u, voordat het gebeurd is, opdat u, wanneer het gebeurd zal zijn, kunt geloven dat Ik het ben. Voorwaar, voorwaar, Ik zeg u: Als Ik iemand zend, wie hem ontvangt, die ontvangt Mij, en wie Mij ontvangt, die ontvangt Hem Die Mij gezonden heeft.", "Joh 8:40": "Maar nu probeert u Mij te doden, een Mens, Die u de waarheid gesproken heeft, welke Ik van God gehoord heb. Dat deed Abraham niet.", "Openb 14:9-11": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Hand 2:46": "En zij bleven dagelijks eendrachtig in de tempel volharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "Ps 149:1-9": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten. Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning. Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "Jes 40:3": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God!", "Matt 8:17": "opdat vervuld zou worden wat gesproken was door de profeet Jesaja, die zei: Hij heeft onze ziekten op Zich genomen, en onze kwalen gedragen.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Hand 2:25-28": "Want David zegt van Hem: Ik zag de Heere altijd voor mij; want Hij is aan mijn rechterhand, opdat ik niet bewogen zou worden. Daarom is mijn hart verblijd, en mijn tong verheugt zich; ja, ook mijn vlees zal rusten in hoop; Want U zult mijn ziel niet verlaten in het rijk van de dood, en Uw Heilige zult U niet overgeven om verderving te zien.", "Ps 144:6": "Bliksem met bliksem, en verstrooi hen; zend Uw pijlen uit, en vernietig hen.", "1 Petr 3:10-12": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen. Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Klaagl 3:64-66": "Thau. HEERE! geef hun de vergelding terug, naar het werk van hun handen. Thau. Geef hun een verharding van het hart; Uw vloek zij over hen! Thau. Vervolg hen met toorn, en verdelg hen van onder de hemel van de HEERE.", "Hand 7:7": "En het volk dat zij zullen dienen, zal Ik oordelen, zei God; en daarna zullen zij uitgaan, en zij zullen Mij dienen op deze plaats.", "Spr 12:19": "Een waarachtige lip zal voor altijd bevestigd worden; maar een valse tong is maar voor een ogenblik.", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Num 24:9": "Hij heeft zich gekromd, hij heeft zich neergelegd, als een leeuw, en als een oude leeuw; wie zal hem doen opstaan? Wie u zegent, die zij gezegend, en vervloekt zij wie u vervloekt!", "Hos 12:1": "Die van Efraïm hebben Mij omsingeld met leugen, en het huis van Israël met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Ps 20:2": "De HEERE verhoort u in de dag van benauwdheid; de Naam van de God van Jakob zet u in een hoog vertrek.", "Ps 58:8": "Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren.", "Hand 1:16-26": "Mannen broeders, deze Schrift moest vervuld worden, die de Heilige Geest bij monde van David voorzegd heeft over Judas, die de leidsman is geweest van hen die Jezus gevangennamen; want hij werd met ons gerekend, en had het lot van deze bediening verkregen. Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "Spr 10:31": "De mond van de rechtvaardige brengt overvloedig wijsheid voort; maar de tong van de verkeerdheden zal uitgeroeid worden.", "Amos 1:11": "Zo zegt de HEERE: Om drie overtredingen van Edom, en om vier zal Ik dat niet afwenden; omdat hij zijn broeders met het zwaard heeft vervolgd, en zijn medelijden heeft verdorven; en dat zijn toorn eeuwig verscheurt, en hij zijn woede altijd blijft koesteren.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Matt 13:19": "Als iemand het woord van het koninkrijk hoort en niet begrijpt, zo komt de boze en rukt weg wat in zijn hart gezaaid was; dit is degene die bij de weg bezaaid is.", "Luk 7:27": "Deze is het, over wie geschreven is: Zie, Ik zend Mijn engel voor Uw aangezicht uit, die Uw weg voor U klaar zal maken.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "Ps 119:164": "Ik loof U zevenmaal per dag, over de rechten van Uw gerechtigheid.", "Deut 10:21": "Hij is uw lof, en Hij is uw God. Die bij u deze grote en ontzagwekkende dingen gedaan heeft, die uw ogen gezien hebben.", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Rom 9:26": "En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.", "Rom 12:12": "Verblijd u in de hoop. Wees geduldig in de verdrukking. Volhard in het gebed.", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "Mark 12:26": "Maar wat de doden betreft, dat zij opgewekt zullen worden: hebt u niet gelezen in het boek van Mozes, hoe God in de doornstruik tot hem gesproken heeft: Ik ben de God van Abraham, en de God van Izak, en de God van Jakob?", "Ps 69:2-37": "Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel. Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij. Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Hebr 1:13": "En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?", "Ps 107:17-19": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden; Hun ziel gruwde van alle voedsel, en zij waren tot aan de poorten van de dood gekomen. Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Matt 17:12": "Maar Ik zeg u dat Elia al gekomen is, en zij hebben hem niet erkend; maar zij hebben met hem gedaan wat zij wilden. Zo zal ook de Zoon des mensen door hen lijden.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Jes 26:16": "HEERE, in benauwdheid hebben zij U bezocht; zij hebben hun stil gebed uitgestort, toen Uw tuchtiging over hen was.", "Ps 22:19": "Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Ps 104:33": "Ik zal de HEERE zingen in mijn leven; ik zal mijn God psalmzingen, zolang ik nog ben.", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "2 Kon 19:21": "Dit is het woord dat de HEERE over hem gesproken heeft: De jonkvrouw, de dochter van Sion, verkleint u, zij bespot u, de dochter van Jeruzalem schudt het hoofd achter u aan.", "Ps 12:4": "De HEERE snijdt alle vleiende lippen af, en de tong die grootspreekt;", "Ps 119:108": "Laat U toch, o HEERE! welgevallen de vrijwillige offeranden van mijn mond, en leer mij Uw rechten.", "Joh 8:52": "De Joden zeiden dan tegen Hem: Nu weten wij dat U de duivel hebt. Abraham is gestorven, en de profeten ook; en U zegt: Als iemand Mijn woord bewaart, zal hij de dood in eeuwigheid niet proeven?", "Matt 16:1": "En de Farizeeën en Sadduceeën kwamen bij Hem, en om Hem te verzoeken vroegen zij Hem dat Hij hun een teken uit de hemel zou tonen.", "Ps 88:17": "Uw brandende toorn gaat over mij heen; Uw verschrikkingen doen mij vergaan.", "Ps 59:2-18": "Red mij van mijn vijanden, o mijn God! Stel mij in een hoog vertrek voor hen die tegen mij opstaan. Red mij van de werkers van de ongerechtigheid, en verlos mij van de mannen van het bloed. Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!", "Ps 119:146": "Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden.", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Ps 47:2": "Al u volken, klapt in de hand; juicht tot God met een stem van vreugdegezang.", "Luk 11:51": "Van het bloed van Abel tot het bloed van Zacharia, die omgekomen is tussen het altaar en het huis van God; ja, Ik zeg u, het zal opgeëist worden van dit geslacht!", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Ps 104:4": "Hij maakt Zijn engelen geesten, Zijn dienaars tot een vlammend vuur.", "Ezech 22:9": "Achterklappers zijn in u geweest om bloed te vergieten, en in u hebben zij op de bergen gegeten, zij hebben schandelijkheid in uw midden gedaan.", "Ps 91:11": "Want Hij zal Zijn engelen aangaande u bevelen, dat zij u bewaren op al uw wegen.", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "Spr 11:21": "Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.", "2 Kon 11:1": "Toen Athalia, de moeder van Ahazia, zag dat haar zoon dood was, maakte zij zich op en bracht al het koninklijke nageslacht om.", "Rom 10:20": "En Jesaja durft het aan, en zegt: Ik ben gevonden door hen die Mij niet zochten; Ik ben openbaar geworden aan hen die naar Mij niet vroegen.", "Luk 13:16": "En deze vrouw, die een dochter van Abraham is, die de satan, zie, al achttien jaar lang gebonden had, moest die niet losgemaakt worden van deze band, op de dag van de sabbat?", "1 Joh 2:13": "Ik schrijf u, vaders! want u hebt Hem gekend, Die er vanaf het begin is. Ik schrijf u, jongemannen, want u hebt de boze overwonnen. Ik schrijf u, kinderen, want u hebt de Vader gekend.", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "2 Sam 3:29": "Het moet blijven op het hoofd van Joab, en op heel het huis van zijn vader; en het mag van het huis van Joab niet ontbreken dat er iemand is die een vloed heeft, of melaats is, of zich aan de kruk moet vasthouden, of door het zwaard valt, of gebrek aan brood heeft!", "Hos 12:3": "Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.", "Jes 42:14": "Ik heb van oudsher gezwegen, Ik heb Mij stil gehouden en Mij ingehouden; Ik zal uitschreeuwen als een barende vrouw, Ik zal ze verwoesten en tegelijk opslokken.", "Ps 141:1-10": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep. Laat mijn gebed voor Uw aangezicht staan als reukwerk, het opheffen van mijn handen als het avondoffer. HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "Jes 40:3-5": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God! Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden. En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Ef 4:8": "Daarom zegt <span class=\"wl wl-kjv\" data-code=\"H7854\">Satan</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> at his right hand.", "7": "When he shall be <span class=\"wl wl-kjv\" data-code=\"H8199\">judged,</span> let him <span class=\"wl wl-kjv\" data-code=\"H3318\">be</span> <span class=\"wl wl-kjv\" data-code=\"H7563\">condemned:</span> and let his <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> become sin.", "8": "Let his <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> be <span class=\"wl wl-kjv\" data-code=\"H4592\">few;</span> and let <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> his office.", "9": "Let his <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> be <span class=\"wl wl-kjv\" data-code=\"H3490\">fatherless,</span> and his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> a widow.", "10": "Let his <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> be <span class=\"wl wl-kjv\" data-code=\"H5128\">continually</span> <span class=\"wl wl-kjv\" data-code=\"H5128\">vagabonds,</span> and <span class=\"wl wl-kjv\" data-code=\"H7592\">beg:</span> let them <span class=\"wl wl-kjv\" data-code=\"H1875\">seek</span> their bread also out of their desolate places.", "11": "Let the <span class=\"wl wl-kjv\" data-code=\"H5383\">extortioner</span> <span class=\"wl wl-kjv\" data-code=\"H5367\">catch</span> all that he hath; and let the <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers</span> <span class=\"wl wl-kjv\" data-code=\"H962\">spoil</span> his labour.", "12": "Let there be none to <span class=\"wl wl-kjv\" data-code=\"H4900\">extend</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> unto him: neither let there be any to <span class=\"wl wl-kjv\" data-code=\"H2603\">favour</span> his fatherless children.", "13": "Let his <span class=\"wl wl-kjv\" data-code=\"H319\">posterity</span> be cut <span class=\"wl wl-kjv  class=\"wl wl-kjv\" data-code=\"H1322\">confusion,</span> as with a mantle.", "30": "I will <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> with my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth;</span> yea, I will <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> him <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the multitude.", "31": "For he shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> at the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H34\">poor,</span> to <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> him from those that <span class=\"wl wl-kjv\" data-code=\"H8199\">condemn</span> his soul."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
