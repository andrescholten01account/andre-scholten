"Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?","2":"Denk aan Uw vergadering, die U vanouds verworven hebt; de roede van Uw erfenis, die U verlost hebt; de berg Sion, waar U gewoond hebt.","3":"Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.","4":"Uw tegenstanders hebben in het midden van Uw vergaderplaatsen gebruld; zij hebben hun eigen tekens tot tekens gesteld.","5":"Ieder werd erkend als iemand die de bijlen omhoog hanteert in het dichte geboomte.","6":"Zo hebben zij nu de graveersels daarvan samen met houwelen en beukhamers in stukken geslagen.","7":"Zij hebben Uw heiligdommen in het vuur gezet; tot op de grond hebben zij de woning van Uw Naam ontheiligd.","8":"Zij hebben in hun hart gezegd: Laat ze ons samen uitplunderen; zij hebben alle vergaderplaatsen van God in het land verbrand.","9":"Wij zien onze tekens niet; er is geen profeet meer, en er is niemand bij ons die weet hoe lang.","10":"Hoe lang, o God, zal de tegenstander smaden? Zal de vijand Uw Naam voor eeuwig lasteren?","11":"Waarom trekt U Uw hand, ja, Uw rechterhand terug? Trek haar uit het midden van Uw boezem; maak er een einde aan.","12":"Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.","13":"U hebt door Uw sterkte de zee gespleten; U hebt de koppen van de draken in het water verbroken.","14":"U hebt de koppen van de Leviathan verpletterd; U hebt hem tot voedsel gegeven aan het volk in dorre plaatsen.","15":"U hebt een bron en beek gekliefd; U hebt sterke rivieren uitgedroogd.","16":"De dag is van U, ook is de nacht van U; U hebt het licht en de zon bereid.","17":"U hebt al de grenzen van de aarde gesteld; zomer en winter, die hebt U gevormd.","18":"Denk hieraan; de vijand heeft de HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd.","19":"Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig.","20":"Zie naar het verbond; want de duistere plaatsen van het land zijn vol woningen van geweld.","21":"Laat de verdrukte niet beschaamd terugkeren; laat de ellendige en de arme Uw Naam prijzen.","22":"Sta op, o God! Voer Uw eigen rechtszaak; denk aan de smaad die U de hele dag door de dwaas aangedaan wordt.","23":"Vergeet het geroep van Uw tegenstanders niet; het rumoer van hen die tegen U opstaan, klimt voortdurend op."},"SV":{"1":"Een onderwijzing, voor Asaf. O God! waarom verstoot Gij in eeuwigheid? *Waarom* zou Uw toorn roken tegen de schapen Uwer weide?","2":"Gedenk aan Uw vergadering, *die* Gij van ouds verworven hebt; de roede Uwer erfenis, *die* Gij verlost hebt; den berg Sion, waarop Gij gewoond hebt.","3":"Hef Uw voeten op tot de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.","4":"Uw wederpartijders hebben in het midden van Uw vergaderplaatsen gebruld; zij hebben hun tekenen tot tekenen gesteld.","5":"Een ieder werd er bekend als een, die de bijlen omhoog aanbrengt in de dichtigheid van een geboomte.","6":"Alzo hebben zij nu derzelver graveerselen samen met houwelen en beukhamers in stukken geslagen.","7":"Zij hebben Uw heiligdommen in het vuur gezet; ter aarde toe hebben zij de woning Uws Naams ontheiligd.","8":"Zij hebben in hun hart gezegd: Laat ze ons te zamen uitplunderen; zij hebben alle Gods vergaderplaatsen in het land verbrand.","9":"Wij zien onze tekenen niet; er is geen profeet meer, noch iemand bij ons, die weet, hoe lang.","10":"Hoe lang, o God! zal de wederpartijder smaden? Zal de vijand Uw Naam in eeuwigheid lasteren?","11":"Waarom trekt Gij Uw hand, ja, Uw rechterhand af? *Trek* *haar* uit het midden van Uw boezem; maak een einde.","12":"Evenwel is God mijn Koning van ouds af, Die verlossingen werkt in het midden der aarde.","13":"Gij hebt door Uw sterkte de zee gespleten; Gij hebt de koppen der draken in de wateren verbroken.","14":"Gij hebt de koppen des Leviathans verpletterd; Gij hebt hem tot spijs gegeven aan het volk in dorre plaatsen.","15":"Gij hebt een fontein en beek gekliefd; Gij hebt sterke rivieren uitgedroogd.","16":"De dag is Uwe, ook is de nacht Uwe; Gij hebt het licht en de zon bereid.","17":"Gij hebt al de palen der aarde gesteld; zomer en winter, die hebt Gij geformeerd.","18":"Gedenk hieraan; de vijand heeft den HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd.","19":"Geef aan het wild gedierte de ziel Uwer tortelduif niet over; vergeet den hoop Uwer ellendigen niet in eeuwigheid.","20":"Aanschouw het verbond; want de duistere plaatsen des lands zijn vol woningen van geweld.","21":"Laat den verdrukte niet beschaamd wederkeren; laat den ellendige en nooddruftige Uw Naam prijzen.","22":"Sta op, o God! twist Uw twistzaak; gedenk der smaadheid, *die* U van den dwaze *wedervaart* den ganse dag.","23":"Vergeet niet het geroep Uwer wederpartijders; het getier dergenen, die tegen U opstaan, klimt geduriglijk op."},"KJV":{"1":"[[Maschil of Asaph.]] O God, why hast thou cast *us* off for ever? *why* doth thine anger smoke against the sheep of thy pasture?","2":"Remember thy congregation, *which* thou hast purchased of old; the rod of thine inheritance, *which* thou hast redeemed; this mount Zion, wherein thou hast dwelt.","3":"Lift up thy feet unto the perpetual desolations; *even* all *that* the enemy hath done wickedly in the sanctuary.","4":"Thine enemies roar in the midst of thy congregations; they set up their ensigns *for* signs.","5":"*A man* was famous according as he had lifted up axes upon the thick trees.","6":"But now they break down the carved work thereof at once with axes and hammers.","7":"They have cast fire into thy sanctuary, they have defiled *by casting down* the dwelling place of thy name to the ground.","8":"They said in their hearts, Let us destroy them together: they have burned up all the synagogues of God in the land.","9":"We see not our signs: *there is* no more any prophet: neither *is there* among us any that knoweth how long.","10":"O God, how long shall the adversary reproach? shall the enemy blaspheme thy name for ever?","11":"Why withdrawest thou thy hand, even thy right hand? pluck *it* out of thy bosom.","12":"For God *is* my King of old, working salvation in the midst of the earth.","13":"Thou didst divide the sea by thy strength: thou brakest the heads of the dragons in the waters.","14":"Thou brakest the heads of leviathan in pieces, *and* gavest him *to be* meat to the people inhabiting the wilderness.","15":"Thou didst cleave the fountain and the flood: thou driedst up mighty rivers.","16":"The day *is* thine, the night also *is* thine: thou hast prepared the light and the sun.","17":"Thou hast set all the borders of the earth: thou hast made summer and winter.","18":"Remember this, *that* the enemy hath reproached, O LORD, and *that* the foolish people have blasphemed thy name.","19":"O deliver not the soul of thy turtledove unto the multitude *of the wicked*: forget not the congregation of thy poor for ever.","20":"Have respect unto the covenant: for the dark places of the earth are full of the habitations of cruelty.","21":"O let not the oppressed return ashamed: let the poor and needy praise thy name.","22":"Arise, O God, plead thine own cause: remember how the foolish man reproacheth thee daily.","23":"Forget not the voice of thine enemies: the tumult of those that rise up against thee increaseth continually."}},"tsk":{"1":[{"kopje":"O God","refs":["Ps 10:1","Ps 42:10","Ps 42:12","Ps 44:10","Ps 60:3","Ps 60:12","Ps 77:8","Jer 31:37","Jer 33:24-26","Rom 11:1","Rom 11:2"]},{"kopje":"roken","refs":["Ps 79:5","Deut 29:20"]},{"kopje":"de schapen","refs":["Ps 79:13","Ps 95:7","Ps 100:3","Jer 23:1","Ezech 34:8","Ezech 34:31","Luk 12:32","Joh 10:26-30"]}],"2":[{"kopje":"verworven","refs":["Ex 15:16","Deut 9:29","Hand 20:28"]},{"kopje":"Uw","refs":["Ps 33:12","Ps 106:40","Ps 135:4","Deut 4:20","Deut 32:9","Jer 10:16"]},{"kopje":"verlost","refs":["Jes 51:11","Jes 62:12","Tit 2:14","Openb 5:9"]},{"kopje":"de berg Sion","refs":["Ps 48:2","Ps 48:3","Ps 78:68","Ps 78:69","Ps 132:13","Ps 132:14"]}],"3":[{"kopje":"Hef","refs":["Ps 44:24","Ps 44:27","Joz 10:24","2 Sam 22:39-43","Jes 10:6","Jes 25:10","Jes 63:3-6","Micha 1:3"]},{"kopje":"de eeuwige","refs":["Ps 102:14","Ps 102:15","Neh 1:3","Neh 2:3","Neh 2:13","Jes 64:10","Jes 64:11","Dan 9:17","Micha 3:12","Luk 21:24","Openb 11:2"]},{"kopje":"alles","refs":["Ps 79:1","Jer 52:13","Klaagl 1:10","Dan 8:11-14","Dan 9:27","Dan 11:31","Mark 11:17"]}],"4":[{"kopje":"Uw","refs":["2 Kron 36:17","Klaagl 2:7","Luk 13:1","Openb 13:6"]},{"kopje":"hebben hun eigen tekens tot tekens gesteld","refs":["Jer 6:1-5","Dan 6:28","Matt 24:15","Luk 21:20"]}],"7":[{"kopje":"in het vuur gezet","refs":["2 Kon 25:9","Jes 64:11","Matt 22:7"]},{"kopje":"ontheiligd","refs":["Ps 89:40","Ezech 24:21"]},{"kopje":"woning","refs":["Ex 20:24","Deut 12:5","1 Kon 8:20"]}],"8":[{"kopje":"gezegd","refs":["Ps 83:5","Ps 137:7","Est 3:8","Est 3:9"]},{"kopje":"alle vergaderplaatsen","refs":["2 Kon 2:3","2 Kon 2:5","2 Kon 4:23","2 Kron 17:9","Matt 4:23"]}],"9":[{"kopje":"Wij zien","refs":["Ex 12:13","Ex 13:9","Ex 13:10","Richt 6:17","Ezech 20: raveerde of gesneden werk van het heiligdom, [waarvan vs.3] waar de gemeente plaagt te vergaderen, op welke het woord hunne schijnt te zien. Hebr. hunne openingen. Zie van ditzelfde woord Exo 28:11 ."},{"catchword":"houwelen","tekst":"Het Hebr. woord komt van aanstoten, vallen, nedervellen, betekenende alzo een instrument, waarmede men iets afscheurt of aftrekt om neder te vellen, gelijk houwelen, haken, hellebaarden."}],"7":[{"catchword":"gezet;","tekst":"Hebr. gezonden."},{"catchword":"ter aarde","tekst":"Dat is, tot den grond toe, of zij hebben haar ontheiligd, afbrekende en slechtende die ter aarde."}],"8":[{"catchword":"uitplunderen;","tekst":"Of, onderdrukken. Van het Hebr. woord komt een ander, dat ene duif betekent, omdat zij als elks mans roof is. Anders, hunne kinderen zeggen in hun hart. Zij hebben allen, enz."},{"catchword":"vergaderplaatsen","tekst":"Dat is, alle synagogen en scholen der profeten, waar Gods woord gelezen en verklaard of geleerd werd."}],"9":[{"catchword":"tekenen","tekst":"De gewone en buitengewone tekenen van Gods genadige tegenwoordigheid en gunst."},{"catchword":"profeet","tekst":"Verg. Eze 7:26 ; dewijl nochtans de auteur van dezen psalm een man Gods en profeet geweest is, schijnt het gevoelen dergenen zo vreemd niet te zijn, die menen dat deze psalm van Asaf of enigen anderen profeet van dien naam [gelijk dergelijke profetische voorschriften elders in Gods woord gevonden worden] gemaakt is aleer deze zwarigheden Gods volk zijn overkomen en toen de openbare godsdienst nog in zwang was, gelijk afgenomen wordt uit vs.1, om Gods kerk te dienen in verscheidene volgende tijden; eensdeels in de Babylonische gevangenschap, nadat Ezechiël heeft opgehouden te profeteren; anderdeels onder de gruwelijke tirannie van Antiochus, waarvan sommigen dit bijzonderlijk verstaan; dewijl de tijd der verlossing uit de Babylonische gevangenschap door Jeremia uitdrukkelijk was geprofeteerd. Sommigen verstaan dat deze psalm [alsook dergelijk andere] ten tijde van Antiochus gemaakt is, door een man Gods of profeet; dat is, leraar, die wel door ingeven van den Heiligen Geest Gods volk geleerd en dezen psalm gedicht heeft, maar geen zulk profeet geweest is als de anderen, die bijzonderlijk alzo"},{"catchword":"profeet","tekst":"genoemd zijn, omdat zij goddelijke openbaringen van toekomende dingen gehad hebben,van welken Maleachi de laatste geweest is."},{"catchword":"hoe lang","tekst":"Dat is, hoelang deze ellenden en verwoestingen zullen duren."}],"10":[{"catchword":"in eeuwigheid","tekst":"Dat is, altoos, steeds. Zie vs.1."}],"11":[{"catchword":"rechterhand","tekst":"Met welke Gij ons zo krachtiglijk pleegt te beschutten en te verlossen; menselijk van God gesproken."},{"catchword":"boezem","tekst":"Dat is, stelt ze te werk; het tegendeel wordt gezegd van dien, wien het verdriet te werken; Pro 26:15 ."},{"catchword":"maak een","tekst":"Te weten van deze verwoestingen des vijands en onze ellenden. Anders, steek haar ten volle uit het midden uws boezems."}],"13":[{"catchword":"zee","tekst":"Versta, het Rode meer of de Schelfzee."},{"catchword":"draken","tekst":"Dat is, der trotse oversten van Farao."}],"14":[{"catchword":"koppen","tekst":"Dat is, de grote kop, die inplaats van velen is; gelijk de olifant behemoth, dat is beesten genoemd wordt; omdat het een zeer groot beest is. Job 40:10 , enz. Of, versta door de koppen Farao's oversten."},{"catchword":"leviathans","tekst":"Dat is, van het grote vreeslijke zeegedierte, of den zeedraak, waarbij Farao hier vergeleken wordt en andere grote tirannen; Isa 27:1 . Verg. ook Eze 29:3-5 , en Eze 32:2 . Zie van den Leviathan Job 40:20 , enz."},{"catchword":"aan het","tekst":"Dat is de vogelen en wilde dieren, die de dode lichamen der verdronken Egyptenaars, aan land of aan den oever gedreven zijnde [ Exo 14:30 ] hebben opgegeten. Alzo worden mieren, sprinkhanen, konijnen, enz, een volk en natie genoemd; Pro 30:25-26 ; Joe 1:6 . Anders kan men het ook alzo verstaan dat God zijn volk der Egyptenaren roof in de woestijn tot hun onderhoud gegeven heeft. Verg. Deu 31:17 , en Num 14:9 , met de aantekeningen."}],"15":[{"catchword":"gekliefd;","tekst":"Dat is, den rotssteen gekliefd, dat er een fontein en beek uit voortkwam."},{"catchword":"Sterke rivieren","tekst":"Hebr. rivieren der sterkte."},{"catchword":"rivieren","tekst":"Gelijk de wateren der Jordaan, waar de kinderen Israëls op het droge zijn doorgegaan. Hij wil zeggen: Gij brengt water voort waar het niet is, en droogt het weg waar het is."}],"16":[{"catchword":"licht","tekst":"Dat is, een lichtgevend lichaam, waardoor men hier de maan en sterren kan verstaan, om des nachts te lichten, gelijk de zon bij dag. Zie Gen 1:16 ; Psa 136:7-8 , en verg. Job 31:26 , alwaar door het licht de zon schijnt verstaan te worden, maar de maan uitdrukkelijk genoemd wordt."}],"18":[{"catchword":"de vijand","tekst":"Anders, de vijand heeft gesmaad, of gehoond, o HEERE, enz."}],"19":[{"catchword":"aan het","tekst":"Of, dezen wilden hoop. Zie van het Hebr. woord Psa 68:11 ."},{"catchword":"ziel","tekst":"Dat is, het leven uwer kerk; die zo machteloos en weerloos is om dezen wreden hoop tegen te staan, gelijk ene tortelduif is tegen het geweld van wild gedierte; behelpende zich voorts in stilte met wenen en klagen tot God, en blijvende geestelijk en inwendiglijk schoon, eenvoudig, zachtmoedig en haren God getrouw. In welk aanzien de gelijkenis van duiven dikwijls in de Heilige Schrift gebruikt wordt. Zie boven Psa 55:7 , en Psa 56:1 , en Psa 68:14 ; Son 1:15 , en Son 2:14 , en Son 4:1 , en Son 5:12 , en Son 6:9 ; Isa 38:14 , en Isa 59:11 ; Eze 7:16 ; Hos 11:11 ; Mat 10:16 ."},{"catchword":"uwer ellendigen","tekst":"Die U toebehoren en om uws naams wil lijden. Verg. Psa 69:27 , Psa 69:34 ; en Psa 72:2 ."},{"catchword":"in eeuwigheid","tekst":"Dat is, voor altoos. Gelijk boven vs.1."}],"20":[{"catchword":"verbond;","tekst":"Dat Gij met Abraham en zijn zaad gemaakt hebt, gegrond in den Messias."},{"catchword":"duistere","tekst":"Dat is, alle hoeken des lands zijn gelijk moordkuilen, waar de vijand alle geweld uit bedrijft."}],"22":[{"catchword":"twist","tekst":"Zie Psa 35:1 ."},{"catchword":"smaadheid,","tekst":"Hebr. uwer smaadheid van een dwaas."}],"23":[{"catchword":"het geroep","tekst":"Hebr. der stem."},{"catchword":"klimt","tekst":"Dat is, neemt steeds toe. Verg. 1Ki 22:35 . Of, klimt op naar den hemel tot U; gelijk Jon 1:2 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"An instruction, [See Psalm 32.on ver.1.] for Asaph. [or, of Asaph. Which may be understood of Asaph himself, or his posterity. See Psalm 50.on v.1. Some think that Asaph himself composed this Psalm by a Prophetical spirit of the times to come, to be used when these troubles should befall the people of God.] O God why dost thou reject forever? [or, utterly, altogether; see of the Hebrew word Psalm 13.on v.2.] (why) should thine angry smoak [or, thy nose? Compare 2 Sam.22.16. otherwise, smoaking anger, is the same with burning anger, according as Gods wrath is often compared with fire, which useth to send up smoak. See Psa 80:5. and Deut.29. verse 20.] against the sheep of thy pasture? [See Psa 100:3.]"}],"2":[{"catchword":null,"tekst":"Remember thy congregation, [Thy Church thy people Israel.] (which) thou hast purchased of old; the od of thine heritage, [i.e. Israel which is thine heritage, which hast measured out unto thyself with rods as it were. So Jer 10:16. compare Deut.32.on v.9. and Psalm.16.v.5.6.] which thou hast redeemed: the hill of Sion, whereupon thou hast dwelt."}],"3":[{"catchword":null,"tekst":"Lift up thy feet [Or, goings, steps, i.e. make haste, come a pace, to take a view of those long-lasting desolations, and to take order accordingly; spoken of God after the manner of men,] to the everlasting desolations: [Heb. Desolations of eternity, i.e. exceeding long and lasting.] the enemy hath wasted [or defaced Heb. Properly made evil] all in the Sanctuary."}],"4":[{"catchword":null,"tekst":"Thine adversaries have roared [Like lions] in the midst of thy gathering places: [where at set times thy people are gathered together to perform their solemn worship of God, and to hear the word of the Lord; such as were in those days the Temple and the Synagogues, whereof below, v.8.] they have set (up) their tokens for tokens: [They have replenished all with their idolatrous tokens, or warlike banners, in token of their conquest and mastery over us."}],"5":[{"catchword":null,"tekst":"Every one is made known, [Heb. Is known; Every one, namely, of the enemy.i.e. every one of them grows famous and renowned, is taken notice of, as one that did notably acquit himself of his manhood or valour. Compare Pro 31:23. and above Psa 9:17.] as one that getteth up the axes aloft, [i.e. they hewed and hacked not otherwise, then if they were cutting wood in a forest.] in the thickness of the trees [or wood, (wainscot,) for it may likewise b taken for the wrought tight wood or wainscot of the sanctuary, the meaning being all one, and then it might be rendered thus; as bringing up the axes on high, or, to the top, or, as having brought up or, plying, or laying on the axes aloft. i.e. every one was taken notice of and famous, as going to work in that manner, or, thereby that he thus did and bestirred himself; the particle as, or like, being not always taken for comparing of things, but sometimes also setting cut the very act and truth of things. See Nehem.7.on v.2. and Gen.27.on v.12.]"}],"6":[{"catchword":null,"tekst":"So have they now beaten in pieces the engravings of it: [i.e. the cut or carved work of the sanctuary, (whereof v.2.) where the congregation used to assemble, which seems to be implied by the pronoun of it; or of her Hebr. Her openings, of which word see Exo 28:11.] together with hatches, [the Hebrew word hath its denomition from hunting, falling, felling, or pulling down, signifying likewise such a tool or instrument, whereby something is torn or broken off to be pulled down; as pick axes, iron hooks, halberds] and hammers."}],"7":[{"catchword":null,"tekst":"They have set, [Heb. Sent] thy sanctuaries on fire; to the ground have they prophened the habitation of thy Name. [i.e. to the very ground, or they have prophaned it, breaking it down, and raising it to the ground.]"}],"8":[{"catchword":null,"tekst":"They have said in their heart: let us spoil them altogether: [Or oppress them. Of the Hebrew word here used, there comes another signifying a Dove, the same being every mans prey as it were. Others, their children say in their heart, etc. They have, etc.] they have burnt all Gods assembling places in the land. [that is to say, all the synagogues and schools of the Prophets where the word of God was wont to be read and taught or expounded.]"}],"9":[{"catchword":null,"tekst":"We do not see our tokens (or signs:) [Neither the ordinary nor the extraordinary signs and tokens of Gods gracious presence and favourableness.] There is no Prophet more: Compare Ezech.7.v.26. From this passage, considering that the Author of this Psalm was a Prophet and man of God himself, the opinion of some seems the less strange, which hold that this Psalm was made by Asaph, or some other Prophet of that Name, (as we find the like Prophetical form prescribed elsewhere in the word of God) before this sad condition befell Gods people, and whilest the public worship of God was in use and practise yet; as may be gathered from v.1. to serve Gods Church in sundry times thereafter, partly in the Babylonian captivity, after that Ezek. Had ceased to Prophesy: partly under the grievous Tyranny of Antiochus, which some apply this peculiarly unto; in regard the time of the deliverance out of the Babylonian captivity was expressly prophesied by Jeremy. Some doe conceive, that this Psalm (and some others of like argument) were made in that time of Antiochus, by some man of God or prophet, that is by one of their Teachers, that taught Gods people then, and made this Psalm, but was no such Prophet, as the others were in former times, peculiarly called so, for that they had divine Revelations of things to come, of whom Malachias was the last] nor any with us, that knew how long: [i.e. how long those miseries and desolations were to last.]"}],"10":[{"catchword":null,"tekst":"How long, O God, shall the adversary reproach? Shall the enemy blaspheme thy Name forever? [i.e. continually, without end or ceasing. See on v.1.]"}],"11":[{"catchword":null,"tekst":"Why dost thou with-draw thine hand, yea thy right hand? [Whereby thou wast wont so powerfully to protect and save us, spoken after the manner of men] draw (pluck it) forth out of the midst of thy bosome, [i.e. imply it, or set it a work; the contrarily is said of them, that are loath to work. Pro 26:15.] make an end, [viz.of these desolations of the enemy, and of our miseries; or consume, viz. Those our enemies. Others, put it out fully out of the midst of thy bosome."}],"12":[{"catchword":null,"tekst":"Yet God is my King of old; that worketh salvations, (or deliverances) in the midst of the earth."}],"13":[{"catchword":null,"tekst":"Thou hast cleft (or spilt) the Sea, [understand the read sea, or the Reed-sea] by thy power: Thou hast broken the heads of the Dragons in the waters. [i.e. the stout and insolent Grandees and Commanders of Pharaoh.]"}],"14":[{"catchword":null,"tekst":"Thou hast bruised the heads [i.e. that great head which is in stead of many; like as the Elephant is called Behemoth, i.e. Beasts for being a beast of that bigness. Job 40:10. etc, or by these heads we may understand Pharaohs Captains] of the Leviathan. [That is, of that terrible Sea-monster, or Sea-Dragon, unto which Pharaoh and other great Tyrants are assimilated, Isa 27:1. comp. Also Eze 29:3,4,5. And 32.2. see further of Leviathan, Job 40.v.20. etc] Thou hast given him for food to the people in dry places. [i.e. to the fowls and wild beasts, which devoured the dead carcases of the drowned Egyptians, being cast on land, or driven on the shore: (Exod. 14.30.) thus are the Pismires, Grasshoppers, Connies, Joel 1.6. Otherwise, it may likewise be understood thus, that God gave the spoil of the Egyptians to his people, for their maintenance in the wilderness; comp. Deut31.17. and Num 14:9. with the Annot.]"}],"15":[{"catchword":null,"tekst":"Thou hast clest a fountain and a brook: [i.e. thou hast cleft a Rock, that a Fountain and brook issued thence.] Thou hast dried up strong Rivers: [Heb. Rivers of strength; as the waters of the river Jordan, that the children of Israel went over dry foot. The verse implieth, That he bringeth forth waters, where there is no appearance of any, and drieth them up, where they are in abundance.]"}],"16":[{"catchword":null,"tekst":"The day is thine, the night is thine also: thou hast prepared the light and the sun: [The light, i.e. a light giving, or shining body whereby the moon and stars may be understood here to give light by night, as the sun doth by day: See Gen 1:16. Psa 136:7,8. And comp. Job 31:26. where by the light, the sun seems to be understood, but the moon is exprest by name.]"}],"17":[{"catchword":null,"tekst":"Thou hast set all the borders of the earth; summer and winter hast thou formed. (or fashioned.)"}],"18":[{"catchword":null,"tekst":"Remember this: The enemy hath reproached the LORD. [Others, the enemy hath reproached, (or, scorned) O LORD:] and a foolish people hath blasphemed thy Name."}],"19":[{"catchword":null,"tekst":"Do not give up the soul of thy Turtle Dove, [that is, the life and being of thy Church, which is so powerless and helpless to withstand this fierce multitude, as a poor silly Turtle Dove is against the violence of ravous beasts or wild fowl, shrouding herself in stillness, with weeping and moaning to God, and remaining spiritually and inwardly fair, plain, or single hearted, me and faithfull to her God. To which sence and purpose, the similitude of Doves is frequently used in the holy Scriptures. See above Psa 55:7. and 56.1. and 68.14. Cant.1.15. and 2.14. and 4.1. and 5.12. and 6.9. Isa 38:14. and 59.11. Eze 7:16. Hos 11:11. Mat 10:16.] to the wild beast: [or to this wild fry: See of the Hebrew word, Psalm.68.on verse 11.] forget not the company of thy afflicted ones [such as belong to thee, and suffer for thy Names sake: Comp. Psa 27:34. and 72.2.] forever. [i.e. continually evermore; as ab.v1.]"}],"20":[{"catchword":null,"tekst":"Look upon the Covenant: [Which thou hast made with Abraham and his seed grounded on the Messiah] for the dark places of the land are full of habitations of violence: [i.e. all the corners of the land , are like to murdering-dens, where the enemy practiseth all manner of cruelty and violence.]"}],"21":[{"catchword":null,"tekst":"Let not the oppressed return ashamed: let the afflicted and needy praise thy Name."}],"22":[{"catchword":null,"tekst":"Arise O God, debate thy cause; [See Psal.35.1.] remember-the reproach (that lighteth) on thee from the foolish all the day. [Heb. Of thy reproach of a fool.]"}],"23":[{"catchword":null,"tekst":"Forget not the cry of thine adversary: [Hebr. The voice, etc.] the noise of them that rise up against thee, ascendeth continually: [i.e. increaseth still: Compare 1 Kings 22.35. or, mounteth up to thee towards heaven: as Jon.1.2.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
