, en de nacht aan de nacht toont wetenschap.", "4": "Geen spraak, en geen woorden zijn er, waar hun stem niet wordt gehoord.", "5": "Hun richtsnoer gaat uit over de hele aarde, en hun redenen tot het einde van de wereld; Hij heeft daarin een tent gesteld voor de zon.", "6": "En die is als een bruidegom, die uitgaat uit zijn slaapkamer; zij is vrolijk als een held, om het pad te lopen.", "7": "Haar uitgang is van het einde van de hemel, en haar omloop tot aan de einden daarvan; en niets is verborgen voor haar hitte.", "8": "De wet van de HEERE is volmaakt, en zet de ziel om; de getuigenis van de HEERE is betrouwbaar, en geeft de eenvoudigen wijsheid.", "9": "De bevelen van de HEERE zijn recht, en verblijden het hart; het gebod van de HEERE is zuiver, en verlicht de ogen.", "10": "De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "11": "Zij zijn begeerlijker dan goud, ja, dan veel fijn goud; en zoeter dan honing en honingzeem.", "12": "Ook wordt Uw knecht daardoor klaar vermaand; in het houden ervan is grote loon.", "13": "Wie zou de afdwalingen verstaan? Reinig mij van de verborgen *afdwalingen*.", "14": "Houd Uw knecht ook terug van trotsheden; laat ze niet over mij heersen; dan zal ik oprecht zijn en rein van grote overtreding.", "15": "Laat de redenen van mijn mond, en de overdenking van mijn hart welgevallig zijn voor Uw aangezicht, o HEERE, mijn Rotssteen en mijn Verlosser!"}, "SV": {"1": "Een psalm van David, voor den opperzangmeester.", "2": "De hemelen vertellen Gods eer, en het uitspansel verkondigt Zijner handen werk.", "3": "De dag aan den dag stort overvloediglijk spraak uit, en de nacht aan den nacht toont wetenschap.", "4": "Geen spraak, en geen woorden zijn er, waar hun stem niet wordt gehoord.", "5": "Hun richtsnoer gaat uit over de ganse aarde, en hun redenen aan het einde der wereld; Hij heeft in dezelve een tent gesteld voor de zon.", "6": "En die is als een bruidegom, uitgaande uit zijn slaapkamer; zij is vrolijk als een held, om het pad te lopen.", "7": "Haar uitgang is van het einde des hemels, en haar omloop tot aan de einden deszelven; en niets is verborgen voor haar hitte.", "8": "De wet des HEEREN is volmaakt, bekerende de ziel; de getuigenis des HEEREN is gewis, den slechten wijsheid gevende.", "9": "De bevelen des HEEREN zijn recht, verblijdende het hart; het gebod des HEEREN is zuiver, verlichtende de ogen.", "10": "De vreze des HEEREN is rein, bestaande tot in eeuwigheid, de rechten des HEEREN zijn waarheid, samen zijn zij rechtvaardig.", "11": "Zij zijn begeerlijker dan goud, ja, dan veel fijn goud; en zoeter dan honig en honigzeem.", "12": "Ook wordt Uw knecht door dezelve klaarlijk vermaand; in het houden van die is grote loon.", "13": "Wie zou de afdwalingen verstaan? Reinig mij van de verborgene *afdwalingen*.", "14": "Houd Uw knecht ook terug van trotsheden; laat ze niet over mij heersen; dan zal ik oprecht zijn en rein van grote overtreding.", "15": "Laat de redenen mijns monds, en de overdenking mijns harten welbehagelijk zijn voor Uw aangezicht, o HEERE, mijn Rotssteen en mijn Verlosser!"}, "KJV": {"1": "[[To the chief Musician, A Psalm of David.]] The heavens declare the glory of God; and the firmament sheweth his handywork.", "2": "Day unto day uttereth speech, and night unto night sheweth knowledge.", "3": "*There is* no speech nor language, *where* their voice is not heard.", "4": "Their line is gone out through all the earth, and their words to the end of the world. In them hath he set a tabernacle for the sun,", "5": "Which *is* as a bridegroom coming out of his chamber, *and* rejoiceth as a strong man to run a race.", "6": "His going forth *is* from the end of the heaven, and his circuit unto the ends of it: and there is nothing hid from the heat", "7": "The law of the LORD *is* perfect, converting the soul: the testimony of the LORD *is* sure, making wise the simple.", "8": "The statutes of the LORD *are* right, rejoicing the heart: the commandment of the LORD *is* pure, enlightening the eyes.", "9": "The fear of the LORD *is* clean, enduring for ever: the judgments of the LORD *are* true *and* righteous altogether.", "10": "More to be desired *are they* than gold, yea, than much fine gold: sweeter also than honey and the honeycomb.", "11": "Moreover by them is thy servant warned: *and* in keeping of them *there is* great reward.", "12": "Who can understand *his* errors? cleanse thou me from secret", "13": "Keep back thy servant also from presumptuous *sins*; let them not have dominion over me: then shall I be upright, and I shall be innocent from the great transgression.", "14": "Let the words of my mouth, and the meditation of my heart, be acceptable in thy sight, O LORD, my strength, and my redeemer."}}, "tsk": {"2": [{"kopje": "De hemelen", "refs": ["Ps 8:4", "Ps 33:6", "Ps 115:16", "Ps 148:3", "Ps 148:4", "Jes 40:22-26", "Jer 10:11", "Jer 10:12", "Rom 1:19", "Rom 1:20"]}, {"kopje": "het uitspansel", "refs": ["Ps 150:1", "Ps 150:2", "Gen 1:6-8", "Gen 1:14", "Gen 1:15", "Dan 12:3"]}], "3": [{"kopje": "Dag aan", "refs": ["Ps 24:7-10", "Ps 78:3-6", "Ps 134:1-3", "Ps 148:12", "Ex 15:20", "Ex 15:21", "Jes 38:19"]}, {"kopje": "nacht aan", "refs": ["Ps 74:16", "Ps 136:8", "Ps 136:9", "Gen 1:17", "Gen 1:18", "Gen 8:22"]}], "4": [{"kopje": "Geen", "refs": ["Deut 4:19"]}], "5": [{"kopje": "Hun", "refs": ["Ps 98:3", "Jes 49:6", "Rom 10:18", "2 Kor 10:13-16"]}, {"kopje": "daarin", "refs": ["Gen 1:14-18", "Mal 4:2"]}], "6": [{"kopje": "bruidegom", "refs": ["Jes 61:10", "Jes 62:5", "Joh 3:29"]}, {"kopje": "vrolijk", "refs": ["Pred 1:5", "1 Kor 9:24-26", "Fil 3:13", "Fil 3:14", "Hebr 12:1", "Hebr 12:2"]}], "7": [{"kopje": "uitgang", "refs": ["Ps 139:9", "Job 25:3", "Pred 1:5", "Kol 1:23"]}, {"kopje": "omloop", "refs": ["Job 22:14"]}], "8": [{"kopje": "wet", "refs": ["Ps 78:1-7", "Ps 119:72", "Ps 119:96-100", "Ps 119:105", "Ps 119:127", "Ps 119:128", "Ps 147:19", "Ps 147:20" ie tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek.", "Matt 5:33": "Wederom hebt u gehoord dat tot de ouden gezegd is: U zult de eed niet breken, maar u zult aan de Heere uw eden houden.", "1 Joh 2:8": "Opnieuw schrijf ik u een nieuw gebod: wat waar is in Hem, is ook waar in u; want de duisternis gaat voorbij, en het waarachtige licht schijnt nu.", "Ps 37:40": "En de HEERE zal hen helpen, en zal hen bevrijden; Hij zal hen bevrijden van de goddelozen, en zal hen behouden; want zij vertrouwen op Hem.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Ex 8:9": "Doch Mozes zei tegen Farao: Heb de eer boven mij! Tegen wanneer zal ik voor u, en voor uw knechten, en voor uw volk, vurig bidden, om deze kikkers van u en van uw huizen te verdelgen, zodat zij alleen in de rivier overblijven?", "Deut 12:18": "Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt.", "Rom 11:10": "Dat hun ogen verduisterd worden, om niet te zien; en verkrom hun rug alle tijd.", "Fil 3:3": "Want wij zijn de besnijding, wij, die God in de Geest dienen, en in Christus Jezus roemen, en niet vertrouwen op het vlees.", "Job 12:7-16": "En werkelijk, vraag toch de dieren, en ieder van hen zal het u leren; en de vogels van de hemel, die zullen het u bekendmaken. Of spreek tot de aarde, en zij zal het u leren; ook zullen de vissen van de zee het u vertellen. Wie weet niet, uit al deze dingen, dat de hand van de HEERE dit doet?", "Luk 4:11": "En dat zij U op de handen zullen dragen, opdat U uw voet niet ooit aan een steen stoot.", "Joh 20:31": "maar deze zijn geschreven, opdat u gelooft dat Jezus de Christus is, de Zoon van God; en opdat u, door te geloven, het leven hebt in Zijn Naam.", "Hand 13:34": "En dat Hij Hem uit de doden heeft opgewekt, zodat Hij niet meer tot verderving zal terugkeren, heeft Hij zo gezegd: Ik zal u de weldaden van David geven, die betrouwbaar zijn;", "Spr 25:6": "Praal niet voor het aangezicht van de koning, en sta niet op de plaats van de groten;", "Ps 73:12-22": "Zie, dezen zijn goddeloos; toch hebben zij rust in de wereld; zij vermeerderen hun vermogen. Zeker heb ik tevergeefs mijn hart gezuiverd, en mijn handen in onschuld gewassen. Want ik ben de hele dag geplaagd, en mijn straf is er elke morgen.", "Ps 119:165": "Die Uw wet beminnen, hebben grote vrede, en zij hebben geen aanstoot.", "Ps 16:9": "Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten.", "Luk 19:46": "en zei tegen hen: Er is geschreven: Mijn huis is een huis van het gebed; maar u hebt er een rovershol van gemaakt.", "Ps 119:61": "De goddeloze hopen hebben mij beroofd; nochtans heb ik Uw wet niet vergeten.", "Neh 1:5": "En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Ps 119:105": "Nun. Uw woord is een lamp voor mijn voet, en een licht voor mijn pad.", "Ps 119:121": "Ain. Ik heb recht en gerechtigheid gedaan; geef mij niet over aan mijn onderdrukkers.", "Klaagl 3:23": "Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.", "Ps 121:3-8": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren. Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand.", "Job 33:27-29": "Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, wat mij niet heeft gebaat; Maar God heeft mijn ziel verlost, dat zij niet voert in het verderf, zodat mijn leven het licht aanziet. Zie, dit alles werkt God twee maal of driemaal met een man;", "Matt 24:30": "En dan zal in de hemel het teken van de Zoon des mensen verschijnen; en dan zullen alle geslachten van de aarde treuren, en zij zullen de Zoon des mensen zien komen op de wolken van de hemel, met grote kracht en heerlijkheid.", "Ps 78:1": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond.", "Jes 54:5": "Want uw Maker is uw Man, HEERE van de heerscharen is Zijn Naam; en de Heilige van Israël is uw Verlosser; Hij zal de God van de hele aardbodem genoemd worden.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Rom 15:10": "En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk!", "Ef 6:9": "En u heren, doe hetzelfde bij hen, en laat het dreigen achterwege; als iemand die weet dat ook uw eigen Heere in de hemelen is, en dat er geen aanneming van het persoon bij Hem is.", "Jer 33:25": "Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, als Ik de ordeningen van de hemel en de aarde niet had vastgesteld;", "Spr 25:21": "Als hij die u haat, honger heeft, geef hem brood te eten; en als hij dorstig is, geef hem water te drinken;", "Rom 7:12": "Zo is dan de wet heilig, en het gebod is heilig, en rechtvaardig, en goed.", "Rom 3:18": "Er is geen vreze van God voor hun ogen.", "Jes 14:14": "Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Deut 32:31": "Want hun rotssteen is niet gelijk onze Rotssteen, zelfs onze vijanden zijn daar rechters over.", "Hos 2:18": "En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.", "Deut 16:14": "En u zult vrolijk zijn op uw feest, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet, en de vreemdeling, en de wees, en de weduwe, die in uw poorten zijn.", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Matt 23:39": "Want Ik zeg u: U zult Mij van nu af aan niet zien, totdat u zeggen zult: Gezegend is Hij Die komt in de Naam van de Heere!", "1 Tess 5:24": "Hij, Die u roept, is getrouw, Die het ook doen zal.", "Ps 7:9": "De HEERE zal de volken recht doen; doe mij recht, HEERE, naar mijn gerechtigheid, en naar mijn oprechtheid, die bij mij is.", "Spr 15:19": "De weg van de luiaard is als een doornheg; maar het pad van de oprechten is welgebaand.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "Ps 96:7": "Geeft de HEERE, geslachten van de volken! Geeft de HEERE eer en sterkte.", "Ex 14:12": "Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Ps 119:81-83": "Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt. Mijn ogen zijn bezweken van verlangen naar Uw toezegging, terwijl ik zei: Wanneer zult U mij vertroosten? Want ik ben geworden als een lederen zak in de rook; doch Uw inzettingen heb ik niet vergeten.", "1 Tim 5:22": "Leg niemand haastig de handen op, en heb geen gemeenschap met de zonden van anderen; bewaar uzelf rein.", "Gen 26:5": "omdat Abraham Mijn stem gehoorzaam is geweest, en Mijn bevel heeft onderhouden, Mijn geboden, Mijn inzettingen en Mijn wetten.", "Rom 15:13": "De God nu van de hoop vervult u met alle blijdschap en vrede in het geloven, opdat u overvloedig mag zijn in de hoop, door de kracht van de Heilige Geest.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "Ex 15:16": "Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Matt 15:9": "Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Ex 33:22": "En het zal gebeuren, wanneer Mijn heerlijkheid voorbijgaat, dat Ik u in een kloof van de steenrots zal zetten; en Ik zal u met Mijn hand overdekken, totdat Ik voorbijgegaan zal zijn.", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Joh 12:13": "Namen zij de takken van palmbomen, en gingen Hem tegemoet, en riepen: Hosanna! Gezegend is Hij, Die komt in de Naam van de Heere, de Koning van Israël!", "Ps 85:10": "Zeker, Zijn heil is nabij hen die Hem vrezen, opdat in ons land eer woont.", "Deut 27:2": "Het zal dan gebeuren, op de dag dat u de Jordaan overgestoken bent naar het land dat de HEERE, uw God, u geven zal, dat u grote stenen zult oprichten en ze met kalk bestrijken;", "Hand 10:34": "En Petrus opende zijn mond en zei: Ik merk in waarheid dat God niet iemand aanneemt op grond van het persoon;", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Ps 118:23": "Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen.", "Pred 1:6": "Zij gaat naar het zuiden, en zij gaat om naar het noorden; de wind gaat steeds ronddraaiend, en de wind keert weer terug in zijn kringloop.", "Mark 12:31": "En het tweede, hieraan gelijk, is dit: U zult uw naaste liefhebben als uzelf. Er is geen ander gebod groter dan deze.", "Rom 3:10-18": "zoals geschreven is: Er is niemand rechtvaardig, ook niet één; er is niemand die verstandig is, er is niemand die God zoekt. Allen zijn zij afgeweken, samen zijn zij onnut geworden; er is niemand die goed doet, er is zelfs niet één.", "1 Joh 1:4": "En deze dingen schrijven wij u, opdat uw blijdschap vervuld is.", "Matt 6:9": "Bid daarom zo: Onze Vader, Die in de hemelen bent! Laat Uw Naam geheiligd worden.", "2 Sam 22:25-27": "Zo gaf de HEERE mij weer naar mijn gerechtigheid, naar mijn reinheid, voor Zijn ogen. Bij de goedertierene houdt U Zich goedertieren; bij de oprechte held houdt U Zich oprecht. Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Gen 9:6": "Wie het bloed van een mens vergiet, diens bloed zal door de mens vergoten worden; want God heeft de mens naar Zijn beeld gemaakt.", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "Jona 1:9": "En hij zei tegen hen: Ik ben een Hebreeër; en ik vrees de HEERE, de God van de hemel, Die de zee en het droge gemaakt heeft.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Jes 28:21": "Want de HEERE zal Zich opmaken, zoals op de berg Perazim, Hij zal beroerd zijn, zoals in het dal van Gibeon, om Zijn werk te doen, Zijn werk zal vreemd zijn; en om Zijn daad te doen, Zijn daad zal vreemd zijn!", "Spr 28:4": "Wie de wet verlaten, prijzen de goddelozen; maar wie de wet bewaren, gaan de strijd met hen aan.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Job 33:24": "Zo zal Hij hem genadig zijn, en zeggen: Verlos hem, dat hij in het verderf niet nederdaalt, Ik heb verzoening gevonden.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "Ps 24:8-10": "Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in de strijd. Heft uw hoofden op, poorten, ja, heft op, eeuwige deuren! opdat de Koning der ere ingaat! Wie is Hij, deze Koning der ere? De HEERE van de heerscharen, Die is de Koning der ere. Sela.", "Jes 47:13": "U bent moe geworden van de veelheid van uw raadslagen; laat nu opstaan die de hemel waarnemen, die naar de sterren kijken, die naar de nieuwe manen voorzeggen; en laat ze u verlossen van die dingen die over u komen zullen.", "Gen 2:24": "Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.", "Openb 1:2": "die het woord van God betuigd heeft, en de getuigenis van Jezus Christus, en alles wat hij gezien heeft.", "Spr 8:19": "Mijn vrucht is beter dan uitgegraven goud, en dan zuiver goud; en Mijn inkomen dan uitgelezen zilver.", "Ex 21:14": "Maar als iemand tegen zijn naaste moedwillig handelt om hem met list te doden, zult u die man van bij Mijn altaar weghalen, zodat hij moet sterven.", "Ps 2:7": "Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt.", "Ps 136:5-9": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de grote lichten heeft gemaakt; want Zijn goedertierenheid is voor eeuwig.", "Ps 8:4": "Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt;", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "Deut 4:24": "Want de HEERE, uw God, is een verterend vuur, een na-ijverig God.", "Job 5:11": "Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.", "Ps 19:9-11": "De bevelen van de HEERE zijn recht, en verblijden het hart; het gebod van de HEERE is zuiver, en verlicht de ogen. De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig. Zij zijn begeerlijker dan goud, ja, dan veel fijn goud; en zoeter dan honing en honingzeem.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Deut 17:18-20": "Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt; En het moet bij hem blijven, en hij moet daarin lezen al de dagen van zijn leven; opdat hij de HEERE, zijn God, leert vrezen, om al de woorden van deze wet en deze inzettingen te bewaren en te doen; Zodat zijn hart zich niet verheft boven zijn broeders, en hij niet afwijkt van het gebod, naar rechts of naar links; opdat hij de dagen verlengt in zijn koninkrijk, hij en zijn zonen, te midden van Israël.", "Luk 24:52": "En zij aanbaden Hem, en keerden terug naar Jeruzalem met grote blijdschap.", "Ps 119:93": "Ik zal Uw bevelen in de eeuwigheid niet vergeten, want daardoor hebt U mij levend gemaakt.", "Ps 97:2-6": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon. Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand. Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft.", "Gal 3:21": "Is de wet dan tegen de beloften van God? Dat zij verre; want als er een wet gegeven was die machtig was levend te maken, dan zou de rechtvaardigheid werkelijk uit de wet zijn.", "Ps 96:13": "Voor het aangezicht van de HEERE; want Hij komt, want Hij komt, om de aarde te oordelen; Hij zal de wereld oordelen met gerechtigheid, en de volken met Zijn waarheid.", "Ezech 3:3": "En Hij zei tot mij: Mensenkind, geef uw buik te eten, en vul uw ingewand met deze rol, die Ik u geef. Toen at ik, en het was in mijn mond als honing, vanwege de zoetheid.", "Amos 9:6": "Die Zijn bovenzalen in de hemel bouwt, en Zijn gewelf heeft Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.", "Gen 1:31": "En God zag al wat Hij gemaakt had, en zie, het was zeer goed. Toen was het avond geweest en het was morgen geweest: de zesde dag.", "Matt 4:7": "Jezus zei tegen hem: Er is ook geschreven: U zult de Heere, uw God, niet beproeven.", "Ps 119:9": "Beth. Waarmee zal de jongeling zijn pad zuiver houden? Als hij dat houdt naar Uw woord.", "Jes 40:22-26": "Hij is het, Die daar zit boven de kring van de aarde, en haar inwoners zijn als sprinkhanen; Hij is het, Die de hemel uitspant als een dunne doek, en breidt hem uit als een tent, om te bewonen; Die de vorsten teniet maakt; de rechters van de aarde maakt Hij tot ijdelheid. Ja, zij worden niet geplant, ja, zij worden niet gezaaid, ja, hun afgehouwen stam wortelt niet in de aarde; ook als Hij op hen waait, zullen zij verdorren, en een stormwind zal hen als een stoppel wegnemen.", "Jes 45:10": "Wee hem die tegen zijn vader zegt: Wat verwekt u? en tegen de vrouw: Wat baart u?", "1 Sam 2:1": "Toen bad Hanna en zei: Mijn hart springt van vreugde op in de HEERE; mijn hoorn is verhoogd in de HEERE; mijn mond is wijd opengedaan over mijn vijanden; want ik verheug mij in Uw heil.", "Ps 119:140-144": "Uw woord is zeer gelouterd, en Uw knecht heeft het lief. Ik ben klein en veracht, doch Uw bevelen vergeet ik niet. Uw gerechtigheid is gerechtigheid in eeuwigheid, en Uw wet is de waarheid.", "1 Kor 12:8": "Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest;", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Spr 28:12": "Als de rechtvaardigen opspringen van vreugde, is er grote heerlijkheid; maar als de goddelozen opkomen, wordt de mens angstvallig gezocht.", "Rom 11:36": "Want uit Hem, en door Hem, en tot Hem zijn alle dingen. Hem zij de heerlijkheid tot in eeuwigheid. Amen.", "Joh 12:46": "Ik ben een Licht, in de wereld gekomen, opdat ieder die in Mij gelooft, niet in de duisternis blijft.", "Ps 119:97": "Mem. Hoe lief heb ik Uw wet! Zij is mijn betrachting de hele dag.", "Jer 31:12-14": "Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn. Dan zal de jonkvrouw zich verblijden in de rei, en ook de jongelingen en de ouderen samen; want Ik zal hun rouw in vrolijkheid veranderen, en zal hen troosten, en zal hen verblijden na hun droefenis. En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "1 Kor 9:24-26": "Weet u niet, dat zij die in de loopbaan lopen, allen wel lopen, maar dat één de prijs ontvangt? Loop zo, dat u die mag verkrijgen. En ieder die om de prijs strijdt, onthoudt zich in alles. Zij doen dit wel, opdat zij een vergankelijke krans zouden ontvangen, maar wij een onvergankelijke. Ik loop dan zo, niet als op het onzekere; ik strijd zo, niet als iemand die de lucht slaat;", "Jes 48:13": "Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.", "Jes 44:23": "Zing met vreugde, u hemelen! Want de HEERE heeft het gedaan; juich, u onderste delen van de aarde! U bergen! Maak een groot gedreun met vreugdegezang, u bossen, en al het geboomte daarin! Want de HEERE heeft Jakob verlost, en Zich heerlijk gemaakt in Israël.", "Spr 22:12": "De ogen van de HEERE bewaren de kennis; maar de zaken van de trouweloze zal Hij omkeren.", "Jes 51:10": "Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?", "Ps 119:48": "En ik zal mijn handen opheffen naar Uw geboden, die ik liefheb, en ik zal Uw inzettingen betrachten.", "Hos 1:10": "Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.", "Ps 119:171": "Mijn lippen zullen Uw lof overvloedig uitstorten, als U mij Uw inzettingen zult geleerd hebben.", "Hebr 6:13-19": "Want toen God aan Abraham de belofte deed, zwoer Hij bij Zichzelf, omdat Hij bij niemand groter kon zweren, en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken. En zo heeft hij, nadat hij geduldig volhard had, de belofte verkregen.", "1 Petr 1:22": "Nu u uw zielen gereinigd hebt door de gehoorzaamheid aan de waarheid, door de Geest, tot ongeveinsde broederlijke liefde, heb dan elkaar vurig lief uit een rein hart;", "Jes 30:18": "En daarom zal de HEERE wachten, opdat Hij u genadig is, en daarom zal Hij verhoogd worden, opdat Hij Zich over u ontfermt, want de HEERE is een God van het gericht; gelukkig zijn zij allen die Hem verwachten.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Ps 100:1": "Een lofzang. Heel de aarde, juich voor de HEERE!", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Hab 1:5": "Ziet onder de heidenen, en aanschouwt, en verwonder u, verwonder u, want Ik werk een werk in uw dagen, dat u niet geloven zult, als het verteld wordt.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "Spr 8:26-29": "Hij had de aarde nog niet gemaakt, noch de velden, noch het begin van de stofjes van de wereld. Toen Hij de hemelen bereidde, was Ik daar; toen Hij een cirkel over het vlakke van de afgrond beschreef; Toen Hij de opperwolken van boven vestigde; toen Hij de fonteinen van de afgrond vastmaakte;", "Ps 116:10": "Ik heb geloofd, daarom sprak ik; ik ben zeer bedrukt geweest.", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "Deut 17:18": "Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt;", "Ps 43:1": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht.", "Jes 45:2": "Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "Jes 8:16": "Bind de getuigenis toe; verzegel de wet onder mijn leerlingen.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "1 Tim 2:3": "Want dat is goed en aangenaam voor God, onze Zaligmaker;", "Deut 6:13": "U zult de HEERE, uw God, vrezen, en Hem dienen; en u zult bij Zijn Naam zweren.", "Ps 36:7": "Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten.", "Hand 10:43": "Van Deze geven alle profeten getuigenis, dat ieder die in Hem gelooft, vergeving van zonden zal ontvangen door Zijn Naam.", "Gen 1:1-28": "In het begin schiep God de hemel en de aarde. De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren. En God zei: Laat er licht zijn! En er was licht.", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Ps 119:23-25": "Als zelfs de vorsten zittend tegen mij gesproken hebben, heeft Uw knecht Uw inzettingen betracht. Ook zijn Uw getuigenissen mijn vermakingen, en mijn raadslieden. Daleth. Mijn ziel kleeft aan het stof; maak mij levend naar Uw woord.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Rom 2:2": "En wij weten dat het oordeel van God naar waarheid is, over hen die zulke dingen doen.", "Openb 11:6": "Dezen hebben macht om de hemel te sluiten, zodat het geen regen regent in de dagen van hun profeteren; en zij hebben macht over de wateren, om die in bloed te veranderen, en om de aarde te slaan met allerlei plaag, zo vaak als zij willen.", "Gen 1:1": "In het begin schiep God de hemel en de aarde.", "Ps 99:4": "En de sterkte van de Koning, die het recht liefheeft. U hebt wat recht is bevestigd, U hebt recht en gerechtigheid gedaan in Jakob.", "Joz 8:32-35": "Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël. En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen. En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat.", "Joh 17:1": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt.", "1 Joh 2:21": "Ik heb u niet geschreven, omdat u de waarheid niet weet, maar omdat u die weet, en omdat geen leugen uit de waarheid is.", "Jer 51:19": "Jakobs deel is niet gelijk aan hen; want Hij is de Formeerder van alles, en Israël is de stam van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.", "Ps 62:3": "Zeker, Hij is mijn Rots en mijn Heil, mijn Hoog Vertrek, ik zal niet erg wankelen.", "1 Tim 1:8-10": "Maar wij weten dat de wet goed is, als iemand die op de juiste manier gebruikt; En als hij dit weet, dat de wet niet gemaakt is voor de rechtvaardige, maar voor de onrechtvaardigen en de weerspannigen, de goddelozen en de zondaars, de onheiligen en de ongodsdienstigen, de vadermoordenaars en de moedermoordenaars, de doodslagers, De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "Joël 2:28-32": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien; Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten. En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "Ps 119:91": "Naar Uw verordeningen blijven zij nog heden staan, want zij allen zijn Uw knechten.", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "1 Tess 4:1": "Verder dan, broeders, wij bidden en vermanen u in de Heere Jezus, zoals u van ons ontvangen hebt hoe u moet wandelen en God behagen, dat u daarin meer overvloedig wordt.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Spr 25:7": "Want het is beter dat men tegen u zegt: Kom hier bovenaan, dan dat men u vernedert voor het aangezicht van een vorst, die uw ogen gezien hebben.", "Deut 7:8": "Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "Ps 119:115": "Wijkt van mij, u boosdoeners! dat ik de geboden van mijn God moge bewaren.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Ex 25:40": "Zie er dan op toe dat u het maakt naar hun voorbeeld, dat u op de berg getoond is.", "Joh 13:32": "Als God in Hem verheerlijkt is, zal God Hem ook in Zichzelf verheerlijken, en Hij zal Hem meteen verheerlijken.", "Job 23:12": "Het gebod van Zijn lippen heb ik ook niet weggedaan; de woorden van Zijn mond heb ik meer weggelegd dan mijn bescheiden deel.", "1 Kor 2:16": "Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.", "1 Kron 22:12": "Laat de HEERE u alleen wijsheid en verstand geven, en u bevel geven over Israël, en dat om de wet van de HEERE, van uw God, te onderhouden.", "Openb 6:16": "En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "Fil 3:15": "Laten wij dan, zovelen als wij volmaakt zijn, dit gevoelen; en als u ergens anders over denkt, ook dat zal God u openbaren.", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "Spr 12:13": "In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "1 Kon 8:20": "Zo heeft de HEERE Zijn woord bevestigd, dat Hij gesproken had; want ik ben opgestaan in de plaats van mijn vader David, en ik zit op de troon van Israël, zoals de HEERE gesproken heeft; en ik heb een huis gebouwd voor de Naam van de HEERE, de God van Israël.", "Zef 3:19": "Zie, Ik zal in die tijd al uw verdrukkers verdoen; en Ik zal de hinkende behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het gehele land, waar zij beschaamd zijn geweest.", "Gen 18:25": "Het zij verre van U, zoiets te doen, de rechtvaardige te doden met de goddeloze! zodat de rechtvaardige zou zijn als de goddeloze, verre zij het van U! zou de Rechter van de hele aarde geen recht doen?", "Ps 82:8": "Sta op, o God! Oordeel het aardrijk, want U bezit alle naties.", "Matt 13:15": "Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Ps 148:4-6": "Looft Hem, hemelen der hemelen! En water, dat boven de hemelen is! Laat hen de Naam van de HEERE loven; want toen Hij het beval, werden zij geschapen. En Hij heeft ze bevestigd voor altijd, in eeuwigheid; Hij heeft hun een orde gegeven, die niemand van hen zal overtreden.", "Jes 1:27": "Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Joh 12:38": "Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard?", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Mark 11:9": "En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere!", "Deut 9:5": "Niet om uw gerechtigheid, noch om de oprechtheid van uw hart, komt u daar binnen om hun land te erven; maar om de goddeloosheid van deze volken verdrijft de HEERE, uw God, hen voor uw aangezicht uit de bezitting: en om het woord te bevestigen dat de HEERE, uw God, aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft.", "Jer 3:4": "Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!", "Deut 29:29": "De verborgen dingen zijn voor de HEERE, onze God; maar de geopenbaarde dingen zijn voor ons en voor onze kinderen, tot in eeuwigheid, om al de woorden van deze wet te doen.", "Hand 13:22": "En nadat Hij hem afgezet had, verwekte Hij hun David tot koning; aan wie Hij ook getuigenis gaf, en zei: Ik heb David gevonden, de zoon van Isaï, een man naar Mijn hart, die al Mijn wil zal doen.", "Deut 5:18": "En u zult geen overspel doen.", "2 Kor 9:9": "Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid.", "Ex 19:16": "En het gebeurde op de derde dag, toen het morgen was, dat er op de berg donder en bliksem waren, en een zware wolk, en het geluid van een zeer sterke bazuin, zodat al het volk dat in het leger was, beefde van schrik.", "2 Kor 10:13-16": "Maar wij zullen niet roemen buiten de maat; maar naar de maat van de regel, die maat die God ons toegedeeld heeft, en die ook tot u toe reikt. Want wij strekken onszelf niet te wijd uit, alsof wij u niet zouden bereiken; want wij zijn ook tot u toe gekomen, in het Evangelie van Christus; Niet roemend buiten de maat over de arbeid van andere mensen, maar hebbende de hoop dat, als uw geloof meer wordt, wij onder u overvloedig vergroot zullen worden naar onze regel;", "Ps 104:6": "U had haar met de afgrond als een kleed overdekt; de wateren stonden boven de bergen.", "Dan 8:26": "Het gezicht nu van de avond en de morgen, dat verteld is, is waar; en u, houd dit gezicht geheim, want er zijn nog veel dagen tot die tijd.", "Mark 7:6": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij.", "1 Kor 15:55": "Dood, waar is uw prikkel? Graf, waar is uw overwinning?", "Ps 25:8": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg.", "Ps 138:5": "En zij zullen zingen van de wegen van de HEERE, want de heerlijkheid van de HEERE is groot.", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Rom 6:17": "Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent;", "2 Tim 1:13": "Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.", "Ps 89:30": "En Ik zal zijn zaad in eeuwigheid vestigen, en zijn troon als de dagen van de hemelen.", "Jak 4:13-16": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken. U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt. In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Openb 7:1": "En hierna zag ik vier engelen staan op de vier hoeken van de aarde, die de vier winden van de aarde vasthielden, zodat er geen wind zou waaien op de aarde, of op de zee, of tegen enige boom.", "Job 35:10-12": "Maar niemand zegt: Waar is God, mijn Maker, Die de lofzangen geeft in de nacht? Die ons meer leert dan de dieren van de aarde, en ons wijzer maakt dan de vogels van de hemel? Daar roepen zij; maar Hij antwoordt niet, vanwege de hoogmoed van de bozen.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Job 34:17": "Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen?", "Gen 17:5": "En uw naam zal niet meer Abram genoemd worden; maar uw naam zal Abraham zijn; want Ik heb u tot een vader van een menigte volken gemaakt.", "Matt 22:32": "Ik ben de God van Abraham, en de God van Izak, en de God van Jakob! God is niet een God van de doden, maar van de levenden.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Jes 22:13": "Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven.", "Job 31:13-15": "Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij; (Want wat zou ik doen, als God opstond? En als Hij bezoeking deed, wat zou ik Hem antwoorden? Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Ps 135:14": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.", "Rom 8:36": "(Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.)", "Jer 2:20": "Toen Ik van oude tijden af uw juk verbroken, en uw banden verscheurd had, zei u: Ik zal niet dienen; maar op alle hoge heuvels en onder elke groene boom loopt u om, hoererend.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "Job 37:1-24": "Ook hierover beeft mijn hart, en springt op uit zijn plaats. Hoort met aandacht naar de beweging van Zijn stem, en het geluid dat uit Zijn mond uitgaat! Dat zendt Hij rechtuit onder de hele hemel, en Zijn licht over de einden der aarde.", "Ezech 12:2": "Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Jes 61:8": "Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.", "Hand 15:16": "Hierna zal Ik terugkeren, en de tabernakel van David, die vervallen is, weer opbouwen; en wat ervan verwoest is, zal Ik weer opbouwen, en Ik zal hem weer oprichten,", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Ps 18:8-16": "Toen daverde en beefde de aarde, en de gronden van de bergen beroerden zich en daverden, omdat Hij ontstoken was. Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daarvan aangestoken. En Hij boog de hemel, en daalde neer, en donkerheid was onder Zijn voeten.", "Ps 119:14-16": "Ik ben vrolijker in de weg van Uw getuigenissen, dan over alle rijkdom. Ik zal Uw bevelen overdenken, en op Uw paden letten. Ik zal mijzelf vermaken in Uw inzettingen; Uw woord zal ik niet vergeten.", "Ps 45:8": "U hebt gerechtigheid lief, en haat goddeloosheid; daarom heeft God, Uw God, U gezalfd met vreugdeolie, boven Uw metgezellen.", "Jes 45:22": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.", "Hand 13:32": "En wij verkondigen u de belofte, die aan de vaderen gedaan is,", "Jes 42:13": "De HEERE zal uittrekken als een held; Hij zal de ijver opwekken als een krijgsman; Hij zal juichen, ja, Hij zal een groot geschreeuw maken; Hij zal Zijn vijanden overweldigen.", "Joh 14:7": "Als u Mij gekend had, zou u ook Mijn Vader gekend hebben; en van nu af kent u Hem, en hebt Hem gezien.", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Hebr 12:1": "Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is;", "Ps 119:137": "Tsade. HEERE! U bent rechtvaardig, en elk van Uw oordelen is recht.", "Spr 30:12": "Een geslacht dat rein is in zijn eigen ogen, en toch niet gewassen is van zijn vuiligheid;", "Mark 1:2": "Zoals geschreven is in de profeten: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg voor U heen bereiden zal.", "Hab 3:4-6": "En er was een glans als van het licht, Hij had hoornen aan Zijn hand, en daar was Zijn sterkte verborgen. Voor Zijn aangezicht ging de pestilentie, en de vurige kool ging voor Zijn voeten uit. Hij stond, en mat het land, Hij zag toe, en maakte de heidenvolken los, en de aloude bergen zijn verstrooid geworden; de heuvels van eeuwigheid hebben zich gebogen; de gangen van eeuwigheid zijn van Hem.", "Ps 92:3": "Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten;", "Joël 2:31": "De zon zal veranderd worden in duisternis, en de maan in bloed, voordat die grote en vreselijke dag van de HEERE komt.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "2 Tim 2:15": "Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt.", "2 Petr 2:10": "maar vooral hen, die naar het vlees wandelen in onreine begeerte, en het gezag verachten; die vermetel zijn, zichzelf behagen, en die er niet voor terugschrikken de heerlijkheden te lasteren;", "1 Petr 1:16": "want er staat geschreven: Wees heilig, want Ik ben heilig.", "Ex 12:46": "In één huis zal het gegeten worden; u mag van het vlees niet naar buiten, het huis uit, dragen, en u mag er geen been van breken.", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Ps 89:35": "Ik zal Mijn verbond niet ontheiligen, en wat uit Mijn lippen gegaan is, zal Ik niet veranderen.", "Ezra 8:23": "Zo vastten wij en verzochten dat van onze God; en Hij liet Zich door ons verbidden.", "Ps 143:2": "En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn.", "1 Tess 4:2": "Want u weet, wat bevelen wij u gegeven hebben door de Heere Jezus.", "Ps 29:2-4": "Geef de HEERE de eer van Zijn Naam, aanbid de HEERE in de heerlijkheid van het heiligdom. De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid.", "1 Sam 9:16": "Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is.", "Ex 11:7": "Maar bij alle kinderen van Israël zal geen hond zijn tong bewegen, van de mensen af tot de beesten toe; opdat u weet dat de HEERE tussen de Egyptenaren en tussen de Israëlieten een afzondering maakt.", "1 Sam 25:32-34": "Toen zei David tegen Abigaïl: Gezegend zij de HEERE, de God van Israël, Die u vandaag mij tegemoet gezonden heeft! En gezegend zij uw raad, en gezegend bent u, dat u mij vandaag ervan weerhouden hebt te komen met bloedvergieten, en dat mijn hand mij verlost zou hebben! Want voorzeker, zo waarachtig als de HEERE, de God van Israël, leeft, Die mij ervan weerhouden heeft u kwaad te doen: als u zich niet had gehaast en mij tegemoet was gekomen, dan zou er van Nabal niemand die mannelijk is, zijn overgebleven tot het morgenlicht!", "Matt 4:15": "Het land Zebulon en het land Nafthali, aan de weg naar de zee, over de Jordaan, Galilea van de volken;", "1 Kor 2:13": "Die dingen spreken wij ook, niet met woorden die de menselijke wijsheid leert, maar met woorden die de Heilige Geest leert, terwijl wij geestelijke dingen met geestelijke vergelijken.", "Hand 7:6": "En God sprak zo, dat zijn nageslacht als vreemdeling zou wonen in een vreemd land, en dat men hen tot slaaf zou maken en slecht behandelen, vierhonderd jaar.", "Deut 31:26": "Neem dit wetboek, en leg het aan de zijde van de ark van het verbond van de HEERE, uw God, opdat het daar tot getuige zij tegen u.", "Ps 119:89": "Lamed. O HEERE! Uw woord bestaat in de eeuwigheid in de hemelen.", "Ps 92:2": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste!", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Hebr 1:10": "En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen;", "Ps 10:5": "Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg.", "Jes 40:5": "En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Hebr 10:28": "Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Jes 44:6": "Zo zegt de HEERE, de Koning van Israël, en zijn Verlosser, de HEERE van de heerscharen: Ik ben de Eerste, en Ik ben de Laatste, en behalve Mij is er geen God.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "2 Petr 3:1": "Deze tweede brief, geliefden, schrijf ik nu aan u; in beide brieven wek ik door herinnering uw oprechte gemoed op;", "Hebr 3:7-10": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn; Waar uw vaders Mij beproefden; zij hebben Mij op de proef gesteld, en hebben Mijn werken gezien, veertig jaar lang.", "Zach 12:1": "De last van het woord van de HEERE over Israël. De HEERE spreekt, Die de hemel uitbreidt, en de aarde grondvest, en de geest van de mens in zijn binnenste formeert.", "Gen 1:6-8": "En God zei: Laat er een uitspansel zijn in het midden van de wateren, en laat dat scheiding maken tussen wateren en wateren! En God maakte dat uitspansel, en maakte scheiding tussen de wateren die onder het uitspansel zijn, en de wateren die boven het uitspansel zijn. En het was zo. En God noemde het uitspansel hemel. En het was avond geweest en het was morgen geweest: de tweede dag.", "Spr 3:23": "Dan zult u uw weg zeker gaan, en u zult uw voet niet stoten.", "Hebr 1:2": "Die Hij gesteld heeft tot Erfgenaam van alles, door Wie Hij ook de wereld gemaakt heeft;", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Openb 1:3": "Zalig is hij die leest, en zij die horen de woorden van deze profetie, en die bewaren wat daarin geschreven is; want de tijd is nabij.", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Ps 115:13": "Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten.", "Ef 1:12": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "Jes 45:18": "Want zo zegt de HEERE, Die de hemelen geschapen heeft, die God, Die de aarde gevormd heeft, en Die haar gemaakt heeft; Hij heeft haar bevestigd, Hij heeft haar niet geschapen opdat zij leeg zou zijn, maar heeft haar gevormd opdat men daarin zou wonen: Ik ben de HEERE, en niemand meer.", "2 Kor 6:2": "Want Hij zegt: In de aangename tijd heb Ik u verhoord, en in de dag van de zaligheid heb Ik u geholpen. Zie, nu is het de welaangename tijd, zie, nu is het de dag van de zaligheid!", "Spr 29:13": "De arme en de bedrieger ontmoeten elkaar; de HEERE verlicht hun beider ogen.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "Jes 45:15": "Voorwaar, U bent een God, Die Zich verborgen houdt, de God van Israël, de Heiland.", "1 Petr 2:22": "Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden;", "Matt 12:7": "Maar als u geweten had wat dit betekent: Ik wil barmhartigheid en geen offerande, dan zou u de onschuldigen niet veroordeeld hebben.", "Ps 148:4": "Looft Hem, hemelen der hemelen! En water, dat boven de hemelen is!", "1 Tim 4:5": "want het wordt geheiligd door het Woord van God en door het gebed.", "Ps 19:2-7": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen. De dag aan de dag stort overvloedig spraak uit, en de nacht aan de nacht toont wetenschap. Geen spraak, en geen woorden zijn er, waar hun stem niet wordt gehoord.", "Job 32:7": "Ik zei: Laat de dagen spreken, en de veelheid van jaren wijsheid te kennen geven.", "Openb 8:10": "En de derde engel heeft op de bazuin geblazen, en er is een grote ster, brandend als een fakkel, uit de hemel gevallen, en zij is gevallen op het derde deel van de rivieren, en op de bronnen van het water.", "Ex 24:8": "Toen nam Mozes dat bloed, en sprengde het op het volk; en hij zei: Zie, dit is het bloed van het verbond, dat de HEERE met u gemaakt heeft over al die woorden.", "Ps 30:13": "Opdat mijn eer voor U psalmen zingt, en niet zwijgt. HEERE, mijn God! in eeuwigheid zal ik U loven.", "1 Kor 15:54": "En wanneer dit vergankelijke onvergankelijkheid zal hebben aangedaan, en dit sterfelijke onsterfelijkheid zal hebben aangedaan, dan zal het woord gebeuren dat geschreven is: De dood is verslonden tot overwinning.", "Jak 1:2": "Acht het voor grote vreugde, mijn broeders, wanneer u in allerlei verzoekingen valt;", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "1 Joh 5:3": "Want dit is de liefde van God, dat wij Zijn geboden bewaren; en Zijn geboden zijn niet zwaar.", "Ezech 34:22": "Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee.", "1 Tess 5:16": "Wees blij, altijd.", "Ps 89:48": "Gedenk wat voor eeuw ik ben; waarom zou Gij alle mensenkinderen tevergeefs geschapen hebben?", "2 Tim 2:9": "waarvoor ik verdrukkingen lijd tot aan boeien toe, als een misdadiger; maar het Woord van God is niet gebonden.", "Rom 3:10-12": "zoals geschreven is: Er is niemand rechtvaardig, ook niet één; er is niemand die verstandig is, er is niemand die God zoekt. Allen zijn zij afgeweken, samen zijn zij onnut geworden; er is niemand die goed doet, er is zelfs niet één.", "Hebr 5:6": "Zoals Hij ook op een andere plaats zegt: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Ex 6:3": "En ook heb Ik Mijn verbond met hen opgericht, dat Ik hun het land Kanaän geven zou, het land van hun vreemdelingschap, waarin zij vreemdelingen zijn geweest.", "Jes 29:23": "want wanneer hij zijn kinderen, het werk van Mijn handen, zal zien in zijn midden, zullen zij Mijn Naam heiligen; en zij zullen de Heilige van Jakob heiligen, en de God van Israël vrezen.", "Joh 16:14": "Hij zal Mij verheerlijken; want Hij zal het uit het Mijne nemen, en het u verkondigen.", "Hand 7:33": "En de Heere zei tegen hem: Doe de schoenen van uw voeten; want de plaats waarop u staat, is heilige grond.", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "Matt 24:29": "En meteen na de verdrukking van die dagen zal de zon verduisterd worden, en de maan zal haar licht niet geven, en de sterren zullen van de hemel vallen, en de krachten van de hemelen zullen beven.", "Matt 22:44": "De Heere heeft gezegd tot mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb.", "Openb 7:3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "Ps 72:2": "Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht.", "Matt 21:42": "Jezus zei tegen hen: Hebt u nooit gelezen in de Schriften: De steen die de bouwers verworpen hebben, die is geworden tot een hoeksteen; dit is door de Heere gedaan, en het is wonderlijk in onze ogen?", "Ef 5:26": "opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord,", "Jes 53:8": "Hij is uit de angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken? Want Hij is afgesneden uit het land van de levenden; om de overtreding van Mijn volk is de plaag op Hem geweest.", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Hand 7:41": "En zij maakten een kalf in die dagen, en brachten een offer aan de afgod, en verheugden zich in de werken van hun eigen handen.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Mark 4:20": "En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderdvoud.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "Ps 39:4": "Mijn hart werd heet in mijn binnenste, een vuur ontbrandde in mijn overdenking; toen sprak ik met mijn tong:", "Jes 53:5": "Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Ex 24:4": "Mozes nu beschreef al de woorden van de HEERE, en hij maakte zich 's morgens vroeg op, en hij bouwde een altaar onder aan de berg, en twaalf kolommen, naar de twaalf stammen van Israël.", "Ps 119:103": "Hoe zoet zijn Uw redenen voor mijn gehemelte geweest, meer dan honing voor mijn mond!", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "2 Kor 7:4": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking.", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "Joh 3:32": "En wat Hij gezien en gehoord heeft, dat getuigt Hij; en Zijn getuigenis neemt niemand aan.", "1 Tess 5:14": "En wij bidden u, broeders, vermaan de ongeregelde mensen, vertroost de kleinmoedigen, ondersteun de zwakken, wees geduldig tegenover allen.", "Ps 13:6": "Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.", "Hebr 1:7": "En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zijn dienaars tot een vlam van het vuur.", "Spr 11:8": "De rechtvaardige wordt uit benauwdheid bevrijd; en de goddeloze komt in zijn plaats.", "Spr 8:27": "Toen Hij de hemelen bereidde, was Ik daar; toen Hij een cirkel over het vlakke van de afgrond beschreef;", "1 Kor 7:12": "Maar tegen de anderen zeg ik, niet de Heere: als een broeder een ongelovige vrouw heeft, en zij ermee tevreden is bij hem te wonen, laat hij haar niet verlaten;", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Amos 5:25-27": "Hebt u Mij veertig jaar in de woestijn slachtoffers en spijsoffer gebracht, o huis van Israël? Ja, u droeg de tent van uw Melech, en de Kijun, uw beelden, de ster van uw god, die u zelf gemaakt had. Daarom zal Ik u gevankelijk wegvoeren, ver voorbij Damaskus, zegt de HEERE, Wiens Naam is God van de heerscharen.", "Gal 5:14": "Want de hele wet wordt in één woord vervuld, namelijk in dit: U zult uw naaste liefhebben als uzelf.", "Ps 119:172-174": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid. Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen. O HEERE! ik verlang naar Uw heil, en Uw wet is al mijn vermaking.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "1 Kor 3:19": "Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid;", "Jes 38:19": "De levende, de levende, die zal U loven, zoals ik heden doe; de vader zal aan de kinderen Uw waarheid bekendmaken.", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "Zach 4:7": "Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem!", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "Jer 51:5": "Want Israël of Juda zal niet in weduwschap gelaten worden door zijn God, door de HEERE van de heerscharen (hoewel hun land vol schuld is), door de Heilige van Israël.", "Ps 5:2": "O HEERE, neem mijn woorden ter oor; let op mijn overdenking.", "Num 23:23": "Want er is geen toverij tegen Jakob, en geen waarzeggerij tegen Israël. Op dit moment zal van Jakob gezegd worden, en van Israël, wat God tot stand gebracht heeft.", "Job 9:8": "Die alleen de hemelen uitbreidt, en treedt op de hoogten van de zee;", "Ps 121:7": "De HEERE zal u bewaren voor alle kwaad; uw ziel zal Hij bewaren.", "Deut 19:15": "Eén enkele getuige zal tegen niemand opstaan in verband met enige ongerechtigheid of enige zonde, van welke zonde hij ook zou hebben gezondigd; op de verklaring van twee getuigen, of op de verklaring van drie getuigen, zal de zaak vaststaan.", "1 Kor 10:7": "En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Ps 40:7-9": "Gij hebt geen lust gehad aan slachtoffer en spijsoffer; Gij hebt mij de oren doorboord; brandoffer en zondoffer hebt Gij niet geëist. Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Num 16:41": "Maar de volgende dag morde de hele vergadering van de kinderen van Israël tegen Mozes en tegen Aäron, en zei: U hebt het volk van de HEERE gedood!", "1 Kron 16:25": "Want de HEERE is groot, en zeer te prijzen, en Hij is te vrezen boven alle goden.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Jak 2:11": "Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.", "Joh 1:23": "Hij zei: Ik ben de stem van hem die roept in de woestijn: Maak de weg van de Heere recht, zoals Jesaja, de profeet, gesproken heeft.", "Ex 34:29-35": "En het gebeurde, toen Mozes van de berg Sinaï afdaalde (de twee tafelen van de getuigenis nu waren in de hand van Mozes, toen hij van de berg afdaalde), dat Mozes niet wist dat de huid van zijn aangezicht straalde, doordat Hij met hem gesproken had. Toen Aäron nu en al de kinderen van Israël Mozes aanzagen, zie, zo straalde de huid van zijn aangezicht; daarom waren zij bang om naar hem toe te gaan. Toen riep Mozes hen; en Aäron, en al de leiders in de vergadering keerden terug naar hem; en Mozes sprak tot hen.", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "Ps 89:2": "Ik zal de goedertierenheid van de HEERE eeuwig zingen; ik zal Uw waarheid met mijn mond bekend maken, van geslacht tot geslacht.", "1 Sam 12:24": "Vrees alleen de HEERE, en dien Hem trouw met uw hele hart; want zie, hoe grote dingen Hij bij u gedaan heeft!", "Joh 19:37": "En weer zegt een andere Schrift: Zij zullen zien op Hem, in Wie zij gestoken hebben.", "Joh 12:28": "Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.", "Ps 71:17": "O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen.", "Ex 24:3": "Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen.", "Joh 8:26": "Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "Ps 96:4": "Want de HEERE is groot, en zeer te prijzen; Hij is ontzagwekkend boven alle goden.", "Spr 22:21": "om u de zekerheid van de woorden van de waarheid bekend te maken, opdat u de woorden van de waarheid kunt beantwoorden aan hen die u zenden?", "Jes 43:3": "Want Ik ben de HEERE, uw God, de Heilige van Israël, uw Heiland; Ik heb Egypte, Morenland en Seba gegeven tot uw losgeld in uw plaats.", "Mark 12:29": "En Jezus antwoordde hem: Het eerste van alle geboden is: Hoor, Israël! De Heere, onze God, is een enig Heere.", "1 Petr 3:13": "En wie is het die u kwaad zal doen, als u navolgers bent van het goede?", "Gal 3:10-13": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen. En dat niemand door de wet gerechtvaardigd wordt voor God, is duidelijk; want de rechtvaardige zal uit het geloof leven. Maar de wet is niet uit het geloof; maar de mens die deze dingen doet, zal daardoor leven.", "Ps 35:9": "Zo zal mijn ziel zich verheugen in de HEERE; zij zal vrolijk zijn in Zijn heil.", "Luk 18:20": "U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Jes 28:22": "Nu dan, drijf de spot niet, opdat uw banden niet vaster gemaakt worden; want ik heb van de Heere HEERE van de heerscharen een verdelging gehoord, ja, een die vast besloten is over het hele land.", "Ps 19:8-10": "De wet van de HEERE is volmaakt, en zet de ziel om; de getuigenis van de HEERE is betrouwbaar, en geeft de eenvoudigen wijsheid. De bevelen van de HEERE zijn recht, en verblijden het hart; het gebod van de HEERE is zuiver, en verlicht de ogen. De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Hand 4:25": "Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht?", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Jer 29:10": "Want zo zegt de HEERE: Zeker, als er zeventig jaren te Babel vervuld zullen zijn, zal Ik u bezoeken, en Ik zal Mijn goede woord over u waarmaken, door u terug te brengen naar deze plaats.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Job 37:23": "De Almachtige, Hem kunnen wij niet doorgronden; Hij is groot van kracht; doch door recht en grote gerechtigheid verdrukt Hij niet.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Deut 31:19": "En nu, schrijf u dit lied, en leer het de kinderen van Israël; leg het in hun mond; opdat dit lied Mij tot getuige zij tegen de kinderen van Israël.", "Hebr 9:13": "Want als het bloed van stieren en bokken, en de as van de jonge koe, besprenkeld over de onreinen, hen heiligt tot de reinheid van het vlees,", "Spr 17:3": "De smeltkroes is voor het zilver, en de oven voor het goud; maar de HEERE toetst de harten.", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "Mark 7:9": "En Hij zei tegen hen: U doet inderdaad het gebod van God volledig teniet, opdat u uw overleveringen zou onderhouden.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Ps 104:24": "Hoe groot zijn Uw werken, o HEERE! U hebt ze allemaal met wijsheid gemaakt; het aardrijk is vol van Uw rijkdom.", "Mal 4:6": "En hij zal het hart van de vaders terugbrengen tot de kinderen, en het hart van de kinderen tot hun vaders, zodat Ik niet hoef te komen en de aarde met de ban sla.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Deut 4:6": "Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk!", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Richt 2:1": "En een Engel van de HEERE kwam op van Gilgal naar Bochim, en Hij zei: Ik heb u uit Egypte opgevoerd, en u gebracht in het land dat Ik uw vaderen gezworen heb, en gezegd: Ik zal Mijn verbond met u niet verbreken in eeuwigheid.", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "Deut 17:19": "En het moet bij hem blijven, en hij moet daarin lezen al de dagen van zijn leven; opdat hij de HEERE, zijn God, leert vrezen, om al de woorden van deze wet en deze inzettingen te bewaren en te doen;", "Ps 107:19": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Spr 8:10": "Neem Mijn tucht aan, en niet zilver, en wetensch
