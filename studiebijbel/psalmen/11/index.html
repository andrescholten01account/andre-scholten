k zeg: U bent mijn God.", "Spr 3:19": "De HEERE heeft de aarde door wijsheid gegrond, de hemelen door verstandigheid bereid.", "Ps 18:29": "Want U doet mijn lamp lichten; de HEERE, mijn God, doet mijn duisternis opklaren.", "Ps 119:57": "Cheth. De HEERE is mijn deel, ik heb gezegd, dat ik Uw woorden zal bewaren.", "Fil 1:28": "En dat u zich door niets laat verschrikken door hen die tegenstaan; wat voor hen een bewijs is van verderf, maar voor u van zaligheid, en dat van God.", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "Ps 86:2": "Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt.", "Matt 5:19-30": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen. Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan. U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Matt 7:27": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.", "Ps 108:11-14": "Wie zal mij voeren in een vaste stad? Wie zal mij leiden tot in Edom? Zult U het niet zijn, o God! Die ons verstoten had, en Die niet uittrok, o God! Met onze legers? Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Hebr 13:14": "Want wij hebben hier geen blijvende stad, maar wij zoeken de toekomstige.", "Job 20:23": "Laat er wat zijn om zijn buik te vullen; God zal over hem de hitte van Zijn toorn zenden, en het op hem laten regenen op zijn voedsel.", "Ex 32:33-35": "Toen zei de HEERE tegen Mozes: Wie tegen Mij zondigt, die zal Ik uit Mijn boek delgen. Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken! Zo trof de HEERE dit volk met een plaag, omdat zij dat kalf gemaakt hadden, dat Aäron gemaakt had.", "Ps 31:16": "Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers.", "Matt 24:36": "Maar die dag en dat uur kent niemand, ook de engelen van de hemelen niet, maar alleen Mijn Vader.", "Ps 71:14": "Doch ik zal voortdurend hopen, en zal al Uw lof nog groter maken.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "Dan 7:10": "Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.", "Ex 11:1": "(Want de HEERE had tegen Mozes gesproken: Ik zal nog één plaag over Farao en over Egypte brengen, daarna zal hij u van hier laten trekken; als hij u geheel zal laten trekken, dan zal hij u haastig van hier uitdrijven.", "Jes 63:16": "U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "Ps 3:4": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.", "Joh 11:8-10": "De discipelen zeiden tegen Hem: Rabbi! de Joden hebben U nu onlangs geprobeerd te stenigen, en gaat U weer daarheen? Jezus antwoordde: Zijn er niet twaalf uren in de dag? Als iemand overdag wandelt, stoot hij zich niet, omdat hij het licht van deze wereld ziet; maar als iemand 's nachts wandelt, stoot hij zich, omdat het licht niet in hem is.", "Zach 8:3": "Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "Gen 18:20": "Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Jer 8:12-14": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE. Ik zal hen voorzeker wegrapen, spreekt de HEERE; er zijn geen druiven aan de wijnstok, en geen vijgen aan de vijgenboom, ja, het blad is afgevallen; en de geboden die Ik hun gegeven heb, die overtreden zij. Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.", "Spr 10:6": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "1 Kor 1:9": "God is getrouw, door Wie u geroepen bent tot de gemeenschap van Zijn Zoon Jezus Christus, onze Heere.", "Ps 33:13": "De HEERE kijkt uit de hemel, en ziet alle mensenkinderen.", "2 Tim 3:3": "zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede,", "Matt 6:18": "opdat het niet door de mensen gezien wordt dat u vast, maar door uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.", "Ef 2:14": "Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft,", "Hos 13:1": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.", "Ps 91:9": "Want U, HEERE, bent mijn Toevlucht! De Allerhoogste hebt u gesteld tot uw Vertrek;", "Ps 113:5": "Wie is gelijk de HEERE, onze God? Die zeer hoog woont.", "Hand 28:22": "Maar wij willen wel van u horen wat u denkt; want wat deze sekte betreft, ons is bekend dat er overal tegen gesproken wordt.", "2 Kron 30:27": "Toen stonden de Levitische priesters op, en zegenden het volk; en hun stem werd gehoord; want hun gebed kwam tot Zijn heilige woning in de hemel.", "Klaagl 3:38": "Mem. Gaat niet uit de mond van de Allerhoogste het kwade en het goede?", "1 Joh 4:17": "Hierin is de liefde bij ons volmaakt, opdat wij vrijmoedigheid mogen hebben in de dag van het oordeel, namelijk dat wij zijn zoals Hij is, in deze wereld.", "Lev 21:8": "Daarom zult u hem heiligen, omdat hij het voedsel van uw God offert; hij zal u heilig zijn, want Ik ben heilig; Ik ben de HEERE, die u heiligt!", "Ps 108:8": "God heeft gesproken in Zijn heiligdom, daarom zal ik van vreugde opspringen; ik zal Sichem delen, en het dal van Sukkoth zal ik afmeten.", "Ps 18:26": "Bij de goedertierene houdt U Zich goedertieren, bij de oprechte man houdt U Zich oprecht.", "Pred 8:13": "Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.", "Gen 24:40": "En hij zei tegen mij: De HEERE, voor Wiens aangezicht ik gewandeld heb, zal Zijn Engel met u zenden, en Hij zal uw weg voorspoedig maken, zodat u voor mijn zoon een vrouw neemt, uit mijn geslacht en uit het huis van mijn vader.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Hebr 10:32-34": "Denk echter aan de vorige dagen, waarin u, nadat u verlicht was, veel strijd van het lijden hebt verdragen. Deels doordat u door smaad en verdrukkingen tot een schouwspel gemaakt bent; en deels doordat u deelgenoot bent geworden van hen die zo behandeld werden. Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Ef 3:17": "opdat Christus door het geloof in uw harten woont, en u in de liefde geworteld en gegrond bent;", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "1 Sam 12:25": "Maar als u toch kwaad blijft doen, zult u, evengoed als uw koning, omkomen.", "Ps 59:18": "Van U, o mijn Sterkte, zal ik psalmzingen; want God is mijn Hoog Vertrek, de God van mijn goedertierenheid.", "Joh 3:15": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Ps 7:11": "Mijn schild is bij God, Die de oprechten van hart behoudt.", "Hos 5:9": "Efraïm zal tot verwoesting worden, op de dag van de straf; onder de stammen van Israël heb Ik bekendgemaakt wat zeker is.", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Ps 76:10": "Toen God opstond ten oordeel, om alle zachtmoedigen van de aarde te verlossen. Sela.", "Matt 24:8-10": "Maar al die dingen zijn nog maar het begin van de smarten. Dan zullen zij u overleveren aan verdrukking, en zullen u doden, en u zult gehaat worden door alle volken, omwille van Mijn Naam. En dan zullen er velen ten val komen, en zullen elkaar overleveren, en elkaar haten.", "Ps 25:1": "Een psalm van David. Aleph. Tot U, o HEERE! hef ik mijn ziel op.", "Mark 13:9": "Maar let u zelf op; want zij zullen u overleveren aan de raadsvergaderingen, en aan de synagogen; u zult geslagen worden, en u zult voor stadhouders en koningen gebracht worden, omwille van Mij, hun tot een getuigenis.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "Ps 56:9": "U hebt mijn omzwerven geteld; leg mijn tranen in Uw fles; staan zij niet in Uw register?", "2 Tim 4:17": "Maar de Heere heeft mij bijgestaan en heeft mij kracht gegeven; opdat door mij de prediking ten volle bekend zou worden, en alle heidenen die zouden horen. En ik ben uit de muil van de leeuw verlost.", "Num 14:8": "Als de HEERE een welgevallen aan ons heeft, zal Hij ons in dat land brengen, en zal het ons geven; een land dat overvloeit van melk en honing.", "Ezech 9:10": "Daarom ook, wat Mij aangaat, Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal hun weg op hun hoofd geven.", "Ps 63:8": "Want U bent mij een hulp geweest; en in de schaduw van Uw vleugels zal ik vrolijk zingen.", "Ps 10:9": "Hij legt lagen in een verborgen plaats, zoals een leeuw in zijn hol; hij legt lagen om de ellendige te roven; hij rooft de ellendige als hij hem trekt in zijn net.", "Ps 71:3": "Wees mij tot een Rotssteen, om daarin te wonen, om voortdurend daarin te gaan; Gij hebt bevel gegeven, om mij te verlossen, want Gij zijt mijn Steenrots en mijn Burg.", "Pred 3:17": "Ik zei in mijn hart: God zal de rechtvaardige en de goddeloze oordelen; want daar is de tijd voor alle voornemen, en over alle werk.", "Hebr 12:2": "Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God.", "Ezech 48:35": "Rondom achttienduizend; en de naam van de stad zal van die dag af zijn: DE Heere IS DAAR.", "Ps 105:3": "Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "Matt 10:21-23": "En de ene broer zal de andere broer overleveren tot de dood, en de vader het kind, en de kinderen zullen opstaan tegen de ouders, en hen doden. En u zult door allen gehaat worden om Mijn Naam; maar wie volhardt tot het einde, die zal behouden worden. Wanneer zij u dan in deze stad vervolgen, vlucht dan naar de andere; want voorwaar, Ik zeg u: u zult uw reis door de steden van Israël niet beëindigd hebben, voordat de Zoon des mensen gekomen zal zijn.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "Ex 3:3": "En Mozes zei: Ik zal mij nu daarheen wenden, en dat grote gezicht bezien, waarom het braambos niet verbrandt.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Ps 121:4": "Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen.", "Ps 119:155": "Het heil is ver van de goddelozen, want zij zoeken Uw inzettingen niet.", "Luk 21:12-19": "Maar voor dit alles zullen zij hun handen aan u slaan, en u vervolgen, en u overleveren aan de synagogen en gevangenissen; en u zult voor koningen en stadhouders gebracht worden, omwille van Mijn Naam. En dit zal u overkomen tot een getuigenis. Neem dan in uw harten voor, om van tevoren niet te overdenken hoe u zich verantwoorden zult;", "Gen 18:28": "Misschien zullen aan de vijftig rechtvaardigen vijf ontbreken; zult U dan om vijf de hele stad verwoesten? En Hij zei: Ik zal haar niet verwoesten, als Ik er vijfenveertig zal vinden.", "Ps 55:18": "'s Avonds, en 's morgens, en 's middags zal ik klagen en getier maken; en Hij zal mijn stem horen.", "2 Kon 19:13-18": "Waar is de koning van Hamath, en de koning van Arpad, en de koning van de stad Sefarvaim, Hena en Ivva? Toen Hizkia de brieven uit de hand van de boden ontvangen had en die gelezen had, ging hij op naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE. En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Ps 37:17-22": "Want de armen van de goddelozen zullen verbroken worden; maar de HEERE ondersteunt de rechtvaardigen. Jod. De HEERE kent de dagen van de oprechten; en hun erfenis zal in eeuwigheid blijven. Zij zullen niet beschaamd worden in de kwade tijd, en in de dagen van het honger zullen zij verzadigd worden.", "Job 18:5-21": "Ja, het licht van de goddelozen zal uitgeblust worden, en de vonk van zijn vuur zal niet glinsteren. Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden. De stappen van zijn kracht zullen beperkt worden, en zijn eigen plan zal hem neerwerpen.", "Matt 18:35": "Zo zal ook Mijn hemelse Vader met u doen, als u niet ieder van harte uw broeder zijn misdaden vergeeft.", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Openb 7:13-17": "En een van de oudsten antwoordde en zei tegen mij: Wie zijn deze mensen die bekleed zijn met de lange witte kleren, en waar zijn zij vandaan gekomen? En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam. Daarom zijn zij voor de troon van God, en dienen Hem dag en nacht in Zijn tempel; en Die op de troon zit, zal hen overschaduwen.", "Klaagl 1:18": "Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond opstandig geweest; hoort toch, alle volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenschap gegaan.", "Ps 9:9": "En Hij Zelf zal de wereld richten in gerechtigheid, en de volken oordelen in rechtmatigheden.", "1 Sam 21:10-12": "En David stond op, en vluchtte diezelfde dag van het aangezicht van Saul weg; en hij kwam bij Achis, de koning van Gath. Doch de knechten van Achis zeiden tegen hem: Is dit niet David, de koning van het land? Zong men niet van hem in de reidansen, en zei: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden? En David nam deze woorden ter harte; en hij was zeer bevreesd voor het aangezicht van Achis, de koning van Gath.", "Ex 15:11": "O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet?", "Spr 13:17": "Een goddeloze bode zal in het kwaad vallen; maar een trouwe gezant is medicijn.", "Jes 24:17": "De angst, en de kuil, en de strik over u, o inwoners van het land!", "Openb 6:9-11": "En toen Het het vijfde zegel geopend had, zag ik onder het altaar de zielen van hen die gedood waren om het Woord van God, en om het getuigenis, dat zij hadden. En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen? En aan ieder werden lange witte klederen gegeven, en hun werd gezegd, dat zij nog een kleine tijd rusten zouden, totdat ook hun mededienstknechten en hun broeders zouden vervuld zijn, die gedood zouden worden, zoals ook zij.", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "Pred 8:12": "Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen.", "Matt 25:30": "En werp de nutteloze dienstknecht buiten, in de uiterste duisternis; daar zal geween zijn en het geknars van de tanden.", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Luk 19:26": "Want ik zeg u dat ieder die heeft, gegeven zal worden; maar van hem die niet heeft, zal ook wat hij heeft afgenomen worden.", "Ps 145:17": "Tsade. De HEERE is rechtvaardig in al Zijn wegen, en goedertieren in al Zijn werken.", "Ps 48:15": "Want deze God is onze God eeuwig en altoos; Hij zal ons geleiden tot de dood toe.", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Jes 45:4": "Om Jakobs, Mijn knechts wil, en Israëls, Mijn uitverkorenen; ja, Ik riep u bij uw naam, Ik noemde u toe, hoewel u Mij niet kende.", "Matt 12:50": "Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder.", "Jes 64:8": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen.", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Joël 2:27": "En u zult weten, dat Ik in het midden van Israël ben, en dat Ik de HEERE, uw God, ben, en niemand anders meer; en Mijn volk zal niet beschaamd worden in eeuwigheid.", "Ps 75:4": "Het land en al zijn inwoners waren versmolten; maar ik heb zijn pilaren vastgemaakt. Sela.", "Joz 14:12": "En nu, geef mij dit gebergte, waarvan de HEERE op die dag gesproken heeft; want u hebt op diezelfde dag gehoord dat de Enakieten daar waren, en dat er grote versterkte steden waren; misschien is de HEERE met mij, zodat ik hen verdrijf, zoals de HEERE gesproken heeft.", "Ps 38:3": "Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald.", "Jes 51:17": "Word wakker, word wakker, sta op, Jeruzalem! U die gedronken hebt uit de hand van de HEERE de beker van Zijn grimmigheid; de droesem van de beker van de zwijmeling hebt u gedronken, ja, uitgezogen.", "Jes 42:9": "Zie, de vroegere dingen zijn gekomen, en nieuwe dingen verkondig Ik; voordat ze uitspruiten, doe Ik u die horen.", "Micha 2:3": "Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "Ps 119:118": "U vertreedt allen, die van Uw inzettingen afdwalen, want hun bedrog is leugen.", "Job 36:19": "Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht?", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Job 21:7-33": "Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen? Hun nakomelingen zijn bestendig bij hen voor hun ogen, en hun spruiten voor hun aangezicht. Hun huizen hebben vrede zonder vrees, en de roede van God is niet op hen.", "Job 16:19": "Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.", "Jer 49:12": "Want zo zegt de HEERE: Zie, van hen wier oordeel het niet is de beker te drinken, zullen er helemaal drinken; en zou u dan enigszins ongestraft blijven? U zult niet ongestraft blijven, maar u zult helemaal drinken.", "Klaagl 3:50": "Ain. Totdat de HEERE van de hemel neerkijkt, en het ziet.", "Jer 20:12": "Gij dan, o HEERE van de heerscharen, Die de rechtvaardige beproeft, Die de nieren en het hart ziet, laat mij Uw wraak op hen zien, want ik heb U mijn rechtszaak voorgelegd.", "Matt 10:32": "Ieder dan die Mij belijden zal voor de mensen, die zal Ik ook belijden voor Mijn Vader, Die in de hemelen is.", "Jes 26:1": "Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Ps 66:9": "Die onze zielen in het leven houdt, en niet toelaat dat onze voet wankelt.", "Ps 26:12": "Mijn voet staat op effen grond; ik zal de HEERE loven in de samenkomsten.", "Ps 92:8": "Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.", "1 Sam 24:16": "Doch de HEERE zal Rechter zijn, en rechtspreken tussen mij en tussen u, en zien daarin, en mijn geschil beslechten, en mij redden uit uw hand.", "Ps 16:2": "O mijn ziel, u hebt tegen de HEERE gezegd: U bent de Heere, mijn goedheid raakt niet tot U;", "1 Kon 8:30": "Hoor dan naar de smeking van Uw dienaar, en van Uw volk Israël, die op deze plaats zullen bidden; en hoor Ú in de plaats van Uw woning, in de hemel, ja, hoor, en vergeef.", "1 Kor 3:21-23": "Niemand roemt dan op mensen; want alles is van u. Hetzij Paulus, hetzij Apollos, hetzij Cefas, hetzij de wereld, hetzij leven, hetzij dood, hetzij tegenwoordige, hetzij toekomende dingen, ze zijn allemaal van u. Doch u bent van Christus, en Christus is van God.", "Ps 37:37": "Schin. Let op de vrome, en zie naar de oprechte; want het einde van die man zal vrede zijn.", "Spr 12:21": "De rechtvaardigen zal geen leed overkomen; maar de goddelozen zullen met kwaad vervuld worden.", "Job 2:4": "Toen antwoordde de satan de HEERE en zei: Huid voor huid, en alles wat iemand heeft, zal hij geven voor zijn leven.", "1 Kron 10:14": "en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.", "1 Kron 16:33": "Dan zullen de bomen van het woud juichen voor het aangezicht van de HEERE, omdat Hij komt om de aarde te richten.", "Ef 2:13": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus.", "Jes 24:18": "En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.", "1 Sam 3:3": "en Samuël zich ook had neergelegd, voordat de lamp van God uitgedaan werd, in de tempel van de HEERE, waar de ark van God was,", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Ezech 5:4": "En nog zult u daarvan nemen, en dat werpen in het midden van het vuur, en zult ze verbranden met vuur; daaruit zal een vuur voortkomen tegen het hele huis van Israël.", "Jes 59:15": "Ja, de waarheid ontbreekt, en wie van het boze wijkt, wordt tot een prooi; en de HEERE zag het, en het was kwaad in Zijn ogen, dat er geen recht was.", "Hand 15:18": "Aan God zijn al Zijn werken van eeuwigheid af bekend.", "Jer 51:10": "De HEERE heeft onze gerechtigheden hervoor gebracht; kom en laat ons in Sion het werk van de HEERE, onze God, vertellen!", "Job 28:24": "Want Hij schouwt tot aan de einden der aarde, Hij ziet onder al de hemelen.", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "Ps 94:14": "Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.", "Luk 17:29": "maar op de dag waarop Lot uit Sodom wegging, regende het vuur en zwavel uit de hemel, en dat verdierf hen allen.", "Jer 10:7": "Wie zou U niet vrezen, Koning van de heidenen? Want het komt U toe; omdat toch onder alle wijzen van de heidenen, en in hun hele koninkrijk, niemand U gelijk is.", "Jes 25:9": "En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.", "Ex 5:24": "Toen zei de HEERE tegen Mozes: Nu zult u zien, wat Ik met Farao doen zal; want door een sterke hand zal hij hen laten trekken, ja, door een sterke hand zal hij hen uit zijn land verdrijven.", "Job 23:7": "Daar zou de oprechte met Hem pleiten; en ik zou mij voor eeuwig van mijn Rechter vrijmaken.", "Hos 9:9": "Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.", "2 Kor 5:7": "(Want wij wandelen door geloof en niet door aanschouwen.)", "Ps 1:1-6": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters; Maar zijn vreugde is in de wet van de HEERE, en hij overdenkt Zijn wet dag en nacht. Want hij zal zijn als een boom, geplant aan waterbeken, die zijn vrucht geeft op zijn tijd, en waarvan het blad niet afvalt; en alles wat hij doet, zal goed gelukken.", "Ps 17:3": "U hebt mijn hart geproefd, 's nachts bezocht, U hebt mij getoetst. U vindt niets; wat ik gedacht heb, overtreedt mijn mond niet.", "Ps 73:11": "Zodat zij zeggen: Hoe zou God het weten, en zou er kennis zijn bij de Allerhoogste?", "Hand 4:5-12": "En het gebeurde de volgende dag, dat hun leiders en oudsten en schriftgeleerden in Jeruzalem bijeenkwamen; En Annas, de hogepriester, en Kajafas, en Johannes, en Alexander, en allen die van het hogepriesterlijk geslacht waren. En toen zij hen in het midden hadden laten staan, vroegen zij: Door welke kracht, of door welke naam hebt u dit gedaan?", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Ezech 18:25": "Nog zegt u: De weg van de Heere is niet recht; hoor nu, o huis van Israël! Is Mijn weg niet recht? Zijn niet uw wegen onrecht?", "1 Kron 21:26": "Toen bouwde David daar voor de HEERE een altaar, en hij offerde brandoffers en dankoffers. Toen hij de HEERE aanriep, antwoordde Hij hem door vuur uit de hemel, op het brandofferaltaar.", "2 Kron 32:7": "Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.", "Dan 7:9": "Dit zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Ps 89:18": "Want Gij zijt de heerlijkheid van hun sterkte; en door Uw welbehagen zal onze hoorn verhoogd worden.", "Num 14:14": "en zij zullen het zeggen tegen de inwoners van dit land, die gehoord hebben dat U, HEERE, in het midden van dit volk bent; dat U, HEERE, oog in oog gezien wordt, dat Uw wolk over hen staat, en U voor hun aangezicht gaat in een wolkkolom overdag, en in een vuurkolom 's nachts.", "Jes 12:6": "Juich en zing vrolijk, u inwoners van Sion! Want de Heilige van Israël is groot in uw midden.", "Job 15:28-30": "En heeft verdelgde steden bewoond, en huizen die men niet bewoonde, die gereed waren om een puinhoop te worden. Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde. Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas van zijn mond.", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Amos 5:10": "Zij haten in de poort hem die bestraft, en verafschuwen hem die oprecht spreekt.", "Spr 3:33": "De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Hos 7:12": "Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.", "Mark 16:19": "De Heere dan, nadat Hij tot hen gesproken had, is opgenomen in de hemel, en zit aan de rechterhand van God.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Spr 28:1": "De goddelozen vluchten, terwijl geen vervolger er is; maar elke rechtvaardige is moedig, als een jonge leeuw.", "Ezech 14:23": "Zo zullen zij u vertroosten, wanneer u hun weg en hun handelingen zult zien; en u zult weten dat Ik niet zonder reden heb gedaan al wat Ik in haar gedaan heb, spreekt de Heere HEERE.", "Openb 21:3": "En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn.", "Ps 9:8": "Maar de HEERE zal in eeuwigheid zitten; Hij heeft Zijn troon bereid ten gerichte.", "Job 22:27": "U zult ernstig tot Hem bidden, en Hij zal u verhoren; en u zult uw geloften betalen.", "Ps 71:5-7": "Want Gij zijt mijn Verwachting, Heere HEERE! mijn Vertrouwen van mijn jeugd af aan. Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U. Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.", "Dan 5:23": "Maar u hebt uzelf verheven tegen de Heere van de hemel, en men heeft de vaten van Zijn huis voor u gebracht, en u, en uw leiders, uw vrouwen, en uw bijvrouwen hebben daaruit wijn gedronken, en de goden van zilver en goud, koper, ijzer, hout en steen, die niet zien, niet horen, en niet weten, hebt u geprezen; maar die God, in Wiens hand uw adem is, en aan Wie al uw wegen toebehoren, hebt u niet verheerlijkt.", "Joël 3:16": "En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.", "Ps 34:17": "Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Ps 16:8": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen.", "Spr 10:23-25": "Het is voor de dwaas als een spel om iets schandelijks te doen; maar voor een man van verstand, om wijsheid te plegen. Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven. Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Openb 21:22-27": "En ik zag geen tempel daarin; want de Heere, de almachtige God, is haar tempel, en het Lam. En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp. En de volken die zalig worden, zullen in haar licht wandelen; en de koningen van de aarde brengen hun heerlijkheid en eer in haar.", "Ps 94:23": "En Hij zal hun ongerechtigheid op hen doen terugkeren, en Hij zal hen in hun boosheid verdelgen; de HEERE, onze God, zal hen verdelgen.", "Hand 1:24": "En zij baden en zeiden: U, Heere! U, Kenner van de harten van allen, wijs van deze twee er één aan, die U uitverkoren hebt,", "Dan 9:7": "Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Ps 102:20": "Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben;", "Rom 2:7-9": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven; Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden; Verdrukking en benauwdheid over elke ziel van de mens die het kwade doet, eerst van de Jood, en ook van de Griek;", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "Ps 79:1": "Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt.", "Hebr 13:13": "Laten wij dan naar Hem uitgaan, buiten de legerplaats, terwijl wij Zijn smaad dragen.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "2 Kron 6:39": "Hoor dan uit de hemel, uit de vaste plaats van Uw woning, hun gebed en hun smekingen, en voer hun recht uit, en vergeef Uw volk wat zij tegen U gezondigd zullen hebben.", "Ps 31:4-7": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam. Doe mij uitgaan uit het net, dat zij voor mij verborgen hebben, want U bent mijn Sterkte. In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Openb 14:3": "en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren.", "Hos 10:10": "Het is Mijn wens, dat Ik hen zal tuchtigen; en volken zullen tegen hen verzameld worden, wanneer Ik hen bind in hun twee voren.", "Hab 2:20": "Maar de HEERE is in Zijn heilige tempel. Zwijg voor Zijn aangezicht, heel de aarde!", "Luk 16:22-28": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Rom 6:16": "Weet u niet dat aan wie u uzelf ter beschikking stelt als dienstknechten tot gehoorzaamheid, u dienstknechten bent van hem die u gehoorzaamt, óf van de zonde tot de dood, óf van de gehoorzaamheid tot gerechtigheid?", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "1 Sam 9:23": "Toen zei Samuel tegen de kok: Breng dat stuk, dat ik u gegeven heb, waarvan ik tegen u zei: Zet het bij u weg.", "Ezech 39:29": "En Ik zal Mijn aangezicht niet meer voor hen verbergen, wanneer Ik Mijn Geest over het huis van Israël zal hebben uitgegoten, spreekt de Heere HEERE.", "1 Sam 17:37": "Verder zei David: De HEERE, Die mij gered heeft uit de klauw van de leeuw en uit de klauw van de beer, Die zal mij redden uit de hand van deze Filistijn. Toen zei Saul tegen David: Ga heen, en de HEERE zij met u!", "Ps 71:16": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Hos 13:3": "Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.", "Ps 44:6": "Door U zullen wij onze tegenstanders met hoorns stoten; in Uw Naam zullen wij vertrappen die tegen ons opstaan.", "Spr 15:11": "Het dodenrijk en het verderf liggen open voor de HEERE; hoeveel te meer de harten van de mensenkinderen?", "Job 12:4": "Ik ben degene die zijn vriend een spot is, maar die tot God roept, Die hem verhoort; de rechtvaardige en oprechte is een spot.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Ps 36:13": "Daar zijn de werkers van de ongerechtigheid gevallen; zij zijn neergestoten, en kunnen niet weer opstaan.", "Ps 42:4": "Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?", "Rom 8:35-37": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Job 36:17": "Maar u hebt het oordeel van de goddeloze vervuld; het oordeel en het recht houden u vast.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Ps 73:10": "Daarom keert Zijn volk zich hierheen, als hun water uit een volle beker wordt uitgedrukt,", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "1 Joh 3:13": "Verwonder u niet, mijn broeders, als de wereld u haat.", "Richt 11:27": "Ik heb ook niet tegen u gezondigd, maar u doet mij onrecht aan door tegen mij te strijden. De HEERE, Die Rechter is, oordele vandaag tussen de kinderen van Israël en de kinderen van Ammon!", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "Fil 1:29": "Want u is uit genade gegeven in de zaak van Christus, niet alleen om in Hem te geloven, maar ook om voor Hem te lijden;", "Jer 23:24": "Zou iemand zich in verborgen plaatsen kunnen verbergen, zodat Ik hem niet zou zien? spreekt de HEERE; vervul Ik niet de hemel en de aarde? spreekt de HEERE.", "Hand 4:24-33": "En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn. Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht? De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde.", "1 Tess 5:5-8": "U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis. Laten wij dan niet slapen, zoals de anderen, maar laten wij waken en nuchter zijn. Want wie slapen, slapen 's nachts, en wie dronken zijn, zijn 's nachts dronken;", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Job 4:17": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker?", "2 Kron 32:8": "Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.", "Spr 12:2": "De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.", "Ps 119:166": "O HEERE! ik hoop op Uw heil, en doe Uw geboden.", "Hebr 11:4": "Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Rom 8:13": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Jes 37:28": "Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woede tegen Mij.", "Luk 12:4": "En Ik zeg u, Mijn vrienden: wees niet bang voor hen die het lichaam doden, en daarna niets meer kunnen doen.", "Ps 43:5": "Wat buigt u zich neer, o mijn ziel! En wat bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de rijke Verlossing van mijn aangezicht, en mijn God.", "Matt 12:34": "Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond.", "Hos 2:8-12": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken. En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden. En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "1 Kor 15:22": "Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.", "Ex 3:20": "Want Ik zal Mijn hand uitstrekken, en Egypte slaan met al Mijn wonderen die Ik in het midden ervan doen zal; daarna zal hij u laten vertrekken.", "1 Joh 3:3-17": "En ieder die deze hoop op Hem heeft, reinigt zichzelf, zoals Hij rein is. Ieder die de zonde doet, doet ook de ongerechtigheid; want de zonde is de ongerechtigheid. En u weet dat Hij geopenbaard is, opdat Hij onze zonden zou wegnemen; en geen zonde is in Hem.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Ps 138:7": "Als ik wandel in het midden van de benauwdheid, maakt Gij mij levend; Uw hand strekt Gij uit tegen de toorn van mijn vijanden, en Uw rechterhand behoudt mij.", "2 Kron 6:18": "Maar zou God werkelijk bij de mensen op de aarde wonen? Zie, de hemelen, ja, de hemel der hemelen, zouden U niet kunnen bevatten, hoeveel te minder dit huis, dat ik gebouwd heb?", "Zach 2:13": "Zwijg, alle vlees, voor het aangezicht van de HEERE! want Hij is ontwaakt uit Zijn heilige woning.", "Num 14:27": "Hoelang zal Ik het bij deze slechte vergadering uithouden, die tegen Mij morren? Ik heb het gemor van de kinderen van Israël gehoord, waarmee zij tegen Mij morren.", "Hand 24:15": "Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen.", "Openb 2:3": "En u hebt verdragen, en hebt geduld; en u hebt om Mijn Naam gearbeid, en bent niet moe geworden.", "Hand 15:8": "En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons;", "Ps 103:6": "De HEERE doet gerechtigheid en recht aan allen die onderdrukt worden.", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Ps 69:11": "En ik heb geweend in het vasten van mijn ziel; maar het is mij tot allerlei smaad geworden.", "Jes 29:20": "Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "1 Sam 17:45-47": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Mark 9:43": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;", "Job 14:15": "Dat U zou roepen, en ik U zou antwoorden, dat U naar het werk van Uw handen zou verlangen.", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "Ezech 22:21": "Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.", "Job 5:14": "Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Spr 14:9": "Elke dwaas maakt de schuld belachelijk; maar onder de oprechten is goedwilligheid.", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Job 9:15": "Aan wie ik, ook al was ik rechtvaardig, niet zou antwoorden; mijn Rechter zal ik om genade bidden.", "Jes 48:3": "De vorige dingen heb Ik verkondigd van toen af, en uit Mijn mond zijn zij voortgekomen, en Ik heb ze doen horen; Ik heb ze snel gedaan, en zij zijn gekomen;", "Jak 1:15": "Daarna, als de begeerte ontvangen is, baart zij zonde; en als de zonde volgroeid is, baart zij de dood.", "Luk 6:23": "Verblijd u op die dag, en wees vrolijk; want zie, uw loon is groot in de hemel; want hun vaders deden hetzelfde met de profeten.", "Job 36:7": "Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven.", "Rom 9:14": "Wat zullen wij dan zeggen? Is er onrechtvaardigheid bij God? Dat zij verre.", "Hand 5:40-42": "En zij gaven hem gehoor; en toen zij de apostelen bij zich geroepen hadden, geselden zij hen, en geboden hun dat zij niet zouden spreken in de Naam van Jezus; en lieten hen gaan. Zij dan gingen heen van voor de raad, verblijd dat zij waardig geacht waren om vanwege Zijn Naam smaad te lijden. En zij hielden niet op, elke dag, in de tempel en bij de huizen, te leren, en Jezus Christus te verkondigen.", "Ezech 38:22": "En Ik zal met hem rechtspreken, door pestilentie en door bloed; en Ik zal een overstelpende plasregen, en grote hagelstenen, vuur en zwavel op hem laten regenen, en op zijn benden, en op de vele volken die met hem zullen zijn.", "Zach 5:2-4": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el. Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden. Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Ps 21:7": "Want U zet hem tot zegeningen in eeuwigheid; U vervrolijkt hem door vreugde met Uw aangezicht.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "Hebr 11:14": "Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken.", "1 Sam 27:1": "David zei in zijn hart: Nu zal ik op een dag door de hand van Saul omkomen. Ik kan niets beters doen dan snel ontkomen naar het land van de Filistijnen, opdat Saul de hoop op mij verliest en mij niet langer zoekt in heel het gebied van Israël; zo zal ik ontkomen uit zijn hand.", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Ef 2:21": "op Wie het hele gebouw, bekwaam samengevoegd, opgroeit tot een heilige tempel in de Heere;", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Klaagl 3:24-32": "Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen. Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt. Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Jes 30:33": "Want Tofeth is van oudsher bereid; ja, hij is ook voor de koning bereid; Hij heeft hem diep en wijd gemaakt, het vuur en hout van zijn brandstapel is veel; de adem van de HEERE zal hem aansteken als een zwavelstroom.", "1 Kron 17:5": "Want Ik heb in geen huis gewoond vanaf de dag dat Ik Israël heb opgevoerd tot op deze dag toe; maar Ik ben gegaan van tent naar tent, en van tabernakel naar tabernakel.", "Deut 31:21": "En het zal gebeuren, wanneer veel kwaad en benauwdheden hen zullen treffen, dan zal dit lied voor hun aangezicht antwoorden tot getuige; want het zal uit de mond van hun nageslacht niet vergeten worden; omdat Ik hun gedachten ken, die het nu al maakt, voordat Ik het breng in het land dat Ik gezworen heb.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Joz 5:15": "Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Rom 11:33": "O diepte van de rijkdom, én van de wijsheid én van de kennis van God, hoe ondoorzoekelijk zijn Zijn oordelen, en onnaspeurlijk Zijn wegen!", "Luk 13:9": "en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "Ps 94:5": "O HEERE! Zij verbrijzelen Uw volk, en zij verdrukken Uw erfdeel.", "Job 36:4": "Want voorwaar, mijn woorden zullen geen valsheid zijn; iemand die oprecht van kennis is, is bij u.", "Ps 33:18": "Zie, het oog van de HEERE is over hen die Hem vrezen, op hen die op Zijn goedertierenheid hopen.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "Spr 10:32": "De lippen van de rechtvaardige weten wat welgevallig is; maar de mond van de goddelozen spreekt enkel verkeerdheid.", "Jes 29:16": "Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.", "Ps 6:10": "De HEERE heeft mijn smeking gehoord; de HEERE zal mijn gebed aannemen.", "Matt 16:17": "En Jezus antwoordde en zei tegen hem: Zalig bent u, Simon, Bar-Jona! Want vlees en bloed heeft u dat niet geopenbaard, maar Mijn Vader, Die in de hemelen is.", "Gen 24:7": "De HEERE, de God van de hemel, Die mij uit het huis van mijn vader en uit het land van mijn familie genomen heeft, en Die tot mij gesproken heeft, en Die mij gezworen heeft en zei: Aan uw nageslacht zal Ik dit land geven! Die Zelf zal Zijn Engel voor uw aangezicht zenden, zodat u voor mijn zoon van daar een vrouw neemt.", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Ps 139:23": "Doorgrond mij, o God! En ken mijn hart; beproef mij, en ken mijn gedachten.", "Joh 17:14": "Ik heb hun Uw woord gegeven; en de wereld heeft hen gehaat, omdat zij niet van de wereld zijn, zoals Ik niet van de wereld ben.", "Job 4:9": "Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Gen 6:8": "Maar Noach vond genade in de ogen van de HEERE.", "Ps 69:20": "U weet mijn smaad, en mijn schaamte, en mijn schande; al mijn belagers zijn voor U.", "Joël 3:13-16": "Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot. Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing. De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Ps 121:2": "Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft.", "Jes 28:5": "Op die dag zal de HEERE van de heerscharen tot een heerlijke kroon en tot een sierlijke krans zijn voor het overblijfsel van Zijn volk;", "Jer 10:12": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid heeft door Zijn verstand.", "Jes 3:14": "De HEERE komt ten gerichte tegen de oudsten van Zijn volk en hun vorsten, want u hebt deze wijngaard verteerd; de roof van de ellendige is in uw huizen.", "Luk 6:22": "Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen.", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "Ps 20:7": "Nu weet ik, dat de HEERE Zijn Gezalfde behoudt; Hij zal Hem verhoren uit de hemel van Zijn heiligheid; het heil van Zijn rechterhand zal zijn met machten.", "Ps 118:10": "Alle heidenen hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "Ps 60:11": "Wie zal mij brengen in een vaste stad? Wie zal mij leiden tot in Edom?", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Ps 23:1-6": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Jes 43:15": "Ik ben de HEERE, uw Heilige; de Schepper van Israël, uw Koning.", "Ps 33:20-22": "Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild. Want ons hart is in Hem verblijd, omdat wij op de Naam van Zijn heiligheid vertrouwen. Uw goedertierenheid, HEERE! zij over ons, zoals wij op U hopen.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "2 Kor 12:10": "Daarom heb ik een welbehagen in zwakheden, in smaadheden, in noden, in vervolgingen, in benauwdheden, om Christus' wil; want als ik zwak ben, dan ben ik machtig.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Dan 4:8": "Totdat ten laatste Daniël bij mij binnenkwam, wiens naam Beltsazar is, naar de naam van mijn god, in wie ook de geest van de heilige goden is; en ik vertelde de droom aan hem en zei:", "Job 36:23": "Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?", "Ps 55:17": "Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen.", "Joël 2:26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Rom 16:27": "Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. De brief aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is.", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "Matt 5:45": "opdat u kinderen mag zijn van uw Vader, Die in de hemelen is; want Hij laat Zijn zon opgaan over bozen en goeden, en laat het regenen over rechtvaardigen en onrechtvaardigen.", "Ps 50:4": "Hij zal roepen tot de hemel van boven, en tot de aarde, om Zijn volk te oordelen.", "Luk 22:42": "en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede.", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "Jer 18:18": "Toen zeiden zij: Kom, laten wij gedachten tegen Jeremia denken; want de wet zal niet vergaan van de priester, evenmin de raad van de wijze, of het woord van de profeet; kom, laten wij hem slaan met de tong, en laten wij niet luisteren naar enig van zijn woorden!", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "Joh 14:16-21": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid; Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn. Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Jes 65:14": "Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Ps 146:8": "De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief.", "Ps 67:7": "De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Spr 3:35": "De wijzen zullen eer beërven; maar de dwazen dragen schande.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Ps 91:5": "U zult niet vrezen voor de schrik van de nacht, voor de pijl die overdag vliegt;", "Matt 5:44": "Maar Ik zeg u: heb uw vijanden lief; zegen hen die u vervloeken; doe goed aan hen die u haten; en bid voor hen die u geweld aandoen en die u vervolgen;", "2 Kor 6:5": "in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Ps 143:9": "Red mij, HEERE, van mijn vijanden; bij U schuil ik.", "Klaagl 3:12": "Daleth. Hij heeft Zijn boog gespannen, en Hij heeft mij als doel voor de pijl gesteld.", "Ps 5:5": "Want U bent geen God, Die lust heeft aan goddeloosheid; de boze zal bij U niet verkeren.", "Spr 10:28-30": "De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid. De rechtvaardige zal in eeuwigheid niet wankelen; maar de goddelozen zullen de aarde niet bewonen.", "1 Sam 2:3": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan.", "Ps 77:11-13": "Daarna zei ik: Dit krenkt mij; maar de rechterhand van de Allerhoogste verandert. Ik zal de daden van de HEERE gedenken; ja, ik zal Uw wonderen van vroeger gedenken; En ik zal al Uw werken overdenken, en van Uw daden spreken.", "Spr 21:26": "De hele dag begeert hij begeerlijke dingen; maar de rechtvaardige zal geven, en niet inhouden.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Job 24:23": "Geeft God hem gerustheid, dan steunt hij daarop; toch zijn Zijn ogen op hun wegen.", "Job 31:4": "Ziet Hij niet mijn wegen, en telt Hij niet al mijn treden?", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Joh 12:42": "Toch geloofden ook zelfs velen van de leiders in Hem; maar om de Farizeeën beleden zij het niet, opdat zij niet uit de synagoge geworpen zouden worden.", "Gal 4:9": "en nu u God kent, ja, veelmeer door God gekend bent, hoe keert u zich weer tot de zwakke en arme beginselen, die u weer van voren af aan wilt dienen?", "Pred 11:1": "Werp uw brood uit op het water, want u zult het vinden na veel dagen.", "Hebr 11:25-27": "en verkoos hij liever met het volk van God slecht behandeld te worden, dan voor een tijd van de genietingen van de zonde te hebben; en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon. Door het geloof heeft hij Egypte verlaten, zonder bang te zijn voor de toorn van de koning; want hij hield vol, als iemand die de Onzichtbare ziet.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Luk 17:33": "Wie zijn leven zal zoeken te behouden, zal het verliezen; en wie het zal verliezen, zal het in het leven behouden.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Ps 32:7": "U bent mij een schuilplaats; U behoedt mij voor benauwdheid; U omringt mij met vrolijke gezangen van bevrijding. Sela.", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "Klaagl 3:41": "Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Ps 59:11": "De God van mijn goedertierenheid zal mij voor zijn; God zal mij op mijn verspieders doen zien.", "2 Kron 19:7": "Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "Job 2:5": "Strek toch Uw hand uit, en tast zijn gebeente en zijn vlees aan; dan zal hij U beslist in Uw aangezicht vervloeken!", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Jer 17:12": "Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Jes 29:21": "die een mens schuldig maken om een woord, en die strikken leggen voor hem die bestraft in de poort; en die de rechtvaardige verdrijven met valse argumenten.", "Rom 2:29": "Maar die is een Jood, die het in het verborgen is, en de besnijdenis van het hart, in de geest, niet in de letter, dat is de besnijdenis; wiens lof niet is uit de mensen, maar uit God.", "Richt 9:57": "Op dezelfde manier liet God al het kwaad van de mensen van Sichem op hun hoofd terugkomen; en de vloek van Jotham, de zoon van Jerubbaäl, kwam over hen.", "Spr 9:10": "De vreze van de HEERE is het beginsel van de wijsheid, en de kennis van de Heilige is verstand.", "Ps 44:9": "In God roemen wij de hele dag, en Uw Naam zullen wij loven tot in eeuwigheid. Sela.", "Hand 7:52": "Wie van de profeten hebben uw vaders niet vervolgd? En zij hebben degenen gedood die van tevoren de komst van de Rechtvaardige verkondigd hebben, van Wie u nu verraders en moordenaars geworden bent.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Joël 3:21": "En Ik zal hun bloed reinigen, dat Ik niet gereinigd had; en de HEERE zal wonen op Sion.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Ps 27:6": "Ook nu zal mijn hoofd verhoogd worden boven mijn vijanden die rondom mij zijn, en ik zal in Zijn tent offeranden van het geschal offeren; ik zal zingen, ja, psalmzingen voor de HEERE.", "2 Kon 22:12-14": "En de koning gebood Hilkia, de priester, en Ahikam, de zoon van Safan, en Achbor, de zoon van Michaja, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei: Ga heen, vraag de HEERE voor mij, en voor het volk, en voor heel Juda, over de woorden van dit boek dat gevonden is; want de grimmigheid van de HEERE is groot, die tegen ons ontstoken is, omdat onze vaderen niet geluisterd hebben naar de woorden van dit boek, om te doen naar alles wat voor ons geschreven is. Toen ging de priester Hilkia, en Ahikam, en Achbor, en Safan, en Asaja naar de profetes Hulda, de vrouw van Sallum, de zoon van Tikva, de zoon van Harhas, de klederbewaarder (zij woonde nu te Jeruzalem, in het tweede deel), en zij spraken met haar.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Ps 22:6": "Tot U hebben zij geroepen, en zijn uitgered; op U hebben zij vertrouwd, en zijn niet beschaamd geworden.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Ps 94:9-11": "Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien? Zou Hij, Die de heidenen tuchtigt, niet straffen, Hij, Die de mens wetenschap leert? De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Jes 10:17": "Want het Licht van Israël zal tot een vuur zijn, en zijn Heilige tot een vlam, die in brand zal steken en verteren zal zijn doornen en zijn distels, op één dag.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "1 Petr 1:15": "maar word, zoals Hij Die u geroepen heeft heilig is, ook zelf heilig in heel uw levenswandel;", "Job 26:6": "Het dodenrijk is naakt voor Hem, en geen bedekking is er voor het verderf.", "1 Petr 3:17": "Want het is beter, als het de wil van God is, dat u lijdt om het goeddoen, dan om het kwaaddoen.", "Ps 121:3": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "Jes 47:4": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Jes 45:21": "Verkondig het en treed hier toe, ja, beraadslaag samen: wie heeft dat van oudsher laten horen? Wie heeft dat van toen af verkondigd? Ben Ik het niet, de HEERE? En er is geen God meer behalve Mij, een rechtvaardig God, en een Heiland, niemand is er dan Ik.", "Matt 5:10-12": "Zalig zijn zij die vervolgd worden om de gerechtigheid, want hun is het Koninkrijk der hemelen. Zalig bent u, als de mensen u smaden en vervolgen, en liegend allerlei kwaad tegen u spreken, omwille van Mij. Verblijd en verheug u, want uw loon is groot in de hemelen; want zo hebben zij de profeten vervolgd die vóór u geweest zijn.", "Jes 30:26": "En het licht van de maan zal zijn als het licht van de zon, en het licht van de zon zal zevenvoudig zijn als het licht van zeven dagen; op de dag dat de HEERE de breuk van Zijn volk zal verbinden, en de wond waarmee het geslagen is, genezen.", "Matt 23:21": "En wie zweert bij de tempel, die zweert bij die, en bij Hem, Die daarin woont.", "Deut 33:23": "En van Naftali zei hij: O Naftali! wees verzadigd van de goedgunstigheid, en vol van de zegen van de HEERE; bezit erfelijk het westen en het zuiden.", "Spr 11:6": "De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid.", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Ps 115:12-14": "De HEERE is aan ons indachtig geweest, Hij zal zegenen; Hij zal het huis van Israël zegenen, Hij zal het huis van Aäron zegenen. Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten. De HEERE zal de zegen over u vermeerderen, over u en over uw kinderen.", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "Job 6:4": "Want de pijlen van de Almachtige zijn in mij, waarvan het vurige venijn mijn geest uitdrinkt; de verschrikkingen van God rusten zich tegen mij.", "1 Sam 23:14": "David nu bleef in de woestijn, in de vestingen, en hij bleef op de berg in de woestijn Zif; en Saul zocht hem elke dag, maar God gaf hem niet over in zijn hand.", "Matt 4:5": "Toen nam de duivel Hem mee naar de heilige stad, en zette Hem op de tinne van de tempel,", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Zach 9:16": "En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Ps 119:43": "En ruk het woord van de waarheid van mijn mond niet al te zeer, want ik hoop op Uw rechten.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "Openb 17:6": "En ik zag dat de vrouw dronken was van het bloed van de heiligen, en van het bloed van de getuigen van Jezus. En ik verwonderde mij, toen ik haar zag, met grote verwondering.", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Ps 119:95": "De goddelozen hebben op mij gewacht, om mij te doen vergaan; ik neem acht op Uw getuigenissen.", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord heb
