Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"HEERE, waarom staat U ver weg? Waarom verbergt U Zich in tijden van benauwdheid?","2":"De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben.","3":"Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE.","4":"De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.","5":"Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg.","6":"Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.","7":"Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.","8":"Hij zit in de hinderlaag bij de hoeven, in verborgen plaatsen doodt hij de onschuldige; zijn ogen verbergen zich tegen de arme.","9":"Hij legt lagen in een verborgen plaats, zoals een leeuw in zijn hol; hij legt lagen om de ellendige te roven; hij rooft de ellendige als hij hem trekt in zijn net.","10":"Hij duikt neer, hij buigt zich; en de arme drom valt in zijn sterke *poten*.","11":"Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.","12":"Sta op, HEERE God! Hef Uw hand op, vergeet de ellendigen niet.","13":"Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?","14":"U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.","15":"Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.","16":"De HEERE is Koning eeuwig en altijd; de heidenen zijn vergaan uit Zijn land.","17":"HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;","18":"Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven."},"SV":{"1":"O HEERE! waarom staat Gij van verre? *waarom* verbergt Gij U in tijden van benauwdheid?","2":"De goddeloze vervolgt hittiglijk in hoogmoed den ellendige; laat hen gegrepen worden in de aanslagen, die zij bedacht hebben.","3":"Want de goddeloze roemt over den wens zijner ziel; hij zegent den gierigaard, hij lastert den HEERE.","4":"De goddeloze, gelijk hij zijn neus omhoog steekt, onderzoekt niet; al zijn gedachten zijn, dat er geen God is.","5":"Zijn wegen maken ten allen tijde smarte; Uw oordelen zijn een hoogte, verre van hem; al zijn tegenpartijders, die blaast hij aan.","6":"Hij zegt in zijn hart: Ik zal niet wankelen; want *ik* zal van geslacht tot geslacht in geen kwaad zijn.","7":"Zijn mond is vol van vloek, en bedriegerijen, en list; onder zijn tong is moeite en ongerechtigheid.","8":"Hij zit in de achterlage der hoeven, in verborgene plaatsen doodt hij den onschuldige; zijn ogen verbergen zich tegen den arme.","9":"Hij legt lagen in een verborgen plaats, gelijk een leeuw in zijn hol; hij legt lagen, om den ellendige te roven; hij rooft den ellendige, als hij hem trekt in zijn net.","10":"Hij duikt neder, hij buigt zich; en de arme hoop valt in zijn sterke *poten*.","11":"Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet niet in eeuwigheid.","12":"Sta op, HEERE God! hef Uw hand op, vergeet de ellendigen niet.","13":"Waarom lastert de goddeloze God? zegt in zijn hart: Gij zult het niet zoeken?","14":"Gij ziet het *immers*; want Gij aanschouwt de moeite en het verdriet, opdat men het in Uw hand geve; op U verlaat zich de arme, Gij zijt geweest een Helper van den wees.","15":"Breek den arm des goddelozen en bozen; zoek zijn goddeloosheid, *totdat* Gij haar niet vindt.","16":"De HEERE is Koning eeuwiglijk en altoos; de heidenen zijn vergaan uit Zijn land.","17":"HEERE! Gij hebt den wens der zachtmoedigen gehoord; Gij zult hun hart sterken, Uw oor zal opmerken;","18":"Om den wees en verdrukte recht te doen; opdat een mens van de aarde niet meer voortvare geweld te bedrijven."},"KJV":{"1":"Why standest thou afar off, O LORD? *why* hidest thou *thyself* in times of trouble?","2":"The wicked in *his* pride doth persecute the poor: let them be taken in the devices that they have imagined.","3":"For the wicked boasteth of his heart's desire, and blesseth the covetous, *whom* the LORD abhorreth.","4":"The wicked, through the pride of his countenance, will not seek *after God*: God *is* not in all his thoughts.","5":"His ways are always grievous; thy judgments *are* far above out of his sight: *as for* all his enemies, he puffeth","6":"He hath said in his heart, I shall not be moved: for *I shall* never *be* in adversity.","7":"His mouth is full of cursing and deceit and fraud: under his tongue *is* mischief and vanity.","8":"He sitteth in the lurking places of the villages: in the secret places doth he murder the innocent: his eyes are privily set against the poor.","9":"He lieth in wait secretly as a lion in his den: he lieth in wait to catch the poor: he doth catch the poor, when he draweth him into his net.","10":"He croucheth, *and* humbleth himself, that the poor may fall by his strong ones.","11":"He hath said in his heart, God hath forgotten: he hideth his face; he will never see","12":"Arise, O LORD; O God, lift up thine hand: forget not the humble.","13":"Wherefore doth the wicked contemn God? he hath said in his heart, Thou wilt not require","14":"Thou hast seen *it*; for thou beholdest mischief and spite, to requite *it* with thy hand: the poor committeth himself unto thee; thou art the helper of the fatherless.","15":"Break thou the arm of the wicked and the evil *man*: seek out his wickedness *till* thou find none.","16":"The LORD *is* King for ever and ever: the heathen are perished out of his land.","17":"LORD, thou hast heard the desire of the humble: thou wilt prepare their heart, thou wilt cause thine ear to hear:","18":"To judge the fatherless and the oppressed, that the man of the earth may no more oppress."}},"tsk":{"1":[{"kopje":"staat U","refs":["Ps 22:2","Ps 46:2","Jer 14:8"]},{"kopje":"verbergt U","refs":["Ps 13:2-4","Ps 27:9","Ps 30:8","Ps 44:25","Ps 88:15","Job 13:24","Job 23:9","Job 34:29"]}],"2":[{"kopje":"De goddeloze","refs":["Ps 31:19","Ps 36:12","Ps 59:13","Ps 119:5","Ps 119:69","Ps 119:85","Ps 119:122","Ps 140:6","Ex 9:17","Ex 18:11","Jes 10:12","Jes 10:13","Jes 14:13","Jes 14:16","Jer 43:2"]},{"kopje":"laat","refs":["Ps 7:17","Ps 9:16","Ps 9:17","Spr 5:22"]}],"3":[{"kopje":"roemt","refs":["Ps 35:21","Ps 49:7","Ps 52:3","Ps 73:8","Ps 73:9","Ps 94:4","Ex 15:9","Jes 10:7-11","Jes 37:23","Jak 4:13","Jak 4:16"]},{"kopje":"hij zegent","refs":["Ps 49:12-14","Ps 49:19","Deut 29:19","1 Sam 23:21","Job 31:24","Spr 28:4","Hos 12:8","Hos 12:9","Zach 11:5-8","Luk 12:19","Rom 1:29","Rom 1:32","2 Tim 3:2-4","1 Joh 2:15"]},{"kopje":"de gierigaard","refs":["Jes 57:17","Jer 22:17","Micha 6:10-12","Hab 2:9","Matt 26:15","Matt 26:16","Luk 12:15","Luk 16:14","Luk 16:15","1 Kor 6:10","Ef 5:5","Kol 3:5","1 Tim 6:9","1 Tim 6:10"]},{"kopje":"lastert","refs":["Ps 5:7","Lev 26:30","Deut 32:19"]}],"4":[{"kopje":"zijn neus omhoog steekt","refs":["Ps 18:28","Ps 101:5","Spr 6:17",  for thou <span class=\"wl wl-kjv\" data-code=\"H5027\">beholdest</span> <span class=\"wl wl-kjv\" data-code=\"H5999\">mischief</span> and <span class=\"wl wl-kjv\" data-code=\"H3708\">spite,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">requite</span> it with thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> the <span class=\"wl wl-kjv\" data-code=\"H2489\">poor</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">committeth</span> himself unto thee; thou art the <span class=\"wl wl-kjv\" data-code=\"H5826\">helper</span> of the fatherless.","15":"<span class=\"wl wl-kjv\" data-code=\"H7665\">Break</span> thou the <span class=\"wl wl-kjv\" data-code=\"H2220\">arm</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> and the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> man: seek <span class=\"wl wl-kjv\" data-code=\"H1875\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H7562\">wickedness</span> till thou <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> none.","16":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H4428\">King</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> and <span class=\"wl wl-kjv\" data-code=\"H5703\">ever:</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> are <span class=\"wl wl-kjv\" data-code=\"H6\">perished</span> out of his land.","17":"<span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H8378\">desire</span> of the <span class=\"wl wl-kjv\" data-code=\"H6035\">humble:</span> thou wilt <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> thou wilt cause thine <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> to hear:","18":"To <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> the <span class=\"wl wl-kjv\" data-code=\"H3490\">fatherless</span> and the <span class=\"wl wl-kjv\" data-code=\"H1790\">oppressed,</span> that the <span class=\"wl wl-kjv\" data-code=\"H582\">man</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> may no <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> oppress."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"waarom","tekst":"Alsof hij zeide Doe toch niet alzo; nader met uwe hulp, en laat uw genadig aanschijn lichten; menselijkerwijze van God gesproken, gelijk dikwijls in dit boek. Verg. Psa 3:8 , en Psa 7:7-8 ."},{"catchword":"in tijden","tekst":"Gelijk boven, Psa 9:10 ."}],"2":[{"catchword":"goddeloze","tekst":"Dat is, de goddelozen; gelijk blijkt uit het volgende."},{"catchword":"vervolgt","tekst":"Gelijk Psa 7:14 ."}],"3":[{"catchword":"roemt","tekst":"Vastelijk menende dat hij zijn aanslag zal volbrengen en zijn wens verkrijgen. Anders: hij prijst naar den lust zijner ziel, dat is, wien hij maar wil; bij exempel den gierigaard, gelijk volgt. Of, hij beroemt zich over den wens zijner ziel; dat is, over zijn boze lusten, als hij die volbracht heeft."},{"catchword":"zegent","tekst":"Dat is, hij houdt en rekent den onrechtvaardige, die door gierigheid den arme verdrukt, gelukkig te zijn. Zie Deu 29:19 . Anders, de gierige, [terstond genoemd goddeloze ] vloekt [en] lastert den Heere; gelijk zegenen somtijds voor vloeken genomen wordt. Zie 1Ki 21:10 . Of, de gierigaard zegent [zechzelven]."},{"catchword":"lastert","tekst":"Of, tergt."}],"4":[{"catchword":"gelijk","tekst":"Hebr. naar de hoogheid, of opsteking, opheffing zijns aangezichts, of zijns gelaats, van zijn neus, zijns toorns; dat is, naar de trotsheid en smadelijke verachting van goed onderwijs, die hij in zijn ganse gelaat en alle gebaren toont; gelijk de hoogheid des harten; Psa 131:1 , en des geestes, Pro 16:18 , de inwendige trotsheid of hoogmoed betekent, alzo de hoogheid der ogen, Psa 18:28 , en Psa 101:5 , en hier des aangezichts, of van den neus, de uitwendige."},{"catchword":"onderzoekt","tekst":"Of hij wel of kwalijk doe, nergens naar vragende. Anders, hij zoekt [God] niet, uit Psa 14:2 ."},{"catchword":"al zijn","tekst":"Anders, [in] al zijn listige aanslagen is God niet."}],"5":[{"catchword":"wegen","tekst":"Dat is, zijn voornemen, aanslagen en doen."},{"catchword":"maken","tekst":"Te weten, aan dengene, dien hij in zijn hoogmoed verdrukt. Anders, zijne wegen zijn te allen tijde voorspoedig. Het Hebr. woord heeft de betekenis van barendssmart, waarop blijdschap volgt als het kind geboren is. Joh 16:21 . En alzo schijnen enigen het voorts genomen te hebben in de betekenis van voorspoed, wel gedijen, zijn werk te bevorderen, dat het voor den dag kome als de vrucht des lichaams; alzo woelt, arbeid en werkt de goddelozen zijn voornemen uit, het gelukt hem naar zijn zin; daarom vraagt hij naar God niet."},{"catchword":"oordelen","tekst":"Uwe regering en de straffe, die Gij, o Heere, den goddelozen bereidt hebt."},{"catchword":"verre","tekst":"Verg. de manier van spreken met Jdg 9:17 , en Son 6:5 . Hebr. van, of van tegenover hem; dat is, hij werpt hen van zich uit zijn gezicht, en denkt daar niet eens om; of, zij zijn hoger, dan dat hij hen zich zou voorstellen, zij zijn voor hem verborgen, boven zijn verstand en bedenken; dewijl hij gelukkig is, denkt hij niet op de toekomstige straffen. Ziet het volgende vs.6."},{"catchword":"blaast","tekst":"Of, daarop, blaast hij, of, tegen dezelve blaast hij; dat is, hij meent hen gelijk kaf, als met een geblaas te verstuiven; zo gans niet past hij daarop, omdat hem alles naar zijn zin gaat. Verg. Psa 12:6 ."}],"6":[{"catchword":"zegt","tekst":"Dat is, hij denkt, gelijk vs.11, 13, en Psa 14:1 , enz."},{"catchword":"wankelen;","tekst":"Dat is, ik zal van mijn staat of welstand niet verzet worden, het zal mij altoos welgaan, ik zal niet sneuvelen en vallen, of omgestoten worden."},{"catchword":"van geslacht","tekst":"Hebr. in geslacht en geslacht; dat is, nimmermeer."},{"catchword":"kwaad","tekst":"Dat is, mij zal nimmermeer enig ongeluk of tegenspoed overkomen. Rom 3:14 ."}],"7":[{"catchword":"onder zijn","tekst":"Verg. Psa 66:17 ; Rom 3:13 ."}],"8":[{"catchword":"hoeven,","tekst":"Of, dorpen, vlekken."},{"catchword":"verbergen","tekst":"Dat is, hij loert in het verborgene op hem."}],"10":[{"catchword":"duikt","tekst":"Om niet gezien te worden, en als met een onvoorzienen sprong hem op het lijf te vallen. Verg. Psa 17:11 ."},{"catchword":"en de arme","tekst":"Of, opdat de arme hoop moge vallen, enz. Anders, en hij overvalt den armen hoop met zijn sterke [leden]; voor armen hoop is in het Hebr. armen, in het getal van velen, gevoegd bij het woord, valt, in het getal van een."}],"11":[{"catchword":"heeft het","tekst":"Hebr. heeft vergeten; te weten, deze lieden, of de zaak van degenen, die ik voorheb te plagen; dat zijn de ellendigen van dewelken de profeet integendeel in het volgende vs.12 bidt, dat God hunner niet wil vergeten."}],"12":[{"catchword":"Sta op,","tekst":"Zie Psa 3:8 ."},{"catchword":"hef uw","tekst":"Deze manier van spreken wordt versacheidenlijk in de Schriftuur genomen, betekenende hier de openbare vertoning van Gods macht in het helpen der vromen en beschamen der bozen, die met hunne goddeloosheid in het voorgaande bescheven zijn."},{"catchword":"ellendigen","tekst":"Anders, zachtmoedigen."}],"13":[{"catchword":"Waarom","tekst":"Hij wil zeggen: Waarom laat Gij toe dat hij U alzo lastert?"},{"catchword":"lastert","tekst":"Of, tergt."},{"catchword":"zoeken?","tekst":"Als boven vs.9, vs.13, en onder vs.15. Of, hij zegt in zijn hart: Gij zult, enz."}],"14":[{"catchword":"moeite","tekst":"Die de ellendigen lijden van den goddelozen."},{"catchword":"opdat men","tekst":"Dat is, U de wraak geven, waarop de volgende woorden wel passen. Anders, opdat Gij het in uwe handen legt; dat is, om hunne zaak of hun recht als voor ogen te hebben en daarop te letten, of, opdat Gij met uwe hand geeft; dat is, vergeldt."},{"catchword":"verlaat","tekst":"Of, laat het den arme; te weten, staan, hij laat het in uwe hand, hij vertrouwt het U, dat Gij zijne zaak zult bewaren en op zijn recht letten. Verg. de manier van spreken met Gen 39:6 ; Job 39:14 ; Isa 10:3 , en 2Ti 1:12 ."},{"catchword":"geweest","tekst":"Te weten, altoos in vorige tijden. Verg. Psa 27:9 ."},{"catchword":"wees","tekst":"Dit is van mij en al degenen, die als wezen van de mensen verlaten en verdrukt worden. Verg. Psa 68:6 ; Joh 14:18 , en onder vs.18."}],"15":[{"catchword":"arm des","tekst":"Dat is, de macht, het geweld, gelijk dikwijls."},{"catchword":"zoek zijn","tekst":"Gelijk boven, Psa 9:13 ."},{"catchword":"totdat","tekst":"De zin is, straf hen en roei hen uit, zodat de goddelozen de vromen niet meer kunnen kwellen. Verg. Eze 23:48 . In een gans anderen zin zullen de zonden van Gods volk gezocht en niet gevonden worden, dewijl zij allen van God uit genade om des Messias' wil zullen vergeven zijn; Jer 50:20 . Anders: zult Gij ze niet vinden? Dat is, Gij zult zekerlijk vinden."}],"16":[{"catchword":"zijn land","tekst":"Te weten, Kanaän, dat God zijn land noemt, Lev 25:23 . Anders, uit, of van zijn aardrijk; gelijk de ganse aarde ook Godes is; Psa 24:1 ."}],"17":[{"catchword":"zachtmoedigen","tekst":"Of, nederigen, die door Gods hand en het middel van kruis verootmoedigd zijn. Dit is een aanmerkelijke titel van Gods kinderen, die door zijn Heiligen Geest wedergeboren, vernederd en onder zijn juk en gehoorzaamheid zijner geboden gebracht zijn. Alzo onder Psa 22:27 , en Psa 25:9 , en Psa 34:3 , enz."},{"catchword":"sterken,","tekst":"Te weten, door uw woord en uwe Heilige Geest."}],"18":[{"catchword":"mens","tekst":"Zie Psa 8:5 , en verg. Psa 9:20-21 ."},{"catchword":"van de aarde","tekst":"Dat is, die uit de aarde gesproten of daarvan gemaakt is, en dienvolgens geen oorzaak heeft van trots en hoogmoedig te zijn. Anders, opdat een sterflijk mens niet meer voortvare uit het land te verjagen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"O LORD, why standest thou afar off? [As if he said; ah do not so, draw neer with thy help, and let thy gracious countenance shine upon us. Spoken of God after the manner of men; as frequently in this book. Compare Psa.3.on v.8. and 7.on v.7,8.] (why) hidest thou thy self in times of distress? [as above Psa.9.v.10.]"}],"2":[{"catchword":null,"tekst":"The wicked [In the singular understanding wicked men, as appeareth by the sequel] doth hostly persecute [as Psa 7:14.] the afflicted in ( or with) insolency: let them be apprehended in the enterprises which have devised."}],"3":[{"catchword":null,"tekst":"For the wicked boasteth over the wish of his soul; as fuliy persuade, that he shall accomplish his designs, and obtain his hearts desire. Oth. He praiseth according to the desire of his soul, i.e. whom so ever he will; for example, the covetous, as followeth. Or he boasteth over the wish of his soul, i.e. over his evil lusts, when he hath satisfied or accomplished the same] he blesseth the covetous [i.e. holdeth and accounteth the unrighteous, that oppresseth the poor, by his covetousness to be a happy man. See Deut.29.on v.19.] he slandereth the LORD [or, provoketh the LORD, etc. Others read the letter half of this verse thus: the covetous (by and by called wicked) curseth and revileth the LORD: as the word blessing is sometimes used instead of cursing. See 1 Kings 21.on v.10. Or the covetous blesseth (himself) &c.]"}],"4":[{"catchword":null,"tekst":"The wicked, as he putteth his nose on high, [Heb. According to the height, putting up, or lifting up of his face, or his countenance, his nose, his anger, i.e. according to his insolency, and scornful contempt of good instruction, which he sheweth forth in all his carriage and deportment. For even as the height of the heart, Psa.131.v.1. and insolency or high-mindedness; so the height of the eyes, Psa 18:28. and here; of the face, or the nose, betokeneth the outward] doth not search; [whether he do well or ill, caring for nothing at all, Oth. He doth not seek (God) out of Psa 14:2.] all his thoughts are, that there is no God: [oth. (in) all his subtile devises God is not.]"}],"5":[{"catchword":null,"tekst":"His ways, [i.e. his purposes, designers and practice] cause pain at all time. [viz. to him, whom he oppresseth in his insolency. Oth. His ways are prosperous at all time. The Hebrew word hath the signification of the pains or travel of child-birth, whereupon doth follow rejoicing, when the child is born, Joh 16:21. and thus some do seem to have taken it here consectarily in the sense of success, and prospering, or furthering, advancing of his work, that it may come to light and issue, as the fruit of the womb: thus the wicked bestirred himself, toilet and laboureth till he work out his purpose, and it succedeth according to his mind; therefore he careth not for God] thy judgements [i.e. thy government, and the punishments, which thou hast prepared for the wicked] are an height far from him: Compare the manner of speaking with Jud.9.on v.17. and Cant.6.on v.5. Heb. From, or from over against him, i.e. he casteth the same from him , out of his sight, and never mindeth them once: or they are higher, or too high for him to set them before him; they are hidden be fore him, above the reach of his understanding and apprehension: because he is in prosperity, he never thinketh on any punishments to come. See the next verse] all his adversaries, he bloweth upon them [or he bloweth thereupon, or against the same, i.e. he meaneth to scatter and dispel like chaff with his very breath. So small account he maketh of them, because all things go with him according to his mind. Compare Psa 12:6."}],"6":[{"catchword":null,"tekst":"He saith in his heart, [i.e. he thinketh as v.11.13. and Psa.14.v.1.&c.] I shall not waver, [i.e. I shall not be displaced or removed out of my estate or prosperity: it shall go always well with me, I shall not stumble nor fall, nor be overthrown by any] for I shall be in no evil from generation. [Heb. In generation and generation, i.e. never, meaning that no kind of evil, mischance or adversity should ever betide him.]"}],"7":[{"catchword":null,"tekst":"His mouth is full of cursing and deceitfulnesses, and wiles: under his tongue (there) is toil and iniquity. [Compare Psa 66:17. Rom 3:11.]"}],"8":[{"catchword":null,"tekst":"He sitteth in the ambushes of court-gardens, [Or out-houses, villages, country-towns] in hidden places doth he put to death the innocent: his eyes do hide themselves against the poor, [i.e. he watcheth and way layeth him in secret, where he may not be seen.]"}],"9":[{"catchword":null,"tekst":"He layeth ambushes in a hidden place, like a Lion in his den: he layeth ambushes to spoil the afflicted; he spoileth the afflicted, when he draweth him into his net."}],"10":[{"catchword":null,"tekst":"He stoopeth down, he bowed himself, [For to la close and undiscovered, and that he may he more suddenly and unwares surprise and fall upon the afflicted. Compare Psa 17:11.] and the poor troop falleth into his strong (paws) [or that the poor troop may fall, etc. Oth. And he falleth upon the poor company with his strong (limbs): for poor troop, or company, the Hebrew hath the poor in the plural, construed with the word falleth in the singular.]"}],"11":[{"catchword":null,"tekst":"He saith in his heart, God hath forgotten it; [Heb. Hath forgotten, viz. those people, or the cause and case of them whom I intend to plague and spoil: those are the afflicted ones, for whom the Prophet contrarywise doth pray in the sequel, that God would not forget them] he hath hid his face, he seeth (it) not for ever."}],"12":[{"catchword":null,"tekst":"Arise, LORD God, [see Psa.3.on v.8] lift up thine hand; [this phrase is taken diversly in Scripture; signifying here, the public manifestation of the power of God in helping the godly, and confounding the wicked, who were described with their wickedness before] forget not the afflicted. [Otherw. The meek.]"}],"13":[{"catchword":null,"tekst":"Why doth the wicked slander (or provoke) God? [He will say: why doest thou permit him thus to slander or provoke thee] saith in his heart; thou wilt not seek it, [as above 9.13. and below v.15. Or he saith in his heart thou wilt not, etc."}],"14":[{"catchword":null,"tekst":"(Howbeit) thou seest it; for thou regardest the toil and the vexation, [viz. which the afflicted must suffer and undergo by the wicked] that they may give it into thine hand: [i.e. commit the avenging unto thee, which the following words do well agree with. Oth. That thou mayst put it into thine hand, i.e. for to have their cause, as it were before thine eyes, and to consider the same: Or that thou mayst give it with thine hand, [i.e.require it] the poor relyeth on thee [or on thee the poor letteth it, viz. rest, he leaveth it in thine hand; he the prosecuting of his right. Compare the manner of speaking with Gen 39:6. Job 39:14. Isa 10:3. and 2 Tim.1.12.] thou hast been [viz. Always in times past] an helper of the Orphan, [i.e. of my self and all those, that like poor Orphans were forsaken and oppressed by men. Compare Psa 68:6. Joh 14:18. and below v.18.]"}],"15":[{"catchword":null,"tekst":"Break the arm, [i.e. the power, might, violence, as frequently] of the wicked and evil (one) seek his wickedness [as above Psa 9:13.] (until) thou find it not [the meaning is, punish it and destroy it; so that the wicked be no more able to molest and vex the godly. Compare Eze 23:48. The sins Gods people are likewise said to be sought and not found, but in a clean contrary sense; they being all pardoned of God by grace, for the Messiah his sake, Jer 50:20. Oth.shalt not thou find them? i.e. yea thou shalt surely find them.]"}],"16":[{"catchword":null,"tekst":"The LORD is king eternity and evermore; the heathen are perished out of his land, [viz. Out of Canaan, which God doth call his land, Lev.25.23. Oth. Out off, or from his Earth indeed being Gods, Psa 24:1.]"}],"17":[{"catchword":null,"tekst":"LORD, thou hast heard the wish of the meek: [Or lowly, humble ones, which were humbled by the hand of God and means of the cross. This is an observable title of Gods children, that are regenerated by the holy Ghost, humbled and brought under the yoak and obedience of his commands. So below Psa 22:27. and 25.9. and 34.3. &c.] thou shalt strengthen their heart, [viz. By thy word and holy spirit] thine ears shall attend."}],"18":[{"catchword":null,"tekst":"To do right to the Orphan and oppressed: that a man [See Psa.8.on v.5. and Compare Psa 9:20,21.] of the Earth [that sprung from the Earth, or was made therefore, and consequently had no reason to be so arrogant and insolent] go on more to practise violence. [Oth. Read the latter member of this verse: that mortal man go no more to chase out of the land.]"}]}}};

// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat

// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');

    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;

}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
