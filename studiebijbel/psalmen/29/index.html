<style>

  /* verzen — tabsmodus (één kolom) */

  .vers:hover .kopieer { opacity: .75; }

  .kolomkop { display:none; }

:"De stem des HEEREN is op de wateren, de God der ere dondert; de HEERE is op de grote wateren.","4":"De stem des HEEREN is met kracht, de stem des HEEREN is met heerlijkheid.","5":"De stem des HEEREN breekt de cederen; ja, de HEERE verbreekt de cederen van Libanon.","6":"En Hij doet ze huppelen als een kalf, den Libanon en Sirjon als een jongen eenhoorn.","7":"De stem des HEEREN houwt er vlammen vuurs uit.","8":"De stem des HEEREN doet de woestijn beven; de HEERE doet de woestijn Kades beven.","9":"De stem des HEEREN doet de hinden jongen werpen, en ontbloot de wouden; maar in Zijn tempel zegt *Hem* een iegelijk eer.","10":"De HEERE heeft gezeten over den watervloed; ja, de HEERE zit, Koning in eeuwigheid.","11":"De HEERE zal Zijn volk sterkte geven; de HEERE zal Zijn volk zegenen met vrede."},"KJV":{"1":"[[A Psalm of David.]] Give unto the LORD, O ye mighty, give unto the LORD glory and strength.","2":"Give unto the LORD the glory due unto his name; worship the LORD in the beauty of holiness.","3":"The voice of the LORD *is* upon the waters: the God of glory thundereth: the LORD *is* upon many waters.","4":"The voice of the LORD *is* powerful; the voice of the LORD *is* full of majesty.","5":"The voice of the LORD breaketh the cedars; yea, the LORD breaketh the cedars of Lebanon.","6":"He maketh them also to skip like a calf; Lebanon and Sirion like a young unicorn.","7":"The voice of the LORD divideth the flames of fire.","8":"The voice of the LORD shaketh the wilderness; the LORD shaketh the wilderness of Kadesh.","9":"The voice of the LORD maketh the hinds to calve, and discovereth the forests: and in his temple doth every one speak of *his* glory.","10":"The LORD sitteth upon the flood; yea, the LORD sitteth King for ever.","11":"The LORD will give strength unto his people; the LORD will bless his people with peace."}},"tsk":{"1":[{"kopje":"Geef","refs":["Ps 2:10-12","Ps 68:32-35","Ps 96:7-9","Jes 60:12","Jer 13:16-18","Openb 5:11-14"]}],"2":[{"kopje":"Geef"," ode=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2672\">divideth</span> the <span class=\"wl wl-kjv\" data-code=\"H3852\">flames</span> of fire.","8":"The <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2342\">shaketh</span> the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness;</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2342\">shaketh</span> the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of Kadesh.","9":"The <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> maketh the <span class=\"wl wl-kjv\" data-code=\"H355\">hinds</span> to <span class=\"wl wl-kjv\" data-code=\"H2342\">calve,</span> and <span class=\"wl wl-kjv\" data-code=\"H2834\">discovereth</span> the <span class=\"wl wl-kjv\" data-code=\"H3295\">forests:</span> and in his <span class=\"wl wl-kjv\" data-code=\"H1964\">temple</span> doth every one <span class=\"wl wl-kjv\" data-code=\"H559\">speak</span> of his glory.","10":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3999\">flood;</span> yea, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sitteth</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">King</span> for ever.","11":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H5797\">strength</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> with peace."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"kinderen","tekst":"Dat is, gij machtigen, geweldigen, die boven anderen in macht en gezag op aarde verheven zijt. Alzo Psa 89:7 ."}],"2":[{"catchword":"aanbidt","tekst":"Of, buigt u voor den HEERE. Zie Gen 24:26 ."},{"catchword":"heerlijkheid","tekst":"Dat is, in zijn tabernakel, dien de grote God zelf met de heerlijke waartekenen zijner genade versierd heeft. Sommigen menen dat David dezen psalm gedicht heeft als hij de ark des verbonds met grote vreugde tot zich gehaald had in Zion, 2Sa 6 om de groten op aarde [die gemeenlijk trots en hoogmoedig zijn] onder de krachtige hand van den enigen waren God, die te Zion in zijn hius woonde, te vernederen, en door zijn voorbeeld te vermanen dat zij dezen God in zijne woning in alle nederigheid zouden komen eren; waartoe hij in in het volgende ook gebruikt de beschrijving van den donder dezes Gods, voor welken zich zelfs de allergrootsten op aarde moeten ontzetten en verschrikken, en dienvolgens den auteur daarvan behoren te kennen en naar zijne instelling te eren. Anders, in sieraad der heiligheid. Of, met sieraad, enz."}],"3":[{"catchword":"stem","tekst":"Versta, den donder en het verschrikkelijk geluid van dien, gelijk Psa 18:14 , en 2Sa 22:14 ; Job 28:26 , en Job 37:2 , Job 37:4-5 ; Psa 46:7 , en Psa 68:34 ; Isa 30:30-31 ."},{"catchword":"wateren,","tekst":"Men kan dit verstaan van de bovenste wateren, te weten, de wolken, en ook van de onderste, waarop de donder vreeslijk geluid maakt. Anders, boven de wateren; dat is, heeft groter en sterker geluid dan het bruisen der wateren. Zie hiervan Eze 1:24 , en Eze 43:2 ; Rev 1:15 , en Rev 14:2 , en Rev 19:6 ."},{"catchword":"der ere","tekst":"Dat is de heerlijke God, die te eren is, gelijk 1Co 2:8 ."},{"catchword":"grote","tekst":"Of, vele, geweldige."}],"5":[{"catchword":"Libanon","tekst":"Een zeer vermaard gebergte, in de Schriftuur dikwijls vermeld, gelegen aan de noordelijke zijde van Kanaän, geroemd om de schone cederbomen. Zie Jdg 9:15 ."}],"6":[{"catchword":"Sirjon","tekst":"Zie Deu 3:9 ."},{"catchword":"jongen","tekst":"Hebr. een zoon der eenhoornen."}],"7":[{"catchword":"houwt","tekst":"Of, slaat. Het Hebr. woord wordt eigenlijk van steenhouwen en houthouwen gebruikt."},{"catchword":"vlammen","tekst":"Versta, de vuurvlammen des bliksems, die God bij den donder verspreidt, alsof Hij ze uit de wolken hieuw, dat de vuurstralen overal springen."}],"8":[{"catchword":"beven;","tekst":"Anders, maakt dat zij in smart of arbeid komt; dat is, verschrikt de wilde gedierten der woestijn alzo, dat zij vóór den tijd den arbeid op den hals krijgen."},{"catchword":"Kades","tekst":"Den Joden bekend, waardoor anderen mede verstaan worden; zie Num 33:36-37 , en elders meer."}],"9":[{"catchword":"hinden","tekst":"Die [gelijk te zien is Job 39:4-6 , en de natuurbeschrijvers betuigen] anderzins zwaarlijk werpen. Of, doet de hinden in arbeid komen."},{"catchword":"ontbloot","tekst":"Te weten, van bomen, die door donder, bliksem en storm van bladeren ontbloot, verbrand, uit de aarde gescheurd en nedergeveld worden; idem van dieren, die de donder in de holen jaagt, dat zij in de wouden niet durven omlopen."},{"catchword":"tempel","tekst":"Of, paleis; dat is, tabernakel, gelijk boven, Psa 27:4 , alsof hij zeide: God laat zijne stem door den donder overal horen, maar in zijne gemeente en woning looft Hem een iede van hen, tw eten, der gelovigen, vanwege zijn grote daden in het algemeen, en in het bijzonder van de voren verhaalde; waarheen David de groten nodigd heeft te komen, vs.1."},{"catchword":"Hem","tekst":"Of, spreekt een ieder van [zijne] eer, of glorie. Anders, al wat daarin is; te weten, in den tempel, spreekt [zijne] eer."}],"10":[{"catchword":"heeft","tekst":"Of, zit in den watervloed; dat is ten tijde des watervloeds."},{"catchword":"watervloed;","tekst":"Dit verstaan velen van den zondvloed, waarvan het Hebr. woord in de Heilige Schrift alleenlijk gebruikt wordt, waarover de Heere als president, regent en rechter gezeten heeft; doch men kan het voorts uitstrekken tot alle watervloeden, die God alle tezamen regeert en bestuurt."}],"11":[{"catchword":"vrede","tekst":"Dat is, met allerlei welvaart, bijzonderlijk in Christus, die onze vrede is. Zie Jdg 6:24 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A Psalm of David. Give unto the LORD, ye children of the mighty, [i.e. You great and mighty ones, which are exalted above others here on earth in power and authority. So likewise Psa 89:7.] give unto the LORD honour and strength."}],"2":[{"catchword":null,"tekst":"Give unto the LORD the honour of his name; worship the LORD [Or, bow your selves before the LORD. See Gen.24.on verse 26.] in the glory of the Sanctuary. [i.e. in his Tabernacle, which the great God himself hath adorned with the glorious Testimonials of his grace and Favour. Some are of opinion that David indited this Psalm, as he was fetching home the Ark of the Covenant, with great Joy into Zion 2 Sam.6. to humble the great ones in the world, (who commonly are insolent and haughty) under the mighty hand of this onely true God, that had his habitation in Zion; and to exhort them by his own example, that they should come and honour this God in his habitation with all humility: for which end also he useth and introduceth the description of the Thunder of this God, of which the greatest Potentates on earth must stand in fear and tremble, and ought therefore to acknowledge the author thereof, and to honour him according to his institution. Oth.in, (or, with) Ornament of holiness, etc.]"}],"3":[{"catchword":null,"tekst":"The voice of the LORD [Understand the thunder and the terrible sound thereof, as Psa 18:14. and 2 Samuel 22.14. Job 28:26. and 37.2,4,5. Psa 46:7. and 68,34. Isa 30:30,31.] is upon the Waters, [This may be understood of the uppermost waters, viz. The clouds, and also of the nethermost, whereon the thunder makes a fearful sound. Oth. Above the waters, i.e. makes a stronger and greater sound, then the roaring of the waters. See hereof Eze 1:24. and 43.2. Rev 1:15. and 14.2. and 19.6.] The God of honour [i.e. the honourable, glorious God, as 1 Cor.2.8.] thundereth: the LORD is upon the great [or, the many, mighty] waters."}],"4":[{"catchword":null,"tekst":"The voice of the LORD is with power: the voice of the LORD is with glory."}],"5":[{"catchword":null,"tekst":"The voice of the LORD breaketh the Cedars; yea the LORD breaketh the Cedars of Libanon. [A very famous mountain often mentioned in Scripture, lying on the North-borders of Canaan, renowned for goodly Cedar-trees. See Judges 9.on verse 15.]"}],"6":[{"catchword":null,"tekst":"And he makes them to skip like a calf: the Libanon and Sirion [See Deut.3.9.] like a young Unicorn. [Heb. A son of the Unicorns.]"}],"7":[{"catchword":null,"tekst":"The voice of the LORD heweth forth [Or, striketh, the Hebrew word is properly used of hewing or cutting stone or wood] flames of fire. [Understand the flames of lightening, which God doth spread abroad by the thunder, as if he were striking or hewing them out of the clouds, that the flashes fly and scatter every where about.]"}],"8":[{"catchword":null,"tekst":"The voice of the LORD makes the wilderness to shake: [Oth. Maketh that it comes into pangs, (or labour) i.e. so frighteth the savage Beasts of the Desert, that their travail comes upon them before the time.] The LORD maketh the wilderness of Kades to shake. [by Kades, which was well known to the Jews, he understandeth likewise other wildernesses and desert places. See Num 33:36,37. And elsewhere.]"}],"9":[{"catchword":null,"tekst":"The voice of the LORD maketh the hinds to cast (their) young ones, [Which otherwise (as appears Job 39.verse 4,5,6. And Naturalists also testify) they do cast with much difficult, or maketh the hinds to come in labour] and maketh bare the woods; [viz. Of trees, which by thunder, lightening and tempests are made bare of their leaves, burnt, rooted up out of the ground, and felled down: and again; of beasts, whom the thunder chaseth into Dens and Holes, that they dare not continue their courses and roarings in the woods] but in his Temple every-one-saith (or speaketh) (him) honour, [or Palace, i.e. Tabernacle, as above Psalm 27.ver.4. as if he said, God causeth his voice by thunder to be heard every where, but in his church and habitation, there every one of his, namely of the faithful, doth praise him, by reason of all his great and mighty acts in general, and in particular before rehearsed; whither David also had invited the Great ones to repair, ver.2 Oth. Every one speaketh of (his) honour (or, glory) Oth. All that therein is, viz. In the Temple, speaketh (his) honour.]"}],"10":[{"catchword":null,"tekst":"The LORD hath sat over the flood of Waters: [Or, sitteth in the water-flood, viz. In the time of the flood. This many do understand of the Deluge, or Noah&acirc;&euro;&trade;s-flood, the Hebrew words whereof is no where used but in the holy Scripture; over which the LORD did sit as judge, Governor and President; yet it may well be further extended, to all manner of floods, and inundations, all which are governed and steered by God] yea, the LORD sitteth King in Eternity."}],"11":[{"catchword":null,"tekst":"The LORD shall give strength unto his people: the LORD shall bless his people with peace. [i.e. with all manner of prosperity, especially in Christ, who is our peace. See Jud.6.on verse.24.]"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

(function () {

    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
