","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Voor de koorleider, op de Gittith, een psalm van Asaf.","2":"Zingt vrolijk voor God, onze Sterkte; juicht voor de God van Jakob.","3":"Heft een psalm op, en geeft de trommel; de liefelijke harp met de luit.","4":"Blaast de bazuin in de nieuwe maan, op de bestemde tijd, op onze feestdag.","5":"Want dat is een inzetting in Israël, een recht van de God van Jakob.","6":"Hij heeft het gezet tot een getuigenis in Jozef, toen Hij uittrok tegen Egypteland; waar ik een taal hoorde die ik niet verstond.","7":"Ik heb zijn schouder van de last bevrijd; zijn handen zijn ontslagen van de dragemanden.","8":"In de benauwdheid riep u, en Ik hielp u eruit; Ik antwoordde u uit de schuilplaats van de donder; Ik beproefde u aan het water van Meriba. Sela.","9":"Mijn volk, zei Ik, luister, en Ik zal onder u betuigen, Israël, of u naar Mij zou horen!","10":"Er zal onder u geen uitlandse god zijn, en u zult u voor geen vreemde god neerbuigen.","11":"Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.","12":"Maar Mijn volk heeft Mijn stem niet gehoord; en Israël heeft Mij niet gewild.","13":"Daarom heb Ik hen overgegeven aan het goeddunken van hun hart, zodat zij wandelden in hun eigen raadslagen.","14":"Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld!","15":"In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders.","16":"Zij die de HEERE haten, zouden zich Hem geveinsd onderworpen hebben, maar hun tijd zou eeuwig geweest zijn.","17":"En Hij zou het gevoed hebben met het beste van de tarwe; ja, Ik zou u verzadigd hebben met honing uit de rotsen."},"SV":{"1":"Voor den opperzangmeester, op de Gittith, *een* *psalm* van Asaf.","2":"Zingt vrolijk Gode, onze Sterkte; juicht den God van Jakob.","3":"Heft een psalm op, en geeft de trommel; de liefelijke harp met de luit.","4":"Blaast de bazuin in de nieuwe maan, ter bestemder tijd, op onzen feestdag.","5":"Want dat is een inzetting in Israël, een recht van den God Jakobs.","6":"Hij heeft het gezet tot een getuigenis in Jozef, als Hij uitgetogen was tegen Egypteland; *alwaar* ik gehoord heb een spraak, die ik niet verstond;","7":"Ik heb zijn schouder van den last onttrokken; zijn handen zijn van de potten ontslagen.","8":"In de benauwdheid riept gij, en Ik hielp u uit; Ik antwoordde u uit de schuilplaats des donders; Ik beproefde u aan de wateren van Meriba. Sela.","9":"Mijn volk, *zeide* *Ik* hoor toe, en Ik zal onder u betuigen, Israël, of gij naar Mij hoordet!","10":"Er zal onder u geen uitlands god wezen, en gij zult u voor geen vreemden god nederbuigen.","11":"Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vervullen.","12":"Maar Mijn volk heeft Mijn stem niet gehoord; en Israël heeft Mijner niet gewild.","13":"Dies heb Ik het overgegeven in het goeddunken huns harten, dat zij wandelden in hun raadslagen.","14":"Och, dat Mijn volk naar Mij gehoord had, dat Israël in Mijn wegen gewandeld had!","15":"In kort zou Ik hun vijanden gedempt hebben, en Mijn hand gewend hebben tegen hun wederpartijders.","16":"Die den HEERE haten, zouden zich Hem geveinsdelijk onderworpen hebben, maar hunlieder tijd zou eeuwig geweest zijn.","17":"En Hij zou het gespijsd hebben met het vette der tarwe; ja, Ik zou u verzadigd hebben met honig uit de rotsstenen."},"KJV":{"1":"[[To the chief Musician upon Gittith, *A Psalm* of Asaph.]] Sing aloud unto God our strength: make a joyful noise unto the God of Jacob.","2":"[[To the chief Musician upon Gittith, *A Psalm* of Asaph.]] Sing aloud unto God our strength: make a joyful noise unto the God of Jacob.","3":"Take a psalm, and bring hither the timbrel, the pleasant harp with the psaltery.","4":"Blow up the trumpet in the new moon, in the time appointed, on our solemn feast day.","5":"For this *was* a statute for Israel, *and* a law of the God of Jacob.","6":"This he ordained in Joseph *for* a testimony, when he went out through the land of Egypt: *where* I heard a language *that* I understood","7":"I removed his shoulder from the burden: his hands were delivered from the pots.","8":"Thou calledst in trouble, and I delivered thee; I answered thee in the secret place of thunder: I proved thee at the waters of Meribah. Selah.","9":"Hear, O my people, and I will testify unto thee: O Israel, if thou wilt hearken","10":"There shall no strange god be in thee; neither shalt thou worship any strange god.","11":"I *am* the LORD thy God, which brought thee out of the land of Egypt: open thy mouth wide, and I will fill","12":"But my people would not hearken to my voice; and Israel would","13":"So I gave them up unto their own hearts' lust: *and* they walked in their own counsels.","14":"Oh that my people had hearkened unto me, *and* Israel had walked in my ways!","15":"I should soon have subdued their enemies, and turned my hand against their adversaries.","16":"The haters of the LORD should have submitted themselves unto him: but their time should have endured for ever.","17":"He should have fed them also with the finest of the wheat: and with honey out of the rock should I have satisfied"} Num 28:14 ."},{"catchword":"ter","tekst":"Anders, in de bedekking; te weten, der maan, dat is, als de maan duister is. Sommigen verstaan hier het feest des geklanks, waarvan te zien is Lev 23:24 . Anderen verstaan in het eerste lid de nieuwe manen in het volgende de drie jaarfeesten, waarvan te zien is Deu 16:16 ."}],"6":[{"catchword":"dat is","tekst":"Te weten, de bazuin te blazen."},{"catchword":"in Israël,","tekst":"Dat is, onder het volk van Israël."},{"catchword":"van den","tekst":"Anders, voor den God van Jakob; te weten, dat men Hem een rechten godsdienst doet, zoals Hij dien van zijn volk vereist. Zie van de inzetting der feestdagen Exo 23:17 ; Deu 16:16 ."}],"7":[{"catchword":"het gezet","tekst":"Te weten, het blazen der bazuinen en de onderhouding der ceremoniën en feestdagen."},{"catchword":"tot een","tekst":"Te weten, zijne genade over zijn volk."},{"catchword":"in Jozef,","tekst":"Dat is, onder de nakomelingen van Jozef, bij wien hier in het algemeen alle Israëlieten verstaan worden; gelijk ook Psa 80:2 ."},{"catchword":"hij uitgetogen","tekst":"Te weten, God, die oorlog tegen de Egyptenaren gevoerd heeft, hen aantastende met zijne plagen."},{"catchword":"ik gehoord","tekst":"Dit spreekt Israël, in zulk een zin namelijk, willende te verstaan geven dat het in den persoon hunner vaderen [in wier lenden zij waren] onder een vreemd en onbekend volk in Egypte gewoond had."},{"catchword":"een spraak,","tekst":"Hebr. een lip; gelijk Gen 11:1 . De Hebreeuwse en Egyptische talen waren zo wijd van elkander verscheiden, dat de een den ander niet verstond; te weten, in het begin als zij eerst in Egypte kwamen. Zie Gen 42:23 . Sommigen nemen dit alzo, dat de profeet hier wil zeggen dat Israël te dien tijde nog niet verstond de aanspraak van God, als daartoe nog niet gewend zijnde. Verg. Act 7:25 ."}],"8":[{"catchword":"Ik heb","tekst":"Dit zijn de woorden des Heeren, welken de profeet hier sprekende invoert."},{"catchword":"zijn schouder","tekst":"[Zijne], te weten van Jozef, dat is, der Israëlieten, gelijk vs.6."},{"catchword":"den last","tekst":"Te weten, der dienstbaarheid, waaraan het volk van Israël in Egypte onderworpen was. Zie Exo 1:5 ."},{"catchword":"van de pot","tekst":"Hebr. van de pot. Het schijnt dat de profeet daarop ziet, dat de kinderen Israëls potaarde hebben moeten graven, van welke zij gedwongen waren tichelstenen en potten te maken. Anders, bakken, te weten, waar men den kalk en het gruis in droeg. Anders, manden, korven."},{"catchword":"ontslagen","tekst":"Hebr. doorgegaan, of gepasseerd."}],"9":[{"catchword":"In de","tekst":"Eenigen verstaan dit van hetgeen waar vs.7, van gesproken wordt; anderen van de benauwdheid waarin zij waren bij de Rode zee; Exo 2:23 , en Exo 14:10 , Exo 14:15 ."},{"catchword":"uit de","tekst":"Of, in de schuilplaats, dat is, uit de dikke wolkkolom, in welke God als verborgen zijnde, zijn volk van Israël geleidde, maar de Egyptenaars verschrikte met donder, enz.; Exo 13:21 , en Exo 14:19-20 , Exo 14:24-25 . Zie ook Psa 77:18-19 ."},{"catchword":"Ik beproefde","tekst":"Te weten, door groten dorst, dien Ik u te Rafidim liet lijden."},{"catchword":"Meriba","tekst":"Aldus zijn de wateren te Rafidim naderhand genoemd geworden. Zie Exo 17:1-7 ; Num 20:13 ."},{"catchword":"Sela","tekst":"Zie de aantekening bij Psa 3:3 ."}],"10":[{"catchword":"Mijn volk,","tekst":"Dit zijn de woorden met welke God zijn volk aanspreekt in het geven zijner wet."},{"catchword":"Ik zal","tekst":"Dat is, Ik zal u tot getuige nemen. Of, Ik zal u betuigen en te kennen geven wat mijn wil is en wat gij doen zult."},{"catchword":"of gij","tekst":"Versta hierbij: Hoe gelukkig zoudt gij zijn? Zie Exo 15:26 ; Deu 32:29 ."}],"12":[{"catchword":"doe uw","tekst":"Dat is, spreek en begeer al wat gij wilt, Ik zal het u overvloediglijk geven; te weten indien gij naar mijn wil en wetten leeft. Zie dergelijke belofte Joh 15:7 , en 1Jo 3:22 ."}],"13":[{"catchword":"heeft","tekst":"Dat is, het is tot mij zo ijverig en zo getrouw niet geneigd geweest, als dat wel zou betaamd hebben; hetwelk daaraan gebleken is, als het zich straks, nadat Ik het mijne wetten en geboden gegeven had, een gouden kalf gemaakt heeft en jegens mij opgestaan is; Exo 32:2 , enz., idem Jdg 2:2 , en Jdg 4:1 , en Jdg 6:1 , en Jdg 8:27 , en Jdg 10:6 , en Jdg 13:1 , en Jdg 18:30 ."}],"14":[{"catchword":"in het","tekst":"Zie Deu 29:19 ; Jer 3:17 , en Jer 7:24 , en Jer 9:14 , en Jer 11:8 ; Act 14:16 ."}],"15":[{"catchword":"dat Israël","tekst":"Dat is, de Israëlieten. Daarom volgt er in den Hebr. tekst, gewandeld hadden, in het getal van velen."}],"16":[{"catchword":"gedempt","tekst":"En volgens dien, hun vrede verleend hebben. Verg. 2Sa 7:10 , en 1Ch 17:9 ."},{"catchword":"hand","tekst":"Dat is, straf, plaag. Zie de aantekening bij Job 13:21 ."}],"17":[{"catchword":"zich hem","tekst":"Zie de aantekening bij Deu 33:29 . Zie ook Psa 66:3 ."},{"catchword":"hunlieder","tekst":"Te weten, mijns volks tijd, dat is welvaart, gelukzaligheid. De zin is dat zij een langdurig en goed leven zouden gehad hebben."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"For the chief song-master, upon the Gittith, [See Psalm 8.on verse 1.] (a Psalm) of Asaph. [or, for Asaph, as Psa 80:1.] (81:2) Sing Cheerfully to God our strength: shout to the God of Jacob: [i.e. to that God that made a Covenant with Jacob and his posterity.]"}],"2":[{"catchword":null,"tekst":"For the chief song-master, upon the Gittith, [See Psalm 8.on verse 1.] (a Psalm) of Asaph. [or, for Asaph, as Psa 80:1.] (81:2) Sing Cheerfully to God our strength: shout to the God of Jacob: [i.e. to that God that made a Covenant with Jacob and his posterity.]"}],"3":[{"catchword":null,"tekst":"(3) Lift up a Psalm, and give the drum: the pleasant Harp with the Lute."}],"4":[{"catchword":null,"tekst":"(4) Blow the trumpet, [See the Annot. Levit.23.on verse 24.] in the new Moon, [viz. At that time which God hath instituted to be festival: Num 10:10. and 28.11,14.] at the appointed time on our Feast-day: [others in the covering, viz. Of the Moon, i.e. when the Moon is obscured. Some understand here feast of the founding, whereof see Levit.23.24. others, understand by the former words the new Moon, and by the latter the three yearly feasts, whereof see Deut.16.16.]"}],"5":[{"catchword":null,"tekst":"(5) For that [viz. The blowing of the Trumpet] is an institution in Israel, [i.e. amongst the people of Israel:] a right of the God of Jacob: [others, for the God of Jacob, viz. That he be rightly worshipped, so as he requires the same of his people. See the institution of feast-days Exo 23:17. Deut.16.16.]"}],"6":[{"catchword":null,"tekst":"(6) He hath set it [The blowing of the trumpet, and the keeping of the Ceremonies and feast days] for a testimony [of his grace towards his people] in Joseph, [among the posterity of Joseph: Whereby all the Israelites in general are understood here, as also above, Psal.80.2.] when he was gone forth against the land of Egypt: [He, God namely, that went out to fight against the Egyptians, setting upon them with all his plagues:] (where) I heard [this is Israel speech, in this sence, namely, giving to understand that in the person of their fathers, (in whose loins they were) they have dwelt or sojourned among a strange and unknown people in Egypt;] a speech I understood not. [Heb. A lip, as Gen 11:1.The Hebrew and Egyptian Languages were so far differing that the one was not able to understand the other; namely, in the beginning, when they came first into Egypt. See Gen 42:23. some take this, as if the Prophet meant here, that Israel did not yet understand the speaking of God unto them, as being not yet used to it: compare Act.7.25.]"}],"7":[{"catchword":null,"tekst":"(7) I, [These are words of the LORD, whom the prophet introduceth speaking here] have withdrawn his shoulder, [Josephs namely, i.e. the Israelites, as verse 6.] from the hurthen: [viz. Of bondage, which the people of Israel was subject unto in Egypt. See Exod.1. and 5. Chap.] his hands are rescued [Heb. Past through, gone through] from the pots. [Heb. From the pots: it seemeth the Prophet hath regard to the digging of the children of Israel for pot-earth, (or clay) out of which they were forced to make bricks and pots: others, through, viz. Such where in men use to carry chalk or lime, or morter: Others, mauneds, baskets.]"}],"8":[{"catchword":null,"tekst":"(8) In the distress thou criedst, [Some understand this of the same condition the former verse spake of; Others of the straight wherein they were at the red Sea, Exo 2:23. and 14.10.15.] and I helped you out: I answered you out (or in) of the hiding place of Thunder: [i.e. out of the thick cloudy pillar, wherein God lying hid as it were, conducted his people Israel, but terrified the Egyptians with thunder, &c. Exo 13:21. and 14.19.20,24,25. See also Psa 77:18, 19.] I tried thee, [viz. By great thirst, which I made you to suffer at Raphidim] at the waters of Meriba; [thus the waters of Raphidim were called afterwards: See Exo 17:1,2,3,7. Num 20:13.] Sela! [See the Annot. On Psalm.3. verse 3.]"}],"9":[{"catchword":null,"tekst":"(9) My people (said I,) [These are the words which God addresseth himself withal to his people, in the giving of his Law] hearken, and I will testify among thee [I shall take you for witnesses; or I shall testify and make known unto you, what is my will, and what ye ought to do] Israel, if thou didst hearken to me! [understand hereupon, how happy shouldest thou be? See Exo 15:26. Deut.32.29.]"}],"10":[{"catchword":null,"tekst":"(10) There shall be among thee no out-landish God, and thou shalt bow thee down before no strange God."}],"11":[{"catchword":null,"tekst":"(11) I am the LORD thy God, which hath led thee up out of the land of Egypt: Open thy mouth wide, and I will fill it. [i.e. speak, and ask whatsoever thou desireth, and I will give it there in abundance; if so be namely, that thou live according to my will and laws. See the like promise John 15.v.7. and 1Jn 3:22.]"}],"12":[{"catchword":null,"tekst":"(12) But my people hath not heard my voice: and Israel would none of me: [i.e. were never so zealously or faithfully affected to me, as it was requisite; which was made evident, by their making of a calf presently after the publishing of my Laws and Commandments among them, rebelling against me, Exo 32:2, &c. Jud 2:2. and 4.1. and 6.1. and 8.27. and 10.6. and 18.30.]"}],"13":[{"catchword":null,"tekst":"(13) Therefore I gave it over the arbitration of their heart. [see Deut. 29.19. Jer 3:17. and 7.24. and 9.14. and 11.8. Act 14:16.] that they walked in their (own) counsel."}],"14":[{"catchword":null,"tekst":"(14) O that my people had hearkened to me! That Israel had walked in my ways! [Israel, i.e. the Israelites; therefore the Verb in the Hebrew, is of the plural number.]"}],"15":[{"catchword":null,"tekst":"(15) I should soon have quelled their enemies, [And consequently procured them peace: compare 2 Sam.7.10. and 1 Chron.17.9.] and turned mine hand [i.e. plague, against their adversaries."}],"16":[{"catchword":null,"tekst":"(16) Those that hate the LORD, should fainedly have subjected themselves to him, [See the Annot. Deut.33.on v.29. See likewise Psa 66:3.] but their time should have been forever: [viz. My peoples time, that is, their welfare and happiness: the meaning is, they should have had and enjoyed a long blessed life.]"}],"17":[{"catchword":null,"tekst":"(17) And he, [The Lord, namely] would have fed them [his people, verse 14.] with the fat of the wheat: [the flower of it, or the best and chiefest corn; as Num 18:12. Deut.32.14. Psa 147:14.] yea I would have satisfied thee; [this God speaketh again in his own person] with honey out of the stone rocks: [understand here; which should continually be found in abundance in the clefts of the rocks; being that the Bees in the Land of Canaan, used much to harbour in the rocks: See the Annot. Deut.32.13. Hebr. Out of the rock, in the singular. Spiritually, this Rock doth signify Christ, 1 Cor.10.4. and the honey, that sweetness of speech, and those savoury words, which issue from his mouth, being sweetness to the soul, and health to the bones, Psa 19:11. Pro 16:24. and Cant.4.11.]"}]}}};

// popup positioneren bij een element
function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');

}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;

document.addEventListener('click', e => {

  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
